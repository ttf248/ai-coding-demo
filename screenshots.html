<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta
      name="description"
      content="浏览 AI 编码实验的完整截图集，查看桌面、手机、操作结果及其他页面。"
    />
    <title>实验截图集 · AI Coding Demo</title>
    <link rel="stylesheet" href="assets/site.css" />
    <link rel="stylesheet" href="assets/polish.css" />
    <link rel="stylesheet" href="assets/screenshots.css" />
    <script src="assets/generated/catalog.js" defer></script>
    <script src="assets/core.js" defer></script>
    <script src="assets/screenshots.js" defer></script>
    <script src="assets/analytics.js" defer></script>
  </head>
  <body class="captures-page">
    <a class="skip-link" href="#captures-main">跳到截图</a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html"
          ><span class="brand-mark">AI</span>CODING / DEMO</a
        >
        <nav aria-label="主导航">
          <a href="index.html#projects">实验目录</a
          ><a href="compare.html">模型对比</a
          ><a href="index.html#guides">技术索引</a>
        </nav>
      </div>
    </header>
    <main class="container captures-main" id="captures-main">
      <div class="captures-heading">
        <div>
          <p class="eyebrow">CAPTURE COLLECTION</p>
          <h1 id="captures-title">实验截图集</h1>
          <p id="captures-caption">查看桌面、手机与操作后的实际画面。</p>
        </div>
        <div class="captures-links">
          <a id="captures-topic" hidden>返回主题</a
          ><a id="captures-record" hidden>实验记录</a
          ><a id="captures-compare" class="button" hidden>对比此截图</a>
        </div>
      </div>
      <div class="captures-controls">
        <label class="captures-run-label"
          >实验版本<select id="captures-run">
            <option value="">选择实验</option>
          </select></label
        >
        <label
          >取景<select id="captures-device">
            <option value="all">全部取景</option>
            <option value="desktop">桌面</option>
            <option value="mobile">手机</option>
          </select></label
        >
        <label class="captures-frame-label"
          >截图<select id="captures-frame" disabled>
            <option>选择截图</option>
          </select></label
        >
      </div>
      <div class="captures-toolbar">
        <div>
          <button id="captures-previous" disabled aria-label="上一张截图">
            ← 上一张</button
          ><span id="captures-position">0 张截图</span
          ><button id="captures-next" disabled aria-label="下一张截图">
            下一张 →
          </button>
        </div>
        <div class="captures-tools">
          <div class="segments" aria-label="截图缩放">
            <button data-capture-scale="fit" aria-pressed="true">
              适应宽度</button
            ><button data-capture-scale="actual" aria-pressed="false">
              原始尺寸
            </button>
          </div>
          <a id="captures-original" target="_blank" rel="noopener" hidden
            >打开原图 ↗</a
          ><button id="captures-share" aria-label="分享当前截图">分享</button>
        </div>
      </div>
      <p id="captures-status" class="captures-status" role="status"></p>
      <button id="captures-retry" hidden>重试加载</button>
      <input
        id="captures-share-fallback"
        aria-label="当前截图分享链接"
        readonly
        hidden
      />
      <figure class="captures-figure">
        <figcaption id="captures-image-caption"></figcaption>
        <div
          class="captures-stage"
          id="captures-stage"
          data-scale="fit"
          tabindex="0"
          aria-label="截图区域，可滚动查看长图"
        >
          <img id="captures-image" decoding="async" hidden alt="" />
        </div>
      </figure>
      <p class="captures-note">
        截图保留各自取景与操作状态；切换取景不会重新运行作品。不同截图不代表相同操作时刻。
      </p>
      <noscript
        >截图浏览需要 JavaScript。可从<a href="index.html">实验目录</a
        >查找实验记录和原图。</noscript
      >
    </main>
  </body>
</html>
