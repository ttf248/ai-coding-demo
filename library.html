<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="保存实验与对比备注，继续最近浏览，并查看实验新增、截图采集与评分复核动态。"
    />
    <title>收藏与继续浏览 · AI Coding Demo</title>
    <link rel="stylesheet" href="assets/site.css" />
    <link rel="stylesheet" href="assets/polish.css" />
    <link rel="stylesheet" href="assets/library.css" />
    <script src="assets/generated/catalog.js" defer></script>
    <script src="assets/core.js" defer></script>
    <script src="assets/notebook.js" defer></script>
    <script src="assets/library.js" defer></script>
    <script src="assets/analytics.js" defer></script>
  </head>
  <body class="library-page">
    <a class="skip-link" href="#library-main">跳到收藏</a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">AI CODING / DEMO</a>
        <nav aria-label="主导航">
          <a href="index.html">实验目录</a><a href="model.html">模型概览</a>
        </nav>
      </div>
    </header>
    <main class="container" id="library-main">
      <h1>收藏与继续浏览</h1>
      <p>
        收藏和备注只保存在当前浏览器、当前站点，不跨设备同步。清除浏览器站点数据会移除这些内容。最多保存
        200 项，每条备注 2000 字。
      </p>
      <p id="notebook-status" role="status"></p>
      <section aria-labelledby="saved-title">
        <h2 id="saved-title">我的收藏</h2>
        <div id="saved-items"></div>
      </section>
      <section aria-labelledby="continue-title">
        <h2 id="continue-title">最近浏览</h2>
        <button id="clear-recent">清空最近浏览</button>
        <div id="recent-items"></div>
      </section>
      <section aria-labelledby="updates-title">
        <h2 id="updates-title">档案更新</h2>
        <p>
          按已登记日期展示，实验新增采用归档日期；截图采集和评分复核分别记录，不表示重新运行了模型。
        </p>
        <label
          >更新类型<select id="update-kind">
            <option value="all">全部更新</option>
            <option value="added">实验新增</option>
            <option value="capture">截图采集 / 补拍</option>
            <option value="review">评分复核</option>
          </select></label
        >
        <div id="update-items"></div>
        <button id="more-updates" hidden>加载更多更新</button>
      </section>
    </main>
    <noscript
      >本地收藏需要 JavaScript，请查看
      <a href="Readme.md">项目索引</a>。</noscript
    >
  </body>
</html>
