<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>群岛手记 · 奇幻地图工坊</title>

*{box-sizing:border-box}body{margin:0;background:#ece5d6;color:#433d30;font:14px system-ui}main{max-width:1440px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px}h1{font:32px Georgia,serif;margin:6px 0}small{letter-spacing:3px;color:#82745a}button,input{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #c7bca4;background:#faf6ed;border-radius:6px;padding:10px 14px}button:hover{background:#e3d9c2}.primary,button.active{background:#55644c;color:#fff;border-color:#55644c}.layout{display:grid;grid-template-columns:240px 1fr;gap:22px}aside{background:#f8f3e8;padding:20px;border:1px solid #d4c9b4;border-radius:10px}h2{font-size:13px;letter-spacing:2px;margin:0 0 16px}label{display:block;margin:18px 0 8px;font-size:13px}input[type=text]{width:100%;padding:10px;border:1px solid #c9bea8;background:#fffaf0;border-radius:5px}input[type=range]{width:100%;accent-color:#647b58}.tools{display:flex;gap:6px;flex-wrap:wrap}.tools button{flex:1;padding:10px 6px}.map{min-width:0;position:relative;background:#b3cbca;border:7px solid #f9f3e5;box-shadow:0 7px 25px #55432120;border-radius:5px;overflow:hidden}canvas{width:100%;aspect-ratio:11/8.5;display:block;touch-action:none;cursor:crosshair}.map-title{position:absolute;top:24px;left:26px;pointer-events:none;max-width:70%;font:italic 25px Georgia,serif;color:#314b47}.compass{position:absolute;right:20px;top:22px;color:#43554a;pointer-events:none;font:25px Georgia;text-align:center}.map-controls{position:absolute;right:15px;bottom:15px;display:flex;gap:5px}.map-controls button{font-size:18px}.legend{display:flex;flex-wrap:wrap;gap:14px;margin:18px 0;font-size:12px}.legend i{width:12px;height:12px;display:inline-block;margin-right:5px;border-radius:2px}#status{line-height:1.8;color:#6b644f;font-size:12px}footer{padding-top:18px;color:#82745a;font-size:12px}@media(max-width:750px){main{padding:14px}h1{font-size:26px}.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:12px}aside>div{min-width:0}label{margin-top:8px}.map-title{font-size:18px;top:14px;left:14px}.compass{font-size:18px}header button{padding:9px}canvas{aspect-ratio:1}.map{border-width:4px}}</style>
<main><header><div><small>THE CARTOGRAPHER'S DESK</small><h1>群岛手记</h1><span style="color:#82745a">种下一片陆地，描绘未知之境。</span></div><button id="export" class="primary">↓ 导出 PNG</button></header><div class="layout"><aside><div><h2>01 / 塑造世界</h2><label for="seed">世界种子</label><input id="seed" type="text" value="暮风群岛-042" maxlength="100"><button id="generate" class="primary" style="width:100%;margin-top:9px">重新生成</button><label for="sea">海平面 <output id="seaVal"></output></label><input id="sea" type="range" min="25" max="65" value="44"><label for="rough">地形粗糙度 <output id="roughVal"></output></label><input id="rough" type="range" min="10" max="85" value="48"></div><div><h2>02 / 修改地形</h2><div class="tools"><button data-tool="pan" class="active">✥ 平移</button><button data-tool="raise">＋ 升高</button><button data-tool="lower">− 降低</button></div><label for="radius">画笔半径</label><input id="radius" type="range" min="3" max="25" value="10"><label><input id="labels" type="checkbox" checked> 城镇标签</label><button id="reset" style="width:100%;margin-top:10px">恢复默认世界</button><p id="status" role="status"></p></div></aside><section><div class="map"><canvas id="map" width="1100" height="850" aria-label="可编辑、平移和缩放的岛屿地图"></canvas><div class="map-title">The Isles of Dusk / 暮风群岛</div><div class="compass">N<br>✧</div><div class="map-controls"><button id="out" aria-label="缩小">−</button><button id="fit">适应</button><button id="in" aria-label="放大">＋</button></div></div><div class="legend"><span><i style="background:#7da6ac"></i>海洋</span><span><i style="background:#e6d6a5"></i>海岸</span><span><i style="background:#bac49a"></i>平原</span><span><i style="background:#6f8c6a"></i>森林</span><span><i style="background:#a79d88"></i>山脉</span><span><i style="background:#7ab4be"></i>河流 / 湖泊</span></div><div style="font-size:12px;line-height:1.8">拖动平移或涂绘，滚轮 / 双指缩放。海平面会保留已编辑地形；粗糙度与重新生成会重建世界。河流按填洼后的水面势能下降，洼地显示为内陆湖泊。</div></section></div><footer>SEEDED TERRAIN / 所有地形、河流与装饰均由代码生成 · 完全离线</footer></main>
<script>
const $=s=>document.querySelector(s),N=160,S=960,canvas=$('#map'),ctx=canvas.getContext('2d'),paper=document.createElement('canvas');paper.width=paper.height=S;const pctx=paper.getContext('2d');let heights=new Float32Array(N*N),filled,parent,flow,tool='pan',zoom=1,pan={x:0,y:0},pointers=new Map(),dirty=false,seedNum=1,towns=[];
function hashSeed(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0}
function rand(x,y){let v=Math.imul(x+seedNum,374761393)+Math.imul(y,668265263);v=Math.imul(v^(v>>>13),1274126177);return ((v^(v>>>16))>>>0)/4294967295}
const smooth=t=>t*t*(3-2*t),mix=(a,b,t)=>a+(b-a)*t;
function noise(x,y){const ix=Math.floor(x),iy=Math.floor(y),u=smooth(x-ix),v=smooth(y-iy);return mix(mix(rand(ix,iy),rand(ix+1,iy),u),mix(rand(ix,iy+1),rand(ix+1,iy+1),u),v)}
function generate(){seedNum=hashSeed($('#seed').value);const rough=Number($('#rough').value)/100;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const nx=(x/N-.5)*2,ny=(y/N-.5)*2;let f=0,a=.52;for(let k=0;k<5;k++){const scale=3*2**k;f+=noise(x/N*scale,y/N*scale)*a;a*=rough}const radial=Math.sqrt(nx*nx+ny*ny);heights[y*N+x]=Math.max(0,Math.min(1,.33+f*.85-radial*.48))}hydrology();render();$('#status').textContent='世界已生成。同种子、海平面和粗糙度会得到相同结果。'}
function hydrology(){const n=N*N,seen=new Uint8Array(n),heap=[],order=[];filled=new Float32Array(heights);parent=new Int32Array(n).fill(-1);flow=new Float32Array(n).fill(1);const push=i=>{heap.push(i);let j=heap.length-1;while(j){const p=(j-1)>>1;if(filled[heap[p]]<=filled[heap[j]])break;[heap[p],heap[j]]=[heap[j],heap[p]];j=p}},pop=()=>{const top=heap[0],tail=heap.pop();if(heap.length){heap[0]=tail;let j=0;while(true){let k=j,l=j*2+1,r=l+1;if(l<heap.length&&filled[heap[l]]<filled[heap[k]])k=l;if(r<heap.length&&filled[heap[r]]<filled[heap[k]])k=r;if(k===j)break;[heap[k],heap[j]]=[heap[j],heap[k]];j=k}}return top};for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(x===0||y===0||x===N-1||y===N-1){const i=y*N+x;seen[i]=1;push(i)}while(heap.length){const i=pop();order.push(i);const x=i%N,y=i/N|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+dx,yy=y+dy;if(xx<0||xx>=N||yy<0||yy>=N)continue;const j=yy*N+xx;if(seen[j])continue;seen[j]=1;parent[j]=i;filled[j]=Math.max(heights[j],filled[i]);push(j)}}for(let k=order.length-1;k>=0;k--){const i=order[k];if(parent[i]>=0)flow[parent[i]]+=flow[i]}towns=[];const sea=Number($('#sea').value)/100;for(let i=0;i<n;i++){if(heights[i]>sea+.025&&heights[i]<sea+.12&&flow[i]>35&&towns.every(t=>Math.hypot(t.i%N-i%N,(t.i/N|0)-(i/N|0))>24)&&rand(i,4)>.8){towns.push({i,name:['风息港','松林镇','白石堡','鹿鸣谷','雾桥','银湾'][towns.length]});if(towns.length===6)break}}}
function color(h,x,y){const sea=Number($('#sea').value)/100;if(h<sea){const k=Math.max(0,Math.min(1,(sea-h)/.3));return [mix(152,87,k),mix(188,136,k),mix(184,152,k)]}if(filled[y*N+x]-h>.009)return [123,175,183];const above=h-sea;let c=above<.025?[227,214,170]:above<.13?[184,194,148]:above<.23?[126,151,111]:above<.33?[160,153,127]:[205,198,176];const i=y*N+x,slope=(heights[i-1]??h)-(heights[i+1]??h)+h-(heights[i+N]??h),shade=1+slope*3+(rand(x,y)-.5)*.06;return c.map(v=>Math.max(0,Math.min(255,v*shade)))}
function render(){const sea=Number($('#sea').value)/100;$('#seaVal').textContent=sea.toFixed(2);$('#roughVal').textContent=$('#rough').value+'%';const tile=document.createElement('canvas');tile.width=tile.height=N;const t=tile.getContext('2d'),data=t.createImageData(N,N);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x,c=color(heights[i],x,y);data.data.set([...c,255],i*4)}t.putImageData(data,0,0);pctx.imageSmoothingEnabled=true;pctx.drawImage(tile,0,0,S,S);const d=S/N;pctx.lineCap='round';for(let i=0;i<N*N;i++){const j=parent[i];if(j<0||heights[i]<sea||flow[i]<75)continue;pctx.strokeStyle='#639fac';pctx.lineWidth=Math.min(4,1+Math.sqrt(flow[i])*.045);pctx.beginPath();pctx.moveTo((i%N+.5)*d,((i/N|0)+.5)*d);pctx.lineTo((j%N+.5)*d,((j/N|0)+.5)*d);pctx.stroke()}
for(let y=3;y<N-3;y+=3)for(let x=3;x<N-3;x+=3){const h=heights[y*N+x],above=h-sea;if(above>.12&&rand(x+9,y+2)>.48){const px=x*d,py=y*d;pctx.strokeStyle=above>.25?'#706e5b':'#4b7254';pctx.fillStyle=above>.25?'#c4bc9d':'#789268';pctx.lineWidth=1;pctx.beginPath();if(above>.25){pctx.moveTo(px-7,py+4);pctx.lineTo(px,py-9);pctx.lineTo(px+8,py+4)}else{pctx.moveTo(px-4,py+2);pctx.lineTo(px,py-8);pctx.lineTo(px+4,py+2);pctx.closePath()}pctx.fill();pctx.stroke()}}
if($('#labels').checked)for(const t of towns){const x=(t.i%N+.5)*d,y=((t.i/N|0)+.5)*d;pctx.fillStyle='#4e4434';pctx.beginPath();pctx.arc(x,y,4,0,Math.PI*2);pctx.fill();pctx.font='16px Georgia,serif';pctx.lineWidth=4;pctx.strokeStyle='#efe5c8';pctx.strokeText(t.name,x+8,y+5);pctx.fillText(t.name,x+8,y+5)}pctx.strokeStyle='#566b6340';pctx.strokeRect(8,8,S-16,S-16);draw()}
function scale(){return Math.min(canvas.width/S,canvas.height/S)*zoom}
function draw(){ctx.fillStyle='#b1cccb';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.save();ctx.translate(canvas.width/2+pan.x,canvas.height/2+pan.y);ctx.scale(scale(),scale());ctx.drawImage(paper,-S/2,-S/2);ctx.restore()}
function screen(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*canvas.width,y:(e.clientY-r.top)/r.height*canvas.height}}
function world(p){return {x:(p.x-canvas.width/2-pan.x)/scale()+S/2,y:(p.y-canvas.height/2-pan.y)/scale()+S/2}}
function brush(p){const q=world(p),cx=q.x/S*N,cy=q.y/S*N,r=Number($('#radius').value);if(cx<0||cy<0||cx>=N||cy>=N)return;for(let y=Math.max(0,Math.floor(cy-r));y<Math.min(N,cy+r);y++)for(let x=Math.max(0,Math.floor(cx-r));x<Math.min(N,cx+r);x++){const d=Math.hypot(x-cx,y-cy)/r;if(d<1)heights[y*N+x]=Math.max(0,Math.min(1,heights[y*N+x]+(tool==='raise'?1:-1)*.035*(1-d)))}dirty=true}
function zoomAt(factor,p={x:canvas.width/2,y:canvas.height/2}){const before=world(p);zoom=Math.min(6,Math.max(.4,zoom*factor));pan.x=p.x-canvas.width/2-(before.x-S/2)*scale();pan.y=p.y-canvas.height/2-(before.y-S/2)*scale();draw()}
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);const p=screen(e);pointers.set(e.pointerId,p);if(tool!=='pan'&&pointers.size===1)brush(p)};canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;const p=screen(e),old=pointers.get(e.pointerId);if(pointers.size===2){const other=[...pointers.entries()].find(([id])=>id!==e.pointerId)[1],a=Math.hypot(old.x-other.x,old.y-other.y),b=Math.hypot(p.x-other.x,p.y-other.y);if(a>1)zoomAt(b/a,{x:(p.x+other.x)/2,y:(p.y+other.y)/2})}else if(tool==='pan'){pan.x+=p.x-old.x;pan.y+=p.y-old.y;draw()}else brush(p);pointers.set(e.pointerId,p)};canvas.onpointerup=canvas.onpointercancel=e=>pointers.delete(e.pointerId);canvas.onwheel=e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*.001),screen(e))};
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});$('#generate').onclick=generate;$('#rough').oninput=generate;$('#sea').oninput=()=>{hydrology();render()};$('#labels').onchange=render;$('#in').onclick=()=>zoomAt(1.25);$('#out').onclick=()=>zoomAt(.8);$('#fit').onclick=()=>{zoom=1;pan={x:0,y:0};draw()};$('#reset').onclick=()=>{$('#seed').value='暮风群岛-042';$('#sea').value=44;$('#rough').value=48;$('#labels').checked=true;zoom=1;pan={x:0,y:0};generate()};$('#export').onclick=()=>{const a=document.createElement('a');a.download='fantasy-isles.png';a.href=paper.toDataURL('image/png');a.click()};function frame(){if(dirty){dirty=false;hydrology();render();$('#status').textContent='地形已修改，海岸、湖泊与河流已重新计算。'}requestAnimationFrame(frame)}generate();requestAnimationFrame(frame);window.lab={generate,hydrology,brush,world,zoomAt,get state(){return {heights,filled,parent,flow,zoom,pan,towns}}};
</script></html>
