<!doctype html>
<html lang="zh-CN"><head>
<script src="../../../../assets/analytics.js" defer></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>潮汐群岛</title><style>
:root{--ink:#3d392d;--paper:#f2eee2;--panel:#fffcf2;--line:#d7cfbb;--accent:#756031;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,"Segoe UI","Microsoft YaHei",sans-serif}main,header>div{width:min(1344px,94%);margin:auto}header{border-bottom:1px solid var(--line)}header>div,.row,.bar,.readout{display:flex;align-items:center;gap:10px}header>div{height:57px;justify-content:space-between}header strong{display:flex;align-items:center;gap:9px;font-size:15px}.mark{width:20px;height:20px;background:var(--accent);border-radius:4px;display:inline-grid;place-items:center;color:var(--paper);font:bold 14px monospace}.mono,.eyebrow,output,.metrics b{font-family:"IBM Plex Mono",Consolas,monospace;font-variant-numeric:tabular-nums}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:700}.intro{display:flex;align-items:end;justify-content:space-between;gap:18px;padding:30px 0 23px}.intro h1{font-size:clamp(31px,4vw,52px);line-height:1.14;letter-spacing:-.045em;margin:5px 0 8px}.intro p,.hint{color:color-mix(in srgb,var(--ink) 70%,var(--paper));margin:0;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 283px;gap:16px;align-items:start}.stage,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;min-width:0}.panel{padding:19px}.panel h2,.bar h2{font-size:15px;letter-spacing:.01em;margin:0}.panel h3{font-size:13px;margin:16px 0 8px}.panel section+section{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.bar{padding:12px 16px;justify-content:space-between;border-bottom:1px solid var(--line);flex-wrap:wrap}.bar small{opacity:.72}.bar.foot{border-bottom:0;border-top:1px solid var(--line)}.row{flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}button,select,input{font:inherit;color:inherit}button,select,input[type=text],input[type=number]{border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:8px 11px;font-size:13px;min-height:37px}button{cursor:pointer;font-weight:600}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.45;cursor:default}button.primary,button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}.field{display:grid;gap:5px;margin:12px 0}.field>span{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600}input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0}.metrics{padding:12px 17px;display:flex;gap:23px;flex-wrap:wrap}.metrics span{font-size:12px}.metrics b{display:block;font-size:21px}.legend{display:flex;flex-wrap:wrap;gap:6px 15px;font-size:12px}.key{display:inline-block;vertical-align:middle;width:10px;height:10px;margin-right:5px;border-radius:2px}.work{width:100%;display:block;touch-action:none}.below{margin:14px 0 30px}select,input{max-width:100%}dialog{color:var(--ink)}@media(max-width:840px){.layout{grid-template-columns:minmax(0,1fr) 236px}.panel{padding:13px}}@media(max-width:720px){main,header>div{width:min(94%,560px)}.layout{grid-template-columns:minmax(0,1fr)}.intro{padding:17px 0 15px;align-items:start;flex-wrap:wrap}.intro h1{font-size:34px}.panel{padding:16px}.metrics{gap:14px}.bar{padding:9px 12px}header>div{height:46px}}h1,.bar h2{font-family:Georgia,"Songti SC",SimSun,serif}#map{aspect-ratio:960/624;background:#aac7bf}#tools{margin:10px 0}#legend{align-items:center}.mark{border-radius:50%}
</style></head><body><header><div><strong><i class="mark" aria-hidden="true">∿</i>海图绘制所</strong><span class="eyebrow">ISLAND ATLAS</span></div></header><main><div class="intro"><div><h1>潮汐群岛</h1><p>由种子铺开岛屿，再用画笔改写山川与海岸。</p></div><div class="row"><button id="fit">全图</button><button id="save" class="primary">导出 PNG ↓</button></div></div><div class="layout"><article class="stage"><div class="bar"><h2>群岛地形图</h2><small class="mono" id="sheet"></small></div><canvas id="map" class="work" width="960" height="624" aria-label="可平移、缩放和修改地形的群岛地图"></canvas><div class="bar foot"><div class="legend" id="legend"></div><small id="status" role="status"></small></div></article><aside class="panel"><section><h2>生成参数</h2><label class="field"><span>地图种子</span><input id="seed" type="text" maxlength="80" value="Amber-17"></label><label class="field"><span>海平面<output id="seaOut"></output></span><input type="range" id="sea" min="28" max="68" value="46"></label><label class="field"><span>地形粗糙度<output id="roughOut"></output></span><input type="range" id="rough" min="10" max="95" value="57"></label><div class="row"><button id="generate" class="primary">重新生成</button><button id="reset">重置</button></div></section><section><h2>制图工具</h2><div class="row" id="tools"><button data-tool="pan">平移</button><button data-tool="up">升高</button><button data-tool="down">降低</button></div><label class="field"><span>画笔半径<output id="brushOut"></output></span><input id="brush" type="range" min="3" max="20" value="9"></label><div class="row"><button id="minus" aria-label="缩小">−</button><output class="mono" id="zoom"></output><button id="plus" aria-label="放大">＋</button></div><p><label><input id="labels" type="checkbox" checked> 显示城镇标签</label></p></section><section><p class="hint">拖动地图平移或绘制，滚轮围绕指针缩放。河流沿相邻地块向低处汇集，洼地形成内陆湖。</p></section></aside></div><div class="below"></div></main><script>
"use strict";
const $=id=>document.getElementById(id);
const C=192,R=125,W=960,H=624,dx=W/(C-1),dy=H/(R-1),map=$('map'),view=map.getContext('2d');
const atlas=document.createElement('canvas');atlas.width=W;atlas.height=H;const ink=atlas.getContext('2d');
const terrain=new Float32Array(C*R),symbols=[];let seed=1,sea=.46,tool='pan',zoom=1,ox=0,oy=0,drag=null,scheduled=false;
function hash(s){let n=2166136261;for(const c of s)n=Math.imul(n^c.codePointAt(0),16777619);return n>>>0;}
function random(x,y,k=0){let n=seed^Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(k,144269);n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967296;}
const mix=(a,b,t)=>a+(b-a)*t, clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),smooth=x=>x*x*(3-2*x);
function noise(x,y,k=0){const a=Math.floor(x),b=Math.floor(y),u=smooth(x-a),v=smooth(y-b);return mix(mix(random(a,b,k),random(a+1,b,k),u),mix(random(a,b+1,k),random(a+1,b+1,k),u),v);}
function generate(){
  if(!$('seed').value.trim()){$('status').textContent='请输入地图种子';$('seed').focus();return;}
  seed=hash($('seed').value);const rough=Number($('rough').value)/100;
  const peaks=Array.from({length:7},(_,i)=>[.20+random(i,0)*.60,.18+random(i,1)*.64,.12+random(i,2)*.14,.13+random(i,3)*.17]);
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){
    const u=x/(C-1),v=y/(R-1),a=u+(noise(u*4,v*4,3)-.5)*.18,b=v+(noise(u*4,v*4,4)-.5)*.18;
    let mass=0;for(const [px,py,sx,sy] of peaks)mass=Math.max(mass,Math.exp(-.8*((a-px)/sx)**2-.8*((b-py)/sy)**2));
    const fbm=(noise(u*5,v*4,8)-.5)*.30+(noise(u*11,v*9,9)-.5)*.19+(noise(u*24,v*18,10)-.5)*.115+(noise(u*53,v*40,11)-.5)*.065;
    const edge=Math.min(1,Math.min(u,1-u,v,1-v)*10);
    terrain[y*C+x]=clamp(.17+mass*.65+fbm*(.56+rough*1.4)-(1-edge)*.33,0,1);
  }
  $('sheet').textContent=$('seed').value;home();rebuild();
}
const colors={water:'#9ab9b1',coast:'#e4ce98',plain:'#c3cb98',forest:'#829d79',hill:'#a99475'};
function rebuild(){
  ink.lineCap='round';ink.lineJoin='round';
  scheduled=false;sea=+$('sea').value/100;const raster=document.createElement('canvas');raster.width=C;raster.height=R;
  const rc=raster.getContext('2d'),im=rc.createImageData(C,R);
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){
    const i=y*C+x,h=terrain[i],rel=h-sea,slope=terrain[Math.max(0,y-1)*C+Math.max(0,x-1)]-terrain[Math.min(R-1,y+1)*C+Math.min(C-1,x+1)];
    const stops=rel<-.09?[130,168,166]:rel<0?[158,191,179]:rel<.034?[225,207,161]:rel<.15?[197,202,155]:rel<.245?[155,178,136]:rel<.315?[142,159,122]:[182,169,139];
    const shade=clamp(slope*160,-26,30)+(random(x,y,7)-.5)*7+Math.min(0,rel+.1)*45;
    for(let k=0;k<3;k++)im.data[4*i+k]=stops[k]+shade;im.data[4*i+3]=255;
  }
  rc.putImageData(im,0,0);ink.drawImage(raster,0,0,W,H);
  function contour(level,stroke,width){
    ink.strokeStyle=stroke;ink.lineWidth=width;ink.beginPath();
    for(let y=0;y<R-1;y++)for(let x=0;x<C-1;x++){
      const i=y*C+x,h=[terrain[i],terrain[i+1],terrain[i+C+1],terrain[i+C]],pts=[];
      for(let k=0;k<4;k++){const n=(k+1)%4;if((h[k]<level)===(h[n]<level))continue;
        const q=(level-h[k])/(h[n]-h[k]),xx=[0,1,1,0],yy=[0,0,1,1];pts.push([(x+mix(xx[k],xx[n],q))*dx,(y+mix(yy[k],yy[n],q))*dy]);}
      for(let k=1;k<pts.length;k+=2){ink.moveTo(...pts[k-1]);ink.lineTo(...pts[k]);}
    }ink.stroke();
  }
  contour(sea-.045,'rgba(78,120,116,.48)',.9);contour(sea,'#586e59',1.8);
  for(let v=.075;v<.47;v+=.07)contour(sea+v,'rgba(99,94,63,.32)',.8);
  // Route runoff over a strict downhill graph. Summing upstream cells makes tributaries join.
  const order=Array.from(terrain.keys()).sort((a,b)=>terrain[b]-terrain[a]),next=new Int32Array(terrain.length).fill(-1),flow=new Float32Array(terrain.length).fill(1);
  for(const i of order){if(terrain[i]<sea)continue;const x=i%C,y=Math.floor(i/C);let slope=0;
    for(let v=-1;v<=1;v++)for(let u=-1;u<=1;u++){if((!u&&!v)||x+u<0||x+u>=C||y+v<0||y+v>=R)continue;const j=i+v*C+u,s=(terrain[i]-terrain[j])/Math.hypot(u,v);if(s>slope){slope=s;next[i]=j;}}
    if(next[i]>=0)flow[next[i]]+=flow[i];
  }
  ink.lineCap='round';ink.lineJoin='round';
  for(const i of order){if(flow[i]<36||terrain[i]<sea)continue;const x=(i%C)*dx,y=Math.floor(i/C)*dy,j=next[i];
    if(j<0){ink.fillStyle='#81aaa4';ink.beginPath();ink.ellipse(x,y,Math.min(8,Math.sqrt(flow[i])/2),2.6,.2,0,Math.PI*2);ink.fill();continue;}
    ink.strokeStyle='#668f8b';ink.lineWidth=Math.min(3.6,.65+Math.sqrt(flow[i])*.085);ink.beginPath();ink.moveTo(x,y);ink.lineTo((j%C)*dx,Math.floor(j/C)*dy);ink.stroke();
  }
  symbols.length=0;
  for(let y=3;y<R-3;y+=3)for(let x=3;x<C-3;x+=3){
    const xx=x+Math.floor(random(x,y)*3),yy=y+Math.floor(random(x,y,2)*3),i=yy*C+xx,h=terrain[i]-sea,s=random(x,y,5),a=xx*dx,b=yy*dy;
    if(h>.295&&s>.26){const size=5+s*10;ink.fillStyle='#c9bb97';ink.strokeStyle='#706b52';ink.lineWidth=.95;
      ink.beginPath();ink.moveTo(a-size,b+4);ink.lineTo(a,b-size);ink.lineTo(a+size*.93,b+4);ink.stroke();ink.fill();ink.beginPath();ink.moveTo(a,b-size);ink.lineTo(a-1,b-2);ink.lineTo(a+size*.42,b+1);ink.stroke();}
    else if(h>.12&&h<.28&&noise(xx*.085,yy*.085,16)>.47&&s>.25){ink.fillStyle='#648768';ink.beginPath();ink.moveTo(a-2.8,b+2);ink.lineTo(a,b-5-s*3);ink.lineTo(a+2.8,b+2);ink.fill();ink.fillRect(a-.5,b+1,1,2);}
    else if(h>.045&&h<.15&&s>.70&&flow[i]<28)symbols.push([a,b,s]);
    else if(h<-.07&&s>.94){ink.strokeStyle='#b5cec0';ink.beginPath();ink.moveTo(a-4,b);ink.quadraticCurveTo(a,b-2,a+5,b);ink.stroke();}
  }
  if($('labels').checked){
    const towns=[],names=['鸥栖港','石楠镇','旧渡','松湾','风鸣谷','白岩庄','西岬'];
    for(const [a,b] of symbols.sort((a,b)=>b[2]-a[2])){if(a<42||a>W-63||b<24||b>H-24||towns.some(([x,y])=>Math.hypot(a-x,b-y)<112))continue;
      ink.fillStyle='#5b4936';ink.beginPath();ink.arc(a,b,3.5,0,7);ink.fill();ink.font='bold 15px SimSun,serif';ink.lineWidth=3;ink.strokeStyle='#f1e6c7';ink.strokeText(names[towns.length],a+7,b+5);ink.fillText(names[towns.length],a+7,b+5);towns.push([a,b]);if(towns.length===names.length)break;}
  }
  const land=terrain.reduce((n,h)=>n+(h>=sea),0);$('status').textContent='陆地 '+Math.round(100*land/terrain.length)+'%';show();
}
function queue(){if(!scheduled){scheduled=true;requestAnimationFrame(rebuild);}}
function home(){zoom=1;ox=oy=0;show();}
function show(){
  ox=clamp(ox,W*(1-zoom),0);oy=clamp(oy,H*(1-zoom),0);
  view.setTransform(zoom,0,0,zoom,ox,oy);view.drawImage(atlas,0,0);view.resetTransform();
  view.strokeStyle='rgba(57,66,50,.55)';view.lineWidth=1;view.strokeRect(10,10,W-20,H-20);
  view.save();view.translate(52,58);view.fillStyle='#4e5647';view.font='bold 14px Georgia';view.textAlign='center';view.fillText('N',0,-21);
  view.beginPath();view.moveTo(0,-16);view.lineTo(7,13);view.lineTo(0,8);view.lineTo(-7,13);view.closePath();view.stroke();view.beginPath();view.moveTo(0,-16);view.lineTo(0,8);view.lineTo(-7,13);view.fill();view.restore();
  $('zoom').textContent=Math.round(zoom*100)+'%';
}
function locate(e){const r=map.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
function scale(factor,x=W/2,y=H/2){const nz=clamp(zoom*factor,1,5);ox=x-(x-ox)*nz/zoom;oy=y-(y-oy)*nz/zoom;zoom=nz;show();}
function brush(x,y){const cx=(x-ox)/zoom/dx,cy=(y-oy)/zoom/dy,r=+$('brush').value;
  for(let b=Math.max(0,Math.floor(cy-r));b<=Math.min(R-1,cy+r);b++)for(let a=Math.max(0,Math.floor(cx-r));a<=Math.min(C-1,cx+r);a++){
    const d=Math.hypot(a-cx,b-cy)/r;if(d<1)terrain[b*C+a]=clamp(terrain[b*C+a]+(tool==='up'?.085:-.085)*(1-d*d)**2,0,1);
  }queue();
}
map.onpointerdown=e=>{drag=locate(e);map.setPointerCapture(e.pointerId);if(tool!=='pan')brush(...drag);};
map.onpointermove=e=>{if(!drag)return;const p=locate(e);if(tool==='pan'){ox+=p[0]-drag[0];oy+=p[1]-drag[1];show();}else brush(...p);drag=p;};
map.onpointerup=map.onpointercancel=()=>drag=null;map.onwheel=e=>{e.preventDefault();scale(Math.exp(-e.deltaY*.0015),...locate(e));};
function choose(t){tool=t;map.style.cursor=t==='pan'?'grab':'crosshair';for(const b of $('tools').children)b.setAttribute('aria-pressed',b.dataset.tool===t);}
$('tools').onclick=e=>{if(e.target.dataset.tool)choose(e.target.dataset.tool);};$('plus').onclick=()=>scale(1.35);$('minus').onclick=()=>scale(1/1.35);$('fit').onclick=home;
function outputs(){for(const id of ['rough','sea','brush'])$(id+'Out').value=$(id).value+(id==='brush'?' 格':'%');}
$('rough').oninput=()=>{outputs();generate();};$('sea').oninput=()=>{outputs();queue();};$('brush').oninput=outputs;$('generate').onclick=generate;$('labels').onchange=queue;
$('reset').onclick=()=>{$('seed').value='Amber-17';$('sea').value=46;$('rough').value=57;$('brush').value=9;$('labels').checked=true;choose('pan');outputs();generate();};
$('save').onclick=()=>{if(scheduled)rebuild();map.toBlob(blob=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='群岛地图.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);});};
$('legend').innerHTML=Object.entries(colors).map(([k,c],i)=>'<span><i class="key" style="background:'+c+'"></i>'+['海洋','海岸','平原','森林','山脉'][i]+'</span>').join('');
choose('pan');outputs();generate();
</script></body></html>
