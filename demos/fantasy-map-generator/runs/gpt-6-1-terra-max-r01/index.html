<!doctype html><html lang="zh-CN"><head><script src="../../../../assets/analytics.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>群岛绘图室</title><style>
*{box-sizing:border-box}body{margin:0;color:#3f3529;background:#e8e1d3;font:15px/1.55 Georgia,'Microsoft YaHei',serif}main{max-width:1360px;margin:auto;padding:25px}header{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px;gap:12px}h1{font-size:clamp(28px,5vw,45px);margin:0;letter-spacing:.03em}header p{margin:0;color:#89765e}.overline{font:700 11px system-ui;letter-spacing:.2em;color:#a0784a}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px}.panel{background:#f9f5eb;border:1px solid #d8cdb9;box-shadow:0 8px 24px #756b4b12;border-radius:12px;padding:18px}.panel h2{font-size:13px;letter-spacing:.1em;margin:0 0 10px;color:#8a7354}.group+.group{border-top:1px solid #e1d8c7;margin-top:16px;padding-top:16px}label{display:block;font-size:13px;margin:10px 0 3px}input[type=text]{width:100%;padding:9px;border:1px solid #cbbda8;border-radius:6px;background:#fffdf8;color:#463b2d}input[type=range]{width:100%;accent-color:#9c6f41}button{font:inherit;border:1px solid #c7b69b;background:#fffaf0;color:#5e4932;border-radius:6px;padding:7px 10px;cursor:pointer}button:hover,button.active{background:#865f3b;color:white;border-color:#865f3b}.primary{width:100%;background:#705137;color:#fff;border-color:#705137;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.help{font-size:12px;color:#83745f;margin:8px 0}.map{padding:10px;min-width:0}canvas{display:block;width:100%;height:auto;background:#d7e6dc;border-radius:6px;touch-action:none;cursor:crosshair}.map-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 6px 2px;font-size:12px;color:#7d6b54}.legend{display:flex;gap:10px;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:50%}.zoom{display:flex;gap:5px}.zoom button{padding:4px 10px}@media(max-width:750px){main{padding:16px 10px}.layout{grid-template-columns:1fr}.map{order:-1}.panel{padding:13px}header{align-items:start}}
</style></head><body><main><header><div><div class="overline">THE ATLAS STUDIO · 01</div><h1>群岛绘图室</h1><p>一枚种子，一张只属于你的地图。</p></div></header><div class="layout"><aside class="panel"><div class="group"><h2>生成一座岛</h2><label for="seed">地图种子</label><input id="seed" type="text" value="moonharbor" maxlength="80"><label for="sea">海平面 <output id="seaValue"></output></label><input id="sea" type="range" min="25" max="65" value="43"><label for="rough">地形粗糙度 <output id="roughValue"></output></label><input id="rough" type="range" min="0" max="100" value="48"><button class="primary" id="generate">生成地图</button><p class="help">同种子和参数始终得到同一张地图。生成会清除画笔编辑。</p></div><div class="group"><h2>地形画笔</h2><div class="grid"><button class="active" data-tool="pan">平移地图</button><button data-tool="raise">升高地形</button><button data-tool="lower">降低地形</button></div><label for="size">画笔半径 <output id="sizeValue"></output></label><input id="size" type="range" min="2" max="16" value="7"><p class="help">拖动绘制；地形改变后海岸与河流会重新计算。滚轮或按钮缩放。</p></div><div class="group"><label><input type="checkbox" id="towns" checked> 显示城镇标签</label><div class="grid"><button id="export">导出 PNG</button><button id="reset">重置参数</button></div></div></aside><section class="panel map"><canvas id="map" width="960" height="720" aria-label="可编辑的奇幻地图"></canvas><div class="map-foot"><div class="legend"><span><i style="background:#91b7ae"></i>海洋</span><span><i style="background:#e6d19f"></i>海岸</span><span><i style="background:#c2ce94"></i>平原</span><span><i style="background:#749b71"></i>森林</span><span><i style="background:#897b70"></i>山脉</span><span><i style="background:#6397a2"></i>河流/湖泊</span></div><div class="zoom"><button id="out" aria-label="缩小">−</button><button id="in" aria-label="放大">＋</button><button id="home">复位视图</button></div></div></section></div></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s),canvas=$('#map'),ctx=canvas.getContext('2d'),W=160,H=120,N=W*H,terrain=new Float32Array(N),surface=document.createElement('canvas');surface.width=W;surface.height=H;const sctx=surface.getContext('2d');let tool='pan',zoom=1,panX=0,panY=0,pointer=null,rivers=[],lakes=[],towns=[];const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function hashString(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0}function rand(x,y,seed){let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+seed)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295}function noise(x,y,scale,seed){x/=scale;y/=scale;let ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);const a=rand(ix,iy,seed),b=rand(ix+1,iy,seed),c=rand(ix,iy+1,seed),d=rand(ix+1,iy+1,seed);return(a+(b-a)*fx)*(1-fy)+(c+(d-c)*fx)*fy}function generate(){const seed=hashString($('#seed').value),rough=Number($('#rough').value)/100;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let nx=(x-W/2)/(W*.47),ny=(y-H/2)/(H*.46),island=1-Math.pow(Math.sqrt(nx*nx+ny*ny),1.65);let n=(noise(x,y,55,seed)-.5)*.55+(noise(x,y,25,seed+11)-.5)*.33+(noise(x,y,10,seed+23)-.5)*(.13+rough*.28)+(noise(x,y,4,seed+39)-.5)*rough*.12;terrain[y*W+x]=clamp(.18+island*.65+n,0,1)}update()}function update(){const sea=Number($('#sea').value)/100,seed=hashString($('#seed').value);rivers=[];lakes=[];let used=new Set(),candidates=[];for(let y=5;y<H-5;y+=3)for(let x=5;x<W-5;x+=3){const i=y*W+x,h=terrain[i];if(h>sea+.23&&rand(x,y,seed+77)>.8)candidates.push(i)}candidates.sort((a,b)=>terrain[b]-terrain[a]);for(const source of candidates){if(rivers.length>=13)break;let x=source%W,y=Math.floor(source/W),path=[],local=new Set();if([...used].some(i=>Math.hypot(i%W-x,Math.floor(i/W)-y)<10))continue;for(let n=0;n<400;n++){let i=y*W+x;if(local.has(i))break;local.add(i);path.push([x,y]);if(terrain[i]<=sea||used.has(i))break;let best=i,bh=terrain[i];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;let xx=x+dx,yy=y+dy;if(xx<0||xx>=W||yy<0||yy>=H)continue;let k=yy*W+xx;if(terrain[k]<bh-1e-6){best=k;bh=terrain[k]}}if(best===i){lakes.push([x,y]);break}x=best%W;y=Math.floor(best/W)}if(path.length>4){rivers.push(path);for(const [a,b] of path)used.add(b*W+a)}}towns=[];for(let k=0;k<8;k++){let found=null;for(let t=0;t<100;t++){let x=8+Math.floor(rand(k,t,seed+200)* (W-16)),y=8+Math.floor(rand(t,k,seed+400)*(H-16)),v=terrain[y*W+x];if(v>sea+.035&&v<sea+.22&&towns.every(q=>Math.hypot(q.x-x,q.y-y)>15)){found={x,y,name:['月湾','白杉镇','栖风港','鹿谷','雾石','星河村','青苔渡','远岬'][k]};break}}if(found)towns.push(found)}draw()}function worldToCanvas(){return{sx:canvas.width/W*zoom,sy:canvas.height/H*zoom,ox:canvas.width/2*(1-zoom)+panX,oy:canvas.height/2*(1-zoom)+panY}}function draw(){const sea=Number($('#sea').value)/100,seed=hashString($('#seed').value),img=sctx.createImageData(W,H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,v=terrain[i],j=i*4;let c=v<sea-.07?[139,180,174]:v<sea?[169,199,181]:v<sea+.025?[226,211,163]:v<sea+.19?[194,205,147]:v<sea+.33?[112,151,108]:v<sea+.46?[137,124,109]:[220,214,197];let grain=(rand(x,y,seed+500)-.5)*12;for(let k=0;k<3;k++)img.data[j+k]=clamp(c[k]+grain,0,255);img.data[j+3]=255}sctx.putImageData(img,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#91b7ae';ctx.fillRect(0,0,canvas.width,canvas.height);const {sx,sy,ox,oy}=worldToCanvas();ctx.save();ctx.translate(ox,oy);ctx.scale(sx,sy);ctx.imageSmoothingEnabled=false;ctx.drawImage(surface,0,0);ctx.lineWidth=.45;ctx.strokeStyle='#6094a0';ctx.lineJoin='round';ctx.lineCap='round';for(const path of rivers){ctx.beginPath();path.forEach(([x,y],i)=>i?ctx.lineTo(x+.5,y+.5):ctx.moveTo(x+.5,y+.5));ctx.stroke()}ctx.fillStyle='#719fad';for(const [x,y] of lakes){ctx.beginPath();ctx.ellipse(x+.5,y+.5,1.5,1.1,0,0,Math.PI*2);ctx.fill()}if($('#towns').checked){ctx.fillStyle='#5a4637';ctx.font='2.1px Georgia, serif';for(const t of towns){ctx.beginPath();ctx.arc(t.x,t.y,.8,0,7);ctx.fill();ctx.fillText(t.name,t.x+1.4,t.y-.4)}}ctx.restore();ctx.fillStyle='#594837aa';ctx.font='italic 18px Georgia';ctx.fillText('N',canvas.width-45,34);ctx.beginPath();ctx.moveTo(canvas.width-40,42);ctx.lineTo(canvas.width-40,63);ctx.strokeStyle='#594837aa';ctx.stroke()}function location(e){const r=canvas.getBoundingClientRect(),c=worldToCanvas();return{x:((e.clientX-r.left)*canvas.width/r.width-c.ox)/c.sx,y:((e.clientY-r.top)*canvas.height/r.height-c.oy)/c.sy}}function paint(e){let {x,y}=location(e),radius=Number($('#size').value),sign=tool==='raise'?1:-1;for(let yy=Math.max(0,Math.floor(y-radius));yy<Math.min(H,Math.ceil(y+radius));yy++)for(let xx=Math.max(0,Math.floor(x-radius));xx<Math.min(W,Math.ceil(x+radius));xx++){let d=Math.hypot(xx-x,yy-y)/radius;if(d<1)terrain[yy*W+xx]=clamp(terrain[yy*W+xx]+sign*.025*(1-d*d),0,1)}update()}canvas.addEventListener('pointerdown',e=>{e.preventDefault();pointer={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);if(tool!=='pan')paint(e)});canvas.addEventListener('pointermove',e=>{if(!pointer)return;if(tool==='pan'){const r=canvas.getBoundingClientRect();panX+=(e.clientX-pointer.x)*canvas.width/r.width;panY+=(e.clientY-pointer.y)*canvas.height/r.height;draw()}else paint(e);pointer={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointerup',()=>pointer=null);canvas.addEventListener('pointercancel',()=>pointer=null);function setZoom(z,px=canvas.width/2,py=canvas.height/2){let old=worldToCanvas(),wx=(px-old.ox)/old.sx,wy=(py-old.oy)/old.sy;zoom=clamp(z,.6,4);let now=worldToCanvas();panX+=px-(now.ox+wx*now.sx);panY+=py-(now.oy+wy*now.sy);draw()}canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();setZoom(zoom*(e.deltaY<0?1.12:1/1.12),(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height)},{passive:false});document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});function labels(){$('#seaValue').value=$('#sea').value+'%';$('#roughValue').value=$('#rough').value+'%';$('#sizeValue').value=$('#size').value}$('#sea').oninput=()=>{labels();update()};$('#rough').oninput=labels;$('#size').oninput=labels;$('#towns').onchange=draw;$('#generate').onclick=generate;$('#in').onclick=()=>setZoom(zoom*1.25);$('#out').onclick=()=>setZoom(zoom/1.25);$('#home').onclick=()=>{zoom=1;panX=panY=0;draw()};$('#export').onclick=()=>{const a=document.createElement('a');a.download='fantasy-map.png';a.href=canvas.toDataURL('image/png');a.click()};$('#reset').onclick=()=>{$('#seed').value='moonharbor';$('#sea').value=43;$('#rough').value=48;$('#size').value=7;$('#towns').checked=true;zoom=1;panX=panY=0;labels();generate()};labels();generate()})();
</script></body></html>
