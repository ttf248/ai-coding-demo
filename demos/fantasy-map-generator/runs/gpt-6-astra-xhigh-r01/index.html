<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雾海图志 · 奇幻地图工坊</title><style>*{box-sizing:border-box}body{margin:0;background:#eee9dc;color:#433f30;font:14px system-ui}header{padding:25px 4vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d0c8b4}h1{font:30px Georgia,serif;margin:4px 0}small{color:#897e65;letter-spacing:2px}main{display:grid;grid-template-columns:250px 1fr;gap:25px;max-width:1460px;margin:auto;padding:26px 4vw}aside{background:#f9f5e9;border:1px solid #d9cfb7;border-radius:12px;padding:22px}label{display:block;margin:16px 0 8px}button,input,select{font:inherit;max-width:100%}button,input[type=text],select{border:1px solid #c8bda6;padding:10px 12px;border-radius:6px;background:#fffcf3;color:inherit}button{cursor:pointer}button:hover,button.active{background:#e3d7b7}button.primary{background:#556b5a;color:#fff}input[type=range],input[type=text],select{width:100%}.row{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.atlas{min-width:0}canvas{width:100%;display:block;aspect-ratio:5/4;touch-action:none;border:10px solid #ded4ba;outline:1px solid #b7aa8c;border-radius:2px;background:#d7dfcf}.legend{display:flex;gap:18px;flex-wrap:wrap;padding:16px 0;font-size:12px}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}p{line-height:1.7;font-size:12px;color:#82765e}#status{line-height:1.6;font-size:13px}h2{font-size:16px;margin:0}@media(max-width:760px){main{grid-template-columns:1fr;padding:16px}header{padding:19px}h1{font-size:24px}aside{padding:17px}canvas{border-width:5px}}</style>
<header><div><small>THE MISTBOUND ATLAS</small><h1>雾海图志 · 地图工坊</h1></div><span>✧</span></header><main><aside><h2>一座岛的诞生</h2><label for="seed">世界种子</label><input id="seed" value="mist-isles-42" type="text" maxlength="100"><div class="row"><button id="generate" class="primary">重新生成</button><button id="random">随机种子</button></div><label for="sea">海平面 <output id="seaValue">0.36</output></label><input id="sea" type="range" min="0.15" max="0.65" step="0.01" value="0.36"><label for="rough">地形粗糙度 <output id="roughValue">0.55</output></label><input id="rough" type="range" min="0.1" max="1" step="0.05" value="0.55"><label for="brush">绘图工具</label><select id="brush"><option value="pan">移动地图</option><option value="raise">升高地形</option><option value="lower">降低地形</option></select><label for="radius">画笔半径 <output id="radiusValue">8</output></label><input id="radius" type="range" min="2" max="22" value="8"><div class="row"><button id="minus" aria-label="缩小">−</button><button id="plus" aria-label="放大">＋</button><button id="home">适应画布</button></div><label><input id="labels" type="checkbox" checked> 显示城镇标签</label><div class="row"><button id="export" class="primary">导出 PNG</button><button id="reset">重置全部</button></div><p>拖动平移或绘制，滚轮缩放。缩放按钮适用于触摸屏。编辑会重新计算海岸与河流。河水沿离散地形严格下降，洼地形成内陆湖。</p><p>调整粗糙度会重新生成地形并清除画笔编辑；调整海平面保留编辑。</p></aside><section class="atlas"><canvas id="view" width="1000" height="800" aria-label="可绘制的奇幻岛屿地图"></canvas><div class="legend"><span><i style="background:#a4bec0"></i>海洋</span><span><i style="background:#eadcaa"></i>海岸</span><span><i style="background:#bbc599"></i>平原</span><span><i style="background:#738969"></i>森林</span><span><i style="background:#8e8774"></i>山脉</span></div><div id="status" role="status"></div></section></main>
<script>
'use strict';const $=id=>document.getElementById(id),N=160,M=128,map=document.createElement('canvas');map.width=1000;map.height=800;const mc=map.getContext('2d'),view=$('view'),vc=view.getContext('2d');let height=new Float32Array(N*M),seedHash=1,zoom=1,pan={x:0,y:0},pointer=null,rivers=[],towns=[];
function hashText(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function rand(x,y,s=seedHash){let a=Math.imul(x+374761393,668265263)^Math.imul(y+1274126177,2246822519)^s;a=Math.imul(a^(a>>>13),1274126177);return((a^(a>>>16))>>>0)/4294967295}
const smooth=t=>t*t*(3-2*t);function noise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=smooth(x-ix),fy=smooth(y-iy);return (rand(ix,iy)*(1-fx)+rand(ix+1,iy)*fx)*(1-fy)+(rand(ix,iy+1)*(1-fx)+rand(ix+1,iy+1)*fx)*fy}
function generate(){if(!$('seed').value.trim()){$('status').textContent='请输入一个非空种子。';return}seedHash=hashText($('seed').value);const rough=+$('rough').value;for(let y=0;y<M;y++)for(let x=0;x<N;x++){const nx=(x/N-.5)*2,ny=(y/M-.5)*2,r=Math.hypot(nx,ny);let value=.8-r*.53+(noise(x/42,y/42)-.5)*.45;for(let o=0;o<4;o++)value+=(noise(x/(22/2**o),y/(22/2**o))-.5)*rough*.26/2**(o*.7);height[y*N+x]=value}towns=[];for(let k=0;k<90&&towns.length<8;k++){const x=Math.floor(rand(k,60)*N),y=Math.floor(rand(k,90)*M),h=height[y*N+x];if(h>.39&&h<.57&&towns.every(t=>Math.hypot(t.x-x,t.y-y)>18))towns.push({x,y,name:['银帆港','暮光镇','白鹿堡','风栖谷','雾松村','星落城','鸦石镇','月湾'][towns.length]})}renderMap()}
function drainage(){rivers=[];const candidates=Array.from(height,(h,i)=>({h,i})).filter(p=>p.h>+$('sea').value+.21).sort((a,b)=>b.h-a.h);const sources=[];for(const c of candidates){const x=c.i%N,y=Math.floor(c.i/N);if(sources.every(i=>Math.hypot(i%N-x,Math.floor(i/N)-y)>20))sources.push(c.i);if(sources.length>=12)break}for(const src of sources){let i=src;const route=[i];let lake=false;for(let step=0;step<N*M;step++){if(height[i]<=+$('sea').value)break;const x=i%N,y=Math.floor(i/N);let next=i;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const xx=x+dx,yy=y+dy;if(xx<0||xx>=N||yy<0||yy>=M)continue;const k=yy*N+xx;if(height[k]<height[next])next=k}if(next===i){lake=true;break}route.push(next);i=next}if(route.length>3)rivers.push({route,lake})}}
function renderMap(){drainage();const sea=+$('sea').value,sx=1000/N,sy=800/M;mc.fillStyle='#adc1bb';mc.fillRect(0,0,1000,800);for(let y=0;y<M;y++)for(let x=0;x<N;x++){const i=y*N+x,h=height[i],grain=rand(x,y)*7;let col=h<sea-.09?[152,180,182]:h<sea?[174,194,190]:h<sea+.035?[229,216,173]:h<sea+.18?[185,196,153]:h<sea+.31?[119,143,105]:[157,150,126];const shade=(height[i]-height[Math.max(0,i-N-1)])*90+grain;mc.fillStyle=`rgb(${col.map(c=>Math.round(c+shade)).join(',')})`;mc.fillRect(x*sx,y*sy,sx+.5,sy+.5);if(h>=sea&&[i-1,i-N].some(k=>k>=0&&height[k]<sea)){mc.fillStyle='#a29168';mc.fillRect(x*sx,y*sy,sx,1.6)}if(h>sea+.1&&x%3===0&&y%3===0&&Math.floor(h*14)!==Math.floor(height[Math.max(0,i-1)]*14)){mc.fillStyle='#897f5633';mc.fillRect(x*sx,y*sy,8,1)}}
 mc.strokeStyle='#71856b';mc.lineWidth=1;for(let y=4;y<M-4;y+=5)for(let x=4;x<N-4;x+=5){const h=height[y*N+x],xx=(x+rand(x,y)*2)*sx,yy=y*sy;if(h>sea+.19&&h<sea+.3&&rand(x,y)>.3){mc.fillStyle='#5e795957';mc.beginPath();mc.moveTo(xx,yy-5);mc.lineTo(xx-3,yy+3);mc.lineTo(xx+3,yy+3);mc.closePath();mc.fill()}if(h>sea+.31){mc.strokeStyle='#756d57';mc.beginPath();mc.moveTo(xx-6,yy+4);mc.lineTo(xx,yy-7-rand(x,y)*5);mc.lineTo(xx+7,yy+4);mc.stroke();mc.fillStyle='#f2e9cc99';mc.beginPath();mc.moveTo(xx,yy-7);mc.lineTo(xx+4,yy+1);mc.lineTo(xx,yy-1);mc.fill()}}
 mc.strokeStyle='#557f91';mc.lineJoin='round';mc.lineCap='round';for(const r of rivers){mc.beginPath();r.route.forEach((i,j)=>mc[j?'lineTo':'moveTo']((i%N+.5)*sx,(Math.floor(i/N)+.5)*sy));mc.lineWidth=2;mc.stroke();if(r.lake){const i=r.route.at(-1);mc.fillStyle='#8caeb0';mc.beginPath();mc.ellipse((i%N+.5)*sx,(Math.floor(i/N)+.5)*sy,6,4,0,0,Math.PI*2);mc.fill()}}
 if($('labels').checked)for(const t of towns)if(height[t.y*N+t.x]>sea){const x=t.x*sx,y=t.y*sy;mc.fillStyle='#f8edcc';mc.strokeStyle='#665e45';mc.lineWidth=2;mc.beginPath();mc.arc(x,y,4,0,Math.PI*2);mc.fill();mc.stroke();mc.font='16px Georgia,serif';mc.textAlign='center';mc.lineWidth=4;mc.strokeStyle='#e7e1c8';mc.strokeText(t.name,x,y-12);mc.fillStyle='#443f30';mc.fillText(t.name,x,y-12)}
 mc.fillStyle='#536c6f';mc.font='italic 26px Georgia';mc.textAlign='left';mc.fillText('The Mistbound Isles',35,745);mc.font='12px system-ui';mc.fillText($('seed').value,37,769);mc.save();mc.translate(925,78);mc.strokeStyle='#5d6b5f';mc.beginPath();mc.moveTo(0,-29);mc.lineTo(10,13);mc.lineTo(0,6);mc.lineTo(-10,13);mc.closePath();mc.stroke();mc.font='18px Georgia';mc.textAlign='center';mc.fillText('N',0,-38);mc.restore();draw();$('status').textContent=`世界种子：${$('seed').value} · ${rivers.length} 条河流 · 编辑后海岸与水系已更新。`}
function draw(){vc.fillStyle='#e9e0c6';vc.fillRect(0,0,1000,800);vc.save();vc.translate(pan.x,pan.y);vc.scale(zoom,zoom);vc.drawImage(map,0,0);vc.restore()}
function position(e){const r=view.getBoundingClientRect(),border=parseFloat(getComputedStyle(view).borderLeftWidth);return{x:(e.clientX-r.left-border)/(r.width-2*border)*1000,y:(e.clientY-r.top-border)/(r.height-2*border)*800}}
function paint(p){const x=(p.x-pan.x)/zoom/1000*N,y=(p.y-pan.y)/zoom/800*M,r=+$('radius').value,d=$('brush').value==='raise'?.025:-.025;for(let yy=Math.max(0,Math.floor(y-r));yy<=Math.min(M-1,y+r);yy++)for(let xx=Math.max(0,Math.floor(x-r));xx<=Math.min(N-1,x+r);xx++){const dist=Math.hypot(xx-x,yy-y);if(dist<r)height[yy*N+xx]+=d*(1-dist/r)}renderMap()}
view.onpointerdown=e=>{view.setPointerCapture(e.pointerId);pointer=position(e);if($('brush').value!=='pan')paint(pointer)};view.onpointermove=e=>{if(!pointer)return;const p=position(e);if($('brush').value==='pan'){pan.x+=p.x-pointer.x;pan.y+=p.y-pointer.y;draw()}else paint(p);pointer=p};view.onpointerup=view.onpointercancel=()=>pointer=null;
function scale(f,p={x:500,y:400}){const z=Math.max(.6,Math.min(5,zoom*f));pan.x=p.x-(p.x-pan.x)*z/zoom;pan.y=p.y-(p.y-pan.y)*z/zoom;zoom=z;draw()}view.addEventListener('wheel',e=>{e.preventDefault();scale(Math.exp(-e.deltaY*.001),position(e))},{passive:false});$('plus').onclick=()=>scale(1.3);$('minus').onclick=()=>scale(1/1.3);$('home').onclick=()=>{zoom=1;pan={x:0,y:0};draw()};$('generate').onclick=generate;$('random').onclick=()=>{$('seed').value='isles-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36);generate()};$('sea').oninput=()=>{$('seaValue').value=$('sea').value;renderMap()};$('rough').oninput=()=>{$('roughValue').value=$('rough').value;generate()};$('radius').oninput=()=>{$('radiusValue').value=$('radius').value};$('labels').onchange=renderMap;$('export').onclick=()=>{const a=document.createElement('a');a.download='mistbound-map.png';a.href=map.toDataURL('image/png');a.click()};$('reset').onclick=()=>{$('seed').value='mist-isles-42';$('sea').value=.36;$('rough').value=.55;$('radius').value=8;$('seaValue').value=.36;$('roughValue').value=.55;$('radiusValue').value=8;$('labels').checked=true;$('brush').value='pan';zoom=1;pan={x:0,y:0};generate()};generate();window.lab={generate,get heights(){return Array.from(height)},get rivers(){return rivers},get zoom(){return zoom},map};
</script></html>
