<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奇幻地图生成器 · 群岛制图室</title><style>
:root{--ink:#433f33;--muted:#85775d;--line:#d6c8ad;--green:#496b53}*{box-sizing:border-box}body{margin:0;background:#eee6d5;color:var(--ink);font:14px/1.6 system-ui,sans-serif}main{max-width:1450px;margin:auto;padding:30px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--green)}h1{font:32px/1.3 Georgia,"Songti SC",serif;margin:6px 0}p{margin:5px 0;color:var(--muted)}.badge{border:1px solid var(--line);padding:8px 15px;border-radius:30px}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px}.card{background:#f8f1e3;border:1px solid var(--line);padding:20px;border-radius:12px;min-width:0}h2{font-size:15px;margin:0 0 15px}label{display:block;margin-bottom:15px;color:#74644c}input[type=text]{width:100%;margin-top:7px;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fffcf3;color:var(--ink);font:inherit}input[type=range]{width:100%;accent-color:var(--green)}button{background:#efe5d0;border:1px solid var(--line);padding:8px 12px;border-radius:6px;cursor:pointer;font:inherit;color:var(--ink)}button:hover,button.active{border-color:var(--green);background:#e1e7d7}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}.primary{background:var(--green);color:#fff}.primary:hover{background:#36543e;color:#fff}.tools{display:flex;gap:7px;margin:10px 0 15px;flex-wrap:wrap}.note{font-size:12px;padding-top:16px;border-top:1px solid var(--line);margin-top:20px}.workspace{padding:14px}.maphead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:3px 3px 13px}.maphead b{font:18px Georgia,"Songti SC",serif}.maphead .tools{margin:0}canvas{display:block;width:100%;aspect-ratio:4/3;border-radius:5px;touch-action:none;background:#a8c4be;cursor:grab}.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:#76694f;margin:14px 3px}.legend i{display:inline-block;width:10px;height:10px;background:var(--c);margin-right:5px;border-radius:2px}.status{font-size:12px;margin:8px 3px;min-height:20px}output{float:right;color:var(--green)}@media(max-width:800px){main{padding:16px}header{align-items:flex-start}h1{font-size:26px}.badge{display:none}.layout{grid-template-columns:1fr}.card{padding:14px}.workspace{padding:9px}canvas{aspect-ratio:4/3}}
</style></head><body><main><header><div><div class="eyebrow">THE ATLAS WORKSHOP / 03</div><h1>群岛制图室</h1><p>由一粒种子，绘出一片尚未命名的大陆。</p></div><span class="badge">地形 · 水系 · 聚落</span></header><div class="layout"><aside class="card"><h2>01 / 世界参数</h2><label>地图种子<input id="seed" type="text" value="晨雾群岛-1042" maxlength="100"></label><label>海平面 <output id="seaValue">0.42</output><input id="sea" type="range" min="0.25" max="0.65" step="0.01" value="0.42"></label><label>地形粗糙度 <output id="roughValue">0.55</output><input id="rough" type="range" min="0" max="1" step="0.05" value="0.55"></label><div class="tools"><button id="generate" class="primary">生成地图</button><button id="reset">重置</button></div><h2 style="margin-top:24px">02 / 地形画笔</h2><div class="tools"><button class="active" data-tool="pan">平移</button><button data-tool="raise">升高</button><button data-tool="lower">降低</button></div><label>画笔半径 <output id="radiusValue">8</output><input id="radius" type="range" min="2" max="20" value="8"></label><label><input id="labels" type="checkbox" checked> 显示城镇标签</label><button id="export">导出完整地图 PNG</button><p class="note">拖动平移，滚轮或双指缩放。画笔按世界坐标编辑，抬手后重算水系。河流只沿下降地势流动，局部洼地汇成内陆湖。海平面即时更新，修改粗糙度需重新生成。</p></aside><section class="card workspace"><div class="maphead"><b>晨雾群岛 · 地形图</b><div class="tools"><button id="zoomOut" aria-label="缩小">−</button><button id="zoomIn" aria-label="放大">＋</button><button id="fit">全图</button><span id="zoomText">100%</span></div></div><canvas id="map" width="960" height="720" aria-label="可平移缩放和编辑的奇幻地形地图"></canvas><div class="legend"><span style="--c:#90b5b1"><i></i>海洋</span><span style="--c:#ded3ad"><i></i>海岸</span><span style="--c:#c6ca9b"><i></i>平原</span><span style="--c:#769371"><i></i>森林</span><span style="--c:#a39880"><i></i>山脉</span><span style="--c:#508d98"><i></i>河流 / 湖泊</span></div><p class="status" id="status" role="status"></p></section></div></main><script>
'use strict';const $=id=>document.getElementById(id),W=160,H=120,N=W*H,MW=960,MH=720,canvas=$('map'),ctx=canvas.getContext('2d'),atlas=document.createElement('canvas');atlas.width=MW;atlas.height=MH;const ac=atlas.getContext('2d');const state={heights:new Float64Array(N),seed:'',sea:.42,rough:.55,tool:'pan',scale:1,panX:0,panY:0,rivers:[],lakes:[],towns:[],edited:false};
function seedHash(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}function randomAt(x,y,k=0){let h=state.hash^Math.imul(x+1,374761393)^Math.imul(y+1,668265263)^Math.imul(k+1,1274126177);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}function noise(x,y,k){const xi=Math.floor(x),yi=Math.floor(y),smooth=t=>t*t*(3-2*t),sx=smooth(x-xi),sy=smooth(y-yi),a=randomAt(xi,yi,k),b=randomAt(xi+1,yi,k),c=randomAt(xi,yi+1,k),d=randomAt(xi+1,yi+1,k);return(a*(1-sx)+b*sx)*(1-sy)+(c*(1-sx)+d*sx)*sy}
function generate(){const s=$('seed').value.trim();if(!s){$('status').textContent='请输入非空地图种子。';return}state.seed=s;state.hash=seedHash(s);state.sea=Number($('sea').value);state.rough=Number($('rough').value);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let n=0,amp=1,sum=0;for(let k=0;k<5;k++){n+=noise(x/38*2**k,y/38*2**k,k)*amp;sum+=amp;amp*=.25+.45*state.rough}const nx=(x-W/2)/(W*.49),ny=(y-H/2)/(H*.49),fall=Math.pow(Math.sqrt(nx*nx+ny*ny),1.6);state.heights[y*W+x]=Math.max(0,Math.min(1,.42+n/sum*.62-fall*.5))}state.edited=false;hydrology();renderAtlas();fit();$('status').textContent=`种子「${state.seed}」已生成。相同种子与参数可复现相同地形。`}
function adjacent(i){const x=i%W,y=Math.floor(i/W),out=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if((dx||dy)&&x+dx>=0&&x+dx<W&&y+dy>=0&&y+dy<H)out.push((y+dy)*W+x+dx);return out}
function hydrology(){const h=state.heights,receiver=new Int32Array(N).fill(-1),flow=new Float64Array(N).fill(1);for(let i=0;i<N;i++){if(h[i]<=state.sea)continue;let best=h[i];for(const j of adjacent(i))if(h[j]<best-1e-7){best=h[j];receiver[i]=j}}const order=Array.from({length:N},(_,i)=>i).sort((a,b)=>h[b]-h[a]);for(const i of order)if(receiver[i]>=0)flow[receiver[i]]+=flow[i];state.receiver=receiver;state.rivers=[];state.lakes=[];const used=new Set();for(const i of order){if(h[i]<state.sea+.13||flow[i]<16||used.has(i))continue;let u=i,path=[],sink=-1;for(let k=0;k<N;k++){if(used.has(u)){path.push(u);break}used.add(u);path.push(u);if(h[u]<=state.sea)break;if(receiver[u]<0){sink=u;break}u=receiver[u]}if(path.length>=4){state.rivers.push(path);if(sink>=0)state.lakes.push(sink)}}
state.towns=[];const candidates=order.filter(i=>h[i]>state.sea+.035&&h[i]<state.sea+.15).sort((a,b)=>randomAt(a%W,Math.floor(a/W),70)-randomAt(b%W,Math.floor(b/W),70));for(const i of candidates){if(state.towns.every(j=>Math.hypot(i%W-j%W,Math.floor(i/W)-Math.floor(j/W))>22))state.towns.push(i);if(state.towns.length>=7)break}}
function renderAtlas(){const h=state.heights,sea=state.sea,img=ac.createImageData(W,H);for(let i=0;i<N;i++){const v=h[i],d=v-sea,grain=(randomAt(i%W,Math.floor(i/W),90)-.5)*9;let c=d<=0?[123+v*35,164+v*34,166+v*25]:d<.035?[221,211,171]:d<.14?[198,202,155]:d<.25?[122,151,114]:d<.36?[157,149,126]:[221,216,191];const shade=i>=W?Math.max(-18,Math.min(18,(h[i-W]-v)*200)):0;for(let k=0;k<3;k++)img.data[i*4+k]=c[k]+grain+shade;img.data[i*4+3]=255}const low=document.createElement('canvas');low.width=W;low.height=H;low.getContext('2d').putImageData(img,0,0);ac.imageSmoothingEnabled=true;ac.drawImage(low,0,0,MW,MH);
ac.lineWidth=.8;for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x,d=h[i]-sea;if(d<=0)continue;const contour=Math.floor(d/.07);if(h[i+1]<=sea||h[i+W]<=sea){ac.strokeStyle='#82785d';ac.beginPath();ac.moveTo(x*6,y*6);ac.lineTo((x+1)*6,(y+1)*6);ac.stroke()}else if(contour!==Math.floor((h[i+1]-sea)/.07)){ac.strokeStyle='rgba(96,91,65,.15)';ac.beginPath();ac.moveTo(x*6,y*6);ac.lineTo(x*6,(y+1)*6);ac.stroke()}}
for(let y=4;y<H-4;y+=4)for(let x=4;x<W-4;x+=4){const i=y*W+x,d=h[i]-sea,px=x*6+(randomAt(x,y,9)-.5)*13,py=y*6;if(d>.14&&d<.25&&randomAt(x,y,8)>.36){ac.strokeStyle='#526a4d';ac.lineWidth=1;ac.beginPath();ac.moveTo(px,py-7);ac.lineTo(px-4,py+1);ac.lineTo(px+4,py+1);ac.closePath();ac.moveTo(px,py+1);ac.lineTo(px,py+4);ac.stroke()}if(d>.25&&randomAt(x,y,11)>.25){ac.strokeStyle='#7a705c';ac.fillStyle=d>.36?'#e8e0c8':'#b4a88c';ac.beginPath();ac.moveTo(px-7,py+5);ac.lineTo(px,py-10-d*9);ac.lineTo(px+8,py+5);ac.fill();ac.stroke();ac.beginPath();ac.moveTo(px,py-10-d*9);ac.lineTo(px+1,py+2);ac.stroke()}}
ac.strokeStyle='#528999';ac.lineWidth=2;ac.lineCap='round';for(const path of state.rivers){ac.beginPath();path.forEach((i,k)=>{const x=(i%W+.5)*6,y=(Math.floor(i/W)+.5)*6;k?ac.lineTo(x,y):ac.moveTo(x,y)});ac.stroke()}ac.fillStyle='#80aab0';ac.strokeStyle='#528999';for(const i of state.lakes){ac.beginPath();ac.ellipse((i%W+.5)*6,(Math.floor(i/W)+.5)*6,5,3,0,0,Math.PI*2);ac.fill();ac.stroke()}
if($('labels').checked){const names=['雾港','青杉镇','白石堡','风眠村','鹿鸣城','星落湾','远岬'];state.towns.forEach((i,k)=>{const x=(i%W+.5)*6,y=(Math.floor(i/W)+.5)*6;ac.fillStyle='#493e2b';ac.beginPath();ac.arc(x,y,3,0,Math.PI*2);ac.fill();ac.font='bold 13px serif';ac.textAlign='center';ac.strokeStyle='#faf2dc';ac.lineWidth=4;ac.strokeText(names[k],x,y-9);ac.fillText(names[k],x,y-9)})}
ac.strokeStyle='rgba(71,65,46,.55)';ac.lineWidth=2;ac.strokeRect(12,12,MW-24,MH-24);ac.fillStyle='#453f32';ac.font='italic 18px Georgia,serif';ac.textAlign='left';ac.fillText('N',MW-42,44);ac.beginPath();ac.moveTo(MW-36,50);ac.lineTo(MW-42,76);ac.lineTo(MW-30,76);ac.closePath();ac.fill();ac.font='12px system-ui';ac.fillText('群岛制图室 · '+state.seed.slice(0,35),28,MH-28);view()}
function view(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#afc6be';ctx.fillRect(0,0,MW,MH);ctx.setTransform(state.scale,0,0,state.scale,state.panX,state.panY);ctx.drawImage(atlas,0,0);ctx.setTransform(1,0,0,1,0,0);$('zoomText').textContent=Math.round(state.scale*100)+'%'}function fit(){state.scale=1;state.panX=state.panY=0;view()}function zoom(f,x=MW/2,y=MH/2){const old=state.scale;state.scale=Math.max(1,Math.min(5,old*f));state.panX=x-(x-state.panX)*state.scale/old;state.panY=y-(y-state.panY)*state.scale/old;clampPan();view()}function clampPan(){state.panX=Math.max(MW-MW*state.scale,Math.min(0,state.panX));state.panY=Math.max(MH-MH*state.scale,Math.min(0,state.panY))}function coords(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*MW/r.width,y:(e.clientY-r.top)*MH/r.height}}function world(p){return{x:(p.x-state.panX)/state.scale/6,y:(p.y-state.panY)/state.scale/6}}
function brush(p){const q=world(p),radius=Number($('radius').value),h=state.heights;for(let y=Math.max(0,Math.floor(q.y-radius));y<Math.min(H,q.y+radius);y++)for(let x=Math.max(0,Math.floor(q.x-radius));x<Math.min(W,q.x+radius);x++){const distance=Math.hypot(x-q.x,y-q.y);if(distance<radius){const i=y*W+x;h[i]=Math.max(0,Math.min(1,h[i]+(state.tool==='raise'?1:-1)*.045*(1-distance/radius)))}}state.edited=true;hydrology();renderAtlas()}
const pointers=new Map();let last=null,pinch=null;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const p=coords(e);pointers.set(e.pointerId,p);last=p;if(pointers.size===2){const [a,b]=[...pointers.values()];pinch={distance:Math.hypot(a.x-b.x,a.y-b.y),center:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}}else if(state.tool!=='pan')brush(p)});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=coords(e);pointers.set(e.pointerId,p);if(pointers.size===2){const [a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y),center={x:(a.x+b.x)/2,y:(a.y+b.y)/2};if(pinch){zoom(d/Math.max(1,pinch.distance),center.x,center.y);state.panX+=center.x-pinch.center.x;state.panY+=center.y-pinch.center.y;clampPan();view()}pinch={distance:d,center}}else if(state.tool==='pan'){if(last){state.panX+=p.x-last.x;state.panY+=p.y-last.y;clampPan();view()}}else brush(p);last=p});for(const t of ['pointerup','pointercancel'])canvas.addEventListener(t,e=>{pointers.delete(e.pointerId);last=[...pointers.values()][0]||null;pinch=null;if(state.edited)$('status').textContent='地形已编辑；海岸、下降水系与城镇位置已更新。'});canvas.addEventListener('wheel',e=>{e.preventDefault();const p=coords(e);zoom(Math.exp(-e.deltaY*.001),p.x,p.y)},{passive:false});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{state.tool=b.dataset.tool;canvas.style.cursor=state.tool==='pan'?'grab':'crosshair';document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});$('generate').onclick=generate;$('seed').onkeydown=e=>{if(e.key==='Enter')generate()};$('sea').oninput=()=>{state.sea=Number($('sea').value);$('seaValue').value=state.sea.toFixed(2);hydrology();renderAtlas();$('status').textContent='海平面已更新，海岸与水系已重新计算。'};$('rough').oninput=()=>{$('roughValue').value=Number($('rough').value).toFixed(2);$('status').textContent='粗糙度已设定，点击生成地图应用；会重新生成并替换地形编辑。'};$('radius').oninput=()=>{$('radiusValue').value=$('radius').value};$('labels').onchange=renderAtlas;$('zoomIn').onclick=()=>zoom(1.25);$('zoomOut').onclick=()=>zoom(.8);$('fit').onclick=fit;$('reset').onclick=()=>{$('seed').value='晨雾群岛-1042';$('sea').value=.42;$('rough').value=.55;$('seaValue').value='0.42';$('roughValue').value='0.55';$('radius').value=8;$('radiusValue').value=8;$('labels').checked=true;document.querySelector('[data-tool="pan"]').click();generate()};$('export').onclick=()=>atlas.toBlob(blob=>{if(!blob){$('status').textContent='PNG 导出失败，请重试。';return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='群岛地图.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='已导出完整地图，包含当前地形编辑和标签。'},'image/png');generate();window.lab={state,generate,hydrology,brush,world,zoom,atlas,renderAtlas};
</script></body></html>
