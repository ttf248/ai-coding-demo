<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奇幻地图生成器</title><style>*{box-sizing:border-box}body{margin:0;background:#101923;color:#e3ebef;font:15px/1.6 system-ui,sans-serif}header{padding:25px 5vw;border-bottom:1px solid #314352}h1{font-size:28px;margin:3px 0}p{margin:6px 0;color:#aabdc9}.badge{color:#76e6c1;font-size:12px;letter-spacing:2px}main{max-width:1350px;margin:auto;padding:22px;display:grid;grid-template-columns:265px minmax(0,1fr);gap:20px}aside,.panel{background:#192734;border:1px solid #334654;border-radius:14px;padding:18px;min-width:0}label{display:block;margin:12px 0}input,select,button{font:inherit;color:inherit;background:#263b4b;border:1px solid #486173;border-radius:7px;padding:8px;max-width:100%}input[type=range]{width:100%;padding:0;accent-color:#76e6c1}button{cursor:pointer;margin:3px 2px}button:hover{background:#38546a}button.primary{background:#2c7467}canvas,svg{display:block;width:100%;touch-action:none;border-radius:9px}#status{color:#76e6c1;padding:12px 0;overflow-wrap:anywhere}.row{display:flex;flex-wrap:wrap;gap:6px}.note{font-size:12px;color:#aabdc9}output{color:#76e6c1}a{color:#76e6c1}@media(max-width:700px){main{grid-template-columns:1fr;padding:12px}header{padding:16px}aside{padding:12px}h1{font-size:23px}}</style><header><div class="badge">CARTOGRAPHER / 02</div><h1>奇幻地图生成器</h1><p>从一个名字出发，绘制山脉、海岸与未知的旅途。</p></header><main><aside><label>地图种子<input id="seed" value="银杉群岛"></label><button id="generate" class="primary">生成地图</button><label>海平面<input id="sea" type="range" min=".1" max=".5" step=".01" value=".26"></label><label>地形粗糙度<input id="rough" type="range" min=".1" max="1.5" step=".1" value=".7"></label><label>工具<select id="tool"><option value="pan">平移地图</option><option value="raise">升高地形</option><option value="lower">降低地形</option></select></label><label>画笔半径<input id="size" type="range" min="2" max="15" value="5"></label><label><input id="labels" type="checkbox" checked> 城镇标签</label><div class="row"><button id="in">放大</button><button id="out">缩小</button><button id="home">归位</button><output id="zoomtext"></output></div><button id="export">导出 PNG</button><button id="reset">重置</button><p class="note">拖动平移或绘制，滚轮缩放。河流沿高度下降，洼地形成内陆湖。导出完整当前地图，包含编辑与标签。</p></aside><section class="panel"><canvas id="map"></canvas><p class="note">蓝色海洋与湖泊 · 沙色海岸 · 浅绿平原 · 深绿森林 · 灰色山脉</p><div id="status" role="status"></div></section></main><script>
const $=id=>document.getElementById(id),c=$('map'),ctx=c.getContext('2d'),S=128,T=6,world=document.createElement('canvas'),g=world.getContext('2d');world.width=world.height=S*T;
let heights=new Float64Array(S*S),rivers=[],towns=[],seed=0,zoom=1,ox=0,oy=0,drag=null;
function hash(x,y){let v=Math.imul(x+seed,374761393)^Math.imul(y,668265263);v=Math.imul(v^(v>>>13),1274126177);return ((v^(v>>>16))>>>0)/4294967295}
function noise(x,y){let ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);let a=hash(ix,iy)*(1-fx)+hash(ix+1,iy)*fx,b=hash(ix,iy+1)*(1-fx)+hash(ix+1,iy+1)*fx;return a*(1-fy)+b*fy}
function generate(){seed=2166136261;for(let ch of $('seed').value)seed=Math.imul(seed^ch.charCodeAt(0),16777619)>>>0;let rough=Number($('rough').value);
for(let y=0;y<S;y++)for(let x=0;x<S;x++){let nx=(x-64)/64,ny=(y-64)/64;heights[y*S+x]=.66-.62*Math.pow(Math.hypot(nx,ny),1.6)+(noise(x/24,y/24)-.5)*.4+(noise(x/9,y/9)-.5)*rough*.22+(noise(x/3,y/3)-.5)*rough*.06}
towns=[];for(let k=0;k<8;k++){let x=15+Math.floor(hash(k,101)*98),y=15+Math.floor(hash(k,202)*98);if(heights[y*S+x]>sea()&&heights[y*S+x]<.58)towns.push({x,y,name:['松风港','鹿鸣镇','白石堡','星落湾','杉木城','月泉村','雾岭城','晨曦镇'][k]})}ox=oy=0;zoom=1;rebuild()}
function sea(){return Number($('sea').value)}
function route(){rivers=[];let sources=Array.from(heights,(h,i)=>({h,i})).filter(v=>v.h>sea()+.22&&hash(v.i,8)>.988).sort((a,b)=>b.h-a.h).slice(0,22);
for(let {i} of sources){let path=[i],lake=false;for(let n=0;n<S*2;n++){if(heights[i]<=sea())break;let x=i%S,y=Math.floor(i/S),best=i;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let xx=x+dx,yy=y+dy;if(xx>=0&&xx<S&&yy>=0&&yy<S&&heights[yy*S+xx]<heights[best]-1e-6)best=yy*S+xx}if(best===i){lake=true;break}i=best;path.push(i)}if(path.length>3)rivers.push({path,lake})}}
function rebuild(){route();let level=sea();g.fillStyle='#d3c197';g.fillRect(0,0,world.width,world.height);for(let y=0;y<S;y++)for(let x=0;x<S;x++){let h=heights[y*S+x],i=y*S+x;g.fillStyle=h<level?'#65969e':h<level+.025?'#dfcda0':h>.65?'#b7b0a0':h>.53?'#8c9273':noise(x/11+50,y/11)>.52?'#618563':'#b4b987';g.fillRect(x*T,y*T,T,T);if(h>level+.03){let slope=h-heights[Math.max(0,y-1)*S+Math.max(0,x-1)];if(slope>.017){g.fillStyle='rgba(47,57,35,.16)';g.fillRect(x*T,y*T,T,T)}if(h>.55&&hash(x,y)>.78){g.strokeStyle='#65634f';g.beginPath();g.moveTo(x*T-3,y*T+4);g.lineTo(x*T,y*T-4);g.lineTo(x*T+3,y*T+4);g.stroke()}else if(h<.53&&noise(x/11+50,y/11)>.52&&hash(x,y)>.87){g.fillStyle='#365f45';g.beginPath();g.moveTo(x*T,y*T-3);g.lineTo(x*T-2,y*T+3);g.lineTo(x*T+2,y*T+3);g.fill()}}}
g.strokeStyle='#427d91';g.lineWidth=2;for(let {path,lake} of rivers){g.beginPath();path.forEach((i,k)=>{let x=(i%S+.5)*T,y=(Math.floor(i/S)+.5)*T;k?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();if(lake){let i=path.at(-1);g.fillStyle='#65969e';g.beginPath();g.ellipse((i%S+.5)*T,(Math.floor(i/S)+.5)*T,5,3,0,0,7);g.fill()}}
if($('labels').checked){g.font='bold 13px serif';for(let t of towns)if(heights[t.y*S+t.x]>level){g.fillStyle='#393e35';g.fillRect(t.x*T-3,t.y*T-3,6,6);g.fillStyle='#f2e6c9';g.fillRect(t.x*T+4,t.y*T-12,52,18);g.fillStyle='#393e35';g.fillText(t.name,t.x*T+6,t.y*T+1)}}
$('status').textContent='种子 '+$('seed').value+' · '+rivers.length+' 条河流 · 画笔编辑后实时重算地貌';draw()}
function draw(){c.width=768;c.height=768;ctx.fillStyle='#263e46';ctx.fillRect(0,0,768,768);ctx.save();ctx.translate(ox,oy);ctx.scale(zoom,zoom);ctx.drawImage(world,0,0);ctx.restore();$('zoomtext').textContent=zoom.toFixed(1)+'×'}
function point(e){let r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*768/r.width,y:(e.clientY-r.top)*768/r.height}}
function brush(p){let x=(p.x-ox)/zoom/T,y=(p.y-oy)/zoom/T,rad=Number($('size').value),sign=$('tool').value==='raise'?1:-1;for(let yy=Math.max(0,Math.floor(y-rad));yy<Math.min(S,Math.ceil(y+rad));yy++)for(let xx=Math.max(0,Math.floor(x-rad));xx<Math.min(S,Math.ceil(x+rad));xx++){let d=Math.hypot(xx-x,yy-y);if(d<rad)heights[yy*S+xx]+=sign*.035*(1-d/rad)}rebuild()}
c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);drag=point(e);if($('tool').value!=='pan')brush(drag)};
c.onpointermove=e=>{if(!drag)return;let p=point(e);if($('tool').value==='pan'){ox+=p.x-drag.x;oy+=p.y-drag.y;draw()}else brush(p);drag=p};c.onpointerup=c.onpointercancel=()=>drag=null;
function scale(f,p={x:384,y:384}){let z=Math.min(5,Math.max(.7,zoom*f));ox=p.x-(p.x-ox)*z/zoom;oy=p.y-(p.y-oy)*z/zoom;zoom=z;draw()}
c.onwheel=e=>{e.preventDefault();scale(e.deltaY<0?1.12:1/1.12,point(e))};
$('in').onclick=()=>scale(1.25);$('out').onclick=()=>scale(.8);$('home').onclick=()=>{zoom=1;ox=oy=0;draw()};$('generate').onclick=generate;$('sea').oninput=rebuild;$('rough').onchange=generate;$('labels').onchange=rebuild;$('reset').onclick=()=>{$('seed').value='银杉群岛';$('sea').value=.26;$('rough').value=.7;$('tool').value='pan';$('size').value=5;$('labels').checked=true;generate()};$('export').onclick=()=>{let a=document.createElement('a');a.download='奇幻地图.png';a.href=world.toDataURL();a.click()};generate();window.lab={generate,brush,route,get heights(){return Array.from(heights)},get rivers(){return rivers},sea};
</script></html>
