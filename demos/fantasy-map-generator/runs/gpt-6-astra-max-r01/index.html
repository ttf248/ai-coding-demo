<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>无名之地 · 奇幻地图工坊</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee7d6;color:#413a2d;font:14px/1.7 Georgia,'Microsoft YaHei',serif}button,input{font:inherit;color:inherit}button{border:1px solid #c7bda3;border-radius:4px;background:#f8f3e6;padding:8px 12px;cursor:pointer}button:hover,button.active{background:#405b4f;color:#fff;border-color:#405b4f}input[type=text]{width:100%;border:1px solid #c7bda3;background:#fffbef;padding:10px;border-radius:4px}input[type=range]{width:100%;accent-color:#405b4f}header{display:flex;justify-content:space-between;padding:22px 4vw;border-bottom:1px solid #cfc5ac}header b{font-size:21px}main{max-width:1500px;padding:28px 4vw;margin:auto}h1{font-size:42px;font-weight:500;margin:0;letter-spacing:3px}small{color:#877d65}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:20px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px}.panel{border:1px solid #c8bca0;background:#f4eddd;padding:20px}.panel h2{font-size:16px;font-weight:normal;border-bottom:1px solid #d3c8b2;padding-bottom:12px;margin:0 0 14px}label{display:block;margin-top:14px}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.mapframe{border:1px solid #b7a986;box-shadow:0 10px 24px #5d50321a;background:#e4d9bc;padding:10px;min-width:0}canvas{display:block;width:100%;aspect-ratio:4/3;touch-action:none;cursor:crosshair}.mapbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 4px}.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;margin-top:20px}.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;background:var(--c)}#status{font-size:12px;min-height:40px}.notice{font-size:12px;margin:20px 0;color:#796e58}@media(max-width:800px){.layout{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel h2{grid-column:1/-1}.intro{display:block}}@media(max-width:480px){main{padding:22px 12px}h1{font-size:32px}.panel{padding:14px;gap:12px}.mapframe{padding:5px}header small{display:none}}
</style><header><b>✧ 无名之地 <small>TERRA INCOGNITA</small></b><small>制图工坊 / VOL. 03</small></header><main><div class="intro"><div><small>每一次远行，都始于一张地图。</small><h1>为想象，画一片大陆。</h1></div><button id="export">↓ 导出 PNG 地图</button></div><div class="layout"><aside class="panel"><h2>探索者的工具箱</h2><div><label for="seed">世界种子</label><input id="seed" type="text" value="雾海纪元-42" maxlength="120"><div class="controls"><button id="generate">重新生成</button><button id="random">新世界</button></div><label for="sea">海平面 <output id="seaValue">0.44</output></label><input id="sea" type="range" min="0.25" max="0.65" step="0.01" value="0.44"><label for="rough">地形粗糙度 <output id="roughValue">0.55</output></label><input id="rough" type="range" min="0.15" max="0.9" step="0.05" value="0.55"></div><div><label>地形编辑</label><div class="controls" id="tools"><button class="active" data-tool="pan">移动</button><button data-tool="raise">升高</button><button data-tool="lower">降低</button></div><label for="brush">画笔半径</label><input id="brush" type="range" min="3" max="22" value="10"><label><input id="labels" type="checkbox" checked> 显示城镇名称</label><button id="reset" style="margin-top:16px">重置世界与视角</button><p id="status" role="status">地图已生成。切换画笔，可以改变山海。</p></div></aside><section class="mapframe"><canvas id="map" width="1000" height="750" aria-label="可绘制奇幻地图"></canvas><div class="mapbar"><small>滚轮缩放 · 移动模式拖拽平移 · 双指缩放</small><div><button id="minus" aria-label="缩小">−</button> <output id="zoom">100%</output> <button id="plus" aria-label="放大">＋</button><button id="fit">复位</button></div></div></section></div><div class="legend"><span><i style="--c:#9cbabd"></i>海洋</span><span><i style="--c:#ded2a4"></i>海岸</span><span><i style="--c:#b8bb86"></i>平原</span><span><i style="--c:#64856b"></i>森林</span><span><i style="--c:#8c8575"></i>山脉</span><span>⌂ 城镇</span><span>≈ 下行河流 / 内陆湖泊</span></div><p class="notice">河流按相邻格的最低地势下降；到达海洋或局部洼地时结束。修改地形后，海岸、河道与城镇位置会重新计算。</p></main><script>
const $=id=>document.getElementById(id),canvas=$('map'),ctx=canvas.getContext('2d'),S=192,heights=new Float32Array(S*S),paper=document.createElement('canvas'),pc=paper.getContext('2d');paper.width=1000;paper.height=750;let seed=0,mode='pan',scale=1,ox=0,oy=0,rivers=[],towns=[],pointers=new Map(),pinch=null;
function hashText(t){let h=2166136261;for(const c of t)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}function rnd(x,y,k=0){let n=Math.imul(x+seed,374761393)^Math.imul(y+k*31,668265263);n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295;}
const fade=t=>t*t*(3-2*t),mix=(a,b,t)=>a+(b-a)*t;function noise(x,y){const X=Math.floor(x),Y=Math.floor(y),u=fade(x-X),v=fade(y-Y);return mix(mix(rnd(X,Y),rnd(X+1,Y),u),mix(rnd(X,Y+1),rnd(X+1,Y+1),u),v);}
function generate(){seed=hashText($('seed').value);const rough=+$('rough').value;for(let y=0;y<S;y++)for(let x=0;x<S;x++){let n=0,a=1,sum=0;for(let o=0;o<5;o++){n+=noise(x/S*3*2**o,y/S*3*2**o)*a;sum+=a;a*=rough;}const dx=(x-S/2)/(S/2),dy=(y-S/2)/(S/2),rad=Math.sqrt(dx*dx+dy*dy);heights[y*S+x]=Math.max(0,Math.min(1,.68+n/sum*.65-rad*.72));}rebuild();$('status').textContent='种子「'+$('seed').value+'」已生成。相同种子与参数可重现。';}
function water(){const sea=+$('sea').value;rivers=[];const sources=[];for(let y=8;y<S-8;y+=8)for(let x=8;x<S-8;x+=8)if(heights[y*S+x]>sea+.16&&rnd(x,y,8)>.78)sources.push(y*S+x);sources.sort((a,b)=>heights[b]-heights[a]);const used=[];for(const source of sources){if(used.some(i=>Math.hypot(i%S-source%S,Math.floor(i/S)-Math.floor(source/S))<18))continue;used.push(source);let i=source;const line=[i];let lake=false;for(let k=0;k<S*S;k++){if(heights[i]<=sea)break;let next=i;const x=i%S,y=Math.floor(i/S);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(x+dx<0||x+dx>=S||y+dy<0||y+dy>=S)continue;const v=(y+dy)*S+x+dx;if(heights[v]<heights[next]-1e-6)next=v;}if(next===i){lake=true;break;}i=next;line.push(i);}if(line.length>3)rivers.push({line,lake});if(rivers.length>=18)break;}}
function rebuild(){water();towns=[];const sea=+$('sea').value;for(let y=24;y<S-20;y+=13)for(let x=20;x<S-20;x+=17){const h=heights[y*S+x];if(h>sea+.02&&h<sea+.17&&rnd(x,y,20)>.45&&!towns.some(t=>Math.hypot(t.x-x,t.y-y)<32))towns.push({x,y});}towns=towns.slice(0,7);paint();draw();}
function paint(){const sea=+$('sea').value;pc.fillStyle='#a6bfc0';pc.fillRect(0,0,1000,750);for(let y=0;y<S;y++)for(let x=0;x<S;x++){const h=heights[y*S+x],g=Math.floor(rnd(x,y,2)*8);pc.fillStyle=h<sea-.06?`rgb(${139+g},${173+g},${179+g})`:h<sea?`rgb(${165+g},${191+g},${188+g})`:h<sea+.025?'#ded2a4':h<sea+.16?`rgb(${181+g},${185+g},${133+g})`:h<sea+.27?`rgb(${135+g},${157+g},${112+g})`:'#a29c87';pc.fillRect(x/S*1000,y/S*750,1000/S+1,750/S+1);if(h>=sea&&[heights[y*S+Math.min(S-1,x+1)],heights[Math.min(S-1,y+1)*S+x]].some(v=>v<sea)){pc.fillStyle='#786f53';pc.fillRect(x/S*1000,y/S*750,3,3);}}
 for(let y=6;y<S-6;y+=5)for(let x=6;x<S-6;x+=5){const h=heights[y*S+x],px=x/S*1000,py=y/S*750;if(h>sea+.27&&rnd(x,y,10)>.35){pc.beginPath();pc.moveTo(px-8,py+5);pc.lineTo(px,py-12);pc.lineTo(px+9,py+5);pc.strokeStyle='#756c58';pc.lineWidth=1.2;pc.stroke();pc.beginPath();pc.moveTo(px,py-12);pc.lineTo(px+3,py+3);pc.stroke();}else if(h>sea+.12&&h<sea+.25&&rnd(x,y,10)>.4){pc.fillStyle='#4c7258';pc.beginPath();pc.moveTo(px,py-7);pc.lineTo(px-4,py+2);pc.lineTo(px+4,py+2);pc.fill();pc.fillRect(px-.5,py+2,1,4);}}
 pc.strokeStyle='#527f8a';pc.lineWidth=2;pc.lineJoin='round';for(const r of rivers){pc.beginPath();r.line.forEach((i,k)=>{const x=(i%S+.5)/S*1000,y=(Math.floor(i/S)+.5)/S*750;k?pc.lineTo(x,y):pc.moveTo(x,y);});pc.stroke();if(r.lake){const i=r.line.at(-1);pc.fillStyle='#729a9e';pc.beginPath();pc.ellipse((i%S+.5)/S*1000,(Math.floor(i/S)+.5)/S*750,6,4,0,0,7);pc.fill();}}
 if($('labels').checked){const names=['渡鸦港','银叶镇','风息城','暮光堡','鹿鸣谷','苍石关','雾林驿'];towns.forEach((t,i)=>{const x=t.x/S*1000,y=t.y/S*750;pc.fillStyle='#4a4434';pc.fillRect(x-3,y-4,6,7);pc.beginPath();pc.moveTo(x-5,y-4);pc.lineTo(x,y-10);pc.lineTo(x+5,y-4);pc.fill();pc.font='15px Georgia,serif';pc.lineWidth=4;pc.strokeStyle='#e9e0bd';pc.strokeText(names[i],x+10,y+3);pc.fillText(names[i],x+10,y+3);});}
 pc.strokeStyle='#756c54';pc.lineWidth=1;pc.strokeRect(13,13,974,724);pc.fillStyle='#4f5849';pc.font='italic 24px Georgia';pc.fillText('The Unwritten Isles',32,55);pc.font='12px Georgia';pc.fillText('TERRA INCOGNITA · '+$('seed').value.slice(0,40),32,78);pc.font='26px Georgia';pc.fillText('N',922,70);pc.beginPath();pc.moveTo(932,80);pc.lineTo(918,121);pc.lineTo(932,111);pc.lineTo(946,121);pc.closePath();pc.stroke();pc.font='12px Georgia';pc.fillText('0 ━━━━━ 50 里',32,710);}
function draw(){ctx.fillStyle='#d9ceb2';ctx.fillRect(0,0,1000,750);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);ctx.drawImage(paper,0,0);ctx.restore();$('zoom').textContent=Math.round(scale*100)+'%';}
function viewPoint(e){const b=canvas.getBoundingClientRect();return {x:(e.clientX-b.left)/b.width*1000,y:(e.clientY-b.top)/b.height*750};}function brush(p){const x=(p.x-ox)/scale/1000*S,y=(p.y-oy)/scale/750*S,r=+$('brush').value;if(x<0||y<0||x>=S||y>=S)return;for(let yy=Math.max(0,Math.floor(y-r));yy<Math.min(S,y+r);yy++)for(let xx=Math.max(0,Math.floor(x-r));xx<Math.min(S,x+r);xx++){const d=Math.hypot(xx-x,yy-y)/r;if(d<1){const i=yy*S+xx;heights[i]=Math.max(0,Math.min(1,heights[i]+(mode==='raise'?1:-1)*.028*(1-d)));}}rebuild();$('status').textContent='地形已修改，海岸和河流已更新。';}
function zoom(f,p={x:500,y:375}){const old=scale;scale=Math.max(.6,Math.min(5,scale*f));ox=p.x-(p.x-ox)*scale/old;oy=p.y-(p.y-oy)*scale/old;draw();}
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);const p=viewPoint(e);pointers.set(e.pointerId,p);if(pointers.size===2){const [a,b]=[...pointers.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);}else if(mode!=='pan')brush(p);};canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId),p=viewPoint(e);pointers.set(e.pointerId,p);if(pointers.size===2){const [a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch>0)zoom(d/pinch,{x:(a.x+b.x)/2,y:(a.y+b.y)/2});pinch=d;}else if(mode==='pan'){ox+=p.x-old.x;oy+=p.y-old.y;draw();}else brush(p);};canvas.onpointerup=canvas.onpointercancel=e=>{pointers.delete(e.pointerId);pinch=null;};canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.001),viewPoint(e));},{passive:false});$('tools').onclick=e=>{if(e.target.dataset.tool){mode=e.target.dataset.tool;for(const b of $('tools').children)b.classList.toggle('active',b===e.target);}};$('generate').onclick=generate;$('random').onclick=()=>{$('seed').value='远方-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36);generate();};$('rough').oninput=()=>{$('roughValue').value=$('rough').value;generate();};$('sea').oninput=()=>{$('seaValue').value=$('sea').value;rebuild();};$('labels').onchange=()=>{paint();draw();};$('plus').onclick=()=>zoom(1.25);$('minus').onclick=()=>zoom(.8);$('fit').onclick=()=>{scale=1;ox=oy=0;draw();};$('reset').onclick=()=>{$('seed').value='雾海纪元-42';$('sea').value=.44;$('rough').value=.55;$('seaValue').value='.44';$('roughValue').value='.55';scale=1;ox=oy=0;generate();};$('export').onclick=()=>{const a=document.createElement('a');a.download='无名之地.png';a.href=paper.toDataURL('image/png');a.click();$('status').textContent='已导出当前完整地图（含编辑后的地形与标签）。';};generate();window.mapLab={heights:()=>Array.from(heights),rivers:()=>structuredClone(rivers),view:()=>({scale,ox,oy}),generate};
</script></html>
