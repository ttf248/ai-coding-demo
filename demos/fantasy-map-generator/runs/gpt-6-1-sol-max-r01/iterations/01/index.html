<style>
:root{--paper:#f3edde;--ink:#403f32;--muted:#898371;--border:#ddd4bf;--green:#596a4e;--brown:#b4774e}*{box-sizing:border-box}body{margin:0;background:#ede8dc;color:var(--ink);font:14px/1.55 Georgia,"Songti SC","Microsoft YaHei",serif}button,input,select{font:inherit}button{border:1px solid var(--border);background:#fbf8ef;color:var(--ink);padding:9px 13px;border-radius:6px;cursor:pointer}button:hover{background:#e8e4d4}button.active,button.primary{background:var(--green);color:#fff;border-color:var(--green)}button:focus-visible,input:focus-visible{outline:3px solid #a6b897;outline-offset:2px}input[type=range]{width:100%;accent-color:var(--green);cursor:pointer}input[type=text]{width:100%;border:1px solid var(--border);background:#fbf8f0;border-radius:5px;color:var(--ink);padding:11px}header{max-width:1500px;margin:auto;padding:26px 32px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);gap:20px}.mark{border:1px solid var(--green);width:42px;height:42px;display:grid;place-items:center;font-size:29px;color:var(--green);border-radius:50%}.brand{display:flex;gap:13px;align-items:center}h1{font-size:23px;letter-spacing:3px;margin:0}.eyebrow{font:10px/1.5 system-ui,sans-serif;letter-spacing:2px;color:var(--muted)}header p{color:var(--muted);font-size:12px;margin:0}.workspace{max-width:1500px;margin:auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:26px;padding:26px 32px}.sidebar{background:#f7f3e8;border:1px solid var(--border);border-radius:10px;overflow:hidden}.section{padding:20px;border-bottom:1px solid var(--border)}.section:last-child{border:0}h2{font-size:16px;margin:0 0 15px}.num{color:var(--brown);font-size:11px;margin-right:9px}label{display:block;font-size:12px;color:var(--muted);margin-top:15px}.value{float:right;color:var(--ink);font-family:system-ui,sans-serif;font-size:11px}.btn-row{display:flex;gap:7px;margin-top:10px}.btn-row button{flex:1;padding:8px}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tools button{padding:10px 3px;font-size:12px}.switch-label{display:flex;align-items:center;gap:9px;color:var(--ink);cursor:pointer}input[type=checkbox]{accent-color:var(--green);width:16px;height:16px}.note{color:var(--muted);font-size:12px;margin:12px 0 0}.map-area{min-width:0}.map-title{display:flex;justify-content:space-between;align-items:flex-start;margin:0 0 15px;gap:12px}.map-title h2{font-size:23px;letter-spacing:2px;margin:0}.map-title p{color:var(--muted);font-size:11px;margin:5px 0 0;font-family:system-ui,sans-serif}.map-frame{background:#ded7c3;padding:9px;border:1px solid #c9bea5;box-shadow:0 8px 30px #73634317;border-radius:4px;position:relative}.map-viewport{overflow:hidden;position:relative;background:#c4d5ce;border:1px solid #a99e83;aspect-ratio:4/3;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas.paint{cursor:crosshair}.zoom-bar{position:absolute;bottom:14px;right:14px;display:flex;align-items:center;background:#faf6eadd;border:1px solid #cfc5ad;border-radius:7px;padding:4px;box-shadow:0 3px 12px #39322414}.zoom-bar button{border:0;background:none;padding:5px 10px;font-family:system-ui,sans-serif;font-size:18px}.zoom-bar span{font:11px system-ui,sans-serif;width:47px;text-align:center}.legend{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:15px 2px;color:var(--muted);font-size:11px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}.map-status{border-top:1px solid var(--border);padding-top:11px;font-size:12px;color:var(--green);min-height:36px}.map-status.error{color:#a53a28}.bottom{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:10px;margin-top:10px}.tips{padding-left:15px;color:var(--muted);font-size:11px;margin:0}.tips li{margin:7px 0}.mobile-tip{display:none}@media(max-width:1000px){header{padding:20px}.workspace{padding:20px;gap:16px;grid-template-columns:235px minmax(0,1fr)}.section{padding:16px}.map-title h2{font-size:20px}}@media(max-width:700px){header{padding:16px}header>p{display:none}h1{font-size:20px}.workspace{padding:16px;display:flex;flex-direction:column;gap:16px}.map-area{order:-1}.sidebar{display:grid;grid-template-columns:1fr 1fr}.section{padding:13px;min-width:0}.section:nth-child(2){border-left:1px solid var(--border)}.section:last-child{grid-column:1/-1}.map-title h2{font-size:20px}.map-title button{padding:8px 10px;font-size:12px}.map-frame{padding:5px}.legend{gap:10px;padding:11px 0}.zoom-bar{bottom:10px;right:10px}.bottom{flex-direction:column;gap:2px}.note{font-size:11px}.tools button{font-size:11px}.mobile-tip{display:inline}h2{font-size:14px}}

<body><header><div class="brand"><div class="mark" aria-hidden="true">✧</div><div><div class="eyebrow">THE FARLANDS / CARTOGRAPHY</div><h1>远境绘图室</h1></div></div><p>每一片大陆，都有尚未写下的故事。</p></header>
<main class="workspace"><aside class="sidebar"><section class="section"><h2><span class="num">01</span>塑造世界</h2><label for="seed">世界种子</label><input id="seed" type="text" value="雾海纪元-42" maxlength="120" autocomplete="off"><div class="btn-row"><button id="generate" class="primary">重新生成</button><button id="random">新种子</button></div><label for="sea">海平面 <span class="value" id="seaValue"></span></label><input type="range" id="sea" min="10" max="65" value="30"><label for="rough">地形粗糙度 <span class="value" id="roughValue"></span></label><input type="range" id="rough" min="0" max="100" value="56"><p class="note">种子与参数相同，地形、河流及城镇均可重复生成。</p></section>
<section class="section"><h2><span class="num">02</span>雕刻地形</h2><div class="tools"><button data-tool="pan" class="active">✥ 平移</button><button data-tool="raise">↑ 升高</button><button data-tool="lower">↓ 降低</button></div><label for="radius">画笔半径 <span class="value" id="radiusValue"></span></label><input id="radius" type="range" min="2" max="16" value="7"><label for="strength">画笔力度 <span class="value" id="strengthValue"></span></label><input id="strength" type="range" min="1" max="10" value="4"><button id="undo" style="width:100%;margin-top:10px" disabled>撤销上一笔</button><p class="note">绘制时实时改变高程。落笔结束后重新计算河流与内陆湖。</p></section>
<section class="section"><h2><span class="num">03</span>地图细节</h2><label class="switch-label"><input id="labels" type="checkbox" checked>显示城镇与地名</label><div class="btn-row"><button id="fit">适合窗口</button><button id="reset">重置地图</button></div><ul class="tips"><li>滚轮缩放；平移模式拖动地图。</li><li>触摸双指可缩放，单指使用当前工具。</li><li>河流流向更低的相邻格，洼地形成内陆湖。</li></ul></section></aside>
<section class="map-area"><div class="map-title"><div><h2 id="mapName">雾海之境</h2><p id="subtitle">手绘地形图 · 等待绘制</p></div><button id="export">↓ 导出 PNG</button></div><div class="map-frame"><div class="map-viewport" id="viewport"><canvas id="map" aria-label="可平移缩放并用画笔编辑的奇幻岛屿地图"></canvas></div><div class="zoom-bar"><button id="zoomOut" aria-label="缩小">−</button><span id="zoomValue">100%</span><button id="zoomIn" aria-label="放大">＋</button></div></div>
<div class="legend"><span><i style="background:#abc8c2"></i>海洋</span><span><i style="background:#dfcd96"></i>海岸</span><span><i style="background:#dbd9b2"></i>平原</span><span><i style="background:#8a9d72"></i>森林</span><span><i style="background:#999584"></i>山脉</span><span><i style="background:#679dad"></i>河流 / 湖泊</span></div><div class="map-status" id="status" role="status" aria-live="polite"></div><div class="bottom"><span>墨线、山丘与一片未知之地。</span><span>本地生成 · 离线保存 · 画笔编辑可撤销</span></div></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('map'),ctx=canvas.getContext('2d'),atlas=document.createElement('canvas');atlas.width=1200;atlas.height=900;const art=atlas.getContext('2d');
const NX=160,NY=120,CELL=7.5,SIZE=NX*NY,heights=new Float64Array(SIZE),moisture=new Float64Array(SIZE);
let seedHash=0,sea=.3,rough=.56,flow=new Float64Array(SIZE),down=new Int32Array(SIZE),lakes=new Uint8Array(SIZE),towns=[],history=[],tool='pan',stroke=null,dirty=false,framePending=false,landCells=0;
const view={scale:1,x:0,y:0,width:0,height:0,dpr:1},pointers=new Map();let gesture=null,lastHover=null;
function hashString(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function randomAt(x,y,s=seedHash){let v=Math.imul(x+374761393,668265263)^Math.imul(y+1274126177,2246822519)^s;v=Math.imul(v^(v>>>13),1274126177);return ((v^(v>>>16))>>>0)/4294967296;}
function noise(x,y,s){const ix=Math.floor(x),iy=Math.floor(y),u=x-ix,v=y-iy,fx=u*u*(3-2*u),fy=v*v*(3-2*v),a=randomAt(ix,iy,s),b=randomAt(ix+1,iy,s),c=randomAt(ix,iy+1,s),d=randomAt(ix+1,iy+1,s);return (a+(b-a)*fx)*(1-fy)+(c+(d-c)*fx)*fy;}
function fbm(x,y,s){return noise(x,y,s)*.54+noise(x*2,y*2,s+11)*.27+noise(x*4,y*4,s+29)*.13+noise(x*8,y*8,s+51)*.06;}
function params(){sea=+$('sea').value/100;rough=+$('rough').value/100;$('seaValue').textContent=$('sea').value+'%';$('roughValue').textContent=$('rough').value+'%';$('radiusValue').textContent=$('radius').value+' 格';$('strengthValue').textContent=$('strength').value+' / 10';}
function generate(){if(!$('seed').value.trim()){$('status').textContent='请填写世界种子。';$('status').classList.add('error');$('seed').focus();return;}params();seedHash=hashString($('seed').value);history=[];$('undo').disabled=true;
 for(let y=0;y<NY;y++)for(let x=0;x<NX;x++){const i=y*NX+x,dx=(x-NX*.5)/(NX*.46),dy=(y-NY*.5)/(NY*.44),r=Math.hypot(dx,dy),broad=fbm(x/30,y/30,seedHash),fine=fbm(x/11,y/11,seedHash+91);heights[i]=.82-.62*Math.pow(r,1.6)+.34*(broad-.5)+rough*.35*(fine-.5);if(x===0||y===0||x===NX-1||y===NY-1)heights[i]=-.5;moisture[i]=fbm(x/20+50,y/20,seedHash+337);}
 hydrology();placeTowns();renderAtlas();fit();updateTitle();report('地图已生成。选择升高 / 降低画笔，或拖动浏览岛屿。');}
function neighbors(i,visit){const x=i%NX,y=Math.floor(i/NX);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if((dx||dy)&&x+dx>=0&&x+dx<NX&&y+dy>=0&&y+dy<NY)visit(i+dy*NX+dx,dx&&dy?Math.SQRT2:1);}}
function hydrology(){down.fill(-1);lakes.fill(0);flow.fill(0);landCells=0;
 for(let i=0;i<SIZE;i++){if(heights[i]<=sea)continue;landCells++;flow[i]=.3+.7*moisture[i];let slope=0;neighbors(i,(j,d)=>{const s=(heights[i]-heights[j])/d;if(s>slope+1e-9){slope=s;down[i]=j;}});}
 const order=Array.from({length:SIZE},(_,i)=>i).sort((a,b)=>heights[b]-heights[a]);for(const i of order)if(down[i]>=0)flow[down[i]]+=flow[i];
 // Closed depressions retain water; every drawn river ends at the sea or one of these basins.
 for(let i=0;i<SIZE;i++)if(heights[i]>sea&&down[i]<0&&flow[i]>8){const level=heights[i]+.016,queue=[i],seen=new Set([i]);let count=0;while(queue.length&&count<70){const j=queue.shift();lakes[j]=1;count++;neighbors(j,k=>{if(!seen.has(k)&&heights[k]<=level&&heights[k]>sea){seen.add(k);queue.push(k);}});}}
}
const townNames=['苔湾','白帆港','鹿鸣谷','银松镇','风栖堡','星落渡','月石城','琥珀丘','鸦羽村','长风集'];
function placeTowns(){towns=[];for(let k=0;k<1200&&towns.length<7;k++){const x=8+Math.floor(randomAt(k,817,seedHash+5)*(NX-16)),y=8+Math.floor(randomAt(k,941,seedHash+13)*(NY-16)),i=y*NX+x,h=heights[i];if(h<sea+.025||h>sea+.37||lakes[i]||towns.some(t=>Math.hypot(t.x-x,t.y-y)<18))continue;towns.push({x,y,name:townNames[Math.floor(randomAt(k,300)*townNames.length)]});} }
function biome(i){const h=heights[i];if(lakes[i])return 5;if(h<=sea)return 0;if(h<sea+.025)return 1;if(h>sea+.34)return 4;if(moisture[i]>.48&&h>sea+.085)return 3;return 2;}
const palettes=[[157,191,186],[221,203,150],[218,217,175],[158,173,126],[171,167,145],[140,178,183]];
function renderAtlas(){const raster=document.createElement('canvas');raster.width=NX;raster.height=NY;const rc=raster.getContext('2d'),pixels=rc.createImageData(NX,NY);
 for(let y=0;y<NY;y++)for(let x=0;x<NX;x++){const i=y*NX+x,b=biome(i),c=palettes[b],left=heights[y*NX+Math.max(0,x-1)],right=heights[y*NX+Math.min(NX-1,x+1)],top=heights[Math.max(0,y-1)*NX+x],bottom=heights[Math.min(NY-1,y+1)*NX+x],shade=b===0?Math.max(-12,18*(heights[i]-sea)+8):Math.max(-25,Math.min(23,(left-right+top-bottom)*170)),grain=(randomAt(x,y,seedHash+60)-.5)*9;for(let k=0;k<3;k++)pixels.data[i*4+k]=c[k]+shade+grain;pixels.data[i*4+3]=255;}
 rc.putImageData(pixels,0,0);art.imageSmoothingEnabled=true;art.drawImage(raster,0,0,atlas.width,atlas.height);
 // Coasts and contour bands are traced from actual elevation samples.
 art.lineWidth=1.2;art.strokeStyle='#7d816368';art.beginPath();for(let y=1;y<NY-1;y++)for(let x=1;x<NX-1;x++){const i=y*NX+x;if(heights[i]>sea){if(heights[i+1]<=sea){art.moveTo((x+1)*CELL,y*CELL);art.lineTo((x+1)*CELL,(y+1)*CELL);}if(heights[i+NX]<=sea){art.moveTo(x*CELL,(y+1)*CELL);art.lineTo((x+1)*CELL,(y+1)*CELL);}}}art.stroke();
 art.strokeStyle='#81795726';art.lineWidth=.7;art.beginPath();for(let y=2;y<NY-2;y++)for(let x=2;x<NX-2;x++){const i=y*NX+x,h=heights[i],band=Math.floor((h-sea)/.11);if(h>sea+.06&&!lakes[i]&&Math.floor((heights[i+1]-sea)/.11)!==band){art.moveTo((x+1)*CELL,y*CELL);art.lineTo((x+1)*CELL,(y+1)*CELL);}}art.stroke();
 art.strokeStyle='#5d93a6';art.lineCap='round';for(let i=0;i<SIZE;i++)if(heights[i]>sea&&down[i]>=0&&flow[i]>18){const j=down[i];art.lineWidth=Math.min(5,.75+Math.sqrt(flow[i])*.1);art.beginPath();art.moveTo((i%NX+.5)*CELL,(Math.floor(i/NX)+.5)*CELL);art.lineTo((j%NX+.5)*CELL,(Math.floor(j/NX)+.5)*CELL);art.stroke();}
 // Deterministic ink symbols, positioned on the matching biome.
 for(let y=5;y<NY-5;y+=3)for(let x=5;x<NX-5;x+=3){const i=y*NX+x,b=biome(i),px=(x+.5)*CELL,py=(y+.5)*CELL;if(b===3&&randomAt(x,y,seedHash+19)>.38){const s=5+randomAt(x,y)*5;art.strokeStyle='#536644b3';art.fillStyle='#8fa17588';art.lineWidth=1;art.beginPath();art.moveTo(px,py-s);art.lineTo(px-s*.65,py+s*.4);art.lineTo(px+s*.65,py+s*.4);art.closePath();art.fill();art.stroke();art.beginPath();art.moveTo(px,py+s*.4);art.lineTo(px,py+s*.8);art.stroke();}else if(b===4&&randomAt(x,y,seedHash+9)>.45){const s=7+randomAt(x,y)*7;art.strokeStyle='#736f5caa';art.fillStyle='#c6c2a477';art.lineWidth=1.2;art.beginPath();art.moveTo(px-s,py+s*.5);art.lineTo(px,py-s);art.lineTo(px+s,py+s*.5);art.fill();art.stroke();art.beginPath();art.moveTo(px,py-s);art.lineTo(px-s*.1,py);art.lineTo(px+s*.22,py-s*.25);art.stroke();}}
 if($('labels').checked){art.font='italic 34px Georgia,serif';art.fillStyle='#476f734c';art.textAlign='center';art.save();art.translate(180,480);art.rotate(-Math.PI/2);art.fillText('THE MIST SEA',0,0);art.restore();for(const t of towns){const i=t.y*NX+t.x;if(heights[i]<=sea||lakes[i])continue;const x=(t.x+.5)*CELL,y=(t.y+.5)*CELL;art.fillStyle='#f7ecd0';art.strokeStyle='#61593b';art.lineWidth=1.5;art.beginPath();art.arc(x,y,4,0,Math.PI*2);art.fill();art.stroke();art.font='bold 15px "Songti SC",serif';art.textAlign='center';art.lineWidth=4;art.strokeStyle='#eee4cadb';art.strokeText(t.name,x,y-10);art.fillStyle='#494333';art.fillText(t.name,x,y-10);}}
 drawCompass();draw();}
function drawCompass(){const x=atlas.width-65,y=78;art.save();art.translate(x,y);art.strokeStyle='#716a4f';art.fillStyle='#716a4f';art.lineWidth=1;art.beginPath();art.arc(0,0,25,0,Math.PI*2);art.stroke();for(let n=0;n<4;n++){art.save();art.rotate(n*Math.PI/2);art.beginPath();art.moveTo(0,-34);art.lineTo(-5,0);art.lineTo(0,-5);art.lineTo(5,0);art.closePath();art.stroke();if(n===0)art.fill();art.restore();}art.font='13px Georgia';art.textAlign='center';art.fillText('N',0,-43);art.restore();art.strokeStyle='#716a4f';art.lineWidth=1.5;art.beginPath();art.moveTo(70,atlas.height-46);art.lineTo(190,atlas.height-46);for(let x=70;x<=190;x+=60){art.moveTo(x,atlas.height-51);art.lineTo(x,atlas.height-41);}art.stroke();art.font='11px Georgia';art.fillStyle='#716a4f';art.textAlign='center';art.fillText('0',70,atlas.height-28);art.fillText('20 里（示意）',190,atlas.height-28);}
function updateTitle(){const prefixes=['雾海','苍松','银月','落星','长风','鹿鸣'];$('mapName').textContent=prefixes[seedHash%prefixes.length]+'之境';$('subtitle').textContent='种子 '+$('seed').value+' · 海平面 '+Math.round(sea*100)+'% · 粗糙度 '+Math.round(rough*100)+'%';}
function report(msg){$('status').classList.remove('error');$('status').textContent=msg+' 陆地占比 '+Math.round(landCells/SIZE*100)+'%。';}
function resize(){const r=$('viewport').getBoundingClientRect();const oldW=view.width,oldH=view.height;view.dpr=Math.min(2,window.devicePixelRatio||1);view.width=r.width;view.height=r.height;canvas.width=Math.round(r.width*view.dpr);canvas.height=Math.round(r.height*view.dpr);if(oldW){view.x*=r.width/oldW;view.y*=r.height/oldH;}draw();}
function fitted(){return Math.min(view.width/atlas.width,view.height/atlas.height);}
function fit(){view.scale=1;view.x=0;view.y=0;draw();}
function constrain(){const w=atlas.width*fitted()*view.scale,h=atlas.height*fitted()*view.scale;view.x=Math.max(view.width-w,Math.min(0,view.x));view.y=Math.max(view.height-h,Math.min(0,view.y));}
function draw(){if(!view.width)return;ctx.setTransform(view.dpr,0,0,view.dpr,0,0);ctx.clearRect(0,0,view.width,view.height);ctx.fillStyle='#bfd0c8';ctx.fillRect(0,0,view.width,view.height);const s=fitted()*view.scale;ctx.drawImage(atlas,view.x,view.y,atlas.width*s,atlas.height*s);if(lastHover&&tool!=='pan'){const r=+$('radius').value*CELL*s;ctx.strokeStyle=tool==='raise'?'#476f37':'#a65a45';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.beginPath();ctx.arc(lastHover.x,lastHover.y,r,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}$('zoomValue').textContent=Math.round(view.scale*100)+'%';}
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*view.width/r.width,y:(e.clientY-r.top)*view.height/r.height};}
function world(p){const s=fitted()*view.scale;return {x:(p.x-view.x)/s/CELL,y:(p.y-view.y)/s/CELL};}
function zoom(factor,p={x:view.width/2,y:view.height/2}){const old=view.scale,next=Math.max(1,Math.min(5,old*factor));view.x=p.x-(p.x-view.x)*next/old;view.y=p.y-(p.y-view.y)*next/old;view.scale=next;constrain();draw();}
function brush(p){const w=world(p),radius=+$('radius').value,strength=+$('strength').value*.006*(tool==='raise'?1:-1);if(w.x<0||w.y<0||w.x>=NX||w.y>=NY)return;for(let y=Math.max(1,Math.floor(w.y-radius));y<Math.min(NY-1,Math.ceil(w.y+radius));y++)for(let x=Math.max(1,Math.floor(w.x-radius));x<Math.min(NX-1,Math.ceil(w.x+radius));x++){const d=Math.hypot(x+.5-w.x,y+.5-w.y)/radius;if(d<1)heights[y*NX+x]=Math.max(-.5,Math.min(1.5,heights[y*NX+x]+strength*(1-d*d)*(1-d*d)));}dirty=true;queueRender();}
function brushLine(a,b){const wa=world(a),wb=world(b),steps=Math.max(1,Math.ceil(Math.hypot(wb.x-wa.x,wb.y-wa.y)/Math.max(1,+$('radius').value*.3)));for(let k=1;k<=steps;k++)brush({x:a.x+(b.x-a.x)*k/steps,y:a.y+(b.y-a.y)*k/steps});}
function queueRender(){if(framePending)return;framePending=true;requestAnimationFrame(()=>{framePending=false;if(dirty){hydrology();renderAtlas();dirty=false;}else draw();});}
function finishStroke(){if(!stroke)return;history.push(stroke.before);if(history.length>12)history.shift();stroke=null;$('undo').disabled=false;if(dirty){hydrology();renderAtlas();dirty=false;}report('地形已编辑，海岸与水系已更新。');}
function pinch(){const pts=[...pointers.values()];if(pts.length<2)return null;return {center:{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2},distance:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)};}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();const p=point(e);pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);if(pointers.size===2){finishStroke();gesture=pinch();return;}if(tool!=='pan'){stroke={before:heights.slice(),last:p};brush(p);}lastHover=p;});
canvas.addEventListener('pointermove',e=>{const p=point(e);lastHover=p;if(!pointers.has(e.pointerId)){draw();return;}const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,p);if(pointers.size>=2){const next=pinch();if(gesture&&next&&gesture.distance>0){view.x+=next.center.x-gesture.center.x;view.y+=next.center.y-gesture.center.y;zoom(next.distance/gesture.distance,next.center);}gesture=next;}else if(tool==='pan'){view.x+=p.x-prev.x;view.y+=p.y-prev.y;constrain();draw();}else if(stroke){brushLine(stroke.last,p);stroke.last=p;}});
function release(e){pointers.delete(e.pointerId);if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);if(pointers.size<2)gesture=null;if(!pointers.size)finishStroke();draw();}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('pointerleave',()=>{if(!pointers.size){lastHover=null;draw();}});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.001),point(e));},{passive:false});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{finishStroke();tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));canvas.classList.toggle('paint',tool!=='pan');draw();});
$('generate').onclick=generate;$('seed').addEventListener('keydown',e=>{if(e.key==='Enter')generate();});$('random').onclick=()=>{const bytes=new Uint32Array(1);if(window.crypto?.getRandomValues)crypto.getRandomValues(bytes);else bytes[0]=Date.now()>>>0;$('seed').value='远境-'+bytes[0].toString(36).toUpperCase();generate();};
for(const id of ['sea','rough'])$(id).oninput=()=>{finishStroke();if(id==='rough'){generate();return;}params();hydrology();placeTowns();renderAtlas();updateTitle();report('海平面已更新。');};for(const id of ['radius','strength'])$(id).oninput=()=>{params();draw();};
$('labels').onchange=renderAtlas;$('fit').onclick=fit;$('zoomIn').onclick=()=>zoom(1.3);$('zoomOut').onclick=()=>zoom(1/1.3);$('undo').onclick=()=>{if(!history.length)return;heights.set(history.pop());hydrology();renderAtlas();$('undo').disabled=!history.length;report('已撤销上一笔地形编辑。');};
$('reset').onclick=()=>{$('seed').value='雾海纪元-42';$('sea').value=30;$('rough').value=56;$('radius').value=7;$('strength').value=4;$('labels').checked=true;document.querySelector('[data-tool="pan"]').click();generate();};
$('export').onclick=()=>{finishStroke();atlas.toBlob(blob=>{if(!blob){$('status').textContent='图片生成失败，请重试。';$('status').classList.add('error');return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='远境地图-'+$('seed').value.replace(/[\\/:*?"<>|]/g,'_')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);report('已导出当前完整地图，包含地形编辑与当前地名显示设置。');},'image/png');};
new ResizeObserver(resize).observe($('viewport'));resize();generate();
</script></body></html>
