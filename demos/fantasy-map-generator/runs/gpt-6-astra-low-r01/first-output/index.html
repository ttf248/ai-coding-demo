<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远境 · 奇幻地图生成器</title><style>*{box-sizing:border-box}body{margin:0;background:#e8dfc9;color:#453d2c;font:15px Georgia,serif}main{max-width:1250px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:34px;margin:4px 0}small{letter-spacing:4px;color:#897146}p{line-height:1.7}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:#f7f0df;padding:16px;border:1px solid #c0b491;margin:14px 0;border-radius:8px}label{display:flex;align-items:center;gap:6px;flex-wrap:wrap}input[type=text]{width:150px}input,button,select{font:inherit;border:1px solid #afa380;background:#fffaed;padding:9px;color:#453d2c;border-radius:4px}input[type=range]{padding:0;width:110px}button{cursor:pointer}button.primary{background:#536950;color:white}canvas{display:block;width:100%;height:570px;background:#acc0bb;touch-action:none;border:8px solid #f5eddb;outline:1px solid #a99d7c}.legend{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}.legend span:before{content:'◆';color:var(--c);margin-right:7px}#status{min-height:24px;color:#685738}@media(max-width:500px){main{padding:12px}h1{font-size:26px}header{display:block}canvas{height:450px}}</style><main><header><div><small>ATLAS OF THE UNWRITTEN</small><h1>远境 · 岛屿绘图室</h1></div><p>一粒种子，一片尚未命名的大陆。</p></header><div class="controls"><label>种子 <input id="seed" type="text" value="远境-024"></label><button id="generate" class="primary">生成地图</button><label>海平面 <input id="sea" type="range" min="20" max="65" value="40"><output id="seaVal">40%</output></label><label>粗糙度 <input id="rough" type="range" min="10" max="100" value="55"><output id="roughVal">55%</output></label></div><div class="controls"><label>工具 <select id="tool"><option value="pan">平移地图</option><option value="raise">升高地形</option><option value="lower">降低地形</option></select></label><label>画笔 <input id="brush" type="range" min="2" max="16" value="7"></label><button id="out">−</button><button id="in">＋</button><button id="fit">适应视图</button><label><input id="labels" type="checkbox" checked> 城镇标签</label><button id="export">导出 PNG</button><button id="reset">重置</button></div><canvas id="map" aria-label="可编辑岛屿地图"></canvas><div class="legend"><span style="--c:#809f9a">海洋</span><span style="--c:#e2cca0">海岸</span><span style="--c:#b2bd83">平原</span><span style="--c:#567955">森林</span><span style="--c:#8a8070">山脉</span><span style="--c:#598c9a">河流 / 湖泊</span></div><div id="status" role="status"></div><p>滚轮或 ＋ / − 缩放；平移工具支持鼠标与单指拖动。选择画笔后拖动修改地形，河流沿下降方向重新计算；无出口的洼地汇成内陆湖泊。导出保留当前完整地图与标签，忽略视图缩放。</p></main><script>
const $=id=>document.getElementById(id),c=$('map'),ctx=c.getContext('2d'),atlas=document.createElement('canvas'),a=atlas.getContext('2d');atlas.width=960;atlas.height=720;const W=160,H=120;let heights=new Float32Array(W*H),moist=new Float32Array(W*H),sea=.4,zoom=1,ox=0,oy=0,viewW=0,viewH=0,drag=null,seedNum=0,towns=[],rivers=[],lakes=new Set();
function hashSeed(s){let h=2166136261;for(let ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}function randomAt(x,y,s=seedNum){let n=Math.imul(x+117,374761393)^Math.imul(y+73,668265263)^s;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295}function noise(x,y){let ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);return (randomAt(ix,iy)*(1-fx)+randomAt(ix+1,iy)*fx)*(1-fy)+(randomAt(ix,iy+1)*(1-fx)+randomAt(ix+1,iy+1)*fx)*fy}
function generate(){if(!$('seed').value.trim()){$('status').textContent='请输入一个非空种子。';return}seedNum=hashSeed($('seed').value);let rough=+$('rough').value/100;sea=+$('sea').value/100;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let nx=(x-W/2)/(W/2),ny=(y-H/2)/(H/2),r=Math.sqrt(nx*nx+ny*ny);let base=noise(x/32,y/32)*.32+noise(x/13,y/13)*rough*.22+noise(x/5,y/5)*rough*.08;heights[y*W+x]=.69-r*.57+base-.13;moist[y*W+x]=noise(x/12+130,y/12+340)}rebuild();$('status').textContent=`地图已生成 · 种子「${$('seed').value}」 · 相同种子与参数可重复生成`}
function adjacent(n){let x=n%W,y=Math.floor(n/W),out=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if((dx||dy)&&x+dx>=0&&x+dx<W&&y+dy>=0&&y+dy<H)out.push(n+dy*W+dx);return out}
function water(){lakes=new Set();rivers=[];let candidates=[];for(let n=0;n<heights.length;n++)if(heights[n]>sea+.16&&randomAt(n%W,Math.floor(n/W),seedNum+18)>.985)candidates.push(n);candidates.sort((b,d)=>heights[d]-heights[b]);let chosen=[];for(let n of candidates){if(chosen.some(v=>Math.hypot(n%W-v%W,Math.floor(n/W)-Math.floor(v/W))<15))continue;chosen.push(n);if(chosen.length>=14)break}for(let n of chosen){let path=[n];for(let step=0;step<W*H;step++){if(heights[n]<=sea)break;let next=n;for(let k of adjacent(n))if(heights[k]<heights[next])next=k;if(next===n){lakes.add(n);break}n=next;path.push(n)}if(path.length>3)rivers.push(path)}}
function rebuild(){water();towns=[];for(let n=0;n<heights.length;n++){if(heights[n]>sea+.035&&heights[n]<sea+.16&&randomAt(n%W,Math.floor(n/W),seedNum+901)>.996&&!towns.some(t=>Math.hypot(n%W-t%W,Math.floor(n/W)-Math.floor(t/W))<24))towns.push(n);if(towns.length>=7)break}paint();draw()}
function paint(){a.clearRect(0,0,960,720);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let n=y*W+x,h=heights[n],m=moist[n],j=randomAt(x,y)*8;let color=h<sea?[126+j,159+j,154+j]:h<sea+.025?[225+j,202+j,157+j]:h>sea+.24?[139+j,130+j,111+j]:m>.54?[107+j,139+j,90+j]:[177+j,188+j,129+j];a.fillStyle=`rgb(${color.join(',')})`;a.fillRect(x*6,y*6,6,6)}a.lineJoin='round';a.lineCap='round';a.strokeStyle='#548693';a.lineWidth=2.4;for(let path of rivers){a.beginPath();path.forEach((n,i)=>i?a.lineTo(n%W*6+3,Math.floor(n/W)*6+3):a.moveTo(n%W*6+3,Math.floor(n/W)*6+3));a.stroke()}a.fillStyle='#69979b';for(let n of lakes){a.beginPath();a.ellipse(n%W*6+3,Math.floor(n/W)*6+3,6,4,0,0,7);a.fill()}for(let y=3;y<H-3;y+=3)for(let x=3;x<W-3;x+=3){let n=y*W+x,h=heights[n];if(randomAt(x,y)<.5)continue;if(h>sea+.24){a.strokeStyle='#69614e';a.lineWidth=1;a.beginPath();a.moveTo(x*6-6,y*6+5);a.lineTo(x*6,y*6-8);a.lineTo(x*6+7,y*6+5);a.moveTo(x*6,y*6-8);a.lineTo(x*6+1,y*6+3);a.stroke()}else if(h>sea+.035&&moist[n]>.54){a.fillStyle='#53704c';a.beginPath();a.moveTo(x*6,y*6-5);a.lineTo(x*6-4,y*6+3);a.lineTo(x*6+4,y*6+3);a.fill()}}
if($('labels').checked){let names=['雾港','鹿鸣镇','银松堡','风栖城','远山驿','白石湾','月影村'];towns.forEach((n,i)=>{let x=n%W*6,y=Math.floor(n/W)*6;a.fillStyle='#493e2b';a.beginPath();a.arc(x,y,3,0,7);a.fill();a.font='bold 14px serif';a.lineWidth=3;a.strokeStyle='#f2e7c8';a.strokeText(names[i],x+6,y-6);a.fillText(names[i],x+6,y-6)})}a.strokeStyle='#f2e5c4';a.lineWidth=3;a.strokeRect(12,12,936,696);a.fillStyle='#405b59';a.font='bold 23px serif';a.fillText('N',910,55);a.beginPath();a.moveTo(918,65);a.lineTo(910,96);a.lineTo(918,87);a.lineTo(926,96);a.closePath();a.fill();a.font='14px serif';a.fillText('远 境 · '+$('seed').value.slice(0,28),28,688)}
function draw(){ctx.clearRect(0,0,viewW,viewH);ctx.fillStyle='#92aaa5';ctx.fillRect(0,0,viewW,viewH);ctx.drawImage(atlas,ox,oy,960*zoom,720*zoom)}function fit(){zoom=Math.min(viewW/960,viewH/720);ox=(viewW-960*zoom)/2;oy=(viewH-720*zoom)/2;draw()}function resize(){viewW=c.clientWidth-16;viewH=c.clientHeight-16;let d=Math.min(devicePixelRatio,2);c.width=viewW*d;c.height=viewH*d;ctx.setTransform(d,0,0,d,0,0);fit()}function point(e){let r=c.getBoundingClientRect();return {x:(e.clientX-r.left-8)*viewW/(r.width-16),y:(e.clientY-r.top-8)*viewH/(r.height-16)}}function brush(p){let x=(p.x-ox)/zoom/6,y=(p.y-oy)/zoom/6,r=+$('brush').value,sign=$('tool').value==='raise'?1:-1;for(let yy=Math.max(0,Math.floor(y-r));yy<Math.min(H,y+r);yy++)for(let xx=Math.max(0,Math.floor(x-r));xx<Math.min(W,x+r);xx++){let d=Math.hypot(xx-x,yy-y);if(d<r)heights[yy*W+xx]=Math.max(0,Math.min(1,heights[yy*W+xx]+sign*.035*(1-d/r)))}rebuild();$('status').textContent='地形已编辑 · 海岸与下降水系已更新'}
c.onpointerdown=e=>{drag=point(e);c.setPointerCapture(e.pointerId);if($('tool').value!=='pan')brush(drag)};c.onpointermove=e=>{if(!drag)return;let p=point(e);if($('tool').value==='pan'){ox+=p.x-drag.x;oy+=p.y-drag.y;draw()}else brush(p);drag=p};c.onpointerup=c.onpointercancel=()=>drag=null;function zoomAt(f,p={x:viewW/2,y:viewH/2}){let z=Math.max(.15,Math.min(4,zoom*f));ox=p.x-(p.x-ox)*z/zoom;oy=p.y-(p.y-oy)*z/zoom;zoom=z;draw()}c.onwheel=e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,point(e))};$('in').onclick=()=>zoomAt(1.25);$('out').onclick=()=>zoomAt(.8);$('fit').onclick=fit;$('generate').onclick=generate;$('sea').oninput=()=>{$('seaVal').value=$('sea').value+'%';sea=+$('sea').value/100;rebuild()};$('rough').oninput=()=>{$('roughVal').value=$('rough').value+'%';generate()};$('labels').onchange=()=>{paint();draw()};$('reset').onclick=()=>{$('seed').value='远境-024';$('sea').value=40;$('rough').value=55;$('seaVal').value='40%';$('roughVal').value='55%';$('tool').value='pan';$('brush').value=7;$('labels').checked=true;generate();fit()};$('export').onclick=()=>{let link=document.createElement('a');link.download='远境地图.png';link.href=atlas.toDataURL('image/png');link.click();$('status').textContent='PNG 已导出 · 包含完整的当前地图'};window.onresize=resize;resize();generate();
</script></html>
