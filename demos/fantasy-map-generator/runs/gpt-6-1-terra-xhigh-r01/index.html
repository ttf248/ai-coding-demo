<!doctype html><html lang="zh-CN"><head><script src="../../../../assets/analytics.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奇幻地图生成器</title><style>
*{box-sizing:border-box}body{margin:0;background:#e6dcc1;color:#3d382c;font:15px/1.5 Georgia,'Microsoft Yahei',serif}main{max-width:1260px;margin:auto;padding:24px}h1{font-size:clamp(28px,4vw,46px);margin:0}p{margin:8px 0;color:#756849}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}.card{background:#f6efd9;border:1px solid #c8b993;border-radius:9px;padding:17px;box-shadow:0 5px 20px #5c4d2d18}label{display:block;margin:14px 0 4px;font-weight:bold}input[type=text],select{width:100%;padding:9px;border:1px solid #bdaa80;background:#fff9e9;border-radius:5px;font:inherit}input[type=range]{width:100%;accent-color:#587b68}button{background:#496d5b;color:#fffbea;border:0;border-radius:5px;padding:9px 13px;font:inherit;cursor:pointer;margin:6px 4px 0 0}button.secondary{background:#e1d4b2;color:#4a402d}button.active{outline:3px solid #c28a42}.canvas-wrap{overflow:hidden;border:7px solid #b8a77d;background:#87adad;position:relative;touch-action:none}canvas{width:100%;display:block;touch-action:none;aspect-ratio:4/3}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin:10px 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.hint{font-size:13px}.toolbar{display:flex;flex-wrap:wrap;align-items:center}@media(max-width:700px){main{padding:12px}.layout{grid-template-columns:1fr}.card{padding:12px}h1{font-size:29px}}
</style></head><body><main><header><small>ATELIER CARTOGRAPHIQUE · 01</small><h1>奇幻地图生成器</h1><p>为一座尚未命名的岛屿，绘制山川与故事。</p></header><div class="layout"><aside class="card"><label for="seed">世界种子</label><input id="seed" type="text" value="青岚群岛"><label for="sea">海平面 <span id="seaValue"></span></label><input id="sea" type="range" min="25" max="65" value="45"><label for="rough">地形粗糙度 <span id="roughValue"></span></label><input id="rough" type="range" min="0" max="100" value="45"><button id="generate">生成地图</button><button class="secondary" id="reset">重置</button><hr><label>工具</label><div class="toolbar"><button data-mode="pan" class="active">平移</button><button data-mode="raise" class="secondary">升高</button><button data-mode="lower" class="secondary">降低</button></div><label for="size">画笔大小</label><input id="size" type="range" min="1" max="10" value="4"><label><input type="checkbox" id="towns" checked> 显示城镇标签</label><div class="toolbar"><button id="zoomOut" class="secondary">− 缩小</button><button id="zoomIn" class="secondary">＋ 放大</button><button id="export">导出 PNG</button></div><p class="hint">拖动平移或绘制，滚轮缩放；触屏可拖动。河流沿相邻低地向海洋或内陆湖泊流动，编辑地形后自动重算。</p></aside><section class="card"><div class="legend"><span><i style="background:#87adad"></i>海洋</span><span><i style="background:#e5d39b"></i>海岸</span><span><i style="background:#b0bd82"></i>平原</span><span><i style="background:#648268"></i>森林</span><span><i style="background:#827b69"></i>山脉</span><span><i style="background:#4f90a0"></i>河流</span></div><div class="canvas-wrap"><canvas id="map" width="960" height="720" aria-label="岛屿地图"></canvas></div><p id="status" class="hint" aria-live="polite">地图已生成。</p></section></div></main><script>
const $=id=>document.getElementById(id),canvas=$('map'),ctx=canvas.getContext('2d'),W=120,H=90,S=8;let heights=new Float32Array(W*H),rivers=[],towns=[],mode='pan',zoom=1,ox=0,oy=0,drag=null,dirty=false;const terrain=document.createElement('canvas');terrain.width=W;terrain.height=H;const tc=terrain.getContext('2d');
function seedHash(s){let h=2166136261;for(let c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}function noise(x,y,seed){let n=Math.imul(x,374761393)+Math.imul(y,668265263)+seed;n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295}function smooth(x,y,scale,seed){let a=x/scale,b=y/scale,ix=Math.floor(a),iy=Math.floor(b),fx=a-ix,fy=b-iy;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);let p=noise(ix,iy,seed)*(1-fx)+noise(ix+1,iy,seed)*fx,q=noise(ix,iy+1,seed)*(1-fx)+noise(ix+1,iy+1,seed)*fx;return p*(1-fy)+q*fy}function sea(){return Number($('sea').value)/100}
function generate(){const seed=seedHash($('seed').value),rough=Number($('rough').value)/100;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let dx=(x-W/2)/(W*.48),dy=(y-H/2)/(H*.47),edge=Math.sqrt(dx*dx+dy*dy);let n=.55*smooth(x,y,38,seed)+.28*smooth(x,y,16,seed+5)+(.05+.2*rough)*smooth(x,y,5,seed+17);heights[y*W+x]=n+.40-Math.pow(edge,1.55)*.53}ox=oy=0;zoom=1;rebuild();$('status').textContent='地图已生成：'+$('seed').value}
function rebuild(){let level=sea(),im=tc.createImageData(W,H);for(let i=0;i<heights.length;i++){let h=heights[i],c=h<level?[135,173,173]:h<level+.035?[229,211,155]:h<level+.16?[176,189,130]:h<level+.28?[100,130,104]:[130,123,105];let shade=Math.round((noise(i%W,Math.floor(i/W),47)-.5)*12);for(let j=0;j<3;j++)im.data[i*4+j]=c[j]+shade;im.data[i*4+3]=255}tc.putImageData(im,0,0);rivers=[];let candidates=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){let i=y*W+x;if(heights[i]>level+.22&&noise(x,y,seedHash($('seed').value)+33)>.995)candidates.push(i)}candidates.sort((a,b)=>heights[b]-heights[a]);for(let source of candidates.slice(0,18)){let path=[source],seen=new Set(path),cur=source;for(let n=0;n<250&&heights[cur]>=level;n++){let x=cur%W,y=Math.floor(cur/W),best=-1,bh=heights[cur];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;let xx=x+dx,yy=y+dy;if(xx<0||xx>=W||yy<0||yy>=H)continue;let j=yy*W+xx;if(heights[j]<bh&&!seen.has(j)){best=j;bh=heights[j]}}if(best<0)break;cur=best;seen.add(cur);path.push(cur)}if(path.length>4)rivers.push(path)}towns=[];for(let i=0;i<W*H;i++){let h=heights[i];if(h>level+.04&&h<level+.17&&noise(i%W,Math.floor(i/W),seedHash($('seed').value)+55)>.998)towns.push(i)}towns=towns.slice(0,9);draw()}
function draw(){ctx.clearRect(0,0,960,720);ctx.fillStyle='#87adad';ctx.fillRect(0,0,960,720);ctx.save();ctx.translate(ox,oy);ctx.scale(zoom,zoom);ctx.imageSmoothingEnabled=false;ctx.drawImage(terrain,0,0,960,720);ctx.lineWidth=2/zoom+1;ctx.strokeStyle='#4f90a0';ctx.lineJoin='round';for(let path of rivers){ctx.beginPath();path.forEach((i,k)=>{let x=(i%W+.5)*S,y=(Math.floor(i/W)+.5)*S;k?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();let end=path[path.length-1];if(heights[end]>=sea()){ctx.fillStyle='#6fa5ad';ctx.beginPath();ctx.ellipse((end%W+.5)*S,(Math.floor(end/W)+.5)*S,5,4,0,0,Math.PI*2);ctx.fill()}}if($('towns').checked){ctx.fillStyle='#583d2e';ctx.font='bold 13px Georgia';towns.forEach((i,k)=>{let x=(i%W+.5)*S,y=(Math.floor(i/W)+.5)*S;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();ctx.fillText(['雾港','橡木镇','星湾','北境','青石','白塔','林谷','月湖','风岬'][k],x+6,y-4)})}ctx.restore()}
function point(e){let r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*960/r.width,y:(e.clientY-r.top)*720/r.height}}function brush(p){let x=(p.x-ox)/zoom/S,y=(p.y-oy)/zoom/S,r=Number($('size').value);for(let yy=Math.max(0,Math.floor(y-r));yy<=Math.min(H-1,Math.ceil(y+r));yy++)for(let xx=Math.max(0,Math.floor(x-r));xx<=Math.min(W-1,Math.ceil(x+r));xx++){let d=Math.hypot(xx-x,yy-y);if(d<r){let i=yy*W+xx;heights[i]=Math.max(0,Math.min(1,heights[i]+(mode==='raise'?1:-1)*.018*(1-d/r)))}}rebuild();dirty=true}
canvas.onpointerdown=e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drag=point(e);if(mode!=='pan')brush(drag)};canvas.onpointermove=e=>{if(!drag)return;let p=point(e);if(mode==='pan'){ox+=p.x-drag.x;oy+=p.y-drag.y;draw()}else brush(p);drag=p};canvas.onpointerup=canvas.onpointercancel=()=>{drag=null;if(dirty){$('status').textContent='地形已编辑，海岸和河流已更新。';dirty=false}};function changeZoom(f,p={x:480,y:360}){let z=Math.max(.6,Math.min(4,zoom*f));ox=p.x-(p.x-ox)*z/zoom;oy=p.y-(p.y-oy)*z/zoom;zoom=z;draw()}canvas.onwheel=e=>{e.preventDefault();changeZoom(e.deltaY<0?1.15:1/1.15,point(e))};$('zoomIn').onclick=()=>changeZoom(1.25);$('zoomOut').onclick=()=>changeZoom(.8);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b))});$('generate').onclick=generate;$('reset').onclick=()=>{$('seed').value='青岚群岛';$('sea').value=45;$('rough').value=45;$('size').value=4;$('towns').checked=true;labels();generate()};$('towns').onchange=draw;$('export').onclick=()=>{let a=document.createElement('a');a.download='fantasy-map.png';a.href=canvas.toDataURL('image/png');a.click()};function labels(){$('seaValue').textContent=$('sea').value+'%';$('roughValue').textContent=$('rough').value+'%'}$('sea').oninput=()=>{labels();rebuild()};$('rough').oninput=()=>{labels();generate()};labels();generate();
</script></body></html>
