<!doctype html>
<html lang="zh-CN"><head>
<script src="../../../../assets/analytics.js" defer></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寻路算法实验室</title><style>
:root{--ink:#202d4a;--paper:#eef1f6;--panel:#fff;--line:#d2d9d2;--accent:#284fc0;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,"Segoe UI","Microsoft YaHei",sans-serif}main,header>div{width:min(1344px,94%);margin:auto}header{border-bottom:1px solid var(--line)}header>div,.row,.bar,.readout{display:flex;align-items:center;gap:10px}header>div{height:57px;justify-content:space-between}header strong{display:flex;align-items:center;gap:9px;font-size:15px}.mark{width:20px;height:20px;background:var(--accent);border-radius:4px;display:inline-grid;place-items:center;color:var(--paper);font:bold 14px monospace}.mono,.eyebrow,output,.metrics b{font-family:"IBM Plex Mono",Consolas,monospace;font-variant-numeric:tabular-nums}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:700}.intro{display:flex;align-items:end;justify-content:space-between;gap:18px;padding:30px 0 23px}.intro h1{font-size:clamp(31px,4vw,52px);line-height:1.14;letter-spacing:-.045em;margin:5px 0 8px}.intro p,.hint{color:color-mix(in srgb,var(--ink) 70%,var(--paper));margin:0;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 283px;gap:16px;align-items:start}.stage,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;min-width:0}.panel{padding:19px}.panel h2,.bar h2{font-size:15px;letter-spacing:.01em;margin:0}.panel h3{font-size:13px;margin:16px 0 8px}.panel section+section{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.bar{padding:12px 16px;justify-content:space-between;border-bottom:1px solid var(--line);flex-wrap:wrap}.bar small{opacity:.72}.bar.foot{border-bottom:0;border-top:1px solid var(--line)}.row{flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}button,select,input{font:inherit;color:inherit}button,select,input[type=text],input[type=number]{border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:8px 11px;font-size:13px;min-height:37px}button{cursor:pointer;font-weight:600}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.45;cursor:default}button.primary,button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}.field{display:grid;gap:5px;margin:12px 0}.field>span{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600}input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0}.metrics{padding:12px 17px;display:flex;gap:23px;flex-wrap:wrap}.metrics span{font-size:12px}.metrics b{display:block;font-size:21px}.legend{display:flex;flex-wrap:wrap;gap:6px 15px;font-size:12px}.key{display:inline-block;vertical-align:middle;width:10px;height:10px;margin-right:5px;border-radius:2px}.work{width:100%;display:block;touch-action:none}.below{margin:14px 0 30px}select,input{max-width:100%}dialog{color:var(--ink)}@media(max-width:840px){.layout{grid-template-columns:minmax(0,1fr) 236px}.panel{padding:13px}}@media(max-width:720px){main,header>div{width:min(94%,560px)}.layout{grid-template-columns:minmax(0,1fr)}.intro{padding:17px 0 15px;align-items:start;flex-wrap:wrap}.intro h1{font-size:34px}.panel{padding:16px}.metrics{gap:14px}.bar{padding:9px 12px}header>div{height:46px}}#map{background:#e6eaf2;aspect-ratio:1.6}#legend{justify-content:flex-start}#tools button{font-weight:500}
</style></head><body><header><div><strong><i class="mark" aria-hidden="true">∿</i>格间研究室</strong><span class="eyebrow">GRID SEARCH</span></div></header><main><div class="intro"><div><h1>寻路算法实验室</h1><p>在同一张地图上比较最短步数与最低代价。</p></div><div class="row"><button id="clear">清除搜索</button><button id="reset">重置地图</button></div></div><div class="layout"><article class="stage"><div class="bar"><h2 id="mapName">峡谷通道</h2><small id="state" role="status">待运行</small></div>
<canvas id="map" class="work" width="900" height="560" aria-label="可编辑的四方向寻路网格"></canvas>
<div class="bar foot legend" id="legend"></div><div class="metrics"><span>已访问<b id="visited">0</b></span><span>搜索前沿<b id="front">0</b></span><span>路径步数<b id="steps">—</b></span><span>总代价<b id="cost">—</b></span></div></article><aside class="panel"><section><h2>搜索设置</h2><label class="field"><span>算法</span><select id="algorithm"><option value="astar">A* · 曼哈顿距离</option><option value="dijkstra">Dijkstra · 最低代价</option><option value="bfs">BFS · 最少步数</option></select></label><label class="field"><span>速度 <output id="rate"></output></span><input id="speed" type="range" min="2" max="120" value="38"></label><div class="row"><button class="primary" id="run">运行</button><button id="pause">暂停</button><button id="step">单步</button></div></section>
<section><h2>地图编辑</h2><label class="field"><span>预设地图</span><select id="preset"><option value="canyon">峡谷通道</option><option value="weight">加权捷径</option><option value="empty">空白网格</option><option value="closed">封闭终点</option></select></label><div class="grid2" id="tools"><button data-tool="wall">绘制障碍</button><button data-tool="weight">高代价地形</button><button data-tool="erase">橡皮擦</button><button data-tool="start">设置起点</button><button data-tool="end">设置终点</button></div></section>
<section><p class="hint">拖动 S 或 E 可移动端点。BFS 按步数搜索，Dijkstra 与 A* 按代价搜索。进入普通格消耗 1，高代价格消耗 5，起点消耗 0。</p></section></aside></div><div class="below"></div></main><script>
"use strict";
const $=id=>document.getElementById(id);
const cols=23,rows=15,N=cols*rows,grid=new Uint8Array(N);
const palette={wall:'#34445c',weight:'#e5b572',front:'#86cfbd',seen:'#b1c8ed',path:'#ffd66e'};
let start,end,tool='wall',search=null,playing=false,paint=null,lastTime=0,credit=0,animation=0;
const idx=(x,y)=>y*cols+x,xy=i=>[i%cols,Math.floor(i/cols)];
function neighbors(i){const [x,y]=xy(i);return [x+1<cols?i+1:-1,y+1<rows?i+cols:-1,x>0?i-1:-1,y>0?i-cols:-1].filter(v=>v>=0);}
function distance(a,b){const [x,y]=xy(a),[u,v]=xy(b);return Math.abs(x-u)+Math.abs(y-v);}
function preset(){
  const kind=$('preset').value;grid.fill(0);start=idx(2,7);end=idx(20,7);
  if(kind==='canyon'){
    for(let x=3;x<21;x++)for(let y=0;y<rows;y++){
      const center=6+Math.sin(x*.57)*2;
      if(Math.abs(y-center)<1.65)grid[idx(x,y)]=2;
      if((x===6&&y!==4&&y!==10&&y<13)||(x===13&&y>2&&y!==9)||(x===17&&y>4&&y<11&&y!==6))grid[idx(x,y)]=1;
    }
  }else if(kind==='weight'){for(let x=6;x<=16;x++)grid[idx(x,7)]=2;}
  else if(kind==='closed'){for(const i of neighbors(end))grid[i]=1;}
  $('mapName').textContent=$('preset').selectedOptions[0].textContent;clearSearch();
}
function clearSearch(){cancelAnimationFrame(animation);playing=false;search=null;lastTime=0;credit=0;$('state').textContent='待运行';draw();}
function begin(){
  const dist=new Float64Array(N);dist.fill(Infinity);dist[start]=0;
  const prev=new Int32Array(N);prev.fill(-1);
  search={alg:$('algorithm').value,dist,prev,open:new Set([start]),seen:new Set(),path:[],done:false};
}
function step(){
  if(!search)begin();const s=search;if(s.done)return;
  if(!s.open.size){s.done=true;playing=false;$('state').textContent='终点不可达';return;}
  let next=null,best=Infinity;
  for(const p of s.open){
    const priority=s.dist[p]+(s.alg==='astar'?distance(p,end):0);
    if(priority<best){best=priority;next=p;}
    if(s.alg==='bfs')break;
  }
  s.open.delete(next);s.seen.add(next);
  if(next===end){
    let p=end;while(p!==-1){s.path.push(p);p=s.prev[p];}
    s.path.reverse();s.done=true;playing=false;$('state').textContent='已找到路径';return;
  }
  for(const k of neighbors(next)){
    if(grid[k]===1||s.seen.has(k))continue;
    const d=s.dist[next]+(s.alg==='bfs'||grid[k]!==2?1:5);
    if(d>=s.dist[k])continue;s.dist[k]=d;s.prev[k]=next;s.open.add(k);
  }
}
const canvas=$('map'),ctx=canvas.getContext('2d');
const unit=32, margin=16,W=cols*unit+margin*2,H=rows*unit+margin*2;
canvas.style.aspectRatio=W+'/'+H;
function draw(){
  const dpr=Math.min(devicePixelRatio||1,2),scale=Math.max(.1,canvas.clientWidth/W);
  const w=Math.round(W*scale*dpr),h=Math.round(H*scale*dpr);
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
  ctx.setTransform(w/W,0,0,h/H,0,0);ctx.fillStyle='#e7ebf1';ctx.fillRect(0,0,W,H);
  const s=search;
  for(let i=0;i<N;i++){
    const [x,y]=xy(i),l=margin+x*unit,t=margin+y*unit;
    ctx.fillStyle=grid[i]===1?palette.wall:grid[i]===2?palette.weight:'#f9fbfc';ctx.fillRect(l+1,t+1,unit-2,unit-2);
    if(grid[i]===1){ctx.fillStyle='#435573';ctx.fillRect(l+3,t+3,unit-6,3);}
    if(s?.seen.has(i)||s?.open.has(i)){ctx.fillStyle=s.seen.has(i)?palette.seen:palette.front;ctx.fillRect(l+3,t+3,unit-6,unit-6);}
    if(grid[i]===2){ctx.strokeStyle='#9d7439';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(l+8,t+20);ctx.lineTo(l+13,t+15);ctx.lineTo(l+17,t+18);ctx.lineTo(l+23,t+12);ctx.stroke();}
  }
  function center(i){const [x,y]=xy(i);return [margin+(x+.5)*unit,margin+(y+.5)*unit];}
  if(s?.path.length){ctx.beginPath();s.path.forEach((i,k)=>{const [x,y]=center(i);if(k)ctx.lineTo(x,y);else ctx.moveTo(x,y);});ctx.lineWidth=8;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#a56b17';ctx.stroke();ctx.lineWidth=4.5;ctx.strokeStyle=palette.path;ctx.stroke();}
  for(const [i,letter,color] of [[start,'S','#247d64'],[end,'E','#b04d3a']]){
    const [x,y]=center(i);ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 16px Consolas, monospace';ctx.fillText(letter,x,y+5);
  }
  $('visited').textContent=s?.seen.size??0;$('front').textContent=s?.open.size??0;
  $('steps').textContent=s?.path.length?s.path.length-1:'—';$('cost').textContent=s?.path.length?s.path.slice(1).reduce((v,i)=>v+(grid[i]===2?5:1),0):'—';
  $('pause').disabled=!playing;$('step').disabled=!!s?.done||playing;$('run').disabled=playing;
}
function cell(e){const box=canvas.getBoundingClientRect(),x=Math.floor(((e.clientX-box.left)*W/box.width-margin)/unit),y=Math.floor(((e.clientY-box.top)*H/box.height-margin)/unit);return x<0||y<0||x>=cols||y>=rows?-1:idx(x,y);}
function edit(i){if(i<0)return;
  if(paint==='start'||paint==='end'){
    if(i===(paint==='start'?end:start))return;
    if(paint==='start')start=i;else end=i;grid[i]=0;
  }else if(i!==start&&i!==end)grid[i]=paint==='wall'?1:paint==='weight'?2:0;
  draw();
}
canvas.onpointerdown=e=>{const i=cell(e);if(i<0)return;clearSearch();paint=i===start?'start':i===end?'end':tool;canvas.setPointerCapture(e.pointerId);edit(i);};
canvas.onpointermove=e=>{if(paint)edit(cell(e));};canvas.onpointerup=canvas.onpointercancel=()=>paint=null;
function selectTool(t){tool=t;for(const b of $('tools').children)b.setAttribute('aria-pressed',b.dataset.tool===t);}
$('tools').onclick=e=>{if(e.target.dataset.tool)selectTool(e.target.dataset.tool);};
$('run').onclick=()=>{if(!search||search.done)begin();playing=true;lastTime=0;credit=1;$('state').textContent='搜索中';draw();animation=requestAnimationFrame(tick);};
function tick(t){if(!playing)return;if(lastTime)credit+=Math.min(100,t-lastTime)/1000*Number($('speed').value);lastTime=t;
  while(credit>=1&&playing){step();credit--;}draw();if(playing)animation=requestAnimationFrame(tick);}
$('step').onclick=()=>{if(search?.done)return;playing=false;$('state').textContent='单步搜索';step();draw();};
$('pause').onclick=()=>{cancelAnimationFrame(animation);playing=false;$('state').textContent='已暂停';draw();};
$('speed').oninput=()=>$('rate').value=$('speed').value+' 格/秒';
$('algorithm').onchange=$('clear').onclick=clearSearch;$('reset').onclick=$('preset').onchange=preset;
$('legend').innerHTML=[['wall','障碍'],['weight','高代价 ×5'],['front','搜索前沿'],['seen','已访问'],['path','最终路径']].map(([k,v])=>'<span><i class="key" style="background:'+palette[k]+'"></i>'+v+'</span>').join('');
selectTool('wall');$('speed').oninput();preset();new ResizeObserver(draw).observe(canvas);
</script></body></html>
