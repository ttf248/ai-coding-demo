<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寻路算法实验室</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; overflow-x: hidden; }
.header { text-align: center; padding: 20px; background: #16213e; border-bottom: 1px solid #0f3460; }
.header h1 { font-size: 1.5rem; color: #4ecdc4; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; padding: 15px; justify-content: center; background: #16213e; align-items: center; }
.controls button, .controls select { padding: 8px 16px; border: 1px solid #0f3460; border-radius: 6px; background: #1a1a2e; color: #e0e0e0; font-size: 0.9rem; cursor: pointer; }
.controls button:hover { background: #0f3460; }
.controls button.active { background: #4ecdc4; color: #1a1a2e; }
.canvas-container { position: relative; width: 100%; height: 500px; background: #0a0a1a; border: 2px solid #0f3460; margin: 15px; border-radius: 8px; overflow: hidden; }
#gridCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
.info { padding: 15px; background: #16213e; margin: 0 15px 15px; border-radius: 8px; border: 1px solid #0f3460; }
.info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.info-item { background: #1a1a2e; padding: 10px; border-radius: 6px; }
.info-item .label { font-size: 0.8rem; color: #888; }
.info-item .value { font-size: 1.1rem; color: #4ecdc4; font-weight: bold; }
@media (max-width: 768px) { .canvas-container { height: 350px; } }
</style>
</head>
<body>
<div class="header"><h1>网格寻路算法实验室</h1></div>
<div class="controls">
  <select id="algorithm">
    <option value="bfs">BFS (广度优先)</option>
    <option value="dijkstra">Dijkstra</option>
    <option value="astar">A* (曼哈顿距离)</option>
  </select>
  <button onclick="setMode('wall')" id="btnWall" class="active">绘制障碍</button>
  <button onclick="setMode('erase')" id="btnErase">擦除</button>
  <button onclick="setMode('cost')" id="btnCost">高代价地形</button>
  <button onclick="setMode('start')" id="btnStart">设置起点</button>
  <button onclick="setMode('end')" id="btnEnd">设置终点</button>
  <button onclick="startSearch()">运行</button>
  <button onclick="pauseSearch()" id="pauseBtn">暂停</button>
  <button onclick="stepSearch()">单步</button>
  <button onclick="clearSearch()">清除搜索</button>
  <button onclick="resetMap()">重置地图</button>
  <button onclick="loadPreset('maze')">迷宫预设</button>
  <button onclick="loadPreset('open')">开阔预设</button>
  <label>速度: <input type="range" id="speed" min="1" max="100" value="50" style="width:80px"></label>
</div>
<div class="canvas-container"><canvas id="gridCanvas"></canvas></div>
<div class="info">
  <div class="info-grid">
    <div class="info-item"><div class="label">算法</div><div class="value" id="infoAlgo">BFS</div></div>
    <div class="info-item"><div class="label">路径步数</div><div class="value" id="infoSteps">-</div></div>
    <div class="info-item"><div class="label">总代价</div><div class="value" id="infoCost">-</div></div>
    <div class="info-item"><div class="label">已访问节点</div><div class="value" id="infoVisited">-</div></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gridCanvas');
const ctx = canvas.getContext('2d');
const GRID_SIZE = 30;
let grid = [];
let start = { x: 2, y: 2 };
let end = { x: GRID_SIZE-3, y: GRID_SIZE-3 };
let mode = 'wall';
let searchState = null;
let paused = false;
let searchSpeed = 50;

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * devicePixelRatio;
  canvas.height = rect.height * devicePixelRatio;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.scale(devicePixelRatio, devicePixelRatio);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function initGrid() {
  grid = [];
  for (let y = 0; y < GRID_SIZE; y++) {
    grid[y] = [];
    for (let x = 0; x < GRID_SIZE; x++) {
      grid[y][x] = { wall: false, cost: 1, visited: false, path: false, frontier: false };
    }
  }
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
  const btnMap = { wall: 'btnWall', erase: 'btnErase', cost: 'btnCost', start: 'btnStart', end: 'btnEnd' };
  if (btnMap[m]) document.getElementById(btnMap[m]).classList.add('active');
}

function getMousePos(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  const x = Math.floor((touch.clientX - rect.left) / rect.width * GRID_SIZE);
  const y = Math.floor((touch.clientY - rect.top) / rect.height * GRID_SIZE);
  return { x: Math.max(0, Math.min(GRID_SIZE-1, x)), y: Math.max(0, Math.min(GRID_SIZE-1, y)) };
}

let isDrawing = false;
canvas.addEventListener('mousedown', e => { isDrawing = true; handleDraw(e); });
canvas.addEventListener('mousemove', e => { if (isDrawing) handleDraw(e); });
canvas.addEventListener('mouseup', () => isDrawing = false);
canvas.addEventListener('touchstart', e => { e.preventDefault(); isDrawing = true; handleDraw(e); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); if (isDrawing) handleDraw(e); }, { passive: false });
canvas.addEventListener('touchend', () => isDrawing = false);

function handleDraw(e) {
  if (searchState) clearSearch();
  const pos = getMousePos(e);
  if (mode === 'wall') {
    if (pos.x !== start.x || pos.y !== start.y) {
      if (pos.x !== end.x || pos.y !== end.y) grid[pos.y][pos.x].wall = !grid[pos.y][pos.x].wall;
    }
  } else if (mode === 'erase') {
    grid[pos.y][pos.x].wall = false;
    grid[pos.y][pos.x].cost = 1;
  } else if (mode === 'cost') {
    if (!grid[pos.y][pos.x].wall) grid[pos.y][pos.x].cost = grid[pos.y][pos.x].cost === 5 ? 1 : 5;
  } else if (mode === 'start') {
    if (!grid[pos.y][pos.x].wall && (pos.x !== end.x || pos.y !== end.y)) start = pos;
  } else if (mode === 'end') {
    if (!grid[pos.y][pos.x].wall && (pos.x !== start.x || pos.y !== start.y)) end = pos;
  }
  draw();
}

function draw() {
  const w = canvas.width / devicePixelRatio;
  const h = canvas.height / devicePixelRatio;
  ctx.clearRect(0, 0, w, h);
  const cellW = w / GRID_SIZE, cellH = h / GRID_SIZE;
  
  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      const cell = grid[y][x];
      let color = '#1a1a2e';
      if (cell.wall) color = '#4a4a6a';
      else if (cell.cost === 5) color = '#2a2a4e';
      if (cell.visited) color = '#1a3a5e';
      if (cell.frontier) color = '#2a5a8e';
      if (cell.path) color = '#4ecdc4';
      ctx.fillStyle = color;
      ctx.fillRect(x * cellW, y * cellH, cellW, cellH);
    }
  }
  
  // Draw start and end
  ctx.fillStyle = '#4ecdc4';
  ctx.fillRect(start.x * cellW, start.y * cellH, cellW, cellH);
  ctx.fillStyle = '#e94560';
  ctx.fillRect(end.x * cellW, end.y * cellH, cellW, cellH);
  
  // Grid lines
  ctx.strokeStyle = '#0f3460';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= GRID_SIZE; i++) {
    ctx.beginPath(); ctx.moveTo(i * cellW, 0); ctx.lineTo(i * cellW, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * cellH); ctx.lineTo(w, i * cellH); ctx.stroke();
  }
}

function startSearch() {
  clearSearch();
  const algo = document.getElementById('algorithm').value;
  document.getElementById('infoAlgo').textContent = algo.toUpperCase();
  
  const queue = [{ x: start.x, y: start.y, cost: 0, steps: 0, path: [] }];
  const visited = new Set();
  visited.add(start.x + ',' + start.y);
  
  searchState = { queue, visited, found: false, path: null, visitedCount: 0 };
  
  if (algo === 'bfs') bfsStep();
  else if (algo === 'dijkstra') dijkstraStep();
  else if (algo === 'astar') astarStep();
}

function getNeighbors(x, y) {
  const dirs = [[0,1],[1,0],[0,-1],[-1,0]];
  return dirs.map(d => ({ x: x + d[0], y: y + d[1] }))
    .filter(p => p.x >= 0 && p.x < GRID_SIZE && p.y >= 0 && p.y < GRID_SIZE && !grid[p.y][p.x].wall);
}

function bfsStep() {
  if (!searchState || searchState.found || searchState.queue.length === 0) {
    if (searchState && !searchState.found) document.getElementById('infoSteps').textContent = '不可达';
    return;
  }
  const current = searchState.queue.shift();
  grid[current.y][current.x].visited = true;
  searchState.visitedCount++;
  
  if (current.x === end.x && current.y === end.y) {
    searchState.found = true;
    searchState.path = current.path;
    for (const p of current.path) grid[p.y][p.x].path = true;
    document.getElementById('infoSteps').textContent = current.steps;
    document.getElementById('infoCost').textContent = current.steps;
    document.getElementById('infoVisited').textContent = searchState.visitedCount;
    draw();
    return;
  }
  
  for (const n of getNeighbors(current.x, current.y)) {
    const key = n.x + ',' + n.y;
    if (!searchState.visited.has(key)) {
      searchState.visited.add(key);
      grid[n.y][n.x].frontier = true;
      searchState.queue.push({ x: n.x, y: n.y, cost: 0, steps: current.steps + 1, path: [...current.path, { x: n.x, y: n.y }] });
    }
  }
  
  document.getElementById('infoVisited').textContent = searchState.visitedCount;
  draw();
  if (!paused) setTimeout(bfsStep, 101 - searchSpeed);
}

function dijkstraStep() {
  if (!searchState || searchState.found || searchState.queue.length === 0) {
    if (searchState && !searchState.found) document.getElementById('infoSteps').textContent = '不可达';
    return;
  }
  searchState.queue.sort((a, b) => a.cost - b.cost);
  const current = searchState.queue.shift();
  grid[current.y][current.x].visited = true;
  searchState.visitedCount++;
  
  if (current.x === end.x && current.y === end.y) {
    searchState.found = true;
    searchState.path = current.path;
    for (const p of current.path) grid[p.y][p.x].path = true;
    document.getElementById('infoSteps').textContent = current.steps;
    document.getElementById('infoCost').textContent = current.cost;
    document.getElementById('infoVisited').textContent = searchState.visitedCount;
    draw();
    return;
  }
  
  for (const n of getNeighbors(current.x, current.y)) {
    const key = n.x + ',' + n.y;
    if (!searchState.visited.has(key)) {
      searchState.visited.add(key);
      grid[n.y][n.x].frontier = true;
      searchState.queue.push({ x: n.x, y: n.y, cost: current.cost + grid[n.y][n.x].cost, steps: current.steps + 1, path: [...current.path, { x: n.x, y: n.y }] });
    }
  }
  
  document.getElementById('infoVisited').textContent = searchState.visitedCount;
  draw();
  if (!paused) setTimeout(dijkstraStep, 101 - searchSpeed);
}

function astarStep() {
  if (!searchState || searchState.found || searchState.queue.length === 0) {
    if (searchState && !searchState.found) document.getElementById('infoSteps').textContent = '不可达';
    return;
  }
  searchState.queue.sort((a, b) => (a.cost + Math.abs(a.x - end.x) + Math.abs(a.y - end.y)) - (b.cost + Math.abs(b.x - end.x) + Math.abs(b.y - end.y)));
  const current = searchState.queue.shift();
  grid[current.y][current.x].visited = true;
  searchState.visitedCount++;
  
  if (current.x === end.x && current.y === end.y) {
    searchState.found = true;
    searchState.path = current.path;
    for (const p of current.path) grid[p.y][p.x].path = true;
    document.getElementById('infoSteps').textContent = current.steps;
    document.getElementById('infoCost').textContent = current.cost;
    document.getElementById('infoVisited').textContent = searchState.visitedCount;
    draw();
    return;
  }
  
  for (const n of getNeighbors(current.x, current.y)) {
    const key = n.x + ',' + n.y;
    if (!searchState.visited.has(key)) {
      searchState.visited.add(key);
      grid[n.y][n.x].frontier = true;
      searchState.queue.push({ x: n.x, y: n.y, cost: current.cost + grid[n.y][n.x].cost, steps: current.steps + 1, path: [...current.path, { x: n.x, y: n.y }] });
    }
  }
  
  document.getElementById('infoVisited').textContent = searchState.visitedCount;
  draw();
  if (!paused) setTimeout(astarStep, 101 - searchSpeed);
}

function pauseSearch() {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '继续' : '暂停';
  if (!paused) {
    const algo = document.getElementById('algorithm').value;
    if (algo === 'bfs') bfsStep();
    else if (algo === 'dijkstra') dijkstraStep();
    else if (algo === 'astar') astarStep();
  }
}

function stepSearch() {
  paused = true;
  document.getElementById('pauseBtn').textContent = '继续';
  const algo = document.getElementById('algorithm').value;
  if (algo === 'bfs') bfsStep();
  else if (algo === 'dijkstra') dijkstraStep();
  else if (algo === 'astar') astarStep();
}

function clearSearch() {
  searchState = null;
  paused = false;
  document.getElementById('pauseBtn').textContent = '暂停';
  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      grid[y][x].visited = false;
      grid[y][x].path = false;
      grid[y][x].frontier = false;
    }
  }
  document.getElementById('infoSteps').textContent = '-';
  document.getElementById('infoCost').textContent = '-';
  document.getElementById('infoVisited').textContent = '-';
  draw();
}

function resetMap() {
  clearSearch();
  initGrid();
  start = { x: 2, y: 2 };
  end = { x: GRID_SIZE-3, y: GRID_SIZE-3 };
  draw();
}

function loadPreset(type) {
  clearSearch();
  initGrid();
  if (type === 'maze') {
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        if (x % 2 === 0 && y % 2 === 0) grid[y][x].wall = true;
        if (Math.random() < 0.15) grid[y][x].wall = !grid[y][x].wall;
      }
    }
    grid[start.y][start.x].wall = false;
    grid[end.y][end.x].wall = false;
  } else if (type === 'open') {
    for (let i = 0; i < 20; i++) {
      const x = Math.floor(Math.random() * GRID_SIZE);
      const y = Math.floor(Math.random() * GRID_SIZE);
      if ((x !== start.x || y !== start.y) && (x !== end.x || y !== end.y)) {
        grid[y][x].cost = 5;
      }
    }
  }
  draw();
}

document.getElementById('speed').addEventListener('input', e => searchSpeed = parseInt(e.target.value));

// Initialize
initGrid();
draw();
</script>
</body>
</html>
