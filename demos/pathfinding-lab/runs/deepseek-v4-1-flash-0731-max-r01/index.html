<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寻路算法实验室 · BFS / Dijkstra / A*</title>
<style>
  :root{
    --bg:#10151d; --panel:#18202b; --panel-2:#1f2937; --line:#2c3a4a;
    --text:#e5edf5; --muted:#93a4b8; --accent:#4ea1ff;
    --visited:#2a5d8f; --frontier:#d9a441; --path:#ff4d6d;
    --wall:#0b0f14; --cost:#8a6c1f; --start:#36c286; --goal:#ff6b6b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;}
  body{min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 12px 26px;}
  header{width:100%; max-width:1180px; display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; margin-bottom:12px;}
  h1{font-size:clamp(18px,3.4vw,24px); font-weight:700; letter-spacing:.5px;}
  header .sub{color:var(--muted); font-size:13px;}
  .app{width:100%; max-width:1180px; display:grid; grid-template-columns:295px 1fr; gap:14px; align-items:start;}
  @media (max-width:820px){ .app{grid-template-columns:1fr;} .board{order:-1;} }
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 12px 14px;}
  .board{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; overflow:hidden;}
  canvas{display:block; width:100%; height:auto; border-radius:8px; background:#0d1219; touch-action:none; cursor:crosshair;}
  h2{font-size:12px; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin:12px 0 6px;}
  h2:first-child{margin-top:2px;}
  .row{display:flex; flex-wrap:wrap; gap:6px;}
  button{font:inherit; font-size:13px; color:var(--text); background:var(--panel-2);
    border:1px solid var(--line); border-radius:8px; padding:7px 10px; cursor:pointer; transition:.15s;}
  button:hover{border-color:#3d5c80; background:#243248;}
  button.primary{background:#1d4ed8; border-color:#2f63f7;}
  button.primary:hover{background:#2559e8;}
  button.warn{background:#5c2630; border-color:#7d3644;}
  button.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; background:#1d3350;}
  button:disabled{opacity:.45; cursor:not-allowed;}
  .tabs{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
  .tools{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
  .presets{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  label.speed{display:block; margin-top:6px; font-size:13px; color:var(--muted);}
  input[type=range]{width:100%; accent-color:var(--accent); margin-top:4px;}
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px;}
  .stat{background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:7px 9px;}
  .stat .k{font-size:11px; color:var(--muted);}
  .stat .v{font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:2px;}
  .status{grid-column:1 / -1;}
  .status .v{font-size:14px;}
  .status .v.ok{color:#5ee0a0;} .status .v.bad{color:#ff8a9b;} .status .v.run{color:#ffc861;}
  .legend{display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; font-size:12px; color:var(--muted); margin-top:8px;}
  .legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:-1px;}
  .note{font-size:12px; color:var(--muted); line-height:1.65; margin-top:8px;}
  .note b{color:var(--text);}
  .rules{font-size:12px; color:var(--muted); line-height:1.7; margin-top:8px; border-top:1px dashed var(--line); padding-top:8px;}
  .toast{position:absolute; left:50%; top:12px; transform:translateX(-50%);
    background:rgba(20,28,40,.94); border:1px solid var(--line); color:#ffd479;
    padding:7px 14px; border-radius:20px; font-size:13px; opacity:0; pointer-events:none; transition:.25s; white-space:nowrap;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <h1>寻路算法实验室</h1>
  <span class="sub">BFS 按步数搜索 · Dijkstra / A* 按地形代价搜索 · 四方向移动</span>
</header>

<div class="app">
  <aside class="panel">
    <h2>算法</h2>
    <div class="tabs" id="algoTabs">
      <button data-algo="bfs">BFS</button>
      <button data-algo="dijkstra">Dijkstra</button>
      <button data-algo="astar">A*</button>
    </div>

    <h2>控制</h2>
    <div class="row">
      <button id="btnRun" class="primary">▶ 运行</button>
      <button id="btnStep">⏭ 单步</button>
      <button id="btnClear">🧹 清除搜索</button>
      <button id="btnReset">♻ 重置地图</button>
    </div>
    <label class="speed">速度 <span id="speedVal">中</span>
      <input type="range" id="speed" min="1" max="100" value="55">
    </label>

    <h2>画笔</h2>
    <div class="tools" id="tools">
      <button data-tool="wall">🧱 障碍</button>
      <button data-tool="cost">💰 高代价 5</button>
      <button data-tool="erase">🧽 擦除</button>
    </div>
    <div class="note">起点（绿）与终点（红）可直接拖动；拖动到障碍上会被拒绝。</div>

    <h2>预设地图</h2>
    <div class="presets" id="presets">
      <button data-preset="empty">空地图</button>
      <button data-preset="weighted">加权地带</button>
      <button data-preset="sealed">封闭终点</button>
      <button data-preset="maze">固定迷宫</button>
    </div>

    <h2>实时数据</h2>
    <div class="stats">
      <div class="stat status"><div class="k">状态</div><div class="v" id="stStatus">就绪</div></div>
      <div class="stat"><div class="k" id="stStepsK">路径步数</div><div class="v" id="stSteps">–</div></div>
      <div class="stat"><div class="k" id="stCostK">总代价（地形）</div><div class="v" id="stCost">–</div></div>
      <div class="stat"><div class="k">已访问节点</div><div class="v" id="stVisited">0</div></div>
      <div class="stat"><div class="k">前沿节点</div><div class="v" id="stFrontier">0</div></div>
    </div>

    <div class="legend">
      <span><i style="background:var(--visited)"></i>已访问</span>
      <span><i style="background:var(--frontier)"></i>搜索前沿</span>
      <span><i style="background:var(--path)"></i>最终路径</span>
      <span><i style="background:var(--wall)"></i>障碍</span>
      <span><i style="background:var(--cost)"></i>高代价格 (5)</span>
      <span><i style="background:var(--start)"></i>起点</span>
      <span><i style="background:var(--goal)"></i>终点</span>
      <span><i style="background:#3a4a5e"></i>普通格 (1)</span>
    </div>

    <div class="rules">
      <b>规则说明：</b>起点代价不计入；普通格进入代价 1，高代价格 5。BFS 只保证步数最少；
      Dijkstra 与 A*（曼哈顿距离启发）保证地形总代价最小。搜索期间编辑地图会立即停止并清除本次搜索。
    </div>
  </aside>

  <main class="board">
    <canvas id="cv" width="1248" height="728"></canvas>
    <div class="toast" id="toast"></div>
  </main>
</div>

<script>
"use strict";
/* ================= 网格与状态 ================= */
const COLS = 24, ROWS = 14, CELL = 52;          // 画布逻辑尺寸 1248×728
const COST_NORMAL = 1, COST_HIGH = 5;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const state = {
  walls: new Set(),          // "x,y"
  costs: new Set(),          // 高代价格
  start: {x:2, y:7},
  end:   {x:21, y:7},
  algo: "bfs",
  tool: "wall",
  status: "ready",           // ready running paused done unreachable stopped
  visited: new Set(),        // 已出队的节点
  inFrontier: new Set(),     // 已发现未出队
  frontierData: [],          // 待处理（与算法结构一致的内容）
  cameFrom: new Map(),
  dist: new Map(),
  path: [],
  steps: null,
  totalCost: null,
  visitedCount: 0,
  playing: false,
  speed: 55,
  hover: null,
  statusText: "就绪",
};
const key = (x, y) => x + "," + y;
const inBounds = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
const isWall = (x, y) => state.walls.has(key(x, y));
const cellCost = (x, y) => (state.costs.has(key(x, y)) ? COST_HIGH : COST_NORMAL);

function resetSearch(statusText) {
  gen = null;                                  // 使任何进行中的搜索失效
  state.visited.clear(); state.inFrontier.clear();
  state.frontierData = []; state.cameFrom.clear(); state.dist.clear();
  state.path = []; state.steps = null; state.totalCost = null;
  state.visitedCount = 0; state.playing = false;
  if (statusText) { state.status = "stopped"; state.statusText = statusText; }
  updateStats(); draw();
}

/* ================= 确定性随机（预设可重复） ================= */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ================= 预设地图 ================= */
const presets = {
  empty() {
    state.walls.clear(); state.costs.clear();
    state.start = {x:2, y:7}; state.end = {x:21, y:7};
  },
  // 验收用：直线中路横着一条高代价带，绕行步数更多但代价更低。
  weighted() {
    state.walls.clear(); state.costs.clear();
    state.start = {x:2, y:7}; state.end = {x:21, y:7};
    for (let x = 8; x <= 16; x++)
      for (let y = 4; y <= 10; y++) state.costs.add(key(x, y));
  },
  sealed() {
    state.walls.clear(); state.costs.clear();
    state.start = {x:2, y:7}; state.end = {x:21, y:7};
    for (let dx = -1; dx <= 1; dx++)
      for (let dy = -1; dy <= 1; dy++) {
        if (dx === 0 && dy === 0) continue;
        state.walls.add(key(21 + dx, 7 + dy));
      }
  },
  maze() {
    state.walls.clear(); state.costs.clear();
    state.start = {x:1, y:1}; state.end = {x:22, y:12};
    const rnd = mulberry32(20261013);
    for (let x = 0; x < COLS; x++)
      for (let y = 0; y < ROWS; y++) {
        if ((x + y) % 2 === 0) continue;               // 只在奇数格建墙，保证可通行
        if (x === 1 && y === 1) continue;
        if ((x === 22 && y === 12)) continue;
        if (rnd() < 0.36) state.walls.add(key(x, y));
      }
    state.walls.delete(key(1,1)); state.walls.delete(key(22,12));
  },
};
function loadPreset(name) {
  presets[name]();
  resetSearch(null);
  state.status = "ready"; state.statusText = "就绪（预设：" + presetLabel(name) + "）";
  updateStats(); draw();
}
const presetLabel = (n) => ({empty:"空地图", weighted:"加权地带", sealed:"封闭终点", maze:"固定迷宫"}[n]);

/* ================= 算法（可单步执行的生成器） ================= */
class MinHeap {
  constructor() { this.a = []; }
  get size() { return this.a.length; }
  push(item) {                                  // item: {k, g, f}
    const a = this.a; a.push(item);
    let i = a.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (a[p].f <= a[i].f) break;
      [a[p], a[i]] = [a[i], a[p]]; i = p;
    }
  }
  pop() {
    const a = this.a, top = a[0], last = a.pop();
    if (a.length) {
      a[0] = last;
      let i = 0;
      for (;;) {
        const l = 2 * i + 1, r = l + 1; let m = i;
        if (l < a.length && a[l].f < a[m].f) m = l;
        if (r < a.length && a[r].f < a[m].f) m = r;
        if (m === i) break;
        [a[m], a[i]] = [a[i], a[m]]; i = m;
      }
    }
    return top;
  }
}
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

function* bfsGen(start, goal) {
  const q = [{x:start.x, y:start.y}];
  state.dist.set(key(start.x,start.y), 0);
  state.inFrontier.add(key(start.x,start.y));
  while (q.length) {
    const cur = q.shift();
    const ck = key(cur.x, cur.y);
    state.inFrontier.delete(ck);
    if (state.visited.has(ck)) continue;
    state.visited.add(ck); state.visitedCount++;
    yield;                                    // 一次单步 = 一个节点出队
    if (cur.x === goal.x && cur.y === goal.y) return "done";
    for (const [dx,dy] of DIRS) {
      const nx = cur.x+dx, ny = cur.y+dy, nk = key(nx,ny);
      if (!inBounds(nx,ny) || isWall(nx,ny)) continue;
      if (state.visited.has(nk) || state.inFrontier.has(nk)) continue;
      state.cameFrom.set(nk, ck);
      const g = (state.dist.get(ck) ?? 0) + cellCost(nx,ny);
      state.dist.set(nk, g);
      state.inFrontier.add(nk);
      q.push({x:nx, y:ny});
    }
  }
  return "unreachable";
}
function* dijkstraGen(start, goal, useHeuristic) {
  const heap = new MinHeap();
  const h = (x,y) => useHeuristic ? Math.abs(x-goal.x)+Math.abs(y-goal.y) : 0;
  state.dist.set(key(start.x,start.y), 0);
  state.inFrontier.add(key(start.x,start.y));
  heap.push({x:start.x, y:start.y, g:0, f:h(start.x,start.y)});
  const closed = new Set();
  while (heap.size) {
    const cur = heap.pop();
    const ck = key(cur.x, cur.y);
    if (closed.has(ck)) continue;             // 惰性删除：跳过过期条目
    if (cur.g > (state.dist.get(ck) ?? Infinity)) continue;
    closed.add(ck);
    state.inFrontier.delete(ck);
    state.visited.add(ck); state.visitedCount++;
    yield;
    if (cur.x === goal.x && cur.y === goal.y) return "done";
    for (const [dx,dy] of DIRS) {
      const nx = cur.x+dx, ny = cur.y+dy, nk = key(nx,ny);
      if (!inBounds(nx,ny) || isWall(nx,ny) || closed.has(nk)) continue;
      const ng = cur.g + cellCost(nx,ny);     // 进入代价；起点代价不计
      if (ng < (state.dist.get(nk) ?? Infinity)) {
        state.dist.set(nk, ng);
        state.cameFrom.set(nk, ck);
        state.inFrontier.add(nk);
        heap.push({x:nx, y:ny, g:ng, f:ng + h(nx,ny)});
      }
    }
  }
  return "unreachable";
}
function makeSearch() {
  if (state.algo === "bfs") return bfsGen(state.start, state.end);
  if (state.algo === "dijkstra") return dijkstraGen(state.start, state.end, false);
  return dijkstraGen(state.start, state.end, true);
}

/* ================= 搜索循环 ================= */
let gen = null;
function startSearch() {
  if (state.status === "done" || state.status === "unreachable")
    resetSearch(null);
  if (!gen) {
    // 清空旧可视化，保留地图
    state.visited.clear(); state.inFrontier.clear(); state.frontierData = [];
    state.cameFrom.clear(); state.dist.clear(); state.path = [];
    state.steps = null; state.totalCost = null; state.visitedCount = 0;
    gen = makeSearch();
  }
  state.status = "running"; state.statusText = "运行中…";
  state.playing = true;
  updateStats();
}
function stepOnce() {
  if (!gen) {
    state.visited.clear(); state.inFrontier.clear(); state.frontierData = [];
    state.cameFrom.clear(); state.dist.clear(); state.path = [];
    state.steps = null; state.totalCost = null; state.visitedCount = 0;
    gen = makeSearch();
  }
  state.playing = false;
  if (state.status !== "done" && state.status !== "unreachable") {
    const r = gen.next();
    if (r.done) finishSearch(r.value);
    else { state.status = "paused"; state.statusText = "已暂停（单步执行中）"; }
  }
  updateStats(); draw();
}
function finishSearch(result) {
  state.playing = false;
  if (result === "done") {
    // 由终点回溯路径
    let cur = key(state.end.x, state.end.y);
    const path = [cur];
    while (state.cameFrom.has(cur)) { cur = state.cameFrom.get(cur); path.push(cur); }
    path.reverse();
    state.path = path.map(k => { const [x,y] = k.split(",").map(Number); return {x,y}; });
    state.steps = state.path.length - 1;
    state.totalCost = state.dist.get(key(state.end.x, state.end.y));
    state.status = "done";
    state.statusText = "已完成：找到路径 ✓";
  } else {
    state.path = [];
    state.steps = null; state.totalCost = null;
    state.status = "unreachable";
    state.statusText = "终点不可达：搜索已穷尽前沿 ✕";
  }
  gen = null;
  updateStats(); draw();
}
let lastTs = 0, acc = 0;
function tick(ts) {
  const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0;
  lastTs = ts;
  if (state.playing && state.status === "running" && gen) {
    const perSecond = 4 + 4.4 * Math.pow(state.speed / 100, 2) * 54; // 约 4～240 次/秒
    acc += perSecond * dt;
    const n = Math.min(400, Math.floor(acc));
    acc -= n;
    for (let i = 0; i < n; i++) {
      const r = gen.next();
      if (r.done) { finishSearch(r.value); acc = 0; break; }
    }
    if (state.status === "running") updateStats();
  } else acc = 0;
  draw();
  requestAnimationFrame(tick);
}

/* ================= 绘制 ================= */
function draw() {
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const k = key(x, y);
      let fill = "#26313f";
      if (state.costs.has(k)) fill = "#5d4b16";
      if (state.visited.has(k)) fill = "#2a5d8f";
      if (state.inFrontier.has(k)) fill = "#c9952f";
      if (state.hover && state.hover.x === x && state.hover.y === y) fill = "#33465e";
      if (state.inFrontier.has(k) && state.hover?.x === x && state.hover?.y === y) fill = "#d9ab4a";
      if (state.visited.has(k) && state.hover?.x === x && state.hover?.y === y) fill = "#356ea5";
      if (isWall(x, y)) fill = "#0b0f14";
      ctx.fillStyle = fill;
      ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
      if (state.costs.has(k) && !isWall(x,y)) {    // 高代价格纹理
        ctx.fillStyle = "rgba(255, 214, 102, .55)";
        for (let i = 0; i < 3; i++)
          ctx.fillRect(x*CELL + 8 + i*14, y*CELL + CELL - 14 - i*9, 8, 3);
      }
    }
  }
  // 最终路径
  if (state.path.length > 1) {
    ctx.strokeStyle = "#ff4d6d"; ctx.lineWidth = 7; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath();
    state.path.forEach((p, i) => {
      const cx = p.x * CELL + CELL/2, cy = p.y * CELL + CELL/2;
      i ? ctx.lineTo(cx, cy) : ctx.moveTo(cx, cy);
    });
    ctx.stroke();
  }
  // 网格线
  ctx.strokeStyle = "rgba(255,255,255,.05)"; ctx.lineWidth = 1;
  for (let x = 0; x <= COLS; x++) { ctx.beginPath(); ctx.moveTo(x*CELL, 0); ctx.lineTo(x*CELL, H); ctx.stroke(); }
  for (let y = 0; y <= ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y*CELL); ctx.lineTo(W, y*CELL); ctx.stroke(); }
  // 起点 / 终点
  marker(state.start, "#36c286", "起");
  marker(state.end, "#ff6b6b", "终");
  function marker(p, color, label) {
    const cx = p.x * CELL + CELL/2, cy = p.y * CELL + CELL/2;
    ctx.fillStyle = color;
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(cx-19, cy-19, 38, 38, 10); ctx.fill(); }
    else ctx.fillRect(cx-19, cy-19, 38, 38);
    ctx.fillStyle = "#0b0f14"; ctx.font = "700 21px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(label, cx, cy + 1);
  }
}

/* ================= 面板与交互 ================= */
const $ = (id) => document.getElementById(id);
function updateStats() {
  $("stStatus").textContent = state.statusText;
  $("stStatus").className = "v " +
    (state.status === "done" ? "ok" : state.status === "unreachable" ? "bad"
     : state.status === "running" || state.status === "paused" ? "run" : "");
  $("stSteps").textContent = state.steps ?? "–";
  $("stCost").textContent = state.totalCost ?? "–";
  $("stVisited").textContent = state.visitedCount;
  $("stFrontier").textContent = state.inFrontier.size;
  $("stStepsK").textContent = state.algo === "bfs" ? "路径步数（BFS 按步数）" : "路径步数";
  $("stCostK").textContent = state.algo === "bfs" ? "总代价（仅供参考）" : "总代价（地形）★";
  $("btnRun").textContent = state.playing ? "⏸ 暂停" : "▶ 运行";
}
function setAlgo(a) {
  state.algo = a;
  document.querySelectorAll("#algoTabs button").forEach(b => b.classList.toggle("active", b.dataset.algo === a));
  resetSearch(null);
  state.status = "ready"; state.statusText = "就绪（算法：" + a.toUpperCase() + "）";
  updateStats(); draw();
}
function setTool(t) {
  state.tool = t;
  document.querySelectorAll("#tools button").forEach(b => b.classList.toggle("active", b.dataset.tool === t));
}
let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}
function markEdited() {                          // 搜索期间编辑 → 停止并清除旧搜索
  const wasActive = state.playing || state.status === "running" || state.status === "paused";
  gen = null;
  resetSearch(wasActive ? "已停止：地图被修改，旧搜索已清除" : "就绪（地图已修改）");
  if (wasActive) toast("地图已修改，旧搜索已清除");
  state.statusText = state.status === "stopped" ? "已停止：地图被修改，旧搜索已清除" : "就绪（地图已修改）";
  state.status = wasActive ? "stopped" : "ready";
  updateStats();
}

/* 鼠标 / 触摸绘制 */
let painting = null, dragTarget = null;
function cellFromEvent(e) {
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * COLS);
  const y = Math.floor((e.clientY - r.top) / r.height * ROWS);
  return inBounds(x, y) ? {x, y} : null;
}
function applyPaint(cell, eraseMode) {
  if (!cell) return;
  const k = key(cell.x, cell.y);
  if ((cell.x === state.start.x && cell.y === state.start.y) ||
      (cell.x === state.end.x && cell.y === state.end.y)) return;   // 起终点不可被覆盖
  const want = eraseMode ? null : (state.tool === "wall" ? "wall" : "cost");
  let changed = false;
  const setWall = want === "wall" && !state.walls.has(k);
  const unsetWall = (want !== "wall") && state.walls.has(k);
  const setCost = want === "cost" && !state.costs.has(k);
  const unsetCost = (want !== "cost") && state.costs.has(k);
  if (setWall) { state.walls.add(k); state.costs.delete(k); changed = true; }
  if (unsetWall) { state.walls.delete(k); changed = true; }
  if (setCost) { state.costs.add(k); state.walls.delete(k); changed = true; }
  if (unsetCost) { state.costs.delete(k); changed = true; }
  if (changed) markEdited();
}
cv.addEventListener("pointerdown", (e) => {
  const cell = cellFromEvent(e);
  if (!cell) return;
  cv.setPointerCapture(e.pointerId);
  if (cell.x === state.start.x && cell.y === state.start.y) { dragTarget = "start"; return; }
  if (cell.x === state.end.x && cell.y === state.end.y) { dragTarget = "end"; return; }
  painting = e.buttons === 2 ? "erase" : state.tool;
  applyPaint(cell, painting === "erase");
});
cv.addEventListener("pointermove", (e) => {
  const cell = cellFromEvent(e);
  const prev = state.hover;
  if (cell?.x !== prev?.x || cell?.y !== prev?.y) { state.hover = cell; }
  if (dragTarget && cell) {
    const other = dragTarget === "start" ? state.end : state.start;
    if ((cell.x === other.x && cell.y === other.y) || isWall(cell.x, cell.y)) return;
    state[dragTarget] = cell;
    markEdited();
    state.status = "ready"; state.statusText = "就绪（" + (dragTarget === "start" ? "起点" : "终点") + "已移动）";
    updateStats();
  } else if (painting && cell) {
    applyPaint(cell, painting === "erase");
  }
});
function endPointer() { painting = null; dragTarget = null; }
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);
cv.addEventListener("pointerleave", () => { state.hover = null; });
cv.addEventListener("contextmenu", (e) => { e.preventDefault(); });   // 右键=擦除

/* 按钮绑定 */
$("btnRun").addEventListener("click", () => {
  if (state.status === "done" || state.status === "unreachable") { resetSearch(null); state.status = "ready"; }
  if (state.playing) { state.playing = false; state.status = "paused"; state.statusText = "已暂停"; updateStats(); return; }
  startSearch(); updateStats();
});
$("btnStep").addEventListener("click", () => stepOnce());
$("btnClear").addEventListener("click", () => {
  gen = null; resetSearch(null);
  state.status = "ready"; state.statusText = "就绪（已清除搜索）";
  updateStats(); draw();
});
$("btnReset").addEventListener("click", () => loadPreset("empty"));
$("speed").addEventListener("input", (e) => {
  state.speed = Number(e.target.value);
  $("speedVal").textContent = state.speed < 25 ? "慢" : state.speed < 70 ? "中" : "快";
});
document.querySelectorAll("#algoTabs button").forEach(b => b.addEventListener("click", () => setAlgo(b.dataset.algo)));
document.querySelectorAll("#tools button").forEach(b => b.addEventListener("click", () => setTool(b.dataset.tool)));
document.querySelectorAll("#presets button").forEach(b => b.addEventListener("click", () => loadPreset(b.dataset.preset)));

/* ================= 调试导出（只读，用于自动化验收） ================= */
window.__lab = {
  get state() {
    return {
      algo: state.algo, status: state.status, statusText: state.statusText,
      start: {...state.start}, end: {...state.end},
      steps: state.steps, totalCost: state.totalCost,
      visitedCount: state.visitedCount, frontier: state.inFrontier.size,
      path: state.path.map(p => `${p.x},${p.y}`),
      wallCount: state.walls.size, costCount: state.costs.size,
      startIsWall: isWall(state.start.x, state.start.y),
      endIsWall: isWall(state.end.x, state.end.y),
    };
  },
  cells: { COLS, ROWS },
  set: (partial) => {       // 自动化专用：直接摆地图
    if (partial.walls) { state.walls = new Set(partial.walls); }
    if (partial.costs) { state.costs = new Set(partial.costs); }
    if (partial.start) state.start = {...partial.start};
    if (partial.end) state.end = {...partial.end};
    resetSearch(null); state.status = "ready"; state.statusText = "就绪"; updateStats(); draw();
  },
};

/* ================= 初始化 ================= */
setAlgo("bfs");
setTool("wall");
loadPreset("empty");
tick();
</script>
</body>
</html>
