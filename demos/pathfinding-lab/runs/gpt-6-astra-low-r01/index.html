<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寻路算法实验室</title><style>*{box-sizing:border-box}body{margin:0;background:#101922;color:#e0edf0;font:15px system-ui}main{max-width:1180px;margin:auto;padding:24px}h1{font-size:30px;margin:8px 0}p{color:#a3bbc6;line-height:1.7}header{border-bottom:1px solid #344652;margin-bottom:22px}.tag{color:#5be0bc;letter-spacing:3px}section{background:#192733;padding:16px;border-radius:12px;margin:14px 0}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select{background:#293e4d;color:#e0edf0;border:1px solid #4a6573;border-radius:6px;padding:10px;cursor:pointer}button.active,button.primary{background:#167e6a}label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}canvas{width:100%;display:block;touch-action:none;border-radius:8px;background:#0b151d}#stats{font-variant-numeric:tabular-nums;color:#71efc7;min-height:26px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}i{display:inline-block;width:12px;height:12px;margin-right:6px}@media(max-width:500px){main{padding:12px}h1{font-size:24px}}</style><main><header><span class="tag">ALGORITHM / 01</span><h1>寻路算法实验室</h1><p>让每一次探索都有迹可循。比较最少步数与最低代价之间的差别。</p></header><section class="tools"><label>算法<select id="algorithm"><option>BFS</option><option>Dijkstra</option><option>A*</option></select></label><button id="run" class="primary">运行</button><button id="pause">暂停</button><button id="step">单步</button><label>速度<input id="speed" type="range" min="1" max="100" value="30"></label><button id="clear">清除搜索</button><button id="reset">重置地图</button></section><section><div class="tools" id="brushes"><button data-mode="wall" class="active">障碍</button><button data-mode="erase">擦除</button><button data-mode="cost">高代价 ×5</button><button data-mode="start">起点</button><button data-mode="end">终点</button><select id="preset"><option value="weighted">加权走廊</option><option value="empty">空白网格</option><option value="maze">曲折通道</option><option value="blocked">封闭终点</option></select><button id="load">载入预设</button></div><p>拖动绘制；可直接拖动起点与终点。编辑会停止并清除搜索。BFS 按步数，Dijkstra / A* 按进入格子的代价；起点不计代价。</p><canvas id="board" width="960" height="576" aria-label="可编辑寻路网格"></canvas></section><section><div id="stats" role="status"></div><div class="legend"><span><i style="background:#62e0ad"></i>起点</span><span><i style="background:#f37587"></i>终点</span><span><i style="background:#b18d46"></i>代价 5</span><span><i style="background:#405a7c"></i>已访问</span><span><i style="background:#579cec"></i>前沿</span><span><i style="background:#ffe17b"></i>路径</span></div></section></main><script>
const $=id=>document.getElementById(id), c=$('board'),x=c.getContext('2d'),W=30,H=18,N=W*H;let grid=new Uint8Array(N),start=8*W+3,end=8*W+26,mode='wall',search=null,running=false,drag=false,dragMode='',last=0;
function stop(){running=false;search=null;draw();status('就绪 · 点击运行或单步开始探索');}function status(s){$('stats').textContent=s}function init(){search={open:[start],dist:Array(N).fill(Infinity),prev:Array(N).fill(-1),closed:new Set(),path:[],done:false,alg:$('algorithm').value};search.dist[start]=0;}
function neighbors(n){return [n%W? n-1:-1,n%W<W-1?n+1:-1,n>=W?n-W:-1,n<N-W?n+W:-1].filter(v=>v>=0&&grid[v]!==1)}function heuristic(n){return Math.abs(n%W-end%W)+Math.abs(Math.floor(n/W)-Math.floor(end/W))}
function tick(){if(!search)init();let s=search;if(s.done)return;if(!s.open.length){s.done=true;running=false;status('不可达 · 搜索已结束，终点被障碍隔离');draw();return}if(s.alg!=='BFS')s.open.sort((a,b)=>(s.dist[a]+(s.alg==='A*'?heuristic(a):0))-(s.dist[b]+(s.alg==='A*'?heuristic(b):0)));let n=s.open.shift();s.closed.add(n);if(n===end){s.done=true;running=false;for(let k=end;k!==-1;k=s.prev[k])s.path.push(k);let cost=s.path.slice(0,-1).reduce((a,k)=>a+(grid[k]===2?5:1),0);status(`已找到路径 · ${s.path.length-1} 步 · 总代价 ${cost} · 访问 ${s.closed.size} 格`);draw();return}for(let v of neighbors(n)){if(s.closed.has(v))continue;let d=s.dist[n]+(s.alg==='BFS'?1:grid[v]===2?5:1);if(d<s.dist[v]){s.dist[v]=d;s.prev[v]=n;if(!s.open.includes(v))s.open.push(v)}}status(`搜索中 · 已访问 ${s.closed.size} · 前沿 ${s.open.length} · ${running?'运行':'暂停'}`);draw()}
function draw(){x.clearRect(0,0,c.width,c.height);let frontier=new Set(search?.open),path=new Set(search?.path);for(let n=0;n<N;n++){let col=grid[n]===1?'#60717a':grid[n]===2?'#80632e':'#1c303d';if(search?.closed.has(n))col='#405a7c';if(frontier.has(n))col='#579cec';if(path.has(n))col='#ffe17b';if(n===start)col='#62e0ad';if(n===end)col='#f37587';let px=n%W*32,py=Math.floor(n/W)*32;x.fillStyle=col;x.fillRect(px+1,py+1,30,30);if(n===start||n===end||grid[n]===2){x.fillStyle='#10212a';x.font='16px system-ui';x.textAlign='center';x.fillText(n===start?'起':n===end?'终':'5',px+16,py+22)}}}
function cell(e){let r=c.getBoundingClientRect();let a=Math.floor((e.clientX-r.left)/r.width*W),b=Math.floor((e.clientY-r.top)/r.height*H);return a<0||a>=W||b<0||b>=H?-1:b*W+a}function edit(n){if(n<0)return;stop();if(dragMode==='start'){if(n!==end&&grid[n]!==1)start=n}else if(dragMode==='end'){if(n!==start&&grid[n]!==1)end=n}else if(n!==start&&n!==end)grid[n]=dragMode==='wall'?1:dragMode==='cost'?2:0;draw()}
c.onpointerdown=e=>{let n=cell(e);drag=true;dragMode=n===start?'start':n===end?'end':mode;c.setPointerCapture(e.pointerId);edit(n)};c.onpointermove=e=>{if(drag)edit(cell(e))};c.onpointerup=c.onpointercancel=()=>drag=false;
$('brushes').onclick=e=>{if(e.target.dataset.mode){mode=e.target.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}};
function load(){grid.fill(0);start=8*W+3;end=8*W+26;let p=$('preset').value;if(p==='weighted')for(let a=7;a<24;a++)grid[8*W+a]=2;if(p==='maze')for(let a=7;a<26;a+=6)for(let b=0;b<H;b++)if(b!==(a===13?2:15))grid[b*W+a]=1;if(p==='blocked')for(let v of neighbors(end))grid[v]=1;stop()}
$('run').onclick=()=>{if(search?.done)search=null;running=true};$('pause').onclick=()=>{running=false;if(search&&!search.done)status(`已暂停 · 已访问 ${search.closed.size} 格`)};$('step').onclick=()=>{running=false;tick()};$('clear').onclick=stop;$('reset').onclick=()=>{$('preset').value='weighted';load()};$('load').onclick=load;$('algorithm').onchange=stop;
function loop(t){if(running&&t-last>1000/+$('speed').value){tick();last=t}requestAnimationFrame(loop)}load();requestAnimationFrame(loop);
</script></html>
