<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寻路实验室 · PATH / LAB</title>
<script src="../../../../assets/analytics.js" defer></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3ed;color:#203528;font:15px system-ui,sans-serif}button,select,input{font:inherit}button,select{border:1px solid #c8d0c4;border-radius:8px;background:#fff;padding:10px 14px;color:inherit;cursor:pointer}button:hover{background:#e4ecd7}button.active,.primary{background:#244d36;color:white}main{max-width:1380px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #c8d0c4;padding-bottom:24px}h1{font-size:30px;letter-spacing:-1px;margin:6px 0}small,.muted{color:#647564}header small{letter-spacing:3px}article{display:grid;grid-template-columns:260px 1fr;gap:24px;margin-top:24px}aside,.board{background:#fff;border:1px solid #d7ddcf;border-radius:16px;padding:20px}h2{font-size:14px;margin:0 0 14px}label{display:block;margin:15px 0 8px;font-size:13px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tools button{padding:10px 5px}select,input[type=range]{width:100%}.stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e9ece4}.stat b{font-variant-numeric:tabular-nums}.board{min-width:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.toolbar span{margin-left:auto}canvas{display:block;width:100%;aspect-ratio:3/2;background:#fafbf7;touch-action:none;border:1px solid #d7ddcf;border-radius:7px}.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;padding:18px 0}.legend i{width:11px;height:11px;display:inline-block;border-radius:2px;margin-right:5px}.notice{padding:12px;background:#f1f5e9;border-radius:8px;line-height:1.7;font-size:13px}#status{font-weight:600;min-height:24px;margin:10px 0}footer{margin-top:20px;font-size:12px;color:#647564;line-height:1.8}@media(max-width:800px){main{padding:16px}article{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:12px}aside>div{min-width:0}.metrics{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px}.stat{display:block;flex:1}.stat b{display:block;margin-top:4px}header{align-items:start}h1{font-size:24px}.board{padding:12px}.toolbar span{width:100%;margin:0}footer{font-size:11px}}
</style>
<main><header><div><small>PATH / LAB — 01</small><h1>每条路，都有它的代价。</h1><span class="muted">把搜索过程，变成看得见的探索。</span></div><button id="reset">重置地图 ↺</button></header>
<article><aside><div><h2>01 / 搜索策略</h2><select id="algorithm" aria-label="算法"><option value="astar">A* · 曼哈顿启发</option><option value="dijkstra">Dijkstra · 最小代价</option><option value="bfs">BFS · 最少步数</option></select><label for="preset">可重复地图</label><select id="preset"><option value="weighted">代价走廊</option><option value="empty">空白地图</option><option value="maze">交错围墙</option><option value="sealed">封闭终点</option></select><label for="speed">搜索速度 <output id="speedValue">30</output> 节点 / 秒</label><input id="speed" type="range" min="1" max="180" value="30"></div>
<div><h2>02 / 绘制地图</h2><div class="tools"><button data-tool="wall" class="active">▦ 障碍</button><button data-tool="weight">▧ 高代价</button><button data-tool="erase">⌫ 擦除</button><button data-tool="start">S 起点</button><button data-tool="goal">E 终点</button></div><p class="muted" style="font-size:12px;line-height:1.7">拖动 S / E 调整端点。点击或拖动格子绘制；编辑将终止并清除旧搜索。</p></div>
<div class="metrics"><div class="stat">已访问 <b id="visited">0</b></div><div class="stat">路径步数 <b id="steps">—</b></div><div class="stat">总代价 <b id="cost">—</b></div></div></aside>
<section class="board"><div class="toolbar"><button id="run" class="primary">▶ 运行搜索</button><button id="pause">Ⅱ 暂停</button><button id="step">→ 单步</button><button id="clear">清除搜索</button><span class="muted">30 × 20 网格</span></div><canvas id="grid" width="1200" height="800" aria-label="可编辑寻路网格"></canvas><div class="legend"><span><i style="background:#2e6749"></i>起点</span><span><i style="background:#e27848"></i>终点</span><span><i style="background:#344a3e"></i>障碍</span><span><i style="background:#e9c77d"></i>代价 5</span><span><i style="background:#b2d7db"></i>已访问</span><span><i style="background:#c4dbaa"></i>前沿</span><span><i style="background:#f5c04f"></i>最终路径</span></div><div id="status" role="status">选择工具编辑地图，或直接开始搜索。</div><div class="notice">四方向移动。普通格进入代价 1，高代价格进入代价 5，起点代价不计。BFS 优先最少步数；Dijkstra 与 A* 优先最小总代价。</div></section></article><footer>ALGORITHMS, MADE TANGIBLE / 无网络依赖 · 支持鼠标与触摸</footer></main>
<script>
const $=s=>document.querySelector(s),W=30,H=20,N=W*H,canvas=$('#grid'),ctx=canvas.getContext('2d');
let cells=new Uint8Array(N),start=10*W+3,goal=10*W+26,tool='wall',search=null,running=false,last=0,acc=0,drag=null;
function clearSearch(){running=false;search=null;$('#visited').textContent='0';$('#steps').textContent='—';$('#cost').textContent='—';$('#status').textContent='搜索已清除，可继续编辑。';draw()}
function preset(name){cells.fill(0);start=10*W+3;goal=10*W+26;if(name==='weighted')for(let x=6;x<25;x++)cells[10*W+x]=5;if(name==='maze')for(let x=6;x<27;x+=5)for(let y=0;y<H;y++)if(y!==((x%2)?3:16))cells[y*W+x]=1;if(name==='sealed')for(const i of neighbors(goal))cells[i]=1;clearSearch()}
function neighbors(i){const x=i%W,y=Math.floor(i/W);return [[x+1,y],[x,y+1],[x-1,y],[x,y-1]].filter(([x,y])=>x>=0&&x<W&&y>=0&&y<H).map(([x,y])=>y*W+x)}
function begin(){const kind=$('#algorithm').value;search={kind,dist:new Float64Array(N).fill(Infinity),prev:new Int32Array(N).fill(-1),closed:new Uint8Array(N),open:[start],front:new Set([start]),path:new Set(),count:0,done:false};search.dist[start]=0;$('#status').textContent='正在探索…';$('#steps').textContent='—';$('#cost').textContent='—'}
function heuristic(i){return Math.abs(i%W-goal%W)+Math.abs(Math.floor(i/W)-Math.floor(goal/W))}
function step(){if(!search)begin();const s=search;if(s.done)return;if(!s.open.length){s.done=true;running=false;$('#status').textContent='终点不可达：请检查围墙或调整地图。';draw();return}let best=0;if(s.kind!=='bfs')for(let j=1;j<s.open.length;j++){const score=i=>s.dist[i]+(s.kind==='astar'?heuristic(i):0);if(score(s.open[j])<score(s.open[best]))best=j}const u=s.open.splice(best,1)[0];s.front.delete(u);if(s.closed[u])return;s.closed[u]=1;s.count++;if(u===goal){s.done=true;running=false;let path=[],p=goal;while(p!==-1){path.push(p);p=s.prev[p]}s.path=new Set(path);const cost=path.slice(0,-1).reduce((a,i)=>a+(cells[i]===5?5:1),0);$('#steps').textContent=path.length-1;$('#cost').textContent=cost;$('#status').textContent=`已抵达终点 · ${path.length-1} 步 / 代价 ${cost}`;}else for(const v of neighbors(u)){if(cells[v]===1||s.closed[v])continue;const next=s.dist[u]+(s.kind==='bfs'?1:cells[v]===5?5:1);if(next<s.dist[v]){s.dist[v]=next;s.prev[v]=u;if(!s.front.has(v)){s.open.push(v);s.front.add(v)}}}$('#visited').textContent=s.count;draw()}
function draw(){const d=40;ctx.clearRect(0,0,1200,800);for(let i=0;i<N;i++){const x=i%W*d,y=Math.floor(i/W)*d;let color=cells[i]===1?'#344a3e':cells[i]===5?'#f0dbac':'#f8faf3';if(search?.front.has(i))color='#c4dbaa';if(search?.closed[i])color='#b2d7db';if(search?.path.has(i))color='#f5c04f';if(i===start)color='#2e6749';if(i===goal)color='#e27848';ctx.fillStyle=color;ctx.fillRect(x+1,y+1,d-2,d-2);if(i===start||i===goal||cells[i]===5){ctx.fillStyle=i===start||i===goal?'white':'#8e6a20';ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillText(i===start?'S':i===goal?'E':'5',x+d/2,y+27)}}}
function cellAt(e){const r=canvas.getBoundingClientRect();return Math.min(H-1,Math.max(0,Math.floor((e.clientY-r.top)/r.height*H)))*W+Math.min(W-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*W)))}
function edit(i){if(search)clearSearch();const t=drag||tool;if(t==='start'){if(i!==goal){cells[i]=0;start=i}}else if(t==='goal'){if(i!==start){cells[i]=0;goal=i}}else if(i!==start&&i!==goal)cells[i]=t==='wall'?1:t==='weight'?5:0;draw()}
canvas.onpointerdown=e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);const i=cellAt(e);drag=i===start?'start':i===goal?'goal':tool;edit(i)};canvas.onpointermove=e=>{if(drag)edit(cellAt(e))};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});
$('#run').onclick=()=>{if(search?.done)clearSearch();if(!search)begin();running=true;acc=0};$('#pause').onclick=()=>{running=false;$('#status').textContent='已暂停，可单步继续。'};$('#step').onclick=()=>{running=false;step()};$('#clear').onclick=clearSearch;$('#reset').onclick=()=>{$('#preset').value='weighted';preset('weighted')};$('#preset').onchange=e=>preset(e.target.value);$('#algorithm').onchange=clearSearch;$('#speed').oninput=e=>$('#speedValue').textContent=e.target.value;
function animate(t){const dt=Math.min(0.1,(t-last)/1000);last=t;if(running){acc+=dt*Number($('#speed').value);while(acc>=1&&running){step();acc--}}requestAnimationFrame(animate)}preset('weighted');requestAnimationFrame(animate);
window.lab={preset,step,begin,clearSearch,neighbors,get state(){return {cells,start,goal,search,running}},setCell(i,value){if(i!==start&&i!==goal){clearSearch();cells[i]=value;draw()}}};
</script></html>
