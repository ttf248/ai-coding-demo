<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寻径 · 算法实验室</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef1ec;color:#20352d;font:15px system-ui,sans-serif}header{padding:28px 5vw;border-bottom:1px solid #cdd5cb;display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:4px 0}small,.muted{color:#6c7e70}main{max-width:1400px;margin:auto;padding:28px 5vw;display:grid;grid-template-columns:260px 1fr;gap:26px}aside,.stage{background:#fafbf7;border:1px solid #d2dbce;border-radius:18px;padding:22px;min-width:0}h2{font-size:15px;margin:0 0 14px}label{display:block;margin:18px 0 8px}button,select,input{font:inherit;max-width:100%}button,select{padding:10px 13px;border:1px solid #cad5c7;border-radius:9px;background:white;color:inherit;cursor:pointer}button:hover,button.active{background:#d3e8b9;border-color:#6b914e}button.primary{background:#284e3d;color:white}.row{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}select,input[type=range]{width:100%}.stage{padding:20px}.stage header{padding:0 0 14px;border:0}.metrics{display:flex;gap:30px;flex-wrap:wrap;padding:18px 0}.metrics b{display:block;font-size:26px}canvas{display:block;width:100%;aspect-ratio:3/2;background:#e5eadd;border-radius:9px;touch-action:none}.legend{display:flex;flex-wrap:wrap;gap:14px;margin:15px 0;font-size:12px}.legend i{display:inline-block;width:11px;height:11px;margin-right:5px;border-radius:3px}p{line-height:1.7;font-size:13px}#status{min-height:25px;color:#345d45}button:focus-visible{outline:3px solid #b0ca58}@media(max-width:760px){header{padding:19px}main{padding:16px;grid-template-columns:1fr}aside{padding:18px}.stage{padding:12px}.metrics{gap:20px}h1{font-size:22px}}</style>
<header><div><small>FIELD NOTES / 01</small><h1>寻径 · 算法实验室</h1></div><span>四向网格 ↗</span></header>
<main><aside><h2>绘制你的问题</h2><label for="algorithm">搜索算法</label><select id="algorithm"><option value="astar">A* · 曼哈顿距离</option><option value="dijkstra">Dijkstra · 最小代价</option><option value="bfs">BFS · 最少步数</option></select><label>画笔工具</label><div class="row" id="tools"><button data-tool="wall" class="active">障碍</button><button data-tool="weight">代价 5</button><button data-tool="erase">擦除</button><button data-tool="start">起点 S</button><button data-tool="end">终点 E</button></div><label for="preset">地图预设</label><select id="preset"><option value="weighted">加权河谷</option><option value="empty">空白地图</option><option value="maze">蜿蜒迷宫</option><option value="blocked">封闭终点</option></select><label for="speed">速度 <output id="rate">30</output> 节点 / 秒</label><input id="speed" type="range" min="1" max="180" value="30"><div class="row"><button class="primary" id="run">开始搜索</button><button id="step">单步</button></div><div class="row"><button id="clear">清除搜索</button><button id="reset">重置地图</button></div><p class="muted">拖动绘制；直接拖动 S / E 可移动端点。编辑会停止旧搜索。BFS 保证最少步数，Dijkstra 与 A* 保证最小代价。进入普通格计 1，高代价格计 5，起点不计。</p></aside>
<section class="stage"><header><h2>搜索空间 <small>30 × 20</small></h2><small>可触摸编辑</small></header><canvas id="grid" width="1200" height="800" aria-label="寻路编辑网格"></canvas><div class="legend"><span><i style="background:#244835"></i>障碍</span><span><i style="background:#deb96d"></i>代价 5</span><span><i style="background:#bcd6c7"></i>已访问</span><span><i style="background:#80b6d1"></i>前沿</span><span><i style="background:#e7a148"></i>路径</span></div><div class="metrics"><div><small>已访问</small><b id="visited">0</b></div><div><small>路径步数</small><b id="steps">—</b></div><div><small>总代价</small><b id="cost">—</b></div></div><div id="status" role="status">准备就绪，选择算法开始探索。</div></section></main>
<script>
'use strict';const $=id=>document.getElementById(id),W=30,H=20,N=W*H,canvas=$('grid'),ctx=canvas.getContext('2d');let cells=new Uint8Array(N),start=9*W+3,end=9*W+26,tool='wall',search=null,running=false,last=0,credit=0,drag=null;
const neighbors=i=>[i%W?i-1:-1,i%W<W-1?i+1:-1,i>=W?i-W:-1,i<N-W?i+W:-1].filter(j=>j>=0);
const heuristic=i=>Math.abs(i%W-end%W)+Math.abs(Math.floor(i/W)-Math.floor(end/W));
function clear(){search=null;running=false;credit=0;$('run').textContent='开始搜索';$('status').textContent='搜索已清除，可以编辑地图。';$('steps').textContent=$('cost').textContent='—';draw()}
function init(){const g=new Float64Array(N).fill(Infinity),parent=new Int32Array(N).fill(-1);g[start]=0;search={g,parent,open:[start],front:new Set([start]),closed:new Set(),path:[],done:false,found:false,algorithm:$('algorithm').value};}
function step(){if(!search)init();const s=search;if(s.done)return;let u;if(s.algorithm==='bfs')u=s.open.shift();else{let best=0;for(let j=1;j<s.open.length;j++){const score=i=>s.g[i]+(s.algorithm==='astar'?heuristic(i):0);if(score(s.open[j])<score(s.open[best]))best=j}u=s.open.splice(best,1)[0]}if(u===undefined){s.done=true;running=false;$('status').textContent='终点不可达：没有可通行的路线。';$('run').textContent='重新搜索';draw();return}s.front.delete(u);s.closed.add(u);if(u===end){s.done=s.found=true;running=false;for(let i=end;i!==-1;i=s.parent[i])s.path.push(i);s.path.reverse();$('steps').textContent=s.path.length-1;$('cost').textContent=s.path.slice(1).reduce((a,i)=>a+(cells[i]===2?5:1),0);$('status').textContent='已找到路线 · '+(s.algorithm==='bfs'?'最少步数（不保证最小代价）':'最小地形代价');$('run').textContent='重新搜索';draw();return}for(const v of neighbors(u)){if(cells[v]===1||s.closed.has(v))continue;const g=s.g[u]+(s.algorithm==='bfs'?1:cells[v]===2?5:1);if(g<s.g[v]){s.g[v]=g;s.parent[v]=u;if(!s.front.has(v)){s.open.push(v);s.front.add(v)}}}draw()}
function draw(){ctx.clearRect(0,0,1200,800);const route=new Set(search?.path||[]);for(let i=0;i<N;i++){let c=cells[i]===1?'#244835':cells[i]===2?'#dec085':'#eef1e8';if(search?.closed.has(i))c='#bcd6c7';if(search?.front.has(i))c='#80b6d1';if(route.has(i))c='#e7a148';if(i===start)c='#426c45';if(i===end)c='#c76b48';const x=i%W*40,y=Math.floor(i/W)*40;ctx.fillStyle=c;ctx.fillRect(x+1,y+1,38,38);if(i===start||i===end){ctx.fillStyle='white';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText(i===start?'S':'E',x+20,y+28)}else if(cells[i]===2){ctx.fillStyle='#755522';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('5',x+20,y+25)}}$('visited').textContent=search?.closed.size||0}
function preset(name){clear();cells.fill(0);start=9*W+3;end=9*W+26;if(name==='weighted')for(let y=4;y<16;y++)for(let x=9;x<22;x++)cells[y*W+x]=2;if(name==='maze')for(let x=7;x<27;x+=5)for(let y=0;y<H;y++)if((Math.floor(x/5)%2?y<17:y>2))cells[y*W+x]=1;if(name==='blocked')neighbors(end).forEach(i=>cells[i]=1);draw()}
function cellAt(e){const r=canvas.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H);return x>=0&&x<W&&y>=0&&y<H?y*W+x:-1}
function edit(i){if(i<0)return;if(search)clear();if(drag==='start'&&i!==end){start=i;cells[i]=0}else if(drag==='end'&&i!==start){end=i;cells[i]=0}else if(i!==start&&i!==end)cells[i]=drag==='wall'?1:drag==='weight'?2:0;draw()}
canvas.onpointerdown=e=>{const i=cellAt(e);drag=i===start?'start':i===end?'end':tool;canvas.setPointerCapture(e.pointerId);edit(i)};canvas.onpointermove=e=>{if(drag)edit(cellAt(e))};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
$('tools').onclick=e=>{if(!e.target.dataset.tool)return;tool=e.target.dataset.tool;for(const b of $('tools').children)b.classList.toggle('active',b===e.target)};
$('run').onclick=()=>{if(search?.done)clear();if(!search)init();running=!running;$('run').textContent=running?'暂停':'继续';$('status').textContent=running?'正在搜索…':'已暂停，可以单步前进。'};
$('step').onclick=()=>{running=false;$('run').textContent='继续';step()};$('clear').onclick=clear;$('reset').onclick=()=>preset($('preset').value);$('preset').onchange=e=>preset(e.target.value);$('algorithm').onchange=clear;$('speed').oninput=e=>$('rate').value=e.target.value;
function tick(t){const dt=Math.min((t-last)/1000,.1);last=t;if(running){credit+=dt*Number($('speed').value);while(credit>=1&&running){step();credit--}}requestAnimationFrame(tick)}preset('weighted');requestAnimationFrame(tick);
window.lab={preset,clear,step,solve(algorithm){$('algorithm').value=algorithm;clear();init();for(let i=0;i<N+1&&!search.done;i++)step();return {found:search.found,steps:search.path.length-1,cost:search.path.slice(1).reduce((a,i)=>a+(cells[i]===2?5:1),0),visited:search.closed.size}},get state(){return{start,end,cells:Array.from(cells),running,done:search?.done}}};
</script></html>
