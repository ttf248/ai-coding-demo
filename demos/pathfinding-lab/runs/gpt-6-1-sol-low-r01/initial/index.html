<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寻路算法实验室</title><style>*{box-sizing:border-box}body{margin:0;background:#101923;color:#e3ebef;font:15px/1.6 system-ui,sans-serif}header{padding:25px 5vw;border-bottom:1px solid #314352}h1{font-size:28px;margin:3px 0}p{margin:6px 0;color:#aabdc9}.badge{color:#76e6c1;font-size:12px;letter-spacing:2px}main{max-width:1350px;margin:auto;padding:22px;display:grid;grid-template-columns:265px minmax(0,1fr);gap:20px}aside,.panel{background:#192734;border:1px solid #334654;border-radius:14px;padding:18px;min-width:0}label{display:block;margin:12px 0}input,select,button{font:inherit;color:inherit;background:#263b4b;border:1px solid #486173;border-radius:7px;padding:8px;max-width:100%}input[type=range]{width:100%;padding:0;accent-color:#76e6c1}button{cursor:pointer;margin:3px 2px}button:hover{background:#38546a}button.primary{background:#2c7467}canvas,svg{display:block;width:100%;touch-action:none;border-radius:9px}#status{color:#76e6c1;padding:12px 0;overflow-wrap:anywhere}.row{display:flex;flex-wrap:wrap;gap:6px}.note{font-size:12px;color:#aabdc9}output{color:#76e6c1}a{color:#76e6c1}@media(max-width:700px){main{grid-template-columns:1fr;padding:12px}header{padding:16px}aside{padding:12px}h1{font-size:23px}}</style><header><div class="badge">ALGORITHM ATELIER / 01</div><h1>寻路算法实验室</h1><p>让每一次探索都看得见。画一堵墙，或给旅途增加一点代价。</p></header><main><aside><label>算法<select id="algo"><option value="astar">A* · 曼哈顿启发</option><option value="dijkstra">Dijkstra · 最小代价</option><option value="bfs">BFS · 最少步数</option></select></label><label>画笔<select id="brush"><option value="0">障碍</option><option value="5">高代价 · 5</option><option value="1">擦除 · 普通格 1</option></select></label><label>预设<select id="preset"><option value="weighted">加权地形</option><option value="wall">绕过长墙</option><option value="closed">终点封闭</option><option value="empty">空白地图</option></select></label><label>速度<input id="speed" type="range" min="1" max="120" value="30"></label><div class="row"><button class="primary" id="run">运行</button><button id="pause">暂停</button><button id="step">单步</button><button id="clear">清除搜索</button><button id="reset">重置地图</button></div><p class="note">四方向移动。BFS 忽略权重；其他算法最小化进入格子的代价。起点不计费。</p></aside><section class="panel"><canvas id="board"></canvas><p class="note">薄荷 S 起点 · 粉色 E 终点 · 青色搜索前沿 · 金色最终路径</p><div id="status" role="status"></div></section></main><script>
const $=id=>document.getElementById(id),c=$('board'),ctx=c.getContext('2d'),W=28,H=20,N=W*H;
let terrain=new Array(N).fill(1),start=2+W*10,end=25+W*10,search=null,running=false,last=0,drag=null;
function clear(){running=false;search=null;$('status').textContent='就绪 · 点击网格编辑，拖动 S / E 移动起终点';draw()}
function preset(kind){terrain.fill(1);start=2+W*10;end=25+W*10;if(kind==='weighted')for(let y=8;y<=12;y++)for(let x=9;x<20;x++)terrain[y*W+x]=5;if(kind==='wall')for(let y=1;y<19;y++)if(y!==4)terrain[y*W+14]=0;if(kind==='closed')for(const v of neighbors(end))terrain[v]=0;clear()}
function neighbors(i){let x=i%W,y=Math.floor(i/W);return [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].filter(([x,y])=>x>=0&&x<W&&y>=0&&y<H).map(([x,y])=>y*W+x)}
function init(){search={open:[start],dist:Array(N).fill(Infinity),prev:Array(N).fill(-1),closed:new Set(),path:[],mode:$('algo').value,done:false};search.dist[start]=0}
function step(){if(!search)init();let s=search;if(s.done)return; if(!s.open.length){s.done=true;running=false;$('status').textContent='不可达 · 搜索结束';draw();return}
let index=0;if(s.mode!=='bfs'){let score=i=>s.dist[i]+(s.mode==='astar'?Math.abs(i%W-end%W)+Math.abs(Math.floor(i/W)-Math.floor(end/W)):0);for(let k=1;k<s.open.length;k++)if(score(s.open[k])<score(s.open[index]))index=k}
let u=s.open.splice(index,1)[0];s.closed.add(u);if(u===end){for(let v=end;v!==-1;v=s.prev[v])s.path.unshift(v);s.done=true;running=false;let cost=s.path.slice(1).reduce((a,i)=>a+terrain[i],0);$('status').textContent='已找到路径 · '+(s.path.length-1)+' 步 · 总代价 '+cost+' · 访问 '+s.closed.size+' 节点';draw();return}
for(let v of neighbors(u)){if(!terrain[v]||s.closed.has(v))continue;let d=s.dist[u]+(s.mode==='bfs'?1:terrain[v]);if(d<s.dist[v]){s.dist[v]=d;s.prev[v]=u;if(!s.open.includes(v))s.open.push(v)}}
$('status').textContent='搜索中 · 已访问 '+s.closed.size+' · 前沿 '+s.open.length;draw()}
function draw(){let size=24;c.width=W*size;c.height=H*size;ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';for(let i=0;i<N;i++){let x=i%W*size,y=Math.floor(i/W)*size;ctx.fillStyle=terrain[i]===0?'#0c1420':terrain[i]===5?'#79603a':'#273c4a';if(search?.closed.has(i))ctx.fillStyle='#356675';if(search?.open.includes(i))ctx.fillStyle='#54a6ab';if(search?.path.includes(i))ctx.fillStyle='#efd27c';if(i===start)ctx.fillStyle='#76e6c1';if(i===end)ctx.fillStyle='#fc8299';ctx.fillRect(x+1,y+1,size-2,size-2);ctx.fillStyle='#15212a';if(i===start||i===end)ctx.fillText(i===start?'S':'E',x+12,y+12);else if(terrain[i]===5){ctx.fillStyle='#ddd';ctx.fillText('5',x+12,y+12)}}}
function cell(e){let r=c.getBoundingClientRect();return Math.min(H-1,Math.max(0,Math.floor((e.clientY-r.top)/r.height*H)))*W+Math.min(W-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*W)))}
function paint(i){if(drag==='start'&&i!==end&&terrain[i])start=i;else if(drag==='end'&&i!==start&&terrain[i])end=i;else if(drag==='paint'&&i!==start&&i!==end)terrain[i]=Number($('brush').value);draw()}
c.onpointerdown=e=>{let i=cell(e);clear();drag=i===start?'start':i===end?'end':'paint';c.setPointerCapture(e.pointerId);paint(i)};
c.onpointermove=e=>{if(drag)paint(cell(e))};c.onpointerup=c.onpointercancel=()=>drag=null;
$('run').onclick=()=>{if(search?.done)clear();if(!search)init();running=true};$('pause').onclick=()=>{running=false;$('status').textContent='已暂停 · 可单步继续'};$('step').onclick=()=>{running=false;step()};$('clear').onclick=clear;$('reset').onclick=()=>preset('weighted');$('preset').onchange=e=>preset(e.target.value);$('algo').onchange=clear;
function frame(t){if(running&&t-last>1000/Number($('speed').value)){step();last=t}requestAnimationFrame(frame)}preset('weighted');requestAnimationFrame(frame);
window.lab={preset,step,init,neighbors,get state(){return {terrain,start,end,search}},setEndpoints:(s,e)=>{start=s;end=e;clear()}};
</script></html>
