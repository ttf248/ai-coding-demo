<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寻路实验室 · Route / 01</title>
<style>
:root{color-scheme:dark;--bg:#101719;--panel:#192326;--line:#314044;--text:#e6eeeb;--accent:#c5ed86}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,sans-serif}button,select,input{font:inherit}button,select{background:#243236;color:inherit;border:1px solid var(--line);padding:9px 14px;border-radius:7px;cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:2px solid var(--accent)}button.active,.primary{background:var(--accent);color:#142018;border-color:transparent}header{padding:25px 4vw;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}header b{font-size:21px}small,.muted{color:#9eb2af}main{max-width:1500px;margin:auto;padding:32px 4vw}.intro{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:24px}h1{font-size:clamp(28px,4vw,46px);letter-spacing:-2px;line-height:1.2;margin:8px 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px}.board{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:16px;border-bottom:1px solid var(--line)}canvas{display:block;width:100%;touch-action:none;cursor:crosshair}.legend{display:flex;gap:14px;flex-wrap:wrap;padding:14px 18px;font-size:12px}.legend span:before{content:'';display:inline-block;width:9px;height:9px;background:var(--c);margin-right:6px;border-radius:2px}aside{display:flex;flex-direction:column;gap:16px}.box{padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.box h2{font-size:15px;margin:0 0 15px}.box label{display:block;margin:14px 0 5px}select,input[type=range]{width:100%}.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stats strong{display:block;font-size:27px;font-variant-numeric:tabular-nums;color:var(--accent)}#status{min-height:48px}footer{padding-top:24px;color:#9eb2af}.actions{display:flex;gap:8px;flex-wrap:wrap}.boardhead{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;color:#9eb2af;font-size:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr}.intro{display:block}}@media(max-width:500px){main{padding:20px 12px}header{padding:16px}header small{display:none}aside{grid-template-columns:1fr}.toolbar{padding:10px;gap:6px}button{padding:8px 10px}.intro p{font-size:13px}}
</style>
<header><b>↗ 路径研究所 <small>ROUTE LAB</small></b><small>交互实验 01 / 图与搜索</small></header>
<main><div class="intro"><div><small>从一个起点，探索每一种可能。</small><h1>让算法走给你看。</h1></div><p class="muted">画一面墙，改变一片地形。<br>观察三种算法如何找到自己的路。</p></div>
<div class="layout"><section class="board"><div class="toolbar" id="tools"><button class="active" data-tool="wall">障碍</button><button data-tool="erase">橡皮</button><button data-tool="weight">高代价 ×5</button><button data-tool="start">起点 S</button><button data-tool="end">终点 E</button></div><div class="boardhead"><span>30 × 20 / 四方向移动</span><span>拖动绘制 · 拖动 S / E 改变位置</span></div><canvas id="grid" width="900" height="600" aria-label="可编辑寻路网格"></canvas><div class="legend"><span style="--c:#c5ed86">最短路径</span><span style="--c:#59b7a7">搜索前沿</span><span style="--c:#294d50">已访问</span><span style="--c:#a77c48">高代价</span><span style="--c:#66787d">障碍</span></div></section>
<aside><div class="box"><h2>01 / 搜索设置</h2><label for="algorithm">搜索算法</label><select id="algorithm"><option value="astar">A* · 曼哈顿启发式</option><option value="dijkstra">Dijkstra · 最小代价</option><option value="bfs">BFS · 最少步数</option></select><p id="description" class="muted"></p><label for="speed">速度 <output id="speedValue">30</output> 节点 / 秒</label><input id="speed" type="range" min="1" max="120" value="30"><div class="actions"><button id="run" class="primary">开始搜索</button><button id="step">单步</button></div></div>
<div class="box"><h2>02 / 实时观测</h2><div class="stats"><div><small>已访问</small><strong id="visited">0</strong></div><div><small>前沿</small><strong id="frontier">0</strong></div><div><small>路径步数</small><strong id="steps">—</strong></div><div><small>进入总代价</small><strong id="cost">—</strong></div></div><p id="status" role="status">准备就绪，选择算法后开始。</p></div>
<div class="box"><h2>03 / 地图</h2><select id="preset" aria-label="预设地图"><option value="weighted">加权走廊</option><option value="empty">空白网格</option><option value="maze">交错障碍</option><option value="closed">封闭终点</option></select><div class="actions" style="margin-top:14px"><button id="clear">清除搜索</button><button id="reset">重置地图</button></div></div></aside></div>
<footer>进入普通格代价为 1，高代价格为 5，起点代价不计入。编辑地图会停止搜索并清除旧结果。</footer></main>
<script>
const W=30,H=20,N=W*H,$=id=>document.getElementById(id),canvas=$('grid'),ctx=canvas.getContext('2d');
let cells=new Uint8Array(N),start=9*W+3,end=9*W+26,tool='wall',running=false,search=null,timer=0,drag=null,steps=0,cost=0;
function description(){ $('description').textContent=$('algorithm').value==='bfs'?'BFS 按步数搜索，不考虑高代价格的额外成本。':'寻找进入地形的最小总代价。A* 使用曼哈顿距离作为下界。';}
function clear(){running=false;search=null;$('run').textContent='开始搜索';$('visited').textContent='0';$('frontier').textContent='0';$('steps').textContent=$('cost').textContent='—';$('status').textContent='准备就绪，选择算法后开始。';draw();}
function preset(){cells.fill(0);start=9*W+3;end=9*W+26;const p=$('preset').value;if(p==='weighted')for(let x=8;x<23;x++)cells[9*W+x]=5;if(p==='maze')for(let x=7;x<27;x+=5)for(let y=1;y<19;y++)if(y!==(x%2?4:15))cells[y*W+x]=1;if(p==='closed')for(const d of [-1,1,-W,W])cells[end+d]=1;clear();}
function init(){let dist=new Float64Array(N);dist.fill(Infinity);dist[start]=0;let parent=new Int32Array(N);parent.fill(-1);search={dist,parent,open:[start],closed:new Set(),path:[],done:false,alg:$('algorithm').value};}
const heuristic=i=>Math.abs(i%W-end%W)+Math.abs(Math.floor(i/W)-Math.floor(end/W));
function step(){if(!search)init();if(search.done)return;const s=search;let k=0;if(s.alg!=='bfs')for(let i=1;i<s.open.length;i++){const a=s.open[i],b=s.open[k];if(s.dist[a]+(s.alg==='astar'?heuristic(a):0)<s.dist[b]+(s.alg==='astar'?heuristic(b):0))k=i;}
 if(!s.open.length){s.done=true;running=false;$('status').textContent='终点不可达。试着打开一道通路。';$('run').textContent='重新搜索';return draw();}
 const u=s.open.splice(k,1)[0];s.closed.add(u);
 if(u===end){s.done=true;running=false;for(let p=end;p!==-1;p=s.parent[p])s.path.unshift(p);steps=s.path.length-1;cost=s.path.slice(1).reduce((a,i)=>a+(cells[i]===5?5:1),0);$('steps').textContent=steps;$('cost').textContent=cost;$('status').textContent='找到路径 · '+(s.alg==='bfs'?'步数最少':'总代价最小');$('run').textContent='重新搜索';}
 else{const x=u%W,y=Math.floor(u/W);for(const v of [x>0?u-1:-1,x<W-1?u+1:-1,y>0?u-W:-1,y<H-1?u+W:-1]){if(v<0||cells[v]===1||s.closed.has(v))continue;const next=s.dist[u]+(s.alg==='bfs'?1:cells[v]===5?5:1);if(next<s.dist[v]){s.dist[v]=next;s.parent[v]=u;if(!s.open.includes(v))s.open.push(v);}}}
 $('visited').textContent=s.closed.size;$('frontier').textContent=s.open.length;draw();}
function draw(){ctx.clearRect(0,0,900,600);const path=new Set(search?.path),open=new Set(search?.open);for(let i=0;i<N;i++){const x=(i%W)*30,y=Math.floor(i/W)*30;ctx.fillStyle=cells[i]===1?'#66787d':path.has(i)?'#c5ed86':open.has(i)?'#59b7a7':search?.closed.has(i)?'#294d50':cells[i]===5?'#695033':'#1b292c';ctx.fillRect(x+1,y+1,28,28);if(cells[i]===5&&!path.has(i)){ctx.fillStyle='#dcb880';ctx.font='11px system-ui';ctx.fillText('5',x+12,y+20);}}for(const [i,label,color]of [[start,'S','#c5ed86'],[end,'E','#eea8a0']]){ctx.fillStyle=color;ctx.fillRect(i%W*30+2,Math.floor(i/W)*30+2,26,26);ctx.fillStyle='#122023';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText(label,i%W*30+15,Math.floor(i/W)*30+21);ctx.textAlign='left';}}
function cellAt(e){const b=canvas.getBoundingClientRect();return Math.max(0,Math.min(H-1,Math.floor((e.clientY-b.top)/b.height*H)))*W+Math.max(0,Math.min(W-1,Math.floor((e.clientX-b.left)/b.width*W)));}
function edit(i){clear();const mode=drag||tool;if(mode==='start'){if(i!==end&&cells[i]!==1)start=i;}else if(mode==='end'){if(i!==start&&cells[i]!==1)end=i;}else if(i!==start&&i!==end)cells[i]=mode==='wall'?1:mode==='weight'?5:0;draw();}
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);const i=cellAt(e);drag=i===start?'start':i===end?'end':tool;edit(i);};canvas.onpointermove=e=>{if(drag)edit(cellAt(e));};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
$('tools').onclick=e=>{if(!e.target.dataset.tool)return;tool=e.target.dataset.tool;for(const b of $('tools').children)b.classList.toggle('active',b===e.target);};
$('run').onclick=()=>{if(search?.done)clear();if(!search)init();running=!running;$('run').textContent=running?'暂停':'继续搜索';$('status').textContent=running?'正在探索…':'已暂停，可点击单步观察。';};$('step').onclick=()=>{running=false;$('run').textContent='继续搜索';if(search?.done)clear();step();};$('clear').onclick=clear;$('reset').onclick=preset;$('preset').onchange=preset;$('algorithm').onchange=()=>{clear();description();};$('speed').oninput=()=>{$('speedValue').value=$('speed').value;};
let last=performance.now();function frame(t){timer+=Math.min(t-last,100);last=t;if(running){let budget=0;while(timer>1000/+$('speed').value&&running&&budget++<20){timer-=1000/+$('speed').value;step();}}else timer=0;requestAnimationFrame(frame);}description();preset();requestAnimationFrame(frame);
window.lab={getState:()=>({cells:Array.from(cells),start,end,running,search:search?{done:search.done,path:search.path,visited:search.closed.size}:null,steps,cost}),solve:()=>{clear();init();for(let n=0;n<N*2&&!search.done;n++)step();return {steps,cost,reachable:search.path.length>0};}};
</script></html>
