<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网格寻路算法实验室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 8px;
            font-size: 14px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 300px;
            }
        }

        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #222;
            grid-column: 1 / -1;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .canvas-container {
            background-color: #fafafa;
            border: 2px solid #ddd;
            border-radius: 6px;
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
            overflow-y: auto;
            max-height: 70vh;
        }

        canvas {
            border: 1px solid #ccc;
            background-color: white;
            cursor: crosshair;
            display: block;
        }

        .control-panel {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-title {
            font-weight: 600;
            color: #555;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            cursor: pointer;
        }

        select, input[type="range"] {
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            width: 100%;
        }

        input[type="range"] {
            padding: 0;
            height: 6px;
        }

        button {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
            color: #333;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        button:hover {
            background-color: #f0f0f0;
            border-color: #999;
        }

        button:active {
            background-color: #e8e8e8;
        }

        button.primary {
            background-color: #4CAF50;
            color: white;
            border-color: #45a049;
        }

        button.primary:hover {
            background-color: #45a049;
        }

        button.danger {
            background-color: #f44336;
            color: white;
            border-color: #da190b;
        }

        button.danger:hover {
            background-color: #da190b;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats {
            background-color: #e8f5e9;
            border-left: 3px solid #4CAF50;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.6;
        }

        .stats-label {
            font-weight: 500;
            color: #2e7d32;
        }

        .grid-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .grid-options button {
            flex: 1;
            min-width: 80px;
        }

        .color-legend {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 8px;
            font-size: 12px;
            line-height: 1.5;
        }

        .color-box {
            width: 20px;
            height: 20px;
            border-radius: 2px;
            display: inline-block;
        }

        .info-box {
            background-color: #fff3cd;
            border-left: 3px solid #ffc107;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.5;
        }

        .error-box {
            background-color: #f8d7da;
            border-left: 3px solid #f44336;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #721c24;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .button-group.full {
            grid-template-columns: 1fr;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .speed-control input {
            flex: 1;
        }

        .speed-value {
            min-width: 40px;
            font-weight: 500;
            color: #666;
        }

        @media (max-width: 500px) {
            body {
                padding: 4px;
            }

            .container {
                padding: 12px;
            }

            h1 {
                font-size: 20px;
            }

            .canvas-container {
                max-height: 50vh;
            }

            button {
                padding: 6px 10px;
                font-size: 12px;
            }

            .section-title {
                font-size: 12px;
            }

            label {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 网格寻路算法实验室</h1>
        
        <div class="main-content">
            <div class="canvas-container">
                <canvas id="grid"></canvas>
            </div>
        </div>

        <div class="control-panel">
            <!-- 算法选择 -->
            <div class="section">
                <div class="section-title">算法</div>
                <label>
                    <input type="radio" name="algorithm" value="bfs" checked>
                    BFS (广度优先)
                </label>
                <label>
                    <input type="radio" name="algorithm" value="dijkstra">
                    Dijkstra (最短路径)
                </label>
                <label>
                    <input type="radio" name="algorithm" value="astar">
                    A* (启发式搜索)
                </label>
            </div>

            <!-- 编辑模式 -->
            <div class="section">
                <div class="section-title">编辑模式</div>
                <label>
                    <input type="radio" name="mode" value="obstacle" checked>
                    🚫 绘制障碍
                </label>
                <label>
                    <input type="radio" name="mode" value="cost">
                    ⚠️ 高代价地形
                </label>
                <label>
                    <input type="radio" name="mode" value="erase">
                    🗑️ 擦除
                </label>
            </div>

            <!-- 网格大小 -->
            <div class="section">
                <div class="section-title">网格大小</div>
                <div class="grid-options">
                    <button onclick="app.setGridSize(15)">15×15</button>
                    <button onclick="app.setGridSize(20)">20×20</button>
                    <button onclick="app.setGridSize(25)">25×25</button>
                    <button onclick="app.setGridSize(30)">30×30</button>
                </div>
            </div>

            <!-- 预设地图 -->
            <div class="section">
                <div class="section-title">预设地图</div>
                <select id="preset" onchange="app.loadPreset(this.value)">
                    <option value="">-- 选择预设 --</option>
                    <option value="maze">迷宫</option>
                    <option value="corridor">走廊</option>
                    <option value="islands">孤岛</option>
                </select>
            </div>

            <!-- 速度控制 -->
            <div class="section">
                <div class="section-title">搜索速度</div>
                <div class="speed-control">
                    <input type="range" id="speed" min="1" max="100" value="50" 
                           oninput="app.setSpeed(this.value)">
                    <span class="speed-value" id="speedValue">50ms</span>
                </div>
            </div>

            <!-- 控制按钮 -->
            <div class="section">
                <div class="section-title">控制</div>
                <button class="primary" onclick="app.startSearch()">▶️ 开始搜索</button>
                <div class="button-group">
                    <button onclick="app.pauseSearch()">⏸️ 暂停</button>
                    <button onclick="app.stepSearch()">➡️ 单步</button>
                </div>
                <div class="button-group">
                    <button onclick="app.clearSearch()">🧹 清除搜索</button>
                    <button class="danger" onclick="app.reset()">🔄 重置</button>
                </div>
            </div>

            <!-- 统计信息 -->
            <div class="stats" id="stats">
                <div><span class="stats-label">状态:</span> <span id="status">就绪</span></div>
                <div><span class="stats-label">步数:</span> <span id="steps">0</span></div>
                <div><span class="stats-label">代价:</span> <span id="cost">0</span></div>
                <div><span class="stats-label">已访问:</span> <span id="visited">0</span></div>
            </div>

            <!-- 颜色说明 -->
            <div class="section">
                <div class="section-title">图例</div>
                <div class="color-legend">
                    <div class="color-box" style="background-color: #4CAF50;"></div>
                    <div>起点</div>
                    <div class="color-box" style="background-color: #f44336;"></div>
                    <div>终点</div>
                    <div class="color-box" style="background-color: #333;"></div>
                    <div>障碍</div>
                    <div class="color-box" style="background-color: #FFD54F;"></div>
                    <div>高代价</div>
                    <div class="color-box" style="background-color: #90CAF9;"></div>
                    <div>搜索前沿</div>
                    <div class="color-box" style="background-color: #CE93D8;"></div>
                    <div>已访问</div>
                    <div class="color-box" style="background-color: #FF6F00;"></div>
                    <div>最终路径</div>
                </div>
            </div>

            <!-- 操作说明 -->
            <div class="info-box">
                <strong>操作说明:</strong><br>
                • 鼠标拖动可设置起点和终点<br>
                • 点击绘制障碍或高代价地形<br>
                • 点击已绘制的地形可删除<br>
                • 移动端长按可拖动
            </div>

            <div id="errorBox"></div>
        </div>
    </div>
    <script>
class Grid {
    constructor(width, height, cellSize = 20) {
        this.width = width;
        this.height = height;
        this.cellSize = cellSize;
        this.cells = Array(height).fill().map(() => Array(width).fill(0));
        this.start = { x: 1, y: 1 };
        this.end = { x: width - 2, y: height - 2 };
    }

    getCell(x, y) {
        if (x >= 0 && x < this.width && y >= 0 && y < this.height) {
            return this.cells[y][x];
        }
        return -1;
    }

    setCell(x, y, value) {
        if (x >= 0 && x < this.width && y >= 0 && y < this.height) {
            this.cells[y][x] = value;
        }
    }

    setObstacle(x, y) {
        if ((x === this.start.x && y === this.start.y) || 
            (x === this.end.x && y === this.end.y)) return;
        this.setCell(x, y, -1);
    }

    setCost(x, y, cost) {
        if ((x === this.start.x && y === this.start.y) || 
            (x === this.end.x && y === this.end.y)) return;
        this.setCell(x, y, cost);
    }

    erase(x, y) {
        if ((x === this.start.x && y === this.start.y) || 
            (x === this.end.x && y === this.end.y)) return;
        this.setCell(x, y, 0);
    }

    setStart(x, y) {
        if (this.getCell(x, y) !== -1) {
            this.start = { x, y };
        }
    }

    setEnd(x, y) {
        if (this.getCell(x, y) !== -1) {
            this.end = { x, y };
        }
    }

    reset() {
        this.cells = Array(this.height).fill().map(() => Array(this.width).fill(0));
        this.start = { x: 1, y: 1 };
        this.end = { x: this.width - 2, y: this.height - 2 };
    }

    clone() {
        const newGrid = new Grid(this.width, this.height, this.cellSize);
        newGrid.cells = this.cells.map(row => [...row]);
        newGrid.start = { ...this.start };
        newGrid.end = { ...this.end };
        return newGrid;
    }
}

class PathFinder {
    constructor(grid) {
        this.grid = grid;
        this.openSet = [];
        this.closedSet = new Set();
        this.cameFrom = new Map();
        this.gScore = new Map();
        this.fScore = new Map();
        this.frontier = [];
        this.visited = [];
        this.path = [];
        this.finished = false;
        this.endReachable = true;
    }

    key(x, y) {
        return \\,\\;
    }

    heuristic(x, y) {
        return Math.abs(x - this.grid.end.x) + Math.abs(y - this.grid.end.y);
    }

    initBFS() {
        this.frontier = [this.grid.start];
        this.closedSet.clear();
        this.cameFrom.clear();
        this.visited = [];
        this.path = [];
        this.finished = false;
        this.endReachable = true;
    }

    stepBFS() {
        if (this.frontier.length === 0) {
            this.finished = true;
            if (!this.closedSet.has(this.key(this.grid.end.x, this.grid.end.y))) {
                this.endReachable = false;
            }
            return false;
        }

        const current = this.frontier.shift();
        const key = this.key(current.x, current.y);

        if (this.closedSet.has(key)) return true;
        this.closedSet.add(key);
        this.visited.push(current);

        if (current.x === this.grid.end.x && current.y === this.grid.end.y) {
            this.reconstructPath();
            this.finished = true;
            return false;
        }

        const directions = [
            { x: 0, y: -1 }, { x: 1, y: 0 },
            { x: 0, y: 1 }, { x: -1, y: 0 }
        ];

        for (const dir of directions) {
            const nx = current.x + dir.x;
            const ny = current.y + dir.y;
            const nkey = this.key(nx, ny);

            if (this.grid.getCell(nx, ny) !== -1 && !this.closedSet.has(nkey)) {
                const neighbor = { x: nx, y: ny };
                if (!this.frontier.some(p => p.x === nx && p.y === ny)) {
                    this.cameFrom.set(nkey, current);
                    this.frontier.push(neighbor);
                }
            }
        }

        return true;
    }

    initDijkstra() {
        this.openSet = [this.grid.start];
        this.closedSet.clear();
        this.cameFrom.clear();
        this.gScore.clear();
        this.visited = [];
        this.path = [];
        this.finished = false;
        this.endReachable = true;
        this.gScore.set(this.key(this.grid.start.x, this.grid.start.y), 0);
    }

    stepDijkstra() {
        if (this.openSet.length === 0) {
            this.finished = true;
            if (!this.closedSet.has(this.key(this.grid.end.x, this.grid.end.y))) {
                this.endReachable = false;
            }
            return false;
        }

        let minIdx = 0;
        let minCost = this.gScore.get(this.key(this.openSet[0].x, this.openSet[0].y)) || Infinity;
        for (let i = 1; i < this.openSet.length; i++) {
            const cost = this.gScore.get(this.key(this.openSet[i].x, this.openSet[i].y)) || Infinity;
            if (cost < minCost) {
                minCost = cost;
                minIdx = i;
            }
        }

        const current = this.openSet[minIdx];
        this.openSet.splice(minIdx, 1);
        const key = this.key(current.x, current.y);

        if (this.closedSet.has(key)) return true;
        this.closedSet.add(key);
        this.visited.push(current);

        if (current.x === this.grid.end.x && current.y === this.grid.end.y) {
            this.reconstructPath();
            this.finished = true;
            return false;
        }

        const directions = [
            { x: 0, y: -1 }, { x: 1, y: 0 },
            { x: 0, y: 1 }, { x: -1, y: 0 }
        ];

        for (const dir of directions) {
            const nx = current.x + dir.x;
            const ny = current.y + dir.y;
            const nkey = this.key(nx, ny);

            if (this.grid.getCell(nx, ny) !== -1 && !this.closedSet.has(nkey)) {
                const cellValue = this.grid.getCell(nx, ny);
                const cost = (cellValue > 0) ? cellValue : 1;
                const newG = (this.gScore.get(key) || 0) + cost;

                if (!this.gScore.has(nkey) || newG < this.gScore.get(nkey)) {
                    this.cameFrom.set(nkey, current);
                    this.gScore.set(nkey, newG);
                    if (!this.openSet.some(p => p.x === nx && p.y === ny)) {
                        this.openSet.push({ x: nx, y: ny });
                    }
                }
            }
        }

        return true;
    }

    initAStar() {
        this.openSet = [this.grid.start];
        this.closedSet.clear();
        this.cameFrom.clear();
        this.gScore.clear();
        this.fScore.clear();
        this.visited = [];
        this.path = [];
        this.finished = false;
        this.endReachable = true;
        const startKey = this.key(this.grid.start.x, this.grid.start.y);
        this.gScore.set(startKey, 0);
        this.fScore.set(startKey, this.heuristic(this.grid.start.x, this.grid.start.y));
    }

    stepAStar() {
        if (this.openSet.length === 0) {
            this.finished = true;
            if (!this.closedSet.has(this.key(this.grid.end.x, this.grid.end.y))) {
                this.endReachable = false;
            }
            return false;
        }

        let minIdx = 0;
        let minF = this.fScore.get(this.key(this.openSet[0].x, this.openSet[0].y)) || Infinity;
        for (let i = 1; i < this.openSet.length; i++) {
            const f = this.fScore.get(this.key(this.openSet[i].x, this.openSet[i].y)) || Infinity;
            if (f < minF) {
                minF = f;
                minIdx = i;
            }
        }

        const current = this.openSet[minIdx];
        this.openSet.splice(minIdx, 1);
        const key = this.key(current.x, current.y);

        if (this.closedSet.has(key)) return true;
        this.closedSet.add(key);
        this.visited.push(current);

        if (current.x === this.grid.end.x && current.y === this.grid.end.y) {
            this.reconstructPath();
            this.finished = true;
            return false;
        }

        const directions = [
            { x: 0, y: -1 }, { x: 1, y: 0 },
            { x: 0, y: 1 }, { x: -1, y: 0 }
        ];

        for (const dir of directions) {
            const nx = current.x + dir.x;
            const ny = current.y + dir.y;
            const nkey = this.key(nx, ny);

            if (this.grid.getCell(nx, ny) !== -1 && !this.closedSet.has(nkey)) {
                const cellValue = this.grid.getCell(nx, ny);
                const cost = (cellValue > 0) ? cellValue : 1;
                const newG = (this.gScore.get(key) || 0) + cost;

                if (!this.gScore.has(nkey) || newG < this.gScore.get(nkey)) {
                    this.cameFrom.set(nkey, current);
                    this.gScore.set(nkey, newG);
                    this.fScore.set(nkey, newG + this.heuristic(nx, ny));
                    if (!this.openSet.some(p => p.x === nx && p.y === ny)) {
                        this.openSet.push({ x: nx, y: ny });
                    }
                }
            }
        }

        return true;
    }

    reconstructPath() {
        this.path = [];
        let current = this.grid.end;
        while (this.key(current.x, current.y) !== this.key(this.grid.start.x, this.grid.start.y)) {
            this.path.unshift(current);
            const prev = this.cameFrom.get(this.key(current.x, current.y));
            if (!prev) break;
            current = prev;
        }
        this.path.unshift(this.grid.start);
    }

    getCost() {
        if (this.path.length === 0) return 0;
        let cost = 0;
        for (let i = 0; i < this.path.length - 1; i++) {
            const cellValue = this.grid.getCell(this.path[i + 1].x, this.path[i + 1].y);
            cost += (cellValue > 0) ? cellValue : 1;
        }
        return cost;
    }
}

class Renderer {
    constructor(canvas, grid) {
        this.canvas = canvas;
        this.grid = grid;
        this.ctx = canvas.getContext('2d');
        this.resize();
    }

    resize() {
        this.canvas.width = this.grid.width * this.grid.cellSize;
        this.canvas.height = this.grid.height * this.grid.cellSize;
    }

    clear() {
        this.ctx.fillStyle = 'white';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    }

    drawGrid() {
        this.clear();
        const cs = this.grid.cellSize;

        for (let y = 0; y < this.grid.height; y++) {
            for (let x = 0; x < this.grid.width; x++) {
                const cell = this.grid.getCell(x, y);
                const px = x * cs;
                const py = y * cs;

                if (cell === -1) {
                    this.ctx.fillStyle = '#333';
                    this.ctx.fillRect(px, py, cs, cs);
                } else if (cell > 0) {
                    this.ctx.fillStyle = '#FFD54F';
                    this.ctx.fillRect(px, py, cs, cs);
                    this.ctx.strokeStyle = '#FFA000';
                    this.ctx.lineWidth = 1;
                    this.ctx.strokeRect(px, py, cs, cs);
                    this.ctx.fillStyle = '#333';
                    this.ctx.font = 'bold 10px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillText(cell, px + cs / 2, py + cs / 2);
                }

                this.ctx.strokeStyle = '#eee';
                this.ctx.lineWidth = 0.5;
                this.ctx.strokeRect(px, py, cs, cs);
            }
        }
    }

    drawPath(visited, frontier, path) {
        const cs = this.grid.cellSize;

        visited.forEach(p => {
            this.ctx.fillStyle = 'rgba(206, 147, 216, 0.6)';
            this.ctx.fillRect(p.x * cs, p.y * cs, cs, cs);
        });

        frontier.forEach(p => {
            this.ctx.fillStyle = 'rgba(144, 202, 249, 0.8)';
            this.ctx.fillRect(p.x * cs, p.y * cs, cs, cs);
        });

        path.forEach(p => {
            if ((p.x !== this.grid.start.x || p.y !== this.grid.start.y) &&
                (p.x !== this.grid.end.x || p.y !== this.grid.end.y)) {
                this.ctx.fillStyle = '#FF6F00';
                this.ctx.fillRect(p.x * cs, p.y * cs, cs, cs);
            }
        });
    }

    drawPoints() {
        const cs = this.grid.cellSize;

        this.ctx.fillStyle = '#4CAF50';
        this.ctx.fillRect(this.grid.start.x * cs, this.grid.start.y * cs, cs, cs);
        this.ctx.strokeStyle = '#2E7D32';
        this.ctx.lineWidth = 2;
        this.ctx.strokeRect(this.grid.start.x * cs, this.grid.start.y * cs, cs, cs);

        this.ctx.fillStyle = '#f44336';
        this.ctx.fillRect(this.grid.end.x * cs, this.grid.end.y * cs, cs, cs);
        this.ctx.strokeStyle = '#d32f2f';
        this.ctx.lineWidth = 2;
        this.ctx.strokeRect(this.grid.end.x * cs, this.grid.end.y * cs, cs, cs);
    }

    render(visited, frontier, path) {
        this.drawGrid();
        this.drawPath(visited, frontier, path);
        this.drawPoints();
    }
}

class Application {
    constructor() {
        this.canvas = document.getElementById('grid');
        this.grid = new Grid(20, 20);
        this.renderer = new Renderer(this.canvas, this.grid);
        this.pathfinder = null;
        this.searching = false;
        this.paused = false;
        this.speed = 50;
        this.draggingStart = false;
        this.draggingEnd = false;
        this.dragMode = null;

        this.setupEventListeners();
        this.render();
    }

    setupEventListeners() {
        this.canvas.addEventListener('mousedown', e => this.onMouseDown(e));
        this.canvas.addEventListener('mousemove', e => this.onMouseMove(e));
        this.canvas.addEventListener('mouseup', e => this.onMouseUp(e));
        this.canvas.addEventListener('mouseleave', e => this.onMouseLeave(e));

        this.canvas.addEventListener('touchstart', e => this.onTouchStart(e));
        this.canvas.addEventListener('touchmove', e => this.onTouchMove(e));
        this.canvas.addEventListener('touchend', e => this.onTouchEnd(e));

        document.querySelectorAll('input[name="mode"]').forEach(radio => {
            radio.addEventListener('change', () => this.updateMode());
        });

        document.querySelectorAll('input[name="algorithm"]').forEach(radio => {
            radio.addEventListener('change', () => this.updateAlgorithm());
        });
    }

    getMousePos(e) {
        const rect = this.canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const gridX = Math.floor(x / this.grid.cellSize);
        const gridY = Math.floor(y / this.grid.cellSize);
        return { x: gridX, y: gridY };
    }

    getTouchPos(e) {
        if (e.touches.length === 0) return null;
        const rect = this.canvas.getBoundingClientRect();
        const x = e.touches[0].clientX - rect.left;
        const y = e.touches[0].clientY - rect.top;
        const gridX = Math.floor(x / this.grid.cellSize);
        const gridY = Math.floor(y / this.grid.cellSize);
        return { x: gridX, y: gridY };
    }

    onMouseDown(e) {
        if (this.searching) return;
        const pos = this.getMousePos(e);
        if (pos.x < 0 || pos.x >= this.grid.width || pos.y < 0 || pos.y >= this.grid.height) return;

        if (e.ctrlKey || e.metaKey) {
            if (pos.x === this.grid.start.x && pos.y === this.grid.start.y) {
                this.draggingStart = true;
                this.dragMode = 'start';
            } else if (pos.x === this.grid.end.x && pos.y === this.grid.end.y) {
                this.draggingEnd = true;
                this.dragMode = 'end';
            }
        } else {
            this.editGrid(pos.x, pos.y);
        }
    }

    onMouseMove(e) {
        if (this.searching) return;
        const pos = this.getMousePos(e);
        if (pos.x < 0 || pos.x >= this.grid.width || pos.y < 0 || pos.y >= this.grid.height) return;

        if (this.draggingStart) {
            this.grid.setStart(pos.x, pos.y);
            this.render();
        } else if (this.draggingEnd) {
            this.grid.setEnd(pos.x, pos.y);
            this.render();
        } else if (e.buttons === 1) {
            this.editGrid(pos.x, pos.y);
        }
    }

    onMouseUp(e) {
        this.draggingStart = false;
        this.draggingEnd = false;
    }

    onMouseLeave(e) {
        this.draggingStart = false;
        this.draggingEnd = false;
    }

    onTouchStart(e) {
        if (this.searching) return;
        const pos = this.getTouchPos(e);
        if (!pos || pos.x < 0 || pos.x >= this.grid.width || pos.y < 0 || pos.y >= this.grid.height) return;

        if (pos.x === this.grid.start.x && pos.y === this.grid.start.y) {
            this.draggingStart = true;
            this.dragMode = 'start';
        } else if (pos.x === this.grid.end.x && pos.y === this.grid.end.y) {
            this.draggingEnd = true;
            this.dragMode = 'end';
        } else {
            this.editGrid(pos.x, pos.y);
        }
    }

    onTouchMove(e) {
        if (this.searching) return;
        e.preventDefault();
        const pos = this.getTouchPos(e);
        if (!pos || pos.x < 0 || pos.x >= this.grid.width || pos.y < 0 || pos.y >= this.grid.height) return;

        if (this.draggingStart) {
            this.grid.setStart(pos.x, pos.y);
            this.render();
        } else if (this.draggingEnd) {
            this.grid.setEnd(pos.x, pos.y);
            this.render();
        }
    }

    onTouchEnd(e) {
        this.draggingStart = false;
        this.draggingEnd = false;
    }

    editGrid(x, y) {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        if (mode === 'obstacle') {
            this.grid.setObstacle(x, y);
        } else if (mode === 'cost') {
            this.grid.setCost(x, y, 3);
        } else if (mode === 'erase') {
            this.grid.erase(x, y);
        }
        this.render();
    }

    updateMode() {
        this.clearError();
    }

    updateAlgorithm() {
        this.clearError();
    }

    setGridSize(size) {
        this.grid = new Grid(size, size);
        this.renderer = new Renderer(this.canvas, this.grid);
        this.render();
        this.clearSearch();
    }

    loadPreset(name) {
        if (!name) return;
        this.grid.reset();

        if (name === 'maze') {
            for (let y = 2; y < this.grid.height - 2; y += 2) {
                for (let x = 2; x < this.grid.width - 2; x += 2) {
                    this.grid.setObstacle(x, y);
                }
            }
            for (let y = 3; y < this.grid.height - 2; y += 2) {
                for (let x = 2; x < this.grid.width - 1; x += 3) {
                    if (Math.random() > 0.5) this.grid.setObstacle(x, y);
                }
            }
        } else if (name === 'corridor') {
            for (let x = 0; x < this.grid.width; x++) {
                this.grid.setObstacle(x, 5);
                this.grid.setObstacle(x, this.grid.height - 6);
            }
            this.grid.erase(this.grid.width - 2, 5);
            this.grid.erase(this.grid.width - 2, this.grid.height - 6);
        } else if (name === 'islands') {
            for (let i = 0; i < 5; i++) {
                const cx = Math.random() * (this.grid.width - 6) + 3;
                const cy = Math.random() * (this.grid.height - 6) + 3;
                for (let y = cy - 2; y <= cy + 2; y++) {
                    for (let x = cx - 2; x <= cx + 2; x++) {
                        if (Math.random() > 0.3) this.grid.setObstacle(x, y);
                    }
                }
            }
        }

        document.getElementById('preset').value = '';
        this.render();
    }

    setSpeed(value) {
        this.speed = 101 - parseInt(value);
        document.getElementById('speedValue').textContent = this.speed + 'ms';
    }

    startSearch() {
        const algo = document.querySelector('input[name="algorithm"]:checked').value;
        this.pathfinder = new PathFinder(this.grid);

        if (algo === 'bfs') {
            this.pathfinder.initBFS();
        } else if (algo === 'dijkstra') {
            this.pathfinder.initDijkstra();
        } else if (algo === 'astar') {
            this.pathfinder.initAStar();
        }

        this.searching = true;
        this.paused = false;
        this.updateStatus('搜索中...');
        this.runSearch();
    }

    pauseSearch() {
        this.paused = !this.paused;
        if (!this.paused && this.searching) {
            this.runSearch();
        }
    }

    stepSearch() {
        if (!this.pathfinder) return;
        const algo = document.querySelector('input[name="algorithm"]:checked').value;
        let step = false;

        if (algo === 'bfs') {
            step = this.pathfinder.stepBFS();
        } else if (algo === 'dijkstra') {
            step = this.pathfinder.stepDijkstra();
        } else if (algo === 'astar') {
            step = this.pathfinder.stepAStar();
        }

        this.updateStats();
        this.render();

        if (!step) {
            this.finishSearch();
        }
    }

    runSearch() {
        if (!this.searching || this.paused || !this.pathfinder) return;

        this.stepSearch();
        setTimeout(() => this.runSearch(), this.speed);
    }

    finishSearch() {
        this.searching = false;
        if (this.pathfinder.endReachable) {
            this.updateStatus('搜索完成 ✓');
        } else {
            this.updateStatus('终点不可达 ✗');
        }
    }

    clearSearch() {
        this.searching = false;
        this.paused = false;
        this.pathfinder = null;
        this.updateStatus('就绪');
        this.clearStats();
        this.render();
    }

    reset() {
        this.grid.reset();
        this.clearSearch();
    }

    updateStatus(text) {
        document.getElementById('status').textContent = text;
    }

    updateStats() {
        if (!this.pathfinder) return;
        document.getElementById('visited').textContent = this.pathfinder.visited.length;
        document.getElementById('steps').textContent = this.pathfinder.path.length - 1;
        document.getElementById('cost').textContent = this.pathfinder.getCost();
    }

    clearStats() {
        document.getElementById('visited').textContent = '0';
        document.getElementById('steps').textContent = '0';
        document.getElementById('cost').textContent = '0';
    }

    showError(message) {
        const errorBox = document.getElementById('errorBox');
        errorBox.innerHTML = \<div class="error-box">\</div>\;
    }

    clearError() {
        document.getElementById('errorBox').innerHTML = '';
    }

    render() {
        const visited = this.pathfinder ? this.pathfinder.visited : [];
        const frontier = this.pathfinder ? this.pathfinder.frontier : [];
        const path = this.pathfinder ? this.pathfinder.path : [];
        this.renderer.render(visited, frontier, path);
    }
}

const app = new Application();
    </script>
</body>
