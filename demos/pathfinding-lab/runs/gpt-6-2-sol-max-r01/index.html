<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eff3ea" />
    <title>寻路算法实验室</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #182c27;
        --muted: #51655d;
        --paper: #eff3ea;
        --white: #fdfef9;
        --line: #ced9cd;
        --accent: #1b634e;
        font:
          15px/1.55 "Microsoft YaHei",
          system-ui,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
      }
      button,
      select,
      input {
        font: inherit;
      }
      button,
      select {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        color: inherit;
        min-height: 42px;
        padding: 7px 12px;
      }
      button {
        cursor: pointer;
      }
      button:hover:not(:disabled),
      select:hover {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.46;
        cursor: default;
      }
      button[aria-pressed="true"] {
        background: #dcece1;
        border-color: #41816b;
        color: #15503e;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
        font-weight: 650;
      }
      :focus-visible {
        outline: 2px solid #087659;
        outline-offset: 3px;
      }
      header,
      main {
        width: min(1240px, 100% - 48px);
        margin: auto;
      }
      header {
        padding: 33px 0 23px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        font-family: "Songti SC", SimSun, serif;
        font-size: clamp(30px, 5vw, 54px);
        font-weight: 700;
        letter-spacing: -0.065em;
        line-height: 1.1;
      }
      .subtitle {
        color: var(--muted);
        margin-top: 11px;
      }
      .dimensions {
        font-size: 13px;
        font-family: ui-monospace, monospace;
        color: var(--muted);
        white-space: nowrap;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 235px;
        gap: 16px;
        margin-block: 19px 40px;
      }
      .board,
      .panel {
        min-width: 0;
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 13px;
      }
      .board {
        padding: 15px;
      }
      .toolbar,
      .buttons,
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .toolbar {
        justify-content: space-between;
        margin-bottom: 12px;
        align-items: center;
      }
      .toolbar label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }
      #grid {
        display: block;
        width: 100%;
        aspect-ratio: 29/17;
        border-radius: 7px;
        background: #e2e9df;
        touch-action: none;
        cursor: crosshair;
      }
      .legend {
        margin-top: 13px;
        gap: 9px 17px;
        color: var(--muted);
        font-size: 12px;
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .legend i {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        background: var(--swatch);
      }
      .panel {
        padding: 16px;
        align-self: start;
        display: grid;
        gap: 15px;
      }
      h2 {
        font-size: 14px;
      }
      #algorithm {
        width: 100%;
        margin-block: 6px;
      }
      .note {
        color: var(--muted);
        font-size: 12px;
      }
      .stats {
        margin: 0;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1px;
        background: var(--line);
        border: 1px solid var(--line);
        border-radius: 9px;
        overflow: hidden;
      }
      .stats div {
        background: #f0f4ec;
        padding: 9px;
      }
      dt {
        font-size: 11px;
        color: var(--muted);
      }
      dd {
        margin: 0;
        font:
          700 20px/1.6 ui-monospace,
          monospace;
      }
      #status {
        font-weight: 650;
        color: var(--accent);
        min-height: 23px;
      }
      .speed {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 3px 8px;
        font-size: 12px;
      }
      .speed input {
        grid-column: 1/-1;
        width: 100%;
        accent-color: var(--accent);
      }
      @media (max-width: 760px) {
        header,
        main {
          width: calc(100% - 24px);
        }
        header {
          padding-top: 22px;
          align-items: start;
        }
        .dimensions {
          padding-top: 6px;
        }
        main {
          grid-template-columns: 1fr;
        }
        .board,
        .panel {
          padding: 10px;
        }
        .subtitle {
          font-size: 12px;
        }
        .toolbar button,
        .toolbar select {
          font-size: 12px;
          padding-inline: 9px;
        }
        .toolbar label {
          font-size: 12px;
        }
        .stats {
          grid-template-columns: repeat(4, 1fr);
        }
      }
    </style>
    <script src="../../../../assets/analytics.js" defer></script>
  </head>
  <body>
    <header>
      <div>
        <h1>寻路算法实验室</h1>
        <p class="subtitle">在网格上布置地形，逐步观察三种算法如何找到终点。</p>
      </div>
      <span class="dimensions">29 × 17</span>
    </header>
    <main>
      <section class="board" aria-label="地图">
        <div class="toolbar">
          <div class="buttons" id="tools" aria-label="地图工具">
            <button data-tool="wall" aria-pressed="true">障碍</button
            ><button data-tool="heavy" aria-pressed="false">高代价</button
            ><button data-tool="erase" aria-pressed="false">擦除</button
            ><button data-tool="start" aria-pressed="false">移动起点</button
            ><button data-tool="end" aria-pressed="false">移动终点</button>
          </div>
          <label
            >预设
            <select id="preset">
              <option value="maze">走廊迷宫</option>
              <option value="cost">加权捷径</option>
              <option value="closed">封闭终点</option>
              <option value="blank">空白网格</option>
            </select></label
          >
        </div>
        <canvas
          id="grid"
          tabindex="0"
          aria-label="寻路网格"
          aria-describedby="map-help"
        ></canvas>
        <div class="legend" aria-label="图例">
          <span><i style="--swatch: #147d58"></i>起点</span
          ><span><i style="--swatch: #b64a45"></i>终点</span
          ><span><i style="--swatch: #31463e"></i>障碍</span
          ><span><i style="--swatch: #e7b967"></i>代价 5</span
          ><span><i style="--swatch: #b3dbfa"></i>前沿</span
          ><span><i style="--swatch: #b8d8cb"></i>已访问</span
          ><span><i style="--swatch: #eab945"></i>路径</span>
        </div>
        <p class="note" id="map-help">
          拖画地形，或直接拖动起点与终点。键盘可用方向键定位、空格应用工具。
        </p>
      </section>
      <section class="panel" aria-label="算法控制">
        <div>
          <h2><label for="algorithm">寻路算法</label></h2>
          <select id="algorithm">
            <option value="astar">A* · 曼哈顿距离</option>
            <option value="dijkstra">Dijkstra · 最小代价</option>
            <option value="bfs">BFS · 最少步数</option>
          </select>
          <p class="note" id="algorithm-note"></p>
        </div>
        <p id="status" role="status"></p>
        <dl class="stats">
          <div>
            <dt>路径步数</dt>
            <dd id="steps">—</dd>
          </div>
          <div>
            <dt>总代价</dt>
            <dd id="cost">—</dd>
          </div>
          <div>
            <dt>已访问</dt>
            <dd id="visited">0</dd>
          </div>
          <div>
            <dt>搜索前沿</dt>
            <dd id="frontier">0</dd>
          </div>
        </dl>
        <div class="buttons">
          <button class="primary" id="run">运行</button
          ><button id="pause">暂停</button><button id="step">单步</button>
        </div>
        <label class="speed"
          >搜索速度 <output for="speed" id="rate">90 节点/秒</output
          ><input id="speed" type="range" min="5" max="360" value="90" step="5"
        /></label>
        <div class="buttons">
          <button id="clear">清除搜索</button
          ><button id="reset">重置地图</button>
        </div>
      </section>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const width = 29,
        height = 17,
        count = width * height;
      const canvas = $("grid"),
        ctx = canvas.getContext("2d");
      const terrain = new Uint8Array(count);
      const wall = 255,
        heavy = 5;
      const cell = (x, y) => y * width + x;
      const col = (i) => i % width;
      const row = (i) => Math.floor(i / width);
      const distance = (a, b) =>
        Math.abs(col(a) - col(b)) + Math.abs(row(a) - row(b));
      let start,
        goal,
        search = null,
        phase = "idle",
        brush = "wall";
      let pointer = null,
        cursor = 0,
        keyboard = false,
        budget = 0,
        lastTime = 0;
      let frame = 0;

      function setupMap() {
        terrain.fill(1);
        start = cell(2, 8);
        goal = cell(26, 8);
        switch ($("preset").value) {
          case "maze":
            for (const [x, gap] of [
              [6, 3],
              [12, 13],
              [18, 5],
              [23, 12],
            ]) {
              for (let y = 1; y < height - 1; y++)
                if (Math.abs(y - gap) > 1) terrain[cell(x, y)] = wall;
            }
            for (let y = 6; y <= 10; y++)
              for (let x = 8; x <= 10; x++) terrain[cell(x, y)] = heavy;
            for (let y = 9; y <= 13; y++)
              for (let x = 19; x <= 21; x++) terrain[cell(x, y)] = heavy;
            break;
          case "cost":
            for (let y = 6; y <= 10; y++)
              for (let x = 7; x < 23; x++) terrain[cell(x, y)] = heavy;
            break;
          case "closed":
            for (let y = 7; y <= 9; y++)
              for (let x = 25; x <= 27; x++)
                if (cell(x, y) !== goal) terrain[cell(x, y)] = wall;
            break;
        }
        clearSearch();
      }

      function clearSearch() {
        search = null;
        phase = "idle";
        budget = 0;
        render();
      }

      function begin() {
        const best = new Float64Array(count).fill(Infinity);
        best[start] = 0;
        search = {
          frontier: [start],
          best,
          parent: new Int32Array(count).fill(-1),
          flags: new Uint8Array(count),
          visited: 0,
          path: null,
          total: 0,
          algorithm: $("algorithm").value,
        };
        search.flags[start] = 1;
      }

      function advance() {
        const { frontier, best, parent, flags, algorithm } = search;
        if (!frontier.length) {
          phase = "failed";
          return;
        }
        let chosen = 0;
        if (algorithm !== "bfs") {
          const priority = (i) =>
            best[i] + (algorithm === "astar" ? distance(i, goal) : 0);
          for (let i = 1; i < frontier.length; i++)
            if (priority(frontier[i]) < priority(frontier[chosen])) chosen = i;
        }
        const [node] = frontier.splice(chosen, 1);
        flags[node] = 2;
        search.visited++;
        if (node === goal) {
          const path = [goal];
          for (let at = goal; at !== start; at = parent[at]) {
            search.total += terrain[at];
            path.push(parent[at]);
          }
          search.path = path.reverse();
          phase = "found";
          return;
        }
        const x = col(node),
          y = row(node);
        for (const [nx, ny] of [
          [x + 1, y],
          [x, y - 1],
          [x - 1, y],
          [x, y + 1],
        ]) {
          if (nx < 0 || nx >= width || ny < 0 || ny >= height) continue;
          const next = cell(nx, ny);
          if (terrain[next] === wall || flags[next] === 2) continue;
          const cost = best[node] + (algorithm === "bfs" ? 1 : terrain[next]);
          if (cost >= best[next]) continue;
          best[next] = cost;
          parent[next] = node;
          if (!flags[next]) frontier.push(next);
          flags[next] = 1;
        }
        if (!frontier.length) phase = "failed";
      }

      function draw() {
        const rect = canvas.getBoundingClientRect(),
          scale = Math.min(devicePixelRatio || 1, 2);
        const w = Math.round(rect.width * scale),
          h = Math.round(rect.height * scale);
        if (!w || !h) return;
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        ctx.setTransform(w / width, 0, 0, h / height, 0, 0);
        ctx.fillStyle = "#e1e8df";
        ctx.fillRect(0, 0, width, height);
        for (let i = 0; i < count; i++) {
          const state = search?.flags[i];
          ctx.fillStyle =
            terrain[i] === wall
              ? "#31463e"
              : state === 1
                ? "#b3dbfa"
                : state === 2
                  ? "#b8d8cb"
                  : terrain[i] === heavy
                    ? "#e7b967"
                    : "#f8faf3";
          ctx.fillRect(col(i) + 0.024, row(i) + 0.024, 0.952, 0.952);
          if (terrain[i] === heavy && state) {
            ctx.fillStyle = "#ab7732";
            ctx.fillRect(col(i) + 0.75, row(i) + 0.72, 0.17, 0.17);
          }
        }
        if (search?.path) {
          ctx.beginPath();
          search.path.forEach((i, n) =>
            ctx[n ? "lineTo" : "moveTo"](col(i) + 0.5, row(i) + 0.5),
          );
          ctx.strokeStyle = "#b67b1a";
          ctx.lineWidth = 0.42;
          ctx.lineJoin = "round";
          ctx.stroke();
          ctx.strokeStyle = "#f6cc63";
          ctx.lineWidth = 0.28;
          ctx.stroke();
        }
        for (const [i, color, symbol] of [
          [start, "#147d58", "S"],
          [goal, "#b64a45", "G"],
        ]) {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(col(i) + 0.5, row(i) + 0.5, 0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.font = "bold .53px system-ui";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(symbol, col(i) + 0.5, row(i) + 0.54);
        }
        if (keyboard && document.activeElement === canvas) {
          ctx.strokeStyle = "#145040";
          ctx.lineWidth = 0.12;
          ctx.strokeRect(col(cursor) + 0.08, row(cursor) + 0.08, 0.84, 0.84);
        }
      }

      function render() {
        const path = search?.path;
        $("steps").textContent = path ? path.length - 1 : "—";
        $("cost").textContent = path ? search.total : "—";
        $("visited").textContent = search?.visited ?? 0;
        $("frontier").textContent = search?.frontier.length ?? 0;
        $("status").textContent = {
          idle: "准备就绪",
          running: "搜索中",
          paused: "已暂停",
          found: "已找到路径",
          failed: "终点不可达",
        }[phase];
        $("run").textContent = phase === "paused" ? "继续" : "运行";
        $("run").disabled = phase === "running";
        $("pause").disabled = phase !== "running";
        $("step").disabled = phase === "running";
        $("algorithm-note").textContent =
          ($("algorithm").value === "bfs"
            ? "按步数搜索。路径统计仍计入地形代价。"
            : "按进入格子的代价搜索。普通格 1，高代价格 5。") +
          " 起点不计入总代价。";
        draw();
      }

      function tick(time) {
        frame = 0;
        if (phase !== "running") return;
        budget +=
          Math.min((time - lastTime) / 1000, 0.05) * Number($("speed").value);
        lastTime = time;
        if (budget >= 1) {
          while (budget >= 1 && phase === "running") {
            advance();
            budget--;
          }
          render();
        }
        if (phase === "running") frame = requestAnimationFrame(tick);
      }

      function startRun() {
        if (phase === "running") return;
        if (phase !== "paused") begin();
        phase = "running";
        budget = 0;
        lastTime = performance.now();
        if (!frame) frame = requestAnimationFrame(tick);
        render();
      }

      function edit(i, tool) {
        if (i < 0) return;
        if (tool === "start" || tool === "end") {
          if (i === (tool === "start" ? goal : start) || terrain[i] === wall)
            return;
          if (tool === "start") start = i;
          else goal = i;
        } else if (i !== start && i !== goal) {
          terrain[i] = tool === "wall" ? wall : tool === "heavy" ? heavy : 1;
        }
        if (search) clearSearch();
        else draw();
      }

      function atPointer(event) {
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor(
          ((event.clientX - rect.left) / rect.width) * width,
        );
        const y = Math.floor(
          ((event.clientY - rect.top) / rect.height) * height,
        );
        return x >= 0 && x < width && y >= 0 && y < height ? cell(x, y) : -1;
      }

      canvas.addEventListener("pointerdown", (event) => {
        if (pointer || event.button !== 0) return;
        const i = atPointer(event);
        if (i < 0) return;
        keyboard = false;
        const tool = i === start ? "start" : i === goal ? "end" : brush;
        pointer = { id: event.pointerId, tool, last: i };
        canvas.setPointerCapture(event.pointerId);
        edit(i, tool);
      });
      canvas.addEventListener("pointermove", (event) => {
        if (pointer?.id !== event.pointerId) return;
        const i = atPointer(event);
        if (i < 0 || pointer.last === i) return;
        const { last, tool } = pointer;
        if (tool === "start" || tool === "end") edit(i, tool);
        else {
          const dx = col(i) - col(last),
            dy = row(i) - row(last);
          const n = Math.max(Math.abs(dx), Math.abs(dy));
          for (let j = 1; j <= n; j++)
            edit(
              cell(
                col(last) + Math.round((dx * j) / n),
                row(last) + Math.round((dy * j) / n),
              ),
              tool,
            );
        }
        pointer.last = i;
      });
      for (const name of ["pointerup", "pointercancel", "lostpointercapture"])
        canvas.addEventListener(name, (event) => {
          if (pointer?.id === event.pointerId) pointer = null;
        });
      canvas.addEventListener("keydown", (event) => {
        const offsets = {
          ArrowLeft: [-1, 0],
          ArrowRight: [1, 0],
          ArrowUp: [0, -1],
          ArrowDown: [0, 1],
        };
        const offset = offsets[event.key];
        if (!offset && event.key !== " ") return;
        event.preventDefault();
        keyboard = true;
        if (offset) {
          cursor = cell(
            Math.min(width - 1, Math.max(0, col(cursor) + offset[0])),
            Math.min(height - 1, Math.max(0, row(cursor) + offset[1])),
          );
          draw();
        } else edit(cursor, brush);
      });
      canvas.addEventListener("blur", draw);
      $("tools").addEventListener("click", (event) => {
        const button = event.target.closest("[data-tool]");
        if (!button) return;
        brush = button.dataset.tool;
        for (const tool of $("tools").children)
          tool.setAttribute("aria-pressed", String(tool === button));
      });
      $("run").onclick = startRun;
      $("pause").onclick = () => {
        phase = "paused";
        render();
      };
      $("step").onclick = () => {
        if (phase !== "paused") begin();
        phase = "paused";
        advance();
        render();
      };
      $("clear").onclick = clearSearch;
      $("reset").onclick = setupMap;
      $("preset").onchange = setupMap;
      $("algorithm").onchange = clearSearch;
      $("speed").oninput = () => {
        $("rate").textContent = $("speed").value + " 节点/秒";
      };
      new ResizeObserver(draw).observe(canvas);
      setupMap();
    </script>
  </body>
</html>
