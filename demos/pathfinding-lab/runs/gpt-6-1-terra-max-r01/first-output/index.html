<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寻路实验室</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151e31;--line:#293650;--ink:#eef4ff;--muted:#a8b9cf;--accent:#74e7ca}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#203458 0,transparent 40%),var(--bg);font:15px/1.55 system-ui,sans-serif;color:var(--ink)}main{max-width:1240px;margin:auto;padding:32px 22px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}h1{font-size:clamp(28px,5vw,46px);letter-spacing:-.04em;margin:0}header p{margin:4px 0;color:var(--muted)}.eyebrow{font-weight:700;color:var(--accent);letter-spacing:.15em;font-size:11px}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}.panel,.board{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#b3c4d9;margin:0 0 10px}.section+.section{border-top:1px solid var(--line);padding-top:17px;margin-top:17px}select,button,input{font:inherit}select,button{color:var(--ink);background:#23314a;border:1px solid #344861;border-radius:9px;padding:9px 12px}button{cursor:pointer}button:hover,button.active{background:#3b5a68;border-color:var(--accent)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}select{width:100%}.tools,.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button:first-child{background:var(--accent);color:#0a2830;font-weight:700}.range{display:flex;align-items:center;gap:10px}input[type=range]{width:100%;accent-color:var(--accent)}.board{min-width:0}.board-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.board-head h2{font-size:17px;margin:0}.board-head p{color:var(--muted);font-size:13px;margin:2px 0 12px}canvas{display:block;width:100%;height:auto;border:1px solid #3a4b64;border-radius:9px;touch-action:none;cursor:crosshair;background:#0c1527}.legend{display:flex;flex-wrap:wrap;gap:8px 15px;color:var(--muted);font-size:12px;margin:13px 0}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#101a2b;border-radius:10px;padding:10px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:18px}.help{color:var(--muted);font-size:12px;margin:0}.status{min-height:1.5em;color:#b4f5e5;margin:12px 0 0}@media(max-width:760px){main{padding:20px 12px}header{align-items:start}.layout{grid-template-columns:1fr}.panel{order:2}.board{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.panel{padding:16px}}
</style></head><body><main><header><div><div class="eyebrow">ALGORITHM PLAYGROUND / 01</div><h1>寻路实验室</h1><p>一步一步，看见算法如何找到方向。</p></div></header><div class="layout"><aside class="panel"><div class="section"><h2>搜索算法</h2><select id="algorithm" aria-label="搜索算法"><option value="astar">A* · 曼哈顿距离</option><option value="dijkstra">Dijkstra · 最小代价</option><option value="bfs">BFS · 最少步数</option></select><p class="help">四方向移动。普通格代价 1，沙地代价 5；不计起点代价。BFS 忽略代价。</p></div><div class="section"><h2>绘制地图</h2><div class="tools"><button data-tool="wall" class="active">障碍</button><button data-tool="weight">沙地 ×5</button><button data-tool="erase">橡皮擦</button><button data-tool="start">设置起点</button><button data-tool="end">设置终点</button></div><p class="help">拖动起点和终点可移动；选择工具后拖动画格。编辑会清除搜索。</p></div><div class="section"><h2>搜索控制</h2><div class="actions"><button id="run">开始搜索</button><button id="pause">暂停</button><button id="step">单步</button><button id="clear">清除搜索</button></div><label class="range">慢<input id="speed" type="range" min="1" max="25" value="8" aria-label="搜索速度">快</label></div><div class="section"><h2>地图</h2><div class="tools"><button id="preset">加权预设</button><button id="reset">重置地图</button></div></div></aside><section class="board"><div class="board-head"><div><h2>画布</h2><p>起点 → 终点 · 实时搜索状态</p></div></div><canvas id="grid" width="980" height="560" aria-label="寻路网格"></canvas><div class="legend"><span><i class="dot" style="background:#34445d"></i>障碍</span><span><i class="dot" style="background:#ad8852"></i>沙地</span><span><i class="dot" style="background:#52cbb3"></i>前沿</span><span><i class="dot" style="background:#3c668b"></i>已访问</span><span><i class="dot" style="background:#f8d878"></i>路径</span></div><div class="stats"><div class="stat"><span>状态</span><strong id="state">准备就绪</strong></div><div class="stat"><span>访问节点</span><strong id="visited">0</strong></div><div class="stat"><span>路径步数</span><strong id="steps">—</strong></div><div class="stat"><span>总代价</span><strong id="cost">—</strong></div></div><p class="status" id="message" role="status">选择算法后开始，或先绘制自己的地图。</p></section></div></main>
<script>
(()=>{'use strict';const W=28,H=16,N=W*H,canvas=document.querySelector('#grid'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s),algorithm=$('#algorithm');let terrain=new Uint8Array(N),start=8*W+3,end=8*W+24,tool='wall',search=null,timer=0,pointer=null;const col=i=>i%W,row=i=>Math.floor(i/W),neighbors=i=>[[col(i)-1,row(i)],[col(i)+1,row(i)],[col(i),row(i)-1],[col(i),row(i)+1]].filter(([x,y])=>x>=0&&x<W&&y>=0&&y<H).map(([x,y])=>y*W+x);function stop(){if(timer)clearTimeout(timer);timer=0}function clear(){stop();search=null;$('#state').textContent='准备就绪';$('#visited').textContent='0';$('#steps').textContent='—';$('#cost').textContent='—';$('#message').textContent='选择算法后开始，或先绘制自己的地图。';draw()}function init(){const dist=Array(N).fill(Infinity),prev=Array(N).fill(-1);dist[start]=0;search={algo:algorithm.value,dist,prev,frontier:[start],inFront:new Set([start]),visited:new Set(),path:[],done:false,running:false};$('#state').textContent='已暂停'}function reconstruct(){let p=end;while(p!==-1){search.path.push(p);if(p===start)break;p=search.prev[p]}search.path.reverse();let cost=0;for(const i of search.path.slice(1))cost+=terrain[i]===2?5:1;$('#steps').textContent=search.path.length-1;$('#cost').textContent=cost;$('#state').textContent='已找到';$('#message').textContent=search.algo==='bfs'?'BFS 按步数搜索；显示的总代价按实际经过的地形计算。':'已找到最小代价路径。'}function step(){if(!search)init();if(search.done)return;const s=search;if(!s.frontier.length){s.done=true;s.running=false;$('#state').textContent='不可达';$('#message').textContent='没有可到达终点的路径，请调整障碍。';draw();return}let index=0;if(s.algo!=='bfs'){let best=Infinity;for(let j=0;j<s.frontier.length;j++){const i=s.frontier[j],score=s.dist[i]+(s.algo==='astar'?Math.abs(col(i)-col(end))+Math.abs(row(i)-row(end)):0);if(score<best){best=score;index=j}}}const current=s.frontier.splice(index,1)[0];s.inFront.delete(current);s.visited.add(current);if(current===end){s.done=true;s.running=false;reconstruct()}else for(const n of neighbors(current)){if(terrain[n]===1||s.visited.has(n))continue;const next=s.dist[current]+(s.algo==='bfs'?1:terrain[n]===2?5:1);if(next<s.dist[n]){s.dist[n]=next;s.prev[n]=current;if(!s.inFront.has(n)){s.frontier.push(n);s.inFront.add(n)}}}$('#visited').textContent=s.visited.size;draw()}function tick(){if(!search||!search.running)return;step();if(search.running&&!search.done)timer=setTimeout(tick,Math.max(8,220-Number($('#speed').value)*8));else stop()}function draw(){const cw=canvas.width/W,ch=canvas.height/H;ctx.clearRect(0,0,canvas.width,canvas.height);for(let i=0;i<N;i++){let color=terrain[i]===1?'#34445d':terrain[i]===2?'#ad8852':'#14243a';if(search?.visited.has(i))color='#3c668b';if(search?.inFront.has(i))color='#52cbb3';if(search?.path.includes(i))color='#f8d878';if(i===start)color='#72e8bc';if(i===end)color='#ff8b80';ctx.fillStyle=color;ctx.fillRect(col(i)*cw+1,row(i)*ch+1,cw-2,ch-2);if(i===start||i===end){ctx.fillStyle='#102337';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i===start?'起':'终',(col(i)+.5)*cw,(row(i)+.52)*ch)}}}function at(e){const r=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H);return x<0||x>=W||y<0||y>=H?-1:y*W+x}function edit(i){if(i<0)return;if(pointer==='start'){if(i!==end&&terrain[i]!==1){start=i;clear()}return}if(pointer==='end'){if(i!==start&&terrain[i]!==1){end=i;clear()}return}if(i===start||i===end)return;const value=pointer==='wall'?1:pointer==='weight'?2:0;if(terrain[i]!==value){terrain[i]=value;clear()}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();const i=at(e);pointer=i===start?'start':i===end?'end':tool;if(tool==='start'&&i!==end&&terrain[i]!==1){start=i;pointer='start';clear()}else if(tool==='end'&&i!==start&&terrain[i]!==1){end=i;pointer='end';clear()}else edit(i);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(pointer)edit(at(e))});canvas.addEventListener('pointerup',()=>pointer=null);canvas.addEventListener('pointercancel',()=>pointer=null);document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});$('#run').onclick=()=>{if(!search||search.done){clear();init()}search.running=true;$('#state').textContent='搜索中';$('#message').textContent='正在扩展搜索前沿…';stop();tick()};$('#pause').onclick=()=>{if(search&&!search.done){search.running=false;stop();$('#state').textContent='已暂停'}};$('#step').onclick=()=>{if(search?.running){search.running=false;stop()}step()};$('#clear').onclick=clear;algorithm.onchange=clear;$('#reset').onclick=()=>{terrain=new Uint8Array(N);start=8*W+3;end=8*W+24;clear()};$('#preset').onclick=()=>{terrain=new Uint8Array(N);start=8*W+3;end=8*W+24;for(let y=2;y<14;y++)if(y!==11)terrain[y*W+10]=1;for(let y=2;y<14;y++)if(y!==4)terrain[y*W+19]=1;for(let y=4;y<=11;y++)for(let x=11;x<19;x++)terrain[y*W+x]=2;clear()};draw()})();
</script></body></html>
