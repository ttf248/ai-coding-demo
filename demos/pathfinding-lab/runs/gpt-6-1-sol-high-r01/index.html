<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寻路算法实验室</title><style>
:root{color-scheme:dark;--bg:#0d151e;--panel:#15212e;--line:#2b3c4d;--mint:#7be6c4;--muted:#94a8bc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eaf2f8;font:15px/1.6 system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:30px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h1{font-size:30px;margin:3px 0}p{margin:4px 0;color:var(--muted)}.eyebrow{color:var(--mint);font-size:12px;letter-spacing:3px}.badge{border:1px solid var(--line);border-radius:30px;padding:7px 15px;font-size:13px}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px}.panel,.workspace{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}h2{font-size:15px;margin:0 0 14px}label{display:block;color:var(--muted);margin-bottom:15px}select,input[type=range]{width:100%;margin-top:7px}select,button{font:inherit;color:inherit;background:#1e3041;border:1px solid #3b5266;border-radius:8px;padding:9px 12px;cursor:pointer}button:hover,button.active{border-color:var(--mint);color:var(--mint)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:3px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:20px}.primary{background:var(--mint);color:#0b2420;border-color:var(--mint)}.primary:hover{color:#0b2420;background:#a3f1d7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stat{padding:12px;background:#0d1823;border-radius:9px;color:var(--muted);font-size:12px}.stat b{display:block;font-size:24px;color:#edf7ff;font-weight:500}canvas{width:100%;display:block;aspect-ratio:8/5;background:#101d28;border-radius:8px;touch-action:none}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-top:16px;color:var(--muted)}.legend i{width:10px;height:10px;display:inline-block;background:var(--c);border-radius:2px;margin-right:5px}.note{font-size:12px;border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.status{margin-top:15px;min-height:26px;color:var(--mint)}@media(max-width:760px){main{padding:16px}header{align-items:flex-start}.badge{display:none}h1{font-size:24px}.layout{grid-template-columns:1fr}.panel{padding:15px}.tools{grid-template-columns:repeat(4,1fr)}.tools button{padding:7px 3px;font-size:13px}.workspace{padding:12px}.stat{padding:8px}.stat b{font-size:20px}canvas{aspect-ratio:8/5}}
</style></head><body><main><header><div><div class="eyebrow">ALGORITHM FIELD NOTES / 01</div><h1>寻路算法实验室</h1><p>画一张地图，观察算法如何找到下一步。</p></div><span class="badge">四方向网格 · 可逐步探索</span></header><div class="layout"><aside class="panel"><h2>01 / 搜索策略</h2><label>算法<select id="algorithm"><option value="astar">A* · 曼哈顿启发式</option><option value="dijkstra">Dijkstra · 最低代价</option><option value="bfs">BFS · 最少步数</option></select></label><p id="explanation" class="note"></p><h2 style="margin-top:24px">02 / 编辑地图</h2><div class="tools"><button data-tool="wall" class="active">障碍</button><button data-tool="weight">代价 5</button><button data-tool="erase">橡皮</button><button data-tool="move">移动端点</button></div><label>可重复的地图<select id="preset"><option value="weighted">代价走廊</option><option value="maze">错落围墙</option><option value="empty">空白网格</option><option value="sealed">封闭终点</option></select></label><button id="reset">重置地图</button><p class="note">拖动绘制；拖动 S / E 移动端点。编辑会停止并清除旧搜索。普通格进入代价为 1，黄色格为 5，起点代价不计入。</p></aside><section class="workspace"><div class="actions"><button class="primary" id="run">运行搜索</button><button id="pause">暂停</button><button id="step">单步</button><button id="clear">清除搜索</button></div><label>搜索速度 <output id="speedValue">60</output> 节点 / 秒<input id="speed" type="range" min="1" max="240" value="60"></label><div class="stats"><div class="stat">已访问<b id="visited">0</b></div><div class="stat">路径步数<b id="steps">—</b></div><div class="stat">总代价<b id="cost">—</b></div></div><canvas id="grid" width="960" height="600" aria-label="寻路编辑网格，拖动绘制障碍或移动起终点"></canvas><div class="legend"><span style="--c:#7be6c4"><i></i>起点 S</span><span style="--c:#ff9e85"><i></i>终点 E</span><span style="--c:#7b89e2"><i></i>搜索前沿</span><span style="--c:#28566b"><i></i>已访问</span><span style="--c:#f1d18a"><i></i>路径 / 高代价</span></div><p class="status" id="status" role="status">地图已就绪。</p></section></div></main><script>
'use strict';
const $=id=>document.getElementById(id),W=32,H=20,N=W*H,canvas=$('grid'),ctx=canvas.getContext('2d');
const state={cells:new Uint8Array(N),start:10*W+3,end:10*W+28,tool:'wall',search:null,running:false};
function neighbors(i){const x=i%W,y=Math.floor(i/W);return [x>0?i-1:-1,x<W-1?i+1:-1,y>0?i-W:-1,y<H-1?i+W:-1].filter(j=>j>=0&&state.cells[j]!==1)}
function heuristic(i){return Math.abs(i%W-state.end%W)+Math.abs(Math.floor(i/W)-Math.floor(state.end/W))}
function clearSearch(){state.running=false;state.search=null;$('visited').textContent='0';$('steps').textContent=$('cost').textContent='—';$('status').textContent='地图已就绪。';draw()}
function initSearch(){const dist=new Float64Array(N).fill(Infinity),parent=new Int32Array(N).fill(-1);dist[state.start]=0;state.search={algorithm:$('algorithm').value,dist,parent,open:[state.start],closed:new Uint8Array(N),path:[],done:false,visited:0};$('status').textContent='搜索中…';return state.search}
function step(){const s=state.search||initSearch();if(s.done)return;let at=0;if(s.algorithm!=='bfs')for(let k=1;k<s.open.length;k++){const score=i=>s.dist[i]+(s.algorithm==='astar'?heuristic(i):0);if(score(s.open[k])<score(s.open[at]))at=k}
if(!s.open.length){s.done=true;state.running=false;$('status').textContent='终点不可达：搜索前沿已耗尽。';draw();return}
const u=s.open.splice(at,1)[0];s.closed[u]=1;s.visited++;if(u===state.end){s.done=true;state.running=false;let v=u;while(v!==-1){s.path.push(v);v=s.parent[v]}s.path.reverse();const cost=s.path.slice(1).reduce((a,i)=>a+(state.cells[i]===2?5:1),0);$('steps').textContent=s.path.length-1;$('cost').textContent=cost;$('status').textContent=s.algorithm==='bfs'?'已找到步数最少路径；总代价不一定最低。':'已找到最低代价路径。'}else for(const v of neighbors(u)){if(s.closed[v])continue;const d=s.dist[u]+(s.algorithm==='bfs'?1:state.cells[v]===2?5:1);if(d<s.dist[v]){s.dist[v]=d;s.parent[v]=u;if(!s.open.includes(v))s.open.push(v)}}$('visited').textContent=s.visited;draw()}
function draw(){const cw=canvas.width/W,ch=canvas.height/H,s=state.search,open=new Set(s?.open),path=new Set(s?.path);ctx.clearRect(0,0,canvas.width,canvas.height);for(let i=0;i<N;i++){const x=(i%W)*cw,y=Math.floor(i/W)*ch;ctx.fillStyle=state.cells[i]===1?'#536276':state.cells[i]===2?'#6d5430':'#172735';if(s?.closed[i]&&state.cells[i]!==1)ctx.fillStyle='#28566b';if(open.has(i))ctx.fillStyle='#5963a2';if(path.has(i))ctx.fillStyle='#dabb78';if(i===state.start)ctx.fillStyle='#7be6c4';if(i===state.end)ctx.fillStyle='#ff9e85';ctx.fillRect(x+1,y+1,cw-2,ch-2);if(i===state.start||i===state.end||state.cells[i]===2){ctx.fillStyle=i===state.start||i===state.end?'#15212e':'#fff0c9';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i===state.start?'S':i===state.end?'E':'5',x+cw/2,y+ch/2)}}}
function preset(name){state.cells.fill(0);state.start=10*W+3;state.end=10*W+28;if(name==='weighted')for(let y=8;y<=12;y++)for(let x=8;x<=23;x++)state.cells[y*W+x]=2;if(name==='maze')for(let x=7;x<28;x+=6)for(let y=2;y<H-2;y++)if(y!==(x%12===7?4:15))state.cells[y*W+x]=1;if(name==='sealed')for(const i of neighbors(state.end))state.cells[i]=1;clearSearch()}
let pointer=null,lastCell=-1;function cell(e){const r=canvas.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H);return x<0||x>=W||y<0||y>=H?-1:y*W+x}
function edit(i){if(i<0||i===lastCell)return;lastCell=i;clearSearch();if(pointer==='start'||pointer==='end'){const other=pointer==='start'?state.end:state.start;if(i!==other&&state.cells[i]!==1)state[pointer]=i}else if(i!==state.start&&i!==state.end&&state.tool!=='move')state.cells[i]=state.tool==='wall'?1:state.tool==='weight'?2:0;draw()}
canvas.addEventListener('pointerdown',e=>{const i=cell(e);pointer=i===state.start?'start':i===state.end?'end':'paint';lastCell=-1;canvas.setPointerCapture(e.pointerId);edit(i)});canvas.addEventListener('pointermove',e=>{if(pointer)edit(cell(e))});for(const type of ['pointerup','pointercancel'])canvas.addEventListener(type,()=>{pointer=null;lastCell=-1});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{state.tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});
$('algorithm').onchange=()=>{clearSearch();$('explanation').textContent=$('algorithm').value==='bfs'?'BFS 按步数扩展，忽略地形权重；结果仍显示真实代价。':'按进入格子的地形代价搜索。A* 使用曼哈顿距离，Dijkstra 使用零启发式。'};$('algorithm').onchange();$('preset').onchange=()=>preset($('preset').value);$('reset').onclick=()=>preset($('preset').value);$('clear').onclick=clearSearch;$('run').onclick=()=>{if(state.search?.done)clearSearch();if(!state.search)initSearch();state.running=true;$('status').textContent='搜索中…'};$('pause').onclick=()=>{state.running=false;if(state.search&&!state.search.done)$('status').textContent='已暂停，可以单步或继续运行。'};$('step').onclick=()=>{state.running=false;step()};$('speed').oninput=()=>{$('speedValue').value=$('speed').value};
let previous=0,credit=0;function frame(t){if(state.running){credit+=Math.min((t-previous)/1000,.1)*Number($('speed').value);while(credit>=1&&state.running){step();credit--}}else credit=0;previous=t;requestAnimationFrame(frame)}preset('weighted');requestAnimationFrame(frame);window.lab={state,step,preset,clearSearch,neighbors};
</script></body></html>
