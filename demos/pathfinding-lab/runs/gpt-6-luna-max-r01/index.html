<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>寻路算法实验室</title><style>
:root{--bg:#09111c;--panel:#101d2b;--line:#223346;--text:#edf4fa;--muted:#8fa3b5;--cyan:#4be1cc;--blue:#4c96ff;--gold:#ffcf74;--pink:#ff7e92}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 55% -12%,#18374d 0,transparent 40%),var(--bg);color:var(--text);font:14px/1.45 Inter,"Segoe UI",sans-serif}.top{max-width:1160px;margin:auto;padding:22px 20px 12px;display:flex;align-items:center;gap:13px}.mark{width:42px;height:42px;border-radius:14px;background:#13313a;color:var(--cyan);display:grid;place-items:center;font-size:22px;border:1px solid #26636a}h1{margin:0;font-size:20px}.top p{margin:3px 0;color:var(--muted);font-size:12px}.wrap{max-width:1160px;margin:auto;padding:8px 20px 24px;display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:14px}.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#142332,#0e1824);box-shadow:0 16px 42px #0003}.main{padding:14px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.bar select,.bar button,button{font:inherit;color:var(--text);background:#172635;border:1px solid #304458;border-radius:9px;padding:9px 11px;cursor:pointer}.bar button:hover,button:hover{border-color:var(--cyan)}button.primary{background:var(--cyan);color:#09201e;border-color:var(--cyan);font-weight:700}.bar select{margin-right:auto}.grid-frame{background:#08121b;padding:8px;border:1px solid #283c4d;border-radius:12px;overflow:hidden}.grid-frame canvas{width:100%;display:block;touch-action:none;image-rendering:pixelated;border-radius:6px}.help{color:var(--muted);font-size:11px;margin:10px 2px 1px}.side{padding:15px;height:max-content}.side h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#afc2d1;margin:0 0 12px}.algorithm{display:grid;gap:7px}.algorithm label{padding:9px 10px;border:1px solid var(--line);border-radius:9px;display:flex;gap:9px;align-items:center;cursor:pointer}.algorithm label:has(input:checked){border-color:var(--cyan);background:#16302f}.algorithm input{accent-color:var(--cyan)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.stat{padding:10px;border-radius:10px;background:#0a151f;border:1px solid #233649}.stat b{display:block;font-size:18px;color:var(--cyan)}.stat span{color:var(--muted);font-size:10px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tools button{font-size:11px}.tools .chosen{border-color:var(--gold);color:var(--gold)}.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;color:#a2b5c5;font-size:10px;margin-top:13px}.legend span{display:flex;gap:7px;align-items:center}.swatch{width:11px;height:11px;border-radius:3px;background:#26394a}.message{padding:10px;margin:11px 0;border-radius:9px;background:#0b1823;color:var(--muted);min-height:48px;font-size:11px}.range{width:100%;accent-color:var(--cyan)}.range-row{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.footer{max-width:1160px;margin:auto;padding:0 20px 18px;color:#61788a;font-size:10px}@media(max-width:760px){.top{padding:14px 12px}.wrap{padding:7px 10px 18px;grid-template-columns:1fr}.main{padding:10px}.side{order:-1}.side h2{margin-top:0}.grid-frame{padding:5px}.bar{gap:6px}.bar select{width:100%}.bar button{flex:1;padding:8px 6px;font-size:11px}.stats{margin:10px 0}.tools{grid-template-columns:repeat(4,1fr)}.tools button{padding:7px 4px}.footer{padding:0 12px 15px}}
</style><script defer src="../../../../assets/analytics.js"></script>
</head><body><header class="top"><div class="mark">⌖</div><div><h1>寻路算法实验室</h1><p>观察搜索边界如何在障碍与权重之间做选择</p></div></header><main class="wrap"><section class="card main"><div class="bar"><select id="preset"><option value="maze">迷宫路线</option><option value="weighted">加权走廊</option><option value="blocked">封闭终点</option><option value="empty">空白网格</option></select><button class="primary" id="run">▶ 运行</button><button id="pause">Ⅱ 暂停</button><button id="step">单步</button><button id="clear">清除搜索</button></div><div class="grid-frame"><canvas id="map" aria-label="寻路编辑网格"></canvas></div><p class="help">拖动或触摸编辑地图。搜索时编辑会自动停止并清除旧结果。</p></section><aside class="card side"><h2>搜索策略</h2><div class="algorithm"><label><input type="radio" name="algo" value="astar" checked><span><b>A*</b><br><small style="color:#8297aa">地形代价 + 曼哈顿估价</small></span></label><label><input type="radio" name="algo" value="dijkstra"><span><b>Dijkstra</b><br><small style="color:#8297aa">按地形代价找最优路</small></span></label><label><input type="radio" name="algo" value="bfs"><span><b>BFS</b><br><small style="color:#8297aa">按步数找最短路</small></span></label></div><div class="stats"><div class="stat"><b id="steps">—</b><span>路径步数</span></div><div class="stat"><b id="cost">—</b><span>路径总代价</span></div><div class="stat"><b id="visited">0</b><span>已访问节点</span></div><div class="stat"><b id="frontier">0</b><span>搜索前沿</span></div></div><h2>编辑工具</h2><div class="tools"><button data-tool="wall" class="chosen">墙壁</button><button data-tool="weight">高代价 ×5</button><button data-tool="erase">擦除</button><button data-tool="move">拖起终点</button></div><div class="range-row" style="margin-top:15px"><label for="speed">搜索速度</label><span id="speedLabel">快速</span></div><input id="speed" class="range" type="range" min="1" max="5" value="4"><div class="legend"><span><i class="swatch" style="background:#4be1cc"></i>起点</span><span><i class="swatch" style="background:#ff7e92"></i>终点</span><span><i class="swatch" style="background:#465a6d"></i>障碍</span><span><i class="swatch" style="background:#b77cff"></i>已访问</span><span><i class="swatch" style="background:#ffe08b"></i>最终路径</span><span><i class="swatch" style="background:#ef954f"></i>高代价格</span></div><div id="message" class="message">A* 与 Dijkstra 优化代价；BFS 优先最少步数。起点格代价不计。</div></aside></main><footer class="footer">四方向移动 · 普通格代价 1 · 高代价格代价 5 · 终点被封闭时会明确报告不可达</footer>
<script>
(()=>{const W=34,H=20,canvas=document.querySelector('#map'),ctx=canvas.getContext('2d'),walls=new Set(),weights=new Set();let start={x:2,y:10},goal={x:31,y:10},tool='wall',pointerDown=false,dragNode='',timer=null,state=null,cell=20;const $=s=>document.querySelector(s),key=(x,y)=>y*W+x,xy=k=>({x:k%W,y:Math.floor(k/W)});function fit(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round((r.width*H/W)*d);canvas.style.height=`${r.width*H/W}px`;ctx.setTransform(d* r.width/W,0,0,d*r.width/W,0,0);cell=r.width/W;draw()}function clearSearch(){stop();state=null;$('#steps').textContent='—';$('#cost').textContent='—';$('#visited').textContent='0';$('#frontier').textContent='0';$('#message').textContent='搜索结果已清除。编辑地图后可以重新运行。';draw()}function resetSearch(){state=null;$('#steps').textContent='—';$('#cost').textContent='—';$('#visited').textContent='0';$('#frontier').textContent='0'}function invalidate(){stop();resetSearch();$('#message').textContent='地图已更改，旧搜索结果已清除。';draw()}function draw(){if(!canvas.width)return;const d=canvas.width/W;ctx.clearRect(0,0,W,H);ctx.fillStyle='#101d29';ctx.fillRect(0,0,W,H);const visited=state?.visited||new Set(),front=state?new Set(state.frontier):new Set(),path=state?.path||[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){const k=key(x,y);let color='#162635';if(weights.has(k))color='#704b39';if(walls.has(k))color='#384c5c';if(visited.has(k))color='#4c3670';if(front.has(k))color='#23546b';if(path.includes(k))color='#87723d';if(x===start.x&&y===start.y)color='#147e75';if(x===goal.x&&y===goal.y)color='#a3485a';ctx.fillStyle=color;ctx.fillRect(x+.7,y+.7,1.86,1.86);if(weights.has(k)&&!walls.has(k)){ctx.fillStyle='#ffd092';ctx.fillRect(x+.76,y+.76,.42,.42)}}ctx.font='bold 1px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#d6fffa';ctx.fillText('S',start.x+.5,start.y+.52);ctx.fillStyle='#fff0f2';ctx.fillText('E',goal.x+.5,goal.y+.52);if(state){$('#visited').textContent=state.seen.size;$('#frontier').textContent=state.frontier.length}}
function pointer(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(W-1,Math.floor((e.clientX-r.left)/r.width*W))),y:Math.max(0,Math.min(H-1,Math.floor((e.clientY-r.top)/r.width*W)))}}function edit(e){const p=pointer(e),k=key(p.x,p.y);if(dragNode){if(walls.has(k))return;dragNode==='start'?start=p:goal=p;invalidate();return}if((p.x===start.x&&p.y===start.y)||(p.x===goal.x&&p.y===goal.y))return;if(tool==='wall'){walls.add(k);weights.delete(k)}if(tool==='erase'){walls.delete(k);weights.delete(k)}if(tool==='weight'&&!walls.has(k))weights.add(k);invalidate()}canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pointerDown=true;const p=pointer(e);if(tool==='move'){if(Math.abs(start.x-p.x)+Math.abs(start.y-p.y)<2)dragNode='start';else if(Math.abs(goal.x-p.x)+Math.abs(goal.y-p.y)<2)dragNode='goal';else if(Math.abs(start.x-p.x)+Math.abs(start.y-p.y)<=Math.abs(goal.x-p.x)+Math.abs(goal.y-p.y))dragNode='start';else dragNode='goal'}else edit(e)});canvas.addEventListener('pointermove',e=>{if(pointerDown&&tool==='move')edit(e);else if(pointerDown&&tool!=='move')edit(e)});canvas.addEventListener('pointerup',()=>{pointerDown=false;dragNode=''});document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('chosen',x===b))});document.querySelector('#clear').onclick=clearSearch;document.querySelector('#pause').onclick=()=>timer?stop():run();document.querySelector('#step').onclick=()=>{if(!state)begin();advance()};document.querySelector('#run').onclick=run;$('#speed').oninput=()=>{$('#speedLabel').textContent=['慢','较慢','标准','快速','极速'][$('#speed').value-1];if(timer)run()};$('#preset').onchange=()=>preset($('#preset').value);function stop(){clearInterval(timer);timer=null;$('#pause').textContent='Ⅱ 暂停'}function preset(name){walls.clear();weights.clear();start={x:2,y:10};goal={x:31,y:10};if(name==='maze'){for(let x=5;x<30;x+=4){const gap=3+(x*7%13);for(let y=1;y<H-1;y++)if(Math.abs(y-gap)>2)walls.add(key(x,y))}}if(name==='weighted'){for(let x=7;x<28;x++)for(let y=6;y<14;y++)if((x+y)%3!==0)weights.add(key(x,y));for(let x=17;x<21;x++)for(let y=0;y<8;y++)walls.add(key(x,y))}if(name==='blocked'){for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)if(dx||dy)walls.add(key(goal.x+dx,goal.y+dy))}invalidate()}
function begin(){stop();resetSearch();const algo=document.querySelector('[name=algo]:checked').value;state={algo,frontier:[key(start.x,start.y)],seen:new Set(),costs:new Map([[key(start.x,start.y),0]]),came:new Map(),closed:new Set(),path:[],done:false};$('#message').textContent=`${algo==='bfs'?'BFS按步数搜索':algo==='dijkstra'?'Dijkstra按地形代价搜索':'A*按地形代价与曼哈顿距离搜索'}。搜索中…`;draw()}function run(){if(!state||state.done)begin();stop();const ms=[1100,650,300,125,35][Number($('#speed').value)-1];timer=setInterval(advance,ms);$('#pause').textContent='Ⅱ 暂停'}function advance(){if(!state||state.done)return;const s=state;let best=0;if(s.algo!=='bfs'){let bv=Infinity;for(let i=0;i<s.frontier.length;i++){const k=s.frontier[i],p=xy(k),h=s.algo==='astar'?Math.abs(goal.x-p.x)+Math.abs(goal.y-p.y):0,v=(s.costs.get(k)||0)+h;if(v<bv){bv=v;best=i}}}const current=s.frontier.splice(best,1)[0];if(current==null){finish(false);return}if(s.closed.has(current)){draw();return}s.closed.add(current);s.seen.add(current);const p=xy(current);if(p.x===goal.x&&p.y===goal.y){finish(true,current);return}for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const x=p.x+dx,y=p.y+dy,k=key(x,y);if(x<0||x>=W||y<0||y>=H||walls.has(k)||s.closed.has(k))continue;const cost=(s.costs.get(current)||0)+(s.algo==='bfs'?1:(weights.has(k)?5:1));if(!s.costs.has(k)||cost<s.costs.get(k)){s.costs.set(k,cost);s.came.set(k,current);if(!s.frontier.includes(k))s.frontier.push(k)}}if(!s.frontier.length){finish(false);return}draw()}function finish(ok,end){stop();state.done=true;if(!ok){state.frontier=[];$('#message').textContent='终点不可达：当前障碍阻断了所有四方向路径。';$('#steps').textContent='—';$('#cost').textContent='—'}else{let path=[end];while(state.came.has(path[0]))path.unshift(state.came.get(path[0]));state.path=path;const total=path.slice(1).reduce((sum,k)=>sum+(state.algo==='bfs'?1:weights.has(k)?5:1),0);$('#steps').textContent=path.length-1;$('#cost').textContent=total;$('#message').textContent=`找到路径：${path.length-1} 步，总代价 ${total}。${state.algo==='bfs'?'BFS 保证步数最少。':'权重计算包含进入高代价格的代价。'}`}draw()}window.addEventListener('resize',fit);document.querySelectorAll('[name=algo]').forEach(r=>r.onchange=clearSearch);preset('maze');fit()})();
</script></body></html>
