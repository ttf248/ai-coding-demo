<!doctype html><html lang="zh-CN"><head><script src="../../../../assets/analytics.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寻路算法实验室</title><style>
:root{font-family:system-ui,sans-serif;color:#e7eefc;background:#101827}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:24px}h1{margin:0;font-size:clamp(24px,4vw,38px)}p{color:#adbed2;line-height:1.6}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.badge{color:#7be2cc;background:#1b3940;padding:8px 14px;border-radius:30px;font-size:13px}.panel{background:#192438;border:1px solid #2a3c55;border-radius:16px;padding:16px;margin-top:14px}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,select{font:inherit;color:#e7eefc;background:#283a52;border:1px solid #405773;border-radius:8px;padding:9px 12px;cursor:pointer}button:hover,button.active{background:#287d79;border-color:#57d9c4}button:focus-visible,select:focus-visible{outline:2px solid #fff}label{display:flex;align-items:center;gap:8px;font-size:14px}input[type=range]{width:100px;accent-color:#59d2ba}.grid{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;touch-action:none;user-select:none}.cell{aspect-ratio:1;background:#26364b;border:0;border-radius:3px;padding:0;min-width:0;position:relative}.cell.wall{background:#60748d}.cell.weight{background:#8a6239}.cell.frontier{background:#277f8c}.cell.visited{background:#365e8c}.cell.path{background:#efd474}.cell.start{background:#62ddac}.cell.end{background:#f47680}.cell.start:after{content:'起';color:#102a29;font-size:clamp(8px,1.5vw,13px)}.cell.end:after{content:'终';color:#351c28;font-size:clamp(8px,1.5vw,13px)}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:#b9c9d9}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}.stats{display:flex;gap:24px;flex-wrap:wrap}.stats strong{color:#75e2ce}.status{min-height:24px;color:#f6d988}.hint{font-size:13px;margin-bottom:0}@media(max-width:500px){main{padding:14px}.panel{padding:11px}.grid{gap:1px}.controls{gap:6px}button,select{padding:8px;font-size:13px}.stats{gap:12px}}
</style></head><body><main><div class="top"><div><div class="badge">INTERACTIVE / 算法可视化</div><h1>寻路算法实验室</h1><p>画一张地图，观察不同算法如何找到路。</p></div><div class="legend"><span><i style="background:#60748d"></i>障碍</span><span><i style="background:#8a6239"></i>高代价 5</span><span><i style="background:#277f8c"></i>前沿</span><span><i style="background:#365e8c"></i>已访问</span><span><i style="background:#efd474"></i>路径</span></div></div><section class="panel"><div class="controls"><label>算法 <select id="algorithm"><option value="bfs">BFS · 最少步数</option><option value="dijkstra">Dijkstra · 最小代价</option><option value="astar">A* · 曼哈顿距离</option></select></label><button id="run">运行</button><button id="pause">暂停</button><button id="step">单步</button><label>速度 <input id="speed" type="range" min="1" max="30" value="14"></label><button id="clear">清除搜索</button><button id="reset">重置地图</button><button id="preset">预设地图</button></div><p class="hint">四方向移动。进入普通格代价 1，高代价格 5，起点不计代价；BFS 只比较步数。编辑地图会停止并清除当前搜索。</p></section><section class="panel"><div class="controls" id="tools"><span>画笔：</span><button data-tool="wall" class="active">障碍</button><button data-tool="erase">擦除</button><button data-tool="weight">高代价</button><button data-tool="start">移动起点</button><button data-tool="end">移动终点</button></div><p class="hint">选择画笔后在网格上拖动；也可直接拖动起点和终点。触屏同样支持。</p></section><section class="panel"><div id="grid" class="grid" aria-label="寻路网格"></div></section><section class="panel"><div class="stats"><span>状态 <strong id="state">待开始</strong></span><span>访问 <strong id="visited">0</strong></span><span>步数 <strong id="steps">—</strong></span><span>总代价 <strong id="cost">—</strong></span></div><div class="status" id="message" aria-live="polite"></div></section></main><script>
const W=20,H=12,N=W*H,$=id=>document.getElementById(id),grid=$('grid');let cells=Array(N).fill(0),start=121,end=138,tool='wall',drag=null,search=null,timer=null;const nodes=[];
for(let i=0;i<N;i++){let b=document.createElement('button');b.className='cell';b.setAttribute('aria-label',`第 ${Math.floor(i/W)+1} 行第 ${i%W+1} 列`);b.dataset.i=i;grid.appendChild(b);nodes.push(b)}
function paint(){for(let i=0;i<N;i++){let cls=cells[i]===-1?'wall':cells[i]===5?'weight':'';if(search){if(search.frontier.has(i))cls='frontier';if(search.closed.has(i))cls='visited';if(search.path.has(i))cls='path'}if(i===start)cls='start';if(i===end)cls='end';nodes[i].className='cell '+cls} $('visited').textContent=search?search.closed.size:0}
function stop(){if(timer){clearInterval(timer);timer=null}}
function clear(){stop();search=null;$('state').textContent='待开始';$('steps').textContent='—';$('cost').textContent='—';$('message').textContent='';paint()}
function edit(i,mode){if(i<0||i>=N)return;if(mode==='start'||mode==='end'){if(cells[i]===-1||i===(mode==='start'?end:start))return;clear();if(mode==='start')start=i;else end=i}else{if(i===start||i===end)return;const v=mode==='wall'?-1:mode==='weight'?5:0;if(cells[i]===v)return;clear();cells[i]=v}paint()}
grid.addEventListener('pointerdown',e=>{let b=e.target.closest('.cell');if(!b)return;e.preventDefault();let i=+b.dataset.i;drag=i===start?'start':i===end?'end':tool;grid.setPointerCapture(e.pointerId);edit(i,drag)});grid.addEventListener('pointermove',e=>{if(!drag)return;let b=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(b)edit(+b.dataset.i,drag)});for(const name of ['pointerup','pointercancel','lostpointercapture'])grid.addEventListener(name,()=>drag=null);
$('tools').onclick=e=>{if(!e.target.dataset.tool)return;tool=e.target.dataset.tool;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool))};
function init(){let dist=Array(N).fill(Infinity),prev=Array(N).fill(-1);dist[start]=0;search={alg:$('algorithm').value,dist,prev,queue:[start],frontier:new Set([start]),closed:new Set(),path:new Set(),done:false};$('state').textContent='准备就绪'}
function neighbors(i){let x=i%W,y=Math.floor(i/W),a=[];if(x>0)a.push(i-1);if(x<W-1)a.push(i+1);if(y>0)a.push(i-W);if(y<H-1)a.push(i+W);return a.filter(j=>cells[j]!==-1)}
function tick(){if(!search)init();let s=search;if(s.done)return;if(!s.queue.length){s.done=true;stop();$('state').textContent='不可达';$('message').textContent='没有可到达终点的路径。';paint();return}let k=0;if(s.alg!=='bfs'){const score=i=>s.dist[i]+(s.alg==='astar'?Math.abs(i%W-end%W)+Math.abs(Math.floor(i/W)-Math.floor(end/W)):0);for(let j=1;j<s.queue.length;j++)if(score(s.queue[j])<score(s.queue[k]))k=j}let cur=s.queue.splice(k,1)[0];s.frontier.delete(cur);s.closed.add(cur);if(cur===end){let path=[],i=end,cost=0;while(i!==start){path.push(i);cost+=cells[i]===5?5:1;i=s.prev[i]}path.forEach(i=>s.path.add(i));s.done=true;stop();$('state').textContent='已完成';$('steps').textContent=path.length;$('cost').textContent=cost;$('message').textContent=s.alg==='bfs'?'BFS 的结果按步数最少，不保证代价最低。':'已找到最小代价路径。';paint();return}for(let n of neighbors(cur)){if(s.closed.has(n))continue;let d=s.dist[cur]+(s.alg==='bfs'?1:cells[n]===5?5:1);if(d<s.dist[n]){s.dist[n]=d;s.prev[n]=cur;if(!s.frontier.has(n)){s.frontier.add(n);s.queue.push(n)}}}paint()}
function run(){if(search?.done)clear();if(!search)init();stop();$('state').textContent='搜索中';timer=setInterval(tick,Math.max(15,310-Number($('speed').value)*10))}
$('run').onclick=run;$('pause').onclick=()=>{stop();if(search&&!search.done)$('state').textContent='已暂停'};$('step').onclick=()=>{stop();if(search?.done)clear();if(!search)init();$('state').textContent='单步';tick()};$('clear').onclick=clear;$('reset').onclick=()=>{cells.fill(0);start=121;end=138;clear()};$('preset').onclick=()=>{cells.fill(0);start=121;end=138;for(let y=1;y<11;y++)if(y!==3&&y!==8)cells[y*W+8]=-1;for(let y=2;y<10;y++)for(let x=10;x<15;x++)cells[y*W+x]=5;clear()};$('speed').oninput=()=>{if(timer)run()};$('algorithm').onchange=clear;paint();
</script></body></html>
