services:
  postgres:
    image: postgres:16-alpine
    container_name: stockwatch-db
    environment:
      POSTGRES_USER: stockwatch
      POSTGRES_PASSWORD: stockwatch
      POSTGRES_DB: stockwatch
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - stockwatch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockwatch -d stockwatch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stockwatch-pgdata:
