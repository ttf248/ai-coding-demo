services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: watchdesk
      POSTGRES_PASSWORD: watchdesk
      POSTGRES_DB: watchdesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - watchdesk-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchdesk -d watchdesk"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  watchdesk-data:
