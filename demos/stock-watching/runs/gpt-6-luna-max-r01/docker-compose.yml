services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_watchlist
      POSTGRES_USER: watchlist
      POSTGRES_PASSWORD: watchlist
    ports:
      - "5432:5432"
    volumes:
      - stock-watchlist-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchlist -d stock_watchlist"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stock-watchlist-pg:
