services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: stockwatch
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stockwatch-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d stockwatch"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  stockwatch-data:
