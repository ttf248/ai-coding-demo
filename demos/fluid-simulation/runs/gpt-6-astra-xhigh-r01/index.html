<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>色场 · 实时流体实验台</title><style>*{box-sizing:border-box}body{margin:0;background:#090e18;color:#e4eaf5;font:14px system-ui}header{padding:23px 4vw;border-bottom:1px solid #253047;display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;margin:5px 0}small{color:#8296b4;letter-spacing:2px}main{display:grid;grid-template-columns:260px 1fr;gap:24px;padding:26px 4vw;max-width:1550px;margin:auto}aside{border:1px solid #29344b;background:#111a29;padding:22px;border-radius:15px}label{display:block;margin:17px 0 8px;color:#b8c6dc}input,select,button{font:inherit;max-width:100%}input[type=range],select{width:100%;accent-color:#9c8afb}input[type=color]{height:40px;width:100%;padding:2px;border:0;background:transparent}button,select{background:#1b2940;color:#e4eaf5;border:1px solid #364766;padding:10px 13px;border-radius:8px}button{cursor:pointer}button:hover{background:#314263}.primary{background:#8c79dc;color:#fff}.row{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}p{line-height:1.7;color:#90a0b9;font-size:12px}.field{min-width:0;position:relative}canvas{width:100%;height:calc(100vh - 200px);min-height:440px;display:block;background:#070911;border:1px solid #2a3651;border-radius:15px;touch-action:none}.badge{position:absolute;top:18px;left:18px;pointer-events:none;font-size:11px;background:#101727aa;padding:8px 12px;border:1px solid #35405c;border-radius:30px;color:#bac6db}#status{padding:12px 0;color:#a4b6d2;line-height:1.6}h2{font-size:16px;margin:0}button:disabled{opacity:.5;cursor:default}@media(max-width:740px){header{padding:18px}main{padding:15px;grid-template-columns:1fr}canvas{height:420px;min-height:0}aside{padding:17px}h1{font-size:23px}}</style>
<header><div><small>CHROMA / FLOW LAB</small><h1>让颜色自由流动。</h1></div><small>WEBGL 2</small></header><main><aside><h2>流体参数</h2><label for="color">注入颜色</label><input id="color" type="color" value="#bb68ff"><label for="force">注入力度 <output id="forceValue">1.2</output></label><input id="force" type="range" min="0.1" max="3" step="0.1" value="1.2"><label for="decay">染料消散 / 秒 <output id="decayValue">0.12</output></label><input id="decay" type="range" min="0" max="1" step="0.01" value="0.12"><label for="iterations">压力迭代 <output id="iterationsValue">28</output></label><input id="iterations" type="range" min="8" max="60" step="1" value="28"><label for="resolution">模拟分辨率</label><select id="resolution"><option value="96">96 × 96 · 省电</option><option value="160" selected>160 × 160 · 均衡</option><option value="256">256 × 256 · 精细</option></select><div class="row"><button id="pause" class="primary">暂停</button><button id="clear">清空</button><button id="reset">重置参数</button><button id="shot">PNG 截图</button></div><p>在画布上拖动注入颜色和动量，移动方向决定水流。暂停会冻结演化；改变分辨率会清空并重建模拟。</p><p>二维不可压缩流：半拉格朗日平流 → 散度 → Jacobi 压力迭代 → 速度投影。显示分辨率与模拟网格独立，设备像素比上限 1.5。</p></aside><section class="field"><span class="badge" id="badge">速度场 + 染料场 · 实时求解</span><canvas id="fluid" aria-label="可触摸的彩色流体"></canvas><div id="status" role="status">正在检查 GPU 与浮点纹理支持…</div></section></main>
<script>
'use strict';const $=id=>document.getElementById(id),canvas=$('fluid');let gl,programs={},resources=[],velocity,dye,pressure,divergence,curl,N=160,paused=false,previous=0,frame=0,pointer=null,failed=false;const vertex=`#version 300 es
precision highp float;out vec2 uv;void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);uv=p;gl_Position=vec4(p*2.-1.,0.,1.);}`;
const common=`#version 300 es
precision highp float;in vec2 uv;out vec4 outColor;uniform sampler2D source;uniform sampler2D velocity;uniform sampler2D aux;uniform float h;uniform float dt;uniform float decay;uniform vec2 point;uniform vec2 force;uniform vec3 color;
vec4 sampleLinear(sampler2D tex,vec2 p){vec2 size=vec2(textureSize(tex,0));vec2 st=clamp(p,vec2(.5)/size,1.-vec2(.5)/size)*size-.5;vec2 i=floor(st),f=fract(st);return mix(mix(texture(tex,(i+.5)/size),texture(tex,(i+vec2(1.5,.5))/size),f.x),mix(texture(tex,(i+vec2(.5,1.5))/size),texture(tex,(i+1.5)/size),f.x),f.y);}
`;
const fragments={
 advect:`void main(){vec2 v=texture(velocity,uv).xy;outColor=sampleLinear(source,uv-dt*v)*exp(-decay*dt);}`,
 divergence:`void main(){float l=texture(source,uv-vec2(h,0)).x,r=texture(source,uv+vec2(h,0)).x,b=texture(source,uv-vec2(0,h)).y,t=texture(source,uv+vec2(0,h)).y;if(uv.x<h)l=-texture(source,uv).x;if(uv.x>1.-h)r=-texture(source,uv).x;if(uv.y<h)b=-texture(source,uv).y;if(uv.y>1.-h)t=-texture(source,uv).y;outColor=vec4((r-l+t-b)/(2.*h),0,0,1);}`,
 pressure:`void main(){float l=texture(source,uv-vec2(h,0)).x,r=texture(source,uv+vec2(h,0)).x,b=texture(source,uv-vec2(0,h)).x,t=texture(source,uv+vec2(0,h)).x;outColor=vec4((l+r+b+t-texture(aux,uv).x*h*h)*.25,0,0,1);}`,
 project:`void main(){float l=texture(aux,uv-vec2(h,0)).x,r=texture(aux,uv+vec2(h,0)).x,b=texture(aux,uv-vec2(0,h)).x,t=texture(aux,uv+vec2(0,h)).x;vec2 v=texture(source,uv).xy-vec2(r-l,t-b)/(2.*h);if(uv.x<h||uv.x>1.-h)v.x=0.;if(uv.y<h||uv.y>1.-h)v.y=0.;outColor=vec4(clamp(v,vec2(-4),vec2(4)),0,1);}`,
 curl:`void main(){float l=texture(source,uv-vec2(h,0)).y,r=texture(source,uv+vec2(h,0)).y,b=texture(source,uv-vec2(0,h)).x,t=texture(source,uv+vec2(0,h)).x;outColor=vec4((r-l-t+b)*.5,0,0,1);}`,
 vorticity:`void main(){float l=abs(texture(aux,uv-vec2(h,0)).x),r=abs(texture(aux,uv+vec2(h,0)).x),b=abs(texture(aux,uv-vec2(0,h)).x),t=abs(texture(aux,uv+vec2(0,h)).x);vec2 g=vec2(r-l,t-b);g/=length(g)+.00001;float c=texture(aux,uv).x;outColor=vec4(texture(source,uv).xy+vec2(g.y,-g.x)*c*dt*14.,0,1);}`,
 splatVelocity:`void main(){vec2 d=uv-point;float w=exp(-dot(d,d)/.0012);vec2 v=texture(source,uv).xy+force*w;outColor=vec4(clamp(v,vec2(-4),vec2(4)),0,1);}`,
 splatDye:`void main(){vec2 d=uv-point;float w=exp(-dot(d,d)/.0009);outColor=vec4(min(texture(source,uv).rgb+color*w,vec3(8)),1);}`,
 display:`void main(){vec3 c=sampleLinear(source,uv).rgb;float shade=1.+.12*length(texture(velocity,uv).xy);c=1.-exp(-c*shade);outColor=vec4(pow(c,vec3(.8))+vec3(.018,.024,.043),1);}`};
function compile(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function program(f){const v=compile(gl.VERTEX_SHADER,vertex),s=compile(gl.FRAGMENT_SHADER,common+f),p=gl.createProgram();gl.attachShader(p,v);gl.attachShader(p,s);gl.linkProgram(p);gl.deleteShader(v);gl.deleteShader(s);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p}
function target(){const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,N,N,0,gl.RGBA,gl.HALF_FLOAT,null);const framebuffer=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,framebuffer);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,texture,0);const t={texture,framebuffer};resources.push(t);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('设备不支持可渲染的 RGBA16F 浮点纹理');gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);return t}
function pair(){return{read:target(),write:target(),swap(){[this.read,this.write]=[this.write,this.read]}}}function dispose(){for(const r of resources){gl.deleteTexture(r.texture);gl.deleteFramebuffer(r.framebuffer)}resources=[]}
function rebuild(){dispose();N=+$('resolution').value;velocity=pair();dye=pair();pressure=pair();divergence=target();curl=target();display();$('status').textContent=`模拟网格 ${N} × ${N} · 拖动开始注入颜色。`}
function pass(name,destination,uniforms={}){const p=programs[name];gl.useProgram(p);gl.bindFramebuffer(gl.FRAMEBUFFER,destination?.framebuffer||null);gl.viewport(0,0,destination?N:canvas.width,destination?N:canvas.height);gl.uniform1f(gl.getUniformLocation(p,'h'),1/N);let unit=0;for(const[k,v]of Object.entries(uniforms)){const l=gl.getUniformLocation(p,k);if(l===null)continue;if(v&&v.texture){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,v.texture);gl.uniform1i(l,unit++)}else if(Array.isArray(v)){if(v.length===2)gl.uniform2fv(l,v);else gl.uniform3fv(l,v)}else gl.uniform1f(l,v)}gl.drawArrays(gl.TRIANGLES,0,3)}
function apply(name,p,uniforms){pass(name,p.write,{source:p.read,...uniforms});p.swap()}
function inject(x,y,dx,dy,color){apply('splatVelocity',velocity,{point:[x,y],force:[dx,dy]});apply('splatDye',dye,{point:[x,y],color})}
function display(){if(!failed&&dye)pass('display',null,{source:dye.read,velocity:velocity.read})}
function simulate(dt){apply('advect',velocity,{velocity:velocity.read,dt,decay:.12});pass('curl',curl,{source:velocity.read});apply('vorticity',velocity,{aux:curl,dt});pass('divergence',divergence,{source:velocity.read});for(let i=0;i<+$('iterations').value;i++)apply('pressure',pressure,{aux:divergence});apply('project',velocity,{aux:pressure.read});apply('advect',dye,{velocity:velocity.read,dt,decay:+$('decay').value});frame++}
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);display()}
function fail(e){failed=true;$('status').textContent='无法启动流体模拟：'+e.message+'。请使用支持 WebGL 2 和浮点渲染的浏览器 / GPU。';$('badge').textContent='GPU 不可用';document.querySelectorAll('button,input,select').forEach(e=>e.disabled=true);if(gl)dispose()}
try{gl=canvas.getContext('webgl2',{alpha:false,antialias:false,preserveDrawingBuffer:true});if(!gl)throw Error('WebGL 2 不可用');if(!gl.getExtension('EXT_color_buffer_float'))throw Error('缺少 EXT_color_buffer_float');for(const[k,f]of Object.entries(fragments))programs[k]=program(f);rebuild();resize();for(let i=0;i<14;i++){const t=i/14*Math.PI*2;inject(.5+Math.cos(t)*.16,.5+Math.sin(t)*.16,-Math.sin(t)*.3,Math.cos(t)*.3,i%2?[.28,.2,.9]:[.9,.28,.12])}display()}catch(e){fail(e)}
function tick(t){if(failed)return;const dt=Math.min((t-previous)/1000||.016,.033);previous=t;if(!paused)simulate(dt);display();requestAnimationFrame(tick)}if(!failed)requestAnimationFrame(tick);
const pos=e=>{const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)/r.width,1-(e.clientY-r.top)/r.height]};function add(p,previous){if(paused||failed)return;const hex=$('color').value,c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255);inject(p[0],p[1],Math.max(-2,Math.min(2,(p[0]-previous[0])*45))*+$('force').value,Math.max(-2,Math.min(2,(p[1]-previous[1])*45))*+$('force').value,c)}canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pointer=pos(e);add(pointer,pointer)};canvas.onpointermove=e=>{if(!pointer)return;const p=pos(e);add(p,pointer);pointer=p};canvas.onpointerup=canvas.onpointercancel=()=>pointer=null;
for(const id of ['force','decay','iterations'])$(id).oninput=()=>$(id+'Value').value=$(id).value;$('resolution').onchange=()=>{try{rebuild()}catch(e){fail(e)}};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续':'暂停';$('badge').textContent=paused?'已暂停 · 演化冻结':'速度场 + 染料场 · 实时求解'};$('clear').onclick=rebuild;$('reset').onclick=()=>{$('force').value=1.2;$('decay').value=.12;$('iterations').value=28;$('resolution').value=160;$('color').value='#bb68ff';for(const id of ['force','decay','iterations'])$(id+'Value').value=$(id).value;paused=false;$('pause').textContent='暂停';$('badge').textContent='速度场 + 染料场 · 实时求解';rebuild()};$('shot').onclick=()=>{display();const a=document.createElement('a');a.download='chroma-flow.png';a.href=canvas.toDataURL('image/png');a.click()};window.addEventListener('resize',resize);canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();fail(Error('GPU 上下文丢失，请刷新页面重试'))});window.addEventListener('pagehide',()=>{if(gl){dispose();Object.values(programs).forEach(p=>gl.deleteProgram(p))}});window.lab={get frame(){return frame},get failed(){return failed},get resources(){return resources.length},get resolution(){return N},simulate,inject};
</script></html>
