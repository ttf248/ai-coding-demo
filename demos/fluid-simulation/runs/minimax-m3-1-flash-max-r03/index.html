<!doctype html>
<html lang="zh-CN">
  <head>
    <script src="../../../../assets/analytics.js" defer></script>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>彩色流体实验台</title>
    <style>
      :root {
        --bg: #06080f;
        --panel: #10151f;
        --panel-2: #172033;
        --line: #243047;
        --text: #e8eef7;
        --muted: #8fa3bd;
        --accent: #38bdf8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }
      .app {
        max-width: 1220px;
        margin: 0 auto;
        padding: 16px 14px 36px;
      }
      header h1 {
        margin: 0 0 6px;
        font-size: 21px;
      }
      header p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 296px;
        gap: 14px;
        margin-top: 14px;
        align-items: start;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
      }
      .stage {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: #04060b;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 10;
        touch-action: none;
        cursor: crosshair;
      }
      .fallback {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        text-align: center;
        padding: 24px;
        color: #fca5a5;
        background: rgba(8, 10, 16, 0.94);
        font-size: 14px;
        line-height: 1.8;
      }
      .fallback.show {
        display: grid;
      }
      .chip {
        position: absolute;
        left: 10px;
        top: 10px;
        background: rgba(8, 11, 18, 0.78);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 11.5px;
        color: var(--text);
        pointer-events: none;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      button {
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px 12px;
        cursor: pointer;
        transition: 0.15s;
      }
      button:hover {
        border-color: #3c5480;
      }
      button:active {
        transform: translateY(1px);
      }
      button.primary {
        background: linear-gradient(180deg, #0ea5e9, #0369a1);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      button.warn {
        border-color: #7c2d12;
        color: #fdba74;
      }
      h2 {
        font-size: 12px;
        letter-spacing: 1px;
        color: var(--muted);
        margin: 0 0 10px;
        font-weight: 600;
      }
      .group {
        margin-bottom: 18px;
      }
      .field {
        margin-bottom: 12px;
      }
      .field label {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .field label span {
        white-space: nowrap;
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }
      input[type="color"] {
        width: 100%;
        height: 38px;
        padding: 2px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 9px;
      }
      .note {
        font-size: 11.5px;
        color: var(--muted);
        line-height: 1.8;
      }
      .status {
        margin-top: 10px;
        font-size: 12.5px;
        color: var(--muted);
      }
      @media (max-width: 940px) {
        .layout {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>彩色流体实验台</h1>
        <p>
          基于 WebGL 的实时二维流体求解：平流 → 散度 → 压力迭代 → 速度投影，
          染料场独立平流。拖动即可注入颜色与动量。
        </p>
      </header>

      <div class="layout">
        <section class="panel">
          <div class="toolbar">
            <button id="toggle" class="primary">暂停模拟</button>
            <button id="clear">清空画面</button>
            <button id="reset">重置参数</button>
            <button id="shot">保存 PNG</button>
            <button id="splat">随机泼洒</button>
          </div>
          <div class="stage">
            <canvas id="gl"></canvas>
            <div class="chip" id="chip">拖动注入染料</div>
            <div class="fallback" id="fallback"></div>
          </div>
          <div class="status" id="status">正在初始化 WebGL…</div>
        </section>

        <aside class="panel">
          <div class="group">
            <h2>染料与力度</h2>
            <div class="field">
              <label for="color"><span>染料颜色</span></label>
              <input id="color" type="color" value="#38bdf8" />
            </div>
            <div class="field">
              <label for="force"><span>注入力度</span><span id="force-value">5200</span></label>
              <input id="force" type="range" min="500" max="12000" step="100" value="5200" />
            </div>
            <div class="field">
              <label for="radius"><span>注入半径</span><span id="radius-value">0.0022</span></label>
              <input id="radius" type="range" min="0.0005" max="0.006" step="0.0001" value="0.0022" />
            </div>
            <div class="field">
              <label for="splat">染料量</span>
              <input id="splat" type="range" min="0.05" max="0.6" step="0.01" value="0.22" />
            </div>
          </div>

          <div class="group">
            <h2>求解器参数</h2>
            <div class="field">
              <label for="dissipation"><span>染料消散</span><span id="dissipation-value">0.85</span></label>
              <input id="dissipation" type="range" min="0" max="3" step="0.05" value="0.85" />
            </div>
            <div class="field">
              <label for="iterations"><span>压力迭代次数</span><span id="iterations-value">24</span></label>
              <input id="iterations" type="range" min="1" max="60" step="1" value="24" />
            </div>
            <div class="field">
              <label for="resolution"><span>模拟分辨率</span><span id="resolution-value">192</span></label>
              <input id="resolution" type="range" min="64" max="512" step="32" value="192" />
            </div>
            <div class="field">
              <label for="curl"><span>涡量强度</span><span id="curl-value">28</span></label>
              <input id="curl" type="range" min="0" max="60" step="1" value="28" />
            </div>
          </div>

          <div class="group">
            <h2>说明</h2>
            <p class="note">
              · 使用半浮点纹理保存速度与压力场，若浏览器缺少所需浮点渲染扩展会给出明确提示。<br />
              · 设备像素比上限为 2，避免高分屏上过载；窗口尺寸变化会重建并释放旧的 GPU 资源。<br />
              · 触摸拖动与鼠标拖动等效，坐标按画布比例换算。
            </p>
          </div>
        </aside>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const canvas = document.getElementById("gl");
        const fallback = document.getElementById("fallback");
        const statusBox = document.getElementById("status");
        const chip = document.getElementById("chip");

        const config = {
          force: 5200,
          radius: 0.0022,
          splat: 0.22,
          dissipation: 0.85,
          iterations: 24,
          resolution: 192,
          curl: 28,
          color: [0.22, 0.74, 0.97],
        };
        const defaults = JSON.parse(JSON.stringify(config));
        let paused = false;
        let gl = null;
        let halfFloat = null;
        let isWebGL2 = false;
        let program = null;
        let dye = null;
        let velocity = null;
        let divergence = null;
        let curl = null;
        let pressure = null;
        let lastTime = 0;
        let failed = false;
        let screenshotRequest = false;
        let pointer = { x: 0, y: 0, down: false, moved: false };

        /* ---------------- WebGL 初始化与能力检测 ---------------- */
        function fail(message) {
          fallback.innerHTML = "";
          const text = document.createElement("p");
          text.textContent = message;
          fallback.appendChild(text);
          const retry = document.createElement("button");
          retry.textContent = "重新初始化模拟";
          retry.className = "primary";
          retry.style.marginTop = "12px";
          retry.addEventListener("click", () => window.location.reload());
          fallback.appendChild(retry);
          fallback.classList.add("show");
          statusBox.textContent = "当前环境无法继续运行流体模拟，可尝试重新初始化。";
          chip.textContent = "不可用";
        }

        function initGL() {
          const attrs = {
            alpha: false,
            depth: false,
            stencil: false,
            antialias: false,
            // 不使用 preserveDrawingBuffer：部分软件渲染环境在保留缓冲 + 浮点纹理时会丢失上下文，
            // 截图改为在同一帧渲染完成后立即读取。
            preserveDrawingBuffer: false,
            powerPreference: "high-performance",
          };
          let context = canvas.getContext("webgl2", attrs);
          isWebGL2 = !!context;
          if (!context) context = canvas.getContext("webgl", attrs) || canvas.getContext("experimental-webgl", attrs);
          if (!context) {
            fail("当前浏览器没有可用的 WebGL 上下文，无法运行流体模拟。请更换支持 WebGL 的浏览器或开启硬件加速。");
            return false;
          }
          gl = context;

          if (isWebGL2) {
            const floatRender = gl.getExtension("EXT_color_buffer_float");
            const halfRender = gl.getExtension("EXT_color_buffer_half_float");
            if (!floatRender && !halfRender) {
              fail("当前浏览器的 WebGL2 不支持浮点颜色缓冲（缺少 EXT_color_buffer_float），无法运行流体模拟。");
              return false;
            }
            gl.getExtension("OES_texture_float_linear");
            halfFloat = null;
          } else {
            const half = gl.getExtension("OES_texture_half_float");
            const linear = gl.getExtension("OES_texture_half_float_linear");
            const colorFloat = gl.getExtension("WEBGL_color_buffer_float");
            const colorHalf = gl.getExtension("EXT_color_buffer_half_float");
            if (!half || !linear || (!colorFloat && !colorHalf)) {
              fail("当前浏览器的 WebGL1 缺少半浮点纹理或浮点渲染支持（OES_texture_half_float / EXT_color_buffer_half_float），无法运行流体模拟。");
              return false;
            }
            halfFloat = half;
          }
          gl.clearColor(0, 0, 0, 1);
          return true;
        }

        /* ---------------- 着色器 ---------------- */
        const VERT = `
          precision mediump float;
          attribute vec2 aPosition;
          varying vec2 vUv;
          varying vec2 vL;
          varying vec2 vR;
          varying vec2 vT;
          varying vec2 vB;
          uniform vec2 texelSize;
          void main() {
            vUv = aPosition * 0.5 + 0.5;
            vL = vUv - vec2(texelSize.x, 0.0);
            vR = vUv + vec2(texelSize.x, 0.0);
            vT = vUv + vec2(0.0, texelSize.y);
            vB = vUv - vec2(0.0, texelSize.y);
            gl_Position = vec4(aPosition, 0.0, 1.0);
          }
        `;

        const FRAG_COPY = `
          precision mediump float;
          varying vec2 vUv;
          uniform sampler2D uTexture;
          void main() { gl_FragColor = texture2D(uTexture, vUv); }
        `;

        const FRAG_CLEAR = `
          precision mediump float;
          varying vec2 vUv;
          uniform sampler2D uTexture;
          uniform float value;
          void main() { gl_FragColor = value * texture2D(uTexture, vUv); }
        `;

        const FRAG_ADVECT = `
          precision mediump float;
          varying vec2 vUv;
          uniform sampler2D uVelocity;
          uniform sampler2D uSource;
          uniform vec2 texelSize;
          uniform vec2 dyeTexelSize;
          uniform float dt;
          uniform float dissipation;
          void main() {
            vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
            vec4 result = texture2D(uSource, coord);
            float decay = 1.0 + dissipation * dt;
            gl_FragColor = result / decay;
          }
        `;

        const FRAG_DIVERGENCE = `
          precision mediump float;
          varying vec2 vUv;
          varying vec2 vL;
          varying vec2 vR;
          varying vec2 vT;
          varying vec2 vB;
          uniform sampler2D uVelocity;
          void main() {
            float L = texture2D(uVelocity, vL).x;
            float R = texture2D(uVelocity, vR).x;
            float T = texture2D(uVelocity, vT).y;
            float B = texture2D(uVelocity, vB).y;
            vec2 C = texture2D(uVelocity, vUv).xy;
            if (vL.x < 0.0) { L = -C.x; }
            if (vR.x > 1.0) { R = -C.x; }
            if (vT.y > 1.0) { T = -C.y; }
            if (vB.y < 0.0) { B = -C.y; }
            float div = 0.5 * (R - L + T - B);
            gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
          }
        `;

        const FRAG_CURL = `
          precision mediump float;
          varying vec2 vUv;
          varying vec2 vL;
          varying vec2 vR;
          varying vec2 vT;
          varying vec2 vB;
          uniform sampler2D uVelocity;
          void main() {
            float L = texture2D(uVelocity, vL).y;
            float R = texture2D(uVelocity, vR).y;
            float T = texture2D(uVelocity, vT).x;
            float B = texture2D(uVelocity, vB).x;
            float vorticity = R - L - T + B;
            gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
          }
        `;

        const FRAG_VORTICITY = `
          precision mediump float;
          varying vec2 vUv;
          varying vec2 vL;
          varying vec2 vR;
          varying vec2 vT;
          varying vec2 vB;
          uniform sampler2D uVelocity;
          uniform sampler2D uCurl;
          uniform float curl;
          uniform float dt;
          void main() {
            float L = texture2D(uCurl, vL).x;
            float R = texture2D(uCurl, vR).x;
            float T = texture2D(uCurl, vT).x;
            float B = texture2D(uCurl, vB).x;
            float C = texture2D(uCurl, vUv).x;
            vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
            force /= length(force) + 0.0001;
            force *= curl * C;
            force.y *= -1.0;
            vec2 velocity = texture2D(uVelocity, vUv).xy;
            velocity += force * dt;
            velocity = clamp(velocity, vec2(-1000.0), vec2(1000.0));
            gl_FragColor = vec4(velocity, 0.0, 1.0);
          }
        `;

        const FRAG_PRESSURE = `
          precision mediump float;
          varying vec2 vUv;
          varying vec2 vL;
          varying vec2 vR;
          varying vec2 vT;
          varying vec2 vB;
          uniform sampler2D uPressure;
          uniform sampler2D uDivergence;
          void main() {
            float L = texture2D(uPressure, vL).x;
            float R = texture2D(uPressure, vR).x;
            float T = texture2D(uPressure, vT).x;
            float B = texture2D(uPressure, vB).x;
            float divergence = texture2D(uDivergence, vUv).x;
            float p = (L + R + B + T - divergence) * 0.25;
            gl_FragColor = vec4(p, 0.0, 0.0, 1.0);
          }
        `;

        const FRAG_GRADIENT = `
          precision mediump float;
          varying vec2 vUv;
          varying vec2 vL;
          varying vec2 vR;
          varying vec2 vT;
          varying vec2 vB;
          uniform sampler2D uPressure;
          uniform sampler2D uVelocity;
          void main() {
            float L = texture2D(uPressure, vL).x;
            float R = texture2D(uPressure, vR).x;
            float T = texture2D(uPressure, vT).x;
            float B = texture2D(uPressure, vB).x;
            vec2 velocity = texture2D(uVelocity, vUv).xy;
            velocity -= vec2(R - L, T - B);
            gl_FragColor = vec4(velocity, 0.0, 1.0);
          }
        `;

        const FRAG_SPLAT = `
          precision mediump float;
          varying vec2 vUv;
          uniform sampler2D uTarget;
          uniform float aspectRatio;
          uniform vec3 color;
          uniform vec2 point;
          uniform float radius;
          void main() {
            vec2 p = vUv - point.xy;
            p.x *= aspectRatio;
            vec3 splat = exp(-dot(p, p) / radius) * color;
            vec3 base = texture2D(uTarget, vUv).xyz;
            gl_FragColor = vec4(base + splat, 1.0);
          }
        `;

        const FRAG_DISPLAY = `
          precision mediump float;
          varying vec2 vUv;
          varying vec2 vL;
          varying vec2 vR;
          varying vec2 vT;
          varying vec2 vB;
          uniform sampler2D uTexture;
          void main() {
            vec3 c = texture2D(uTexture, vUv).rgb;
            vec3 lc = texture2D(uTexture, vL).rgb;
            vec3 rc = texture2D(uTexture, vR).rgb;
            vec3 tc = texture2D(uTexture, vT).rgb;
            vec3 bc = texture2D(uTexture, vB).rgb;
            float dx = length(rc) - length(lc);
            float dy = length(tc) - length(bc);
            vec3 n = normalize(vec3(dx, dy, length(c) + 0.0001));
            float diffuse = clamp(dot(n, vec3(0.0, 0.0, 1.0)), 0.0, 1.0);
            c = c * (0.72 + 0.55 * diffuse);
            c = max(c, vec3(0.0));
            c = pow(c, vec3(0.4545));
            gl_FragColor = vec4(c, 1.0);
          }
        `;

        /* ---------------- 资源管理 ---------------- */
        function compile(type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            const log = gl.getShaderInfoLog(shader);
            gl.deleteShader(shader);
            throw new Error("着色器编译失败：" + log);
          }
          return shader;
        }

        function createProgram(fragmentSource) {
          const vs = compile(gl.VERTEX_SHADER, VERT);
          const fs = compile(gl.FRAGMENT_SHADER, fragmentSource);
          const prog = gl.createProgram();
          gl.attachShader(prog, vs);
          gl.attachShader(prog, fs);
          gl.bindAttribLocation(prog, 0, "aPosition");
          gl.linkProgram(prog);
          gl.deleteShader(vs);
          gl.deleteShader(fs);
          if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
            const log = gl.getProgramInfoLog(prog);
            gl.deleteProgram(prog);
            throw new Error("着色器链接失败：" + log);
          }
          const uniforms = {};
          const count = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
          for (let i = 0; i < count; i++) {
            const info = gl.getActiveUniform(prog, i);
            uniforms[info.name] = gl.getUniformLocation(prog, info.name);
          }
          return { prog, uniforms };
        }

        let buffer = null;
        function initQuad() {
          buffer = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
          gl.bufferData(
            gl.ARRAY_BUFFER,
            new Float32Array([-1, -1, 3, -1, -1, 3]),
            gl.STATIC_DRAW,
          );
          gl.enableVertexAttribArray(0);
          gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
          gl.bindBuffer(gl.ARRAY_BUFFER, null);
        }

        function createTexture(width, height, filter) {
          const tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          const sampling = filter === "nearest" ? gl.NEAREST : gl.LINEAR;
          // 染料是 [0,1] 的颜色量，使用 8 位纹理即可；
          // 速度与压力是带符号的物理量，必须使用浮点纹理。
          const useFloat = filter !== "dye";
          if (isWebGL2) {
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, sampling);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, sampling);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            if (useFloat)
              gl.texImage2D(
                gl.TEXTURE_2D,
                0,
                gl.RGBA16F,
                width,
                height,
                0,
                gl.RGBA,
                gl.HALF_FLOAT,
                null,
              );
            else
              gl.texImage2D(
                gl.TEXTURE_2D,
                0,
                gl.RGBA8,
                width,
                height,
                0,
                gl.RGBA,
                gl.UNSIGNED_BYTE,
                null,
              );
          } else {
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, sampling);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, sampling);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            if (useFloat)
              gl.texImage2D(
                gl.TEXTURE_2D,
                0,
                gl.RGBA,
                width,
                height,
                0,
                gl.RGBA,
                halfFloat,
                null,
              );
            else
              gl.texImage2D(
                gl.TEXTURE_2D,
                0,
                gl.RGBA,
                width,
                height,
                0,
                gl.RGBA,
                gl.UNSIGNED_BYTE,
                null,
              );
          }
          return tex;
        }

        function createFBO(width, height, filter) {
          const texture = createTexture(width, height, filter);
          const fbo = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
          gl.framebufferTexture2D(
            gl.FRAMEBUFFER,
            gl.COLOR_ATTACHMENT0,
            gl.TEXTURE_2D,
            texture,
            0,
          );
          gl.viewport(0, 0, width, height);
          gl.clear(gl.COLOR_BUFFER_BIT);
          return {
            texture,
            fbo,
            width,
            height,
            texelSizeX: 1 / width,
            texelSizeY: 1 / height,
            attach(id) {
              gl.activeTexture(gl.TEXTURE0 + id);
              gl.bindTexture(gl.TEXTURE_2D, texture);
              return id;
            },
          };
        }

        function createDoubleFBO(width, height, filter) {
          return {
            read: createFBO(width, height, filter),
            write: createFBO(width, height, filter),
            width,
            height,
            texelSizeX: 1 / width,
            texelSizeY: 1 / height,
            swap() {
              const tmp = this.read;
              this.read = this.write;
              this.write = tmp;
            },
          };
        }

        function disposeFBO(target) {
          if (!target) return;
          if (target.read) {
            gl.deleteFramebuffer(target.read.fbo);
            gl.deleteTexture(target.read.texture);
            gl.deleteFramebuffer(target.write.fbo);
            gl.deleteTexture(target.write.texture);
          } else {
            gl.deleteFramebuffer(target.fbo);
            gl.deleteTexture(target.texture);
          }
        }

        /* ---------------- 渲染流程 ---------------- */
        function blit(target, clear) {
          if (target == null) {
            gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          } else {
            gl.viewport(0, 0, target.width, target.height);
            gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
          }
          if (clear) {
            gl.clearColor(0, 0, 0, 1);
            gl.clear(gl.COLOR_BUFFER_BIT);
          }
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        function bindTexture(unit, texture) {
          gl.activeTexture(gl.TEXTURE0 + unit);
          gl.bindTexture(gl.TEXTURE_2D, texture);
        }

        function step(dt) {
          gl.disable(gl.BLEND);

          // 1. 涡量约束
          if (config.curl > 0) {
            gl.useProgram(program.vorticity.prog);
            gl.uniform2f(
              program.vorticity.uniforms.texelSize,
              velocity.texelSizeX,
              velocity.texelSizeY,
            );
            gl.uniform1i(program.vorticity.uniforms.uVelocity, velocity.read.attach(0));
            gl.uniform1i(program.vorticity.uniforms.uCurl, curl.attach(1));
            gl.uniform1f(program.vorticity.uniforms.curl, config.curl);
            gl.uniform1f(program.vorticity.uniforms.dt, dt);
            blit(velocity.write);
            velocity.swap();
          }

          // 2. 散度
          gl.useProgram(program.divergence.prog);
          gl.uniform2f(
            program.divergence.uniforms.texelSize,
            velocity.texelSizeX,
            velocity.texelSizeY,
          );
          gl.uniform1i(program.divergence.uniforms.uVelocity, velocity.read.attach(0));
          blit(divergence);
          // 3. 压力清零并迭代
          gl.useProgram(program.clear.prog);
          gl.uniform1i(program.clear.uniforms.uTexture, pressure.read.attach(0));
          gl.uniform1f(program.clear.uniforms.value, 0.8);
          blit(pressure.write);
          pressure.swap();

          gl.useProgram(program.pressure.prog);
          gl.uniform2f(
            program.pressure.uniforms.texelSize,
            velocity.texelSizeX,
            velocity.texelSizeY,
          );
          gl.uniform1i(program.pressure.uniforms.uDivergence, divergence.attach(0));
          for (let i = 0; i < config.iterations; i++) {
            gl.uniform1i(program.pressure.uniforms.uPressure, pressure.read.attach(1));
            blit(pressure.write);
            pressure.swap();
          }

          // 4. 减去压力梯度
          gl.useProgram(program.gradient.prog);
          gl.uniform2f(
            program.gradient.uniforms.texelSize,
            velocity.texelSizeX,
            velocity.texelSizeY,
          );
          gl.uniform1i(program.gradient.uniforms.uPressure, pressure.read.attach(0));
          gl.uniform1i(program.gradient.uniforms.uVelocity, velocity.read.attach(1));
          blit(velocity.write);
          velocity.swap();

          // 5. 速度平流
          gl.useProgram(program.advect.prog);
          gl.uniform2f(
            program.advect.uniforms.texelSize,
            velocity.texelSizeX,
            velocity.texelSizeY,
          );
          gl.uniform2f(
            program.advect.uniforms.dyeTexelSize,
            velocity.texelSizeX,
            velocity.texelSizeY,
          );
          gl.uniform1i(program.advect.uniforms.uVelocity, velocity.read.attach(0));
          gl.uniform1i(program.advect.uniforms.uSource, velocity.read.attach(0));
          gl.uniform1f(program.advect.uniforms.dt, dt);
          gl.uniform1f(program.advect.uniforms.dissipation, 0.2);
          blit(velocity.write);
          velocity.swap();

          // 6. 染料平流
          gl.useProgram(program.advect.prog);
          gl.uniform2f(
            program.advect.uniforms.texelSize,
            velocity.texelSizeX,
            velocity.texelSizeY,
          );
          gl.uniform2f(
            program.advect.uniforms.dyeTexelSize,
            dye.texelSizeX,
            dye.texelSizeY,
          );
          gl.uniform1i(program.advect.uniforms.uVelocity, velocity.read.attach(0));
          gl.uniform1i(program.advect.uniforms.uSource, dye.read.attach(1));
          gl.uniform1f(program.advect.uniforms.dt, dt);
          gl.uniform1f(program.advect.uniforms.dissipation, config.dissipation);
          blit(dye.write);
          dye.swap();
        }

        function render() {
          gl.useProgram(program.display.prog);
          gl.uniform2f(
            program.display.uniforms.texelSize,
            dye.texelSizeX,
            dye.texelSizeY,
          );
          gl.uniform1i(program.display.uniforms.uTexture, dye.read.attach(0));
          blit(null);
        }

        function splat(x, y, dx, dy, color, radius) {
          gl.useProgram(program.splat.prog);
          gl.uniform1i(program.splat.uniforms.uTarget, dye.read.attach(0));
          gl.uniform1f(
            program.splat.uniforms.aspectRatio,
            canvas.width / canvas.height,
          );
          gl.uniform2f(program.splat.uniforms.point, x, y);
          gl.uniform3f(program.splat.uniforms.color, color[0], color[1], color[2]);
          gl.uniform1f(program.splat.uniforms.radius, radius);
          blit(dye.write);
          dye.swap();

          gl.useProgram(program.splat.prog);
          gl.uniform1i(program.splat.uniforms.uTarget, velocity.read.attach(0));
          gl.uniform1f(
            program.splat.uniforms.aspectRatio,
            canvas.width / canvas.height,
          );
          gl.uniform2f(program.splat.uniforms.point, x, y);
          gl.uniform3f(
            program.splat.uniforms.color,
            dx * config.force,
            dy * config.force,
            0,
          );
          gl.uniform1f(program.splat.uniforms.radius, radius);
          blit(velocity.write);
          velocity.swap();
        }

        function clearAll() {
          gl.useProgram(program.clear.prog);
          gl.uniform1f(program.clear.uniforms.value, 0);
          gl.uniform1i(program.clear.uniforms.uTexture, dye.read.attach(0));
          blit(dye.write);
          dye.swap();
          gl.uniform1i(program.clear.uniforms.uTexture, velocity.read.attach(0));
          blit(velocity.write);
          velocity.swap();
        }

        /* ---------------- 尺寸与资源重建 ---------------- */
        function resize() {
          // 绘制缓冲使用固定上限，避免高分屏与频繁 resize 造成 GPU 资源抖动
          const width = 1024;
          const height = 640;
          if (canvas.width === width && canvas.height === height && dye) return;
          canvas.width = width;
          canvas.height = height;

          const dyeRes = Math.min(1024, Math.max(256, Math.round(width / 2)));
          const dyeHeight = Math.round((dyeRes * height) / width);
          const simRes = Math.round(config.resolution);
          const simHeight = Math.round((simRes * height) / width);

          // 释放旧资源，避免 GPU 内存泄漏
          disposeFBO(dye);
          disposeFBO(velocity);
          disposeFBO(divergence);
          disposeFBO(curl);
          disposeFBO(pressure);

          dye = createDoubleFBO(dyeRes, dyeHeight, "dye");
          velocity = createDoubleFBO(simRes, simHeight, "nearest");
          divergence = createFBO(simRes, simHeight, "nearest");
          curl = createFBO(simRes, simHeight, "nearest");
          pressure = createDoubleFBO(simRes, simHeight, "nearest");
          chip.textContent =
            (isWebGL2 ? "WebGL2" : "WebGL1") +
            " · 缓冲 " +
            width +
            "×" +
            height +
            " · 网格 " +
            simRes;
        }

        function rebuildSimulation() {
          const width = canvas.width || 1024;
          const height = canvas.height || 640;
          const simRes = Math.round(config.resolution);
          const simHeight = Math.round((simRes * height) / width);
          disposeFBO(velocity);
          disposeFBO(divergence);
          disposeFBO(curl);
          disposeFBO(pressure);
          velocity = createDoubleFBO(simRes, simHeight, "nearest");
          divergence = createFBO(simRes, simHeight, "nearest");
          curl = createFBO(simRes, simHeight, "nearest");
          pressure = createDoubleFBO(simRes, simHeight, "nearest");
        }

        /* ---------------- 交互 ---------------- */
        function pointerPos(event) {
          const rect = canvas.getBoundingClientRect();
          return {
            x: (event.clientX - rect.left) / rect.width,
            y: 1 - (event.clientY - rect.top) / rect.height,
          };
        }

        canvas.addEventListener("pointerdown", (event) => {
          canvas.setPointerCapture(event.pointerId);
          pointer.down = true;
          pointer.moved = false;
          const p = pointerPos(event);
          pointer.x = p.x;
          pointer.y = p.y;
          splat(p.x, p.y, 0, 0, config.color, config.radius);
        });

        canvas.addEventListener("pointermove", (event) => {
          const p = pointerPos(event);
          if (!pointer.down) return;
          const dx = p.x - pointer.x;
          const dy = p.y - pointer.y;
          pointer.x = p.x;
          pointer.y = p.y;
          if (Math.abs(dx) < 0.0005 && Math.abs(dy) < 0.0005) return;
          pointer.moved = true;
          const color = [
            config.color[0] * config.splat,
            config.color[1] * config.splat,
            config.color[2] * config.splat,
          ];
          splat(p.x, p.y, dx, dy, color, config.radius);
        });

        const release = () => {
          pointer.down = false;
        };
        canvas.addEventListener("pointerup", release);
        canvas.addEventListener("pointercancel", release);
        canvas.addEventListener("pointerleave", release);

        /* ---------------- 主循环 ---------------- */
        function frame(now) {
          requestAnimationFrame(frame);
          if (!gl || !dye || failed) return;
          const dt = Math.min(0.016, (now - lastTime) / 1000 || 0.016);
          lastTime = now;
          if (!paused) step(dt);
          render();
          if (screenshotRequest) {
            const link = document.createElement("a");
            link.download = "fluid-simulation.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
            screenshotRequest = false;
            statusBox.textContent = "已保存当前画面为 PNG。";
          }
        }

        /* ---------------- 控件 ---------------- */
        function readColor() {
          const value = document.getElementById("color").value;
          config.color = [
            parseInt(value.slice(1, 3), 16) / 255,
            parseInt(value.slice(3, 5), 16) / 255,
            parseInt(value.slice(5, 7), 16) / 255,
          ];
        }
        const bindings = [
          ["force", "force-value", (v) => String(Math.round(v))],
          ["radius", "radius-value", (v) => v.toFixed(4)],
          ["splat", null, null],
          ["dissipation", "dissipation-value", (v) => v.toFixed(2)],
          ["iterations", "iterations-value", (v) => String(Math.round(v))],
          ["resolution", "resolution-value", (v) => String(Math.round(v))],
          ["curl", "curl-value", (v) => String(Math.round(v))],
        ];
        bindings.forEach(([id, label, format]) => {
          const input = document.getElementById(id);
          input.addEventListener("input", () => {
            const value = Number(input.value);
            config[id] = value;
            if (label && format)
              document.getElementById(label).textContent = format(value);
            if (id === "resolution" && gl && dye) {
              rebuildSimulation();
              statusBox.textContent =
                "模拟分辨率已调整为 " + Math.round(value) + "，速度与压力场已重建。";
            }
          });
        });
        document.getElementById("color").addEventListener("input", readColor);

        document.getElementById("toggle").addEventListener("click", (event) => {
          paused = !paused;
          event.target.textContent = paused ? "继续模拟" : "暂停模拟";
          statusBox.textContent = paused
            ? "模拟已暂停：画面冻结，参数仍可调整。"
            : "模拟运行中：拖动画布注入染料与动量。";
        });

        document.getElementById("clear").addEventListener("click", () => {
          if (!gl || !dye) return;
          clearAll();
          statusBox.textContent = "画面已清空，所有流体内容被移除。";
        });

        document.getElementById("reset").addEventListener("click", () => {
          Object.assign(config, JSON.parse(JSON.stringify(defaults)));
          document.getElementById("force").value = config.force;
          document.getElementById("radius").value = config.radius;
          document.getElementById("splat").value = config.splat;
          document.getElementById("dissipation").value = config.dissipation;
          document.getElementById("iterations").value = config.iterations;
          document.getElementById("resolution").value = config.resolution;
          document.getElementById("curl").value = config.curl;
          document.getElementById("force-value").textContent = String(config.force);
          document.getElementById("radius-value").textContent =
            config.radius.toFixed(4);
          document.getElementById("dissipation-value").textContent =
            config.dissipation.toFixed(2);
          document.getElementById("iterations-value").textContent = String(
            config.iterations,
          );
          document.getElementById("resolution-value").textContent = String(
            config.resolution,
          );
          document.getElementById("curl-value").textContent = String(config.curl);
          readColor();
          if (gl && dye) {
            rebuildSimulation();
            clearAll();
          }
          statusBox.textContent = "参数已恢复默认值，画面已清空。";
        });

        document.getElementById("shot").addEventListener("click", () => {
          if (!gl || !dye) return;
          screenshotRequest = true;
          statusBox.textContent = "正在保存当前画面…";
        });

        document.getElementById("splat").addEventListener("click", () => {
          if (!gl || !dye) return;
          for (let i = 0; i < 6; i++) {
            splat(
              Math.random(),
              Math.random(),
              (Math.random() - 0.5) * 0.02,
              (Math.random() - 0.5) * 0.02,
              config.color,
              config.radius * 1.6,
            );
          }
          statusBox.textContent = "已随机泼洒染料，可用清空按钮移除。";
        });

        /* ---------------- 启动 ---------------- */
        function boot() {
          if (!initGL()) return;
          try {
            program = {
              copy: createProgram(FRAG_COPY),
              clear: createProgram(FRAG_CLEAR),
              advect: createProgram(FRAG_ADVECT),
              divergence: createProgram(FRAG_DIVERGENCE),
              curl: createProgram(FRAG_CURL),
              vorticity: createProgram(FRAG_VORTICITY),
              pressure: createProgram(FRAG_PRESSURE),
              gradient: createProgram(FRAG_GRADIENT),
              splat: createProgram(FRAG_SPLAT),
              display: createProgram(FRAG_DISPLAY),
            };
          } catch (error) {
            fail("着色器初始化失败：" + error.message);
            return;
          }
          initQuad();
          resize();
          canvas.addEventListener("webglcontextlost", (event) => {
            event.preventDefault();
            failed = true;
            fail(
              "WebGL 上下文已丢失，通常由显卡驱动或系统资源不足引起，请重新初始化模拟或刷新页面。",
            );
          });
          statusBox.textContent =
            "模拟运行中：拖动画布注入染料与动量。参数改变会立即生效。";
          window.addEventListener("resize", () => {
            resize();
          });
          requestAnimationFrame(frame);
        }

        boot();
      })();
    </script>
  </body>
</html>
