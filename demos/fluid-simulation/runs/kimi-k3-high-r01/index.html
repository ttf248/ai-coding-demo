<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彩色流体实验台</title>
<style>
  :root{--bg:#0d1117;--panel:#161c26;--ink:#e6e9ef;--muted:#8b94a3;--line:#2a3342;--accent:#4f8ef7;--danger:#f25555;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;}
  header{padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  header h1{font-size:18px;margin-right:auto;}
  #status{font-size:13px;padding:4px 10px;border-radius:6px;background:#1c2431;color:var(--muted);}
  #status.err{background:#3a1d1d;color:var(--danger);}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center;font-size:13px;}
  button,select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);background:#1c2431;border-radius:6px;cursor:pointer;color:var(--ink);}
  button:hover{border-color:var(--accent);color:var(--accent);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.warn{border-color:var(--danger);color:var(--danger);}
  label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  input[type=color]{width:34px;height:26px;border:1px solid var(--line);border-radius:4px;background:none;padding:0;cursor:pointer;}
  main{flex:1;display:flex;gap:10px;padding:10px;flex-wrap:wrap;}
  #fluidWrap{flex:1 1 520px;min-width:0;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;}
  #fluid{display:block;width:100%;height:560px;touch-action:none;cursor:crosshair;}
  aside{flex:0 1 280px;min-width:240px;display:flex;flex-direction:column;gap:10px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;}
  .card h2{font-size:14px;margin-bottom:8px;color:var(--muted);}
  .ctl{display:block;margin:8px 0;}
  .ctl span{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:2px;}
  .ctl input[type=range]{width:100%;}
  .hint{font-size:12px;color:var(--muted);line-height:1.7;}
  #fatal{display:none;padding:24px;text-align:center;color:var(--danger);font-size:15px;line-height:1.8;}
  footer{padding:8px 14px;font-size:12px;color:var(--muted);}
  @media (max-width:760px){#fluid{height:420px;}aside{flex:1 1 100%;min-width:0;}}
</style>
</head>
<body>
<header>
  <h1>彩色流体实验台</h1>
  <div id="status">就绪：在画面中拖动以注入颜色与动量</div>
</header>
<main>
  <div id="fluidWrap">
    <canvas id="fluid"></canvas>
    <div id="fatal"></div>
  </div>
  <aside>
    <div class="card">
      <h2>控制</h2>
      <label class="ctl"><span>染料颜色 <input type="color" id="dyeColor" value="#3fa7ff"></span></label>
      <label class="ctl"><span>注入力度 <b id="forceVal">6000</b></span><input type="range" id="force" min="500" max="15000" value="6000"></label>
      <label class="ctl"><span>染料消散 <b id="dissVal">0.20</b></span><input type="range" id="dissipation" min="0" max="100" value="20"></label>
      <label class="ctl"><span>压力迭代次数 <b id="iterVal">24</b></span><input type="range" id="iterations" min="4" max="60" value="24"></label>
      <label class="ctl"><span>模拟分辨率 <b id="resVal">128</b></span>
        <select id="simRes" style="width:100%">
          <option value="64">64（流畅）</option>
          <option value="128" selected>128（默认）</option>
          <option value="192">192（细腻）</option>
          <option value="256">256（高精度）</option>
        </select>
      </label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
        <button id="pauseBtn" class="primary">暂停</button>
        <button id="clearBtn">清空</button>
        <button id="resetBtn" class="warn">重置参数</button>
        <button id="shotBtn">PNG 截图</button>
      </div>
    </div>
    <div class="card hint">
      说明：本实验台使用 WebGL 在 GPU 上实时求解二维不可压缩流体（平流 → 散度 → 压力雅克比迭代 → 速度投影），染料随速度场演化，不是粒子轨迹或渐隐画布。拖动的方向与速度会影响流动；修改参数会真实影响计算。暂停后画面停止演化；清空移除已有流体；改变模拟分辨率会释放并重建 GPU 纹理。
    </div>
    <div class="card hint">
      性能保护：设备像素比限制为 2，染料分辨率限制为 512。若浏览器不支持 WebGL2 浮点渲染目标，会在此提示而不是显示空白页面。
    </div>
  </aside>
</main>
<footer>纯静态单文件 · 无网络依赖 · 支持鼠标与多点触摸</footer>
<script>
(function(){
"use strict";
var canvas=document.getElementById('fluid');
var statusEl=document.getElementById('status');
var fatalEl=document.getElementById('fatal');

function setStatus(msg, cls){ statusEl.textContent=msg; statusEl.className=cls||''; }
function fatal(msg){
  canvas.style.display='none';
  fatalEl.style.display='block';
  fatalEl.innerHTML='⚠ '+msg+'<br><span style="color:#8b94a3;font-size:13px">请更换支持 WebGL2 的现代浏览器（Chrome / Edge / Firefox / Safari 16+）后重试。</span>';
  statusEl.textContent='无法运行：'+msg;
  statusEl.className='err';
}

var gl=canvas.getContext('webgl2',{alpha:false,depth:false,stencil:false,antialias:false,preserveDrawingBuffer:true});
if(!gl){ fatal('当前浏览器不支持 WebGL2，流体模拟需要 GPU 浮点纹理。'); return; }
var extCBF=gl.getExtension('EXT_color_buffer_float');
if(!extCBF){ fatal('当前环境不支持浮点渲染目标（EXT_color_buffer_float）。'); return; }
var extLinear=gl.getExtension('OES_texture_float_linear');
var FILTER=extLinear? gl.LINEAR : gl.NEAREST;

/* ---------- 参数 ---------- */
var params={force:6000, dissipation:0.2, iterations:24, simRes:128, dyeRes:512};
var paused=false;
var dyeColor={r:0.25,g:0.65,b:1.0};

/* ---------- 着色器 ---------- */
var VERT=`
precision highp float;
attribute vec2 aPos;
varying vec2 vUv, vL, vR, vT, vB;
uniform vec2 texelSize;
void main(){
  vUv=aPos*0.5+0.5;
  vL=vUv-vec2(texelSize.x,0.0); vR=vUv+vec2(texelSize.x,0.0);
  vT=vUv+vec2(0.0,texelSize.y); vB=vUv-vec2(0.0,texelSize.y);
  gl_Position=vec4(aPos,0.0,1.0);
}`;
var FRAG={
splat:`
precision highp float;
varying vec2 vUv;
uniform sampler2D uTarget;
uniform float aspectRatio, radius;
uniform vec3 color;
uniform vec2 point;
void main(){
  vec2 p=vUv-point;
  p.x*=aspectRatio;
  vec3 s=exp(-dot(p,p)/radius)*color;
  gl_FragColor=vec4(texture2D(uTarget,vUv).xyz+s,1.0);
}`,
advection:`
precision highp float;
varying vec2 vUv;
uniform sampler2D uVelocity, uSource;
uniform vec2 texelSize;
uniform float dt, dissipation;
void main(){
  vec2 coord=vUv-dt*texture2D(uVelocity,vUv).xy*texelSize;
  gl_FragColor=dissipation*texture2D(uSource,coord);
  gl_FragColor.a=1.0;
}`,
divergence:`
precision highp float;
varying vec2 vUv, vL, vR, vT, vB;
uniform sampler2D uVelocity;
void main(){
  float L=texture2D(uVelocity,vL).x, R=texture2D(uVelocity,vR).x;
  float T=texture2D(uVelocity,vT).y, B=texture2D(uVelocity,vB).y;
  vec2 C=texture2D(uVelocity,vUv).xy;
  if(vL.x<0.0){L=-C.x;} if(vR.x>1.0){R=-C.x;}
  if(vT.y>1.0){T=-C.y;} if(vB.y<0.0){B=-C.y;}
  gl_FragColor=vec4(0.5*(R-L+T-B),0.0,0.0,1.0);
}`,
pressure:`
precision highp float;
varying vec2 vUv, vL, vR, vT, vB;
uniform sampler2D uPressure, uDivergence;
void main(){
  float L=texture2D(uPressure,vL).x, R=texture2D(uPressure,vR).x;
  float T=texture2D(uPressure,vT).x, B=texture2D(uPressure,vB).x;
  float div=texture2D(uDivergence,vUv).x;
  gl_FragColor=vec4((L+R+B+T-div)*0.25,0.0,0.0,1.0);
}`,
gradient:`
precision highp float;
varying vec2 vUv, vL, vR, vT, vB;
uniform sampler2D uPressure, uVelocity;
void main(){
  float L=texture2D(uPressure,vL).x, R=texture2D(uPressure,vR).x;
  float T=texture2D(uPressure,vT).x, B=texture2D(uPressure,vB).x;
  vec2 vel=texture2D(uVelocity,vUv).xy-vec2(R-L,T-B)*0.5;
  gl_FragColor=vec4(vel,0.0,1.0);
}`,
display:`
precision highp float;
varying vec2 vUv;
uniform sampler2D uTexture;
void main(){
  vec3 c=texture2D(uTexture,vUv).rgb;
  gl_FragColor=vec4(c,1.0);
}`};

function compile(type,src){
  var s=gl.createShader(type);
  gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
var vertShader=compile(gl.VERTEX_SHADER,VERT);
function createProgram(fragSrc){
  var p=gl.createProgram();
  gl.attachShader(p,vertShader);
  gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fragSrc));
  gl.bindAttribLocation(p,0,'aPos');
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  var uniforms={};
  var n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(var i=0;i<n;i++){ var u=gl.getActiveUniform(p,i); uniforms[u.name]=gl.getUniformLocation(p,u.name); }
  return {prog:p, u:uniforms};
}
var programs={};
try{
  for(var key in FRAG) programs[key]=createProgram(FRAG[key]);
}catch(err){ fatal('着色器编译失败：'+err.message); return; }

/* ---------- 几何 ---------- */
var quad=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,quad);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
function blit(target){
  if(target){
    gl.viewport(0,0,target.w,target.h);
    gl.bindFramebuffer(gl.FRAMEBUFFER,target.fbo);
  }else{
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  }
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

/* ---------- FBO ---------- */
function createFBO(w,h,type,filter){
  var tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,filter);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,filter);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,type===gl.FLOAT?gl.RGBA16F:gl.RGBA16F,w,h,0,gl.RGBA,type,null);
  var fbo=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.viewport(0,0,w,h);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  return {tex:tex,fbo:fbo,w:w,h:h,attach:function(unit){
    gl.activeTexture(gl.TEXTURE0+unit);
    gl.bindTexture(gl.TEXTURE_2D,tex);
    return unit;
  }};
}
function deleteFBO(f){ if(f){ gl.deleteTexture(f.tex); gl.deleteFramebuffer(f.fbo); } }
function createDouble(w,h,type,filter){
  return {read:createFBO(w,h,type,filter), write:createFBO(w,h,type,filter),
    swap:function(){var t=this.read;this.read=this.write;this.write=t;}};
}
function deleteDouble(d){ if(d){deleteFBO(d.read);deleteFBO(d.write);} }

var velocity,dye,pressure,divergence;
function initFBOs(){
  // 重建前正确释放旧 GPU 资源
  deleteDouble(velocity); deleteDouble(dye); deleteDouble(pressure); deleteFBO(divergence);
  var sim=params.simRes, dyeRes=params.dyeRes;
  velocity=createDouble(sim,sim,gl.FLOAT,FILTER);
  dye=createDouble(dyeRes,dyeRes,gl.FLOAT,FILTER);
  pressure=createDouble(sim,sim,gl.FLOAT,gl.NEAREST);
  divergence=createFBO(sim,sim,gl.FLOAT,gl.NEAREST);
}

/* ---------- 模拟步 ---------- */
function splat(x,y,dx,dy,color){
  var p=programs.splat;
  gl.useProgram(p.prog);
  gl.uniform1i(p.u.uTarget,velocity.read.attach(0));
  gl.uniform1f(p.u.aspectRatio,canvas.width/canvas.height);
  gl.uniform2f(p.u.point,x,y);
  gl.uniform3f(p.u.color,dx,dy,0);
  gl.uniform1f(p.u.radius,0.0035);
  blit(velocity.write); velocity.swap();
  gl.uniform1i(p.u.uTarget,dye.read.attach(0));
  gl.uniform3f(p.u.color,color.r,color.g,color.b);
  blit(dye.write); dye.swap();
}
function step(dt){
  gl.disable(gl.BLEND);
  var p;
  // 平流速度
  p=programs.advection;
  gl.useProgram(p.prog);
  gl.uniform2f(p.u.texelSize,1/velocity.read.w,1/velocity.read.h);
  gl.uniform1i(p.u.uVelocity,velocity.read.attach(0));
  gl.uniform1i(p.u.uSource,velocity.read.attach(0));
  gl.uniform1f(p.u.dt,dt);
  gl.uniform1f(p.u.dissipation,0.998);
  blit(velocity.write); velocity.swap();
  // 平流染料
  gl.uniform2f(p.u.texelSize,1/velocity.read.w,1/velocity.read.h);
  gl.uniform1i(p.u.uVelocity,velocity.read.attach(0));
  gl.uniform1i(p.u.uSource,dye.read.attach(1));
  gl.uniform1f(p.u.dissipation,1.0-params.dissipation*dt*2.0);
  blit(dye.write); dye.swap();
  // 散度
  p=programs.divergence;
  gl.useProgram(p.prog);
  gl.uniform2f(p.u.texelSize,1/velocity.read.w,1/velocity.read.h);
  gl.uniform1i(p.u.uVelocity,velocity.read.attach(0));
  blit(divergence);
  // 压力迭代
  p=programs.pressure;
  gl.useProgram(p.prog);
  gl.uniform2f(p.u.texelSize,1/velocity.read.w,1/velocity.read.h);
  gl.uniform1i(p.u.uDivergence,divergence.attach(0));
  // 压力清零
  gl.bindFramebuffer(gl.FRAMEBUFFER,pressure.read.fbo);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  for(var i=0;i<params.iterations;i++){
    gl.uniform1i(p.u.uPressure,pressure.read.attach(1));
    blit(pressure.write); pressure.swap();
  }
  // 速度投影
  p=programs.gradient;
  gl.useProgram(p.prog);
  gl.uniform2f(p.u.texelSize,1/velocity.read.w,1/velocity.read.h);
  gl.uniform1i(p.u.uPressure,pressure.read.attach(0));
  gl.uniform1i(p.u.uVelocity,velocity.read.attach(1));
  blit(velocity.write); velocity.swap();
}
function render(){
  var p=programs.display;
  gl.useProgram(p.prog);
  gl.uniform1i(p.u.uTexture,dye.read.attach(0));
  blit(null);
}

/* ---------- 主循环 ---------- */
var lastTime=performance.now();
var needFrame=true;
function frame(){
  var now=performance.now();
  var dt=Math.min((now-lastTime)/1000,1/30);
  lastTime=now;
  if(!paused){
    step(dt);
  }
  render();
  requestAnimationFrame(frame);
}

/* ---------- 指针交互 ---------- */
var pointers=new Map();
function evtUv(e){
  var r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width, y:1-(e.clientY-r.top)/r.height};
}
canvas.addEventListener('pointerdown',function(e){
  canvas.setPointerCapture(e.pointerId);
  var uv=evtUv(e);
  pointers.set(e.pointerId,uv);
  splat(uv.x,uv.y,0,0,scaledColor(1.2));
});
canvas.addEventListener('pointermove',function(e){
  if(!pointers.has(e.pointerId))return;
  var prev=pointers.get(e.pointerId);
  var uv=evtUv(e);
  pointers.set(e.pointerId,uv);
  var dx=uv.x-prev.x, dy=uv.y-prev.y;
  if(Math.abs(dx)<1e-6&&Math.abs(dy)<1e-6)return;
  splat(uv.x,uv.y, dx*params.force, dy*params.force, scaledColor(0.6));
});
function drop(e){ pointers.delete(e.pointerId); }
canvas.addEventListener('pointerup',drop);
canvas.addEventListener('pointercancel',drop);
function scaledColor(k){
  return {r:dyeColor.r*k*0.3, g:dyeColor.g*k*0.3, b:dyeColor.b*k*0.3};
}

/* ---------- 控件 ---------- */
function bindRange(id,key,fmt,display){
  var el=document.getElementById(id);
  el.addEventListener('input',function(){
    params[key]=parseFloat(el.value);
    if(display) document.getElementById(display).textContent=fmt(params[key]);
  });
}
bindRange('force','force',function(v){return v.toFixed(0);},'forceVal');
document.getElementById('dissipation').addEventListener('input',function(){
  params.dissipation=parseFloat(this.value)/100;
  document.getElementById('dissVal').textContent=params.dissipation.toFixed(2);
});
document.getElementById('iterations').addEventListener('input',function(){
  params.iterations=parseInt(this.value,10);
  document.getElementById('iterVal').textContent=this.value;
});
document.getElementById('dyeColor').addEventListener('input',function(){
  var hex=this.value;
  dyeColor={r:parseInt(hex.slice(1,3),16)/255, g:parseInt(hex.slice(3,5),16)/255, b:parseInt(hex.slice(5,7),16)/255};
});
document.getElementById('simRes').addEventListener('change',function(){
  params.simRes=parseInt(this.value,10);
  document.getElementById('resVal').textContent=this.value;
  initFBOs();
  setStatus('已按新分辨率重建模拟纹理（旧资源已释放）','');
});
document.getElementById('pauseBtn').addEventListener('click',function(){
  paused=!paused;
  this.textContent=paused?'继续':'暂停';
  setStatus(paused?'已暂停：画面停止演化':'继续模拟','');
});
document.getElementById('clearBtn').addEventListener('click',function(){
  initFBOs();
  setStatus('已清空流体内容','');
});
document.getElementById('resetBtn').addEventListener('click',function(){
  params={force:6000,dissipation:0.2,iterations:24,simRes:128,dyeRes:512};
  dyeColor={r:0.25,g:0.65,b:1.0};
  document.getElementById('force').value=6000; document.getElementById('forceVal').textContent='6000';
  document.getElementById('dissipation').value=20; document.getElementById('dissVal').textContent='0.20';
  document.getElementById('iterations').value=24; document.getElementById('iterVal').textContent='24';
  document.getElementById('simRes').value='128'; document.getElementById('resVal').textContent='128';
  document.getElementById('dyeColor').value='#3fa7ff';
  initFBOs();
  setStatus('参数已重置为默认值','');
});
document.getElementById('shotBtn').addEventListener('click',function(){
  render(); // 确保缓冲为最新
  var a=document.createElement('a');
  a.download='fluid-'+Date.now()+'.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
  setStatus('已导出 PNG 截图','');
});

/* ---------- 尺寸 ---------- */
function resize(){
  var r=canvas.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2); // 限制设备像素比
  canvas.width=Math.max(1,Math.round(r.width*dpr));
  canvas.height=Math.max(1,Math.round(r.height*dpr));
}
if(window.ResizeObserver){ new ResizeObserver(resize).observe(canvas); }
window.addEventListener('resize',resize);

/* ---------- 启动 ---------- */
resize();
initFBOs();
// 首屏注入几股彩色流体，证明模拟在实时运行
for(var i=0;i<6;i++){
  var ang=i/6*Math.PI*2;
  splat(0.5+Math.cos(ang)*0.2, 0.5+Math.sin(ang)*0.2,
    Math.cos(ang+1.5)*1600, Math.sin(ang+1.5)*1600,
    {r:0.1+0.25*Math.random(), g:0.2+0.3*Math.random(), b:0.4+0.4*Math.random()});
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
