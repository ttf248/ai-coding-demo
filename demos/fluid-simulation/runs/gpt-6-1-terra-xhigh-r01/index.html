<!doctype html><html lang="zh-CN"><head><script src="../../../../assets/analytics.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>彩色流体实验台</title><style>*{box-sizing:border-box}body{margin:0;background:#0b101a;color:#e3edf6;font:14px/1.5 system-ui,sans-serif}main{max-width:1300px;margin:auto;padding:22px}h1{font-size:clamp(26px,4vw,40px);margin:0}p{color:#9cabbf}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px}.panel{background:#151f2e;border:1px solid #293b51;border-radius:14px;padding:16px}label{display:block;margin:15px 0 5px}input[type=range],select{width:100%}input[type=range]{accent-color:#74d7d7}input[type=color]{border:0;background:none;height:35px;width:60px}select,button{background:#243a50;color:#ecf8ff;border:1px solid #426079;border-radius:7px;padding:8px;font:inherit}button{cursor:pointer;margin:4px 3px 0 0}canvas{display:block;width:100%;height:min(68vh,680px);min-height:320px;background:#0a111b;border-radius:10px;touch-action:none}.status{color:#f9ce89;min-height:24px;font-size:13px}.hint{font-size:13px}@media(max-width:700px){main{padding:12px}.layout{grid-template-columns:1fr}.panel{padding:12px}canvas{height:55vh}}</style></head><body><main><small>GPU FLUID / 01</small><h1>彩色流体实验台</h1><p>拖动画布，将颜色与动量注入流场。</p><div class="layout"><aside class="panel"><label>染料颜色 <input id="color" type="color" value="#53d9cf"></label><label>注入力度 <span id="forceVal"></span><input id="force" type="range" min="1" max="20" value="8"></label><label>染料消散 <span id="fadeVal"></span><input id="fade" type="range" min="0" max="100" value="15"></label><label>压力迭代次数 <span id="iterationsVal"></span><input id="iterations" type="range" min="4" max="40" value="20"></label><label>模拟分辨率 <select id="resolution"><option value="96">96 · 轻量</option><option value="160" selected>160 · 标准</option><option value="256">256 · 精细</option></select></label><div><button id="pause">暂停</button><button id="clear">清空</button><button id="reset">重置参数</button><button id="save">PNG 截图</button></div><p class="hint">使用 WebGL2 实时求解平流、散度、压力和速度投影。调整分辨率会清空当前流体；暂停时可继续编辑参数。</p><p id="status" class="status" aria-live="polite"></p></aside><section class="panel"><canvas id="canvas" aria-label="流体画布"></canvas><p class="hint">鼠标或手指拖动以混合颜色。为了节约资源，画布像素比与计算网格均有限制。</p></section></div></main><script>
const $=id=>document.getElementById(id),canvas=$('canvas'),gl=canvas.getContext('webgl2',{preserveDrawingBuffer:true,alpha:false,antialias:false});let running=true,ready=false,targets=[],velocity,dye,pressure,divergence,programs={},w=0,h=0,last=0,drag=null;
if(!gl||!gl.getExtension('EXT_color_buffer_float')){$('status').textContent='当前浏览器不支持 WebGL2 浮点纹理渲染，无法运行流体模拟。';}else{try{init();ready=true;resize();requestAnimationFrame(frame)}catch(e){$('status').textContent='WebGL 初始化失败：'+e.message;}}
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}function program(body){let v=shader(gl.VERTEX_SHADER,`#version 300 es\nin vec2 position;out vec2 uv;void main(){uv=position*.5+.5;gl_Position=vec4(position,0.,1.);}`),f=shader(gl.FRAGMENT_SHADER,`#version 300 es\nprecision highp float;in vec2 uv;out vec4 outColor;uniform sampler2D src,vel,aux;uniform vec2 texel,point,impulse;uniform vec3 color;uniform float dt,dissipation,radius;${body}`),p=gl.createProgram();gl.attachShader(p,v);gl.attachShader(p,f);gl.bindAttribLocation(p,0,'position');gl.linkProgram(p);gl.deleteShader(v);gl.deleteShader(f);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p}
function init(){let buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);programs.advect=program(`void main(){vec2 v=texture(vel,uv).xy;vec2 p=clamp(uv-dt*v,texel*.5,vec2(1.)-texel*.5);outColor=texture(src,p)*dissipation;}`);programs.div=program(`void main(){float l=texture(vel,uv-vec2(texel.x,0)).x,r=texture(vel,uv+vec2(texel.x,0)).x,b=texture(vel,uv-vec2(0,texel.y)).y,t=texture(vel,uv+vec2(0,texel.y)).y;outColor=vec4(.5*(r-l+t-b),0,0,1);}`);programs.pressure=program(`void main(){float l=texture(src,uv-vec2(texel.x,0)).x,r=texture(src,uv+vec2(texel.x,0)).x,b=texture(src,uv-vec2(0,texel.y)).x,t=texture(src,uv+vec2(0,texel.y)).x,d=texture(aux,uv).x;outColor=vec4((l+r+b+t-d)*.25,0,0,1);}`);programs.project=program(`void main(){float l=texture(aux,uv-vec2(texel.x,0)).x,r=texture(aux,uv+vec2(texel.x,0)).x,b=texture(aux,uv-vec2(0,texel.y)).x,t=texture(aux,uv+vec2(0,texel.y)).x;vec2 v=texture(src,uv).xy-.5*vec2(r-l,t-b);outColor=vec4(v,0,1);}`);programs.splat=program(`void main(){vec2 d=uv-point;d.x*=float(textureSize(src,0).x)/float(textureSize(src,0).y);float f=exp(-dot(d,d)/radius);outColor=texture(src,uv)+vec4(color*f,0);}`);programs.display=program(`void main(){vec3 c=texture(src,uv).rgb;outColor=vec4(1.-exp(-max(c,0.)*1.3),1.);}`)}
function target(){let t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,w,h,0,gl.RGBA,gl.FLOAT,null);let f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('浮点纹理帧缓冲不可用');gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);let o={t,f};targets.push(o);return o}function pair(){return{a:target(),b:target(),swap(){[this.a,this.b]=[this.b,this.a]}}}function rebuild(){for(let o of targets){gl.deleteTexture(o.t);gl.deleteFramebuffer(o.f)}targets=[];let res=Number($('resolution').value),r=canvas.clientWidth/canvas.clientHeight;w=r>1?Math.round(res*r):res;h=r>1?res:Math.round(res/r);w=Math.min(w,512);h=Math.min(h,512);velocity=pair();dye=pair();pressure=pair();divergence=target()}
function resize(){if(!ready)return;let d=Math.min(devicePixelRatio||1,2),cw=Math.max(1,Math.round(canvas.clientWidth*d)),ch=Math.max(1,Math.round(canvas.clientHeight*d));if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch;rebuild();draw()}}function pass(name,out,inputs={},uniforms={}){let p=programs[name];gl.useProgram(p);gl.bindFramebuffer(gl.FRAMEBUFFER,out?out.f:null);gl.viewport(0,0,out?w:canvas.width,out?h:canvas.height);let unit=0;for(let [key,obj] of Object.entries(inputs)){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,obj.t);gl.uniform1i(gl.getUniformLocation(p,key),unit++)}gl.uniform2f(gl.getUniformLocation(p,'texel'),1/w,1/h);for(let [key,val] of Object.entries(uniforms)){let loc=gl.getUniformLocation(p,key);if(Array.isArray(val)){if(val.length===2)gl.uniform2f(loc,...val);else gl.uniform3f(loc,...val)}else gl.uniform1f(loc,val)}gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}function draw(){pass('display',null,{src:dye.a})}function step(dt){pass('advect',velocity.b,{src:velocity.a,vel:velocity.a},{dt,dissipation:.995});velocity.swap();pass('div',divergence,{vel:velocity.a});for(let i=0;i<Number($('iterations').value);i++){pass('pressure',pressure.b,{src:pressure.a,aux:divergence});pressure.swap()}pass('project',velocity.b,{src:velocity.a,aux:pressure.a});velocity.swap();pass('advect',dye.b,{src:dye.a,vel:velocity.a},{dt,dissipation:Math.exp(-Number($('fade').value)*dt/100)});dye.swap()}function frame(t){if(!ready)return;let dt=Math.min(.033,(t-last)/1000||.016);last=t;if(running){step(dt);draw()}requestAnimationFrame(frame)}function splat(e,prev){let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=1-(e.clientY-r.top)/r.height,dx=(e.clientX-prev.x)/r.width,dy=-(e.clientY-prev.y)/r.height,f=Number($('force').value),hex=$('color').value,c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255);pass('splat',velocity.b,{src:velocity.a},{point:[x,y],color:[dx*f,dy*f,0],radius:.0018});velocity.swap();pass('splat',dye.b,{src:dye.a},{point:[x,y],color:c,radius:.002});dye.swap();draw()}
canvas.onpointerdown=e=>{if(!ready)return;canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY};splat(e,drag)};canvas.onpointermove=e=>{if(!drag||!ready)return;splat(e,drag);drag={x:e.clientX,y:e.clientY}};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;$('pause').onclick=()=>{running=!running;$('pause').textContent=running?'暂停':'继续'};$('clear').onclick=()=>{if(ready){rebuild();draw()}};$('resolution').onchange=()=>{if(ready){rebuild();draw()}};$('reset').onclick=()=>{$('force').value=8;$('fade').value=15;$('iterations').value=20;$('resolution').value=160;$('color').value='#53d9cf';labels();if(ready){rebuild();draw()}};$('save').onclick=()=>{if(!ready)return;draw();let a=document.createElement('a');a.download='fluid.png';a.href=canvas.toDataURL('image/png');a.click()};function labels(){for(let id of ['force','fade','iterations'])$(id+'Val').textContent=$(id).value}for(let id of ['force','fade','iterations'])$(id).oninput=labels;labels();window.addEventListener('resize',resize);
</script></body></html>
