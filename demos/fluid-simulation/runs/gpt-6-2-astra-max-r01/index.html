<!doctype html>
<html lang="zh-CN"><head>
<script src="../../../../assets/analytics.js" defer></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>流体色场</title><style>
:root{--ink:#e3edf3;--paper:#10161d;--panel:#19222c;--line:#34424b;--accent:#9be0dc;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,"Segoe UI","Microsoft YaHei",sans-serif}main,header>div{width:min(1344px,94%);margin:auto}header{border-bottom:1px solid var(--line)}header>div,.row,.bar,.readout{display:flex;align-items:center;gap:10px}header>div{height:57px;justify-content:space-between}header strong{display:flex;align-items:center;gap:9px;font-size:15px}.mark{width:20px;height:20px;background:var(--accent);border-radius:4px;display:inline-grid;place-items:center;color:var(--paper);font:bold 14px monospace}.mono,.eyebrow,output,.metrics b{font-family:"IBM Plex Mono",Consolas,monospace;font-variant-numeric:tabular-nums}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:700}.intro{display:flex;align-items:end;justify-content:space-between;gap:18px;padding:30px 0 23px}.intro h1{font-size:clamp(31px,4vw,52px);line-height:1.14;letter-spacing:-.045em;margin:5px 0 8px}.intro p,.hint{color:color-mix(in srgb,var(--ink) 70%,var(--paper));margin:0;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 283px;gap:16px;align-items:start}.stage,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;min-width:0}.panel{padding:19px}.panel h2,.bar h2{font-size:15px;letter-spacing:.01em;margin:0}.panel h3{font-size:13px;margin:16px 0 8px}.panel section+section{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.bar{padding:12px 16px;justify-content:space-between;border-bottom:1px solid var(--line);flex-wrap:wrap}.bar small{opacity:.72}.bar.foot{border-bottom:0;border-top:1px solid var(--line)}.row{flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}button,select,input{font:inherit;color:inherit}button,select,input[type=text],input[type=number]{border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:8px 11px;font-size:13px;min-height:37px}button{cursor:pointer;font-weight:600}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.45;cursor:default}button.primary,button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#11162b}.field{display:grid;gap:5px;margin:12px 0}.field>span{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600}input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0}.metrics{padding:12px 17px;display:flex;gap:23px;flex-wrap:wrap}.metrics span{font-size:12px}.metrics b{display:block;font-size:21px}.legend{display:flex;flex-wrap:wrap;gap:6px 15px;font-size:12px}.key{display:inline-block;vertical-align:middle;width:10px;height:10px;margin-right:5px;border-radius:2px}.work{width:100%;display:block;touch-action:none}.below{margin:14px 0 30px}select,input{max-width:100%}dialog{color:var(--ink)}@media(max-width:840px){.layout{grid-template-columns:minmax(0,1fr) 236px}.panel{padding:13px}}@media(max-width:720px){main,header>div{width:min(94%,560px)}.layout{grid-template-columns:minmax(0,1fr)}.intro{padding:17px 0 15px;align-items:start;flex-wrap:wrap}.intro h1{font-size:34px}.panel{padding:16px}.metrics{gap:14px}.bar{padding:9px 12px}header>div{height:46px}}.viewport{position:relative;background:#080d18}.viewport canvas{height:clamp(310px,42vw,585px)}#error{position:absolute;inset:15% 8% auto;background:#283544;padding:22px;border-radius:10px}.swatches{margin-top:12px}.swatches button{width:28px;height:28px;min-height:28px;padding:0;border-radius:50%;border:3px solid var(--panel)}.swatches button[aria-pressed=true]{outline:1px solid #fff}#pick{width:35px;height:24px;background:transparent;border:0}#state{font-size:13px}
</style></head><body><header><div><strong><i class="mark" aria-hidden="true">∿</i>流体研究所</strong><span class="eyebrow">FLUID DYNAMICS</span></div></header><main><div class="intro"><div><h1>流体色场</h1><p>拖动注入染料和动量，在二维速度场中观察混色与涡流。</p></div><div class="row"><button id="reset">重置参数</button><button id="save" class="primary">保存 PNG ↓</button></div></div><div class="layout"><article class="stage"><div class="bar"><h2>模拟视窗</h2><small id="info" class="mono"></small></div><div class="viewport"><canvas id="fluid" class="work" aria-label="流体模拟画布"></canvas><div id="error" role="alert" hidden></div></div><div class="bar foot"><span id="state" role="status">初始化 GPU</span><div class="row"><button id="pause">暂停</button><button id="clear">清空</button></div></div></article><aside class="panel"><section><h2>注入染料</h2><div class="row swatches" id="colors"></div><label class="field"><span>自选颜色 <input id="pick" type="color" value="#1bdaef"></span></label><label class="field"><span>注入力度 <output id="forceOut"></output></span><input id="force" type="range" min="10" max="100" value="58"></label></section>
<section><h2>求解参数</h2><label class="field"><span>每秒染料消散 <output id="decayOut"></output></span><input id="decay" type="range" min="0" max="95" value="12"></label><label class="field"><span>压力迭代 <output id="iterationsOut"></output></span><input id="iterations" type="range" min="4" max="48" step="2" value="18"></label><label class="field"><span>模拟分辨率 · 短边</span><select id="resolution"><option>64</option><option selected>128</option><option>192</option><option>256</option></select></label></section><section><p class="hint">速度和染料分别平流，每步用压力投影校正散度。提高分辨率或迭代次数会增加 GPU 工作量。</p></section></aside></div><div class="below"></div></main><script>
"use strict";
const $=id=>document.getElementById(id);
const canvas=$('fluid'), gl=canvas.getContext('webgl2',{alpha:false,antialias:false,preserveDrawingBuffer:true});
let fields={},programs={},nx=0,ny=0,paused=false,ready=false,last=0,animation=0,active=null,points=[];
const vertex='#version 300 es\nout vec2 uv;void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));uv=p;gl_Position=vec4(p*2.-1.,0.,1.);}';
const header='#version 300 es\nprecision highp float;in vec2 uv;out vec4 frag;uniform sampler2D a,b;uniform vec2 cell,spot,impulse;uniform vec3 pigment;uniform float dt,fade,aspect,radius;\n';
const formulas={
  add:'vec2 d=uv-spot;d.x*=aspect;float w=exp(-dot(d,d)/radius);frag=vec4(texture(a,uv).xyz+w*pigment,1.);',
  advect:'vec2 back=clamp(uv-dt*texture(b,uv).xy*cell,cell*.5,1.-cell*.5);vec2 g=back/cell-.5;vec2 base=(floor(g)+.5)*cell;vec2 t=fract(g);vec3 lo=mix(texture(a,base).xyz,texture(a,base+vec2(cell.x,0)).xyz,t.x);vec3 hi=mix(texture(a,base+vec2(0,cell.y)).xyz,texture(a,base+cell).xyz,t.x);frag=vec4(mix(lo,hi,t.y)*fade,1.);',
  div:'vec2 c=texture(a,uv).xy;float l=uv.x<cell.x?-c.x:texture(a,uv-vec2(cell.x,0)).x;float r=uv.x>1.-cell.x?-c.x:texture(a,uv+vec2(cell.x,0)).x;float d=uv.y<cell.y?-c.y:texture(a,uv-vec2(0,cell.y)).y;float u=uv.y>1.-cell.y?-c.y:texture(a,uv+vec2(0,cell.y)).y;frag=vec4(.5*(r-l+u-d),0,0,1);',
  curl:'float w=texture(a,uv+vec2(cell.x,0)).y-texture(a,uv-vec2(cell.x,0)).y-texture(a,uv+vec2(0,cell.y)).x+texture(a,uv-vec2(0,cell.y)).x;frag=vec4(.5*w,0,0,1);',
  confine:'float w=texture(b,uv).x;vec2 g=vec2(abs(texture(b,uv+vec2(cell.x,0)).x)-abs(texture(b,uv-vec2(cell.x,0)).x),abs(texture(b,uv+vec2(0,cell.y)).x)-abs(texture(b,uv-vec2(0,cell.y)).x));vec2 q=vec2(g.y,-g.x)/max(length(g),.001);frag=vec4(clamp(texture(a,uv).xy+q*w*dt*7.,-350.,350.),0,1);',
  pressure:'float p=texture(a,uv-vec2(cell.x,0)).x+texture(a,uv+vec2(cell.x,0)).x+texture(a,uv-vec2(0,cell.y)).x+texture(a,uv+vec2(0,cell.y)).x;frag=vec4((p-texture(b,uv).x)*.25,0,0,1);',
  project:'vec2 g=vec2(texture(b,uv+vec2(cell.x,0)).x-texture(b,uv-vec2(cell.x,0)).x,texture(b,uv+vec2(0,cell.y)).x-texture(b,uv-vec2(0,cell.y)).x);vec2 v=texture(a,uv).xy-g*.5;if(uv.x<cell.x||uv.x>1.-cell.x)v.x=0.;if(uv.y<cell.y||uv.y>1.-cell.y)v.y=0.;frag=vec4(v,0,1);',
  display:'vec2 g=uv/cell-.5,base=(floor(g)+.5)*cell,t=fract(g);vec3 low=mix(texture(a,base).rgb,texture(a,base+vec2(cell.x,0)).rgb,t.x),high=mix(texture(a,base+vec2(0,cell.y)).rgb,texture(a,base+cell).rgb,t.x);vec3 dye=max(vec3(0),mix(low,high,t.y));vec3 mapped=1.-exp(-dye*1.55);frag=vec4(vec3(.025,.042,.066)+pow(mapped,vec3(.82))*.94,1);'
};
function compile(kind,source){
  const shader=gl.createShader(kind);gl.shaderSource(shader,source);gl.compileShader(shader);
  if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)){const error=gl.getShaderInfoLog(shader);gl.deleteShader(shader);throw Error(error);}return shader;
}
function makeProgram(body){
  const p=gl.createProgram(),vs=compile(gl.VERTEX_SHADER,vertex),fs=compile(gl.FRAGMENT_SHADER,header+'void main(){'+body+'}');
  gl.attachShader(p,vs);gl.attachShader(p,fs);gl.linkProgram(p);gl.deleteShader(vs);gl.deleteShader(fs);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));
  const loc={};for(const k of ['a','b','cell','spot','pigment','dt','fade','aspect','radius'])loc[k]=gl.getUniformLocation(p,k);return {p,loc};
}
function target(){
  const tex=gl.createTexture(),fb=gl.createFramebuffer();gl.bindTexture(gl.TEXTURE_2D,tex);
  for(const key of [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,key,gl.NEAREST);
  for(const key of [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,key,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,nx,ny,0,gl.RGBA,gl.HALF_FLOAT,null);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE){gl.deleteTexture(tex);gl.deleteFramebuffer(fb);throw Error('设备不能渲染 RGBA16F 浮点纹理');}
  gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);return {tex,fb};
}
function release(){for(const pair of Object.values(fields))for(const f of pair){gl.deleteTexture(f.tex);gl.deleteFramebuffer(f.fb);}fields={};}
function pass(key,dst,a,b,uniforms={}){
  const {p,loc}=programs[key];gl.useProgram(p);
  for(const [i,f] of [a,b].entries()){gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,f?.tex??null);}
  gl.uniform1i(loc.a,0);gl.uniform1i(loc.b,1);gl.uniform2f(loc.cell,1/nx,1/ny);gl.uniform1f(loc.aspect,nx/ny);
  for(const [k,v] of Object.entries(uniforms)){if(Array.isArray(v)){if(v.length===2)gl.uniform2fv(loc[k],v);else gl.uniform3fv(loc[k],v);}else gl.uniform1f(loc[k],v);}
  gl.bindFramebuffer(gl.FRAMEBUFFER,dst?.fb??null);gl.viewport(0,0,dst?nx:canvas.width,dst?ny:canvas.height);gl.drawArrays(gl.TRIANGLES,0,3);
}
function advance(key,field,other,opts){const pair=fields[field];pass(key,pair[1],pair[0],other,opts);pair.reverse();}
function splat(x,y,vx,vy,color,radius=.0012){
  advance('add','v',null,{spot:[x,y],pigment:[vx,vy,0],radius});
  advance('add','dye',null,{spot:[x,y],pigment:color,radius});
}
const rgb=hex=>[1,3,5].map(i=>(parseInt(hex.slice(i,i+2),16)/255)**2);
function simulate(dt){
  advance('advect','v',fields.v[0],{dt,fade:Math.exp(-dt*.16)});
  pass('curl',fields.curl[0],fields.v[0]);advance('confine','v',fields.curl[0],{dt});
  pass('div',fields.div[0],fields.v[0]);
  for(let i=0;i<+$('iterations').value;i++)advance('pressure','p',fields.div[0]);
  advance('project','v',fields.p[0]);advance('advect','dye',fields.v[0],{dt,fade:Math.pow(1-+$('decay').value/100,dt)});
}
function render(){pass('display',null,fields.dye[0]);}
function seed(){
  for(let i=0;i<42;i++){
    const t=i/41,a=t*5.9+.5,x=.15+.7*t,y=.52+.20*Math.sin(a);
    const pigment=rgb(i<14?'#bd55ff':i<27?'#219dff':'#37edd9').map(c=>c*.86);
    splat(x,y,22+42*Math.cos(a*2),50*Math.cos(a),pigment,.00085);
    if(i%2===0)splat(x,.49-.15*Math.sin(a+.6),-24,48*Math.sin(a),rgb(i<20?'#f25283':'#ff9756').map(c=>c*.7),.00067);
  }
  simulate(.027);render();
}
function setupSize(seedNew=false){
  const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,1.6),aspect=r.width/r.height,size=+$('resolution').value;
  const sw=Math.min(512,Math.round(size*Math.max(1,aspect))),sh=Math.min(512,Math.round(size*Math.max(1,1/aspect)));
  canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));
  if(nx!==sw||ny!==sh||seedNew){release();nx=sw;ny=sh;for(const key of ['v','dye','p','div','curl']){fields[key]=[];for(let i=0;i<(['div','curl'].includes(key)?1:2);i++)fields[key].push(target());}seed();}
  $('info').textContent=nx+' × '+ny+' · WebGL 2';render();
}
function clear(){points=[];for(const pair of Object.values(fields))for(const f of pair){gl.bindFramebuffer(gl.FRAMEBUFFER,f.fb);gl.clear(gl.COLOR_BUFFER_BIT);}render();}
function tick(now){if(!ready)return;if(!paused){for(const p of points.splice(0))splat(...p);simulate(Math.min(.033,(now-last)/1000||.016));render();}last=now;animation=requestAnimationFrame(tick);}
function fail(msg){ready=false;cancelAnimationFrame(animation);$('error').hidden=false;$('error').textContent='无法启动 GPU 模拟。'+msg;$('state').textContent='GPU 不可用';for(const el of document.querySelectorAll('button,input,select'))el.disabled=true;}
function init(){try{if(!gl)throw Error('请在支持 WebGL 2 的浏览器中开启硬件加速后重试。');if(!gl.getExtension('EXT_color_buffer_float'))throw Error('缺少浮点颜色缓冲扩展 EXT_color_buffer_float。');
  programs=Object.fromEntries(Object.entries(formulas).map(([key,body])=>[key,makeProgram(body)]));setupSize();ready=true;$('state').textContent='实时计算中';animation=requestAnimationFrame(tick);
}catch(e){fail(e.message);}}
function pos(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)/r.width,1-(e.clientY-r.top)/r.height];}
canvas.onpointerdown=e=>{if(!ready||paused)return;active=pos(e);canvas.setPointerCapture(e.pointerId);points.push([...active,0,0,rgb($('pick').value)]);};
canvas.onpointermove=e=>{if(!active||paused)return;const q=pos(e),power=+$('force').value*50;points.push([...q,(q[0]-active[0])*power*nx/ny,(q[1]-active[1])*power,rgb($('pick').value)]);active=q;};canvas.onpointerup=canvas.onpointercancel=()=>active=null;
function sync(){for(const k of ['force','decay','iterations'])$(k+'Out').value=$(k).value+(k==='decay'?'%':'');for(const b of $('colors').children)b.setAttribute('aria-pressed',b.value===$('pick').value);}
for(const [v,n] of [['#1bdaef','青蓝'],['#9461ff','紫罗兰'],['#fe537f','玫红'],['#ffad59','琥珀'],['#54edb7','薄荷']]){const b=document.createElement('button');b.value=v;b.style.background=v;b.ariaLabel=n;b.onclick=()=>{$('pick').value=v;sync();};$('colors').append(b);}
for(const k of ['force','decay','iterations','pick'])$(k).oninput=sync;
$('pause').onclick=()=>{paused=!paused;points=[];active=null;$('pause').textContent=paused?'继续':'暂停';$('state').textContent=paused?'已暂停':'实时计算中';};
$('resolution').onchange=()=>setupSize(true);$('clear').onclick=clear;
$('reset').onclick=()=>{$('resolution').value=128;$('force').value=58;$('decay').value=12;$('iterations').value=18;$('pick').value='#1bdaef';sync();if(paused)$('pause').click();setupSize(true);};
$('save').onclick=()=>{render();canvas.toBlob(blob=>{const href=URL.createObjectURL(blob),a=document.createElement('a');a.href=href;a.download='流体色场.png';a.click();setTimeout(()=>URL.revokeObjectURL(href),2000);});};
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();fail('图形上下文已中断，刷新页面可重建。');});
let previousWidth=0,previousHeight=0;new ResizeObserver(()=>{const r=canvas.getBoundingClientRect();if(ready&&(r.width!==previousWidth||r.height!==previousHeight)){previousWidth=r.width;previousHeight=r.height;setupSize();}}).observe(canvas);
window.addEventListener('pagehide',e=>{if(e.persisted||!gl)return;ready=false;cancelAnimationFrame(animation);release();Object.values(programs).forEach(o=>gl.deleteProgram(o.p));});sync();init();
</script></body></html>
