<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101017" />
    <title>彩色流体实验台</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f2f1ff;
        --muted: #adabc4;
        --line: #38354c;
        --accent: #cec7ff;
        --panel: #1b1925;
        font:
          15px/1.55 "Microsoft YaHei",
          system-ui,
          sans-serif;
        background: #101017;
        color: var(--ink);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(ellipse at 24% 0%, #262039 0%, #101017 60%);
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      header,
      main {
        width: min(1350px, 100% - 48px);
        margin: auto;
      }
      header {
        padding: 25px 0 18px;
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 14px;
      }
      h1 {
        font-size: clamp(28px, 5vw, 49px);
        letter-spacing: -0.06em;
        line-height: 1.13;
      }
      header p,
      .help {
        color: var(--muted);
        font-size: 12px;
        margin-top: 8px;
      }
      #badge {
        font:
          12px ui-monospace,
          monospace;
        color: var(--accent);
        white-space: nowrap;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 247px;
        gap: 12px;
        align-items: start;
        padding-bottom: 32px;
      }
      .lab,
      aside {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
      }
      .lab {
        padding: 8px;
      }
      .stage {
        position: relative;
        overflow: hidden;
        border-radius: 7px;
        background: #0b0b14;
      }
      canvas {
        width: 100%;
        height: clamp(315px, 65vh, 690px);
        display: block;
        touch-action: none;
        cursor: crosshair;
      }
      .error {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 8px;
        text-align: center;
        padding: 24px;
        background: #101022c9;
      }
      [hidden] {
        display: none !important;
      }
      .error strong {
        color: #ffe1b5;
      }
      .canvas-footer {
        min-height: 38px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 4px 12px;
        padding: 3px 7px;
      }
      .canvas-footer p {
        font-size: 12px;
        color: var(--muted);
      }
      #status {
        color: var(--accent);
      }
      aside {
        padding: 13px;
        display: grid;
        gap: 15px;
      }
      h2 {
        font-size: 14px;
        margin-bottom: 5px;
      }
      .palette,
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      button,
      select,
      input {
        font: inherit;
      }
      button,
      select,
      input[type="color"] {
        color: inherit;
        border: 1px solid #494360;
        border-radius: 7px;
        background: #29263a;
        min-height: 39px;
        padding: 6px 9px;
      }
      button {
        cursor: pointer;
      }
      button:disabled,
      select:disabled,
      input:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button:hover:not(:disabled) {
        border-color: #c3b1ff;
      }
      button.action {
        background: #cec7ff;
        color: #201831;
        border-color: #cec7ff;
        font-weight: 650;
      }
      .swatch,
      input[type="color"] {
        width: 35px;
        height: 35px;
        padding: 4px;
        min-height: 35px;
      }
      .swatch::after {
        content: "";
        display: block;
        height: 18px;
        border-radius: 4px;
        background: var(--swatch);
      }
      .swatch[aria-pressed="true"] {
        border-color: #f6f0ff;
        box-shadow: 0 0 0 1px #f6f0ff inset;
      }
      label.setting {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 8px;
        font-size: 12px;
        margin-bottom: 7px;
      }
      label.setting input {
        grid-column: 1/-1;
        width: 100%;
        margin: 3px 0;
        accent-color: #c1b1ff;
      }
      output,
      .metric {
        font:
          12px ui-monospace,
          monospace;
        color: #d3caff;
      }
      #quality {
        width: 100%;
        margin-top: 5px;
      }
      :focus-visible {
        outline: 2px solid #cdc0ff;
        outline-offset: 2px;
      }
      @media (max-width: 760px) {
        header,
        main {
          width: calc(100% - 20px);
        }
        header {
          align-items: start;
          padding-top: 17px;
          gap: 8px;
        }
        main {
          grid-template-columns: minmax(0, 1fr);
        }
        .lab {
          padding: 5px;
        }
        canvas {
          height: clamp(260px, 50vh, 450px);
        }
        aside {
          gap: 12px;
        }
        #badge {
          padding-top: 5px;
        }
      }
    </style>
    <script src="../../../../assets/analytics.js" defer></script>
  </head>
  <body>
    <header>
      <div>
        <h1>彩色流体实验台</h1>
        <p>在二维速度场里注入颜料，观察压力、旋涡与混色。</p>
      </div>
      <span id="badge">WebGL 2</span>
    </header>
    <main>
      <section class="lab" aria-label="流体画布">
        <div class="stage">
          <canvas id="canvas" aria-label="拖动注入颜色和动量"></canvas>
          <div class="error" id="error" role="alert" hidden>
            <strong id="error-title">无法启动流体模拟</strong>
            <p id="error-detail"></p>
          </div>
        </div>
        <div class="canvas-footer">
          <p id="status" role="status">正在初始化 GPU</p>
          <p id="metrics" class="metric"></p>
        </div>
      </section>
      <aside aria-label="模拟设置">
        <section>
          <h2>染料颜色</h2>
          <div class="palette" id="palette">
            <button
              class="swatch"
              style="--swatch: #ff5098"
              data-color="#ff5098"
              aria-label="玫粉"
              aria-pressed="true"
            ></button>
            <button
              class="swatch"
              style="--swatch: #45e9da"
              data-color="#45e9da"
              aria-label="湖绿"
              aria-pressed="false"
            ></button>
            <button
              class="swatch"
              style="--swatch: #809aff"
              data-color="#809aff"
              aria-label="群青"
              aria-pressed="false"
            ></button>
            <button
              class="swatch"
              style="--swatch: #ffaf50"
              data-color="#ffaf50"
              aria-label="暖橙"
              aria-pressed="false"
            ></button>
            <input
              id="color"
              type="color"
              value="#ff5098"
              aria-label="自定义染料颜色"
            />
          </div>
        </section>
        <section>
          <h2>模拟参数</h2>
          <label class="setting"
            >注入力度 <output id="force-value"></output
            ><input
              type="range"
              id="force"
              min=".25"
              max="3.5"
              value="1.45"
              step=".05"
          /></label>
          <label class="setting"
            >染料消散 <output id="decay-value"></output
            ><input
              type="range"
              id="decay"
              min="0"
              max="2.4"
              value=".23"
              step=".01"
          /></label>
          <label class="setting"
            >压力迭代 <output id="iterations-value"></output
            ><input
              type="range"
              id="iterations"
              min="4"
              max="48"
              value="22"
              step="1"
          /></label>
          <label
            >模拟分辨率<select id="quality">
              <option value="72">低 · 72</option>
              <option value="104" selected>中 · 104</option>
              <option value="152">高 · 152</option>
            </select></label
          >
        </section>
        <section>
          <div class="buttons">
            <button class="action" id="pause">暂停</button
            ><button id="clear">清空</button><button id="reset">重置参数</button
            ><button id="capture">保存 PNG</button>
          </div>
          <p class="help">在画布上拖动以注入颜色和动量。暂停后可截图或清空。</p>
        </section>
      </aside>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const canvas = $("canvas");
      const gl = canvas.getContext("webgl2", {
        alpha: false,
        antialias: false,
        depth: false,
        stencil: false,
      });
      const controls = [
        ...document.querySelectorAll("aside button,aside select,aside input"),
      ];
      let gpu = null,
        fields = null,
        enabled = false,
        paused = false,
        frame = 0,
        last = 0;
      const splats = [],
        pointers = new Map();
      const defaults = {
        force: 1.45,
        decay: 0.23,
        iterations: 22,
        quality: 104,
        color: "#ff5098",
      };

      const vertex =
        "#version 300 es\n" +
        "out vec2 uv;void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));uv=p;gl_Position=vec4(p*2.-1.,0.,1.);}";
      const shaderHead =
        "#version 300 es\nprecision highp float;precision highp sampler2D;in vec2 uv;out vec4 frag;\n";
      const sampleLinear = `
    vec4 linearSample(sampler2D tex,vec2 point){
      vec2 size=vec2(textureSize(tex,0)), p=clamp(point*size-.5,vec2(0),size-1.);
      ivec2 a=ivec2(floor(p)), b=min(a+1,ivec2(size)-1);
      vec2 t=fract(p);
      return mix(mix(texelFetch(tex,a,0),texelFetch(tex,ivec2(b.x,a.y),0),t.x),
                 mix(texelFetch(tex,ivec2(a.x,b.y),0),texelFetch(tex,b,0),t.x),t.y);
    }
  `;
      const sources = {
        copy:
          sampleLinear +
          `uniform sampler2D uSource;uniform vec4 uScale;void main(){frag=linearSample(uSource,uv)*uScale;}`,
        splat: `
      uniform sampler2D uSource;uniform vec2 uPoint,uShape;uniform vec3 uValue;uniform float uRadius,uCeiling;
      void main(){
        vec2 p=(uv-uPoint)*uShape;
        vec3 next=texture(uSource,uv).xyz+exp(-dot(p,p)/(uRadius*uRadius))*uValue;
        frag=vec4(clamp(next,vec3(-uCeiling),vec3(uCeiling)),1.);
      }
    `,
        advect:
          sampleLinear +
          `
      uniform sampler2D uVelocity,uSource;uniform float uTime,uLoss;
      void main(){
        vec2 v=linearSample(uVelocity,uv).xy/vec2(textureSize(uVelocity,0));
        vec2 middle=uv-.5*uTime*v;
        vec2 v2=linearSample(uVelocity,middle).xy/vec2(textureSize(uVelocity,0));
        frag=linearSample(uSource,uv-uTime*v2)*exp(-uTime*uLoss);
      }
    `,
        curl: `
      uniform sampler2D uVelocity;
      void main(){
        vec2 s=1./vec2(textureSize(uVelocity,0));
        float l=texture(uVelocity,uv-vec2(s.x,0.)).y,r=texture(uVelocity,uv+vec2(s.x,0.)).y;
        float b=texture(uVelocity,uv-vec2(0.,s.y)).x,t=texture(uVelocity,uv+vec2(0.,s.y)).x;
        frag=vec4(.5*(r-l-t+b),0.,0.,1.);
      }
    `,
        vortex: `
      uniform sampler2D uVelocity,uCurl;uniform float uTime;
      void main(){
        vec2 s=1./vec2(textureSize(uVelocity,0));
        float l=abs(texture(uCurl,uv-vec2(s.x,0.)).x),r=abs(texture(uCurl,uv+vec2(s.x,0.)).x);
        float b=abs(texture(uCurl,uv-vec2(0.,s.y)).x),t=abs(texture(uCurl,uv+vec2(0.,s.y)).x);
        vec2 gradient=vec2(r-l,t-b);
        vec2 spin=vec2(gradient.y,-gradient.x)/(length(gradient)+.001)*texture(uCurl,uv).x;
        frag=vec4(clamp(texture(uVelocity,uv).xy+spin*20.*uTime,vec2(-480.),vec2(480.)),0.,1.);
      }
    `,
        divergence: `
      uniform sampler2D uVelocity;
      void main(){
        vec2 s=1./vec2(textureSize(uVelocity,0)), center=texture(uVelocity,uv).xy;
        float l=uv.x<s.x?-center.x:texture(uVelocity,uv-vec2(s.x,0.)).x;
        float r=uv.x>1.-s.x?-center.x:texture(uVelocity,uv+vec2(s.x,0.)).x;
        float b=uv.y<s.y?-center.y:texture(uVelocity,uv-vec2(0.,s.y)).y;
        float t=uv.y>1.-s.y?-center.y:texture(uVelocity,uv+vec2(0.,s.y)).y;
        frag=vec4(.5*(r-l+t-b),0.,0.,1.);
      }
    `,
        pressure: `
      uniform sampler2D uPressure,uDivergence;
      void main(){
        vec2 s=1./vec2(textureSize(uPressure,0));
        float l=texture(uPressure,uv-vec2(s.x,0.)).x,r=texture(uPressure,uv+vec2(s.x,0.)).x;
        float b=texture(uPressure,uv-vec2(0.,s.y)).x,t=texture(uPressure,uv+vec2(0.,s.y)).x;
        frag=vec4((l+r+b+t-texture(uDivergence,uv).x)*.25,0.,0.,1.);
      }
    `,
        project: `
      uniform sampler2D uVelocity,uPressure;
      void main(){
        vec2 s=1./vec2(textureSize(uPressure,0));
        float l=texture(uPressure,uv-vec2(s.x,0.)).x,r=texture(uPressure,uv+vec2(s.x,0.)).x;
        float b=texture(uPressure,uv-vec2(0.,s.y)).x,t=texture(uPressure,uv+vec2(0.,s.y)).x;
        vec2 v=texture(uVelocity,uv).xy-.5*vec2(r-l,t-b);
        if(uv.x<s.x||uv.x>1.-s.x)v.x=0.;
        if(uv.y<s.y||uv.y>1.-s.y)v.y=0.;
        frag=vec4(v,0.,1.);
      }
    `,
        show:
          sampleLinear +
          `
      uniform sampler2D uDye;
      void main(){
        vec3 dye=max(linearSample(uDye,uv).rgb,vec3(0.));
        vec3 col=1.-exp(-1.45*dye);
        vec3 base=mix(vec3(.020,.019,.038),vec3(.063,.047,.108),1.-clamp(length((uv-.5)*1.25),0.,1.));
        vec2 grid=abs(fract(gl_FragCoord.xy/28.)-.5);
        base+=vec3(.045,.036,.072)*step(.454,grid.x)*step(.454,grid.y);
        frag=vec4(base+pow(col,vec3(.92))*(1.-base),1.);
      }
    `,
      };

      function compile(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
        const error = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw Error(error);
      }
      function programs() {
        const result = {},
          vs = compile(gl.VERTEX_SHADER, vertex);
        try {
          for (const [name, source] of Object.entries(sources)) {
            const fs = compile(gl.FRAGMENT_SHADER, shaderHead + source),
              p = gl.createProgram();
            gl.attachShader(p, vs);
            gl.attachShader(p, fs);
            gl.linkProgram(p);
            gl.deleteShader(fs);
            if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
              const error = gl.getProgramInfoLog(p);
              gl.deleteProgram(p);
              throw Error(error);
            }
            const locations = {};
            for (
              let i = 0;
              i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
              i++
            ) {
              const { name } = gl.getActiveUniform(p, i);
              locations[name] = gl.getUniformLocation(p, name);
            }
            result[name] = { p, locations };
          }
          return result;
        } catch (error) {
          for (const { p } of Object.values(result)) gl.deleteProgram(p);
          throw error;
        } finally {
          gl.deleteShader(vs);
        }
      }
      function target(w, h) {
        const texture = gl.createTexture(),
          fbo = gl.createFramebuffer();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(
          gl.TEXTURE_2D,
          0,
          gl.RGBA16F,
          w,
          h,
          0,
          gl.RGBA,
          gl.HALF_FLOAT,
          null,
        );
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(
          gl.FRAMEBUFFER,
          gl.COLOR_ATTACHMENT0,
          gl.TEXTURE_2D,
          texture,
          0,
        );
        if (
          gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE
        ) {
          gl.deleteTexture(texture);
          gl.deleteFramebuffer(fbo);
          throw Error("无法创建半浮点颜色缓冲区。");
        }
        gl.viewport(0, 0, w, h);
        gl.clear(gl.COLOR_BUFFER_BIT);
        return { texture, fbo, w, h };
      }
      function dispose(field) {
        for (const { texture, fbo } of field?.allocated ?? []) {
          gl.deleteTexture(texture);
          gl.deleteFramebuffer(fbo);
        }
      }
      function pass(name, dest, textures = {}, values = {}) {
        const { p, locations } = gpu[name];
        gl.bindFramebuffer(gl.FRAMEBUFFER, dest?.fbo ?? null);
        gl.viewport(0, 0, dest?.w ?? canvas.width, dest?.h ?? canvas.height);
        gl.useProgram(p);
        let unit = 0;
        for (const [key, buffer] of Object.entries(textures)) {
          gl.activeTexture(gl.TEXTURE0 + unit);
          gl.bindTexture(gl.TEXTURE_2D, buffer.texture);
          gl.uniform1i(locations[key], unit++);
        }
        for (const [key, v] of Object.entries(values)) {
          if (Array.isArray(v))
            gl["uniform" + v.length + "fv"](locations[key], v);
          else gl.uniform1f(locations[key], v);
        }
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      const swap = (field) => {
        [field.read, field.write] = [field.write, field.read];
      };
      function resize() {
        if (!enabled) return;
        const bounds = canvas.getBoundingClientRect(),
          dpr = Math.min(devicePixelRatio || 1, 1.65);
        const cw = Math.max(2, Math.round(bounds.width * dpr)),
          ch = Math.max(2, Math.round(bounds.height * dpr));
        if (cw !== canvas.width || ch !== canvas.height) {
          canvas.width = cw;
          canvas.height = ch;
        }
        const size = Number($("quality").value),
          aspect = cw / ch;
        const w = Math.min(320, Math.round(size * Math.max(1, aspect))),
          h = Math.min(320, Math.round(size * Math.max(1, 1 / aspect)));
        if (fields?.w === w && fields.h === h) {
          draw();
          return;
        }
        const allocated = [];
        const make = (w, h) => {
          const buffer = target(w, h);
          allocated.push(buffer);
          return buffer;
        };
        const pair = (w, h) => ({ read: make(w, h), write: make(w, h) });
        const prev = fields;
        try {
          fields = {
            w,
            h,
            allocated,
            velocity: pair(w, h),
            dye: pair(w * 2, h * 2),
            pressure: pair(w, h),
            curl: make(w, h),
            div: make(w, h),
          };
          if (prev) {
            pass(
              "copy",
              fields.velocity.read,
              { uSource: prev.velocity.read },
              { uScale: [w / prev.w, h / prev.h, 1, 1] },
            );
            pass(
              "copy",
              fields.dye.read,
              { uSource: prev.dye.read },
              { uScale: [1, 1, 1, 1] },
            );
            dispose(prev);
          }
          $("metrics").textContent =
            "速度场 " + w + " × " + h + " · 染料 " + w * 2 + " × " + h * 2;
          draw();
        } catch (error) {
          dispose({ allocated });
          dispose(prev);
          fields = null;
          unavailable(error.message);
        }
      }
      function draw() {
        if (fields && enabled) pass("show", null, { uDye: fields.dye.read });
      }
      function clear() {
        if (!fields) return;
        splats.length = 0;
        for (const item of fields.allocated) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, item.fbo);
          gl.clear(gl.COLOR_BUFFER_BIT);
        }
        draw();
      }
      function rgb(hex) {
        return [1, 3, 5].map(
          (i) => (parseInt(hex.slice(i, i + 2), 16) / 255) ** 2,
        );
      }
      function inject(s) {
        const { velocity, dye, w, h } = fields;
        const aspect = canvas.width / canvas.height;
        const point = [s.x, s.y],
          shape = [Math.max(1, aspect), Math.max(1, 1 / aspect)];
        const force = Number($("force").value);
        pass(
          "splat",
          velocity.write,
          { uSource: velocity.read },
          {
            uPoint: point,
            uShape: shape,
            uValue: [s.dx * w * force, s.dy * h * force, 0],
            uRadius: s.radius ?? 0.032,
            uCeiling: 500,
          },
        );
        swap(velocity);
        pass(
          "splat",
          dye.write,
          { uSource: dye.read },
          {
            uPoint: point,
            uShape: shape,
            uValue: s.color.map((v) => v * (s.amount ?? 0.95)),
            uRadius: s.radius ?? 0.021,
            uCeiling: 16,
          },
        );
        swap(dye);
      }
      function seedFlow() {
        for (const [x, y, dx, dy, color] of [
          [0.34, 0.47, 1.9, 0.8, "#ff5098"],
          [0.64, 0.54, -1.6, -0.55, "#43eeca"],
          [0.49, 0.62, 0.5, -1.7, "#8b9eff"],
          [0.54, 0.35, -0.42, 1.5, "#ffa549"],
          [0.42, 0.51, 1.1, -0.35, "#9875ff"],
        ]) {
          inject({
            x,
            y,
            dx,
            dy,
            color: rgb(color),
            radius: 0.071,
            amount: 3.0,
          });
        }
        draw();
      }

      function simulate(dt) {
        for (const s of splats.splice(0)) inject(s);
        const { velocity, dye, pressure, div, curl } = fields;
        pass(
          "advect",
          velocity.write,
          { uSource: velocity.read, uVelocity: velocity.read },
          { uTime: dt, uLoss: 0.27 },
        );
        swap(velocity);
        pass("curl", curl, { uVelocity: velocity.read });
        pass(
          "vortex",
          velocity.write,
          { uVelocity: velocity.read, uCurl: curl },
          { uTime: dt },
        );
        swap(velocity);
        pass("divergence", div, { uVelocity: velocity.read });
        pass(
          "copy",
          pressure.write,
          { uSource: pressure.read },
          { uScale: [0.72, 1, 1, 1] },
        );
        swap(pressure);
        for (let i = 0; i < Number($("iterations").value); i++) {
          pass("pressure", pressure.write, {
            uPressure: pressure.read,
            uDivergence: div,
          });
          swap(pressure);
        }
        pass("project", velocity.write, {
          uVelocity: velocity.read,
          uPressure: pressure.read,
        });
        swap(velocity);
        pass(
          "advect",
          dye.write,
          { uSource: dye.read, uVelocity: velocity.read },
          { uTime: dt, uLoss: Number($("decay").value) },
        );
        swap(dye);
      }
      function loop(time) {
        frame = 0;
        if (!enabled || paused) return;
        const dt = Math.max(0.001, Math.min((time - last) / 1000, 0.026));
        simulate(dt);
        draw();
        last = time;
        frame = requestAnimationFrame(loop);
      }
      function resume() {
        last = performance.now();
        if (!frame && enabled && !paused) frame = requestAnimationFrame(loop);
      }
      function unavailable(detail) {
        enabled = false;
        cancelAnimationFrame(frame);
        frame = 0;
        $("error-detail").textContent = detail;
        $("error").hidden = false;
        $("status").textContent = "GPU 模拟未运行";
        for (const node of controls) node.disabled = true;
      }
      function init() {
        if (!gl || !gl.getExtension("EXT_color_buffer_float")) {
          unavailable(
            "此浏览器或设备缺少 WebGL 2 的浮点渲染支持。请启用图形加速或改用支持的设备。",
          );
          return;
        }
        try {
          gpu = programs();
          gl.bindVertexArray(gl.createVertexArray());
          gl.disable(gl.BLEND);
          gl.clearColor(0, 0, 0, 0);
          enabled = true;
          paused = false;
          resize();
          if (!enabled) return;
          for (const node of controls) node.disabled = false;
          $("error").hidden = true;
          $("pause").textContent = "暂停";
          $("status").textContent = "运行中 · 拖动画布注入染料";
          seedFlow();
          resume();
        } catch (error) {
          unavailable("GPU 程序初始化失败。" + error.message);
        }
      }

      function pointer(event) {
        const r = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - r.left) / r.width,
          y: 1 - (event.clientY - r.top) / r.height,
        };
      }
      function queue(next, prev, time) {
        const vx = prev ? (next.x - prev.x) / time : 0,
          vy = prev ? (next.y - prev.y) / time : 0;
        const speed = Math.hypot(vx, vy),
          factor = speed > 3 ? 3 / speed : 1;
        const n = prev
          ? Math.max(
              1,
              Math.min(
                8,
                Math.ceil(Math.hypot(next.x - prev.x, next.y - prev.y) / 0.018),
              ),
            )
          : 1;
        const color = rgb($("color").value);
        for (let i = 1; i <= n && splats.length < 25; i++) {
          const f = i / n;
          const x = prev ? prev.x + (next.x - prev.x) * f : next.x,
            y = prev ? prev.y + (next.y - prev.y) * f : next.y;
          if (x >= 0 && x <= 1 && y >= 0 && y <= 1)
            splats.push({
              x,
              y,
              dx: (vx * factor) / Math.sqrt(n),
              dy: (vy * factor) / Math.sqrt(n),
              color,
              amount: prev ? 0.72 : 0.95,
            });
        }
      }
      canvas.addEventListener("pointerdown", (event) => {
        if (!enabled || paused || event.button !== 0) return;
        canvas.setPointerCapture(event.pointerId);
        const p = pointer(event);
        p.time = event.timeStamp;
        pointers.set(event.pointerId, p);
        queue(p, null, 1);
      });
      canvas.addEventListener("pointermove", (event) => {
        const prev = pointers.get(event.pointerId);
        if (!prev || !enabled || paused) return;
        const p = pointer(event);
        p.time = event.timeStamp;
        queue(p, prev, Math.max(0.012, (p.time - prev.time) / 1000));
        pointers.set(event.pointerId, p);
      });
      for (const name of ["pointerup", "pointercancel", "lostpointercapture"])
        canvas.addEventListener(name, (e) => pointers.delete(e.pointerId));
      function color(hex) {
        $("color").value = hex;
        for (const button of $("palette").querySelectorAll("button"))
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.color === hex),
          );
      }
      for (const button of $("palette").querySelectorAll("button"))
        button.onclick = () => color(button.dataset.color);
      $("color").oninput = () => color($("color").value);
      for (const id of ["force", "decay", "iterations"]) {
        $(id).oninput = () => {
          $(id + "-value").value = $(id).value;
        };
        $(id).oninput();
      }
      $("quality").onchange = resize;
      $("pause").onclick = () => {
        paused = !paused;
        pointers.clear();
        splats.length = 0;
        $("pause").textContent = paused ? "继续" : "暂停";
        $("status").textContent = paused
          ? "已暂停"
          : "运行中 · 拖动画布注入染料";
        if (!paused) resume();
        else draw();
      };
      $("clear").onclick = () => {
        clear();
        $("status").textContent = paused
          ? "已清空 · 暂停中"
          : "已清空 · 可重新注入";
      };
      $("reset").onclick = () => {
        for (const id of ["force", "decay", "iterations", "quality"]) {
          $(id).value = defaults[id];
          $(id).oninput?.();
        }
        color(defaults.color);
        resize();
        if (!enabled) return;
        clear();
        seedFlow();
        $("status").textContent =
          "参数已重置" + (paused ? " · 暂停中" : " · 运行中");
      };
      $("capture").onclick = () => {
        draw();
        canvas.toBlob((blob) => {
          if (!blob) {
            $("status").textContent = "截图失败。";
            return;
          }
          const url = URL.createObjectURL(blob),
            link = document.createElement("a");
          link.href = url;
          link.download = "fluid-lab.png";
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          $("status").textContent = "已保存 PNG" + (paused ? " · 暂停中" : "");
        }, "image/png");
      };
      canvas.addEventListener("webglcontextlost", (event) => {
        event.preventDefault();
        fields = null;
        splats.length = 0;
        pointers.clear();
        unavailable("图形上下文已丢失，正在等待浏览器恢复。");
      });
      canvas.addEventListener("webglcontextrestored", init);
      new ResizeObserver(resize).observe(canvas);
      init();
    </script>
  </body>
</html>
