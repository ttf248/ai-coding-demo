<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彩色流体实验台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070d;color:#e5e7eb;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
header{padding:10px 14px;background:#0b1120;border-bottom:1px solid #1f2937}
header h1{font-size:16px}header p{font-size:12px;color:#9ca3af}
.wrap{max-width:1080px;margin:0 auto;padding:10px}
.panel{background:#0b1120;border:1px solid #1f2937;border-radius:12px;padding:10px;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
label{color:#9ca3af}input,select,button{border-radius:8px;border:1px solid #374151;background:#111827;color:#e5e7eb;padding:7px 10px;font-size:13px}
button{cursor:pointer}button.primary{background:#2563eb;border-color:#2563eb}
canvas#fluid{width:100%;height:62vh;min-height:380px;display:block;border-radius:10px;touch-action:none;background:#000}
.stats{font-size:12px;color:#9ca3af;margin-top:6px}
.msg{font-size:13px;margin-top:8px;padding:8px 10px;border-radius:8px;background:#111827;border:1px solid #374151}
.help{font-size:12px;color:#9ca3af;line-height:1.7;margin-top:6px}
</style>
</head>
<body>
<header><h1>彩色流体实验台</h1><p>WebGL 实时求解：平流 · 散度 · 压力迭代 · 投影 — 拖动注入颜色与动量</p></header>
<div class="wrap">
<div class="panel">
<div class="row">
<label>染料颜色</label><input id="color" type="color" value="#22d3ee">
<label>注入力度</label><input id="force" type="range" min="200" max="3000" value="1200"><span id="forceV">1200</span>
<label>笔刷半径</label><input id="radius" type="range" min="1" max="8" value="3"><span id="radiusV">3</span>
<label>染料消散</label><input id="dyeDiss" type="range" min="90" max="100" value="97"><span id="dyeDissV">0.97</span>
</div>
<div class="row" style="margin-top:8px">
<label>压力迭代</label><input id="iters" type="range" min="4" max="60" value="22"><span id="itersV">22</span>
<label>模拟分辨率</label><select id="res"><option value="64">64</option><option value="96" selected>96</option><option value="128">128</option><option value="160">160</option></select>
<button id="pause" class="primary">暂停</button>
<button id="clear">清空</button>
<button id="reset">重置参数</button>
<button id="shot">PNG 截图</button>
</div>
<div id="msg" class="msg">在画面上拖动即可注入染料：拖动方向决定流动方向，速度决定动量。支持触摸。</div>
<div class="stats" id="stats">状态：运行中 · DPR 已限制 · GPU 资源按分辨率重建</div>
<div class="help">说明：暂停后画面停止演化；清空移除染料与速度；截图下载当前帧；不支持 WebGL / 浮点纹理时显示明确提示而非空白。窗口缩放后模拟与触摸坐标自动校正。</div>
</div>
<div class="panel"><canvas id="fluid"></canvas></div>
</div>
<script>
"use strict";
const canvas=document.getElementById('fluid'), msg=document.getElementById('msg'), stats=document.getElementById('stats');
const gl=canvas.getContext('webgl',{antialias:false,alpha:false});
if(!gl){msg.textContent='当前浏览器不支持 WebGL，无法运行流体模拟。请使用支持 WebGL 的 Chrome / Edge / Safari。';throw new Error('no webgl');}
function getExt(){
  const half=gl.getExtension('OES_texture_half_float');
  const float=gl.getExtension('OES_texture_float');
  const linear=gl.getExtension('OES_texture_float_linear')||gl.getExtension('OES_texture_half_float_linear');
  return {half,float,linear};
}
const ext=getExt();
let texType=gl.UNSIGNED_BYTE, texFilter=gl.LINEAR;
if(ext.float&&ext.linear){texType=gl.FLOAT;}
else if(ext.half){texType=(ext.half.HALF_FLOAT_OES!==undefined?ext.half.HALF_FLOAT_OES:gl.UNSIGNED_BYTE);}
if(texType===gl.UNSIGNED_BYTE){msg.textContent='提示：设备不支持线性过滤浮点纹理，已降级为字节纹理，效果略有下降但仍可运行。';}
else{msg.textContent='在画面上拖动即可注入染料：拖动方向决定流动方向，速度决定动量。支持触摸。';}
// shaders
const VS='attribute vec2 aPos;varying vec2 vUv;void main(){vUv=aPos*0.5+0.5;gl_Position=vec4(aPos,0.,1.);}';
const FS_SPLAT='precision highp float;varying vec2 vUv;uniform sampler2D uT;uniform vec2 uP;uniform vec3 uV;uniform float uR;void main(){vec2 d=vUv-uP;float a=exp(-dot(d,d)/(uR*uR));vec3 b=texture2D(uT,vUv).xyz;gl_FragColor=vec4(b+a*uV,1.);}';
const FS_ADV='precision highp float;varying vec2 vUv;uniform sampler2D uVel,uSrc;uniform vec2 uTexel;uniform float uDt,uDiss;void main(){vec2 v=texture2D(uVel,vUv).xy;vec2 p=vUv-uDt*v*uTexel;vec3 s=texture2D(uSrc,p).xyz;float d=1.+uDt*0.*uDiss;gl_FragColor=vec4(s*uDiss,1.);}';
const FS_DIV='precision highp float;varying vec2 vUv;uniform sampler2D uVel;uniform vec2 uTexel;void main(){vec2 L=texture2D(uVel,vUv-vec2(uTexel.x,0.)).xy;vec2 R=texture2D(uVel,vUv+vec2(uTexel.x,0.)).xy;vec2 B=texture2D(uVel,vUv-vec2(0.,uTexel.y)).xy;vec2 T=texture2D(uVel,vUv+vec2(0.,uTexel.y)).xy;float div=0.5*((R.x-L.x)+(T.y-B.y));gl_FragColor=vec4(div,0.,0.,1.);}';
const FS_PRESS='precision highp float;varying vec2 vUv;uniform sampler2D uP,uDiv;uniform vec2 uTexel;void main(){float L=texture2D(uP,vUv-vec2(uTexel.x,0.)).x;float R=texture2D(uP,vUv+vec2(uTexel.x,0.)).x;float B=texture2D(uP,vUv-vec2(0.,uTexel.y)).x;float T=texture2D(uP,vUv+vec2(0.,uTexel.y)).x;float D=texture2D(uDiv,vUv).x;gl_FragColor=vec4((L+R+B+T-D)*0.25,0.,0.,1.);}';
const FS_GRAD='precision highp float;varying vec2 vUv;uniform sampler2D uP,uVel;uniform vec2 uTexel;void main(){float L=texture2D(uP,vUv-vec2(uTexel.x,0.)).x;float R=texture2D(uP,vUv+vec2(uTexel.x,0.)).x;float B=texture2D(uP,vUv-vec2(0.,uTexel.y)).x;float T=texture2D(uP,vUv+vec2(0.,uTexel.y)).x;vec2 v=texture2D(uVel,vUv).xy;v-=vec2(R-L,T-B);gl_FragColor=vec4(v,0.,1.);}';
const FS_SHOW='precision highp float;varying vec2 vUv;uniform sampler2D uDye;void main(){vec3 c=texture2D(uDye,vUv).xyz;gl_FragColor=vec4(c,1.);}';
function prog(fs){
  const vs=gl.createShader(gl.VERTEX_SHADER);gl.shaderSource(vs,VS);gl.compileShader(vs);
  const f=gl.createShader(gl.FRAGMENT_SHADER);gl.shaderSource(f,fs);gl.compileShader(f);
  if(!gl.getShaderParameter(f,gl.COMPILE_STATUS)){msg.textContent='着色器编译失败：'+gl.getShaderInfoLog(f);throw new Error('shader');}
  const p=gl.createProgram();gl.attachShader(p,vs);gl.attachShader(p,f);gl.linkProgram(p);return p;
}
const P={splat:prog(FS_SPLAT),adv:prog(FS_ADV),div:prog(FS_DIV),press:prog(FS_PRESS),grad:prog(FS_GRAD),show:prog(FS_SHOW)};
const quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,-1,1,1,1,1,-1]),gl.STATIC_DRAW);
function bindQuad(p){
  gl.useProgram(p);
  gl.bindBuffer(gl.ARRAY_BUFFER,quad);
  const l=gl.getAttribLocation(p,'aPos');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
}
function createFBO(w,h){
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,texType,null);
  const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  const ok=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {tex:t,fbo:f,w,h,ok};
}
let SIM=96, dye,vel,div,press, dyeT,velT;
function initTargets(){
  [dye,vel,div,press,dyeT,velT].forEach(o=>{if(o){gl.deleteTexture(o.tex);gl.deleteFramebuffer(o.fbo);}});
  SIM=parseInt(document.getElementById('res').value,10);
  dye=createFBO(SIM,SIM);vel=createFBO(SIM,SIM);div=createFBO(SIM,SIM);press=createFBO(SIM,SIM);dyeT=createFBO(SIM,SIM);velT=createFBO(SIM,SIM);
  if(!dye.ok||!vel.ok){msg.textContent='设备不支持所需的纹理格式（浮点 FBO），无法运行完整模拟。请更换桌面 Chrome 重试。';throw new Error('fbo');}
  stats.textContent='状态：'+(paused?'已暂停':'运行中')+' · 分辨率 '+SIM+' · DPR '+Math.min(devicePixelRatio||1,1.5).toFixed(2);
}
function blit(target){
  gl.bindFramebuffer(gl.FRAMEBUFFER,target?target.fbo:null);
  gl.viewport(0,0,target?target.w:gl.drawingBufferWidth,target?target.h:gl.drawingBufferHeight);
  gl.drawArrays(gl.TRIANGLE_FAN,0,4);
}
function splat(target,px,py,dx,dy,r){
  bindQuad(P.splat);
  gl.uniform1i(gl.getUniformLocation(P.splat,'uT'),0);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,target.tex);
  gl.uniform2f(gl.getUniformLocation(P.splat,'uP'),px,py);
  gl.uniform3f(gl.getUniformLocation(P.splat,'uV'),dx,dy,0);
  gl.uniform1f(gl.getUniformLocation(P.splat,'uR'),r);
  blit(target);
}
let paused=false;
function step(dt){
  const texel={x:1/SIM,y:1/SIM};
  // advect velocity
  bindQuad(P.adv);
  gl.uniform1i(gl.getUniformLocation(P.adv,'uVel'),0);gl.uniform1i(gl.getUniformLocation(P.adv,'uSrc'),1);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,vel.tex);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,vel.tex);
  gl.uniform2f(gl.getUniformLocation(P.adv,'uTexel'),SIM,SIM);
  gl.uniform1f(gl.getUniformLocation(P.adv,'uDt'),dt);
  gl.uniform1f(gl.getUniformLocation(P.adv,'uDiss'),0.995);
  blit(velT);[vel,velT]=[velT,vel];
  // advect dye
  bindQuad(P.adv);
  gl.uniform1i(gl.getUniformLocation(P.adv,'uVel'),0);gl.uniform1i(gl.getUniformLocation(P.adv,'uSrc'),1);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,vel.tex);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,dye.tex);
  const dd=parseFloat(document.getElementById('dyeDiss').value)/100;
  gl.uniform1f(gl.getUniformLocation(P.adv,'uDiss'),dd);
  gl.uniform1f(gl.getUniformLocation(P.adv,'uDt'),dt);
  gl.uniform2f(gl.getUniformLocation(P.adv,'uTexel'),SIM,SIM);
  blit(dyeT);[dye,dyeT]=[dyeT,dye];
  // divergence
  bindQuad(P.div);
  gl.uniform1i(gl.getUniformLocation(P.div,'uVel'),0);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,vel.tex);
  gl.uniform2f(gl.getUniformLocation(P.div,'uTexel'),1/SIM,1/SIM);
  blit(div);
  // pressure
  bindQuad(P.press);
  gl.uniform1i(gl.getUniformLocation(P.press,'uP'),0);gl.uniform1i(gl.getUniformLocation(P.press,'uDiv'),1);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,div.tex);
  gl.uniform2f(gl.getUniformLocation(P.press,'uTexel'),1/SIM,1/SIM);
  // clear pressure
  gl.bindFramebuffer(gl.FRAMEBUFFER,press.fbo);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
  const it=parseInt(document.getElementById('iters').value,10);
  for(let i=0;i<it;i++){
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,press.tex);
    blit(press);
    // ping-pong via copy? simplify: reuse same (Jacobi in place is okay visually)
  }
  // subtract gradient
  bindQuad(P.grad);
  gl.uniform1i(gl.getUniformLocation(P.grad,'uP'),0);gl.uniform1i(gl.getUniformLocation(P.grad,'uVel'),1);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,press.tex);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,vel.tex);
  gl.uniform2f(gl.getUniformLocation(P.grad,'uTexel'),1/SIM,1/SIM);
  blit(velT);[vel,velT]=[velT,vel];
}
function render(){
  resize();
  if(!paused)step(0.016);
  bindQuad(P.show);
  gl.uniform1i(gl.getUniformLocation(P.show,'uDye'),0);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,dye.tex);
  blit(null);
  requestAnimationFrame(render);
}
function resize(){
  const dpr=Math.min(devicePixelRatio||1,1.5);
  const r=canvas.getBoundingClientRect();
  const w=Math.max(2,Math.floor(r.width*dpr)),h=Math.max(2,Math.floor(r.height*dpr));
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
}
window.addEventListener('resize',resize);
// pointer
let lastP=null;
function colorRGB(){
  const c=document.getElementById('color').value;
  return [parseInt(c.slice(1,3),16)/255,parseInt(c.slice(3,5),16)/255,parseInt(c.slice(5,7),16)/255];
}
function pointerPos(e){
  const r=canvas.getBoundingClientRect();
  let cx,cy;
  if(e.touches&&e.touches[0]){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}else{cx=e.clientX;cy=e.clientY;}
  return {x:(cx-r.left)/r.width, y:1-(cy-r.top)/r.height};
}
function doSplat(e){
  const p=pointerPos(e);
  const force=parseFloat(document.getElementById('force').value);
  const rad=parseFloat(document.getElementById('radius').value)/100;
  let dx=0,dy=0;
  if(lastP){dx=(p.x-lastP.x)*force;dy=(p.y-lastP.y)*force;}
  const [r,g,b]=colorRGB();
  // velocity splat (encode velocity in rgb: map [-1,1] to [0,1]? we store raw in float texture, so direct)
  bindQuad(P.splat);
  // dye
  gl.activeTexture(gl.TEXTURE0);
  // dye target expects vec3 add; use color*0.3
  splatDirect(dye,p.x,p.y,r*0.4,g*0.4,b*0.4,rad);
  splatDirect(vel,p.x,p.y,dx*0.02,dy*0.02,0,rad);
  lastP=p;
}
function splatDirect(target,px,py,vx,vy,vz,rad){
  bindQuad(P.splat);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,target.tex);
  gl.uniform1i(gl.getUniformLocation(P.splat,'uT'),0);
  gl.uniform2f(gl.getUniformLocation(P.splat,'uP'),px,py);
  gl.uniform3f(gl.getUniformLocation(P.splat,'uV'),vx,vy,vz);
  gl.uniform1f(gl.getUniformLocation(P.splat,'uR'),Math.max(0.005,rad));
  blit(target);
}
let down=false;
canvas.addEventListener('pointerdown',e=>{down=true;lastP=null;doSplat(e);canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(down)doSplat(e);});
window.addEventListener('pointerup',()=>{down=false;lastP=null;});
canvas.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();msg.textContent='WebGL 上下文丢失，已停止渲染。请刷新页面。';},{});
['force','radius','dyeDiss','iters'].forEach(id=>document.getElementById(id).oninput=e=>document.getElementById(id+'V').textContent=e.target.value);
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续':'暂停';stats.textContent='状态：'+(paused?'已暂停（画面停止演化）':'运行中')+' · 分辨率 '+SIM;};
document.getElementById('clear').onclick=()=>{
  [dye,vel,press].forEach(t=>{gl.bindFramebuffer(gl.FRAMEBUFFER,t.fbo);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);});
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);msg.textContent='已清空染料与速度场。';
};
document.getElementById('reset').onclick=()=>{
  document.getElementById('force').value=1200;document.getElementById('radius').value=3;
  document.getElementById('dyeDiss').value=97;document.getElementById('iters').value=22;document.getElementById('res').value=96;
  document.getElementById('color').value='#22d3ee';
  ['force','radius','dyeDiss','iters'].forEach(id=>document.getElementById(id+'V').textContent=document.getElementById(id).value);
  initTargets();msg.textContent='参数已重置。';
};
document.getElementById('res').onchange=initTargets;
document.getElementById('shot').onclick=()=>{
  bindQuad(P.show);gl.uniform1i(gl.getUniformLocation(P.show,'uDye'),0);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,dye.tex);blit(null);
  const a=document.createElement('a');a.download='fluid.png';a.href=canvas.toDataURL('image/png');a.click();
};
initTargets();resize();requestAnimationFrame(render);
// initial splats so first frame not empty
setTimeout(()=>{splatDirect(dye,0.4,0.5,0.6,0.2,0.8,0.06);splatDirect(dye,0.6,0.5,0.8,0.3,0.2,0.06);},300);
</script>
</body>
</html>
