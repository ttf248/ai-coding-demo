<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>彩色流体实验台</title><style>
:root{color-scheme:dark;--bg:#0b0c14;--panel:#151621;--line:#303043;--muted:#989ab1;--accent:#b4a1ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f0eff9;font:14px/1.6 system-ui,sans-serif}main{max-width:1450px;padding:30px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:3px}h1{font-size:30px;margin:5px 0}p{color:var(--muted);margin:5px 0}.badge{border:1px solid var(--line);border-radius:30px;padding:7px 14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px}.card{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:0}h2{font-size:15px;margin:0 0 15px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}button,select{font:inherit;color:inherit;border:1px solid #444459;background:#242433;padding:8px 12px;border-radius:7px;cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.primary{color:#171329;background:var(--accent);border-color:var(--accent)}label{display:block;color:var(--muted);margin-bottom:18px}input[type=range],select{width:100%;margin-top:8px;accent-color:var(--accent)}input[type=color]{display:block;width:100%;height:40px;border:1px solid #444459;border-radius:7px;padding:3px;margin-top:8px;background:#242433}output{float:right;color:#ded6ff}canvas{width:100%;aspect-ratio:8/5;display:block;border-radius:10px;touch-action:none;background:#050711;cursor:crosshair}.stage{position:relative;min-width:0}.error{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;background:#161523ee;border:1px solid #765971;border-radius:10px;color:#f6c7d7}.error[hidden]{display:none}.status{margin-top:13px;font-size:12px;color:var(--accent);min-height:22px}.note{font-size:12px;border-top:1px solid var(--line);padding-top:16px;margin-top:18px}.metrics{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 0 0;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9de6c1;margin-right:6px}@media(max-width:800px){main{padding:16px}h1{font-size:25px}.badge{display:none}.layout{grid-template-columns:1fr}.card{padding:14px}canvas{min-height:260px}.error{padding:18px}}
</style></head><body><main><header><div><div class="eyebrow">FLUID FIELD NOTES / 04</div><h1>彩色流体实验台</h1><p>在暗处注入颜色，观察流动留下的形状。</p></div><span class="badge">二维不可压缩流 · WebGL 2</span></header><div class="layout"><section class="card"><div class="toolbar"><button class="primary" id="pause">暂停</button><button id="clear">清空</button><button id="splash">注入示例</button><button id="snapshot">PNG 截图</button></div><div class="stage"><canvas id="fluid" width="960" height="600" aria-label="拖动鼠标或手指向流体中注入颜色及动量"></canvas><div class="error" id="error" role="alert" hidden></div></div><div class="metrics"><span><i class="dot"></i><span id="engine">检查 GPU 支持…</span></span><span id="gridSize">—</span><span id="fps">— FPS</span></div><p class="status" id="status" role="status">拖动注入染料，拖动方向会改变流向。</p></section><aside class="card"><h2>01 / 注入与演化</h2><label>染料颜色<input id="color" type="color" value="#ac78ff"></label><label>注入力度 <output id="forceValue">1.5</output><input id="force" type="range" min="0.2" max="4" step="0.1" value="1.5"></label><label>染料消散 / 秒 <output id="decayValue">0.35</output><input id="decay" type="range" min="0" max="3" step="0.05" value="0.35"></label><h2>02 / 求解质量</h2><label>压力迭代 <output id="iterationsValue">32</output><input id="iterations" type="range" min="8" max="80" step="4" value="32"></label><label>模拟分辨率<select id="resolution"><option value="96">96 · 节能</option><option value="160" selected>160 · 均衡</option><option value="256">256 · 精细</option></select></label><button id="reset">重置参数与流场</button><p class="note">每帧计算速度平流、旋度约束、散度、压力 Jacobi 迭代与速度投影，再平流染料。网格采用半浮点纹理；画面像素比上限 1.5。重建分辨率会释放旧 GPU 资源并清空流场。</p><p class="note">暂停时停止注入与演化。触摸与鼠标均支持多点注入。需要 WebGL 2 和可渲染半浮点纹理，无法运行时会显示具体原因。</p></aside></div></main><script>
'use strict';const $=id=>document.getElementById(id),canvas=$('fluid');let gl=null,programs={},resources=[],velocity,dye,pressure,divergence,curl,nx=160,ny=100,ready=false,paused=false,lastTime=0,frameCount=0,fpsTime=0;const pointers=new Map();
const vertex=`#version 300 es
precision highp float;
out vec2 uv;
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));uv=p;gl_Position=vec4(p*2.0-1.0,0.0,1.0);}`;
const common=`#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 uv;out vec4 frag;
uniform vec2 texel;
vec4 bilerp(sampler2D t,vec2 p){vec2 q=p/texel-0.5;vec2 f=fract(q);vec2 a=(floor(q)+0.5)*texel;return mix(mix(texture(t,a),texture(t,a+vec2(texel.x,0)),f.x),mix(texture(t,a+vec2(0,texel.y)),texture(t,a+texel),f.x),f.y);}
`;
const shaders={
advect:`uniform sampler2D field,vel;uniform float dt,decay;void main(){vec2 v=texture(vel,uv).xy;frag=bilerp(field,clamp(uv-dt*v*texel,texel*.5,1.0-texel*.5))*exp(-decay*dt);}`,
splat:`uniform sampler2D field;uniform vec2 point;uniform vec3 amount;uniform float aspect;void main(){vec2 p=uv-point;p.x*=aspect;float w=exp(-dot(p,p)/0.0008);frag=texture(field,uv)+vec4(amount*w,0);frag=clamp(frag,vec4(-200),vec4(200));}`,
curl:`uniform sampler2D vel;void main(){float l=texture(vel,uv-vec2(texel.x,0)).y,r=texture(vel,uv+vec2(texel.x,0)).y,b=texture(vel,uv-vec2(0,texel.y)).x,t=texture(vel,uv+vec2(0,texel.y)).x;frag=vec4(.5*(r-l-t+b),0,0,1);}`,
vorticity:`uniform sampler2D vel,curlField;uniform float dt;void main(){float l=abs(texture(curlField,uv-vec2(texel.x,0)).x),r=abs(texture(curlField,uv+vec2(texel.x,0)).x),b=abs(texture(curlField,uv-vec2(0,texel.y)).x),t=abs(texture(curlField,uv+vec2(0,texel.y)).x),c=texture(curlField,uv).x;vec2 n=.5*vec2(r-l,t-b);n/=length(n)+.0001;vec2 v=texture(vel,uv).xy+dt*12.0*c*vec2(n.y,-n.x);frag=vec4(clamp(v,vec2(-200),vec2(200)),0,1);}`,
divergence:`uniform sampler2D vel;void main(){vec2 c=texture(vel,uv).xy;float l=texture(vel,uv-vec2(texel.x,0)).x,r=texture(vel,uv+vec2(texel.x,0)).x,b=texture(vel,uv-vec2(0,texel.y)).y,t=texture(vel,uv+vec2(0,texel.y)).y;if(uv.x<texel.x)l=-c.x;if(uv.x>1.0-texel.x)r=-c.x;if(uv.y<texel.y)b=-c.y;if(uv.y>1.0-texel.y)t=-c.y;frag=vec4(.5*(r-l+t-b),0,0,1);}`,
pressure:`uniform sampler2D p,divField;void main(){float l=texture(p,uv-vec2(texel.x,0)).x,r=texture(p,uv+vec2(texel.x,0)).x,b=texture(p,uv-vec2(0,texel.y)).x,t=texture(p,uv+vec2(0,texel.y)).x,d=texture(divField,uv).x;frag=vec4((l+r+b+t-d)*.25,0,0,1);}`,
project:`uniform sampler2D vel,p;void main(){float l=texture(p,uv-vec2(texel.x,0)).x,r=texture(p,uv+vec2(texel.x,0)).x,b=texture(p,uv-vec2(0,texel.y)).x,t=texture(p,uv+vec2(0,texel.y)).x;vec2 v=texture(vel,uv).xy-.5*vec2(r-l,t-b);if(uv.x<texel.x||uv.x>1.0-texel.x)v.x=0.0;if(uv.y<texel.y||uv.y>1.0-texel.y)v.y=0.0;frag=vec4(v,0,1);}`,
display:`uniform sampler2D field;void main(){vec3 c=max(vec3(0),bilerp(field,uv).rgb);vec3 glow=(bilerp(field,uv+texel*2.0).rgb+bilerp(field,uv-texel*2.0).rgb)*.07;c=pow(vec3(1)-exp(-(c+max(glow,vec3(0)))*1.2),vec3(.8));frag=vec4(c+vec3(.014,.018,.038),1);}`
};
function fail(message){ready=false;$('error').hidden=false;$('error').textContent=message;$('engine').textContent='模拟不可用';$('status').textContent='请在支持 WebGL 2 和半浮点渲染的浏览器中打开，或启用硬件加速。'}
function compile(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){const e=gl.getShaderInfoLog(s);gl.deleteShader(s);throw Error(e)}return s}
function program(body){const vs=compile(gl.VERTEX_SHADER,vertex),fs=compile(gl.FRAGMENT_SHADER,common+body),p=gl.createProgram();gl.attachShader(p,vs);gl.attachShader(p,fs);gl.linkProgram(p);gl.deleteShader(vs);gl.deleteShader(fs);if(!gl.getProgramParameter(p,gl.LINK_STATUS)){const e=gl.getProgramInfoLog(p);gl.deleteProgram(p);throw Error(e)}return{p,uniforms:new Map()}}
function target(channels){const texture=gl.createTexture(),fbo=gl.createFramebuffer(),t={texture,fbo,width:nx,height:ny};resources.push(t);gl.bindTexture(gl.TEXTURE_2D,texture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,channels===4?gl.RGBA16F:channels===2?gl.RG16F:gl.R16F,nx,ny,0,channels===4?gl.RGBA:channels===2?gl.RG:gl.RED,gl.HALF_FLOAT,null);gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,texture,0);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error(`设备不支持 ${channels} 通道半浮点渲染纹理。`);gl.viewport(0,0,nx,ny);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);return t}
function pair(channels){return{read:target(channels),write:target(channels),swap(){[this.read,this.write]=[this.write,this.read]}}}function release(){for(const t of resources){gl.deleteTexture(t.texture);gl.deleteFramebuffer(t.fbo)}resources=[]}
function rebuild(){if(!gl)return;release();try{nx=Number($('resolution').value);ny=Math.round(nx/1.6);velocity=pair(2);dye=pair(4);pressure=pair(1);divergence=target(1);curl=target(1);ready=true;$('error').hidden=true;$('gridSize').textContent=`${nx} × ${ny} 求解网格`;$('engine').textContent='WebGL 2 · 半浮点求解';draw();$('status').textContent='流场已重建，旧 GPU 纹理与帧缓冲已释放。'}catch(e){release();fail(e.message)}}
function pass(name,out,uniforms={}){const p=programs[name];gl.useProgram(p.p);gl.bindFramebuffer(gl.FRAMEBUFFER,out?.fbo||null);gl.viewport(0,0,out?.width||canvas.width,out?.height||canvas.height);const values={texel:[1/nx,1/ny],...uniforms};let unit=0;for(const [name,value] of Object.entries(values)){if(!p.uniforms.has(name))p.uniforms.set(name,gl.getUniformLocation(p.p,name));const loc=p.uniforms.get(name);if(loc===null)continue;if(value?.texture){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,value.texture);gl.uniform1i(loc,unit++)}else if(Array.isArray(value)){if(value.length===2)gl.uniform2f(loc,...value);else gl.uniform3f(loc,...value)}else gl.uniform1f(loc,value)}gl.drawArrays(gl.TRIANGLES,0,3)}
function draw(){if(ready)pass('display',null,{field:dye.read})}function advance(dt){pass('advect',velocity.write,{field:velocity.read,vel:velocity.read,dt,decay:.6});velocity.swap();pass('curl',curl,{vel:velocity.read});pass('vorticity',velocity.write,{vel:velocity.read,curlField:curl,dt});velocity.swap();pass('divergence',divergence,{vel:velocity.read});for(const t of [pressure.read,pressure.write]){gl.bindFramebuffer(gl.FRAMEBUFFER,t.fbo);gl.clear(gl.COLOR_BUFFER_BIT)}for(let i=0;i<Number($('iterations').value);i++){pass('pressure',pressure.write,{p:pressure.read,divField:divergence});pressure.swap()}pass('project',velocity.write,{vel:velocity.read,p:pressure.read});velocity.swap();pass('advect',dye.write,{field:dye.read,vel:velocity.read,dt,decay:Number($('decay').value)});dye.swap()}
function splat(x,y,dx,dy,color){if(!ready)return;const amount=color||hexColor($('color').value);pass('splat',velocity.write,{field:velocity.read,point:[x,y],amount:[dx,dy,0],aspect:nx/ny});velocity.swap();pass('splat',dye.write,{field:dye.read,point:[x,y],amount,aspect:nx/ny});dye.swap();draw()}
function hexColor(hex){return[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255*1.2)}function example(){if(!ready||paused)return;splat(.32,.43,30,22,[.25,.55,1.3]);splat(.62,.52,-26,-18,[1,.2,.8]);splat(.48,.32,-20,25,[.2,1,.7]);$('status').textContent='已注入三组染料与动量；随后由流体方程演化。'}function clear(){if(!ready)return;for(const t of resources){gl.bindFramebuffer(gl.FRAMEBUFFER,t.fbo);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT)}draw();$('status').textContent='速度、染料与压力场已清空。'}
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(1.5,window.devicePixelRatio||1),width=Math.max(1,Math.round(r.width*dpr)),height=Math.max(1,Math.round(r.height*dpr));if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;draw()}}function coords(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height))}}
canvas.addEventListener('pointerdown',e=>{if(!ready)return;if(paused){$('status').textContent='模拟已暂停，点击继续后再注入。';return}canvas.setPointerCapture(e.pointerId);const p=coords(e);pointers.set(e.pointerId,p);splat(p.x,p.y,0,0)});canvas.addEventListener('pointermove',e=>{const old=pointers.get(e.pointerId);if(!old||paused||!ready)return;const p=coords(e),force=Number($('force').value);splat(p.x,p.y,(p.x-old.x)*nx*force*8,(p.y-old.y)*ny*force*8);pointers.set(e.pointerId,p)});for(const t of ['pointerup','pointercancel'])canvas.addEventListener(t,e=>pointers.delete(e.pointerId));
$('pause').onclick=()=>{paused=!paused;pointers.clear();$('pause').textContent=paused?'继续':'暂停';$('status').textContent=paused?'已暂停，流场停止演化与注入。':'模拟继续，拖动可注入颜色与动量。'};$('clear').onclick=clear;$('splash').onclick=()=>{if(paused)$('status').textContent='请先继续模拟，再注入示例。';else example()};for(const id of ['force','decay','iterations'])$(id).oninput=()=>{$(id+'Value').value=$(id).value};$('resolution').onchange=()=>{if(gl&&Object.keys(programs).length)rebuild()};$('reset').onclick=()=>{$('force').value=1.5;$('forceValue').value='1.5';$('decay').value=.35;$('decayValue').value='0.35';$('iterations').value=32;$('iterationsValue').value='32';$('resolution').value=160;$('color').value='#ac78ff';paused=false;$('pause').textContent='暂停';if(gl&&Object.keys(programs).length){rebuild();example()}};$('snapshot').onclick=()=>{if(!ready){$('status').textContent='当前设备无法运行模拟，没有可导出的流体截图。';return}draw();canvas.toBlob(blob=>{if(!blob){$('status').textContent='截图失败，请重试。';return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='流体实验.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='已下载当前流体画面的 PNG 截图。'},'image/png')};
function init(){try{gl=canvas.getContext('webgl2',{alpha:false,antialias:false,preserveDrawingBuffer:true});if(!gl)throw Error('当前浏览器或设备不支持 WebGL 2。');if(!gl.getExtension('EXT_color_buffer_float'))throw Error('当前设备缺少 EXT_color_buffer_float，无法进行半浮点流体计算。');for(const [name,body] of Object.entries(shaders))programs[name]=program(body);rebuild();resize();example()}catch(e){if(gl){release();for(const p of Object.values(programs))gl.deleteProgram(p.p)}programs={};fail('流体初始化失败：'+e.message)}}
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();pointers.clear();fail('GPU 上下文已丢失，等待浏览器恢复。')});canvas.addEventListener('webglcontextrestored',()=>{resources=[];programs={};init()});new ResizeObserver(resize).observe(canvas);function frame(t){if(ready&&!paused){const dt=Math.min(.025,Math.max(.001,(t-lastTime)/1000));advance(dt);draw()}lastTime=t;frameCount++;if(t-fpsTime>1000){$('fps').textContent=Math.round(frameCount*1000/(t-fpsTime))+' FPS';frameCount=0;fpsTime=t}requestAnimationFrame(frame)}init();requestAnimationFrame(frame);window.addEventListener('pagehide',()=>{if(gl){release();for(const p of Object.values(programs))gl.deleteProgram(p.p)}ready=false});window.lab={get ready(){return ready},get paused(){return paused},get gl(){return gl},get resources(){return resources},get dye(){return dye},get velocity(){return velocity},splat,advance,draw,clear,rebuild};
</script></body></html>
