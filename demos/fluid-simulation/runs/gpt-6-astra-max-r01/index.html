<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHROMA · 彩色流体实验台</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d14;color:#e7eaf1;font:14px/1.7 system-ui}header{display:flex;justify-content:space-between;padding:24px 4vw;border-bottom:1px solid #26303f}header b{letter-spacing:4px;font-size:22px}small{color:#8c9aaf}main{max-width:1520px;margin:auto;padding:28px 4vw}.intro{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h1{font-size:40px;font-weight:500;letter-spacing:-1px;margin:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px}.stage{position:relative;min-width:0;border:1px solid #26303f;border-radius:12px;overflow:hidden;background:#03060c}canvas{display:block;width:100%;height:620px;touch-action:none}.caption{position:absolute;bottom:18px;left:24px;color:#a2b1c9;pointer-events:none;font-size:12px}.topline{position:absolute;top:18px;left:24px;color:#a2b1c9;font-size:12px;pointer-events:none}.panel{background:#111824;border:1px solid #26303f;padding:22px;border-radius:12px}h2{font-size:14px;margin:0 0 20px}label{display:block;margin:16px 0 7px;color:#9eabc0}input,select,button{font:inherit}input[type=range],select{width:100%;accent-color:#8eabfa}input[type=color]{width:100%;height:40px;border:0;background:transparent;padding:0}select,button{background:#1c283c;color:#e7eaf1;border:1px solid #344663;border-radius:6px;padding:9px 12px}button{cursor:pointer}button:hover{background:#2b405f}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.primary{background:#bed0ff;color:#152448;border:0}#status{font-size:12px;color:#93a9ce;min-height:48px}.failure{position:absolute;inset:20%;padding:25px;background:#202b40;border-radius:12px;z-index:4}.failure[hidden]{display:none}footer{color:#7889a3;font-size:12px;margin-top:20px}@media(max-width:800px){.layout{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.panel h2,.panel .actions,#status{grid-column:1/-1}canvas{height:480px}}@media(max-width:480px){main{padding:20px 12px}h1{font-size:31px}.intro{display:block}.intro p{margin:8px 0}header small{display:none}canvas{height:420px}.panel{padding:16px}.failure{inset:10%}}
</style><header><b>CHROMA / 流</b><small>实时流体研究 · 04</small></header><main><div class="intro"><div><small>用指尖，搅动一场色彩的天气。</small><h1>每一次触碰，都有回响。</h1></div><p><small>按下并拖动注入染料<br>动量跟随你的方向</small></p></div><div class="layout"><section class="stage"><canvas id="fluid" aria-label="流体模拟画布"></canvas><div class="topline">LIVE FIELD <span id="fps"></span></div><div class="caption">速度场 → 平流 → 压力求解 → 投影 → 染料输运</div><div id="failure" class="failure" role="alert" hidden></div></section><aside class="panel"><h2>控制场 / FIELD CONTROLS</h2><div><label for="color">染料颜色</label><input id="color" type="color" value="#65a5ff"><label for="force">注入力度 <output id="forceVal">600</output></label><input id="force" type="range" min="100" max="1800" step="50" value="600"><label for="fade">染料消散 / 秒 <output id="fadeVal">0.25</output></label><input id="fade" type="range" min="0" max="2" step="0.05" value="0.25"></div><div><label for="iterations">压力迭代 <output id="iterationsVal">28</output></label><input id="iterations" type="range" min="5" max="60" step="1" value="28"><label for="resolution">模拟短边分辨率</label><select id="resolution"><option value="96">96 · 轻量</option><option value="160" selected>160 · 均衡</option><option value="256">256 · 精细</option></select><p><small>显示像素比上限 1.5；分辨率变化将重建并清空流场。</small></p></div><div class="actions"><button id="pause" class="primary">暂停</button><button id="clear">清空</button><button id="reset">重置参数</button><button id="shot">↓ PNG 截图</button></div><p id="status" role="status">正在检查 WebGL2 与浮点渲染能力…</p></aside></div><footer>二维不可压缩流体的离散近似。压力迭代次数决定投影精度；低分辨率下可见数值耗散。</footer></main><script>
(()=>{const $=id=>document.getElementById(id),canvas=$('fluid'),gl=canvas.getContext('webgl2',{alpha:false,preserveDrawingBuffer:true,antialias:false});let alive=true;
function fail(message){$('failure').hidden=false;$('failure').textContent=message;$('status').textContent=message;document.querySelectorAll('button,input,select').forEach(e=>e.disabled=true);alive=false;}
if(!gl){fail('此浏览器未启用 WebGL2，无法运行流体计算。请使用支持 WebGL2 的浏览器或开启硬件加速。');return;}if(!gl.getExtension('EXT_color_buffer_float')){fail('设备缺少可渲染浮点纹理 EXT_color_buffer_float，无法可靠计算流体。');return;}
const vertex=`#version 300 es
precision highp float;out vec2 uv;void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);uv=p;gl_Position=vec4(p*2.-1.,0,1);}`;
const common=`#version 300 es
precision highp float;in vec2 uv;out vec4 frag;uniform sampler2D tex;uniform sampler2D velocity;uniform sampler2D pressure;uniform sampler2D divergence;uniform vec2 size;uniform float dt;uniform float decay;uniform vec2 point;uniform vec3 amount;uniform float radius;
vec4 sampleAt(sampler2D t,vec2 p){return texture(t,clamp(p,0.5/size,1.-0.5/size));}
vec4 linearAt(sampler2D t,vec2 p){vec2 st=p*size-.5;vec2 f=fract(st),i=floor(st);return mix(mix(sampleAt(t,(i+.5)/size),sampleAt(t,(i+vec2(1.5,.5))/size),f.x),mix(sampleAt(t,(i+vec2(.5,1.5))/size),sampleAt(t,(i+1.5)/size),f.x),f.y);}
`;
const fragments={
advect:`void main(){vec2 v=sampleAt(velocity,uv).xy;frag=linearAt(tex,uv-dt*v/size)*exp(-decay*dt);}`,
splat:`void main(){vec2 p=(uv-point)*vec2(size.x/size.y,1.);float a=exp(-dot(p,p)/radius);frag=sampleAt(tex,uv)+vec4(amount*a,0);}`,
div:`void main(){vec2 h=1./size;vec2 c=sampleAt(velocity,uv).xy;float L=sampleAt(velocity,uv-vec2(h.x,0)).x,R=sampleAt(velocity,uv+vec2(h.x,0)).x,B=sampleAt(velocity,uv-vec2(0,h.y)).y,T=sampleAt(velocity,uv+vec2(0,h.y)).y;if(uv.x<h.x)L=-c.x;if(uv.x>1.-h.x)R=-c.x;if(uv.y<h.y)B=-c.y;if(uv.y>1.-h.y)T=-c.y;frag=vec4(.5*(R-L+T-B),0,0,1);}`,
pressure:`void main(){vec2 h=1./size;float L=sampleAt(pressure,uv-vec2(h.x,0)).x,R=sampleAt(pressure,uv+vec2(h.x,0)).x,B=sampleAt(pressure,uv-vec2(0,h.y)).x,T=sampleAt(pressure,uv+vec2(0,h.y)).x;frag=vec4((L+R+B+T-sampleAt(divergence,uv).x)*.25,0,0,1);}`,
project:`void main(){vec2 h=1./size;float L=sampleAt(pressure,uv-vec2(h.x,0)).x,R=sampleAt(pressure,uv+vec2(h.x,0)).x,B=sampleAt(pressure,uv-vec2(0,h.y)).x,T=sampleAt(pressure,uv+vec2(0,h.y)).x;vec2 v=sampleAt(velocity,uv).xy-.5*vec2(R-L,T-B);if(uv.x<h.x||uv.x>1.-h.x)v.x=0.;if(uv.y<h.y||uv.y>1.-h.y)v.y=0.;frag=vec4(v,0,1);}`,
curl:`void main(){vec2 h=1./size;float L=sampleAt(velocity,uv-vec2(h.x,0)).y,R=sampleAt(velocity,uv+vec2(h.x,0)).y,B=sampleAt(velocity,uv-vec2(0,h.y)).x,T=sampleAt(velocity,uv+vec2(0,h.y)).x;frag=vec4(.5*(R-L-T+B),0,0,1);}`,
vorticity:`void main(){vec2 h=1./size;float L=abs(sampleAt(tex,uv-vec2(h.x,0)).x),R=abs(sampleAt(tex,uv+vec2(h.x,0)).x),B=abs(sampleAt(tex,uv-vec2(0,h.y)).x),T=abs(sampleAt(tex,uv+vec2(0,h.y)).x),C=sampleAt(tex,uv).x;vec2 f=.5*vec2(T-B,L-R);f/=length(f)+.0001;vec2 v=sampleAt(velocity,uv).xy+dt*12.*f*C;frag=vec4(clamp(v,vec2(-1000),vec2(1000)),0,1);}`,
display:`void main(){vec3 c=max(vec3(0),texture(tex,uv).rgb);c=1.-exp(-c*1.4);frag=vec4(pow(c,vec3(.8))+vec3(.008,.012,.025),1);}`};
const programs={},resources=[];let w=0,h=0,vel,dye,pres,div,curl,paused=false,last=0,count=0,fpsTime=0,pointers=new Map();
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
try{for(const [key,source]of Object.entries(fragments)){const v=shader(gl.VERTEX_SHADER,vertex),f=shader(gl.FRAGMENT_SHADER,common+source),p=gl.createProgram();gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);gl.deleteShader(v);gl.deleteShader(f);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));const uniforms={};for(const n of ['tex','velocity','pressure','divergence','size','dt','decay','point','amount','radius'])uniforms[n]=gl.getUniformLocation(p,n);programs[key]={p,uniforms};}}catch(e){fail('着色器初始化失败：'+e.message);return;}
function target(){const texture=gl.createTexture(),fbo=gl.createFramebuffer();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,texture,0);const t={texture,fbo};resources.push(t);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('浮点帧缓冲不完整');gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);return t;}
const pair=()=>({read:target(),write:target(),swap(){[this.read,this.write]=[this.write,this.read];}});
function pass(name,out,options={}){const {p,uniforms:u}=programs[name];gl.useProgram(p);gl.bindFramebuffer(gl.FRAMEBUFFER,out?.fbo||null);gl.viewport(0,0,out?w:canvas.width,out?h:canvas.height);gl.uniform2f(u.size,w,h);let unit=0;for(const [name,value]of Object.entries(options)){if(value?.texture){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,value.texture);gl.uniform1i(u[name],unit++);}else if(Array.isArray(value)){if(value.length===2)gl.uniform2fv(u[name],value);else gl.uniform3fv(u[name],value);}else gl.uniform1f(u[name],value);}gl.drawArrays(gl.TRIANGLES,0,3);}
function display(){pass('display',null,{tex:dye.read});}function clear(){for(const r of resources){gl.bindFramebuffer(gl.FRAMEBUFFER,r.fbo);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);}display();}
function rebuild(){for(const r of resources){gl.deleteTexture(r.texture);gl.deleteFramebuffer(r.fbo);}resources.length=0;const ratio=canvas.clientWidth/canvas.clientHeight,n=+$('resolution').value;w=Math.round(ratio>1?n*ratio:n);h=Math.round(ratio>1?n:n/ratio);w=Math.min(w,512);h=Math.min(h,512);vel=pair();dye=pair();pres=pair();div=target();curl=target();$('status').textContent=`WebGL2 已就绪 · ${w} × ${h} 流场 · GPU 浮点计算`;display();}
function resize(){const dpr=Math.min(1.5,devicePixelRatio||1);canvas.width=Math.round(canvas.clientWidth*dpr);canvas.height=Math.round(canvas.clientHeight*dpr);if(dye)display();}
function inject(x,y,dx,dy,color){pass('splat',vel.write,{tex:vel.read,point:[x,y],amount:[dx,dy,0],radius:.0015});vel.swap();pass('splat',dye.write,{tex:dye.read,point:[x,y],amount:color.map(v=>v*2.5),radius:.003});dye.swap();}
function tick(t){if(!alive)return;const dt=Math.min(.025,Math.max(.001,(t-last)/1000));last=t;if(!paused){pass('advect',vel.write,{tex:vel.read,velocity:vel.read,dt,decay:.12});vel.swap();pass('curl',curl,{velocity:vel.read});pass('vorticity',vel.write,{tex:curl,velocity:vel.read,dt});vel.swap();pass('div',div,{velocity:vel.read});for(let i=0;i<+$('iterations').value;i++){pass('pressure',pres.write,{pressure:pres.read,divergence:div});pres.swap();}pass('project',vel.write,{velocity:vel.read,pressure:pres.read});vel.swap();pass('advect',dye.write,{tex:dye.read,velocity:vel.read,dt,decay:+$('fade').value});dye.swap();display();}count++;if(t-fpsTime>1000){$('fps').textContent=' / '+Math.round(count*1000/(t-fpsTime))+' FPS';fpsTime=t;count=0;}requestAnimationFrame(tick);}
function coords(e){const b=canvas.getBoundingClientRect();return [(e.clientX-b.left)/b.width,1-(e.clientY-b.top)/b.height];}function rgb(){const c=$('color').value;return [1,3,5].map(i=>parseInt(c.slice(i,i+2),16)/255);}
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);const p=coords(e);pointers.set(e.pointerId,p);if(!paused)inject(...p,0,0,rgb());};canvas.onpointermove=e=>{const a=pointers.get(e.pointerId);if(!a)return;const b=coords(e);pointers.set(e.pointerId,b);if(!paused)inject(...b,(b[0]-a[0])*+$('force').value*10,(b[1]-a[1])*+$('force').value*10,rgb());};canvas.onpointerup=canvas.onpointercancel=e=>pointers.delete(e.pointerId);
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续':'暂停';};$('clear').onclick=clear;$('resolution').onchange=()=>{try{rebuild();}catch(e){fail(e.message);}};for(const id of ['force','fade','iterations'])$(id).oninput=()=>$(id+'Val').value=$(id).value;$('reset').onclick=()=>{$('color').value='#65a5ff';for(const [id,v]of Object.entries({force:600,fade:.25,iterations:28,resolution:160})){$(id).value=v;if($(id+'Val'))$(id+'Val').value=v;}paused=false;$('pause').textContent='暂停';rebuild();};$('shot').onclick=()=>{display();const a=document.createElement('a');a.download='chroma-fluid.png';a.href=canvas.toDataURL('image/png');a.click();};canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();fail('GPU 上下文已丢失，请刷新页面重新初始化。');});new ResizeObserver(resize).observe(canvas);
try{resize();rebuild();inject(.3,.5,110,40,[.3,1,3]);inject(.64,.42,-100,40,[3,.4,1.2]);inject(.5,.65,0,-110,[.6,3,2]);requestAnimationFrame(tick);}catch(e){fail('无法建立模拟：'+e.message);}window.addEventListener('pagehide',()=>{alive=false;for(const r of resources){gl.deleteTexture(r.texture);gl.deleteFramebuffer(r.fbo);}for(const v of Object.values(programs))gl.deleteProgram(v.p);});window.fluidLab={state:()=>({w,h,paused,resources:resources.length,alive}),clear};})();
</script></html>
