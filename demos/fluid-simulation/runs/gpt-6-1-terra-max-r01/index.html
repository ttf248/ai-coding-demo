<!doctype html><html lang="zh-CN"><head><script src="../../../../assets/analytics.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>流体实验台</title><style>
*{box-sizing:border-box}body{margin:0;background:#090c16;color:#eaf2ff;font:14px/1.5 system-ui,sans-serif}main{max-width:1450px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px}h1{margin:0;font-size:clamp(28px,5vw,44px);letter-spacing:-.04em}header p{margin:2px 0;color:#94a3b8}.tag{font-size:11px;letter-spacing:.15em;color:#79e4df;font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:14px}.stage,.panel{background:#11182a;border:1px solid #27344d;border-radius:16px;overflow:hidden}.stage{position:relative;min-height:520px}canvas{display:block;width:100%;height:100%;min-height:520px;touch-action:none;cursor:crosshair}.hint{position:absolute;left:18px;top:15px;pointer-events:none;color:#d7e8f2;font-size:12px;text-shadow:0 1px 5px #000}.error{position:absolute;inset:0;display:none;place-items:center;padding:30px;text-align:center;background:#151b2b;color:#ffc6a8}.panel{padding:18px}h2{font-size:12px;color:#a1b3c7;letter-spacing:.1em;margin:0 0 12px}.group+.group{margin-top:17px;padding-top:17px;border-top:1px solid #29354c}label{display:flex;justify-content:space-between;color:#c4d2e4;margin:10px 0 3px}input[type=range]{width:100%;accent-color:#81ddd9}input[type=color]{width:42px;height:30px;padding:0;border:0;background:none}select,button{font:inherit;background:#202d43;color:#e5f1f9;border:1px solid #36465f;border-radius:8px;padding:8px;cursor:pointer}select{width:100%}button:hover{background:#344b61}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.primary{background:#71ded5;color:#072a2b;font-weight:bold}.help{font-size:12px;color:#879bb3}#status{color:#9be8de;font-size:12px}@media(max-width:750px){main{padding:16px 10px}.layout{grid-template-columns:1fr}.stage,canvas{min-height:360px;height:54vh}.panel{padding:15px}}
</style></head><body><main><header><div><div class="tag">FIELD NOTES / WEBGL 2</div><h1>彩色流体实验台</h1><p>拖动手指或鼠标，向流场注入颜色与动量。</p></div></header><div class="layout"><div class="stage"><canvas id="canvas"></canvas><div class="hint">拖动注入 · 颜色会随流场移动</div><div class="error" id="error" role="alert"></div></div><aside class="panel"><div class="group"><h2>注入</h2><label>染料颜色 <input id="color" type="color" value="#66e5e2"></label><label for="force">注入力度 <output id="forceValue"></output></label><input id="force" type="range" min="1" max="30" value="12"></div><div class="group"><h2>流场</h2><label for="dissipation">染料消散 <output id="dissipationValue"></output></label><input id="dissipation" type="range" min="0" max="40" value="8"><label for="iterations">压力迭代次数 <output id="iterationsValue"></output></label><input id="iterations" type="range" min="1" max="40" value="20"><label for="resolution">模拟分辨率</label><select id="resolution"><option value="96">96 · 省电</option><option value="128" selected>128 · 平衡</option><option value="192">192 · 精细</option><option value="256">256 · 高</option></select><p class="help">基于二维速度、染料、压力与散度场计算；分辨率按画布比例调整。</p></div><div class="group"><h2>控制</h2><div class="buttons"><button class="primary" id="pause">暂停</button><button id="clear">清空</button><button id="reset">重置参数</button><button id="save">PNG 截图</button></div><p id="status" role="status">正在初始化图形环境…</p></div></aside></div></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s),canvas=$('#canvas'),status=$('#status'),error=$('#error');let gl,programs={},quad,fields={},simW=0,simH=0,paused=false,ready=false,last=0,pointer=null;const V=`#version 300 es
in vec2 a;out vec2 uv;void main(){uv=a*.5+.5;gl_Position=vec4(a,0.,1.);}`;const head=`#version 300 es
precision highp float;in vec2 uv;out vec4 outColor;uniform vec2 texel;`;function program(fragment){const compile=(kind,src)=>{let s=gl.createShader(kind);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s},p=gl.createProgram(),v=compile(gl.VERTEX_SHADER,V),f=compile(gl.FRAGMENT_SHADER,head+fragment);gl.attachShader(p,v);gl.attachShader(p,f);gl.bindAttribLocation(p,0,'a');gl.linkProgram(p);gl.deleteShader(v);gl.deleteShader(f);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p}function initPrograms(){programs.splat=program(`uniform sampler2D source;uniform vec2 point;uniform vec3 color;uniform float radius;uniform float aspect;void main(){vec2 d=uv-point;d.x*=aspect;float splat=exp(-dot(d,d)/radius);outColor=texture(source,uv)+vec4(color*splat,0.);}`);programs.advect=program(`uniform sampler2D velocity;uniform sampler2D source;uniform float dt;uniform float decay;vec4 bilerp(sampler2D t,vec2 p){vec2 size=1./texel;vec2 xy=p*size-.5;vec2 i=floor(xy);vec2 f=fract(xy);vec4 a=texture(t,(i+vec2(.5,.5))*texel),b=texture(t,(i+vec2(1.5,.5))*texel),c=texture(t,(i+vec2(.5,1.5))*texel),d=texture(t,(i+vec2(1.5,1.5))*texel);return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}void main(){vec2 v=texture(velocity,uv).xy;outColor=bilerp(source,clamp(uv-dt*v,texel*.5,1.-texel*.5))*exp(-decay*dt);}`);programs.div=program(`uniform sampler2D velocity;void main(){float l=texture(velocity,uv-vec2(texel.x,0)).x,r=texture(velocity,uv+vec2(texel.x,0)).x,b=texture(velocity,uv-vec2(0,texel.y)).y,t=texture(velocity,uv+vec2(0,texel.y)).y;if(uv.x<texel.x)l=0.;if(uv.x>1.-texel.x)r=0.;if(uv.y<texel.y)b=0.;if(uv.y>1.-texel.y)t=0.;outColor=vec4(.5*(r-l+t-b),0,0,1);}`);programs.pressure=program(`uniform sampler2D pressure;uniform sampler2D divergence;void main(){float l=texture(pressure,uv-vec2(texel.x,0)).x,r=texture(pressure,uv+vec2(texel.x,0)).x,b=texture(pressure,uv-vec2(0,texel.y)).x,t=texture(pressure,uv+vec2(0,texel.y)).x,d=texture(divergence,uv).x;outColor=vec4((l+r+b+t-d)*.25,0,0,1);}`);programs.project=program(`uniform sampler2D pressure;uniform sampler2D velocity;void main(){float l=texture(pressure,uv-vec2(texel.x,0)).x,r=texture(pressure,uv+vec2(texel.x,0)).x,b=texture(pressure,uv-vec2(0,texel.y)).x,t=texture(pressure,uv+vec2(0,texel.y)).x;vec2 v=texture(velocity,uv).xy-.5*vec2(r-l,t-b);if(uv.x<texel.x||uv.x>1.-texel.x)v.x=0.;if(uv.y<texel.y||uv.y>1.-texel.y)v.y=0.;outColor=vec4(v,0,1);}`);programs.curl=program(`uniform sampler2D velocity;void main(){float l=texture(velocity,uv-vec2(texel.x,0)).y,r=texture(velocity,uv+vec2(texel.x,0)).y,b=texture(velocity,uv-vec2(0,texel.y)).x,t=texture(velocity,uv+vec2(0,texel.y)).x;outColor=vec4(.5*(r-l-t+b),0,0,1);}`);programs.vorticity=program(`uniform sampler2D velocity;uniform sampler2D curl;uniform float dt;void main(){float l=abs(texture(curl,uv-vec2(texel.x,0)).x),r=abs(texture(curl,uv+vec2(texel.x,0)).x),b=abs(texture(curl,uv-vec2(0,texel.y)).x),t=abs(texture(curl,uv+vec2(0,texel.y)).x),c=texture(curl,uv).x;vec2 n=vec2(t-b,l-r);n/=length(n)+.0001;vec2 v=texture(velocity,uv).xy+n*c*dt*12.;outColor=vec4(v,0,1);}`);programs.display=program(`uniform sampler2D dye;void main(){vec3 c=max(texture(dye,uv).rgb,0.);c=1.-exp(-c*1.4);outColor=vec4(c+vec3(.018,.025,.045),1);}`)}function target(){let t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,simW,simH,0,gl.RGBA,gl.HALF_FLOAT,null);let f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('浮点纹理无法作为渲染目标。');gl.viewport(0,0,simW,simH);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);return{t,f}}function dispose(){for(const item of Object.values(fields))for(const a of Array.isArray(item)?item:[item]){gl.deleteFramebuffer(a.f);gl.deleteTexture(a.t)}fields={}}function rebuild(){dispose();const r=Number($('#resolution').value),ratio=canvas.width/canvas.height;simW=Math.max(32,Math.round(r*(ratio>1?ratio:1)));simH=Math.max(32,Math.round(r*(ratio<1?1/ratio:1)));let cap=gl.getParameter(gl.MAX_TEXTURE_SIZE);simW=Math.min(simW,cap,512);simH=Math.min(simH,cap,512);fields={velocity:[target(),target()],dye:[target(),target()],pressure:[target(),target()],div:target(),curl:target()};draw();status.textContent=`运行中 · ${simW} × ${simH} 网格`}function pass(prog,dest,textures={},uniforms={}){gl.useProgram(prog);gl.bindFramebuffer(gl.FRAMEBUFFER,dest?.f??null);gl.viewport(0,0,dest?simW:canvas.width,dest?simH:canvas.height);gl.uniform2f(gl.getUniformLocation(prog,'texel'),1/simW,1/simH);let unit=0;for(const [name,t] of Object.entries(textures)){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t.t);gl.uniform1i(gl.getUniformLocation(prog,name),unit++)}for(const [name,v] of Object.entries(uniforms)){const loc=gl.getUniformLocation(prog,name);if(Array.isArray(v)){if(v.length===2)gl.uniform2f(loc,...v);else gl.uniform3f(loc,...v)}else gl.uniform1f(loc,v)}gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}function swap(k){fields[k].reverse()}function draw(){if(ready)pass(programs.display,null,{dye:fields.dye[0]})}function splat(x,y,dx,dy,color){let aspect=simW/simH;pass(programs.splat,fields.velocity[1],{source:fields.velocity[0]},{point:[x,y],color:[dx,dy,0],radius:.0018,aspect});swap('velocity');pass(programs.splat,fields.dye[1],{source:fields.dye[0]},{point:[x,y],color,radius:.0018,aspect});swap('dye');draw()}function step(dt){pass(programs.advect,fields.velocity[1],{velocity:fields.velocity[0],source:fields.velocity[0]},{dt,decay:.12});swap('velocity');pass(programs.curl,fields.curl,{velocity:fields.velocity[0]});pass(programs.vorticity,fields.velocity[1],{velocity:fields.velocity[0],curl:fields.curl},{dt});swap('velocity');pass(programs.div,fields.div,{velocity:fields.velocity[0]});for(let i=0;i<Number($('#iterations').value);i++){pass(programs.pressure,fields.pressure[1],{pressure:fields.pressure[0],divergence:fields.div});swap('pressure')}pass(programs.project,fields.velocity[1],{pressure:fields.pressure[0],velocity:fields.velocity[0]});swap('velocity');pass(programs.advect,fields.dye[1],{velocity:fields.velocity[0],source:fields.dye[0]},{dt,decay:Number($('#dissipation').value)/100});swap('dye');draw()}function loop(t){requestAnimationFrame(loop);if(!ready){last=t;return}let dt=Math.min(.033,(t-last)/1000||.016);last=t;if(!paused)step(dt)}function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,1.5),w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;if(ready)try{rebuild()}catch(e){fail(e)}}}function fail(e){ready=false;error.style.display='grid';error.textContent='无法运行流体模拟：'+e.message+'。请使用支持 WebGL 2 和浮点渲染纹理的浏览器。';status.textContent='图形环境不可用'}function xy(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:1-(e.clientY-r.top)/r.height}}function color(){let c=$('#color').value;return[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)/255*1.5)}canvas.addEventListener('pointerdown',e=>{if(!ready||paused)return;e.preventDefault();pointer=xy(e);canvas.setPointerCapture(e.pointerId);splat(pointer.x,pointer.y,0,0,color())});canvas.addEventListener('pointermove',e=>{if(!pointer||paused||!ready)return;let p=xy(e),force=Number($('#force').value);splat(p.x,p.y,(p.x-pointer.x)*force,(p.y-pointer.y)*force,color());pointer=p});canvas.addEventListener('pointerup',()=>pointer=null);canvas.addEventListener('pointercancel',()=>pointer=null);function labels(){$('#forceValue').value=$('#force').value;$('#dissipationValue').value=$('#dissipation').value+'%';$('#iterationsValue').value=$('#iterations').value}for(const id of ['force','dissipation','iterations'])$('#'+id).oninput=labels;$('#pause').onclick=()=>{if(!ready)return;paused=!paused;pointer=null;$('#pause').textContent=paused?'继续':'暂停';status.textContent=paused?'已暂停':`运行中 · ${simW} × ${simH} 网格`};$('#clear').onclick=()=>{if(ready)rebuild()};$('#resolution').onchange=()=>{if(ready)rebuild()};$('#reset').onclick=()=>{$('#color').value='#66e5e2';$('#force').value=12;$('#dissipation').value=8;$('#iterations').value=20;$('#resolution').value=128;paused=false;$('#pause').textContent='暂停';labels();if(ready)rebuild()};$('#save').onclick=()=>{if(!ready)return;draw();let a=document.createElement('a');a.download='fluid.png';a.href=canvas.toDataURL('image/png');a.click()};try{gl=canvas.getContext('webgl2',{alpha:false,preserveDrawingBuffer:true});if(!gl)throw Error('未找到 WebGL 2');if(!gl.getExtension('EXT_color_buffer_float'))throw Error('缺少 EXT_color_buffer_float');quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);initPrograms();resize();ready=true;rebuild();splat(.42,.55,.12,.04,[.15,.8,1]);splat(.58,.48,-.1,-.03,[.9,.2,.55]);window.addEventListener('resize',resize);canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();fail(Error('WebGL 上下文丢失，请刷新页面'))});requestAnimationFrame(loop)}catch(e){fail(e)}labels()})();
</script></body></html>
