<script src="../../../../assets/analytics.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;background:#090d16;color:#dce4f2;font:14px system-ui}main{max-width:1500px;margin:auto;padding:26px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:24px}h1{font-weight:400;letter-spacing:6px;margin:5px 0;font-size:32px}small{font-size:11px;letter-spacing:3px;color:#828ca3}.layout{display:grid;grid-template-columns:1fr 260px;gap:20px}.stage{position:relative;min-width:0;border:1px solid #252d40;border-radius:14px;overflow:hidden;background:#02040a}canvas{width:100%;height:650px;display:block;touch-action:none;cursor:crosshair}.stage-caption{pointer-events:none;position:absolute;left:22px;bottom:24px;line-height:1.8;color:#b8c3dc;font-size:12px}.stage-caption b{font-size:18px;color:white;font-weight:400}aside{border:1px solid #252d40;border-radius:14px;padding:22px;background:#111724}h2{font-size:13px;letter-spacing:2px;font-weight:500;margin:0 0 18px}label{display:block;font-size:12px;margin:20px 0 8px;color:#aeb9ce}label output{float:right;color:#f2d7ff}input[type=range],select{width:100%;accent-color:#b291ef}select,button{font:inherit;border:1px solid #354057;border-radius:7px;background:#182134;color:#e5dff5;padding:10px;cursor:pointer}input[type=color]{width:100%;height:38px;padding:2px;border:1px solid #354057;background:#182134;border-radius:7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}.primary{background:#c0a3f0;color:#211535;border-color:#c0a3f0}#error{display:none;position:absolute;inset:0;background:#0e1525ee;place-content:center;padding:30px;line-height:1.9;color:#ffc4b1}.footer{display:flex;justify-content:space-between;gap:15px;font-size:12px;color:#7f8da8;line-height:1.9;margin-top:18px}#status{font-size:12px;color:#bdccdb;line-height:1.8;margin-top:18px}button:hover{filter:brightness(1.2)}@media(max-width:800px){main{padding:15px}.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}aside>div{min-width:0}canvas{height:430px}h1{font-size:26px}.footer{display:block}.stage-caption{left:15px;bottom:16px}label{margin-top:12px}.actions{margin-top:8px}}</style>
<main><header><div><small>FLUID STUDIES / EXPERIMENT 04</small><h1>CHROMA</h1><span style="color:#8a96af">让颜色，随你的指尖流动。</span></div><button id="shot">↓ 保存瞬间</button></header><div class="layout"><section class="stage"><canvas id="fluid" aria-label="拖动注入颜色与动量的 WebGL 流体画布"></canvas><div class="stage-caption"><b>触碰，留下涟漪。</b><br>拖动注入染料与动量 · 松开后观察流场演化</div><div id="error" role="alert"></div></section><aside><div><h2>流场控制</h2><label for="color">染料颜色</label><input id="color" type="color" value="#a761ff"><label for="force">注入力度 <output id="forceVal"></output></label><input id="force" type="range" min="5" max="100" value="45"><label for="fade">染料消散 / 秒 <output id="fadeVal"></output></label><input id="fade" type="range" min="0" max="100" value="12"></div><div><label for="iterations">压力迭代 <output id="iterationsVal"></output></label><input id="iterations" type="range" min="8" max="70" value="28"><label for="resolution">模拟长边分辨率</label><select id="resolution"><option>96</option><option selected>160</option><option>256</option></select><div class="actions"><button id="pause" class="primary">Ⅱ 暂停</button><button id="clear">清空</button><button id="reset">重置参数</button><button id="burst">注入色团</button></div><div id="status" role="status">正在检查 WebGL 2 与浮点纹理……</div></div></aside></div><div class="footer"><span>计算流程：速度平流 → 动量注入 → 散度 → Jacobi 压力迭代 → 速度投影 → 染料平流</span><span>GPU / 二维不可压缩流体 · 半浮点纹理</span></div></main>
<script>
const $=s=>document.querySelector(s),canvas=$('#fluid');let gl,ready=false,paused=false,lost=false,fields={},programs={},width=0,height=0,frames=0;
function fail(message){$('#error').style.display='grid';$('#error').textContent=message;$('#status').textContent='模拟不可用';document.querySelectorAll('aside button, aside input, aside select, #shot').forEach(b=>b.disabled=true)}
const vertex=`#version 300 es
precision highp float;out vec2 uv;void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));uv=p;gl_Position=vec4(p*2.-1.,0.,1.);}`;
const common=`#version 300 es
precision highp float;in vec2 uv;out vec4 outColor;uniform sampler2D src,velocity,pressure;uniform vec2 texel;uniform float dt;
vec4 bilerp(sampler2D t,vec2 p){vec2 size=vec2(textureSize(t,0));vec2 q=p*size-.5;vec2 f=fract(q);ivec2 i=ivec2(floor(q)),maxp=ivec2(size)-1;return mix(mix(texelFetch(t,clamp(i,ivec2(0),maxp),0),texelFetch(t,clamp(i+ivec2(1,0),ivec2(0),maxp),0),f.x),mix(texelFetch(t,clamp(i+ivec2(0,1),ivec2(0),maxp),0),texelFetch(t,clamp(i+ivec2(1,1),ivec2(0),maxp),0),f.x),f.y);}
`;
const sources={
advect:`uniform float decay;void main(){vec2 v=texture(velocity,uv).xy;outColor=bilerp(src,uv-dt*v*texel)*exp(-decay*dt);}`,
splat:`uniform vec2 point;uniform vec3 amount;uniform float aspect;void main(){vec2 p=uv-point;p.x*=aspect;float a=exp(-dot(p,p)/.0015);outColor=texture(src,uv)+vec4(amount*a,0.);}`,
divergence:`void main(){vec2 v=texture(src,uv).xy;float L=texture(src,uv-vec2(texel.x,0)).x,R=texture(src,uv+vec2(texel.x,0)).x,B=texture(src,uv-vec2(0,texel.y)).y,T=texture(src,uv+vec2(0,texel.y)).y;if(uv.x<texel.x)L=-v.x;if(uv.x>1.-texel.x)R=-v.x;if(uv.y<texel.y)B=-v.y;if(uv.y>1.-texel.y)T=-v.y;outColor=vec4(.5*(R-L+T-B),0,0,1);}`,
jacobi:`void main(){float L=texture(pressure,uv-vec2(texel.x,0)).x,R=texture(pressure,uv+vec2(texel.x,0)).x,B=texture(pressure,uv-vec2(0,texel.y)).x,T=texture(pressure,uv+vec2(0,texel.y)).x;outColor=vec4((L+R+B+T-texture(src,uv).x)*.25,0,0,1);}`,
project:`void main(){float L=texture(pressure,uv-vec2(texel.x,0)).x,R=texture(pressure,uv+vec2(texel.x,0)).x,B=texture(pressure,uv-vec2(0,texel.y)).x,T=texture(pressure,uv+vec2(0,texel.y)).x;vec2 v=texture(src,uv).xy-.5*vec2(R-L,T-B);if(uv.x<texel.x||uv.x>1.-texel.x)v.x=0.;if(uv.y<texel.y||uv.y>1.-texel.y)v.y=0.;outColor=vec4(v,0,1);}`,
display:`void main(){vec3 c=max(bilerp(src,uv).rgb,vec3(0));c=1.-exp(-c*1.1);c=pow(c,vec3(.8));outColor=vec4(c+vec3(.004,.007,.018),1);}`};
function compile(type,source){const sh=gl.createShader(type);gl.shaderSource(sh,source);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){const info=gl.getShaderInfoLog(sh);gl.deleteShader(sh);throw Error(info)}return sh}
function makeProgram(source){const vs=compile(gl.VERTEX_SHADER,vertex),fs=compile(gl.FRAGMENT_SHADER,common+source),p=gl.createProgram();gl.attachShader(p,vs);gl.attachShader(p,fs);gl.linkProgram(p);gl.deleteShader(vs);gl.deleteShader(fs);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));const uniforms={};for(let i=0;i<gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);i++){const u=gl.getActiveUniform(p,i);uniforms[u.name]=gl.getUniformLocation(p,u.name)}return {p,uniforms}}
function target(){const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,width,height,0,gl.RGBA,gl.HALF_FLOAT,null);const fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,texture,0);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE){gl.deleteFramebuffer(fbo);gl.deleteTexture(texture);throw Error('设备不支持可渲染的 RGBA16F 纹理。')}gl.viewport(0,0,width,height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);return {texture,fbo}}
function disposeFields(){for(const value of Object.values(fields))for(const t of Array.isArray(value)?value:[value]){gl.deleteTexture(t.texture);gl.deleteFramebuffer(t.fbo)}fields={}}
function rebuild(){disposeFields();const r=canvas.getBoundingClientRect(),n=Number($('#resolution').value);if(r.width>=r.height){width=n;height=Math.max(32,Math.round(n*r.height/r.width))}else{height=n;width=Math.max(32,Math.round(n*r.width/r.height))}fields={v:[target(),target()],d:[target(),target()],p:[target(),target()],div:target()};$('#status').textContent=`WebGL 2 就绪 · ${width} × ${height} 网格 · 拖动开始创作`;}
function renderPass(name,target,values={}){const p=programs[name];gl.useProgram(p.p);gl.bindFramebuffer(gl.FRAMEBUFFER,target?.fbo||null);gl.viewport(0,0,target?width:canvas.width,target?height:canvas.height);gl.uniform2f(p.uniforms.texel,1/width,1/height);let unit=0;for(const [key,value] of Object.entries(values)){const loc=p.uniforms[key];if(loc===undefined)continue;if(value?.texture){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,value.texture);gl.uniform1i(loc,unit++)}else if(Array.isArray(value)){if(value.length===2)gl.uniform2fv(loc,value);else gl.uniform3fv(loc,value)}else gl.uniform1f(loc,value)}gl.drawArrays(gl.TRIANGLES,0,3)}
function swap(key){fields[key].reverse()}
function splat(x,y,dx,dy,color){renderPass('splat',fields.v[1],{src:fields.v[0],point:[x,y],amount:[dx,dy,0],aspect:width/height});swap('v');renderPass('splat',fields.d[1],{src:fields.d[0],point:[x,y],amount:color,aspect:width/height});swap('d')}
function burst(){if(!ready)return;for(let i=0;i<6;i++){const a=i*Math.PI/3;splat(.5+Math.cos(a)*.18,.5+Math.sin(a)*.18,-Math.sin(a)*100,Math.cos(a)*100,[i%2?.2:1.5,i%3?.25:1.4,i%2?1.6:.35])}display()}
function clear(){if(!ready)return;for(const value of Object.values(fields))for(const t of Array.isArray(value)?value:[value]){gl.bindFramebuffer(gl.FRAMEBUFFER,t.fbo);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT)}display()}
function simulate(dt){renderPass('advect',fields.v[1],{src:fields.v[0],velocity:fields.v[0],dt,decay:.13});swap('v');renderPass('divergence',fields.div,{src:fields.v[0]});for(const p of fields.p){gl.bindFramebuffer(gl.FRAMEBUFFER,p.fbo);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT)}for(let i=0;i<Number($('#iterations').value);i++){renderPass('jacobi',fields.p[1],{src:fields.div,pressure:fields.p[0]});swap('p')}renderPass('project',fields.v[1],{src:fields.v[0],pressure:fields.p[0]});swap('v');renderPass('advect',fields.d[1],{src:fields.d[0],velocity:fields.v[0],dt,decay:Number($('#fade').value)/100});swap('d');frames++}
function display(){if(ready)renderPass('display',null,{src:fields.d[0]})}
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.min(1600,Math.round(r.width*d));canvas.height=Math.min(1200,Math.round(r.height*d));if(ready){rebuild();display()}}
function outputs(){for(const id of ['force','fade','iterations'])$('#'+id+'Val').textContent=id==='fade'?(Number($('#fade').value)/100).toFixed(2):$('#'+id).value}
let pointer=null;function uv(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width,y:1-(e.clientY-r.top)/r.height}}
canvas.onpointerdown=e=>{if(!ready||paused)return;canvas.setPointerCapture(e.pointerId);pointer={...uv(e),id:e.pointerId};const hex=$('#color').value;splat(pointer.x,pointer.y,0,0,[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255*1.5));display()};canvas.onpointermove=e=>{if(!pointer||e.pointerId!==pointer.id||paused||!ready)return;const p=uv(e),hex=$('#color').value,f=Number($('#force').value);splat(p.x,p.y,Math.max(-1000,Math.min(1000,(p.x-pointer.x)*width*f)),Math.max(-1000,Math.min(1000,(p.y-pointer.y)*height*f)),[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255*1.5));pointer={...p,id:e.pointerId};display()};canvas.onpointerup=canvas.onpointercancel=()=>pointer=null;
$('#pause').onclick=()=>{paused=!paused;pointer=null;$('#pause').textContent=paused?'▶ 继续':'Ⅱ 暂停';$('#status').textContent=paused?'已暂停：画面停止演化。':'流场继续演化。'};$('#clear').onclick=clear;$('#burst').onclick=burst;$('#resolution').onchange=()=>{if(ready){rebuild();display()}};for(const id of ['force','fade','iterations'])$('#'+id).oninput=outputs;$('#reset').onclick=()=>{$('#force').value=45;$('#fade').value=12;$('#iterations').value=28;$('#resolution').value='160';$('#color').value='#a761ff';paused=false;$('#pause').textContent='Ⅱ 暂停';outputs();if(ready){rebuild();burst()}};$('#shot').onclick=()=>{if(!ready)return;display();const a=document.createElement('a');a.download='chroma-fluid.png';a.href=canvas.toDataURL('image/png');a.click()};canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();ready=false;lost=true;fail('WebGL 上下文丢失。请重新加载页面以重建 GPU 资源。')});addEventListener('resize',resize);addEventListener('pagehide',()=>{if(gl&&!lost){disposeFields();Object.values(programs).forEach(p=>gl.deleteProgram(p.p))}ready=false});
try{gl=canvas.getContext('webgl2',{alpha:false,preserveDrawingBuffer:true,antialias:false});if(!gl)throw Error('此浏览器不支持 WebGL 2。请使用支持 WebGL 2 的浏览器并开启图形加速。');if(!gl.getExtension('EXT_color_buffer_float'))throw Error('设备缺少 EXT_color_buffer_float，无法计算浮点流场。');for(const [name,source] of Object.entries(sources))programs[name]=makeProgram(source);resize();rebuild();ready=true;burst()}catch(e){fail('无法启动流体模拟：'+e.message)}outputs();let last=performance.now();function frame(t){const dt=Math.min(1/30,Math.max(1/240,(t-last)/1000));last=t;if(ready&&!document.hidden){if(!paused)simulate(dt);display()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.lab={clear,burst,simulate,get state(){return {ready,paused,frames,width,height,gl,fields}},readDye(){const a=new Float32Array(width*height*4);gl.bindFramebuffer(gl.FRAMEBUFFER,fields.d[0].fbo);gl.readPixels(0,0,width,height,gl.RGBA,gl.FLOAT,a);return a}};
</script></html>
