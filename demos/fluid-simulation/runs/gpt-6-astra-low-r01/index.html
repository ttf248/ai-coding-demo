<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>色流 · 流体实验台</title><style>*{box-sizing:border-box}body{margin:0;background:#090c16;color:#e5e6f4;font:15px system-ui}main{max-width:1320px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:32px;margin:8px 0}small{letter-spacing:4px;color:#ba9aff}p{color:#a7aec5;line-height:1.7}.layout{display:grid;grid-template-columns:250px 1fr;gap:18px;margin-top:20px}aside{background:#131827;border:1px solid #2a3248;padding:18px;border-radius:12px}label{display:block;margin:0 0 20px;color:#c2c9dc}label span{display:flex;justify-content:space-between;margin-bottom:10px}input[type=range],select{width:100%;accent-color:#b699ff}input[type=color]{width:100%;height:36px;background:none;border:0}button,select{padding:10px;border:1px solid #414965;border-radius:6px;background:#202840;color:#e5e6f4}button{cursor:pointer}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.primary{background:#7052ad}canvas{display:block;width:100%;height:590px;touch-action:none;border:1px solid #2a3248;border-radius:12px;background:#080c14}#status{min-height:24px;color:#b8a4e5;line-height:1.6}.note{font-size:13px}@media(max-width:700px){main{padding:12px}header{display:block}.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}label{margin:0}canvas{height:430px}h1{font-size:26px}}</style><main><header><div><small>COLOR IN MOTION</small><h1>色流 · 流体实验台</h1></div><p>指尖赋予速度，色彩留下轨迹。</p></header><div class="layout"><aside><label><span>染料颜色</span><input id="color" type="color" value="#9966ff"></label><label><span>注入力度 <output id="forceValue">32</output></span><input id="force" type="range" min="1" max="80" value="32"></label><label><span>染料消散 / 秒 <output id="fadeValue">0.18</output></span><input id="fade" type="range" min="0" max="2" step="0.01" value="0.18"></label><label><span>压力迭代 <output id="iterationsValue">30</output></span><input id="iterations" type="range" min="5" max="80" value="30"></label><label><span>模拟分辨率 · 长边</span><select id="resolution"><option value="96">96 · 节能</option><option value="160" selected>160 · 均衡</option><option value="256">256 · 精细</option></select></label><p class="note">二维不可压流体近似：速度与染料平流、散度、Jacobi 压力求解、速度投影。拖动改变流向；更换颜色可混色。</p></aside><div><canvas id="fluid" aria-label="拖动注入染料与速度"></canvas><div class="buttons"><button id="pause" class="primary">暂停</button><button id="clear">清空</button><button id="reset">重置参数</button><button id="shot">PNG 截图</button></div><div id="status" role="status">正在初始化 WebGL 2…</div><p class="note">鼠标或手指拖动注入。暂停时停止计算与注入。分辨率或窗口尺寸改变后重新分配并清空模拟；像素比上限为 2。</p></div></div></main><script>
const $=id=>document.getElementById(id),canvas=$('fluid');let gl,programs={},resources=[],velocity,dye,pressure,divergence,sw,sh,paused=false,lost=false,last=0,pointers=new Map(),injections=[];const vertex=`#version 300 es
in vec2 position;out vec2 uv;void main(){uv=position*.5+.5;gl_Position=vec4(position,0.,1.);}`;const prefix=`#version 300 es
precision highp float;in vec2 uv;out vec4 outColor;uniform sampler2D source;uniform sampler2D flow;uniform sampler2D aux;uniform vec2 texel;uniform float dt;uniform float decay;uniform vec2 point;uniform vec3 amount;uniform float aspect;
vec4 bilerp(sampler2D s,vec2 p){vec2 q=p/texel-.5;vec2 i=floor(q),f=fract(q);vec2 b=(i+.5)*texel;return mix(mix(texture(s,b),texture(s,b+vec2(texel.x,0)),f.x),mix(texture(s,b+vec2(0,texel.y)),texture(s,b+texel),f.x),f.y);}
`;
const shaders={advect:`void main(){vec2 v=texture(flow,uv).xy;outColor=bilerp(source,clamp(uv-dt*v*texel,.5*texel,1.-.5*texel))*exp(-decay*dt);}`,splat:`void main(){vec2 d=uv-point;d.x*=aspect;float k=exp(-dot(d,d)/.00065);outColor=texture(source,uv)+vec4(amount*k,0.);}`,div:`void main(){float l=texture(source,uv-vec2(texel.x,0)).x,r=texture(source,uv+vec2(texel.x,0)).x,b=texture(source,uv-vec2(0,texel.y)).y,t=texture(source,uv+vec2(0,texel.y)).y;vec2 v=texture(source,uv).xy;if(uv.x<texel.x)l=-v.x;if(uv.x>1.-texel.x)r=-v.x;if(uv.y<texel.y)b=-v.y;if(uv.y>1.-texel.y)t=-v.y;outColor=vec4(.5*(r-l+t-b),0,0,1);}`,pressure:`void main(){float l=texture(source,uv-vec2(texel.x,0)).x,r=texture(source,uv+vec2(texel.x,0)).x,b=texture(source,uv-vec2(0,texel.y)).x,t=texture(source,uv+vec2(0,texel.y)).x;outColor=vec4((l+r+b+t-texture(aux,uv).x)*.25,0,0,1);}`,project:`void main(){float l=texture(aux,uv-vec2(texel.x,0)).x,r=texture(aux,uv+vec2(texel.x,0)).x,b=texture(aux,uv-vec2(0,texel.y)).x,t=texture(aux,uv+vec2(0,texel.y)).x;vec2 v=texture(source,uv).xy-.5*vec2(r-l,t-b);if(uv.x<texel.x||uv.x>1.-texel.x)v.x=0.;if(uv.y<texel.y||uv.y>1.-texel.y)v.y=0.;outColor=vec4(v,0,1);}`,display:`void main(){vec3 col=max(bilerp(source,uv).rgb,vec3(0));col=1.-exp(-col*1.4);outColor=vec4(pow(col,vec3(.8))+vec3(.015,.02,.035),1);}`};
function message(s){$('status').textContent=s}function compile(type,src){let sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){let msg=gl.getShaderInfoLog(sh);gl.deleteShader(sh);throw Error(msg)}return sh}function program(fragment){let v=compile(gl.VERTEX_SHADER,vertex),f=compile(gl.FRAGMENT_SHADER,prefix+fragment),p=gl.createProgram();gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);gl.deleteShader(v);gl.deleteShader(f);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));let loc={};['source','flow','aux','texel','dt','decay','point','amount','aspect'].forEach(k=>loc[k]=gl.getUniformLocation(p,k));return{p,loc}}
function target(){let texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,sw,sh,0,gl.RGBA,gl.HALF_FLOAT,null);let fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,texture,0);let obj={texture,fbo};resources.push(obj);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('设备不支持可渲染半浮点纹理');return obj}function pair(){return{read:target(),write:target(),swap(){[this.read,this.write]=[this.write,this.read]}}}function release(){for(let r of resources){gl.deleteFramebuffer(r.fbo);gl.deleteTexture(r.texture)}resources=[]}
function allocate(){release();let ratio=canvas.clientWidth/canvas.clientHeight,res=+$('resolution').value;sw=Math.max(32,Math.round(ratio>=1?res:res*ratio));sh=Math.max(32,Math.round(ratio>=1?res/ratio:res));velocity=pair();dye=pair();pressure=pair();divergence=target();clear();message(`WebGL 2 · ${sw} × ${sh} 网格 · RGBA16F · 拖动开始注入`)}
function pass(name,dest,bindings={},values={}){let p=programs[name];gl.useProgram(p.p);gl.bindFramebuffer(gl.FRAMEBUFFER,dest?.fbo||null);gl.viewport(0,0,dest?sw:canvas.width,dest?sh:canvas.height);gl.uniform2f(p.loc.texel,1/sw,1/sh);gl.uniform1f(p.loc.aspect,sw/sh);let n=0;for(let [key,t]of Object.entries(bindings)){gl.activeTexture(gl.TEXTURE0+n);gl.bindTexture(gl.TEXTURE_2D,t.texture);gl.uniform1i(p.loc[key],n++)}for(let [key,v]of Object.entries(values)){if(Array.isArray(v)){if(v.length===2)gl.uniform2fv(p.loc[key],v);else gl.uniform3fv(p.loc[key],v)}else gl.uniform1f(p.loc[key],v)}gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}function display(){pass('display',null,{source:dye.read})}function clear(){for(let r of resources){gl.bindFramebuffer(gl.FRAMEBUFFER,r.fbo);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT)}injections=[];if(dye)display()}
function splat(p){let hex=$('color').value,col=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255);pass('splat',velocity.write,{source:velocity.read},{point:[p.x,p.y],amount:[p.dx*sw*+$('force').value,p.dy*sh*+$('force').value,0]});velocity.swap();pass('splat',dye.write,{source:dye.read},{point:[p.x,p.y],amount:col.map(v=>v*.7)});dye.swap()}
function simulate(dt){for(let p of injections)splat(p);injections=[];pass('advect',velocity.write,{source:velocity.read,flow:velocity.read},{dt,decay:.12});velocity.swap();pass('div',divergence,{source:velocity.read});for(let r of [pressure.read,pressure.write]){gl.bindFramebuffer(gl.FRAMEBUFFER,r.fbo);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT)}for(let i=0;i<+$('iterations').value;i++){pass('pressure',pressure.write,{source:pressure.read,aux:divergence});pressure.swap()}pass('project',velocity.write,{source:velocity.read,aux:pressure.read});velocity.swap();pass('advect',dye.write,{source:dye.read,flow:velocity.read},{dt,decay:+$('fade').value});dye.swap();display()}
function frame(t){if(lost)return;let dt=Math.min(.025,(t-last)/1000||.016);last=t;if(!paused)simulate(dt);requestAnimationFrame(frame)}function resize(){if(!gl||lost)return;let d=Math.min(devicePixelRatio,2);canvas.width=Math.round(canvas.clientWidth*d);canvas.height=Math.round(canvas.clientHeight*d);try{allocate()}catch(e){fail(e)}}function fail(e){lost=true;message('无法运行流体模拟：'+e.message+'。请使用支持 WebGL 2 和浮点颜色缓冲的浏览器与设备。');document.querySelectorAll('button,input,select').forEach(el=>el.disabled=true);if(gl)release()}
function position(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:1-(e.clientY-r.top)/r.height}}canvas.onpointerdown=e=>{if(paused||lost)return;let p=position(e);pointers.set(e.pointerId,p);injections.push({...p,dx:0,dy:0});canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{let old=pointers.get(e.pointerId);if(!old||paused||lost)return;let p=position(e),dx=p.x-old.x,dy=p.y-old.y;let steps=Math.min(20,Math.max(1,Math.ceil(Math.hypot(dx,dy)*70)));for(let i=1;i<=steps;i++)injections.push({x:old.x+dx*i/steps,y:old.y+dy*i/steps,dx:dx/steps,dy:dy/steps});if(injections.length>160)injections=injections.slice(-160);pointers.set(e.pointerId,p)};canvas.onpointerup=canvas.onpointercancel=e=>pointers.delete(e.pointerId);
for(let id of ['force','fade','iterations'])$(id).oninput=()=>$(id+'Value').value=$(id).value;$('pause').onclick=()=>{paused=!paused;pointers.clear();injections=[];$('pause').textContent=paused?'继续':'暂停';message(paused?'已暂停 · 场与画面停止演化':'模拟运行中 · 拖动注入')};$('clear').onclick=()=>{clear();message('速度、染料与压力已清空')};$('resolution').onchange=resize;$('reset').onclick=()=>{$('color').value='#9966ff';for(let[id,v]of [['force',32],['fade',.18],['iterations',30]]){$(id).value=v;$(id+'Value').value=v}$('resolution').value='160';resize();message('参数已重置，模拟已清空')};$('shot').onclick=()=>{display();let a=document.createElement('a');a.download='色流.png';a.href=canvas.toDataURL('image/png');a.click();message('当前流体画面已导出 PNG')};canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();lost=true;message('WebGL 上下文丢失，请刷新页面重新初始化。')});window.addEventListener('resize',resize);
try{gl=canvas.getContext('webgl2',{alpha:false,preserveDrawingBuffer:true,antialias:false});if(!gl)throw Error('WebGL 2 不可用');if(!gl.getExtension('EXT_color_buffer_float'))throw Error('EXT_color_buffer_float 扩展不可用');for(let[name,src]of Object.entries(shaders))programs[name]=program(src);let buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);let vao=gl.createVertexArray();gl.bindVertexArray(vao);for(let p of Object.values(programs)){let loc=gl.getAttribLocation(p.p,'position');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0)}resize();if(!lost)requestAnimationFrame(frame);window.addEventListener('pagehide',()=>{lost=true;release();Object.values(programs).forEach(p=>gl.deleteProgram(p.p));gl.deleteBuffer(buffer);gl.deleteVertexArray(vao)})}catch(e){fail(e)}
