<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>新哥特式塔楼城市 · 3D 漫游</title>
<style>
*{box-sizing:border-box}

#title{position:absolute;left:14px;top:12px;padding:10px 14px;max-width:min(430px,calc(100vw - 28px))}
#title h1{margin:0;font-size:18px;letter-spacing:2px;color:#f1d9a0}

#todo{margin-top:6px;font-size:12px;color:#ffcf8a}
#bar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 20px)}
button{font:inherit;font-size:13px;background:#3a2c18;color:#f6e2b3;border:1px solid #a98a4c;border-radius:6px;padding:7px 12px;cursor:pointer;min-height:36px}
button.on{background:#8a5a1c}
label{font-size:12px;display:flex;align-items:center;gap:6px}
input[type=range]{width:110px}
#pad{position:absolute;right:12px;bottom:92px;display:none;gap:8px;flex-direction:column;pointer-events:auto}
#pad button{width:52px;height:44px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05060d;font-size:15px;color:#d8c690;z-index:9;text-align:center;padding:20px;line-height:1.8}
#hud{position:absolute;right:14px;top:12px;padding:6px 10px;font-size:11px;color:#c9c2b0}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="load">正在构建新哥特式塔楼城市……<br><small>（需要联网加载 Three.js r160）</small></div>
<canvas id="cv"></canvas>
<div id="ui">
<div id="title" class="box"><h1>新哥特式塔楼城市</h1>
<p>1 单位 = 1 米：中央大教堂尖塔 ≈ 205 m，环城塔楼 55–150 m，城墙高 16 m。拖动环视，WASD / QE 移动。</p>
<div id="todo">待确认：未指定真实原型，本城为程序化新哥特风格；真实比例以典型哥特教堂/塔楼高度设定，非特定地标复刻。</div></div>
<div id="hud" class="box"><span id="fps">—</span></div>
<div id="bar" class="box">
<button id="mode" class="on">自动运镜</button>
<label>昼夜 <input id="night" type="range" min="0" max="1" step="0.01" value="0.55"></label>

</div>
<script type="module">
const loadEl=document.getElementById("load");
let THREE;
try{THREE=await import("three");}catch(e){
  loadEl.innerHTML="待确认：Three.js 库加载失败（需要联网访问 unpkg.com）。<br>页面其余部分无法渲染，请联网后刷新。";
  throw e;
}
const $=id=>document.getElementById(id);
const cv=$("cv");
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:"high-performance"});}
catch(e){loadEl.innerHTML="待确认：当前环境不支持 WebGL，无法显示 3D 场景。";throw e;}
const DPR=Math.min(devicePixelRatio||1,2);
renderer.setPixelRatio(DPR);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x4a3048,0.00075);
const camera=new THREE.PerspectiveCamera(58,1,1,9000);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();pxScale=h*DPR/(2*Math.tan(camera.fov*Math.PI/360));for(const m of pointMats)m.uniforms.uScale.value=pxScale;}
let pxScale=1;const pointMats=[];

/* ---------- seeded rng ---------- */
function rng(a){return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
const R=rng(20240611);
const rr=(a,b)=>a+(b-a)*R();

/* ---------- terrain ---------- */
const PLATEAU=14;
function smoothstep(a,b,x){const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);}
function groundY(x,z){const r=Math.hypot(x,z);const n=Math.sin(x*0.03)*Math.cos(z*0.025)*1.5+Math.sin(x*0.11+z*0.07)*0.5;
  return PLATEAU*(1-smoothstep(262,335,r))+n*(1-smoothstep(262,335,r))*0.8-4*smoothstep(300,420,r);}
{
  const g=new THREE.PlaneGeometry(900,900,180,180);g.rotateX(-Math.PI/2);
  const pos=g.attributes.position,col=new Float32Array(pos.count*3);
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i),y=groundY(x,z);pos.setY(i,y);
    const r=Math.hypot(x,z);let c=new THREE.Color();
    if(y<1.2)c.set(0xb7a77d);else if(r>250)c.set(0x4b4a46);else c.set(0x3b4a33).lerp(new THREE.Color(0x5d5a50),smoothstep(60,220,r)*0.7);
    col.set([c.r,c.g,c.b],i*3);}
  g.setAttribute("color",new THREE.BufferAttribute(col,3));g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95}));m.receiveShadow=true;scene.add(m);
}

/* ---------- sky ---------- */
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{uNight:{value:0.55},uSun:{value:new THREE.Vector3(0.6,0.08,-0.5).normalize()},uMoon:{value:new THREE.Vector3(-0.5,0.5,0.4).normalize()}},
  vertexShader:"varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
  fragmentShader:`varying vec3 vD;uniform float uNight;uniform vec3 uSun;uniform vec3 uMoon;
  float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  void main(){vec3 d=normalize(vD);float h=max(d.y,0.);
   vec3 dusk=mix(vec3(1.0,0.45,0.2),mix(vec3(0.6,0.25,0.42),vec3(0.07,0.09,0.28),smoothstep(0.1,0.6,h)),smoothstep(0.0,0.25,h));
   vec3 night=mix(vec3(0.08,0.1,0.22),vec3(0.008,0.015,0.06),smoothstep(0.0,0.5,h));
   vec3 c=mix(dusk,night,uNight);
   float s=max(dot(d,uSun),0.);c+=(pow(s,48.)*1.6+pow(s,6.)*0.25)*vec3(1.,0.55,0.25)*(1.-uNight);
   vec3 g=floor(d*260.);float st=step(0.9975,h21(g.xy+g.z*1.7));c+=st*uNight*smoothstep(0.03,0.3,d.y);
   float m=smoothstep(0.9975,0.9993,dot(d,uMoon));c+=m*vec3(0.95,0.95,0.85)*uNight*1.6+pow(max(dot(d,uMoon),0.),24.)*vec3(0.25,0.3,0.45)*uNight;
   if(d.y<0.)c=mix(c,vec3(0.02,0.02,0.04),0.6);
   gl_FragColor=vec4(c,1.);}`});
const sky=new THREE.Mesh(new THREE.SphereGeometry(4500,32,16),skyMat);scene.add(sky);

/* ---------- lights ---------- */
const hemi=new THREE.HemisphereLight(0xffb27a,0x2a2036,0.9);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffa35e,2.2);sun.position.set(300,60,-250);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);const sc=sun.shadow.camera;sc.left=-340;sc.right=340;sc.top=340;sc.bottom=-340;sc.near=10;sc.far=1200;sun.shadow.bias=-0.0004;
scene.add(sun);scene.add(sun.target);
const moonL=new THREE.DirectionalLight(0x7f9bff,0.0);moonL.position.set(-250,260,200);scene.add(moonL);
const fireLights=[];
for(const p of [[0,40,-95],[70,30,70],[-80,30,60],[120,28,-20]]){const l=new THREE.PointLight(0xff7a2a,0,260,1.6);l.position.set(...p);scene.add(l);fireLights.push(l);}

/* ---------- textures ---------- */
function stoneTex(lit,seed){
  const r=rng(seed),c=document.createElement("canvas");c.width=128;c.height=256;const x=c.getContext("2d");
  if(lit){x.fillStyle="#000";x.fillRect(0,0,128,256);}
  else{x.fillStyle="#6a655d";x.fillRect(0,0,128,256);
    for(let i=0;i<500;i++){const v=90+r()*60|0;x.fillStyle=`rgba(${v},${v-4},${v-10},0.25)`;x.fillRect(r()*128,r()*256,r()*14+2,r()*6+2);}
    x.strokeStyle="rgba(30,28,26,.35)";for(let y=0;y<256;y+=16){x.beginPath();x.moveTo(0,y);x.lineTo(128,y);x.stroke();}}
  for(let row=0;row<4;row++){for(const cx of [32,96]){const w=18,top=18+row*62,h=36;
    const on=r()<0.55;
    x.beginPath();x.moveTo(cx-w/2,top+h);x.lineTo(cx-w/2,top+8);x.quadraticCurveTo(cx-w/2,top,cx,top-8);x.quadraticCurveTo(cx+w/2,top,cx+w/2,top+8);x.lineTo(cx+w/2,top+h);x.closePath();
    if(lit){if(on){const g=x.createLinearGradient(0,top-8,0,top+h);g.addColorStop(0,"#ffd9a0");g.addColorStop(1,"#ff9a3c");x.fillStyle=g;x.fill();x.fillStyle="#000";x.fillRect(cx-1,top-8,2,h+8);}}
    else{x.fillStyle="#14131a";x.fill();x.strokeStyle="#9a9285";x.lineWidth=2;x.stroke();}}}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;
}
const winMats=[];
function wallMat(rx,ry,seed){
  const map=stoneTex(false,seed),em=stoneTex(true,seed+9);
  for(const t of [map,em])t.repeat.set(rx,ry);
  const m=new THREE.MeshStandardMaterial({map,emissiveMap:em,emissive:0xffffff,emissiveIntensity:1.2,roughness:0.9,color:0xd8d2c6});
  winMats.push(m);return m;
}
const roofMat=new THREE.MeshStandardMaterial({color:0x2c3a4a,roughness:0.6,metalness:0.25,flatShading:true});
const stoneMat=new THREE.MeshStandardMaterial({color:0x8c867a,roughness:0.9});
const goldMat=new THREE.MeshStandardMaterial({color:0xd9b25a,metalness:0.8,roughness:0.35,emissive:0x553810,emissiveIntensity:0.6});

/* ---------- builders ---------- */
const flameSpots=[],beacons=[];
function shadowed(m,cast=true){m.castShadow=cast;m.receiveShadow=true;return m;}
function spire(g,r,h,y,seg=8){const s=shadowed(new THREE.Mesh(new THREE.ConeGeometry(r,h,seg),roofMat));s.rotation.y=Math.PI/seg;s.position.y=y+h/2;g.add(s);
  const f=new THREE.Mesh(new THREE.ConeGeometry(r*0.08+0.25,h*0.08,6),goldMat);f.position.y=y+h+h*0.03;g.add(f);return y+h*1.06;}
function pinnacle(g,x,y,z,r,h){const b=shadowed(new THREE.Mesh(new THREE.BoxGeometry(r*1.6,h*0.5,r*1.6),stoneMat));b.position.set(x,y+h*0.25,z);g.add(b);
  const c=shadowed(new THREE.Mesh(new THREE.ConeGeometry(r*1.1,h*0.7,4),roofMat));c.rotation.y=Math.PI/4;c.position.set(x,y+h*0.5+h*0.35,z);g.add(c);}
function tower(x,z,w,h,tiers,seed){
  const g=new THREE.Group(),gy=groundY(x,z)-1;g.position.set(x,gy,z);
  let y=0,cw=w;const th=h/tiers;
  for(let t=0;t<tiers;t++){
    const hh=th*(t===0?1.25:0.95);
    const m=shadowed(new THREE.Mesh(new THREE.BoxGeometry(cw,hh,cw),wallMat(Math.max(1,cw/7),Math.max(1,hh/18),seed+t)));m.position.y=y+hh/2;g.add(m);
    const cor=shadowed(new THREE.Mesh(new THREE.BoxGeometry(cw*1.12,1.6,cw*1.12),stoneMat));cor.position.y=y+hh;g.add(cor);
    const o=cw/2*1.05;for(const [sx,sz] of [[1,1],[1,-1],[-1,1],[-1,-1]])pinnacle(g,sx*o,y+hh+0.8,sz*o,Math.max(0.9,cw*0.06),Math.max(7,cw*0.55));
    y+=hh+1.6;cw*=0.82;
  }
  // buttresses
  const bh=h*0.34;for(const [dx,dz,ry] of [[1,0,0],[-1,0,0],[0,1,Math.PI/2],[0,-1,Math.PI/2]]){
    const b=shadowed(new THREE.Mesh(new THREE.BoxGeometry(w*0.2,bh,w*0.55),stoneMat));b.position.set(dx*(w/2+w*0.09),bh/2,dz*(w/2+w*0.09));b.rotation.y=ry;
    if(dx!==0)b.scale.set(1,1,1);g.add(b);}
  const top=spire(g,cw*0.62,h*0.45,y,8);
  flameSpots.push([x+w*0.6,gy+h*0.3+4,z+w*0.6,0.9],[x-w*0.6,gy+h*0.3+4,z-w*0.6,0.9]);
  beacons.push([x,gy+top,z]);
  scene.add(g);return g;
}
function cathedral(){
  const g=new THREE.Group(),gy=PLATEAU-1;g.position.set(0,gy,0);
  const nave=shadowed(new THREE.Mesh(new THREE.BoxGeometry(46,52,150),wallMat(7,3,77)));nave.position.y=26;g.add(nave);
  // gabled roof as prism
  const shape=new THREE.Shape();shape.moveTo(-24,0);shape.lineTo(0,30);shape.lineTo(24,0);shape.closePath();
  const rg=new THREE.ExtrudeGeometry(shape,{depth:152,bevelEnabled:false});rg.translate(0,0,-76);
  const rm=shadowed(new THREE.Mesh(rg,roofMat));rm.position.y=52;g.add(rm);
  // transept
  const tr=shadowed(new THREE.Mesh(new THREE.BoxGeometry(110,46,36),wallMat(6,2.5,88)));tr.position.set(0,23,-10);g.add(tr);
  const tg=new THREE.Shape();tg.moveTo(-19,0);tg.lineTo(0,24);tg.lineTo(19,0);tg.closePath();
  const trg=new THREE.ExtrudeGeometry(tg,{depth:112,bevelEnabled:false});trg.rotateY(Math.PI/2);trg.translate(-56,0,-10);
  const trm=shadowed(new THREE.Mesh(trg,roofMat));trm.position.y=46;g.add(trm);
  // flying buttresses
  for(const side of [-1,1])for(let i=-3;i<=3;i++){
    const zb=i*20+(i>0?-6:6);const p=shadowed(new THREE.Mesh(new THREE.BoxGeometry(3,40,4),stoneMat));p.position.set(side*30,20,zb);g.add(p);
    const arm=shadowed(new THREE.Mesh(new THREE.BoxGeometry(11,2.2,2.4),stoneMat));arm.position.set(side*25.5,38,zb);arm.rotation.z=side*0.35;g.add(arm);
    const pc=shadowed(new THREE.Mesh(new THREE.ConeGeometry(2.2,12,4),roofMat));pc.position.set(side*30,46,zb);pc.rotation.y=Math.PI/4;g.add(pc);
  }
  // rose window
  const rc=document.createElement("canvas");rc.width=rc.height=256;const x=rc.getContext("2d");x.fillStyle="#111";x.fillRect(0,0,256,256);
  const cols=["#d33","#e93","#38c","#3a6","#a4c","#ec3"];
  for(let i=0;i<16;i++){const a=i/16*Math.PI*2;x.fillStyle=cols[i%6];x.beginPath();x.moveTo(128,128);x.arc(128,128,118,a,a+Math.PI*2/16);x.fill();}
  x.strokeStyle="#222";x.lineWidth=6;for(let r=30;r<=118;r+=44){x.beginPath();x.arc(128,128,r,0,7);x.stroke();}
  x.fillStyle="#fc6";x.beginPath();x.arc(128,128,16,0,7);x.fill();
  const rt=new THREE.CanvasTexture(rc);rt.colorSpace=THREE.SRGBColorSpace;
  const rose=new THREE.Mesh(new THREE.CircleGeometry(12,32),new THREE.MeshBasicMaterial({map:rt}));rose.position.set(0,34,75.2);g.add(rose);
  const rose2=rose.clone();rose2.position.z=-75.2;rose2.rotation.y=Math.PI;g.add(rose2);
  // west towers + central spire
  for(const sx of [-1,1]){const w=24,h=120;
    const b=shadowed(new THREE.Mesh(new THREE.BoxGeometry(w,h,w),wallMat(3.4,7,101+sx)));b.position.set(sx*17,h/2,66);g.add(b);
    const c=shadowed(new THREE.Mesh(new THREE.BoxGeometry(w*1.12,2,w*1.12),stoneMat));c.position.set(sx*17,h+1,66);g.add(c);
    for(const [a,bz] of [[1,1],[1,-1],[-1,1],[-1,-1]])pinnacle(g,sx*17+a*w*0.55,h+2,66+bz*w*0.55,1.4,10);
    const s=shadowed(new THREE.Mesh(new THREE.ConeGeometry(w*0.62,58,8),roofMat));s.rotation.y=Math.PI/8;s.position.set(sx*17,h+2+29,66);g.add(s);
    const f=new THREE.Mesh(new THREE.ConeGeometry(0.9,5,6),goldMat);f.position.set(sx*17,h+2+60,66);g.add(f);
    beacons.push([sx*17,gy+h+64,66]);flameSpots.push([sx*17+14,gy+h*0.55,66+14,1.1]);}
  const ct=shadowed(new THREE.Mesh(new THREE.BoxGeometry(22,40,22),wallMat(3,3,120)));ct.position.set(0,52+40/2-6,-10);g.add(ct);
  const cs=shadowed(new THREE.Mesh(new THREE.ConeGeometry(13,112,8),roofMat));cs.rotation.y=Math.PI/8;cs.position.set(0,52+34+56,-10);g.add(cs);
  const cf=new THREE.Mesh(new THREE.ConeGeometry(1.2,9,6),goldMat);cf.position.set(0,52+34+116,-10);g.add(cf);
  beacons.push([0,gy+52+34+120,-10]);
  // corner turrets on the apse
  for(const [px,pz] of [[22,-72],[-22,-72],[0,-80]]){const t=shadowed(new THREE.Mesh(new THREE.CylinderGeometry(6,7,70,8),wallMat(3,3.5,150+px)));t.position.set(px,35,pz);g.add(t);
    const c=shadowed(new THREE.Mesh(new THREE.ConeGeometry(7.5,30,8),roofMat));c.position.set(px,85,pz);g.add(c);}
  flameSpots.push([30,gy+6,90,2.2],[-30,gy+6,90,2.2],[0,gy+6,110,3]);
  scene.add(g);
}
cathedral();
// ring towers
const ringPos=[];
for(let i=0;i<6;i++){const a=i/6*Math.PI*2+0.3,r=105;const x=Math.cos(a)*r,z=Math.sin(a)*r;ringPos.push([x,z]);tower(x,z,rr(18,24),rr(105,150),5,300+i*7);}
const ring2=[];
for(let i=0;i<14;i++){const a=i/14*Math.PI*2+0.1,r=175+rr(-8,8);const x=Math.cos(a)*r,z=Math.sin(a)*r;ring2.push([x,z]);tower(x,z,rr(12,17),rr(55,95),4,500+i*5);}
// bridges between ring-1 towers
for(let i=0;i<6;i++){const a=ringPos[i],b=ringPos[(i+1)%6];const dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz)-20;
  const br=shadowed(new THREE.Mesh(new THREE.BoxGeometry(len,3,5),stoneMat));br.position.set((a[0]+b[0])/2,PLATEAU+46,(a[1]+b[1])/2);br.rotation.y=-Math.atan2(dz,dx);scene.add(br);
  const arch=shadowed(new THREE.Mesh(new THREE.TorusGeometry(len*0.2,1.2,6,16,Math.PI),stoneMat));arch.position.copy(br.position);arch.position.y-=1.5;arch.rotation.y=br.rotation.y;arch.scale.set(1.2,0.5,1);scene.add(arch);}
// walls
{
  const N=72,r=258,wallG=new THREE.BoxGeometry(1,16,5),merlon=new THREE.BoxGeometry(1,3,1.6);
  const wm=new THREE.InstancedMesh(wallG,stoneMat,N),mm=new THREE.InstancedMesh(merlon,stoneMat,N*2),d=new THREE.Object3D();
  for(let i=0;i<N;i++){const a=i/N*Math.PI*2,x=Math.cos(a)*r,z=Math.sin(a)*r,len=2*Math.PI*r/N+0.6;
    d.position.set(x,groundY(x,z)+7,z);d.rotation.set(0,-a+Math.PI/2,0);d.scale.set(len,1,1);d.updateMatrix();wm.setMatrixAt(i,d.matrix);
    for(let k=0;k<2;k++){d.position.set(x,groundY(x,z)+16.5,z);d.scale.set(len*0.35,1,1);d.updateMatrix();
      const off=new THREE.Vector3(Math.cos(a+Math.PI/2),0,Math.sin(a+Math.PI/2)).multiplyScalar((k?0.25:-0.25)*len);d.position.add(off);d.updateMatrix();mm.setMatrixAt(i*2+k,d.matrix);}
    if(i%6===0)flameSpots.push([x,groundY(x,z)+18,z,0.55]);}
  wm.castShadow=wm.receiveShadow=true;mm.castShadow=true;scene.add(wm,mm);
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2+0.13,x=Math.cos(a)*r,z=Math.sin(a)*r;
    const t=shadowed(new THREE.Mesh(new THREE.CylinderGeometry(7,8,34,10),wallMat(3,2,700+i)));t.position.set(x,groundY(x,z)+15,z);scene.add(t);
    const c=shadowed(new THREE.Mesh(new THREE.ConeGeometry(9,20,10),roofMat));c.position.set(x,groundY(x,z)+40,z);scene.add(c);}
}
// houses
{
  const N=260,hw=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.9,map:stoneTex(false,41),emissiveMap:stoneTex(true,43),emissive:0xffffff,emissiveIntensity:1.0}),N);
  winMats.push(hw.material);
  const hr=new THREE.InstancedMesh(new THREE.ConeGeometry(0.75,1,4),roofMat,N),d=new THREE.Object3D();
  let n=0;const col=new THREE.Color();
  for(let tries=0;tries<2000&&n<N;tries++){
    const a=R()*Math.PI*2,r=rr(30,248),x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(Math.abs(x)<42&&Math.abs(z)<95&&r<105)continue; // cathedral footprint
    let bad=false;for(const p of ringPos)if(Math.hypot(x-p[0],z-p[1])<28){bad=true;break;}
    if(!bad)for(const p of ring2)if(Math.hypot(x-p[0],z-p[1])<22){bad=true;break;}
    if(bad)continue;
    const w=rr(8,14),h=rr(8,18),dd=rr(8,14),y=groundY(x,z)-0.5;
    d.position.set(x,y+h/2,z);d.rotation.set(0,rr(0,3.14),0);d.scale.set(w,h,dd);d.updateMatrix();hw.setMatrixAt(n,d.matrix);
    col.setHSL(0.08+R()*0.05,0.12,0.45+R()*0.2);hw.setColorAt(n,col);
    const rh=rr(10,20);d.position.set(x,y+h+rh/2,z);d.scale.set(w*1.45,rh,dd*1.45);d.updateMatrix();hr.setMatrixAt(n,d.matrix);
    n++;}
  hw.count=hr.count=n;hw.castShadow=hr.castShadow=true;hw.receiveShadow=true;scene.add(hw,hr);
}

/* ---------- sea ---------- */
const seaMat=new THREE.ShaderMaterial({transparent:false,fog:false,
  uniforms:{uT:{value:0},uNight:{value:0.55},uSky:{value:new THREE.Color(0x6a4668)},uSun:{value:new THREE.Vector3(0.6,0.08,-0.5).normalize()},uCam:{value:new THREE.Vector3()},uFog:{value:new THREE.Color(0x4a3048)},uFogD:{value:0.00075}},
  vertexShader:`uniform float uT;varying vec3 vW;varying float vH;
   float wv(vec2 p,vec2 d,float f,float s,float a){return a*sin(dot(p,d)*f+uT*s);}
   void main(){vec3 p=position;vec2 q=p.xz;
    float h=wv(q,vec2(1.,0.3),0.035,0.9,2.2)+wv(q,vec2(-0.6,1.),0.06,1.3,1.2)+wv(q,vec2(0.2,-1.),0.11,1.9,0.55)+wv(q,vec2(0.9,0.9),0.2,2.6,0.25);
    p.y+=h;vH=h;vec4 w=modelMatrix*vec4(p,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader:`uniform float uT,uNight,uFogD;uniform vec3 uSky,uSun,uCam,uFog;varying vec3 vW;varying float vH;
   float hs(vec2 p){return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5);}
   float nz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1,0)),f.x),mix(hs(i+vec2(0,1)),hs(i+1.),f.x),f.y);}
   void main(){vec2 p=vW.xz;
    vec3 n=normalize(vec3((nz(p*0.08+uT*0.08)-0.5)*0.5+(nz(p*0.5-uT*0.2)-0.5)*0.25,1.,(nz(p*0.09-uT*0.07+9.)-0.5)*0.5+(nz(p*0.45+uT*0.17)-0.5)*0.25));
    vec3 V=normalize(uCam-vW);float fr=pow(1.-max(dot(n,V),0.),4.);
    vec3 deep=mix(vec3(0.03,0.09,0.16),vec3(0.005,0.02,0.05),uNight),shal=mix(vec3(0.1,0.3,0.34),vec3(0.02,0.07,0.12),uNight);
    float r=length(p);float coast=1.-smoothstep(300.,420.,r);
    vec3 col=mix(deep,shal,coast*0.8);
    col=mix(col,uSky,fr*0.85);
    vec3 H=normalize(uSun+V);float spec=pow(max(dot(n,H),0.),90.)*(1.-uNight);col+=spec*vec3(1.,0.6,0.3)*2.;
    float foam=smoothstep(318.,330.,r)*(1.-smoothstep(330.,352.,r))*(0.5+0.5*sin(r*0.5-uT*1.4+nz(p*0.05)*6.))+smoothstep(1.2,2.8,vH)*0.35;
    foam*=smoothstep(0.35,0.7,nz(p*0.25+uT*0.1));
    col=mix(col,vec3(0.9,0.93,0.97)*mix(1.,0.35,uNight),clamp(foam,0.,1.)*0.8);
    float d=length(uCam-vW);float f=1.-exp(-uFogD*uFogD*d*d);col=mix(col,uFog,clamp(f,0.,1.));
    gl_FragColor=vec4(col,1.);}`});
const sea=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000,300,300).rotateX(-Math.PI/2),seaMat);sea.position.y=0.4;scene.add(sea);

/* ---------- particles ---------- */
function pointsFactory(count,build,fragCol,blend){
  const geo=new THREE.BufferGeometry(),base=new Float32Array(count*3),seed=new Float32Array(count),sc=new Float32Array(count);
  for(let i=0;i<count;i++){const o=build(i);base.set(o.p,i*3);seed[i]=R();sc[i]=o.s;}
  geo.setAttribute("position",new THREE.BufferAttribute(base,3));geo.setAttribute("aSeed",new THREE.BufferAttribute(seed,1));geo.setAttribute("aScale",new THREE.BufferAttribute(sc,1));
  const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:blend,fog:false,
    uniforms:{uT:{value:0},uScale:{value:pxScale},uAmt:{value:1},uNight:{value:0.55}},
    vertexShader:`attribute float aSeed;attribute float aScale;uniform float uT,uScale,uAmt;varying float vL;varying float vS;
     void main(){float life=fract(uT*${fragCol.speed}*(0.7+aSeed*0.6)+aSeed*7.);vec3 p=position;
      p.y+=life*aScale*${fragCol.rise};p.x+=sin(uT*2.+aSeed*40.)*${fragCol.sway}*life*aScale;p.z+=cos(uT*1.7+aSeed*31.)*${fragCol.sway}*life*aScale;
      ${fragCol.extra||""}
      vL=life;vS=aSeed;vec4 mv=viewMatrix*modelMatrix*vec4(p,1.);
      float vis=step(aSeed,uAmt);
      gl_PointSize=vis*max(1.,(${fragCol.size})*aScale*uScale/max(-mv.z,1.));gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying float vL;varying float vS;uniform float uNight,uT;
     void main(){vec2 c=gl_PointCoord-0.5;float d=length(c);if(d>0.5)discard;float a=smoothstep(0.5,0.0,d);
      ${fragCol.color}
      gl_FragColor=vec4(col,a*alpha);}`});
  pointMats.push(m);const pts=new THREE.Points(geo,m);pts.frustumCulled=false;scene.add(pts);return pts;
}
// fire
const fireStart=flameSpots.slice();
const fire=pointsFactory(fireStart.length*28,i=>{const f=fireStart[(i/28)|0];return {p:[f[0]+rr(-0.8,0.8)*f[3],f[1],f[2]+rr(-0.8,0.8)*f[3]],s:f[3]*(0.7+R()*0.6)};},
 {speed:"0.9",rise:"7.",sway:"0.5",size:"2.4*(1.-life*0.75)",
  color:"vec3 col=mix(vec3(1.,0.9,0.5),mix(vec3(1.,0.45,0.08),vec3(0.35,0.05,0.02),smoothstep(0.35,1.,vL)),smoothstep(0.1,0.55,vL));float alpha=(1.-vL)*(0.5+0.5*uNight+0.3);"},THREE.AdditiveBlending);
// embers drifting above city
const embers=pointsFactory(900,i=>{const a=R()*Math.PI*2,r=Math.sqrt(R())*230;return {p:[Math.cos(a)*r,PLATEAU+rr(5,60),Math.sin(a)*r],s:rr(20,70)};},
 {speed:"0.12",rise:"1.",sway:"0.6",size:"0.05",extra:"p.x+=mod(uT*6.+aSeed*400.,300.)-150.;",
  color:"vec3 col=vec3(1.,0.55,0.2);float alpha=sin(vL*3.1416)*(0.4+0.6*fract(vS*13.+uT));"},THREE.AdditiveBlending);
// sea spray along the shore
const spray=pointsFactory(1600,i=>{const a=R()*Math.PI*2,r=rr(318,345);return {p:[Math.cos(a)*r,1.5,Math.sin(a)*r],s:rr(1.5,4)};},
 {speed:"0.35",rise:"3.",sway:"1.2",size:"1.5",extra:"p.xz*=1.+life*0.02;",
  color:"vec3 col=mix(vec3(0.95,0.97,1.),vec3(0.5,0.55,0.7),uNight*0.7);float alpha=sin(vL*3.1416)*0.55;"},THREE.NormalBlending);
// beacons (glows)
const glowTex=(()=>{const c=document.createElement("canvas");c.width=c.height=64;const x=c.getContext("2d"),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,"rgba(255,255,255,1)");g.addColorStop(0.25,"rgba(255,255,255,.5)");g.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);})();
const beaconMat=new THREE.SpriteMaterial({map:glowTex,color:0xff5a30,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
const beaconSprites=beacons.map(p=>{const s=new THREE.Sprite(beaconMat);s.position.set(...p);s.scale.set(7,7,1);scene.add(s);return s;});
// clouds
{
  const c=document.createElement("canvas");c.width=c.height=128;const x=c.getContext("2d");const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,"rgba(255,255,255,.55)");g.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=g;x.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c);const cm=new THREE.SpriteMaterial({map:t,color:0xe08a6a,transparent:true,depthWrite:false,fog:false,opacity:0.5});
  window._clouds=[];for(let i=0;i<26;i++){const s=new THREE.Sprite(cm);const a=R()*6.28,r=rr(900,2200);s.position.set(Math.cos(a)*r,rr(260,520),Math.sin(a)*r);s.scale.set(rr(500,900),rr(120,200),1);scene.add(s);window._clouds.push(s);}
  window._cloudMat=cm;
}

/* ---------- camera control ---------- */
let auto=true;
const path=new THREE.CatmullRomCurve3([[330,90,0],[260,130,190],[60,200,300],[-170,125,260],[-320,85,60],[-250,170,-190],[-40,240,-310],[200,110,-250]].map(v=>new THREE.Vector3(...v)),true,"catmullrom",0.5);
const look=new THREE.Vector3(0,60,0);let tPath=0;
const keys={};let yaw=0,pitch=0;const free=new THREE.Vector3(0,60,260);
function syncFreeFromCamera(){const d=new THREE.Vector3();camera.getWorldDirection(d);yaw=Math.atan2(-d.x,-d.z);pitch=Math.asin(d.y);free.copy(camera.position);}
$("mode").onclick=()=>{auto=!auto;$("mode").textContent=auto?"自动运镜":"自由漫游";$("mode").classList.toggle("on",auto);if(!auto)syncFreeFromCamera();else{tPath=0;}$("pad").style.display=(!auto&&matchMedia("(pointer:coarse)").matches)?"flex":"none";};
$("help").onclick=()=>alert("自由漫游：\n· 拖动鼠标/手指环视\n· W A S D 平移，Q / E 降低 / 升高，Shift 加速，滚轮调速\n· 触屏：拖动环视，使用右侧按钮前进/后退/升降\n· 滑块调节昼夜与火焰/浪花丰富度");
addEventListener("keydown",e=>{keys[e.code]=true;if(["KeyW","KeyA","KeyS","KeyD","KeyQ","KeyE"].includes(e.code)&&auto)$("mode").click();});
addEventListener("keyup",e=>{keys[e.code]=false;});
let drag=null,speed=60;
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,id:e.pointerId};cv.setPointerCapture(e.pointerId);if(auto){$("mode").click();}});
cv.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.id)return;yaw-=(e.clientX-drag.x)*0.004;pitch=Math.max(-1.4,Math.min(1.4,pitch-(e.clientY-drag.y)*0.004));drag.x=e.clientX;drag.y=e.clientY;});
cv.addEventListener("pointerup",()=>drag=null);cv.addEventListener("pointercancel",()=>drag=null);
cv.addEventListener("wheel",e=>{speed=Math.max(10,Math.min(300,speed*(e.deltaY<0?1.15:0.87)));},{passive:true});
document.querySelectorAll("#pad button").forEach(b=>{const k=b.dataset.k,map={fwd:"KeyW",back:"KeyS",up:"KeyE",down:"KeyQ"};
  b.addEventListener("pointerdown",e=>{e.stopPropagation();keys[map[k]]=true;});for(const ev of ["pointerup","pointerleave","pointercancel"])b.addEventListener(ev,()=>keys[map[k]]=false);});

/* ---------- time of day ---------- */
const duskFog=new THREE.Color(0x6a4668),nightFog=new THREE.Color(0x0a1022);
function applyNight(n){
  skyMat.uniforms.uNight.value=n;seaMat.uniforms.uNight.value=n;
  const f=duskFog.clone().lerp(nightFog,n);scene.fog.color.copy(f);scene.fog.density=0.0007+n*0.0004;seaMat.uniforms.uFog.value.copy(f);seaMat.uniforms.uFogD.value=scene.fog.density;
  seaMat.uniforms.uSky.value.copy(new THREE.Color(0x7a4a5c).lerp(new THREE.Color(0x0b1430),n));
  hemi.intensity=0.9-0.6*n;hemi.color.set(0xffb27a).lerp(new THREE.Color(0x4a5aa0),n);
  sun.intensity=2.4*(1-n)+0.05;moonL.intensity=1.1*n;
  const sd=new THREE.Vector3(0.6,0.08*(1-n)+-0.1*n,-0.5).normalize();skyMat.uniforms.uSun.value.copy(sd);seaMat.uniforms.uSun.value.copy(sd);
  const wi=1.0+1.4*n;for(const m of winMats)m.emissiveIntensity=wi;
  for(const m of pointMats)m.uniforms.uNight.value=n;window._cloudMat.color.set(0xe08a6a).lerp(new THREE.Color(0x202a4a),n);
  renderer.toneMappingExposure=1.15-0.2*n;
}
$("night").oninput=e=>applyNight(+e.target.value);
$("rich").oninput=e=>{for(const m of pointMats)m.uniforms.uAmt.value=+e.target.value;};

/* ---------- loop ---------- */
addEventListener("resize",resize);resize();applyNight(0.55);
const clock=new THREE.Clock();let fpsA=0,fpsN=0,fpsT=0;
const tmp=new THREE.Vector3(),fwd=new THREE.Vector3(),right=new THREE.Vector3(),up=new THREE.Vector3(0,1,0);
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.1),t=clock.elapsedTime;
  for(const m of pointMats)m.uniforms.uT.value=t;seaMat.uniforms.uT.value=t;
  if(auto){tPath=(tPath+dt/110)%1;path.getPointAt(tPath,camera.position);camera.position.y+=Math.sin(t*0.4)*6;
    const ahead=path.getPointAt((tPath+0.03)%1);look.set(ahead.x*0.35,70+Math.sin(t*0.3)*20,ahead.z*0.35);camera.lookAt(look);}
  else{
    const sp=speed*(keys.ShiftLeft||keys.ShiftRight?3:1)*dt;
    fwd.set(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));right.crossVectors(fwd,up).normalize();
    if(keys.KeyW)free.addScaledVector(fwd,sp);if(keys.KeyS)free.addScaledVector(fwd,-sp);if(keys.KeyD)free.addScaledVector(right,sp);if(keys.KeyA)free.addScaledVector(right,-sp);
    if(keys.KeyE)free.y+=sp;if(keys.KeyQ)free.y-=sp;
    free.y=Math.max(groundY(free.x,free.z)+2.5,free.y,2);free.clampLength(0,1800);
    camera.position.copy(free);camera.lookAt(tmp.copy(free).add(fwd));
  }
  seaMat.uniforms.uCam.value.copy(camera.position);
  const fl=0.75+0.25*Math.sin(t*13)+0.15*Math.sin(t*31);for(const l of fireLights)l.intensity=(35+120*skyMat.uniforms.uNight.value)*fl*0.6;
  beaconMat.opacity=0.55+0.45*Math.sin(t*2.2);
  for(const c of window._clouds){c.position.x+=dt*4;if(c.position.x>2300)c.position.x=-2300;}
  renderer.render(scene,camera);
  fpsA+=dt;fpsN++;if(fpsA>0.5){$("fps").textContent=Math.round(fpsN/fpsA)+" FPS · "+(auto?"自动运镜":"自由漫游");fpsA=0;fpsN=0;}
}
loadEl.style.display="none";frame();
window.__city={scene,camera,renderer,flames:fireStart.length,get auto(){return auto;}};
</script>
