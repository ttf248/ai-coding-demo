<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111724" />
    <title>灰潮城 · 新哥特式塔楼漫游</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          14px/1.5 "Microsoft YaHei",
          system-ui,
          sans-serif;
        --ink: #f4ecdf;
        --muted: #bec4d4;
        --line: #76809b70;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #171e2e;
        color: var(--ink);
      }
      h1,
      p {
        margin: 0;
      }
      button,
      select {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      main {
        position: relative;
        min-height: 100svh;
        isolation: isolate;
        display: grid;
        grid-template-rows: auto minmax(440px, 1fr) auto;
        overflow: hidden;
      }
      #view {
        position: absolute;
        inset: 0;
        z-index: -2;
        background: radial-gradient(ellipse at 54% 28%, #757d9a, #151b2b 66%);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      header,
      .bottom {
        pointer-events: none;
        position: relative;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 24px clamp(12px, 4vw, 52px);
        align-items: start;
      }
      header {
        background: linear-gradient(#0b111dc7, transparent);
      }
      .controls,
      .bottom .panel {
        pointer-events: auto;
      }
      .controls,
      .choices,
      .arrow {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .subtitle {
        font-size: 12px;
        color: #e1dfd9;
        margin-top: 6px;
      }
      h1 {
        font:
          700 clamp(34px, 6vw, 79px)/1.05 "Songti SC",
          SimSun,
          Georgia,
          serif;
        letter-spacing: -0.055em;
        text-shadow: 0 4px 25px #151b2e88;
      }
      button,
      select {
        min-height: 42px;
        padding: 7px 10px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: #161d2edb;
      }
      button[aria-pressed="true"] {
        background: #f0dcb6;
        color: #2d2930;
        border-color: #f0dcb6;
        font-weight: 650;
      }
      button:hover,
      select:hover {
        border-color: #e0d3b8;
      }
      :focus-visible {
        outline: 2px solid #f0dcb6;
        outline-offset: 2px;
      }
      .bottom {
        grid-row: 3;
        align-items: end;
        background: linear-gradient(transparent, #0b111eaa 70%);
      }
      .panel {
        padding: 12px 14px;
        background: #161c2fdd;
        border-radius: 9px;
        border: 1px solid var(--line);
        backdrop-filter: blur(9px);
        max-width: 370px;
      }
      #district {
        font-family: "Songti SC", SimSun, serif;
        font-size: 20px;
        font-weight: bold;
      }
      #hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      #error {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        background: #11182ceb;
        padding: 24px;
      }
      [hidden] {
        display: none !important;
      }
      #navigation {
        display: grid;
        grid-template-columns: repeat(3, 46px);
        gap: 4px;
        pointer-events: auto;
      }
      #navigation button:first-child {
        grid-column: 2;
      }
      #navigation button:nth-child(2) {
        grid-column: 1;
      }
      #navigation button {
        min-width: 46px;
        touch-action: none;
      }
      @media (max-width: 640px) {
        main {
          grid-template-rows: auto minmax(390px, 1fr) auto;
        }
        header,
        .bottom {
          padding: 12px;
          gap: 7px;
          flex-wrap: wrap;
        }
        header .controls button,
        header select {
          min-height: 38px;
          font-size: 12px;
        }
        .bottom {
          flex-wrap: nowrap;
          align-items: end;
        }
        .panel {
          padding: 7px 9px;
        }
        #hint {
          font-size: 11px;
        }
        #navigation {
          grid-template-columns: repeat(3, 33px);
        }
        #navigation button {
          min-width: 33px;
          padding: 4px;
        }
      }
    </style>
    <script src="../../../../assets/analytics.js" defer></script>
  </head>
  <body>
    <main>
      <div id="view" aria-label="3D 灰潮城场景"></div>
      <header>
        <div>
          <h1>灰潮城</h1>
          <p class="subtitle">新哥特式塔楼群 · 3D 漫游</p>
        </div>
        <div class="controls" aria-label="镜头模式">
          <button id="orbit" aria-pressed="true">环游</button
          ><button id="walk" aria-pressed="false">街道漫游</button>
          <select id="landmark" aria-label="前往地标">
            <option value="overview">全城</option>
            <option value="spire">钟楼高地</option>
            <option value="bridge">潮汐桥</option>
            <option value="harbor">西港旧城</option>
          </select>
          <button id="reset">复位视角</button>
        </div>
      </header>
      <div class="bottom">
        <div class="panel">
          <p id="district">灰潮海峡</p>
          <p id="hint" role="status">正在载入场景</p>
        </div>
        <div id="navigation" aria-label="街道移动" hidden>
          <button data-key="w" aria-label="前进">↑</button
          ><button data-key="a" aria-label="向左">←</button>
          <button data-key="s" aria-label="后退">↓</button
          ><button data-key="d" aria-label="向右">→</button>
        </div>
      </div>
      <p id="error" role="alert" hidden></p>
    </main>
    <script type="module">
      const $ = (id) => document.getElementById(id);
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      let T, view, renderer, scene, camera, water, embers;
      const buildingBounds = [],
        batch = new Map();
      let seed = 4816;
      function rand() {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return seed / 4294967296;
      }
      let cameraMode = "orbit",
        theta = 0.56,
        phi = 0.52,
        radius = 420,
        yaw = -0.13,
        pitch = 0.09;
      let target,
        walk,
        drag = null,
        pinch = null,
        interact = 0,
        last = 0;
      const pointers = new Map(),
        keys = new Set();
      const spots = {
        overview: {
          title: "灰潮海峡",
          target: [3, 38, 1],
          orbit: [0.56, 0.52, 420],
          walk: [-118, 4, 111, -0.03],
        },
        spire: {
          title: "钟楼高地",
          target: [93, 56, -25],
          orbit: [0.65, 0.41, 195],
          walk: [115, 4, 39, 0.05],
        },
        bridge: {
          title: "潮汐桥",
          target: [0, 13, 39],
          orbit: [0.15, 0.23, 166],
          walk: [-16, 7, 39, Math.PI / 2],
        },
        harbor: {
          title: "西港旧城",
          target: [-113, 29, 73],
          orbit: [-0.75, 0.39, 185],
          walk: [-120, 4, 116, -0.07],
        },
      };
      const palettes = {
        stone: [0x58586b, 0x747185, 0x636276, 0x857e8a, 0x6c6873],
        slate: [0x31384d, 0x3d435b, 0x4a465c, 0x35354b],
        trim: [0x7c7a91, 0x9f9094, 0x74758b],
        glass: [0xffad66, 0xd18758, 0xd4a27d, 0x8a8cac, 0x6f819e],
      };
      const choose = (a) => a[Math.floor(rand() * a.length)];
      let geometry, materials, dummy, paint;

      function instance(
        key,
        shape,
        x,
        y,
        z,
        sx,
        sy,
        sz,
        color,
        ry = 0,
        rz = 0,
        rx = 0,
      ) {
        const id = key + ":" + shape;
        if (!batch.has(id)) batch.set(id, { key, shape, rows: [] });
        dummy.position.set(x, y, z);
        dummy.rotation.set(rx, ry, rz);
        dummy.scale.set(sx, sy, sz);
        dummy.updateMatrix();
        batch.get(id).rows.push([dummy.matrix.clone(), color]);
      }
      const box = (x, y, z, w, h, d, color, ry = 0, key = "stone") =>
        instance(key, "box", x, y, z, w, h, d, color, ry);
      const pyramid = (x, y, z, w, h, d, color) =>
        instance("roof", "pyramid", x, y, z, w, h, d, color, Math.PI / 4);
      function archGeometry() {
        const s = new T.Shape();
        s.moveTo(-0.5, 0);
        s.lineTo(-0.5, 0.57);
        s.quadraticCurveTo(-0.48, 0.82, 0, 1);
        s.quadraticCurveTo(0.48, 0.82, 0.5, 0.57);
        s.lineTo(0.5, 0);
        s.closePath();
        return new T.ShapeGeometry(s, 8);
      }
      function archAt(x, y, z, w, h, face, lit) {
        const ry = (face * Math.PI) / 2;
        const dx = Math.sin(ry) * 0.06,
          dz = Math.cos(ry) * 0.06;
        instance(
          "stone",
          "arch",
          x,
          y,
          z,
          w * 1.25,
          h * 1.08,
          1,
          choose(palettes.trim),
          ry,
        );
        instance(
          lit ? "light" : "shade",
          "arch",
          x + dx,
          y + h * 0.035,
          z + dz,
          w,
          h,
          1,
          lit ? choose(palettes.glass) : 0x313a52,
          ry,
        );
        instance(
          "stone",
          "box",
          x + dx * 1.9,
          y + h * 0.34,
          z + dz * 1.9,
          w * 0.11,
          h * 0.62,
          0.1,
          0x515467,
          ry,
        );
        instance(
          "stone",
          "box",
          x + dx * 2,
          y + h * 0.23,
          z + dz * 2,
          w * 0.94,
          0.13,
          0.1,
          0x515467,
          ry,
        );
      }
      function facades(x, y, z, w, d, f, h, tall, litChance) {
        for (let face = 0; face < 4; face++) {
          const angle = (face * Math.PI) / 2,
            m = face % 2 ? d : w,
            depth = face % 2 ? w : d;
          const slots = Math.max(2, Math.floor(m / (tall ? 5.2 : 4.8)));
          for (let k = 0; k < slots; k++) {
            const l = ((k + 0.5) * m) / slots - m / 2;
            const px =
              x + Math.cos(angle) * l + Math.sin(angle) * (depth / 2 + 0.055);
            const pz =
              z - Math.sin(angle) * l + Math.cos(angle) * (depth / 2 + 0.055);
            for (let i = 0; i < f; i++) {
              const wy = y + i * h + 0.65;
              archAt(
                px,
                wy,
                pz,
                Math.min((m / slots) * 0.52, 2.35),
                h * 0.68,
                face,
                rand() < litChance,
              );
            }
          }
        }
      }
      function gallery(x, z, w, d, height, light = 0.36) {
        const y = 2.5,
          c = choose(palettes.stone);
        box(x, y + height / 2, z, w, height, d, c);
        box(x, y + 0.47, z, w + 1.7, 0.94, d + 1.8, 0x626275);
        for (let level = 4; level < height; level += 6.5)
          box(x, y + level, z, w + 0.2, 0.2, d + 0.2, 0x79717d);
        box(x, y + height, z, w + 1.6, 1.25, d + 1.6, choose(palettes.trim));
        for (const dx of [-1, 1])
          for (const dz of [-1, 1]) {
            box(
              x + dx * (w / 2 - 0.45),
              y + height * 0.5,
              z + dz * (d / 2 - 0.45),
              1.5,
              height + 2,
              1.5,
              choose(palettes.trim),
            );
            pyramid(
              x + dx * (w / 2 - 0.45),
              y + height + 2.1,
              z + dz * (d / 2 - 0.45),
              2.5,
              4.7,
              2.5,
              choose(palettes.slate),
            );
          }
        facades(x, y, z, w, d, Math.floor(height / 4.4), 4.4, false, light);
        pyramid(
          x,
          y + height + w * 0.23,
          z,
          w * 0.91,
          w * 0.47,
          d * 0.91,
          choose(palettes.slate),
        );
        buildingBounds.push([
          x - w * 0.5 - 1,
          x + w * 0.5 + 1,
          z - d * 0.5 - 1,
          z + d * 0.5 + 1,
        ]);
      }
      function tower(x, z, width, height, spire, hero = false) {
        const y = 2.5,
          c = choose(palettes.stone),
          d = width * (hero ? 0.97 : 0.86);
        const podium = hero ? 11 : 5;
        box(x, y + podium / 2, z, width + 4.3, podium, d + 4.3, 0x5d5f75);
        box(x, y + 0.55, z, width + 6, 1.1, d + 6, 0x6d6c80);
        box(x, y + height / 2, z, width, height, d, c);
        const base = y + podium;
        facades(
          x,
          base,
          z,
          width,
          d,
          Math.floor((height - podium - 6) / 5.2),
          5.2,
          true,
          hero ? 0.64 : 0.45,
        );
        for (let k = 0; k < 3; k++)
          box(
            x,
            y + height - k * 2.4,
            z,
            width + 1.5 - k * 0.24,
            0.8,
            d + 1.5 - k * 0.24,
            choose(palettes.trim),
          );
        for (const a of [-1, 1])
          for (const b of [-1, 1]) {
            const bx = x + a * (width / 2 - 0.5),
              bz = z + b * (d / 2 - 0.5);
            box(
              bx,
              y + height * 0.42,
              bz,
              2.05,
              height * 0.84,
              2.1,
              choose(palettes.trim),
            );
            box(bx, y + height * 0.45, bz, 2.7, 2.5, 2.7, 0x88818f);
            box(
              bx,
              y + height,
              z + b * (d / 2 - 0.45),
              2.2,
              7,
              2.25,
              choose(palettes.trim),
            );
            pyramid(
              bx,
              y + height + 7,
              bz,
              3.1,
              8.7,
              3.1,
              choose(palettes.slate),
            );
            if (hero) {
              box(
                x + a * (width / 2 + 1.4),
                y + 7.4,
                bz,
                2.8,
                14.8,
                3.2,
                0x79788b,
              );
              const lean = Math.atan2(2.9, 13);
              instance(
                "stone",
                "box",
                x + a * (width / 2 + 0.2),
                y + 18,
                bz,
                1.7,
                14,
                2.1,
                0x80798a,
                0,
                a * lean,
              );
            }
          }
        const roofY = y + height + spire / 2;
        pyramid(x, roofY, z, width, spire, d, choose(palettes.slate));
        pyramid(x, y + height + spire + 1.6, z, 1.6, 4, 1.6, 0x948278);
        box(x, y + height + spire + 4.2, z, 0.22, 6, 0.22, 0x75645d);
        if (hero) {
          const cy = y + podium + 6.3,
            cz = z + d / 2 + 0.16;
          instance("shade", "circle", x, cy, cz, 10, 10, 1, 0x292d43);
          instance("light", "circle", x, cy, cz + 0.08, 8.3, 8.3, 1, 0xffa872);
          instance("stone", "ring", x, cy, cz + 0.15, 9, 9, 1, 0x978893);
          for (let n = 0; n < 8; n++) {
            const angle = (n * Math.PI) / 4;
            instance(
              "stone",
              "box",
              x + Math.sin(angle) * 2.15,
              cy + Math.cos(angle) * 2.15,
              cz + 0.24,
              0.3,
              4.25,
              0.17,
              0x63586d,
              0,
              -angle,
            );
          }
          archAt(x, y + 0.16, z + d / 2 + 2.23, 4.2, 8, 0, false);
        }
        buildingBounds.push([
          x - width / 2 - 2.7,
          x + width / 2 + 2.7,
          z - d / 2 - 2.7,
          z + d / 2 + 2.7,
        ]);
      }
      function lamp(x, y, z) {
        box(x, y + 1.55, z, 0.22, 3.1, 0.22, 0x39364a);
        box(x, y + 3.12, z, 0.55, 0.67, 0.55, 0xffae6e, 0, "light");
        pyramid(x, y + 3.7, z, 0.8, 0.52, 0.8, 0x4d4050);
        for (let j = 0; j < 3; j++) fireOrigins.push([x, y + 3.45, z]);
      }
      const fireOrigins = [];
      function bridge(z) {
        // The central deck is slightly higher than its causeways.
        box(0, 4, z, 46, 2.5, 13.5, 0x747185);
        for (const side of [-1, 1]) {
          const sx = side * 25;
          instance(
            "stone",
            "box",
            sx,
            3.55,
            z,
            11,
            1.8,
            13.5,
            0x777387,
            0,
            -side * 0.13,
          );
          for (const wall of [-1, 1]) {
            const edge = z + wall * 6.3;
            box(0, 5.7, edge, 45, 1.05, 0.48, 0x93909c);
            for (let x = 5; x <= 24; x += 5)
              box(side * x, 6.1, edge, 0.52, 1.9, 0.64, 0x8c8090);
            lamp(side * 18, 5.4, edge - 0.5 * wall);
          }
          box(side * 20, 1, z, 5, 7, 12.8, 0x514e65);
        }
        for (let x = -20; x <= 20; x += 8) {
          box(x, 5.3, z, 7.7, 0.08, 12, choose([0x6c6b80, 0x717187, 0x7e788c]));
        }
      }
      function district(x, edge) {
        box(x, 1.12, 0, 170, 2.68, 245, 0x56596b);
        box(x, -2.3, 0, 172, 7.0, 246, 0x41445a);
        for (let bx = x - 82; bx < x + 84; bx += 4.6) {
          for (const z of [-122.2, 122.2])
            box(bx, 1.8, z, 4.43, 0.96, 1.28, choose(palettes.stone));
        }
        for (let z = -120; z < 124; z += 5) {
          for (const xx of [x - 84, x + 84])
            box(xx, 1.75, z, 1.12, 0.85, 4.8, choose(palettes.stone));
          if (Math.abs(z - 39) > 8 && Math.abs(z + 56) > 8)
            box(edge, 2.7, z, 0.45, 0.52, 4.98, 0x85808a);
        }
        for (const xx of [x - 67, x - 21, x + 23, x + 68]) {
          box(xx, 2.49, 0, 6.3, 0.12, 241, 0x444855);
          for (let z = -111; z < 117; z += 29) lamp(xx + 3.5, 2.5, z);
        }
        for (const z of [-102, -56, -10, 39, 91]) {
          box(x, 2.5, z, 166, 0.11, 8, 0x484b59);
          for (let xx = x - 76; xx < x + 79; xx += 11)
            box(xx, 2.565, z, 0.12, 0.03, 7.9, 0x60616f);
        }
        for (const z of [-110, 112])
          for (let j = 0; j < 5; j++) {
            const xx = x - 73 + j * 34;
            box(xx, 3, z, 1.4, 0.7, 4.4, 0x91848a);
            lamp(xx + 1.4, 2.5, z);
          }
      }
      function town() {
        district(-106, -21);
        district(106, 21);
        for (const z of [-56, 39]) bridge(z);
        for (const x of [-150, -103, -57, 54, 97, 148])
          for (const z of [-82, -33, 14, 66]) {
            if (x === 97 && z === -33) {
              tower(x, z, 27, 93, 45, true);
              continue;
            }
            if ((x === -103 && z === 14) || (x === 54 && z === 66)) {
              gallery(x, z, 27, 23, 15, 0.8);
              continue;
            }
            if (rand() > 0.22)
              tower(x, z, 13 + rand() * 12, 30 + rand() * 52, 12 + rand() * 26);
            else gallery(x, z, 22 + rand() * 5, 24, 17 + rand() * 12);
          }
        for (let i = 0; i < 68; i++) {
          const x = rand() * 370 - 185,
            z = rand() > 0.5 ? 101 + rand() * 11 : -103 - rand() * 13;
          if (Math.abs(x) < 25) continue;
          const s = 1 + rand() * 2.4;
          box(x, 2.8, z, s, 0.65, s, 0x696676);
          if (rand() > 0.46) {
            box(x, 3.7, z, 0.18, 2.4, 0.18, 0x504650);
            instance(
              "roof",
              "pyramid",
              x,
              4.9,
              z,
              2.5,
              4.5,
              2.5,
              choose([0x414c52, 0x48555b, 0x555064]),
              Math.PI / 4,
            );
          }
        }
        for (const [id, group] of batch) {
          const mesh = new T.InstancedMesh(
            geometry[group.shape],
            materials[group.key],
            group.rows.length,
          );
          group.rows.forEach(([matrix, color], i) => {
            mesh.setMatrixAt(i, matrix);
            mesh.setColorAt(i, paint.setHex(color));
          });
          mesh.name = id;
          scene.add(mesh);
        }
      }

      function scenery() {
        const sky = new T.Mesh(
          new T.SphereGeometry(3200, 36, 20),
          new T.ShaderMaterial({
            side: T.BackSide,
            depthWrite: false,
            vertexShader:
              "varying vec3 dir;void main(){dir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
            fragmentShader: `
        varying vec3 dir;
        void main(){
          vec3 v=normalize(dir);
          float h=max(0.,v.y);
          vec3 low=vec3(.50,.42,.47),high=vec3(.065,.084,.155);
          vec3 c=mix(low,high,smoothstep(0.,.76,h));
          float glow=max(0.,dot(v,normalize(vec3(-.35,.20,-.9))));
          c+=vec3(.37,.18,.08)*pow(glow,17.);
          float bands=sin(v.x*15.+v.y*42.)*sin(v.z*9.+v.y*61.);
          c+=.047*bands*exp(-13.*abs(h-.12));
          float moon=dot(v,normalize(vec3(-.41,.38,-.81)));
          c+=vec3(.84,.76,.53)*smoothstep(.9991,.9995,moon);
          gl_FragColor=vec4(c,1.);
        }`,
          }),
        );
        sky.renderOrder = -2;
        scene.add(sky);
        const sea = new T.PlaneGeometry(6200, 6200, 166, 166);
        sea.rotateX(-Math.PI / 2);
        water = new T.Mesh(
          sea,
          new T.ShaderMaterial({
            uniforms: { time: { value: 0 } },
            vertexShader: `
        uniform float time;varying vec3 p;
        void main(){p=position;p.y+=.24*sin(p.x*.14+p.z*.1+time*1.4)+.13*sin(p.z*.19-time*1.1);gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}
      `,
            fragmentShader: `
        uniform float time;varying vec3 p;
        void main(){
          float sweep=sin(p.x*.19+p.z*.31+time*1.7+1.3*sin(p.x*.065-p.z*.091))+.31*sin(p.x*.64-p.z*.24-time*1.9);
          float lines=smoothstep(.67,1.21,sweep);
          vec3 c=mix(vec3(.113,.166,.246),vec3(.28,.34,.45),lines*.72);
          float horizon=1.-exp(-length(p.xz-cameraPosition.xz)*.0022);
          vec3 direction=normalize(vec3(p.x-cameraPosition.x,0.,p.z-cameraPosition.z));
          float skyGlow=pow(max(0.,dot(direction,normalize(vec3(-.35,.20,-.9)))),17.);
          vec3 haze=vec3(.50,.42,.47)+vec3(.37,.18,.08)*skyGlow;
          float gleam=exp(-abs(p.x+p.z*.45)*.018)*pow(lines,2.);
          c=mix(c+vec3(.17,.115,.085)*gleam,haze,smoothstep(.09,1.,horizon));
          gl_FragColor=vec4(c,1.);
        }`,
          }),
        );
        sea.computeBoundingSphere();
        water.position.y = -0.44;
        scene.add(water);
        const pts = new T.BufferGeometry(),
          n = fireOrigins.length;
        pts.setAttribute(
          "position",
          new T.Float32BufferAttribute(fireOrigins.flat(), 3),
        );
        pts.setAttribute(
          "aSeed",
          new T.Float32BufferAttribute(
            Array.from({ length: n }, () => rand()),
            1,
          ),
        );
        embers = new T.Points(
          pts,
          new T.ShaderMaterial({
            uniforms: { time: { value: 0 } },
            transparent: true,
            depthWrite: false,
            blending: T.AdditiveBlending,
            vertexShader: `
        attribute float aSeed;uniform float time;varying float fade;
        void main(){
          float progress=fract(aSeed+time*.29);
          vec3 p=position+vec3(sin(aSeed*172.+time)*.49,progress*2.3,cos(aSeed*91.+time)*.53);
          vec4 q=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*q;
          gl_PointSize=clamp(55./max(1.,-q.z),1.1,8.);fade=1.-progress;
        }`,
            fragmentShader:
              "varying float fade;void main(){float d=length(gl_PointCoord-.5);gl_FragColor=vec4(1.,.53,.23,(1.-smoothstep(.02,.5,d))*fade);}",
          }),
        );
        scene.add(embers);
      }

      function resize() {
        const { width, height } = view.getBoundingClientRect();
        renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
        renderer.setSize(width, Math.max(1, height), false);
        camera.aspect = width / Math.max(1, height);
        camera.fov = camera.aspect < 1 ? 65 : 50;
        camera.updateProjectionMatrix();
      }
      function moveAllowed(x, z) {
        const land =
          Math.abs(x) >= 21 && Math.abs(x) <= 190 && Math.abs(z) < 120;
        const deck =
          Math.abs(x) <= 30 &&
          (Math.abs(z - 39) < 5.6 || Math.abs(z + 56) < 5.6);
        if (!land && !deck) return false;
        return !buildingBounds.some(
          ([x1, x2, z1, z2]) => x >= x1 && x <= x2 && z >= z1 && z <= z2,
        );
      }
      function updateCamera(dt, now) {
        if (cameraMode === "orbit") {
          if (now - interact > 3500) theta += dt * 0.066;
          const h = radius * Math.cos(phi);
          camera.position.set(
            target.x + Math.sin(theta) * h,
            target.y + Math.sin(phi) * radius,
            target.z + Math.cos(theta) * h,
          );
          camera.lookAt(target);
        } else {
          const forward = Number(keys.has("w")) - Number(keys.has("s")),
            right = Number(keys.has("d")) - Number(keys.has("a"));
          const step = (dt * 12) / (forward && right ? Math.SQRT2 : 1);
          const dx = (Math.sin(yaw) * forward + Math.cos(yaw) * right) * step,
            dz = (-Math.cos(yaw) * forward + Math.sin(yaw) * right) * step;
          if (moveAllowed(walk.x + dx, walk.z)) walk.x += dx;
          if (moveAllowed(walk.x, walk.z + dz)) walk.z += dz;
          walk.y =
            Math.abs(walk.x) < 30 &&
            (Math.abs(walk.z - 39) < 5.6 || Math.abs(walk.z + 56) < 5.6)
              ? 6.97
              : 4.17;
          camera.position.copy(walk);
          camera.lookAt(
            walk.x + Math.cos(pitch) * Math.sin(yaw),
            walk.y + Math.sin(pitch),
            walk.z - Math.cos(pitch) * Math.cos(yaw),
          );
        }
      }
      function display() {
        const b = cameraMode === "orbit";
        $("orbit").setAttribute("aria-pressed", b);
        $("walk").setAttribute("aria-pressed", !b);
        $("navigation").hidden = b;
        $("hint").textContent = b
          ? "拖动环视 · 滚轮或双指缩放 · 闲置自动环游"
          : "拖动转向 · WASD、方向键或屏幕按钮移动";
      }
      function selectSpot(id) {
        const { title, orbit, walk: street, target: point } = spots[id];
        [theta, phi, radius] = orbit;
        walk.set(street[0], street[1], street[2]);
        yaw = street[3];
        pitch = 0.1;
        target.set(...point);
        interact = performance.now();
        $("district").textContent = title;
      }
      function zoom(factor) {
        radius = clamp(radius * factor, 62, 620);
      }
      function connect() {
        const canvas = renderer.domElement;
        canvas.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          canvas.setPointerCapture(e.pointerId);
          pointers.set(e.pointerId, [e.clientX, e.clientY]);
          if (pointers.size === 2) pinch = null;
          drag = e.pointerId;
          interact = performance.now();
        });
        canvas.addEventListener("pointermove", (e) => {
          if (!pointers.has(e.pointerId)) return;
          const [x, y] = pointers.get(e.pointerId);
          pointers.set(e.pointerId, [e.clientX, e.clientY]);
          interact = performance.now();
          if (pointers.size === 2 && cameraMode === "orbit") {
            const [a, b] = [...pointers.values()];
            const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
            if (pinch > 1 && d > 1) zoom(pinch / d);
            pinch = d;
            return;
          }
          if (drag !== e.pointerId) return;
          const dx = e.clientX - x,
            dy = e.clientY - y;
          if (cameraMode === "orbit") {
            theta -= dx * 0.006;
            phi = clamp(phi + dy * 0.005, 0.075, 1.27);
          } else {
            yaw += dx * 0.0045;
            pitch = clamp(pitch - dy * 0.0045, -1, 1);
          }
        });
        for (const event of [
          "pointerup",
          "pointercancel",
          "lostpointercapture",
        ])
          canvas.addEventListener(event, (e) => {
            pointers.delete(e.pointerId);
            pinch = null;
            drag = pointers.keys().next().value ?? null;
          });
        canvas.addEventListener(
          "wheel",
          (e) => {
            if (cameraMode !== "orbit") return;
            e.preventDefault();
            interact = performance.now();
            zoom(Math.exp(e.deltaY * 0.001));
          },
          { passive: false },
        );
        const mapKey = (key) =>
          ({ ArrowUp: "w", ArrowDown: "s", ArrowLeft: "a", ArrowRight: "d" })[
            key
          ] ?? key.toLowerCase();
        addEventListener("keydown", (e) => {
          const key = mapKey(e.key);
          if (
            cameraMode === "walk" &&
            ["w", "a", "s", "d"].includes(key) &&
            !["BUTTON", "SELECT"].includes(e.target.tagName)
          ) {
            e.preventDefault();
            keys.add(key);
          }
        });
        addEventListener("keyup", (e) => keys.delete(mapKey(e.key)));
        addEventListener("blur", () => keys.clear());
        for (const b of $("navigation").querySelectorAll("button")) {
          b.onpointerdown = (e) => {
            b.setPointerCapture(e.pointerId);
            keys.add(b.dataset.key);
          };
          b.onpointerup =
            b.onpointercancel =
            b.onlostpointercapture =
              () => keys.delete(b.dataset.key);
          b.onkeydown = (e) => {
            if (e.key === " " || e.key === "Enter") keys.add(b.dataset.key);
          };
          b.onkeyup = () => keys.delete(b.dataset.key);
        }
        $("orbit").onclick = () => {
          cameraMode = "orbit";
          interact = performance.now();
          keys.clear();
          display();
        };
        $("walk").onclick = () => {
          cameraMode = "walk";
          $("walk").blur();
          keys.clear();
          display();
        };
        $("landmark").onchange = () => selectSpot($("landmark").value);
        $("reset").onclick = () => {
          $("landmark").value = "overview";
          cameraMode = "orbit";
          selectSpot("overview");
          display();
        };
      }
      function animate(now) {
        const dt = clamp((now - last) / 1000, 0, 0.06);
        last = now;
        updateCamera(dt, now);
        water.material.uniforms.time.value =
          embers.material.uniforms.time.value = now / 1000;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      try {
        T =
          await import("https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js");
        view = $("view");
        scene = new T.Scene();
        scene.fog = new T.FogExp2(0x686781, 0.0021);
        camera = new T.PerspectiveCamera(50, 1, 0.18, 4100);
        renderer = new T.WebGLRenderer({
          antialias: true,
          powerPreference: "high-performance",
        });
        renderer.setClearColor(0x68708c);
        renderer.outputColorSpace = T.SRGBColorSpace;
        renderer.toneMapping = T.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.14;
        view.appendChild(renderer.domElement);
        target = new T.Vector3();
        walk = new T.Vector3();
        dummy = new T.Object3D();
        paint = new T.Color();
        geometry = {
          box: new T.BoxGeometry(1, 1, 1),
          pyramid: new T.ConeGeometry(0.7071, 1, 4),
          arch: archGeometry(),
          circle: new T.CircleGeometry(0.5, 34),
          ring: new T.RingGeometry(0.45, 0.5, 32),
        };
        const material = () => new T.MeshStandardMaterial({ roughness: 0.83 });
        materials = {
          stone: material(),
          roof: material(),
          light: new T.MeshBasicMaterial({ side: T.DoubleSide }),
          shade: new T.MeshBasicMaterial({ side: T.DoubleSide }),
        };
        const ambient = new T.HemisphereLight(0xaabcff, 0x625367, 2.25);
        const warm = new T.DirectionalLight(0xffd1a8, 2.4);
        warm.position.set(-270, 170, 135);
        const rim = new T.DirectionalLight(0x9eb6ff, 2.0);
        rim.position.set(200, 160, -150);
        scene.add(ambient, warm, rim);
        town();
        scenery();
        resize();
        selectSpot("overview");
        display();
        connect();
        new ResizeObserver(resize).observe(view);
        renderer.domElement.addEventListener("webglcontextlost", () => {
          $("error").textContent =
            "待确认：图形上下文中断。请刷新页面恢复漫游。";
          $("error").hidden = false;
        });
        requestAnimationFrame(animate);
      } catch {
        $("hint").textContent = "场景未载入";
        $("error").textContent =
          "待确认：无法载入 Three.js 或启动 WebGL 2。请检查网络和浏览器图形加速。";
        $("error").hidden = false;
        for (const button of document.querySelectorAll("button,select"))
          button.disabled = true;
      }
    </script>
  </body>
</html>
