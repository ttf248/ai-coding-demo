<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NOCTILUCA · The Gothic City</title>
    <style>
      :root{color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#070910;color:#edf0f8;font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif}#scene{position:fixed;inset:0}canvas{display:block}header{position:fixed;z-index:3;left:30px;top:25px;display:flex;align-items:center;gap:12px}.sigil{width:40px;height:40px;display:grid;place-items:center;border:1px solid #cbb78c66;border-radius:50%;color:#e1c998;font-size:20px}h1{font-size:13px;letter-spacing:.22em;margin:0;font-weight:500}header p{font-size:9px;color:#9da1ae;letter-spacing:.18em;margin:4px 0 0}.panel{position:fixed;z-index:3;right:25px;top:24px;width:230px;padding:15px 16px;border:1px solid #ffffff1a;border-radius:14px;background:#0a0d16b8;backdrop-filter:blur(16px)}.eyebrow{font-size:9px;letter-spacing:.2em;color:#d0bb8e}.panel h2{font-size:13px;font-weight:500;margin:8px 0 4px}.panel p{font-size:10px;color:#9da3b0;line-height:1.55;margin:0}.rule{height:1px;background:#fff1;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#c7cbd4;margin-top:9px}.row span:last-child{color:#aaa0ca}.buttons{display:flex;gap:7px;margin-top:13px}.button{border:1px solid #ffffff24;background:#ffffff0b;border-radius:20px;color:#d8d9df;padding:7px 10px;font-size:9px;cursor:pointer}.button:hover,.button.active{background:#d0bb8e;color:#14151a;border-color:#d0bb8e}.hint{position:fixed;z-index:3;left:30px;bottom:23px;padding:10px 13px;border-left:2px solid #c9b58d;background:#080b12bd;color:#c7c9d1;font-size:10px}.hint span{color:#9da2ad}.coordinates{position:fixed;z-index:3;right:25px;bottom:23px;color:#a0a2ac;font-size:9px;letter-spacing:.16em}.loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#070910;transition:opacity .8s}.loading.off{opacity:0;pointer-events:none}.loadinner{text-align:center}.loadinner b{font-weight:500;font-size:11px;letter-spacing:.24em}.loadinner p{font-size:10px;color:#9599a8}.pulse{width:40px;height:40px;margin:0 auto 18px;border:1px solid #d0bb8e;border-radius:50%;animation:pulse 1.6s infinite}@keyframes pulse{50%{transform:scale(1.25);opacity:.35}}@media(max-width:700px){header{left:16px;top:15px}.sigil{width:34px;height:34px}.panel{right:12px;top:auto;bottom:64px;width:min(210px,calc(100vw - 24px));padding:11px}.panel .detail{display:none}.panel h2{margin:5px 0}.buttons{margin-top:8px}.hint{left:12px;bottom:12px;max-width:calc(100vw - 240px);padding:8px;font-size:9px}.coordinates{display:none}}
    </style>
    <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
  </head>
  <body>
    <div id="scene"></div>
    <header><div class="sigil">✦</div><div><h1>NOCTILUCA</h1><p>THE GOTHIC TOWER CITY · MMXXV</p></div></header>
    <aside class="panel"><div class="eyebrow">FIELD NOTES　/　01</div><h2>高塔之城 · 夜航</h2><p class="detail">在潮汐与雾之间，一座黑石城市沿尖塔向天际生长。拖动探索街巷，滚轮调整距离。</p><div class="rule"></div><div class="row"><span>环境</span><span id="environment">月下微光</span></div><div class="row"><span>雾与浪</span><span>ACTIVE</span></div><div class="buttons"><button class="button active" id="orbit">缓慢环游</button><button class="button" id="particles">萤火粒子</button></div></aside>
    <div class="hint">DRAG <span>环视</span>　 SCROLL <span>远近</span>　 DOUBLE CLICK <span>重置视角</span></div><div class="coordinates">51°30'26.4"N　·　0°07'39.2"W</div>
    <div class="loading" id="loading"><div class="loadinner"><div class="pulse"></div><b>城市正在雾中显现</b><p id="loadnote">载入 Three.js 与场景几何…</p></div></div>
    <script type="module">
      const note = document.querySelector('#loadnote');
      try {
        const THREE = await import('three');
        const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
        const host = document.querySelector('#scene');
        const scene = new THREE.Scene(); scene.background = new THREE.Color('#080b14'); scene.fog = new THREE.FogExp2('#111421', .009);
        const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, .1, 800); camera.position.set(74, 57, 96);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }); renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7)); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15; host.appendChild(renderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 19, 0); controls.enableDamping = true; controls.dampingFactor = .045; controls.minDistance = 34; controls.maxDistance = 190; controls.maxPolarAngle = Math.PI * .49; controls.autoRotate = true; controls.autoRotateSpeed = .38; controls.update();
        scene.add(new THREE.HemisphereLight('#c4d5ed', '#17131e', 1.5)); const moon = new THREE.DirectionalLight('#dce8ff', 3.2); moon.position.set(-45, 100, 35); moon.castShadow = true; moon.shadow.mapSize.set(2048, 2048); moon.shadow.camera.left = -120; moon.shadow.camera.right = 120; moon.shadow.camera.top = 120; moon.shadow.camera.bottom = -120; scene.add(moon); const amber = new THREE.PointLight('#e18c54', 115, 95, 2); amber.position.set(5, 19, 4); scene.add(amber);
        const stone = new THREE.MeshStandardMaterial({ color: '#343644', roughness: .8, metalness: .18 }), darkStone = new THREE.MeshStandardMaterial({ color: '#20222d', roughness: .88 }), roofMat = new THREE.MeshStandardMaterial({ color: '#161a2a', roughness: .55, metalness: .3 }), gold = new THREE.MeshStandardMaterial({ color: '#bc9965', emissive: '#68452b', emissiveIntensity: .5, roughness: .45 }), windowMat = new THREE.MeshStandardMaterial({ color: '#e8a560', emissive: '#e79550', emissiveIntensity: 2.1, roughness: .25 });
        const city = new THREE.Group(); scene.add(city);
        function box(parent, w, h, d, mat, x, y, z) { const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); mesh.position.set(x, y + h / 2, z); mesh.castShadow = true; mesh.receiveShadow = true; parent.add(mesh); return mesh; }
        function tower(x, z, h, w = 8, detailed = false) { const g = new THREE.Group(); g.position.set(x, 0, z); city.add(g); box(g, w, h, w, stone, 0, 1, 0); box(g, w + 1.4, 1.1, w + 1.4, darkStone, 0, 1, 0); for (let floor = 4; floor < h - 1; floor += 4.5) { box(g, w + .25, .27, w + .25, darkStone, 0, floor, 0); for (let i = -1; i <= 1; i++) { const win = new THREE.Mesh(new THREE.BoxGeometry(.62, 1.65, .09), windowMat); win.position.set(i * w * .26, floor + 1.3, w / 2 + .08); g.add(win); const sideWin = win.clone(); sideWin.rotation.y = Math.PI / 2; sideWin.position.set(w / 2 + .08, floor + 1.3, i * w * .26); g.add(sideWin); } } box(g, w + 1.2, .9, w + 1.2, stone, 0, h + 1, 0); const roof = new THREE.Mesh(new THREE.ConeGeometry(w * .78, h * .29, 4), roofMat); roof.position.set(0, h + h * .145 + 1, 0); roof.rotation.y = Math.PI / 4; roof.castShadow = true; g.add(roof); if (detailed) { const spire = new THREE.Mesh(new THREE.ConeGeometry(.18, 12, 7), gold); spire.position.y = h + h * .29 + 7; g.add(spire); for (const s of [-1, 1]) { const buttress = box(g, .65, h * .8, .65, darkStone, s * w * .45, 3, 0); buttress.position.y = h * .42 + 3; const mini = new THREE.Mesh(new THREE.ConeGeometry(.55, 4, 5), roofMat); mini.position.set(s * w * .45, h * .8 + 5, 0); g.add(mini); } } return g; }
        const ground = new THREE.Mesh(new THREE.CylinderGeometry(69, 73, 7, 96), new THREE.MeshStandardMaterial({ color: '#272935', roughness: .84, metalness: .22 })); ground.position.y = -3.5; ground.receiveShadow = true; city.add(ground);
        const plaza = new THREE.Mesh(new THREE.CylinderGeometry(35, 38, 2, 64), darkStone); plaza.position.y = 1; plaza.receiveShadow = true; city.add(plaza);
        tower(0, 0, 46, 12, true); tower(-22, -6, 28, 8, true); tower(23, -9, 33, 9, true); tower(-9, 24, 25, 8, true); tower(13, 25, 31, 8, true);
        let seed = 1284; const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
        for (let i = 0; i < 30; i++) { const a = rand() * Math.PI * 2, r = 35 + rand() * 25, x = Math.cos(a) * r, z = Math.sin(a) * r, h = 10 + rand() * 17, w = 4.5 + rand() * 3.5; tower(x, z, h, w, rand() > .55); }
        // Ribbed cloisters and bridges make the islands read as connected city blocks.
        for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6, x = Math.cos(a) * 28, z = Math.sin(a) * 28; const walk = box(city, 4, 2.2, 11, darkStone, x, 1.7, z); walk.rotation.y = -a; const arch = new THREE.Mesh(new THREE.TorusGeometry(3.4, .32, 8, 20, Math.PI), gold); arch.rotation.set(Math.PI / 2, 0, -a); arch.position.set(x, 5, z); city.add(arch); }
        const waterGeo = new THREE.PlaneGeometry(500, 500, 100, 100); waterGeo.rotateX(-Math.PI / 2); const waterMat = new THREE.MeshStandardMaterial({ color: '#0a1b2a', roughness: .32, metalness: .48, transparent: true, opacity: .86, emissive: '#06101c', emissiveIntensity: .3 }); const sea = new THREE.Mesh(waterGeo, waterMat); sea.position.y = -5.3; scene.add(sea); const basePositions = waterGeo.attributes.position.array.slice();
        const starsGeo = new THREE.BufferGeometry(), starPositions = new Float32Array(1400 * 3); for (let i = 0; i < 1400; i++) { starPositions[i * 3] = (rand() - .5) * 500; starPositions[i * 3 + 1] = 45 + rand() * 180; starPositions[i * 3 + 2] = (rand() - .5) * 500; } starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3)); const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: '#d7d1be', size: .6, transparent: true, opacity: .75 })); scene.add(stars);
        let fireflies = true; const fireGeo = new THREE.BufferGeometry(), firePos = new Float32Array(420 * 3); for (let i = 0; i < 420; i++) { const a = rand() * Math.PI * 2, r = rand() * 66; firePos[i * 3] = Math.cos(a) * r; firePos[i * 3 + 1] = 1 + rand() * 35; firePos[i * 3 + 2] = Math.sin(a) * r; } fireGeo.setAttribute('position', new THREE.BufferAttribute(firePos, 3)); const embers = new THREE.Points(fireGeo, new THREE.PointsMaterial({ color: '#eda875', size: .48, transparent: true, opacity: .9, blending: THREE.AdditiveBlending, depthWrite: false })); scene.add(embers);
        let tick = 0; function animate() { requestAnimationFrame(animate); tick += .01; controls.update(); const pos = waterGeo.attributes.position; for (let i = 0; i < pos.count; i++) { const x = basePositions[i * 3], z = basePositions[i * 3 + 2]; pos.setY(i, .11 * Math.sin(x * .095 + tick) + .09 * Math.cos(z * .12 - tick * .8)); } pos.needsUpdate = true; waterGeo.computeVertexNormals(); embers.visible = fireflies; embers.rotation.y = tick * .013; renderer.render(scene, camera); }
        addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7)); }); renderer.domElement.addEventListener('dblclick', () => { camera.position.set(74, 57, 96); controls.target.set(0, 19, 0); controls.update(); });
        document.querySelector('#orbit').addEventListener('click', (e) => { controls.autoRotate = !controls.autoRotate; e.currentTarget.classList.toggle('active', controls.autoRotate); e.currentTarget.textContent = controls.autoRotate ? '缓慢环游' : '暂停环游'; }); document.querySelector('#particles').addEventListener('click', (e) => { fireflies = !fireflies; e.currentTarget.classList.toggle('active', fireflies); });
        animate(); note.textContent = '灯火亮起，镜头即将入城…'; setTimeout(() => document.querySelector('#loading').classList.add('off'), 900); document.querySelector('#environment').textContent = '月下微光';
      } catch (error) { note.textContent = `待确认：Three.js 无法载入。请检查网络连接。${error.message}`; document.querySelector('#loading').classList.remove('off'); }
    </script>
  </body>
</html>
