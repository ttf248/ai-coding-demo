<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOCTURNE · 新哥特式塔楼城市</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#060915;color:#eee5d9;font-family:Georgia,"Noto Serif SC",serif}canvas{display:block}.veil{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,#040814b0,transparent 45%),linear-gradient(0deg,#02050cb0,transparent 28%)}.hud{position:fixed;left:5vw;top:7vh;max-width:430px;pointer-events:none}.eyebrow{font:11px Arial,sans-serif;letter-spacing:.36em;color:#c9ad81}.hud h1{font-size:clamp(35px,5vw,72px);line-height:.98;font-weight:400;margin:24px 0 16px;letter-spacing:.04em}.hud p{line-height:1.8;color:#b7b4b5;font-size:14px}.bottom{position:fixed;bottom:5vh;left:5vw;right:5vw;display:flex;justify-content:space-between;align-items:end;gap:24px;font:11px Arial,sans-serif;color:#aaaeb9;letter-spacing:.13em}.controls{background:#09101ac9;border:1px solid #a58d6155;padding:14px 19px;border-radius:3px;line-height:1.8}.buttons{display:flex;gap:9px;pointer-events:auto}.buttons button{background:#131b25cc;color:#e4cfae;border:1px solid #a88d6c77;padding:12px 16px;cursor:pointer;font:11px Arial,sans-serif;letter-spacing:.12em}.buttons button:hover{background:#344050}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#060915;z-index:10;font:14px Arial,sans-serif;letter-spacing:.2em}@media(max-width:700px){.hud{top:4vh}.hud p{font-size:11px}.bottom{display:block}.buttons{margin-top:12px}.controls{font-size:9px}}</style></head><body><div id="loading" class="loading">构筑夜之城 · LOADING</div><div class="veil"></div><div class="hud"><div class="eyebrow">THE CITY OF SPIRES / 01</div><h1>NOCTURNE<br>塔楼之城</h1><p>穿过尖拱与钟楼，沿着雾中的石桥漫游。<br>这座城市在日落之后，仍燃着温暖的火。</p></div><div class="bottom"><div class="controls">拖拽环视 · 滚轮缩放 · WASD 漫游 · 鼠标右键平移<br>按空格切换自动巡游</div><div class="buttons"><button id="tour">暂停巡游</button><button id="lights">灯火：开</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#080c19');scene.fog=new THREE.FogExp2('#0b1020',.009);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.65;document.body.prepend(renderer.domElement);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,800);const look=new THREE.Vector3(0,13,0);let radius=130,azimuth=0,elevation=.38,auto=true,lightOn=true;const stone=new THREE.MeshStandardMaterial({color:'#373e4f',roughness:.88}),stone2=new THREE.MeshStandardMaterial({color:'#50596b',roughness:.84}),trim=new THREE.MeshStandardMaterial({color:'#777078',roughness:.65}),roof=new THREE.MeshStandardMaterial({color:'#1c2638',metalness:.32,roughness:.65}),gold=new THREE.MeshStandardMaterial({color:'#d6ab68',metalness:.58,roughness:.36}),windowMat=new THREE.MeshStandardMaterial({color:'#ffce83',emissive:'#ef9f49',emissiveIntensity:2.8}),road=new THREE.MeshStandardMaterial({color:'#22293a',roughness:.9}),water=new THREE.MeshStandardMaterial({color:'#101e32',metalness:.75,roughness:.26});const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),road);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);function box(parent,w,h,d,x,y,z,mat=stone){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function cone(parent,r,h,x,y,z,mat=roof,n=4){const o=new THREE.Mesh(new THREE.ConeGeometry(r,h,n),mat);o.position.set(x,y,z);o.rotation.y=Math.PI/4;o.castShadow=true;parent.add(o);return o}function cylinder(parent,r,h,x,y,z,mat=stone,n=8){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,n),mat);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
function tower(x,z,scale=1,grand=false){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(scale);scene.add(g);const width=grand?13:7,height=grand?52:20+Math.random()*18;box(g,width,height,width,0,height/2,0,stone);for(let y=5;y<height-4;y+=6){box(g,width+.7,.7,width+.7,0,y,0,trim);for(const side of [-1,1])for(const px of [-width*.27,width*.27]){box(g,1.2,2.8,.14,px,y+2.7,side*(width/2+.1),windowMat);box(g,.14,2.8,1.2,side*(width/2+.1),y+2.7,px,windowMat)}}for(const sx of [-1,1])for(const sz of [-1,1]){cylinder(g,.68,height+3,sx*width*.42,(height+3)/2,sz*width*.42,stone2,6);cone(g,1.25,7,sx*width*.42,height+6.5,sz*width*.42)}box(g,width+2,2,width+2,0,height+1,0,stone2);cone(g,width*.72,grand?19:12,0,height+(grand?11:8),0);cylinder(g,.16,6,0,height+(grand?22:16),0,gold,8);cone(g,.6,2,0,height+(grand?25:19),0,gold,8);for(const side of [-1,1]){const buttress=new THREE.Group();g.add(buttress);box(buttress,1.4,height*.66,1.7,side*(width*.65),height*.33,0,stone2);cone(buttress,1.6,4,side*(width*.65),height*.66+2,0)}return g}
for(let x=-90;x<=90;x+=20)for(let z=-90;z<=90;z+=20){if(Math.abs(x)<17||Math.abs(z)<17||Math.hypot(x,z)>120)continue;if(Math.random()<.14)continue;tower(x+(Math.random()-.5)*4,z+(Math.random()-.5)*4,.65+Math.random()*.5)}tower(-26,-25,1.3,true);tower(30,-31,1.15,true);tower(38,32,1.25,true);tower(-40,34,1.05,true);
// Cathedral nave, flying buttresses and rose window.
const church=new THREE.Group();church.position.set(0,0,-45);scene.add(church);box(church,28,23,46,0,11.5,0,stone2);for(let z=-20;z<=20;z+=8){for(const x of [-16,16]){box(church,2,16,2,x,8,z,stone);box(church,6,1,2,x*.85,17,z,trim)}for(const x of [-10,10]){box(church,2,8,.1,x,13,z,windowMat)}}for(let z=-21;z<=21;z+=4){cone(church,15,14,0,30,z,roof,4)}tower(-15,-68,.85,true);tower(15,-68,.85,true);
// Canal and bridge.
box(scene,22,.25,190,0,.12,20,water);for(let z=-90;z<=90;z+=18){if(Math.abs(z)<18)continue;for(const x of [-12,12]){box(scene,1,2,17,x,1,z,stone2);for(let k=-8;k<=8;k+=4)cylinder(scene,.65,2,x,2,z+k,stone,6)}}box(scene,31,1.5,12,0,1.3,0,stone2);for(const x of [-15,15])box(scene,1.2,3,13,x,3,0,stone);for(let z=-6;z<=6;z+=4)for(const x of [-14,14]){cylinder(scene,.3,4,x,3,z,stone,6);const lantern=new THREE.PointLight('#ffad62',2.5,12);lantern.position.set(x,5,z);scene.add(lantern);box(scene,.8,1,.8,x,5,z,windowMat)}
// Streets, gates, lamps and warm windows.
for(const x of [-70,-50,-30,30,50,70])for(let z=-85;z<=85;z+=20){if(Math.abs(z)<20)continue;box(scene,.6,7,.6,x,3.5,z,stone2);cone(scene,1.3,2,x,8,z,gold,6);const flame=new THREE.PointLight('#ff9c50',1.4,14);flame.position.set(x,7,z);scene.add(flame)}const moon=new THREE.DirectionalLight('#b5c9ff',1.8);moon.position.set(-40,90,30);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);moon.shadow.camera.left=-130;moon.shadow.camera.right=130;moon.shadow.camera.top=130;moon.shadow.camera.bottom=-130;scene.add(moon);scene.add(new THREE.AmbientLight('#52627f',2.1));const stars=[];for(let i=0;i<350;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(.08+Math.random()*.13,4,4),new THREE.MeshBasicMaterial({color:'#dbe3fa'}));s.position.set((Math.random()-.5)*350,65+Math.random()*120,(Math.random()-.5)*350);scene.add(s);stars.push(s)}
const dustCount=450,dustPos=new Float32Array(dustCount*3);for(let i=0;i<dustCount;i++){dustPos[i*3]=(Math.random()-.5)*170;dustPos[i*3+1]=Math.random()*45;dustPos[i*3+2]=(Math.random()-.5)*170}const dustGeo=new THREE.BufferGeometry();dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:'#d5b07e',size:.18,transparent:true,opacity:.55}));scene.add(dust);
let drag=false,right=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;right=e.button===2;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;if(right){look.x-=dx*.08;look.z+=dy*.08}else{azimuth-=dx*.006;elevation=Math.max(.08,Math.min(1.2,elevation+dy*.004));auto=false}});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.oncontextmenu=e=>e.preventDefault();renderer.domElement.addEventListener('wheel',e=>{radius=Math.max(18,Math.min(180,radius+e.deltaY*.06))},{passive:true});const keys=new Set();window.addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.code==='Space'){auto=!auto;document.getElementById('tour').textContent=auto?'暂停巡游':'继续巡游';e.preventDefault()}});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.getElementById('tour').onclick=()=>{auto=!auto;document.getElementById('tour').textContent=auto?'暂停巡游':'继续巡游'};document.getElementById('lights').onclick=()=>{lightOn=!lightOn;windowMat.emissiveIntensity=lightOn?2.8:0;document.getElementById('lights').textContent=lightOn?'灯火：开':'灯火：关'};window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.getElementById('loading').remove();const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);if(auto)azimuth+=dt*.04;const forward=new THREE.Vector3(Math.sin(azimuth),0,Math.cos(azimuth)),side=new THREE.Vector3(forward.z,0,-forward.x);if(keys.has('w'))look.addScaledVector(forward,-dt*20);if(keys.has('s'))look.addScaledVector(forward,dt*20);if(keys.has('a'))look.addScaledVector(side,-dt*20);if(keys.has('d'))look.addScaledVector(side,dt*20);look.x=THREE.MathUtils.clamp(look.x,-95,95);look.z=THREE.MathUtils.clamp(look.z,-95,95);camera.position.set(look.x+Math.sin(azimuth)*radius*Math.cos(elevation),look.y+Math.sin(elevation)*radius,look.z+Math.cos(azimuth)*radius*Math.cos(elevation));camera.lookAt(look);const a=dustGeo.attributes.position.array;for(let i=0;i<dustCount;i++){a[i*3+1]+=dt*.45;if(a[i*3+1]>50)a[i*3+1]=0}dustGeo.attributes.position.needsUpdate=true;renderer.render(scene,camera)}loop();
</script></body></html>
