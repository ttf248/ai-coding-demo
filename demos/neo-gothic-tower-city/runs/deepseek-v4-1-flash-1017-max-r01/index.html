<!doctype html>
<html lang="zh-CN">
<head>
<script src="../../../../assets/analytics.js" defer></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070e">
<title>Nocturne Citadel · 新哥特式塔楼城市</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #05070e;
    --panel: rgba(11, 15, 26, .76);
    --line: rgba(180, 195, 235, .17);
    --line-strong: rgba(180, 195, 235, .3);
    --text: #eef3ff;
    --muted: #93a1c1;
    --dim: #5f6d8e;
    --gold: #d9b56d;
    --violet: #9e8dff;
    --cyan: #7fd7f2;
    --red: #e28a86;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(circle at 50% 45%, transparent 42%, rgba(2,3,7,.5) 88%, rgba(1,2,5,.78) 100%);
  }
  .topbar {
    position: fixed; left: clamp(16px, 3vw, 38px); right: clamp(16px, 3vw, 38px); top: clamp(14px, 2.6vw, 28px);
    z-index: 5; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; pointer-events: none;
  }
  .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
  .brand-mark {
    width: 48px; height: 48px; flex: none; border-radius: 14px; display: grid; place-items: center;
    background: linear-gradient(150deg, rgba(217,181,109,.18), rgba(158,141,255,.1));
    border: 1px solid rgba(217,181,109,.32); color: var(--gold);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 16px 40px -24px rgba(217,181,109,.7);
  }
  .brand-mark svg { width: 28px; height: 28px; }
  .brand h1 { margin: 0; font-family: Georgia, "Songti SC", "SimSun", serif; font-size: clamp(18px, 2.2vw, 26px); letter-spacing: .06em; font-weight: 700; }
  .brand p { margin: 3px 0 0; color: var(--muted); font-size: 10.5px; letter-spacing: .06em; }
  .brand .cn { color: var(--gold); font-family: "Songti SC", "SimSun", serif; letter-spacing: .22em; }
  .controls { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; pointer-events: auto; }
  .seg { display: inline-flex; padding: 4px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); backdrop-filter: blur(14px); }
  .seg button {
    border: 0; background: transparent; color: var(--muted); border-radius: 8px; padding: 7px 11px;
    font-size: 10.5px; font-weight: 650; cursor: pointer; transition: .18s; white-space: nowrap;
  }
  .seg button.active { background: rgba(238,243,255,.12); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
  .btn {
    border: 1px solid var(--line); background: var(--panel); color: #cbd7ec; border-radius: 10px;
    padding: 8px 11px; font-size: 10.5px; font-weight: 650; cursor: pointer; backdrop-filter: blur(14px);
    display: inline-flex; align-items: center; gap: 6px; transition: .16s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--line-strong); color: #fff; }
  .btn:active { transform: scale(.98); }
  .btn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
  .btn.on .dot { background: var(--cyan); box-shadow: 0 0 8px rgba(127,215,242,.8); }
  .bottom-left {
    position: fixed; left: clamp(16px, 3vw, 38px); bottom: clamp(16px, 3vw, 30px); z-index: 5;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: min(480px, 60vw);
  }
  .hint {
    display: inline-flex; align-items: center; gap: 7px; flex-wrap: wrap; width: fit-content;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 13px;
    color: var(--muted); font-size: 10px; backdrop-filter: blur(14px); line-height: 1.5;
  }
  .hint kbd { font-family: inherit; font-size: 9px; color: #dbe6fb; border: 1px solid rgba(180,195,235,.25); border-radius: 4px; padding: 1px 5px; }
  .scale {
    display: inline-flex; align-items: center; gap: 8px; width: fit-content; color: var(--dim); font-size: 8.5px;
    letter-spacing: .14em; text-transform: uppercase;
  }
  .scale .bar { width: 100px; height: 5px; border: 1px solid rgba(217,181,109,.5); border-top: 0; position: relative; }
  .scale .bar::before, .scale .bar::after { content: ""; position: absolute; bottom: 0; width: 1px; height: 8px; background: rgba(217,181,109,.6); }
  .scale .bar::before { left: 0; }
  .scale .bar::after { right: 0; }
  .bottom-right {
    position: fixed; right: clamp(16px, 3vw, 38px); bottom: clamp(16px, 3vw, 30px); z-index: 5;
    text-align: right; color: var(--dim); font-size: 8.5px; line-height: 1.8; letter-spacing: .08em;
    pointer-events: none; text-transform: uppercase;
  }
  .bottom-right b { color: rgba(217,181,109,.75); font-weight: 600; }
  .fps { position: fixed; right: clamp(16px, 3vw, 38px); top: clamp(80px, 12vw, 112px); z-index: 4; color: var(--dim); font-size: 8.5px; letter-spacing: .12em; pointer-events: none; font-variant-numeric: tabular-nums; }
  .loading {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center;
    background: radial-gradient(700px 500px at 50% 46%, #10152a, #04060c 70%);
    transition: opacity .7s ease;
  }
  .loading.hidden { opacity: 0; pointer-events: none; }
  .loading .sigil {
    width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 16px; display: grid; place-items: center;
    border: 1px solid rgba(217,181,109,.4); color: var(--gold); background: rgba(217,181,109,.06);
    animation: breathe 2.8s ease-in-out infinite;
  }
  .loading .sigil svg { width: 32px; height: 32px; }
  @keyframes breathe { 0%,100% { transform: scale(1); box-shadow: 0 0 0 rgba(217,181,109,0); } 50% { transform: scale(1.06); box-shadow: 0 0 45px -8px rgba(217,181,109,.45); } }
  .loading h2 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: 22px; letter-spacing: .12em; }
  .loading p { margin: 8px 0 0; color: var(--muted); font-size: 10.5px; letter-spacing: .04em; }
  .loading .bar { width: 170px; height: 2px; margin: 18px auto 0; background: rgba(255,255,255,.08); overflow: hidden; border-radius: 999px; }
  .loading .bar i { display: block; height: 100%; width: 30%; background: linear-gradient(90deg, transparent, var(--gold), transparent); animation: load 1.5s infinite; }
  @keyframes load { from { transform: translateX(-120%); } to { transform: translateX(360%); } }
  .error {
    position: fixed; inset: 0; z-index: 30; display: none; place-items: center; text-align: center; padding: 28px;
    background: radial-gradient(600px 420px at 50% 45%, #20101a, #04060c 72%);
  }
  .error.show { display: grid; }
  .error b { display: block; margin: 10px 0 6px; font-size: 16px; color: #ffd9d6; }
  .error p { max-width: 400px; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px); z-index: 40;
    background: rgba(238,243,255,.95); color: #080b14; padding: 8px 14px; border-radius: 999px;
    font-size: 10.5px; font-weight: 650; opacity: 0; pointer-events: none; transition: .22s;
    box-shadow: 0 16px 40px -16px rgba(0,0,0,.8);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 720px) {
    body { overflow-y: auto; }
    #stage { position: fixed; }
    .topbar { flex-direction: column; gap: 10px; }
    .controls { justify-content: flex-start; }
    .bottom-left { max-width: calc(100% - 32px); }
    .bottom-right { display: none; }
    .brand p { display: none; }
    .fps { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="可漫游的新哥特式塔楼城市 3D 场景"></canvas>
<div class="vignette"></div>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v20M8 5l4-3 4 3M7 21V9l5-4 5 4v12M4 21h16"/><path d="M9 21v-6h6v6M9 11h6M9 14h6"/>
      </svg>
    </div>
    <div><h1>NOCTURNE CITADEL</h1><p><span class="cn">新哥特式塔楼城市</span> · 真实比例程序生成 · 可漫游</p></div>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="相机模式">
      <button type="button" data-mode="orbit" class="active">环视</button>
      <button type="button" data-mode="street">环城</button>
    </div>
    <button class="btn on" type="button" id="autoBtn"><span class="dot"></span><span id="autoLabel">自动漫游</span></button>
    <button class="btn" type="button" id="resetBtn">重置视角</button>
  </div>
</header>

<div class="fps" id="fps">— FPS</div>

<div class="bottom-left">
  <div class="hint" id="hint"><kbd>拖动</kbd> 旋转视角 <span style="opacity:.35">·</span> <kbd>滚轮</kbd> 缩放 <span style="opacity:.35">·</span> <kbd>WASD</kbd> 移动视点</div>
  <div class="scale"><span>比例尺</span><span class="bar"></span><span>约 50 m</span></div>
</div>
<div class="bottom-right">
  <div><b>程序生成</b> · 无外部模型或贴图</div>
  <div>高度单位：米 · Three.js r160</div>
</div>

<div class="loading" id="loading">
  <div>
    <div class="sigil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M8 5l4-3 4 3M7 21V9l5-4 5 4v12M4 21h16"/><path d="M9 21v-6h6v6"/></svg></div>
    <h2>NOCTURNE CITADEL</h2>
    <p>正在锻造尖塔、飞扶壁与海面…</p>
    <div class="bar"><i></i></div>
  </div>
</div>

<div class="error" id="error">
  <div>
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#e28a86" stroke-width="1.5" stroke-linecap="round"><path d="M12 3 2.8 20h18.4L12 3Z"/><path d="M12 9v5M12 17.2v.2"/></svg>
    <b>无法启动 3D 场景</b>
    <p id="errorMessage">当前浏览器无法创建 WebGL 上下文，或 Three.js 未能加载。请检查网络与硬件加速后刷新。</p>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  "use strict";

  const WORLD = {
    seaLevel: 0,
    cityGround: 12,
    plateauRadius: 57,
    wallRadius: 50,
    streetRadius: 44,
    treeRadius: 47.4
  };

  const canvas = document.getElementById("stage");
  const loading = document.getElementById("loading");
  const error = document.getElementById("error");
  const errorMessage = document.getElementById("errorMessage");
  const hint = document.getElementById("hint");
  const autoBtn = document.getElementById("autoBtn");
  const autoLabel = document.getElementById("autoLabel");
  const fpsEl = document.getElementById("fps");

  let renderer, scene, camera, clock;
  let seaMaterial, waterfallMaterials = [], bannerMaterials = [];
  let moonLight, hemiLight;
  let fireLights = [];
  let fireSprites = [];
  let emberSystem = null;
  let birds = null;
  let clouds = [];
  let stars, sky;
  let city;
  let mode = "orbit";
  let auto = true;
  let lastInteraction = 0;
  let dragging = false;
  let lastPointer = { x: 0, y: 0 };
  let pointers = new Map();
  let pinch = null;
  let frames = 0;
  let fpsAccum = 0;
  let toastTimer = null;

  if (!window.THREE) {
    showError("Three.js 未能从 CDN 加载。请检查网络连接后刷新页面。");
    return;
  }

  const orbit = {
    theta: -0.68,
    phi: 1.02,
    radius: 158,
    target: new THREE.Vector3(0, 32, 0)
  };
  const street = {
    angle: 0.18,
    radius: 112.0,
    height: 26.0,
    speed: 0.02,
    yaw: 0,
    pitch: 0.16,
    eye: 26.0
  };

  const RNG = mulberry32(0x9e3779b9);
  const unitBox = new THREE.BoxGeometry(1, 1, 1);
  const unitCylinder = new THREE.CylinderGeometry(1, 1, 1, 8);
  const unitCone4 = new THREE.ConeGeometry(1, 1, 4);
  const unitCone8 = new THREE.ConeGeometry(1, 1, 8);
  const unitPlane = new THREE.PlaneGeometry(1, 1);

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function showError(message) {
    errorMessage.textContent = message;
    error.classList.add("show");
    loading.classList.add("hidden");
  }

  function toast(message) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2100);
  }

  function makeTexture(size, painter, repeatX = 1, repeatY = 1) {
    const c = document.createElement("canvas");
    c.width = size;
    c.height = size;
    const ctx = c.getContext("2d");
    painter(ctx, size);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(repeatX, repeatY);
    tex.colorSpace = THREE.SRGBColorSpace;
    const maxAniso = renderer ? renderer.capabilities.getMaxAnisotropy() : 1;
    tex.anisotropy = Math.min(8, maxAniso);
    return tex;
  }

  function stoneTexture() {
    return makeTexture(256, (ctx, s) => {
      ctx.fillStyle = "#8e93a7";
      ctx.fillRect(0, 0, s, s);
      for (let y = 0; y < s; y += 22) {
        const offset = (y / 22) % 2 ? 18 : 0;
        ctx.strokeStyle = "rgba(48,50,65,.5)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(s, y);
        ctx.stroke();
        for (let x = -offset; x < s; x += 44) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x, y + 22);
          ctx.stroke();
        }
      }
      for (let n = 0; n < 900; n++) {
        const shade = 90 + Math.floor(Math.random() * 80);
        ctx.fillStyle = `rgba(${shade},${shade},${shade + 15},${0.05 + Math.random() * 0.12})`;
        ctx.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 3, 1 + Math.random() * 2);
      }
    }, 3, 5);
  }

  function roofTexture() {
    return makeTexture(256, (ctx, s) => {
      ctx.fillStyle = "#3a4058";
      ctx.fillRect(0, 0, s, s);
      for (let y = 0; y < s; y += 14) {
        const offset = (y / 14) % 2 ? 12 : 0;
        ctx.strokeStyle = "rgba(16,19,30,.55)";
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(s, y); ctx.stroke();
        for (let x = -offset; x < s; x += 24) {
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 14); ctx.stroke();
        }
      }
      for (let n = 0; n < 500; n++) {
        ctx.fillStyle = `rgba(150,165,210,${0.02 + Math.random() * 0.08})`;
        ctx.fillRect(Math.random() * s, Math.random() * s, 2, 1);
      }
    }, 4, 4);
  }

  function grassTexture() {
    return makeTexture(256, (ctx, s) => {
      ctx.fillStyle = "#3d4d40";
      ctx.fillRect(0, 0, s, s);
      for (let n = 0; n < 2600; n++) {
        const g = 55 + Math.floor(Math.random() * 55);
        ctx.fillStyle = `rgba(${30 + Math.random() * 20},${g},${40 + Math.random() * 25},${0.2 + Math.random() * 0.35})`;
        ctx.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 2, 1 + Math.random() * 3);
      }
    }, 8, 8);
  }

  function cobbleTexture() {
    return makeTexture(256, (ctx, s) => {
      ctx.fillStyle = "#3b3b48";
      ctx.fillRect(0, 0, s, s);
      for (let y = 0; y < s; y += 18) {
        for (let x = 0; x < s; x += 26) {
          const off = ((y / 18) % 2) * 13;
          ctx.fillStyle = `rgba(${50 + Math.random() * 30},${48 + Math.random() * 28},${62 + Math.random() * 30},.75)`;
          ctx.beginPath();
          ctx.roundRect(x + off + 1, y + 1, 23, 15, 4);
          ctx.fill();
          ctx.strokeStyle = "rgba(15,17,26,.65)";
          ctx.stroke();
        }
      }
    }, 8, 8);
  }

  function windowTexture() {
    return makeTexture(128, (ctx, s) => {
      ctx.clearRect(0, 0, s, s);
      const g = ctx.createRadialGradient(s / 2, s * 0.58, 4, s / 2, s * 0.58, s * 0.6);
      g.addColorStop(0, "rgba(255,246,210,1)");
      g.addColorStop(0.28, "rgba(255,188,96,.95)");
      g.addColorStop(0.72, "rgba(214,102,60,.35)");
      g.addColorStop(1, "rgba(120,40,40,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(s * 0.18, s * 0.94);
      ctx.lineTo(s * 0.18, s * 0.46);
      ctx.quadraticCurveTo(s * 0.18, s * 0.18, s * 0.5, s * 0.06);
      ctx.quadraticCurveTo(s * 0.82, s * 0.18, s * 0.82, s * 0.46);
      ctx.lineTo(s * 0.82, s * 0.94);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(255,240,190,.85)";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.strokeStyle = "rgba(36,24,28,.9)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(s * 0.5, s * 0.1);
      ctx.lineTo(s * 0.5, s * 0.94);
      ctx.moveTo(s * 0.2, s * 0.56);
      ctx.lineTo(s * 0.8, s * 0.56);
      ctx.moveTo(s * 0.2, s * 0.74);
      ctx.lineTo(s * 0.8, s * 0.74);
      ctx.stroke();
    });
  }

  function roseTexture() {
    return makeTexture(256, (ctx, s) => {
      ctx.clearRect(0, 0, s, s);
      const cx = s / 2, cy = s / 2, radius = s * 0.43;
      const glow = ctx.createRadialGradient(cx, cy, 4, cx, cy, radius);
      glow.addColorStop(0, "rgba(255,242,190,.95)");
      glow.addColorStop(0.45, "rgba(228,150,82,.75)");
      glow.addColorStop(0.85, "rgba(86,106,170,.35)");
      glow.addColorStop(1, "rgba(30,40,80,0)");
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(255,226,164,.75)";
      ctx.lineWidth = 2;
      for (let n = 0; n < 16; n++) {
        const a = n * Math.PI * 2 / 16;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * radius * 0.18, cy + Math.sin(a) * radius * 0.18);
        ctx.lineTo(cx + Math.cos(a) * radius * 0.95, cy + Math.sin(a) * radius * 0.95);
        ctx.stroke();
      }
      for (let ring = 1; ring <= 3; ring++) {
        ctx.beginPath();
        ctx.arc(cx, cy, radius * ring / 3.5, 0, Math.PI * 2);
        ctx.stroke();
      }
      for (let n = 0; n < 12; n++) {
        const a = n * Math.PI * 2 / 12;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * radius * 0.58, cy + Math.sin(a) * radius * 0.58, radius * 0.16, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.strokeStyle = "rgba(40,30,40,.75)";
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.stroke();
    });
  }

  function glowTexture() {
    return makeTexture(128, (ctx, s) => {
      ctx.clearRect(0, 0, s, s);
      const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      g.addColorStop(0, "rgba(255,255,255,1)");
      g.addColorStop(0.25, "rgba(255,240,200,.8)");
      g.addColorStop(0.6, "rgba(255,180,90,.25)");
      g.addColorStop(1, "rgba(255,150,70,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, s, s);
    });
  }

  function flameTexture() {
    return makeTexture(128, (ctx, s) => {
      ctx.clearRect(0, 0, s, s);
      const g = ctx.createRadialGradient(s / 2, s * 0.65, 2, s / 2, s * 0.6, s * 0.48);
      g.addColorStop(0, "rgba(255,255,230,1)");
      g.addColorStop(0.25, "rgba(255,224,140,.95)");
      g.addColorStop(0.55, "rgba(255,142,60,.55)");
      g.addColorStop(1, "rgba(220,70,30,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(s * 0.5, s * 0.06);
      ctx.bezierCurveTo(s * 0.75, s * 0.3, s * 0.8, s * 0.55, s * 0.5, s * 0.95);
      ctx.bezierCurveTo(s * 0.2, s * 0.55, s * 0.25, s * 0.3, s * 0.5, s * 0.06);
      ctx.fill();
    });
  }

  function cloudTexture() {
    return makeTexture(256, (ctx, s) => {
      ctx.clearRect(0, 0, s, s);
      for (let n = 0; n < 16; n++) {
        const x = s * (0.2 + Math.random() * 0.6);
        const y = s * (0.35 + Math.random() * 0.3);
        const r = s * (0.12 + Math.random() * 0.2);
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(210,220,245,${0.08 + Math.random() * 0.08})`);
        g.addColorStop(1, "rgba(150,165,205,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, s, s);
      }
    });
  }

  // ---------- scene setup ----------
  function init() {
    if (!window.THREE) {
      showError("Three.js 未能从 CDN 加载。请检查网络连接后刷新页面。");
      return;
    }
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    } catch (err) {
      showError("WebGL 初始化失败：" + (err.message || err));
      return;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a1024, 0.0022);

    camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.2, 1600);
    applyOrbitCamera();

    clock = new THREE.Clock();
    city = new THREE.Group();
    scene.add(city);

    buildEnvironment();
    buildCity();
    setupControls();
    window.addEventListener("resize", onResize);

    loading.classList.add("hidden");
    animate();
  }

  function buildEnvironment() {
    // Materials generated from procedural textures.
    const stoneMap = stoneTexture();
    const roofMap = roofTexture();
    const grassMap = grassTexture();
    const cobbleMap = cobbleTexture();
    window.__materials = {
      stone: new THREE.MeshStandardMaterial({ map: stoneMap, color: 0xb8bccb, roughness: 0.9, metalness: 0.02 }),
      darkStone: new THREE.MeshStandardMaterial({ map: stoneMap, color: 0x777c92, roughness: 0.88, metalness: 0.03 }),
      roof: new THREE.MeshStandardMaterial({ map: roofMap, color: 0x9aa4c4, roughness: 0.72, metalness: 0.08 }),
      gold: new THREE.MeshStandardMaterial({ color: 0xd9b56d, roughness: 0.28, metalness: 0.85, emissive: 0x241a05, emissiveIntensity: 0.35 }),
      grass: new THREE.MeshStandardMaterial({ map: grassMap, color: 0x728571, roughness: 1 }),
      cobble: new THREE.MeshStandardMaterial({ map: cobbleMap, color: 0x8d8fa2, roughness: 0.98 }),
      rock: new THREE.MeshStandardMaterial({ color: 0x3c3c48, roughness: 0.98, flatShading: true }),

  }

  function buildSky() {
    const skyGeo = new THREE.SphereGeometry(720, 40, 20);
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: {
        uTop: { value: new THREE.Color(0x050a1a) },
        uHorizon: { value: new THREE.Color(0x402442) },
        uBottom: { value: new THREE.Color(0x0a0c18) },
        uSun: { value: new THREE.Vector3(0.7, 0.04, -0.55).normalize() },
        uMoon: { value: new THREE.Vector3(-0.45, 0.32, -0.7).normalize() }
      },
      vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        precision highp float;
        varying vec3 vDir;
        uniform vec3 uTop; uniform vec3 uHorizon; uniform vec3 uBottom;
        uniform vec3 uSun; uniform vec3 uMoon;
        void main(){
          float h = clamp(vDir.y * 0.5 + 0.5, 0.0, 1.0);
          vec3 col = mix(uBottom, uHorizon, smoothstep(0.15, 0.52, h));
          col = mix(col, uTop, smoothstep(0.48, 0.96, h));
          float sunGlow = pow(max(dot(vDir, uSun), 0.0), 10.0);
          col += vec3(0.55, 0.22, 0.12) * sunGlow * 0.65;
          float moonGlow = pow(max(dot(vDir, uMoon), 0.0), 160.0);
          col += vec3(0.58, 0.68, 1.0) * moonGlow * 1.1;
          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    sky = new THREE.Mesh(skyGeo, skyMat);
    sky.frustumCulled = false;
    scene.add(sky);

    const starPositions = [];
    const starColors = [];
    const rng = mulberry32(12345);
    for (let i = 0; i < 1600; i++) {
      const theta = rng() * Math.PI * 2;
      const phi = Math.acos(0.08 + rng() * 0.9);
      const r = 640;
      const x = r * Math.sin(phi) * Math.cos(theta);
      const y = r * Math.cos(phi);
      const z = r * Math.sin(phi) * Math.sin(theta);
      starPositions.push(x, y, z);
      const warm = rng();
      starColors.push(warm > 0.85 ? 1.0 : 0.8, warm > 0.85 ? 0.78 : 0.9, 1.0);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPositions, 3));
    starGeo.setAttribute("color", new THREE.Float32BufferAttribute(starColors, 3));
    stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
      size: 2.0, sizeAttenuation: false, vertexColors: true, transparent: true,
      opacity: 0.95, depthWrite: false, fog: false, map: glowTexture(), blending: THREE.AdditiveBlending
    }));
    stars.frustumCulled = false;
    scene.add(stars);

    const moonSprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture(), color: 0xcfdcff, transparent: true, depthWrite: false, fog: false,
      blending: THREE.AdditiveBlending, opacity: 0.95
    }));
    moonSprite.position.set(-360, 250, -460);
    moonSprite.scale.set(150, 150, 1);
    scene.add(moonSprite);
    const moonCore = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture(), color: 0xffffff, transparent: true, depthWrite: false, fog: false,
      blending: THREE.AdditiveBlending, opacity: 1
    }));
    moonCore.position.copy(moonSprite.position);
    moonCore.scale.set(42, 42, 1);
    scene.add(moonCore);

    const cloudTex = cloudTexture();
    const rng2 = mulberry32(991);
    for (let i = 0; i < 11; i++) {
      const mat = new THREE.SpriteMaterial({
        map: cloudTex, transparent: true, depthWrite: false, opacity: 0.22 + rng2() * 0.18,
        color: i % 3 === 0 ? 0xb9a8d8 : 0xb5c4e6, blending: THREE.NormalBlending
      });
      const sprite = new THREE.Sprite(mat);
      const angle = rng2() * Math.PI * 2;
      const radius = 150 + rng2() * 260;
      sprite.position.set(Math.cos(angle) * radius, 85 + rng2() * 70, Math.sin(angle) * radius);
      const scale = 90 + rng2() * 130;
      sprite.scale.set(scale, scale * (0.35 + rng2() * 0.2), 1);
      sprite.userData.speed = 0.6 + rng2() * 1.1;
      scene.add(sprite);
      clouds.push(sprite);
    }
  }

  function buildSea() {
    const seaGeo = new THREE.PlaneGeometry(1100, 1100, 110, 110);
    seaMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uMoonDir: { value: new THREE.Vector3(-0.45, 0.32, -0.7).normalize() },
        uFogColor: { value: new THREE.Color(0x0a1024) },
        uCamera: { value: new THREE.Vector3() }
      },
      vertexShader: `
        uniform float uTime;
        varying vec3 vWorldPos;
        varying vec3 vNormal;
        float wave(vec2 p) {
          return sin(p.x * 0.085 + uTime * 1.05) * 0.30
               + sin(p.y * 0.12 - uTime * 0.82) * 0.24
               + sin((p.x + p.y) * 0.055 + uTime * 0.55) * 0.36
               + sin((p.x - p.y) * 0.16 + uTime * 1.5) * 0.08;
        }
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          float h = wave(wp.xz);
          wp.y += h;
          float e = 1.1;
          float hx = wave(wp.xz + vec2(e, 0.0));
          float hz = wave(wp.xz + vec2(0.0, e));
          vNormal = normalize(vec3(-(hx - h) / e, 1.0, -(hz - h) / e));
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        precision highp float;
        varying vec3 vWorldPos;
        varying vec3 vNormal;
        uniform float uTime;
        uniform vec3 uMoonDir;
        uniform vec3 uFogColor;
        uniform vec3 uCamera;
        void main() {
          vec3 n = normalize(vNormal);
          vec3 viewDir = normalize(uCamera - vWorldPos);
          vec3 lightDir = normalize(uMoonDir);
          float diff = max(dot(n, lightDir), 0.0);
          float fresnel = pow(1.0 - max(dot(n, viewDir), 0.0), 4.0);
          vec3 deep = vec3(0.018, 0.045, 0.075);
          vec3 shallow = vec3(0.055, 0.16, 0.19);
          vec3 col = mix(deep, shallow, clamp(n.y * 0.9 + fresnel * 0.8, 0.0, 1.0));
          col += vec3(0.55, 0.68, 0.95) * diff * 0.13;
          vec3 halfDir = normalize(lightDir + viewDir);
          float spec = pow(max(dot(n, halfDir), 0.0), 150.0);
          col += vec3(0.9, 0.96, 1.0) * spec * 1.7;
          float r = length(vWorldPos.xz);
          float shore = 1.0 - smoothstep(56.0, 112.0, r);
          float foamNoise = sin(vWorldPos.x * 0.35 + uTime * 1.7) * sin(vWorldPos.z * 0.42 - uTime * 1.3);
          col += vec3(0.35, 0.5, 0.52) * shore * max(foamNoise, 0.0) * 0.35;
          float dist = length(uCamera - vWorldPos);
          col = mix(col, uFogColor, smoothstep(180.0, 620.0, dist));
          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    const sea = new THREE.Mesh(seaGeo, seaMaterial);
    sea.rotation.x = -Math.PI / 2;
    sea.position.y = 0;
    scene.add(sea);

    // Distant sea stacks.
    const rockGeo = new THREE.DodecahedronGeometry(1, 0);
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x232631, roughness: 1, flatShading: true });
    const rng = mulberry32(7717);
    const stacks = new THREE.InstancedMesh(rockGeo, rockMat, 26);
    const dummy = new THREE.Object3D();
    for (let i = 0; i < 26; i++) {
      const a = rng() * Math.PI * 2;
      const r = 160 + rng() * 260;
      const s = 5 + rng() * 18;
      dummy.position.set(Math.sin(a) * r, -1 + rng() * 6 - s * 0.3, Math.cos(a) * r);
      dummy.rotation.set(rng() * 0.2, rng() * Math.PI, rng() * 0.15);
      dummy.scale.set(s * (0.7 + rng() * 0.8), s * (0.8 + rng() * 1.2), s * (0.7 + rng() * 0.8));
      dummy.updateMatrix();
      stacks.setMatrixAt(i, dummy.matrix);
    }
    scene.add(stacks);
  }

  function buildLights() {
    hemiLight = new THREE.HemisphereLight(0x9fb8ff, 0x2a1e31, 0.8);
    scene.add(hemiLight);

    moonLight = new THREE.DirectionalLight(0xb8c8ff, 2.7);
    moonLight.position.set(-100, 150, -120);
    moonLight.target.position.set(0, 16, 0);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(2048, 2048);
    moonLight.shadow.camera.left = -105;
    moonLight.shadow.camera.right = 105;
    moonLight.shadow.camera.top = 105;
    moonLight.shadow.camera.bottom = -105;
    moonLight.shadow.camera.near = 20;
    moonLight.shadow.camera.far = 380;
    moonLight.shadow.bias = -0.0004;
    moonLight.shadow.normalBias = 0.45;
    scene.add(moonLight);
    scene.add(moonLight.target);

    const warmRim = new THREE.DirectionalLight(0xff9466, 0.7);
    warmRim.position.set(120, 48, -80);
    scene.add(warmRim);

    const ambient = new THREE.AmbientLight(0x30344f, 0.45);
    scene.add(ambient);
  }

  function buildIsland() {
    const mat = window.__materials;
    const cliffGeo = new THREE.CylinderGeometry(WORLD.plateauRadius, 84, 12, 112, 10, true);
    const pos = cliffGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      const angle = Math.atan2(z, x);
      const t = (y + 6) / 12;
      const rough = 1 + (Math.sin(angle * 7.0 + y * 0.8) * 0.018 + Math.sin(angle * 13.0 - y * 0.4) * 0.012) * (1.0 - t * 0.5);
      pos.setX(i, x * rough);
      pos.setZ(i, z * rough);
    }
    cliffGeo.computeVertexNormals();
    const cliff = new THREE.Mesh(cliffGeo, mat.rock);
    cliff.position.y = 6;
    cliff.receiveShadow = true;
    cliff.castShadow = true;
    city.add(cliff);

    const plateau = new THREE.Mesh(new THREE.CircleGeometry(WORLD.plateauRadius + 2.0, 96), mat.grass);
    plateau.rotation.x = -Math.PI / 2;
    plateau.position.y = WORLD.cityGround + 0.03;
    plateau.receiveShadow = true;
    city.add(plateau);

    // Cobblestone roads.
    const ring = (inner, outer, y, colorMat) => {
      const mesh = new THREE.Mesh(new THREE.RingGeometry(inner, outer, 96), colorMat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.y = y;
      mesh.receiveShadow = true;
      city.add(mesh);
      return mesh;
    };
    ring(41, 47.2, WORLD.cityGround + 0.06, mat.cobble);
    ring(24, 29.5, WORLD.cityGround + 0.055, mat.cobble);
    ring(0, 13, WORLD.cityGround + 0.07, mat.cobble);
    const procession = new THREE.Mesh(new THREE.PlaneGeometry(9, 32), mat.cobble);
    procession.rotation.x = -Math.PI / 2;
    procession.position.set(0, WORLD.cityGround + 0.065, 35);
    procession.receiveShadow = true;
    city.add(procession);

    // Rocky base chunks and shoreline boulders.
    const rockGeo = new THREE.DodecahedronGeometry(1, 0);
    const rng = mulberry32(3107);
    const rocks = new THREE.InstancedMesh(rockGeo, mat.rock, 70);
    const dummy = new THREE.Object3D();
    for (let i = 0; i < 70; i++) {
      const a = rng() * Math.PI * 2;
      const r = 58 + rng() * 32;
      const s = 1.6 + rng() * 5.2;
      dummy.position.set(Math.sin(a) * r, 0.4 + rng() * 7, Math.cos(a) * r);
      dummy.rotation.set(rng() * Math.PI, rng() * Math.PI, rng() * Math.PI);
      dummy.scale.set(s * (0.8 + rng() * 0.7), s * (0.6 + rng() * 1.1), s * (0.8 + rng() * 0.7));
      dummy.updateMatrix();
      rocks.setMatrixAt(i, dummy.matrix);
    }
    rocks.castShadow = true;
    rocks.receiveShadow = true;
    city.add(rocks);
  }

  // ---------- architecture ----------
  let materials;
  function mat() { return window.__materials; }

  function addBox(parent, w, h, d, material, x, y, z, cast = true) {
    const mesh = new THREE.Mesh(unitBox, material);
    mesh.scale.set(w, h, d);
    mesh.position.set(x, y, z);
    mesh.castShadow = cast;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
  }

  function addCone(parent, radius, height, sides, material, x, y, z, rotationY = Math.PI / 4) {
    const geo = sides === 4 ? unitCone4 : unitCone8;
    const mesh = new THREE.Mesh(geo, material);
    mesh.scale.set(radius, height, radius);
    mesh.position.set(x, y, z);
    mesh.rotation.y = rotationY;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
  }

  function addCylinder(parent, radius, height, material, x, y, z, sides = 8) {
    const geo = new THREE.CylinderGeometry(1, 1, 1, sides);
    const mesh = new THREE.Mesh(geo, material);
    mesh.scale.set(radius, height, radius);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
  }

  function addWindowPlane(parent, x, y, z, w, h, rotationY = 0, material = null) {
    const mesh = new THREE.Mesh(unitPlane, material || mat().window);
    mesh.scale.set(w, h, 1);
    mesh.position.set(x, y, z);
    mesh.rotation.y = rotationY;
    parent.add(mesh);
    return mesh;
  }

  function buildCity() {
    materials = mat();
    buildCathedral();
    buildTowers();
    buildWall();
    buildGate();
    buildHouses();
    buildStreetLamps();
    buildTrees();
    buildBridges();
    buildBraziers();
    buildWaterfalls();
    buildBanners();
  }

  function buildCathedral() {
    const g = new THREE.Group();
    g.position.set(0, WORLD.cityGround, 0);
    city.add(g);
    const m = materials;

    // Nave and side aisles.
    addBox(g, 22, 26, 44, m.stone, 0, 13, -2);
    addBox(g, 6, 14, 40, m.darkStone, -13, 7, -4);
    addBox(g, 6, 14, 40, m.darkStone, 13, 7, -4);

    // Steep gable roof over the nave.
    const roofShape = new THREE.Shape();
    roofShape.moveTo(-12, 0);
    roofShape.lineTo(12, 0);
    roofShape.lineTo(0, 12);
    roofShape.closePath();
    const roofGeo = new THREE.ExtrudeGeometry(roofShape, { depth: 46, bevelEnabled: false });
    roofGeo.translate(0, 0, -23);
    const roof = new THREE.Mesh(roofGeo, m.roof);
    roof.position.set(0, 26, -2);
    roof.castShadow = true;
    roof.receiveShadow = true;
    g.add(roof);
    // Side aisle roofs.
    for (const side of [-1, 1]) {
      const sideShape = new THREE.Shape();
      sideShape.moveTo(-3.4, 0);
      sideShape.lineTo(3.4, 0);
      sideShape.lineTo(0, 4.2);
      sideShape.closePath();
      const geo = new THREE.ExtrudeGeometry(sideShape, { depth: 40, bevelEnabled: false });
      geo.translate(0, 0, -20);
      const mesh = new THREE.Mesh(geo, m.roof);
      mesh.position.set(side * 13, 14, -4);
      mesh.castShadow = true;
      g.add(mesh);
    }

    // West facade block.
    addBox(g, 25, 32, 4, m.stone, 0, 16, 22);
    // Twin west towers.
    for (const side of [-1, 1]) {
      const tx = side * 13.6;
      addBox(g, 8.2, 50, 8.2, m.stone, tx, 25, 23);
      addBox(g, 9.2, 3, 9.2, m.darkStone, tx, 51, 23);
      addCone(g, 5.3, 23, 4, m.roof, tx, 63.5, 23);
      addBox(g, 0.5, 7, 0.5, m.gold, tx, 77, 23);
      // Pinnacles.
      for (const dx of [-4.1, 4.1]) {
        for (const dz of [-4.1, 4.1]) {
          addCone(g, 0.7, 6, 4, m.darkStone, tx + dx, 54.5, 23 + dz);
        }
      }
      // Windows on tower front.
      addWindowPlane(g, tx - 1.9, 24, 27.15, 2.5, 8, 0);
      addWindowPlane(g, tx + 1.9, 24, 27.15, 2.5, 8, 0);
      addWindowPlane(g, tx - 1.9, 38, 27.15, 2.4, 7.5, 0);
      addWindowPlane(g, tx + 1.9, 38, 27.15, 2.4, 7.5, 0);
    }

    // Central crossing tower and spire.
    addCylinder(g, 7.2, 15, m.stone, 0, 33.5, -6, 8);
    addCylinder(g, 7.8, 2, m.darkStone, 0, 42, -6, 8);
    addCone(g, 7.2, 48, 8, m.roof, 0, 67, -6);
    addCylinder(g, 0.35, 8, m.gold, 0, 95, -6, 6);
    addCone(g, 1.1, 3.2, 8, m.gold, 0, 100.6, -6);

    // Apse.
    addCylinder(g, 10.6, 22, m.stone, 0, 11, -25, 12);
    addCone(g, 11.2, 10, 12, m.roof, 0, 27, -25, 0);

    // Rose window and portal.
    const roseRing = new THREE.Mesh(new THREE.TorusGeometry(5.4, 0.55, 8, 40), m.stone);
    roseRing.position.set(0, 28, 24.1);
    roseRing.castShadow = true;
    g.add(roseRing);
    addWindowPlane(g, 0, 28, 24.25, 9.2, 9.2, 0, m.rose);
    addWindowPlane(g, 0, 8.2, 24.2, 6.5, 10.5, 0);

    // Gable above the rose window.
    addBox(g, 25, 3, 4.4, m.stone, 0, 33.5, 22.4);
    addCone(g, 8, 8, 4, m.roof, 0, 38.6, 22.2, Math.PI / 4);

    // Side lancet windows.
    for (const side of [-1, 1]) {
      for (let z = -18; z <= 16; z += 7.5) {
        addWindowPlane(g, side * 11.06, 17, z, 2.4, 7.4, side * Math.PI / 2);
      }
    }

    // Flying buttresses along the nave.
    for (const side of [-1, 1]) {
      for (let z = -16; z <= 16; z += 8) {
        const pierX = side * 18.5;
        addBox(g, 1.5, 18, 1.5, m.darkStone, pierX, 9, z);
        addCone(g, 0.65, 5.5, 4, m.darkStone, pierX, 20.7, z);
        const curve = new THREE.QuadraticBezierCurve3(
          new THREE.Vector3(pierX, 18, z),
          new THREE.Vector3(side * 16.2, 25.5, z),
          new THREE.Vector3(side * 11.15, 23.5, z)
        );
        const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 18, 0.36, 6, false), m.stone);
        tube.castShadow = true;
        g.add(tube);
        const support = new THREE.QuadraticBezierCurve3(
          new THREE.Vector3(pierX, 9, z),
          new THREE.Vector3(side * 15.5, 16, z),
          new THREE.Vector3(side * 11.3, 20.5, z)
        );
        const supportMesh = new THREE.Mesh(new THREE.TubeGeometry(support, 14, 0.28, 6, false), m.darkStone);
        supportMesh.castShadow = true;
        g.add(supportMesh);
      }
    }

    // Facade pinnacles.
    for (const x of [-10.5, -5.2, 0, 5.2, 10.5]) {
      addCone(g, 0.8, 8, 4, m.darkStone, x, 39.2, 24.2);
    }

    // Warm entrance lights.
    const entranceGlow = new THREE.PointLight(0xffa45e, 120, 46, 2);
    entranceGlow.position.set(0, 10, 30);
    g.add(entranceGlow);

    // Rose glow.
    const roseLight = new THREE.PointLight(0xffb06a, 55, 24, 2);
    roseLight.position.set(0, 28, 27);
    g.add(roseLight);
  }

  function buildTower(angle, radius, baseY, height, width, spireHeight, options = {}) {
    const g = new THREE.Group();
    const x = Math.sin(angle) * radius;
    const z = Math.cos(angle) * radius;
    g.position.set(x, baseY, z);
    g.rotation.y = angle;
    city.add(g);
    const m = materials;
    const bodyH = height * 0.56;
    const upperH = height * 0.44;
    addBox(g, width, bodyH, width, m.stone, 0, bodyH / 2, 0);
    addBox(g, width * 0.78, upperH, width * 0.78, m.darkStone, 0, bodyH + upperH / 2, 0);
    // Corner buttresses.
    for (const dx of [-1, 1]) {
      for (const dz of [-1, 1]) {
        addBox(g, width * 0.12, height * 0.82, width * 0.12, m.darkStone, dx * width * 0.43, height * 0.41, dz * width * 0.43);
      }
    }
    // Parapet merlons and corner pinnacles.
    for (const dx of [-1, 1]) {
      for (const dz of [-1, 1]) {
        addBox(g, width * 0.17, 1.5, width * 0.17, m.darkStone, dx * width * 0.37, height + 0.75, dz * width * 0.37);
        addCone(g, width * 0.1, width * 0.62, 4, m.roof, dx * width * 0.37, height + 2.1, dz * width * 0.37);
      }
    }
    // Spire.
    addCone(g, width * 0.56, spireHeight, 4, m.roof, 0, height + spireHeight / 2, 0);
    addCylinder(g, 0.18, 3.2, m.gold, 0, height + spireHeight + 1.5, 0, 6);
    // Windows on the outward face.
    addWindowPlane(g, -width * 0.17, bodyH * 0.55, width / 2 + 0.06, width * 0.24, bodyH * 0.42, 0);
    addWindowPlane(g, width * 0.17, bodyH * 0.55, width / 2 + 0.06, width * 0.24, bodyH * 0.42, 0);
    addWindowPlane(g, 0, bodyH + upperH * 0.45, width * 0.39 + 0.06, width * 0.3, upperH * 0.55, 0);
    if (options.banner) {
      addBanner(g, width * 0.42, height * 0.64, width * 0.52, 0, options.banner, 0.7);
    }
    return { group: g, x, z, height, width };
  }

  function buildWall() {
    const m = materials;
    const wallGeo = new THREE.CylinderGeometry(WORLD.wallRadius, WORLD.wallRadius + 1.2, 7.5, 104, 1, true);
    const wall = new THREE.Mesh(wallGeo, m.stone);

    // Battlements.
    const count = 104;
    const merlons = new THREE.InstancedMesh(unitBox, m.darkStone, count);
    const dummy = new THREE.Object3D();
    let index = 0;
    for (let i = 0; i < count; i++) {
      const a = i / count * Math.PI * 2;
      if (Math.abs(Math.atan2(Math.sin(a), Math.cos(a))) < 0.055) continue; // gate gap
      dummy.position.set(Math.sin(a) * (WORLD.wallRadius + 0.55), WORLD.cityGround + 8.1, Math.cos(a) * (WORLD.wallRadius + 0.55));
      dummy.rotation.set(0, a, 0);
      dummy.scale.set(1.5, 1.3, 0.8);
      dummy.updateMatrix();
      merlons.setMatrixAt(index++, dummy.matrix);
    }
    merlons.count = index;
    merlons.castShadow = true;
    merlons.receiveShadow = true;
    city.add(merlons);

    // Wall towers.
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2 + Math.PI / 12;
      if (Math.abs(Math.atan2(Math.sin(a), Math.cos(a))) < 0.16) continue;

      const h = 2.2 + rng() * 2.2;
      dummy.position.set(Math.sin(a) * r, WORLD.cityGround + h / 2, Math.cos(a) * r);

  function buildHouses() {
    const m = materials;
    const rng = mulberry32(0x1234abcd);
    const houses = [];
    const towerPositions = window.__towers.map((t) => ({ x: t.x, z: t.z }));
    const rings = [16.2, 20.4, 25.1, 30.2, 35.4];
    for (const radius of rings) {
      const circumference = Math.PI * 2 * radius;
      const count = Math.floor(circumference / 6.4);
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2 + (rng() - 0.5) * 0.08;
        if (Math.abs(Math.atan2(Math.sin(a), Math.cos(a))) < 0.17 && radius > 18) continue;
        const x = Math.sin(a) * radius + (rng() - 0.5) * 1.4;
        const z = Math.cos(a) * radius + (rng() - 0.5) * 1.4;
        if (Math.abs(x) < 13 && z > -27) continue;
        let nearTower = false;
        for (const t of towerPositions) {
          if (Math.hypot(x - t.x, z - t.z) < 5.4) { nearTower = true; break; }
        }
        if (nearTower) continue;
        const w = 3.4 + rng() * 2.4;
        const d = 3.4 + rng() * 2.4;
        const h = 4.2 + rng() * 4.8;
        const roofH = 2.4 + rng() * 2.2;
        houses.push({ x, z, a, w, d, h, roofH, tint: 0.72 + rng() * 0.28, warm: rng() });
      }
    }

    const bodyMesh = new THREE.InstancedMesh(unitBox, new THREE.MeshStandardMaterial({ map: m.stone.map, color: 0xffffff, roughness: 0.92 }), houses.length);
    const roofGeo = new THREE.ConeGeometry(1, 1, 4);
    roofGeo.rotateY(Math.PI / 4);
    const roofMesh = new THREE.InstancedMesh(roofGeo, new THREE.MeshStandardMaterial({ map: m.roof.map, color: 0xffffff, roughness: 0.8 }), houses.length);
    const windowMesh = new THREE.InstancedMesh(unitPlane, m.window, houses.length * 2);
    const dummy = new THREE.Object3D();
    const c = new THREE.Color();
    let windowIndex = 0;
    houses.forEach((house, i) => {
      dummy.position.set(house.x, WORLD.cityGround + house.h / 2, house.z);
      dummy.rotation.set(0, house.a, 0);
      dummy.scale.set(house.w, house.h, house.d);
      dummy.updateMatrix();
      bodyMesh.setMatrixAt(i, dummy.matrix);
      c.setHSL(0.6 + rng() * 0.03, 0.06 + rng() * 0.06, 0.38 + house.tint * 0.22);
      bodyMesh.setColorAt(i, c);
      dummy.position.set(house.x, WORLD.cityGround + house.h + house.roofH / 2, house.z);
      dummy.rotation.set(0, house.a, 0);
      dummy.scale.set(house.w * 0.82, house.roofH, house.d * 0.82);
      dummy.updateMatrix();
      roofMesh.setMatrixAt(i, dummy.matrix);
      c.setHSL(0.62, 0.15, 0.17 + rng() * 0.1);
      roofMesh.setColorAt(i, c);
      for (const side of [-1, 1]) {
        const localX = side * house.w * 0.22;
        const localZ = house.d / 2 + 0.07;
        dummy.position.set(
          house.x + Math.cos(house.a) * localX + Math.sin(house.a) * localZ,
          WORLD.cityGround + house.h * 0.55,
          house.z - Math.sin(house.a) * localX + Math.cos(house.a) * localZ
        );
        dummy.rotation.set(0, house.a, 0);
        dummy.scale.set(house.w * 0.16, house.h * 0.3, 1);
        dummy.updateMatrix();
        windowMesh.setMatrixAt(windowIndex, dummy.matrix);
        const lit = house.warm > 0.32;
        c.setRGB(lit ? 1.0 : 0.25, lit ? 0.62 : 0.32, lit ? 0.28 : 0.45);
        c.multiplyScalar(lit ? 0.85 + rng() * 0.35 : 0.55);
        windowMesh.setColorAt(windowIndex, c);
        windowIndex++;
      }
    });
    if (bodyMesh.instanceColor) bodyMesh.instanceColor.needsUpdate = true;
    if (roofMesh.instanceColor) roofMesh.instanceColor.needsUpdate = true;
    if (windowMesh.instanceColor) windowMesh.instanceColor.needsUpdate = true;
    bodyMesh.castShadow = true;
    bodyMesh.receiveShadow = true;
    roofMesh.castShadow = true;
    roofMesh.receiveShadow = true;
    city.add(bodyMesh, roofMesh, windowMesh);
  }

  function buildStreetLamps() {
    const m = materials;
    const count = 34;
    const poleGeo = new THREE.CylinderGeometry(0.09, 0.13, 3.4, 5);
    const headGeo = new THREE.SphereGeometry(0.32, 8, 6);

    for (let i = 0; i < count; i++) {
      const a = i / count * Math.PI * 2 + 0.07;

      const x = Math.sin(a) * r;
      const z = Math.cos(a) * r;
      dummy.position.set(x, WORLD.cityGround + 1.7, z);
      dummy.rotation.set(0, a, 0);
      dummy.updateMatrix();
      poles.setMatrixAt(i, dummy.matrix);
      dummy.position.y = WORLD.cityGround + 3.5;
      dummy.updateMatrix();
      heads.setMatrixAt(i, dummy.matrix);
      glowPositions.push(x, WORLD.cityGround + 3.55, z);

    poles.castShadow = true;
    city.add(poles, heads);
    const glowGeo = new THREE.BufferGeometry();

      map: glowTexture(), size: 4.2, sizeAttenuation: true, transparent: true,

  function buildTrees() {
    const rng = mulberry32(5519);
    const trunkGeo = new THREE.CylinderGeometry(0.12, 0.18, 1, 5);
    const crownGeo = new THREE.ConeGeometry(1, 1, 6);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x2b211c, roughness: 1 });
    const crownMat = new THREE.MeshStandardMaterial({ color: 0x2a4437, roughness: 1, flatShading: true });
    const count = 46;
    const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, count);
    const crowns = new THREE.InstancedMesh(crownGeo, crownMat, count);
    const dummy = new THREE.Object3D();
    let index = 0;
    let guard = 0;
    while (index < count && guard++ < 500) {
      const a = rng() * Math.PI * 2;
      const r = 14 + rng() * 21;
      const x = Math.sin(a) * r;
      const z = Math.cos(a) * r;
      if (Math.abs(x) < 11 && z > -26) continue;
      let tooClose = false;
      for (const t of window.__towers) {
        if (Math.hypot(x - t.x, z - t.z) < 4.5) { tooClose = true; break; }
      }
      if (tooClose) continue;
      const h = 2.4 + rng() * 3.2;
      dummy.position.set(x, WORLD.cityGround + h / 2, z);
      dummy.rotation.set(0, rng() * 6.28, 0);
      dummy.scale.set(1, h, 1);
      dummy.updateMatrix();
      trunks.setMatrixAt(index, dummy.matrix);
      dummy.position.y = WORLD.cityGround + h + 1.3;
      dummy.scale.set(1.4 + rng(), 2.6 + rng() * 2, 1.4 + rng());
      dummy.updateMatrix();
      crowns.setMatrixAt(index, dummy.matrix);
      index++;
    }
    trunks.count = index;
    crowns.count = index;
    trunks.castShadow = true;
    crowns.castShadow = true;
    city.add(trunks, crowns);
  }

  function buildBridges() {
    const m = materials;
    const pairs = [[0, 1], [3, 4], [7, 8], [10, 11]];
    for (const [i, j] of pairs) {
      const a = window.__towers[i];
      const b = window.__towers[j];
      if (!a || !b) continue;
      const midX = (a.x + b.x) / 2;
      const midZ = (a.z + b.z) / 2;
      const len = Math.hypot(a.x - b.x, a.z - b.z);
      const y = WORLD.cityGround + 24 + (i % 2) * 3;
      const angle = Math.atan2(a.x - b.x, a.z - b.z);
      const g = new THREE.Group();
      g.position.set(midX, y, midZ);
      g.rotation.y = angle;
      addBox(g, 2.6, 0.7, len, m.darkStone, 0, 0, 0);
      addBox(g, 0.18, 1.5, len, m.stone, -1.4, 0.9, 0);
      addBox(g, 0.18, 1.5, len, m.stone, 1.4, 0.9, 0);
      city.add(g);
      // Support arches under the bridge.
      for (const side of [-1, 1]) {
        const arch = new THREE.QuadraticBezierCurve3(
          new THREE.Vector3(side * 1.3, -0.2, -len / 2),
          new THREE.Vector3(side * 1.3, -len * 0.28, 0),
          new THREE.Vector3(side * 1.3, -0.2, len / 2)
        );
        const tube = new THREE.Mesh(new THREE.TubeGeometry(arch, 20, 0.28, 5, false), m.stone);
        tube.position.copy(g.position);
        tube.rotation.copy(g.rotation);
        tube.castShadow = true;
        tube.receiveShadow = true;
        city.add(tube);
      }
      // Lanterns at midpoints.
      addGlowSprite(midX + 1.7, y + 2.2, midZ, 2.6, 0xffb36a);
      addGlowSprite(midX - 1.7, y + 2.2, midZ, 2.6, 0xffb36a);
    }
  }

  function addGlowSprite(x, y, z, scale, color) {
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture(), color, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, opacity: 0.85
    }));
    sprite.position.set(x, y, z);
    sprite.scale.set(scale, scale, 1);
    city.add(sprite);
    return sprite;
  }

  function buildBraziers() {
    const m = materials;
    const positions = [
      { x: -11, z: 17 }, { x: 11, z: 17 },
      { x: -9, z: 43 }, { x: 9, z: 43 },
      { x: -24, z: -1 }, { x: 24, z: -1 }
    ];
    const flameTex = flameTexture();
    positions.forEach((p, index) => {
      const g = new THREE.Group();
      g.position.set(p.x, WORLD.cityGround, p.z);
      city.add(g);
      addBox(g, 1.1, 0.6, 1.1, m.darkStone, 0, 0.35, 0);
      addCylinder(g, 0.16, 2.2, m.gold, 0, 1.1, 0, 6);
      addCylinder(g, 0.9, 0.7, m.darkStone, 0, 2.5, 0, 10);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: flameTex, color: 0xffb15e, transparent: true, depthWrite: false,
        blending: THREE.AdditiveBlending, opacity: 0.9
      }));
      sprite.position.set(p.x, WORLD.cityGround + 3.6, p.z);
      sprite.scale.set(3.4, 4.6, 1);
      city.add(sprite);
      fireSprites.push({ sprite, baseY: WORLD.cityGround + 3.6, phase: index * 1.7 });
      if (index < 4) {
        const light = new THREE.PointLight(0xff9b53, 140, 30, 2);
        light.position.set(p.x, WORLD.cityGround + 4, p.z);
        city.add(light);
        fireLights.push({ light, base: 140, phase: index * 2.3 });
      }
      addGlowSprite(p.x, WORLD.cityGround + 3.2, p.z, 7, 0xff9e58);
    });

    // Ember particle system, orbiting/flickering around the braziers.
    const count = 260;
    const positionsArr = new Float32Array(count * 3);
    const colorsArr = new Float32Array(count * 3);
    const data = [];
    for (let i = 0; i < count; i++) {
      const source = positions[i % positions.length];
      data.push({
        x: source.x + (Math.random() - 0.5) * 1.4,
        y: WORLD.cityGround + 2.6 + Math.random() * 3,
        z: source.z + (Math.random() - 0.5) * 1.4,
        vy: 0.7 + Math.random() * 1.6,
        phase: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 0.9
      });
      colorsArr[i * 3] = 1;
      colorsArr[i * 3 + 1] = 0.45 + Math.random() * 0.35;
      colorsArr[i * 3 + 2] = 0.15 + Math.random() * 0.2;
    }
    const emberGeo = new THREE.BufferGeometry();
    emberGeo.setAttribute("position", new THREE.BufferAttribute(positionsArr, 3));
    emberGeo.setAttribute("color", new THREE.BufferAttribute(colorsArr, 3));
    const emberPoints = new THREE.Points(emberGeo, new THREE.PointsMaterial({
      size: 1.2, sizeAttenuation: true, vertexColors: true, transparent: true,
      opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending, map: glowTexture()
    }));
    city.add(emberPoints);
    emberSystem = { points: emberPoints, data, positions: positionsArr };
  }

  function buildWaterfalls() {
    const shader = (uniformTime) => new THREE.ShaderMaterial({
      uniforms: { uTime: uniformTime },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        precision highp float;
        varying vec2 vUv;
        uniform float uTime;
        void main(){
          float streak = sin(vUv.y * 44.0 - uTime * 7.0 + sin(vUv.x * 16.0) * 1.5);
          float streak2 = sin(vUv.y * 86.0 - uTime * 12.0 + vUv.x * 9.0);
          float edge = smoothstep(0.0, 0.18, vUv.x) * smoothstep(1.0, 0.82, vUv.x);
          float alpha = edge * (0.18 + 0.16 * streak + 0.08 * streak2);
          vec3 col = mix(vec3(0.42, 0.72, 0.88), vec3(0.92, 0.98, 1.0), 0.5 + 0.5 * streak);
          gl_FragColor = vec4(col, max(alpha, 0.0) * 0.85);
        }
      `,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending
    });
    const angles = [2.15, 4.38, 5.72];
    angles.forEach((a, i) => {
      const time = { value: 0 };
      const width = i === 1 ? 4.2 : 6.2;
      const geo = new THREE.PlaneGeometry(width, 12.5, 1, 24);
      const pos = geo.attributes.position;
      for (let v = 0; v < pos.count; v++) {
        const localX = pos.getX(v);
        const localY = pos.getY(v);
        const t = (6.25 - localY) / 12.5;
        const radius = 59.2 + t * 25.0;
        pos.setXYZ(
          v,
          Math.sin(a) * radius + Math.cos(a) * localX,
          12.5 - t * 12.5,
          Math.cos(a) * radius - Math.sin(a) * localX
        );
      }
      geo.computeVertexNormals();
      const plane = new THREE.Mesh(geo, shader(time));
      city.add(plane);
      waterfallMaterials.push(time);
      addGlowSprite(Math.sin(a) * 85, 1.1, Math.cos(a) * 85, 5.5, 0x8fe7ef);
    });
  }

  function addBanner(parent, x, y, z, rotationY, color, scale = 1) {
    const material = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uColor: { value: new THREE.Color(color) }
      },
      vertexShader: `
        uniform float uTime;
        varying vec2 vUv;
        void main(){
          vUv = uv;
          vec3 p = position;
          float wave = sin(p.x * 3.4 + uTime * 2.2) * 0.25 + sin(p.y * 4.0 - uTime * 1.3) * 0.12;
          p.z += wave * (0.4 + vUv.y * 0.8);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p,1.0);
        }
      `,
      fragmentShader: `
        precision highp float;
        varying vec2 vUv;
        uniform vec3 uColor;
        void main(){
          vec3 col = uColor * (0.65 + 0.35 * vUv.y);
          col += vec3(0.28,0.2,0.08) * smoothstep(0.02,0.0,abs(vUv.x-0.5)) * 0.6;
          col += vec3(0.35,0.26,0.1) * step(0.94, vUv.y) * 0.5;
          gl_FragColor = vec4(col, 0.96);
        }
      `,
      side: THREE.DoubleSide, transparent: true
    });
    const geo = new THREE.PlaneGeometry(3 * scale, 5.4 * scale, 8, 10);
    geo.translate(0, -2.7 * scale, 0);
    const banner = new THREE.Mesh(geo, material);
    banner.position.set(x, y, z);
    banner.rotation.y = rotationY;
    parent.add(banner);
    bannerMaterials.push(material);
    // Simple pole.
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 6 * scale, 5), materials.gold);
    pole.position.set(x, y, z);
    parent.add(pole);
    return banner;
  }

  function buildBanners() {
    // Additional banners on the two tallest towers.
    const specs = [[3, 0.9], [7, 0.8], [9, 1.0]];
    for (const [index, scale] of specs) {
      const t = window.__towers[index];
      if (!t) continue;
      const y = WORLD.cityGround + t.height * 0.72;
      addBanner(city, t.x + Math.sin(0), y, t.z + t.width * 0.42, 0, 0x7d253a, scale);
    }
  }

  function buildBirds() {
    const count = 28;
    const positions = new Float32Array(count * 3);
    const data = [];
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 28 + Math.random() * 28;
      data.push({ a, r, y: 45 + Math.random() * 35, speed: 0.06 + Math.random() * 0.09, phase: Math.random() * 6 });
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    const points = new THREE.Points(geo, new THREE.PointsMaterial({
      color: 0x171b24, size: 1.4, sizeAttenuation: true, transparent: true, opacity: 0.85, depthWrite: false
    }));
    city.add(points);
    birds = { points, data, positions };
  }

  // ---------- controls ----------
  function applyOrbitCamera() {
    const sinPhi = Math.sin(orbit.phi);
    camera.position.set(
      orbit.target.x + orbit.radius * sinPhi * Math.sin(orbit.theta),
      orbit.target.y + orbit.radius * Math.cos(orbit.phi),
      orbit.target.z + orbit.radius * sinPhi * Math.cos(orbit.theta)
    );
    camera.lookAt(orbit.target);
  }

  function applyStreetCamera() {
    const a = street.angle;
    const r = street.radius;
    const bob = Math.sin(a * 9) * 0.04;
    camera.position.set(Math.sin(a) * r, WORLD.cityGround + street.height + bob, Math.cos(a) * r);
    const tangent = new THREE.Vector3(Math.cos(a), 0, -Math.sin(a));
    const inward = new THREE.Vector3(-Math.sin(a), 0, -Math.cos(a));
    const dir = tangent.multiplyScalar(0.42).add(inward.multiplyScalar(0.85)).normalize();
    dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), street.yaw);
    dir.y = Math.tan(street.pitch);
    dir.normalize();
    camera.lookAt(camera.position.clone().addScaledVector(dir, 40));
  }

  function setMode(next) {
    if (next === mode) return;
    mode = next;
    document.querySelectorAll("[data-mode]").forEach((btn) => btn.classList.toggle("active", btn.dataset.mode === mode));
    updateHint();
    if (mode === "street") {
      street.angle = Math.atan2(camera.position.x, camera.position.z);
      street.yaw = 0;
      street.pitch = 0.16;
      toast("进入环城巡游：低空环绕城市，拖动可环顾");
    } else {
      orbit.theta = Math.atan2(camera.position.x - orbit.target.x, camera.position.z - orbit.target.z);
      orbit.phi = 1.02;
      toast("返回环视：拖动旋转视角，滚轮缩放");
    }
  }

  function updateHint() {
    if (mode === "orbit") {
      hint.innerHTML = '<kbd>拖动</kbd> 旋转视角 <span style="opacity:.35">·</span> <kbd>滚轮</kbd> 缩放 <span style="opacity:.35">·</span> <kbd>WASD</kbd> 移动视点';
    } else {
      hint.innerHTML = '<kbd>拖动</kbd> 环顾城市 <span style="opacity:.35">·</span> 自动沿岛屿外圈巡游 <span style="opacity:.35">·</span> <kbd>滚轮</kbd> 调整巡游速度';
    }
  }

  function setAuto(value) {
    auto = value;
    autoBtn.classList.toggle("on", auto);
    autoLabel.textContent = auto ? "自动漫游" : "手动模式";
    toast(auto ? "自动漫游已开启" : "自动漫游已暂停");
  }

  function resetView() {
    orbit.theta = -0.68;
    orbit.phi = 1.02;
    orbit.radius = 158;
    orbit.target.set(0, 32, 0);
    street.angle = 0.18;
    street.yaw = 0;
    street.pitch = 0.16;
    street.speed = 0.02;
    if (mode === "orbit") applyOrbitCamera(); else applyStreetCamera();
    toast("视角已重置");
  }

  function setupControls() {
    document.querySelectorAll("[data-mode]").forEach((btn) => {
      btn.addEventListener("click", () => setMode(btn.dataset.mode));
    });
    autoBtn.addEventListener("click", () => setAuto(!auto));
    document.getElementById("resetBtn").addEventListener("click", resetView);

    canvas.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      canvas.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (pointers.size === 2) {
        const pts = [...pointers.values()];
        pinch = { distance: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), radius: orbit.radius };
        dragging = false;
        return;
      }
      dragging = true;
      lastPointer = { x: event.clientX, y: event.clientY };
      lastInteraction = performance.now();
    });
    canvas.addEventListener("pointermove", (event) => {
      if (pointers.has(event.pointerId)) pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (pinch && pointers.size >= 2) {
        const pts = [...pointers.values()];
        const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (pinch.distance > 0) {
          orbit.radius = THREE.MathUtils.clamp(pinch.radius * (pinch.distance / d), 55, 320);
        }
        return;
      }
      if (!dragging) return;
      const dx = event.clientX - lastPointer.x;
      const dy = event.clientY - lastPointer.y;
      lastPointer = { x: event.clientX, y: event.clientY };
      lastInteraction = performance.now();
      if (mode === "orbit") {
        orbit.theta -= dx * 0.0042;
        orbit.phi = THREE.MathUtils.clamp(orbit.phi - dy * 0.0032, 0.26, 1.42);
        applyOrbitCamera();
      } else {
        street.yaw -= dx * 0.0032;
        street.pitch = THREE.MathUtils.clamp(street.pitch - dy * 0.0022, -0.28, 0.9);
        applyStreetCamera();
      }
    });
    function endPointer(event) {
      pointers.delete(event.pointerId);
      if (pointers.size < 2) pinch = null;
      dragging = false;
      if (canvas.hasPointerCapture?.(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    }
    canvas.addEventListener("pointerup", endPointer);
    canvas.addEventListener("pointercancel", endPointer);
    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      if (mode === "orbit") {
        orbit.radius = THREE.MathUtils.clamp(orbit.radius * Math.exp(event.deltaY * 0.0011), 55, 320);
      } else {
        street.speed = THREE.MathUtils.clamp(street.speed - event.deltaY * 0.00005, 0.008, 0.09);
      }
    }, { passive: false });
    canvas.addEventListener("dblclick", () => setAuto(!auto));

    document.addEventListener("keydown", (event) => {
      if (event.target.tagName === "INPUT" || event.target.tagName === "TEXTAREA") return;
      if (event.key === "1") setMode("orbit");
      else if (event.key === "2") setMode("street");
      else if (event.key === "0") resetView();
      else if (event.code === "Space") { event.preventDefault(); setAuto(!auto); }
      else if (mode === "orbit" && ["w", "a", "s", "d"].includes(event.key.toLowerCase())) {
        const forward = new THREE.Vector3(-Math.sin(orbit.theta), 0, -Math.cos(orbit.theta));
        const right = new THREE.Vector3(Math.cos(orbit.theta), 0, -Math.sin(orbit.theta));
        const k = event.key.toLowerCase();
        if (k === "w") orbit.target.addScaledVector(forward, 3);
        if (k === "s") orbit.target.addScaledVector(forward, -3);
        if (k === "d") orbit.target.addScaledVector(right, 3);
        if (k === "a") orbit.target.addScaledVector(right, -3);
        orbit.target.x = THREE.MathUtils.clamp(orbit.target.x, -60, 60);
        orbit.target.z = THREE.MathUtils.clamp(orbit.target.z, -60, 60);
        applyOrbitCamera();
        lastInteraction = performance.now();
      }
    });

    window.addEventListener("blur", () => { dragging = false; pointers.clear(); pinch = null; });
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight, false);
  }

  // ---------- animation ----------
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());
    const t = clock.elapsedTime;

    if (sky) sky.position.copy(camera.position);
    if (stars) stars.position.copy(camera.position);
    if (seaMaterial) {
      seaMaterial.uniforms.uTime.value = t;
      seaMaterial.uniforms.uCamera.value.copy(camera.position);
    }
    waterfallMaterials.forEach((u) => { u.value = t; });
    bannerMaterials.forEach((m) => { m.uniforms.uTime.value = t; });

    if (mode === "orbit") {
      if (auto && !dragging && performance.now() - lastInteraction > 2400) {
        orbit.theta += dt * 0.025;
      }
      applyOrbitCamera();
    } else {
      if (auto && !dragging) {
        street.angle += street.speed * dt;
      }
      applyStreetCamera();
    }

    fireLights.forEach((f) => {
      f.light.intensity = f.base * (0.82 + Math.sin(t * 9 + f.phase) * 0.11 + Math.sin(t * 19 + f.phase * 2) * 0.07);
    });
    fireSprites.forEach((s) => {
      const flicker = 0.9 + Math.sin(t * 11 + s.phase) * 0.1 + Math.sin(t * 21 + s.phase * 3) * 0.06;
      s.sprite.scale.set(3.4 * flicker, 4.6 * flicker, 1);
      s.sprite.position.y = s.baseY + Math.sin(t * 7 + s.phase) * 0.15;
      s.sprite.material.opacity = 0.75 + Math.sin(t * 13 + s.phase) * 0.15;
    });

    if (emberSystem) {
      const arr = emberSystem.positions;
      emberSystem.data.forEach((p, i) => {
        p.y += p.vy * dt;
        p.x += Math.sin(t * p.speed + p.phase) * 0.45 * dt;
        p.z += Math.cos(t * p.speed * 0.8 + p.phase) * 0.35 * dt;
        if (p.y > WORLD.cityGround + 15) {
          p.y = WORLD.cityGround + 2.6;
        }
        arr[i * 3] = p.x;
        arr[i * 3 + 1] = p.y;
        arr[i * 3 + 2] = p.z;
      });
      emberSystem.points.geometry.attributes.position.needsUpdate = true;
    }

    if (birds) {
      birds.data.forEach((bird, i) => {
        bird.a += bird.speed * dt;
        const x = Math.sin(bird.a) * bird.r;
        const z = Math.cos(bird.a) * bird.r;
        birds.positions[i * 3] = x;
        birds.positions[i * 3 + 1] = bird.y + Math.sin(t * 0.7 + bird.phase) * 1.2;
        birds.positions[i * 3 + 2] = z;
      });
      birds.points.geometry.attributes.position.needsUpdate = true;
    }

    clouds.forEach((cloud) => {
      cloud.position.x += cloud.userData.speed * dt;
      if (cloud.position.x > 340) cloud.position.x = -340;
    });

    renderer.render(scene, camera);

    frames += 1;
    fpsAccum += dt;
    if (fpsAccum > 0.5) {
      fpsEl.textContent = `${Math.round(frames / fpsAccum)} FPS`;
      frames = 0;
      fpsAccum = 0;
    }
  }

  window.__citadel = {
    orbit,
    street,
    setMode,
    setAuto,
    resetView,
    get mode() { return mode; },
    getCrowdEstimate: () => ({ towers: window.__towers?.length || 0 })
  };

  try {
    init();
  } catch (err) {
    console.error(err);
    showError("场景初始化失败：" + (err.message || err));
  }
})();
</script>
</body>
</html>
