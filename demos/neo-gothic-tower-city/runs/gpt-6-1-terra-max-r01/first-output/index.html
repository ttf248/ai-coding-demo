<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暮钟之城 · 新哥特漫游</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c111a;color:#f2ecdf;font:14px/1.5 system-ui,sans-serif}#view{position:fixed;inset:0;touch-action:none;cursor:grab}#view canvas{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0c111ad9,transparent 46%),linear-gradient(0deg,#0c111aa8,transparent 35%)}header{position:absolute;top:28px;left:30px;max-width:390px;pointer-events:none}.eyebrow{color:#d1a76f;font-size:11px;letter-spacing:.2em;font-weight:bold}h1{font-family:Georgia,serif;font-size:clamp(36px,6vw,66px);letter-spacing:.04em;line-height:1.05;margin:12px 0}header p{color:#c4c2bc;max-width:310px;font-size:13px}.controls{position:absolute;left:30px;bottom:25px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:700px}button{font:inherit;color:#f3eadb;border:1px solid #ffffff45;background:#192632cf;border-radius:6px;padding:9px 13px;cursor:pointer;backdrop-filter:blur(10px)}button.active,button:hover{background:#bc9160;color:#17202a;border-color:#bc9160}.note{position:absolute;right:28px;bottom:28px;color:#c5c2bc;font-size:11px;text-align:right}.pad{display:none;position:absolute;right:16px;bottom:85px;grid-template-columns:repeat(3,43px);gap:4px}.pad button{padding:8px}.pad .up{grid-column:2}.pad .left{grid-column:1}.error{display:none;position:absolute;inset:0;background:#111824;place-items:center;text-align:center;padding:30px;color:#ffddad}@media(max-width:700px){header{top:18px;left:18px}header p{max-width:235px}.controls{left:12px;bottom:14px;right:12px}.note{display:none}.pad{display:grid}}
</style></head><body><div id="view"></div><div class="overlay"></div><header><div class="eyebrow">NOCTURNE / AN IMAGINARY CITY</div><h1>暮钟之城</h1><p>高塔、尖拱与海雾之间的一座虚构新哥特城市。拖动画面环视，切换步行后使用 WASD 漫游。</p></header><div class="controls"><button id="orbit" class="active">环绕观景</button><button id="walk">步行漫游</button><button id="reset">复位视角</button><span id="status">正在构筑城市…</span></div><div class="note">建筑按米级尺度组织<br>虚构场景，不对应真实城市</div><div class="pad" aria-label="步行方向"><button class="up" data-key="w">↑</button><button class="left" data-key="a">←</button><button data-key="s">↓</button><button data-key="d">→</button></div><div class="error" id="error"></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s),view=$('#view');try{if(!window.THREE)throw Error('待确认：Three.js 图形库加载失败，请检查网络。');const scene=new THREE.Scene();scene.background=new THREE.Color('#17232e');scene.fog=new THREE.FogExp2('#253640',.0048);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,1000),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;view.append(renderer.domElement);scene.add(new THREE.HemisphereLight('#c3d4d5','#302c29',1.35));const sun=new THREE.DirectionalLight('#ffd6a0',2.2);sun.position.set(-90,150,70);scene.add(sun);const stone=new THREE.MeshStandardMaterial({color:'#807b70',roughness:.94}),lightStone=new THREE.MeshStandardMaterial({color:'#aca497',roughness:.9}),darkStone=new THREE.MeshStandardMaterial({color:'#4b5355',roughness:.95}),roof=new THREE.MeshStandardMaterial({color:'#323b43',roughness:.8}),glass=new THREE.MeshStandardMaterial({color:'#d8a260',emissive:'#8d4815',emissiveIntensity:.7,roughness:.5}),metal=new THREE.MeshStandardMaterial({color:'#51483d',metalness:.5,roughness:.5});const box=(w,h,d,mat,x,y,z,parent=scene)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);parent.add(m);return m};const cylinder=(r1,r2,h,mat,x,y,z,parent=scene,sides=8)=>{let m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,sides),mat);m.position.set(x,y,z);parent.add(m);return m};const cone=(r,h,mat,x,y,z,parent=scene,sides=4)=>{let m=new THREE.Mesh(new THREE.ConeGeometry(r,h,sides),mat);m.position.set(x,y,z);m.rotation.y=Math.PI/4;parent.add(m);return m};function arch(w,h,material){const s=new THREE.Shape();s.moveTo(-w/2,0);s.lineTo(-w/2,h*.68);s.quadraticCurveTo(-w/2,h*.84,0,h);s.quadraticCurveTo(w/2,h*.84,w/2,h*.68);s.lineTo(w/2,0);s.closePath();return new THREE.Mesh(new THREE.ShapeGeometry(s),material)}function windowAt(parent,x,y,z,angle,w=2,h=6){let frame=arch(w+.55,h+.45,darkStone);frame.position.set(x,y,z);frame.rotation.y=angle;parent.add(frame);let pane=arch(w,h,glass);pane.position.set(x+Math.sin(angle)*.03,y+.15,z+Math.cos(angle)*.03);pane.rotation.y=angle;parent.add(pane);let mullion=box(.12,h*.7,.08,metal,0,h*.35,0,pane);return mullion}function tower(x,z,w,h){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);box(w,h,w,stone,0,h/2,0,g);box(w+1,2,w+1,lightStone,0,1,0,g);for(let level=14;level<h-7;level+=12){for(let i=-1;i<=1;i++){const a=i*w*.25;windowAt(g,a,level,w/2+.02,0,w*.14,7);windowAt(g,-a,level,-w/2-.02,Math.PI,w*.14,7);windowAt(g,w/2+.02,level,-a,Math.PI/2,w*.14,7);windowAt(g,-w/2-.02,level,a,-Math.PI/2,w*.14,7)}}for(let yy=12;yy<h;yy+=12)box(w+.7,.5,w+.7,lightStone,0,yy,0,g);box(w+2,2,w+2,darkStone,0,h,0,g);for(let i=-2;i<=2;i++){for(const sign of [-1,1]){box(1.5,2,1.5,lightStone,i*(w/5),h+1.8,sign*(w/2+.2),g);box(1.5,2,1.5,lightStone,sign*(w/2+.2),h+1.8,i*(w/5),g)}}for(let a of [-1,1])for(let b of [-1,1]){box(2,h*.78,2,lightStone,a*(w/2+.25),h*.39,b*(w/2+.25),g);cone(2.3,9,roof,a*(w/2+.25),h+6,b*(w/2+.25),g);cylinder(.12,.12,3,metal,a*(w/2+.25),h+11,b*(w/2+.25),g,6)}cone(w*.67,w*.95,roof,0,h+w*.45,0,g);cylinder(.18,.18,7,metal,0,h+w*.95+2,0,g,6);return g}function cathedral(){const g=new THREE.Group();g.position.set(0,0,0);scene.add(g);box(34,29,62,stone,0,14.5,0,g);box(37,2,65,lightStone,0,1,0,g);let r=new THREE.Mesh(new THREE.ConeGeometry(27,20,4),roof);r.rotation.y=Math.PI/4;r.scale.z=1.7;r.position.set(0,39,0);g.add(r);for(let i=-2;i<=2;i++){windowAt(g,i*6,7,31.02,0,3,14);windowAt(g,-i*6,7,-31.02,Math.PI,3,14)}for(let z=-24;z<=24;z+=12){windowAt(g,17.02,7,z,Math.PI/2,3,14);windowAt(g,-17.02,7,z,-Math.PI/2,3,14);for(const side of [-1,1]){box(3,24,3,lightStone,side*19,12,z,g);cone(2.4,7,roof,side*19,27,z,g)}}windowAt(g,0,2,31.2,0,7,14);let rose=new THREE.Mesh(new THREE.TorusGeometry(4.4,.45,8,32),glass);rose.position.set(0,25,31.2);g.add(rose)}box(230,4,180,darkStone,0,-2,0);box(214,1,165,stone,0,.1,0);for(let i=-9;i<=9;i++){box(1,1,165,lightStone,i*11,0,0);box(214,1,1,lightStone,0,0,i*8)}cathedral();tower(-24,28,16,70);tower(24,28,16,70);tower(-52,-22,13,48);tower(52,-22,13,48);tower(-78,35,11,38);tower(78,35,11,38);tower(0,-55,15,55);for(let i=-4;i<=4;i++){box(13,10+(i%3)*3,16,stone,i*21,5,69);cone(11,10,roof,i*21,16,69)}for(let i=-4;i<=4;i++){for(const side of [-1,1]){let x=i*22,z=side*73;cylinder(.3,.3,6,metal,x,3,z);cylinder(.85,.65,1.2,glass,x,6.4,z);cone(1.1,1,metal,x,7.5,z)}}const waterMat=new THREE.ShaderMaterial({uniforms:{time:{value:0}},vertexShader:'varying vec2 v; uniform float time; void main(){v=uv; vec3 p=position; p.z+=sin(p.x*.035+time)*.5+cos(p.y*.045+time*.7)*.35; gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}',fragmentShader:'varying vec2 v; uniform float time; void main(){float wave=sin(v.x*150.+time)*sin(v.y*120.-time*.6);gl_FragColor=vec4(vec3(.10,.19,.23)+wave*.018,1.);}',side:THREE.DoubleSide});let water=new THREE.Mesh(new THREE.PlaneGeometry(800,800,100,100),waterMat);water.rotation.x=-Math.PI/2;water.position.y=-2.1;scene.add(water);const starsGeo=new THREE.BufferGeometry(),fire=[];for(let i=0;i<160;i++)fire.push((Math.random()-.5)*210,3+Math.random()*8,(Math.random()>.5?1:-1)*73+(Math.random()-.5)*3);starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(fire,3));let sparks=new THREE.Points(starsGeo,new THREE.PointsMaterial({color:'#f5bd77',size:.7,transparent:true,opacity:.7}));scene.add(sparks);let mode='orbit',yaw=.7,pitch=.4,distance=230,walkPos=new THREE.Vector3(0,3,110),walkYaw=Math.PI,walkPitch=0,drag=null,keys=new Set(),last=performance.now();function updateCamera(dt){if(mode==='orbit'){const horizontal=distance*Math.cos(pitch);camera.position.set(Math.sin(yaw)*horizontal,24+Math.sin(pitch)*distance,Math.cos(yaw)*horizontal);camera.lookAt(0,24,0)}else{let forward=new THREE.Vector3(Math.sin(walkYaw),0,Math.cos(walkYaw)),right=new THREE.Vector3(Math.cos(walkYaw),0,-Math.sin(walkYaw));if(keys.has('w'))walkPos.addScaledVector(forward,dt*13);if(keys.has('s'))walkPos.addScaledVector(forward,-dt*13);if(keys.has('a'))walkPos.addScaledVector(right,-dt*13);if(keys.has('d'))walkPos.addScaledVector(right,dt*13);walkPos.x=Math.max(-105,Math.min(105,walkPos.x));walkPos.z=Math.max(-80,Math.min(80,walkPos.z));camera.position.copy(walkPos);camera.lookAt(walkPos.x+Math.sin(walkYaw)*Math.cos(walkPitch),walkPos.y+Math.sin(walkPitch),walkPos.z+Math.cos(walkYaw)*Math.cos(walkPitch))}}function frame(t){requestAnimationFrame(frame);const dt=Math.min((t-last)/1000,.05);last=t;if(mode==='orbit'&&!drag)yaw+=dt*.018;waterMat.uniforms.time.value=t*.00045;sparks.material.opacity=.55+Math.sin(t*.003)*.15;updateCamera(dt);renderer.render(scene,camera)}view.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};view.setPointerCapture(e.pointerId)});view.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(mode==='orbit'){yaw-=dx*.005;pitch=Math.max(.12,Math.min(1.2,pitch+dy*.005))}else{walkYaw-=dx*.005;walkPitch=Math.max(-1,Math.min(1,walkPitch-dy*.005))}drag={x:e.clientX,y:e.clientY}});view.addEventListener('pointerup',()=>drag=null);view.addEventListener('pointercancel',()=>drag=null);view.addEventListener('wheel',e=>{if(mode==='orbit'){e.preventDefault();distance=Math.max(70,Math.min(400,distance+e.deltaY*.12)}},{passive:false});window.addEventListener('keydown',e=>{if(['w','a','s','d'].includes(e.key.toLowerCase()))keys.add(e.key.toLowerCase())});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.querySelectorAll('[data-key]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(b.dataset.key);b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>keys.delete(b.dataset.key));b.addEventListener('pointercancel',()=>keys.delete(b.dataset.key))});function setMode(m){mode=m;keys.clear();$('#orbit').classList.toggle('active',m==='orbit');$('#walk').classList.toggle('active',m==='walk');$('#status').textContent=m==='orbit'?'拖动环视 · 滚轮缩放':'拖动视线 · WASD 移动'}$('#orbit').onclick=()=>setMode('orbit');$('#walk').onclick=()=>setMode('walk');$('#reset').onclick=()=>{yaw=.7;pitch=.4;distance=230;walkPos.set(0,3,75);walkYaw=Math.PI;walkPitch=0};window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setMode('orbit');requestAnimationFrame(frame)}catch(e){$('#error').style.display='grid';$('#error').textContent='待确认：图形环境不可用。'+e.message}})();
</script></body></html>
