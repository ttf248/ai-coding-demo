<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>新哥特式塔楼城市 · 可漫游 3D</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f;
        font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
      #app { position: fixed; inset: 0; }
      .hud { position: fixed; top: 14px; left: 14px; color: #cbd5e1; font-size: 12.5px;
        background: rgba(8,12,26,.72); border: 1px solid rgba(148,163,184,.25);
        border-radius: 12px; padding: 10px 13px; line-height: 1.8; z-index: 5;
        backdrop-filter: blur(6px); max-width: 300px; }
      .hud b { color: #e2e8f0; font-size: 14px; letter-spacing: 2px; }
      .hud .keys { color: #7dd3fc; }
      .btns { position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 5; }
      .btns button { background: rgba(8,12,26,.75); color: #e2e8f0; border: 1px solid rgba(148,163,184,.3);
        border-radius: 10px; padding: 8px 12px; font-size: 12.5px; cursor: pointer;
        backdrop-filter: blur(6px); }
      .btns button.on { border-color: #7dd3fc; color: #7dd3fc; }
      .todo { position: fixed; bottom: 14px; left: 14px; z-index: 5; color: #fbbf24;
        background: rgba(8,12,26,.72); border: 1px solid rgba(251,191,36,.35); border-radius: 12px;
        padding: 9px 12px; font-size: 11.5px; line-height: 1.7; backdrop-filter: blur(6px); }
      #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        color: #fecaca; background: #05070f; z-index: 20; padding: 24px; text-align: center; font-size: 14px; }
      .titlecard { position: fixed; bottom: 16px; right: 18px; color: #94a3b8; font-size: 11px;
        letter-spacing: 3px; z-index: 5; text-align: right; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud">
      <b>NEOGOTHICA · 新哥特塔楼城</b><br/>
      拖拽环视 · 滚轮/双指缩放 · <span class="keys">W A S D</span> 水平漫游 ·
      <span class="keys">Q / E</span> 升降 · 空格=自动巡航开关
    </div>
    <div class="btns">
      <button id="btnCruise" class="on">自动巡航</button>
      <button id="btnNight" class="on">夜间灯火</button>
      <button id="btnReset">回到全景</button>
    </div>
    <div class="todo">
      待确认：① three.js 版本 r160（CDN，unpkg）；② 音效/背景音乐素材缺漏，未接入；③ 真实建筑测绘数据来源未指定，比例按任务“真实比例”自行取 60–240 m 塔群。其余按审美自行决定（相机路线、海浪与火焰丰富度）。
    </div>
    <div class="titlecard">PROCEDURAL · WEBGL · OFFLINE-ASSETS ✗（需联网加载库）</div>
    <div id="err"></div>

    <script type="importmap">
      { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
      import * as THREE from "three";

      const app = document.getElementById("app");
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      app.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x0a1024, 0.0016);
      scene.background = new THREE.Color(0x070b18);

      const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 4000);

      /* ============ 光照：月夜 ============ */
      const moon = new THREE.DirectionalLight(0x9db4ff, 1.15);
      moon.position.set(-320, 420, -260);
      moon.castShadow = true;
      moon.shadow.mapSize.set(2048, 2048);
      moon.shadow.camera.left = -520; moon.shadow.camera.right = 520;
      moon.shadow.camera.top = 520; moon.shadow.camera.bottom = -520;
      moon.shadow.camera.far = 1400;
      scene.add(moon);
      scene.add(new THREE.AmbientLight(0x1c2440, 1.4));
      const rim = new THREE.HemisphereLight(0x2b3a6b, 0x0c0a14, 0.9);
      scene.add(rim);

      /* ============ 程序化材质纹理（石墙 / 花窗） ============ */
      function stoneTexture(hue) {
        const c = document.createElement("canvas");
        c.width = c.height = 128;
        const g = c.getContext("2d");
        g.fillStyle = `hsl(${hue},12%,34%)`;
        g.fillRect(0, 0, 128, 128);
        for (let y = 0; y < 8; y++)
          for (let x = 0; x < 8; x++) {
            g.fillStyle = `hsla(${hue},10%,${26 + Math.random() * 16}%,1)`;
            g.fillRect(x * 16 + 1, y * 16 + 1, 15, 15);
          }
        const t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        return t;
      }
      function roseWindowTexture() {
        const c = document.createElement("canvas");
        c.width = c.height = 128;
        const g = c.getContext("2d");
        g.fillStyle = "#0a0a12"; g.fillRect(0, 0, 128, 128);
        const cols = ["#f4d58d", "#7fd1d8", "#e07a8c", "#a48dd0", "#f2b36b"];
        for (let i = 0; i < 12; i++) {
          g.fillStyle = cols[i % cols.length];
          g.beginPath();
          g.moveTo(64, 64);
          g.arc(64, 64, 52, (i / 12) * Math.PI * 2, ((i + 0.8) / 12) * Math.PI * 2);
          g.fill();
        }
        g.strokeStyle = "#1c1c26"; g.lineWidth = 6;
        g.beginPath(); g.arc(64, 64, 54, 0, 7); g.stroke();
        g.fillStyle = "#f4d58d";
        g.beginPath(); g.arc(64, 64, 12, 0, 7); g.fill();
        return new THREE.CanvasTexture(c);
      }
      const stoneA = stoneTexture(220), stoneB = stoneTexture(258), stoneC = stoneTexture(200);
      const roseTex = roseWindowTexture();
      const matStone = new THREE.MeshStandardMaterial({ map: stoneA, roughness: 0.92 });
      const matStone2 = new THREE.MeshStandardMaterial({ map: stoneB, roughness: 0.9 });
      const matDark = new THREE.MeshStandardMaterial({ color: 0x14161f, roughness: 0.6, metalness: 0.4 });
      const matWindow = new THREE.MeshStandardMaterial({
        color: 0x120d08, emissive: 0xffc76a, emissiveIntensity: 1.6, roughness: 0.4,
      });
      const matRose = new THREE.MeshStandardMaterial({
        map: roseTex, emissiveMap: roseTex, emissive: 0xffffff, emissiveIntensity: 1.35,
      });

      /* ============ 哥特塔楼生成器 ============ */
      const rng = (() => { let a = 20261014; return () => { a = (a * 16807) % 2147483647; return a / 2147483647; }; })();

      function pointedArchWindow(w, h) {
        const s = new THREE.Shape();
        s.moveTo(-w / 2, 0);
        s.lineTo(-w / 2, h * 0.55);
        s.quadraticCurveTo(-w / 2, h, 0, h + w * 0.4);
        s.quadraticCurveTo(w / 2, h, w / 2, h * 0.55);
        s.lineTo(w / 2, 0);
        s.closePath();
        return new THREE.ShapeGeometry(s);
      }

      function gothicTower({ w, d, h, floors, mat }) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        body.position.y = h / 2;
        body.castShadow = body.receiveShadow = true;
        g.add(body);
        // 扶壁
        for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
          const b = new THREE.Mesh(new THREE.BoxGeometry(w * 0.1, h * 0.96, d * 0.1), matDark);
          b.position.set((sx * w) / 2, h * 0.48, (sz * d) / 2);
          g.add(b);
          const p = new THREE.Mesh(new THREE.ConeGeometry(w * 0.09, h * 0.14, 4), matDark);
          p.position.set((sx * w) / 2, h * 0.99 + h * 0.07, (sz * d) / 2);
          p.rotation.y = Math.PI / 4;
          g.add(p);
        }
        // 尖拱窗（每层四面）
        const winH = (h / floors) * 0.62, winW = w * 0.17;
        const geoWin = pointedArchWindow(winW, winH);
        for (let f = 0; f < floors; f++) {
          const y = h * 0.12 + (f * h) / floors;
          const faces = [
            { p: [0, y, d / 2 + 0.05], r: [0, 0, 0] },
            { p: [0, y, -d / 2 - 0.05], r: [0, Math.PI, 0] },
            { p: [w / 2 + 0.05, y, 0], r: [0, Math.PI / 2, 0] },
            { p: [-w / 2 - 0.05, y, 0], r: [0, -Math.PI / 2, 0] },
          ];
          const span = f % 2 === 0 ? 3 : 2;
          for (const fc of faces)
            for (let k = 0; k < span; k++) {
              const m = new THREE.Mesh(geoWin, matWindow);
              m.position.set(...fc.p);
              m.rotation.set(...fc.r);
              const off = (k - (span - 1) / 2) * (w / (span + 0.5));
              if (fc.r[1] === 0 || Math.abs(fc.r[1]) === Math.PI) m.position.x += off;
              else m.position.z += off;
              g.add(m);
            }
        }
        // 尖顶与细塔
        const spireH = h * (0.35 + rng() * 0.3);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.72, spireH, 4), matDark);
        roof.position.y = h + spireH / 2;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        g.add(roof);
        const nP = 4;
        for (let i = 0; i < nP; i++) {
          const a = (i / nP) * Math.PI * 2 + Math.PI / 4;
          const pr = Math.max(w, d) * 0.62;
          const pin = new THREE.Mesh(new THREE.ConeGeometry(w * 0.06, spireH * 0.34, 6), mat);
          pin.position.set(Math.cos(a) * pr * 0.72, h + spireH * 0.2, Math.sin(a) * pr * 0.72);
          g.add(pin);
        }
        const cross = new THREE.Mesh(new THREE.SphereGeometry(w * 0.045, 8, 8), new THREE.MeshStandardMaterial({
          color: 0xd9b56a, metalness: 0.85, roughness: 0.3,
        }));
        cross.position.y = h + spireH + w * 0.05;
        g.add(cross);
        return g;
      }

      function cathedral() {
        const g = new THREE.Group();
        const nave = new THREE.Mesh(new THREE.BoxGeometry(34, 26, 96), matStone2);
        nave.position.y = 13;
        nave.castShadow = nave.receiveShadow = true;
        g.add(nave);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(30, 16, 4), matDark);
        roof.rotation.y = Math.PI / 4;
        roof.scale.set(1, 1, 3.1);
        roof.position.y = 26 + 8;
        g.add(roof);
        for (const side of [-1, 1]) {
          for (let i = 0; i < 5; i++) {
            const bt = new THREE.Mesh(new THREE.BoxGeometry(2.4, 22, 2.4), matStone2);
            bt.position.set(side * 20, 11, -38 + i * 19);
            g.add(bt);
            const arc = new THREE.Mesh(new THREE.TorusGeometry(6.4, 0.7, 6, 14, Math.PI), matStone2);
            arc.position.set(side * 17, 17, -38 + i * 19);
            arc.rotation.set(0, Math.PI / 2, Math.PI);
            g.add(arc);
          }
        }
        const tw = gothicTower({ w: 13, d: 13, h: 78, floors: 5, mat: matStone2 });
        tw.position.set(-19, 0, -52);
        g.add(tw);
        const rose = new THREE.Mesh(new THREE.CircleGeometry(9, 24), matRose);
        rose.position.set(0, 17, 48.1);
        g.add(rose);
        const doorGeo = pointedArchWindow(9, 18);
        const door = new THREE.Mesh(doorGeo, new THREE.MeshStandardMaterial({ color: 0x241609, roughness: 0.8 }));
        door.position.set(0, 0.2, 48.06);
        g.add(door);
        return g;
      }

      /* ============ 城市布局（真实比例：街区 120m，街宽 24m） ============ */
      const city = new THREE.Group();
      const islandPts = [];
      for (let bx = -2; bx <= 2; bx++)
        for (let bz = -2; bz <= 2; bz++) {
          const x = bx * 144, z = bz * 144;
          const r = Math.hypot(bx, bz);
          if (r > 2.4) continue;
          const shrink = 1 - r / 3.4;
          const n = r < 1 ? 3 : 2;
          for (let k = 0; k < n; k++) {
            const w = (9 + rng() * 7) * (0.7 + shrink);
            const d = (9 + rng() * 7) * (0.7 + shrink);
            const h = (46 + rng() * 150) * (0.6 + shrink * 0.6);
            const t = gothicTower({ w, d, h, floors: Math.max(2, Math.round(h / 16)), mat: rng() > 0.5 ? matStone : matStone2 });
            t.position.set(
              x + (rng() - 0.5) * (110 - 70 * shrink),
              0,
              z + (rng() - 0.5) * (110 - 70 * shrink),
            );
            t.rotation.y = rng() * Math.PI * 2;
            city.add(t);
          }
          // 广场灯柱（火焰粒子锚点）
          if (r < 2) {
            for (let m = 0; m < 2; m++) {
              const post = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, 9, 6), matDark);
              post.position.set(x + 26 - m * 52, 4.5, z + 26 - m * 52);
              city.add(post);
              islandPts.push(new THREE.Vector3(x + 26 - m * 52, 9.4, z + 26 - m * 52));
            }
          }
        }
      const cat = cathedral();
      cat.position.set(0, 0, -6);
      city.add(cat);
      // 环岛堤岸与桥
      const quay = new THREE.Mesh(new THREE.CylinderGeometry(388, 400, 7, 48), matStone);
      quay.position.y = -0.5;
      quay.receiveShadow = true;
      city.add(quay);
      const ground = new THREE.Mesh(new THREE.CircleGeometry(386, 48),
        new THREE.MeshStandardMaterial({ color: 0x23262e, roughness: 0.95 }));
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = 3.05;
      ground.receiveShadow = true;
      city.add(ground);
      for (let i = 0; i < 4; i++) {
        const bridge = new THREE.Mesh(new THREE.BoxGeometry(14, 2.2, 150), matStone);
        bridge.position.set(Math.cos((i / 4) * Math.PI * 2) * 430, 2.2, Math.sin((i / 4) * Math.PI * 2) * 430);
        bridge.rotation.y = (i / 4) * Math.PI * 2 + Math.PI / 2;
        city.add(bridge);
        const arch = new THREE.Mesh(new THREE.TorusGeometry(7, 1, 6, 12, Math.PI), matStone);
        arch.position.copy(bridge.position);
        arch.rotation.y = bridge.rotation.y;
        arch.position.y = -1;
        city.add(arch);
      }
      scene.add(city);

      /* ============ 海浪着色器 ============ */
      const seaMat = new THREE.ShaderMaterial({
        transparent: true,
        uniforms: {
          uTime: { value: 0 },
          uDeep: { value: new THREE.Color(0x081226) },
          uShallow: { value: new THREE.Color(0x1d3b5a) },
          uFoam: { value: new THREE.Color(0xa8c6e8) },
          uMoon: { value: moon.position.clone().normalize() },
        },
        vertexShader: `
          varying vec3 vPos; varying float vH; varying vec2 vUv;
          uniform float uTime;
          void main() {
            vUv = uv;
            vec3 p = position;
            float w1 = sin(p.x * 0.018 + uTime * 0.9) * cos(p.y * 0.014 + uTime * 0.7);
            float w2 = sin(p.x * 0.061 - uTime * 1.8 + p.y * 0.03) * 0.45;
            float w3 = sin(p.y * 0.12 + uTime * 2.4) * 0.22;
            p.z += w1 + w2 + w3;
            vH = w1 + w2 + w3;
            vPos = p;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
          }`,
        fragmentShader: `
          varying float vH; varying vec2 vUv; varying vec3 vPos;
          uniform vec3 uDeep, uShallow, uFoam, uMoon;
          void main() {
            float t = smoothstep(-1.2, 1.6, vH);
            vec3 c = mix(uDeep, uShallow, t);
            float band = abs(fract(vH * 1.5) - 0.5);
            c = mix(c, uFoam, smoothstep(0.94, 0.995, band));
            float glow = pow(max(dot(normalize(vec3(0.0,1.0,0.0)), uMoon), 0.0), 3.0);
            c += vec3(0.25,0.35,0.6) * glow * smoothstep(0.75, 1.0, t) * 0.6;
            gl_FragColor = vec4(c, 0.96);
          }`,
      });
      const sea = new THREE.Mesh(new THREE.PlaneGeometry(4600, 4600, 160, 160), seaMat);
      sea.rotation.x = -Math.PI / 2;
      sea.position.y = -2;
      scene.add(sea);

      /* ============ 火焰粒子（GPU Points） ============ */
      const flameCount = islandPts.length * 46;
      const fPos = new Float32Array(flameCount * 3);
      const fSeed = new Float32Array(flameCount);
      for (let i = 0; i < flameCount; i++) {
        const p = islandPts[i % islandPts.length];
        fPos[i * 3] = p.x; fPos[i * 3 + 1] = p.y; fPos[i * 3 + 2] = p.z;
        fSeed[i] = Math.random();
      }
      const flameGeo = new THREE.BufferGeometry();
      flameGeo.setAttribute("position", new THREE.BufferAttribute(fPos, 3));
      flameGeo.setAttribute("aSeed", new THREE.BufferAttribute(fSeed, 1));
      const flameMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: { uTime: { value: 0 } },
        vertexShader: `
          attribute float aSeed; varying float vLife;
          uniform float uTime;
          void main() {
            float life = fract(uTime * (0.5 + aSeed * 0.5) + aSeed * 7.31);
            vLife = life;
            vec3 p = position;
            p.y += life * 3.4;
            p.x += sin(life * 9.0 + aSeed * 30.0) * 0.35 * life;
            p.z += cos(life * 8.0 + aSeed * 17.0) * 0.35 * life;
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = (46.0 * (1.0 - life) + 8.0) / -mv.z * 60.0;
            gl_Position = projectionMatrix * mv;
          }`,
        fragmentShader: `
          varying float vLife;
          void main() {
            vec2 d = gl_PointCoord - 0.5;
            float m = smoothstep(0.5, 0.05, length(d));
            vec3 c = mix(vec3(1.0,0.62,0.18), vec3(0.9,0.2,0.1), vLife);
            gl_FragColor = vec4(c, m * (1.0 - vLife) * 0.85);
          }`,
      });
      const flames = new THREE.Points(flameGeo, flameMat);
      scene.add(flames);

      /* ============ 月亮与星 ============ */
      const moonDisc = new THREE.Mesh(new THREE.SphereGeometry(34, 24, 24),
        new THREE.MeshBasicMaterial({ color: 0xf5f0d8 }));
      moonDisc.position.copy(moon.position).multiplyScalar(6.2);
      scene.add(moonDisc);
      const starGeo = new THREE.BufferGeometry();
      const sPos = new Float32Array(900 * 3);
      for (let i = 0; i < 900; i++) {
        const a = Math.random() * Math.PI * 2, b = Math.acos(Math.random() * 0.9);
        const r = 1700;
        sPos.set([Math.sin(b) * Math.cos(a) * r, Math.cos(b) * r, Math.sin(b) * Math.sin(a) * r], i * 3);
      }
      starGeo.setAttribute("position", new THREE.BufferAttribute(sPos, 3));
      scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xbfd0ff, size: 2.4, sizeAttenuation: false, transparent: true, opacity: 0.8 })));

      /* ============ 相机控制：环视 + 漫游 + 自动巡航 ============ */
      const rig = {
        target: new THREE.Vector3(0, 60, 0),
        yaw: 0.7, pitch: 0.32, dist: 640,
        autoCruise: true, night: true,
      };
      function placeCamera() {
        const t = rig.target;
        camera.position.set(
          t.x + Math.cos(rig.pitch) * Math.sin(rig.yaw) * rig.dist,
          t.y + Math.sin(rig.pitch) * rig.dist,
          t.z + Math.cos(rig.pitch) * Math.cos(rig.yaw) * rig.dist,
        );
        camera.lookAt(t);
      }
      placeCamera();

      let dragging = false, lastX = 0, lastY = 0, pinch = 0, lastInteract = performance.now();
      const dom = renderer.domElement;
      dom.addEventListener("pointerdown", (e) => {
        dragging = true; lastX = e.clientX; lastY = e.clientY;
        lastInteract = performance.now();
      });
      window.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        rig.yaw -= (e.clientX - lastX) * 0.005;
        rig.pitch = Math.min(1.35, Math.max(-0.05, rig.pitch + (e.clientY - lastY) * 0.004));
        lastX = e.clientX; lastY = e.clientY;
        lastInteract = performance.now();
      });
      window.addEventListener("pointerup", () => (dragging = false));
      dom.addEventListener("wheel", (e) => {
        e.preventDefault();
        rig.dist = Math.min(1400, Math.max(60, rig.dist * (e.deltaY > 0 ? 1.1 : 0.9)));
        lastInteract = performance.now();
      }, { passive: false });
      dom.addEventListener("touchstart", (e) => {
        if (e.touches.length === 2) {
          pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        }
      }, { passive: true });
      dom.addEventListener("touchmove", (e) => {
        if (e.touches.length === 2 && pinch) {
          const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
          rig.dist = Math.min(1400, Math.max(60, rig.dist * (pinch / d)));
          pinch = d;
          lastInteract = performance.now();
        }
      }, { passive: true });

      const keys = {};
      addEventListener("keydown", (e) => {
        keys[e.key.toLowerCase()] = true;
        if (e.code === "Space") { e.preventDefault(); toggleCruise(); }
      });
      addEventListener("keyup", (e) => (keys[e.key.toLowerCase()] = false));
      function moveRig(dt) {
        const speed = (rig.dist * 0.35 + 40) * dt;
        const fx = Math.sin(rig.yaw), fz = Math.cos(rig.yaw);
        if (keys.w) { rig.target.x += fx * speed; rig.target.z += fz * speed; }
        if (keys.s) { rig.target.x -= fx * speed; rig.target.z -= fz * speed; }
        if (keys.a) { rig.target.x += fz * speed; rig.target.z -= fx * speed; }
        if (keys.d) { rig.target.x -= fz * speed; rig.target.z += fx * speed; }
        if (keys.q) rig.target.y = Math.max(4, rig.target.y - speed);
        if (keys.e) rig.target.y = Math.min(360, rig.target.y + speed);
        if (keys.w || keys.s || keys.a || keys.d || keys.q || keys.e) {
          lastInteract = performance.now();
          rig.target.x = Math.max(-360, Math.min(360, rig.target.x));
          rig.target.z = Math.max(-360, Math.min(360, rig.target.z));
        }
      }

      /* ============ HUD 开关 ============ */
      const btnCruise = document.getElementById("btnCruise");
      const btnNight = document.getElementById("btnNight");
      function toggleCruise() {
        rig.autoCruise = !rig.autoCruise;
        btnCruise.classList.toggle("on", rig.autoCruise);
      }
      btnCruise.onclick = toggleCruise;
      btnNight.onclick = () => {
        rig.night = !rig.night;
        btnNight.classList.toggle("on", rig.night);
        matWindow.emissiveIntensity = rig.night ? 1.6 : 0.12;
        matRose.emissiveIntensity = rig.night ? 1.35 : 0.25;
        flameMat.visible = true;
        flames.visible = rig.night;
        moon.intensity = rig.night ? 1.15 : 2.4;
        moonDisc.visible = rig.night;
        scene.fog.color.set(rig.night ? 0x0a1024 : 0x31445f);
        scene.background.set(rig.night ? 0x070b18 : 0x182b47);
        rim.intensity = rig.night ? 0.9 : 1.7;
      };
      document.getElementById("btnReset").onclick = () => {
        rig.target.set(0, 60, 0); rig.yaw = 0.7; rig.pitch = 0.32; rig.dist = 640;
      };

      /* ============ 主循环 ============ */
      const clock = new THREE.Clock();
      let cruisePhase = 0;
      function loop() {
        const dt = Math.min(clock.getDelta(), 0.05);
        const t = clock.elapsedTime;
        seaMat.uniforms.uTime.value = t;
        flameMat.uniforms.uTime.value = t;
        moveRig(dt);
        if (rig.autoCruise && !dragging && performance.now() - lastInteract > 1600) {
          cruisePhase += dt * 0.06;
          rig.yaw += dt * 0.055;
          rig.target.set(Math.sin(cruisePhase * 0.7) * 120, 70 + Math.sin(cruisePhase * 0.5) * 46, Math.cos(cruisePhase * 0.5) * 120);
          rig.pitch = 0.3 + Math.sin(cruisePhase * 0.6) * 0.14;
          rig.dist = 620 + Math.sin(cruisePhase * 0.4) * 160;
        }
        placeCamera();
        renderer.render(scene, camera);
        requestAnimationFrame(loop);
      }
      loop();

      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      // three 加载失败兜底（CDN 不可达时 import 已失败，不会执行到这里；保留 window 错误提示）
      addEventListener("error", (e) => {
        const box = document.getElementById("err");
        box.style.display = "flex";
        box.textContent = "资源加载失败：" + (e.message || "请检查网络（three.js CDN）后刷新。");
      });
    </script>
    <script>
      window.addEventListener("error", (e) => {
        if (String(e.target?.src || "").includes("unpkg")) {
          const box = document.getElementById("err");
          box.style.display = "flex";
          box.textContent = "无法从 CDN 加载 three.js（需联网）。";
        }
      }, true);
    </script>
  </body>
</html>
