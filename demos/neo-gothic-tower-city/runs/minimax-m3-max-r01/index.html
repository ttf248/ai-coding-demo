<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>新哥特式塔楼城市 · 漫游</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #06080d;
        color: #d8d4c8;
        font-family: "Inter", "PingFang SC", system-ui, sans-serif;
        overflow: hidden;
        height: 100%;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      .hud {
        position: fixed;
        pointer-events: none;
        color: #f3eed8;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        z-index: 4;
      }
      .hud.tl {
        top: 18px;
        left: 18px;
      }
      .hud.tr {
        top: 18px;
        right: 18px;
        text-align: right;
      }
      .hud.bl {
        bottom: 18px;
        left: 18px;
        max-width: 320px;
      }
      .hud.br {
        bottom: 18px;
        right: 18px;
        text-align: right;
      }
      .pill {
        background: rgba(20, 12, 6, 0.55);
        border: 1px solid rgba(243, 238, 216, 0.18);
        padding: 6px 10px;
        border-radius: 999px;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }
      .title {
        font-family: "Cinzel", "PingFang SC", serif;
        font-size: 22px;
        letter-spacing: 0.16em;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .small {
        font-size: 11px;
        opacity: 0.7;
        line-height: 1.4;
      }
      .compass {
        width: 86px;
        height: 86px;
        border-radius: 999px;
        background: rgba(20, 12, 6, 0.55);
        border: 1px solid rgba(243, 238, 216, 0.18);
        position: relative;
        margin-left: auto;
        backdrop-filter: blur(6px);
      }
      .compass .needle {
        position: absolute;
        inset: 6px;
        border-radius: 999px;
        background:
          conic-gradient(
            from 0deg,
            rgba(243, 200, 110, 0.05) 0deg,
            rgba(243, 200, 110, 0.6) 90deg,
            rgba(243, 200, 110, 0.05) 180deg,
            rgba(243, 200, 110, 0.3) 270deg,
            rgba(243, 200, 110, 0.05) 360deg
          );
      }
      .compass .label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        letter-spacing: 0.2em;
      }
      .controls {
        pointer-events: auto;
        background: rgba(20, 12, 6, 0.55);
        border: 1px solid rgba(243, 238, 216, 0.18);
        border-radius: 14px;
        padding: 10px 14px;
        backdrop-filter: blur(8px);
      }
      .controls button {
        background: rgba(243, 238, 216, 0.08);
        color: #f3eed8;
        border: 1px solid rgba(243, 238, 216, 0.2);
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 11px;
        letter-spacing: 0.06em;
        cursor: pointer;
        margin-right: 6px;
      }
      .controls button:hover {
        background: rgba(243, 238, 216, 0.16);
      }
      .controls button.active {
        background: rgba(243, 200, 110, 0.32);
        border-color: rgba(243, 200, 110, 0.6);
        color: #fff5d2;
      }
      .crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 14px;
        height: 14px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 3;
        opacity: 0.5;
      }
      .crosshair::before,
      .crosshair::after {
        content: "";
        position: absolute;
        background: #f3eed8;
      }
      .crosshair::before {
        left: 50%;
        top: 0;
        bottom: 0;
        width: 1px;
        transform: translateX(-50%);
      }
      .crosshair::after {
        top: 50%;
        left: 0;
        right: 0;
        height: 1px;
        transform: translateY(-50%);
      }
      .footnote {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        opacity: 0.55;
        pointer-events: none;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="hud tl">
      <div class="pill">
        <div class="title">AETHELMARK</div>
        <div class="small">新哥特式塔楼 · 漫游 v1</div>
      </div>
    </div>
    <div class="hud tr">
      <div class="pill">
        <div class="small">FPS <span id="fps">--</span> · 时间 <span id="clock">--:--</span></div>
        <div class="small">由 minimax-m3 / max 在测试基线中按 v1 任务正文生成</div>
      </div>
    </div>
    <div class="hud bl">
      <div class="controls">
        <div style="margin-bottom:6px; font-size:10px; opacity:0.7; letter-spacing:0.16em;">场景模式</div>
        <button data-mode="tour" class="active">漫游</button>
        <button data-mode="dusk">黄昏</button>
        <button data-mode="night">深夜</button>
        <button data-mode="ember">余烬</button>
      </div>
    </div>
    <div class="hud br">
      <div class="compass">
        <div class="needle"></div>
        <div class="label">N</div>
      </div>
    </div>
    <div class="crosshair"></div>
    <div class="footnote">左键拖动旋转 · 滚轮缩放 · W/A/S/D 平移</div>

    <script type="module">
      import * as THREE from "three";

      const canvas = document.getElementById("scene");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x07090e);
      scene.fog = new THREE.FogExp2(0x0c0d12, 0.022);

      const camera = new THREE.PerspectiveCamera(
        55,
        window.innerWidth / window.innerHeight,
        0.1,
        800,
      );
      camera.position.set(38, 26, 38);

      // ---------- Lights ----------
      const hemi = new THREE.HemisphereLight(0x8ea1c6, 0x2a1f10, 0.5);
      scene.add(hemi);

      const moon = new THREE.DirectionalLight(0xcfd6ff, 0.9);
      moon.position.set(-60, 80, 40);
      moon.castShadow = true;
      moon.shadow.mapSize.set(1024, 1024);
      moon.shadow.camera.left = -80;
      moon.shadow.camera.right = 80;
      moon.shadow.camera.top = 80;
      moon.shadow.camera.bottom = -80;
      scene.add(moon);

      const torch = new THREE.PointLight(0xff8b3d, 0.9, 80, 1.6);
      torch.position.set(0, 6, 0);
      scene.add(torch);

      const streetLamps = [];

      // ---------- Ground ----------
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(420, 420, 32, 32),
        new THREE.MeshStandardMaterial({
          color: 0x14110d,
          roughness: 0.95,
          metalness: 0.05,
        }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // Subtle grid lines as a parchment feel.
      const grid = new THREE.GridHelper(420, 84, 0x4a3a26, 0x2a1f12);
      grid.material.transparent = true;
      grid.material.opacity = 0.18;
      scene.add(grid);

      // ---------- Materials ----------
      const stoneMat = new THREE.MeshStandardMaterial({
        color: 0x34302a,
        roughness: 0.85,
        metalness: 0.05,
      });
      const darkStoneMat = new THREE.MeshStandardMaterial({
        color: 0x1f1c19,
        roughness: 0.95,
        metalness: 0.1,
      });
      const accentMat = new THREE.MeshStandardMaterial({
        color: 0x8c6f3f,
        roughness: 0.6,
        metalness: 0.4,
      });
      const glassMat = new THREE.MeshStandardMaterial({
        color: 0x10131a,
        roughness: 0.2,
        metalness: 0.85,
        emissive: 0x26160c,
        emissiveIntensity: 0.4,
      });

      // ---------- Helper builders ----------
      function buildTower(x, z, height, baseRadius) {
        const group = new THREE.Group();

        // Square base
        const baseSize = baseRadius * 2;
        const base = new THREE.Mesh(
          new THREE.BoxGeometry(baseSize, 1.4, baseSize),
          darkStoneMat,
        );
        base.position.y = 0.7;
        base.castShadow = true;
        base.receiveShadow = true;
        group.add(base);

        // Octagonal body
        const body = new THREE.Mesh(
          new THREE.CylinderGeometry(baseRadius * 0.85, baseRadius, height, 8, 1),
          stoneMat,
        );
        body.position.y = 1.4 + height / 2;
        body.castShadow = true;
        body.receiveShadow = true;
        group.add(body);

        // Spires around the top
        const spireHeight = height * 0.18;
        for (let i = 0; i < 4; i++) {
          const angle = (i / 4) * Math.PI * 2 + Math.PI / 4;
          const spire = new THREE.Mesh(
            new THREE.ConeGeometry(0.55, spireHeight, 6),
            darkStoneMat,
          );
          spire.position.set(
            Math.cos(angle) * baseRadius * 0.85,
            1.4 + height + spireHeight / 2 - 0.1,
            Math.sin(angle) * baseRadius * 0.85,
          );
          spire.castShadow = true;
          group.add(spire);
        }

        // Central spire
        const central = new THREE.Mesh(
          new THREE.ConeGeometry(baseRadius * 0.32, height * 0.6, 8),
          darkStoneMat,
        );
        central.position.y = 1.4 + height + height * 0.3;
        central.castShadow = true;
        group.add(central);

        // Glow window
        const window = new THREE.Mesh(
          new THREE.BoxGeometry(baseRadius * 0.3, baseRadius * 0.5, 0.05),
          glassMat,
        );
        window.position.set(
          baseRadius * 0.85,
          1.4 + height * 0.55,
          0,
        );
        group.add(window);

        const window2 = window.clone();
        window2.rotation.y = Math.PI;
        group.add(window2);

        // Buttress ring at the base.
        for (let i = 0; i < 4; i++) {
          const angle = (i / 4) * Math.PI * 2;
          const buttress = new THREE.Mesh(
            new THREE.BoxGeometry(0.7, 4, 0.7),
            accentMat,
          );
          buttress.position.set(
            Math.cos(angle) * baseRadius * 1.05,
            2.8,
            Math.sin(angle) * baseRadius * 1.05,
          );
          buttress.castShadow = true;
          group.add(buttress);
        }

        group.position.set(x, 0, z);
        return group;
      }

      function buildBridge(from, to) {
        const length = from.distanceTo(to);
        const bridge = new THREE.Mesh(
          new THREE.BoxGeometry(length, 0.6, 2.2),
          darkStoneMat,
        );
        const mid = from.clone().add(to).multiplyScalar(0.5);
        bridge.position.copy(mid);
        bridge.position.y = 6;
        bridge.castShadow = true;

        // Arches underneath.
        const archCount = Math.max(1, Math.floor(length / 4));
        const arches = new THREE.Group();
        for (let i = 0; i < archCount; i++) {
          const t = (i + 0.5) / archCount;
          const arch = new THREE.Mesh(
            new THREE.TorusGeometry(1.6, 0.2, 6, 12, Math.PI),
            accentMat,
          );
          arch.position.set(
            mid.x + (to.x - from.x) * (t - 0.5),
            4.4,
            mid.z + (to.z - from.z) * (t - 0.5),
          );
          arch.rotation.y = Math.atan2(to.z - from.z, to.x - from.x);
          arch.castShadow = true;
          arches.add(arch);
        }
        const group = new THREE.Group();
        group.add(bridge);
        group.add(arches);
        return group;
      }

      function addStreetLamp(x, z) {
        const lamp = new THREE.PointLight(0xff8b3d, 0.6, 22, 2);
        lamp.position.set(x, 4.5, z);
        scene.add(lamp);
        const post = new THREE.Mesh(
          new THREE.CylinderGeometry(0.06, 0.08, 4.5, 8),
          darkStoneMat,
        );
        post.position.set(x, 2.25, z);
        scene.add(post);
        streetLamps.push(lamp);
      }

      // ---------- City layout ----------
      const towers = [];
      const TOWER_CONFIG = [
        { x: 0, z: 0, h: 24, r: 4 },
        { x: 14, z: -10, h: 18, r: 3.2 },
        { x: -16, z: 12, h: 22, r: 3.6 },
        { x: -22, z: -22, h: 16, r: 2.6 },
        { x: 26, z: 6, h: 20, r: 3.4 },
        { x: -10, z: -34, h: 14, r: 2.4 },
        { x: 18, z: 24, h: 17, r: 2.9 },
        { x: -38, z: -2, h: 19, r: 3.1 },
        { x: 32, z: -28, h: 15, r: 2.5 },
        { x: 6, z: 38, h: 16, r: 2.7 },
        { x: -28, z: 30, h: 18, r: 3 },
        { x: 40, z: 18, h: 13, r: 2.2 },
      ];
      for (const cfg of TOWER_CONFIG) {
        const t = buildTower(cfg.x, cfg.z, cfg.h, cfg.r);
        scene.add(t);
        towers.push(t);
      }

      // Bridges connecting nearby towers.
      for (let i = 0; i < towers.length; i++) {
        for (let j = i + 1; j < towers.length; j++) {
          const a = towers[i].position;
          const b = towers[j].position;
          if (a.distanceTo(b) < 22) {
            scene.add(buildBridge(a, b));
          }
        }
      }

      // Cobble plaza.
      const plaza = new THREE.Mesh(
        new THREE.CircleGeometry(12, 32),
        new THREE.MeshStandardMaterial({
          color: 0x2c241c,
          roughness: 0.95,
          metalness: 0.05,
        }),
      );
      plaza.rotation.x = -Math.PI / 2;
      plaza.position.y = 0.05;
      scene.add(plaza);

      // Street lamps around the plaza.
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        addStreetLamp(Math.cos(a) * 10, Math.sin(a) * 10);
      }

      // Sea of mist rolling across the ground plane.
      const mistGeometry = new THREE.PlaneGeometry(420, 420, 1, 1);
      const mistMaterial = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: { uTime: { value: 0 } },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec2 vUv;
          uniform float uTime;
          void main() {
            float d = distance(vUv, vec2(0.5));
            float wave = sin(vUv.x * 18.0 + uTime * 0.4) * 0.5 + 0.5;
            float a = smoothstep(0.55, 0.35, d) * (0.05 + wave * 0.06);
            gl_FragColor = vec4(0.85, 0.78, 0.65, a);
          }
        `,
      });
      const mist = new THREE.Mesh(mistGeometry, mistMaterial);
      mist.rotation.x = -Math.PI / 2;
      mist.position.y = 0.4;
      scene.add(mist);

      // Fire embers (Points).
      const emberCount = 220;
      const emberPositions = new Float32Array(emberCount * 3);
      const emberSpeeds = new Float32Array(emberCount);
      for (let i = 0; i < emberCount; i++) {
        emberPositions[i * 3] = (Math.random() - 0.5) * 100;
        emberPositions[i * 3 + 1] = Math.random() * 24 + 4;
        emberPositions[i * 3 + 2] = (Math.random() - 0.5) * 100;
        emberSpeeds[i] = 0.6 + Math.random() * 0.8;
      }
      const emberGeometry = new THREE.BufferGeometry();
      emberGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(emberPositions, 3),
      );
      const emberMaterial = new THREE.PointsMaterial({
        color: 0xffaa55,
        size: 0.6,
        transparent: true,
        opacity: 0.85,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const embers = new THREE.Points(emberGeometry, emberMaterial);
      scene.add(embers);

      // Ocean / waves.
      const ocean = new THREE.Mesh(
        new THREE.PlaneGeometry(600, 600, 64, 64),
        new THREE.MeshStandardMaterial({
          color: 0x0a1422,
          roughness: 0.4,
          metalness: 0.7,
          transparent: true,
          opacity: 0.85,
        }),
      );
      ocean.rotation.x = -Math.PI / 2;
      ocean.position.y = -2;
      scene.add(ocean);

      // ---------- Camera controls ----------
      let target = new THREE.Vector3(0, 8, 0);
      let azimuth = Math.PI / 4;
      let elevation = Math.PI / 6;
      let radius = 60;
      const MIN_R = 18;
      const MAX_R = 130;

      const input = { forward: 0, right: 0 };
      const keys = new Set();
      window.addEventListener("keydown", (e) => {
        if (e.code === "KeyW" || e.code === "ArrowUp") input.forward = -1;
        if (e.code === "KeyS" || e.code === "ArrowDown") input.forward = 1;
        if (e.code === "KeyA" || e.code === "ArrowLeft") input.right = -1;
        if (e.code === "KeyD" || e.code === "ArrowRight") input.right = 1;
        keys.add(e.code);
      });
      window.addEventListener("keyup", (e) => {
        keys.delete(e.code);
        if (
          !keys.has("KeyW") &&
          !keys.has("ArrowUp") &&
          !keys.has("KeyS") &&
          !keys.has("ArrowDown")
        )
          input.forward = 0;
        if (
          !keys.has("KeyA") &&
          !keys.has("ArrowLeft") &&
          !keys.has("KeyD") &&
          !keys.has("ArrowRight")
        )
          input.right = 0;
      });

      let isDragging = false;
      let dragX = 0,
        dragY = 0;
      canvas.addEventListener("pointerdown", (e) => {
        isDragging = true;
        dragX = e.clientX;
        dragY = e.clientY;
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener("pointerup", (e) => {
        isDragging = false;
        canvas.releasePointerCapture(e.pointerId);
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        const dx = e.clientX - dragX;
        const dy = e.clientY - dragY;
        dragX = e.clientX;
        dragY = e.clientY;
        azimuth -= dx * 0.005;
        elevation -= dy * 0.005;
        elevation = Math.max(0.05, Math.min(Math.PI / 2.2, elevation));
      });
      canvas.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          radius += e.deltaY * 0.05;
          radius = Math.max(MIN_R, Math.min(MAX_R, radius));
        },
        { passive: false },
      );

      // ---------- Scene modes ----------
      const modes = {
        tour: { bg: 0x07090e, hemi: 0.5, moon: 0.9, torch: 0.9, embers: 0.85, fog: 0x0c0d12 },
        dusk: { bg: 0x1f1418, hemi: 0.7, moon: 0.4, torch: 1.3, embers: 1.0, fog: 0x301a18 },
        night: { bg: 0x02030a, hemi: 0.25, moon: 1.4, torch: 0.6, embers: 0.6, fog: 0x03050b },
        ember: { bg: 0x14080a, hemi: 0.4, moon: 0.2, torch: 1.8, embers: 1.4, fog: 0x1a0c0c },
      };
      let mode = "tour";
      let modeBlend = 0;
      document.querySelectorAll(".controls button").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".controls button")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          mode = btn.dataset.mode;
        });
      });

      // ---------- Resize ----------
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // ---------- FPS / clock ----------
      const fpsEl = document.getElementById("fps");
      const clockEl = document.getElementById("clock");
      let last = performance.now();
      let frames = 0;
      let acc = 0;

      // ---------- Animation loop ----------
      const clock = new THREE.Clock();
      function animate() {
        const dt = clock.getDelta();
        const t = clock.elapsedTime;

        // Apply movement.
        const sin = Math.sin(azimuth);
        const cos = Math.cos(azimuth);
        if (input.forward !== 0 || input.right !== 0) {
          target.x += (-sin * input.forward + cos * input.right) * 12 * dt;
          target.z += (-cos * input.forward - sin * input.right) * 12 * dt;
          target.x = Math.max(-100, Math.min(100, target.x));
          target.z = Math.max(-100, Math.min(100, target.z));
        }

        // Smooth camera follow.
        const tx = target.x + Math.sin(azimuth) * Math.cos(elevation) * radius;
        const ty = target.y + Math.sin(elevation) * radius;
        const tz = target.z + Math.cos(azimuth) * Math.cos(elevation) * radius;
        camera.position.lerp(new THREE.Vector3(tx, ty, tz), 0.08);
        camera.lookAt(target.x, target.y + 4, target.z);

        // Torch flicker.
        torch.intensity = 0.7 + Math.sin(t * 6) * 0.15 + Math.sin(t * 11) * 0.05;
        torch.position.x = Math.sin(t * 0.3) * 4;
        torch.position.z = Math.cos(t * 0.4) * 4;

        // Embers motion.
        const pos = embers.geometry.attributes.position.array;
        for (let i = 0; i < emberCount; i++) {
          pos[i * 3 + 1] += emberSpeeds[i] * dt;
          pos[i * 3] += Math.sin(t + i) * 0.01;
          if (pos[i * 3 + 1] > 30) {
            pos[i * 3] = (Math.random() - 0.5) * 100;
            pos[i * 3 + 1] = 0;
            pos[i * 3 + 2] = (Math.random() - 0.5) * 100;
          }
        }
        embers.geometry.attributes.position.needsUpdate = true;

        // Ocean ripple.
        const oceanPos = ocean.geometry.attributes.position;
        for (let i = 0; i < oceanPos.count; i++) {
          const x = oceanPos.getX(i);
          const y = oceanPos.getY(i);
          const wave =
            Math.sin(x * 0.05 + t * 0.8) * 0.4 +
            Math.cos(y * 0.06 + t * 0.6) * 0.4;
          oceanPos.setZ(i, wave);
        }
        oceanPos.needsUpdate = true;

        // Mist shader.
        mistMaterial.uniforms.uTime.value = t;

        // Mode blending.
        const cur = modes[mode];
        scene.background = new THREE.Color(cur.bg);
        scene.fog.color = new THREE.Color(cur.fog);
        hemi.intensity += (cur.hemi - hemi.intensity) * 0.04;
        moon.intensity += (cur.moon - moon.intensity) * 0.04;
        torch.intensity *= cur.torch / (cur.torch < torch.intensity ? 0.99 : 1.01);
        emberMaterial.opacity += (cur.embers - emberMaterial.opacity) * 0.04;

        // FPS / clock HUD.
        frames++;
        acc += dt;
        if (acc >= 0.5) {
          fpsEl.textContent = Math.round(frames / acc);
          frames = 0;
          acc = 0;
        }
        const hh = String(Math.floor((t * 12) % 12 + 18) % 24).padStart(2, "0");
        const mm = String(Math.floor((t * 30) % 60)).padStart(2, "0");
        clockEl.textContent = `${hh}:${mm}`;

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate();
    </script>
  </body>
</html>
