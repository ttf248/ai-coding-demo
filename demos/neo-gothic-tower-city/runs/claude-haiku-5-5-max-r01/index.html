<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>新哥特式塔楼城市 · 3D 漫游</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #070b1d; color: #f6ead8; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .panel { position: fixed; left: 14px; top: 14px; width: min(360px, calc(100vw - 28px)); box-sizing: border-box; padding: 14px 16px; border-radius: 14px; background: rgba(10, 13, 28, 0.62); border: 1px solid rgba(255, 210, 140, 0.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 13px; line-height: 1.7; }
    .panel h1 { margin: 0 0 4px; font-size: 17px; letter-spacing: 0.06em; color: #ffd39a; }
    .panel p { margin: 4px 0; color: #d9cdb8; }
    .panel kbd { font: inherit; padding: 0 5px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.08); }
    .pending { color: #ffcf7a; font-weight: 600; }
    .toolbar { position: fixed; right: 14px; top: 14px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; max-width: calc(100vw - 28px); }
    .toolbar button { font: inherit; font-size: 13px; color: #fff3df; background: rgba(10, 13, 28, 0.62); border: 1px solid rgba(255, 210, 140, 0.3); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
    .toolbar button:hover, .toolbar button:focus-visible { background: rgba(255, 170, 90, 0.25); outline: none; }
    .stats { position: fixed; left: 14px; bottom: 14px; padding: 6px 10px; border-radius: 8px; font-size: 12px; color: #bfb29b; background: rgba(10, 13, 28, 0.5); }
    .fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; background: #070b1d; color: #ffd39a; font-size: 15px; line-height: 1.8; z-index: 10; }
    @media (max-width: 560px) { .panel { font-size: 12px; } .panel h1 { font-size: 15px; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="3D 新哥特式塔楼城市"></canvas>
  <section class="panel" aria-label="说明">
    <h1>新哥特式塔楼城市</h1>
    <p>单位为米：街区间距 84 m，主教堂塔尖约 110 m，人眼高度 1.7 m。</p>
    <p>拖动转动视角（触摸同理）· <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 · <kbd>Q</kbd> / <kbd>E</kbd> 升降 · <kbd>Shift</kbd> 加速 · <kbd>T</kbd> 切换模式 · <kbd>N</kbd> 切换时段</p>
    <p><span class="pending">待确认</span>：未提供真实塔楼图纸或实景测量数据，建筑尺寸为按新哥特式比例做出的程序化设定，与具体实景的比例需对照资料复核。</p>
    <p><span class="pending">待确认</span>：海浪、火焰与尘雾均为程序化粒子近似，未引用外部模型或贴图。</p>
    <p><span class="pending">待确认</span>：Three.js r160 通过 unpkg CDN 加载，离线环境需替换为本地副本。</p>
  </section>
  <div class="toolbar">
    <button id="modeBtn" type="button">模式：自动巡游</button>
    <button id="timeBtn" type="button">时段：黄昏</button>
  </div>
  <div class="stats" id="stats">FPS --</div>
  <div class="fallback" id="fallback" role="alert"></div>
  <script type="module">
    import * as THREE from "three";

    const fallback = document.getElementById("fallback");
    function showFallback(message) {
      fallback.textContent = message;
      fallback.style.display = "flex";
    }
    window.addEventListener("error", (event) => {
      showFallback("页面运行出错：" + (event.message || "未知错误") + "。若画面为空，请检查网络（Three.js CDN）或 WebGL 支持后刷新。");
    });

    const canvas = document.getElementById("scene");
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    } catch (error) {
      showFallback("当前浏览器无法创建 WebGL 上下文，无法显示 3D 城市。");
      throw error;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.setClearColor(0x0b1020);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1b2540, 0.0036);
    const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.5, 4000);

    const timeU = { value: 0 };
    const pixelU = { value: Math.min(window.devicePixelRatio || 1, 2) };
    const CATH = { x: -40, z: 0 };

    // Time-of-day palettes: sky, fog, sun and window glow (night = 1).
    const PALETTES = [
      { name: "黎明", sky: 0x5d6fae, horizon: 0xf3b48f, fog: 0xc9a7a6, sun: 0xffd2a3, sunI: 2.0, hemi: 0.75, night: 0.35 },
      { name: "白昼", sky: 0x3b7fcc, horizon: 0xd6ecf7, fog: 0xb4d6e8, sun: 0xfff4de, sunI: 3.0, hemi: 0.95, night: 0.0 },
      { name: "黄昏", sky: 0x2b2d68, horizon: 0xff8f52, fog: 0x7e4b62, sun: 0xff9d5c, sunI: 1.8, hemi: 0.6, night: 0.7 },
      { name: "夜晚", sky: 0x060a1a, horizon: 0x1c2750, fog: 0x0f1834, sun: 0x9fb8ff, sunI: 0.35, hemi: 0.35, night: 1.0 },
    ];
    let phase = 2;
    const look = { sky: new THREE.Color(), horizon: new THREE.Color(), fog: new THREE.Color(), sun: new THREE.Color(), sunI: 0, hemi: 0, night: 0 };
    const tint = new THREE.Color();
    (function initLook(p) {
      look.sky.setHex(p.sky);
      look.horizon.setHex(p.horizon);
      look.fog.setHex(p.fog);
      look.sun.setHex(p.sun);
      look.sunI = p.sunI;
      look.hemi = p.hemi;
      look.night = p.night;
    })(PALETTES[phase]);

    // Sky dome follows the camera; the gradient is a small shader.
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: { top: { value: new THREE.Color() }, horizon: { value: new THREE.Color() } },
      vertexShader: "varying vec3 vDir; void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
      fragmentShader: "uniform vec3 top; uniform vec3 horizon; varying vec3 vDir; void main() { float h = smoothstep(-0.05, 0.55, vDir.y); gl_FragColor = vec4(mix(horizon, top, h), 1.0); }",
    });
    const sky = new THREE.Mesh(new THREE.SphereGeometry(3200, 32, 16), skyMat);
    sky.frustumCulled = false;
    scene.add(sky);

    const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x2f2a32, 0.6);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffd2a3, 1.8);
    sun.position.set(-520, 460, -340);
    sun.target.position.set(CATH.x, 0, CATH.z);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.5;
    Object.assign(sun.shadow.camera, { left: -760, right: 760, top: 760, bottom: -760, near: 50, far: 1800 });
    sun.shadow.camera.updateProjectionMatrix();
    scene.add(sun, sun.target);

    // Land spans x -900..300; the sea spans x 300..1700 with a quay wall at x 300..306.
    const land = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1400), new THREE.MeshStandardMaterial({ color: 0x3a3a41, roughness: 0.95 }));
    land.rotation.x = -Math.PI / 2;
    land.position.set(-300, 0, 0);
    land.receiveShadow = true;
    scene.add(land);

    const plaza = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), new THREE.MeshStandardMaterial({ color: 0x5b5249, roughness: 0.9 }));
    plaza.rotation.x = -Math.PI / 2;
    plaza.position.set(CATH.x, 0.03, CATH.z);
    plaza.receiveShadow = true;
    scene.add(plaza);

    const seaGeo = new THREE.PlaneGeometry(1400, 1600, 140, 160);
    seaGeo.rotateX(-Math.PI / 2);
    const sea = new THREE.Mesh(seaGeo, new THREE.MeshStandardMaterial({ color: 0x1d4d68, roughness: 0.22, metalness: 0.15 }));
    sea.position.set(1000, -1, 0);
    scene.add(sea);
    const seaPos = seaGeo.attributes.position;

    const quay = new THREE.Mesh(new THREE.BoxGeometry(6, 1.2, 1600), new THREE.MeshStandardMaterial({ color: 0x77716a, roughness: 0.9 }));
    quay.position.set(303, -0.4, 0);
    quay.receiveShadow = true;
    scene.add(quay);

    function waveHeight(x, z, t) {
      return 0.9 * Math.sin(x * 0.011 + t * 0.9) + 0.55 * Math.sin(z * 0.017 - t * 0.7 + x * 0.004) + 0.3 * Math.sin((x + z) * 0.029 + t * 1.6);
    }
    function animateSea(t) {
      for (let i = 0; i < seaPos.count; i++) seaPos.setY(i, waveHeight(seaPos.getX(i) + 1000, seaPos.getZ(i), t));
      seaPos.needsUpdate = true;
      seaGeo.computeVertexNormals();
    }

    // Seeded random keeps the layout identical on every load.
    function mulberry32(seed) {
      return function () {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rnd = mulberry32(1520);

    // Stone facade: lancet windows on the colour map, lit windows on the emissive map.
    function makeFacadeTexture(glow) {
      const c = document.createElement("canvas");
      c.width = 256;
      c.height = 512;
      const g = c.getContext("2d");
      g.fillStyle = glow ? "#000000" : "#d8cfbf";
      g.fillRect(0, 0, 256, 512);
      if (!glow) {
        g.fillStyle = "rgba(90, 80, 70, 0.14)";
        for (let y = 0; y < 512; y += 64) g.fillRect(0, y, 256, 3);
      }
      for (let col = 0; col < 2; col++) {
        for (let row = 0; row < 3; row++) {
          const x = 44 + col * 110, y = 36 + row * 160, w = 46, h = 104;
          g.beginPath();
          g.moveTo(x, y + h);
          g.lineTo(x, y + h * 0.4);
          g.quadraticCurveTo(x + w / 2, y - 10, x + w, y + h * 0.4);
          g.lineTo(x + w, y + h);
          g.closePath();
          g.fillStyle = glow ? (rnd() < 0.6 ? "#ffcf8a" : "#ff9a52") : "#3a4252";
          g.fill();
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }
    const stoneMap = makeFacadeTexture(false);
    const glowMap = makeFacadeTexture(true);
    const windowMats = [];
    const matCache = new Map();
    // Materials are shared by tile count so ~200 buildings need only a few dozen materials.
    function facadeMaterial(w, h) {
      const rx = Math.max(1, Math.round(w / 9)), ry = Math.max(1, Math.round(h / 12));
      const key = rx + "x" + ry;
      if (!matCache.has(key)) {
        const map = stoneMap.clone();
        map.repeat.set(rx, ry);
        const emissiveMap = glowMap.clone();
        emissiveMap.repeat.set(rx, ry);
        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, map, emissive: 0xffb36b, emissiveMap, emissiveIntensity: 0, roughness: 0.82, metalness: 0.02 });
        matCache.set(key, mat);
        windowMats.push(mat);
      }
      return matCache.get(key);
    }

    const roofMat = new THREE.MeshStandardMaterial({ color: 0x3b4153, roughness: 0.55, metalness: 0.15 });
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0xcfc6b6, roughness: 0.8 });
    const roseMat = new THREE.MeshStandardMaterial({ color: 0x2a2030, emissive: 0xffc27a, emissiveIntensity: 0, roughness: 0.4 });
    windowMats.push(roseMat);

    // Hip roof: four sloped faces meeting at the apex.
    function pyramidGeometry(w, d, h) {
      const a = w / 2, b = d / 2;
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute([-a, 0, -b, a, 0, -b, a, 0, b, -a, 0, b, 0, h, 0], 3));
      g.setIndex([0, 4, 1, 1, 4, 2, 2, 4, 3, 3, 4, 0]);
      g.computeVertexNormals();
      return g;
    }
    // Gable roof with its ridge along z, as on the nave, including both end triangles.
    function gableGeometry(w, d, h) {
      const a = w / 2, b = d / 2;
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute([-a, 0, -b, a, 0, -b, a, 0, b, -a, 0, b, 0, h, -b, 0, h, b], 3));
      g.setIndex([0, 5, 4, 0, 3, 5, 1, 4, 5, 1, 5, 2, 0, 4, 1, 2, 5, 3]);
      g.computeVertexNormals();
      return g;
    }

    const cityGroup = new THREE.Group();
    scene.add(cityGroup);

    // Hip-roofed tower with an optional octagonal spire buried into the roof.
    function addTower(x, z, w, h, d, options = {}) {
      const roofH = options.roofH ?? Math.min(h * 0.22, 26);
      const spireH = options.spireH ?? 0;
      const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), facadeMaterial(w, h));
      body.position.set(x, h / 2, z);
      body.castShadow = true;
      body.receiveShadow = true;
      cityGroup.add(body);
      const roof = new THREE.Mesh(pyramidGeometry(w, d, roofH), roofMat);
      roof.position.set(x, h, z);
      roof.castShadow = true;
      cityGroup.add(roof);
      if (spireH > 0) {
        // Spire base sits at half roof height, inside the roof, so no seam shows.
        const spire = new THREE.Mesh(new THREE.ConeGeometry(Math.min(w, d) * 0.18, spireH, 8), roofMat);
        spire.position.set(x, h + roofH * 0.5 + spireH / 2, z);
        spire.castShadow = true;
        cityGroup.add(spire);
      }
    }

    function addNave(x, z, w, h, d, roofH) {
      const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), facadeMaterial(w, h));
      body.position.set(x, h / 2, z);
      body.castShadow = true;
      body.receiveShadow = true;
      cityGroup.add(body);
      const roof = new THREE.Mesh(gableGeometry(w, d, roofH), roofMat);
      roof.position.set(x, h, z);
      roof.castShadow = true;
      cityGroup.add(roof);
    }

    // Flying buttress as a rotated box between two points.
    function addStrut(from, to) {
      const dir = new THREE.Vector3().subVectors(to, from);
      const len = dir.length();
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(len, 2.2, 2.2), stoneMat);
      mesh.position.copy(from).add(to).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), dir.normalize());
      mesh.castShadow = true;
      cityGroup.add(mesh);
    }

    const brazierPositions = [];
    function addBrazier(x, z) {
      const base = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.8, 3.5, 12), stoneMat);
      base.position.set(x, 1.75, z);
      base.castShadow = true;
      cityGroup.add(base);
      brazierPositions.push(new THREE.Vector3(x, 3.6, z));
    }

    function addCathedral() {
      const cx = CATH.x, cz = CATH.z;
      addNave(cx, cz, 44, 30, 130, 18);
      for (const dx of [-17, 17]) addTower(cx + dx, cz - 74, 18, 100, 18, { roofH: 14, spireH: 46 });
      addTower(cx, cz - 10, 22, 56, 22, { roofH: 14, spireH: 36 });
      const rose = new THREE.Mesh(new THREE.CircleGeometry(6.5, 40), roseMat);
      rose.position.set(cx, 19, cz - 65.1);
      rose.rotation.y = Math.PI;
      cityGroup.add(rose);
      for (const side of [-1, 1]) {
        for (let i = 0; i < 4; i++) {
          const zc = cz - 45 + i * 30;
          const pier = new THREE.Mesh(new THREE.BoxGeometry(4, 14, 4), stoneMat);
          pier.position.set(cx + side * 48, 7, zc);
          pier.castShadow = true;
          cityGroup.add(pier);
          addStrut(new THREE.Vector3(cx + side * 48, 14, zc), new THREE.Vector3(cx + side * 22, 25, zc));
        }
      }
      for (const [dx, dz] of [[-60, -60], [60, -60], [-60, 60], [60, 60]]) addBrazier(cx + dx, cz + dz);
    }
    addCathedral();

    // Blocks around the cathedral plaza: 84 m grid, 22 m streets, taller near the centre.
    const STEP = 84, EXCLUDE = 135;
    for (let x = -840; x <= 168; x += STEP) {
      for (let z = -588; z <= 588; z += STEP) {
        if (Math.abs(x - CATH.x) < EXCLUDE && Math.abs(z - CATH.z) < EXCLUDE) continue;
        const dist = Math.hypot(x - CATH.x, z - CATH.z);
        const w = 52 + rnd() * 10;
        const d = 52 + rnd() * 10;
        const h = 18 + rnd() * 36 + Math.max(0, 80 - dist * 0.12);
        const spireH = h > 62 && rnd() < 0.3 ? 22 + rnd() * 18 : 0;
        addTower(x, z, w, h, d, { spireH });
      }
    }

    // Particles run entirely on the GPU: mode 0 = rising embers, mode 1 = sea spray arcs.
    function makeParticles(count, fill, mode, color, size) {
      const positions = new Float32Array(count * 3);
      const seeds = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        positions.set(fill(i), i * 3);
        seeds[i] = rnd();
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geo.setAttribute("aSeed", new THREE.BufferAttribute(seeds, 1));
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: timeU,
          uPixel: pixelU,
          uMode: { value: mode },
          uSize: { value: size },
          uColor: { value: new THREE.Color(color) },
        },
        vertexShader: `
          attribute float aSeed;
          uniform float uTime;
          uniform float uPixel;
          uniform float uMode;
          uniform float uSize;
          varying float vLife;
          void main() {
            float t = fract(uTime * (0.10 + aSeed * 0.12) + aSeed);
            vec3 p = position;
            float life;
            if (uMode < 0.5) {
              p.y += t * 18.0;
              p.x += sin(uTime * 1.7 + aSeed * 50.0) * 1.4 * t;
              p.z += cos(uTime * 1.3 + aSeed * 37.0) * 1.4 * t;
              life = 1.0 - t;
            } else {
              p.y += sin(t * 3.14159) * 7.0;
              p.z += (t - 0.5) * 5.0;
              life = sin(t * 3.14159);
            }
            vLife = life;
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_Position = projectionMatrix * mv;
            gl_PointSize = uSize * uPixel * life * (300.0 / -mv.z);
          }`,
        fragmentShader: `
          uniform vec3 uColor;
          varying float vLife;
          void main() {
            float d = length(gl_PointCoord - vec2(0.5));
            float a = smoothstep(0.5, 0.0, d) * vLife;
            if (a < 0.01) discard;
            gl_FragColor = vec4(uColor * a, a);
          }`,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const points = new THREE.Points(geo, mat);
      points.frustumCulled = false;
      scene.add(points);
      return points;
    }
    makeParticles(900, (i) => {
      const b = brazierPositions[i % brazierPositions.length];
      return [b.x + (rnd() - 0.5) * 2.4, b.y, b.z + (rnd() - 0.5) * 2.4];
    }, 0, 0xffa24d, 2.4);
    makeParticles(700, () => [300 + rnd() * 8, 0.2, (rnd() - 0.5) * 1200], 1, 0xdff4ff, 1.8);

    // Camera: a cinematic loop outside the city, or free roam inside it (dragging takes over).
    const tourCurve = new THREE.CatmullRomCurve3(
      Array.from({ length: 16 }, (_, i) => {
        const a = (i / 16) * Math.PI * 2;
        return new THREE.Vector3(-330 + 760 * Math.cos(a), 70 + 30 * Math.sin(2 * a), 690 * Math.sin(a));
      }),
      true,
      "centripetal"
    );
    const tourTarget = new THREE.Vector3(CATH.x, 40, CATH.z);
    let tourU = 0;
    let mode = "tour";
    let yaw = 0;
    let pitch = 0;

    const modeBtn = document.getElementById("modeBtn");
    const timeBtn = document.getElementById("timeBtn");
    const statsEl = document.getElementById("stats");

    function setMode(next) {
      if (next === "roam") {
        const e = new THREE.Euler().setFromQuaternion(camera.quaternion, "YXZ");
        yaw = e.y;
        pitch = e.x;
      }
      mode = next;
      modeBtn.textContent = mode === "tour" ? "模式：自动巡游" : "模式：自由漫游";
    }
    function cycleTime() {
      phase = (phase + 1) % PALETTES.length;
      timeBtn.textContent = "时段：" + PALETTES[phase].name;
    }
    modeBtn.addEventListener("click", () => setMode(mode === "tour" ? "roam" : "tour"));
    timeBtn.addEventListener("click", cycleTime);

    const keys = new Set();
    window.addEventListener("keydown", (e) => {
      keys.add(e.code);
      if (e.repeat) return;
      if (e.code === "KeyT") setMode(mode === "tour" ? "roam" : "tour");
      if (e.code === "KeyN") cycleTime();
    });
    window.addEventListener("keyup", (e) => keys.delete(e.code));
    window.addEventListener("blur", () => keys.clear());

    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    canvas.addEventListener("pointerdown", (e) => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      if (mode === "tour") setMode("roam");
      yaw -= dx * 0.0035;
      pitch = THREE.MathUtils.clamp(pitch - dy * 0.0035, -1.3, 1.3);
    });
    const endDrag = () => {
      dragging = false;
    };
    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);

    const move = new THREE.Vector3();
    function updateRoam(dt) {
      camera.rotation.order = "YXZ";
      camera.rotation.set(pitch, yaw, 0);
      move.set(0, 0, 0);
      if (keys.has("KeyW") || keys.has("ArrowUp")) move.z -= 1;
      if (keys.has("KeyS") || keys.has("ArrowDown")) move.z += 1;
      if (keys.has("KeyA") || keys.has("ArrowLeft")) move.x -= 1;
      if (keys.has("KeyD") || keys.has("ArrowRight")) move.x += 1;
      if (keys.has("KeyE")) move.y += 1;
      if (keys.has("KeyQ")) move.y -= 1;
      if (move.lengthSq() === 0) return;
      move.normalize();
      const speed = (keys.has("ShiftLeft") || keys.has("ShiftRight") ? 60 : 18) * dt;
      const s = Math.sin(yaw);
      const c = Math.cos(yaw);
      camera.position.x += (c * move.x + s * move.z) * speed;
      camera.position.z += (-s * move.x + c * move.z) * speed;
      camera.position.y += move.y * speed;
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, -1000, 1450);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, -760, 760);
      camera.position.y = THREE.MathUtils.clamp(camera.position.y, 1.7, 320);
    }

    function updateTour(dt) {
      tourU = (tourU + dt * 0.014) % 1;
      camera.position.copy(tourCurve.getPointAt(tourU));
      camera.lookAt(tourTarget);
    }

    // Smoothly blend sky, fog, sun and window glow toward the selected palette.
    function stepPalette(dt) {
      const p = PALETTES[phase];
      const k = 1 - Math.exp(-dt * 1.2);
      look.sky.lerp(tint.setHex(p.sky), k);
      look.horizon.lerp(tint.setHex(p.horizon), k);
      look.fog.lerp(tint.setHex(p.fog), k);
      look.sun.lerp(tint.setHex(p.sun), k);
      look.sunI += (p.sunI - look.sunI) * k;
      look.hemi += (p.hemi - look.hemi) * k;
      look.night += (p.night - look.night) * k;
      skyMat.uniforms.top.value.copy(look.sky);
      skyMat.uniforms.horizon.value.copy(look.horizon);
      scene.fog.color.copy(look.fog);
      sun.color.copy(look.sun);
      sun.intensity = look.sunI;
      hemi.intensity = look.hemi;
      const glow = look.night * 1.6;
      for (const m of windowMats) m.emissiveIntensity = glow;
    }

    window.addEventListener("resize", () => {
      pixelU.value = Math.min(window.devicePixelRatio || 1, 2);
      renderer.setPixelRatio(pixelU.value);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight, false);
    });

    const clock = new THREE.Clock();
    let frames = 0;
    let elapsed = 0;
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      timeU.value += dt;
      animateSea(timeU.value);
      stepPalette(dt);
      if (mode === "tour") updateTour(dt);
      else updateRoam(dt);
      sky.position.copy(camera.position);
      renderer.render(scene, camera);
      frames += 1;
      elapsed += dt;
      if (elapsed >= 1) {
        statsEl.textContent = "FPS " + Math.round(frames / elapsed) + " · " + (mode === "tour" ? "自动巡游" : "自由漫游") + " · " + PALETTES[phase].name;
        frames = 0;
        elapsed = 0;
      }
    });
  </script>
</body>
</html>
