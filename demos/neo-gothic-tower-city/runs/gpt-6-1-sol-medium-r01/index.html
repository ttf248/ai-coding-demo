<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Aurelis · 新哥特式海上塔城</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #07121c;
        color: #e9e5d9;
        font-family: Georgia, "Microsoft YaHei", serif;
        overflow: hidden;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      header {
        position: absolute;
        top: 30px;
        left: 36px;
        pointer-events: none;
      }
      header p {
        font: 10px sans-serif;
        letter-spacing: 4px;
        color: #c3ab74;
      }
      h1 {
        font-size: 46px;
        font-weight: 400;
        margin: 12px 0;
      }
      .subtitle {
        font: 12px sans-serif;
        color: #a7b5bf;
        line-height: 1.7;
      }
      .panel {
        position: absolute;
        right: 30px;
        top: 30px;
        padding: 16px;
        border: 1px solid #d2b57933;
        border-radius: 14px;
        background: #07121cc9;
        backdrop-filter: blur(12px);
        max-width: 260px;
      }
      button {
        font: 12px sans-serif;
        padding: 10px 14px;
        background: #d2b57912;
        border: 1px solid #d2b57940;
        border-radius: 7px;
        color: #e8d9ad;
        cursor: pointer;
      }
      button:hover,
      button[aria-pressed="true"] {
        background: #c4a45a;
        color: #111;
      }
      button:focus-visible {
        outline: 2px solid white;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .label {
        font: 10px sans-serif;
        letter-spacing: 2px;
        color: #8297a5;
        margin: 0 0 10px;
      }
      .bottom {
        position: absolute;
        bottom: 24px;
        left: 36px;
        right: 36px;
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        pointer-events: none;
      }
      .bottom p {
        font: 11px sans-serif;
        line-height: 1.8;
        color: #a0b1bd;
        margin: 0;
      }
      .bottom strong {
        color: #d9bd7d;
        font-weight: 400;
      }
      #status {
        font: 11px sans-serif;
        color: #cfb67e;
        max-width: 300px;
      }
      #walk-pad {
        display: none;
        position: absolute;
        bottom: 95px;
        right: 20px;
        grid-template-columns: repeat(3, 42px);
        gap: 5px;
      }
      #walk-pad button {
        height: 40px;
        padding: 0;
        background: #07121cc9;
      }
      #walk-pad .up {
        grid-column: 2;
      }
      #walk-pad .row {
        grid-row: 2;
      }
      #error {
        position: absolute;
        inset: 40% 15%;
        font: 16px sans-serif;
        text-align: center;
        color: #dccb9d;
      }
      #error:empty {
        display: none;
      }
      @media (max-width: 600px) {
        header {
          left: 20px;
          top: 20px;
        }
        h1 {
          font-size: 32px;
        }
        .subtitle {
          font-size: 10px;
          max-width: 180px;
        }
        .panel {
          top: auto;
          bottom: 110px;
          right: auto;
          left: 20px;
          padding: 12px;
          max-width: calc(100vw - 40px);
        }
        .bottom {
          left: 20px;
          right: 20px;
          bottom: 20px;
        }
        .bottom p {
          font-size: 10px;
        }
        .bottom .technical {
          display: none;
        }
        #walk-pad {
          bottom: 260px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <p>AN EXPLORATION IN NEO-GOTHIC</p>
      <h1>A U R E L I S</h1>
      <div class="subtitle">
        暮潮之上，尖塔之间。<br />一座以米为尺度的原创新哥特式海港城市。
      </div>
    </header>
    <aside class="panel">
      <p class="label">EXPLORE THE CITY</p>
      <div class="buttons">
        <button id="tour" aria-pressed="true">自动巡游</button
        ><button id="walk" aria-pressed="false">街道漫步</button
        ><button id="time">切换昼夜</button><button id="harbor">港口</button
        ><button id="cathedral">大教堂</button>
      </div>
      <p id="status" role="status">正在建造塔城…</p>
    </aside>
    <div id="walk-pad">
      <button class="up" data-key="KeyW" aria-label="前进">↑</button
      ><button class="row" data-key="KeyA" aria-label="向左">←</button
      ><button class="row" data-key="KeyS" aria-label="后退">↓</button
      ><button class="row" data-key="KeyD" aria-label="向右">→</button>
    </div>
    <div class="bottom">
      <p>
        <strong>01 / THE TIDAL CITADEL</strong><br />拖拽环视 · 滚轮缩放 ·
        漫步时 WASD / 方向键移动<br />1 单位 = 1 米 · 建筑 24–115 米 · 人眼 1.7
        米
      </p>
      <p class="technical">
        PROCEDURAL GEOMETRY / ANIMATED SEA<br />无贴图素材 · Three.js r160 ·
        原创城市，非测绘复原
      </p>
    </div>
    <div id="error" role="alert"></div>
    <script
      src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"
      onerror="
        document.getElementById('error').textContent =
          '待确认：Three.js CDN 无法加载，请联网后重试。'
      "
    ></script>
    <script>
      (() => {
        if (!window.THREE) return;
        let renderer;
        try {
          renderer = new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: "high-performance",
          });
        } catch {
          document.getElementById("error").textContent =
            "待确认：当前环境无法创建 WebGL。";
          return;
        }
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.prepend(renderer.domElement);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color("#112538");
        scene.fog = new THREE.FogExp2("#112538", 0.0019);
        const camera = new THREE.PerspectiveCamera(
            52,
            innerWidth / innerHeight,
            0.1,
            1800,
          ),
          clock = new THREE.Clock();
        const hemi = new THREE.HemisphereLight("#9bbdd0", "#263038", 1.4);
        scene.add(hemi);
        const sun = new THREE.DirectionalLight("#f3c990", 2.2);
        sun.position.set(-100, 170, 60);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        Object.assign(sun.shadow.camera, {
          left: -155,
          right: 155,
          top: 155,
          bottom: -155,
          near: 1,
          far: 500,
        });
        sun.shadow.bias = -0.0006;
        scene.add(sun);
        const stone = new THREE.MeshStandardMaterial({
            color: "#7f8c8b",
            roughness: 0.82,
          }),
          dark = new THREE.MeshStandardMaterial({
            color: "#34444a",
            roughness: 0.7,
          }),
          roof = new THREE.MeshStandardMaterial({
            color: "#25464e",
            roughness: 0.55,
            metalness: 0.3,
          }),
          gold = new THREE.MeshStandardMaterial({
            color: "#c3a86c",
            roughness: 0.4,
            metalness: 0.6,
          }),
          windowMat = new THREE.MeshStandardMaterial({
            color: "#efd9a0",
            emissive: "#e5aa43",
            emissiveIntensity: 1.3,
          }),
          road = new THREE.MeshStandardMaterial({
            color: "#777772",
            roughness: 0.9,
          });
        const boxGeo = new THREE.BoxGeometry(1, 1, 1),
          colliders = [];
        function box(x, y, z, w, h, d, mat = stone, parent = scene) {
          const m = new THREE.Mesh(boxGeo, mat);
          m.position.set(x, y, z);
          m.scale.set(w, h, d);
          m.castShadow = true;
          m.receiveShadow = true;
          parent.add(m);
          return m;
        }
        function cone(x, y, z, r, h, mat = roof, parent = scene) {
          const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 8), mat);
          m.position.set(x, y, z);
          m.castShadow = true;
          parent.add(m);
          return m;
        }
        box(0, 1, 0, 190, 8, 160, dark);
        box(0, 5.05, 0, 188, 0.2, 158, road);
        for (let i = -90; i <= 90; i += 6) {
          box(i, 6, -79, 0.45, 2, 0.7, gold);
          box(i, 6, 79, 0.45, 2, 0.7, gold);
        }
        for (let z = -72; z <= 72; z += 6) {
          box(-94, 6, z, 0.7, 2, 0.45, gold);
          box(94, 6, z, 0.7, 2, 0.45, gold);
        }
        // A broad cross-shaped public street keeps walking routes clear.
        box(0, 5.2, 0, 16, 0.25, 156, dark);
        box(0, 5.2, 0, 188, 0.25, 14, dark);
        for (let x = -84; x < 90; x += 4) {
          box(x, 5.4, 7.2, 1, 0.16, 0.35, gold);
          box(x, 5.4, -7.2, 1, 0.16, 0.35, gold);
        }
        const windows = [];
        const arch = new THREE.Shape();
        arch.moveTo(-0.7, 0);
        arch.lineTo(-0.7, 2.1);
        arch.quadraticCurveTo(-0.65, 3.2, 0, 3.8);
        arch.quadraticCurveTo(0.65, 3.2, 0.7, 2.1);
        arch.lineTo(0.7, 0);
        const archGeo = new THREE.ShapeGeometry(arch);
        function tower(x, z, h, w, d) {
          const g = new THREE.Group();
          g.position.set(x, 5.25, z);
          scene.add(g);
          box(0, h / 2, 0, w, h, d, stone, g);
          colliders.push({ x, z, w: w + 2, d: d + 2 });
          box(0, h * 0.33, 0, w + 1, 0.8, d + 1, dark, g);
          box(0, h * 0.68, 0, w + 1, 0.8, d + 1, dark, g);
          box(0, h, 0, w + 1, 1, d + 1, dark, g);
          cone(0, h + w * 0.68, 0, w * 0.72, w * 1.35, roof, g);
          cone(0, h + w * 1.42, 0, 0.55, 3.5, gold, g);
          for (const sx of [-1, 1])
            for (const sz of [-1, 1]) {
              box(
                sx * (w / 2 - 0.3),
                h * 0.51,
                sz * (d / 2 - 0.3),
                1.4,
                h + 2,
                1.4,
                dark,
                g,
              );
              cone(
                sx * (w / 2 - 0.3),
                h + 4.5,
                sz * (d / 2 - 0.3),
                1.8,
                8,
                roof,
                g,
              );
            }
          for (let y = 4; y < h - 3; y += 6)
            for (let a = -w / 2 + 2.5; a < w / 2 - 1; a += 3.5) {
              const mesh = new THREE.Mesh(archGeo, windowMat);
              mesh.position.set(a, y, d / 2 + 0.025);
              g.add(mesh);
              const back = mesh.clone();
              back.rotation.y = Math.PI;
              back.position.z = -d / 2 - 0.025;
              g.add(back);
            }
          for (let y = 5; y < h - 3; y += 7)
            for (let b = -d / 2 + 2; b < d / 2 - 1; b += 4) {
              windows.push(
                {
                  x: x + w / 2 + 0.03,
                  y: 5.25 + y,
                  z: z + b,
                  angle: Math.PI / 2,
                },
                {
                  x: x - w / 2 - 0.03,
                  y: 5.25 + y,
                  z: z + b,
                  angle: -Math.PI / 2,
                },
              );
            }
          for (const sx of [-1, 1]) {
            box(sx * (w / 2 + 1), 7, 0, 2, 14, d * 0.75, dark, g);
            const brace = box(sx * (w / 2 + 2), 13, 0, 1.8, 12, 1.6, stone, g);
            brace.rotation.z = -sx * 0.28;
          }
        }
        for (let iz = 0; iz < 4; iz++)
          for (let ix = 0; ix < 6; ix++) {
            const x = -75 + ix * 30,
              z = -56 + iz * 37;
            if (Math.abs(x) < 20 && z > 10) continue;
            tower(
              x,
              z,
              25 + ((ix * 17 + iz * 13) % 55),
              15 + (ix % 2) * 4,
              15 + (iz % 2) * 3,
            );
          }
        // Cathedral nave, choir and paired bell towers use the same metric proportions.
        tower(-14, 35, 92, 18, 19);
        tower(14, 35, 105, 18, 19);
        box(0, 23, 53, 25, 35, 34, stone);
        cone(0, 48, 53, 19, 18, roof);
        box(0, 12, 36, 7, 14, 1, dark);
        const roseWindow = new THREE.Mesh(
          new THREE.CircleGeometry(4, 16),
          windowMat,
        );
        roseWindow.position.set(0, 32, 35.8);
        scene.add(roseWindow);
        for (let i = 0; i < 8; i++) {
          const a = (i * Math.PI) / 4;
          const spoke = box(
            Math.sin(a) * 1.9,
            32 + Math.cos(a) * 1.9,
            35.9,
            0.3,
            8,
            0.3,
            gold,
          );
          spoke.rotation.z = -a;
        }
        const dummy = new THREE.Object3D(),
          inst = new THREE.InstancedMesh(boxGeo, windowMat, windows.length);
        windows.forEach((p, i) => {
          dummy.position.set(p.x, p.y, p.z);
          dummy.rotation.set(0, p.angle, 0);
          dummy.scale.set(1.1, 2.8, 0.06);
          dummy.updateMatrix();
          inst.setMatrixAt(i, dummy.matrix);
        });
        scene.add(inst);
        // Quays, bridges and modest human figures establish a readable sense of scale.
        box(0, 4.5, -104, 17, 1, 50, stone);
        for (let i = 0; i < 4; i++) {
          box(-55 + i * 35, 2.8, -91, 20, 1, 22, dark);
          box(-55 + i * 35, 1, -93, 1, 5, 1, stone);
        }
        for (let i = 0; i < 22; i++) {
          const x = (i % 2 ? 1 : -1) * (4 + (i % 3)),
            z = -70 + i * 6.2;
          box(x, 6.2, z, 0.5, 1.2, 0.4, dark);
          const head = new THREE.Mesh(
            new THREE.SphereGeometry(0.2, 6, 4),
            gold,
          );
          head.position.set(x, 7, z);
          scene.add(head);
        }
        const seaUniforms = { time: { value: 0 }, night: { value: 0 } };
        const water = new THREE.Mesh(
          new THREE.PlaneGeometry(1600, 1600, 120, 120),
          new THREE.ShaderMaterial({
            uniforms: seaUniforms,
            vertexShader:
              "uniform float time; varying vec3 v; void main(){vec3 p=position;p.z=sin(p.x*.035+time*.7)*.8+sin(p.y*.05-time*.4)*.6;v=p;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}",
            fragmentShader:
              "uniform float time; uniform float night;varying vec3 v;void main(){float w=sin(v.x*.065+v.y*.09+time)*.5+.5;vec3 c=mix(vec3(.06,.19,.24),vec3(.18,.34,.38),w);float glint=pow(max(0.,sin(v.x*.016+time*.2)*cos(v.y*.019)),18.);c+=vec3(.7,.51,.25)*glint*.4;gl_FragColor=vec4(c*(1.-night*.5),1.);}",
          }),
        );
        water.rotation.x = -Math.PI / 2;
        water.position.y = -0.4;
        scene.add(water);
        const fires = [];
        for (let i = -1; i <= 1; i += 2)
          for (let j = -1; j <= 1; j += 2) {
            const x = i * 9,
              z = j * 67;
            box(x, 6.3, z, 0.6, 2, 0.6, gold);
            const light = new THREE.PointLight("#ffaa42", 75, 23, 2);
            light.position.set(x, 8, z);
            scene.add(light);
            fires.push(light);
          }
        const sparkPos = new Float32Array(260 * 3),
          sparkSeed = [];
        for (let i = 0; i < 260; i++) {
          sparkSeed.push([Math.random(), Math.random(), Math.random()]);
        }
        const sparkGeo = new THREE.BufferGeometry();
        sparkGeo.setAttribute(
          "position",
          new THREE.BufferAttribute(sparkPos, 3),
        );
        const sparks = new THREE.Points(
          sparkGeo,
          new THREE.ShaderMaterial({
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexShader:
              "void main(){vec4 p=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*p;gl_PointSize=min(8.,100./-p.z);}",
            fragmentShader:
              "void main(){float a=1.-smoothstep(.05,.5,length(gl_PointCoord-.5));gl_FragColor=vec4(1.,.51,.15,a*.8);}",
          }),
        );
        scene.add(sparks);
        let yaw = 0.7,
          pitch = 0.37,
          radius = 230,
          target = new THREE.Vector3(0, 27, 0),
          tour = true,
          walk = false,
          night = false,
          elapsed = 0;
        const walkPos = new THREE.Vector3(0, 6.95, -65),
          keys = new Set();
        const status = document.getElementById("status");
        function mode(isWalk) {
          walk = isWalk;
          tour = !isWalk;
          document.getElementById("walk-pad").style.display = isWalk
            ? "grid"
            : "none";
          document
            .getElementById("walk")
            .setAttribute("aria-pressed", String(walk));
          document
            .getElementById("tour")
            .setAttribute("aria-pressed", String(tour));
          if (walk) {
            yaw = 0;
            pitch = 0;
          }
          status.textContent = walk
            ? "街道漫步 · WASD / 方向键 · 拖拽转头"
            : "自动巡游 · 拖拽可接管镜头";
        }
        document.getElementById("walk").onclick = () => mode(!walk);
        document.getElementById("tour").onclick = () => {
          mode(false);
          tour = true;
        };
        document.getElementById("time").onclick = () => {
          night = !night;
          const c = night ? "#07121f" : "#112538";
          scene.background.set(c);
          scene.fog.color.set(c);
          sun.intensity = night ? 0.5 : 2.2;
          hemi.intensity = night ? 1.15 : 1.4;
          windowMat.emissiveIntensity = night ? 1.6 : 1.3;
          seaUniforms.night.value = night ? 1 : 0;
        };
        function landmark(z) {
          mode(false);
          tour = false;
          target.set(0, z === 35 ? 35 : 5, z);
          yaw = Math.PI;
          pitch = 0.15;
          radius = z === 35 ? 110 : 90;
        }
        document.getElementById("harbor").onclick = () => landmark(-85);
        document.getElementById("cathedral").onclick = () => landmark(35);
        let drag = null;
        renderer.domElement.addEventListener("pointerdown", (e) => {
          drag = { x: e.clientX, y: e.clientY };
          renderer.domElement.setPointerCapture(e.pointerId);
          tour = false;
        });
        renderer.domElement.addEventListener("pointermove", (e) => {
          if (!drag) return;
          yaw -= (e.clientX - drag.x) * 0.005;
          pitch = THREE.MathUtils.clamp(
            pitch + (e.clientY - drag.y) * 0.003,
            walk ? -0.7 : 0.05,
            walk ? 0.7 : 1.2,
          );
          drag = { x: e.clientX, y: e.clientY };
        });
        renderer.domElement.addEventListener("pointerup", () => (drag = null));
        renderer.domElement.addEventListener(
          "pointercancel",
          () => (drag = null),
        );
        renderer.domElement.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            radius = THREE.MathUtils.clamp(radius + e.deltaY * 0.12, 55, 430);
          },
          { passive: false },
        );
        window.addEventListener("keydown", (e) => {
          if (e.target.tagName === "BUTTON") return;
          if (
            e.code.startsWith("Arrow") ||
            ["KeyW", "KeyA", "KeyS", "KeyD"].includes(e.code)
          ) {
            e.preventDefault();
            keys.add(e.code);
          }
        });
        window.addEventListener("keyup", (e) => keys.delete(e.code));
        window.addEventListener("blur", () => {
          keys.clear();
          drag = null;
        });
        document.querySelectorAll("[data-key]").forEach((b) => {
          b.onpointerdown = (e) => {
            b.setPointerCapture(e.pointerId);
            keys.add(b.dataset.key);
          };
          b.onpointerup = b.onpointercancel = () => keys.delete(b.dataset.key);
        });
        function blocked(x, z) {
          return (
            Math.abs(x) > 91 ||
            z > 75 ||
            z < -124 ||
            (z < -79 && Math.abs(x) > 7) ||
            colliders.some(
              (b) =>
                Math.abs(x - b.x) < b.w / 2 + 0.5 &&
                Math.abs(z - b.z) < b.d / 2 + 0.5,
            ) ||
            (Math.abs(x) < 13 && z > 37 && z < 72)
          );
        }
        function animate() {
          requestAnimationFrame(animate);
          const dt = Math.min(clock.getDelta(), 0.05);
          elapsed += dt;
          seaUniforms.time.value = elapsed;
          if (tour) yaw += dt * 0.065;
          if (walk) {
            const forward =
                (keys.has("KeyW") || keys.has("ArrowUp") ? 1 : 0) -
                (keys.has("KeyS") || keys.has("ArrowDown") ? 1 : 0),
              side =
                (keys.has("KeyD") || keys.has("ArrowRight") ? 1 : 0) -
                (keys.has("KeyA") || keys.has("ArrowLeft") ? 1 : 0);
            const len = Math.hypot(forward, side) || 1;
            const nx =
                walkPos.x +
                ((Math.sin(yaw) * forward + Math.cos(yaw) * side) * dt * 5) /
                  len,
              nz =
                walkPos.z +
                ((Math.cos(yaw) * forward - Math.sin(yaw) * side) * dt * 5) /
                  len;
            if (!blocked(nx, walkPos.z)) walkPos.x = nx;
            if (!blocked(walkPos.x, nz)) walkPos.z = nz;
            camera.position.copy(walkPos);
            camera.lookAt(
              walkPos.x + Math.sin(yaw) * 10,
              walkPos.y - pitch * 10,
              walkPos.z + Math.cos(yaw) * 10,
            );
          } else {
            camera.position.set(
              target.x + Math.sin(yaw) * Math.cos(pitch) * radius,
              target.y + Math.sin(pitch) * radius,
              target.z + Math.cos(yaw) * Math.cos(pitch) * radius,
            );
            camera.lookAt(target);
          }
          for (let i = 0; i < 260; i++) {
            const seed = sparkSeed[i],
              f = fires[i % 4],
              a = (elapsed * 0.45 + seed[0]) % 1;
            sparkPos[i * 3] =
              f.position.x + Math.sin(seed[1] * 6 + elapsed) * a;
            sparkPos[i * 3 + 1] = 7.5 + a * 3;
            sparkPos[i * 3 + 2] =
              f.position.z + Math.cos(seed[2] * 6 + elapsed) * a;
          }
          sparkGeo.attributes.position.needsUpdate = true;
          fires.forEach(
            (f, i) => (f.intensity = 65 + Math.sin(elapsed * 7 + i) * 12),
          );
          renderer.render(scene, camera);
        }
        mode(false);
        animate();
        window.addEventListener("resize", () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
        });
        window.addEventListener("pagehide", () => renderer.dispose());
      })();
    </script>
  </body>
</html>
