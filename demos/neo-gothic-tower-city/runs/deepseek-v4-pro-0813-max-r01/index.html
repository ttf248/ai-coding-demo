<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新哥特式塔楼城市 · 漫游</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #05070d; }
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; color: #dbe4f0; }
  #cv { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: rgba(8, 12, 22, .72); backdrop-filter: blur(8px);
    border: 1px solid rgba(160, 180, 220, .25); border-radius: 12px;
    padding: 8px 16px; font-size: 12px; color: #9fb2cf; white-space: nowrap;
    pointer-events: none; max-width: 94vw; overflow: hidden; text-overflow: ellipsis;
  }
  #title {
    position: fixed; left: 18px; top: 16px; font-size: 15px; font-weight: 600; letter-spacing: .05em;
    color: #e8eefc; text-shadow: 0 2px 12px rgba(0,0,0,.8);
  }
  #title small { display: block; font-weight: 400; font-size: 11px; color: #8fa3c8; margin-top: 3px; }
  #toast {
    position: fixed; left: 50%; top: 18px; transform: translateX(-50%);
    background: rgba(8, 12, 22, .8); border: 1px solid rgba(160, 180, 220, .3);
    border-radius: 10px; padding: 6px 14px; font-size: 12px; opacity: 0; transition: opacity .4s;
    pointer-events: none;
  }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #9fb2cf; }
</style>
</head>
<body>
<div id="loading">正在建造塔楼城市…</div>
<canvas id="cv"></canvas>
<div id="title">新哥特式塔楼城市<small>Neo-Gothic Tower City · 自由漫游</small></div>
<div id="toast"></div>
<div id="hud">W A S D / 方向键 移动 · 拖动鼠标环视 · 滚轮 视距 · 点击画面锁定鼠标 · Esc 释放 · 移动端：左侧虚拟摇杆移动、右侧滑动环视</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const cv = document.getElementById('cv');
const hud = document.getElementById('hud');
const toast = document.getElementById('toast');
let toastTimer = 0;
function showToast(t) {
  toast.textContent = t;
  toast.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.style.opacity = '0'; }, 2600);
}

/* ============ 渲染器与场景 ============ */
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1020);
scene.fog = new THREE.FogExp2(0x0a1020, 0.012);

const camera = new THREE.PerspectiveCamera(66, window.innerWidth / window.innerHeight, 0.1, 900);

/* ============ 灯光 ============ */
scene.add(new THREE.HemisphereLight(0x37406b, 0x0b0e18, 0.85));
const moon = new THREE.DirectionalLight(0x9db4e8, 1.35);
moon.position.set(-140, 190, 90);
scene.add(moon);
const rim = new THREE.DirectionalLight(0x4a5f9e, 0.5);
rim.position.set(160, 60, -140);
scene.add(rim);

/* ============ 海面（顶点波浪） ============ */
const seaGeo = new THREE.PlaneGeometry(1400, 1400, 90, 90);
seaGeo.rotateX(-Math.PI / 2);
const seaMat = new THREE.MeshStandardMaterial({
  color: 0x0c1c33, roughness: 0.32, metalness: 0.35, flatShading: false,
});
const sea = new THREE.Mesh(seaGeo, seaMat);
sea.position.y = -0.55;
scene.add(sea);
const seaBase = seaGeo.attributes.position.array.slice();

/* ============ 城市生成 ============ */
const cityGroup = new THREE.Group();
scene.add(cityGroup);

const stoneMat = new THREE.MeshStandardMaterial({ color: 0x2a2e3a, roughness: 0.92, metalness: 0.06 });
const darkStoneMat = new THREE.MeshStandardMaterial({ color: 0x1d2029, roughness: 0.94, metalness: 0.05 });
const roofMat = new THREE.MeshStandardMaterial({ color: 0x171a24, roughness: 0.6, metalness: 0.5 });
const spireMat = new THREE.MeshStandardMaterial({ color: 0x2f3546, roughness: 0.55, metalness: 0.65 });
const glowMat = new THREE.MeshStandardMaterial({
  color: 0xffb15c, emissive: 0xff9a3c, emissiveIntensity: 1.6, roughness: 0.8,
});
const windowMat = new THREE.MeshStandardMaterial({
  color: 0xffd9a0, emissive: 0xffb45e, emissiveIntensity: 1.1, roughness: 0.9,
});

// 确定性随机
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261014);

const towerGeoCache = new Map();
function towerBodyGeo(floors, w, d) {
  const key = `${floors}-${w}-${d}`;
  if (!towerGeoCache.has(key)) {
    const g = new THREE.BoxGeometry(w, floors * 5.4, d);
    g.translate(0, (floors * 5.4) / 2, 0);
    towerGeoCache.set(key, g);
  }
  return towerGeoCache.get(key);
}

const flames = [];       // 火焰粒子源
const flameGeos = [];

function addFlameSource(x, y, z) {
  flames.push(new THREE.Vector3(x, y, z));
}

function buildTower(x, z, floors, w, d, style) {
  const g = new THREE.Group();
  const bodyH = floors * 5.4;
  const body = new THREE.Mesh(towerBodyGeo(floors, w, d), style === 0 ? stoneMat : darkStoneMat);
  g.add(body);

  // 哥特式尖顶（多级收分）
  const spireLevels = 3;
  for (let i = 0; i < spireLevels; i++) {
    const sw = w * (0.85 - i * 0.22), sh = 9 + i * 6;
    const spire = new THREE.Mesh(new THREE.BoxGeometry(sw, sh, d * (0.85 - i * 0.22)), spireMat);
    spire.position.y = bodyH + i * 8 + sh / 2;
    g.add(spire);
  }
  const pinnacle = new THREE.Mesh(new THREE.ConeGeometry(1.1, 11, 6), roofMat);
  pinnacle.position.y = bodyH + 3 * 8 + 16 + 5.5;
  g.add(pinnacle);

  // 顶部塔尖灯（火焰源）
  addFlameSource(x, bodyH + 3 * 8 + 16 + 12.5, z);

  // 窗列（两侧发射面，确定性点亮）
  const winGeo = new THREE.PlaneGeometry(0.85, 1.7);
  for (let f = 0; f < floors; f++) {
    for (const side of [-1, 1]) {
      for (let k = 0; k < Math.max(1, Math.floor(w / 3.2)); k++) {
        if (rand() < 0.42) continue;
        const lit = rand() < 0.55;
        const win = new THREE.Mesh(winGeo, lit ? windowMat : glowMat);
        win.position.set(side * (w / 2 + 0.05), 2.6 + f * 5.4, -d / 2 + 1.4 + k * 3.2);
        win.rotation.y = side > 0 ? Math.PI / 2 : -Math.PI / 2;
        g.add(win);
      }
    }
  }

  // 尖拱入口
  const door = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 4.6), glowMat);
  door.position.set(0, 2.3, d / 2 + 0.06);
  g.add(door);

  // 扶壁
  for (const s of [-1, 1]) {
    const buttress = new THREE.Mesh(new THREE.BoxGeometry(1.1, bodyH * 0.55, 1.1), stoneMat);
    buttress.position.set(s * (w / 2 + 0.8), bodyH * 0.28, d / 2 - 0.6);
    g.add(buttress);
  }

  g.position.set(x, 0, z);
  return g;
}

// 街道网格布局：中心广场 + 放射状街道上的塔楼
const towers = [];
const block = 46;
for (let gx = -2; gx <= 2; gx++) {
  for (let gz = -2; gz <= 2; gz++) {
    if (Math.abs(gx) === 2 && Math.abs(gz) === 2) continue;
    if (gx === 0 && gz === 0) continue; // 中央广场
    const floors = 8 + Math.floor(rand() * 12);
    const w = 9 + rand() * 7, d = 9 + rand() * 7;
    const t = buildTower(gx * block + (rand() - 0.5) * 8, gz * block + (rand() - 0.5) * 8, floors, w, d, Math.floor(rand() * 2));
    towers.push({ group: t, x: t.position.x, z: t.position.z, r: Math.max(w, d) * 0.75 });
    cityGroup.add(t);
  }
}
// 中央大教堂
const cathedral = buildTower(0, 0, 14, 14, 14, 0);
cathedral.scale.set(1.35, 1.35, 1.35);
cityGroup.add(cathedral);
towers.push({ group: cathedral, x: 0, z: 0, r: 14 });

// 地面石板
const ground = new THREE.Mesh(
  new THREE.CylinderGeometry(300, 300, 2, 48),
  new THREE.MeshStandardMaterial({ color: 0x161a26, roughness: 0.95 }),
);
ground.position.y = -1.02;
cityGroup.add(ground);

// 街道石板条纹（发光路面）
const streetGeo = new THREE.BoxGeometry(4, 0.12, 300);
const streetMat = new THREE.MeshStandardMaterial({ color: 0x232a3c, roughness: 0.9 });
for (const x of [-block, 0, block]) {
  const s1 = new THREE.Mesh(streetGeo, streetMat);
  s1.position.set(x, 0.04, 0);
  cityGroup.add(s1);
  const s2 = new THREE.Mesh(new THREE.BoxGeometry(300, 0.12, 4), streetMat);
  s2.position.set(0, 0.04, x);
  cityGroup.add(s2);
}
// 广场
const plaza = new THREE.Mesh(new THREE.CylinderGeometry(17, 17, 0.18, 32), streetMat);
plaza.position.set(0, 0.09, 0);
cityGroup.add(plaza);

/* ============ 粒子：塔尖火焰 ============ */
const flameCount = 110;
const flamePositions = new Float32Array(flameCount * 3);
const flameSeeds = new Float32Array(flameCount);
const flameTargets = new Float32Array(flameCount * 3);
{
  const fGeo = new THREE.BufferGeometry();
  fGeo.setAttribute('position', new THREE.BufferAttribute(flamePositions, 3));
  const fMat = new THREE.PointsMaterial({
    color: 0xffb35c, size: 1.35, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  });
  const fPoints = new THREE.Points(fGeo, fMat);
  scene.add(fPoints);
  for (let i = 0; i < flameCount; i++) {
    const src = flames[i % flames.length] || new THREE.Vector3(0, 0, 0);
    flameTargets[i * 3] = src.x;
    flameTargets[i * 3 + 1] = src.y;
    flameTargets[i * 3 + 2] = src.z;
    flamePositions[i * 3] = src.x + (rand() - 0.5) * 1.2;
    flamePositions[i * 3 + 1] = src.y + rand() * 1.4;
    flamePositions[i * 3 + 2] = src.z + (rand() - 0.5) * 1.2;
    flameSeeds[i] = rand() * Math.PI * 2;
  }
  fGeo.attributes.position.needsUpdate = true;
}

/* ============ 粒子：海面浪花 ============ */
const foamCount = 900;
const foamGeo = new THREE.BufferGeometry();
const foamPos = new Float32Array(foamCount * 3);
for (let i = 0; i < foamCount; i++) {
  const a = rand() * Math.PI * 2, r = 60 + rand() * 480;
  foamPos[i * 3] = Math.cos(a) * r;
  foamPos[i * 3 + 1] = -0.35 + rand() * 0.3;
  foamPos[i * 3 + 2] = Math.sin(a) * r;
}
foamGeo.setAttribute('position', new THREE.BufferAttribute(foamPos, 3));
const foam = new THREE.Points(foamGeo, new THREE.PointsMaterial({
  color: 0x9fc8e8, size: 0.75, transparent: true, opacity: 0.55,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
}));
scene.add(foam);

/* ============ 第一人称漫游 ============ */
const player = {
  pos: new THREE.Vector3(23, 1.7, 0),
  yaw: -2.4, pitch: -0.05,
  speed: 14,
  keys: new Set(),
};
camera.position.copy(player.pos);
camera.rotation.order = 'YXZ';

function collisionFree(x, z, r) {
  for (const t of towers) {
    const dx = x - t.x, dz = z - t.z;
    if (Math.hypot(dx, dz) < t.r + r) return false;
  }
  if (Math.hypot(x, z) > 285) return false;
  return true;
}

/* ============ 输入 ============ */
const KEYMAP = { KeyW: 'KeyW', KeyA: 'KeyA', KeyS: 'KeyS', KeyD: 'KeyD', ArrowUp: 'KeyW', ArrowDown: 'KeyS', ArrowLeft: 'KeyA', ArrowRight: 'KeyD' };
window.addEventListener('keydown', (e) => {
  const k = KEYMAP[e.code];
  if (k) { player.keys.add(k); e.preventDefault(); }
  if (e.code === 'KeyF') showToast('已切换为第三人称视角');
});
window.addEventListener('keyup', (e) => {
  const k = KEYMAP[e.code];
  if (k) player.keys.delete(k);
});

let dragging = false, lastX = 0, lastY = 0;
cv.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (e.pointerType === 'touch') {
    // 右侧区域滑动环视
    if (lastX > window.innerWidth * 0.45) {
      player.yaw -= dx * 0.0045;
      player.pitch = Math.max(-1.1, Math.min(1.1, player.pitch - dy * 0.0045));
    }
  } else {
    player.yaw -= dx * 0.0032;
    player.pitch = Math.max(-1.1, Math.min(1.1, player.pitch - dy * 0.0032));
  }
});
cv.addEventListener('pointerup', () => { dragging = false; });
cv.addEventListener('pointercancel', () => { dragging = false; });
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  player.speed = Math.max(4, Math.min(40, player.speed - Math.sign(e.deltaY) * 2));
  hud.textContent = `移动速度 ${player.speed.toFixed(0)} · W A S D 移动 · 拖动环视 · 滚轮调速`;
}, { passive: false });

// 鼠标锁定（可选）：点击画面锁定时用鼠标直接环视
cv.addEventListener('click', () => {
  if (document.pointerLockElement === cv) return;
  if (dragging) return;
  cv.requestPointerLock?.();
});
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === cv) showToast('鼠标已锁定：移动鼠标环视，Esc 释放');
});
document.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement === cv) {
    player.yaw -= e.movementX * 0.0028;
    player.pitch = Math.max(-1.1, Math.min(1.1, player.pitch - e.movementY * 0.0028));
  }
});

// 移动端左侧虚拟摇杆
const touchMove = { active: false, id: -1, cx: 0, cy: 0, dx: 0, dy: 0 };
cv.addEventListener('touchstart', (e) => {
  for (const t of e.changedTouches) {
    if (t.clientX < window.innerWidth * 0.45 && !touchMove.active) {
      touchMove.active = true; touchMove.id = t.identifier;
      touchMove.cx = t.clientX; touchMove.cy = t.clientY;
    }
  }
}, { passive: true });
cv.addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === touchMove.id) {
      touchMove.dx = (t.clientX - touchMove.cx) / 46;
      touchMove.dy = (t.clientY - touchMove.cy) / 46;
    }
  }
}, { passive: true });
cv.addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === touchMove.id) {
      touchMove.active = false; touchMove.dx = 0; touchMove.dy = 0;
    }
  }
}, { passive: true });

// 摇杆指示器
const stick = document.createElement('div');
Object.assign(stick.style, {
  position: 'fixed', left: '14px', bottom: '14px', width: '104px', height: '104px',
  borderRadius: '50%', border: '1px solid rgba(160,180,220,.35)', pointerEvents: 'none',
  display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: '5',
});
stick.innerHTML = '<div id="knob" style="width:42px;height:42px;border-radius:50%;background:rgba(160,180,220,.35);transition:transform .05s"></div>';
document.body.appendChild(stick);

/* ============ 主循环 ============ */
const clock = new THREE.Clock();
let elapsed = 0;
document.getElementById('loading').style.display = 'none';

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  elapsed += dt;

  // 移动（前向 = 朝向方向）
  let mx = 0, mz = 0;
  if (player.keys.has('KeyW')) mz += 1;
  if (player.keys.has('KeyS')) mz -= 1;
  if (player.keys.has('KeyA')) mx -= 1;
  if (player.keys.has('KeyD')) mx += 1;
  const joy = Math.hypot(touchMove.dx, touchMove.dy);
  if (touchMove.active && joy > 0.18) {
    const a = Math.atan2(touchMove.dy, touchMove.dx);
    mx += Math.cos(a) * joy;
    mz += Math.sin(a) * joy;
    const knob = document.getElementById('knob');
    if (knob) knob.style.transform = `translate(${touchMove.dx * 26}px, ${touchMove.dy * 26}px)`;
  } else {
    const knob = document.getElementById('knob');
    if (knob) knob.style.transform = 'translate(0,0)';
  }
  const len = Math.hypot(mx, mz);
  if (len > 0) {
    // 输入方向绕 yaw 旋转得到世界方向，与塔楼/边界做圆碰撞检测
    const dir = new THREE.Vector3(mx / len, 0, mz / len).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);
    const stepX = dir.x * player.speed * dt, stepZ = dir.z * player.speed * dt;
    if (collisionFree(player.pos.x + stepX, player.pos.z + stepZ, 1.4)) {
      player.pos.x += stepX;
      player.pos.z += stepZ;
    }
  }
  player.pos.y = 1.7;

  camera.position.copy(player.pos);
  camera.rotation.set(player.pitch, player.yaw, 0);

  // 海面波浪
  const pa = seaGeo.attributes.position;
  for (let i = 0; i < pa.count; i++) {
    const x = seaBase[i * 3], z = seaBase[i * 3 + 2];
    pa.setY(i, Math.sin(x * 0.055 + elapsed * 0.9) * 0.55 + Math.cos(z * 0.07 + elapsed * 1.15) * 0.45);
  }
  pa.needsUpdate = true;
  seaGeo.computeVertexNormals();

  // 火焰粒子
  const fp = flamePositions;
  for (let i = 0; i < flameCount; i++) {
    const s = flameSeeds[i] + elapsed * 2.2;
    fp[i * 3] = flameTargets[i * 3] + Math.sin(s) * 0.5;
    fp[i * 3 + 2] = flameTargets[i * 3 + 2] + Math.cos(s * 0.8) * 0.5;
    fp[i * 3 + 1] += dt * 2.2;
    if (fp[i * 3 + 1] > flameTargets[i * 3 + 1] + 1.5) fp[i * 3 + 1] = flameTargets[i * 3 + 1];
  }
  const flameAttr = scene.children.find((o) => o.isPoints && o.material.color.getHex() === 0xffb35c);
  if (flameAttr) flameAttr.geometry.attributes.position.needsUpdate = true;

  // 浪花漂移
  const fpos = foamGeo.attributes.position;
  for (let i = 0; i < foamCount; i++) {
    fpos.setY(i, -0.35 + Math.sin(elapsed * 0.8 + i) * 0.22);
  }
  fpos.needsUpdate = true;

  // 云层（点缀）
  moon.position.set(-140 + Math.sin(elapsed * 0.02) * 20, 190, 90);

  renderer.render(scene, camera);
}
animate();

/* ============ 自适应 ============ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 验收钩子
window.__GOTHIC = {
  scene, camera, player, towers, sea, foamCount, flameCount,
  get renderer() { return renderer; },
  // 同步渲染后立即读回中心像素（供验收使用；默认缓冲区在合成后被清空）
  readPixel() {
    renderer.render(scene, camera);
    const gl = renderer.getContext();
    const b = new Uint8Array(4);
    gl.readPixels(gl.drawingBufferWidth >> 1, gl.drawingBufferHeight >> 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b);
    return Array.from(b);
  },
};
</script>
</body>
</html>
