(()=>{const $=s=>document.querySelector(s);const state=$('#loadState'),fallback=$('#fallback'),sceneRoot=document.querySelector('#scene');if(!window.THREE){state.textContent='待确认 · Three.js CDN 不可用';fallback.style.display='block';fallback.textContent='待确认：Three.js 资源未加载。请联网后重新打开页面。';return}const THREE=window.THREE;let scene=new THREE.Scene(),fog=new THREE.FogExp2(0x101d2a,.0065),camera=new THREE.PerspectiveCamera(54,innerWidth/innerHeight,.1,1200),renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;sceneRoot.appendChild(renderer.domElement);scene.background=new THREE.Color(0x192939);scene.fog=fog;const ambient=new THREE.HemisphereLight(0x9baab0,0x15151d,1.4);scene.add(ambient);const moon=new THREE.DirectionalLight(0xd7e0ee,2.2);moon.position.set(-45,90,35);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);scene.add(moon);const warm=new THREE.PointLight(0xffa65f,32,95,2);warm.position.set(10,8,15);scene.add(warm);const mats={stone:new THREE.MeshStandardMaterial({color:0x646c70,roughness:.9}),dark:new THREE.MeshStandardMaterial({color:0x3a4248,roughness:.82}),roof:new THREE.MeshStandardMaterial({color:0x263c47,roughness:.76}),roof2:new THREE.MeshStandardMaterial({color:0x39434a,roughness:.78}),window:new THREE.MeshStandardMaterial({color:0xffc878,emissive:0xffa64c,emissiveIntensity:2.8}),water:new THREE.MeshStandardMaterial({color:0x102c3c,roughness:.25,metalness:.45}),ground:new THREE.MeshStandardMaterial({color:0x333b39,roughness:1}),wood:new THREE.MeshStandardMaterial({color:0x493830,roughness:.9})};const box=(x,y,z,sx,sy,sz,mat,sh=true)=>{let m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);m.position.set(x,y,z);m.castShadow=sh;m.receiveShadow=true;scene.add(m);return m};const cone=(x,y,z,r,h,mat,n=8)=>{let m=new THREE.Mesh(new THREE.ConeGeometry(r,h,n),mat);m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m};const cyl=(x,y,z,r,h,mat,n=10)=>{let m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,n),mat);m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m};const plane=new THREE.Mesh(new THREE.PlaneGeometry(900,900),mats.water);plane.rotation.x=-Math.PI/2;plane.position.y=-1.3;scene.add(plane);const island=new THREE.Mesh(new THREE.CylinderGeometry(105,120,7,64),mats.ground);island.position.y=1;island.receiveShadow=true;scene.add(island);for(let i=0;i<70;i++){const a=i*2.399,r=16+Math.sqrt(i)*8,x=Math.cos(a)*r,z=Math.sin(a)*r,y=4+Math.cos(i*19)*1.8;box(x,y,z,5+Math.random()*5,2.7+Math.random()*4,5+Math.random()*6,i%5===0?mats.dark:mats.stone);if(i%3===0){const w=1.5;box(x,y+3.5,z,w,1.9,.6,mats.window,false)}}
function tower(x,z,height,base=7){box(x,height/2,z,base,height,base,mats.stone);box(x,height+1,z,base+1,2,base+1,mats.dark);for(const ox of [-1,1])for(const oz of [-1,1]){let tx=x+ox*(base/2-.4),tz=z+oz*(base/2-.4);cyl(tx,height+4,tz,1.3,4,mats.dark,8);cone(tx,height+8,tz,2.2,8,mats.roof,8)}for(let yy=4;yy<height-3;yy+=7){for(let wx=-1;wx<=1;wx++){box(x+wx*base*.27,yy,z+base/2+.08,1,2,.35,mats.window,false);let tip=cone(x+wx*base*.27,yy+1.6,z+base/2+.07,.62,1.3,mats.dark,4);tip.rotation.z=Math.PI}}cone(x,height+8,z,base*.9,14,mats.roof,8);cyl(x,height+15,z,.18,9,mats.dark,6)}tower(0,0,45,12);tower(-29,-15,28,8);tower(28,-18,34,9);tower(23,24,24,7);tower(-25,27,20,7);function cathedral(x,z){box(x,8,z,38,16,22,mats.stone);box(x,17,z,25,4,21,mats.dark);for(const side of [-1,1]){for(let i=0;i<5;i++){const xx=x-16+i*8;box(xx,9,z+side*12,2,18,2,mats.dark);cone(xx,19,z+side*12,2,5,mats.roof,4)}}tower(x-12,z-4,34,6);tower(x+12,z-4,34,6);tower(x,z-12,26,6);for(let i=0;i<8;i++){let xx=x-14+i*4;box(xx,9,z+11.8,1.3,5,.4,mats.window,false);cone(xx,12,z+11.8,.8,2,.35,mats.window,4)}}cathedral(0,-28);function bridge(x,z,len){for(let i=0;i<len;i++){box(x+i*4,2,z,4,1,7,mats.wood);if(i%3===0){cyl(x+i*4,3,z-3,.23,3,mats.dark,6);cyl(x+i*4,3,z+3,.23,3,mats.dark,6)}}}bridge(-40,43,20);for(let i=0;i<16;i++){let x=-65+i*8;box(x,2,70,5,3,4,i%3?mats.stone:mats.dark);box(x,4,70,3,1,3,mats.roof)}for(let i=0;i<44;i++){let a=i*1.7,r=25+(i%7)*7,x=Math.cos(a)*r,z=Math.sin(a)*r;let trunk=cyl(x,2.6,z,.32,5,mats.wood,6);cone(x,7,z,2.3,8,new THREE.MeshStandardMaterial({color:i%3?0x243c36:0x394638,roughness:1}),7)}

kchange',()=>locked=document.pointerLockElement===renderer.domElement);document.addEventListener('mousemove',e=>{if(locked){yaw-=e.movementX*.0026;pitch-=e.movementY*.0022;cameraUpdate()}});document.addEventListener('keydown',e=>walk[e.key.toLowerCase()]=true);document.addEventListener('keyup',e=>walk[e.key.toLowerCase()]=false);$('#roam').onclick=()=>{renderer.domElement.requestPointerLock?.();toast('漫游模式已开启 · WASD 行走，ESC 退出')};$('#home').onclick=()=>{target.set(0,14,0);yaw=.68;pitch=.18;distance=125;cameraUpdate();toast('已回到观景点')};$('#time').oninput=()=>{day=Number($('#time').value)/100;const name=day<.22?'深夜':day<.4?'黎明':day<.62?'白昼':day<.82?'暮色':'夜晚';$('#timeName').textContent=name;const bright=.35+day*1.4;ambient.intensity=bright;moon.intensity=2.4*(1-day*.72);warm.intensity=12+30*(1-day);scene.background.setHSL(.57,.3,.035+day*.09);fog.color.setHSL(.58,.25,.045+day*.075);renderer.toneMappingExposure=.55+day*.55;mats.window.emissiveIntensity=.65+(1-day)*3.5};let noticeTimer;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>e.classList.remove('show'),2400)}let clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime(),pos=waterGeo.attributes.position;for(let i=0;i<pos.count;i++){let x=waterBase[i*3],z=waterBase[i*3+2];pos.setY(i,Math.sin(x*.08+t*.8)*.08+Math.cos(z*.11+t*.65)*.06)}pos.needsUpdate=true;waterGeo.computeVertexNormals();for(let i=0;i<dustN;i++)dustPos[i*3+1]+=.006;if(locked){const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));if(walk.w){target.addScaledVector(forward,.65)}if(walk.s){target.addScaledVector(forward,-.65)}if(walk.a){target.addScaledVector(right,-.65)}if(walk.d){target.addScaledVector(right,.65)}if(walk[' '])target.y+=.3;if(walk.shift)target.y-=.3;cameraUpdate()}dustGeo.attributes.position.needsUpdate=true;renderer.render(scene,camera)}animate()
