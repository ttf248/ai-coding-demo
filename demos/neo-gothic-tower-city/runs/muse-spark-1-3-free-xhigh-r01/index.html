<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新哥特式塔楼城市 · 可漫游</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05060f;color:#e5e7eb;font-family:-apple-system,"PingFang SC","Microsoft YaHei",serif;overflow-x:hidden}
header{position:fixed;top:0;left:0;right:0;z-index:10;background:linear-gradient(#000a,#0000);padding:10px 14px;pointer-events:none}
header h1{font-size:16px;letter-spacing:2px}header p{font-size:12px;color:#9ca3af}
#gl{width:100%;height:100vh;display:block}
.panel{position:fixed;left:10px;bottom:10px;z-index:10;background:#0b1120ee;border:1px solid #334155;border-radius:12px;padding:10px;font-size:13px;max-width:min(92vw,340px)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
button{border:1px solid #475569;background:#111c36;color:#e5e7eb;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
button.active{background:#7c3aed}
.help{font-size:12px;color:#94a3b8;line-height:1.6;margin-top:6px}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<header><h1>🕍 新哥特式塔楼城市 · 真实比例漫游</h1><p>拖拽环视 · 滚轮缩放 · 自动巡游 · 海浪/火焰/雾气粒子 · 待确认项见面板</p></header>
<canvas id="gl"></canvas>
<div class="panel">
<div class="row"><button id="tour" class="active">自动巡游：开</button><button id="fly">高空俯瞰</button><button id="street">街巷漫步</button></div>
<div class="row"><label>粒子丰富度</label><input id="dense" type="range" min="0" max="100" value="70"><span id="denseV">70</span></div>
<div class="row"><label>相机速度</label><input id="spd" type="range" min="1" max="10" value="4"><span>4</span></div>
<div class="help" id="notes">待确认：① 缺失的局部纹理已用程序化石材质代替；② 风声音效未引入，仅保留视觉；③ 已按审美自动规划巡游路线与粒子密度，可继续漫游完整页面。</div>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05060f);
scene.fog=new THREE.FogExp2(0x0a0f24,0.012);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,800);
camera.position.set(28,14,34);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,8,0);controls.maxPolarAngle=Math.PI*0.495;controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0x8ea2ff,0x1a1208,0.7));
const moon=new THREE.DirectionalLight(0xbfd0ff,1.2);moon.position.set(-30,50,20);moon.castShadow=true;scene.add(moon);
const warm=new THREE.PointLight(0xff9a3c,80,120);warm.position.set(0,10,0);scene.add(warm);
// ground + water
const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),new THREE.MeshStandardMaterial({color:0x11182e,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const water=new THREE.Mesh(new THREE.PlaneGeometry(240,240,1,1),new THREE.MeshStandardMaterial({color:0x0e3a5a,transparent:true,opacity:0.55,roughness:0.2,metalness:0.6}));
water.rotation.x=-Math.PI/2;water.position.y=0.05;scene.add(water);
// gothic city: instanced towers
const towerGroup=new THREE.Group();scene.add(towerGroup);
function gothicTower(x,z,h,w){
  const g=new THREE.Group();
  const stone=new THREE.MeshStandardMaterial({color:0x8b8fa3,roughness:0.85});
  const dark=new THREE.MeshStandardMaterial({color:0x2a2f45,roughness:0.9});
  const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),stone);body.position.y=h/2;body.castShadow=true;g.add(body);
  // pointed spires
  for(const [dx,dz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
    const s=new THREE.Mesh(new THREE.ConeGeometry(w*0.22,h*0.28,4),dark);
    s.position.set(dx*w*0.42,h+h*0.13,dz*w*0.42);s.rotation.y=Math.PI/4;g.add(s);
  }
  const main=new THREE.Mesh(new THREE.ConeGeometry(w*0.55,h*0.45,4),stone);
  main.position.y=h+h*0.2;main.rotation.y=Math.PI/4;main.castShadow=true;g.add(main);
  // glowing windows (emissive planes)
  const winMat=new THREE.MeshBasicMaterial({color:0xffc46b});
  for(let i=0;i<Math.floor(h/4);i++){
    const win=new THREE.Mesh(new THREE.PlaneGeometry(w*0.14,h*0.06),winMat);
    win.position.set(0,3+i*4,w/2+0.02);g.add(win);
    const win2=win.clone();win2.rotation.y=Math.PI;win2.position.z=-w/2-0.02;g.add(win2);
  }
  // flying buttress hint
  const b=new THREE.Mesh(new THREE.BoxGeometry(w*1.5,0.5,w*0.2),dark);b.position.y=h*0.6;g.add(b);
  g.position.set(x,0,z);towerGroup.add(g);
}
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
for(let i=0;i<46;i++){
  const a=rnd()*Math.PI*2, r=8+rnd()*52;
  const x=Math.cos(a)*r, z=Math.sin(a)*r;
  if(Math.abs(x)<6&&Math.abs(z)<6)continue;
  gothicTower(x,z,10+rnd()*26,2.2+rnd()*2.4);
}
// cathedral center
gothicTower(0,0,38,7);
// bridge
const bridge=new THREE.Mesh(new THREE.BoxGeometry(70,1,4),new THREE.MeshStandardMaterial({color:0x3a3f5c}));
bridge.position.set(0,1.2,0);scene.add(bridge);
// particles: flames + mist + waves
let COUNT=2600;
let pGeo=new THREE.BufferGeometry(), pPos=new Float32Array(COUNT*3), pVel=[];
function initParticles(d){
  COUNT=Math.floor(500+d*35);
  pPos=new Float32Array(COUNT*3);pVel=[];
  for(let i=0;i<COUNT;i++){
    const kind=Math.random();
    let x,y,z;
    if(kind<0.4){x=(Math.random()-0.5)*100;y=Math.random()*2+0.2;z=(Math.random()-0.5)*100;} // mist/waves
    else if(kind<0.75){x=(Math.random()-0.5)*80;y=Math.random()*30;z=(Math.random()-0.5)*80;} // embers
    else{x=(Math.random()-0.5)*12;y=Math.random()*8;z=(Math.random()-0.5)*12;} // cathedral fire
    pPos[i*3]=x;pPos[i*3+1]=y;pPos[i*3+2]=z;
    pVel.push({s:0.3+Math.random()*1.2,ph:Math.random()*7});
  }
  pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
  const colors=new Float32Array(COUNT*3);
  for(let i=0;i<COUNT;i++){const c=new THREE.Color().setHSL(0.08+Math.random()*0.55,0.8,0.6);colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b;}
  pGeo.setAttribute('color',new THREE.BufferAttribute(colors,3));
}
initParticles(70);
const pMat=new THREE.PointsMaterial({size:0.5,vertexColors:true,transparent:true,opacity:0.8,depthWrite:false,blending:THREE.AdditiveBlending});
const points=new THREE.Points(pGeo,pMat);scene.add(points);
let auto=true, mode=0, t=0;
document.getElementById('tour').onclick=e=>{auto=!auto;e.target.textContent='自动巡游：'+(auto?'开':'关');e.target.classList.toggle('active',auto);};
document.getElementById('fly').onclick=()=>{mode=0;camera.position.set(0,60,60);controls.target.set(0,0,0);};
document.getElementById('street').onclick=()=>{mode=1;camera.position.set(6,1.7,18);controls.target.set(0,10,0);};
document.getElementById('dense').oninput=e=>{document.getElementById('denseV').textContent=e.target.value;initParticles(parseInt(e.target.value,10));};
controls.addEventListener('start',()=>{if(auto){auto=false;document.getElementById('tour').textContent='自动巡游：关';document.getElementById('tour').classList.remove('active');}});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function animate(){
  requestAnimationFrame(animate);
  t+=0.016;
  const pos=pGeo.attributes.position.array;
  for(let i=0;i<COUNT;i++){
    pos[i*3+1]+=0.02*pVel[i].s;
    pos[i*3]+=Math.sin(t+pVel[i].ph)*0.01;
    if(pos[i*3+1]>34)pos[i*3+1]=0.2;
  }
  pGeo.attributes.position.needsUpdate=true;
  water.position.y=0.05+Math.sin(t*0.8)*0.05;
  if(auto){
    const r=38, sp=0.06*(parseInt(document.getElementById('spd').value,10)/4);
    const a=t*sp;
    camera.position.set(Math.cos(a)*r,14+Math.sin(t*0.3)*4,Math.sin(a)*r);
    controls.target.set(0,10,0);
  }
  controls.update();renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
