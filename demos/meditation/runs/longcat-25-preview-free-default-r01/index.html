<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冥想 iOS App 原型</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { background: #1a1a2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.phone-frame { width: 375px; min-height: 812px; background: linear-gradient(180deg, #0f3460 0%, #16213e 100%); border-radius: 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); overflow: hidden; position: relative; margin: 20px; display: inline-block; vertical-align: top; color: white; }
.phone-notch { width: 150px; height: 30px; background: #000; border-radius: 0 0 20px 20px; margin: 0 auto; position: relative; z-index: 10; }
.breath-circle { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(78,205,196,0.3) 0%, rgba(78,205,196,0) 70%); display: flex; align-items: center; justify-content: center; margin: 0 auto; animation: breathe 8s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
</style>
</head>
<body>
<div class="text-center p-8">
<h1 class="text-3xl font-bold text-white mb-4">冥想 iOS App 原型</h1>
<p class="text-gray-400 mb-8">完整功能原型设计</p>

<!-- 首页 -->
<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="p-6 pt-16 text-center">
    <p class="text-sm opacity-70 mb-2">欢迎回来</p>
    <h2 class="text-2xl font-bold mb-8">开始今天的冥想</h2>
    <div class="breath-circle mb-8">
      <div class="w-32 h-32 rounded-full bg-teal-400/30 flex items-center justify-center">
        <i class="fas fa-spa text-4xl text-teal-300"></i>
      </div>
    </div>
    <p class="text-lg mb-2">呼吸练习</p>
    <p class="text-sm opacity-70 mb-8">4-7-8 呼吸法</p>
    <button class="w-full py-4 bg-teal-400 text-gray-900 rounded-2xl font-semibold text-lg mb-4">开始冥想</button>
    <div class="flex justify-center gap-4">
      <div class="text-center"><i class="fas fa-clock text-teal-300"></i><p class="text-xs mt-1">10分钟</p></div>
      <div class="text-center"><i class="fas fa-music text-teal-300"></i><p class="text-xs mt-1">轻音乐</p></div>
      <div class="text-center"><i class="fas fa-volume-up text-teal-300"></i><p class="text-xs mt-1">引导</p></div>
    </div>
  </div>
</div>

<!-- 冥想播放页 -->
<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="p-6 pt-16 text-center">
    <p class="text-sm opacity-70 mb-4">正在进行</p>
    <h2 class="text-xl font-bold mb-8">身体扫描冥想</h2>
    <div class="breath-circle mb-8">
      <div class="w-32 h-32 rounded-full bg-teal-400/30 flex items-center justify-center">
        <span class="text-3xl font-light">08:32</span>
      </div>
    </div>
    <div class="flex justify-center gap-6 mb-8">
      <button class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center"><i class="fas fa-backward"></i></button>
      <button class="w-16 h-16 rounded-full bg-teal-400 flex items-center justify-center text-gray-900"><i class="fas fa-pause text-xl"></i></button>
      <button class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center"><i class="fas fa-forward"></i></button>
    </div>
    <div class="w-full bg-white/10 rounded-full h-1 mb-2">
      <div class="bg-teal-400 h-1 rounded-full" style="width: 65%"></div>
    </div>
    <div class="flex justify-between text-xs opacity-70">
      <span>05:42</span><span>15:00</span>
    </div>
  </div>
</div>

<!-- 课程列表页 -->
<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="p-6 pt-16">
    <h2 class="text-2xl font-bold mb-6">冥想课程</h2>
    <div class="space-y-4">
      <div class="bg-white/10 rounded-2xl p-4 flex items-center gap-4">
        <div class="w-14 h-14 rounded-xl bg-teal-400/20 flex items-center justify-center"><i class="fas fa-moon text-teal-300 text-xl"></i></div>
        <div class="flex-1"><p class="font-semibold">睡前放松</p><p class="text-sm opacity-70">15分钟 · 初级</p></div>
        <i class="fas fa-chevron-right opacity-50"></i>
      </div>
      <div class="bg-white/10 rounded-2xl p-4 flex items-center gap-4">
        <div class="w-14 h-14 rounded-xl bg-purple-400/20 flex items-center justify-center"><i class="fas fa-sun text-purple-300 text-xl"></i></div>
        <div class="flex-1"><p class="font-semibold">晨间唤醒</p><p class="text-sm opacity-70">10分钟 · 初级</p></div>
        <i class="fas fa-chevron-right opacity-50"></i>
      </div>
      <div class="bg-white/10 rounded-2xl p-4 flex items-center gap-4">
        <div class="w-14 h-14 rounded-xl bg-blue-400/20 flex items-center justify-center"><i class="fas fa-water text-blue-300 text-xl"></i></div>
        <div class="flex-1"><p class="font-semibold">压力缓解</p><p class="text-sm opacity-70">20分钟 · 中级</p></div>
        <i class="fas fa-chevron-right opacity-50"></i>
      </div>
      <div class="bg-white/10 rounded-2xl p-4 flex items-center gap-4">
        <div class="w-14 h-14 rounded-xl bg-pink-400/20 flex items-center justify-center"><i class="fas fa-heart text-pink-300 text-xl"></i></div>
        <div class="flex-1"><p class="font-semibold">自我关爱</p><p class="text-sm opacity-70">25分钟 · 高级</p></div>
        <i class="fas fa-chevron-right opacity-50"></i>
      </div>
    </div>
  </div>
</div>

<!-- 统计页 -->
<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="p-6 pt-16">
    <h2 class="text-2xl font-bold mb-6">我的进度</h2>
    <div class="bg-white/10 rounded-2xl p-6 text-center mb-6">
      <p class="text-4xl font-bold text-teal-300 mb-2">7</p>
      <p class="text-sm opacity-70">连续冥想天数</p>
    </div>
    <div class="bg-white/10 rounded-2xl p-4 mb-4">
      <p class="text-sm opacity-70 mb-3">本周冥想时长</p>
      <div class="flex items-end justify-between h-24 px-2">
        <div class="w-6 bg-teal-400/40 rounded-t" style="height:60%"></div>
        <div class="w-6 bg-teal-400/60 rounded-t" style="height:80%"></div>
        <div class="w-6 bg-teal-400/80 rounded-t" style="height:100%"></div>
        <div class="w-6 bg-teal-400 rounded-t" style="height:70%"></div>
        <div class="w-6 bg-teal-400/60 rounded-t" style="height:50%"></div>
        <div class="w-6 bg-teal-400/40 rounded-t" style="height:40%"></div>
        <div class="w-6 bg-teal-400/20 rounded-t" style="height:20%"></div>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-white/10 rounded-2xl p-4 text-center">
        <p class="text-2xl font-bold text-teal-300">70</p>
        <p class="text-xs opacity-70">总分钟数</p>
      </div>
      <div class="bg-white/10 rounded-2xl p-4 text-center">
        <p class="text-2xl font-bold text-teal-300">3</p>
        <p class="text-xs opacity-70">完成课程</p>
      </div>
    </div>
  </div>
</div>

</div>
</body>
</html>
