$('play').onclick=()=>{if(playing)stopAudio();else startAudio()};$('startCourse').onclick=()=>{startAudio();$('player').scrollIntoView({behavior:'smooth'})};$('back15').onclick=()=>{elapsed=Math.max(0,elapsed-15);update()};$('forward15').onclick=()=>{elapsed=Math.min(duration,elapsed+15);update();if(elapsed>=duration)complete()};$('volume').oninput=()=>{if(gain){gain.gain.value=Number($('volume').value)*.5;lfoGain.gain.value=Number($('volume').value)*.15}};$('complete').onclick=complete;

$('search').oninput=list;let breathingActive=false,breathStart=0,totalBreath=0;$('breathe').onclick=()=>{breathingActive=!breathingActive;if(breathingActive){breathStart=performance.now()-totalBreath*1000;$('breathe').textContent='暂停呼吸练习'}else $('breathe').textContent='继续呼吸练习'};
let last=performance.now();function frame(t){const dt=Math.min(1,(t-last)/1000);last=t;if(playing){elapsed+=dt;if(elapsed>=duration){elapsed=duration;complete()}update()}if(breathingActive){totalBreath=(t-breathStart)/1000;const phase=totalBreath%14;let name,seconds,scale;if(phase<4){name='吸气';seconds=4-phase;scale=.8+phase/4*.42}else if(phase<8){name='停留';seconds=8-phase;scale=1.22}else{name='呼气';seconds=14-phase;scale=1.22-(phase-8)/6*.42}$('breathPhase').textContent=name;$('breathCount').textContent=Math.ceil(seconds);$('breathCircle').style.transform='scale('+scale+')';$('rounds').textContent='已完成 '+Math.floor(totalBreath/14)+' 轮呼吸'}requestAnimationFrame(frame)}document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAudio();if(breathingActive)$('breathe').click()}});window.addEventListener('pagehide',()=>audio?.close());store();list();update();requestAnimationFrame(frame);
</script></body></html>
