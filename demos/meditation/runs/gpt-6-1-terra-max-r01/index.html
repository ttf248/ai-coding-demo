<!doctype html><html lang="zh-CN"><head><script src="../../../../assets/analytics.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>间息 · 冥想 iOS 原型</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body class="bg-[#e8e7e2] text-[#243930] antialiased"><main class="mx-auto max-w-[1650px] px-4 py-10 sm:px-8"><div class="mb-8 flex flex-wrap items-end justify-between gap-4"><div><p class="text-xs font-bold tracking-[.22em] text-[#849d8b]">STILL / MINDFULNESS FOR EVERYDAY</p><h1 class="mt-2 text-3xl font-semibold tracking-tight sm:text-4xl">间息 · 给自己一点空隙</h1><p class="mt-2 text-sm text-[#879890]">冥想 iOS App · 体验与界面原型</p></div><span class="text-xs text-[#879890]">01—07 / 375 PT</span></div><div id="screens" class="grid grid-cols-1 justify-items-center gap-8 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4"></div><p class="mt-8 text-center text-xs text-[#879890]">内容与进度为示例；播放控件演示计时，不含音频服务。</p></main><script>
const photos={mist:'https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=80',lake:'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80',forest:'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=800&q=80',sea:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80'};const icon=(n,c='')=>`<i class="fa-solid fa-${n} ${c}" aria-hidden="true"></i>`;const status=`<div class="flex justify-between px-6 pt-4 text-[12px] font-bold"><span>9:41</span><span>${icon('signal')} &nbsp; ${icon('wifi')} &nbsp; ${icon('battery-three-quarters')}</span></div>`;const nav=active=>`<div class="absolute inset-x-0 bottom-0 flex justify-around border-t border-[#e7eee8] bg-[#fbfcf8]/95 px-2 pb-5 pt-3 text-center text-[10px] text-[#9baca0]">${[['house','首页'],['compass','探索'],['chart-simple','旅程'],['user','我的']].map(([i,n])=>`<button data-tip="${n}页面示意" class="w-14 ${n===active?'text-[#648d74]':''}">${icon(i,'mb-1 block text-[17px]')}${n}</button>`).join('')}</div>`;const wrap=(n,label,body,active='',dark=false)=>`<section class="w-full max-w-[375px]"><div class="mb-3 flex justify-between text-xs text-[#8a9991]"><b>${n} / ${label}</b><span>375 × 812</span></div><div class="relative h-[812px] overflow-hidden rounded-[40px] border-[7px] border-[#24362c] ${dark?'bg-[#263d35] text-white':'bg-[#fbfcf8]'} shadow-xl">${status}<div class="h-[690px] overflow-y-auto px-5 pb-8 pt-6">${body}</div>${active?nav(active):''}<div class="absolute bottom-1 left-1/2 h-1 w-28 -translate-x-1/2 rounded-full ${dark?'bg-white':'bg-[#263932]'}"></div></div></section>`;const title=(k,t)=>`<p class="text-[10px] font-bold tracking-[.18em] text-[#9aae9f]">${k}</p><h2 class="mt-1 text-[26px] font-semibold tracking-tight">${t}</h2>`;const pill=t=>`<span class="rounded-full bg-[#edf3ec] px-3 py-1.5 text-[11px] text-[#75917f]">${t}</span>`;
const screens=[wrap('01','欢迎',`<div class="pt-2"><div class="text-xl font-semibold text-[#709580]">◒ 间息</div><p class="mt-1 text-xs tracking-[.2em] text-[#a4b4a6]">A LITTLE SPACE TO BREATHE</p><img class="mt-7 h-64 w-full rounded-[28px] object-cover" src="${photos.mist}" alt="晨雾"><h2 class="mt-8 text-[31px] font-semibold leading-tight">慢一点，<br>回到此时此刻。</h2><p class="mt-4 text-sm leading-7 text-[#8d9e91]">无论今天有多忙，给自己几分钟安静。我们陪你从一次呼吸开始。</p><button data-tip="开始使用示意" class="mt-7 w-full rounded-2xl bg-[#70977e] py-4 text-sm font-semibold text-white">开启你的练习 →</button><p class="mt-4 text-center text-xs text-[#aab9ad]">已有账号？ <button data-tip="登录示意" class="text-[#74967f]">登录</button></p></div>`),
wrap('02','首页',`${title('GOOD MORNING, LIN','早安，林') }<p class="mt-2 text-sm text-[#99ab9d]">今天，先给自己一个深呼吸。</p><div class="relative mt-6 h-56 overflow-hidden rounded-[25px]"><img class="h-full w-full object-cover" src="${photos.mist}" alt="晨光"><div class="absolute inset-0 bg-gradient-to-t from-[#1c3527]/80 to-transparent"></div><div class="absolute bottom-5 left-5 text-white"><p class="text-[10px] tracking-widest">TODAY’S PRACTICE</p><h3 class="mt-2 text-xl font-semibold">从容开启新一天</h3><p class="mt-1 text-xs text-white/80">引导冥想 · 10 分钟</p></div><button data-tip="练习详情示意" class="absolute bottom-5 right-5 grid h-11 w-11 place-items-center rounded-full bg-white text-[#577d66]">${icon('play')}</button></div><div class="mt-6 flex justify-between"><h3 class="font-semibold">此刻你需要什么？</h3><button data-tip="探索页面示意" class="text-xs text-[#8ca391]">查看全部 →</button></div><div class="mt-3 grid grid-cols-3 gap-2">${[['☁','缓解压力'],['☾','安心入眠'],['☼','专注当下']].map(([i,t])=>`<button data-tip="${t}内容示意" class="rounded-2xl bg-[#eff4ec] py-5 text-center"><span class="block text-xl text-[#8bab91]">${i}</span><span class="mt-2 block text-xs">${t}</span></button>`).join('')}</div><h3 class="mt-6 font-semibold">继续你的旅程</h3><div class="mt-3 flex items-center gap-3 rounded-2xl border border-[#e6eee5] p-3"><img class="h-16 w-16 rounded-xl object-cover" src="${photos.forest}" alt="森林"><div class="flex-1"><p class="text-sm font-semibold">正念入门 · 第 3 天</p><p class="mt-1 text-xs text-[#9aaca0]">认识你的呼吸 · 8 分钟</p></div>${icon('circle-play','text-xl text-[#8aae96]')}</div>`,'首页'),
wrap('03','探索',`${title('FIND YOUR MOMENT','探索练习')}<div class="mt-5 flex items-center gap-2 rounded-2xl bg-[#eef3ed] px-4 py-3 text-sm text-[#a0b0a4]">${icon('magnifying-glass')} <input class="w-full bg-transparent outline-none" placeholder="搜索主题、课程或声音"></div><div class="mt-5 flex flex-wrap gap-2">${['全部','睡眠','减压','专注','初学者'].map(pill).join('')}</div><h3 class="mt-6 font-semibold">为你精选</h3><div class="mt-3 grid grid-cols-2 gap-3">${[[photos.lake,'山间静心','12 分钟 · 减压'],[photos.sea,'海边入眠','20 分钟 · 睡眠'],[photos.forest,'回到呼吸','8 分钟 · 初学者'],[photos.mist,'晨间清醒','10 分钟 · 专注']].map(([url,t,d])=>`<button data-tip="${t}详情示意" class="text-left"><img class="h-28 w-full rounded-2xl object-cover" src="${url}" alt=""><p class="mt-2 text-sm font-semibold">${t}</p><p class="text-xs text-[#a1b0a5]">${d}</p></button>`).join('')}</div>`,'探索'),
wrap('04','课程详情',`<div class="flex justify-between text-[#90a99a]"><button data-tip="返回">${icon('arrow-left')}</button><button data-tip="已收藏示意">${icon('bookmark')}</button></div><img class="mt-5 h-56 w-full rounded-[26px] object-cover" src="${photos.lake}" alt="湖泊"><p class="mt-6 text-xs tracking-widest text-[#8fa895]">GUIDED MEDITATION · 初学者</p><h2 class="mt-2 text-[27px] font-semibold">山间静心</h2><p class="mt-2 text-sm text-[#94a799]">12 分钟 · 林老师 · 温柔引导</p><p class="mt-5 text-sm leading-7 text-[#7e9083]">把注意力带回呼吸，想象自己坐在安静的湖边。适合忙碌之后，重新找到自己的节奏。</p><div class="mt-5 flex gap-2">${pill('缓解压力')}${pill('初学者友好')}${pill('无需经验')}</div><button data-tip="播放页面示意" class="mt-8 w-full rounded-2xl bg-[#729981] py-4 font-semibold text-white">▶ &nbsp; 开始练习</button>`),
wrap('05','播放中',`<div class="flex justify-between text-white/70"><button data-tip="收起">${icon('chevron-down')}</button><span class="text-xs tracking-widest">NOW PLAYING</span><button data-tip="更多选项">${icon('ellipsis')}</button></div><div class="relative mx-auto mt-14 h-60 w-60 overflow-hidden rounded-full"><img class="h-full w-full object-cover" src="${photos.lake}" alt="湖泊"><div class="absolute inset-0 rounded-full border-[12px] border-white/10"></div></div><div class="mt-10 text-center"><h2 class="text-2xl font-semibold">山间静心</h2><p class="mt-2 text-sm text-white/60">林老师 · 引导冥想</p></div><div class="mt-10 h-1 rounded-full bg-white/20"><div id="progress" class="h-1 w-0 rounded-full bg-[#c4ddc8]"></div></div><div class="mt-2 flex justify-between text-xs text-white/60"><span id="elapsed">00:00</span><span>12:00</span></div><div class="mt-7 flex items-center justify-center gap-12"><button data-tip="后退示意">${icon('rotate-left','text-xl')}</button><button id="play" class="grid h-16 w-16 place-items-center rounded-full bg-[#e7f2e6] text-[#345342]">${icon('play','text-xl')}</button><button data-tip="前进示意">${icon('rotate-right','text-xl')}</button></div><p class="mt-8 text-center text-xs text-white/50">放松肩膀，让呼吸自然流动。</p>`, '',true),
wrap('06','呼吸练习',`${title('A MINUTE FOR YOU','跟随呼吸')}<p class="mt-2 text-sm text-[#9aab9f]">轻轻地吸气，再慢慢呼出。</p><div class="mx-auto mt-20 grid h-56 w-56 place-items-center rounded-full bg-[#e3eee3]"><div class="grid h-40 w-40 place-items-center rounded-full bg-[#c8dfcc]"><div class="grid h-28 w-28 place-items-center rounded-full bg-[#92b99e] text-white"><span id="breathText">准备好</span></div></div></div><p class="mt-12 text-center text-sm text-[#8da494]">吸气 4 秒 · 呼气 4 秒</p><button id="breath" class="mt-8 w-full rounded-2xl bg-[#729981] py-4 font-semibold text-white">开始呼吸</button><p class="mt-5 text-center text-xs text-[#a7b7aa]">如果感到不适，可以随时停止。</p>`),
wrap('07','我的旅程',`${title('YOUR JOURNEY','每一步都算数')}<p class="mt-2 text-sm text-[#9bada0]">慢慢来，练习没有标准答案。</p><div class="mt-6 rounded-3xl bg-[#e9f1e7] p-5"><p class="text-xs text-[#8aa591]">你已经练习</p><div class="mt-2 flex items-baseline gap-1"><strong class="text-4xl">68</strong><span class="text-sm">分钟</span></div><div class="mt-5 flex justify-between border-t border-[#d5e5d6] pt-4 text-center"><div><b>7</b><p class="text-xs text-[#8da492]">练习天数</p></div><div><b>3</b><p class="text-xs text-[#8da492]">连续天数</p></div><div><b>8</b><p class="text-xs text-[#8da492]">完成练习</p></div></div></div><h3 class="mt-7 font-semibold">这一周</h3><div class="mt-4 flex justify-between">${['一','二','三','四','五','六','日'].map((d,i)=>`<div class="text-center"><div class="grid h-8 w-8 place-items-center rounded-full ${i<3?'bg-[#95b99d] text-white':'bg-[#edf3ec] text-[#c1cec2]'}">${i<3?'✓':'·'}</div><p class="mt-1 text-xs text-[#a3b1a5]">${d}</p></div>`).join('')}</div><h3 class="mt-7 font-semibold">最近练习</h3><div class="mt-3 rounded-2xl border border-[#e6eee5] p-4"><div class="flex justify-between"><span class="text-sm font-semibold">晨间清醒</span><span class="text-xs text-[#9caf9f]">今天</span></div><p class="mt-2 text-xs text-[#a3b2a6]">10 分钟 · 引导冥想</p></div>`,'旅程')];document.querySelector('#screens').innerHTML=screens.join('');document.addEventListener('click',e=>{const b=e.target.closest('[data-tip]');if(b){const old=b.innerHTML;b.textContent=b.dataset.tip;setTimeout(()=>b.innerHTML=old,1300)}});let elapsed=0,timer=null;document.querySelector('#play').onclick=()=>{if(timer){clearInterval(timer);timer=null;document.querySelector('#play').innerHTML=icon('play','text-xl')}else{document.querySelector('#play').innerHTML=icon('pause','text-xl');timer=setInterval(()=>{elapsed=Math.min(720,elapsed+1);document.querySelector('#elapsed').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0');document.querySelector('#progress').style.width=elapsed/720*100+'%';if(elapsed===720){clearInterval(timer);timer=null}},1000)}};let bt=null,seconds=0;document.querySelector('#breath').onclick=()=>{if(bt){clearInterval(bt);bt=null;document.querySelector('#breath').textContent='开始呼吸';document.querySelector('#breathText').textContent='准备好'}else{seconds=0;document.querySelector('#breath').textContent='停止';document.querySelector('#breathText').textContent='吸气';bt=setInterval(()=>{seconds++;document.querySelector('#breathText').textContent=seconds%8<4?'吸气':'呼气'},1000)}};
</script></body></html>
