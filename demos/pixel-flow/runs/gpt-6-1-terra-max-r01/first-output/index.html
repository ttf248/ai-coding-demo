*{box-sizing:border-box}body{margin:0;background:#080a12;color:#edf0fb;font:14px/1.5 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:16px}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.05em;margin:0}header p{margin:0;color:#9c9db4}.tag{font-size:11px;color:#b9a9ff;font-weight:700;letter-spacing:.18em}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:15px}.stage{height:min(67vw,680px);min-height:420px;border:1px solid #292b44;border-radius:18px;overflow:hidden;background:radial-gradient(circle at center,#20243d,#0b0e1b 70%);position:relative}.stage canvas{display:block;width:100%;height:100%;touch-action:none}.stage-caption{position:absolute;left:18px;bottom:15px;color:#b7b6ce;pointer-events:none;font-size:12px}.panel{background:#121423;border:1px solid #292b44;border-radius:18px;padding:18px}.section+.section{border-top:1px solid #2d3046;margin-top:17px;padding-top:17px}.section h2{color:#b1b4ca;font-size:12px;letter-spacing:.09em;margin:0 0 10px}.section p{color:#969bb3;font-size:12px}.file{display:block;border:1px dashed #7267a3;background:#201b37;padding:12px;border-radius:10px;cursor:pointer;color:#e0d8ff}.file input{width:100%;margin-top:8px;font-size:12px}button,select{font:inherit;background:#292943;color:#eeeaff;border:1px solid #494767;border-radius:8px;padding:9px 10px;cursor:pointer}button:hover{background:#494064}.primary{background:#b8a7ff;color:#17112b;font-weight:700;border-color:#b8a7ff}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.video{position:relative;background:#090b14;border-radius:10px;overflow:hidden;aspect-ratio:4/3}video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.video span{position:absolute;left:8px;bottom:8px;background:#111b;padding:3px 7px;border-radius:5px;font-size:11px}label{display:block;color:#b4bad0;margin:8px 0 4px}select{width:100%}#status{color:#c3b6ff;min-height:3em}#error{color:#ffbeaa}@media(max-width:780px){main{padding:16px 10px}.layout{grid-template-columns:1fr}.stage{height:58vh;min-height:350px}.panel{padding:15px}}
</style></head><body><main><header><div><div class="tag">INTERACTIVE IMAGE STUDY / 01</div><h1>Pixel Flow</h1><p>让一张图片散开，再用手势把它找回来。</p></div></header><div class="layout"><section class="stage" id="stage"><div class="stage-caption">张开手掌聚拢附近的粒子 · 握拳暂停 · 也可以在画面拖动</div></section><aside class="panel"><div class="section"><h2>01 / 选择图片</h2><label class="file">上传本地图片<input id="file" type="file" accept="image/*"></label><label for="sampling">采样密度</label><select id="sampling"><option value="5">精细 · 较多粒子</option><option value="7" selected>均衡</option><option value="10">轻量 · 较少粒子</option></select><p>图片仅在本地浏览器中处理。默认展示一张生成的示例图。</p></div><div class="section"><h2>02 / 手势追踪</h2><div class="video"><video id="video" autoplay muted playsinline></video><span id="gesture">摄像头未开启</span></div><div class="buttons" style="margin-top:9px"><button class="primary" id="camera">开启摄像头</button><button id="stop">关闭摄像头</button></div><p>允许摄像头权限后张开手掌。手部模型从网络加载；摄像头通常要求 HTTPS 或 localhost。</p><p id="status" role="status">正在加载图形库…</p><p id="error" role="alert"></p></div><div class="section"><h2>03 / 画面</h2><div class="buttons"><button id="restore">全部还原</button><button id="scatter">重新飘散</button></div></div></aside></div></main><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s),stage=$('#stage'),video=$('#video'),status=$('#status'),err=$('#error');let scene,camera,renderer,points,positions,origins,velocities,phases,sourceImage=null,stream=null,hands=null,tracking=false,gestureActive=false,gesturePoint={x:0,y:0},pointerActive=false,restoreAll=false,lastVideoTime=-1,stopToken=0;const W=480,H=320;function fail(message){err.textContent=message}function example(){const c=document.createElement('canvas');c.width=W;c.height=H;let x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#b5a7ed');g.addColorStop(.55,'#f6b8a8');g.addColorStop(1,'#ecddb5');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#fbe5ba';x.beginPath();x.arc(330,90,42,0,7);x.fill();x.fillStyle='#696a96';x.beginPath();x.moveTo(0,235);x.lineTo(110,120);x.lineTo(240,260);x.lineTo(345,160);x.lineTo(480,265);x.lineTo(480,320);x.lineTo(0,320);x.fill();x.fillStyle='#343d5e';x.beginPath();x.moveTo(0,275);x.lineTo(120,205);x.lineTo(250,300);x.lineTo(390,195);x.lineTo(480,250);x.lineTo(480,320);x.lineTo(0,320);x.fill();return c}function sample(img){sourceImage=img;const c=document.createElement('canvas');c.width=W;c.height=H;let x=c.getContext('2d');x.fillStyle='#111';x.fillRect(0,0,W,H);const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height,scale=Math.min(W/iw,H/ih),dw=iw*scale,dh=ih*scale;x.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);const data=x.getImageData(0,0,W,H).data,step=Number($('#sampling').value),arr=[],col=[],orig=[],vel=[],phase=[];for(let y=0;y<H;y+=step)for(let xx=0;xx<W;xx+=step){let i=(y*W+xx)*4;if(data[i+3]<20)continue;orig.push((xx/W-.5)*3,(.5-y/H)*2,0);arr.push((Math.random()-.5)*4.8,(Math.random()-.5)*3.4,(Math.random()-.5)*.8);vel.push(0,0,0);phase.push(Math.random()*6.28);col.push(data[i]/255,data[i+1]/255,data[i+2]/255)}if(points){scene.remove(points);points.geometry.dispose();points.material.dispose()}positions=new Float32Array(arr);origins=new Float32Array(orig);velocities=new Float32Array(vel);phases=phase;const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));geometry.setAttribute('color',new THREE.Float32BufferAttribute(col,3));points=new THREE.Points(geometry,new THREE.PointsMaterial({size:.026,vertexColors:true,transparent:true,opacity:.94,depthWrite:false}));scene.add(points);restoreAll=false;status.textContent=`${arr.length/3} 个粒子已就绪；可以拖动画面或开启摄像头。`}function scatter(){if(!positions)return;for(let i=0;i<positions.length;i+=3){positions[i]=(Math.random()-.5)*4.8;positions[i+1]=(Math.random()-.5)*3.4;positions[i+2]=(Math.random()-.5)*.8;velocities[i]=velocities[i+1]=velocities[i+2]=0}restoreAll=false}function resize(){if(!renderer)return;const r=stage.getBoundingClientRect(),aspect=r.width/r.height;renderer.setSize(r.width,r.height,false);camera.left=-1.8*aspect;camera.right=1.8*aspect;camera.top=1.8;camera.bottom=-1.8;camera.updateProjectionMatrix()}function animate(t){requestAnimationFrame(animate);if(!points)return;for(let i=0;i<positions.length;i+=3){const j=i/3,dx=origins[i]-positions[i],dy=origins[i+1]-positions[i+1],dist=Math.hypot(positions[i]-gesturePoint.x,positions[i+1]-gesturePoint.y),attract=restoreAll?.025:(gestureActive||pointerActive)&&dist<1.25?.018*(1-dist/1.5):0;velocities[i]=(velocities[i]+dx*attract+Math.sin(t*.0008+phases[j])*.00009)*.94;velocities[i+1]=(velocities[i+1]+dy*attract+Math.cos(t*.001+phases[j])*.00009)*.94;velocities[i+2]=(velocities[i+2]-positions[i+2]*attract)*.94;positions[i]+=velocities[i];positions[i+1]+=velocities[i+1];positions[i+2]+=velocities[i+2]}points.geometry.attributes.position.needsUpdate=true;renderer.render(scene,camera)}function gesture(results){let lm=results.multiHandLandmarks?.[0];if(!lm){gestureActive=false;$('#gesture').textContent='未检测到手';return}let palm=lm[0],distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z),extended=[8,12,16,20].filter(i=>distance(lm[i],palm)>distance(lm[i-2],palm)*1.18).length;gestureActive=extended>=3;const aspect=stage.clientWidth/stage.clientHeight;gesturePoint.x=(.5-lm[9].x)*3.6*aspect;gesturePoint.y=(.5-lm[9].y)*3.6;$('#gesture').textContent=gestureActive?'张开手掌 · 正在聚拢':'握拳 / 未张开 · 暂停聚拢'}async function track(token){if(!tracking||token!==stopToken)return;try{if(video.readyState>=2&&video.currentTime!==lastVideoTime){lastVideoTime=video.currentTime;await hands.send({image:video})}}catch(e){fail('手部追踪失败：'+e.message);stop();return}setTimeout(()=>track(token),50)}function stop(){stopToken++;tracking=false;gestureActive=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;$('#gesture').textContent='摄像头未开启';status.textContent='摄像头已关闭。'}$('#camera').onclick=async()=>{if(stream)return;fail('');if(!window.Hands){fail('MediaPipe 未加载，请检查网络连接。');return}if(!navigator.mediaDevices?.getUserMedia){fail('摄像头不可用：请使用 HTTPS 或 localhost，并检查浏览器权限。');return}try{status.textContent='正在加载手部模型并请求摄像头权限…';hands=hands||new Hands({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`});hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.5});hands.onResults(gesture);stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();tracking=true;status.textContent='摄像头已开启。张开手掌聚拢，握拳暂停。';track(++stopToken)}catch(e){fail('摄像头或模型启动失败：'+e.message);stop()}};$('#stop').onclick=stop;$('#file').onchange=e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){fail('请选择图片文件。');return}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);fail('');sample(img)};img.onerror=()=>{URL.revokeObjectURL(url);fail('图片无法读取，请尝试其他文件。')};img.src=url};$('#sampling').onchange=()=>sourceImage&&sample(sourceImage);$('#restore').onclick=()=>restoreAll=true;$('#scatter').onclick=scatter;function pointer(e){const r=stage.getBoundingClientRect();gesturePoint.x=((e.clientX-r.left)/r.width-.5)*(camera.right-camera.left);gesturePoint.y=(.5-(e.clientY-r.top)/r.height)*(camera.top-camera.bottom)}stage.addEventListener('pointerdown',e=>{pointerActive=true;pointer(e);stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(pointerActive)pointer(e)});stage.addEventListener('pointerup',()=>pointerActive=false);stage.addEventListener('pointercancel',()=>pointerActive=false);window.addEventListener('pagehide',stop);try{if(!window.THREE)throw Error('Three.js 未加载，请检查网络连接。');scene=new THREE.Scene();camera=new THREE.OrthographicCamera(-3,3,1.8,-1.8,.1,20);camera.position.z=5;renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));stage.prepend(renderer.domElement);resize();window.addEventListener('resize',resize);sample(example());requestAnimationFrame(animate)}catch(e){fail('无法启动粒子画面：'+e.message);status.textContent='图形环境不可用。'}})();
</script></body></html>
