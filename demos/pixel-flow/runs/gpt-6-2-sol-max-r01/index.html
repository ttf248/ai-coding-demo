<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111820" />
    <title>Pixel Flow · 粒子手势工作室</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          15px/1.5 "Microsoft YaHei",
          system-ui,
          sans-serif;
        background: #10161e;
        color: #eef3fb;
        --muted: #b0bcc9;
        --line: #364450;
        --panel: #18232e;
        --accent: #a9e6d4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      h1,
      h2,
      p,
      figure {
        margin: 0;
      }
      header,
      main {
        width: min(1320px, 100% - 40px);
        margin: auto;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 12px;
        padding: 24px 0 16px;
      }
      h1 {
        font-size: clamp(35px, 7vw, 68px);
        letter-spacing: -0.075em;
        font-weight: 680;
        line-height: 1;
      }
      header p,
      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 7px;
      }
      #tech {
        font:
          12px ui-monospace,
          monospace;
        color: #a9e6d4;
        white-space: nowrap;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 260px;
        gap: 12px;
        padding-bottom: 35px;
      }
      section,
      aside {
        min-width: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 13px;
      }
      .lab {
        padding: 7px;
        align-self: start;
      }
      #stage {
        height: clamp(340px, 64vh, 650px);
        background: radial-gradient(ellipse at 45% 40%, #243643, #111820 60%);
        border-radius: 8px;
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }
      #stage::before {
        position: absolute;
        inset: 0;
        background: radial-gradient(#b4d8df32 1px, transparent 1px) 0 0/24px
          24px;
        content: "";
        pointer-events: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        position: relative;
        touch-action: none;
        cursor: crosshair;
      }
      #stage-error {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 20px;
        text-align: center;
        background: #12212bd9;
        color: #f6debc;
      }
      [hidden] {
        display: none !important;
      }
      #field {
        position: absolute;
        width: 64px;
        height: 64px;
        border: 1px solid #c5ffe9a8;
        border-radius: 50%;
        background: #bef3e315;
        transform: translate(-50%, -50%);
        pointer-events: none;
        box-shadow: 0 0 15px #c5ffe950;
      }
      .metrics {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        flex-wrap: wrap;
        font:
          12px ui-monospace,
          monospace;
        min-height: 36px;
        align-items: center;
        padding: 0 6px;
        color: var(--muted);
      }
      aside {
        padding: 13px;
        display: grid;
        gap: 14px;
        align-self: start;
      }
      aside section {
        border: 0;
      }
      h2 {
        font-size: 14px;
        margin-bottom: 6px;
      }
      button,
      select {
        font: inherit;
        min-height: 40px;
        padding: 6px 9px;
        border: 1px solid #435563;
        border-radius: 7px;
        background: #253543;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #16342e;
        font-weight: 700;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #photo-preview {
        width: 100%;
        height: 94px;
        object-fit: cover;
        border-radius: 7px;
        background: #10161e;
      }
      #file-label {
        border: 1px solid #435563;
        border-radius: 7px;
        padding: 8px 10px;
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        min-height: 40px;
      }
      #file {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      #file-label:focus-within {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #camera-wrap {
        position: relative;
        margin-top: 7px;
        aspect-ratio: 16/9;
        overflow: hidden;
        border-radius: 7px;
        background: #101820;
        display: grid;
        place-items: center;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform: scaleX(-1);
      }
      #camera-empty {
        font-size: 12px;
        color: var(--muted);
        position: absolute;
        text-align: center;
        padding: 6px;
      }
      #gesture {
        font-size: 12px;
        margin-top: 7px;
        color: var(--accent);
      }
      #sampling {
        width: 100%;
      }
      @media (max-width: 740px) {
        header,
        main {
          width: calc(100% - 20px);
        }
        header {
          align-items: start;
          padding-top: 18px;
        }
        #tech {
          padding-top: 6px;
          font-size: 10px;
        }
        main {
          grid-template-columns: minmax(0, 1fr);
        }
        #stage {
          height: clamp(275px, 47vh, 440px);
        }
        .metrics {
          font-size: 11px;
        }
      }
    </style>
    <script src="../../../../assets/analytics.js" defer></script>
  </head>
  <body>
    <header>
      <div>
        <h1>Pixel Flow</h1>
        <p>把图像散成粒子，再用手势或指针重组。</p>
      </div>
      <span id="tech">Three.js / MediaPipe</span>
    </header>
    <main>
      <section class="lab" aria-label="粒子舞台">
        <div id="stage">
          <div id="field" hidden></div>
          <p id="stage-error" role="alert" hidden></p>
        </div>
        <div class="metrics">
          <span id="particle-count">正在载入粒子引擎</span
          ><span id="progress" role="status"></span>
        </div>
      </section>
      <aside aria-label="图像与动作">
        <section>
          <h2>图像来源</h2>
          <img id="photo-preview" alt="用于生成粒子的图像预览" />
          <div class="row">
            <label id="file-label"
              ><input type="file" id="file" accept="image/*" />上传图片</label
            >
            <button id="example" type="button">示例图</button>
          </div>
          <p class="hint" id="image-status" role="status">
            选择保存在设备上的图片。
          </p>
        </section>
        <section>
          <h2><label for="sampling">像素采样</label></h2>
          <select id="sampling">
            <option value="88">稀疏</option>
            <option value="136" selected>均衡</option>
            <option value="196">精细</option>
          </select>
        </section>
        <section>
          <div class="row">
            <button class="primary" id="restore">完整还原</button
            ><button id="scatter">重新打散</button>
          </div>
          <p class="hint">也可按住画布移动局部力场。</p>
        </section>
        <section>
          <h2>手势摄像头</h2>
          <button id="camera-toggle">开启摄像头</button>
          <div id="camera-wrap">
            <video id="video" playsinline muted></video>
            <p id="camera-empty">摄像头已关闭</p>
          </div>
          <p id="gesture" role="status">张开手掌吸引粒子，握拳暂停还原。</p>
        </section>
      </aside>
    </main>
    <script type="module">
      const $ = (id) => document.getElementById(id);
      const stage = $("stage"),
        video = $("video");
      const threeUrl =
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
      const visionRoot =
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21";
      const model =
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
      const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
      let THREE,
        renderer,
        scene,
        camera,
        cloud = null;
      let source = null,
        size = { x: 1, y: 1 },
        pixels = 0,
        pull = null,
        home = null,
        spread = null,
        mean = 0;
      let mode = "local",
        pointer = null,
        hand = null,
        gesture = "none",
        guess = "none",
        streak = 0,
        uploadRevision = 0;
      let stream = null,
        tracker = null,
        cameraRevision = 0,
        cameraPending = false,
        lastVideo = -1,
        lastTrack = 0;
      let lastTime = 0,
        lastMetrics = 0;

      function sampleImage() {
        const c = document.createElement("canvas");
        c.width = 800;
        c.height = 520;
        const g = c.getContext("2d"),
          sky = g.createLinearGradient(0, 0, 0, 520);
        sky.addColorStop(0, "#315c88");
        sky.addColorStop(0.53, "#dd7d7e");
        sky.addColorStop(0.75, "#ffc49a");
        sky.addColorStop(1, "#433e67");
        g.fillStyle = sky;
        g.fillRect(0, 0, 800, 520);
        g.fillStyle = "#ffe6ac";
        g.beginPath();
        g.arc(514, 204, 67, 0, Math.PI * 2);
        g.fill();
        const peaks = [
          [
            "#806b86",
            [
              [0, 333],
              [123, 238],
              [212, 342],
              [373, 208],
              [465, 270],
              [597, 195],
              [738, 273],
              [800, 260],
            ],
          ],
          [
            "#565677",
            [
              [0, 367],
              [136, 295],
              [204, 328],
              [299, 286],
              [442, 391],
              [629, 255],
              [741, 297],
              [800, 338],
            ],
          ],
          [
            "#344b66",
            [
              [0, 416],
              [100, 370],
              [188, 410],
              [327, 324],
              [478, 422],
              [647, 367],
              [800, 386],
            ],
          ],
        ];
        for (const [color, pts] of peaks) {
          g.beginPath();
          g.moveTo(0, 520);
          for (const [x, y] of pts) g.lineTo(x, y);
          g.lineTo(800, 520);
          g.closePath();
          g.fillStyle = color;
          g.fill();
        }
        const water = g.createLinearGradient(0, 409, 0, 520);
        water.addColorStop(0, "#52788c");
        water.addColorStop(1, "#17293f");
        g.fillStyle = water;
        g.fillRect(0, 423, 800, 97);
        for (let i = 0; i < 120; i++) {
          const x = (i * 139.42) % 800,
            y = 424 + ((i * 13.71) % 96),
            length = 3 + ((i * 4.37) % 42);
          g.fillStyle = i % 4 === 0 ? "#f7ad9677" : "#a8c5be3f";
          g.fillRect(x, y, length, 1 + (i % 3 === 0));
        }
        return c;
      }

      function rebuild() {
        if (!source || !renderer) return;
        const originalWidth = source.naturalWidth || source.width,
          originalHeight = source.naturalHeight || source.height;
        const max = Number($("sampling").value),
          step = max / Math.max(originalWidth, originalHeight);
        const w = Math.max(1, Math.round(originalWidth * step)),
          h = Math.max(1, Math.round(originalHeight * step));
        const image = document.createElement("canvas");
        image.width = w;
        image.height = h;
        const ctx = image.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(source, 0, 0, w, h);
        const rgba = ctx.getImageData(0, 0, w, h).data;
        const points = [],
          origins = [],
          colors = [],
          seeds = [];
        const s = 1.55 / Math.max(w, h);
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            if (rgba[i + 3] < 35) continue;
            points.push((x + 0.5 - w / 2) * s, (h / 2 - y - 0.5) * s, 0);
            const t = Math.random() * Math.PI * 2,
              r = Math.sqrt(Math.random());
            origins.push(
              Math.cos(t) * r * 1.04,
              Math.sin(t) * r * 0.69,
              (Math.random() - 0.5) * 0.9,
            );
            colors.push(rgba[i] / 255, rgba[i + 1] / 255, rgba[i + 2] / 255);
            seeds.push(Math.random() * Math.PI * 2);
          }
        if (!seeds.length) {
          $("image-status").textContent = "图片没有可见像素。";
          return;
        }
        size = { x: w * s, y: h * s };
        mean = 0;
        mode = "local";
        if (cloud) {
          scene.remove(cloud);
          cloud.geometry.dispose();
          cloud.material.dispose();
        }
        home = new Float32Array(points);
        spread = new Float32Array(origins);
        pixels = seeds.length;
        pull = new Float32Array(pixels);
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.BufferAttribute(home, 3));
        geometry.setAttribute("aOrigin", new THREE.BufferAttribute(spread, 3));
        geometry.setAttribute(
          "aInk",
          new THREE.Float32BufferAttribute(colors, 3),
        );
        geometry.setAttribute(
          "aSeed",
          new THREE.Float32BufferAttribute(seeds, 1),
        );
        geometry.setAttribute(
          "aPull",
          new THREE.BufferAttribute(pull, 1).setUsage(THREE.DynamicDrawUsage),
        );
        const material = new THREE.ShaderMaterial({
          uniforms: {
            uTime: { value: 0 },
            uDot: { value: 2 },
          },
          vertexShader: `
        attribute vec3 aOrigin,aInk;attribute float aSeed,aPull;
        uniform float uTime,uDot;varying vec3 vInk;varying float vPull;
        void main(){
          vec3 drift=vec3(sin(aOrigin.y*8.+uTime*.85+aSeed)*.15,cos(aOrigin.x*7.-uTime*.7+aSeed)*.13,sin(uTime*.57+aSeed)*.09);
          vec3 point=mix(aOrigin+drift,position,smoothstep(0.,1.,aPull));
          gl_Position=projectionMatrix*modelViewMatrix*vec4(point,1.);
          gl_PointSize=clamp(uDot*mix(.45,1.08,aPull)+.5*sin(aSeed)* (1.-aPull),1.,7.);
          vInk=aInk;vPull=aPull;
        }
      `,
          fragmentShader: `
        varying vec3 vInk;varying float vPull;
        void main(){
          float radius=length(gl_PointCoord-.5);
          float opacity=(1.-smoothstep(.29,.5,radius))*mix(.45,1.,vPull);
          gl_FragColor=vec4(vInk,opacity);
        }
      `,
          transparent: true,
          depthWrite: false,
        });
        cloud = new THREE.Points(geometry, material);
        cloud.frustumCulled = false;
        scene.add(cloud);
        $("particle-count").textContent =
          pixels.toLocaleString("zh-CN") + " 粒子";
        $("progress").textContent = "已还原 0%";
        resize();
      }

      function showSample() {
        uploadRevision++;
        source = sampleImage();
        $("photo-preview").src = source.toDataURL("image/webp", 0.8);
        $("image-status").textContent = "示例图 · 日落山影";
        rebuild();
      }
      $("example").onclick = showSample;
      $("sampling").onchange = rebuild;
      $("file").onchange = (event) => {
        const file = event.target.files[0];
        event.target.value = "";
        if (!file) return;
        if (!file.type.startsWith("image/") || file.size > 25 * 1024 * 1024) {
          $("image-status").textContent = "请选择不超过 25 MB 的图片。";
          return;
        }
        const revision = ++uploadRevision,
          url = URL.createObjectURL(file),
          image = new Image();
        $("image-status").textContent = "正在读取图片…";
        image.onload = () => {
          if (revision === uploadRevision) {
            source = image;
            const thumbnail = document.createElement("canvas");
            thumbnail.width = 280;
            thumbnail.height = Math.round(
              280 * clamp(image.naturalHeight / image.naturalWidth, 0.3, 2),
            );
            thumbnail
              .getContext("2d")
              .drawImage(image, 0, 0, thumbnail.width, thumbnail.height);
            $("photo-preview").src = thumbnail.toDataURL("image/webp", 0.83);
            $("image-status").textContent =
              file.name +
              " · " +
              image.naturalWidth +
              " × " +
              image.naturalHeight;
            rebuild();
          }
          URL.revokeObjectURL(url);
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          if (revision === uploadRevision)
            $("image-status").textContent = "无法解码这张图片。";
        };
        image.src = url;
      };

      function resize() {
        if (!renderer) return;
        const { width, height } = stage.getBoundingClientRect(),
          aspect = width / Math.max(1, height);
        if (!width || !height) return;
        renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.7));
        renderer.setSize(width, height, false);
        const halfY = Math.max(0.77, size.y * 0.68, (size.x * 0.64) / aspect);
        camera.left = -halfY * aspect;
        camera.right = halfY * aspect;
        camera.top = halfY;
        camera.bottom = -halfY;
        camera.updateProjectionMatrix();
        if (cloud)
          cloud.material.uniforms.uDot.value = clamp(
            ((size.x / (camera.right - camera.left)) *
              renderer.domElement.width) /
              Number($("sampling").value),
            1.6,
            7,
          );
      }
      function normalized(event) {
        const r = stage.getBoundingClientRect();
        return {
          x: clamp((event.clientX - r.left) / r.width, 0, 1),
          y: clamp((event.clientY - r.top) / r.height, 0, 1),
        };
      }
      function drawField() {
        const p = pointer ?? (gesture === "open" ? hand : null),
          el = $("field");
        el.hidden = !p;
        if (p) {
          el.style.left = p.x * 100 + "%";
          el.style.top = p.y * 100 + "%";
        }
      }
      function animate(now) {
        const dt = Math.min(Math.max((now - lastTime) / 1000, 0.001), 0.04);
        lastTime = now;
        if (
          tracker &&
          video.readyState >= 2 &&
          lastVideo !== video.currentTime &&
          now - lastTrack > 36
        ) {
          lastVideo = video.currentTime;
          lastTrack = now;
          try {
            detect(tracker.detectForVideo(video, now).landmarks[0]);
          } catch {
            stopCamera("手势识别中断，可重新打开摄像头。");
          }
        }
        if (cloud) {
          const point = pointer ?? (gesture === "open" ? hand : null);
          if (mode !== "local" || point) {
            let total = 0;
            const x = point ? (point.x * 2 - 1) * camera.right : 0,
              y = point ? (1 - point.y * 2) * camera.top : 0;
            for (let i = 0; i < pixels; i++) {
              const old = pull[i],
                index = i * 3;
              let rate = 0;
              if (mode === "restore") rate = 3.6;
              else if (mode === "scatter") rate = -5.2;
              else {
                const px = spread[index] + (home[index] - spread[index]) * old,
                  py =
                    spread[index + 1] +
                    (home[index + 1] - spread[index + 1]) * old;
                const distance = Math.hypot(px - x, py - y);
                rate = distance < 0.42 ? 0.9 + 3.7 * (1 - distance / 0.42) : 0;
              }
              pull[i] = clamp(
                rate < 0
                  ? old + rate * dt
                  : old + (1 - old) * Math.min(1, rate * dt),
                0,
                1,
              );
              total += pull[i];
            }
            mean = total / pixels;
            cloud.geometry.attributes.aPull.needsUpdate = true;
            if (
              (mode === "restore" && mean > 0.998) ||
              (mode === "scatter" && mean < 0.002)
            )
              mode = "local";
          }
          cloud.material.uniforms.uTime.value = now * 0.001;
          renderer.render(scene, camera);
          if (now - lastMetrics > 130) {
            $("progress").textContent =
              "已还原 " + Math.round(mean * 100) + "%";
            lastMetrics = now;
          }
        }
        drawField();
        requestAnimationFrame(animate);
      }

      function detect(landmarks) {
        let state = "none";
        hand = null;
        if (landmarks) {
          const wrist = landmarks[0],
            middle = landmarks[9];
          const d = (a, b) => Math.hypot(a.x - b.x, (a.y - b.y) * 0.78);
          const span = Math.max(0.025, d(wrist, middle));
          const extended = [8, 12, 16, 20].filter(
            (i) =>
              d(landmarks[i], wrist) > d(landmarks[i - 2], wrist) + span * 0.24,
          ).length;
          state = extended >= 4 ? "open" : extended <= 1 ? "fist" : "neutral";
          hand = {
            x: clamp(1 - (wrist.x + middle.x) * 0.5, 0, 1),
            y: clamp((wrist.y + middle.y) * 0.5, 0, 1),
          };
        }
        if (state !== guess) {
          guess = state;
          streak = 0;
        }
        if (++streak < 3 || state === gesture) return;
        gesture = state;
        $("gesture").textContent = {
          open: "识别到张开手掌 · 局部吸引",
          fist: "识别到握拳 · 还原暂停",
          none: "正在等候手掌进入画面",
          neutral: "请张开手掌或握拳",
        }[gesture];
      }
      function stopCamera(message = "张开手掌吸引粒子，握拳暂停还原。") {
        cameraRevision++;
        cameraPending = false;
        stream?.getTracks().forEach((track) => track.stop());
        stream = null;
        tracker?.close();
        tracker = null;
        video.srcObject = null;
        hand = null;
        guess = gesture = "none";
        streak = 0;
        lastVideo = -1;
        $("camera-toggle").textContent = "开启摄像头";
        $("camera-empty").hidden = false;
        $("camera-empty").textContent = "摄像头已关闭";
        $("gesture").textContent = message;
      }
      async function startCamera() {
        if (!navigator.mediaDevices?.getUserMedia) {
          $("gesture").textContent =
            "摄像头需要浏览器授予权限，并通过本机 HTTP 或 HTTPS 打开。";
          return;
        }
        const revision = ++cameraRevision;
        cameraPending = true;
        $("camera-toggle").textContent = "取消摄像头连接";
        $("camera-empty").textContent = "等待摄像头权限…";
        try {
          const media = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user",
              width: { ideal: 640 },
              height: { ideal: 400 },
            },
            audio: false,
          });
          if (revision !== cameraRevision) {
            media.getTracks().forEach((track) => track.stop());
            return;
          }
          stream = media;
          video.srcObject = stream;
          await video.play();
          if (revision !== cameraRevision) return;
          $("camera-empty").hidden = true;
          $("gesture").textContent = "正在载入手势模型…";
          const { FilesetResolver, HandLandmarker } = await import(
            visionRoot + "/vision_bundle.mjs"
          );
          const files = await FilesetResolver.forVisionTasks(
            visionRoot + "/wasm",
          );
          if (revision !== cameraRevision) return;
          const options = {
            baseOptions: { modelAssetPath: model },
            runningMode: "VIDEO",
            numHands: 1,
            minHandDetectionConfidence: 0.55,
            minTrackingConfidence: 0.55,
          };
          const detector = await HandLandmarker.createFromOptions(
            files,
            options,
          );
          if (revision !== cameraRevision) {
            detector.close();
            return;
          }
          tracker = detector;
          cameraPending = false;
          $("camera-toggle").textContent = "关闭摄像头";
          $("gesture").textContent = "摄像头已开启 · 等候手掌";
        } catch (error) {
          if (revision !== cameraRevision) return;
          stopCamera(
            error.name === "NotAllowedError"
              ? "摄像头权限未获允许，仍可使用指针与按钮。"
              : "无法连接摄像头或载入手势模型，请检查设备与网络。",
          );
        }
      }
      $("camera-toggle").onclick = () => {
        if (cameraPending || stream) stopCamera();
        else void startCamera();
      };
      $("restore").onclick = () => {
        mode = "restore";
      };
      $("scatter").onclick = () => {
        mode = "scatter";
      };
      window.addEventListener("pagehide", () => stopCamera());

      showSample();
      try {
        THREE = await import(threeUrl);
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
        renderer.setClearColor(0, 0);
        stage.prepend(renderer.domElement);
        renderer.domElement.setAttribute("aria-label", "图片粒子画布");
        scene = new THREE.Scene();
        camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 20);
        camera.position.z = 3;
        const canvas = renderer.domElement;
        canvas.addEventListener("pointerdown", (event) => {
          if (event.button !== 0 || pointer) return;
          canvas.setPointerCapture(event.pointerId);
          pointer = { ...normalized(event), id: event.pointerId };
          mode = "local";
        });
        canvas.addEventListener("pointermove", (event) => {
          if (pointer?.id === event.pointerId)
            Object.assign(pointer, normalized(event));
        });
        for (const name of ["pointerup", "pointercancel", "lostpointercapture"])
          canvas.addEventListener(name, (event) => {
            if (pointer?.id === event.pointerId) pointer = null;
          });
        new ResizeObserver(resize).observe(stage);
        rebuild();
        requestAnimationFrame(animate);
      } catch {
        $("stage-error").hidden = false;
        $("stage-error").textContent =
          "无法启动粒子引擎。请确认网络可访问 Three.js，并启用浏览器的 WebGL 2。";
        $("particle-count").textContent = "粒子引擎未运行";
        for (const id of ["restore", "scatter", "sampling", "camera-toggle"])
          $(id).disabled = true;
      }
    </script>
  </body>
</html>
