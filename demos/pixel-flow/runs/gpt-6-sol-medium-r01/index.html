<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Flow · 手势重构影像</title><style>*{box-sizing:border-box}body{margin:0;background:#080d16;color:#e9f5ff;font-family:Inter,"PingFang SC",sans-serif;overflow:hidden}.app{display:grid;grid-template-columns:330px minmax(0,1fr);height:100vh}.side{z-index:2;background:#101827;border-right:1px solid #223144;padding:32px;overflow:auto}.brand{color:#76e0d2;font-size:12px;letter-spacing:.28em;font-weight:700}h1{font-size:40px;line-height:1.05;margin:14px 0 14px;letter-spacing:-.04em}.muted{color:#9dafc0;line-height:1.6;font-size:14px}.section{border-top:1px solid #263448;margin-top:30px;padding-top:24px}.label{font-size:11px;color:#728ca4;letter-spacing:.16em;text-transform:uppercase}.upload{display:block;margin-top:13px;border:1px dashed #547a8d;background:#172738;border-radius:17px;padding:25px 14px;text-align:center;cursor:pointer}.upload b{display:block;margin-bottom:7px}.upload small{color:#8ba3b6}.upload input{display:none}button{cursor:pointer;border:0}.primary{width:100%;padding:14px;border-radius:10px;background:#75decf;color:#10252e;font-weight:700;margin-top:14px}.secondary{width:100%;padding:12px;border-radius:10px;background:#23364a;color:#dbeef5;margin-top:9px}.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:15px 0}.row input{accent-color:#73dfcf}.badge{background:#243a4a;color:#8edccf;padding:7px 10px;border-radius:8px;font-size:12px}.stage{position:relative;min-width:0;overflow:hidden;background:radial-gradient(circle at 50% 42%,#1a3140,#090e17 70%)}#view{position:absolute;inset:0;width:100%;height:100%}video{position:absolute;bottom:24px;right:24px;width:160px;height:120px;object-fit:cover;transform:scaleX(-1);border:1px solid #4f7a87;border-radius:14px;opacity:.72;background:#172a38}.hint{position:absolute;top:25px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center;gap:15px;pointer-events:none}.hint strong{font-size:13px}.hint span{font-size:12px;color:#8caabb}.progress{position:absolute;bottom:27px;left:28px;width:min(320px,45%)}.progress-bar{height:4px;background:#2b4652;border-radius:5px;margin-top:10px}.progress-bar i{display:block;height:100%;width:0;background:#73dfcf;border-radius:5px}.error{color:#ffb6a5;font-size:12px;line-height:1.5;margin-top:12px}.cursor{position:absolute;width:120px;height:120px;border:1px solid #78e2d1;border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%);box-shadow:0 0 28px #74e6d460}@media(max-width:760px){.app{display:block}.side{height:auto;max-height:43vh;padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}.side h1{font-size:27px;margin:5px 0}.side .muted{font-size:11px}.section{margin:0;padding:0;border:0}.stage{height:57vh}.upload{padding:12px}.hint{top:14px;left:15px}.hint span{display:none}video{width:95px;height:72px;right:12px;bottom:12px}.progress{left:15px;bottom:15px}}</style></head><body><div class="app"><aside class="side"><div><div class="brand">PIXEL FLOW / LAB</div><h1>让影像<br>随手势重生</h1><p class="muted">上传一张图片，张开手掌让散落的粒子回到原位。握拳可暂停；移动手掌控制吸引区域。</p></div><div class="section"><div class="label">01 / 选择图片</div><label class="upload"><b>＋ 上传本地图片</b><small>JPG / PNG / WebP · 自动采样为粒子</small><input id="file" type="file" accept="image/*"></label><div class="row"><span>粒子密度</span><span id="densityValue" class="badge">中</span></div><input id="density" type="range" min="3" max="10" value="6" style="width:100%"><button id="scatter" class="secondary">重新散开粒子</button></div><div class="section"><div class="label">02 / 手势控制</div><button id="camera" class="primary">开启摄像头</button><button id="restore" class="secondary">用鼠标 / 触摸还原</button><p id="status" class="muted">等待上传图片</p><p id="error" class="error" role="alert"></p></div></aside><main class="stage"><div id="view"></div><video id="video" autoplay muted playsinline></video><div id="cursor" class="cursor"></div><div class="hint"><strong>PARTICLE CANVAS</strong><span>张开手掌吸引 · 握拳暂停 · 鼠标按住也可操作</span></div><div class="progress"><span id="progressText">重构进度 0%</span><div class="progress-bar"><i id="bar"></i></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id),stage=document.querySelector('.stage'),view=$('view'),video=$('video'),status=$('status'),error=$('error'),cursor=$('cursor');let renderer,scene,camera,points,geometry,material,target=[],scatter=[],velocity=[],active=false,usingPointer=false,focus={x:0,y:0},radius=150,handTracker,stream,tracking=false,frame=0;
function init(){scene=new THREE.Scene();camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,10);camera.position.z=2;renderer=new THREE.WebGLRenderer({alpha:true,antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));view.appendChild(renderer.domElement);resize();new ResizeObserver(resize).observe(stage);animate()}function resize(){if(!renderer)return;const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.left=-w/2;camera.right=w/2;camera.top=h/2;camera.bottom=-h/2;camera.updateProjectionMatrix();if(target.length)loadCurrentImage()}
let currentImage=null;function loadCurrentImage(){if(!currentImage)return;const maxW=Math.min(stage.clientWidth*.75,740),maxH=Math.min(stage.clientHeight*.7,600),scale=Math.min(maxW/currentImage.width,maxH/currentImage.height);const w=Math.max(1,Math.round(currentImage.width*scale)),h=Math.max(1,Math.round(currentImage.height*scale));const sample=Number($('density').value);const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(currentImage,0,0,w,h);const data=ctx.getImageData(0,0,w,h).data;target=[];scatter=[];velocity=[];const colors=[];for(let y=0;y<h;y+=sample)for(let x=0;x<w;x+=sample){const p=(y*w+x)*4;if(data[p+3]<40)continue;target.push(x-w/2,h/2-y,0);scatter.push((Math.random()-.5)*stage.clientWidth*1.4,(Math.random()-.5)*stage.clientHeight*1.4,(Math.random()-.5)*200);velocity.push(0,0,0);colors.push(data[p]/255,data[p+1]/255,data[p+2]/255)}if(points){scene.remove(points);geometry.dispose();material.dispose()}geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(scatter,3));geometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));material=new THREE.PointsMaterial({size:Math.max(2,Math.min(sample*.75,6)),vertexColors:true,transparent:true,opacity:.95,sizeAttenuation:false});points=new THREE.Points(geometry,material);scene.add(points);status.textContent=`已生成 ${target.length/3} 个粒子。开启摄像头或使用鼠标还原。`;error.textContent=''}
$('file').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){error.textContent='请选择图片文件';return}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{currentImage=img;loadCurrentImage();URL.revokeObjectURL(url)};img.onerror=()=>{error.textContent='图片加载失败';URL.revokeObjectURL(url)};img.src=url});$('density').oninput=e=>{$('densityValue').textContent=({3:'高',4:'较高',5:'中高',6:'中',7:'中低',8:'低',9:'更低',10:'最低'})[e.target.value];loadCurrentImage()};$('scatter').onclick=()=>loadCurrentImage();$('restore').onclick=()=>{usingPointer=!usingPointer;active=false;status.textContent=usingPointer?'按住并移动鼠标或手指，吸引周围粒子。':'鼠标控制已关闭。'};stage.addEventListener('pointerdown',e=>{if(!usingPointer)return;active=true;stage.setPointerCapture(e.pointerId);movePointer(e)});stage.addEventListener('pointermove',e=>{if(usingPointer&&active)movePointer(e)});stage.addEventListener('pointerup',()=>{if(usingPointer)active=false});function movePointer(e){const rect=stage.getBoundingClientRect();focus.x=e.clientX-rect.left-rect.width/2;focus.y=rect.height/2-(e.clientY-rect.top);cursor.style.left=`${e.clientX-rect.left}px`;cursor.style.top=`${e.clientY-rect.top}px`;cursor.style.opacity=1}
$('camera').onclick=async()=>{if(!currentImage){error.textContent='请先上传图片';return}if(!navigator.mediaDevices?.getUserMedia){error.textContent='摄像头需要 HTTPS 或 localhost 安全上下文';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();if(!window.Hands)throw Error('MediaPipe 脚本未加载');handTracker=new window.Hands({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`});handTracker.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.65,minTrackingConfidence:.6});handTracker.onResults(results=>{const hand=results.multiHandLandmarks?.[0];if(!hand){active=false;status.textContent='未识别到手掌';return}let extended=0;for(const [tip,pip] of [[8,6],[12,10],[16,14],[20,18]])if(Math.hypot(hand[tip].x-hand[0].x,hand[tip].y-hand[0].y)>Math.hypot(hand[pip].x-hand[0].x,hand[pip].y-hand[0].y)*1.12)extended++;active=extended>=3;focus.x=(.5-hand[9].x)*stage.clientWidth;focus.y=(.5-hand[9].y)*stage.clientHeight;cursor.style.left=`${stage.clientWidth/2+focus.x}px`;cursor.style.top=`${stage.clientHeight/2-focus.y}px`;cursor.style.opacity=active?1:0;status.textContent=active?'张开手掌：正在吸引粒子':'握拳或手指收拢：吸引暂停'});tracking=true;const track=async()=>{if(!tracking)return;if(video.readyState>=2){try{await handTracker.send({image:video})}catch(e){error.textContent=`手势追踪失败：${e.message}`;tracking=false;return}}requestAnimationFrame(track)};track();$('camera').disabled=true;$('camera').textContent='摄像头已开启'}catch(e){error.textContent=`摄像头无法启动：${e.message}`;stream?.getTracks().forEach(t=>t.stop())}};
function animate(){requestAnimationFrame(animate);if(points){const arr=geometry.attributes.position.array;let completed=0;for(let i=0;i<target.length;i+=3){let x=arr[i],y=arr[i+1],z=arr[i+2],dx=target[i]-x,dy=target[i+1]-y,dz=target[i+2]-z;const near=Math.hypot(x-focus.x,y-focus.y)<radius||Math.hypot(target[i]-focus.x,target[i+1]-focus.y)<radius;if(active&&near){velocity[i]=velocity[i]*.88+dx*.028;velocity[i+1]=velocity[i+1]*.88+dy*.028;velocity[i+2]=velocity[i+2]*.88+dz*.028}else{velocity[i]*=.94;velocity[i+1]*=.94;velocity[i+2]*=.94;if(!active){velocity[i]+=(Math.random()-.5)*.035;velocity[i+1]+=(Math.random()-.5)*.035}}arr[i]+=velocity[i];arr[i+1]+=velocity[i+1];arr[i+2]+=velocity[i+2];if(Math.hypot(dx,dy,dz)<sampleTolerance())completed++}geometry.attributes.position.needsUpdate=true;if(++frame%12===0){const percent=Math.round(completed/(target.length/3)*100);$('progressText').textContent=`重构进度 ${percent}%`;$('bar').style.width=`${percent}%`}}renderer.render(scene,camera)}function sampleTolerance(){return Math.max(5,Number($('density').value)*1.5)}init();window.addEventListener('beforeunload',()=>stream?.getTracks().forEach(t=>t.stop()));
</script></body></html>
