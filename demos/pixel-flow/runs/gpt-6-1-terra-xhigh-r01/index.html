<!doctype html><html lang="zh-CN"><head><script src="../../../../assets/analytics.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Flow · 手势粒子</title><style>*{box-sizing:border-box}body{margin:0;background:#090e19;color:#e9f2f7;font:14px/1.5 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:clamp(28px,4vw,45px);margin:0}p{color:#9daec1}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}.panel{background:#121d2d;border:1px solid #2b4056;border-radius:16px;padding:16px}label{display:block;margin:14px 0 6px}input[type=file],select{max-width:100%;color:#d6e8ee}select,button{background:#244458;color:#e7f8fa;border:1px solid #497587;border-radius:8px;padding:9px;font:inherit}button{cursor:pointer;margin:5px 4px 0 0}.stage{height:min(65vh,650px);min-height:340px;position:relative;background:radial-gradient(circle,#172b40,#080d17);border-radius:12px;overflow:hidden;touch-action:none}.stage canvas{width:100%;height:100%;display:block}.camera{position:absolute;right:14px;bottom:14px;width:150px;aspect-ratio:4/3;object-fit:cover;border:1px solid #658595;border-radius:10px;background:#111d29;transform:scaleX(-1)}.status{color:#a4e4d8;min-height:22px}.hint{font-size:13px}@media(max-width:700px){main{padding:12px}.layout{grid-template-columns:1fr}.stage{height:50vh}.camera{width:110px}}</style><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script></head><body><main><small>PIXEL FLOW / 手势实验</small><h1>把图片，交给风。</h1><p>上传一张照片，让粒子散开，再用张开的手掌将它唤回。</p><div class="layout"><aside class="panel"><label>选择本地图片</label><input id="file" type="file" accept="image/*"><label>采样间隔</label><select id="sampling"><option value="3">精细 · 更多粒子</option><option value="5" selected>标准</option><option value="8">轻量 · 更少粒子</option></select><label>摄像头与手势</label><button id="camera">启动摄像头</button><button id="stop">停止摄像头</button><p class="hint">允许摄像头权限后，将手掌面向镜头。张开手掌吸引手附近的粒子回到原位，握拳暂停。需要网络加载 Three.js 和 MediaPipe；摄像头通常要求 HTTPS 或 localhost。</p><button id="restore">全部还原</button><button id="scatter">重新散开</button><p id="status" class="status" aria-live="polite">正在加载图形库…</p></aside><section class="panel"><div class="stage" id="stage"><video id="video" class="camera" autoplay playsinline muted></video></div><p class="hint">也可在画布上拖动，使用指针模拟吸引区域。图片只在本机处理。</p></section></div></main><script>
const $=id=>document.getElementById(id),stage=$('stage'),video=$('video');let renderer,scene,camera,geometry,points,original=[],velocity=[],active=[],hand=null,manual=null,full=false,stream=null,hands=null,detecting=false,img=null,alive=true;
if(!window.THREE){$('status').textContent='Three.js 加载失败，请检查网络后刷新。'}else{try{init()}catch(e){$('status').textContent='图形初始化失败：'+e.message}}
function init(){scene=new THREE.Scene();camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,10);camera.position.z=3;renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));stage.prepend(renderer.domElement);resize();let c=document.createElement('canvas');c.width=400;c.height=300;let x=c.getContext('2d'),g=x.createLinearGradient(0,0,400,300);g.addColorStop(0,'#f6b1a2');g.addColorStop(.5,'#88b6c8');g.addColorStop(1,'#54699c');x.fillStyle=g;x.fillRect(0,0,400,300);x.fillStyle='#fff6';x.beginPath();x.arc(205,140,90,0,Math.PI*2);x.fill();img=new Image();img.onload=()=>makeParticles();img.src=c.toDataURL();$('status').textContent='已就绪。上传图片或启动摄像头。';requestAnimationFrame(frame)}
function makeParticles(){if(!img||!renderer)return;let c=document.createElement('canvas'),scale=Math.min(1,220/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));let ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);let data=ctx.getImageData(0,0,c.width,c.height).data,step=Number($('sampling').value),pos=[],colors=[];original=[];velocity=[];active=[];let ratio=c.width/c.height,ww=ratio>1?1.6:1.6*ratio,hh=ratio>1?1.6/ratio:1.6;for(let y=0;y<c.height;y+=step)for(let x=0;x<c.width;x+=step){let i=(y*c.width+x)*4;if(data[i+3]<16)continue;original.push((x/c.width-.5)*ww,(.5-y/c.height)*hh,0);pos.push((Math.random()-.5)*3,(Math.random()-.5)*2.5,(Math.random()-.5)*.3);colors.push(data[i]/255,data[i+1]/255,data[i+2]/255);velocity.push((Math.random()-.5)*.003,(Math.random()-.5)*.003,0);active.push(false)}if(points){scene.remove(points);geometry.dispose();points.material.dispose()}geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));points=new THREE.Points(geometry,new THREE.PointsMaterial({size:.014,vertexColors:true,transparent:true,opacity:.92,depthWrite:false}));scene.add(points);full=false;$('status').textContent=`已生成 ${active.length} 个粒子。`}
function resize(){if(!renderer)return;let w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);let aspect=w/h;camera.left=-aspect;camera.right=aspect;camera.top=1;camera.bottom=-1;camera.updateProjectionMatrix()}
function frame(t){if(!alive)return;requestAnimationFrame(frame);if(!points)return;let a=geometry.attributes.position.array,field=manual||hand;for(let i=0;i<active.length;i++){let k=i*3,dx=field?a[k]-field.x:99,dy=field?a[k+1]-field.y:99;if(full||(field&&field.open&&dx*dx+dy*dy<.22))active[i]=true;if(active[i]&&!(field&&!field.open)){velocity[k]+=(original[k]-a[k])*.006;velocity[k+1]+=(original[k+1]-a[k+1])*.006;velocity[k]*=.88;velocity[k+1]*=.88}else{velocity[k]+=(Math.sin(t*.0005+i)*.000006);velocity[k+1]+=(Math.cos(t*.0004+i)*.000006);velocity[k]*=.999;velocity[k+1]*=.999;if(a[k]>camera.right+.4||a[k]<camera.left-.4)velocity[k]*=-1;if(a[k+1]>1.4||a[k+1]<-1.4)velocity[k+1]*=-1}a[k]+=velocity[k];a[k+1]+=velocity[k+1]}geometry.attributes.position.needsUpdate=true;renderer.render(scene,camera)}
$('file').onchange=e=>{let file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){$('status').textContent='请选择图片文件。';return}let url=URL.createObjectURL(file),image=new Image();image.onload=()=>{URL.revokeObjectURL(url);img=image;makeParticles()};image.onerror=()=>{URL.revokeObjectURL(url);$('status').textContent='无法读取图片。'};image.src=url};$('sampling').onchange=makeParticles;$('restore').onclick=()=>full=true;$('scatter').onclick=makeParticles;
function pointer(e){let r=stage.getBoundingClientRect();return{x:((e.clientX-r.left)/r.width*2-1)*camera.right,y:1-(e.clientY-r.top)/r.height*2,open:true}}stage.onpointerdown=e=>{if(!renderer)return;stage.setPointerCapture(e.pointerId);manual=pointer(e)};stage.onpointermove=e=>{if(manual)manual=pointer(e)};stage.onpointerup=stage.onpointercancel=()=>manual=null;
$('camera').onclick=async()=>{if(!window.Hands){$('status').textContent='MediaPipe 加载失败，请检查网络。';return}if(!navigator.mediaDevices?.getUserMedia){$('status').textContent='此环境无法访问摄像头，请使用 HTTPS 或 localhost。';return}try{if(stream)return;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();hands=new Hands({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`});hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.65,minTrackingConfidence:.6});hands.onResults(result=>{let p=result.multiHandLandmarks?.[0];if(!p){hand=null;$('status').textContent='未检测到手，请面向镜头。';return}let wrist=p[0],dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),open=[8,12,16,20].filter(i=>dist(p[i],wrist)>dist(p[i-2],wrist)*1.15).length>=3;hand={x:(1-p[9].x*2)*camera.right,y:1-p[9].y*2,open};$('status').textContent=open?'检测到张开手掌：吸引粒子':'手掌收拢：暂停吸引'});detecting=true;async function track(){if(!detecting)return;try{await hands.send({image:video})}catch(e){$('status').textContent='手部追踪失败：'+e.message;detecting=false;return}requestAnimationFrame(track)}track()}catch(e){$('status').textContent='摄像头不可用：'+e.message;stop()}};function stop(){detecting=false;hand=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;if(hands){hands.close();hands=null}}$('stop').onclick=()=>{stop();$('status').textContent='摄像头已停止。'};window.addEventListener('resize',resize);window.addEventListener('pagehide',()=>{alive=false;stop();if(geometry)geometry.dispose();if(points)points.material.dispose();if(renderer)renderer.dispose()});
</script></body></html>
