<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Flow · gesture restoration</title>
    <style>
      :root{color-scheme:dark;--bg:#060a12;--panel:rgba(14,22,37,.78);--line:rgba(156,185,255,.18);--muted:#7f8ba5;--cyan:#6de7f6;--violet:#9b7dff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 60% 10%,#142347 0,#080d18 42%,#05070d 100%);color:#eff5ff;font-family:Inter,ui-sans-serif,system-ui,sans-serif}button,input{font:inherit}.shell{display:grid;min-height:100vh;grid-template-columns:320px 1fr;gap:18px;padding:18px}.panel,.stage{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px);border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.25)}.panel{padding:22px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#09101d;font-weight:900}.eyebrow{margin:0;color:var(--muted);font:500 10px ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase}.title{margin:22px 0 0;font-size:30px;line-height:1.1;letter-spacing:-.04em}.sub{margin:10px 0 0;color:#8d9ab5;font-size:12px;line-height:1.6}.upload{margin-top:24px;display:block;border:1px dashed rgba(109,231,246,.45);border-radius:17px;padding:13px;color:#c7e9ef;background:rgba(109,231,246,.06);cursor:pointer;font-size:12px;text-align:center}.upload input{display:none}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.button{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.05);color:#ccd7ec;padding:11px 9px;cursor:pointer;font-size:11px;transition:.2s}.button:hover,.button.primary{border-color:var(--cyan);background:rgba(109,231,246,.14);color:#e8fdff}.status-card{margin-top:auto;border-top:1px solid var(--line);padding-top:16px}.status-row{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:#a8b4c9}.status-value{color:var(--cyan);font-weight:700}.hint{margin-top:12px;color:#71819e;font-size:10px;line-height:1.7}.stage{position:relative;min-width:0;overflow:hidden;display:flex;align-items:stretch}.stage-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.stage-head{position:absolute;left:24px;right:24px;top:22px;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.live{display:flex;align-items:center;gap:7px;color:#99a9c4;font:10px ui-monospace,monospace;letter-spacing:.14em}.live i{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}.stage-foot{position:absolute;bottom:20px;left:24px;right:24px;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}.legend{color:#93a1bc;font:10px/1.7 ui-monospace,monospace}.legend strong{color:#e7f7ff;font-size:16px}.camera{width:170px;height:105px;overflow:hidden;border:1px solid rgba(109,231,246,.32);border-radius:15px;background:#0a1221;box-shadow:0 12px 30px #0008}.camera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.78}.camera-label{position:absolute;margin:8px;color:#c7f8ff;font:9px ui-monospace,monospace;letter-spacing:.08em;text-shadow:0 1px 4px #000}.message{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:.4s}.message span{padding:10px 14px;border:1px solid rgba(156,185,255,.2);border-radius:999px;background:rgba(4,8,15,.56);color:#aab7cf;font:10px ui-monospace,monospace;letter-spacing:.09em}.message.hide{opacity:0}.slider-wrap{margin-top:15px}.slider-wrap label{display:flex;justify-content:space-between;color:#8491aa;font-size:10px}.slider-wrap input{width:100%;accent-color:var(--cyan)}@media(max-width:780px){.shell{grid-template-columns:1fr;padding:10px}.panel{min-height:350px}.stage{height:62vh;min-height:420px}.status-card{margin-top:22px}.camera{width:130px;height:82px}}
    </style>
  </head>
  <body>
    <main class="shell">
      <aside class="panel"><div class="brand"><span class="brand-mark">PF</span><div><p class="eyebrow">gesture / image lab</p><strong>Pixel Flow</strong></div></div><h1 class="title">把图像，<br><span style="color:var(--cyan)">重新召回。</span></h1><p class="sub">上传一张图片，让它先成为粒子流，再用手势把记忆拼回原位。</p><label class="upload">＋ 选择本地图片<input id="file" type="file" accept="image/*"></label><div class="actions"><button class="button primary" id="restore">开始还原</button><button class="button" id="scatter">重新散开</button></div><div class="slider-wrap"><label><span>采样密度</span><span id="densityValue">4 px</span></label><input id="density" type="range" min="2" max="9" value="4"></div><div class="actions"><button class="button" id="cameraButton">开启摄像头</button><button class="button" id="complete">完成手势</button></div><div class="status-card"><div class="status-row"><span>GESTURE STATE</span><span class="status-value" id="gesture">鼠标引导</span></div><div class="status-row" style="margin-top:8px"><span>RESTORE</span><span class="status-value" id="progress">0%</span></div><p class="hint">张开手掌 → 吸引并还原<br>握拳 → 暂停粒子<br>没有摄像头时可用鼠标 / 触控</p></div></aside>
      <section class="stage"><canvas id="stage" class="stage-canvas"></canvas><div class="stage-head"><div class="live"><i></i><span>LIVE PARTICLE FIELD</span></div><p class="eyebrow">THREE / CANVAS / MEDIAPIPE</p></div><div id="message" class="message"><span>UPLOAD AN IMAGE TO INITIALIZE THE FIELD</span></div><div class="stage-foot"><div class="legend"><strong id="particleCount">0</strong><br>particles · force field active</div><div class="camera"><span class="camera-label">CAMERA / OPTIONAL</span><video id="video" autoplay muted playsinline></video></div></div></section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
      const canvas=document.querySelector('#stage'), stage=document.querySelector('.stage'), renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
      const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.1,100);camera.position.z=20;const group=new THREE.Group();scene.add(group);let points=null,targets=[],velocities=[],scatterMode=true,restorePower=0,hand={x:0,y:0,active:false},clock=0;
      const resize=()=>{const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()};addEventListener('resize',resize);resize();
      const gradientImage=()=>{const c=document.createElement('canvas');c.width=340;c.height=230;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,c.width,c.height);g.addColorStop(0,'#5ce1e6');g.addColorStop(.45,'#6f76fa');g.addColorStop(1,'#f28ac7');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);x.fillStyle='rgba(5,10,24,.28)';x.beginPath();x.arc(250,55,60,0,Math.PI*2);x.fill();x.fillStyle='#eef9ff';x.font='bold 36px system-ui';x.fillText('FLOW',26,128);return c};
      function readImage(image){const density=Number(document.querySelector('#density').value),maxW=76,maxH=52,scale=Math.min(maxW/image.width,maxH/image.height,1),w=Math.max(12,Math.floor(image.width*scale)),h=Math.max(12,Math.floor(image.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(image,0,0,w,h);const data=ctx.getImageData(0,0,w,h).data;targets=[];velocities=[];const positions=[],colors=[];for(let y=0;y<h;y+=1){for(let x=0;x<w;x+=1){const i=(y*w+x)*4;if(data[i+3]<40)continue;const px=(x/w-.5)*15,py=(.5-y/h)*10;targets.push(new THREE.Vector3(px,py,0));velocities.push(new THREE.Vector3((Math.random()-.5)*.03,(Math.random()-.5)*.03,(Math.random()-.5)*.03));positions.push(px+(Math.random()-.5)*22,py+(Math.random()-.5)*15,(Math.random()-.5)*9);colors.push(data[i]/255,data[i+1]/255,data[i+2]/255)}}
        if(points)group.remove(points);const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));const mat=new THREE.PointsMaterial({size:Math.max(.055,.16-density*.012),vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false});points=new THREE.Points(geo,mat);group.add(points);scatterMode=true;restorePower=0;document.querySelector('#particleCount').textContent=targets.length.toLocaleString();document.querySelector('#message').classList.add('hide');document.querySelector('#progress').textContent='0%';}
      const source=gradientImage();readImage(source);document.querySelector('#file').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const img=new Image();img.onload=()=>readImage(img);img.src=URL.createObjectURL(f)});
      document.querySelector('#density').addEventListener('input',e=>{document.querySelector('#densityValue').textContent=`${e.target.value} px`});document.querySelector('#restore').addEventListener('click',()=>{scatterMode=false;restorePower=1;document.querySelector('#gesture').textContent='鼠标吸引中'});document.querySelector('#scatter').addEventListener('click',()=>{scatterMode=true;restorePower=0;document.querySelector('#gesture').textContent='粒子散开'});document.querySelector('#complete').addEventListener('click',()=>{scatterMode=false;restorePower=1;document.querySelector('#gesture').textContent='完成 / 100%';targets.forEach((_,i)=>{if(points)points.geometry.attributes.position.setXYZ(i,targets[i].x,targets[i].y,0)})});
      canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();hand.x=(e.clientX-r.left)/r.width-.5;hand.y=.5-(e.clientY-r.top)/r.height;hand.active=true;if(scatterMode===false)document.querySelector('#gesture').textContent='鼠标吸引中'});
      const video=document.querySelector('#video');let handsApi=null;document.querySelector('#cameraButton').addEventListener('click',async e=>{if(!navigator.mediaDevices?.getUserMedia){document.querySelector('#gesture').textContent='需 HTTP 摄像头';return}try{video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}});if(window.Hands){handsApi=new window.Hands({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});handsApi.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.55});handsApi.onResults(results=>{const lm=results.multiHandLandmarks?.[0];if(!lm){hand.active=false;return}hand.x=.5-lm[9].x;hand.y=.5-lm[9].y;const tips=[8,12,16,20],open=tips.filter(i=>lm[i].y<lm[i-2].y).length>=3;hand.active=open;scatterMode=!open;if(open){restorePower=Math.min(1,restorePower+.015);document.querySelector('#gesture').textContent='张开手掌 / 还原'}else{restorePower=0;document.querySelector('#gesture').textContent='握拳 / 暂停'}});const loop=async()=>{if(handsApi&&video.readyState>=2)await handsApi.send({image:video});requestAnimationFrame(loop)};loop()}e.currentTarget.textContent='摄像头已开启'}catch(err){document.querySelector('#gesture').textContent='摄像头被拒绝'}});
      function animate(){requestAnimationFrame(animate);clock+=.01;if(!points)return;const position=points.geometry.attributes.position;let near=0;for(let i=0;i<targets.length;i++){const p=new THREE.Vector3(position.getX(i),position.getY(i),position.getZ(i));const t=targets[i];if(scatterMode){p.add(velocities[i]);if(Math.abs(p.x)>18)velocities[i].x*=-1;if(Math.abs(p.y)>12)velocities[i].y*=-1;p.multiplyScalar(.998)}else{const dx=hand.x*15-p.x,dy=hand.y*10-p.y,force=Math.max(0,.12-Math.hypot(dx,dy)*.004);p.x+=dx*force*restorePower;p.y+=dy*force*restorePower;p.z*=.94;p.x+=(t.x-p.x)*(.008+restorePower*.018);p.y+=(t.y-p.y)*(.008+restorePower*.018);p.z+=(t.z-p.z)*.008}const dist=Math.hypot(p.x-t.x,p.y-t.y);if(dist<.22)near++;position.setXYZ(i,p.x,p.y,p.z)}position.needsUpdate=true;document.querySelector('#progress').textContent=`${Math.round(near/targets.length*100)}%`;group.rotation.y=Math.sin(clock*.25)*.05;renderer.render(scene,camera)}animate();
    </script>
  </body>
</html>
