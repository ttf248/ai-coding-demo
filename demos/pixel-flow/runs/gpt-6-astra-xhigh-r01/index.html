<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js" onerror="document.getElementById('status').textContent='Three.js CDN 加载失败，请检查网络并刷新。'"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);if(!window.THREE)return;const holder=$('viewport'),scene=new THREE.Scene();let renderer;try{renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));holder.append(renderer.domElement)}catch(e){$('status').textContent='WebGL 不可用：'+e.message;return}const camera=new THREE.OrthographicCamera(-3,3,3,-3,.1,100);camera.position.z=8;const group=new THREE.Group();scene.add(group);const clock=new THREE.Clock(),sample=document.createElement('canvas'),sctx=sample.getContext('2d',{willReadFrequently:true});let imageSource=null,points=null,original=new Float32Array(),positions=new Float32Array(),colors=new Float32Array(),settled=new Float32Array(),seeds=new Float32Array(),hand=null,stream=null,landmarker=null,processing=false,starting=false,lastVideo=-1,lastDetection=0,all=false,pointer=false,field={x:0,y:0},stopped=false,uploadSequence=0;

$('upload').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')||file.size>20*1024*1024){$('status').textContent='请选择 20 MB 以内的有效图片。';return}const seq=++uploadSequence,url=URL.createObjectURL(file),img=new Image();try{img.src=url;await img.decode();if(seq!==uploadSequence)return;imageSource=img;build();resize()}catch{$('status').textContent='无法解码这张图片，请尝试 PNG、JPEG 或 WebP。'}finally{URL.revokeObjectURL(url)}};$('sampling').oninput=()=>{$('samplingValue').value=$('sampling').value;build()};$('scatter').onclick=scatter;$('restore').onclick=()=>{all=true;$('status').textContent='正在完整还原图片…'};

async function startCamera(){if(starting||stream)return;starting=true;$('camera').disabled=true;$('status').textContent='正在载入手部识别模型，首次加载可能需要一些时间…';try{if(!navigator.mediaDevices?.getUserMedia)throw Error('当前环境无法访问摄像头，请改用 HTTPS 或 localhost');if(!landmarker){const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs');const files=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm');landmarker=await vision.HandLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:location.protocol==='file:'?'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task':new URL('assets/hand_landmarker.task',location.href).href,delegate:'CPU'},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.55,minHandPresenceConfidence:.5,minTrackingConfidence:.5})}stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});$('video').srcObject=stream;await $('video').play();$('stop').disabled=false;$('cameraState').textContent='等待手部进入画面';$('status').textContent='摄像头已开启。张开手掌吸引，握拳暂停，捏合完整还原。'}catch(e){stopCamera();$('status').textContent='摄像头 / 模型启动失败：'+e.message+'。仍可使用鼠标、触摸和完整还原按钮。'}finally{starting=false;$('camera').disabled=!!stream}}

function animate(t){if(stopped)return;requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),time=clock.elapsedTime;detect(t);const active=pointer||hand?.active;ring.visible=!!active&&!all;ring.position.set(field.x,field.y,.5);ring.scale.setScalar(+$('radius').value);let complete=0;for(let i=0;i<settled.length;i++){const k=i*3,r=+$('radius').value,d=Math.hypot(positions[k]-field.x,positions[k+1]-field.y);if(all||(active&&d<r)){settled[i]=Math.min(1,settled[i]+dt*(all?1.5:(1-d/r)*1.8+.25))}const s=settled[i];if(s>.995)complete++;if(s>0&&(all||active||s>.995)){const strength=1-Math.exp(-dt*(2+s*8));for(let c=0;c<3;c++)positions[k+c]+=(original[k+c]-positions[k+c])*strength*s}if(s<.995){positions[k]+=Math.cos(time*.5+seeds[i])*dt*.13*(1-s);positions[k+1]+=Math.sin(time*.7+seeds[i])*dt*.11*(1-s);positions[k+2]+=Math.sin(time*.4+seeds[i])*dt*.09*(1-s)}}points.geometry.attributes.position.needsUpdate=true;$('bar').style.width=(settled.length?complete/settled.length*100:0)+'%';if(complete===settled.length&&complete)$('status').textContent='图片已还原。可以重新打散，或上传另一张照片。';renderer.render(scene,camera)}requestAnimationFrame(animate);window.addEventListener('pagehide',()=>{stopped=true;stopCamera();landmarker?.close();points?.geometry.dispose();points?.material.dispose();renderer.dispose()});window.lab={classify,scatter,get count(){return settled.length},get complete(){return Array.from(settled).filter(x=>x>.995).length},get cameraActive(){return !!stream},get positions(){return Array.from(positions)},get original(){return Array.from(original)}};
