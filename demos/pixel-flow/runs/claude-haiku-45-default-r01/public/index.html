<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Flow - Interactive Particle Visualization</title>
    <link rel="stylesheet" href="../src/styles/main.css">
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="header">
                <h1>Pixel Flow</h1>
                <p>Upload an image and use hand gestures to restore it from particles</p>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label for="imageInput">Upload Image:</label>
                    <input type="file" id="imageInput" accept="image/*" />
                </div>
                
                <div class="control-group">
                    <label for="particleCount">Particle Count:</label>
                    <input type="range" id="particleCount" min="100" max="5000" value="2000" />
                    <span id="particleCountDisplay">2000</span>
                </div>
                
                <div class="control-group">
                    <label>
                        <input type="checkbox" id="enableCamera" checked />
                        Enable Camera
                    </label>
                </div>
                
                <button id="resetBtn" class="btn btn-primary">Reset Particles</button>
                <button id="toggleAnimationBtn" class="btn btn-secondary">Pause Animation</button>
            </div>
            
            <div class="canvas-container">
                <canvas id="glCanvas"></canvas>
            </div>
            
            <div class="camera-container" id="cameraContainer">
                <video id="cameraFeed" playsinline></video>
                <canvas id="cameraCanvas"></canvas>
            </div>
            
            <div class="info-panel">
                <div class="info-item">
                    <span class="label">Hand Detected:</span>
                    <span id="handDetected" class="value">No</span>
                </div>
                <div class="info-item">
                    <span class="label">Restoration:</span>
                    <span id="restorationLevel" class="value">0%</span>
                </div>
                <div class="info-item">
                    <span class="label">FPS:</span>
                    <span id="fps" class="value">0</span>
                </div>
            </div>
            
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Loading...</p>
            </div>
        </div>
    </div>

    <script type="module" src="../src/main.js"></script>
</body>
</html>
