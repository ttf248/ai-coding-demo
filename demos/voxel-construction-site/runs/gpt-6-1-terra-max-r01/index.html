function makeLoader(){let g=addGroup(7,0,3.6);box(2.5,.6,1.5,M.dark,0,.7,0,g);box(1.6,.9,1.4,M.yellow,0,1.4,0,g);box(.8,.8,1.2,M.glass,-.35,2,0,g);wheel(g,-.9,-.85);wheel(g,-.9,.85);wheel(g,.9,-.85);wheel(g,.9,.85);let blade=addGroup(1.3,1,0,g);box(1.2,.18,.3,M.yellow,0,0,-.55,blade);box(1.2,.18,.3,M.yellow,0,0,.55,blade);box(.35,.8,1.5,M.darkDirt,.8,-.2,0,blade);return{g,blade}}const loader=makeLoader();function crane(x,z,h){let g=addGroup(x,0,z);box(1.2,h,1.2,M.yellow,0,h/2,0,g);for(let y=1;y<h;y+=1.5)box(1.5,.15,1.5,M.dark,y%2*.1,y,0,g);let head=addGroup(0,h,0,g);box(15,.45,.6,M.yellow,3,0,0,head);box(3,1,1.5,M.gray,-5,0,0,head);box(.12,4,.12,M.steel,8,-2,0,head);box(1.1,.8,1.1,M.orange,8,-4,0,head);return head}const cranes=[crane(3,-12,19),crane(15,-10,17)];let workers=[];function worker(x,z,helmet=M.yellow){let g=addGroup(x,0,z);box(.55,.7,.35,M.blue,0,.9,0,g);box(.45,.45,.35,M.white,0,1.5,0,g);box(.6,.2,.5,helmet,0,1.8,0,g);box(.18,.7,.2,M.dark,-.17,.3,0,g);box(.18,.7,.2,M.dark,.17,.3,0,g);workers.push(g)}for(const [x,z] of [[-5,2],[-2,1],[1,2],[6,1],[10,3],[15,4],[-17,-12],[-10,-11],[19,10],[-19,12]])worker(x,z);for(let x=-18;x<20;x+=7){box(.3,5,.3,M.dark,x,2.5,-14);box(.8,.35,.8,M.light,x,5,-14)}
