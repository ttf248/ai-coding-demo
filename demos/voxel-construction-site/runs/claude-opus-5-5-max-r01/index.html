function armIK(ex, r, h, bucketAngle) {

  const d = clamp(Math.hypot(r, h), Math.abs(L1 - L2) + 0.2, L1 + L2 - 0.2);
  const a2 = -Math.acos(clamp((d * d - L1 * L1 - L2 * L2) / (2 * L1 * L2), -1, 1));
  const a1 = Math.atan2(h, r) - Math.atan2(L2 * Math.sin(a2), L1 + L2 * Math.cos(a2));
  ex.boom.rotation.z = a1;
  ex.stick.rotation.z = a2;
  ex.bucket.rotation.z = bucketAngle - a1 - a2;

// Closed road made of straights and quarter arcs; s is the arc length along the centerline.
class LoopPath {
  constructor(x0, x1, z0, z1, r) {
    this.segs = [];
    const add = (s) => { s.s0 = this.length || 0; this.length = s.s0 + s.len; this.segs.push(s); };
    this.length = 0;
    add({ t: 'L', ax: x1 - r, az: z1, bx: x0 + r, bz: z1, len: x1 - x0 - 2 * r });
    add({ t: 'A', cx: x0 + r, cz: z1 - r, r, a0: Math.PI / 2, len: (Math.PI / 2) * r });
    add({ t: 'L', ax: x0, az: z1 - r, bx: x0, bz: z0 + r, len: z1 - z0 - 2 * r });
    add({ t: 'A', cx: x0 + r, cz: z0 + r, r, a0: Math.PI, len: (Math.PI / 2) * r });
    add({ t: 'L', ax: x0 + r, az: z0, bx: x1 - r, bz: z0, len: x1 - x0 - 2 * r });
    add({ t: 'A', cx: x1 - r, cz: z0 + r, r, a0: Math.PI * 1.5, len: (Math.PI / 2) * r });
    add({ t: 'L', ax: x1, az: z0 + r, bx: x1, bz: z1 - r, len: z1 - z0 - 2 * r });
    add({ t: 'A', cx: x1 - r, cz: z1 - r, r, a0: 0, len: (Math.PI / 2) * r });
  }
  at(s) {
    s = ((s % this.length) + this.length) % this.length;
    let seg = this.segs[0];
    for (const g of this.segs) if (s >= g.s0) seg = g;
    const u = s - seg.s0;
    if (seg.t === 'L') {
      const f = u / seg.len;
      return { x: seg.ax + (seg.bx - seg.ax) * f, z: seg.az + (seg.bz - seg.az) * f, h: Math.atan2(seg.bz - seg.az, seg.bx - seg.ax) };
    }
    const a = seg.a0 + u / seg.r;
    return { x: seg.cx + Math.cos(a) * seg.r, z: seg.cz + Math.sin(a) * seg.r, h: Math.atan2(Math.cos(a), -Math.sin(a)) };
  }
  sAtX(x, which) {
    const seg = this.segs[which];
    return seg.s0 + Math.abs(x - seg.ax);
  }
  sAtZ(z, which) {
    const seg = this.segs[which];
    return seg.s0 + Math.abs(z - seg.az);
  }
  // Distance of a point to the centerline (used to lay road tiles).
  dist(x, z) {
    let best = Infinity;
    for (const g of this.segs) {
      if (g.t === 'L') {
        const vx = g.bx - g.ax, vz = g.bz - g.az, l2 = vx * vx + vz * vz;
        const t = clamp(((x - g.ax) * vx + (z - g.az) * vz) / l2, 0, 1);
        best = Math.min(best, Math.hypot(x - g.ax - vx * t, z - g.az - vz * t));
      } else {
        const a = Math.atan2(z - g.cz, x - g.cx);
        const da = ((a - g.a0) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
        if (da <= Math.PI / 2) best = Math.min(best, Math.abs(Math.hypot(x - g.cx, z - g.cz) - g.r));
      }
    }
    return best;
  }
}

function sceneATraffic(ctx) {

  ctx.vehicles = vehicles;

  vehicles.push(mixer);

  const fwd = (a, b) => (((b - a) % L) + L) % L;
  const leaderGap = (v) => {

    for (const o of vehicles) if (o !== v && o.onLoop) { const d = fwd(v.s, o.s); if (d > 0.01 && d < best) best = d; }
    if (spur.owner && spur.owner !== v) { const d = fwd(v.s, S_DUMP - 2); if (d < best) best = d; }
    return best;
  };
  const clearAround = (s, back, ahead, self) => {
    for (const o of vehicles) if (o !== self && o.onLoop) { const d = fwd(s, o.s); if (d < ahead || d > L - back) return false; }
    return true;
  };
  const stopFor = (v) => (v.kind === 'mixer' ? S_MIX : v.load >= 0.999 ? S_DUMP : S_LOAD);
  const pose = (v) => {
    if (v.onLoop) { placeOnRoad(v.m, loop.at(v.s), ROADY); return; }
    const x = SP.x - R * Math.sin(v.th), z = SP.z - R * (1 - Math.cos(v.th));
    v.m.g.position.set(x, ROADY, z);
    v.m.g.rotation.y = -v.th;
  };
  const deposit = (x) => {
    for (const c of ctx.heapCells) {
      const w = Math.exp(-((c.cx - x) ** 2 + ((c.cz + 44.5) * 1.3) ** 2) / 22);
      const cap = c.cz > -42 ? G + 2.0 : G + 9;

  };
  ctx.upd.push((dt) => {
    for (const v of vehicles) {
      const cruise = v.kind === 'mixer' ? 6.5 : 11;
      if (v.onLoop && (v.state === 'drive')) {

        let dStop = fwd(v.s, stopS);

        v.v += clamp(target - v.v, -16 * dt, 7 * dt);
        const step = Math.min(v.v * dt, Math.max(0, lead - GAP + 0.3), dStop);
        v.s = (v.s + Math.max(0, step)) % L;

  const dy = ctx.deckY + 0.3;

    { task: 'signal', x: -4, z: 13.5, h: Math.PI * 1.1, vest: 0xe8e23a, helmet: 0xe23b2b, itemColor: 0x43a047 },

    pump.secs[0].rotation.z = 0.85 + Math.sin(t * 0.17) * 0.06;
    pump.secs[1].rotation.z = -0.95 + Math.sin(t * 0.21 + 1) * 0.1;
    pump.secs[2].rotation.z = -0.75 + Math.sin(t * 0.19 + 2) * 0.1;
    mix.drum.rotation.x += dt * 2.6;
    pump.hose.getWorldPosition(tmp);
    ctx.plumes[3].set(tmp.x, ctx.deckY + 1.6, tmp.z, 0.4);
    tmp.set(0, 6.2, 0); pump.g.localToWorld(tmp); halos.move(pumpHalo, tmp.x, tmp.y, tmp.z);
  });
  // North-bank excavator trimming the bank and growing a spoil heap.
  const exm = buildExcavator(root, 0.85, 0xf2b31d, 10, 8);
  const ex = new ExCtl(exm, {
    x: 36, z: -18, floor: G, digY: 7, heading: 0, dig: [30, -9], carryY: G + 5,
    chooseTarget: () => ({ obj: null, pos: () => [47, -28, G], receive: () => {
      for (const c of ctx.heapCells) { const w = Math.exp(-((c.cx - 48) ** 2 + (c.cz + 29) ** 2) / 14); setCellHeight(ctx, c, Math.min(G + 6, c.h + 0.35 * w)); }
      ctx.plumes[0].set(47, G + 1, -28, 0.6);
    } }),
    onDig(on) { if (on) ctx.plumes[0].set(30, 7.5, -9, 0.7); },
  });
  ctx.upd.push((dt) => ex.update(dt));
  // Workers.
  const crowd = new Crowd(root, 20);
  ctx.crowd = crowd;
  const deckW = [
    crowd.add({ task: 'tie', x: 5, z: 10.4, y: -100, h: 2, seg: 0 }), crowd.add({ task: 'tie', x: -5, z: 8.6, y: -100, h: -1, seg: 0 }),
    crowd.add({ task: 'tie', x: 4, z: 4.6, y: -100, h: 1, seg: 1 }), crowd.add({ task: 'hammer', x: -4, z: -0.4, y: -100, h: 0.4, seg: 2, itemColor: 0x444444 }),
  ];
  [
    { task: 'signal', x: -8, z: 21, h: Math.PI * 1.25, vest: 0xe8e23a, helmet: 0xe23b2b, itemColor: 0xe53935 },
    { task: 'hammer', x: -4, z: 15.5, y: 17.2, h: 0.2, itemColor: 0x444444 },
    { task: 'idle', x: 5, z: 16, y: 17.2, h: -1.2, vest: 0xb6e83a, helmet: 0xffffff },
    { task: 'patrol', path: [[-15, 45.3], [15, 45.3]], vest: 0x22324f, helmet: 0xffffff, speed: 1.6, rest: 2.5 },
    { task: 'walk', path: [[-58, 33], [-47, 33]], carry: true, itemColor: 0xb2513a, speed: 2 },
    { task: 'idle', x: 22, z: -21, h: 2.6, vest: 0xb6e83a, helmet: 0xffffff },
    { task: 'walk', path: [[-40, -24], [-12, -24]], speed: 1.7, rest: 3 },
    { task: 'bend', x: 20, z: 27, h: Math.PI },
  ].forEach((w) => crowd.add(w));
  const bargeW = [crowd.add({ task: 'signal', x: bargeX + 2, z: bargeZ + 3, y: 0, h: 0, vest: 0xff7a1a, helmet: 0xffd21f, itemColor: 0x43a047 }), crowd.add({ task: 'idle', x: bargeX - 4.8, z: bargeZ - 3.2, y: 0, h: 0.5 })];
  crowd.done();
  ctx.upd.push((dt, t) => {
    for (const w of deckW) w.y = placed.length > w.seg ? ctx.deckY + 1.2 : -100;
    for (const w of bargeW) w.y = barge.position.y + 1.0;
    crowd.update(dt, t);
  });
}

// ---------- time of day, weather, knobs, main loop ----------
const SKY = [
  { name: '黎明', top: 0x2d3f73, bottom: 0xf2a37c, sun: 0xffb184, sunI: 1.4, hs: 0x9aa7d6, hg: 0x4a3426, hi: 0.6, fog: 0xb98f86, exp: 1.0 },
  { name: '正午', top: 0x2f6fd6, bottom: 0xbfe0ff, sun: 0xfff4e2, sunI: 3.0, hs: 0xcfe3ff, hg: 0x5a4632, hi: 0.85, fog: 0xbcd3ea, exp: 1.0 },
  { name: '黄昏', top: 0x3b2a5e, bottom: 0xff8a4a, sun: 0xff9a55, sunI: 1.5, hs: 0xb08aa0, hg: 0x3a2618, hi: 0.5, fog: 0x9a6a64, exp: 1.05 },
  { name: '夜晚', top: 0x040713, bottom: 0x16203c, sun: 0x9fb4ff, sunI: 0.4, hs: 0x2a3a66, hg: 0x0c0a10, hi: 0.25, fog: 0x0c1222, exp: 1.3 },
];
const env = { phase: 0.12, rain: 0, rainTarget: 0, lights: 0 };
const cA = new THREE.Color(), cB = new THREE.Color();
const mixHex = (a, b, f, out) => out.set(a).lerp(cB.set(b), f);
function applyEnvironment(dt) {
  const p = env.phase, k = Math.floor(p * 4) % 4, f = smooth(0, 1, p * 4 - Math.floor(p * 4));
  const A = SKY[k], B = SKY[(k + 1) % 4];
  const r = env.rain;
  env.rain = approach(env.rain, env.rainTarget, 0.6, dt);
  env.name = f < 0.5 ? A.name : B.name;
  const lightsOn = Math.max(p < 0.5 ? 1 - smooth(0.0, 0.07, p) : smooth(0.5, 0.58, p), r * 0.85);
  env.lights = lightsOn;
  const night = p < 0.5 ? 1 - smooth(0, 0.05, p) : smooth(0.55, 0.68, p) * (1 - smooth(0.96, 1, p));
  mixHex(A.top, B.top, f, skyMat.uniforms.uTop.value).multiplyScalar(1 - r * 0.3);
  mixHex(A.bottom, B.bottom, f, skyMat.uniforms.uBottom.value).multiplyScalar(1 - r * 0.4);
  mixHex(A.sun, B.sun, f, skyMat.uniforms.uSunCol.value);
  skyMat.uniforms.uStars.value = night;
  skyMat.uniforms.uStorm.value = r * 0.85;
  const a = p * Math.PI * 2;
  const sunUp = Math.sin(a) > -0.05;
  const dir = sunUp ? new THREE.Vector3(Math.cos(a), Math.max(Math.sin(a), 0.2), 0.35) : new THREE.Vector3(-Math.cos(a), Math.max(-Math.sin(a), 0.35), -0.3);
  dir.normalize();
  skyMat.uniforms.uSunDir.value.copy(sunUp ? new THREE.Vector3(Math.cos(a), Math.sin(a), 0.35).normalize() : dir);
  sun.position.copy(dir).multiplyScalar(320);
  sun.target.position.set(0, 0, 0);
  mixHex(A.sun, B.sun, f, sun.color);
  sun.intensity = lerp(A.sunI, B.sunI, f) * (1 - r * 0.6);
  mixHex(A.hs, B.hs, f, hemi.color);
  mixHex(A.hg, B.hg, f, hemi.groundColor);
  hemi.intensity = lerp(A.hi, B.hi, f) * (1 - r * 0.25);
  mixHex(A.fog, B.fog, f, scene.fog.color).multiplyScalar(1 - r * 0.45);
  renderer.toneMappingExposure = lerp(A.exp, B.exp, f);
  deskLamp.intensity = night * 9000;
  const boost = 1 + r * 0.7;
  halos.pts.material.uniforms.uNight.value = lightsOn;
  halos.pts.material.uniforms.uBoost.value = boost;
  M.glass.emissiveIntensity = lightsOn * 1.3 * (1 + r * 0.5);
  M.lampOn.emissiveIntensity = 0.2 + lightsOn * 2.2 * boost;
  for (const s of ctx.spots) if (s) s.intensity = lightsOn * (s.isSpotLight ? 3200 : 900) * boost;
  for (const m of wetMats) {
    m.roughness = lerp(m.userData.base.rough, 0.2, r);
    m.color.copy(m.userData.base.color).multiplyScalar(1 - 0.3 * r);
    m.envMapIntensity = 0.35 + r * 0.9;
  }
  rain.mat.uniforms.uRain.value = r;
  rain.smat.uniforms.uRain.value = r;
  dust.mat.uniforms.uRain.value = r;
  waterUniforms.uRain.value = r;
  const dc = night > 0.5 ? 0x6a6458 : 0xc9b08a;
  dust.mat.uniforms.uCol.value.set(dc).lerp(cA.set(0xc9b08a), 1 - night);
}

let toastT = 0;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2200); }
let ctx = null;
function loadScene(i) {
  if (ctx) {
    scene.remove(ctx.root);
    const cachedGeo = new Set(geoCache.values());
    const sharedMat = new Set(Object.values(M));
    const seen = new Set();
    ctx.root.traverse((o) => {
      if (o.isInstancedMesh) o.dispose();
      if ((o.isMesh || o.isLine || o.isPoints) && o.geometry && !cachedGeo.has(o.geometry)) o.geometry.dispose();
      for (const m of [].concat(o.material || [])) {
        if (sharedMat.has(m) || seen.has(m)) continue;
        seen.add(m);
        if (m.map) m.map.dispose();
        m.dispose();
      }
    });
  }
  halos.clear();
  ctx = makeCtx(new THREE.Group());
  scene.add(ctx.root);
  if (i === 0) { sceneAStatic(ctx); sceneADynamic(ctx); } else { sceneBStatic(ctx); sceneBDynamic(ctx); }
  halos.dirty();
  ctx.root.traverse((o) => { if (o.isMesh && !o.isInstancedMesh && o.castShadow === undefined) o.castShadow = true; });
  $('#c-scene').textContent = KNOBS[3].states[i];
}
const SPEEDS = [0.5, 1, 2, 3], DUSTS = [0, 0.35, 0.66, 1];
function syncHud() {
  $('#c-speed').textContent = KNOBS[0].states[KNOBS[0].value];
  $('#c-dust').textContent = KNOBS[2].states[KNOBS[2].value];
  $('#c-rain').textContent = env.rainTarget ? '暴雨' : '晴';
  document.querySelectorAll('[data-knob]').forEach((b) => { const i = +b.dataset.knob; b.textContent = KNOBS[i].name + '：' + KNOBS[i].states[KNOBS[i].value]; });
  $('#btn-rain').classList.toggle('on', !!env.rainTarget);
}
function activateKnob(i) {
  const k = KNOBS[i];
  k.value = (k.value + 1) % k.states.length;
  syncKnob(i, true);
  if (i === 3) loadScene(k.value);
  syncHud();
  toast('旋钮「' + k.name + '」→ ' + k.states[k.value]);
}
function toggleRain() {
  env.rainTarget = env.rainTarget ? 0 : 1;
  syncHud();
  toast(env.rainTarget ? '暴雨来袭：地面湿滑反光，工地灯光增亮' : '雨停了');
}
const tipEl = $('#tip');
tipEl.style.transition = 'opacity .8s';
setTimeout(() => { tipEl.style.opacity = '0'; }, 14000);
let lastInput = performance.now();
const markInput = () => { lastInput = performance.now(); controls.autoRotate = false; };
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { markInput(); downAt = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(knobMeshes, false)[0];
  if (hit) activateKnob(hit.object.userData.knob);
});
renderer.domElement.addEventListener('wheel', markInput, { passive: true });
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); toggleRain(); markInput(); }
  else if (/^Digit[1-4]$/.test(e.code)) activateKnob(+e.code.slice(5) - 1);
});
document.querySelectorAll('[data-knob]').forEach((b) => b.addEventListener('click', () => activateKnob(+b.dataset.knob)));
$('#btn-rain').addEventListener('click', toggleRain);
$('#btn-view').addEventListener('click', () => { camera.position.copy(fitCamera()); controls.target.copy(HOME.target); controls.update(); markInput(); });
window.addEventListener('resize', () => {
  fitCamera();
  renderer.setSize(innerWidth, innerHeight);
});

function step(dt, t) {
  const sdt = dt * SPEEDS[KNOBS[0].value];
  for (const f of ctx.upd) f(sdt, t);
  for (const v of ctx.plumes) v.w *= Math.exp(-sdt * 1.4);
}
let simT = 0, last = performance.now(), fpsN = 0, fpsT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  simT += dt * SPEEDS[KNOBS[0].value];
  if (KNOBS[1].value === 1) env.phase = (env.phase + dt / 120) % 1;
  step(dt, simT);
  applyEnvironment(dt);
  for (const f of ctx.dyn) f();
  halos.dirty();
  const U = (m) => m.uniforms;
  const px = pixelScale();
  U(halos.pts.material).uTime.value = now / 1000;
  U(halos.pts.material).uPixel.value = px;
  U(dust.mat).uTime.value = now / 1000;
  U(dust.mat).uPixel.value = px;
  U(dust.mat).uAmount.value = DUSTS[KNOBS[2].value];
  ctx.plumes.forEach((v, i) => U(dust.mat).uPlume.value[i].copy(v));
  U(rain.mat).uTime.value = now / 1000;
  U(rain.smat).uTime.value = now / 1000;
  U(rain.smat).uPixel.value = px;
  skyMat.uniforms.uTime.value = now / 1000;
  waterUniforms.uTime.value = now / 1000;
  for (const k of KNOBS) k.cap.rotation.y += ((k.target ?? 0) - k.cap.rotation.y) * Math.min(1, dt * 10);
  if (now - lastInput > 6000) controls.autoRotate = true;
  controls.update();
  renderer.render(scene, camera);
  fpsN++; fpsT += dt;
  if (fpsT > 0.5) { $('#c-fps').textContent = Math.round(fpsN / fpsT); $('#c-phase').textContent = env.name + (KNOBS[1].value ? '' : '（暂停）'); fpsN = 0; fpsT = 0; }
  requestAnimationFrame(frame);
}

loadScene(0);
syncHud();
applyEnvironment(0);
$('#loading').hidden = true;
requestAnimationFrame(frame);

// Self-check hook: fast-forwards the simulation and reports vehicle overlaps (oriented 2D boxes).
window.voxelSite = {
  get ctx() { return ctx; }, env, activateKnob, toggleRain, camera, controls, KNOBS, renderer,
  look(px, py, pz, tx, ty, tz) { camera.position.set(px, py, pz); controls.target.set(tx, ty, tz); controls.update(); markInput(); },
  setPhase(p) { env.phase = p; },
  simulate(seconds, dt = 1 / 30) {
    const boxes = () => {
      const out = [];
      for (const v of ctx.vehicles || []) {
        const g = v.m.g, h = -g.rotation.y;
        out.push({ x: g.position.x, z: g.position.z, h, hl: v.m.len / 2 + 0.4, hw: 2.3, id: v.kind + (ctx.vehicles.indexOf(v)) });
      }
      return out;
    };
    const overlap = (a, b) => {
      const axes = [a.h, a.h + Math.PI / 2, b.h, b.h + Math.PI / 2];
      for (const ang of axes) {
        const ax = Math.cos(ang), az = Math.sin(ang);
        const proj = (o) => {
          const c = o.x * ax + o.z * az;
          const r = Math.abs(Math.cos(o.h) * ax + Math.sin(o.h) * az) * o.hl + Math.abs(-Math.sin(o.h) * ax + Math.cos(o.h) * az) * o.hw;
          return [c - r, c + r];
        };
        const pa = proj(a), pb = proj(b);
        if (pa[1] < pb[0] || pb[1] < pa[0]) return false;
      }
      return true;
    };
    let hits = 0, steps = 0, dumps = 0, loads = 0;
    const states = new Set();
    for (let t = 0; t < seconds; t += dt) {
      step(dt, simT += dt);
      steps++;
      const b = boxes();
      for (let i = 0; i < b.length; i++) for (let j = i + 1; j < b.length; j++) if (overlap(b[i], b[j])) hits++;
      for (const v of ctx.vehicles || []) { if (v.state === 'dumping' && !v._d) { dumps++; v._d = 1; } if (v.state !== 'dumping') v._d = 0; if (v.state === 'loading' && !v._l) { loads++; v._l = 1; } if (v.state !== 'loading') v._l = 0; states.add(v.state); }
    }
    return { steps, hits, dumps, loads, states: [...states] };
  },
};
</script>
