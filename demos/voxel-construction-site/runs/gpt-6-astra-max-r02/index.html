function road(t){const perimeter=120,d=((t%1)+1)%1*perimeter;if(d<36)return {x:-18+d,z:12,angle:Math.PI/2};if(d<60)return {x:18,z:12-(d-36),angle:Math.PI};if(d<96)return {x:18-(d-60),z:-12,angle:-Math.PI/2};return {x:-18,z:-12+(d-96),angle:0}}

const points=new Map();let pinch=0;renderer.domElement.addEventListener('pointerdown',e=>{lastInput=performance.now();points.set(e.pointerId,{x:e.clientX,y:e.clientY});renderer.domElement.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,moved:false};if(points.size===2){const p=[...points.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}});
