$('speed').onclick=()=>control(0);$('day').onclick=()=>control(1);$('dust').onclick=()=>control(2);$('rain').onclick=weather;$('reset').onclick=()=>{az=.6;el=.42;dist=83};const ray=new THREE.Raycaster();renderer.domElement.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY};renderer.domElement.setPointerCapture(e.pointerId);lastInput=clock.elapsedTime};renderer.domElement.onpointermove=e=>{if(!drag)return;az-=(e.clientX-drag.x)*.005;el=Math.max(.15,Math.min(1.1,el+(e.clientY-drag.y)*.005));drag.x=e.clientX;drag.y=e.clientY;lastInput=clock.elapsedTime};renderer.domElement.onpointerup=e=>{if(drag&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<5){ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),camera);const hit=ray.intersectObjects(knobs,false)[0];if(hit)control(hit.object.userData.control)}drag=null};renderer.domElement.onpointercancel=()=>drag=null;renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(48,Math.min(120,dist+e.deltaY*.06));lastInput=clock.elapsedTime},{passive:false});document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();weather()}});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});$('loading').remove();
// Animated box parts share batches as well as the static site voxels.
const proxies=[],byMaterial=new Map();scene.traverse(m=>{if(m.isMesh&&!m.isInstancedMesh&&m.geometry===box){if(!byMaterial.has(m.material))byMaterial.set(m.material,[]);byMaterial.get(m.material).push(m);m.layers.set(1);m.castShadow=false;}});
for(const[material,meshes]of byMaterial){const batch=new THREE.InstancedMesh(box,material,meshes.length);batch.castShadow=true;batch.receiveShadow=true;batch.frustumCulled=false;scene.add(batch);proxies.push({batch,meshes});}

function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;sim+=dt*speed;if(dayCycle)dayTime=(dayTime+dt/100)%1;const daylight=(Math.sin(dayTime*Math.PI*2)+1)/2;ambient.intensity=.65+daylight*1.8;sun.intensity=.15+daylight*3;sun.color.setHSL(.05+daylight*.08,.35,.7);sun.position.set(Math.cos(dayTime*Math.PI*2)*40,15+daylight*45,25);litMat.emissiveIntensity=(1-daylight)*2.8+(rain?1.5:.2);glowMat.uniforms.strength.value=(1-daylight)*1.5+(rain?.7:0);for(const l of lampPositions)if(l.isPointLight)l.intensity=(1-daylight)*60+(rain?35:3);dustMat.uniforms.time.value=sim;rainMat.uniforms.time.value=t;
diggers.forEach((d,i)=>{const a=sim*.8+i*Math.PI;d.top.rotation.y=Math.sin(a*.5)*.15;d.arm.rotation.x=.85+Math.sin(a)*.3;d.fore.rotation.x=.2+Math.cos(a)*.3;d.bucket.rotation.x=-.7+Math.sin(a+.8)*.45});cranes.forEach(c=>{c.arm.rotation.y=Math.sin(sim*.13+c.phase)*1.05;c.trolley.position.z=4+Math.sin(sim*.2+c.phase)*1.5;const drop=2.5+Math.sin(sim*.3+c.phase)*.7;c.cable.position.y=-drop/2;c.cable.scale.y=drop;c.load.position.y=-drop;});
for(const v of vehicles){if(v.wait>0){v.wait-=dt*speed;if(v.kind==='truck'&&v.station==='dump'){v.bed.rotation.x=-Math.sin(Math.max(0,v.wait)/2*Math.PI)*.4;v.load.visible=v.wait>1}if(v.wait<=0){if(v.station==='pickup'&&v.load)v.load.visible=true;v.bed.rotation.x=0;v.station=null;v.s=(v.s+.15)%total}}else{let move=dt*speed*3;for(const other of vehicles)if(other!==v){const gap=(other.s-v.s+total)%total;if(gap<8)move=0}if(v.kind==='truck')for(const[station,s]of[['pickup',0],['dump',stationDump]]){const remaining=(s-v.s+total)%total;if(remaining<=move){move=remaining;v.wait=2;v.station=station;break}}v.s=(v.s+move)%total}const p=routeAt(v.s);v.g.position.set(p.x,1.06,p.z);v.g.rotation.y=p.yaw;if(v.drum)v.drum.rotation.y=sim*.7}
