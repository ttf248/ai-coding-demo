<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Works · 体素微缩建筑工地</title>
    <style>
      :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#11100f;font-family:Inter,ui-sans-serif,system-ui,sans-serif}#webgl{width:100%;height:100%;display:block;cursor:grab}#webgl.dragging{cursor:grabbing}.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:20px;pointer-events:none}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.brand{display:flex;gap:12px;align-items:center}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#e3a64a;color:#281a0d;font-weight:900;box-shadow:0 8px 24px #0005}.eyebrow{margin:0;color:#aa9f90;font:10px ui-monospace,monospace;letter-spacing:.25em;text-transform:uppercase}.title{margin:6px 0 0;font-size:clamp(24px,3vw,38px);line-height:1;letter-spacing:-.05em}.status{display:flex;gap:9px;align-items:center;border:1px solid #d7c7ae33;background:#211f1bba;border-radius:999px;padding:9px 12px;color:#d6c8b2;font:10px ui-monospace,monospace;backdrop-filter:blur(16px)}.status i{width:7px;height:7px;border-radius:50%;background:#e3a64a;box-shadow:0 0 12px #e3a64a}.controlbar{pointer-events:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:18px}.console{border:1px solid #dac4a233;background:#201e1bbd;border-radius:18px;padding:13px;backdrop-filter:blur(18px);box-shadow:0 16px 50px #0006}.buttons{display:flex;gap:7px}.button{border:1px solid #d7c7ae2c;border-radius:10px;background:#ffffff08;color:#cfc3b1;padding:10px 12px;font-size:11px;cursor:pointer}.button:hover,.button.active{border-color:#e3a64a99;background:#e3a64a1c;color:#f1c37d}.slider{display:flex;align-items:center;gap:10px;margin-top:10px;color:#a99d8c;font-size:10px}.slider input{width:150px;accent-color:#e3a64a}.knobs{display:flex;gap:12px}.knob{pointer-events:auto;width:70px;height:70px;border:1px solid #d7c7ae33;border-radius:50%;background:radial-gradient(circle at 36% 30%,#6c5d49,#2a261f 60%,#171512 61%);box-shadow:inset 0 0 0 7px #181613,0 12px 28px #0008;display:grid;place-items:center;color:#dfb36c;font:10px ui-monospace,monospace;cursor:pointer}.knob:active{transform:rotate(24deg)}.caption{text-align:right;color:#b2a18a;font-size:11px;line-height:1.5}.caption strong{color:#ead7b9;font-size:16px}.note{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;border:1px solid #e3a64a55;border-radius:999px;background:#171410cc;padding:10px 14px;color:#f1c37d;font:10px ui-monospace,monospace;opacity:0;transition:.5s}.note.show{opacity:1}@media(max-width:650px){.ui{padding:12px}.status{font-size:0}.status i{margin:0}.controlbar{align-items:flex-end}.knobs{gap:6px}.knob{width:56px;height:56px;font-size:8px}.caption{display:none}.buttons{flex-wrap:wrap}.slider input{width:95px}}
    </style>
  </head>
  <body>
    <canvas id="webgl"></canvas>
    <div class="ui"><div class="row"><div class="brand"><span class="logo">VW</span><div><p class="eyebrow">MICRO BUILD / 07:24</p><h1 class="title">Voxel Works<span style="color:#e3a64a">.</span></h1></div></div><div class="status"><i></i><span id="statusText">SITE LIVE · DAY SHIFT</span></div></div><div class="controlbar"><div class="console"><p class="eyebrow">SCENE CONTROL / 场景控制</p><div class="buttons" style="margin-top:10px"><button class="button active" id="day">日间工地</button><button class="button" id="night">夜间雨暴 · 新场景</button><button class="button" id="dust">尘土 · ON</button></div><div class="slider"><span>设备速度</span><input id="speed" type="range" min=".2" max="2" value="1" step=".1"><span id="speedValue">1.0×</span></div></div><div class="knobs"><button class="knob" id="lightKnob">LIGHT<br>亮度</button><button class="knob" id="cycleKnob">CYCLE<br>昼夜</button></div><div class="caption"><strong id="fps">60</strong><br>target fps · SPACE = storm</div></div></div>
    <div id="note" class="note">雨暴场景已加载 · 灯光提升</div>
    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
      const canvas=document.querySelector('#webgl'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
      const scene=new THREE.Scene();scene.background=new THREE.Color('#a9b4bd');scene.fog=new THREE.Fog('#a9b4bd',45,130);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,180);let yaw=.55,pitch=.45,dist=52,target=new THREE.Vector3(0,3,0),drag=false,last=[0,0],auto=true,storm=false,dustOn=true,speed=1,cycle=true,clock=0;
      const hemi=new THREE.HemisphereLight('#e2efff','#3b281f',2.5);scene.add(hemi);const sun=new THREE.DirectionalLight('#ffe4b0',4.5);sun.position.set(-25,45,22);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const flood=new THREE.PointLight('#ffc46c',0,32,2);flood.position.set(0,14,0);scene.add(flood);
      const mat=(color,rough=0.8,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});const wood=mat('#31251c'),sand=mat('#806c4d'),concrete=mat('#9ca09b'),dark=mat('#222322'),road=mat('#3a3d3a'),yellow=mat('#e3a64a'),red=mat('#b94b37'),blue=mat('#3e79a5'),green=mat('#4e7659'),glass=mat('#9bbcc0',.22,.3),warm=mat('#ffc778',.35);
      const world=new THREE.Group();scene.add(world);const workbench=new THREE.Mesh(new THREE.BoxGeometry(68,2,58),wood);workbench.position.y=-1.8;workbench.receiveShadow=true;world.add(workbench);const slab=new THREE.Mesh(new THREE.BoxGeometry(61,.5,51),sand);slab.position.y=-.55;slab.receiveShadow=true;world.add(slab);
      function cube(w,h,d,material,x,y,z,group=world){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;group.add(m);return m}function voxels(material,count,area,baseY=.1){const g=new THREE.Group();for(let i=0;i<count;i++){const s=.18+Math.random()*.3;cube(s,s,s,material,(Math.random()-.5)*area.x,baseY+Math.random()*area.y,(Math.random()-.5)*area.z,g)}world.add(g);return g}
      // Workbench details: blueprint, tape, helmet and level, all generated from primitive shapes.
      const paper=mat('#c9c0a6');cube(9,.06,5,paper,-22,-.25,20);for(let i=0;i<4;i++)cube(7-i*1.4,.015,.04,mat('#5d7692'),-22,-.2,18.5+i*.7);const tape=cube(1.4,.35,1.4,yellow,22,-.05,20);tape.rotation.y=.3;for(let i=0;i<3;i++)cube(.18,.16,.18,mat('#d6d6c2'),22,-.02+i*.16,20.6);const helmet=new THREE.Mesh(new THREE.SphereGeometry(1.35,8,4,0,Math.PI*2,0,Math.PI/2),yellow);helmet.position.set(25,.7,20);helmet.castShadow=true;world.add(helmet);cube(3,.14,.4,mat('#b2b5ac',.25,.65),-25,.1,20);
      // Zones and temporary structures.
      cube(19,.12,12,road,-12,.04,-10);cube(3.5,.13,27,road,14,.05,5);cube(15,.12,10,mat('#614d35'),0,.04,14);for(let x=-17;x<=17;x+=4)cube(.12,.15,7,mat('#d7a44d'),x,.2,-4);const pit=cube(14,1.6,10,mat('#59432e'),-13,-.15,2);cube(13,.16,9,mat('#312b22'),-13,.7,2);for(let i=0;i<8;i++)cube(.18,.18,8,red,-18+i*1.4,.9,2);for(let i=0;i<8;i++)cube(8,.22,.18,red,-13,1.05,-2+i*.9);
      // Tower base and scaffold.
      for(let x=-2;x<=5;x+=1.2)for(let z=5;z<=11;z+=1.2){cube(.8,1.6,.8,concrete,x,.8,z);if(Math.random()>.2)cube(.68,.08,.68,red,x,1.65,z)}for(let y=2;y<11;y+=2)for(const z of[5,11])cube(.12,1.7,.12,blue,7,y,z);for(let y=2;y<11;y+=2)cube(7,.12,.12,blue,7,y,8);for(let i=0;i<7;i++)cube(3.8,1.3,.16,concrete,-5,.7,7+i*.02);
      // Portable site office with warm windows.
      cube(10,3.4,5,blue,17,1.7,-7);cube(10.4,.25,5.4,dark,17,3.48,-7);for(let x=14.3;x<20.3;x+=2)cube(1.2,1,0.12,warm,x,2,-4.43);cube(1.5,2,.12,red,17,1.05,-4.44);for(let i=0;i<5;i++)cube(.8,.8,.8,concrete,24+i*.85,.45,-1.5);for(let i=0;i<4;i++)cube(1.5,.8,.8,red,24+i*1.6,.45,1);
      // Instanced voxel material pile for repeated details.
      const blockGeo=new THREE.BoxGeometry(.65,.65,.65),blockMesh=new THREE.InstancedMesh(blockGeo,mat('#c47f4e'),34);const temp=new THREE.Object3D();for(let i=0;i<34;i++){const x=20+(i%5)*.8,z=7+Math.floor(i/5)*.8;temp.position.set(x,.4+(i%3)*.65,z);temp.rotation.y=(i%4)*.3;temp.updateMatrix();blockMesh.setMatrixAt(i,temp.matrix)}blockMesh.castShadow=true;world.add(blockMesh);
      // Reusable crane silhouette.
      const cranes=[];function crane(x,z,scale=1){const g=new THREE.Group();g.position.set(x,0,z);cube(.55,17,.55,blue,0,8.5,0,g);cube(20,.4,.45,yellow,5,17,0,g);cube(.35,.35,.35,red,15,16.8,0,g);for(let i=-8;i<14;i+=2)cube(.08,1.4,.08,blue,i+5,16.2,0,g);const arm=new THREE.Group();arm.position.set(0,15,0);g.add(arm);const rope=cube(.06,7,.06,concrete,9,-3.5,0,arm);const load=cube(1.1,1.1,1.1,yellow,9,-7,0,arm);g.userData={arm,rope,load,home:9};world.add(g);cranes.push(g)}crane(-1,5,1);crane(10,8,.8);
      const machines=[];function excavator(x,z){const g=new THREE.Group();g.position.set(x,0,z);cube(2.8,1.1,1.8,yellow,0,1,0,g);cube(1.2,1.2,1.3,glass,.5,1.9,0,g);const arm=cube(2.7,.38,.38,yellow,1.8,2.1,0,g);arm.rotation.z=-.35;const bucket=cube(1.2,.8,1.3,yellow,3,1.25,0,g);bucket.rotation.z=.4;for(const xx of[-.9,.9])for(const zz of[-.55,.55]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.32,8),dark);wheel.rotation.z=Math.PI/2;wheel.position.set(xx,.48,zz);wheel.castShadow=true;g.add(wheel)}g.userData={arm,bucket,phase:Math.random()*4};world.add(g);machines.push(g)}excavator(-23,2);excavator(-20,4);function truck(x,z){const g=new THREE.Group();g.position.set(x,0,z);cube(3.6,1.2,1.8,red,0,1,0,g);cube(1.2,1.1,1.5,glass,-1.1,1.8,0,g);cube(2.3,1.1,1.5,mat('#8d4a35'),.8,1.8,0,g);for(const xx of[-1.2,1.25])for(const zz of[-.7,.7]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,.3,8),dark);wheel.rotation.z=Math.PI/2;wheel.position.set(xx,.4,zz);g.add(wheel)}g.userData.phase=Math.random()*4;world.add(g);machines.push(g)}truck(-13,-10);truck(-6,-10);
      // Voxel workers and warning flags.
      const workerMat=mat('#d2a16a'),vest=mat('#f0bd45');for(let i=0;i<20;i++){const x=-18+Math.random()*34,z=-1+Math.random()*16;const g=new THREE.Group();g.position.set(x,0,z);cube(.45,1,.38,workerMat,0,1.15,0,g);cube(.65,.65,.5,vest,0,.72,0,g);cube(.7,.15,.7,dark,0,1.7,0,g);world.add(g)}for(let x=-28;x<=28;x+=4){cube(.08,2.3,.08,red,x,1.1,24);const flag=cube(1.2,.45,.05,red,x+.55,2,24);flag.rotation.y=(x%8)*.03;}
      // Dust and rain point systems.
      const dustPos=new Float32Array(800*3),rainPos=new Float32Array(700*3);for(let i=0;i<800;i++){dustPos[i*3]=(Math.random()-.5)*52;dustPos[i*3+1]=.4+Math.random()*11;dustPos[i*3+2]=(Math.random()-.5)*38;}for(let i=0;i<700;i++){rainPos[i*3]=(Math.random()-.5)*56;rainPos[i*3+1]=Math.random()*35;rainPos[i*3+2]=(Math.random()-.5)*42;}const dustGeo=new THREE.BufferGeometry();dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:'#d6b182',size:.07,transparent:true,opacity:.42}));world.add(dust);const rainGeo=new THREE.BufferGeometry();rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:'#9fc8e3',size:.09,transparent:true,opacity:.65}));rain.visible=false;world.add(rain);
      function cameraUpdate(){camera.position.set(Math.cos(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist+4,Math.sin(yaw)*Math.cos(pitch)*dist);camera.lookAt(target)}function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);canvas.addEventListener('pointerdown',e=>{drag=true;last=[e.clientX,e.clientY];canvas.classList.add('dragging')});addEventListener('pointerup',()=>{drag=false;canvas.classList.remove('dragging')});addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-last[0])*.005;pitch+=(e.clientY-last[1])*.004;pitch=Math.max(.15,Math.min(.85,pitch));last=[e.clientX,e.clientY]});canvas.addEventListener('wheel',e=>{dist=Math.max(30,Math.min(78,dist+e.deltaY*.04))});
      function setStorm(value){storm=value;rain.visible=storm;scene.background.set(storm?'#182331':'#a9b4bd');scene.fog.color.set(storm?'#182331':'#a9b4bd');hemi.intensity=storm?.85:2.5;sun.intensity=storm?.8:4.5;flood.intensity=storm?35:0;document.querySelector('#statusText').textContent=storm?'SITE LIVE · NIGHT STORM':'SITE LIVE · DAY SHIFT';document.querySelector('#day').classList.toggle('active',!storm);document.querySelector('#night').classList.toggle('active',storm);document.querySelector('#note').classList.add('show');setTimeout(()=>document.querySelector('#note').classList.remove('show'),1900)}document.querySelector('#day').onclick=()=>setStorm(false);document.querySelector('#night').onclick=()=>setStorm(true);document.querySelector('#dust').onclick=e=>{dustOn=!dustOn;dust.visible=dustOn;e.currentTarget.textContent=`尘土 · ${dustOn?'ON':'OFF'}`;e.currentTarget.classList.toggle('active',dustOn)};document.querySelector('#speed').oninput=e=>{speed=Number(e.target.value);document.querySelector('#speedValue').textContent=`${speed.toFixed(1)}×`};document.querySelector('#lightKnob').onclick=()=>{flood.intensity=flood.intensity?0:storm?35:12};document.querySelector('#cycleKnob').onclick=()=>{cycle=!cycle;auto=cycle};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setStorm(!storm)}});
      function animate(){requestAnimationFrame(animate);const dt=.016;clock+=dt;if(auto&&!drag)yaw+=.0007*speed;if(cycle&&!drag){const day=(Math.sin(clock*.06)+1)/2;sun.position.y=30+day*35;sun.intensity=storm?.8:2.6+day*2}cameraUpdate();cranes.forEach((g,i)=>{g.userData.arm.rotation.y=Math.sin(clock*speed*.45+i)*.38;g.userData.rope.scale.y=.7+Math.sin(clock*speed+i)*.12;g.userData.load.position.y=-7+Math.sin(clock*speed+i)*.8});machines.forEach((g,i)=>{const p=g.userData.phase??0;if(g.userData.arm){g.userData.arm.rotation.z=-.35+Math.sin(clock*speed+p)*.25;g.userData.bucket.rotation.z=.4+Math.sin(clock*speed+p)*.22}else{g.position.x=-13+((clock*speed*.8+p*4)%30);if(g.position.x>17)g.position.x=-13}});const dp=dust.geometry.attributes.position;for(let i=0;i<800;i++){let y=dp.getY(i)+.006*speed;if(y>12)y=0;dp.setY(i,y);dp.setX(i,dp.getX(i)+Math.sin(clock+i)*.001)}dp.needsUpdate=true;const rp=rain.geometry.attributes.position;if(storm)for(let i=0;i<700;i++){let y=rp.getY(i)-.45*speed;if(y<0)y=35;rp.setY(i,y)}rp.needsUpdate=true;renderer.render(scene,camera)}cameraUpdate();animate();
    </script>
