      warmLamps.forEach((l,i)=>{l.intensity=(1-day)*(state.storm ? .9 : .65)*(i===2 ? .7 : 1);});glows.forEach(g=>{g.material.uniforms.uOpacity.value=(1-day)*(state.storm ? .72 : .36);});
      dust.material.uniforms.uTime.value=now/1000;rain.material.uniforms.uTime.value=now/1000;
      if(!state.paused&&state.speed>0){const motion=state.speed*(state.storm ? .62 : 1);craneTurn.rotation.y=Math.sin(now*.00012*motion)*.42;trolley.position.x=Math.sin(now*.00022*motion)*1.25;
        const len=1.1+(Math.sin(now*.0004)*.5+.5)*.8;cable.scale.y=len;cable.position.y=-len/2;hook.position.y=-len-.12;
        excavators.forEach(e=>{const t=now*.001*Math.max(.25,motion)+e.phase;e.arm.rotation.z=Math.sin(t*.75)*.19-.12;e.fore.rotation.z=Math.cos(t*.85)*.27+.18;e.bucket.rotation.z=Math.sin(t*.8)*.2;});
        vehicles.forEach(v=>{const p=routePoint(now*.001*motion*(v.mixer ? .72 : .95)+v.offset);v.root.position.set(p.x,.86,p.z);v.root.rotation.y=p.yaw;v.wheels.forEach(w=>{w.rotation.y+=dt*motion*2.2;});if(!v.mixer)v.cargo.rotation.x=Math.sin(now*.0001+v.offset)>.86&&p.x>7?-.16:0;});
        loader.position.x=2.7+Math.sin(now*.00036*motion)*.85;loaderBucket.rotation.x=Math.sin(now*.00055)*.1;loaderWheels.forEach(w=>{w.rotation.y+=dt*motion*1.4;});
        workers.forEach((w,i)=>{const t=now*.002*motion+w.phase,s=w.scale,left=Math.sin(t)*.22,right=Math.cos(t*.82)*.22;
          [-1,1].forEach((side,j)=>{const arm=j?right:left,k=i*2+j,leg=j?-Math.sin(t)*.12:Math.sin(t)*.12;
            setWorkerPart(workerArms,k,w.x+side*.17*s+Math.sin(arm)*.18*s,.84+.51*s-Math.cos(arm)*.18*s,w.z,.09*s,.36*s,.1*s,0,0,arm);
            setWorkerPart(workerLegs,k,w.x+side*.07*s,.84+.15*s-Math.cos(leg)*.13*s,w.z-Math.sin(leg)*.13*s,.09*s,.27*s,.11*s,leg);});
        });
        workerArms.instanceMatrix.needsUpdate=true;workerLegs.instanceMatrix.needsUpdate=true;
      }
      const mins=Math.floor((state.clock*24*60+360)%(24*60));clockNode.textContent=String(Math.floor(mins/60)).padStart(2,"0")+":"+String(mins%60).padStart(2,"0");updateCamera();renderer.render(scene,camera);
      fpsFrames++;if(now-fpsTime>850){document.getElementById("fps").textContent=Math.round(fpsFrames*1000/(now-fpsTime))+" FPS";fpsFrames=0;fpsTime=now;}
    };requestAnimationFrame(render);
    window.addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.25));renderer.setSize(innerWidth,innerHeight);});
  })();
  </script>
