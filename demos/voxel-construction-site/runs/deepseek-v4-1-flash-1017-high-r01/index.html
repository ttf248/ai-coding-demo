<!doctype html>
<html lang="zh-CN">
<head>
<script src="../../../../assets/analytics.js" defer></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voxel Site · 体素微缩建筑工地</title>
<style>
  :root {
    --ink: #e9eef6;
    --muted: #9aa9bb;
    --panel: rgba(10, 14, 20, .78);
    --line: rgba(155, 183, 213, .18);
    --accent: #ffb347;
    --accent-2: #66d9ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070b; }
  body {
    color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 42%, transparent 36%, rgba(2, 4, 8, .48) 100%);
  }
  .top {
    position: fixed; left: 16px; top: 14px; right: 16px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    pointer-events: none;
  }
  .title {
    pointer-events: auto;
    background: linear-gradient(145deg, rgba(15, 21, 30, .82), rgba(8, 12, 18, .7));
    border: 1px solid var(--line); border-radius: 16px;
    padding: 12px 15px; max-width: 420px;
    box-shadow: 0 20px 50px rgba(0,0,0,.38);
  }
  .title h1 { margin: 0; font-size: 15px; letter-spacing: .14em; font-weight: 800; }
  .title h1 span { color: var(--accent); }
  .title p { margin: 5px 0 0; font-size: 11px; line-height: 1.6; color: var(--muted); }
  .pills { display: flex; flex-wrap: wrap; gap: 7px; justify-content: flex-end; pointer-events: auto; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 10px;
    font-size: 11px; color: #c6d6e6; white-space: nowrap;
  }
  .pill b { color: var(--ink); font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 8px currentColor; }
  .bottom {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    width: min(960px, calc(100% - 24px));
    background: linear-gradient(160deg, rgba(13, 18, 26, .9), rgba(7, 10, 15, .82));
    border: 1px solid var(--line); border-radius: 18px;
    padding: 10px 12px; box-shadow: 0 24px 60px rgba(0,0,0,.5);
    backdrop-filter: blur(4px);
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .group { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .divider { width: 1px; align-self: stretch; min-height: 26px; background: var(--line); }
  button {
    font: inherit; font-size: 11px; color: var(--ink);
    background: rgba(32, 44, 60, .72); border: 1px solid rgba(130, 166, 204, .24);
    border-radius: 9px; padding: 7px 9px; cursor: pointer;
    transition: background .15s, border-color .15s, transform .08s;
  }
  button:hover { background: rgba(44, 61, 82, .82); border-color: rgba(130, 190, 240, .45); }
  button:active { transform: translateY(1px); }
  button.on { background: rgba(255, 179, 71, .18); border-color: rgba(255, 179, 71, .55); color: #ffd9a0; }
  button.rain.on { background: rgba(102, 217, 255, .16); border-color: rgba(102, 217, 255, .5); color: #bdeeff; }
  .field { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .field strong { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
  input[type="range"] { width: 96px; accent-color: var(--accent); }
  .hint { margin-top: 7px; font-size: 10px; color: var(--muted); text-align: center; line-height: 1.5; }
  .hint b { color: #d6e6f5; font-weight: 600; }
  .loading {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 38%, #0d1722, #04070b 72%);
    transition: opacity .6s ease;
  }
  .loading.hide { opacity: 0; pointer-events: none; }
  .loading .box { text-align: center; max-width: 460px; padding: 24px; }
  .spinner {
    width: 38px; height: 38px; margin: 0 auto 16px;
    border-radius: 50%; border: 2px solid rgba(255, 179, 71, .18);
    border-top-color: var(--accent); animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading h2 { margin: 0; font-size: 16px; letter-spacing: .08em; }
  .loading p { margin: 8px 0 0; font-size: 12px; line-height: 1.7; color: var(--muted); }
  .toast {
    position: fixed; left: 50%; top: 92px; transform: translateX(-50%);
    background: rgba(9, 13, 20, .86); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 13px; font-size: 11px; color: #d6e6f5;
    opacity: 0; transition: opacity .25s ease; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  .error {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: rgba(4,7,11,.96); padding: 24px;
  }
  .error[hidden] { display: none; }
  .error div { max-width: 560px; border: 1px solid #6b3c35; background: #1b1010; color: #ffd6cd; border-radius: 12px; padding: 18px; font-size: 14px; line-height: 1.75; }
  .error b { color: #ff8d7e; }
  @media (max-width: 760px) {
    .top { left: 10px; top: 10px; right: 10px; }
    .title { padding: 9px 11px; max-width: 270px; }
    .title h1 { font-size: 12px; }
    .title p { display: none; }
    .pills .optional { display: none; }
    .bottom { bottom: 8px; width: calc(100% - 16px); padding: 8px; border-radius: 15px; }
    .controls { gap: 6px; }
    .group { gap: 5px; }
    button { padding: 6px 8px; font-size: 10.5px; }
    input[type="range"] { width: 72px; }
    .field strong { min-width: 36px; }
    .hint { display: none; }
    .divider { display: none; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="可交互的体素建筑工地沙盘"></canvas>
<div class="vignette"></div>

<div class="top">
  <div class="title">
    <h1>VOXEL SITE <span>· 微缩建筑工地</span></h1>
    <p>Three.js 体素沙盘：挖掘机、渣土车、塔吊、搅拌车与昼夜循环。拖动环视，滚轮缩放，点击桌前三枚实体旋钮调节设备速度、昼夜与尘土。</p>
  </div>
  <div class="pills">
    <span class="pill optional"><span class="dot"></span><b id="fps">--</b> FPS</span>
    <span class="pill"><b id="time-label">上午</b></span>
    <span class="pill"><b id="weather-label">晴</b></span>
  </div>
</div>

<div class="bottom">
  <div class="controls">
    <div class="group">
      <label class="field">机械速度 <input id="speed" type="range" min="0" max="2" step="0.05" value="1" /><strong id="speed-out">1.00×</strong></label>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <div class="group">
      <label class="field">时间 <input id="time" type="range" min="0" max="1" step="0.002" value="0.36" /><strong id="time-out">上午</strong></label>
      <button id="cycle" class="on">昼夜循环</button>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <div class="group">
      <label class="field">尘土 <input id="dust" type="range" min="0" max="1" step="0.01" value="0.55" /><strong id="dust-out">55%</strong></label>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <div class="group">
      <button id="rain" class="rain">暴雨 <span style="opacity:.55">(Space)</span></button>
      <button id="orbit" class="on">自动环绕</button>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <div class="group">
      <button id="focus-main" class="on">主工地</button>
      <button id="focus-bridge">新增场景 · 桥梁</button>
      <button id="reset-camera">复位视角</button>
    </div>
  </div>
  <div class="hint"><b>拖动</b> 环视 · <b>滚轮</b> 缩放 · <b>点击桌前旋钮</b> 调速 / 昼夜 / 尘土 · <b>空格</b> 暴雨 · 所有机械限定在沙盘范围内</div>
</div>

<div class="toast" id="toast"></div>

<div class="loading" id="loading">
  <div class="box">
    <div class="spinner"></div>
    <h2>正在搭建体素工地</h2>
    <p id="loading-text">加载 Three.js、生成程序化纹理与实例化模型…</p>
  </div>
</div>

<div class="error" id="error" hidden>
  <div><b>无法启动 3D 工地</b><br /><span id="error-message"></span><br /><br />请确认浏览器已启用 WebGL，并使用较新版本的 Chrome / Edge / Firefox。</div>
</div>

<script>
  setTimeout(() => {
    const el = document.getElementById("loading");
    if (!window.__voxelReady && el && !el.classList.contains("hide")) {
      document.getElementById("loading-text").textContent = "无法加载 Three.js。请检查网络连接后刷新页面。";
    }
  }, 12000);
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

(() => {
  "use strict";
  const canvas = document.getElementById("scene");
  const loading = document.getElementById("loading");
  const loadingText = document.getElementById("loading-text");
  const errorBox = document.getElementById("error");
  const errorMessage = document.getElementById("error-message");
  const toastEl = document.getElementById("toast");
  const fpsEl = document.getElementById("fps");
  const timeLabel = document.getElementById("time-label");
  const weatherLabel = document.getElementById("weather-label");
  const speedInput = document.getElementById("speed");
  const speedOut = document.getElementById("speed-out");
  const timeInput = document.getElementById("time");
  const timeOut = document.getElementById("time-out");
  const dustInput = document.getElementById("dust");
  const dustOut = document.getElementById("dust-out");
  const cycleBtn = document.getElementById("cycle");
  const rainBtn = document.getElementById("rain");
  const orbitBtn = document.getElementById("orbit");
  const focusMainBtn = document.getElementById("focus-main");
  const focusBridgeBtn = document.getElementById("focus-bridge");

  const state = {
    timeOfDay: 0.36,
    cycleOn: true,
    equipSpeed: 1,
    dust: 0.55,
    rainTarget: 0,
    rain: 0,
    orbitOn: true,
    idle: 0,
    lastInteraction: performance.now(),
    focus: "main",
    tween: null
  };

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 400);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.7));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  scene.fog = new THREE.Fog(0x0a0f16, 28, 80);

  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.minDistance = 7;
  controls.maxDistance = 36;
  controls.maxPolarAngle = Math.PI * 0.47;
  controls.minPolarAngle = Math.PI * 0.16;
  controls.autoRotateSpeed = 0.55;
  controls.target.set(-1.2, 0.7, 0);
  camera.position.set(10.5, 7.2, 12.5);

  /* ---------- procedural textures ---------- */

  function canvasTexture(w, h, draw, repeat = 1) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    draw(ctx, w, h);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeat, repeat);
    t.magFilter = THREE.NearestFilter;
    return t;
  }

  const blockTex = canvasTexture(64, 64, (ctx, w, h) => {
    ctx.fillStyle = "#d6d6d6";
    ctx.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 8) {
      for (let x = 0; x < w; x += 8) {
        const v = 0.86 + Math.random() * 0.16;
        ctx.fillStyle = `rgba(${Math.round(220 * v)},${Math.round(220 * v)},${Math.round(220 * v)},.38)`;
        ctx.fillRect(x, y, 7.4, 7.4);
      }
    }
    ctx.strokeStyle = "rgba(60,60,60,.16)";
    ctx.lineWidth = 1;
    for (let i = 0; i <= w; i += 8) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(w, i); ctx.stroke();
    }
  }, 1);

  const woodTex = canvasTexture(256, 256, (ctx, w, h) => {
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, "#2a1a12");
    g.addColorStop(0.5, "#3b261b");
    g.addColorStop(1, "#241610");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 90; i++) {
      const y = Math.random() * h;
      ctx.strokeStyle = `rgba(${120 + Math.random() * 50},${80 + Math.random() * 30},${45 + Math.random() * 20},${0.06 + Math.random() * 0.12})`;
      ctx.lineWidth = 0.5 + Math.random() * 1.5;
      ctx.beginPath();
      ctx.moveTo(0, y);
      for (let x = 0; x <= w; x += 16) ctx.lineTo(x, y + Math.sin(x * 0.04 + i) * 3);
      ctx.stroke();
    }
  }, 4);

  const dirtTex = canvasTexture(128, 128, (ctx, w, h) => {
    ctx.fillStyle = "#6b5137"; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 1200; i++) {
      const v = 0.55 + Math.random() * 0.5;
      ctx.fillStyle = `rgba(${Math.round(110 * v)},${Math.round(82 * v)},${Math.round(52 * v)},${0.15 + Math.random() * 0.3})`;
      ctx.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2.5, 1 + Math.random() * 2.5);
    }
  }, 3);

  const concreteTex = canvasTexture(128, 128, (ctx, w, h) => {
    ctx.fillStyle = "#a9a9a3"; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 800; i++) {
      const v = 0.7 + Math.random() * 0.4;
      ctx.fillStyle = `rgba(${Math.round(170 * v)},${Math.round(170 * v)},${Math.round(166 * v)},${0.1 + Math.random() * 0.25})`;
      ctx.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 3, 1 + Math.random() * 3);
    }
    ctx.strokeStyle = "rgba(70,70,68,.25)";
    for (let i = 0; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo(Math.random() * w, 0); ctx.lineTo(Math.random() * w, h); ctx.stroke();
    }
  }, 2);

  const blueprintTex = canvasTexture(256, 160, (ctx, w, h) => {
    ctx.fillStyle = "#123e63"; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "rgba(190,230,255,.78)"; ctx.lineWidth = 1.4;
    ctx.strokeRect(14, 14, w - 28, h - 28);
    ctx.strokeRect(24, 24, 90, 60);
    ctx.strokeRect(130, 32, 94, 78);
    ctx.beginPath(); ctx.moveTo(24, 110); ctx.lineTo(210, 110); ctx.stroke();
    for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.moveTo(30 + i * 22, 118); ctx.lineTo(30 + i * 22, 128); ctx.stroke(); }
    ctx.font = "700 16px Segoe UI, sans-serif"; ctx.fillStyle = "rgba(210,240,255,.9)";
    ctx.fillText("SITE PLAN / A-01", 24, 148);
  }, 1);

  const signTex = canvasTexture(256, 96, (ctx, w, h) => {
    ctx.fillStyle = "#d84315"; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#ffd54f";
    for (let i = -h; i < w; i += 36) {
      ctx.beginPath(); ctx.moveTo(i, h); ctx.lineTo(i + 18, h); ctx.lineTo(i + 18 + h, 0); ctx.lineTo(i + h, 0); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "rgba(20,20,20,.82)";
    ctx.fillRect(14, 14, w - 28, h - 28);
    ctx.fillStyle = "#fff3d4"; ctx.font = "800 24px Segoe UI, sans-serif"; ctx.textAlign = "center";
    ctx.fillText("安全第一 · SAFETY", w / 2, 60);
  }, 1);

  /* ---------- materials ---------- */

  const matCache = new Map();
  function material(color, opts = {}) {
    const key = color + JSON.stringify(opts);
    if (matCache.has(key)) return matCache.get(key);
    const m = new THREE.MeshStandardMaterial({
      color,
      map: opts.noMap ? null : (opts.texture || blockTex),
      roughness: opts.roughness ?? 0.82,
      metalness: opts.metalness ?? 0.04,
      emissive: opts.emissive ?? 0x000000,
      emissiveIntensity: opts.emissiveIntensity ?? 1,
      flatShading: true,
      transparent: !!opts.transparent,
      opacity: opts.opacity ?? 1
    });
    matCache.set(key, m);
    return m;
  }

  const woodMat = new THREE.MeshStandardMaterial({ color: 0x5a3928, map: woodTex, roughness: 0.52, metalness: 0.04 });
  const dirtMat = new THREE.MeshStandardMaterial({ color: 0x8a6a49, map: dirtTex, roughness: 0.95, metalness: 0 });
  const concreteMat = new THREE.MeshStandardMaterial({ color: 0xb9b7ae, map: concreteTex, roughness: 0.9, metalness: 0.02 });
  const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x3c4047, map: blockTex, roughness: 0.78, metalness: 0.05 });
  const metalMat = new THREE.MeshStandardMaterial({ color: 0xd7a521, map: blockTex, roughness: 0.42, metalness: 0.55 });
  const steelMat = new THREE.MeshStandardMaterial({ color: 0x7c8a96, map: blockTex, roughness: 0.5, metalness: 0.65 });

  const geoCache = new Map();
  function geometry(w, h, d) {
    const key = `${w}|${h}|${d}`;
    if (!geoCache.has(key)) geoCache.set(key, new THREE.BoxGeometry(w, h, d));
    return geoCache.get(key);
  }
  function box(w, h, d, color, x, y, z, parent = scene, opts = {}) {
    const mesh = new THREE.Mesh(geometry(w, h, d), opts.material || material(color, opts));
    mesh.position.set(x, y, z);
    if (opts.rotation) mesh.rotation.set(opts.rotation[0] || 0, opts.rotation[1] || 0, opts.rotation[2] || 0);
    parent.add(mesh);
    return mesh;
  }
  function cylinder(r, h, color, x, y, z, parent = scene, opts = {}) {
    const geo = new THREE.CylinderGeometry(r, r, h, opts.segments || 10);
    const mesh = new THREE.Mesh(geo, opts.material || material(color, opts));
    mesh.position.set(x, y, z);
    if (opts.rotation) mesh.rotation.set(...opts.rotation);
    parent.add(mesh);
    return mesh;
  }
  function plane(w, h, mat, x, y, z, parent = scene, rot = [-Math.PI / 2, 0, 0]) {
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    mesh.position.set(x, y, z);
    mesh.rotation.set(...rot);
    parent.add(mesh);
    return mesh;
  }
  function instanced(geometry, mat, count, parent = scene) {
    const mesh = new THREE.InstancedMesh(geometry, mat, count);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    mesh.frustumCulled = false;
    parent.add(mesh);
    return mesh;
  }
  const tmpMatrix = new THREE.Matrix4();
  const tmpPos = new THREE.Vector3();
  const tmpQuat = new THREE.Quaternion();
  const tmpScale = new THREE.Vector3();
  const tmpEuler = new THREE.Euler();
  function setInstance(mesh, i, x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0) {
    tmpPos.set(x, y, z);
    tmpEuler.set(rx, ry, rz);
    tmpQuat.setFromEuler(tmpEuler);
    tmpScale.set(sx, sy, sz);
    tmpMatrix.compose(tmpPos, tmpQuat, tmpScale);
    mesh.setMatrixAt(i, tmpMatrix);
  }

  /* ---------- environment ---------- */

  const hemi = new THREE.HemisphereLight(0xbfe0ff, 0x4a3424, 0.9);
  scene.add(hemi);
  const ambient = new THREE.AmbientLight(0xffffff, 0.35);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xfff2dd, 2.4);
  sun.position.set(12, 18, 8);
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0x9cc8ff, 0.45);
  fill.position.set(-12, 8, -10);
  scene.add(fill);

  const skyColor = new THREE.Color(0x8fc4e8);
  scene.background = skyColor;

  // Desk
  const desk = box(22.5, 0.65, 13.5, 0x5a3928, 0, -0.33, 0, scene, { material: woodMat });
  box(22.9, 0.12, 13.9, 0x2b1a12, 0, -0.72, 0, scene, { material: material(0x2b1a12, { noMap: true, roughness: 0.6 }) });
  // Desk edge trim
  box(22.7, 0.1, 0.14, 0x3d2619, 0, 0.015, 6.78, scene, { material: material(0x3d2619, { noMap: true }) });
  box(22.7, 0.1, 0.14, 0x3d2619, 0, 0.015, -6.78, scene, { material: material(0x3d2619, { noMap: true }) });

  // Desk props: blueprints, hard hat, tape measure, level, mug
  const blueprintMat = new THREE.MeshStandardMaterial({ map: blueprintTex, roughness: 0.85, metalness: 0 });
  plane(2.5, 1.55, blueprintMat, -9.35, 0.012, 4.25, scene, [-Math.PI / 2, 0.14, 0]);
  plane(2.2, 1.4, blueprintMat, -8.2, 0.018, 5.05, scene, [-Math.PI / 2, -0.22, 0]);
  // Hard hat
  const hat = new THREE.Group(); hat.position.set(9.6, 0.04, 4.3); scene.add(hat);
  cylinder(0.55, 0.16, 0xffc928, 0, 0.08, 0, hat, { segments: 18, roughness: 0.5 });
  const hatDome = new THREE.Mesh(new THREE.SphereGeometry(0.52, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), material(0xffc928, { roughness: 0.5 }));

    const f = (t - a.t) / Math.max(1e-6, b.t - a.t);
    colA.setHex(a.sky); colB.setHex(b.sky); skyNow.copy(colA).lerp(colB, f);
    sunColA.setHex(a.sunColor); sunColB.setHex(b.sunColor);
    return {
      sky: skyNow,
      sun: a.sun + (b.sun - a.sun) * f,
      sunColor: sunColA.clone().lerp(sunColB, f),
      hemi: a.hemi + (b.hemi - a.hemi) * f,
      ambient: a.ambient + (b.ambient - a.ambient) * f
    };
  }

  const wetMaterials = [woodMat, asphaltMat, concreteMat, dirtMat, riverMat, metalMat, steelMat];
  const wetBase = wetMaterials.map((m) => ({ roughness: m.roughness, metalness: m.metalness }));

  function updateEnvironment(dt) {
    if (state.cycleOn) {
      state.timeOfDay = (state.timeOfDay + dt * 0.0022 * Math.max(0.15, state.equipSpeed)) % 1;
      timeInput.value = String(state.timeOfDay);
    }
    const sky = sampleSky(state.timeOfDay);
    const rainDarken = 1 - state.rain * 0.42;
    scene.background.copy(sky.sky).multiplyScalar(rainDarken);
    scene.fog.color.copy(scene.background);
    scene.fog.near = state.rain > 0.3 ? 18 : 28;
    scene.fog.far = state.rain > 0.3 ? 58 : 80;
    sun.intensity = sky.sun * (1 - state.rain * 0.55);
    sun.color.copy(sky.sunColor);
    hemi.intensity = sky.hemi * (1 - state.rain * 0.3);
    ambient.intensity = sky.ambient * (1 - state.rain * 0.2);
    // Sun path
    const angle = (state.timeOfDay - 0.25) * Math.PI * 2;
    sun.position.set(Math.cos(angle) * 22, Math.max(-4, Math.sin(angle) * 20 + 3), Math.sin(angle * 0.7) * 12);
    fill.intensity = 0.18 + (1 - state.rain) * 0.35;

    const sunHeight = Math.sin(angle);
    const night = 1 - THREE.MathUtils.smoothstep(sunHeight, -0.08, 0.24);
    const glow = Math.min(1, night + state.rain * 0.45);
    lampLights.forEach((light, i) => {
      light.intensity = glow * (9 + Math.sin(performance.now() * 0.001 + i) * 0.8);
    });
    lampMat.emissiveIntensity = 0.15 + glow * 2.6;
    lampCones.forEach((cone) => { cone.material.opacity = glow * 0.055; });
    lightPools.forEach((pool) => { pool.material.opacity = glow * 0.18; });
    windowMats.forEach((m) => { m.emissiveIntensity = 0.1 + glow * 2.2; });
    // Wet surfaces
    wetMaterials.forEach((m, i) => {
      m.roughness = wetBase[i].roughness * (1 - state.rain * 0.7) + 0.12 * state.rain;
      m.metalness = wetBase[i].metalness + state.rain * 0.28;
    });
    puddleMat.opacity = state.rain * 0.42;
    rainMat.opacity = state.rain * 0.55;
    // Equipment speed animation scale
    const hour = Math.floor((state.timeOfDay + 0.25) % 1 * 24);
    const label = hour < 5 ? "深夜" : hour < 8 ? "清晨" : hour < 11 ? "上午" : hour < 14 ? "正午" : hour < 17 ? "下午" : hour < 20 ? "黄昏" : "夜晚";
    timeLabel.textContent = label;
    timeOut.textContent = label;
    weatherLabel.textContent = state.rain > 0.5 ? "暴雨" : "晴";
  }

  /* ---------- animations ---------- */

  const clock = new THREE.Clock();
  let elapsed = 0;
  let frameCount = 0;
  let fpsTime = 0;

  function updateMachines(dt, t) {
    const sp = state.equipSpeed;
    const a = t * sp;
    // Excavators
    excavator1.boom.rotation.z = -0.42 + Math.sin(a * 1.15) * 0.32;
    excavator1.stick.rotation.z = 0.82 + Math.sin(a * 1.15 + 0.7) * 0.4;
    excavator1.bucket.rotation.z = -0.25 + Math.sin(a * 1.15 + 1.3) * 0.35;
    excavator1.house.rotation.y = Math.sin(a * 0.7) * 0.34;
    excavator2.boom.rotation.z = -0.55 + Math.sin(a * 0.95 + 1.8) * 0.3;
    excavator2.stick.rotation.z = 0.95 + Math.sin(a * 0.95 + 2.4) * 0.35;
    excavator2.bucket.rotation.z = -0.2 + Math.sin(a * 0.95 + 3.2) * 0.3;
    excavator2.house.rotation.y = Math.sin(a * 0.55 + 1.1) * 0.3;

    // Cranes
    crane1.jib.rotation.y = a * 0.24 + crane1.phase;
    crane1.trolley.position.x = (Math.sin(a * 0.33 + 1.2) * 0.5 + 0.5) * crane1.jibLen * 0.72 + 0.2;
    crane1.hookGroup.position.y = -0.4 - (Math.sin(a * 0.47 + 0.5) * 0.5 + 0.5) * 1.1;
    crane1.load.rotation.y = Math.sin(a * 0.5) * 0.15;
    crane2.jib.rotation.y = -a * 0.21 + crane2.phase;
    crane2.trolley.position.x = (Math.sin(a * 0.28 + 3.1) * 0.5 + 0.5) * crane2.jibLen * 0.72 + 0.2;
    crane2.hookGroup.position.y = -0.35 - (Math.sin(a * 0.4 + 2.2) * 0.5 + 0.5) * 1.0;
    bridgeJib.rotation.y = Math.sin(a * 0.22 + 0.7) * 0.8;
    bridgeHook.position.x = (Math.sin(a * 0.3 + 1.1) * 0.5 + 0.5) * 1.3 + 0.4;
    bridgeHook.position.y = -0.12 - (Math.sin(a * 0.35 + 0.3) * 0.5 + 0.5) * 0.32;

    // Trucks: loop path with two stops.
    updateTruck(truck1, 0.0, dt, a);
    updateTruck(truck2, 0.47, dt, a);

    // Mixer truck
    const mixerU = (a * 0.012 + 0.72) % 1;
    const mp = roadCurve.getPoint(mixerU);
    const mt = roadCurve.getTangent(mixerU);
    mixer.position.set(mp.x, 0.17, mp.z);
    mixer.rotation.y = Math.atan2(mt.x, mt.z);
    drum.rotation.x = a * 1.8;
    mixer.position.x = THREE.MathUtils.clamp(mixer.position.x, bounds.minX + 0.9, bounds.maxX - 0.9);
    mixer.position.z = THREE.MathUtils.clamp(mixer.position.z, bounds.minZ + 0.9, bounds.maxZ - 0.9);

    // Loader shuttles along a short line and levels the dirt.
    const loaderT = (Math.sin(a * 0.35) * 0.5 + 0.5);
    loader.position.x = -6.5 + loaderT * 1.7;
    loader.rotation.y = Math.cos(a * 0.35) >= 0 ? 0 : Math.PI;
    loaderArm.rotation.z = -0.2 + Math.sin(a * 0.7) * 0.25;
    loaderBucket.rotation.z = 0.1 + Math.sin(a * 0.7 + 0.8) * 0.3;

    // Guard patrol
    const guardT = Math.sin(a * 0.5) * 0.5 + 0.5;
    guard.position.set(-1.2 + guardT * 2.4, 0, 4.82);
    guard.rotation.y = Math.cos(a * 0.5) >= 0 ? -Math.PI / 2 : Math.PI / 2;

    // Workers bob subtly; instance matrices stay in sync.
    for (let i = 0; i < workerCount; i++) {
      const [x, z] = workerSpots[i];
      const bob = Math.sin(a * 1.2 + workerPhase[i]) * 0.012;
      const ry = Math.sin(workerPhase[i]) * 0.8;
      setInstance(torsos, i, x, 0.44 + bob, z, 1, 1, 1, i % 7 === 0 ? 0.45 : 0, ry, 0);
      setInstance(heads, i, x, 0.66 + bob, z, 1, 1, 1, 0, ry, 0);
      setInstance(helmets, i, x, 0.75 + bob, z, 1, 1, 1, 0, ry, 0);
      setInstance(legs, i, x, 0.2, z, 1, 1, 1, 0, ry, 0);
    }
    torsos.instanceMatrix.needsUpdate = true;
    heads.instanceMatrix.needsUpdate = true;
    helmets.instanceMatrix.needsUpdate = true;
    legs.instanceMatrix.needsUpdate = true;
  }

  const truckState = [
    { u: 0.02, moving: true, stop: 0, timer: 0, lastStop: -1 },
    { u: 0.52, moving: true, stop: 0, timer: 0, lastStop: -1 }
  ];
  function updateTruck(truck, offset, dt, a) {
    const st = truckState[offset > 0.2 ? 1 : 0];
    const speed = 0.011 * Math.max(0.2, state.equipSpeed);
    const stops = [0.12, 0.5];
    if (st.timer > 0) {
      st.timer -= dt;
      if (st.timer <= 0) {
        st.moving = true;
        truck.bed.rotation.x += 0; // keep base
      }
    } else {
      st.u = (st.u + speed * dt) % 1;
      for (let s = 0; s < stops.length; s++) {
        const d = Math.abs(((st.u - stops[s] + 1.5) % 1) - 0.5);
        if (d < 0.008 && st.lastStop !== s) {
          st.lastStop = s;
          st.timer = s === 0 ? 1.6 : 1.2;
          st.stopKind = s;
          break;
        }
      }
      if (st.timer <= 0) st.lastStop = -1;
    }
    const u = st.u;
    const p = roadCurve.getPoint(u);
    const tan = roadCurve.getTangent(u);
    truck.group.position.set(
      THREE.MathUtils.clamp(p.x, bounds.minX + 0.8, bounds.maxX - 0.8),
      0.17,
      THREE.MathUtils.clamp(p.z, bounds.minZ + 0.8, bounds.maxZ - 0.8)
    );
    truck.group.rotation.y = Math.atan2(tan.x, tan.z);
    const dump = st.timer > 0 && st.stopKind === 1 ? 0.55 : 0;
    truck.bed.rotation.x += (dump - truck.bed.rotation.x) * Math.min(1, dt * 6);
    truck.load.visible = !(st.timer > 0 && st.stopKind === 1);
    if (st.timer > 0 && st.stopKind === 0) {
      // Loading at the excavator: keep the bed level and add a subtle shake.
      truck.bed.rotation.z = Math.sin(a * 8) * 0.02;
    } else {
      truck.bed.rotation.z *= 0.9;
    }
  }

  function updateRain(dt) {
    state.rain += (state.rainTarget - state.rain) * Math.min(1, dt * 2.2);
    if (state.rain < 0.01) {
      rainLines.visible = false;
      return;
    }
    rainLines.visible = true;
    const arr = rainGeo.attributes.position.array;
    for (let i = 0; i < rainCount; i++) {
      const d = rainDrops[i];
      d.y -= d.speed * dt;
      if (d.y < 0.1) {
        d.y = 8 + Math.random() * 3;
        d.x = -11 + Math.random() * 22;
        d.z = -6.4 + Math.random() * 12.8;
      }
      arr[i * 6] = d.x; arr[i * 6 + 1] = d.y; arr[i * 6 + 2] = d.z;
      arr[i * 6 + 3] = d.x; arr[i * 6 + 4] = d.y - d.len; arr[i * 6 + 5] = d.z;
    }
    rainGeo.attributes.position.needsUpdate = true;
  }

  function updateDust(t) {
    dustMat.uniforms.uTime.value = t;
    dustMat.uniforms.uIntensity.value = state.dust;
    dustMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
    dustPoints.visible = state.dust > 0.01;
  }

  /* ---------- camera focus / interaction ---------- */

  const MAIN_CAM = { pos: new THREE.Vector3(10.5, 7.2, 12.5), target: new THREE.Vector3(-1.2, 0.7, 0) };
  const BRIDGE_CAM = { pos: new THREE.Vector3(11.2, 5.2, 7.6), target: new THREE.Vector3(7.6, 0.8, 0) };
  function focusScene(which) {
    state.focus = which;
    const goal = which === "bridge" ? BRIDGE_CAM : MAIN_CAM;
    state.tween = {
      fromPos: camera.position.clone(),
      fromTarget: controls.target.clone(),
      toPos: goal.pos.clone(),
      toTarget: goal.target.clone(),
      t: 0,
      duration: 1.1
    };
    focusMainBtn.classList.toggle("on", which === "main");
    focusBridgeBtn.classList.toggle("on", which === "bridge");
    toast(which === "bridge" ? "新增场景：桥梁扩建区" : "主工地视角");
  }

  function resetCamera() {
    camera.position.copy(MAIN_CAM.pos);
    controls.target.copy(MAIN_CAM.target);
    state.focus = "main";
    focusMainBtn.classList.add("on"); focusBridgeBtn.classList.remove("on");
    toast("视角已复位");
  }

  function updateTween(dt) {
    if (!state.tween) return;
    const tw = state.tween;
    tw.t = Math.min(1, tw.t + dt / tw.duration);
    const e = 1 - Math.pow(1 - tw.t, 3);
    camera.position.lerpVectors(tw.fromPos, tw.toPos, e);
    controls.target.lerpVectors(tw.fromTarget, tw.toTarget, e);
    if (tw.t >= 1) state.tween = null;
  }

  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toastEl.classList.remove("show"), 1800);
  }

  // Idle auto orbit
  controls.addEventListener("start", () => {
    state.lastInteraction = performance.now();
    controls.autoRotate = false;
  });
  controls.addEventListener("end", () => { state.lastInteraction = performance.now(); });

  // Knob clicks
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let downPos = null;
  canvas.addEventListener("pointerdown", (e) => {
    downPos = { x: e.clientX, y: e.clientY };
    state.lastInteraction = performance.now();
  });
  canvas.addEventListener("pointerup", (e) => {
    state.lastInteraction = performance.now();
    if (!downPos) return;
    const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
    downPos = null;
    if (moved > 6) return;
    const rect = canvas.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(knobMeshes, false);
    if (hits.length) {
      const idx = hits[0].object.userData.knob;
      const action = knobActions[idx];
      action();
      hits[0].object.rotation.y += Math.PI / 3;
    }
  });

  // UI
  speedInput.addEventListener("input", () => {
    state.equipSpeed = Number(speedInput.value);
    speedOut.textContent = state.equipSpeed.toFixed(2) + "×";
  });
  timeInput.addEventListener("input", () => {
    state.timeOfDay = Number(timeInput.value);
    state.cycleOn = false;
    cycleBtn.classList.remove("on");
  });
  dustInput.addEventListener("input", () => {
    state.dust = Number(dustInput.value);
    dustOut.textContent = Math.round(state.dust * 100) + "%";
  });
  cycleBtn.addEventListener("click", () => {
    state.cycleOn = !state.cycleOn;
    cycleBtn.classList.toggle("on", state.cycleOn);
    toast(state.cycleOn ? "昼夜循环：开启" : "昼夜循环：暂停");
  });
  rainBtn.addEventListener("click", () => {
    const on = state.rainTarget < 0.5;
    state.rainTarget = on ? 1 : 0;
    rainBtn.classList.toggle("on", on);
    toast(on ? "暴雨模式：雨滴、湿地反光与灯光增强" : "天气转晴");
  });
  orbitBtn.addEventListener("click", () => {
    state.orbitOn = !state.orbitOn;
    orbitBtn.classList.toggle("on", state.orbitOn);
    toast(state.orbitOn ? "自动环绕：开启" : "自动环绕：关闭");
  });
  focusMainBtn.addEventListener("click", () => focusScene("main"));
  focusBridgeBtn.addEventListener("click", () => focusScene("bridge"));
  document.getElementById("reset-camera").addEventListener("click", resetCamera);
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" && e.target.tagName !== "INPUT") {
      e.preventDefault();
      rainBtn.click();
    }
  });

  /* ---------- resize / loop ---------- */

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.7));
    dustMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
  }
  window.addEventListener("resize", resize);

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());
    elapsed += dt;
    if (state.tween) updateTween(dt);
    // Auto orbit after 5 seconds of no interaction.
    const idle = performance.now() - state.lastInteraction > 5000;
    controls.autoRotate = state.orbitOn && idle && !state.tween;
    controls.update(dt);
    updateEnvironment(dt);
    updateMachines(dt, elapsed);
    updateRain(dt);
    updateDust(elapsed);
    renderer.render(scene, camera);

    frameCount++;
    fpsTime += dt;
    if (fpsTime > 0.5) {
      fpsEl.textContent = Math.round(frameCount / fpsTime);
      frameCount = 0;
      fpsTime = 0;
    }
  }

  // Boot
  try {
    resize();
    loading.classList.add("hide");
    window.__voxelReady = true;
    clock.start();
    animate();
    toast("拖动环视 · 滚轮缩放 · 点击桌前三枚旋钮");
  } catch (error) {
    errorMessage.textContent = error.message;
    errorBox.hidden = false;
    loading.classList.add("hide");
  }
})();
</script>
</body>
</html>
