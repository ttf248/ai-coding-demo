<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>体素微缩建筑工地沙盘 · Voxel Construction Site</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0d12; font-family:-apple-system,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .hud { position:fixed; z-index:10; color:#e8e2d4; pointer-events:none; }
  #title { top:22px; left:26px; }
  #title h1 { font-size:19px; font-weight:700; letter-spacing:1px; color:#f0e9d8; text-shadow:0 2px 14px rgba(0,0,0,.7); }
  #title .sub { margin-top:5px; font-size:11px; letter-spacing:2px; color:#d9b36a; }
  #panel { top:22px; right:26px; pointer-events:auto; display:flex; flex-direction:column; gap:7px; align-items:flex-end; }
  .btn { cursor:pointer; border:1px solid rgba(217,179,106,.4); background:rgba(11,13,18,.6); color:#e8e2d4; backdrop-filter:blur(8px); padding:7px 13px; border-radius:8px; font-size:12px; transition:.18s; }
  .btn:hover { border-color:#d9b36a; background:rgba(217,179,106,.18); }
  .btn.active { background:rgba(217,179,106,.28); border-color:#d9b36a; }
  #readout { bottom:22px; right:26px; font-size:11px; letter-spacing:.5px; color:rgba(232,226,212,.75); text-align:right; line-height:1.8; font-variant-numeric:tabular-nums; }
  #hint { bottom:22px; left:26px; font-size:12px; color:rgba(232,226,212,.8); line-height:1.9; max-width:360px; }
  #hint b { color:#d9b36a; }
  #knobState { top:120px; right:26px; font-size:11px; line-height:1.8; color:rgba(232,226,212,.7); border-left:2px solid rgba(217,179,106,.5); padding-left:12px; max-width:230px; }
  #loader { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0b0d12; color:#e8e2d4; transition:opacity .7s; }
  #loader .ring { width:46px; height:46px; border:2px solid rgba(217,179,106,.25); border-top-color:#d9b36a; border-radius:50%; animation:spin 1s linear infinite; }
  #loader p { margin-top:16px; font-size:12px; letter-spacing:2px; color:#d9b36a; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (max-width:680px){ #knobState{display:none;} #hint{max-width:62vw; font-size:11px;} }
</style>
<script defer src="../../../../assets/analytics.js"></script>
</head>
<body>
<div id="app"></div>
<div id="loader"><div class="ring"></div><p>正在搭建工地沙盘…</p></div>
<div class="hud" id="title"><h1>体素微缩建筑工地沙盘</h1><div class="sub">VOXEL CONSTRUCTION SITE · Three.js r160 · 程序化生成</div></div>
<div class="hud" id="panel">
  <button class="btn active" id="btnCycle">昼夜循环 · 开</button>
  <button class="btn" id="btnRain">暴雨 · 关</button>
  <button class="btn" id="btnSpeed">设备速度 · 1×</button>
</div>
<div class="hud" id="knobState">
  桌面前方三个实体旋钮可点击：<br/>
  <span style="color:#d9b36a">①</span> 设备速度 &nbsp; <span style="color:#d9b36a">②</span> 昼夜循环 &nbsp; <span style="color:#d9b36a">③</span> 尘土强度<br/>
  点击旋钮或右上按钮均可调节。
</div>
<div class="hud" id="hint"><b>拖拽</b> 环视 · <b>滚轮</b> 缩放 · 闲置自动环绕 · <b>空格</b> 暴雨<br/>点击桌面前方旋钮调节设备速度 / 昼夜 / 尘土。</div>
<div class="hud" id="readout"></div>

<script>
(function () {
  "use strict";
  const THREE = window.THREE;
  if (!THREE) { document.getElementById("loader").innerHTML = '<p style="color:#e8836f">Three.js 加载失败，请检查网络。</p>'; return; }
  const app = document.getElementById("app");
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = false;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  app.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(46, 1, 0.5, 2000);

  function sizeTo(w, h) { w = Math.max(1, w | 0); h = Math.max(1, h | 0); renderer.setSize(w, h, false); renderer.domElement.style.width = w + "px"; renderer.domElement.style.height = h + "px"; camera.aspect = w / h; camera.updateProjectionMatrix(); }
  function resize() { sizeTo(window.innerWidth, window.innerHeight); }
  window.addEventListener("resize", resize); resize();

  // ---------- procedural textures ----------
  function canvasTex(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }
  const woodTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = "#3a2617"; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 70; i++) { g.strokeStyle = "rgba(" + (40 + Math.random() * 40 | 0) + "," + (24 + Math.random() * 22 | 0) + ",12," + (0.15 + Math.random() * 0.3) + ")"; g.lineWidth = 1 + Math.random() * 3; g.beginPath(); const y = Math.random() * h; g.moveTo(0, y); for (let x = 0; x <= w; x += 16) g.lineTo(x, y + Math.sin(x * 0.05 + i) * 4); g.stroke(); }
    for (let i = 0; i < 6; i++) { g.strokeStyle = "rgba(20,12,6,.5)"; g.lineWidth = 2; const x = Math.random() * w; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 8, h); g.stroke(); }
  });
  woodTex.repeat.set(3, 2);
  const dirtTex = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = "#8a6d47"; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) { const v = Math.random(); g.fillStyle = "rgba(" + (100 + v * 70 | 0) + "," + (78 + v * 55 | 0) + "," + (50 + v * 40 | 0) + ",.5)"; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  });
  dirtTex.repeat.set(10, 7);
  const concreteTex = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = "#9a9a92"; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 1800; i++) { const v = Math.random() * 60 | 0; g.fillStyle = "rgba(" + (130 + v) + "," + (130 + v) + "," + (124 + v) + ",.4)"; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  });
  const blueprintTex = canvasTex(256, 192, (g, w, h) => {
    g.fillStyle = "#1d3a6e"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(180,210,255,.5)"; g.lineWidth = 1;
    for (let x = 0; x < w; x += 16) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    for (let y = 0; y < h; y += 16) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    g.strokeStyle = "#cfe0ff"; g.lineWidth = 2; g.strokeRect(40, 40, 120, 90); g.strokeRect(70, 60, 60, 50);
    g.beginPath(); g.moveTo(40, 130); g.lineTo(160, 130); g.stroke();
    g.fillStyle = "#cfe0ff"; g.font = "12px monospace"; g.fillText("SITE PLAN A-01", 40, 160);
  });

  // ---------- lights ----------
  const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x3a2a1a, 0.7); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(60, 120, 40); scene.add(sun);
  const ambient = new THREE.AmbientLight(0xffffff, 0.25); scene.add(ambient);

  // ---------- voxel engine ----------
  const VOX = []; // x,y,z,color
  const C = {
    concrete: 0x9a9a92, concreteD: 0x7d7d75, rebar: 0x8a5a3a, steel: 0x6a7078, steelD: 0x4a5058,
    wood: 0x9c7a4a, woodD: 0x7a5c34, dirt: 0x8a6d47, dirtD: 0x6b5236, sand: 0xd8c08a, gravel: 0x9a9088,
    spoil: 0x6b5236, brick: 0xb5623a, pipe: 0x7a8a9a, prefab: 0xd8dde2, prefabTrim: 0x3a78b5,
    roof: 0x4a5560, glass: 0x8ac0d8, yellow: 0xf2c14e, orange: 0xe8843a, red: 0xc0492f, white: 0xe8e8e8,
    black: 0x2a2d33, green: 0x4a8a5a, blue: 0x3a6ea5, flag1: 0xe84a3a, flag2: 0xf2c14e, flag3: 0x3a78b5,
    skin: 0xe0b090, vest: 0xf2a03a, helmetY: 0xf2c14e, helmetW: 0xe8e8e8, helmetR: 0xc0492f, pants: 0x3a4048,
    road: 0x55585e, fence: 0xc8ccd0, light: 0xffe9a8
  };
  function jit(c, a) { const r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255; const j = () => (Math.random() - 0.5) * a; return (Math.max(0, Math.min(255, r + j())) << 16) | (Math.max(0, Math.min(255, g + j())) << 8) | Math.max(0, Math.min(255, b + j())); }
  function v(x, y, z, c) { VOX.push(x, y, z, jit(c, 18)); }
  function box(x, y, z, w, h, d, c, hollow) {
    for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) for (let k = 0; k < d; k++) {
      if (hollow && i > 0 && i < w - 1 && j > 0 && j < h - 1 && k > 0 && k < d - 1) continue;
      v(x + i, y + j, z + k, c);
    }
  }
  function heap(cx, cz, r, hgt, c) {
    for (let i = -r; i <= r; i++) for (let k = -r; k <= r; k++) {
      const d = Math.sqrt(i * i + k * k); if (d > r) continue;
      const hh = Math.max(1, Math.round(hgt * (1 - d / r) + Math.random() * 1.2));
      for (let j = 0; j < hh; j++) { if (j < hh - 1 && d < r - 1) continue; v(cx + i, 3 + j, cz + k, c); }
    }
  }
  function buildVoxels() {
    const n = VOX.length / 4;
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const inst = new THREE.InstancedMesh(geo, mat, n);
    const m = new THREE.Matrix4(), col = new THREE.Color();
    for (let i = 0; i < n; i++) { m.makeTranslation(VOX[i * 4] + 0.5, VOX[i * 4 + 1] + 0.5, VOX[i * 4 + 2] + 0.5); inst.setMatrixAt(i, m); col.setHex(VOX[i * 4 + 3]); inst.setColorAt(i, col); }
    inst.instanceMatrix.needsUpdate = true; if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
    inst.frustumCulled = false; scene.add(inst); return inst;
  }

  // ---------- desk ----------
  const deskMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.7, metalness: 0.05 });
  const desk = new THREE.Mesh(new THREE.BoxGeometry(150, 6, 100), deskMat); desk.position.set(0, -3, 0); scene.add(desk);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x2a1c10, roughness: 0.8 });
  [[-68, -42], [68, -42], [-68, 42], [68, 42]].forEach(([x, z]) => { const l = new THREE.Mesh(new THREE.BoxGeometry(6, 40, 6), legMat); l.position.set(x, -26, z); scene.add(l); });
  // sandbox tray frame
  box(-60, 0, -38, 120, 3, 2, C.woodD); box(-60, 0, 36, 120, 3, 2, C.woodD);
  box(-60, 0, -38, 2, 3, 76, C.woodD); box(58, 0, -38, 2, 3, 76, C.woodD);
  // ground inside tray
  const groundMat = new THREE.MeshStandardMaterial({ map: dirtTex, roughness: 0.95, metalness: 0.0 });
  const ground = new THREE.Mesh(new THREE.BoxGeometry(116, 3, 72), groundMat); ground.position.set(0, 1.5, 0); scene.add(ground);

  // ---------- desk props ----------
  // blueprint paper
  const bp = new THREE.Mesh(new THREE.PlaneGeometry(26, 19), new THREE.MeshStandardMaterial({ map: blueprintTex, roughness: 0.9 })); bp.rotation.x = -Math.PI / 2; bp.rotation.z = 0.2; bp.position.set(-48, 0.15, 30); scene.add(bp);
  const bp2 = bp.clone(); bp2.rotation.z = -0.15; bp2.position.set(50, 0.15, -28); scene.add(bp2);
  // tape measure
  box(40, 0, 30, 4, 3, 4, C.yellow); box(44, 0, 31, 6, 1, 1, C.steel);
  // hard hat ornament (voxel dome)
  (function () { const cx = -44, cz = -30; for (let i = -3; i <= 3; i++) for (let k = -3; k <= 3; k++) { const d = Math.sqrt(i * i + k * k); if (d > 3.2) continue; const hh = Math.round(3 * Math.sqrt(Math.max(0, 1 - d / 3.2))); for (let j = 0; j <= hh; j++) v(cx + i, j, cz + k, C.helmetY); } box(cx - 4, 0, cz - 1, 9, 1, 3, C.helmetY); })();
  // metal level tool
  box(20, 0, 32, 16, 1, 2, C.steel); box(26, 1, 32, 3, 1, 2, C.green);

  // ---------- site layout ----------
  // road loop (textured flat boxes) around the site
  const roadMat = new THREE.MeshStandardMaterial({ map: concreteTex, color: 0x6a6d72, roughness: 0.9 });
  function road(x, z, w, d) { const r = new THREE.Mesh(new THREE.BoxGeometry(w, 0.4, d), roadMat); r.position.set(x, 3.2, z); scene.add(r); }
  road(0, -26, 100, 8);   // top road
  road(0, 26, 100, 8);    // bottom road
  road(-46, 0, 8, 60);    // left road
  road(46, 0, 8, 60);     // right road
  // road dashes
  const dashMat = new THREE.MeshBasicMaterial({ color: 0xd8d8c0 });
  for (let x = -44; x <= 44; x += 8) { const d = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 0.6), dashMat); d.position.set(x, 3.45, -26); scene.add(d); const d2 = d.clone(); d2.position.z = 26; scene.add(d2); }

  // excavation pit (bottom-left area)
  box(-38, 1, -18, 22, 2, 16, C.dirtD, true); // pit rim walls
  const pitFloor = new THREE.Mesh(new THREE.BoxGeometry(20, 0.5, 14), new THREE.MeshStandardMaterial({ map: dirtTex, color: 0x6b5236, roughness: 1 })); pitFloor.position.set(-27, 1.2, -10); scene.add(pitFloor);
  heap(-30, -12, 4, 3, C.dirt);

  // building under construction (right-center)
  const BX = 18, BZ = -2, BW = 18, BD = 16, FLOORS = 5, FH = 4;
  for (let f = 0; f < FLOORS; f++) {
    const y = 3 + f * FH;
    box(BX, y, BZ, BW, 1, BD, C.concrete); // slab
    // columns
    for (let i = 0; i < BW; i += 4) for (let k = 0; k < BD; k += 4) box(BX + i, y + 1, BZ + k, 1, FH - 1, 1, C.concreteD);
    // partial walls (lower floors more complete)
    if (f < 3) { box(BX, y + 1, BZ, BW, FH - 1, 1, C.concrete, true); box(BX, y + 1, BZ + BD - 1, BW, FH - 1, 1, C.concrete, true); }
    // rebar on top floor
    if (f === FLOORS - 1) { for (let i = 1; i < BW; i += 2) for (let k = 1; k < BD; k += 2) v(BX + i, y + 1, BZ + k, C.rebar); }
  }
  // scaffolding around building
  for (let i = 0; i <= BW; i += 3) { box(BX - 2, 3, BZ + i, 1, FLOORS * FH, 1, C.steel); }
  for (let f = 1; f <= FLOORS; f++) box(BX - 2, 3 + f * FH - 1, BZ, 1, 1, BD, C.steelD);
  for (let k = 0; k <= BD; k += 3) { box(BX + BW + 1, 3, BZ + k, 1, FLOORS * FH, 1, C.steel); }

  // rebar processing shed (top-left)
  box(-40, 3, 8, 16, 1, 10, C.steelD); // shed floor
  [[-40, 8], [-25, 8], [-40, 17], [-25, 17]].forEach(([x, z]) => box(x, 3, z, 1, 6, 1, C.steel));
  box(-41, 9, 7, 18, 1, 12, C.roof); // canopy
  // rebar stacks
  for (let s = 0; s < 3; s++) for (let i = 0; i < 8; i++) box(-38 + s * 4, 3, 10 + i, 3, 1, 1, C.rebar);

  // material storage (bottom-center-left): bricks + pipes + cement
  for (let r = 0; r < 4; r++) for (let i = 0; i < 6; i++) box(-12 + i, 3 + r, 12, 1, 1, 3, C.brick);
  for (let i = 0; i < 5; i++) box(-12 + i * 2, 3, 18, 1, 1, 6, C.pipe);
  heap(2, 16, 3, 3, C.sand);
  heap(8, 18, 3, 2, C.gravel);
  for (let i = 0; i < 4; i++) box(12, 3 + i, 14, 3, 1, 2, C.concreteD); // cement bags

  // prefab office (top-right)
  for (let u = 0; u < 3; u++) {
    const ox = 12 + u * 12;
    box(ox, 3, 12, 10, 5, 7, C.prefab, true);
    box(ox, 8, 12, 10, 1, 7, C.prefabTrim);
    // windows (emissive at night) - separate meshes collected later
  }
  // prefab windows (emissive)
  const windowMat = new THREE.MeshStandardMaterial({ color: 0x3a5a7a, emissive: 0xffd27a, emissiveIntensity: 0 });
  const windows = [];
  for (let u = 0; u < 3; u++) { const ox = 12 + u * 12; for (let i = 0; i < 2; i++) { const w = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2), windowMat); w.position.set(ox + 2.5 + i * 4, 5.5, 11.4); w.rotation.y = Math.PI; scene.add(w); windows.push(w); } }

  // spoil pile (bottom-right)
  heap(34, 16, 6, 6, C.spoil);
  heap(40, 20, 4, 4, C.spoil);

  // perimeter fence + gate
  for (let x = -56; x <= 56; x += 3) { if (x > -6 && x < 6) continue; box(x, 3, -34, 1, 3, 1, C.fence); box(x, 3, 34, 1, 3, 1, C.fence); }
  for (let z = -34; z <= 34; z += 3) { box(-56, 3, z, 1, 3, 1, C.fence); box(56, 3, z, 1, 3, 1, C.fence); }
  box(-56, 5, -34, 113, 1, 1, C.fence); box(-56, 5, 34, 113, 1, 1, C.fence);
  // gate posts + sign
  box(-6, 3, -34, 2, 6, 2, C.steelD); box(4, 3, -34, 2, 6, 2, C.steelD); box(-6, 9, -34, 12, 2, 1, C.blue);
  // warning flags along top fence
  const flagMats = [C.flag1, C.flag2, C.flag3].map(c => new THREE.MeshLambertMaterial({ color: c, side: THREE.DoubleSide }));
  const flags = [];
  for (let x = -50; x <= 50; x += 6) { const f = new THREE.Mesh(new THREE.PlaneGeometry(2, 1.4), flagMats[(x / 6 | 0) % 3]); f.position.set(x, 7, -34); scene.add(f); flags.push(f); }
  // utility poles + lights
  const lampMat = new THREE.MeshStandardMaterial({ color: 0x333333, emissive: 0xffe9a8, emissiveIntensity: 0 });
  const siteLights = [];
  [[-50, -28], [50, -28], [-50, 28], [50, 28], [0, 0]].forEach(([x, z]) => {
    box(x, 3, z, 1, 12, 1, C.steelD);
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1, 2.5), lampMat); lamp.position.set(x, 15.5, z); scene.add(lamp);
    const pl = new THREE.PointLight(0xffd9a0, 0, 60, 2); pl.position.set(x, 15, z); scene.add(pl); siteLights.push(pl);
  });
  // safety signs
  box(-20, 3, -33, 3, 3, 1, C.yellow); box(20, 3, 33, 3, 3, 1, C.red);

  const staticVox = buildVoxels();

  // ---------- dynamic machines ----------
  const machines = new THREE.Group(); scene.add(machines);
  function lam(c) { return new THREE.MeshLambertMaterial({ color: c }); }
  function bmesh(w, h, d, c) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), lam(c)); }

  // Excavator
  function makeExcavator(x, z, ry) {
    const g = new THREE.Group(); g.position.set(x, 3, z); g.rotation.y = ry;
    const trackL = bmesh(7, 1.6, 1.6, C.black); trackL.position.set(0, 0.8, 2); g.add(trackL);
    const trackR = trackL.clone(); trackR.position.z = -2; g.add(trackR);
    const body = bmesh(5, 2.4, 4, C.yellow); body.position.set(-0.5, 2.6, 0); g.add(body);
    const cab = bmesh(2.4, 2.2, 2.4, C.yellow); cab.position.set(1.4, 4.4, 1); g.add(cab);
    const cabGlass = bmesh(2.0, 1.4, 0.2, C.glass); cabGlass.position.set(1.4, 4.6, 2.2); g.add(cabGlass);
    const boomPivot = new THREE.Group(); boomPivot.position.set(2.2, 3.4, -0.5); g.add(boomPivot);
    const boom = bmesh(6, 1, 1, C.yellow); boom.position.set(3, 0, 0); boomPivot.add(boom);
    const armPivot = new THREE.Group(); armPivot.position.set(6, 0, 0); boomPivot.add(armPivot);
    const arm = bmesh(4.5, 0.8, 0.8, C.yellow); arm.position.set(2.2, 0, 0); armPivot.add(arm);
    const bucketPivot = new THREE.Group(); bucketPivot.position.set(4.5, 0, 0); armPivot.add(bucketPivot);
    const bucket = bmesh(1.8, 1.4, 1.8, C.steelD); bucket.position.set(0.6, -0.6, 0); bucketPivot.add(bucket);
    machines.add(g);
    return { g, boomPivot, armPivot, bucketPivot, phase: Math.random() * 6.28 };
  }
  const excavators = [makeExcavator(-22, -8, Math.PI * 0.9), makeExcavator(-32, -14, Math.PI * 0.6)];

  // Dump truck
  function makeTruck() {
    const g = new THREE.Group();
    const cab = bmesh(3, 3, 3.4, C.orange); cab.position.set(2.6, 2.2, 0); g.add(cab);
    const glass = bmesh(0.2, 1.4, 2.6, C.glass); glass.position.set(4.1, 2.8, 0); g.add(glass);
    const bed = new THREE.Group(); bed.position.set(-1.5, 1.6, 0); g.add(bed);
    const bedBox = bmesh(6, 2.2, 3.4, C.steelD); bedBox.position.set(0, 1.1, 0); bed.add(bedBox);

    const wm2 = new THREE.Matrix4();
    for (let i = 0; i < workerParts.length; i++) {
      const p = workerParts[i]; const bob = Math.sin(t * 3 + p[0]) * 0.12;
      wm2.makeTranslation(p[0] + 0.5, p[1] + 0.5 + bob, p[2] + 0.5); workerInst.setMatrixAt(i, wm2);
    }
    workerInst.instanceMatrix.needsUpdate = true;
  }

  function tick() {
    requestAnimationFrame(tick);
    const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
    if (state.cycle) state.time = (state.time + dt * 0.02) % 1;
    dustUniforms.uTime.value = t; rainUniforms.uTime.value = t;
    animateMachines(t, dt);
    applyDayNight();
    updateCamera(dt);
    renderer.render(scene, camera);
    frames++; acc += dt;
    if (acc >= 0.5) { fps = Math.round(frames / acc); frames = 0; acc = 0;
      const info = renderer.info.render;
      const phase = state.time < 0.125 ? "黎明" : state.time < 0.375 ? "正午" : state.time < 0.625 ? "黄昏" : "夜晚";
      readout.innerHTML = "FPS " + fps + " · DrawCalls " + info.calls + " · 三角面 " + (info.triangles / 1000).toFixed(0) + "k<br/>体素 " + (VOX.length / 4) + " · 工人 " + workerPos.length + " · " + phase + (state.rain ? " · 暴雨" : "") + "<br/>速度 " + state.speed + "× · 尘土 " + state.dustLevels[state.dustIdx] + " · 昼夜 " + (state.cycle ? "开" : "关");
    }
  }

  // ---------- test API ----------
  window.__site = {
    THREE, renderer, scene, camera, resize: sizeTo,
    setSpeed: x => { state.speed = x; },
    toggleCycle: () => triggerKnob(1),
    setDust: x => { dustUniforms.uIntensity.value = x; },
    toggleRain: () => setRain(!state.rain),
    setTime: x => { state.time = x; applyDayNight(); },
    info: () => ({ voxels: VOX.length / 4, workers: workerPos.length, excavators: excavators.length, trucks: trucks.length, cranes: cranes.length, drawCalls: renderer.info.render.calls, triangles: renderer.info.render.triangles, fps, speed: state.speed, cycle: state.cycle, rain: state.rain, time: state.time, dust: dustUniforms.uIntensity.value, camPos: camera.position.toArray() })
  };

  applyDayNight();
  requestAnimationFrame(() => requestAnimationFrame(() => { const l = document.getElementById("loader"); l.style.opacity = "0"; setTimeout(() => l.remove(), 700); }));
  tick();
})();
</script>
</body>
</html>
