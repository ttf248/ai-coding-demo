<!doctype html><html lang="zh-CN"><head><script src="../../../../assets/analytics.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>体素建筑工地沙盘</title><style>*{box-sizing:border-box}body{margin:0;background:#101519;color:#eef1e5;font:14px/1.4 system-ui,sans-serif;overflow:hidden}#stage{position:fixed;inset:0}canvas{display:block;touch-action:none}.info{position:fixed;top:20px;left:22px;max-width:330px;pointer-events:none;text-shadow:0 2px 6px #000}h1{font-size:clamp(22px,4vw,38px);margin:5px 0}p{color:#bdc8c2}.controls{position:fixed;right:18px;bottom:18px;left:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{background:#253737e8;color:#fff;border:1px solid #6a8078;border-radius:6px;padding:8px 11px;cursor:pointer}.status{color:#ffd28a;font-size:12px}.hint{font-size:12px;color:#ced6d0}@media(max-width:600px){.info{max-width:240px;top:12px;left:14px}.info p{font-size:12px}.controls{bottom:10px;left:10px}}</style><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script></head><body><div id="stage"></div><div class="info"><small>MINIATURE / 01</small><h1>体素建筑工地</h1><p>桌面上的昼夜施工沙盘。拖动环视、滚轮缩放，空格切换暴雨。</p><p id="status" class="status"></p></div><div class="controls"><button id="speed">速度：正常</button><button id="day">昼夜循环：开</button><button id="dust">尘土：中</button><button id="rain">暴雨：关</button><button id="reset">重置视角</button><span class="hint">也可点击桌面前方的彩色实体旋钮</span></div><script>
const stage=document.getElementById('stage'),status=document.getElementById('status');if(!window.THREE)status.textContent='Three.js CDN 加载失败，请检查网络。';else try{start()}catch(e){status.textContent='场景启动失败：'+e.message}
function start(){const scene=new THREE.Scene();scene.background=new THREE.Color(0x1b272b);const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,500),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);let hemi=new THREE.HemisphereLight(0xc6e4ec,0x4d3d2b,2),sun=new THREE.DirectionalLight(0xffe4b2,2);sun.position.set(-25,40,10);scene.add(hemi,sun);const mats={wood:0x493126,ground:0x977b52,dirt:0x725b3e,road:0x5d5d55,yellow:0xe5ad31,orange:0xd77b38,white:0xe1ded0,blue:0x668d9d,black:0x252e2f,steel:0x8e9790,red:0xb44b39,green:0x6c8664};const materials=Object.fromEntries(Object.entries(mats).map(([k,v])=>[k,new THREE.MeshStandardMaterial({color:v,roughness:.8})]));const cube=new THREE.BoxGeometry(1,1,1);function block(g,x,y,z,w,h,d,m){let o=new THREE.Mesh(cube,materials[m]);o.position.set(x,y,z);o.scale.set(w,h,d);g.add(o);return o}function group(x,y,z){let g=new THREE.Group();g.position.set(x,y,z);scene.add(g);return g}block(scene,0,-2,0,70,3,55,'wood');block(scene,0,-.2,0,52,1,40,'ground');block(scene,0,.35,0,48,.25,6,'road');for(let x=-24;x<=24;x+=2){block(scene,x,1,-19,.2,2,.2,'steel');block(scene,x,1,19,.2,2,.2,'steel');if(x%4===0){block(scene,x,1.4,-19,1.7,.5,.12,'white');block(scene,x,1.4,19,1.7,.5,.12,'red')}}for(let z=-18;z<=18;z+=2){block(scene,-25,1,z,.2,2,.2,'steel');block(scene,25,1,z,.2,2,.2,'steel')}
// Repeated masonry blocks are batched into an InstancedMesh.
let geo=new THREE.BoxGeometry(1,1,1),inst=new THREE.InstancedMesh(geo,materials.steel,240),dummy=new THREE.Object3D(),n=0;for(let floor=0;floor<5;floor++)for(let x=0;x<8;x++)for(let z=0;z<6;z++){dummy.position.set(5+x*1.1,.8+floor*.7,-15+z*1.1);dummy.scale.set(1,.6,1);dummy.updateMatrix();inst.setMatrixAt(n++,dummy.matrix)}scene.add(inst);for(let x of [5,13])for(let z of [-15,-9])block(scene,x,5,z,.5,9,.5,'yellow');for(let y of [3,6,9]){block(scene,9,y,-15,9,.4,.4,'steel');block(scene,9,y,-9,9,.4,.4,'steel')}
// Workshop, office, stockpiles and excavation.
block(scene,-17,2.1,-13,9,4,7,'white');block(scene,-17,4.3,-13,10,.4,8,'blue');for(let x of [-20,-17,-14])block(scene,x,2.5,-9.4,1.8,1.4,.1,'blue');block(scene,18,1,-13,9,2,6,'steel');block(scene,18,3,-13,10,.5,7,'blue');for(let x=15;x<=21;x+=2)block(scene,x,2,-13,.3,2,.3,'steel');block(scene,-13,.2,10,13,.5,10,'dirt');for(let x=-18;x<-8;x+=2)for(let z=7;z<15;z+=2)block(scene,x,.5+(x+18)*.06,z,1.8,.6,1.8,'dirt');for(let i=0;i<30;i++){let x=13+(i%6)*1.1,z=8+Math.floor(i/6)*1.1;block(scene,x,.7+(i%3)*.25,z,1,.6,1,i%2?'dirt':'ground')}for(let i=0;i<8;i++)block(scene,-3+i*.7,.7,12,.4,.4,6,'steel');
function crane(x,z){let g=group(x,0,z);block(g,0,8,0,.8,16,.8,'yellow');for(let y=2;y<16;y+=2)block(g,0,y,0,1.4,.2,1.4,'yellow');let top=new THREE.Group();top.position.y=16;g.add(top);block(top,3,0,0,14,.7,.7,'yellow');block(top,-4,0,0,3,1.5,1.2,'steel');block(top,0,2,0,.4,4,.4,'yellow');let cable=block(top,8,-2,0,.12,4,.12,'steel'),load=block(top,8,-4.4,0,1,1,1,'orange');return{top,cable,load}}let cranes=[crane(3,-4),crane(21,-5)];function excavator(x,z){let g=group(x,.5,z);block(g,0,.5,0,4,1,3,'black');block(g,0,1.4,0,3.4,1.1,2.5,'yellow');block(g,-.5,2.4,0,1.4,1.4,1.7,'blue');let arm=new THREE.Group();arm.position.set(1,2,0);g.add(arm);let boom=block(arm,1.8,0,0,3.6,.6,.6,'yellow');boom.rotation.z=-.35;block(arm,3.7,-1,0,.7,2.2,.7,'yellow');block(arm,4,-2,0,1.3,.5,1.2,'steel');return arm}let arms=[excavator(-15,6),excavator(-7,9)];function truck(color){let g=group(0,.5,0);block(g,0,.8,0,5,1.2,2.5,color);block(g,-1.8,1.7,0,1.5,1.2,2.4,'blue');for(let x of [-1.5,1.5])for(let z of [-1.35,1.35])block(g,x,.3,z,1,.8,.4,'black');return g}let truck1=truck('orange'),truck2=truck('white');block(truck2,1,2,0,3,2,2,'white');let load=block(truck1,1,1.55,0,2.5,.3,1.8,'dirt');let loader=truck('yellow');loader.scale.setScalar(.65);block(loader,3,.5,0,1.5,.5,2,'steel');let workers=[];for(let i=0;i<8;i++){let person=new THREE.Group();let x=-18+i*5,z=i%2?-7:13;person.position.set(x,0,z);scene.add(person);block(person,0,1,0,.5,1,.5,'orange');block(person,0,1.75,0,.48,.45,.48,'yellow');let arm=block(person,.48,1.15,0,.2,.8,.2,'white');workers.push(arm)}let nightLights=[];for(let x of [-20,0,20]){block(scene,x,4,-18,.25,8,.25,'steel');let light=new THREE.PointLight(0xffc477,0,25);light.position.set(x,8,-18);scene.add(light);nightLights.push(light)}
for(let i=0;i<25;i++){let x=-21+(i*7)%44,z=-17+(i*11)%34;if(Math.abs(z)<4)z+=6;block(scene,x,1,z,.5,1,.5,'yellow');block(scene,x,1.75,z,.55,.45,.55,'white')}for(let i=0;i<10;i++)block(scene,-22+i*5,1,-18,1,.25,.25,i%2?'yellow':'red');block(scene,-28,.1,18,7,.1,5,'white');block(scene,-29,.2,18,3,.1,.1,'blue');block(scene,-28,.2,19,5,.1,.1,'blue');block(scene,29,.3,15,4,.4,1,'yellow');block(scene,28,.4,-17,3,.5,3,'yellow');
let speeds=[0,.4,1,1.8],speedIndex=2,dayCycle=true,dustLevel=1,raining=false,knobs=[];for(let i=0;i<3;i++){let o=block(scene,-8+i*4,0,24,2,.6,2,['yellow','blue','red'][i]);o.userData.knob=i;knobs.push(o)}const particleGeo=new THREE.BufferGeometry(),coords=new Float32Array(450*3);for(let i=0;i<450;i++){coords[i*3]=(Math.random()-.5)*48;coords[i*3+1]=Math.random()*20;coords[i*3+2]=(Math.random()-.5)*36}particleGeo.setAttribute('position',new THREE.BufferAttribute(coords,3));let particleMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{opacity:{value:.25},rain:{value:0}},vertexShader:'uniform float rain; void main(){vec4 p=modelViewMatrix*vec4(position,1.);gl_PointSize=rain>0.5?3.0:5.0;gl_Position=projectionMatrix*p;}',fragmentShader:'uniform float opacity;uniform float rain;void main(){float r=length(gl_PointCoord-.5);float a=smoothstep(.5,.05,r)*opacity;gl_FragColor=vec4(mix(vec3(.77,.63,.42),vec3(.65,.80,1.),rain),a);}'});let particles=new THREE.Points(particleGeo,particleMat);scene.add(particles);let theta=.8,phi=1.05,dist=85,target=new THREE.Vector3(0,2,0),drag=null,lastMove=0,time=0;function position(){camera.position.set(target.x+dist*Math.sin(phi)*Math.sin(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.cos(theta));camera.lookAt(target)}function labels(){document.getElementById('speed').textContent='速度：'+['暂停','慢','正常','快'][speedIndex];document.getElementById('day').textContent='昼夜循环：'+(dayCycle?'开':'关');document.getElementById('dust').textContent='尘土：'+['关','中','强'][dustLevel];document.getElementById('rain').textContent='暴雨：'+(raining?'开':'关')}function action(i){if(i===0)speedIndex=(speedIndex+1)%4;if(i===1)dayCycle=!dayCycle;if(i===2)dustLevel=(dustLevel+1)%3;labels()}document.getElementById('speed').onclick=()=>action(0);document.getElementById('day').onclick=()=>action(1);document.getElementById('dust').onclick=()=>action(2);document.getElementById('rain').onclick=()=>{raining=!raining;labels()};document.getElementById('reset').onclick=()=>{theta=.8;phi=1.05;dist=85};window.onkeydown=e=>{if(e.code==='Space'){e.preventDefault();raining=!raining;labels()}};let ray=new THREE.Raycaster();renderer.domElement.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,moved:false};renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>1)drag.moved=true;theta-=dx*.006;phi=Math.max(.35,Math.min(1.3,phi+dy*.006));drag.x=e.clientX;drag.y=e.clientY;lastMove=performance.now()};renderer.domElement.onpointerup=e=>{if(drag&&!drag.moved){let v=new THREE.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);ray.setFromCamera(v,camera);let hit=ray.intersectObjects(knobs)[0];if(hit)action(hit.object.userData.knob)}drag=null};renderer.domElement.onwheel=e=>{e.preventDefault();dist=Math.max(40,Math.min(150,dist*Math.exp(e.deltaY*.001)));lastMove=performance.now()};window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};let prev=0;function animate(t){requestAnimationFrame(animate);let dt=Math.min(.05,(t-prev)/1000||.016);prev=t;time+=dt*speeds[speedIndex];if(!drag&&t-lastMove>4000)theta+=dt*.035;position();for(let i=0;i<arms.length;i++)arms[i].rotation.z=.2*Math.sin(time+i);cranes.forEach((c,i)=>{c.top.rotation.y=Math.sin(time*.18+i)*.8;let h=2+Math.sin(time*.6+i);c.cable.scale.y=h;c.cable.position.y=-h*2;c.load.position.y=-h*4-.5});let cycle=time%32,truckX=cycle<5?-22+cycle*1.4:cycle<10?-15:cycle<21?-15+(cycle-10)*3:cycle<24?18:18-(cycle-24)*5;truck1.position.set(truckX,.5,-1);load.scale.y=cycle<5?.15:cycle<10?.15+(cycle-5)*.17:cycle<21?1:cycle<24?Math.max(.15,1-(cycle-21)*.3):.15;truck2.position.set(20-(time*1.8)%40,.5,1.8);loader.position.set(12+Math.sin(time*.4)*3,.5,12);workers.forEach((a,i)=>a.rotation.z=Math.sin(time*1.7+i)*.5);let phase=dayCycle?(Math.sin(time*.05)+1)/2:.7;hemi.intensity=.4+phase*1
