<script type="module">
let THREE;

const stage = document.getElementById("stage");
const pSpeed = document.getElementById("pSpeed");
const pCycle = document.getElementById("pCycle");
const pDust = document.getElementById("pDust");
const pRain = document.getElementById("pRain");
const pFps = document.getElementById("pFps");

// ---------- RENDERER & SCENE ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x231d19);
scene.fog = new THREE.FogExp2(0x231d19, 0.0085);

// Eye-level third-person diorama camera
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.2, 260);

// ---------- PROCEDURAL TEXTURES (ALL CODE-GENERATED) ----------
function makeWoodTexture() {
  const c = document.createElement("canvas");
  c.width = 512; c.height = 512;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#3a2214";
  ctx.fillRect(0, 0, 512, 512);
  for (let y = 0; y < 512; y++) {
    const wave = Math.sin(y * 0.07) * 14 + Math.sin(y * 0.23) * 6;
    const tone = 44 + Math.floor(Math.sin((y + wave) * 0.14) * 11);
    ctx.fillStyle = `rgb(${tone + 18}, ${Math.floor(tone * 0.68)}, ${Math.floor(tone * 0.42)})`;
    ctx.fillRect(0, y, 512, 1);
  }
  // Subtle wood plank seams
  ctx.strokeStyle = "rgba(18, 9, 4, 0.55)";
  ctx.lineWidth = 2;
  for (let i = 1; i < 6; i++) {
    ctx.beginPath(); ctx.moveTo(0, i * 85); ctx.lineTo(512, i * 85); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 2);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeBlueprintTexture() {
  const c = document.createElement("canvas");
  c.width = 256; c.height = 192;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#164e87";
  ctx.fillRect(0, 0, 256, 192);
  ctx.strokeStyle = "rgba(186, 230, 253, 0.25)";
  ctx.lineWidth = 1;
  for (let x = 0; x < 256; x += 16) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 192); ctx.stroke(); }
  for (let y = 0; y < 192; y += 16) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke(); }
  ctx.strokeStyle = "#e0f2fe";
  ctx.lineWidth = 2;
  ctx.strokeRect(12, 12, 232, 168);
  // Schematic floorplan lines
  ctx.strokeRect(28, 28, 110, 96);
  ctx.strokeRect(46, 46, 74, 60);
  ctx.beginPath(); ctx.arc(190, 74, 32, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(154, 134); ctx.lineTo(226, 134); ctx.moveTo(154, 150); ctx.lineTo(212, 150); ctx.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeKnobLabelTexture(title, sub) {
  const c = document.createElement("canvas");
  c.width = 256; c.height = 96;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#1c1917";
  ctx.fillRect(0, 0, 256, 96);
  ctx.strokeStyle = "#d97706";
  ctx.lineWidth = 4;
  ctx.strokeRect(4, 4, 248, 88);
  ctx.fillStyle = "#fef3c7";
  ctx.font = "bold 28px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(title, 128, 42);
  ctx.fillStyle = "#fbbf24";
  ctx.font = "20px monospace";
  ctx.fillText(sub, 128, 74);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeWarningStripeTexture() {
  const c = document.createElement("canvas");
  c.width = 128; c.height = 32;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#facc15";
  ctx.fillRect(0, 0, 128, 32);
  ctx.fillStyle = "#18181b";
  for (let x = -32; x < 160; x += 24) {
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x + 12, 0);
    ctx.lineTo(x - 4, 32); ctx.lineTo(x - 16, 32);
    ctx.closePath(); ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.repeat.set(4, 1);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ---------- SHARED MATERIALS ----------
const matWood = new THREE.MeshStandardMaterial({ map: makeWoodTexture(), roughness: 0.58, metalness: 0.08 });
const matDioramaSoil = new THREE.MeshStandardMaterial({ color: 0x9b7a56, roughness: 0.92, metalness: 0.04 });
const matRoad = new THREE.MeshStandardMaterial({ color: 0x57534e, roughness: 0.85, metalness: 0.06 });
const matConcrete = new THREE.MeshStandardMaterial({ color: 0xb6b9be, roughness: 0.84, metalness: 0.05 });
const matSteel = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.4, metalness: 0.72 });
const matYellow = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.42, metalness: 0.18 });
const matOrange = new THREE.MeshStandardMaterial({ color: 0xea580c, roughness: 0.45, metalness: 0.15 });
const matBlueCabin = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.5, metalness: 0.12 });
const matWhiteCabin = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.55, metalness: 0.08 });
const matStripe = new THREE.MeshStandardMaterial({ map: makeWarningStripeTexture(), roughness: 0.55 });
const matWindowGlow = new THREE.MeshStandardMaterial({ color: 0x334155, emissive: 0xffb347, emissiveIntensity: 0.05, roughness: 0.2 });

// ---------- LIGHTING & DAY/NIGHT SYSTEM ----------
const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x3b2f26, 0.72);
scene.add(hemiLight);

const sunLight = new THREE.DirectionalLight(0xfff5e0, 1.85);
sunLight.position.set(22, 34, 18);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -28;
sunLight.shadow.camera.right = 28;
sunLight.shadow.camera.top = 28;
sunLight.shadow.camera.bottom = -28;
sunLight.shadow.camera.near = 2;
sunLight.shadow.camera.far = 90;
sunLight.shadow.bias = -0.0008;
scene.add(sunLight);

// Site floodlights (glow warmly at dusk/night and boost during rainstorm!)
const siteLights = [];
function addSiteLight(x, y, z, color = 0xffbe6b) {
  const pl = new THREE.PointLight(color, 0, 18, 1.7);
  pl.position.set(x, y, z);
  scene.add(pl);
  siteLights.push(pl);
  return pl;
}

// ---------- INDOOR DARK SOLID WOOD WORKBENCH & DESK PROPS ----------
// Workbench slab: 56 x 2.2 x 38 (centered at y = -1.1)
const desk = new THREE.Mesh(new THREE.BoxGeometry(58, 2.4, 40), matWood);
desk.position.set(0, -1.2, 0);
desk.receiveShadow = true;
scene.add(desk);

// Diorama recessed wooden frame (strictly bounds the construction site: X in [-17, 17], Z in [-12.5, 12.5])
const SITE_W = 34;
const SITE_D = 25;
const trayFrame = new THREE.Mesh(
  new THREE.BoxGeometry(SITE_W + 1.2, 0.75, SITE_D + 1.2),
  new THREE.MeshStandardMaterial({ color: 0x24160d, roughness: 0.5 })
);
trayFrame.position.set(0, 0.35, -0.8);
trayFrame.receiveShadow = true;
trayFrame.castShadow = true;
scene.add(trayFrame);

// Ground slab inside diorama (y = 0.75 surface)
const GROUND_Y = 0.75;
const ground = new THREE.Mesh(new THREE.BoxGeometry(SITE_W, 0.2, SITE_D), matDioramaSoil);
ground.position.set(0, GROUND_Y - 0.1, -0.8);
ground.receiveShadow = true;
scene.add(ground);

// Desk Corner Props (outside diorama tray, on wooden workbench!)
// 1. Blueprint drawings (right-front & left-back corners)
const bp1 = new THREE.Mesh(
  new THREE.PlaneGeometry(7.2, 5.2),
  new THREE.MeshStandardMaterial({ map: makeBlueprintTexture(), roughness: 0.85 })
);
bp1.rotation.x = -Math.PI / 2;
bp1.rotation.z = -0.18;
bp1.position.set(22.4, 0.03, 9.2);
bp1.receiveShadow = true;
scene.add(bp1);

const bpRoll = new THREE.Mesh(
  new THREE.CylinderGeometry(0.45, 0.45, 6.4, 14),
  new THREE.MeshStandardMaterial({ color: 0xe0f2fe, roughness: 0.75 })
);
bpRoll.rotation.z = Math.PI / 2;
bpRoll.rotation.y = 0.32;
bpRoll.position.set(22.6, 0.45, 4.2);
bpRoll.castShadow = true;
scene.add(bpRoll);

// 2. Steel tape measure (left-front corner)
const tapeGroup = new THREE.Group();
tapeGroup.position.set(-22.2, 0, 8.6);
tapeGroup.rotation.y = 0.45;
const tapeBody = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.3, 2.6), matYellow);
tapeBody.position.y = 0.65; tapeBody.castShadow = true;
tapeGroup.add(tapeBody);
const tapeGrip = new THREE.Mesh(new THREE.BoxGeometry(2.75, 0.9, 1.4), new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.8 }));
tapeGrip.position.y = 0.65;
tapeGroup.add(tapeGrip);
const tapeBlade = new THREE.Mesh(new THREE.BoxGeometry(5.5, 0.06, 0.7), new THREE.MeshStandardMaterial({ color: 0xfde047, metalness: 0.5, roughness: 0.3 }));
tapeBlade.position.set(4.0, 0.05, 0.5);
tapeGroup.add(tapeBlade);
scene.add(tapeGroup);

// 3. Miniature Yellow Safety Helmet ornament (left-back corner)
const hatGroup = new THREE.Group();
hatGroup.position.set(-22.8, 0, -7.8);
hatGroup.rotation.y = 0.6;
const hatDome = new THREE.Mesh(new THREE.SphereGeometry(2.2, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.52), matYellow);
hatDome.castShadow = true;
hatGroup.add(hatDome);
const hatBrim = new THREE.Mesh(new THREE.CylinderGeometry(2.55, 2.65, 0.25, 18), matYellow);
hatBrim.position.y = 0.12;
hatGroup.add(hatBrim);
const hatRidge = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.45, 3.8), matYellow);
hatRidge.position.y = 2.05;
hatGroup.add(hatRidge);
scene.add(hatGroup);

// 4. Metallic Spirit Level (right-back corner)
const levelGroup = new THREE.Group();
levelGroup.position.set(22.6, 0.45, -7.2);
levelGroup.rotation.y = 1.25;
const levelBar = new THREE.Mesh(new THREE.BoxGeometry(9.6, 0.9, 1.3), new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.85, roughness: 0.25 }));
levelBar.castShadow = true;
levelGroup.add(levelBar);
const levelVial = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.94, 0.7), new THREE.MeshStandardMaterial({ color: 0x4ade80, emissive: 0x22c55e, emissiveIntensity: 0.35, roughness: 0.15 }));
levelGroup.add(levelVial);
scene.add(levelGroup);

// ---------- PHYSICAL 3D INTERACTIVE CONTROL KNOBS ON WORKBENCH FRONT EDGE ----------
const interactiveKnobs = [];
const knobStates = {
  speedIdx: 1, // 0: 0.0 (暂停), 1: 1.0x, 2: 1.8x, 3: 0.5x
  speedValues: [0, 1.0, 1.8, 0.45],
  speedLabels: ["暂停", "1.0×", "1.8×", "0.45×"],
  dayCycle: true,
  timeOfDay: 0.36, // 0..1 (0.12 dawn, 0.36 noon, 0.65 dusk, 0.88 night)
  dustIdx: 1, // 0: 低, 1: 中, 2: 高
  dustValues: [0.35, 1.0, 2.2],
  dustLabels: ["低", "中", "高"],
  raining: false
};

const consoleBase = new THREE.Mesh(
  new THREE.BoxGeometry(16.8, 1.2, 4.2),
  new THREE.MeshStandardMaterial({ color: 0x1c1917, roughness: 0.45, metalness: 0.45 })
);
consoleBase.position.set(0, 0.6, 15.6);
consoleBase.castShadow = true;
consoleBase.receiveShadow = true;
scene.add(consoleBase);

function createControlKnob(id, xPos, title, subText, accentHex) {
  const g = new THREE.Group();
  g.position.set(xPos, 1.22, 15.2);

  const bezel = new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.5, 0.35, 20), matSteel);
  bezel.position.y = 0.18;
  g.add(bezel);

  const dial = new THREE.Group();
  dial.position.y = 0.52;
  const cap = new THREE.Mesh(
    new THREE.CylinderGeometry(1.05, 1.12, 0.65, 20),
    new THREE.MeshStandardMaterial({ color: 0x292524, roughness: 0.35, metalness: 0.55 })
  );
  cap.castShadow = true;
  dial.add(cap);

  const indicator = new THREE.Mesh(
    new THREE.BoxGeometry(0.18, 0.16, 0.72),
    new THREE.MeshStandardMaterial({ color: accentHex, emissive: accentHex, emissiveIntensity: 0.7 })
  );
  indicator.position.set(0, 0.35, -0.35);
  dial.add(indicator);
  g.add(dial);

  // Hit cylinder for easy raycast clicking
  const hit = new THREE.Mesh(
    new THREE.CylinderGeometry(1.65, 1.65, 1.4, 12),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  hit.position.y = 0.6;
  hit.userData.knobId = id;
  g.add(hit);

  // Label plate in front of knob
  const labelTex = makeKnobLabelTexture(title, subText);
  const plate = new THREE.Mesh(
    new THREE.PlaneGeometry(4.2, 1.4),
    new THREE.MeshBasicMaterial({ map: labelTex })
  );
  plate.rotation.x = -Math.PI / 2.4;
  plate.position.set(0, 0.14, 1.75);
  g.add(plate);

  scene.add(g);
  interactiveKnobs.push({ id, hit, dial, plate, title });
}

createControlKnob("speed", -5.2, "机械速度", "1.0×", 0xf59e0b);
createControlKnob("cycle", 0.0, "昼夜循环", "开启", 0x38bdf8);
createControlKnob("dust", 5.2, "尘土强度", "中", 0xa8a29e);

// ---------- CONSTRUCTION SITE ZONES (ALL STRICTLY INSIDE [-16.5..16.5, -13..11.5]) ----------
const site = new THREE.Group();
site.position.set(0, GROUND_Y, -0.8); // Local site space: X in [-17,17], Z in [-12.5,12.5]
scene.add(site);

// 1. Temporary Construction Road Loop (clean rectangular ring so dump trucks never clip anything!)
// Road loop centerline: X = ±12.8, Z = ±8.6 (width = 2.6)
function addRoadSegment(x, z, w, d) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, d), matRoad);
  m.position.set(x, 0.04, z);
  m.receiveShadow = true;
  site.add(m);
}
addRoadSegment(0, 8.6, 28.2, 2.5);   // South main road
addRoadSegment(0, -8.6, 28.2, 2.5);  // North road
addRoadSegment(-12.8, 0, 2.5, 19.6); // West road
addRoadSegment(12.8, 0, 2.5, 19.6);  // East road
addRoadSegment(0, 0, 2.2, 15.0);     // Center cross road for concrete mixer

// 2. Excavation Pit Zone (West-Center: X in [-10.5..-3.5], Z in [-5.8..4.8])
const pitMat = new THREE.MeshStandardMaterial({ color: 0x6b4c32, roughness: 0.96 });
const pitFloor = new THREE.Mesh(new THREE.BoxGeometry(6.8, 0.14, 9.6), new THREE.MeshStandardMaterial({ color: 0x4a3320, roughness: 0.98 }));
pitFloor.position.set(-7.0, 0.07, -0.4);
pitFloor.receiveShadow = true;
site.add(pitFloor);
// Retaining soil steps around excavation pit
for (const [x, z, w, d, h] of [
  [-7.0, -5.4, 7.4, 0.9, 0.55],
  [-7.0, 4.6, 7.4, 0.9, 0.55],
  [-10.4, -0.4, 0.9, 9.6, 0.55],
  [-3.6, -0.4, 0.9, 9.6, 0.55]
]) {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), pitMat);
  wall.position.set(x, h * 0.5, z);
  wall.castShadow = true; wall.receiveShadow = true;
  site.add(wall);
}

// 3. High-Rise Building Core Under Construction (East-Center: X in [3.2..9.6], Z in [-5.8..1.2])
const bldg = new THREE.Group();
bldg.position.set(6.4, 0, -2.3);
// Foundation pad
const pad = new THREE.Mesh(new THREE.BoxGeometry(7.0, 0.35, 7.0), matConcrete);
pad.position.y = 0.18; pad.receiveShadow = true;
bldg.add(pad);
// 4 Floor slabs + columns + safety mesh + scaffolding
for (let f = 0; f < 4; f++) {
  const fy = 0.35 + f * 2.1;
  const slab = new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.28, 6.2), matConcrete);
  slab.position.y = fy + 2.0; slab.castShadow = true; slab.receiveShadow = true;
  bldg.add(slab);
  // Concrete columns (3x3 grid)
  for (let cx = -2.6; cx <= 2.6; cx += 2.6) {
    for (let cz = -2.6; cz <= 2.6; cz += 2.6) {
      const col = new THREE.Mesh(new THREE.BoxGeometry(0.45, 2.0, 0.45), matConcrete);
      col.position.set(cx, fy + 1.0, cz);
      col.castShadow = true;
      bldg.add(col);
    }
  }
  // Core elevator shaft

function createExcavator(x, z, baseRot) {
  const root = new THREE.Group();

  const tR = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.45, 0.52), trackMat); tR.position.set(0, 0.22, 0.68); tR.castShadow = true;
  const chas = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.32, 1.1), matSteel); chas.position.y = 0.45;

  body.position.set(-0.2, 0.45, 0); body.castShadow = true;
  turret.add(body);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.85, 0.72), new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.2, metalness: 0.2 }));
  cab.position.set(0.28, 0.95, 0.34);
  turret.add(cab);

  // Articulated Boom -> Stick -> Bucket
  const boomPivot = new THREE.Group();
  boomPivot.position.set(0.62, 0.55, -0.2);
  const boom = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.34, 0.32), matYellow);
  boom.position.set(1.0, 0.25, 0); boom.rotation.z = 0.26; boom.castShadow = true;
  boomPivot.add(boom);

  const stickPivot = new THREE.Group();
  stickPivot.position.set(1.95, 0.55, 0);
  const stick = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.65, 0.28), matOrange);
  stick.position.set(0.22, -0.75, 0); stick.rotation.z = 0.22; stick.castShadow = true;
  stickPivot.add(stick);

  const bucketPivot = new THREE.Group();
  bucketPivot.position.set(0.38, -1.52, 0);
  const bucket = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.52, 0.62), matSteel);

  stickPivot.add(bucketPivot);
  boomPivot.add(stickPivot);
  turret.add(boomPivot);
  root.add(turret);
  site.add(root);

  return { root, turret, boomPivot, stickPivot, bucketPivot };
}

  cab.position.set(0.55, -0.3, 0.55); jibGroup.add(cab);

  const apex = new THREE.Mesh(new THREE.ConeGeometry(0.7, 2.4, 4), matYellow);
  apex.position.y = 1.6; jibGroup.add(apex);

  const jib = new THREE.Mesh(new THREE.BoxGeometry(jibLen, 0.55, 0.65), matYellow);
  jib.position.set(jibLen * 0.32, 0.4, 0); jib.castShadow = true;
  jibGroup.add(jib);

  const counterWeight = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.9, 1.1), matConcrete);
  counterWeight.position.set(-jibLen * 0.22, 0.25, 0);
  jibGroup.add(counterWeight);

  // Red aircraft warning beacon on crane peak
  const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
  beacon.position.y = 2.9; jibGroup.add(beacon);
  glowPositions.push(new THREE.Vector3(x, GROUND_Y + mastH + 3.4, z - 0.8));

  // Sliding Trolley + Cable + Load
  const trolley = new THREE.Group();
  trolley.position.set(jibLen * 0.5, 0.05, 0);
  const trolleyBox = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.35, 0.8), matOrange);
  trolley.add(trolleyBox);

  const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1, 6), matSteel);
  trolley.add(cable);

  const load = new THREE.Group();
  if (payloadType === "rebar") {
    for (let i = 0; i < 4; i++) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.12, 0.12), new THREE.MeshStandardMaterial({ color: 0x9a3412, metalness: 0.6 }));
      b.position.set(0, -0.1, -0.22 + i * 0.15);
      load.add(b);
    }
  } else {
    const hopper = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.28, 1.1, 8), matOrange);
    hopper.position.y = -0.5;
    load.add(hopper);
  }
  trolley.add(load);
  jibGroup.add(trolley);
  root.add(jibGroup);
  site.add(root);

  return { jibGroup, trolley, cable, load, jibLen };
}

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.48, 0.26), new THREE.MeshStandardMaterial({ color: vestPalette[vestIdx % 3] }));
  torso.position.y = 0.68; torso.castShadow = true; g.add(torso);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.28), new THREE.MeshStandardMaterial({ color: 0xfdba74 }));
  head.position.y = 1.06; g.add(head);
  const helmet = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.16, 0.34), new THREE.MeshStandardMaterial({ color: helmetPalette[hatIdx % 4] }));
  helmet.position.y = 1.24; g.add(helmet);

  const armL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.4, 0.12), new THREE.MeshStandardMaterial({ color: vestPalette[vestIdx % 3] }));
  armL.position.set(-0.26, 0.72, 0); g.add(armL);
  const armR = armL.clone(); armR.position.x = 0.26; g.add(armR);

  site.add(g);
  workers.push({ g, armL, armR, role, baseX: x, baseZ: z, phase: Math.random() * 6.28 });
}

// Rebar tying workers at shed
spawnWorker(4.8, -10.3, "tie", 0, 0);
spawnWorker(7.2, -10.3, "tie", 0, 1);
// Carrying materials near west yard & building
spawnWorker(-14.6, -2.0, "carry", 2, 0);
spawnWorker(2.6, 1.5, "carry", 0, 1);
// Crane signalers
spawnWorker(9.4, -3.5, "signal", 1, 0);
spawnWorker(2.2, -3.2, "signal", 1, 1);
// Tool operators near building & pit
spawnWorker(4.4, 1.6, "tool", 0, 0);
spawnWorker(-2.2, 2.2, "tool", 3, 1);
// Security guard patrolling main South gate!
spawnWorker(0.0, 11.4, "patrol", 3, 2);
spawnWorker(4.2, 6.6, "walk", 2, 1);
spawnWorker(-4.0, 7.1, "walk", 0, 0);

// ---------- CUSTOM SHADER: FLOATING DUST PARTICLES ----------
const dustCount = 420;
const dustPos = new Float32Array(dustCount * 3);
const dustSeed = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) {
  dustPos[i * 3] = (Math.random() - 0.5) * (SITE_W - 2);
  dustPos[i * 3 + 1] = GROUND_Y + 0.4 + Math.random() * 7.5;
  dustPos[i * 3 + 2] = -0.8 + (Math.random() - 0.5) * (SITE_D - 2);
  dustSeed[i * 3] = Math.random() * 10;
  dustSeed[i * 3 + 1] = 0.4 + Math.random() * 0.9;
  dustSeed[i * 3 + 2] = 0.6 + Math.random() * 1.4;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute("aSeed", new THREE.BufferAttribute(dustSeed, 3));
const dustUniforms = {
  uTime: { value: 0 },
  uDensity: { value: 1.0 },
  uPixelRatio: { value: renderer.getPixelRatio() }
};
const dustMat = new THREE.ShaderMaterial({
  uniforms: dustUniforms,
  transparent: true,
  depthWrite: false,
  vertexShader: `
    attribute vec3 aSeed;
    uniform float uTime;
    uniform float uDensity;
    uniform float uPixelRatio;
    varying float vAlpha;
    void main() {
      vec3 p = position;
      p.x += sin(uTime * 0.45 * aSeed.y + aSeed.x) * 1.6;
      p.y += mod(uTime * 0.35 * aSeed.y + aSeed.x, 5.5) * 0.45;
      p.z += cos(uTime * 0.38 * aSeed.y + aSeed.x) * 1.4;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = clamp((16.0 * aSeed.z * uPixelRatio * (0.7 + uDensity * 0.35)) / max(1.0, -mv.z), 2.0, 28.0);
      vAlpha = clamp(0.18 * uDensity, 0.05, 0.48);
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float soft = smoothstep(0.5, 0.0, d);
      gl_FragColor = vec4(0.85, 0.75, 0.58, soft * vAlpha);
    }
  `
});
scene.add(new THREE.Points(dustGeo, dustMat));

// ---------- CUSTOM SHADER: WARM LIGHT GLOW HALOS ----------
const glowGeo = new THREE.BufferGeometry();
glowGeo.setAttribute("position", new THREE.Float32BufferAttribute(glowPositions.flatMap(v => [v.x, v.y, v.z]), 3));
const glowUniforms = { uStrength: { value: 0.15 }, uPixelRatio: { value: renderer.getPixelRatio() } };
const glowMat = new THREE.ShaderMaterial({
  uniforms: glowUniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uPixelRatio;
    uniform float uStrength;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = clamp((115.0 * uPixelRatio * (0.5 + uStrength * 0.7)) / max(1.0, -mv.z), 4.0, 140.0);
    }
  `,
  fragmentShader: `
    uniform float uStrength;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float g = pow(1.0 - d * 2.0, 2.2);
      gl_FragColor = vec4(1.0, 0.76, 0.36, g * uStrength);
    }
  `
});
scene.add(new THREE.Points(glowGeo, glowMat));

// ---------- CUSTOM SHADER: RAINSTORM PARTICLES (SPACEBAR TOGGLE) ----------
const rainCount = 1600;
const rainPos = new Float32Array(rainCount * 3);
const rainSeed = new Float32Array(rainCount);
for (let i = 0; i < rainCount; i++) {
  rainPos[i * 3] = (Math.random() - 0.5) * SITE_W;
  rainPos[i * 3 + 1] = Math.random() * 20;
  rainPos[i * 3 + 2] = -0.8 + (Math.random() - 0.5) * SITE_D;
  rainSeed[i] = Math.random();
}
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute("position", new THREE.BufferAttribute(rainPos, 3));
rainGeo.setAttribute("aSeed", new THREE.BufferAttribute(rainSeed, 1));
const rainUniforms = { uTime: { value: 0 }, uRain: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } };
const rainMat = new THREE.ShaderMaterial({
  uniforms: rainUniforms,
  transparent: true,
  depthWrite: false,
  vertexShader: `
    attribute float aSeed;
    uniform float uTime;
    uniform float uPixelRatio;
    void main() {
      vec3 p = position;
      float fall = fract(aSeed - uTime * 1.45);
      p.y = 0.8 + fall * 20.0;
      p.x += (1.0 - fall) * 1.6;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = clamp((12.0 * uPixelRatio) / max(1.0, -mv.z), 1.5, 14.0);
    }
  `,
  fragmentShader: `
    uniform float uRain;
    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      if (abs(uv.x) > 0.14) discard;
      gl_FragColor = vec4(0.72, 0.86, 1.0, uRain * 0.65);
    }
  `
});
const rainPoints = new THREE.Points(rainGeo, rainMat);
scene.add(rainPoints);

// ---------- INTERACTION: ORBIT + IDLE AUTO-ROTATE + 3D KNOB RAYCAST + SPACEBAR RAIN ----------
const camOrbit = { yaw: 0.35, pitch: 0.42, radius: 44, target: new THREE.Vector3(0, 3.2, 0.5) };
let dragging = false, moved = false, lastX = 0, lastY = 0, idleTimer = 0;

const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();

function triggerKnob(id) {
  if (id === "speed") {
    knobStates.speedIdx = (knobStates.speedIdx + 1) % knobStates.speedValues.length;
  } else if (id === "cycle") {
    knobStates.dayCycle = !knobStates.dayCycle;
  } else if (id === "dust") {
    knobStates.dustIdx = (knobStates.dustIdx + 1) % knobStates.dustValues.length;
  }
  syncKnobVisuals();
}

function toggleRain() {
  knobStates.raining = !knobStates.raining;
  syncKnobVisuals();
}

function syncKnobVisuals() {
  const spLabel = knobStates.speedLabels[knobStates.speedIdx];
  const duLabel = knobStates.dustLabels[knobStates.dustIdx];
  pSpeed.textContent = `⚙️ 速度: ${spLabel}`;
  pDust.textContent = `🌫️ 尘土: ${duLabel}`;
  pRain.textContent = `🌧️ 暴雨: ${knobStates.raining ? "开 (Space)" : "关 (Space)"}`;
  pRain.classList.toggle("on", knobStates.raining);
  pCycle.classList.toggle("on", knobStates.dayCycle);

  dustUniforms.uDensity.value = knobStates.dustValues[knobStates.dustIdx] * (knobStates.raining ? 0.25 : 1.0);
  // Wet reflective ground during rainstorm
  matDioramaSoil.roughness = knobStates.raining ? 0.22 : 0.92;
  matRoad.roughness = knobStates.raining ? 0.16 : 0.85;
  matRoad.metalness = knobStates.raining ? 0.38 : 0.06;

  // Rotate physical 3D knob dials & update label textures
  for (const k of interactiveKnobs) {
    if (k.id === "speed") {
      k.dial.rotation.y = -0.9 + knobStates.speedIdx * 0.65;
      k.plate.material.map = makeKnobLabelTexture("机械速度", spLabel);
    } else if (k.id === "cycle") {
      k.dial.rotation.y = knobStates.dayCycle ? 0.55 : -0.55;
      k.plate.material.map = makeKnobLabelTexture("昼夜循环", knobStates.dayCycle ? "开启" : "暂停");
    } else if (k.id === "dust") {
      k.dial.rotation.y = -0.75 + knobStates.dustIdx * 0.75;
      k.plate.material.map = makeKnobLabelTexture("尘土强度", duLabel);
    }
    k.plate.material.needsUpdate = true;
  }
}

pSpeed.onclick = () => triggerKnob("speed");
pCycle.onclick = () => triggerKnob("cycle");
pDust.onclick = () => triggerKnob("dust");
pRain.onclick = toggleRain;

window.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    toggleRain();
  }
});

renderer.domElement.addEventListener("pointerdown", (e) => {
  dragging = true;
  moved = false;
  lastX = e.clientX;
  lastY = e.clientY;
  idleTimer = 0;
});

window.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  lastX = e.clientX;
  lastY = e.clientY;
  camOrbit.yaw -= dx * 0.006;
  camOrbit.pitch = Math.max(0.14, Math.min(1.25, camOrbit.pitch + dy * 0.005));
  idleTimer = 0;
});

window.addEventListener("pointerup", (e) => {
  if (dragging && !moved) {
    // Check raycast hit on physical workbench knobs!
    const rect = renderer.domElement.getBoundingClientRect();
    pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointerNDC, camera);
    const hits = raycaster.intersectObjects(interactiveKnobs.map(k => k.hit));
    if (hits.length > 0) {
      triggerKnob(hits[0].object.userData.knobId);
    }
  }
  dragging = false;
});

renderer.domElement.addEventListener("wheel", (e) => {
  camOrbit.radius = Math.max(18, Math.min(72, camOrbit.radius + e.deltaY * 0.03));
  idleTimer = 0;
}, { passive: true });

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- DAY/NIGHT 4-PHASE PALETTE INTERPOLATION ----------
const phases = [
  { t: 0.00, name: "夜晚", bg: new THREE.Color(0x0b1020), sun: new THREE.Color(0x7c9ad4), sunI: 0.32, hemi: 0.25, night: 1.0 },
  { t: 0.22, name: "黎明", bg: new THREE.Color(0x4b3446), sun: new THREE.Color(0xff9e68), sunI: 1.15, hemi: 0.55, night: 0.45 },
  { t: 0.45, name: "正午", bg: new THREE.Color(0x2d3a4b), sun: new THREE.Color(0xfff6e5), sunI: 2.05, hemi: 0.85, night: 0.0 },
  { t: 0.72, name: "黄昏", bg: new THREE.Color(0x4a2924), sun: new THREE.Color(0xff773b), sunI: 1.25, hemi: 0.5, night: 0.55 },
  { t: 1.00, name: "夜晚", bg: new THREE.Color(0x0b1020), sun: new THREE.Color(0x7c9ad4), sunI: 0.32, hemi: 0.25, night: 1.0 }
];
const tmpBg = new THREE.Color();
const tmpSun = new THREE.Color();

function updateEnvironment(dt) {
  if (knobStates.dayCycle) {
    knobStates.timeOfDay = (knobStates.timeOfDay + dt * 0.025) % 1.0;
  }
  const t = knobStates.timeOfDay;
  let a = phases[0], b = phases[1];
  for (let i = 0; i < phases.length - 1; i++) {
    if (t >= phases[i].t && t <= phases[i + 1].t) {
      a = phases[i]; b = phases[i + 1]; break;
    }
  }
  const f = (t - a.t) / Math.max(0.0001, b.t - a.t);
  tmpBg.lerpColors(a.bg, b.bg, f);
  tmpSun.lerpColors(a.sun, b.sun, f);
  const rainDim = knobStates.raining ? 0.52 : 1.0;
  if (knobStates.raining) tmpBg.multiplyScalar(0.55);

  scene.background.copy(tmpBg);
  scene.fog.color.copy(tmpBg);
  sunLight.color.copy(tmpSun);
  sunLight.intensity = THREE.MathUtils.lerp(a.sunI, b.sunI, f) * rainDim;
  hemiLight.intensity = THREE.MathUtils.lerp(a.hemi, b.hemi, f) * (knobStates.raining ? 0.75 : 1.0);

  const sunAng = t * Math.PI * 2 - Math.PI * 0.5;
  sunLight.position.set(Math.cos(sunAng) * 34, Math.max(8, Math.sin(sunAng) * 34 + 12), 18);

  const nightFactor = Math.min(1.35, THREE.MathUtils.lerp(a.night, b.night, f) + (knobStates.raining ? 0.55 : 0));
  for (const pl of siteLights) {
    pl.intensity = nightFactor * 26;
  }
  matWindowGlow.emissiveIntensity = 0.08 + nightFactor * 1.45;
  glowUniforms.uStrength.value = 0.08 + nightFactor * 0.85;
  rainUniforms.uRain.value = THREE.MathUtils.lerp(rainUniforms.uRain.value, knobStates.raining ? 1.0 : 0.0, dt * 6);

  const phaseName = t < 0.14 || t > 0.85 ? "夜晚" : (t < 0.32 ? "黎明" : (t < 0.62 ? "正午" : "黄昏"));
  pCycle.textContent = `${phaseName === "夜晚" ? "🌙" : phaseName === "正午" ? "☀️" : "🌅"} 昼夜: ${phaseName} (${knobStates.dayCycle ? "循环开" : "已停"})`;
}

// ---------- MACHINERY & WORKER ANIMATION ----------
let simTime = 0;
const routeLengths = [];
let totalRouteLen = 0;
for (let i = 0; i < truckRoute.length; i++) {
  const len = truckRoute[i].distanceTo(truckRoute[(i + 1) % truckRoute.length]);
  routeLengths.push(len);
  totalRouteLen += len;
}

function sampleRoute(u) {
  let dist = ((u % 1) + 1) % 1 * totalRouteLen;
  for (let i = 0; i < truckRoute.length; i++) {
    const len = routeLengths[i];
    if (dist <= len) {
      const p0 = truckRoute[i];
      const p1 = truckRoute[(i + 1) % truckRoute.length];
      const pos = new THREE.Vector3().lerpVectors(p0, p1, dist / len);
      const dir = new THREE.Vector3().subVectors(p1, p0).normalize();
      return { pos, angle: Math.atan2(-dir.z, dir.x), seg: i, segT: dist / len };
    }
    dist -= len;
  }
  return { pos: truckRoute[0].clone(), angle: 0, seg: 0, segT: 0 };
}

function updateMachinery(dt) {
  const spd = knobStates.speedValues[knobStates.speedIdx];
  simTime += dt * spd;
  dustUniforms.uTime.value = simTime;
  rainUniforms.uTime.value += dt;

  // Excavators digging rhythm
  const dig1 = Math.sin(simTime * 1.6);
  exc1.turret.rotation.y = Math.sin(simTime * 0.7) * 0.55;
  exc1.boomPivot.rotation.z = -0.15 + dig1 * 0.22;
  exc1.stickPivot.rotation.z = 0.25 - dig1 * 0.42;
  exc1.bucketPivot.rotation.z = -0.2 + dig1 * 0.55;

  const dig2 = Math.sin(simTime * 1.45 + 1.8);
  exc2.turret.rotation.y = Math.sin(simTime * 0.65 + 1.2) * 0.48;
  exc2.boomPivot.rotation.z = -0.1 + dig2 * 0.24;
  exc2.stickPivot.rotation.z = 0.2 - dig2 * 0.38;
  exc2.bucketPivot.rotation.z = -0.2 + dig2 * 0.5;

  // Tower cranes rotating & hoisting loads
  crane1.jibGroup.rotation.y = -0.6 + Math.sin(simTime * 0.32) * 1.05;
  const tr1 = 0.35 + (Math.sin(simTime * 0.5) * 0.5 + 0.5) * 0.45;
  crane1.trolley.position.x = crane1.jibLen * tr1;
  const cLen1 = 2.6 + (Math.sin(simTime * 0.75) * 0.5 + 0.5) * 4.5;
  crane1.cable.scale.y = cLen1;
  crane1.cable.position.y = -cLen1 * 0.5;
  crane1.load.position.y = -cLen1;

  crane2.jibGroup.rotation.y = 1.4 + Math.cos(simTime * 0.28) * 0.9;
  const tr2 = 0.32 + (Math.cos(simTime * 0.45) * 0.5 + 0.5) * 0.42;
  crane2.trolley.position.x = crane2.jibLen * tr2;
  const cLen2 = 2.4 + (Math.cos(simTime * 0.65) * 0.5 + 0.5) * 4.0;
  crane2.cable.scale.y = cLen2;
  crane2.cable.position.y = -cLen2 * 0.5;
  crane2.load.position.y = -cLen2;

  // Dump trucks looping & tilting bed at spoil mound (seg === 2 -> seg === 3)
  for (const tr of dumpTrucks) {
    tr.progress = (tr.progress + dt * spd * 0.045) % 1;
    const sample = sampleRoute(tr.progress);
    tr.group.position.copy(sample.pos);
    tr.group.rotation.y = sample.angle;

    // Show dirt load between excavator (seg 1) and spoil mound (seg 3)
    const loaded = sample.seg === 1 || sample.seg === 2;
    const dumping = sample.seg === 3 && sample.segT < 0.22;
    tr.dirt.visible = loaded || dumping;
    tr.bedPivot.rotation.z = dumping ? Math.sin((sample.segT / 0.22) * Math.PI) * 0.58 : 0;
  }

  // Concrete mixer patrolling center cross road
  const mixZ = Math.sin(simTime * 0.35) * 5.6;
  mixerGroup.position.set(0, 0, mixZ);
  mixerGroup.rotation.y = Math.cos(simTime * 0.35) >= 0 ? 0 : Math.PI;
  drum.rotation.y = simTime * 2.4;

  // Compact loader grading yard back & forth
  loader.position.x = -6.6 + Math.sin(simTime * 0.65) * 2.5;
  loader.rotation.y = Math.cos(simTime * 0.65) >= 0 ? 0 : Math.PI;

  // Voxel workers
  for (const w of workers) {
    const t = simTime * 3.0 + w.phase;
    if (w.role === "patrol") {
      w.g.position.x = Math.sin(simTime * 0.55) * 2.1;
      w.g.rotation.y = Math.cos(simTime * 0.55) >= 0 ? Math.PI / 2 : -Math.PI / 2;
      w.armL.rotation.x = Math.sin(t) * 0.5;
      w.armR.rotation.x = -Math.sin(t) * 0.5;
    } else if (w.role === "signal") {
      w.armL.rotation.z = -2.2 + Math.sin(t * 1.4) * 0.45;
      w.armR.rotation.z = 2.2 - Math.sin(t * 1.4) * 0.45;
    } else if (w.role === "tool") {
      w.g.position.y = Math.abs(Math.sin(t * 3.5)) * 0.08;
      w.armL.rotation.x = -0.9 + Math.sin(t * 3.5) * 0.25;
      w.armR.rotation.x = -0.9 + Math.sin(t * 3.5) * 0.25;
    } else if (w.role === "walk" || w.role === "carry") {
      w.g.position.x = w.baseX + Math.sin(simTime * 0.6 + w.phase) * 1.0;
      w.armL.rotation.x = w.role === "carry" ? -1.1 : Math.sin(t) * 0.45;
      w.armR.rotation.x = w.role === "carry" ? -1.1 : -Math.sin(t) * 0.45;
    } else {
      // Tying rebar
      w.armL.rotation.x = -0.8 + Math.sin(t * 1.6) * 0.3;
      w.armR.rotation.x = -0.8 + Math.cos(t * 1.6) * 0.3;
    }
  }
}

// ---------- MAIN LOOP ----------
syncKnobVisuals();
const clock = new THREE.Clock();
let frames = 0, fpsAcc = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  if (!dragging) {
    idleTimer += dt;
    if (idleTimer > 2.5) {
      camOrbit.yaw += dt * 0.09;
    }
  }

  updateEnvironment(dt);
  updateMachinery(dt);

  camera.position.set(
    camOrbit.target.x + camOrbit.radius * Math.cos(camOrbit.pitch) * Math.sin(camOrbit.yaw),
    camOrbit.target.y + camOrbit.radius * Math.sin(camOrbit.pitch),
    camOrbit.target.z + camOrbit.radius * Math.cos(camOrbit.pitch) * Math.cos(camOrbit.yaw)
  );
  camera.lookAt(camOrbit.target);

  renderer.render(scene, camera);

  frames++; fpsAcc += dt;
  if (fpsAcc >= 0.5) {
    pFps.textContent = `${Math.round(frames / fpsAcc)} FPS`;
    frames = 0; fpsAcc = 0;
  }
}

animate();
</script>
