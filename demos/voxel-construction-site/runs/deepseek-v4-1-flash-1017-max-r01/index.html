<!doctype html>
<html lang="zh-CN">
<head>
<script src="../../../../assets/analytics.js" defer></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>Voxel Site · 体素微缩建筑工地</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #07080d;
    --panel: rgba(12, 14, 22, .78);
    --line: rgba(220, 200, 160, .17);
    --line-strong: rgba(220, 200, 160, .32);
    --text: #f2efe7;
    --muted: #a39d8e;
    --dim: #6e6a5f;
    --amber: #f0b64a;
    --orange: #e86d2c;
    --red: #d84a3a;
    --green: #79a66d;
    --blue: #7fb5d8;
    --radius: 15px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(circle at 52% 44%, transparent 38%, rgba(2,3,6,.42) 78%, rgba(1,2,4,.76) 100%);
  }
  .topbar {
    position: fixed; left: clamp(14px, 2.6vw, 34px); right: clamp(14px, 2.6vw, 34px); top: clamp(12px, 2.2vw, 26px);
    z-index: 6; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; pointer-events: none; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark {
    width: 46px; height: 46px; flex: none; border-radius: 13px; display: grid; place-items: center;
    background: linear-gradient(150deg, rgba(240,182,74,.18), rgba(232,109,44,.12));
    border: 1px solid rgba(240,182,74,.34); color: var(--amber);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 16px 34px -22px rgba(240,182,74,.8);
  }
  .brand-mark svg { width: 26px; height: 26px; }
  .brand h1 { margin: 0; font-size: clamp(16px, 1.9vw, 21px); font-weight: 800; letter-spacing: .12em; }
  .brand p { margin: 3px 0 0; color: var(--muted); font-size: 10px; letter-spacing: .05em; }
  .brand p b { color: var(--amber); font-weight: 650; }
  .top-right { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; justify-content: flex-end; pointer-events: auto; }
  .time-card {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--panel); backdrop-filter: blur(16px); box-shadow: 0 16px 36px -28px #000;
  }
  .time-card .sun {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(240,182,74,.12); color: var(--amber); font-size: 11px;
  }
  .time-card b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; letter-spacing: .04em; line-height: 1.1; }
  .time-card span { display: block; color: var(--muted); font-size: 8.5px; margin-top: 2px; letter-spacing: .08em; }
  .seg {
    display: inline-flex; padding: 4px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel);
    backdrop-filter: blur(16px); box-shadow: 0 16px 36px -28px #000;
  }
  .seg button {
    border: 0; background: transparent; color: var(--muted); border-radius: 7px; padding: 7px 10px;
    font-size: 10px; font-weight: 650; cursor: pointer; transition: .16s; white-space: nowrap;
  }
  .seg button.active { background: rgba(240,182,74,.16); color: #ffe2a6; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
  .icon-btn {
    width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line);
    border-radius: 10px; background: var(--panel); color: var(--muted); cursor: pointer; backdrop-filter: blur(16px);
    transition: .16s;
  }
  .icon-btn:hover { color: #fff; border-color: var(--line-strong); }
  .icon-btn.on { color: #b9dbff; border-color: rgba(127,181,216,.45); background: rgba(127,181,216,.12); }
  .bottom {
    position: fixed; left: clamp(14px, 2.6vw, 34px); right: clamp(14px, 2.6vw, 34px); bottom: clamp(12px, 2.2vw, 26px);
    z-index: 6; display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; pointer-events: none;
  }
  .control-panel {
    pointer-events: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
    backdrop-filter: blur(18px); box-shadow: 0 22px 50px -34px #000;
  }
  .control-group { display: flex; align-items: center; gap: 7px; }
  .control-group + .control-group { padding-left: 10px; border-left: 1px solid rgba(255,255,255,.07); }
  .control-group > label { color: var(--dim); font-size: 8px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .mini-seg { display: inline-flex; padding: 3px; background: rgba(255,255,255,.035); border-radius: 8px; border: 1px solid rgba(255,255,255,.05); }
  .mini-seg button {
    border: 0; background: transparent; color: var(--muted); padding: 5px 7px; border-radius: 6px;
    font-size: 9px; font-weight: 650; cursor: pointer; transition: .15s; min-width: 30px;
  }
  .mini-seg button.active { background: rgba(240,182,74,.2); color: #ffe2a6; }
  .toggle {
    border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.035); color: var(--muted);
    border-radius: 8px; padding: 6px 9px; font-size: 9px; font-weight: 650; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  }
  .toggle i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
  .toggle.on { color: #c6e8ff; border-color: rgba(127,181,216,.35); background: rgba(127,181,216,.1); }
  .toggle.on i { background: var(--blue); box-shadow: 0 0 7px rgba(127,181,216,.8); }
  .toggle.rain.on { color: #d7ecff; border-color: rgba(127,181,216,.5); background: rgba(127,181,216,.15); }
  .hint { color: var(--dim); font-size: 9px; line-height: 1.7; pointer-events: none; max-width: 400px; text-align: right; }
  .hint kbd { font-family: inherit; color: #d6cfbd; border: 1px solid rgba(220,200,160,.24); border-radius: 4px; padding: 1px 4px; font-size: 8px; }
  .hint b { color: var(--amber); font-weight: 650; }
  .fps { position: fixed; right: clamp(14px, 2.6vw, 34px); bottom: clamp(64px, 9vw, 92px); z-index: 5; color: var(--dim); font-size: 8px; letter-spacing: .14em; pointer-events: none; font-variant-numeric: tabular-nums; text-align: right; }
  .loading {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center;
    background: radial-gradient(700px 500px at 50% 45%, #17150f, #05060a 72%); transition: opacity .6s ease;
  }
  .loading.hidden { opacity: 0; pointer-events: none; }
  .voxel-loader { width: 56px; height: 56px; margin: 0 auto 16px; position: relative; transform-style: preserve-3d; animation: cubeSpin 2.4s infinite linear; }
  .voxel-loader span { position: absolute; width: 20px; height: 20px; background: var(--amber); border-radius: 3px; box-shadow: inset -4px -4px 0 rgba(0,0,0,.18); }
  .voxel-loader span:nth-child(1) { left: 0; top: 0; }
  .voxel-loader span:nth-child(2) { right: 0; top: 0; background: var(--orange); }
  .voxel-loader span:nth-child(3) { left: 0; bottom: 0; background: var(--red); }
  .voxel-loader span:nth-child(4) { right: 0; bottom: 0; background: #c98e37; }
  @keyframes cubeSpin { 0% { transform: rotate(0) scale(.9); } 50% { transform: rotate(90deg) scale(1.05); } 100% { transform: rotate(180deg) scale(.9); } }
  .loading h2 { margin: 0; font-size: 18px; letter-spacing: .16em; font-weight: 800; }
  .loading p { margin: 8px 0 0; color: var(--muted); font-size: 10px; letter-spacing: .05em; }
  .error {
    position: fixed; inset: 0; z-index: 30; display: none; place-items: center; text-align: center; padding: 28px;
    background: radial-gradient(600px 420px at 50% 45%, #22150f, #05060a 72%);
  }
  .error.show { display: grid; }
  .error b { display: block; margin: 10px 0 6px; font-size: 15px; color: #ffd6c9; }
  .error p { max-width: 400px; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 12px); z-index: 40;
    background: rgba(244,238,224,.96); color: #0c0d10; border-radius: 999px; padding: 8px 14px;
    font-size: 10.5px; font-weight: 650; opacity: 0; pointer-events: none; transition: .22s;
    box-shadow: 0 16px 40px -16px rgba(0,0,0,.8); max-width: calc(100vw - 28px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .knob-tip {
    position: fixed; left: 50%; bottom: clamp(74px, 10vw, 104px); transform: translateX(-50%); z-index: 5;
    color: rgba(240,182,74,.65); font-size: 8.5px; letter-spacing: .12em; pointer-events: none; text-align: center;
    text-transform: uppercase;
  }
  @media (max-width: 880px) {
    .topbar { gap: 10px; }
    .top-right { width: 100%; justify-content: flex-start; }
    .bottom { flex-direction: column; align-items: stretch; }
    .hint { text-align: left; max-width: none; }
    .control-panel { justify-content: flex-start; }
    .knob-tip { display: none; }
    .fps { display: none; }
  }
  @media (max-width: 560px) {
    .brand p { display: none; }
    .control-group { flex-wrap: wrap; }
    .control-group + .control-group { padding-left: 0; border-left: 0; }
    .control-panel { gap: 8px; }
    .time-card { padding: 7px 10px; }
    .time-card b { font-size: 13px; }
    .seg button { padding: 6px 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="体素微缩建筑工地沙盘"></canvas>
<div class="vignette"></div>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20V9l8-4 8 4v11"/><path d="M9 20v-5h6v5M8 10h8M12 5v4M2 20h20"/>
      </svg>
    </div>
    <div><h1>VOXEL SITE</h1><p><b>体素微缩建筑工地</b> · 桌面沙盘 · 双场景</p></div>
  </div>
  <div class="top-right">
    <div class="time-card">
      <span class="sun" id="sunIcon">☀</span>
      <div><b id="timeLabel">09:30</b><span id="phaseLabel">上午 · 晴朗</span></div>
    </div>
    <div class="seg" role="group" aria-label="相机焦点">
      <button type="button" data-focus="overview" class="active">总览</button>
      <button type="button" data-focus="site">施工工地</button>
      <button type="button" data-focus="completed">落成街区</button>
    </div>
    <button class="icon-btn" type="button" id="rainIconBtn" title="切换降雨（空格）" aria-label="切换降雨">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M7 15a4 4 0 1 1 .7-7.94A5.5 5.5 0 0 1 18 9a3.5 3.5 0 0 1-.5 6.96"/><path d="M8 18l-1 2M12 18l-1 2M16 18l-1 2"/></svg>
    </button>
  </div>
</header>

<div class="knob-tip">点击桌面前方的三个实体旋钮也可以控制场景</div>

<div class="bottom">
  <div class="control-panel">
    <div class="control-group">
      <label>设备速度</label>
      <div class="mini-seg" data-control="speed">
        <button type="button" data-value="0.5">0.5×</button>
        <button type="button" data-value="1" class="active">1×</button>
        <button type="button" data-value="1.5">1.5×</button>
        <button type="button" data-value="2">2×</button>
      </div>
    </div>
    <div class="control-group">
      <label>昼夜循环</label>
      <button class="toggle on" type="button" id="dayToggle"><i></i><span>自动</span></button>
    </div>
    <div class="control-group">
      <label>尘土</label>
      <div class="mini-seg" data-control="dust">
        <button type="button" data-value="0">弱</button>
        <button type="button" data-value="1" class="active">中</button>
        <button type="button" data-value="2">强</button>
      </div>
    </div>
    <div class="control-group">
      <label>天气</label>
      <button class="toggle rain" type="button" id="rainBtn"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 18l-1 2M12 18l-1 2M16 18l-1 2"/></svg><span>晴朗</span></button>
    </div>
  </div>
  <div class="hint">
    <kbd>拖动</kbd> 环视沙盘 · <kbd>滚轮</kbd> 缩放 · <kbd>空格</kbd> 暴雨 · <b>点击桌面旋钮</b>控制设备 / 昼夜 / 尘土
  </div>
</div>
<div class="fps" id="fps">— FPS</div>

<div class="loading" id="loading">
  <div>
    <div class="voxel-loader"><span></span><span></span><span></span><span></span></div>
    <h2>VOXEL SITE</h2>
    <p>正在搭建基坑、塔吊、工人与桌面沙盘…</p>
  </div>
</div>
<div class="error" id="error">
  <div>
    <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#e86d2c" stroke-width="1.5" stroke-linecap="round"><path d="M12 3 2.8 20h18.4L12 3Z"/><path d="M12 9v5M12 17.2v.2"/></svg>
    <b>无法启动体素沙盘</b>
    <p id="errorMessage">WebGL 或 Three.js 未能初始化。请检查网络、浏览器硬件加速后刷新。</p>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("scene");
  const loading = document.getElementById("loading");
  const errorBox = document.getElementById("error");
  const errorMessage = document.getElementById("errorMessage");
  window.addEventListener("error", (event) => {
    errorMessage.textContent = "场景运行出错：" + (event.message || event.error || "未知错误");
    errorBox.classList.add("show");
    loading.classList.add("hidden");
  });

  if (!window.THREE) {
    errorMessage.textContent = "Three.js 未能从 CDN 加载。请检查网络连接后刷新页面。";
    errorBox.classList.add("show");
    loading.classList.add("hidden");
    return;
  }

  const GROUND = 0.9;
  const PIT = { minX: -11.4, maxX: -6.6, minZ: -4.5, maxZ: -0.9, floor: 0.15 };
  const SITE = { minX: -12.5, maxX: 3.5, minZ: -6.0, maxZ: 5.2 };
  const DESK = { minX: -15, maxX: 15, minZ: -10, maxZ: 10 };

  const PALETTE = {
    dirt: 0x7b5a3b, dirt2: 0x6b4c31, dirt3: 0x8a6744,
    road: 0x4a4c55, roadDark: 0x3a3c45, line: 0xd6ab45,
    concrete: 0x9b9d9e, concreteDark: 0x757a7e, concreteLight: 0xb3b3ae,
    metal: 0x6e7683, metalDark: 0x4a505a, yellow: 0xe2ab2d, orange: 0xe36c28,
    red: 0xc84837, green: 0x5a7f54, greenDark: 0x3f5e42, blue: 0x4f7fae,
    wood: 0x8a5d34, woodDark: 0x5c3c21, brick: 0xa85a43, sand: 0xd6bd8a,
    cement: 0xb6b0a2, rebar: 0x8e6442, white: 0xe6e4dc, skin: 0xd6a27a,
    vest: 0xffb42e, pants: 0x303542, window: 0xffbe63, water: 0x487f96
  };
  const BOUNDS = SITE;

  const state = {
    speed: 1,
    autoDay: true,
    time: 9.6,
    dust: 1,
    rain: false,
    focus: "overview",
    autoOrbit: true
  };

  let renderer, scene, camera, clock;
  let raycaster, pointerNdc;
  let sunLight, moonLight, hemi, lampLight;
  let floodlights = [];
  let emissiveMaterial;
  let glowPoints, glowMaterial;
  let dustPoints, dustMaterial;
  let rainLines, rainPositions, rainVelocities;
  let puddles = [];
  let groundSolidMaterial;
  let skyWindow;
  let skyUniforms;
  let cameraState, cameraGoal;
  let autoDir = 1;
  let lastInteraction = 0;
  let dragging = false;
  let pointerDownInfo = null;
  let pointers = new Map();
  let pinch = null;
  let knobMeshes = [];
  let speedKnobCap, dayKnobCap, dustKnobCap;
  let toastTimer = null;
  let frames = 0, fpsAccum = 0;
  let interactionEnabled = false;

  const dynamic = {
    excavators: [],
    trucks: [],
    mixers: [],
    loaders: [],
    cranes: [],
    workers: null,
    truckPath: null,
    truckPathLength: 1,
    truckLoadU: 0.1,
    truckDumpU: 0.6,
    dirtParticles: [],
    dioramaCar: null
  };

  const batches = { solid: [], metal: [], emissive: [], glass: [] };
  const unitBox = new THREE.BoxGeometry(1, 1, 1);
  const dummy = new THREE.Object3D();

  // ---------- utilities ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (t) => t * t * (3 - 2 * t);
  const rand = mulberry32(0x51ed270b);

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function colorVary(hex, amount = 0.08) {
    const c = new THREE.Color(hex);
    const hsl = {};
    c.getHSL(hsl);
    c.setHSL(hsl.h, clamp(hsl.s + (rand() - 0.5) * amount, 0, 1), clamp(hsl.l + (rand() - 0.5) * amount, 0.03, 0.95));
    return c.getHex();
  }

  function addVoxel(x, y, z, w, h, d, color, category = "solid", rotY = 0) {
    batches[category].push({ x, y, z, w, h, d, color, rotY });
  }

  function addBox(x, y, z, w, h, d, material, group = scene, cast = true, receive = true, rotY = 0) {
    const mesh = new THREE.Mesh(unitBox, material);
    mesh.position.set(x, y, z);
    mesh.scale.set(w, h, d);
    mesh.rotation.y = rotY;
    mesh.castShadow = cast;
    mesh.receiveShadow = receive;
    group.add(mesh);
    return mesh;
  }

  function addCylinder(x, y, z, r, h, material, group = scene, segments = 10, cast = true) {
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, segments), material);
    mesh.position.set(x, y, z);
    mesh.castShadow = cast;
    mesh.receiveShadow = true;
    group.add(mesh);
    return mesh;
  }

  function makeCanvasTexture(w, h, draw) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    draw(ctx, w, h);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return tex;
  }

  function makeVoxelTexture() {
    return makeCanvasTexture(64, 64, (ctx, w, h) => {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = "rgba(0,0,0,.22)";
      ctx.lineWidth = 5;
      ctx.strokeRect(2.5, 2.5, w - 5, h - 5);
      ctx.strokeStyle = "rgba(255,255,255,.28)";
      ctx.lineWidth = 2;
      ctx.strokeRect(7, 7, w - 14, h - 14);
      for (let i = 0; i < 120; i++) {
        ctx.fillStyle = `rgba(0,0,0,${0.02 + rand() * 0.06})`;
        ctx.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2);
      }
    });
  }

  function makeWoodTexture() {
    return makeCanvasTexture(512, 512, (ctx, w, h) => {
      const base = ctx.createLinearGradient(0, 0, 0, h);
      base.addColorStop(0, "#4a2f1c");
      base.addColorStop(0.45, "#3c2717");
      base.addColorStop(1, "#2b1b10");
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, w, h);
      for (let y = 0; y < h; y += 10) {
        ctx.strokeStyle = `rgba(${30 + Math.random() * 30},${18 + Math.random() * 18},${10 + Math.random() * 12},${0.15 + Math.random() * 0.25})`;
        ctx.lineWidth = 1 + Math.random() * 2;
        ctx.beginPath();
        for (let x = 0; x <= w; x += 12) {
          const yy = y + Math.sin(x * 0.018 + y * 0.01) * 3 + Math.sin(x * 0.06) * 1.2;
          if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
        ctx.stroke();
      }
      for (let x = 0; x < w; x += 128) {
        ctx.strokeStyle = "rgba(15,9,5,.35)";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
    });
  }

  function makeBlueprintTexture() {
    return makeCanvasTexture(512, 320, (ctx, w, h) => {
      ctx.fillStyle = "#1e4f86";
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = "rgba(190,225,255,.28)";
      ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 22) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
      for (let y = 0; y < h; y += 22) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
      ctx.strokeStyle = "rgba(235,248,255,.85)";
      ctx.lineWidth = 3;
      ctx.strokeRect(60, 60, 180, 130);
      ctx.strokeRect(280, 80, 150, 90);
      ctx.beginPath(); ctx.moveTo(60, 220); ctx.lineTo(430, 220); ctx.stroke();
      ctx.beginPath(); ctx.arc(340, 180, 42, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "rgba(235,248,255,.9)";
      ctx.font = "700 18px monospace";
      ctx.fillText("VOXEL SITE / 03", 60, 40);
      ctx.font = "12px monospace";
      ctx.fillText("SCALE 1:100   SECTION A-A", 60, 258);
    });
  }

  function makeSignTexture(title, sub, bg = "#c84837", fg = "#f7efe0") {
    return makeCanvasTexture(512, 256, (ctx, w, h) => {
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = "rgba(255,255,255,.75)";
      ctx.lineWidth = 12;
      ctx.strokeRect(14, 14, w - 28, h - 28);
      ctx.fillStyle = fg;
      ctx.textAlign = "center";
      ctx.font = "800 72px 'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.fillText(title, w / 2, 112);
      ctx.font = "600 28px 'SFMono-Regular',monospace";
      ctx.fillText(sub, w / 2, 174);
      ctx.font = "500 20px 'PingFang SC',sans-serif";
      ctx.fillText("SAFETY FIRST · VOXEL SITE", w / 2, 214);
    });
  }

  function makeTextSprite(text, color = "#ffe2a6") {
    const tex = makeCanvasTexture(256, 64, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = color;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "700 28px 'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.fillText(text, w / 2, h / 2);
    });
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(2.0, 0.5, 1);
    return sprite;
  }

  // ---------- scene boot ----------
  function init() {
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    } catch (err) {
      errorMessage.textContent = "WebGL 初始化失败：" + (err.message || err);
      errorBox.classList.add("show");
      loading.classList.add("hidden");
      return;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.02;

    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x14141a, 0.006);
    camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.2, 180);
    cameraState = { theta: -0.42, phi: 1.06, radius: 32, target: new THREE.Vector3(-0.5, 2.2, 0.2) };
    cameraGoal = { theta: -0.42, phi: 1.06, radius: 32, target: new THREE.Vector3(-0.5, 2.2, 0.2) };
    applyCamera();
    clock = new THREE.Clock();
    raycaster = new THREE.Raycaster();
    pointerNdc = new THREE.Vector2();

    buildMaterials();
    buildLights();
    buildRoom();
    buildDesk();
    buildMainSite();
    buildSecondDiorama();
    buildDeskProps();
    buildStaticKnobPanel();
    buildBatches();
    buildDynamicScene();
    buildParticles();
    setupControls();

    updateEnvironment(true);
    window.addEventListener("resize", onResize);
    interactionEnabled = true;
    loading.classList.add("hidden");
    requestAnimationFrame(animate);
  }

  function buildRoom() {
    const M = window.__voxelMaterials;
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(54, 44), M.floor);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, -8.6, 2);
    floor.receiveShadow = true;
    scene.add(floor);

    const rug = new THREE.Mesh(new THREE.PlaneGeometry(38, 27), new THREE.MeshStandardMaterial({ color: 0x2a2220, roughness: 1 }));
    rug.rotation.x = -Math.PI / 2;
    rug.position.set(0, -8.57, 2);
    rug.receiveShadow = true;
    scene.add(rug);

    const wall = addBox(0, 3.8, -11.3, 40, 25, 0.7, M.wall, scene, false, true);
    wall.receiveShadow = true;

    // Window opening frame, with the sky as a glowing panel in front of the wall.
    skyUniforms = {
      uTop: { value: new THREE.Color(0x4a7ab8) },
      uBottom: { value: new THREE.Color(0xcfe1ef) },
      uSunColor: { value: new THREE.Color(0xfff0c4) },
      uSunPos: { value: new THREE.Vector2(0.5, 0.65) },
      uMoonPos: { value: new THREE.Vector2(0.25, 0.7) },
      uNight: { value: 0 },
      uTime: { value: 0 }
    };
    const skyMat = new THREE.ShaderMaterial({
      uniforms: skyUniforms,
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        precision highp float;
        varying vec2 vUv;
        uniform vec3 uTop; uniform vec3 uBottom; uniform vec3 uSunColor;
        uniform vec2 uSunPos; uniform vec2 uMoonPos;
        uniform float uNight; uniform float uTime;
        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
        void main(){
          vec3 col = mix(uBottom, uTop, smoothstep(0.0, 1.0, vUv.y));
          float dSun = distance(vUv, uSunPos);
          col += uSunColor * smoothstep(0.10, 0.0, dSun) * (1.0 - uNight) * 1.1;
          col += uSunColor * exp(-dSun * 5.5) * (1.0 - uNight) * 0.22;
          float dMoon = distance(vUv, uMoonPos);
          float moon = smoothstep(0.055, 0.02, dMoon);
          col += vec3(0.78, 0.86, 1.0) * moon * uNight * 1.25;
          col += vec3(0.4, 0.5, 0.85) * exp(-dMoon * 6.0) * uNight * 0.4;
          vec2 grid = floor(vUv * vec2(140.0, 70.0));
          float star = step(0.996, hash(grid + floor(uTime * 0.3))) * step(0.18, vUv.y);
          col += vec3(star) * uNight * 0.85;
          float cloud = sin(vUv.x * 11.0 + uTime * 0.06) * sin(vUv.y * 17.0 - uTime * 0.04) + sin(vUv.x * 29.0 - uTime * 0.08) * 0.3;
          col += (1.0 - uNight) * vec3(0.07, 0.08, 0.09) * smoothstep(0.55, 1.0, cloud);
          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    skyWindow = new THREE.Mesh(new THREE.PlaneGeometry(18, 7.4), skyMat);
    skyWindow.position.set(0, 7.2, -10.92);
    scene.add(skyWindow);

    // Window frame.
    addBox(0, 11.0, -10.8, 19.2, 0.35, 0.4, M.darkWood, scene, false, true);
    addBox(0, 3.4, -10.8, 19.2, 0.35, 0.4, M.darkWood, scene, false, true);
    addBox(-9.35, 7.2, -10.8, 0.35, 7.8, 0.4, M.darkWood, scene, false, true);
    addBox(9.35, 7.2, -10.8, 0.35, 7.8, 0.4, M.darkWood, scene, false, true);
    addBox(0, 7.2, -10.8, 0.18, 7.4, 0.25, M.darkWood, scene, false, true);
    addBox(-4.6, 7.2, -10.8, 0.18, 7.4, 0.25, M.darkWood, scene, false, true);
    addBox(4.6, 7.2, -10.8, 0.18, 7.4, 0.25, M.darkWood, scene, false, true);
    addBox(0, 3.42, -10.6, 19.4, 0.18, 0.55, M.darkWood, scene, false, true); // sill

    // A couple of framed drawings on the wall.
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x3a2b1c, roughness: 0.8 });
    const paperTex = makeBlueprintTexture();
    for (const [x, y, s] of [[-12.5, 6.8, 1.1], [12.4, 7.1, 0.9]]) {
      addBox(x, y, -10.9, 3.2 * s, 2.0 * s, 0.14, frameMat, scene, false, true);
      const paper = new THREE.Mesh(new THREE.PlaneGeometry(2.9 * s, 1.7 * s), new THREE.MeshBasicMaterial({ map: paperTex, toneMapped: false }));
      paper.position.set(x, y, -10.82);
      scene.add(paper);
    }
  }

  function buildMainSite() {
    const M = window.__voxelMaterials;
    const tray = { cx: -4.5, cz: -0.4, w: 17.0, d: 12.0 };
    // Sandbox tray base and border.
    addBox(tray.cx, 0.18, tray.cz, tray.w, 0.36, tray.d, M.darkWood, scene, true, true);
    const border = 0.46;
    addBox(tray.cx, 0.68, tray.cz - tray.d / 2, tray.w, 0.72, border, M.wood, scene, true, true);
    addBox(tray.cx, 0.68, tray.cz + tray.d / 2, tray.w, 0.72, border, M.wood, scene, true, true);
    addBox(tray.cx - tray.w / 2, 0.68, tray.cz, border, 0.72, tray.d, M.wood, scene, true, true);
    addBox(tray.cx + tray.w / 2, 0.68, tray.cz, border, 0.72, tray.d, M.wood, scene, true, true);
    addBox(tray.cx, 0.36, tray.cz, tray.w - 0.6, 0.55, tray.d - 0.6, new THREE.MeshStandardMaterial({ color: 0x2e2419, roughness: 1 }), scene, false, true);

    // Ground cubes, leaving the excavation pit open.
    const step = 0.55;
    for (let x = SITE.minX + 0.28; x < SITE.maxX; x += step) {
      for (let z = SITE.minZ + 0.28; z < SITE.maxZ; z += step) {
        const inPit = x > PIT.minX && x < PIT.maxX && z > PIT.minZ && z < PIT.maxZ;
        if (inPit) continue;
        const tint = rand();
        addVoxel(
          x, GROUND / 2, z,
          step * 0.99, GROUND, step * 0.99,
          tint > 0.82 ? PALETTE.dirt3 : tint > 0.35 ? PALETTE.dirt : PALETTE.dirt2,
          "solid"
        );
      }
    }

    // Pit floor and stepped ramp.
    for (let x = PIT.minX + 0.27; x < PIT.maxX; x += step) {
      for (let z = PIT.minZ + 0.27; z < PIT.maxZ; z += step) {
        addVoxel(x, PIT.floor - 0.08, z, step * 0.96, 0.16, step * 0.96, colorVary(PALETTE.dirt2, 0.06), "solid");
      }
    }
    for (let s = 0; s < 4; s++) {
      const z = PIT.maxZ - 0.18 - s * 0.14;
      const y = PIT.floor + (s + 1) * 0.12;
      addVoxel(-9.2, y, z, 2.4, 0.12, 0.14, colorVary(PALETTE.dirt, 0.04), "solid");
    }
    // Pit edge safety rails and rebar.
    for (let x = PIT.minX + 0.5; x <= PIT.maxX - 0.3; x += 1.4) {
      addVoxel(x, GROUND + 0.32, PIT.maxZ + 0.25, 0.08, 0.64, 0.08, PALETTE.yellow, "solid");
    }
    for (let i = 0; i < 14; i++) {
      addVoxel(PIT.minX + 0.3 + rand() * 4.4, GROUND + 0.1, PIT.minZ + 0.3 + rand() * 3.2, 0.05, 0.5 + rand() * 0.8, 0.05, PALETTE.rebar, "metal", rand() * 0.4);
    }

    // Roads: outer truck loop, inner mixer lane, loader lane.
    const roadPoints = [
      new THREE.Vector3(-11.9, GROUND + 0.035, -5.2),
      new THREE.Vector3(2.9, GROUND + 0.035, -5.2),
      new THREE.Vector3(2.9, GROUND + 0.035, 4.55),
      new THREE.Vector3(-11.9, GROUND + 0.035, 4.55)
    ];
    const roadCurve = new THREE.CatmullRomCurve3(roadPoints, true, "catmullrom", 0.18);
    dynamic.truckPath = roadCurve;
    dynamic.truckPathLength = roadCurve.getLength();
    const roadSamples = 90;
    for (let i = 0; i < roadSamples; i++) {
      const u = i / roadSamples;
      const p = roadCurve.getPointAt(u);
      const tangent = roadCurve.getTangentAt(u);
      const yaw = Math.atan2(tangent.x, tangent.z);
      addVoxel(p.x, GROUND + 0.015, p.z, 1.35, 0.07, 0.95, colorVary(PALETTE.road, 0.04), "solid", yaw);
      if (i % 6 === 0) {
        addVoxel(p.x, GROUND + 0.06, p.z, 0.34, 0.03, 0.08, PALETTE.line, "solid", yaw);
      }
    }
    for (let x = -7.2; x <= 2.3; x += 0.55) {
      addVoxel(x, GROUND + 0.018, -0.2, 0.55, 0.06, 1.05, colorVary(PALETTE.roadDark, 0.03), "solid");
    }
    for (let x = -10.8; x <= -7.2; x += 0.55) {
      addVoxel(x, GROUND + 0.02, 0.25, 0.55, 0.06, 0.9, colorVary(PALETTE.road, 0.03), "solid");
    }
    // Procession strip from gate to office.
    for (let z = 4.2; z >= 1.4; z -= 0.55) {
      addVoxel(-4.5, GROUND + 0.022, z, 1.4, 0.06, 0.55, colorVary(PALETTE.road, 0.03), "solid");
    }

    buildFence();
    buildHighrise();
    buildRebarShed();
    buildMaterialYard();
    buildOffice();
    buildSpoilPile();
    buildSiteDetails();
    buildCraneMast(1.7, -3.9, 13.0);
    buildCraneMast(-6.5, 3.5, 10.0);
    buildSecondSiteSign();
  }

  function buildFence() {
    const step = 1.35;
    // Posts and rails on the three sides; front has a gate gap.
    for (let x = SITE.minX + 0.2; x <= SITE.maxX - 0.2; x += step) {
      addVoxel(x, GROUND + 0.7, SITE.minZ + 0.12, 0.1, 1.4, 0.1, PALETTE.metal, "metal");
      addVoxel(x, GROUND + 0.5, SITE.maxZ - 0.12, 0.1, 1.4, 0.1, PALETTE.metal, "metal");
    }
    for (let z = SITE.minZ + 0.2; z <= SITE.maxZ - 0.2; z += step) {
      addVoxel(SITE.minX + 0.12, GROUND + 0.7, z, 0.1, 1.4, 0.1, PALETTE.metal, "metal");
      addVoxel(SITE.maxX - 0.12, GROUND + 0.7, z, 0.1, 1.4, 0.1, PALETTE.metal, "metal");
    }
    for (const z of [SITE.minZ + 0.12, SITE.maxZ - 0.12]) {
      addVoxel((SITE.minX + SITE.maxX) / 2, GROUND + 0.95, z, SITE.maxX - SITE.minX - 0.4, 0.07, 0.07, PALETTE.metal, "metal");
      addVoxel((SITE.minX + SITE.maxX) / 2, GROUND + 0.5, z, SITE.maxX - SITE.minX - 0.4, 0.07, 0.07, PALETTE.metal, "metal");
    }
    for (const x of [SITE.minX + 0.12, SITE.maxX - 0.12]) {
      addVoxel(x, GROUND + 0.95, (SITE.minZ + SITE.maxZ) / 2, 0.07, 0.07, SITE.maxZ - SITE.minZ - 0.4, PALETTE.metal, "metal");
      addVoxel(x, GROUND + 0.5, (SITE.minZ + SITE.maxZ) / 2, 0.07, 0.07, SITE.maxZ - SITE.minZ - 0.4, PALETTE.metal, "metal");
    }
    // Front rails, split around the gate.
    for (const segment of [[SITE.minX + 0.2, -5.9], [-3.1, SITE.maxX - 0.2]]) {
      const [x0, x1] = segment;
      const mid = (x0 + x1) / 2;
      addVoxel(mid, GROUND + 0.95, SITE.maxZ - 0.12, x1 - x0, 0.07, 0.07, PALETTE.metal, "metal");
      addVoxel(mid, GROUND + 0.5, SITE.maxZ - 0.12, x1 - x0, 0.07, 0.07, PALETTE.metal, "metal");
    }
    // Gate posts and sign.
    for (const x of [-6.0, -3.0]) {
      addVoxel(x, GROUND + 1.0, SITE.maxZ - 0.08, 0.22, 2.0, 0.22, PALETTE.yellow, "solid");
    }
    addVoxel(-4.5, GROUND + 1.9, SITE.maxZ - 0.3, 3.2, 0.14, 0.14, PALETTE.metal, "metal");
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 1.25), new THREE.MeshBasicMaterial({ map: makeSignTexture("安全第一", "SAFETY FIRST"), transparent: false, toneMapped: false, side: THREE.DoubleSide }));
    sign.position.set(-4.5, GROUND + 1.25, SITE.maxZ - 0.02);
    scene.add(sign);
    // Flags along the fence.
    for (let i = 0; i < 12; i++) {
      const x = SITE.minX + 0.7 + i * 1.28;
      addVoxel(x, GROUND + 1.25, SITE.maxZ - 0.14, 0.28, 0.2, 0.05, i % 2 ? PALETTE.red : PALETTE.yellow, "solid", 0.2);
    }
  }

  function buildHighrise() {
    const cx = 0.0, cz = -2.8, w = 4.6, d = 4.0, fh = 1.15, floors = 8, base = GROUND;
    addVoxel(cx, base + 0.18, cz, w + 0.8, 0.36, d + 0.8, PALETTE.concreteDark, "solid");
    for (let f = 0; f < floors; f++) {
      const y = base + 0.4 + f * fh;
      addVoxel(cx, y, cz, w, 0.12, d, colorVary(PALETTE.concrete, 0.04), "solid");
      for (const sx of [-1, 1]) {
        for (const sz of [-1, 1]) {
          addVoxel(cx + sx * (w / 2 - 0.16), y + fh / 2, cz + sz * (d / 2 - 0.16), 0.22, fh, 0.22, PALETTE.concreteDark, "solid");
        }
      }
      if (f < 6) {
        // Facade panels and windows on the front face.
        for (let wx = -1.4; wx <= 1.4; wx += 0.7) {
          addVoxel(cx + wx, y + fh * 0.52, cz + d / 2 + 0.02, 0.42, 0.5, 0.08, (f + Math.round(wx * 10)) % 3 === 0 ? PALETTE.window : PALETTE.concreteLight, (f + Math.round(wx * 10)) % 3 === 0 ? "emissive" : "solid");
        }
        // Side wall hints.

  function buildBatches() {
    const materials = window.__voxelMaterials;
    for (const category of Object.keys(batches)) {
      const items = batches[category];
      if (!items.length) continue;
      const mesh = new THREE.InstancedMesh(unitBox, materials[category], items.length);
      const color = new THREE.Color();
      items.forEach((item, i) => {
        dummy.position.set(item.x, item.y, item.z);
        dummy.rotation.set(0, item.rotY || 0, 0);
        dummy.scale.set(item.w, item.h, item.d);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
        color.set(item.color);
        mesh.setColorAt(i, color);
      });
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      mesh.castShadow = category !== "emissive" && category !== "glass";
      mesh.receiveShadow = category !== "emissive";
      scene.add(mesh);
    }
  }

    mesh.receiveShadow = true;

  function findTruckZones() {
    const nearest = (x, z) => {
      let best = 0;
      let bestDist = Infinity;
      for (let i = 0; i < 500; i++) {
        const u = i / 500;
        const p = dynamic.truckPath.getPointAt(u);
        const d = (p.x - x) ** 2 + (p.z - z) ** 2;
        if (d < bestDist) { bestDist = d; best = u; }
      }
      return best;
    };
    dynamic.truckLoadU = nearest(-11.9, -2.5);
    dynamic.truckDumpU = nearest(1.0, 4.55);
  }

      { x: -3.6, z: -1.0, role: "engineer" }, { x: -6.95, z: 1.0, role: "engineer" },
      { x: 0.4, z: 1.0, role: "carry" }, { x: -5.8, z: 3.85, role: "security" },
      { x: -3.2, z: 3.85, role: "security" }, { x: -7.9, z: -0.55, role: "operator" },
      { x: 2.1, z: 3.9, role: "operator" }, { x: -11.6, z: 3.8, role: "carry" },
      { x: 0.5, z: 1.9, role: "carry" }, { x: -2.35, z: 3.85, role: "carry" },
      { x: -0.9, z: 1.2, role: "signal" }, { x: -10.0, z: 0.4, role: "operator" },
      { x: -5.5, z: 1.0, role: "engineer" }, { x: 0.5, z: 2.0, role: "carry" }

    const routes = [

    const count = 240;

      data.push({ life: 0, x: 0, y: -100, z: 0, vx: 0, vy: 0, vz: 0 });

    const geo = new THREE.BufferGeometry();

  function spawnDirt(x, y, z, count = 6) {
    const d = dynamic.dirt;
    if (!d) return;
    for (let n = 0; n < count; n++) {
      const i = d.cursor++ % d.data.length;
      const p = d.data[i];
      p.life = 0.7 + rand() * 0.7;
      p.x = x + (rand() - 0.5) * 0.5;
      p.y = y + rand() * 0.25;
      p.z = z + (rand() - 0.5) * 0.5;
      p.vx = (rand() - 0.5) * 1.2;
      p.vy = 0.5 + rand() * 1.2;
      p.vz = (rand() - 0.5) * 1.2;
    }
  }

    const seeds = new Float32Array(dustCount);
    for (let i = 0; i < dustCount; i++) {
      positions[i * 3] = SITE.minX + rand() * (SITE.maxX - SITE.minX);
      positions[i * 3 + 1] = GROUND + rand() * 5.2;
      positions[i * 3 + 2] = SITE.minZ + rand() * (SITE.maxZ - SITE.minZ);
      seeds[i] = rand();
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    dustGeo.setAttribute("aSeed", new THREE.BufferAttribute(seeds, 1));
    dustMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uOpacity: { value: 0.32 },
        uSize: { value: 1.0 }
      },
      vertexShader: `
        attribute float aSeed;
        uniform float uTime;
        uniform float uSize;
        varying float vAlpha;
        void main() {
          vec3 p = position;
          p.y = ${GROUND.toFixed(2)} + mod(aSeed * 5.2 + uTime * 0.18, 5.2);
          p.x += sin(uTime * 0.22 + aSeed * 6.28) * 0.65;
          p.z += cos(uTime * 0.17 + aSeed * 5.3) * 0.5;
          vAlpha = smoothstep(0.0, 0.8, 1.0 - abs(p.y - ${(GROUND + 2.6).toFixed(2)}) / 3.4);
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_PointSize = (2.2 + aSeed * 2.2) * uSize * (110.0 / max(1.0, -mv.z));
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        precision highp float;
        uniform float uOpacity;
        varying float vAlpha;
        void main() {
          float d = length(gl_PointCoord - vec2(0.5));
          float alpha = smoothstep(0.5, 0.05, d) * vAlpha * uOpacity;
          gl_FragColor = vec4(0.55, 0.47, 0.38, alpha);
        }
      `,
      transparent: true,
      depthWrite: false
    });
    dustPoints = new THREE.Points(dustGeo, dustMaterial);
    dustPoints.frustumCulled = false;
    scene.add(dustPoints);

    // Custom light-glow shader points.
    const glowPositions = [];
    const glowColors = [];
    const addGlowPoint = (x, y, z, hex) => {
      glowPositions.push(x, y, z);
      const c = new THREE.Color(hex);
      glowColors.push(c.r, c.g, c.b);
    };
    addGlowPoint(-13.5, 1.95, -6.9, 0xffb46a);
    addGlowPoint(-11.6, GROUND + 5.25, -5.25, 0xfff0c4);
    addGlowPoint(3.0, GROUND + 5.25, -5.25, 0xfff0c4);
    addGlowPoint(1.7 + 7.8, GROUND + 13.65, -3.9, 0xffcf88);
    addGlowPoint(-6.5 + 6.2, GROUND + 10.45, 3.5, 0xffcf88);
    for (const [x, z] of [[7.1, 2.9], [9.5, 2.9], [12.5, 2.9]]) addGlowPoint(x, GROUND + 1.5, z, 0xffcf88);
    addGlowPoint(-4.5, GROUND + 1.6, 3.8, 0xffcf88);
    addGlowPoint(-9.3, GROUND + 1.2, 2.4, 0xffcf88);
    const glowGeo = new THREE.BufferGeometry();
    glowGeo.setAttribute("position", new THREE.Float32BufferAttribute(glowPositions, 3));
    glowGeo.setAttribute("aColor", new THREE.Float32BufferAttribute(glowColors, 3));
    glowMaterial = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uOpacity: { value: 0.5 } },
      vertexShader: `
        attribute vec3 aColor;
        uniform float uTime;
        varying vec3 vColor;
        varying float vPulse;
        void main() {
          vColor = aColor;
          vPulse = 0.82 + 0.18 * sin(uTime * 2.0 + position.x * 0.7);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = (26.0 + sin(uTime * 3.0 + position.z) * 4.0) * (100.0 / max(1.0, -mv.z));
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        precision highp float;
        uniform float uOpacity;
        varying vec3 vColor;
        varying float vPulse;
        void main() {
          float d = length(gl_PointCoord - vec2(0.5));
          float alpha = smoothstep(0.5, 0.0, d);
          alpha *= alpha * vPulse * uOpacity;
          gl_FragColor = vec4(vColor, alpha);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    glowPoints = new THREE.Points(glowGeo, glowMaterial);
    glowPoints.frustumCulled = false;
    scene.add(glowPoints);

    // Rain lines.
    const rainCount = 1100;
    rainPositions = new Float32Array(rainCount * 6);
    rainVelocities = new Float32Array(rainCount);
    for (let i = 0; i < rainCount; i++) {
      resetRainDrop(i, true);
    }
    const rainGeo = new THREE.BufferGeometry();
    rainGeo.setAttribute("position", new THREE.BufferAttribute(rainPositions, 3));
    rainLines = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: 0xa9c8ee, transparent: true, opacity: 0.42, depthWrite: false }));
    rainLines.visible = false;
    rainLines.frustumCulled = false;
    scene.add(rainLines);

    // Puddles.
    const puddleMat = window.__voxelMaterials.puddle;
    const puddleSpots = [
      [-12.0, -2.5, 2.0, 1.0], [2.9, 4.0, 1.8, 0.9], [-5.8, 4.7, 2.2, 0.8],
      [-11.8, 3.6, 1.4, 1.2], [0.2, -5.4, 1.8, 0.9], [1.2, 4.7, 1.6, 0.8]
    ];
    for (const [x, z, sx, sz] of puddleSpots) {
      const mesh = new THREE.Mesh(new THREE.CircleGeometry(1, 20), puddleMat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.scale.set(sx, sz, 1);
      mesh.position.set(x, GROUND + 0.075, z);
      mesh.visible = false;
      scene.add(mesh);
      puddles.push(mesh);
    }
  }

  function resetRainDrop(i, initial = false) {
    const x = SITE.minX + rand() * (SITE.maxX - SITE.minX);
    const z = SITE.minZ + rand() * (SITE.maxZ - SITE.minZ);
    const y = initial ? GROUND + rand() * 13 : GROUND + 12 + rand() * 3;
    rainPositions[i * 6] = x;
    rainPositions[i * 6 + 1] = y;
    rainPositions[i * 6 + 2] = z;
    rainPositions[i * 6 + 3] = x + 0.06;
    rainPositions[i * 6 + 4] = y - 0.7 - rand() * 0.5;
    rainPositions[i * 6 + 5] = z;
    rainVelocities[i] = 9 + rand() * 7;
  }

  // ---------- camera & controls ----------
  function applyCamera() {
    const s = cameraState;
    const sinPhi = Math.sin(s.phi);
    camera.position.set(
      s.target.x + s.radius * sinPhi * Math.sin(s.theta),
      s.target.y + s.radius * Math.cos(s.phi),
      s.target.z + s.radius * sinPhi * Math.cos(s.theta)
    );
    camera.lookAt(s.target);
  }

  function updateCamera(dt) {
    if (state.autoOrbit && !dragging && performance.now() - lastInteraction > 2800) {
      cameraGoal.theta += dt * 0.02 * autoDir;
      if (cameraGoal.theta > 1.0) { cameraGoal.theta = 1.0; autoDir = -1; }
      if (cameraGoal.theta < -1.0) { cameraGoal.theta = -1.0; autoDir = 1; }
    }
    cameraGoal.theta = clamp(cameraGoal.theta, -1.08, 1.08);
    cameraGoal.phi = clamp(cameraGoal.phi, 0.34, 1.18);
    cameraGoal.radius = clamp(cameraGoal.radius, 12, 44);
    const k = 1 - Math.exp(-dt * 7);
    cameraState.theta = lerp(cameraState.theta, cameraGoal.theta, k);
    cameraState.phi = lerp(cameraState.phi, cameraGoal.phi, k);
    cameraState.radius = lerp(cameraState.radius, cameraGoal.radius, k);
    cameraState.target.lerp(cameraGoal.target, k);
    applyCamera();
  }

  function setFocus(name) {
    state.focus = name;
    const presets = {
      overview: { target: [-0.5, 2.2, 0.2], theta: -0.42, phi: 1.04, radius: 32 },
      site: { target: [-4.5, 1.8, -0.1], theta: -0.35, phi: 1.02, radius: 20 },
      completed: { target: [10.0, 1.4, 0.1], theta: 0.05, phi: 1.03, radius: 15 }
    };
    const p = presets[name] || presets.overview;
    cameraGoal.target.set(...p.target);
    cameraGoal.theta = p.theta;
    cameraGoal.phi = p.phi;
    cameraGoal.radius = p.radius;
    autoDir = name === "completed" ? 1 : -1;
    lastInteraction = performance.now();
    document.querySelectorAll("[data-focus]").forEach((btn) => btn.classList.toggle("active", btn.dataset.focus === name));
  }

  function setSpeed(value) {
    state.speed = value;
    document.querySelectorAll('[data-control="speed"] button').forEach((btn) => btn.classList.toggle("active", Number(btn.dataset.value) === value));
    updateKnobVisuals();
    toast(`设备速度 ${value}×`);
  }

  function setDust(level) {
    state.dust = level;
    document.querySelectorAll('[data-control="dust"] button').forEach((btn) => btn.classList.toggle("active", Number(btn.dataset.value) === level));
    updateKnobVisuals();
    toast(`尘土强度：${["关闭", "中等", "强烈"][level]}`);
  }

  function setAutoDay(value) {
    state.autoDay = value;
    const toggle = document.getElementById("dayToggle");
    toggle.classList.toggle("on", value);
    toggle.querySelector("span").textContent = value ? "自动" : "暂停";
    updateKnobVisuals();
    toast(value ? "昼夜循环已开启" : "昼夜循环已暂停");
  }

  function setRain(value) {
    state.rain = value;
    const btn = document.getElementById("rainBtn");
    const icon = document.getElementById("rainIconBtn");
    btn.classList.toggle("on", value);
    btn.querySelector("span").textContent = value ? "降雨中" : "晴朗";
    icon.classList.toggle("on", value);
    rainLines.visible = value;
    puddles.forEach((p) => { p.visible = value; });
    toast(value ? "模拟暴雨已开启" : "雨停了");
  }

  function updateKnobVisuals() {
    const speeds = [0.5, 1, 1.5, 2];
    const speedIndex = Math.max(0, speeds.indexOf(state.speed));
    const setTick = (cap, angle) => {
      if (!cap || !cap.userData.tick) return;
      const tick = cap.userData.tick;
      const originX = tick.userData.originX ?? (tick.userData.originX = tick.position.x);
      tick.position.x = originX + Math.sin(angle) * 0.14;
      tick.position.z = 8.6 + Math.cos(angle) * 0.14;
      tick.rotation.y = angle;
    };
    setTick(speedKnobCap, speedIndex / 3 * Math.PI * 1.4 - Math.PI * 0.7);
    setTick(dayKnobCap, state.autoDay ? 0.55 : -0.55);
    setTick(dustKnobCap, state.dust / 2 * Math.PI * 1.1 - Math.PI * 0.55);
  }

  function pickKnob(event) {
    const rect = canvas.getBoundingClientRect();
    pointerNdc.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNdc.y = -(((event.clientY - rect.top) / rect.height) * 2 - 1);
    raycaster.setFromCamera(pointerNdc, camera);
    const hits = raycaster.intersectObjects(knobMeshes, false);
    return hits.length ? hits[0].object.userData.knob : null;
  }

  function activateKnob(index) {
    if (index === 0) {
      const speeds = [0.5, 1, 1.5, 2];
      const at = speeds.indexOf(state.speed);
      setSpeed(speeds[(at + 1) % speeds.length]);
    } else if (index === 1) {
      setAutoDay(!state.autoDay);
    } else if (index === 2) {
      setDust((state.dust + 1) % 3);
    }
  }

  let dragPrev = { x: 0, y: 0 };

  function setupControls() {
    canvas.addEventListener("pointerdown", (event) => {
      if (event.button === 2) return;
      event.preventDefault();
      const knob = pickKnob(event);
      if (knob !== null) {
        activateKnob(knob);
        pointerDownInfo = { x: event.clientX, y: event.clientY, knob: true };
        return;
      }
      canvas.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (pointers.size === 2) {
        const pts = [...pointers.values()];
        pinch = { distance: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), radius: cameraGoal.radius };
        dragging = false;
        return;
      }
      dragging = true;
      dragPrev = { x: event.clientX, y: event.clientY };
      lastInteraction = performance.now();
      pointerDownInfo = { x: event.clientX, y: event.clientY, knob: false };
    });
    canvas.addEventListener("pointermove", (event) => {
      if (!interactionEnabled) return;
      if (pointers.has(event.pointerId)) pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (pinch && pointers.size >= 2) {
        const pts = [...pointers.values()];
        const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (pinch.distance > 0) cameraGoal.radius = clamp(pinch.radius * (pinch.distance / d), 12, 44);
        return;
      }
      if (!dragging) {
        const knob = pickKnob(event);
        canvas.style.cursor = knob !== null ? "pointer" : "grab";
        return;
      }
      const dx = event.clientX - dragPrev.x;
      const dy = event.clientY - dragPrev.y;
      dragPrev = { x: event.clientX, y: event.clientY };
      cameraGoal.theta = clamp(cameraGoal.theta - dx * 0.0035, -1.08, 1.08);
      cameraGoal.phi = clamp(cameraGoal.phi - dy * 0.0028, 0.34, 1.18);
      lastInteraction = performance.now();
    });
    function endPointer(event) {
      pointers.delete(event.pointerId);
      if (pointers.size < 2) pinch = null;
      dragging = false;
      if (canvas.hasPointerCapture?.(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    }
    canvas.addEventListener("pointerup", endPointer);
    canvas.addEventListener("pointercancel", endPointer);
    canvas.addEventListener("pointerleave", () => {
      if (!dragging) canvas.style.cursor = "grab";
    });
    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      cameraGoal.radius = clamp(cameraGoal.radius * Math.exp(event.deltaY * 0.0011), 12, 44);
      lastInteraction = performance.now();
    }, { passive: false });
    canvas.addEventListener("contextmenu", (event) => event.preventDefault());

    document.querySelectorAll("[data-focus]").forEach((btn) => {
      btn.addEventListener("click", () => setFocus(btn.dataset.focus));
    });
    document.querySelectorAll('[data-control="speed"] button').forEach((btn) => {
      btn.addEventListener("click", () => setSpeed(Number(btn.dataset.value)));
    });
    document.querySelectorAll('[data-control="dust"] button').forEach((btn) => {
      btn.addEventListener("click", () => setDust(Number(btn.dataset.value)));
    });
    document.getElementById("dayToggle").addEventListener("click", () => setAutoDay(!state.autoDay));
    document.getElementById("rainBtn").addEventListener("click", () => setRain(!state.rain));
    document.getElementById("rainIconBtn").addEventListener("click", () => setRain(!state.rain));

    document.addEventListener("keydown", (event) => {
      if (event.target.tagName === "INPUT" || event.target.tagName === "TEXTAREA") return;
      if (event.code === "Space") {
        event.preventDefault();
        setRain(!state.rain);
      } else if (event.key === "1") setFocus("overview");
      else if (event.key === "2") setFocus("site");
      else if (event.key === "3") setFocus("completed");
    });
  }

  // ---------- environment ----------
  const palettes = [
    { h: 0, top: 0x050a18, bottom: 0x141d33, sun: 0x8fb0e8, sunI: 0.05, moonI: 0.55, hemiSky: 0x27344f, hemiGround: 0x0e0b09, hemiI: 0.22, exp: 0.9, fog: 0x080b12, night: 1, bg: 0x05070c },
    { h: 6, top: 0x2b3a68, bottom: 0xe0a070, sun: 0xffa066, sunI: 1.15, moonI: 0.1, hemiSky: 0x8a9ac0, hemiGround: 0x3a2a20, hemiI: 0.45, exp: 1.0, fog: 0x1a1720, night: 0.38, bg: 0x0c0e15 },
    { h: 12, top: 0x5a8cc4, bottom: 0xd8e8f2, sun: 0xfff2d8, sunI: 2.6, moonI: 0, hemiSky: 0xc4d8f0, hemiGround: 0x4a3a2a, hemiI: 0.6, exp: 1.08, fog: 0x222a36, night: 0, bg: 0x10131a },
    { h: 18, top: 0x3c2c5e, bottom: 0xff9a64, sun: 0xff7a48, sunI: 1.35, moonI: 0.05, hemiSky: 0x8b7698, hemiGround: 0x3a2420, hemiI: 0.42, exp: 1.0, fog: 0x241820, night: 0.5, bg: 0x0d0c12 },
    { h: 24, top: 0x050a18, bottom: 0x141d33, sun: 0x8fb0e8, sunI: 0.05, moonI: 0.55, hemiSky: 0x27344f, hemiGround: 0x0e0b09, hemiI: 0.22, exp: 0.9, fog: 0x080b12, night: 1, bg: 0x05070c }
  ];
  const tmpColorA = new THREE.Color();
  const tmpColorB = new THREE.Color();

  function paletteAt(time) {
    let a = palettes[0], b = palettes[1];
    for (let i = 0; i < palettes.length - 1; i++) {
      if (time >= palettes[i].h && time <= palettes[i + 1].h) { a = palettes[i]; b = palettes[i + 1]; break; }
    }
    const t = smooth((time - a.h) / Math.max(0.001, b.h - a.h));
    return { a, b, t };
  }

  function mixHex(a, b, t) {
    tmpColorA.set(a); tmpColorB.set(b);
    return tmpColorA.clone().lerp(tmpColorB, t).getHex();
  }

  function updateEnvironment(force = false) {
    const { a, b, t } = paletteAt(state.time);
    const top = mixHex(a.top, b.top, t);
    const bottom = mixHex(a.bottom, b.bottom, t);
    const sunColor = mixHex(a.sun, b.sun, t);
    const night = lerp(a.night, b.night, t);
    const rain = state.rain;
    const dayPhase = (state.time - 6) / 12;
    const sunAngle = clamp(dayPhase, 0, 1) * Math.PI;
    const sunHeight = Math.sin(sunAngle);
    sunLight.color.setHex(sunColor);
    sunLight.intensity = lerp(a.sunI, b.sunI, t) * (rain ? 0.55 : 1);
    sunLight.position.set(-Math.cos(sunAngle) * 20, 5 + sunHeight * 21, -23);
    moonLight.intensity = lerp(a.moonI, b.moonI, t);
    moonLight.position.set(Math.cos(sunAngle + Math.PI) * 15, 12 + (1 - sunHeight) * 9, -20);
    hemi.color.setHex(mixHex(a.hemiSky, b.hemiSky, t));
    hemi.groundColor.setHex(mixHex(a.hemiGround, b.hemiGround, t));
    hemi.intensity = lerp(a.hemiI, b.hemiI, t);
    renderer.toneMappingExposure = lerp(a.exp, b.exp, t);
    scene.fog.color.setHex(mixHex(a.fog, b.fog, t));
    scene.background = new THREE.Color(mixHex(a.bg, b.bg, t));
    document.body.style.background = "#" + mixHex(a.bg, b.bg, t).toString(16).padStart(6, "0");

    // Sky window.
    skyUniforms.uTop.value.setHex(top);
    skyUniforms.uBottom.value.setHex(bottom);
    skyUniforms.uSunColor.value.setHex(sunColor);
    const sunU = clamp(dayPhase, 0, 1);
    skyUniforms.uSunPos.value.set(0.12 + sunU * 0.76, 0.28 + Math.sin(sunU * Math.PI) * 0.55);
    skyUniforms.uMoonPos.value.set(0.2 + (1 - sunU) * 0.6, 0.45 + (1 - sunU) * 0.3);
    skyUniforms.uNight.value = night;
    skyUniforms.uTime.value = clock.elapsedTime;

    emissiveMaterial.color.setScalar(0.32 + night * 0.85);
    const lightBoost = rain ? 1.35 : 1;
    floodlights.forEach((l) => { l.intensity = (6 + night * 24) * lightBoost; });
    lampLight.intensity = (12 + night * 16) * (rain ? 1.15 : 1);
    if (glowMaterial) glowMaterial.uniforms.uOpacity.value = (0.15 + night * 0.8) * (rain ? 1.2 : 1);
    if (dustMaterial) {
      const counts = [0, 450, 900];
      dustPoints.geometry.setDrawRange(0, counts[state.dust]);
      dustMaterial.uniforms.uOpacity.value = state.dust === 0 ? 0 : state.dust === 1 ? 0.26 : 0.46;
      dustMaterial.uniforms.uSize.value = state.dust === 1 ? 1 : 1.45;
    }
    if (groundSolidMaterial) {
      groundSolidMaterial.roughness = rain ? 0.36 : 0.84;
      groundSolidMaterial.metalness = rain ? 0.18 : 0.03;
    }
    document.getElementById("sunIcon").textContent = night > 0.55 ? "☾" : "☀";
  }

  // ---------- machine animation ----------
  const tempVec = new THREE.Vector3();

  function circDistance(a, b) {
    let d = Math.abs(a - b) % 1;
    return Math.min(d, 1 - d);
  }

  function updateTrucks(dt) {
    const path = dynamic.truckPath;
    if (!path) return;
    dynamic.trucks.forEach((truck, ti) => {
      const dt2 = dt * state.speed;
      const other = dynamic.trucks[1 - ti];
      const gap = other ? circDistance(truck.u, other.u) : 1;
      const spacingFactor = gap < 0.075 ? 0.08 : 1;
      if (truck.stopTimer > 0) {
        truck.stopTimer -= dt;
        if (truck.stopTimer <= 0) {
          if (truck.dumping) {
            truck.dumping = false;
            truck.loaded = false;
            truck.load.visible = false;
          } else {
            truck.loaded = true;
            truck.load.visible = true;
          }
        }
      } else {
        truck.u = (truck.u + (truck.speed * dt2 * spacingFactor) / Math.max(1, dynamic.truckPathLength)) % 1;
      }
      const nearLoad = circDistance(truck.u, dynamic.truckLoadU) < 0.018;
      const nearDump = circDistance(truck.u, dynamic.truckDumpU) < 0.018;
      if (nearLoad && !truck.inLoad && truck.stopTimer <= 0) {
        truck.stopTimer = 1.8;
        truck.inLoad = true;
        truck.dumping = false;
      }
      if (!nearLoad) truck.inLoad = false;
      if (nearDump && !truck.inDump && truck.stopTimer <= 0) {
        truck.stopTimer = 2.3;
        truck.inDump = true;
        truck.dumping = true;
      }
      if (!nearDump) truck.inDump = false;
      // Dump dirt while the bed is raised.
      if (truck.dumping && truck.stopTimer > 0.35) {
        truck.dumpAccum += dt;
        if (truck.dumpAccum > 0.16) {
          truck.dumpAccum = 0;
          tempVec.set(0, 1.3, -1.2);
          truck.group.localToWorld(tempVec);
          spawnDirt(tempVec.x, tempVec.y, tempVec.z, 3);
        }
      }
      const targetTilt = truck.dumping ? -0.72 : 0;
      truck.bed.rotation.x = lerp(truck.bed.rotation.x, targetTilt, 1 - Math.exp(-dt * 5));
      const p = path.getPointAt(truck.u);
      const tangent = path.getTangentAt(truck.u);
      truck.group.position.set(p.x, GROUND + 0.02, p.z);
      const travelYaw = Math.atan2(tangent.x, tangent.z);
      const dumpYaw = 0; // rear of the local -Z bed points north, toward the spoil pile
      const targetYaw = truck.dumping ? dumpYaw : travelYaw;
      let delta = ((targetYaw - truck.group.rotation.y + Math.PI) % (Math.PI * 2)) - Math.PI;
      truck.group.rotation.y += delta * (1 - Math.exp(-dt * 5));
      truck.group.visible = true;
    });
  }

  function updateExcavators(dt) {
    const t = clock.elapsedTime;
    dynamic.excavators.forEach((e, i) => {
      const cycle = t * state.speed * 0.8 + e.phase;
      e.boomPivot.rotation.x = -0.5 + Math.sin(cycle) * 0.28;
      e.armPivot.rotation.x = 0.8 + Math.sin(cycle + 1.2) * 0.55;
      e.bucketPivot.rotation.x = -0.2 + Math.sin(cycle + 2.3) * 0.5;
      e.group.rotation.y = e.yaw + Math.sin(cycle * 0.35) * 0.18;
      e.dirt.visible = Math.sin(cycle + 2.3) > 0.3;
      if (e.dirt.visible && Math.sin(cycle + 2.3) > 0.85 && i === 0) {
        e.bucketPivot.getWorldPosition(tempVec);
        if (rand() < 0.08) spawnDirt(tempVec.x, tempVec.y, tempVec.z, 1);
      }
    });
  }

  function updateMixers(dt) {
    const t = clock.elapsedTime;
    dynamic.mixers.forEach((m) => {
      const phase = t * 0.11 * state.speed;
      m.group.position.x = -4.8 + Math.sin(phase) * 2.3;
      m.group.rotation.y = Math.cos(phase) >= 0 ? Math.PI / 2 : -Math.PI / 2;
      m.drumSpin.rotation.y += dt * state.speed * 1.4;
    });
  }

  function updateLoaders(dt) {
    const t = clock.elapsedTime;
    dynamic.loaders.forEach((l) => {
      const phase = t * 0.22 * state.speed + l.phase;
      l.group.position.x = -9.2 + Math.sin(phase) * 1.7;
      l.group.position.z = 0.25;
      l.group.rotation.y = Math.cos(phase) >= 0 ? Math.PI / 2 : -Math.PI / 2;
      l.arm.rotation.x = -0.15 + Math.sin(phase * 1.5) * 0.18;
      l.bucket.rotation.x = 0.2 + Math.sin(phase * 1.5 + 0.8) * 0.2;
    });
  }

  function updateCranes(dt) {
    const t = clock.elapsedTime;
    dynamic.cranes.forEach((c, i) => {
      const speed = state.speed;
      const slew = c.spec.baseYaw + Math.sin(t * 0.17 * speed + c.spec.phase) * 0.55;
      c.group.rotation.y = slew;
      const trolleyX = c.spec.jib * 0.52 + Math.sin(t * 0.27 * speed + c.spec.phase * 1.3) * c.spec.jib * 0.24;
      const hoist = 1.0 + (Math.sin(t * 0.21 * speed + c.spec.phase * 1.8) * 0.5 + 0.5) * 1.0;
      c.trolley.position.x = trolleyX;
      c.cable.position.x = trolleyX;
      c.cable.scale.set(1, Math.max(0.1, hoist), 1);
      c.cable.position.y = -hoist / 2;
      c.hookGroup.position.set(trolleyX, -hoist, 0);
      c.hookGroup.rotation.z = Math.sin(t * 0.8 + c.spec.phase) * 0.08;
      c.beacon.visible = Math.sin(t * 5 + c.spec.phase) > 0.2;
      c.beacon.material.color.setHex(Math.sin(t * 5 + c.spec.phase) > 0.2 ? 0xff3b2f : 0x551210);
    });
  }

  function updateWorkers(dt) {
    if (!dynamic.workers) return;
    const W = dynamic.workers;
    W.time += dt * state.speed;
    const parts = W.parts;
    const time = W.time;
    W.workers.forEach((w, i) => {
      let moving = false;
      if (w.walker && w.route) {
        const target = w.route[w.routeIndex];
        const dx = target[0] - w.x;
        const dz = target[1] - w.z;
        const dist = Math.hypot(dx, dz);
        if (dist < 0.06) {
          w.routeIndex += w.routeDir;
          if (w.routeIndex >= w.route.length) { w.routeIndex = w.route.length - 2; w.routeDir = -1; }
          if (w.routeIndex < 0) { w.routeIndex = 1; w.routeDir = 1; }
        } else {
          w.x += (dx / dist) * w.speed * dt * state.speed;
          w.z += (dz / dist) * w.speed * dt * state.speed;
          w.angle = Math.atan2(dx, dz);
          moving = true;
        }
      }
      w.x = clamp(w.x, SITE.minX + 0.3, SITE.maxX - 0.3);
      w.z = clamp(w.z, SITE.minZ + 0.3, SITE.maxZ - 0.3);
      const bob = moving ? Math.abs(Math.sin(time * 7 + w.phase)) * 0.035 : Math.sin(time * 1.8 + w.phase) * 0.012;
      const y = GROUND + bob;
      const walkSwing = moving ? Math.sin(time * 8 + w.phase) * 0.55 : Math.sin(time * 1.5 + w.phase) * 0.06;
      const angle = w.angle;
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);

      const setPart = (mesh, idx, lx, ly, lz, rx, ry, rz, sx, sy, sz) => {
        dummy.position.set(w.x + cos * lx + sin * lz, y + ly, w.z - sin * lx + cos * lz);
        dummy.rotation.set(rx, ry + angle, rz);
        dummy.scale.set(sx, sy, sz);
        dummy.updateMatrix();
        mesh.setMatrixAt(idx, dummy.matrix);
      };

      setPart(parts.torso, i, 0, 0.62, 0, 0, 0, 0, 1, 1, 1);
      setPart(parts.head, i, 0, 0.86, 0, 0, 0, 0, 1, 1, 1);
      setPart(parts.helmet, i, 0, 0.95, 0, 0, 0, 0, 1, 1, 1);
      let armL = walkSwing;
      let armR = -walkSwing;
      if (w.role === "signal") { armR = -1.2 + Math.sin(time * 3 + w.phase) * 0.45; armL = 0.2; }
      if (w.role === "rebar") { armL = 0.7 + Math.sin(time * 2 + w.phase) * 0.18; armR = 0.7 - Math.sin(time * 2 + w.phase) * 0.18; }
      if (w.role === "security") { armL = 0.15; armR = -0.1; }
      setPart(parts.arm, i * 2, 0.18, 0.62, 0, armL, 0, 0, 1, 1, 1);
      setPart(parts.arm, i * 2 + 1, -0.18, 0.62, 0, armR, 0, 0, 1, 1, 1);
      setPart(parts.leg, i * 2, 0.07, 0.2, 0, walkSwing, 0, 0, 1, 1, 1);
      setPart(parts.leg, i * 2 + 1, -0.07, 0.2, 0, -walkSwing, 0, 0, 1, 1, 1);
    });
    for (const key of Object.keys(parts)) parts[key].instanceMatrix.needsUpdate = true;
  }

  function updateDioramaCar(dt) {
    if (!dynamic.dioramaCar) return;
    const car = dynamic.dioramaCar;
    car.t += dt * 0.12 * state.speed;
    const z = -4.2 + ((Math.sin(car.t) + 1) / 2) * 8.4;
    car.group.position.z = z;
    car.group.rotation.y = Math.cos(car.t) > 0 ? 0 : Math.PI;
  }

  function updateDirt(dt) {
    if (!dynamic.dirt) return;
    const { points, positions, data } = dynamic.dirt;
    data.forEach((p, i) => {
      if (p.life > 0) {
        p.life -= dt;
        p.vy -= 3.8 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.z += p.vz * dt;
        positions[i * 3] = p.x;
        positions[i * 3 + 1] = p.y;
        positions[i * 3 + 2] = p.z;
      } else {
        positions[i * 3 + 1] = -100;
      }
    });
    points.geometry.attributes.position.needsUpdate = true;
  }

  function updateRain(dt) {
    if (!rainLines || !rainLines.visible) return;
    for (let i = 0; i < rainVelocities.length; i++) {
      const drop = rainVelocities[i];
      rainPositions[i * 6 + 1] -= drop * dt;
      rainPositions[i * 6 + 4] -= drop * dt;
      rainPositions[i * 6] += 0.04 * dt;
      rainPositions[i * 6 + 3] += 0.04 * dt;
      if (rainPositions[i * 6 + 1] < GROUND + 0.08) resetRainDrop(i);
    }
    rainLines.geometry.attributes.position.needsUpdate = true;
  }

  // ---------- HUD & render loop ----------
  function formatTime(t) {
    const h = Math.floor(t) % 24;
    const m = Math.floor((t - Math.floor(t)) * 60);
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
  }

  function phaseName(t) {
    if (t < 5) return "深夜";
    if (t < 8) return "黎明";
    if (t < 11) return "上午";
    if (t < 14) return "正午";
    if (t < 17) return "下午";
    if (t < 19) return "黄昏";
    return "夜晚";
  }

  function updateHUD() {
    document.getElementById("timeLabel").textContent = formatTime(state.time);
    document.getElementById("phaseLabel").textContent = `${phaseName(state.time)} · ${state.rain ? "降雨" : "晴朗"}`;
  }

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());
    if (state.autoDay) {
      state.time = (state.time + dt * 0.09) % 24;
    }
    updateEnvironment();
    updateCamera(dt);
    updateTrucks(dt);
    updateExcavators(dt);
    updateMixers(dt);
    updateLoaders(dt);
    updateCranes(dt);
    updateWorkers(dt);
    updateDioramaCar(dt);
    updateDirt(dt);
    updateRain(dt);
    if (dustMaterial) dustMaterial.uniforms.uTime.value = clock.elapsedTime;
    if (glowMaterial) glowMaterial.uniforms.uTime.value = clock.elapsedTime;
    renderer.render(scene, camera);
    updateHUD();
    frames += 1;
    fpsAccum += dt;
    if (fpsAccum > 0.5) {
      document.getElementById("fps").textContent = `${Math.round(frames / fpsAccum)} FPS`;
      frames = 0;
      fpsAccum = 0;
    }
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  }

  function toast(message) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  window.__voxelSite = {
    state,
    setFocus,
    projectKnobs: () => knobMeshes.map((m) => {
      const v = m.position.clone().project(camera);
      return { index: m.userData.knob, x: (v.x * 0.5 + 0.5) * window.innerWidth, y: (-v.y * 0.5 + 0.5) * window.innerHeight };
    }),
    setSpeed,
    setDust,
    setRain,
    setAutoDay,
    cameraGoal,
    cameraState,
    getCounts: () => ({
      cranes: dynamic.cranes.length,
      excavators: dynamic.excavators.length,
      trucks: dynamic.trucks.length,
      workers: dynamic.workers?.workers.length || 0
    })
  };

  init();
})();
</script>
