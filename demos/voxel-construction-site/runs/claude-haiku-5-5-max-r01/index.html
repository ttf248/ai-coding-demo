<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>体素微缩建筑工地沙盘</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #120c08; color: #f3e9da; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .hud { position: fixed; left: 12px; top: 12px; max-width: min(340px, calc(100vw - 24px)); padding: 12px 14px; border-radius: 12px; background: rgba(20, 12, 6, 0.64); border: 1px solid rgba(255, 200, 120, 0.25); font-size: 13px; line-height: 1.7; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .hud h1 { margin: 0 0 4px; font-size: 16px; color: #ffd58a; }
    .hud kbd { font: inherit; padding: 0 5px; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 4px; background: rgba(255, 255, 255, 0.08); }
    .status { position: fixed; right: 12px; bottom: 12px; max-width: calc(100vw - 24px); padding: 8px 12px; border-radius: 10px; background: rgba(20, 12, 6, 0.62); font-size: 13px; line-height: 1.6; }
    .fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; background: #120c08; color: #ffd58a; font-size: 15px; line-height: 1.8; z-index: 5; }
    @media (max-width: 560px) { .hud { font-size: 12px; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="c" aria-label="体素微缩建筑工地沙盘"></canvas>
  <section class="hud" aria-label="操作说明">
    <h1>体素微缩建筑工地</h1>
    <div>拖动旋转视角 · 滚轮缩放 · 闲置时自动缓慢环绕</div>
    <div>点击桌面旋钮：<b>运行速度</b>、<b>昼夜循环</b>、<b>施工尘土</b></div>
    <div>按 <kbd>Space</kbd> 切换模拟暴雨；按 <kbd>N</kbd> 切换时段</div>
  </section>
  <div class="status" id="status">正在加载 Three.js……</div>
  <div class="fallback" id="fallback" role="alert"></div>
  <script type="module">
    import * as THREE from "three";

    const fallback = document.getElementById("fallback");
    const statusEl = document.getElementById("status");
    window.addEventListener("error", (e) => {
      fallback.textContent = "页面运行出错：" + (e.message || "未知错误") + "。若画面为空，请检查网络（Three.js CDN）或 WebGL 支持后刷新。";
      fallback.style.display = "flex";
    });

    const canvas = document.getElementById("c");
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    } catch (err) {
      fallback.textContent = "当前浏览器无法创建 WebGL 上下文，无法显示沙盘。";
      fallback.style.display = "flex";
      throw err;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    const scene = new THREE.Scene();
    const ROOM = new THREE.Color(0x2a1d14);
    scene.background = ROOM.clone();
    scene.fog = new THREE.Fog(ROOM.getHex(), 48, 120);
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 400);

    // Seeded random: the layout, colours and crowd are identical on every load.
    function mulberry32(seed) {
      return () => {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rnd = mulberry32(2026);
    const pick = (list) => list[Math.floor(rnd() * list.length)];

    const hemi = new THREE.HemisphereLight(0xdfe9ff, 0x3b2a1a, 0.9);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff0d0, 2.2);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 14, bottom: -14, near: 1, far: 120 });
    sun.shadow.camera.updateProjectionMatrix();
    sun.shadow.bias = -0.0005;
    sun.shadow.normalBias = 0.02;
    scene.add(sun, sun.target);

    // Code-generated canvas textures; no image files are loaded.
    function makeTexture(w, h, draw, rx = 1, ry = 1) {
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      draw(c.getContext("2d"), w, h);
      const t = new THREE.CanvasTexture(c);
      t.wrapS = THREE.RepeatWrapping;
      t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(rx, ry);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 8;
      return t;
    }
    const woodTex = makeTexture(256, 256, (g, w, h) => {
      g.fillStyle = "#6e4628";
      g.fillRect(0, 0, w, h);
      for (let y = 0; y < h; y += 3) {
        const k = rnd();
        g.fillStyle = `rgba(${(40 + k * 50) | 0}, ${(24 + k * 25) | 0}, ${(10 + k * 10) | 0}, ${0.2 + k * 0.3})`;
        g.fillRect(0, y, w, 1 + rnd() * 2);
      }
    }, 2, 1);
    const blueprintTex = makeTexture(256, 180, (g, w, h) => {
      g.fillStyle = "#1d4f8c";
      g.fillRect(0, 0, w, h);
      g.strokeStyle = "rgba(255, 255, 255, 0.35)";
      g.lineWidth = 1;
      for (let x = 0; x <= w; x += 16) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
      for (let y = 0; y <= h; y += 16) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
      g.strokeStyle = "rgba(255, 255, 255, 0.85)";
      g.lineWidth = 2;
      g.strokeRect(20, 20, 150, 110);
      g.strokeRect(120, 60, 100, 80);
      g.beginPath();
      g.arc(70, 80, 26, 0, Math.PI * 2);
      g.stroke();
    });

    const deskMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.55, metalness: 0.02 });
    const voxMat = new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0.02 });
    const paperMat = new THREE.MeshStandardMaterial({ map: blueprintTex, roughness: 0.7 });
    const metalMat = new THREE.MeshStandardMaterial({ color: 0x9aa3ad, roughness: 0.35, metalness: 0.6 });
    const hatMat = new THREE.MeshStandardMaterial({ color: 0xf2c230, roughness: 0.5 });
    const blackMat = new THREE.MeshStandardMaterial({ color: 0x23272d, roughness: 0.7 });

    // Voxel cells are collected first, then drawn as a few InstancedMesh batches.
    const VOX = 0.5;
    const cells = [];
    const yOf = (layer) => 0.25 + VOX * layer;   // layer -1 = base plate, 0 = ground surface
    const put = (x, layer, z, c) => cells.push({ x, y: yOf(layer), z, c });
    const pickColor = (colors) => (Array.isArray(colors) ? pick(colors) : colors);
    function fill(x0, x1, z0, z1, layer, colors, skip) {
      for (let x = x0 + VOX / 2; x < x1; x += VOX) {
        for (let z = z0 + VOX / 2; z < z1; z += VOX) {
          if (skip && skip(x, z)) continue;
          put(x, layer, z, pickColor(colors));
        }
      }
    }
    // Perimeter band of thickness t inside the rectangle (used for walls and slabs).
    function ring(x0, x1, z0, z1, t, layer, colors) {
      fill(x0, x1, z0, z1, layer, colors, (x, z) => x > x0 + t && x < x1 - t && z > z0 + t && z < z1 - t);
    }
    function column(x, z, from, to, c) {
      for (let L = from; L <= to; L++) put(x, L, z, c);
    }

    // Site layout in world units (site spans x -11..11, z -7..7). Each special area adds its own ground cells.
    const AREAS = {
      pit: [-7.5, -1.5, -2.5, 2.5],
      heap: [-9.5, -7.6, -5.0, -2.9],
      slab: [0.5, 6.5, 0.5, 5.5],
      shed: [5.0, 9.0, -6.5, -3.0],
      yard: [-10.0, -7.0, 2.8, 5.0],
      office: [7.0, 9.0, 3.0, 5.0],
      roadTop: [-10.5, 10.5, -6.5, -5.5],
      roadBottom: [-10.5, 10.5, 5.5, 6.5],
      roadLeft: [-10.5, -9.5, -6.5, 6.5],
      roadRight: [9.5, 10.5, -6.5, 6.5],
      entry: [-10.5, -7.5, -0.5, 0.5],
    };
    const inRect = (r, x, z) => x > r[0] && x < r[1] && z > r[2] && z < r[3];
    const special = (x, z) => Object.values(AREAS).some((r) => inRect(r, x, z));
    const winCells = [];

    fill(-11, 11, -7, 7, -1, 0x5a4330);
    fill(-11, 11, -7, 7, 0, [0xa48a66, 0x9b7f5c, 0xb09a74], special);
    for (const key of ["roadTop", "roadBottom", "roadLeft", "roadRight", "entry"]) {
      const r = AREAS[key];
      fill(r[0], r[1], r[2], r[3], 0, 0x3c3f45);
    }

    // Spoil heap: rounded mound with a lighter top layer.
    for (let x = -9.25; x < -7.6; x += VOX) {
      for (let z = -4.75; z < -2.9; z += VOX) {
        const h = Math.max(0, Math.round(2.6 - Math.hypot(x + 8.6, z + 3.9) * 1.1 + rnd() * 0.8));
        put(x, 0, z, 0x6e5a40);
        for (let L = 1; L <= h; L++) put(x, L, z, L === h ? 0x8a7458 : 0x6e5a40);
      }
    }

    // High-rise foundation: slab, corner columns, floor bands and a few front windows.
    fill(0.5, 6.5, 0.5, 5.5, 0, 0xc9c3b6);
    for (const [x, z] of [[1.25, 1.25], [5.75, 1.25], [1.25, 4.75], [5.75, 4.75]]) column(x, z, 1, 8, 0xd7d2c4);
    for (const L of [2, 4, 6, 8]) ring(0.5, 6.5, 0.5, 5.5, 1, L, 0xd7d2c4);
    for (const L of [3, 5, 7]) {
      for (const x of [1.25, 2.25, 3.25, 4.25, 5.25]) winCells.push({ x, y: yOf(L), z: 0.75, c: 0x2c3e50 });
    }

    // Rebar shed with blue roof sheet and bundled rebar.
    fill(5.0, 9.0, -6.5, -3.0, 0, 0x6f6a63);
    fill(5.0, 9.0, -6.5, -3.0, 3, 0x3f6fb0);
    for (const [x, z] of [[5.25, -6.25], [8.75, -6.25], [5.25, -3.25], [8.75, -3.25]]) column(x, z, 1, 2, 0x8d8d8d);
    fill(5.5, 8.5, -5.75, -3.75, 1, [0x7b6f63, 0x5d5148]);

    // Material yard: pipes, bricks and sand heaps stacked on a sand floor.
    fill(-10.0, -7.0, 2.8, 5.0, 0, 0xbda985);
    for (let x = -9.75; x <= -7.25; x += 1) {
      for (let z = 3.25; z <= 4.75; z += 1) {
        const h = 1 + Math.floor(rnd() * 3);
        const c = pick([0x9aa3ad, 0xb4553a, 0xd9b77a]);
        for (let L = 1; L <= h; L++) put(x, L, z, c);
      }
    }

    // Site office: white container walls, blue stripe, grey roof.
    fill(7.0, 9.0, 3.0, 5.0, 0, 0x8a8f96);
    ring(7.0, 9.0, 3.0, 5.0, 0.5, 1, 0xf2f2f2);
    ring(7.0, 9.0, 3.0, 5.0, 0.5, 2, [0xf2f2f2, 0x2a6fc9]);
    fill(7.0, 9.0, 3.0, 5.0, 3, 0x9aa3ad);

    // Perimeter barrier with a gate opening on the west side.
    const fenceCol = (i) => (i % 2 ? 0xd64533 : 0xf2efe8);
    for (let x = -10.75, i = 0; x < 11; x += VOX, i++) {
      put(x, 1, -6.75, fenceCol(i));
      put(x, 1, 6.75, fenceCol(i));
    }
    for (let z = -6.75, i = 0; z < 7; z += VOX, i++) {
      if (Math.abs(z) > 1.4) put(-10.75, 1, z, fenceCol(i));
      put(10.75, 1, z, fenceCol(i));
    }
    for (const [x, z] of [[-10.25, -6.25], [10.25, 6.25], [10.25, -6.25]]) column(x, z, 1, 6, 0xdddddd);

    // Street lamps: poles with warm lamp heads (glow is added later).
    const lampSpots = [[0.25, -6.25], [-4.75, 6.25], [4.25, 6.25]];
    for (const [x, z] of lampSpots) {
      column(x, z, 1, 5, 0x3a3f46);
      put(x, 6, z, 0xfff2b0);
    }

    // Batch voxels into InstancedMesh objects: one draw call per batch, colour per instance.
    function batch(list, material) {
      const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(VOX, VOX, VOX), material, list.length);
      const m = new THREE.Matrix4();
      const col = new THREE.Color();
      list.forEach((v, i) => {
        m.makeTranslation(v.x, v.y, v.z);
        mesh.setMatrixAt(i, m);
        mesh.setColorAt(i, col.setHex(v.c));
      });
      mesh.instanceMatrix.needsUpdate = true;
      mesh.instanceColor.needsUpdate = true;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }
    batch(cells, voxMat);
    const windowMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, emissive: 0xffb050, emissiveIntensity: 0 });
    batch(winCells, windowMat);

    // Desk, blueprint sheets, hard hat, tape measure, spirit level and three control knobs.
    const desk = new THREE.Mesh(new THREE.BoxGeometry(30, 1.0, 18), deskMat);
    desk.position.set(0, -1.0, 0);
    desk.receiveShadow = true;
    scene.add(desk);
    for (const [x, z, ry] of [[-13, -6.2, 0.15], [12.5, 6.3, -0.25]]) {
      const sheet = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 3.0), paperMat);
      sheet.rotation.set(-Math.PI / 2, 0, ry);
      sheet.position.set(x, -0.49, z);
      sheet.receiveShadow = true;
      scene.add(sheet);
    }
    const hat = new THREE.Group();
    const dome = new THREE.Mesh(new THREE.SphereGeometry(0.9, 18, 10, 0, Math.PI * 2, 0, Math.PI / 2), hatMat);
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.25, 0.12, 20), hatMat);
    brim.position.y = 0.06;
    hat.add(dome, brim);
    hat.position.set(12.8, -0.5, -7.2);
    hat.rotation.y = 0.6;
    hat.traverse((o) => { if (o.isMesh) o.castShadow = true; });
    scene.add(hat);
    const tape = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.4, 20), new THREE.MeshStandardMaterial({ color: 0xf0c020, roughness: 0.4 }));
    tape.rotation.z = Math.PI / 2;
    tape.position.set(-12.6, -0.7, 7.2);
    tape.castShadow = true;
    scene.add(tape);
    const level = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.3, 0.6), metalMat);
    level.position.set(-9.2, -0.65, 7.6);
    level.rotation.y = -0.2;
    level.castShadow = true;
    scene.add(level);

    const knobs = [];
    const knobMat = [0xf2c230, 0x7fe3a6, 0xc7d3e6].map((c) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.25, roughness: 0.4, metalness: 0.5 }));
    [[9.5, 0], [11.8, 1], [14.1, 2]].forEach(([x, id]) => {
      const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.7, 0.55, 20), blackMat);
      knob.position.set(x, -0.25, 8.3);
      knob.castShadow = true;
      const pointer = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.6), knobMat[id]);
      pointer.position.set(0, 0.32, -0.2);
      knob.add(pointer);
      knob.userData.id = id;
      scene.add(knob);
      knobs.push(knob);
    });

    // Shader-driven effects: night glow, drifting dust and falling rain (all computed on the GPU).
    const uniforms = { uTime: { value: 0 }, uPixel: { value: renderer.getPixelRatio() }, uNight: { value: 0 }, uDust: { value: 0.5 }, uRain: { value: 0 } };
    const pointsMat = (vs, fs) => new THREE.ShaderMaterial({ uniforms, vertexShader: vs, fragmentShader: fs, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
    const glowMat = pointsMat(
      "attribute float aSize; uniform float uPixel; uniform float uNight; varying float vA; void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv; gl_PointSize = aSize * uPixel * (320.0 / -mv.z); vA = uNight; }",
      "varying float vA; void main() { float d = length(gl_PointCoord - vec2(0.5)); float a = smoothstep(0.5, 0.0, d) * vA; if (a < 0.01) discard; gl_FragColor = vec4(vec3(1.0, 0.72, 0.4) * a, a); }"
    );
    const dustMat = pointsMat(
      "attribute float aSeed; uniform float uTime; uniform float uPixel; uniform float uDust; varying float vA; void main() { vec3 p = position; float h = mod(aSeed * 3.0 + uTime * (0.15 + aSeed * 0.1), 3.0); p.y += h; p.x += sin(uTime * 0.6 + aSeed * 40.0) * 0.4; p.z += cos(uTime * 0.5 + aSeed * 30.0) * 0.4; vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_Position = projectionMatrix * mv; gl_PointSize = (2.0 + aSeed * 3.0) * uPixel * (300.0 / -mv.z); vA = uDust * (1.0 - h / 3.0) * 0.6; }",
      "varying float vA; void main() { float d = length(gl_PointCoord - vec2(0.5)); float a = smoothstep(0.5, 0.0, d) * vA; if (a < 0.01) discard; gl_FragColor = vec4(vec3(0.75, 0.62, 0.45) * a, a); }"
    );
    const rainMat = pointsMat(
      "attribute float aSeed; uniform float uTime; uniform float uPixel; uniform float uRain; varying float vA; void main() { vec3 p = position; p.y = mod(p.y - uTime * (10.0 + aSeed * 4.0), 14.0); vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_Position = projectionMatrix * mv; gl_PointSize = 1.8 * uPixel * (300.0 / -mv.z); vA = uRain * 0.7; }",
      "varying float vA; void main() { float d = length(gl_PointCoord - vec2(0.5)); float a = smoothstep(0.5, 0.0, d) * vA; if (a < 0.01) discard; gl_FragColor = vec4(vec3(0.7, 0.8, 1.0) * a, a); }"
    );
    function particles(count, fill3, withSeed, mat) {
      const pos = new Float32Array(count * 3);
      const seeds = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        const p = fill3(i);
        pos.set(p, i * 3);
        seeds[i] = rnd();
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      if (withSeed) g.setAttribute("aSeed", new THREE.BufferAttribute(seeds, 1));
      const obj = new THREE.Points(g, mat);
      obj.frustumCulled = false;
      scene.add(obj);
      return obj;
    }
    const lampTops = lampSpots.map(([x, z]) => [x, yOf(6) + 0.2, z]);
    const glowGeo = new THREE.BufferGeometry();
    glowGeo.setAttribute("position", new THREE.Float32BufferAttribute(lampTops.flat(), 3));
    glowGeo.setAttribute("aSize", new THREE.Float32BufferAttribute(lampTops.map(() => 9.0), 1));
    const glow = new THREE.Points(glowGeo, glowMat);
    glow.frustumCulled = false;
    scene.add(glow);
    const dust = particles(900, () => [(rnd() - 0.5) * 20, 0.6, (rnd() - 0.5) * 12], true, dustMat);
    const rain = particles(1800, () => [(rnd() - 0.5) * 28, rnd() * 14, (rnd() - 0.5) * 17], true, rainMat);
    rain.visible = false;

    // Dynamic machines and people. Each entity is an update(t, speed) function driven by one clock.
    const colorMat = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 });
    const bodyMats = { yellow: colorMat(0xf2b531), blue: colorMat(0x2a6fc9), red: colorMat(0xd64533), grey: colorMat(0x8d939b), dark: colorMat(0x2b2f36), white: colorMat(0xf2efe8) };
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x1f3b57, roughness: 0.2, metalness: 0.2 });
    const skinMat = colorMat(0xf0c9a0);
    const vestMat = colorMat(0xff7a1a);
    const boxMesh = (w, h, d, mat, x, y, z) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, y, z);
      m.castShadow = true;
      m.receiveShadow = true;
      return m;
    };
    const dynamic = [];

    // Two-link excavator: boom pivot 1.95 m above ground; joint angles keep the bucket above the pit floor.
    function makeExcavator(x, z, mat) {
      const g = new THREE.Group();
      g.position.set(x, 0.5, z);
      g.add(boxMesh(2.0, 0.5, 2.4, bodyMats.dark, 0, 0.25, 0));
      g.add(boxMesh(1.7, 0.4, 1.7, mat, 0, 0.7, 0));
      g.add(boxMesh(1.1, 0.7, 1.1, mat, 0, 1.2, -0.3));
      g.add(boxMesh(0.9, 0.3, 0.1, glassMat, 0, 1.25, 0.26));
      const arm = new THREE.Group();
      arm.position.set(0, 1.45, 0.2);
      g.add(arm);
      const boom = new THREE.Group();
      arm.add(boom);
      boom.add(boxMesh(0.35, 0.35, 2.0, mat, 0, 0, 1.0));
      const stick = new THREE.Group();
      stick.position.set(0, 0, 2.0);
      boom.add(stick);
      stick.add(boxMesh(0.3, 0.3, 1.6, bodyMats.yellow, 0, 0, 0.8));
      const bucket = new THREE.Group();
      bucket.position.set(0, 0, 1.6);
      stick.add(bucket);
      bucket.add(boxMesh(0.8, 0.5, 0.5, bodyMats.grey, 0, -0.1, 0.25));
      scene.add(g);
      dynamic.push((t) => {
        const a = -0.265 + 0.115 * Math.sin(t * 0.9);
        const c = -0.64 + 0.14 * Math.sin(t * 1.3);
        boom.rotation.x = -a;
        stick.rotation.x = -(c - a);
        bucket.rotation.x = -0.25 * Math.sin(t * 1.3);
      });
    }
    makeExcavator(-5.0, -3.9, bodyMats.yellow);
    makeExcavator(-2.5, -3.9, bodyMats.blue);

    // Loop road centreline (clockwise). Vehicles share the loop and keep a minimum spacing.
    const LOOP = { x0: -10, x1: 10, z0: -6, z1: 6 };
    const LOOP_LEN = 2 * ((LOOP.x1 - LOOP.x0) + (LOOP.z1 - LOOP.z0));
    function loopPoint(s) {
      const W = LOOP.x1 - LOOP.x0, H = LOOP.z1 - LOOP.z0;
      let d = ((s % LOOP_LEN) + LOOP_LEN) % LOOP_LEN;
      if (d < W) return { x: LOOP.x0 + d, z: LOOP.z0, hx: 1, hz: 0 };
      d -= W;
      if (d < H) return { x: LOOP.x1, z: LOOP.z0 + d, hx: 0, hz: 1 };
      d -= H;
      if (d < W) return { x: LOOP.x1 - d, z: LOOP.z1, hx: -1, hz: 0 };
      d -= W;
      return { x: LOOP.x0, z: LOOP.z1 - d, hx: 0, hz: -1 };
    }
    const vehicles = [];
    function makeVehicle(s0, v, kind) {
      const g = new THREE.Group();
      if (kind === "mixer") {
        const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 2.0, 12), bodyMats.grey);
        drum.rotation.x = Math.PI / 2;
        drum.position.set(0, 1.25, -0.3);
        drum.castShadow = true;
        g.add(drum, boxMesh(1.4, 0.3, 2.6, bodyMats.dark, 0, 0.75, 0), boxMesh(1.3, 0.8, 0.9, bodyMats.blue, 0, 1.1, 1.0));
      } else {
        g.add(boxMesh(1.4, 0.35, 2.6, bodyMats.dark, 0, 0.75, 0), boxMesh(1.4, 0.6, 1.5, bodyMats.yellow, 0, 1.2, -0.4), boxMesh(1.3, 0.7, 0.9, bodyMats.yellow, 0, 1.1, 1.0));
      }
      for (const [x, z] of [[-0.7, -0.9], [0.7, -0.9], [-0.7, 0.9], [0.7, 0.9]]) g.add(boxMesh(0.25, 0.5, 0.5, bodyMats.dark, x, 0.4, z));
      scene.add(g);
      const veh = { s: s0, v, scale: 1, obj: g };
      vehicles.push(veh);
      return veh;
    }
    makeVehicle(0, 2.4, "truck");
    makeVehicle(21, 2.4, "truck");
    makeVehicle(42, 2.0, "truck");
    makeVehicle(32, 1.6, "mixer");
    dynamic.push((t) => {
      const sorted = vehicles.map((v) => { v.s = ((v.s % LOOP_LEN) + LOOP_LEN) % LOOP_LEN; return v; }).sort((a, b) => a.s - b.s);
      sorted.forEach((a, i) => {
        const b = sorted[(i + 1) % sorted.length];
        let gap = b.s - a.s;
        if (gap <= 0) gap += LOOP_LEN;
        a.scale = gap < 3.2 ? 0.15 : 1;
      });
      for (const veh of vehicles) {
        veh.s += veh.v * veh.scale * (t - (veh.last ?? t));
        veh.last = t;
        const p = loopPoint(veh.s);
        veh.obj.position.set(p.x, 0.5, p.z);
        veh.obj.rotation.y = Math.atan2(p.hx, p.hz);
      }
    });

    // Tower cranes: slewing jib, trolley travel and a hook that stays above the highest building.
    function makeCrane(x, z, offset, loadColor) {
      const g = new THREE.Group();
      g.position.set(x, 0.5, z);
      g.add(boxMesh(0.5, 9.0, 0.5, bodyMats.yellow, 0, 4.5, 0));
      const jib = new THREE.Group();
      jib.position.set(0, 9.0, 0);
      g.add(jib);
      jib.add(boxMesh(0.4, 0.4, 6.5, bodyMats.red, 0, 0, 2.5));
      jib.add(boxMesh(0.4, 0.4, 2.0, bodyMats.dark, 0, 0, -1.0));
      const trolley = new THREE.Group();
      trolley.position.set(0, -0.3, 3.0);
      jib.add(trolley);
      trolley.add(boxMesh(0.5, 0.2, 0.5, bodyMats.dark, 0, 0, 0));
      const hook = new THREE.Group();
      trolley.add(hook);
      hook.add(boxMesh(0.04, 2.0, 0.04, bodyMats.dark, 0, -1.0, 0));
      hook.add(boxMesh(0.8, 0.5, 0.8, colorMat(loadColor), 0, -2.2, 0));
      scene.add(g);
      dynamic.push((t) => {
        jib.rotation.y = offset + t * 0.12;
        trolley.position.z = 3.0 + 1.5 * Math.sin(t * 0.25);
        hook.position.y = -0.5 * (1 + Math.sin(t * 0.4));
      });
    }
    makeCrane(2.7, -3.6, 0, 0xb4553a);
    makeCrane(7.6, 0.6, Math.PI, 0x9aa3ad);

    // Workers: tying rebar, signalling the crane, carrying materials along a fixed path, and a gate guard.
    function makeWorker(x, z, vest, facing) {
      const g = new THREE.Group();
      g.position.set(x, 0.5, z);
      g.rotation.y = facing;
      const legL = boxMesh(0.25, 0.7, 0.3, bodyMats.dark, -0.13, 0.35, 0);
      const legR = boxMesh(0.25, 0.7, 0.3, bodyMats.dark, 0.13, 0.35, 0);
      const armL = new THREE.Group();
      armL.position.set(-0.36, 1.35, 0);
      armL.add(boxMesh(0.18, 0.6, 0.18, vest, 0, -0.3, 0));
      const armR = new THREE.Group();
      armR.position.set(0.36, 1.35, 0);
      armR.add(boxMesh(0.18, 0.6, 0.18, vest, 0, -0.3, 0));
      g.add(legL, legR, boxMesh(0.5, 0.7, 0.3, vest, 0, 1.05, 0), boxMesh(0.32, 0.32, 0.32, skinMat, 0, 1.6, 0), boxMesh(0.36, 0.14, 0.36, bodyMats.yellow, 0, 1.8, 0), armL, armR);
      scene.add(g);
      return { g, legL, legR, armL, armR };
    }
    const tying = [makeWorker(6.4, -2.2, vestMat, 0), makeWorker(7.6, -2.2, vestMat, 0)];
    tying.forEach((w, i) => dynamic.push((t) => {
      w.armL.rotation.x = -1.0 + 0.6 * Math.sin(t * 5 + i);
      w.armR.rotation.x = -1.0 + 0.6 * Math.sin(t * 5 + i + 1.5);
    }));
    const signaler = makeWorker(3.9, -2.2, bodyMats.yellow, -Math.PI / 2);
    dynamic.push((t) => {
      signaler.armR.rotation.x = -2.2 + 0.6 * Math.sin(t * 2);
    });
    const carriers = [makeWorker(-5.6, 3.1, vestMat, 0), makeWorker(-3.0, 3.1, vestMat, 0)];
    carriers.forEach((w, i) => dynamic.push((t) => {
      const phase = (t * 0.35 + i * 0.5) % 2;
      const back = phase > 1;
      const f = back ? 2 - phase : phase;
      w.g.position.x = -5.6 + 5.1 * f;
      w.g.rotation.y = back ? -Math.PI / 2 : Math.PI / 2;
      const swing = Math.sin(t * 6 + i) * 0.5;
      w.legL.rotation.x = swing;
      w.legR.rotation.x = -swing;
    }));
    const guard = makeWorker(-8.5, -1.2, vestMat, 0);
    dynamic.push((t) => {
      const phase = (t * 0.25) % 2;
      const back = phase > 1;
      const f = back ? 2 - phase : phase;
      guard.g.position.z = -1.2 + 2.4 * f;
      guard.g.rotation.y = back ? Math.PI : 0;
      guard.legL.rotation.x = Math.sin(t * 5) * 0.4;
      guard.legR.rotation.x = -Math.sin(t * 5) * 0.4;
    });

    // Flags and blinking warning lights on the corner poles.
    const flagMat = new THREE.MeshStandardMaterial({ color: 0xd64533, roughness: 0.7, side: THREE.DoubleSide });
    const blinkMat = new THREE.MeshBasicMaterial({ color: 0xff3b30 });
    for (const [x, z] of [[-10.25, -6.25], [10.25, 6.25], [10.25, -6.25]]) {
      const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.7), flagMat);
      const pivot = new THREE.Group();
      pivot.position.set(x, 3.2, z);
      flag.position.x = 0.6;
      pivot.add(flag);
      const light = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.28), blinkMat);
      light.position.set(x, 3.7, z);
      scene.add(pivot, light);
      dynamic.push((t) => {
        flag.rotation.y = Math.sin(t * 2 + x) * 0.25;
        light.visible = Math.sin(t * 4) > 0;
      });
    }

    // Orbit camera at roughly eye level, looking across the desk at the site.
    const TARGET = new THREE.Vector3(0, 1.6, 0);
    const orbit = { yaw: 0, pitch: 0.2, dist: 27 };
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    let drag = null, idleTime = 0;
    canvas.addEventListener("pointerdown", (e) => {
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false };
      canvas.setPointerCapture(e.pointerId);
      idleTime = 0;
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!drag || drag.id !== e.pointerId) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.hypot(dx, dy) > 4) drag.moved = true;
      if (!drag.moved) return;
      orbit.yaw -= dx * 0.005;
      orbit.pitch = clamp(orbit.pitch + dy * 0.004, 0.02, 0.95);
      drag.x = e.clientX;
      drag.y = e.clientY;
      idleTime = 0;
    });
    canvas.addEventListener("pointerup", (e) => {
      if (drag && !drag.moved) clickAt(e);
      drag = null;
    });
    canvas.addEventListener("pointercancel", () => { drag = null; });
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      orbit.dist = clamp(orbit.dist * Math.exp(e.deltaY * 0.001), 12, 46);
      idleTime = 0;
    }, { passive: false });

    // Knobs: speed (0.5x / 1x / 2x), day-night cycle on/off, dust (low / medium / high).
    const SPEEDS = [0.5, 1, 2], DUST = [0.2, 0.55, 1.0], DUST_NAMES = ["低", "中", "高"];
    const knobState = { speed: 1, auto: true, dust: 1 };
    let raining = false, rainAmt = 0, dustAmt = DUST[1], tDay = 0.02;
    const phaseNames = ["黎明", "白昼", "黄昏", "夜晚"];
    const ray = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    function clickAt(e) {
      const r = canvas.getBoundingClientRect();
      ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const hit = ray.intersectObjects(knobs, true)[0];
      if (!hit) return;
      let o = hit.object;
      while (o && o.userData.id === undefined) o = o.parent;
      if (o) toggleKnob(o.userData.id);
    }
    function toggleKnob(id) {
      if (id === 0) knobState.speed = (knobState.speed + 1) % 3;
      if (id === 1) knobState.auto = !knobState.auto;
      if (id === 2) knobState.dust = (knobState.dust + 1) % 3;
      const turn = [knobState.speed * 0.9, knobState.auto ? 0.9 : 0, knobState.dust * 0.9];
      knobs[id].rotation.y = turn[id];
      updateHud();
    }
    window.addEventListener("keydown", (e) => {
      if (e.repeat) return;
      if (e.code === "Space") {
        e.preventDefault();
        raining = !raining;
        updateHud();
      }
      if (e.code === "KeyN") {
        tDay = (Math.floor(tDay * 4) + 1) / 4 % 1;
        updateHud();
      }
    });

    // Day/night keyframes: sun elevation angle theta, colours and window/lamp glow.
    const KEYS = [
      { sun: 0xffb27a, sunI: 1.7, hemi: 0.75, bg: 0x3d4170, night: 0.35, th: 0.2 },
      { sun: 0xfff0d0, sunI: 2.6, hemi: 1.0, bg: 0x8fbde0, night: 0.0, th: 1.25 },
      { sun: 0xff8a4c, sunI: 1.5, hemi: 0.6, bg: 0x4a2f4f, night: 0.7, th: 2.25 },
      { sun: 0x8fa6ff, sunI: 0.3, hemi: 0.28, bg: 0x0b0e1e, night: 1.0, th: 3.3 },
    ];
    const cSun = new THREE.Color(), cBg = new THREE.Color(), tmpC = new THREE.Color();
    function applyEnv() {
      const f = tDay * 4, i = Math.floor(f) % 4, j = (i + 1) % 4, k = f - Math.floor(f);
      const a = KEYS[i], b = KEYS[j];
      const L = (x, y) => x + (y - x) * k;
      cSun.setHex(a.sun).lerp(tmpC.setHex(b.sun), k);
      cBg.setHex(a.bg).lerp(tmpC.setHex(b.bg), k);
      const night = L(a.night, b.night);
      const theta = L(a.th, b.th);
      sun.color.copy(cSun);
      sun.intensity = L(a.sunI, b.sunI) * (1 - 0.25 * rainAmt);
      sun.position.set(Math.cos(theta) * 50, Math.sin(theta) * 50, 25);
      hemi.intensity = L(a.hemi, b.hemi) * (1 + 0.1 * rainAmt);
      scene.background.copy(cBg);
      scene.fog.color.copy(cBg);
      windowMat.emissiveIntensity = night * 1.5;
      uniforms.uNight.value = night;
      voxMat.roughness = 0.85 - 0.45 * rainAmt;
      voxMat.metalness = 0.02 + 0.12 * rainAmt;
    }
    function updateHud() {
      const speedText = `${SPEEDS[knobState.speed]}×`;
      statusEl.textContent = `${phaseNames[Math.floor(tDay * 4) % 4]} · 运行速度 ${speedText} · 昼夜循环${knobState.auto ? "开" : "关"} · 施工尘土${DUST_NAMES[knobState.dust]} · ${raining ? "模拟暴雨" : "晴天"}`;
    }

    let T = 0, lastNow = performance.now(), hudTimer = 0;
    function animate(now) {
      const dt = Math.min((now - lastNow) / 1000, 0.05);
      lastNow = now;
      const speed = SPEEDS[knobState.speed];
      T += dt * speed;
      if (knobState.auto) tDay = (tDay + dt / 120) % 1;
      rainAmt += ((raining ? 1 : 0) - rainAmt) * Math.min(1, dt * 0.8);
      dustAmt += (DUST[knobState.dust] - dustAmt) * Math.min(1, dt * 2);
      for (const fn of dynamic) fn(T);
      applyEnv();
      uniforms.uTime.value = T;
      uniforms.uDust.value = dustAmt;
      uniforms.uRain.value = rainAmt;
      rain.visible = rainAmt > 0.01;
      if (!drag) idleTime += dt;
      if (idleTime > 3) orbit.yaw += dt * 0.05;
      camera.position.set(
        TARGET.x + orbit.dist * Math.cos(orbit.pitch) * Math.sin(orbit.yaw),
        TARGET.y + orbit.dist * Math.sin(orbit.pitch),
        TARGET.z + orbit.dist * Math.cos(orbit.pitch) * Math.cos(orbit.yaw)
      );
      camera.lookAt(TARGET);
      renderer.render(scene, camera);
      hudTimer += dt;
      if (hudTimer > 0.5) {
        hudTimer = 0;
        updateHud();
      }
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight, false);
    });
    applyEnv();
    updateHud();
    requestAnimationFrame(animate);

  </script>
</body>
</html>
