<body>

<script type="module">
import * as THREE from "three";
window.__booted = true;
clearTimeout(window.__bootTimer);

// ================= 基础 =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
const probeGl = document.createElement("canvas").getContext("webgl2");
const dbgExt = probeGl && probeGl.getExtension("WEBGL_debug_renderer_info");
const RSTR = String(dbgExt ? probeGl.getParameter(dbgExt.UNMASKED_RENDERER_WEBGL) : "");
const LOWQ = /swiftshader|software|llvmpipe/i.test(RSTR);
renderer.setPixelRatio(LOWQ ? 0.6 : Math.min(1.75, devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = !LOWQ;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a120c, 0.06);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.02, 60);

let seed = 77;
const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

// ================= 体素批次 =================
const VOX = 0.02; // 体素边长 2cm（微缩比例）
const batch = []; // {p:[x,y,z], s:[sx,sy,sz], c:color, ry}
function box(x, y, z, sx, sy, sz, c, ry = 0) { batch.push({ p: [x, y, z], s: [sx, sy, sz], c, ry }); }
function vox(x, y, z, c, n = 1) { box(x, y, z, VOX * n, VOX * n, VOX * n, c); }
const C = {
  wood: 0x4a2f1b, woodDark: 0x33200f, desk: 0x2a1a10, paper: 0xe8e0cf, steel: 0x8d99a6,
  yellow: 0xf2b32c, orange: 0xe07a1f, red: 0xc8452c, blue: 0x2e6db4, blueDark: 0x1d4ed8,
  green: 0x3f8f4f, white: 0xe6e2d8, gray: 0x9aa0a6, grayDark: 0x5b6066, concrete: 0xb9b2a4,
  soil: 0x6b4a2f, soilDark: 0x4a3220, sand: 0xd8b878, cement: 0xcfc9bd, black: 0x23201d,
  skin: 0xe0ac69, vest: 0xff8c1a, helmetY: 0xffd23f, helmetW: 0xf4f4f4, glass: 0x9fd8e8,
  container1: 0xb4442c, container2: 0x2c6ba4, container3: 0x3f8f4f, rope: 0xd9c58a,
};

// ================= 房间与桌子 =================
const room = new THREE.Group(); scene.add(room);
{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshStandardMaterial({ color: 0x241a12, roughness: 0.95 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; room.add(floor);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(14, 5), new THREE.MeshStandardMaterial({ color: 0x2e2118, roughness: 1 }));
  wall.position.set(0, 2.5, -3.2); room.add(wall);
  const wall2 = wall.clone(); wall2.rotation.y = Math.PI / 2; wall2.position.set(-3.6, 2.5, 0); room.add(wall2);
  // 桌
  const top = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.07, 1.35), new THREE.MeshStandardMaterial({ color: C.desk, roughness: 0.55, metalness: 0.08 }));
  top.position.y = 0.75; top.castShadow = top.receiveShadow = true; room.add(top);
  for (const [lx, lz] of [[-1.2, -0.58], [1.2, -0.58], [-1.2, 0.58], [1.2, 0.58]]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.72, 0.09), new THREE.MeshStandardMaterial({ color: C.woodDark, roughness: 0.8 }));
    leg.position.set(lx, 0.36, lz); leg.castShadow = true; room.add(leg);
  }
  const apron = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.16, 0.05), new THREE.MeshStandardMaterial({ color: C.woodDark, roughness: 0.7 }));
  apron.position.set(0, 0.66, 0.66); room.add(apron);
  // 桌面摆件：蓝图卷尺安全帽水平仪
  box(-1.16, 0.80, 0.5, 0.3, 0.015, 0.22, C.paper, 0.3);
  box(-1.1, 0.815, 0.46, 0.24, 0.012, 0.17, 0xbfd4e2, 0.3);
  box(1.14, 0.80, 0.52, 0.09, 0.035, 0.06, C.yellow, -0.4);
  box(1.02, 0.80, 0.42, 0.12, 0.06, 0.12, C.helmetY);
  box(1.02, 0.845, 0.42, 0.05, 0.02, 0.05, C.helmetY);
  box(0.86, 0.795, 0.6, 0.4, 0.025, 0.05, C.green, 0.12);
}

// ================= 工地沙盘（场景一） =================
const SITE_Y = 0.79; // 沙盘基板顶面
const site = new THREE.Group(); scene.add(site);
const SX = 1.05, SZ = 0.52; // 沙盘半尺寸
function siteGround() {
  box(0, SITE_Y - 0.015, 0, SX * 2, 0.03, SZ * 2, C.sand);
  // 基坑（下凹）
  box(-0.62, SITE_Y - 0.05, -0.18, 0.5, 0.06, 0.4, C.soilDark);
  // 施工道路（环线简化为两条直道 + 转角）
  box(0.05, SITE_Y + 0.002, 0.02, 1.7, 0.006, 0.16, C.grayDark);
  box(0.62, SITE_Y + 0.002, -0.16, 0.16, 0.006, 0.42, C.grayDark);
  box(-0.62, SITE_Y + 0.002, 0.16, 0.5, 0.006, 0.14, C.grayDark);
}
function fence() {
  const h = 0.07;
  for (let x = -SX; x <= SX + 0.001; x += 0.07) {
    for (const z of [-SZ, SZ]) {
      if (Math.abs(x) < 0.12 && z === SZ) continue; // 大门缺口
      box(x, SITE_Y + h / 2, z, 0.012, h, 0.012, C.blue);
      if (Math.floor(x * 100) % 14 === 0) box(x, SITE_Y + h + 0.012, z, 0.03, 0.018, 0.004, (Math.floor(x * 57) & 1) ? C.red : C.yellow);
    }
  }
  for (let z = -SZ; z <= SZ + 0.001; z += 0.07) {
    for (const x of [-SX, SX]) {
      box(x, SITE_Y + h / 2, z, 0.012, h, 0.012, C.blue);
    }
  }
  // 大门柱 + 标识牌
  for (const gx of [-0.14, 0.14]) {
    box(gx, SITE_Y + 0.06, SZ, 0.03, 0.12, 0.03, C.blue);
    box(gx, SITE_Y + 0.13, SZ, 0.05, 0.02, 0.05, C.red);
  }
  box(0, SITE_Y + 0.155, SZ, 0.26, 0.035, 0.012, C.red);
  box(-SX + 0.02, SITE_Y + 0.05, 0.1, 0.005, 0.05, 0.07, C.yellow); // 安全警示标识
  box(SX - 0.02, SITE_Y + 0.05, -0.1, 0.005, 0.05, 0.07, C.green);
}
function zones() {
  // 钢筋加工棚
  const sx = -0.68, sz = 0.3;
  for (const [px, pz] of [[-0.11, -0.07], [0.11, -0.07], [-0.11, 0.07], [0.11, 0.07]]) {
    box(sx + px, SITE_Y + 0.045, sz + pz, 0.014, 0.09, 0.014, C.steel);
  }
  box(sx, SITE_Y + 0.1, sz, 0.28, 0.014, 0.2, C.blueDark);
  for (let i = 0; i < 5; i++) box(sx - 0.08 + i * 0.04, SITE_Y + 0.012, sz - 0.02, 0.016, 0.016, 0.14, C.steel);
  box(sx + 0.06, SITE_Y + 0.02, sz + 0.06, 0.09, 0.03, 0.05, C.grayDark); // 切断机
  // 物料堆放区
  for (let i = 0; i < 4; i++) box(-0.28 + (i % 2) * 0.1, SITE_Y + 0.02 + Math.floor(i / 2) * 0.035, 0.34, 0.09, 0.03, 0.07, C.wood);
  for (let i = 0; i < 3; i++) box(-0.1 + i * 0.05, SITE_Y + 0.02, 0.4, 0.04, 0.04, 0.04, C.cement);
  // 砂石料堆（阶梯锥）
  for (let l = 0; l < 4; l++) box(0.02, SITE_Y + 0.012 + l * 0.02, 0.36, 0.12 - l * 0.026, 0.022, 0.1 - l * 0.022, C.sand);
  for (let l = 0; l < 3; l++) box(0.16, SITE_Y + 0.012 + l * 0.02, 0.38, 0.09 - l * 0.024, 0.022, 0.08 - l * 0.02, C.gray);
  // 在建高层楼房基座
  const bx = 0.28, bz = -0.24;
  box(bx, SITE_Y + 0.02, bz, 0.3, 0.04, 0.24, C.concrete);
  for (let f = 0; f < 5; f++) {
    box(bx, SITE_Y + 0.06 + f * 0.05, bz, 0.24, 0.04, 0.18, f < 3 ? C.concrete : C.grayDark);
    for (const px of [-0.11, 0.11]) for (const pz of [-0.08, 0.08])
      box(bx + px, SITE_Y + 0.06 + f * 0.05, bz + pz, 0.012, 0.05, 0.012, C.steel);
  }
  // 脚手架
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    box(bx + Math.cos(a) * 0.16, SITE_Y + 0.12, bz + Math.sin(a) * 0.13, 0.008, 0.24, 0.008, C.orange);
  }
  box(bx, SITE_Y + 0.245, bz, 0.34, 0.008, 0.28, C.orange);
  // 临时板房办公区
  for (const [ox, oz, cc] of [[0.72, 0.3, C.white], [0.72, 0.16, C.blue]]) {
    box(ox, SITE_Y + 0.045, oz, 0.22, 0.09, 0.11, cc);
    box(ox, SITE_Y + 0.095, oz, 0.23, 0.012, 0.12, C.blueDark);
    for (let w = 0; w < 3; w++) winList.push([ox - 0.07 + w * 0.07, SITE_Y + 0.05, oz + 0.056]);
  }
  // 渣土堆放区
  for (let l = 0; l < 5; l++) box(0.78, SITE_Y + 0.014 + l * 0.024, -0.3, 0.24 - l * 0.04, 0.026, 0.2 - l * 0.032, C.soil);
  // 堆叠钢筋
  for (let i = 0; i < 6; i++) box(-0.42, SITE_Y + 0.01 + (i % 2) * 0.018, -0.34 + Math.floor(i / 2) * 0.03, 0.16, 0.014, 0.014, C.steel);
  // 临时水电杆
  for (const [px, pz] of [[-0.95, -0.4], [0.95, 0.42]]) {
    box(px, SITE_Y + 0.09, pz, 0.012, 0.18, 0.012, C.gray);
    box(px, SITE_Y + 0.175, pz, 0.06, 0.008, 0.008, C.gray);
  }
  // 临时照明灯杆
  for (const [px, pz] of [[-0.9, 0.42], [0.9, -0.44], [-0.9, -0.44], [0.9, 0.44]]) {
    box(px, SITE_Y + 0.08, pz, 0.01, 0.16, 0.01, C.steel);
    lampList.push([px, SITE_Y + 0.165, pz]);
    box(px, SITE_Y + 0.16, pz, 0.03, 0.014, 0.02, C.grayDark);
  }
  // 施工指示灯（大门）
  lampList.push([-0.14, SITE_Y + 0.145, SZ]);
  lampList.push([0.14, SITE_Y + 0.145, SZ]);
}
const winList = [];
const lampList = [];

// 静态工人（烘焙姿势）
function worker(x, z, ry, vest = C.vest, helmet = C.helmetY, armUp = false) {
  const c = Math.cos(ry), s = Math.sin(ry);
  const put = (dx, dy, dz, sx2, sy2, sz2, cc, rx = 0) => {
    box(x + dx * c - dz * s, SITE_Y + dy, z + dx * s + dz * c, sx2, sy2, sz2, cc, rx);
  };
  put(0, 0.018, 0, 0.016, 0.036, 0.012, vest);
  put(0, 0.043, 0, 0.014, 0.014, 0.014, C.skin);
  put(0, 0.052, 0, 0.017, 0.008, 0.017, helmet);
  if (armUp) put(0.012, 0.04, 0, 0.008, 0.03, 0.008, vest, 0.9);
  else { put(0.012, 0.026, 0, 0.007, 0.026, 0.007, vest); put(-0.012, 0.026, 0, 0.007, 0.026, 0.007, vest); }
}

// ================= 场景二：港口码头 =================
const harbor = new THREE.Group(); scene.add(harbor);
function buildHarbor() {
  const H = 0.84;
  const hb = (x, y, z, sx, sy, sz, c, ry = 0) => batch.push({ p: [x, y, z], s: [sx, sy, sz], c, ry, group: 2 });
  // 码头平台（桌面前半）
  hb(0, H - 0.02, -0.32, 2.0, 0.05, 0.46, C.concrete);
  for (let i = 0; i < 8; i++) hb(-0.9 + i * 0.26, H - 0.06, -0.1, 0.05, 0.09, 0.05, C.woodDark);
  // 集装箱堆
  const cols = [C.container1, C.container2, C.container3, C.orange];
  for (let i = 0; i < 10; i++) {
    const st = 1 + Math.floor(rnd() * 3);
    for (let k = 0; k < st; k++)
      hb(-0.7 + (i % 5) * 0.24, H + 0.035 + k * 0.062, -0.44 + Math.floor(i / 5) * 0.14, 0.2, 0.06, 0.09, cols[(i + k) % 4]);
  }
  // 灯塔（码头端头）
  for (let l = 0; l < 6; l++) hb(0.88, H + 0.03 + l * 0.05, -0.42, 0.09 - l * 0.008, 0.05, 0.09 - l * 0.008, l % 2 ? C.white : C.red);
  hb(0.88, H + 0.34, -0.42, 0.05, 0.04, 0.05, C.grayDark);
  // 仓库
  hb(-0.82, H + 0.06, -0.44, 0.34, 0.12, 0.16, C.gray);
  hb(-0.82, H + 0.13, -0.44, 0.36, 0.03, 0.18, C.blueDark);
  // 护舷与系船柱
  for (let i = 0; i < 6; i++) hb(-0.8 + i * 0.32, H + 0.015, -0.11, 0.03, 0.03, 0.03, C.black);
  // 玻璃水槽（限于桌面内）：水域 z -0.08..0.64
  hb(0, 0.815, -0.08, 2.08, 0.05, 0.02, C.glass);
  hb(0, 0.815, 0.64, 2.08, 0.05, 0.02, C.glass);
  hb(-1.03, 0.815, 0.28, 0.02, 0.05, 0.74, C.glass);
  hb(1.03, 0.815, 0.28, 0.02, 0.05, 0.74, C.glass);
  hb(0, 0.782, 0.28, 2.08, 0.016, 0.74, C.woodDark);
}

// ================= 提交批次 =================
siteGround(); fence(); zones();
// 静态工人布点
worker(-0.66, 0.26, 0.4); worker(-0.6, 0.34, -0.6, C.vest, C.helmetW); worker(-0.3, 0.3, 1.2, C.vest, C.helmetY, true);
worker(0.24, -0.1, 0.2); worker(0.32, -0.34, -1.2, C.vest, C.helmetW); worker(0.2, -0.3, 2.2, C.vest, C.helmetY, true);
worker(0.66, 0.24, 3.0, C.blue, C.helmetW); worker(0.78, 0.1, 2.6, C.blue, C.helmetW);
worker(-0.44, -0.3, 1.5); worker(0.02, 0.32, 0.1, C.vest, C.helmetY, true); worker(-0.86, -0.2, -0.4);
worker(0.55, -0.35, 2.0); worker(-0.15, -0.4, 0.9); worker(0.45, 0.35, -2.4, C.vest, C.helmetW);
buildHarbor();

const groupSite = batch.filter((b) => b.group !== 2);
const groupHarbor = batch.filter((b) => b.group === 2);
function makeInstanced(list) {
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mat = new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0.05 });
  const mesh = new THREE.InstancedMesh(geo, mat, list.length);
  const m = new THREE.Matrix4(), qq = new THREE.Quaternion(), vv = new THREE.Vector3(), ss = new THREE.Vector3(), cc = new THREE.Color();
  list.forEach((b, i) => {
    qq.setFromAxisAngle(new THREE.Vector3(0, 1, 0), b.ry || 0);
    m.compose(vv.set(...b.p), qq, ss.set(...b.s));
    mesh.setMatrixAt(i, m);
    mesh.setColorAt(i, cc.setHex(b.c));
  });
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.frustumCulled = false;
  return mesh;
}
const meshSite = makeInstanced(groupSite);
const meshHarbor = makeInstanced(groupHarbor);
site.add(meshSite);
harbor.add(meshHarbor);
harbor.visible = false;

// 夜窗（发光实例）
const winMesh = (() => {
  const geo = new THREE.PlaneGeometry(0.035, 0.03);
  const mat = new THREE.MeshStandardMaterial({ color: 0x101010, emissive: 0xffc46b, emissiveIntensity: 0, side: THREE.DoubleSide });
  const m = new THREE.InstancedMesh(geo, mat, winList.length);
  const mm = new THREE.Matrix4();
  winList.forEach(([x, y, z], i) => { mm.compose(new THREE.Vector3(x, y, z), new THREE.Quaternion(), new THREE.Vector3(1, 1, 1)); m.setMatrixAt(i, mm); });
  m.frustumCulled = false;
  site.add(m);
  return m;
})();

// ================= 灯光与昼夜 =================
const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x3a2a1a, 0.7); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe3b3, 2.2);
sun.castShadow = !LOWQ;
sun.shadow.mapSize.set(1024, 1024);
const sc = sun.shadow.camera; sc.left = -2; sc.right = 2; sc.top = 2; sc.bottom = -2; sc.far = 12;
scene.add(sun);
const deskLamp = new THREE.PointLight(0xffb469, 6, 5, 1.8);
deskLamp.position.set(0.9, 1.5, 0.9); scene.add(deskLamp);
const SKY_KEYS = [
  { t: 0.0, sky: 0x2b2140, fog: 0x241a30, sunI: 0.5, sunC: 0xff9a5c, hemi: 0.35, name: "黎明" },
  { t: 0.3, sky: 0x87b5e0, fog: 0x9db4c8, sunI: 2.6, sunC: 0xfff0d0, hemi: 0.85, name: "正午" },
  { t: 0.55, sky: 0xd96a3b, fog: 0x8a4a33, sunI: 1.6, sunC: 0xff9a4d, hemi: 0.5, name: "黄昏" },
  { t: 0.75, sky: 0x0a0e22, fog: 0x0a0d1c, sunI: 0.12, sunC: 0x9db4ff, hemi: 0.18, name: "夜晚" },
  { t: 1.0, sky: 0x2b2140, fog: 0x241a30, sunI: 0.5, sunC: 0xff9a5c, hemi: 0.35, name: "黎明" },
];

function applySky(t) {
  let a = SKY_KEYS[0], b = SKY_KEYS[1];
  for (let i = 0; i < SKY_KEYS.length - 1; i++) if (t >= SKY_KEYS[i].t && t <= SKY_KEYS[i + 1].t) { a = SKY_KEYS[i]; b = SKY_KEYS[i + 1]; break; }
  const k = (t - a.t) / Math.max(1e-6, b.t - a.t);
  const ca = new THREE.Color(a.sky).lerp(new THREE.Color(b.sky), k);
  scene.background = ca;
  scene.fog.color.copy(new THREE.Color(a.fog).lerp(new THREE.Color(b.fog), k));
  sun.intensity = a.sunI + (b.sunI - a.sunI) * k;
  sun.color.copy(new THREE.Color(a.sunC).lerp(new THREE.Color(b.sunC), k));
  hemi.intensity = a.hemi + (b.hemi - a.hemi) * k;
  const ang = t * Math.PI * 2 - Math.PI / 2;
  sun.position.set(Math.cos(ang) * 3, Math.sin(ang) * 3 + 0.6, 1.6);
  const nightK = THREE.MathUtils.clamp((t - 0.62) / 0.14, 0, 1) * (t < 0.9 ? 1 : (1 - t) / 0.1);
  winMesh.material.emissiveIntensity = nightK * 3.2;
  glowMat.uniforms.uAlpha.value = 0.25 + nightK * 0.75;
  return nightK;
}

}

const orbit = { theta: 0.6, phi: 1.25, dist: 2.2, target: new THREE.Vector3(0, 0.95, 0) };
let lastInteract = performance.now();
let dragging = false, lx = 0, ly = 0;
const el = renderer.domElement;
el.addEventListener("pointerdown", (e) => {
  dragging = true; lx = e.clientX; ly = e.clientY; lastInteract = performance.now();
  el.setPointerCapture(e.pointerId);
  downX = e.clientX; downY = e.clientY;
});
let downX = 0, downY = 0;
el.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  orbit.theta -= dx * 0.006;
  orbit.phi = THREE.MathUtils.clamp(orbit.phi - dy * 0.005, 0.35, 1.52);
  lastInteract = performance.now();
});
el.addEventListener("pointerup", (e) => {
  dragging = false;
  if (Math.hypot(e.clientX - downX, e.clientY - downY) < 5) tryKnob(e);
});
el.addEventListener("wheel", (e) => {
  e.preventDefault();
  orbit.dist = THREE.MathUtils.clamp(orbit.dist + e.deltaY * 0.0016, 0.9, 4.5);
  lastInteract = performance.now();
}, { passive: false });
let pinchD = 0;
el.addEventListener("touchstart", (e) => { if (e.touches.length === 2) pinchD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }, { passive: true });
el.addEventListener("touchmove", (e) => {
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    orbit.dist = THREE.MathUtils.clamp(orbit.dist - (d - pinchD) * 0.004, 0.9, 4.5);
    pinchD = d; lastInteract = performance.now();
  }
}, { passive: true });
const ray = new THREE.Raycaster();
function tryKnob(e) {
  ray.setFromCamera(new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  const hit = ray.intersectObjects(knobs, false)[0];
  if (!hit) return;
  const i = knobs.indexOf(hit.object);
  if (i === 0) knobStates[0] = (knobStates[0] + 1) % 3;
  else if (i === 1) knobStates[1] = knobStates[1] ? 0 : 1;
  else knobStates[2] = (knobStates[2] + 1) % 3;
  knobAngles(); applyKnobs();
}

function roadPos(t) {
  const n = ROAD.length;
  const i = Math.floor(t) % n, j = (i + 1) % n;
  const f = t - Math.floor(t);
  const x = ROAD[i][0] + (ROAD[j][0] - ROAD[i][0]) * f;
  const z = ROAD[i][1] + (ROAD[j][1] - ROAD[i][1]) * f;
  const ang = Math.atan2(ROAD[j][0] - ROAD[i][0], ROAD[j][1] - ROAD[i][1]);
  return { x, z, ang };
}
function tick() {
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  if (cycleOn) dayT = (dayT + dt * 0.012 * speedMul) % 1;
  const nightK = applySky(dayT);
  dustMat.uniforms.uTime.value = t;
  rainMat.uniforms.uTime.value = t;

  const sp = speedMul;
  // 挖掘机挖土循环
  for (const ex of excavs) {
    const p = t * 1.1 * sp + ex.phase;
    ex.boomP.rotation.z = 0.5 + Math.sin(p) * 0.28;
    ex.armP.rotation.z = -0.9 - Math.sin(p + 0.9) * 0.5;
    ex.g.rotation.y += Math.sin(p * 0.23) * 0.0006 * sp;
  }
  // 渣土车环线
  for (const tr of trucks) {
    if (tr.wait > 0) {
      tr.wait -= dt * sp;
      if (tr.wait <= 0) tr.load.visible = !tr.load.visible ? true : tr.load.visible;
    } else {
      tr.t += dt * 0.55 * sp;
    }
    const pos = roadPos(tr.t);
    tr.g.position.set(pos.x, SITE_Y, pos.z);
    tr.g.rotation.y = pos.ang;
    const seg = Math.floor(tr.t) % ROAD.length;
    tr.load.visible = seg >= 11 || seg <= 5; // 挖掘机接土后到渣土堆之间满载
    tr.bed.rotation.z = seg === 5 ? Math.sin(t * 6) * 0.12 + 0.3 : 0; // 卸料抬斗
  }
  // 塔吊回转 + 小车 + 吊钩
  for (const cr of cranes) {
    const p = t * 0.25 * sp + cr.phase;
    cr.slew.rotation.y = Math.sin(p) * 1.2;
    const tx = 0.1 + (Math.sin(p * 1.7) * 0.5 + 0.5) * 0.18;
    cr.trolley.position.x = tx;
    const drop = 0.06 + (Math.sin(p * 0.9) * 0.5 + 0.5) * (cr.h - 0.14);
    cr.cable.scale.y = drop / 0.1;
    cr.cable.position.y = -drop / 2;
    cr.hookLoad.position.y = -drop - 0.01;
  }
  // 搅拌车慢速环线（反向）
  {
    const tt = -t * 0.3 * sp;
    const pos = roadPos((tt % ROAD.length + ROAD.length) % ROAD.length);
    mixerG.position.set(pos.x * 0.92, SITE_Y, pos.z * 0.92 + 0.05);
    mixerG.rotation.y = pos.ang + Math.PI;
  }
  // 装载机往返
  {
    const p = (Math.sin(t * 0.5 * sp) * 0.5 + 0.5);
    loaderG.position.set(-0.34 + p * 0.3, SITE_Y, 0.24);
    loaderG.rotation.y = p > 0.5 ? -Math.PI / 2 : Math.PI / 2;
    loaderG.children[1].position.y = 0.02 + (p > 0.8 ? 0.02 : 0);
  }
  // 行走人物
  for (const w of walkers) {
    w.t = (w.t + dt * w.speed * sp) % 2;
    const k = w.t < 1 ? w.t : 2 - w.t;
    const a = w.path[0], b2 = w.path[1];
    w.g.position.set(a[0] + (b2[0] - a[0]) * k, SITE_Y, a[1] + (b2[1] - a[1]) * k);
    w.g.rotation.y = Math.atan2(b2[0] - a[0], b2[1] - a[1]) * (w.t < 1 ? 1 : -1);
    w.g.position.y = SITE_Y + Math.abs(Math.sin(t * 8 * sp)) * 0.004;
  }
  // 港口动态
  if (harbor.visible) {
    const gp = Math.sin(t * 0.4 * sp) * 0.5 + 0.5;
    gantryTrolley.position.set(-0.38 + gp * 0.42, 0.84 + 0.31, -0.3 + Math.sin(t * 0.23) * 0.12);
    const lift = 0.06 + (Math.sin(t * 0.7 * sp) * 0.5 + 0.5) * 0.2;
    gantryBox.position.set(gantryTrolley.position.x, 0.84 + 0.31 - lift, gantryTrolley.position.z);
    gantryBox.rotation.y = Math.sin(t * 0.2) * 0.2;
    tug.position.set(Math.sin(t * 0.3 * sp) * 0.6, 0.805 + Math.sin(t * 2.2) * 0.006, 0.3 + Math.sin(t * 0.5) * 0.12);
    tug.rotation.y = Math.cos(t * 0.3 * sp) * 0.4 + Math.PI / 2;
    tug.rotation.z = Math.sin(t * 2.2) * 0.05;
    const sp2 = seaPlane.geometry.attributes.position;
    for (let i = 0; i < sp2.count; i++) {
      const x = sp2.getX(i), y = sp2.getY(i);
      sp2.setZ(i, Math.sin(x * 6 + t * 1.6) * 0.008 + Math.cos(y * 5 + t * 1.2) * 0.006);
    }
    sp2.needsUpdate = true;
    seaPlane.geometry.computeVertexNormals();
  }
  // 相机
  if (performance.now() - lastInteract > 6000) orbit.theta += dt * 0.06;
  const sp3 = Math.sin(orbit.phi), cp3 = Math.cos(orbit.phi);
  camera.position.set(
    orbit.target.x + orbit.dist * sp3 * Math.sin(orbit.theta),
    orbit.target.y + orbit.dist * cp3,
    orbit.target.z + orbit.dist * sp3 * Math.cos(orbit.theta),
  );
  camera.lookAt(orbit.target);

  renderer.render(scene, camera);
  frames++; total++; window.__frames = total;
  const now = performance.now();
  if (now - fpsT >= 500) {
    fps = Math.round((frames * 1000) / (now - fpsT));
    frames = 0; fpsT = now;
    const skyName = SKY_KEYS.reduce((acc, k, i) => (dayT >= k.t ? k.name : acc), "黎明");
    document.getElementById("stats").innerHTML =
      `${fps} FPS · 体素实例 ${batch.length} · ${skyName}${rain.visible ? " · 暴雨" : ""} · 场景${sceneIdx}`;
  }
  requestAnimationFrame(tick);
}
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
applyKnobs();
syncButtons();
applySky(dayT);
// 调试钩子（供自动化验证旋钮射线拾取与状态）
window.__projectKnob = (i) => {
  const v = knobs[i].getWorldPosition(new THREE.Vector3()).project(camera);
  return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight };
};
window.__state = () => ({ speedMul, dust: dust.visible, rain: rain.visible, cycle: cycleOn, scene: sceneIdx, dayT });
document.getElementById("boot").classList.add("hidden");
tick();
</script>
</body>
