<body>
<canvas id="cv"></canvas>

<div>拖拽环视 · 滚轮缩放 · 闲置自动环绕</div>
<div>点击桌前旋钮：<b>速度</b>（<span id="vSpeed">1×</span>）· <b>昼夜循环</b>（<span id="vCycle">开</span>）· <b>尘土</b>（<span id="vDust">中</span>）</div>
<div>空格：暴雨 <b id="vRain">关</b> · 数字键 1-4：黎明/正午/黄昏/夜晚 · 当前：<b id="vPhase">黄昏</b></div>

<script type="module">
const errEl=document.getElementById("err");
let THREE,OrbitControls;
try{THREE=await import("three");({OrbitControls}=await import("three/addons/controls/OrbitControls.js"));}
catch(e){errEl.style.display="flex";errEl.innerHTML="Three.js r160 加载失败（需要联网访问 unpkg.com CDN）。<br>请联网后刷新页面。";throw e;}
const $=id=>document.getElementById(id);
const cv=$("cv");let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:"high-performance"});}
catch(e){errEl.style.display="flex";errEl.textContent="当前环境不支持 WebGL，无法显示沙盘。";throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,1,900);camera.position.set(0,20,68);
const controls=new OrbitControls(camera,cv);controls.target.set(0,5,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=22;controls.maxDistance=120;controls.minPolarAngle=0.5;controls.maxPolarAngle=1.5;controls.autoRotateSpeed=0.5;controls.enablePan=false;
let idle=0;controls.addEventListener("start",()=>{idle=0;controls.autoRotate=false;});controls.addEventListener("end",()=>{idle=0;});

/* ---------- helpers ---------- */
function rng(a){return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
const R=rng(7);const rr=(a,b)=>a+(b-a)*R();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,sstep=t=>t*t*(3-2*t);
function grainTex(seed,base=235,spread=20,size=16){
  const r=rng(seed),c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d");
  for(let i=0;i<size;i++)for(let j=0;j<size;j++){const v=base-r()*spread|0;x.fillStyle=`rgb(${v},${v},${v})`;x.fillRect(i,j,1,1);}
  x.fillStyle="rgba(0,0,0,.25)";x.fillRect(0,size-1,size,1);x.fillRect(size-1,0,1,size);
  const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestMipmapLinearFilter;t.colorSpace=THREE.SRGBColorSpace;return t;
}
const GRAIN=grainTex(1);
const BOX=new THREE.BoxGeometry(1,1,1);
const matCache=new Map();
function vmat(color,opts={}){const k=color+JSON.stringify(opts);if(!matCache.has(k)){matCache.set(k,new THREE.MeshStandardMaterial({color,map:GRAIN,roughness:0.85,metalness:0,...opts}));}return matCache.get(k);}
function part(parent,color,w,h,d,x,y,z,opts){const m=new THREE.Mesh(BOX,vmat(color,opts));m.scale.set(w,h,d);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;parent.add(m);return m;}
// static batch: one InstancedMesh for every static voxel
const statics=[];
function sbox(color,w,h,d,x,y,z,ry=0){statics.push({color,w,h,d,x,y,z,ry});}

/* ---------- scene constants ---------- */
const G=5.2,ROAD=5.4,HX=20,LOOP_R=4.5;
const wetMats=[];
/* ---------- desk, room, board ---------- */
function woodTex(){const c=document.createElement("canvas");c.width=512;c.height=256;const x=c.getContext("2d");x.fillStyle="#3a2314";x.fillRect(0,0,512,256);
  const r=rng(3);for(let i=0;i<260;i++){const y=r()*256,h=r()*3+0.5;x.fillStyle=`rgba(${20+r()*30|0},${10+r()*18|0},5,${0.2+r()*0.35})`;x.fillRect(0,y,512,h);}
  for(let i=0;i<9;i++){x.strokeStyle="rgba(10,5,2,.35)";x.beginPath();const y0=r()*256;x.moveTo(0,y0);for(let k=0;k<=512;k+=32)x.lineTo(k,y0+Math.sin(k*0.03+i)*4);x.stroke();}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;}
const deskMat=new THREE.MeshStandardMaterial({map:woodTex(),roughness:0.55,metalness:0.05});
const desk=new THREE.Mesh(new THREE.BoxGeometry(110,4,80),deskMat);desk.position.y=-2;desk.receiveShadow=true;scene.add(desk);
const deskEdge=new THREE.Mesh(new THREE.BoxGeometry(111,1.4,81),new THREE.MeshStandardMaterial({color:0x2a180c,roughness:0.5}));deskEdge.position.y=-3.4;scene.add(deskEdge);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshStandardMaterial({color:0x1b130d,roughness:0.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-60;floor.receiveShadow=true;scene.add(floor);
const winMat=new THREE.MeshBasicMaterial({color:0xffb070,fog:false});
const wall=new THREE.Mesh(new THREE.PlaneGeometry(500,260),new THREE.MeshStandardMaterial({color:0x2a2018,roughness:1}));wall.position.set(0,60,-170);scene.add(wall);
const win=new THREE.Mesh(new THREE.PlaneGeometry(130,80),winMat);win.position.set(-40,70,-169.5);scene.add(win);
for(const [x,y,w,h] of [[-40,70,3,82],[-40,70,132,3],[-72.5,70,3,82],[-7.5,70,3,82]]){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:0x120c08}));m.position.set(x,y,-169.3);scene.add(m);}
// board tray
sbox(0x5a3a1c,56,1.2,56,0,0.6,0);
for(const s of [-1,1]){sbox(0x7b5128,58,2.4,1.6,0,1.2,s*28.6);sbox(0x7b5128,1.6,2.4,58,s*28.6,1.2,0);}

/* ---------- ground columns (dynamic voxel terrain) ---------- */
const N=52,H0=4,off=-N/2+0.5;
const ground=new THREE.InstancedMesh(BOX,new THREE.MeshStandardMaterial({color:0xffffff,map:GRAIN,roughness:0.95}),N*N);
ground.castShadow=ground.receiveShadow=true;wetMats.push(ground.material);
const gh=new Float32Array(N*N).fill(H0),gtarget=new Float32Array(N*N).fill(H0);
const dum=new THREE.Object3D();const gcol=new THREE.Color();
const PIT={x0:-13,x1:-1,z0:-16,z1:-5},PILE={cx:15.5,cz:-14,r:6};
function cellIdx(x,z){return (Math.floor(z-off+0.5))*N+Math.floor(x-off+0.5);}
for(let j=0;j<N;j++)for(let i=0;i<N;i++){const k=j*N+i;const x=i+off,z=j+off;
  const inPit=x>=PIT.x0&&x<=PIT.x1&&z>=PIT.z0&&z<=PIT.z1;
  gcol.setHSL(0.075+R()*0.02,0.38,(inPit?0.28:0.34)+R()*0.07);ground.setColorAt(k,gcol);}
function setCol(k){const i=k%N,j=(k/N)|0;const h=Math.max(0.5,Math.round(gh[k]));dum.position.set(i+off,1.2+h/2,j+off);dum.scale.set(1,h,1);dum.updateMatrix();ground.setMatrixAt(k,dum.matrix);}
for(let k=0;k<N*N;k++)setCol(k);scene.add(ground);
function pitDepthTarget(c){return 1.6+2.2*c;} // c in [0,1]: 1 = freshly graded
function updateTerrain(prog){
  // prog: 0..1 progress; pit gets deeper while the spoil pile grows
  let changed=false;
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const k=j*N+i,x=i+off,z=j+off;let t=H0;
    if(x>=PIT.x0&&x<=PIT.x1&&z>=PIT.z0&&z<=PIT.z1){const edge=Math.min(x-PIT.x0,PIT.x1-x,z-PIT.z0,PIT.z1-z);
      t=lerp(H0,pitDepthTarget(1-prog),clamp(edge/2.5,0,1));}
    const dx=x-PILE.cx,dz=z-PILE.cz,d=Math.hypot(dx*0.9,dz);
    if(d<PILE.r)t=H0+(PILE.r-d)/PILE.r*(1.5+prog*5.5)+0.001;
    const q=Math.round(t);if(Math.round(gh[k])!==q){gh[k]=t;setCol(k);changed=true;}else gh[k]=t;}
  if(changed)ground.instanceMatrix.needsUpdate=true;
}

/* ---------- road ---------- */
const ROADL=[];
(function(){const hx=HX,r=LOOP_R,seg=6,pts=[];
  const arc=(cx,cz,a0,a1)=>{for(let i=0;i<=seg;i++){const a=lerp(a0,a1,i/seg);pts.push([cx+r*Math.cos(a),cz+r*Math.sin(a)]);}};
  pts.push([0,hx]);arc(-hx+r,hx-r,Math.PI/2,Math.PI);arc(-hx+r,-hx+r,Math.PI,1.5*Math.PI);arc(hx-r,-hx+r,1.5*Math.PI,2*Math.PI);arc(hx-r,hx-r,0,Math.PI/2);
  for(let i=0;i<pts.length;i++)ROADL.push(pts[i]);
  ROADL.push(pts[0]);
})();
const SEGLEN=[0];for(let i=1;i<ROADL.length;i++)SEGLEN.push(SEGLEN[i-1]+Math.hypot(ROADL[i][0]-ROADL[i-1][0],ROADL[i][1]-ROADL[i-1][1]));
const LOOPL=SEGLEN[SEGLEN.length-1];
function roadAt(s){s=((s%LOOPL)+LOOPL)%LOOPL;let i=1;while(i<SEGLEN.length-1&&SEGLEN[i]<s)i++;const a=ROADL[i-1],b=ROADL[i],t=(s-SEGLEN[i-1])/Math.max(1e-6,SEGLEN[i]-SEGLEN[i-1]);
  const dx=b[0]-a[0],dz=b[1]-a[1];return {x:lerp(a[0],b[0],t),z:lerp(a[1],b[1],t),yaw:Math.atan2(dx,dz)};}
function sOf(x,z){let best=0,bd=1e9;for(let s=0;s<LOOPL;s+=0.1){const p=roadAt(s),d=Math.hypot(p.x-x,p.z-z);if(d<bd){bd=d;best=s;}}return best;}
// road slabs follow the polyline (flat voxel strips)
for(let i=1;i<ROADL.length;i++){const a=ROADL[i-1],b=ROADL[i],len=Math.hypot(b[0]-a[0],b[1]-a[1]);
  sbox(0x3a3a3f,3.4,0.2,len+0.15,(a[0]+b[0])/2,ROAD-0.1,(a[1]+b[1])/2,Math.atan2(b[0]-a[0],b[1]-a[1]));
  if(i%2===0)sbox(0xe9d56a,0.18,0.06,Math.min(len,1.2),(a[0]+b[0])/2,ROAD+0.04,(a[1]+b[1])/2,Math.atan2(b[0]-a[0],b[1]-a[1]));}

/* ---------- static site: fence, gate, flags, shed, yard, building, office, poles ---------- */
const FENCE=23.4;
for(let i=-23;i<=23;i++){for(const s of [-1,1]){
  if(!(s===1&&Math.abs(i)<=3)){sbox(0x4a8fd0,1,2.2,0.25,i,G+1.1,s*FENCE);sbox(0xe8e8e8,1,0.25,0.3,i,G+2.3,s*FENCE);}
  sbox(0x4a8fd0,0.25,2.2,1,s*FENCE,G+1.1,i);sbox(0xe8e8e8,0.3,0.25,1,s*FENCE,G+2.3,i);}}
for(const s of [-1,1]){sbox(0x555a60,0.6,3.4,0.6,s*3.3,G+1.7,FENCE);sbox(0xf2b01e,0.8,0.5,0.8,s*3.3,G+3.5,FENCE);}
sbox(0xf2b01e,0.2,2.2,1.6,-2.6,G+1.1,FENCE+1.2,0.6);sbox(0xf2b01e,0.2,2.2,1.6,2.6,G+1.1,FENCE+1.2,-0.6); // open gate leaves
// bunting
const flagColors=[0xe53935,0xfdd835,0x43a047,0x1e88e5,0xff7043];
for(let i=-22;i<=22;i+=1.5){for(const [x,z,ry] of [[i,-FENCE,0],[i,FENCE,0],[-FENCE,i,Math.PI/2],[FENCE,i,Math.PI/2]]){
  if(z===FENCE&&Math.abs(i)<4)continue;const c=flagColors[Math.floor(R()*5)];
  const wob=Math.sin(i*1.7)*0.1;sbox(c,0.9,0.7,0.06,ry?x:x+wob,G+2.0+wob,ry?z:z,ry);}}
// rebar shed
for(const [x,z] of [[-17,2],[-10,2],[-17,8],[-10,8]])sbox(0x6b6f76,0.5,3.4,0.5,x,G+1.7,z);
sbox(0x2b78b8,8.4,0.4,7.4,-13.5,G+3.6,5);sbox(0x1f5f94,8.6,0.3,0.4,-13.5,G+3.85,1.8);
for(let i=0;i<7;i++){sbox(0x8a4b2a,6,0.4,0.4,-13.5,G+0.3+i%3*0.42,3.6+Math.floor(i/3)*0.5+0.3);}
sbox(0xd0462a,2.4,1.4,1.6,-15.2,G+0.8,6.4);sbox(0x444,1.2,0.4,1.2,-15.2,G+1.7,6.4); // bender
// material yard
for(let l=0;l<4;l++)for(let a=0;a<4-l;a++)for(let b=0;b<2;b++){sbox(0xc9c3b4,1.2,0.5,0.8,-8.5+a*1.3+l*0.65,G+0.25+l*0.5,5.5+b*0.9);} // cement bags
for(let l=0;l<5;l++){const r=5-l;for(let a=0;a<r;a++)for(let b=0;b<r;b++)sbox(l%2?0xd9b45a:0xc8a44c,1,0.8,1,-3.4+a-(r-1)/2,G+0.4+l*0.8,10+b-(r-1)/2);} // sand
for(let l=0;l<4;l++){const r=4-l;for(let a=0;a<r;a++)for(let b=0;b<r;b++)sbox(0x7a7d82,1,0.8,1,-7+a-(r-1)/2,G+0.4+l*0.8,12.2+b-(r-1)/2);} // gravel
for(let i=0;i<9;i++)sbox(0x8a4b2a,6.5,0.4,0.4,-5.2,G+0.25+Math.floor(i/3)*0.42,7.8+(i%3)*0.5-0.2);
for(let a=0;a<3;a++)for(let l=0;l<3;l++)sbox(0xb24a3a,1.4,0.5,1.0,-1.4,G+0.55+l*0.5,6.5+a*1.2);
// building under construction
const BX=8,BZ=0;
for(let ix=0;ix<3;ix++)for(let iz=0;iz<3;iz++){const x=BX-5+ix*5,z=BZ-5+iz*5;sbox(0xb9b5ad,1,14.4,1,x,G+7.2,z);sbox(0x8a4b2a,0.2,2.6,0.2,x-0.25,G+15.6,z-0.25);sbox(0x8a4b2a,0.2,2.6,0.2,x+0.25,G+15.2,z+0.25);}
for(const y of [0.3,4.5,8.7])sbox(0xa9a59d,11.6,0.6,11.6,BX,G+y+0.3,BZ);
sbox(0xc7c3bb,3,12,3,BX,G+6,BZ);sbox(0xc7c3bb,3,0.6,3,BX,G+12.3,BZ);
sbox(0xb9b5ad,11.6,0.6,5.8,BX,G+12.9,BZ+2.9);
// scaffolding on south & west face
for(const [fx,fz,len,axis] of [[BX,BZ+6.4,12.8,"x"],[BX-6.4,BZ,12.8,"z"]]){
  for(let a=0;a<=len;a+=2.1){const px=axis==="x"?fx-len/2+a:fx,pz=axis==="z"?fz-len/2+a:fz;sbox(0xe2a52b,0.2,12.6,0.2,px,G+6.3,pz);sbox(0xe2a52b,0.2,12.6,0.2,axis==="x"?px:px-0.9,G+6.3,axis==="z"?pz:pz+0.9);}
  for(let y=2;y<=12;y+=3.2){sbox(0xe2a52b,axis==="x"?len:0.2,0.2,axis==="z"?len:0.2,fx,G+y,fz);sbox(0xa4733a,axis==="x"?len:1,0.15,axis==="z"?len:1,axis==="x"?fx:fx-0.45,G+y+0.1,axis==="z"?fz:fz+0.45);}
  for(let y=2;y<=11;y+=3.2)sbox(0x5ec45a,axis==="x"?len:0.05,3,axis==="z"?len:0.05,axis==="x"?fx:fx-0.95,G+y+1.5,axis==="z"?fz:fz+0.95);}
// temp office (container cabins)
const WINDOWS=[];
sbox(0x3d7ea6,6,2.8,7.2,17.2,G+1.4,11);sbox(0x4b91bd,6,2.8,7.2,17.2,G+4.2,11);sbox(0x2b5f80,6.3,0.3,7.5,17.2,G+5.75,11);
sbox(0x2b5f80,0.3,3,1.2,13.9,G+1.5,8.2);for(let i=0;i<4;i++)sbox(0x777,0.2,0.2,1.6,13.3,G+0.2+i*0.3,13.5);// stairs-ish
const officeWinMat=new THREE.MeshStandardMaterial({color:0x332211,emissive:0xffb050,emissiveIntensity:0.1,roughness:0.4});
const officeWins=[];
for(const [y,zs] of [[1.5,[8.8,11,13.2]],[4.3,[8.8,11,13.2]]])for(const z of zs){const m=new THREE.Mesh(BOX,officeWinMat);m.scale.set(0.12,1,1.3);m.position.set(14.15,G+y,z);scene.add(m);officeWins.push(m);}
// utility poles
const poleTops=[];
for(const [x,z] of [[-21,16],[0,22.2],[21,16],[21,-2],[-21,2]]){sbox(0x6b4a2b,0.5,9,0.5,x,G+4.5,z);sbox(0x6b4a2b,3,0.35,0.35,x,G+8.5,z);poleTops.push([x,G+8.5,z]);}
{const g=new THREE.BufferGeometry(),v=[];for(let i=0;i<poleTops.length-1;i++){const a=poleTops[i],b=poleTops[i+1];for(let k=0;k<16;k++){const t0=k/16,t1=(k+1)/16,sag=t=>-Math.sin(t*Math.PI)*0.9;
  v.push(lerp(a[0],b[0],t0),lerp(a[1],b[1],t0)+sag(t0),lerp(a[2],b[2],t0),lerp(a[0],b[0],t1),lerp(a[1],b[1],t1)+sag(t1),lerp(a[2],b[2],t1));}}
  g.setAttribute("position",new THREE.Float32BufferAttribute(v,3));scene.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x111111})));}
// signs
for(const [x,z,ry] of [[-6,FENCE-0.3,0],[8,FENCE-0.3,0],[-FENCE+0.3,-4,Math.PI/2],[FENCE-0.3,6,Math.PI/2]]){sbox(0xf6c21a,1.4,1.4,0.1,x,G+1.4,z,ry+Math.PI/4);sbox(0x222,0.3,0.7,0.12,x,G+1.45,z,ry+Math.PI/4);}
// formwork/pick platforms for cranes
sbox(0x8d7a5a,1.8,0.3,1.8,17.5,G+0.15,-6.5);sbox(0xc9c9c9,1.4,0.8,1.4,17.5,G+0.7,-6.5);
sbox(0x8d7a5a,1.8,0.3,1.8,6,G+0.15,-14.5);for(let i=0;i<4;i++)sbox(0xb98a52,1.4,0.3,1.4,6,G+0.45+i*0.3,-14.5);

/* ---------- desk props ---------- */

  dustMat.uniforms.uT.value=t;dustMat.uniforms.uAmt.value=state.dust*(1-0.7*rn);dustMat.uniforms.uA.value=lerp(1,0.5,night);dustMat.uniforms.uCol.value.setHex(night>0.6?0x8a8fb0:0xc9a878);
  // knobs
  for(const k of knobs){k.rot=lerp(k.rot,k.target,Math.min(1,raw*10));k.body.rotation.y=k.rot;}
  // simulation
  for(const e of exc)exPose(e,dt);
  vehiclesUpdate(dt);loaderUpdate(dt);for(const c of cranes)craneUpdate(c,dt);
  updateWorkers(dt,t);
  terrainT+=raw;if(terrainT>0.25){terrainT=0;prog=(prog+0.25*state.speed/120)%1;updateTerrain(prog<0.5?prog*2:2-prog*2);}
  renderer.render(scene,camera);
  fpsA+=raw;fpsN++;if(fpsA>0.6){$("vFps").textContent=Math.round(fpsN/fpsA)+" FPS · 工人 "+nW+" · 机械 "+(exc.length+vehicles.length+cranes.length+1)+" 台";fpsA=0;fpsN=0;}
}
updateTerrain(0.3);state.phase=2.3;
frame();
// test hooks / overlap audit
function aabb(g,hw,hl){const p=g.position,y=g.rotation.y,c=Math.abs(Math.cos(y)),s=Math.abs(Math.sin(y));return {x0:p.x-(hw*c+hl*s),x1:p.x+(hw*c+hl*s),z0:p.z-(hw*s+hl*c),z1:p.z+(hw*s+hl*c)};}
window.__site={loader,state,vehicles,exc,cranes,workers,knobs,camera,kSpeed,kCycle,kDust,knobStep,setRain,
  audit(){const out=[];const boxes=[];for(const v of vehicles)boxes.push(["veh",aabb(v.g,1.6,3.3)]);for(const e of exc)boxes.push(["exc",aabb(e.g,2.2,2.8)]);boxes.push(["loader",aabb(loader,1.8,2.4)]);
    for(let i=0;i<boxes.length;i++)for(let j=i+1;j<boxes.length;j++){const a=boxes[i][1],b=boxes[j][1];if(a.x0<b.x1&&a.x1>b.x0&&a.z0<b.z1&&a.z1>b.z0)out.push([boxes[i][0],boxes[j][0]]);}
    const oob=[];for(const [n,b] of boxes)if(b.x0<-23||b.x1>23||b.z0<-23||b.z1>23)oob.push(n);return {overlaps:out,outOfBounds:oob};}};
