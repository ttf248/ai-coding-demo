<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>体素微缩建筑工地 · 沙盘</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0c0d12;
        color: #e9e5da;
        font-family: "Inter", "PingFang SC", system-ui, sans-serif;
        overflow: hidden;
        height: 100%;
      }
      #scene {
        position: fixed;
        inset: 0;
        display: block;
      }
      .panel {
        position: fixed;
        z-index: 4;
        background: rgba(15, 17, 25, 0.78);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        padding: 14px 18px;
        font-size: 12px;
        line-height: 1.5;
        max-width: 320px;
      }
      .panel h1 {
        margin: 0 0 4px;
        font-size: 14px;
        letter-spacing: 0.12em;
      }
      .panel button {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 6px 12px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 12px;
        margin-right: 6px;
      }
      .panel button.active {
        background: rgba(255, 180, 90, 0.32);
        border-color: rgba(255, 180, 90, 0.5);
      }
      .panel .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      .panel .row input[type="range"] {
        flex: 1;
      }
      .panel .row span {
        width: 60px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #status {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 4;
        font-size: 12px;
        color: #fff;
        opacity: 0.7;
        pointer-events: none;
      }
      .hint {
        position: fixed;
        bottom: 18px;
        left: 18px;
        font-size: 11px;
        opacity: 0.6;
        z-index: 4;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        letter-spacing: 0.06em;
      }
      .badge.amber {
        background: rgba(255, 180, 90, 0.16);
        color: #ffcc80;
        border: 1px solid rgba(255, 180, 90, 0.4);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@r160/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="status">FPS <span id="fps">--</span> · <span id="phase">正午</span></div>
    <div class="panel" style="top: 18px; left: 18px;">
      <h1>VOXEL SITE</h1>
      <div>由 minimax-m3 / max 在测试基线中按 v1 任务正文生成。</div>
      <div style="margin-top: 6px;">
        <span class="badge amber">键盘空格 → 暴雨</span>
      </div>
      <div class="row" style="margin-top:10px;">
        <span style="width:78px;">设备速度</span>
        <input id="speed" type="range" min="0" max="3" step="0.1" value="1" />
        <span id="speedVal">1.0</span>
      </div>
      <div class="row">
        <span style="width:78px;">尘土强度</span>
        <input id="dust" type="range" min="0" max="2" step="0.1" value="1" />
        <span id="dustVal">1.0</span>
      </div>
      <div class="row" style="margin-top:10px;">
        <button data-phase="dawn">黎明</button>
        <button data-phase="noon" class="active">正午</button>
        <button data-phase="dusk">黄昏</button>
        <button data-phase="night">夜晚</button>
      </div>
    </div>
    <div class="hint">
      鼠标拖动环视 · 滚轮缩放 · 空格触发暴雨 · 控制面板调节速度 / 尘土
    </div>

    <script type="module">
      import * as THREE from "three";

      const canvas = document.getElementById("scene");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x9bb5d6);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        400,
      );
      camera.position.set(36, 22, 36);
      camera.lookAt(0, 1, 0);

      // ---------- Voxel factory ----------
      const voxelGeo = new THREE.BoxGeometry(1, 1, 1);
      function makeVoxel(color) {
        return new THREE.Mesh(
          voxelGeo,
          new THREE.MeshStandardMaterial({
            color,
            roughness: 0.75,
            metalness: 0.05,
          }),
        );
      }

      function pileVoxels(center, count, palette, scale = 1) {
        const group = new THREE.Group();
        for (let i = 0; i < count; i++) {
          const m = makeVoxel(palette[i % palette.length]);
          const r = Math.random() * 6;
          const t = Math.random() * Math.PI * 2;
          m.position.set(
            center.x + Math.cos(t) * r,
            center.y + Math.random() * 1.5 * scale,
            center.z + Math.sin(t) * r,
          );
          m.scale.setScalar(scale * (0.7 + Math.random() * 0.5));
          m.rotation.y = Math.floor(Math.random() * 4) * (Math.PI / 2);
          m.castShadow = true;
          m.receiveShadow = true;
          group.add(m);
        }
        return group;
      }

      // ---------- Workers (instanced) ----------
      const workerCount = 80;
      const workerGeo = new THREE.BoxGeometry(0.6, 1.6, 0.6);
      const workerMat = new THREE.MeshStandardMaterial({
        color: 0xffb74d,
        roughness: 0.7,
      });
      const workerMat2 = new THREE.MeshStandardMaterial({
        color: 0x4dd0e1,
        roughness: 0.7,
      });
      const workers = new THREE.InstancedMesh(workerGeo, workerMat, workerCount);
      const workers2 = new THREE.InstancedMesh(workerGeo, workerMat2, workerCount);
      workers.castShadow = true;
      workers2.castShadow = true;
      const workerHome = [];
      const tmp = new THREE.Object3D();
      for (let i = 0; i < workerCount; i++) {
        const angle = (i / workerCount) * Math.PI * 2;
        const r = 12 + (i % 3) * 1.5;
        const x = Math.cos(angle) * r + (Math.random() - 0.5) * 2;
        const z = Math.sin(angle) * r + (Math.random() - 0.5) * 2;
        workerHome.push({ x, z, phase: Math.random() * Math.PI * 2 });
      }
      scene.add(workers);
      scene.add(workers2);

      // ---------- Materials pile (instanced) ----------
      const materialCount = 240;
      const matGeo = new THREE.BoxGeometry(0.6, 0.6, 1.4);
      const steelMat = new THREE.MeshStandardMaterial({
        color: 0x546e7a,
        roughness: 0.45,
        metalness: 0.55,
      });
      const bricks = new THREE.InstancedMesh(matGeo, steelMat, materialCount);
      const matHome = [];
      for (let i = 0; i < materialCount; i++) {
        const stack = Math.floor(i / 16);
        const angle = (stack / 15) * Math.PI * 2;
        const x = Math.cos(angle) * 7;
        const z = Math.sin(angle) * 7;
        matHome.push({ x, z, y: 0.3 + (i % 16) * 0.65, angle });
      }
      bricks.castShadow = true;
      bricks.receiveShadow = true;
      scene.add(bricks);

      // ---------- Site setup ----------
      // Table top
      const table = new THREE.Mesh(
        new THREE.BoxGeometry(54, 1.4, 54),
        new THREE.MeshStandardMaterial({ color: 0x3e2812, roughness: 0.6 }),
      );
      table.position.y = -0.7;
      table.receiveShadow = true;
      scene.add(table);

      // Ground pad inside the table.
      const ground = new THREE.Mesh(
        new THREE.BoxGeometry(46, 0.2, 46),
        new THREE.MeshStandardMaterial({ color: 0x4a3a26, roughness: 0.95 }),
      );
      ground.position.y = 0.05;
      ground.receiveShadow = true;
      scene.add(ground);

      // Foundation pit
      const pit = new THREE.Mesh(
        new THREE.BoxGeometry(10, 1.4, 8),
        new THREE.MeshStandardMaterial({ color: 0x2a1d12 }),
      );
      pit.position.set(-6, 0.6, 4);
      pit.receiveShadow = true;
      scene.add(pit);

      // Steel shed
      const shed = new THREE.Group();
      for (let i = 0; i < 8; i++) {
        const col = makeVoxel(0x546e7a);
        col.position.set(-6 + (i - 4) * 1.2, 0.4, -8);
        shed.add(col);
      }
      const roof = makeVoxel(0x1b1f23);
      roof.scale.set(10, 0.2, 1.4);
      roof.position.set(-6, 1.6, -8);
      shed.add(roof);
      scene.add(shed);

      // Material stack pad
      const matPad = new THREE.Group();
      const palettes = [0xb47840, 0xa9b4c4, 0xd4b48c, 0x9c6a44];
      matPad.add(pileVoxels(new THREE.Vector3(10, 0.2, -4), 30, palettes, 0.9));
      scene.add(matPad);

      // High-rise foundation
      const foun = new THREE.Mesh(
        new THREE.BoxGeometry(7, 4, 7),
        new THREE.MeshStandardMaterial({ color: 0x6b6258, roughness: 0.7 }),
      );
      foun.position.set(8, 2, 6);
      foun.castShadow = true;
      foun.receiveShadow = true;
      scene.add(foun);

      // Above: a partly-built tower
      const tower = new THREE.Group();
      for (let i = 0; i < 5; i++) {
        const floor = makeVoxel(0xc6b89a);
        floor.scale.set(6, 0.6, 6);
        floor.position.set(8, 6 + i * 1.1, 6);
        floor.castShadow = true;
        floor.receiveShadow = true;
        tower.add(floor);
      }
      scene.add(tower);

      // Office trailers
      const trailer = (x, z, color) => {
        const t = new THREE.Group();
        const body = makeVoxel(color);
        body.scale.set(4, 1.4, 2);
        body.position.set(x, 1.2, z);
        t.add(body);
        const roof = makeVoxel(0x222831);
        roof.scale.set(4.2, 0.2, 2.2);
        roof.position.set(x, 2.1, z);
        t.add(roof);
        const window = new THREE.Mesh(
          new THREE.BoxGeometry(2, 0.4, 0.05),
          new THREE.MeshStandardMaterial({
            color: 0xffe082,
            emissive: 0xffc107,
            emissiveIntensity: 0.6,
          }),
        );
        window.position.set(x, 1.4, z + 1.05);
        t.add(window);
        return t;
      };
      scene.add(trailer(-14, -10, 0xe5dac4));
      scene.add(trailer(-14, -8, 0xb6c8d8));

      // Temporary fence
      const fence = new THREE.Group();
      for (let i = -22; i <= 22; i += 2) {
        if (Math.abs(i) > 22) continue;
        const post = makeVoxel(0xbfa46c);
        post.scale.set(0.2, 1.4, 0.2);
        post.position.set(i, 0.7, -22);
        fence.add(post);
        const post2 = post.clone();
        post2.position.set(i, 0.7, 22);
        fence.add(post2);
      }
      // Side fences
      for (let i = -22; i <= 22; i += 2) {
        const post = makeVoxel(0xbfa46c);
        post.scale.set(0.2, 1.4, 0.2);
        post.position.set(-22, 0.7, i);
        fence.add(post);
        const post2 = post.clone();
        post2.position.set(22, 0.7, i);
        fence.add(post2);
      }
      scene.add(fence);

      // Caution flags
      for (let i = 0; i < 6; i++) {
        const pole = makeVoxel(0x9e9e9e);
        pole.scale.set(0.06, 2.2, 0.06);
        pole.position.set(-22 + i * 8, 1.1, -22);
        fence.add(pole);
        const flag = makeVoxel(0xff7043);
        flag.scale.set(0.6, 0.2, 0.4);
        flag.position.set(-22 + i * 8 + 0.4, 2.0, -22);
        fence.add(flag);
      }

      // Excavator
      function buildExcavator() {
        const group = new THREE.Group();
        const body = makeVoxel(0xf9a825);
        body.scale.set(2.6, 1.4, 1.6);
        body.position.y = 0.9;
        group.add(body);
        const cab = makeVoxel(0x212121);
        cab.scale.set(1.2, 1.2, 1.2);
        cab.position.set(-0.4, 1.8, 0);
        group.add(cab);
        const arm1 = makeVoxel(0xf9a825);
        arm1.scale.set(2.4, 0.4, 0.4);
        arm1.position.set(1.4, 2.2, 0);
        group.add(arm1);
        const arm2 = makeVoxel(0xf9a825);
        arm2.scale.set(2.0, 0.4, 0.4);
        arm2.position.set(2.6, 1.5, 0);
        arm2.rotation.z = -0.6;
        group.add(arm2);
        const bucket = makeVoxel(0x37474f);
        bucket.scale.set(0.8, 0.6, 0.8);
        bucket.position.set(3.6, 0.6, 0);
        group.add(bucket);
        group.userData.arm1 = arm1;
        group.userData.arm2 = arm2;
        group.userData.bucket = bucket;
        return group;
      }
      const excavator = buildExcavator();
      excavator.position.set(-10, 0.1, 4);
      scene.add(excavator);

      // Crane tower
      const crane = new THREE.Group();
      const mast = makeVoxel(0xfdd835);
      mast.scale.set(0.5, 16, 0.5);
      mast.position.y = 8;
      crane.add(mast);
      const jib = makeVoxel(0xfdd835);
      jib.scale.set(8, 0.3, 0.4);
      jib.position.set(2, 16, 0);
      crane.add(jib);
      const counter = makeVoxel(0xfdd835);
      counter.scale.set(3, 0.3, 0.4);
      counter.position.set(-3, 16, 0);
      crane.add(counter);
      const hook = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 0.5, 0.5),
        new THREE.MeshStandardMaterial({ color: 0x424242 }),
      );
      hook.position.set(6, 12, 0);
      crane.add(hook);
      crane.userData.hook = hook;
      crane.position.set(0, 0.1, -6);
      scene.add(crane);

      // Truck
      function buildTruck() {
        const group = new THREE.Group();
        const cab = makeVoxel(0xe53935);
        cab.scale.set(1.4, 1.4, 1.6);
        cab.position.set(-1.8, 0.9, 0);
        group.add(cab);
        const bed = makeVoxel(0x424242);
        bed.scale.set(2.8, 1, 1.6);
        bed.position.set(1.2, 0.7, 0);
        group.add(bed);
        const cargo = makeVoxel(0x8d6e63);
        cargo.scale.set(2.4, 0.6, 1.4);
        cargo.position.set(1.2, 1.4, 0);
        group.add(cargo);
        return group;
      }
      const truck = buildTruck();
      truck.position.set(20, 0.1, 0);
      scene.add(truck);

      const truck2 = buildTruck();
      truck2.position.set(-20, 0.1, -16);
      scene.add(truck2);

      // Loader
      const loader = buildExcavator();
      loader.position.set(8, 0.1, 16);
      loader.rotation.y = Math.PI;
      loader.scale.setScalar(0.85);
      scene.add(loader);

      // Cement mixer
      function buildMixer() {
        const group = new THREE.Group();
        const cab = makeVoxel(0x9fa8da);
        cab.scale.set(1.2, 1.2, 1.2);
        cab.position.set(-1.2, 0.8, 0);
        group.add(cab);
        const drum = makeVoxel(0xc5cae9);
        drum.scale.set(1.6, 1.4, 1.4);
        drum.position.set(1.4, 1.2, 0);
        group.add(drum);
        return group;
      }
      const mixer = buildMixer();
      mixer.position.set(20, 0.1, 16);
      scene.add(mixer);

      // Conveyor / scaffolding
      const scaffold = new THREE.Group();
      for (let i = 0; i < 4; i++) {
        const beam = makeVoxel(0xb0bec5);
        beam.scale.set(7, 0.2, 0.2);
        beam.position.set(8, 5 + i * 1.6, 9);
        scaffold.add(beam);
        const beam2 = beam.clone();
        beam2.position.set(8, 5 + i * 1.6, 3);
        scaffold.add(beam2);
      }
      scene.add(scaffold);

      // Power pole
      const pole = new THREE.Group();
      const trunk = makeVoxel(0x6d4c41);
      trunk.scale.set(0.25, 6, 0.25);
      trunk.position.set(20, 3, -22);
      pole.add(trunk);
      scene.add(pole);

      // Table debris: blueprint / ruler / level
      const blueprint = new THREE.Mesh(
        new THREE.PlaneGeometry(4, 3),
        new THREE.MeshStandardMaterial({ color: 0x90caf9, roughness: 0.4 }),
      );
      blueprint.rotation.x = -Math.PI / 2;
      blueprint.position.set(-30, 0.12, 22);
      scene.add(blueprint);
      const ruler = new THREE.Mesh(
        new THREE.BoxGeometry(2.4, 0.1, 0.3),
        new THREE.MeshStandardMaterial({ color: 0xffeb3b }),
      );
      ruler.position.set(28, 0.2, 24);
      scene.add(ruler);
      const helmet = new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2),
        new THREE.MeshStandardMaterial({ color: 0xffeb3b }),
      );
      helmet.position.set(26, 0.5, 22);
      scene.add(helmet);
      const level = new THREE.Mesh(
        new THREE.BoxGeometry(1.6, 0.2, 0.4),
        new THREE.MeshStandardMaterial({ color: 0xb0bec5, metalness: 0.7 }),
      );
      level.position.set(24, 0.2, 23);
      scene.add(level);

      // ---------- Lights ----------
      const hemi = new THREE.HemisphereLight(0xffffff, 0x2c1c10, 0.5);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xffffff, 1.4);
      sun.position.set(20, 30, 12);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -30;
      sun.shadow.camera.right = 30;
      sun.shadow.camera.top = 30;
      sun.shadow.camera.bottom = -30;
      scene.add(sun);
      const spot = new THREE.SpotLight(0xffe082, 1.5, 30, Math.PI / 4, 0.6);
      spot.position.set(-22, 12, 22);
      scene.add(spot);
      const towerLight = new THREE.PointLight(0xff8b3d, 0.6, 18, 2);
      towerLight.position.set(0, 8, -6);
      scene.add(towerLight);

      // ---------- Dust particle system ----------
      const dustCount = 600;
      const dustPos = new Float32Array(dustCount * 3);
      const dustVel = new Float32Array(dustCount * 3);
      for (let i = 0; i < dustCount; i++) {
        dustPos[i * 3] = (Math.random() - 0.5) * 40;
        dustPos[i * 3 + 1] = Math.random() * 8;
        dustPos[i * 3 + 2] = (Math.random() - 0.5) * 40;
        dustVel[i * 3] = (Math.random() - 0.5) * 0.05;
        dustVel[i * 3 + 1] = Math.random() * 0.02 + 0.01;
        dustVel[i * 3 + 2] = (Math.random() - 0.5) * 0.05;
      }
      const dustGeo = new THREE.BufferGeometry();
      dustGeo.setAttribute(
        "position",
        new THREE.BufferAttribute(dustPos, 3).setUsage(THREE.DynamicDrawUsage),
      );
      const dustMat = new THREE.PointsMaterial({
        color: 0xd7ccc8,
        size: 0.18,
        transparent: true,
        opacity: 0.4,
        depthWrite: false,
      });
      const dust = new THREE.Points(dustGeo, dustMat);
      scene.add(dust);

      // ---------- Rain ----------
      const rainCount = 800;
      const rainPos = new Float32Array(rainCount * 3);
      for (let i = 0; i < rainCount; i++) {
        rainPos[i * 3] = (Math.random() - 0.5) * 40;
        rainPos[i * 3 + 1] = Math.random() * 20;
        rainPos[i * 3 + 2] = (Math.random() - 0.5) * 40;
      }
      const rainGeo = new THREE.BufferGeometry();
      rainGeo.setAttribute(
        "position",
        new THREE.BufferAttribute(rainPos, 3).setUsage(THREE.DynamicDrawUsage),
      );
      const rainMat = new THREE.PointsMaterial({
        color: 0x90caf9,
        size: 0.15,
        transparent: true,
        opacity: 0,
        depthWrite: false,
      });
      const rain = new THREE.Points(rainGeo, rainMat);
      scene.add(rain);

      // ---------- Camera control ----------
      let azimuth = Math.PI / 4;
      let elevation = Math.PI / 6;
      let radius = 50;
      let target = new THREE.Vector3(0, 1, 0);
      let isDragging = false;
      let lastX = 0,
        lastY = 0;

      canvas.addEventListener("pointerdown", (e) => {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener("pointerup", (e) => {
        isDragging = false;
        canvas.releasePointerCapture(e.pointerId);
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        azimuth -= dx * 0.005;
        elevation -= dy * 0.005;
        elevation = Math.max(0.1, Math.min(Math.PI / 2.2, elevation));
      });
      canvas.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          radius += e.deltaY * 0.05;
          radius = Math.max(20, Math.min(80, radius));
        },
        { passive: false },
      );

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // ---------- Phases ----------
      const phases = {
        dawn: {
          bg: 0xb6a08a,
          hemi: 0.5,
          sun: 1.0,
          toneExp: 0.95,
          tower: 0.4,
          rainOp: 0,
          phase: "黎明",
        },
        noon: {
          bg: 0x9bb5d6,
          hemi: 0.7,
          sun: 1.4,
          toneExp: 1.0,
          tower: 0.6,
          rainOp: 0,
          phase: "正午",
        },
        dusk: {
          bg: 0x6f4f6c,
          hemi: 0.4,
          sun: 1.0,
          toneExp: 0.9,
          tower: 1.0,
          rainOp: 0,
          phase: "黄昏",
        },
        night: {
          bg: 0x0a0f1a,
          hemi: 0.15,
          sun: 0.1,
          toneExp: 1.1,
          tower: 2.4,
          rainOp: 0,
          phase: "夜晚",
        },
      };
      let phase = "noon";
      let speed = 1.0;
      let dustStrength = 1.0;
      let raining = false;
      let rainUntil = 0;
      const phaseEl = document.getElementById("phase");

      document.querySelectorAll(".panel button[data-phase]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".panel button[data-phase]")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          phase = btn.dataset.phase;
        });
      });
      document.getElementById("speed").addEventListener("input", (e) => {
        speed = Number(e.target.value);
        document.getElementById("speedVal").textContent = speed.toFixed(1);
      });
      document.getElementById("dust").addEventListener("input", (e) => {
        dustStrength = Number(e.target.value);
        document.getElementById("dustVal").textContent = dustStrength.toFixed(1);
      });
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          raining = true;
          rainUntil = performance.now() + 4000;
        }
      });

      // ---------- Animation ----------
      const clock = new THREE.Clock();
      const fpsEl = document.getElementById("fps");
      let last = performance.now();
      let frames = 0;
      let acc = 0;

      function tick() {
        const dt = clock.getDelta();
        const t = clock.elapsedTime * speed;

        // Excavator arm oscillation.
        excavator.userData.arm1.rotation.z = Math.sin(t * 1.2) * 0.4 - 0.3;
        excavator.userData.arm2.rotation.z = Math.sin(t * 1.2 + 1) * 0.6 - 0.7;
        excavator.userData.bucket.position.y = 0.6 + Math.sin(t * 1.2) * 0.6;

        // Crane swing.
        crane.rotation.y = Math.sin(t * 0.4) * 0.6;
        crane.userData.hook.position.y = 12 + Math.sin(t * 1.4) * 2;

        // Truck path.
        const tx = Math.sin(t * 0.5) * 14;
        truck.position.x = tx;
        truck.rotation.y = Math.cos(t * 0.5) > 0 ? 0 : Math.PI;

        truck2.position.x = -Math.sin(t * 0.4 + 1) * 14;
        truck2.rotation.y = Math.sin(t * 0.4) > 0 ? Math.PI : 0;

        // Mixer slow loop.
        mixer.position.x = Math.cos(t * 0.3) * 14;
        mixer.rotation.y = t * 0.4;

        // Loader on patrol.
        loader.position.x = Math.cos(t * 0.6) * 6;
        loader.position.z = 16 + Math.sin(t * 0.6) * 1.5;

        // Workers animate (instanced).
        const tmpObj = new THREE.Object3D();
        for (let i = 0; i < workerCount; i++) {
          const home = workerHome[i];
          const wx = home.x + Math.sin(t * 1.5 + home.phase) * 1.5;
          const wz = home.z + Math.cos(t * 1.5 + home.phase) * 1.5;
          const ry = Math.atan2(
            Math.cos(t * 1.5 + home.phase) * -1.5,
            Math.sin(t * 1.5 + home.phase) * 1.5,
          );
          tmpObj.position.set(wx, 0.8, wz);
          tmpObj.rotation.set(0, ry, 0);
          tmpObj.updateMatrix();
          if (i % 2 === 0) workers.setMatrixAt(i, tmpObj.matrix);
          else workers2.setMatrixAt(i, tmpObj.matrix);
        }
        workers.instanceMatrix.needsUpdate = true;
        workers2.instanceMatrix.needsUpdate = true;

        // Steel bars on palette.
        for (let i = 0; i < materialCount; i++) {
          const m = matHome[i];
          tmpObj.position.set(m.x, m.y, m.z);
          tmpObj.rotation.set(0, m.angle + i * 0.04, 0);
          tmpObj.updateMatrix();
          bricks.setMatrixAt(i, tmpObj.matrix);
        }
        bricks.instanceMatrix.needsUpdate = true;

        // Dust motion.
        for (let i = 0; i < dustCount; i++) {
          dustPos[i * 3] += dustVel[i * 3] * dustStrength;
          dustPos[i * 3 + 1] += dustVel[i * 3 + 1] * dustStrength;
          dustPos[i * 3 + 2] += dustVel[i * 3 + 2] * dustStrength;
          if (dustPos[i * 3 + 1] > 10) {
            dustPos[i * 3] = (Math.random() - 0.5) * 40;
            dustPos[i * 3 + 1] = 0;
            dustPos[i * 3 + 2] = (Math.random() - 0.5) * 40;
          }
        }
        dustGeo.attributes.position.needsUpdate = true;

        // Rain.
        if (raining && performance.now() < rainUntil) {
          rainMat.opacity += (0.7 - rainMat.opacity) * 0.1;
          for (let i = 0; i < rainCount; i++) {
            rainPos[i * 3 + 1] -= 0.6;
            if (rainPos[i * 3 + 1] < 0) {
              rainPos[i * 3] = (Math.random() - 0.5) * 40;
              rainPos[i * 3 + 1] = 20;
              rainPos[i * 3 + 2] = (Math.random() - 0.5) * 40;
            }
          }
          rainGeo.attributes.position.needsUpdate = true;
        } else if (raining) {
          raining = false;
        } else {
          rainMat.opacity += (0 - rainMat.opacity) * 0.05;
        }

        // Phase blend.
        const cur = phases[phase];
        scene.background = new THREE.Color(cur.bg);
        hemi.intensity += (cur.hemi - hemi.intensity) * 0.04;
        sun.intensity += (cur.sun - sun.intensity) * 0.04;
        towerLight.intensity += (cur.tower - towerLight.intensity) * 0.04;
        renderer.toneMappingExposure +=
          (cur.toneExp - renderer.toneMappingExposure) * 0.04;
        phaseEl.textContent = cur.phase;

        // Camera orbit.
        const cx = Math.sin(azimuth) * Math.cos(elevation) * radius;
        const cy = Math.sin(elevation) * radius + 6;
        const cz = Math.cos(azimuth) * Math.cos(elevation) * radius;
        camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.08);
        camera.lookAt(target);

        // FPS.
        frames++;
        acc += dt;
        if (acc >= 0.5) {
          fpsEl.textContent = Math.round(frames / acc);
          frames = 0;
          acc = 0;
        }

        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
</html>
