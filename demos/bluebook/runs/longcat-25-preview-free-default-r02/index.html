<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小蓝书 - 瀑布流图片展示</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/zustand@4/zustand.production.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
body { background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.card-hover:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.12); }
.card-hover { transition: all 0.2s ease; }
.like-animation { animation: likeScale 0.3s ease; }
@keyframes likeScale { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }
.fade-in { animation: fadeIn 0.5s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

const useStore = zustand.create((set, get) => ({
  posts: [],
  loading: false,
  hasMore: true,
  page: 1,
  searchQuery: '',
  setSearchQuery: (query) => set({ searchQuery: query }),
  loadMore: async () => {
    if (get().loading || !get().hasMore) return;
    set({ loading: true });
    await new Promise(resolve => setTimeout(resolve, 800));
    const newPosts = generatePosts(get().page * 20, 20);
    set(state => ({
      posts: [...state.posts, ...newPosts],
      page: state.page + 1,
      loading: false,
      hasMore: state.page < 10
    }));
  },
  refresh: () => set({ posts: [], page: 1, hasMore: true }, false)
}));

function generatePosts(start, count) {
  const titles = ['春日穿搭分享', '周末咖啡时光', '旅行日记', '美食制作', '健身日常', '读书笔记', '家居装饰', '宠物日常', '摄影技巧', '手工DIY'];
  const authors = ['小红', '小明', '阿花', '大伟', '小丽', '阿杰', '小美', '老王', '小张', '小李'];
  const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7', '#dfe6e9', '#fd79a8', '#a29bfe', '#00b894', '#e17055'];
  return Array.from({ length: count }, (_, i) => {
    const idx = start + i;
    return {
      id: idx,
      title: titles[idx % titles.length] + ' #' + idx,
      author: authors[idx % authors.length],
      likes: Math.floor(Math.random() * 5000) + 100,
      imageUrl: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="' + (300 + Math.floor(Math.random() * 300)) + '" viewBox="0 0 400 ' + (300 + Math.floor(Math.random() * 300)) + '"><rect fill="' + colors[idx % colors.length] + '" width="100%" height="100%"/><text x="50%" y="50%" text-anchor="middle" fill="white" font-size="24" dy=".3em">图片 ' + idx + '</text></svg>'),
      height: 300 + Math.floor(Math.random() * 300),
      liked: false
    };
  });
}

function LazyImage({ src, alt, className }) {
  const [loaded, setLoaded] = useState(false);
  const [error, setError] = useState(false);
  return (
    <div className={'relative overflow-hidden ' + className}>
      {!loaded && !error && <div className="absolute inset-0 bg-gray-200 animate-pulse"></div>}
      {error ? (
        <div className="w-full h-full flex items-center justify-center bg-gray-100 text-gray-400">加载失败</div>
      ) : (
        <img src={src} alt={alt} className={'w-full h-full object-cover transition-opacity duration-300 ' + (loaded ? 'opacity-100' : 'opacity-0')} onLoad={() => setLoaded(true)} onError={() => setError(true)} />
      )}
    </div>
  );
}

function PostCard({ post, index }) {
  const [liked, setLiked] = useState(false);
  const [likeAnimating, setLikeAnimating] = useState(false);
  const handleLike = (e) => {
    e.stopPropagation();
    setLiked(!liked);
    setLikeAnimating(true);
    setTimeout(() => setLikeAnimating(false), 300);
  };
  return (
    <div className="card-hover bg-white rounded-lg overflow-hidden cursor-pointer fade-in" style={{ animationDelay: (index % 20) * 50 + 'ms' }}>
      <LazyImage src={post.imageUrl} alt={post.title} className="w-full" />
      <div className="p-3">
        <h3 className="text-sm font-medium text-gray-800 line-clamp-2 mb-2">{post.title}</h3>
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-2">
            <div className="w-6 h-6 rounded-full bg-red-400 flex items-center justify-center text-white text-xs">{post.author[0]}</div>
            <span className="text-xs text-gray-500">{post.author}</span>
          </div>
          <div className="flex items-center gap-1" onClick={handleLike}>
            <svg className={'w-4 h-4 ' + (liked ? 'text-red-500 fill-red-500' : 'text-gray-400') + (likeAnimating ? ' like-animation' : '')} viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" fill={liked ? 'currentColor' : 'none'}>
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span className="text-xs text-gray-500">{(post.likes + (liked ? 1 : 0)).toLocaleString()}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function SkeletonCard() {
  return (
    <div className="bg-white rounded-lg overflow-hidden">
      <div className="w-full h-48 bg-gray-200 animate-pulse"></div>
      <div className="p-3 space-y-2">
        <div className="h-4 bg-gray-200 rounded animate-pulse"></div>
        <div className="h-3 bg-gray-200 rounded w-1/2 animate-pulse"></div>
      </div>
    </div>
  );
}

function App() {
  const { posts, loading, hasMore, searchQuery, loadMore, refresh, setSearchQuery } = useStore();
  const [refreshing, setRefreshing] = useState(false);
  const observerRef = useRef();

  useEffect(() => { loadMore(); }, []);

  useEffect(() => {
    const observer = new IntersectionObserver(
      entries => { if (entries[0].isIntersecting && hasMore && !loading) loadMore(); },
      { threshold: 0.1 }
    );
    if (observerRef.current) observer.observe(observerRef.current);
    return () => observer.disconnect();
  }, [hasMore, loading, posts]);

  const handleRefresh = async () => {
    setRefreshing(true);
    refresh();
    await new Promise(r => setTimeout(r, 500));
    loadMore();
    setRefreshing(false);
  };

  const filteredPosts = useMemo(() => {
    if (!searchQuery) return posts;
    return posts.filter(p => p.title.includes(searchQuery) || p.author.includes(searchQuery));
  }, [posts, searchQuery]);

  return (
    <div className="max-w-7xl mx-auto">
      <header className="sticky top-0 z-10 bg-white shadow-sm">
        <div className="flex items-center justify-between px-4 py-3">
          <h1 className="text-xl font-bold" style={{ color: '#fe2c55' }}>小蓝书</h1>
          <div className="flex-1 max-w-md mx-4">
            <div className="relative">
              <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="搜索你感兴趣的内容" className="w-full pl-10 pr-4 py-2 bg-gray-100 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-red-300" />
              <svg className="absolute left-3 top-2.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </div>
          </div>
          <button className="px-4 py-2 text-sm text-white rounded-full" style={{ backgroundColor: '#fe2c55' }}>发布</button>
        </div>
      </header>
      {refreshing && <div className="text-center py-4 text-sm text-gray-500">刷新中...</div>}
      <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 p-4">
        {filteredPosts.map((post, idx) => <PostCard key={post.id} post={post} index={idx} />)}
      </div>
      {loading && <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 p-4">{[1,2,3,4].map(i => <SkeletonCard key={i} />)}</div>}
      {hasMore && !loading && <div ref={observerRef} className="text-center py-4 text-sm text-gray-400">加载更多</div>}
      {!hasMore && posts.length > 0 && <div className="text-center py-8 text-sm text-gray-400">没有更多了</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
