<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube UI · 创作中心原型</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { base: "#0f0f0f", surface: "#1c1c1e", yt: "#ff0033" },
        boxShadow: { frame: "0 30px 60px -20px rgba(0,0,0,0.85)" },
      },
    },
  };
</script>
<style>
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
</style>
</head>
<body class="bg-base text-zinc-100 antialiased">
  <nav class="no-scrollbar sticky top-0 z-20 flex gap-1 overflow-x-auto border-b border-white/10 bg-black/70 px-4 py-3 text-[13px] backdrop-blur-xl">
    <a class="rounded-full px-4 py-1.5 text-zinc-300 hover:bg-white/10" href="home.html">首页</a>
    <a class="rounded-full px-4 py-1.5 text-zinc-300 hover:bg-white/10" href="watch.html">播放</a>
    <a class="rounded-full px-4 py-1.5 text-zinc-300 hover:bg-white/10" href="explore.html">发现</a>
    <a class="rounded-full px-4 py-1.5 text-zinc-300 hover:bg-white/10" href="profile.html">个人中心</a>
    <a class="rounded-full bg-yt px-4 py-1.5 font-semibold text-white" href="studio.html">创作中心</a>
  </nav>

  <header class="mx-auto max-w-7xl px-6 pb-6 pt-10">
    <p class="text-xs uppercase tracking-[0.35em] text-yt">Feature 05 / Studio</p>
    <h1 class="mt-2 text-3xl font-bold">创作中心 · 仪表盘 / 内容管理 / 上传</h1>
    <p class="mt-3 max-w-3xl text-sm leading-6 text-zinc-400">
      信息架构：桌面仪表盘以 KPI 卡 + 趋势图 + Top 内容表格构成经营视图；移动端内容管理强调单条视频的状态（公开 / 审核 / 草稿）与快捷操作；
      上传流程拆为「选择文件 → 详情 → 检查 → 发布」四步，用进度环与检查清单降低焦虑。玻璃拟态用于 KPI 卡与浮层。
    </p>
  </header>

  <main class="no-scrollbar flex gap-10 overflow-x-auto px-6 pb-16">
    <!-- 桌面仪表盘 -->
    <figure class="w-[980px] flex-none">
      <div class="overflow-hidden rounded-2xl border border-zinc-700/70 bg-base shadow-frame">
        <div class="flex items-center gap-3 border-b border-zinc-800 bg-zinc-900/90 px-4 py-2.5">
          <span class="flex gap-1.5"><i class="h-3 w-3 rounded-full bg-[#ff5f57]"></i><i class="h-3 w-3 rounded-full bg-[#febc2e]"></i><i class="h-3 w-3 rounded-full bg-[#28c840]"></i></span>
          <span class="flex-1 rounded-md bg-zinc-800 px-3 py-1 text-[11px] text-zinc-400">studio.youtube.com</span>
        </div>
        <div class="flex h-[580px] overflow-hidden">
          <aside class="w-52 flex-none space-y-1 border-r border-white/5 px-3 py-4 text-[13px]">
            <p class="mb-3 flex items-center gap-2 px-3 text-[15px] font-bold"><img src="https://unpkg.com/lucide-static@latest/icons/layout-dashboard.svg" class="h-5 w-5 invert" alt="">Studio</p>
            <p class="flex items-center gap-3 rounded-xl bg-white/10 px-3 py-2 font-medium"><img src="https://unpkg.com/lucide-static@latest/icons/layout-dashboard.svg" class="h-4 w-4 invert" alt="">仪表盘</p>
            <p class="flex items-center gap-3 rounded-xl px-3 py-2 text-zinc-300"><img src="https://unpkg.com/lucide-static@latest/icons/video.svg" class="h-4 w-4 invert opacity-70" alt="">内容</p>
            <p class="flex items-center gap-3 rounded-xl px-3 py-2 text-zinc-300"><img src="https://unpkg.com/lucide-static@latest/icons/trending-up.svg" class="h-4 w-4 invert opacity-70" alt="">分析</p>
            <p class="flex items-center gap-3 rounded-xl px-3 py-2 text-zinc-300"><img src="https://unpkg.com/lucide-static@latest/icons/message-circle.svg" class="h-4 w-4 invert opacity-70" alt="">评论</p>
            <p class="flex items-center gap-3 rounded-xl px-3 py-2 text-zinc-300"><img src="https://unpkg.com/lucide-static@latest/icons/wallet.svg" class="h-4 w-4 invert opacity-70" alt="">收益</p>
            <button class="mt-4 flex w-full items-center justify-center gap-2 rounded-full bg-white py-2 text-[12px] font-semibold text-black"><img src="https://unpkg.com/lucide-static@latest/icons/upload.svg" class="h-4 w-4" alt="">上传视频</button>
          </aside>
          <div class="flex-1 overflow-hidden px-6 py-5">
            <div class="flex items-center justify-between">
              <div><h2 class="text-[17px] font-bold">频道仪表盘</h2><p class="text-[11px] text-zinc-400">星野影像 · 最近 28 天</p></div>
              <span class="rounded-full bg-white/10 px-4 py-1.5 text-[12px] backdrop-blur">导出报告</span>
            </div>
            <div class="mt-4 grid grid-cols-4 gap-4">
              <div class="rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur"><p class="text-[11px] text-zinc-400">观看次数</p><p class="mt-1 text-xl font-bold">128.4 万</p><p class="mt-1 text-[11px] text-emerald-400">▲ 12.6%</p></div>
              <div class="rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur"><p class="text-[11px] text-zinc-400">观看时长</p><p class="mt-1 text-xl font-bold">9.6 万小时</p><p class="mt-1 text-[11px] text-emerald-400">▲ 8.1%</p></div>
              <div class="rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur"><p class="text-[11px] text-zinc-400">新增订阅</p><p class="mt-1 text-xl font-bold">+2,318</p><p class="mt-1 text-[11px] text-emerald-400">▲ 21.4%</p></div>
              <div class="rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur"><p class="text-[11px] text-zinc-400">预计收益</p><p class="mt-1 text-xl font-bold">$3,204</p><p class="mt-1 text-[11px] text-rose-400">▼ 2.3%</p></div>
            </div>
            <div class="mt-4 rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur">
              <div class="flex justify-between text-[12px] text-zinc-400"><span>观看次数趋势</span><span>对比上一周期</span></div>
              <svg viewBox="0 0 600 150" class="mt-2 w-full">
                <polyline points="0,110 60,96 120,102 180,74 240,82 300,52 360,64 420,38 480,46 540,24 600,30" fill="none" stroke="#ff0033" stroke-width="3"/>
                <polyline points="0,120 60,112 120,118 180,100 240,106 300,88 360,96 420,80 480,86 540,70 600,76" fill="none" stroke="#52525b" stroke-width="2" stroke-dasharray="5 5"/>
                <circle cx="540" cy="24" r="5" fill="#ff0033"/>
              </svg>
            </div>
            <div class="mt-4 overflow-hidden rounded-2xl border border-white/10">
              <table class="w-full text-left text-[12px]">
                <thead class="bg-white/5 text-zinc-400"><tr><th class="px-4 py-2.5 font-medium">视频</th><th class="px-4 py-2.5 font-medium">发布</th><th class="px-4 py-2.5 font-medium">观看</th><th class="px-4 py-2.5 font-medium">CTR</th><th class="px-4 py-2.5 font-medium">状态</th></tr></thead>
                <tbody class="divide-y divide-white/5">
                  <tr><td class="px-4 py-2.5">雪山延时 4K</td><td class="px-4 py-2.5 text-zinc-400">2 天前</td><td class="px-4 py-2.5">86 万</td><td class="px-4 py-2.5">7.8%</td><td class="px-4 py-2.5"><span class="rounded bg-emerald-500/15 px-2 py-0.5 text-emerald-400">公开</span></td></tr>
                  <tr><td class="px-4 py-2.5">北壁攀登全记录</td><td class="px-4 py-2.5 text-zinc-400">1 周前</td><td class="px-4 py-2.5">41 万</td><td class="px-4 py-2.5">5.2%</td><td class="px-4 py-2.5"><span class="rounded bg-emerald-500/15 px-2 py-0.5 text-emerald-400">公开</span></td></tr>
                  <tr><td class="px-4 py-2.5">器材开箱：新相机</td><td class="px-4 py-2.5 text-zinc-400">—</td><td class="px-4 py-2.5">—</td><td class="px-4 py-2.5">—</td><td class="px-4 py-2.5"><span class="rounded bg-amber-500/15 px-2 py-0.5 text-amber-400">检查中</span></td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      <figcaption class="mt-3 text-center text-xs text-zinc-400">创作中心 · 桌面仪表盘</figcaption>
    </figure>

    <!-- 移动端内容管理 -->
    <figure class="w-[375px] flex-none">
      <div class="relative h-[780px] overflow-hidden rounded-[44px] border-[9px] border-zinc-800 bg-base shadow-frame">
        <div class="absolute inset-x-0 top-0 z-10 flex items-center justify-between bg-black/80 px-5 pb-3 pt-4 backdrop-blur-md">
          <h2 class="text-[18px] font-bold">内容</h2>
          <span class="grid h-9 w-9 place-items-center rounded-full bg-white text-black"><img src="https://unpkg.com/lucide-static@latest/icons/upload.svg" class="h-4 w-4" alt="上传"></span>
        </div>
        <div class="no-scrollbar absolute inset-x-0 top-14 z-10 flex gap-2 overflow-x-auto px-4 pb-2 text-[12px]">
          <span class="flex-none rounded-lg bg-white px-3 py-1.5 font-medium text-black">视频 214</span>
          <span class="flex-none rounded-lg bg-white/10 px-3 py-1.5">Shorts 86</span>
          <span class="flex-none rounded-lg bg-white/10 px-3 py-1.5">直播 12</span>
          <span class="flex-none rounded-lg bg-white/10 px-3 py-1.5">播放列表</span>
        </div>
        <div class="no-scrollbar absolute inset-x-0 bottom-0 top-24 overflow-y-auto px-4">
          <div class="space-y-3">
            <div class="rounded-2xl border border-white/10 bg-white/5 p-3 backdrop-blur">
              <div class="flex gap-3">
                <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=60" alt="" class="h-[62px] w-[110px] flex-none rounded-lg object-cover" onerror="this.style.display='none'">
                <div class="min-w-0 flex-1">
                  <p class="text-[13px] font-semibold leading-4">雪山延时 4K</p>
                  <p class="mt-1 flex items-center gap-1 text-[11px] text-emerald-400"><span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>公开 · 2 天前</p>
                  <p class="mt-1 text-[11px] text-zinc-400">86 万观看 · 7.8% CTR</p>
                </div>
              </div>
              <div class="mt-3 flex justify-between border-t border-white/10 pt-2 text-[11px] text-zinc-300">
                <span class="flex items-center gap-1.5"><img src="https://unpkg.com/lucide-static@latest/icons/trending-up.svg" class="h-3.5 w-3.5 invert opacity-70" alt="">分析</span>
                <span class="flex items-center gap-1.5"><img src="https://unpkg.com/lucide-static@latest/icons/pen-line.svg" class="h-3.5 w-3.5 invert opacity-70" alt="">编辑</span>
                <span class="flex items-center gap-1.5"><img src="https://unpkg.com/lucide-static@latest/icons/message-circle.svg" class="h-3.5 w-3.5 invert opacity-70" alt="">评论 1.2k</span>
                <span class="flex items-center gap-1.5"><img src="https://unpkg.com/lucide-static@latest/icons/more-vertical.svg" class="h-3.5 w-3.5 invert opacity-70" alt="">更多</span>
              </div>
            </div>
            <div class="rounded-2xl border border-amber-400/30 bg-amber-400/5 p-3">
              <div class="flex gap-3">
                <img src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=800&q=60" alt="" class="h-[62px] w-[110px] flex-none rounded-lg object-cover" onerror="this.style.display='none'">
                <div class="min-w-0 flex-1">
                  <p class="text-[13px] font-semibold leading-4">器材开箱：新相机首测</p>
                  <p class="mt-1 flex items-center gap-1 text-[11px] text-amber-400"><span class="h-1.5 w-1.5 rounded-full bg-amber-400"></span>检查中 · 版权音乐 1 处</p>
                  <p class="mt-1 text-[11px] text-zinc-400">预计 30 分钟内完成</p>
                </div>
              </div>
              <button class="mt-3 w-full rounded-full bg-amber-400/20 py-2 text-[12px] font-semibold text-amber-300">查看检查详情</button>
            </div>
            <div class="rounded-2xl border border-white/10 bg-white/5 p-3 backdrop-blur">
              <div class="flex gap-3">
                <span class="grid h-[62px] w-[110px] flex-none place-items-center rounded-lg border border-dashed border-white/25 text-[11px] text-zinc-500">草稿</span>
                <div class="min-w-0 flex-1">
                  <p class="text-[13px] font-semibold leading-4">未命名草稿 · 剪辑中</p>
                  <p class="mt-1 text-[11px] text-zinc-400">上次编辑 3 小时前</p>
                  <p class="mt-1 text-[11px] text-zinc-500">完成度 60%</p>
                </div>
              </div>
              <button class="mt-3 w-full rounded-full bg-white/10 py-2 text-[12px] font-semibold backdrop-blur">继续编辑</button>
            </div>
          </div>
        </div>
      </div>
      <figcaption class="mt-3 text-center text-xs text-zinc-400">创作中心 · 移动端内容管理</figcaption>
    </figure>

    <!-- 上传流程 -->
    <figure class="w-[375px] flex-none">
      <div class="relative h-[780px] overflow-hidden rounded-[44px] border-[9px] border-zinc-800 bg-base shadow-frame">
        <div class="absolute inset-x-0 top-0 z-10 flex items-center gap-3 bg-black/80 px-5 pb-3 pt-4 backdrop-blur-md">
          <img src="https://unpkg.com/lucide-static@latest/icons/x.svg" class="h-5 w-5 invert opacity-80" alt="关闭">
          <h2 class="text-[16px] font-bold">上传视频</h2>
          <span class="ml-auto text-[12px] text-zinc-400">步骤 2 / 4</span>
        </div>
        <div class="no-scrollbar absolute inset-x-0 bottom-0 top-14 overflow-y-auto px-5">
          <div class="mt-3 flex items-center gap-2">
            <span class="grid h-7 w-7 place-items-center rounded-full bg-yt text-[11px] font-bold">1</span>
            <span class="h-px flex-1 bg-yt"></span>
            <span class="grid h-7 w-7 place-items-center rounded-full bg-yt text-[11px] font-bold">2</span>
            <span class="h-px flex-1 bg-white/15"></span>
            <span class="grid h-7 w-7 place-items-center rounded-full bg-white/10 text-[11px]">3</span>
            <span class="h-px flex-1 bg-white/15"></span>
            <span class="grid h-7 w-7 place-items-center rounded-full bg-white/10 text-[11px]">4</span>
          </div>
          <div class="mt-5 flex items-center gap-3 rounded-2xl border border-white/10 bg-white/5 p-3 backdrop-blur">
            <img src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=800&q=60" alt="" class="h-14 w-24 flex-none rounded-lg object-cover" onerror="this.style.display='none'">
            <div class="flex-1">
              <p class="text-[12px] font-medium">star-night-raw-final.mp4</p>
              <div class="mt-2 h-1.5 rounded-full bg-white/10"><div class="h-1.5 w-[86%] rounded-full bg-yt"></div></div>
              <p class="mt-1 text-[10px] text-zinc-400">上传中 86% · 12.4 GB / 14.4 GB · 处理 4K 需要更久</p>
            </div>
          </div>
          <p class="mt-5 text-[13px] font-semibold">详情</p>
          <div class="mt-2 space-y-3">
            <div class="rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur">
              <p class="text-[11px] text-zinc-400">标题（必填）</p>
              <p class="mt-1 text-[13px]">雪山延时：把一整夜的星空装进 12 分钟</p>
              <p class="mt-1 text-right text-[10px] text-zinc-500">24 / 100</p>
            </div>
            <div class="rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur">
              <p class="text-[11px] text-zinc-400">描述</p>
              <p class="mt-1 text-[12px] leading-5 text-zinc-300">摄于海拔 4,200m 垭口… 参数与设备清单。</p>
            </div>
            <div class="rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur">
              <p class="text-[11px] text-zinc-400">缩略图</p>
              <div class="mt-2 flex gap-2">
                <span class="h-14 w-24 rounded-lg border-2 border-yt bg-cover bg-center" style="background-image:url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=60')"></span>
                <span class="h-14 w-24 rounded-lg border border-white/15 bg-cover bg-center opacity-70" style="background-image:url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=800&q=60')"></span>
                <span class="grid h-14 w-24 place-items-center rounded-lg border border-dashed border-white/25 text-[10px] text-zinc-500">自定义</span>
              </div>
            </div>
            <div class="rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur">
              <p class="text-[11px] text-zinc-400">受众</p>
              <div class="mt-2 space-y-2 text-[12px]">
                <label class="flex items-center gap-2"><span class="grid h-4 w-4 place-items-center rounded-full border-2 border-yt"><span class="h-1.5 w-1.5 rounded-full bg-yt"></span></span>否，此视频不是面向儿童</label>
                <label class="flex items-center gap-2 text-zinc-400"><span class="h-4 w-4 rounded-full border border-white/25"></span>是，面向儿童</label>
              </div>
            </div>
          </div>
          <div class="my-5 flex gap-3">
            <button class="flex-1 rounded-full bg-white/10 py-3 text-[13px] font-medium backdrop-blur">上一步</button>
            <button class="flex-1 rounded-full bg-white py-3 text-[13px] font-semibold text-black">下一步：检查</button>
          </div>
        </div>
      </div>
      <figcaption class="mt-3 text-center text-xs text-zinc-400">创作中心 · 上传流程（步骤 2/4）</figcaption>
    </figure>
  </main>
</body>
</html>
