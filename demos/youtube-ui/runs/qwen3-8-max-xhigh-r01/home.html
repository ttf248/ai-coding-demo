<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube UI · 首页功能原型</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { base: "#0f0f0f", surface: "#1c1c1e", yt: "#ff0033" },
        boxShadow: { frame: "0 30px 60px -20px rgba(0,0,0,0.85)" },
      },
    },
  };
</script>
<style>
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
</style>
</head>
<body class="bg-base text-zinc-100 antialiased">
  <nav class="no-scrollbar sticky top-0 z-20 flex gap-1 overflow-x-auto border-b border-white/10 bg-black/70 px-4 py-3 text-[13px] backdrop-blur-xl">
    <a class="rounded-full bg-yt px-4 py-1.5 font-semibold text-white" href="home.html">首页</a>
    <a class="rounded-full px-4 py-1.5 text-zinc-300 hover:bg-white/10" href="watch.html">播放</a>
    <a class="rounded-full px-4 py-1.5 text-zinc-300 hover:bg-white/10" href="explore.html">发现</a>
    <a class="rounded-full px-4 py-1.5 text-zinc-300 hover:bg-white/10" href="profile.html">个人中心</a>
    <a class="rounded-full px-4 py-1.5 text-zinc-300 hover:bg-white/10" href="studio.html">创作中心</a>
  </nav>

  <header class="mx-auto max-w-7xl px-6 pb-6 pt-10">
    <p class="text-xs uppercase tracking-[0.35em] text-yt">Feature 01 / Home</p>
    <h1 class="mt-2 text-3xl font-bold">首页 · 信息流与搜索</h1>
    <p class="mt-3 max-w-3xl text-sm leading-6 text-zinc-400">
      信息架构：顶部全局操作（投屏 / 搜索 / 消息）→ 兴趣 chips 过滤 → 单列沉浸式视频流（移动端）/ 侧边栏 + 多列网格（桌面端）→ 底部一级导航。
      设计语言：深色基底 + 玻璃拟态顶栏与浮层、12px 圆角卡片、红色品牌点缀；缩略图 16:9，标题两行截断，元信息单行弱化。
    </p>
  </header>

  <main class="no-scrollbar flex gap-10 overflow-x-auto px-6 pb-16">
    <!-- 移动端首页信息流 -->
    <figure class="w-[375px] flex-none">
      <div class="relative h-[780px] overflow-hidden rounded-[44px] border-[9px] border-zinc-800 bg-base shadow-frame">
        <div class="absolute inset-x-0 top-0 z-10 flex items-center justify-between bg-gradient-to-b from-black/85 to-transparent px-5 pb-3 pt-4 backdrop-blur-md">
          <img src="https://unpkg.com/lucide-static@latest/icons/cast.svg" class="h-5 w-5 invert opacity-90" alt="投屏">
          <span class="flex items-center gap-1 text-lg font-bold tracking-tighter">▶<span class="text-yt">You</span>Tube</span>
          <span class="flex items-center gap-4">
            <img src="https://unpkg.com/lucide-static@latest/icons/search.svg" class="h-5 w-5 invert opacity-90" alt="搜索">
            <span class="relative"><img src="https://unpkg.com/lucide-static@latest/icons/bell.svg" class="h-5 w-5 invert opacity-90" alt="通知"><span class="absolute -right-1 -top-1 grid h-4 w-4 place-items-center rounded-full bg-yt text-[9px] font-bold">3</span></span>
          </span>
        </div>
        <div class="no-scrollbar absolute inset-x-0 top-14 z-10 flex gap-2 overflow-x-auto px-4 pb-2">
          <span class="flex-none rounded-lg bg-white px-3 py-1.5 text-[12px] font-medium text-black">全部</span>
          <span class="flex-none rounded-lg bg-white/10 px-3 py-1.5 text-[12px] text-zinc-200 backdrop-blur">音乐</span>
          <span class="flex-none rounded-lg bg-white/10 px-3 py-1.5 text-[12px] text-zinc-200 backdrop-blur">游戏</span>
          <span class="flex-none rounded-lg bg-white/10 px-3 py-1.5 text-[12px] text-zinc-200 backdrop-blur">现场</span>
          <span class="flex-none rounded-lg bg-white/10 px-3 py-1.5 text-[12px] text-zinc-200 backdrop-blur">编程</span>
          <span class="flex-none rounded-lg bg-white/10 px-3 py-1.5 text-[12px] text-zinc-200 backdrop-blur">旅行</span>
        </div>
        <div class="no-scrollbar absolute inset-x-0 bottom-16 top-24 overflow-y-auto">
          <div class="mb-5">
            <div class="relative">
              <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=60" alt="缩略图" class="aspect-video w-full object-cover" onerror="this.style.display='none'">
              <span class="absolute bottom-2 right-2 rounded bg-black/80 px-1.5 py-0.5 text-[11px] font-medium">12:48</span>
            </div>
            <div class="flex gap-3 px-4 pt-3">
              <span class="grid h-9 w-9 flex-none place-items-center rounded-full bg-gradient-to-br from-yt to-orange-500 text-[13px] font-bold">星</span>
              <div class="min-w-0 flex-1">
                <p class="line-clamp-2 text-[14px] font-medium leading-5">雪山延时：把一整夜的星空装进 12 分钟</p>
                <p class="mt-1 text-[12px] text-zinc-400">星野影像 · 86 万次观看 · 2 天前</p>
              </div>
              <img src="https://unpkg.com/lucide-static@latest/icons/more-vertical.svg" class="h-4 w-4 invert opacity-60" alt="更多">
            </div>
          </div>
          <div class="mb-5">
            <div class="relative">
              <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=60" alt="缩略图" class="aspect-video w-full object-cover" onerror="this.style.display='none'">
              <span class="absolute bottom-2 right-2 rounded bg-black/80 px-1.5 py-0.5 text-[11px] font-medium">8:05</span>
              <span class="absolute left-2 top-2 rounded bg-black/70 px-2 py-0.5 text-[10px] backdrop-blur">4K</span>
            </div>
            <div class="flex gap-3 px-4 pt-3">
              <span class="grid h-9 w-9 flex-none place-items-center rounded-full bg-gradient-to-br from-sky-500 to-indigo-600 text-[13px] font-bold">雾</span>
              <div class="min-w-0 flex-1">
                <p class="text-[14px] font-medium leading-5">晨雾山谷徒步 Vlog｜一个人也能走完的路线</p>
                <p class="mt-1 text-[12px] text-zinc-400">雾中行 · 23 万次观看 · 6 小时前</p>
              </div>
              <img src="https://unpkg.com/lucide-static@latest/icons/more-vertical.svg" class="h-4 w-4 invert opacity-60" alt="更多">
            </div>
          </div>
          <div>
            <div class="relative">
              <img src="https://images.unsplash.com/photo-1476820865390-c52aeebb9891?auto=format&fit=crop&w=800&q=60" alt="缩略图" class="aspect-video w-full object-cover" onerror="this.style.display='none'">
              <span class="absolute bottom-2 right-2 rounded bg-black/80 px-1.5 py-0.5 text-[11px] font-medium">直播中</span>
            </div>
            <div class="flex gap-3 px-4 pt-3">
              <span class="grid h-9 w-9 flex-none place-items-center rounded-full bg-gradient-to-br from-emerald-500 to-teal-700 text-[13px] font-bold">海</span>
              <div class="min-w-0 flex-1">
                <p class="text-[14px] font-medium leading-5">海边日落慢直播 · 一起放空一小时</p>
                <p class="mt-1 text-[12px] text-zinc-400">海岸电台 · 1.2 万人正在观看</p>
              </div>
              <img src="https://unpkg.com/lucide-static@latest/icons/more-vertical.svg" class="h-4 w-4 invert opacity-60" alt="更多">
            </div>
          </div>
        </div>
        <div class="absolute inset-x-0 bottom-0 grid grid-cols-5 border-t border-white/10 bg-black/85 px-2 pb-6 pt-2 text-[10px] backdrop-blur-xl">
          <span class="flex flex-col items-center gap-1 text-white"><img src="https://unpkg.com/lucide-static@latest/icons/home.svg" class="h-5 w-5 invert" alt="">首页</span>
          <span class="flex flex-col items-center gap-1 text-zinc-400"><img src="https://unpkg.com/lucide-static@latest/icons/flame.svg" class="h-5 w-5 invert opacity-60" alt="">Shorts</span>
          <span class="flex flex-col items-center"><span class="-mt-3 grid h-8 w-12 place-items-center rounded-xl bg-white/10 backdrop-blur"><img src="https://unpkg.com/lucide-static@latest/icons/plus.svg" class="h-5 w-5 invert" alt="创作"></span></span>
          <span class="flex flex-col items-center gap-1 text-zinc-400"><img src="https://unpkg.com/lucide-static@latest/icons/users.svg" class="h-5 w-5 invert opacity-60" alt="">订阅</span>
          <span class="flex flex-col items-center gap-1 text-zinc-400"><img src="https://unpkg.com/lucide-static@latest/icons/list.svg" class="h-5 w-5 invert opacity-60" alt="">媒体库</span>
        </div>
      </div>
      <figcaption class="mt-3 text-center text-xs text-zinc-400">首页 · 移动端信息流</figcaption>
    </figure>

    <!-- 桌面端首页 -->
    <figure class="w-[900px] flex-none">
      <div class="overflow-hidden rounded-2xl border border-zinc-700/70 bg-base shadow-frame">
        <div class="flex items-center gap-3 border-b border-zinc-800 bg-zinc-900/90 px-4 py-2.5">
          <span class="flex gap-1.5"><i class="h-3 w-3 rounded-full bg-[#ff5f57]"></i><i class="h-3 w-3 rounded-full bg-[#febc2e]"></i><i class="h-3 w-3 rounded-full bg-[#28c840]"></i></span>
          <span class="flex-1 rounded-md bg-zinc-800 px-3 py-1 text-[11px] text-zinc-400">youtube.com</span>
        </div>
        <div class="relative flex h-[560px] overflow-hidden">
          <aside class="w-56 flex-none space-y-1 border-r border-white/5 px-3 py-4 text-[13px]">
            <p class="flex items-center gap-3 rounded-xl bg-white/10 px-3 py-2 font-medium"><img src="https://unpkg.com/lucide-static@latest/icons/home.svg" class="h-4 w-4 invert" alt="">首页</p>
            <p class="flex items-center gap-3 rounded-xl px-3 py-2 text-zinc-300"><img src="https://unpkg.com/lucide-static@latest/icons/flame.svg" class="h-4 w-4 invert opacity-70" alt="">Shorts</p>
            <p class="flex items-center gap-3 rounded-xl px-3 py-2 text-zinc-300"><img src="https://unpkg.com/lucide-static@latest/icons/users.svg" class="h-4 w-4 invert opacity-70" alt="">订阅内容</p>
            <hr class="border-white/10">
            <p class="flex items-center gap-3 rounded-xl px-3 py-2 text-zinc-300"><img src="https://unpkg.com/lucide-static@latest/icons/history.svg" class="h-4 w-4 invert opacity-70" alt="">历史记录</p>
            <p class="flex items-center gap-3 rounded-xl px-3 py-2 text-zinc-300"><img src="https://unpkg.com/lucide-static@latest/icons/list.svg" class="h-4 w-4 invert opacity-70" alt="">播放列表</p>
            <p class="flex items-center gap-3 rounded-xl px-3 py-2 text-zinc-300"><img src="https://unpkg.com/lucide-static@latest/icons/clock.svg" class="h-4 w-4 invert opacity-70" alt="">稍后观看</p>
            <p class="flex items-center gap-3 rounded-xl px-3 py-2 text-zinc-300"><img src="https://unpkg.com/lucide-static@latest/icons/thumbs-up.svg" class="h-4 w-4 invert opacity-70" alt="">赞过的视频</p>
            <hr class="border-white/10">
            <p class="px-3 pt-1 text-[11px] text-zinc-500">订阅频道</p>
            <p class="flex items-center gap-3 px-3 py-1.5 text-zinc-300"><span class="grid h-6 w-6 place-items-center rounded-full bg-gradient-to-br from-yt to-orange-500 text-[10px]">星</span>星野影像</p>
            <p class="flex items-center gap-3 px-3 py-1.5 text-zinc-300"><span class="grid h-6 w-6 place-items-center rounded-full bg-gradient-to-br from-sky-500 to-indigo-600 text-[10px]">雾</span>雾中行</p>
          </aside>
          <div class="flex-1">
            <div class="flex items-center gap-4 px-6 py-3">
              <span class="flex items-center gap-1 text-xl font-bold tracking-tighter">▶<span class="text-yt">You</span>Tube</span>
              <div class="flex flex-1 justify-center">
                <div class="flex w-full max-w-xl overflow-hidden rounded-full border border-white/15 bg-black/40 backdrop-blur">
                  <input class="flex-1 bg-transparent px-4 py-2 text-[13px] outline-none placeholder:text-zinc-500" placeholder="搜索">
                  <span class="grid w-14 place-items-center border-l border-white/15 bg-white/10"><img src="https://unpkg.com/lucide-static@latest/icons/search.svg" class="h-4 w-4 invert" alt="搜索"></span>
                </div>
              </div>
              <span class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-emerald-500 to-teal-700 text-[12px] font-bold">Y</span>
            </div>
            <div class="no-scrollbar flex gap-2 overflow-x-auto px-6 pb-3 text-[12px]">
              <span class="flex-none rounded-lg bg-white px-3 py-1.5 font-medium text-black">全部</span>
              <span class="flex-none rounded-lg bg-white/10 px-3 py-1.5">混剪</span>
              <span class="flex-none rounded-lg bg-white/10 px-3 py-1.5">自然</span>
              <span class="flex-none rounded-lg bg-white/10 px-3 py-1.5">音乐</span>
              <span class="flex-none rounded-lg bg-white/10 px-3 py-1.5">纪录片</span>
              <span class="flex-none rounded-lg bg-white/10 px-3 py-1.5">最近上传</span>
            </div>
            <div class="grid grid-cols-3 gap-x-4 gap-y-5 px-6">
              <div>
                <div class="relative"><img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=800&q=60" alt="" class="aspect-video w-full rounded-xl object-cover" onerror="this.style.display='none'"><span class="absolute bottom-1.5 right-1.5 rounded bg-black/80 px-1 text-[10px]">21:37</span></div>
                <p class="mt-2 text-[12.5px] font-medium leading-4">阿尔卑斯北壁攀登全记录</p>
                <p class="text-[11px] text-zinc-400">山系频道 · 41 万次观看</p>
              </div>
              <div>
                <div class="relative"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=60" alt="" class="aspect-video w-full rounded-xl object-cover" onerror="this.style.display='none'"><span class="absolute bottom-1.5 right-1.5 rounded bg-black/80 px-1 text-[10px]">15:02</span></div>
                <p class="mt-2 text-[12.5px] font-medium leading-4">森林白噪：雨落在苔原上</p>
                <p class="text-[11px] text-zinc-400">自然声实验室 · 128 万次观看</p>
              </div>
              <div>
                <div class="relative"><img src="https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?auto=format&fit=crop&w=800&q=60" alt="" class="aspect-video w-full rounded-xl object-cover" onerror="this.style.display='none'"><span class="absolute bottom-1.5 right-1.5 rounded bg-black/80 px-1 text-[10px]">9:41</span></div>
                <p class="mt-2 text-[12.5px] font-medium leading-4">离岛生活：一天只班船</p>
                <p class="text-[11px] text-zinc-400">慢速世界 · 67 万次观看</p>
              </div>
              <div>
                <div class="relative"><img src="https://images.unsplash.com/photo-1439066615861-d1af74d74000?auto=format&fit=crop&w=800&q=60" alt="" class="aspect-video w-full rounded-xl object-cover" onerror="this.style.display='none'"><span class="absolute bottom-1.5 right-1.5 rounded bg-black/80 px-1 text-[10px]">18:20</span></div>
                <p class="mt-2 text-[12.5px] font-medium leading-4">湖屋改造 EP3：亲手铺地板</p>
                <p class="text-[11px] text-zinc-400">手作日常 · 12 万次观看</p>
              </div>
              <div>
                <div class="relative"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=60" alt="" class="aspect-video w-full rounded-xl object-cover" onerror="this.style.display='none'"><span class="absolute bottom-1.5 right-1.5 rounded bg-black/80 px-1 text-[10px]">6:58</span></div>
                <p class="mt-2 text-[12.5px] font-medium leading-4">黄昏色温：手机也能拍大片</p>
                <p class="text-[11px] text-zinc-400">光影手账 · 89 万次观看</p>
              </div>
              <div>
                <div class="relative"><img src="https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=800&q=60" alt="" class="aspect-video w-full rounded-xl object-cover" onerror="this.style.display='none'"><span class="absolute bottom-1.5 right-1.5 rounded bg-black/80 px-1 text-[10px]">11:11</span></div>
                <p class="mt-2 text-[12.5px] font-medium leading-4">植物观察：一片叶子的四季</p>
                <p class="text-[11px] text-zinc-400">微观自然 · 33 万次观看</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <figcaption class="mt-3 text-center text-xs text-zinc-400">首页 · 桌面端（侧边栏 + 网格）</figcaption>
    </figure>

    <!-- 移动端搜索结果 -->
    <figure class="w-[375px] flex-none">
      <div class="relative h-[780px] overflow-hidden rounded-[44px] border-[9px] border-zinc-800 bg-base shadow-frame">
        <div class="absolute inset-x-0 top-0 z-10 flex items-center gap-3 bg-black/80 px-4 pb-3 pt-4 backdrop-blur-md">
          <img src="https://unpkg.com/lucide-static@latest/icons/chevron-right.svg" class="h-5 w-5 rotate-180 invert opacity-80" alt="返回">
          <div class="flex flex-1 items-center gap-2 rounded-full bg-white/10 px-4 py-2 backdrop-blur">
            <span class="flex-1 text-[13px] text-zinc-100">晨雾 徒步</span>
            <img src="https://unpkg.com/lucide-static@latest/icons/x.svg" class="h-4 w-4 invert opacity-60" alt="清除">
          </div>
          <img src="https://unpkg.com/lucide-static@latest/icons/search.svg" class="h-5 w-5 invert opacity-90" alt="搜索">
        </div>
        <div class="no-scrollbar absolute inset-x-0 top-16 z-10 flex gap-2 overflow-x-auto px-4 pb-2 text-[12px]">
          <span class="flex-none rounded-lg bg-white px-3 py-1.5 font-medium text-black">综合</span>
          <span class="flex-none rounded-lg bg-white/10 px-3 py-1.5">今日上传</span>
          <span class="flex-none rounded-lg bg-white/10 px-3 py-1.5">4K</span>
          <span class="flex-none rounded-lg bg-white/10 px-3 py-1.5">短视频</span>
        </div>
        <div class="no-scrollbar absolute inset-x-0 bottom-0 top-28 overflow-y-auto px-4">
          <div class="mb-5">
            <div class="relative"><img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=60" alt="" class="aspect-video w-full rounded-xl object-cover" onerror="this.style.display='none'"><span class="absolute bottom-2 right-2 rounded bg-black/80 px-1.5 py-0.5 text-[11px]">8:05</span></div>
            <div class="flex gap-3 pt-3">
              <span class="grid h-9 w-9 flex-none place-items-center rounded-full bg-gradient-to-br from-sky-500 to-indigo-600 text-[13px] font-bold">雾</span>
              <div><p class="text-[14px] font-medium leading-5">晨雾山谷徒步 Vlog｜一个人也能走完的路线</p><p class="mt-1 text-[12px] text-zinc-400">雾中行 · 23 万次观看 · 6 小时前</p></div>
            </div>
          </div>
          <div class="mb-5 rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur">
            <p class="text-[12px] text-zinc-400">people also search for</p>
            <div class="mt-2 flex gap-2 text-[12px]">
              <span class="rounded-full bg-white/10 px-3 py-1.5">雾天摄影</span>
              <span class="rounded-full bg-white/10 px-3 py-1.5">山谷露营</span>
              <span class="rounded-full bg-white/10 px-3 py-1.5">独行路线</span>
            </div>
          </div>
          <div class="mb-5">
            <div class="relative"><img src="https://images.unsplash.com/photo-1499209974431-9dddcece7f88?auto=format&fit=crop&w=800&q=60" alt="" class="aspect-video w-full rounded-xl object-cover" onerror="this.style.display='none'"><span class="absolute bottom-2 right-2 rounded bg-black/80 px-1.5 py-0.5 text-[11px]">14:26</span></div>
            <div class="flex gap-3 pt-3">
              <span class="grid h-9 w-9 flex-none place-items-center rounded-full bg-gradient-to-br from-violet-500 to-fuchsia-700 text-[13px] font-bold">晨</span>
              <div><p class="text-[14px] font-medium leading-5">清晨 5 点的海边雾：冥想行走</p><p class="mt-1 text-[12px] text-zinc-400">晨间俱乐部 · 9.8 万次观看</p></div>
            </div>
          </div>
        </div>
      </div>
      <figcaption class="mt-3 text-center text-xs text-zinc-400">首页 · 移动端搜索结果与联想</figcaption>
    </figure>
  </main>
</body>
</html>
