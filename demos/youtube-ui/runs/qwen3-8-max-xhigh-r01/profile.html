<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube UI · 个人中心原型</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { base: "#0f0f0f", surface: "#1c1c1e", yt: "#ff0033" },
        boxShadow: { frame: "0 30px 60px -20px rgba(0,0,0,0.85)" },
      },
    },
  };
</script>
<style>
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
</style>
</head>
<body class="bg-base text-zinc-100 antialiased">
  <nav class="no-scrollbar sticky top-0 z-20 flex gap-1 overflow-x-auto border-b border-white/10 bg-black/70 px-4 py-3 text-[13px] backdrop-blur-xl">
    <a class="rounded-full px-4 py-1.5 text-zinc-300 hover:bg-white/10" href="home.html">首页</a>
    <a class="rounded-full px-4 py-1.5 text-zinc-300 hover:bg-white/10" href="watch.html">播放</a>
    <a class="rounded-full px-4 py-1.5 text-zinc-300 hover:bg-white/10" href="explore.html">发现</a>
    <a class="rounded-full bg-yt px-4 py-1.5 font-semibold text-white" href="profile.html">个人中心</a>
    <a class="rounded-full px-4 py-1.5 text-zinc-300 hover:bg-white/10" href="studio.html">创作中心</a>
  </nav>

  <header class="mx-auto max-w-7xl px-6 pb-6 pt-10">
    <p class="text-xs uppercase tracking-[0.35em] text-yt">Feature 04 / Profile</p>
    <h1 class="mt-2 text-3xl font-bold">个人中心 · 频道 / 历史 / 设置</h1>
    <p class="mt-3 max-w-3xl text-sm leading-6 text-zinc-400">
      信息架构：频道主页（横幅 + 头像 + 订阅关系 + 内容 Tabs）→ 媒体库（历史 / 播放列表 / 下载）→ 设置与会员。
      玻璃拟态用于浮层卡片与 Tab 指示；历史条目带观看进度条，播放列表以堆叠缩略图表达集合感。
    </p>
  </header>

  <main class="no-scrollbar flex gap-10 overflow-x-auto px-6 pb-16">
    <!-- 频道主页 -->
    <figure class="w-[375px] flex-none">
      <div class="relative h-[780px] overflow-hidden rounded-[44px] border-[9px] border-zinc-800 bg-base shadow-frame">
        <div class="relative h-36">
          <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=60" alt="频道横幅" class="h-full w-full object-cover" onerror="this.style.display='none'">
          <div class="absolute inset-0 bg-gradient-to-t from-base via-transparent to-black/40"></div>
          <div class="absolute inset-x-0 top-0 flex items-center justify-between px-5 pt-4 text-[12px] font-semibold"><span>9:41</span><span class="flex gap-3"><img src="https://unpkg.com/lucide-static@latest/icons/cast.svg" class="h-5 w-5 invert" alt=""><img src="https://unpkg.com/lucide-static@latest/icons/search.svg" class="h-5 w-5 invert" alt=""></span></div>
        </div>
        <div class="no-scrollbar absolute inset-x-0 bottom-16 top-36 overflow-y-auto px-5">
          <div class="-mt-10 flex items-end gap-4">
            <span class="grid h-20 w-20 flex-none place-items-center rounded-full bg-gradient-to-br from-yt to-orange-500 text-2xl font-black ring-4 ring-base">星</span>
            <div class="pb-1"><p class="text-[18px] font-bold">星野影像</p><p class="text-[11px] text-zinc-400">@starnight · 128 万订阅 · 214 个视频</p></div>
          </div>
          <div class="mt-4 flex gap-2 text-[12px]">
            <button class="flex-1 rounded-full bg-white py-2.5 font-semibold text-black">订阅</button>
            <button class="flex-1 rounded-full bg-white/10 py-2.5 font-medium backdrop-blur">加入会员</button>
            <button class="grid w-11 place-items-center rounded-full bg-white/10 backdrop-blur"><img src="https://unpkg.com/lucide-static@latest/icons/bell.svg" class="h-4 w-4 invert" alt="铃铛"></button>
          </div>
          <div class="mt-5 flex gap-6 border-b border-white/10 text-[13px]">
            <span class="border-b-2 border-white pb-2 font-semibold">首页</span>
            <span class="pb-2 text-zinc-400">视频</span>
            <span class="pb-2 text-zinc-400">Shorts</span>
            <span class="pb-2 text-zinc-400">直播</span>
            <span class="pb-2 text-zinc-400">播放列表</span>
            <span class="pb-2 text-zinc-400">社区</span>
          </div>
          <div class="mt-4 grid grid-cols-2 gap-3">
            <div><img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=60" alt="" class="aspect-video w-full rounded-xl object-cover" onerror="this.style.display='none'"><p class="mt-1.5 text-[12px] font-medium leading-4">雪山延时 4K</p><p class="text-[10px] text-zinc-400">86 万 · 2 天前</p></div>
            <div><img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=800&q=60" alt="" class="aspect-video w-full rounded-xl object-cover" onerror="this.style.display='none'"><p class="mt-1.5 text-[12px] font-medium leading-4">北壁攀登全记录</p><p class="text-[10px] text-zinc-400">41 万 · 1 周前</p></div>
            <div><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=60" alt="" class="aspect-video w-full rounded-xl object-cover" onerror="this.style.display='none'"><p class="mt-1.5 text-[12px] font-medium leading-4">黄昏色温教学</p><p class="text-[10px] text-zinc-400">89 万 · 2 周前</p></div>
            <div><img src="https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?auto=format&fit=crop&w=800&q=60" alt="" class="aspect-video w-full rounded-xl object-cover" onerror="this.style.display='none'"><p class="mt-1.5 text-[12px] font-medium leading-4">离岛航拍集</p><p class="text-[10px] text-zinc-400">67 万 · 3 周前</p></div>
          </div>
        </div>
        <div class="absolute inset-x-0 bottom-0 grid grid-cols-5 border-t border-white/10 bg-black/85 px-2 pb-6 pt-2 text-[10px] backdrop-blur-xl">
          <span class="flex flex-col items-center gap-1 text-zinc-400"><img src="https://unpkg.com/lucide-static@latest/icons/home.svg" class="h-5 w-5 invert opacity-60" alt="">首页</span>
          <span class="flex flex-col items-center gap-1 text-zinc-400"><img src="https://unpkg.com/lucide-static@latest/icons/flame.svg" class="h-5 w-5 invert opacity-60" alt="">Shorts</span>
          <span class="flex flex-col items-center"><span class="-mt-3 grid h-8 w-12 place-items-center rounded-xl bg-white/10 backdrop-blur"><img src="https://unpkg.com/lucide-static@latest/icons/plus.svg" class="h-5 w-5 invert" alt=""></span></span>
          <span class="flex flex-col items-center gap-1 text-zinc-400"><img src="https://unpkg.com/lucide-static@latest/icons/users.svg" class="h-5 w-5 invert opacity-60" alt="">订阅</span>
          <span class="flex flex-col items-center gap-1 text-white"><img src="https://unpkg.com/lucide-static@latest/icons/circle-user.svg" class="h-5 w-5 invert" alt="">我的</span>
        </div>
      </div>
      <figcaption class="mt-3 text-center text-xs text-zinc-400">个人中心 · 频道主页</figcaption>
    </figure>

    <!-- 媒体库：历史与播放列表 -->
    <figure class="w-[375px] flex-none">
      <div class="relative h-[780px] overflow-hidden rounded-[44px] border-[9px] border-zinc-800 bg-base shadow-frame">
        <div class="absolute inset-x-0 top-0 z-10 flex items-center justify-between bg-black/80 px-5 pb-3 pt-4 backdrop-blur-md">
          <h2 class="text-[18px] font-bold">媒体库</h2>
          <img src="https://unpkg.com/lucide-static@latest/icons/search.svg" class="h-5 w-5 invert opacity-90" alt="搜索">
        </div>
        <div class="no-scrollbar absolute inset-x-0 bottom-16 top-14 overflow-y-auto px-5">
          <div class="no-scrollbar mt-2 flex gap-6 overflow-x-auto border-b border-white/10 text-[13px]">
            <span class="border-b-2 border-white pb-2 font-semibold whitespace-nowrap">历史</span>
            <span class="pb-2 whitespace-nowrap text-zinc-400">播放列表</span>
            <span class="pb-2 whitespace-nowrap text-zinc-400">下载</span>
            <span class="pb-2 whitespace-nowrap text-zinc-400">你的视频</span>
          </div>
          <div class="mt-4 space-y-4">
            <div class="flex gap-3">
              <div class="relative flex-none"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=60" alt="" class="h-[62px] w-[110px] rounded-lg object-cover" onerror="this.style.display='none'"><span class="absolute inset-x-0 bottom-0 h-1 bg-white/25"><span class="block h-1 w-3/4 bg-yt"></span></span></div>
              <div class="min-w-0"><p class="text-[13px] font-medium leading-4">森林白噪：雨落在苔原上</p><p class="mt-1 text-[11px] text-zinc-400">自然声实验室</p><p class="text-[11px] text-zinc-500">看到 75% · 昨天</p></div>
            </div>
            <div class="flex gap-3">
              <div class="relative flex-none"><img src="https://images.unsplash.com/photo-1476820865390-c52aeebb9891?auto=format&fit=crop&w=800&q=60" alt="" class="h-[62px] w-[110px] rounded-lg object-cover" onerror="this.style.display='none'"><span class="absolute inset-x-0 bottom-0 h-1 bg-white/25"><span class="block h-1 w-2/5 bg-yt"></span></span></div>
              <div class="min-w-0"><p class="text-[13px] font-medium leading-4">黄昏色温：手机也能拍大片</p><p class="mt-1 text-[11px] text-zinc-400">光影手账</p><p class="text-[11px] text-zinc-500">看到 40% · 2 天前</p></div>
            </div>
            <div class="flex gap-3">
              <div class="relative flex-none"><img src="https://images.unsplash.com/photo-1439066615861-d1af74d74000?auto=format&fit=crop&w=800&q=60" alt="" class="h-[62px] w-[110px] rounded-lg object-cover" onerror="this.style.display='none'"><span class="absolute inset-x-0 bottom-0 h-1 bg-white/25"><span class="block h-1 w-full bg-yt"></span></span></div>
              <div class="min-w-0"><p class="text-[13px] font-medium leading-4">湖屋改造 EP3：亲手铺地板</p><p class="mt-1 text-[11px] text-zinc-400">手作日常</p><p class="text-[11px] text-zinc-500">已看完 · 3 天前</p></div>
            </div>
          </div>
          <p class="mt-6 text-[14px] font-bold">播放列表</p>
          <div class="mt-3 space-y-3">
            <div class="flex gap-3 rounded-2xl border border-white/10 bg-white/5 p-3 backdrop-blur">
              <div class="relative flex-none">
                <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=60" alt="" class="h-[62px] w-[110px] rounded-lg object-cover" onerror="this.style.display='none'">
                <span class="absolute inset-y-0 right-0 grid w-8 place-items-center rounded-r-lg bg-black/75 text-[10px] backdrop-blur">12</span>
              </div>
              <div><p class="text-[13px] font-semibold">雪山拍摄全教程</p><p class="mt-1 text-[11px] text-zinc-400">12 个视频 · 更新于周一</p><p class="mt-1 flex items-center gap-1 text-[11px] text-zinc-500"><img src="https://unpkg.com/lucide-static@latest/icons/download.svg" class="h-3 w-3 invert opacity-60" alt="">已离线</p></div>
            </div>
            <div class="flex gap-3 rounded-2xl border border-white/10 bg-white/5 p-3 backdrop-blur">
              <div class="relative flex-none">
                <img src="https://images.unsplash.com/photo-1499209974431-9dddcece7f88?auto=format&fit=crop&w=800&q=60" alt="" class="h-[62px] w-[110px] rounded-lg object-cover" onerror="this.style.display='none'">
                <span class="absolute inset-y-0 right-0 grid w-8 place-items-center rounded-r-lg bg-black/75 text-[10px] backdrop-blur">28</span>
              </div>
              <div><p class="text-[13px] font-semibold">睡前白噪合集</p><p class="mt-1 text-[11px] text-zinc-400">28 个视频 · 私有</p></div>
            </div>
          </div>
        </div>
        <div class="absolute inset-x-0 bottom-0 grid grid-cols-5 border-t border-white/10 bg-black/85 px-2 pb-6 pt-2 text-[10px] backdrop-blur-xl">
          <span class="flex flex-col items-center gap-1 text-zinc-400"><img src="https://unpkg.com/lucide-static@latest/icons/home.svg" class="h-5 w-5 invert opacity-60" alt="">首页</span>
          <span class="flex flex-col items-center gap-1 text-zinc-400"><img src="https://unpkg.com/lucide-static@latest/icons/flame.svg" class="h-5 w-5 invert opacity-60" alt="">Shorts</span>
          <span class="flex flex-col items-center"><span class="-mt-3 grid h-8 w-12 place-items-center rounded-xl bg-white/10 backdrop-blur"><img src="https://unpkg.com/lucide-static@latest/icons/plus.svg" class="h-5 w-5 invert" alt=""></span></span>
          <span class="flex flex-col items-center gap-1 text-zinc-400"><img src="https://unpkg.com/lucide-static@latest/icons/users.svg" class="h-5 w-5 invert opacity-60" alt="">订阅</span>
          <span class="flex flex-col items-center gap-1 text-white"><img src="https://unpkg.com/lucide-static@latest/icons/circle-user.svg" class="h-5 w-5 invert" alt="">我的</span>
        </div>
      </div>
      <figcaption class="mt-3 text-center text-xs text-zinc-400">个人中心 · 历史与播放列表</figcaption>
    </figure>

    <!-- 设置与会员 -->
    <figure class="w-[375px] flex-none">
      <div class="relative h-[780px] overflow-hidden rounded-[44px] border-[9px] border-zinc-800 bg-base shadow-frame">
        <div class="absolute inset-x-0 top-0 z-10 flex items-center gap-3 bg-black/80 px-5 pb-3 pt-4 backdrop-blur-md">
          <img src="https://unpkg.com/lucide-static@latest/icons/chevron-right.svg" class="h-5 w-5 rotate-180 invert opacity-80" alt="返回">
          <h2 class="text-[18px] font-bold">设置</h2>
        </div>
        <div class="no-scrollbar absolute inset-x-0 bottom-0 top-14 overflow-y-auto px-5">
          <div class="mt-2 overflow-hidden rounded-3xl bg-gradient-to-r from-zinc-800 to-zinc-900 p-5 ring-1 ring-white/15">
            <div class="flex items-center gap-2 text-[15px] font-bold"><img src="https://unpkg.com/lucide-static@latest/icons/sparkles.svg" class="h-5 w-5 invert" alt="">YouTube Premium</div>
            <p class="mt-2 text-[12px] leading-5 text-zinc-300">无广告观看、后台播放与下载。家庭组最多 5 人共享。</p>
            <button class="mt-3 rounded-full bg-white px-4 py-2 text-[12px] font-semibold text-black">试用 1 个月</button>
          </div>
          <div class="mt-4 divide-y divide-white/5 rounded-3xl border border-white/10 bg-white/5 text-[13px] backdrop-blur">
            <div class="flex items-center justify-between px-5 py-4"><span class="flex items-center gap-3"><img src="https://unpkg.com/lucide-static@latest/icons/user.svg" class="h-4 w-4 invert opacity-70" alt="">账号</span><span class="text-zinc-500">yuki@mail ›</span></div>
            <div class="flex items-center justify-between px-5 py-4"><span class="flex items-center gap-3"><img src="https://unpkg.com/lucide-static@latest/icons/play.svg" class="h-4 w-4 invert opacity-70" alt="">自动播放</span><span class="flex h-5 w-9 items-center rounded-full bg-yt px-0.5"><span class="ml-auto h-4 w-4 rounded-full bg-white"></span></span></div>
            <div class="flex items-center justify-between px-5 py-4"><span class="flex items-center gap-3"><img src="https://unpkg.com/lucide-static@latest/icons/bell.svg" class="h-4 w-4 invert opacity-70" alt="">通知</span><span class="text-zinc-500">仅订阅 ›</span></div>
            <div class="flex items-center justify-between px-5 py-4"><span class="flex items-center gap-3"><img src="https://unpkg.com/lucide-static@latest/icons/eye.svg" class="h-4 w-4 invert opacity-70" alt="">隐私</span><span class="text-zinc-500">暂停记录 ›</span></div>
            <div class="flex items-center justify-between px-5 py-4"><span class="flex items-center gap-3"><img src="https://unpkg.com/lucide-static@latest/icons/download.svg" class="h-4 w-4 invert opacity-70" alt="">下载与存储</span><span class="text-zinc-500">1.8 GB ›</span></div>
            <div class="flex items-center justify-between px-5 py-4"><span class="flex items-center gap-3"><img src="https://unpkg.com/lucide-static@latest/icons/settings.svg" class="h-4 w-4 invert opacity-70" alt="">画质偏好</span><span class="text-zinc-500">仅 Wi-Fi 4K ›</span></div>
          </div>
          <div class="mt-4 divide-y divide-white/5 rounded-3xl border border-white/10 bg-white/5 text-[13px] backdrop-blur">
            <div class="flex items-center justify-between px-5 py-4"><span>深色主题</span><span class="text-zinc-500">始终 ›</span></div>
            <div class="flex items-center justify-between px-5 py-4"><span>字幕与语言</span><span class="text-zinc-500">简中 ›</span></div>
            <div class="flex items-center justify-between px-5 py-4"><span>帮助与反馈</span><span class="text-zinc-500">›</span></div>
          </div>
          <p class="my-6 text-center text-[11px] text-zinc-500">YouTube 19.42 · 原型演示数据</p>
        </div>
      </div>
      <figcaption class="mt-3 text-center text-xs text-zinc-400">个人中心 · 设置与会员</figcaption>
    </figure>
  </main>
</body>
</html>
