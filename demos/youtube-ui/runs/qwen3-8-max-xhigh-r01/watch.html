<!DOCTYPE html>

<title>YouTube UI · 播放功能原型</title>

<script>

  };

<style>
  .no-scrollbar::-webkit-scrollbar { display: none; }

</style>

<body class="bg-base text-zinc-100 antialiased">
  <nav class="no-scrollbar sticky top-0 z-20 flex gap-1 overflow-x-auto border-b border-white/10 bg-black/70 px-4 py-3 text-[13px] backdrop-blur-xl">
    <a class="rounded-full px-4 py-1.5 text-zinc-300 hover:bg-white/10" href="home.html">首页</a>
    <a class="rounded-full bg-yt px-4 py-1.5 font-semibold text-white" href="watch.html">播放</a>
    <a class="rounded-full px-4 py-1.5 text-zinc-300 hover:bg-white/10" href="explore.html">发现</a>
    <a class="rounded-full px-4 py-1.5 text-zinc-300 hover:bg-white/10" href="profile.html">个人中心</a>
    <a class="rounded-full px-4 py-1.5 text-zinc-300 hover:bg-white/10" href="studio.html">创作中心</a>

  <header class="mx-auto max-w-7xl px-6 pb-6 pt-10">
    <p class="text-xs uppercase tracking-[0.35em] text-yt">Feature 02 / Watch</p>
    <h1 class="mt-2 text-3xl font-bold">播放 · 播放器与观看情境</h1>
    <p class="mt-3 max-w-3xl text-sm leading-6 text-zinc-400">
      信息架构：播放器 → 标题与操作条（赞 / 踩 / 分享 / 下载 / 剪辑）→ 频道订阅行 → 玻璃拟态描述卡 → 评论区 → Up Next。
      桌面端采用主播放区 + 右栏推荐的双列结构；横屏全屏播放器仅保留控制层与渐变遮罩，保证沉浸。
    </p>
  </header>

  <main class="no-scrollbar flex gap-10 overflow-x-auto px-6 pb-16">
    <!-- 移动端播放页 -->
    <figure class="w-[375px] flex-none">
      <div class="relative h-[780px] overflow-hidden rounded-[44px] border-[9px] border-zinc-800 bg-base shadow-frame">
        <div class="relative">
          <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=60" alt="播放器画面" class="aspect-video w-full object-cover" onerror="this.style.display='none'">
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/40"></div>
          <div class="absolute inset-x-0 top-0 flex items-center justify-between px-4 pt-3 text-[12px] font-semibold"><span>9:41</span><span class="opacity-80">⦿ ▮</span></div>
          <div class="absolute inset-x-0 top-9 flex items-center justify-between px-4">
            <img src="https://unpkg.com/lucide-static@latest/icons/chevron-right.svg" class="h-5 w-5 rotate-180 invert" alt="返回">
            <span class="text-[12px] font-medium">雪山延时 · 08:24 / 12:48</span>
            <span class="flex gap-4"><img src="https://unpkg.com/lucide-static@latest/icons/cast.svg" class="h-5 w-5 invert" alt="投屏"><img src="https://unpkg.com/lucide-static@latest/icons/search.svg" class="h-5 w-5 invert" alt="搜索"></span>
          </div>
          <span class="absolute left-1/2 top-1/2 grid h-16 w-16 -translate-x-1/2 -translate-y-1/2 place-items-center rounded-full bg-black/45 backdrop-blur"><img src="https://unpkg.com/lucide-static@latest/icons/pause.svg" class="h-7 w-7 invert" alt="暂停"></span>
          <div class="absolute inset-x-0 bottom-0 px-4 pb-2">
            <div class="h-1 rounded-full bg-white/25"><div class="relative h-1 w-[64%] rounded-full bg-yt"><span class="absolute -right-1.5 -top-1 h-3 w-3 rounded-full bg-yt"></span></div></div>
            <div class="mt-2 flex items-center justify-between text-[11px] text-zinc-200">
              <span class="flex gap-4"><img src="https://unpkg.com/lucide-static@latest/icons/play.svg" class="h-4 w-4 invert" alt="播放"><img src="https://unpkg.com/lucide-static@latest/icons/volume-2.svg" class="h-4 w-4 invert" alt="音量"></span>
              <span class="flex gap-4"><span class="rounded bg-white/15 px-1.5">CC</span><img src="https://unpkg.com/lucide-static@latest/icons/settings.svg" class="h-4 w-4 invert" alt="设置"><img src="https://unpkg.com/lucide-static@latest/icons/maximize.svg" class="h-4 w-4 invert" alt="全屏"></span>
            </div>
          </div>
        </div>
        <div class="no-scrollbar absolute inset-x-0 bottom-0 top-[211px] overflow-y-auto px-4">
          <h2 class="pt-3 text-[15px] font-semibold leading-6">雪山延时：把一整夜的星空装进 12 分钟 ｜ 4K HDR</h2>

          <div class="no-scrollbar mt-3 flex gap-2 overflow-x-auto text-[12px]">
            <span class="flex flex-none items-center gap-2 rounded-full bg-white/10 px-4 py-2 backdrop-blur"><img src="https://unpkg.com/lucide-static@latest/icons/thumbs-up.svg" class="h-4 w-4 invert" alt="">4.2 万 <span class="mx-1 h-4 w-px bg-white/20"></span> <img src="https://unpkg.com/lucide-static@latest/icons/thumbs-up.svg" class="h-4 w-4 rotate-180 invert opacity-70" alt=""></span>
            <span class="flex flex-none items-center gap-2 rounded-full bg-white/10 px-4 py-2 backdrop-blur"><img src="https://unpkg.com/lucide-static@latest/icons/share-2.svg" class="h-4 w-4 invert" alt="">分享</span>
            <span class="flex flex-none items-center gap-2 rounded-full bg-white/10 px-4 py-2 backdrop-blur"><img src="https://unpkg.com/lucide-static@latest/icons/download.svg" class="h-4 w-4 invert" alt="">下载</span>
            <span class="flex flex-none items-center gap-2 rounded-full bg-white/10 px-4 py-2 backdrop-blur"><img src="https://unpkg.com/lucide-static@latest/icons/film.svg" class="h-4 w-4 invert" alt="">剪辑</span>
          </div>
          <div class="mt-4 flex items-center gap-3">
            <span class="grid h-10 w-10 place-items-center rounded-full bg-gradient-to-br from-yt to-orange-500 text-[14px] font-bold">星</span>
            <div class="flex-1"><p class="text-[13px] font-semibold">星野影像</p><p class="text-[11px] text-zinc-400">128 万订阅者</p></div>
            <button class="rounded-full bg-white px-4 py-2 text-[12px] font-semibold text-black">订阅</button>
          </div>
          <div class="mt-3 rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur">
            <p class="text-[12px] leading-5 text-zinc-300">摄于海拔 4,200m 的垭口，-18°C 守候 9 小时… <span class="text-zinc-500">…更多</span></p>
          </div>
          <div class="mt-4 rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur">
            <p class="text-[13px] font-semibold">评论 1,204 条</p>
            <div class="mt-3 flex gap-3">
              <span class="grid h-8 w-8 flex-none place-items-center rounded-full bg-gradient-to-br from-emerald-500 to-teal-700 text-[11px] font-bold">海</span>
              <div><p class="text-[12px] leading-5 text-zinc-300">第 7 分 12 秒的银河拱桥，看哭了。</p><p class="mt-1 flex gap-3 text-[11px] text-zinc-500"><span>👍 862</span><span>回复</span></p></div>
            </div>
          </div>
          <p class="mt-4 text-[13px] font-semibold">接下来播放</p>
          <div class="mt-2 space-y-3 pb-6">
            <div class="flex gap-2">
              <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=60" alt="" class="h-[68px] w-[120px] flex-none rounded-lg object-cover" onerror="this.style.display='none'">

        </div>
      </div>
      <figcaption class="mt-3 text-center text-xs text-zinc-400">播放 · 移动端播放页</figcaption>

              <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/80 to-transparent px-4 pb-2 pt-8">
                <div class="h-1 rounded-full bg-white/25"><div class="h-1 w-[64%] rounded-full bg-yt"></div></div>
                <div class="mt-2 flex items-center justify-between text-[11px]">
                  <span class="flex gap-3"><img src="https://unpkg.com/lucide-static@latest/icons/play.svg" class="h-4 w-4 invert" alt=""><img src="https://unpkg.com/lucide-static@latest/icons/volume-2.svg" class="h-4 w-4 invert" alt=""><span>08:24 / 12:48</span></span>
                  <span class="flex gap-3"><span class="rounded bg-white/15 px-1.5">CC</span><img src="https://unpkg.com/lucide-static@latest/icons/settings.svg" class="h-4 w-4 invert" alt=""><img src="https://unpkg.com/lucide-static@latest/icons/maximize.svg" class="h-4 w-4 invert" alt=""></span>
                </div>
              </div>
            </div>
            <h2 class="mt-3 text-[17px] font-semibold">雪山延时：把一整夜的星空装进 12 分钟 ｜ 4K HDR</h2>
            <div class="mt-3 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="grid h-10 w-10 place-items-center rounded-full bg-gradient-to-br from-yt to-orange-500 text-[14px] font-bold">星</span>

                <button class="ml-3 rounded-full bg-white px-4 py-2 text-[12px] font-semibold text-black">订阅</button>
              </div>
              <div class="flex gap-2 text-[12px]">
                <span class="flex items-center gap-2 rounded-full bg-white/10 px-4 py-2"><img src="https://unpkg.com/lucide-static@latest/icons/thumbs-up.svg" class="h-4 w-4 invert" alt="">4.2 万</span>
                <span class="flex items-center gap-2 rounded-full bg-white/10 px-4 py-2"><img src="https://unpkg.com/lucide-static@latest/icons/share-2.svg" class="h-4 w-4 invert" alt="">分享</span>
                <span class="flex items-center gap-2 rounded-full bg-white/10 px-4 py-2"><img src="https://unpkg.com/lucide-static@latest/icons/download.svg" class="h-4 w-4 invert" alt="">下载</span>
              </div>
            </div>
            <div class="mt-3 rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur">
              <p class="text-[12px] leading-5 text-zinc-300">86 万次观看 · 2 天前 · 摄于海拔 4,200m 垭口，-18°C 守候 9 小时，共 2,318 张 RAW 合成。设备清单与参数见置顶评论。</p>
            </div>
            <div class="mt-3 rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur">
              <p class="text-[13px] font-semibold">评论 1,204 条</p>
              <div class="mt-3 flex gap-3">
                <span class="grid h-8 w-8 flex-none place-items-center rounded-full bg-gradient-to-br from-emerald-500 to-teal-700 text-[11px] font-bold">海</span>
                <div><p class="text-[12px] leading-5 text-zinc-300">第 7 分 12 秒的银河拱桥，看哭了。</p><p class="mt-1 flex gap-3 text-[11px] text-zinc-500"><span>👍 862</span><span>回复</span></p></div>
              </div>
            </div>
          </div>
          <aside class="w-[340px] flex-none">
            <div class="flex items-center justify-between text-[12px]"><span class="font-semibold">自动播放</span><span class="flex h-5 w-9 items-center rounded-full bg-yt px-0.5"><span class="ml-auto h-4 w-4 rounded-full bg-white"></span></span></div>
            <div class="mt-3 space-y-3">
              <div class="flex gap-2"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=60" alt="" class="h-[64px] w-[114px] flex-none rounded-lg object-cover" onerror="this.style.display='none'"><div><p class="text-[12px] font-medium leading-4">黄昏色温：手机也能拍大片</p><p class="mt-1 text-[11px] text-zinc-400">光影手账</p><p class="text-[11px] text-zinc-400">89 万次观看</p></div></div>
              <div class="flex gap-2"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=60" alt="" class="h-[64px] w-[114px] flex-none rounded-lg object-cover" onerror="this.style.display='none'"><div><p class="text-[12px] font-medium leading-4">森林白噪：雨落在苔原上</p><p class="mt-1 text-[11px] text-zinc-400">自然声实验室</p><p class="text-[11px] text-zinc-400">128 万次观看</p></div></div>
              <div class="flex gap-2"><img src="https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?auto=format&fit=crop&w=800&q=60" alt="" class="h-[64px] w-[114px] flex-none rounded-lg object-cover" onerror="this.style.display='none'"><div><p class="text-[12px] font-medium leading-4">离岛生活：一天只班船</p><p class="mt-1 text-[11px] text-zinc-400">慢速世界</p><p class="text-[11px] text-zinc-400">67 万次观看</p></div></div>

    <!-- 横屏全屏播放器 -->
    <figure class="w-[780px] flex-none">
      <div class="relative h-[420px] overflow-hidden rounded-[28px] border-[9px] border-zinc-800 bg-black shadow-frame">
        <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=60" alt="" class="h-full w-full object-cover" onerror="this.style.display='none'">
        <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-transparent to-black/70"></div>
        <div class="absolute inset-x-0 top-0 flex items-center justify-between px-5 pt-4">
          <span class="flex items-center gap-3"><img src="https://unpkg.com/lucide-static@latest/icons/chevron-right.svg" class="h-5 w-5 rotate-180 invert" alt=""><span class="text-[13px] font-medium">雪山延时 · 4K HDR</span></span>
          <span class="flex gap-4"><img src="https://unpkg.com/lucide-static@latest/icons/cast.svg" class="h-5 w-5 invert" alt=""><img src="https://unpkg.com/lucide-static@latest/icons/more-vertical.svg" class="h-5 w-5 invert" alt=""></span>

          <img src="https://unpkg.com/lucide-static@latest/icons/play.svg" class="h-7 w-7 invert opacity-80" alt="前进">

        <div class="absolute inset-x-0 bottom-0 px-5 pb-4">
          <div class="h-1 rounded-full bg-white/25"><div class="h-1 w-[64%] rounded-full bg-yt"></div></div>
