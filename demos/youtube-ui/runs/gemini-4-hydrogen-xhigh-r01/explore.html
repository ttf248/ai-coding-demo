<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube UI 模块 · 03 发现与 Shorts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="../../../../assets/analytics.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-950 via-zinc-900 to-neutral-950 text-white min-h-screen overflow-x-hidden antialiased">
  <header class="border-b border-white/10 bg-white/5 backdrop-blur-xl sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <span class="px-2.5 py-1 rounded-lg bg-red-600 text-white text-xs font-bold">YT UI</span>
        <h1 class="text-sm sm:text-base font-semibold">模块 03 · 发现趋势榜单与 Shorts 短视频</h1>
      </div>
      <nav class="flex flex-wrap gap-1.5 text-xs">
        <a href="index.html" class="px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20">首页</a>
        <a href="player.html" class="px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20">播放</a>
        <a href="explore.html" class="px-3 py-1.5 rounded-full bg-white text-zinc-900 font-semibold">发现</a>
        <a href="profile.html" class="px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20">个人中心</a>
        <a href="studio.html" class="px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20">创作中心</a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex flex-wrap justify-center gap-7">
    <!-- 3.1 发现频道矩阵 -->
    <section class="w-full max-w-[348px] flex flex-col items-center gap-2">
      <span class="text-xs text-zinc-400">3.1 发现热榜与垂直分类</span>
      <div class="w-full h-[720px] rounded-[38px] border-[6px] border-white/15 bg-zinc-950 overflow-hidden flex flex-col justify-between p-4 shadow-2xl">
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-bold">探索发现</h2>
            <img src="https://unpkg.com/lucide-static@latest/icons/flame.svg" alt="" class="w-5 h-5 invert text-orange-400" />
          </div>
          <div class="grid grid-cols-2 gap-2.5 text-xs font-semibold">
            <div class="rounded-2xl p-3 bg-gradient-to-br from-rose-500/30 to-orange-500/20 border border-rose-400/30 flex items-center gap-2">
              <img src="https://unpkg.com/lucide-static@latest/icons/trending-up.svg" alt="" class="w-4 h-4 invert" /> 时下流行
            </div>
            <div class="rounded-2xl p-3 bg-gradient-to-br from-sky-500/30 to-indigo-500/20 border border-sky-400/30 flex items-center gap-2">
              <img src="https://unpkg.com/lucide-static@latest/icons/music.svg" alt="" class="w-4 h-4 invert" /> 音乐现场
            </div>
            <div class="rounded-2xl p-3 bg-gradient-to-br from-emerald-500/30 to-teal-500/20 border border-emerald-400/30 flex items-center gap-2">
              <img src="https://unpkg.com/lucide-static@latest/icons/gamepad-2.svg" alt="" class="w-4 h-4 invert" /> 游戏直播
            </div>
            <div class="rounded-2xl p-3 bg-gradient-to-br from-amber-500/30 to-yellow-500/20 border border-amber-400/30 flex items-center gap-2">
              <img src="https://unpkg.com/lucide-static@latest/icons/graduation-cap.svg" alt="" class="w-4 h-4 invert" /> 知识科普
            </div>
          </div>

          <div class="space-y-2.5 pt-1">
            <p class="text-xs font-semibold text-zinc-400">今日飙升 Top 2</p>
            <div class="rounded-2xl overflow-hidden bg-white/5 border border-white/10">
              <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=600&q=80" onerror="this.style.display='none'" alt="" class="w-full h-32 object-cover bg-purple-900" />
              <div class="p-3">
                <span class="text-[10px] text-rose-400 font-bold">#1 热门音乐</span>
                <h3 class="text-xs font-semibold mt-0.5">东京夜间合成器 Live 全场直拍（4K 杜比全景声）</h3>
              </div>
            </div>
            <div class="rounded-2xl overflow-hidden bg-white/5 border border-white/10">
              <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=600&q=80" onerror="this.style.display='none'" alt="" class="w-full h-28 object-cover bg-sky-950" />
              <div class="p-3">
                <span class="text-[10px] text-sky-400 font-bold">#2 科学探索</span>
                <h3 class="text-xs font-semibold mt-0.5">深空望远镜最新星云成像解析</h3>
              </div>
            </div>
          </div>
        </div>
        <div class="text-center text-[11px] text-zinc-400 pt-2 border-t border-white/10">支持地区榜单与话题标签订阅</div>
      </div>
    </section>

    <!-- 3.2 Shorts 沉浸短视频 -->
    <section class="w-full max-w-[348px] flex flex-col items-center gap-2">
      <span class="text-xs text-zinc-400">3.2 Shorts 沉浸流</span>
      <div class="w-full h-[720px] rounded-[38px] border-[6px] border-white/15 bg-black overflow-hidden relative shadow-2xl">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=700&q=80" onerror="this.style.display='none'" alt="风景短片" class="absolute inset-0 w-full h-full object-cover opacity-80" />
        <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-transparent to-black/40 flex flex-col justify-between p-5">
          <div class="flex justify-between items-center">
            <span class="font-bold text-sm">Shorts</span>
            <img src="https://unpkg.com/lucide-static@latest/icons/camera.svg" alt="" class="w-5 h-5 invert" />
          </div>

          <div class="flex items-end justify-between gap-3">
            <div class="space-y-2 flex-1">
              <div class="flex items-center gap-2">
                <span class="w-7 h-7 rounded-full bg-teal-500 text-xs font-bold flex items-center justify-center">M</span>
                <span class="text-xs font-semibold">@mist_travel</span>
                <span class="px-2.5 py-0.5 rounded-full bg-white text-black text-[10px] font-bold">订阅</span>
              </div>
              <p class="text-xs leading-relaxed">清晨五点的挪威峡湾航拍，45秒看尽云海流动 ☁️</p>
              <p class="text-[10px] text-zinc-300 flex items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/music.svg" alt="" class="w-3 h-3 invert" /> 原声 · Nordic Breeze</p>
            </div>

            <div class="flex flex-col items-center gap-4 text-[10px]">
              <div class="flex flex-col items-center gap-1"><span class="w-9 h-9 rounded-full bg-white/15 backdrop-blur flex items-center justify-center"><img src="https://unpkg.com/lucide-static@latest/icons/heart.svg" alt="" class="w-4 h-4 invert" /></span><span>12万</span></div>
              <div class="flex flex-col items-center gap-1"><span class="w-9 h-9 rounded-full bg-white/15 backdrop-blur flex items-center justify-center"><img src="https://unpkg.com/lucide-static@latest/icons/message-circle.svg" alt="" class="w-4 h-4 invert" /></span><span>982</span></div>
              <div class="flex flex-col items-center gap-1"><span class="w-9 h-9 rounded-full bg-white/15 backdrop-blur flex items-center justify-center"><img src="https://unpkg.com/lucide-static@latest/icons/share-2.svg" alt="" class="w-4 h-4 invert" /></span><span>转发</span></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
