<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube UI 模块 · 04 个人中心与片单</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="../../../../assets/analytics.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-950 via-zinc-900 to-neutral-950 text-white min-h-screen overflow-x-hidden antialiased">
  <header class="border-b border-white/10 bg-white/5 backdrop-blur-xl sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <span class="px-2.5 py-1 rounded-lg bg-red-600 text-white text-xs font-bold">YT UI</span>
        <h1 class="text-sm sm:text-base font-semibold">模块 04 · 个人中心、观看历史与离线片单</h1>
      </div>
      <nav class="flex flex-wrap gap-1.5 text-xs">
        <a href="index.html" class="px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20">首页</a>
        <a href="player.html" class="px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20">播放</a>
        <a href="explore.html" class="px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20">发现</a>
        <a href="profile.html" class="px-3 py-1.5 rounded-full bg-white text-zinc-900 font-semibold">个人中心</a>
        <a href="studio.html" class="px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20">创作中心</a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex flex-wrap justify-center gap-7">
    <!-- 4.1 个人中心主页 -->
    <section class="w-full max-w-[348px] flex flex-col items-center gap-2">
      <span class="text-xs text-zinc-400">4.1 我的媒体库</span>
      <div class="w-full h-[720px] rounded-[38px] border-[6px] border-white/15 bg-zinc-950 p-4 overflow-hidden flex flex-col justify-between shadow-2xl">
        <div class="space-y-4">
          <div class="flex items-center gap-3 pt-1">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" onerror="this.style.display='none'" alt="" class="w-14 h-14 rounded-full object-cover bg-rose-600" />
            <div>
              <h2 class="text-base font-bold">Alex Chen</h2>
              <p class="text-xs text-zinc-400">@alex_creates · 查看频道 →</p>
            </div>
          </div>

          <div class="space-y-2">
            <div class="flex justify-between items-center text-xs"><span class="font-semibold">历史记录</span><span class="text-sky-400">全部</span></div>
            <div class="grid grid-cols-2 gap-2.5">
              <div class="rounded-xl overflow-hidden bg-white/5 border border-white/10">
                <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=300&q=80" onerror="this.style.display='none'" alt="" class="w-full h-20 object-cover bg-zinc-800" />
                <p class="p-2 text-[11px] line-clamp-1">设计系统实战课程 #3</p>
              </div>
              <div class="rounded-xl overflow-hidden bg-white/5 border border-white/10">
                <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=300&q=80" onerror="this.style.display='none'" alt="" class="w-full h-20 object-cover bg-zinc-800" />
                <p class="p-2 text-[11px] line-clamp-1">空间音频混音指南</p>
              </div>
            </div>
          </div>

          <div class="rounded-2xl bg-white/5 border border-white/10 divide-y divide-white/10 text-xs">
            <div class="p-3.5 flex items-center justify-between"><span class="flex items-center gap-2.5"><img src="https://unpkg.com/lucide-static@latest/icons/play-square.svg" alt="" class="w-4 h-4 invert" /> 你的视频</span><span class="text-zinc-400">12</span></div>
            <div class="p-3.5 flex items-center justify-between"><span class="flex items-center gap-2.5"><img src="https://unpkg.com/lucide-static@latest/icons/download.svg" alt="" class="w-4 h-4 invert" /> 离线缓存</span><span class="text-emerald-400">6 个视频</span></div>
            <div class="p-3.5 flex items-center justify-between"><span class="flex items-center gap-2.5"><img src="https://unpkg.com/lucide-static@latest/icons/clock.svg" alt="" class="w-4 h-4 invert" /> 稍后观看</span><span class="text-zinc-400">24</span></div>
            <div class="p-3.5 flex items-center justify-between"><span class="flex items-center gap-2.5"><img src="https://unpkg.com/lucide-static@latest/icons/thumbs-up.svg" alt="" class="w-4 h-4 invert" /> 赞过的视频</span><span class="text-zinc-400">148</span></div>
          </div>
        </div>
        <div class="pt-3 border-t border-white/10 flex justify-between text-[10px] text-zinc-400">
          <span>首页</span><span>Shorts</span><span>+</span><span>订阅</span><span class="text-white font-semibold">我的</span>
        </div>
      </div>
    </section>

    <!-- 4.2 观看时长与账号设置 -->
    <section class="w-full max-w-[348px] flex flex-col items-center gap-2">
      <span class="text-xs text-zinc-400">4.2 观看统计与偏好</span>
      <div class="w-full h-[720px] rounded-[38px] border-[6px] border-white/15 bg-zinc-950 p-4 overflow-hidden flex flex-col justify-between shadow-2xl">
        <div class="space-y-4">
          <div class="flex items-center gap-2.5">
            <img src="https://unpkg.com/lucide-static@latest/icons/bar-chart-2.svg" alt="" class="w-5 h-5 invert" />
            <h2 class="text-base font-bold">已观看时间</h2>
          </div>

          <div class="rounded-2xl bg-gradient-to-br from-indigo-500/20 to-sky-500/10 border border-indigo-400/30 p-4 space-y-2">
            <p class="text-xs text-zinc-300">本周日均观看</p>
            <p class="text-2xl font-bold">42 分钟 <span class="text-xs font-normal text-emerald-400">较上周 -12%</span></p>
            <div class="h-16 flex items-end gap-2 pt-2">
              <div class="flex-1 bg-sky-400/70 rounded-t h-8"></div>
              <div class="flex-1 bg-sky-400/70 rounded-t h-12"></div>
              <div class="flex-1 bg-sky-400/70 rounded-t h-6"></div>
              <div class="flex-1 bg-sky-400/70 rounded-t h-14"></div>
              <div class="flex-1 bg-sky-300 rounded-t h-10"></div>
              <div class="flex-1 bg-white/15 rounded-t h-5"></div>
              <div class="flex-1 bg-white/15 rounded-t h-4"></div>
            </div>
          </div>

          <div class="rounded-2xl bg-white/5 border border-white/10 divide-y divide-white/10 text-xs">
            <div class="p-3.5 flex justify-between"><span>提醒我休息一下</span><span class="text-sky-400">每 45 分钟</span></div>
            <div class="p-3.5 flex justify-between"><span>夜间深色玻璃主题</span><span class="text-emerald-400">已启用</span></div>
            <div class="p-3.5 flex justify-between"><span>Wi-Fi 下自动预加载</span><span class="text-emerald-400">1080P</span></div>
          </div>
        </div>
        <div class="text-center text-[11px] text-zinc-400 pt-2 border-t border-white/10">账号与隐私配置已云端同步</div>
      </div>
    </section>
  </main>
</body>
</html>
