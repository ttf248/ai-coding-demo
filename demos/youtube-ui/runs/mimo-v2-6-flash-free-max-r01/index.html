<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube 风格播放器界面 · 设计原型</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          yt: { bg: '#0f0f0f', card: '#181818', hover: '#272727', chip: '#272727', line: '#303030', text: '#f1f1f1', sub: '#aaaaaa', red: '#ff0000' }
        },
        fontFamily: { roboto: ['Roboto', 'Arial', 'Helvetica', 'sans-serif'] }
      }
    }
  }
</script>
<style>
  html, body { background: #0f0f0f; color: #f1f1f1; }
  body { font-family: Roboto, Arial, Helvetica, sans-serif; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #303030; border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .avatar-fallback { background: linear-gradient(135deg, #3ea6ff, #a855f7, #ff6b6b); }
</style>
</head>
<body class="font-roboto yt-text">
<div id="app" class="min-h-screen flex flex-col">

  <!-- ===== 顶部栏 ===== -->
  <header class="sticky top-0 z-40 bg-yt-bg/95 backdrop-blur border-b border-yt-line">
    <div class="h-14 flex items-center gap-4 px-4">
      <button id="menuBtn" aria-label="菜单" class="p-2 rounded-full hover:bg-yt-hover">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>
      <a href="#" class="flex items-center gap-1 shrink-0" aria-label="YouTube 首页">
        <span class="w-8 h-6 rounded-md bg-yt-red flex items-center justify-center">
          <i data-lucide="play" class="w-3.5 h-3.5 text-white fill-white"></i>
        </span>
        <span class="text-lg font-semibold tracking-tight">MockTube</span>
        <span class="text-[10px] text-yt-sub align-super">CN</span>
      </a>

      <div class="hidden sm:flex flex-1 justify-center px-2">
        <form id="searchForm" class="flex w-full max-w-xl" role="search">
          <div class="flex flex-1 items-center bg-white/5 border border-yt-line rounded-l-full px-4 h-10 focus-within:border-blue-500/70">
            <i data-lucide="search" class="w-4 h-4 text-yt-sub mr-3 shrink-0"></i>
            <input id="searchInput" type="search" placeholder="搜索" aria-label="搜索"
                   class="w-full bg-transparent outline-none text-base placeholder:text-yt-sub">
          </div>
          <button type="submit" aria-label="搜索"
                  class="w-16 h-10 bg-yt-chip border border-l-0 border-yt-line rounded-r-full flex items-center justify-center hover:bg-yt-hover">
            <i data-lucide="search" class="w-5 h-5"></i>
          </button>
        </form>
      </div>

      <div class="flex items-center gap-1 shrink-0">
        <button id="mSearchBtn" class="sm:hidden grid place-items-center w-10 h-10 rounded-full hover:bg-yt-hover" aria-label="搜索">
          <i data-lucide="search" class="w-5 h-5"></i>
        </button>
        <button class="hidden sm:grid place-items-center w-10 h-10 rounded-full hover:bg-yt-hover" aria-label="创建">
          <i data-lucide="video" class="w-5 h-5"></i>
        </button>
        <button class="hidden sm:grid place-items-center w-10 h-10 rounded-full hover:bg-yt-hover relative" aria-label="通知">
          <i data-lucide="bell" class="w-5 h-5"></i>
          <span class="absolute top-1.5 right-1.5 min-w-4 h-4 px-1 rounded-full bg-yt-red text-[10px] leading-4 text-center">3</span>
        </button>
        <button class="ml-1 w-8 h-8 rounded-full avatar-fallback grid place-items-center text-xs font-bold" aria-label="账号头像">Z</button>
      </div>
    </div>
  </header>

  <!-- 移动端搜索条（默认隐藏，点放大镜展开） -->
  <div id="mobileSearch" class="hidden sm:hidden border-b border-yt-line px-4 py-2">
    <form id="searchFormM" class="flex w-full" role="search">
      <div class="flex flex-1 items-center bg-white/5 border border-yt-line rounded-l-full px-4 h-10">
        <i data-lucide="search" class="w-4 h-4 text-yt-sub mr-3 shrink-0"></i>
        <input id="searchInputM" type="search" placeholder="搜索" aria-label="移动端搜索"
               class="w-full bg-transparent outline-none text-base placeholder:text-yt-sub">
      </div>
      <button type="button" id="mSearchClose" aria-label="关闭搜索"
              class="w-12 h-10 bg-yt-chip border border-l-0 border-yt-line rounded-r-full flex items-center justify-center hover:bg-yt-hover">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </form>
  </div>

  <div class="flex flex-1">
    <!-- ===== 侧边栏 ===== -->
    <aside id="sidebar"
           class="hidden md:flex flex-col w-60 shrink-0 p-3 gap-1 sticky top-14 h-[calc(100vh-3.5rem)] overflow-y-auto no-scrollbar border-r border-yt-line/60">
      <nav class="sidebar-group" aria-label="主要">
        <a href="#" class="side-item bg-yt-hover font-medium" data-nav="首页">
          <i data-lucide="home" class="w-5 h-5"></i><span>首页</span></a>
        <a href="#" class="side-item" data-nav="Shorts">
          <i data-lucide="zap" class="w-5 h-5"></i><span>Shorts</span></a>
        <a href="#" class="side-item" data-nav="订阅">
          <i data-lucide="gallery-vertical-end" class="w-5 h-5"></i><span>订阅</span></a>
        <a href="#" class="side-item" data-nav="你">
          <i data-lucide="circle-user-round" class="w-5 h-5"></i><span>你</span></a>
      </nav>
      <hr class="border-yt-line my-2">
      <nav class="sidebar-group" aria-label="库">
        <p class="px-3 py-1 text-base font-medium text-yt-sub">库</p>
        <a href="#" class="side-item" data-nav="历史记录">
          <i data-lucide="history" class="w-5 h-5"></i><span>历史记录</span></a>
        <a href="#" class="side-item" data-nav="稍后观看">
          <i data-lucide="clock-3" class="w-5 h-5"></i><span>稍后观看</span></a>
        <a href="#" class="side-item" data-nav="赞过的视频">
          <i data-lucide="thumbs-up" class="w-5 h-5"></i><span>赞过的视频</span></a>
        <a href="#" class="side-item" data-nav="下载">
          <i data-lucide="download" class="w-5 h-5"></i><span>下载</span></a>
      </nav>
      <hr class="border-yt-line my-2">
      <nav class="sidebar-group" aria-label="订阅">
        <p class="px-3 py-1 text-base font-medium text-yt-sub">订阅</p>
        <a href="#" class="side-item" data-nav="前端实验室"><span class="dot bg-sky-400"></span><span>前端实验室</span></a>
        <a href="#" class="side-item" data-nav="设计食堂"><span class="dot bg-rose-400"></span><span>设计食堂</span></a>
        <a href="#" class="side-item" data-nav="数据可视化周报"><span class="dot bg-emerald-400"></span><span>数据可视化周报</span></a>
      </nav>
    </aside>

    <!-- ===== 主内容 ===== -->
    <main class="flex-1 min-w-0 px-4 sm:px-6 py-5">
      <!-- 分类条 -->
      <div class="sticky top-14 z-30 -mx-4 sm:-mx-6 px-4 sm:px-6 py-3 bg-yt-bg/95 backdrop-blur">
        <div id="chips" class="flex gap-3 overflow-x-auto no-scrollbar"></div>
      </div>

      <!-- 视频网格 -->
      <section id="grid" aria-label="视频列表" class="grid gap-x-4 gap-y-8 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 mt-2"></section>

      <!-- 空状态 -->
      <div id="empty" class="hidden text-center py-16 text-yt-sub">
        <i data-lucide="search-x" class="w-12 h-12 mx-auto mb-3"></i>
        <p class="text-base">没有找到与 “<span id="emptyKeyword"></span>” 相关的结果</p>
      </div>
    </main>
  </div>
</div>

<style>
  .side-item { display:flex; align-items:center; gap:16px; padding:10px 12px; border-radius:10px;
    color:#f1f1f1; font-size:14px; text-decoration:none; }
  .side-item:hover { background:#272727; }
  .side-item .dot { width:10px; height:10px; border-radius:50%; margin: 0 7.5px; flex: none; }
  .chip { white-space:nowrap; padding:6px 12px; border-radius:8px; font-size:14px; background:#272727; }
  .chip:hover { background:#3f3f3f; }
  .chip.active { background:#f1f1f1; color:#0f0f0f; font-weight:500; }
</style>

<script>
const VIDEOS = [
  { id:'v1', title:'用 CSS Container Queries 重构响应式布局', channel:'前端实验室', verified:true,
    views:'12万次观看', age:'3天前', dur:'18:42', cat:'编程',
    thumb:'https://images.unsplash.com/photo-1507721999472-8ed4421c4af2?w=640&q=80&auto=format&fit=crop', color:'from-sky-700' },
  { id:'v2', title:'从零实现一个 120 行的虚拟滚动列表', channel:'前端实验室', verified:true,
    views:'8.6万次观看', age:'1周前', dur:'24:07', cat:'编程',
    thumb:'https://images.unsplash.com/photo-1517180102446-f3ece451e9d8?w=640&q=80&auto=format&fit=crop', color:'from-indigo-700' },
  { id:'v3', title:'配色没思路？三步做出高级感深色界面', channel:'设计食堂', verified:false,
    views:'23万次观看', age:'5天前', dur:'11:58', cat:'设计',
    thumb:'https://images.unsplash.com/photo-1558655146-9f40138edfeb?w=640&q=80&auto=format&fit=crop', color:'from-fuchsia-700' },
  { id:'v4', title:'排版的呼吸感：字距、行高与留白实战', channel:'设计食堂', verified:true,
    views:'6.1万次观看', age:'2周前', dur:'15:33', cat:'设计',
    thumb:'https://images.unsplash.com/photo-1561070791-2526d30994b5?w=640&q=80&auto=format&fit=crop', color:'from-rose-700' },
  { id:'v5', title:'D3.js 入门：让散点图讲出故事', channel:'数据可视化周报', verified:false,
    views:'4.3万次观看', age:'4天前', dur:'31:12', cat:'数据可视化',
    thumb:'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=640&q=80&auto=format&fit=crop', color:'from-emerald-700' },
  { id:'v6', title:'一小时做出可交互的仪表盘原型', channel:'数据可视化周报', verified:false,
    views:'9.8万次观看', age:'1个月前', dur:'59:20', cat:'数据可视化',
    thumb:'https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=640&q=80&auto=format&fit=crop', color:'from-amber-700' },
  { id:'v7', title:'桌面收纳改造：小桌子也能很清爽', channel:'生活研究所', verified:false,
    views:'37万次观看', age:'6天前', dur:'09:47', cat:'生活',
    thumb:'https://images.unsplash.com/photo-1593642532744-d377ab507dc8?w=640&q=80&auto=format&fit=crop', color:'from-teal-700' },
  { id:'v8', title:'周末咖啡手冲记录与器具分享', channel:'生活研究所', verified:true,
    views:'15万次观看', age:'2周前', dur:'13:05', cat:'生活',
    thumb:'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=640&q=80&auto=format&fit=crop', color:'from-orange-700' },
  { id:'v9', title:'TypeScript 5.x 泛型条件类型精讲', channel:'前端实验室', verified:true,
    views:'5.2万次观看', age:'9天前', dur:'27:44', cat:'编程',
    thumb:'https://images.unsplash.com/photo-1526379095098-d400fd0bf935?w=640&q=80&auto=format&fit=crop', color:'from-violet-700' },
  { id:'v10', title:'动效设计原则：让界面更跟手', channel:'设计食堂', verified:false,
    views:'11万次观看', age:'3周前', dur:'08:26', cat:'设计',
    thumb:'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=640&q=80&auto=format&fit=crop', color:'from-purple-700' },
  { id:'v11', title:'城市通勤路线可视化：数据从哪来', channel:'数据可视化周报', verified:false,
    views:'2.9万次观看', age:'11天前', dur:'20:19', cat:'数据可视化',
    thumb:'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=640&q=80&auto=format&fit=crop', color:'from-cyan-700' },
  { id:'v12', title:'小阳台种香草：新手一周记录', channel:'生活研究所', verified:false,
    views:'18万次观看', age:'1个月前', dur:'16:52', cat:'生活',
    thumb:'https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?w=640&q=80&auto=format&fit=crop', color:'from-lime-700' },
];
const CHIPS = ['全部','编程','设计','数据可视化','生活','音乐','游戏','播客','新闻','直播'];

const state = { cat:'全部', q:'' };

const $ = s => document.querySelector(s);
const chipsEl = $('#chips'), gridEl = $('#grid'), emptyEl = $('#empty');

function renderChips(){
  chipsEl.innerHTML = CHIPS.map(c =>
    `<button class="chip ${c===state.cat?'active':''}" data-cat="${c}">${c}</button>`).join('');
}
function visible(){
  return VIDEOS.filter(v =>
    (state.cat==='全部' || v.cat===state.cat) &&
    (!state.q || v.title.includes(state.q) || v.channel.includes(state.q)));
}
function card(v){
  return `
  <article class="group cursor-pointer" data-id="${v.id}" tabindex="0" aria-label="${v.title}">
    <div class="relative rounded-xl overflow-hidden bg-yt-card aspect-video">
      <img src="${v.thumb}" alt="" loading="lazy"
           class="w-full h-full object-cover transition duration-300 group-hover:scale-105 group-hover:blur-[1px]">
      <span class="absolute bottom-1.5 right-1.5 px-1.5 py-0.5 rounded-md bg-black/85 text-xs font-medium tracking-wide">${v.dur}</span>
      <span class="hidden group-hover:flex absolute inset-0 items-center justify-center text-white/95">
        <i data-lucide="play-circle" class="w-12 h-12 drop-shadow"></i>
      </span>
    </div>
    <div class="flex gap-3 mt-3">
      <div class="w-9 h-9 rounded-full avatar-fallback shrink-0 grid place-items-center text-xs font-bold">${v.channel[0]}</div>
      <div class="min-w-0">
        <h3 class="text-[15px] leading-snug font-medium line-clamp-2">${v.title}</h3>
        <p class="text-[13px] text-yt-sub mt-1 flex items-center gap-1 flex-wrap">
          <span>${v.channel}</span>${v.verified?'<i data-lucide="badge-check" class="w-3.5 h-3.5"></i>':''}
        </p>
        <p class="text-[13px] text-yt-sub">${v.views} · ${v.age}</p>
      </div>
      <button class="opacity-0 group-hover:opacity-100 ml-auto self-start p-1.5 rounded-full hover:bg-yt-hover shrink-0"
              aria-label="更多操作"><i data-lucide="more-vertical" class="w-4 h-4"></i></button>
    </div>
  </article>`;
}
function renderGrid(){
  const list = visible();
  gridEl.innerHTML = list.map(card).join('');
  emptyEl.classList.toggle('hidden', list.length>0);
  $('#emptyKeyword').textContent = state.q || state.cat;
  if (list.length===0) $('#emptyKeyword').textContent = state.q || state.cat;
  lucide.createIcons();
}

/* ---- 事件 ---- */
chipsEl.addEventListener('click', e => {
  const b = e.target.closest('[data-cat]'); if(!b) return;
  state.cat = b.dataset.cat; renderChips(); renderGrid();
});
function bindSearch(formSel, inputSel){
  const form = document.querySelector(formSel);
  const input = document.querySelector(inputSel);
  form.addEventListener('submit', e => { e.preventDefault(); state.q = input.value.trim(); renderGrid(); });
  input.addEventListener('input', e => { state.q = e.target.value.trim(); renderGrid(); });
}
bindSearch('#searchForm', '#searchInput');
bindSearch('#searchFormM', '#searchInputM');
$('#mSearchBtn').addEventListener('click', () => {
  const bar = $('#mobileSearch');
  bar.classList.toggle('hidden');
  if (!bar.classList.contains('hidden')) $('#searchInputM').focus();
});
$('#mSearchClose').addEventListener('click', () => {
  $('#mobileSearch').classList.add('hidden');
  $('#searchInputM').value = ''; state.q = ''; renderGrid();
});
$('#menuBtn').addEventListener('click', () => $('#sidebar').classList.toggle('hidden'));

renderChips();
renderGrid();
lucide.createIcons();
</script>
</body>
</html>
