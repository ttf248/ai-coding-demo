<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube UI 原型设计</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { background: #0f0f0f; font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #fff; }
.phone-frame { width: 375px; min-height: 812px; background: #0f0f0f; border-radius: 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); overflow: hidden; position: relative; margin: 20px; display: inline-block; vertical-align: top; }
.phone-notch { width: 150px; height: 30px; background: #000; border-radius: 0 0 20px 20px; margin: 0 auto; position: relative; z-index: 10; }
.glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
.tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: #0f0f0f; border-top: 1px solid #272727; display: flex; justify-content: space-around; align-items: center; }
.tab-item { display: flex; flex-direction: column; align-items: center; color: #aaa; font-size: 10px; }
.tab-item.active { color: #fff; }
.tab-item i { font-size: 20px; margin-bottom: 4px; }
.video-card { background: #1a1a1a; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
.video-thumb { width: 100%; aspect-ratio: 16/9; background: linear-gradient(135deg, #1a1a2e, #16213e); display: flex; align-items: center; justify-content: center; position: relative; }
.play-btn { width: 50px; height: 50px; background: rgba(255,255,255,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="text-center p-8">
<h1 class="text-3xl font-bold text-white mb-4">YouTube UI 原型设计</h1>
<p class="text-gray-500 mb-8">完整功能原型 - 玻璃拟态风格</p>

<!-- 首页 -->
<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="p-4 pt-14">
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-2">
        <i class="fab fa-youtube text-2xl text-red-500"></i>
        <span class="text-lg font-semibold">YouTube</span>
      </div>
      <div class="flex items-center gap-4">
        <i class="fas fa-search text-lg"></i>
        <i class="fas fa-bell text-lg"></i>
        <div class="w-8 h-8 rounded-full bg-purple-500 flex items-center justify-center text-sm">U</div>
      </div>
    </div>
    <div class="flex gap-2 mb-4 overflow-x-auto">
      <span class="px-3 py-1 bg-white text-black rounded-lg text-sm flex-shrink-0">全部</span>
      <span class="px-3 py-1 glass rounded-lg text-sm flex-shrink-0">音乐</span>
      <span class="px-3 py-1 glass rounded-lg text-sm flex-shrink-0">游戏</span>
      <span class="px-3 py-1 glass rounded-lg text-sm flex-shrink-0">新闻</span>
      <span class="px-3 py-1 glass rounded-lg text-sm flex-shrink-0">直播</span>
    </div>
    <div class="space-y-4">
      <div class="video-card">
        <div class="video-thumb">
          <div class="play-btn"><i class="fas fa-play text-black ml-1"></i></div>
          <span class="absolute bottom-2 right-2 bg-black/80 px-2 py-1 rounded text-xs">12:34</span>
        </div>
        <div class="p-3">
          <div class="flex gap-3">
            <div class="w-9 h-9 rounded-full bg-blue-500 flex-shrink-0"></div>
            <div>
              <p class="text-sm font-medium line-clamp-2">【4K】城市夜景延时摄影 - 感受都市的魅力</p>
              <p class="text-xs text-gray-400 mt-1">城市摄影频道 • 12万次观看 • 3天前</p>
            </div>
          </div>
        </div>
      </div>
      <div class="video-card">
        <div class="video-thumb" style="background: linear-gradient(135deg, #2e1a1a, #1e1626);">
          <div class="play-btn"><i class="fas fa-play text-black ml-1"></i></div>
          <span class="absolute bottom-2 right-2 bg-black/80 px-2 py-1 rounded text-xs">8:21</span>
        </div>
        <div class="p-3">
          <div class="flex gap-3">
            <div class="w-9 h-9 rounded-full bg-red-500 flex-shrink-0"></div>
            <div>
              <p class="text-sm font-medium line-clamp-2">10分钟学会吉他弹唱 - 初学者教程</p>
              <p class="text-xs text-gray-400 mt-1">音乐教室 • 8.5万次观看 • 1周前</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab-item active"><i class="fas fa-home"></i>首页</div>
    <div class="tab-item"><i class="fas fa-compass"></i>探索</div>
    <div class="tab-item"><i class="fas fa-plus-circle"></i>创建</div>
    <div class="tab-item"><i class="fas fa-list"></i>订阅</div>
    <div class="tab-item"><i class="fas fa-user"></i>我的</div>
  </div>
</div>

<!-- 播放页 -->
<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="pt-10">
    <div class="w-full aspect-video bg-black flex items-center justify-center relative">
      <div class="play-btn" style="width:60px;height:60px"><i class="fas fa-play text-black ml-1 text-xl"></i></div>
      <div class="absolute bottom-0 left-0 right-0 h-1 bg-gray-700"><div class="h-full bg-red-500" style="width:35%"></div></div>
    </div>
    <div class="p-4">
      <h2 class="text-base font-semibold mb-2">【4K】城市夜景延时摄影 - 感受都市的魅力</h2>
      <p class="text-xs text-gray-400 mb-3">12万次观看 • 3天前</p>
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-4">
          <div class="flex items-center gap-1"><i class="fas fa-thumbs-up"></i><span class="text-xs ml-1">1.2万</span></div>
          <div class="flex items-center gap-1"><i class="fas fa-thumbs-down"></i></div>
          <div class="flex items-center gap-1"><i class="fas fa-share"></i><span class="text-xs ml-1">分享</span></div>
          <div class="flex items-center gap-1"><i class="fas fa-download"></i><span class="text-xs ml-1">下载</span></div>
        </div>
      </div>
      <div class="glass rounded-xl p-3 mb-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-blue-500"></div>
          <div class="flex-1">
            <p class="text-sm font-medium">城市摄影频道</p>
            <p class="text-xs text-gray-400">120万订阅</p>
          </div>
          <button class="px-4 py-1.5 bg-white text-black rounded-full text-sm font-medium">订阅</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 搜索页 -->
<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="p-4 pt-14">
    <div class="flex items-center gap-3 mb-4">
      <div class="flex-1 flex items-center gap-2 glass rounded-full px-4 py-2">
        <i class="fas fa-search text-gray-400"></i>
        <input class="bg-transparent text-sm flex-1 outline-none" placeholder="搜索视频">
      </div>
    </div>
    <div class="space-y-3">
      <div class="flex items-center gap-3">
        <i class="fas fa-search text-gray-400"></i>
        <span class="text-sm">城市夜景摄影</span>
      </div>
      <div class="flex items-center gap-3">
        <i class="fas fa-search text-gray-400"></i>
        <span class="text-sm">吉他入门教程</span>
      </div>
      <div class="flex items-center gap-3">
        <i class="fas fa-history text-gray-400"></i>
        <span class="text-sm">延时摄影技巧</span>
      </div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab-item"><i class="fas fa-home"></i>首页</div>
    <div class="tab-item active"><i class="fas fa-compass"></i>探索</div>
    <div class="tab-item"><i class="fas fa-plus-circle"></i>创建</div>
    <div class="tab-item"><i class="fas fa-list"></i>订阅</div>
    <div class="tab-item"><i class="fas fa-user"></i>我的</div>
  </div>
</div>

</div>
</body>
</html>
