"use strict";
const $=id=>document.getElementById(id);function go(id){document.getElementById(id)?.scrollIntoView({behavior:"smooth",block:"start",inline:"center"});}document.addEventListener("click",e=>{const a=e.target.closest("[data-go]");if(a)go(a.dataset.go);});
const videos=[["沿海岸慢行：五座山间小镇","岛屿影像","village","旅行",842],["一间小房间的采光实验","空间切片","room","设计",658],["林间的收音手记","山野电台","walk","自然",519],["拍下蓝调时刻的城市","目光工作室","city","摄影",726],["咖啡师的一天从磨豆开始","日常录制","coffee","生活",384]],mod="studio";
const id=Math.max(0,Math.min(videos.length-1,parseInt(new URLSearchParams(location.search).get('video'),10)||0)),v=videos[id];
const key='yt.mobile.prototype.v1';let data={saved:[],history:[],drafts:[],subscriptions:[],likes:[]};
try{Object.assign(data,JSON.parse(localStorage.getItem(key)||'{}'));}catch{}
const save=()=>{try{localStorage.setItem(key,JSON.stringify(data));}catch{}};
const fmt=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
if(mod==='watch'){data.history=[id,...data.history.filter(x=>x!==id)].slice(0,40);save();}
function flip(list,item){if(list.includes(item))list.splice(list.indexOf(item),1);else list.push(item);save();}
function refresh(){
  document.querySelectorAll('[data-subscribe]').forEach(b=>b.textContent=data.subscriptions.includes(mod==='watch'?v[1]:videos[0][1])?'已订阅':'订阅');
  document.querySelectorAll('[data-like]').forEach(b=>b.textContent=data.likes.includes(id)?'已赞':'赞');
  document.querySelectorAll('[data-save]').forEach(b=>b.textContent=data.saved.includes(id)?'已加入片单':'稍后观看');
  for(const [attr,list] of [['data-saved-list',data.saved],['data-history',data.history]]){
    const box=document.querySelector('['+attr+']');if(!box)continue;
    for(const a of box.children)a.hidden=!list.includes(+a.dataset.video);
    for(const i of [...list].reverse()){const a=box.querySelector('[data-video="'+i+'"]');if(a)box.prepend(a);}
    box.parentNode.querySelector('[data-empty]').hidden=list.length>0;
  }
  const drafts=document.querySelector('[data-drafts]');if(drafts){
    document.querySelector('[data-draft-count]').textContent=data.drafts.length;drafts.replaceChildren();
    if(!data.drafts.length)drafts.textContent='保存第一份草稿后，在这里查看。';
    for(const d of data.drafts){const p=document.createElement('p');p.className='rounded-xl border bg-white p-3';p.textContent=d.title+' · '+d.visibility+(d.clip?' · '+d.clip:'');drafts.append(p);}
  }
}
for(const frame of document.querySelectorAll('.phone')){
 const q=s=>frame.querySelector(s),qa=s=>frame.querySelectorAll(s);
 qa('[data-filter]').forEach(b=>b.onclick=()=>{qa('[data-filter]').forEach(btn=>btn.setAttribute('aria-pressed',btn===b));qa('[data-video]').forEach(a=>a.hidden=b.dataset.filter!=='全部'&&a.dataset.category!==b.dataset.filter);});
 const search=q('[data-search]');if(search)search.oninput=()=>{let hits=0;qa('[data-video]').forEach(a=>{a.hidden=!a.textContent.includes(search.value.trim());if(!a.hidden)hits++;});q('[data-empty]').hidden=!!hits;};
 const play=q('[data-play]');if(play){
   q('[data-title]').textContent=v[0];q('[data-author]').textContent=v[1];q('[data-poster]').src='media/'+v[2]+'.jpg';
   const seek=q('[data-seek]'),timer=q('[data-timer]');seek.max=v[4];let interval=0;const update=()=>timer.textContent=fmt(+seek.value)+' / '+fmt(v[4]);
   const stop=()=>{clearInterval(interval);interval=0;play.textContent='▶';play.ariaLabel='播放预览';};
   play.onclick=()=>{if(interval){stop();return;}if(+seek.value>=v[4])seek.value=0;play.textContent='Ⅱ';play.ariaLabel='暂停预览';
     interval=setInterval(()=>{seek.value=+seek.value+1;update();if(+seek.value>=v[4])stop();},1000);};seek.oninput=update;update();
 }
 const comment=q('[data-comment]');if(comment)comment.onsubmit=e=>{e.preventDefault();const input=comment.querySelector('input');if(!input.value.trim())return;const p=document.createElement('p');p.className='rounded-xl bg-white p-3';p.textContent='我 · '+input.value.trim();q('[data-comments]').prepend(p);input.value='';};
 const form=q('[data-draft-form]');if(form)form.onsubmit=e=>{e.preventDefault();const f=new FormData(form),title=String(f.get('title')).trim();if(!title)return;data.drafts.unshift({title,intro:f.get('intro'),visibility:f.get('visibility'),clip:f.get('clip')?.name});save();form.reset();q('[data-notice]').textContent='草稿已保存在本机';refresh();go('overview');};
}
document.onclick=e=>{if(e.target.closest('[data-save]'))flip(data.saved,id);if(e.target.closest('[data-like]'))flip(data.likes,id);if(e.target.closest('[data-subscribe]'))flip(data.subscriptions,mod==='watch'?v[1]:videos[0][1]);refresh();};
refresh();
</script></body></html>
