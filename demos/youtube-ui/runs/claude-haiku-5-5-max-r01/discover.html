<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星流视频 · 发现模块 · UI 原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: { 900: "#0b0c10", 800: "#14161d", 700: "#1d2029" }, flame: { 500: "#ff3b5c", 400: "#ff6b84" } },
          fontFamily: { sans: ["PingFang SC", "Microsoft YaHei", "system-ui", "sans-serif"] },
        },
      },
    };
  </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-ink-900 via-[#101320] to-ink-800 font-sans text-white antialiased">
  <header class="mx-auto max-w-6xl px-6 pt-10">
    <p class="text-sm font-medium text-flame-400">模块 3 / 5 · 发现</p>
    <h1 class="mt-2 text-3xl font-bold tracking-tight">星流视频 · 发现与直播</h1>
    <p class="mt-3 max-w-3xl text-sm leading-7 text-white/70">产品需求：按兴趣分类浏览热门内容，直播与排行榜并列，便于用户从“不知道看什么”快速进入。两个手机框相互独立。</p>
  </header>
  <main class="mx-auto mt-10 flex max-w-6xl flex-wrap justify-center gap-10 px-6 pb-16">
    <figure class="flex flex-col items-center">
      <div class="relative h-[812px] w-[375px] overflow-hidden rounded-[44px] bg-ink-900 shadow-2xl ring-8 ring-white/10">
        <div class="flex h-11 items-center justify-between px-6 pt-2 text-xs font-semibold"><span>9:41</span><span class="text-white/70">5G 100%</span></div>
        <div class="px-4 pt-2"><h2 class="text-xl font-bold">发现</h2></div>
        <div class="mt-4 grid grid-cols-4 gap-3 px-4 text-center text-[11px]">
          <div class="rounded-2xl bg-white/5 py-3 ring-1 ring-white/10"><img src="https://unpkg.com/lucide-static@latest/icons/music.svg" alt="" class="mx-auto h-6 w-6 invert" /><p class="mt-2">音乐</p></div>
          <div class="rounded-2xl bg-white/5 py-3 ring-1 ring-white/10"><img src="https://unpkg.com/lucide-static@latest/icons/gamepad-2.svg" alt="" class="mx-auto h-6 w-6 invert" /><p class="mt-2">游戏</p></div>
          <div class="rounded-2xl bg-white/5 py-3 ring-1 ring-white/10"><img src="https://unpkg.com/lucide-static@latest/icons/newspaper.svg" alt="" class="mx-auto h-6 w-6 invert" /><p class="mt-2">新闻</p></div>
          <div class="rounded-2xl bg-white/5 py-3 ring-1 ring-white/10"><img src="https://unpkg.com/lucide-static@latest/icons/flame.svg" alt="" class="mx-auto h-6 w-6 invert" /><p class="mt-2">热门</p></div>
        </div>
        <div class="mt-6 space-y-4 px-4">
          <p class="text-sm font-semibold">今日热门榜</p>
          <div class="flex items-center gap-3"><span class="w-5 text-center text-lg font-bold text-flame-500">1</span><img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=200&q=70" alt="" class="h-14 w-24 flex-none rounded-xl object-cover" /><div class="min-w-0"><p class="line-clamp-2 text-sm font-medium leading-5">夜间海浪的声音：十分钟放松</p><p class="mt-1 text-xs text-white/60">210 万次观看</p></div></div>
          <div class="flex items-center gap-3"><span class="w-5 text-center text-lg font-bold text-white/60">2</span><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=200&q=70" alt="" class="h-14 w-24 flex-none rounded-xl object-cover" /><div class="min-w-0"><p class="line-clamp-2 text-sm font-medium leading-5">山谷徒步记录：第一次露营的晨雾</p><p class="mt-1 text-xs text-white/60">168 万次观看</p></div></div>
          <div class="flex items-center gap-3"><span class="w-5 text-center text-lg font-bold text-white/60">3</span><img src="https://images.unsplash.com/photo-1499209974431-9dddcece7f88?w=200&q=70" alt="" class="h-14 w-24 flex-none rounded-xl object-cover" /><div class="min-w-0"><p class="line-clamp-2 text-sm font-medium leading-5">三分钟学会晨间拍照的光线技巧</p><p class="mt-1 text-xs text-white/60">97 万次观看</p></div></div>
        </div>
        <nav class="absolute inset-x-0 bottom-0 flex h-16 items-center justify-around border-t border-white/10 bg-ink-900/95 text-[10px] text-white/70">
          <div class="flex flex-col items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/house.svg" alt="" class="h-5 w-5 invert" />首页</div>
          <div class="flex flex-col items-center gap-1 text-white"><img src="https://unpkg.com/lucide-static@latest/icons/compass.svg" alt="" class="h-5 w-5 invert" />发现</div>
          <div class="flex flex-col items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/list-video.svg" alt="" class="h-5 w-5 invert" />订阅</div>
          <div class="flex flex-col items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/user-round.svg" alt="" class="h-5 w-5 invert" />我的</div>
        </nav>
      </div>
      <figcaption class="mt-4 text-sm font-semibold">A · 发现首页：分类入口与热门榜</figcaption>
    </figure>

    <figure class="flex flex-col items-center">
      <div class="relative h-[812px] w-[375px] overflow-hidden rounded-[44px] bg-ink-900 shadow-2xl ring-8 ring-white/10">
        <div class="flex h-11 items-center justify-between px-6 pt-2 text-xs font-semibold"><span>9:41</span><span class="text-white/70">5G 100%</span></div>
        <div class="flex items-center justify-between px-4 pt-2"><h2 class="text-xl font-bold">直播</h2><span class="flex items-center gap-1.5 rounded-full bg-flame-500 px-3 py-1 text-[11px] font-semibold"><span class="h-1.5 w-1.5 rounded-full bg-white"></span>LIVE 18</span></div>
        <div class="mt-5 space-y-4 px-4">
          <div class="relative h-48 overflow-hidden rounded-3xl">
            <img src="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=800&q=70" alt="直播画面" class="h-full w-full object-cover" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
            <span class="absolute left-3 top-3 rounded bg-flame-500 px-2 py-0.5 text-[10px] font-semibold">直播中</span>
            <div class="absolute inset-x-4 bottom-4"><p class="text-sm font-semibold">夜跑路线分享与装备讨论</p><p class="mt-1 text-xs text-white/70">跑步小队 · 1.2 万人在看</p></div>
          </div>
          <div class="flex items-center gap-3 rounded-2xl bg-white/5 p-3 ring-1 ring-white/10"><img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=120&q=70" alt="" class="h-12 w-12 rounded-full object-cover" /><div class="flex-1"><p class="text-sm font-medium">山野手记</p><p class="text-xs text-white/60">正在直播 · 露营厨房</p></div><span class="rounded-full bg-white px-3 py-1.5 text-xs font-semibold text-ink-900">进入</span></div>
          <div class="flex items-center gap-3 rounded-2xl bg-white/5 p-3 ring-1 ring-white/10"><img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=120&q=70" alt="" class="h-12 w-12 rounded-full object-cover" /><div class="flex-1"><p class="text-sm font-medium">湖边乐队</p><p class="text-xs text-white/60">预告：周六晚 20:00 开播</p></div><span class="rounded-full bg-white/10 px-3 py-1.5 text-xs">预约</span></div>
        </div>
        <nav class="absolute inset-x-0 bottom-0 flex h-16 items-center justify-around border-t border-white/10 bg-ink-900/95 text-[10px] text-white/70">
          <div class="flex flex-col items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/house.svg" alt="" class="h-5 w-5 invert" />首页</div>
          <div class="flex flex-col items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/compass.svg" alt="" class="h-5 w-5 invert" />发现</div>
          <div class="flex flex-col items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/list-video.svg" alt="" class="h-5 w-5 invert" />订阅</div>
          <div class="flex flex-col items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/user-round.svg" alt="" class="h-5 w-5 invert" />我的</div>
        </nav>
      </div>
      <figcaption class="mt-4 text-sm font-semibold">B · 直播页：直播卡片、频道入口与预约</figcaption>
    </figure>
  </main>
</body>
</html>
