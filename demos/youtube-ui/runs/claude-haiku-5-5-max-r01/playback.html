<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星流视频 · 播放模块 · UI 原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: { 900: "#0b0c10", 800: "#14161d", 700: "#1d2029" }, flame: { 500: "#ff3b5c", 400: "#ff6b84" } },
          fontFamily: { sans: ["PingFang SC", "Microsoft YaHei", "system-ui", "sans-serif"] },
        },
      },
    };
  </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-ink-900 via-[#101320] to-ink-800 font-sans text-white antialiased">
  <header class="mx-auto max-w-6xl px-6 pt-10">
    <p class="text-sm font-medium text-flame-400">模块 2 / 5 · 播放</p>
    <h1 class="mt-2 text-3xl font-bold tracking-tight">星流视频 · 播放页与评论</h1>
    <p class="mt-3 max-w-3xl text-sm leading-7 text-white/70">产品需求：播放时间不被打断，互动入口在拇指可达的位置，评论以底部浮层展开且不遮挡画面主体。两个手机框相互独立。</p>
  </header>
  <main class="mx-auto mt-10 flex max-w-6xl flex-wrap justify-center gap-10 px-6 pb-16">
    <figure class="flex flex-col items-center">
      <div class="relative h-[812px] w-[375px] overflow-hidden rounded-[44px] bg-ink-900 shadow-2xl ring-8 ring-white/10">
        <div class="flex h-11 items-center justify-between px-6 pt-2 text-xs font-semibold"><span>9:41</span><span class="text-white/70">5G 100%</span></div>
        <div class="relative h-56">
          <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=900&q=75" alt="海边视频封面" class="h-full w-full object-cover" />
          <div class="absolute inset-0 flex items-center justify-center"><span class="flex h-14 w-14 items-center justify-center rounded-full bg-black/40 ring-1 ring-white/30 backdrop-blur-md"><img src="https://unpkg.com/lucide-static@latest/icons/play.svg" alt="播放" class="h-6 w-6 invert" /></span></div>
          <div class="absolute inset-x-0 bottom-0 px-3 pb-2"><div class="h-1 rounded-full bg-white/25"><div class="h-1 w-[38%] rounded-full bg-flame-500"></div></div><div class="mt-1 flex justify-between text-[10px] text-white/80"><span>04:32</span><span>12:48</span></div></div>
        </div>
        <div class="space-y-4 px-4 pt-4">
          <div>
            <p class="text-base font-semibold leading-6">海岸线的一天：用 48 小时走完三座港口</p>
            <p class="mt-1 text-xs text-white/60">128 万次观看 · 2 天前 · #旅行 #海岸</p>
          </div>
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3"><img src="https://images.unsplash.com/photo-1499209974431-9dddcece7f88?w=80&q=70" alt="频道头像" class="h-10 w-10 rounded-full object-cover" /><div><p class="text-sm font-semibold">旅行星球</p><p class="text-xs text-white/60">86 万订阅</p></div></div>
            <span class="rounded-full bg-white px-4 py-2 text-xs font-semibold text-ink-900">订阅</span>
          </div>
          <div class="flex gap-2 text-xs">
            <span class="flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-2"><img src="https://unpkg.com/lucide-static@latest/icons/thumbs-up.svg" alt="" class="h-4 w-4 invert" />3.2 万</span>
            <span class="flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-2"><img src="https://unpkg.com/lucide-static@latest/icons/share-2.svg" alt="" class="h-4 w-4 invert" />分享</span>
            <span class="flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-2"><img src="https://unpkg.com/lucide-static@latest/icons/download.svg" alt="" class="h-4 w-4 invert" />下载</span>
            <span class="flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-2"><img src="https://unpkg.com/lucide-static@latest/icons/bookmark.svg" alt="" class="h-4 w-4 invert" />收藏</span>
          </div>
          <div class="rounded-2xl bg-white/5 p-3 ring-1 ring-white/10">
            <p class="text-xs text-white/60">评论 · 1,284</p>
            <p class="mt-2 text-sm leading-6 text-white/85">第二座港口的日落太治愈了，求下一期！</p>
          </div>
          <p class="text-xs font-semibold text-white/70">接下来播放</p>
          <div class="flex gap-3"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=240&q=70" alt="" class="h-16 w-28 flex-none rounded-xl object-cover" /><p class="text-xs leading-5 text-white/85">周末露营装备清单，新手也能一次带齐</p></div>
        </div>
        <nav class="absolute inset-x-0 bottom-0 flex h-16 items-center justify-around border-t border-white/10 bg-ink-900/95 text-[10px] text-white/70">
          <div class="flex flex-col items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/house.svg" alt="" class="h-5 w-5 invert" />首页</div>
          <div class="flex flex-col items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/compass.svg" alt="" class="h-5 w-5 invert" />发现</div>
          <div class="flex flex-col items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/list-video.svg" alt="" class="h-5 w-5 invert" />订阅</div>
          <div class="flex flex-col items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/user-round.svg" alt="" class="h-5 w-5 invert" />我的</div>
        </nav>
      </div>
      <figcaption class="mt-4 text-sm font-semibold">A · 播放页：竖屏播放器、互动条与接下来播放</figcaption>
    </figure>

    <figure class="flex flex-col items-center">
      <div class="relative h-[812px] w-[375px] overflow-hidden rounded-[44px] bg-ink-900 shadow-2xl ring-8 ring-white/10">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=900&q=60" alt="" class="absolute inset-x-0 top-0 h-80 w-full object-cover opacity-40" />
        <div class="absolute inset-x-0 bottom-0 top-44 rounded-t-[28px] bg-ink-800/90 backdrop-blur-2xl ring-1 ring-white/10">
          <div class="mx-auto mt-3 h-1 w-10 rounded-full bg-white/30"></div>
          <div class="flex items-center justify-between px-5 pt-4">
            <p class="text-sm font-semibold">评论 · 1,284</p>
            <img src="https://unpkg.com/lucide-static@latest/icons/x.svg" alt="关闭评论" class="h-5 w-5 invert" />
          </div>
          <div class="mt-4 space-y-4 px-5 text-sm">
            <div class="flex gap-3"><img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=80&q=70" alt="" class="h-8 w-8 flex-none rounded-full object-cover" /><div><p class="text-xs text-white/60">山野手记 · 1 小时前</p><p class="mt-1 leading-6">第二座港口的日落太治愈了，求下一期！</p><p class="mt-2 flex gap-4 text-xs text-white/60"><span class="flex items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/thumbs-up.svg" alt="" class="h-3.5 w-3.5 invert" />816</span><span>回复</span></p></div></div>
            <div class="flex gap-3"><span class="h-8 w-8 flex-none rounded-full bg-flame-500/80"></span><div><p class="text-xs text-white/60">小鹿 · 3 小时前</p><p class="mt-1 leading-6">镜头切换节奏很舒服，配乐也很贴切。</p></div></div>
          </div>
          <div class="absolute inset-x-4 bottom-4 flex items-center gap-2 rounded-full bg-white/10 px-4 py-2.5 ring-1 ring-white/15 backdrop-blur-xl">
            <span class="flex-1 text-sm text-white/50">添加评论…</span>
            <img src="https://unpkg.com/lucide-static@latest/icons/send.svg" alt="发送" class="h-5 w-5 invert" />
          </div>
        </div>
      </div>
      <figcaption class="mt-4 text-sm font-semibold">B · 评论浮层：毛玻璃底部面板，不遮挡画面主体</figcaption>
    </figure>
  </main>
</body>
</html>
