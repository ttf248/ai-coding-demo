<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星流视频 · 首页模块 · UI 原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: { 900: "#0b0c10", 800: "#14161d", 700: "#1d2029" }, flame: { 500: "#ff3b5c", 400: "#ff6b84" } },
          fontFamily: { sans: ["PingFang SC", "Microsoft YaHei", "system-ui", "sans-serif"] },
        },
      },
    };
  </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-ink-900 via-[#101320] to-ink-800 font-sans text-white antialiased">
  <header class="mx-auto max-w-6xl px-6 pt-10">
    <p class="text-sm font-medium text-flame-400">模块 1 / 5 · 首页</p>
    <h1 class="mt-2 text-3xl font-bold tracking-tight">星流视频 · 首页与搜索</h1>
    <p class="mt-3 max-w-3xl text-sm leading-7 text-white/70">产品需求：把推荐、搜索和频道订阅放在第一屏，减少首次找到内容的步骤。本文件包含两个独立的手机框：信息流首页与搜索浮层。</p>
  </header>
  <main class="mx-auto mt-10 flex max-w-6xl flex-wrap justify-center gap-10 px-6 pb-16">
    <figure class="flex flex-col items-center">
      <div class="relative h-[812px] w-[375px] overflow-hidden rounded-[44px] bg-ink-900 shadow-2xl ring-8 ring-white/10">
        <div class="flex h-11 items-center justify-between px-6 pt-2 text-xs font-semibold"><span>9:41</span><span class="text-white/70">5G 100%</span></div>
        <div class="flex items-center justify-between px-4 pb-3 pt-1">
          <span class="text-lg font-bold tracking-tight"><span class="text-flame-500">●</span> 星流</span>
          <div class="flex items-center gap-4">
            <img src="https://unpkg.com/lucide-static@latest/icons/search.svg" alt="搜索" class="h-5 w-5 invert" />
            <img src="https://unpkg.com/lucide-static@latest/icons/bell.svg" alt="通知" class="h-5 w-5 invert" />
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=64&q=70" alt="头像" class="h-7 w-7 rounded-full object-cover" />
          </div>
        </div>
        <div class="flex gap-2 overflow-hidden px-4 pb-3 text-xs [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
          <span class="whitespace-nowrap rounded-lg bg-white px-3 py-1.5 font-medium text-ink-900">推荐</span>
          <span class="whitespace-nowrap rounded-lg bg-white/10 px-3 py-1.5 text-white/80">音乐</span>
          <span class="whitespace-nowrap rounded-lg bg-white/10 px-3 py-1.5 text-white/80">直播</span>
          <span class="whitespace-nowrap rounded-lg bg-white/10 px-3 py-1.5 text-white/80">游戏</span>
          <span class="whitespace-nowrap rounded-lg bg-white/10 px-3 py-1.5 text-white/80">新闻</span>
        </div>
        <div class="space-y-5 px-4">
          <article>
            <div class="relative h-44 overflow-hidden rounded-2xl">
              <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=800&q=70" alt="海岸日落" class="h-full w-full object-cover" />
              <span class="absolute bottom-2 right-2 rounded bg-black/75 px-1.5 py-0.5 text-[11px]">12:48</span>
            </div>
            <div class="mt-3 flex gap-3">
              <img src="https://images.unsplash.com/photo-1499209974431-9dddcece7f88?w=80&q=70" alt="频道头像" class="h-9 w-9 flex-none rounded-full object-cover" />
              <div class="min-w-0"><p class="line-clamp-2 text-sm font-semibold leading-5">海岸线的一天：用 48 小时走完三座港口</p><p class="mt-1 text-xs text-white/60">旅行星球 · 128 万次观看 · 2 天前</p></div>
            </div>
          </article>
          <article>
            <div class="relative h-44 overflow-hidden rounded-2xl">
              <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=70" alt="森林" class="h-full w-full object-cover" />
              <span class="absolute bottom-2 right-2 rounded bg-black/75 px-1.5 py-0.5 text-[11px]">08:15</span>
            </div>
            <div class="mt-3 flex gap-3">
              <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=80&q=70" alt="频道头像" class="h-9 w-9 flex-none rounded-full object-cover" />
              <div class="min-w-0"><p class="line-clamp-2 text-sm font-semibold leading-5">周末露营装备清单，新手也能一次带齐</p><p class="mt-1 text-xs text-white/60">山野手记 · 46 万次观看 · 5 小时前</p></div>
            </div>
          </article>
        </div>
        <nav class="absolute inset-x-0 bottom-0 flex h-16 items-center justify-around border-t border-white/10 bg-ink-900/95 text-[10px] text-white/70">
          <div class="flex flex-col items-center gap-1 text-white"><img src="https://unpkg.com/lucide-static@latest/icons/house.svg" alt="" class="h-5 w-5 invert" />首页</div>
          <div class="flex flex-col items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/compass.svg" alt="" class="h-5 w-5 invert" />发现</div>
          <div class="flex h-9 w-12 items-center justify-center rounded-xl bg-white text-ink-900"><img src="https://unpkg.com/lucide-static@latest/icons/plus.svg" alt="发布" class="h-5 w-5" /></div>
          <div class="flex flex-col items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/list-video.svg" alt="" class="h-5 w-5 invert" />订阅</div>
          <div class="flex flex-col items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/user-round.svg" alt="" class="h-5 w-5 invert" />我的</div>
        </nav>
      </div>
      <figcaption class="mt-4 text-sm font-semibold">A · 信息流首页：推荐分类、视频卡片与底部导航</figcaption>
    </figure>

    <figure class="flex flex-col items-center">
      <div class="relative h-[812px] w-[375px] overflow-hidden rounded-[44px] bg-gradient-to-b from-ink-700 to-ink-900 shadow-2xl ring-8 ring-white/10">
        <div class="absolute inset-0 bg-black/40"></div>
        <div class="relative px-4 pt-14">
          <div class="flex items-center gap-3 rounded-2xl bg-white/10 px-4 py-3 ring-1 ring-white/15 backdrop-blur-xl">
            <img src="https://unpkg.com/lucide-static@latest/icons/search.svg" alt="" class="h-5 w-5 invert" />
            <span class="text-sm text-white/90">海岸 日落 延时</span>
            <span class="ml-auto text-xs text-flame-400">取消</span>
          </div>
          <div class="mt-6 rounded-3xl bg-white/10 p-5 ring-1 ring-white/15 backdrop-blur-xl">
            <p class="text-xs text-white/60">最近搜索</p>
            <ul class="mt-3 space-y-3 text-sm">
              <li class="flex items-center gap-3"><img src="https://unpkg.com/lucide-static@latest/icons/history.svg" alt="" class="h-4 w-4 invert" />露营做饭</li>
              <li class="flex items-center gap-3"><img src="https://unpkg.com/lucide-static@latest/icons/history.svg" alt="" class="h-4 w-4 invert" />独立游戏开发</li>
            </ul>
          </div>
          <div class="mt-5 rounded-3xl bg-white/10 p-5 ring-1 ring-white/15 backdrop-blur-xl">
            <p class="text-xs text-white/60">热门搜索</p>
            <div class="mt-3 flex flex-wrap gap-2 text-xs">
              <span class="rounded-full bg-flame-500/20 px-3 py-1.5 text-flame-400">#夏日音乐节</span>
              <span class="rounded-full bg-white/10 px-3 py-1.5">周末烘焙</span>
              <span class="rounded-full bg-white/10 px-3 py-1.5">城市夜跑</span>
              <span class="rounded-full bg-white/10 px-3 py-1.5">耳机测评</span>
            </div>
          </div>
          <div class="mt-5 flex gap-2 text-xs [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
            <span class="rounded-full bg-white px-3 py-1.5 font-medium text-ink-900">全部</span>
            <span class="rounded-full bg-white/10 px-3 py-1.5">本周上传</span>
            <span class="rounded-full bg-white/10 px-3 py-1.5">时长 4 分钟以上</span>
          </div>
        </div>
      </div>
      <figcaption class="mt-4 text-sm font-semibold">B · 搜索浮层：玻璃拟态面板、最近与热门搜索</figcaption>
    </figure>
  </main>
</body>
</html>
