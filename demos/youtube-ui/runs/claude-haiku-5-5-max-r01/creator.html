<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星流视频 · 创作中心模块 · UI 原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: { 900: "#0b0c10", 800: "#14161d", 700: "#1d2029" }, flame: { 500: "#ff3b5c", 400: "#ff6b84" } },
          fontFamily: { sans: ["PingFang SC", "Microsoft YaHei", "system-ui", "sans-serif"] },
        },
      },
    };
  </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-ink-900 via-[#101320] to-ink-800 font-sans text-white antialiased">
  <header class="mx-auto max-w-6xl px-6 pt-10">
    <p class="text-sm font-medium text-flame-400">模块 5 / 5 · 创作中心</p>
    <h1 class="mt-2 text-3xl font-bold tracking-tight">星流视频 · 创作中心与上传</h1>
    <p class="mt-3 max-w-3xl text-sm leading-7 text-white/70">产品需求：创作者一眼看到近期数据与待处理事项，上传流程分步完成，状态反馈明确。两个手机框相互独立。</p>
  </header>
  <main class="mx-auto mt-10 flex max-w-6xl flex-wrap justify-center gap-10 px-6 pb-16">
    <figure class="flex flex-col items-center">
      <div class="relative h-[812px] w-[375px] overflow-hidden rounded-[44px] bg-ink-900 shadow-2xl ring-8 ring-white/10">
        <div class="flex h-11 items-center justify-between px-6 pt-2 text-xs font-semibold"><span>9:41</span><span class="text-white/70">5G 100%</span></div>
        <div class="flex items-center justify-between px-5 pt-2"><h2 class="text-xl font-bold">创作中心</h2><img src="https://unpkg.com/lucide-static@latest/icons/bell.svg" alt="通知" class="h-5 w-5 invert" /></div>
        <div class="mt-5 grid grid-cols-2 gap-3 px-5">
          <div class="rounded-2xl bg-gradient-to-br from-flame-500/30 to-white/5 p-4 ring-1 ring-white/10 backdrop-blur-xl"><p class="text-xs text-white/60">近 28 天播放</p><p class="mt-1 text-2xl font-bold">48.6 万</p><p class="mt-1 text-[11px] text-emerald-300">▲ 18%</p></div>
          <div class="rounded-2xl bg-white/5 p-4 ring-1 ring-white/10 backdrop-blur-xl"><p class="text-xs text-white/60">新增粉丝</p><p class="mt-1 text-2xl font-bold">1.2 万</p><p class="mt-1 text-[11px] text-emerald-300">▲ 6%</p></div>
        </div>
        <div class="mt-5 px-5">
          <p class="text-sm font-semibold">播放趋势</p>
          <div class="mt-3 flex h-24 items-end gap-2 rounded-2xl bg-white/5 p-3 ring-1 ring-white/10">
            <div class="w-full rounded-t bg-flame-500/60 h-[35%]"></div><div class="w-full rounded-t bg-flame-500/60 h-[50%]"></div><div class="w-full rounded-t bg-flame-500/60 h-[42%]"></div><div class="w-full rounded-t bg-flame-500 h-[80%]"></div><div class="w-full rounded-t bg-flame-500/60 h-[60%]"></div><div class="w-full rounded-t bg-flame-500/60 h-[70%]"></div><div class="w-full rounded-t bg-flame-500/60 h-[55%]"></div>
          </div>
        </div>
        <div class="mt-5 space-y-3 px-5">
          <p class="text-sm font-semibold">待处理</p>
          <div class="flex items-center gap-3 rounded-2xl bg-white/5 p-3 ring-1 ring-white/10"><img src="https://images.unsplash.com/photo-1499209974431-9dddcece7f88?w=160&q=70" alt="" class="h-12 w-20 flex-none rounded-lg object-cover" /><div class="min-w-0 flex-1"><p class="truncate text-sm">日出时的城市慢跑</p><p class="text-xs text-amber-300">字幕生成中 · 62%</p></div></div>
          <div class="flex items-center gap-3 rounded-2xl bg-white/5 p-3 ring-1 ring-white/10"><img src="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=160&q=70" alt="" class="h-12 w-20 flex-none rounded-lg object-cover" /><div class="min-w-0 flex-1"><p class="truncate text-sm">露营厨房：三道简餐</p><p class="text-xs text-emerald-300">已发布 · 3.1 万次观看</p></div></div>
        </div>
        <div class="absolute inset-x-5 bottom-6"><span class="flex w-full items-center justify-center gap-2 rounded-2xl bg-white py-3.5 text-sm font-semibold text-ink-900"><img src="https://unpkg.com/lucide-static@latest/icons/upload.svg" alt="" class="h-4 w-4" />上传视频</span></div>
      </div>
      <figcaption class="mt-4 text-sm font-semibold">A · 创作中心首页：数据概览、趋势与待处理事项</figcaption>
    </figure>

    <figure class="flex flex-col items-center">
      <div class="relative h-[812px] w-[375px] overflow-hidden rounded-[44px] bg-ink-900 shadow-2xl ring-8 ring-white/10">
        <div class="flex h-11 items-center justify-between px-6 pt-2 text-xs font-semibold"><span>9:41</span><span class="text-white/70">5G 100%</span></div>
        <div class="flex items-center justify-between px-5 pt-2"><img src="https://unpkg.com/lucide-static@latest/icons/x.svg" alt="取消" class="h-5 w-5 invert" /><h2 class="font-semibold">上传视频</h2><span class="text-sm font-semibold text-flame-400">发布</span></div>
        <div class="mt-5 space-y-5 px-5">
          <div class="flex h-44 flex-col items-center justify-center gap-3 rounded-3xl border-2 border-dashed border-white/25 bg-white/5 text-center">
            <img src="https://unpkg.com/lucide-static@latest/icons/camera.svg" alt="" class="h-8 w-8 invert" />
            <p class="text-sm font-medium">拖入或选择视频文件</p>
            <p class="text-xs text-white/50">支持 MP4 / MOV，最长 60 分钟</p>
          </div>
          <div class="rounded-2xl bg-white/5 p-4 ring-1 ring-white/10">
            <div class="flex items-center justify-between text-xs"><span class="text-white/70">上传进度</span><span class="text-emerald-300">84%</span></div>
            <div class="mt-2 h-1.5 rounded-full bg-white/15"><div class="h-1.5 w-[84%] rounded-full bg-emerald-400"></div></div>
            <p class="mt-2 text-[11px] text-white/50">已完成：视频转码 · 等待：字幕生成</p>
          </div>
          <label class="block text-xs text-white/60">标题（最多 100 字）
            <div class="mt-2 rounded-xl bg-white/10 px-4 py-3 text-sm text-white ring-1 ring-white/15">日出时的城市慢跑 · 第一次全程路线</div>
          </label>
          <div class="grid grid-cols-2 gap-3 text-xs">
            <div class="rounded-xl bg-white/10 px-4 py-3 ring-1 ring-white/15"><p class="text-white/60">可见范围</p><p class="mt-1 font-medium">公开</p></div>
            <div class="rounded-xl bg-white/10 px-4 py-3 ring-1 ring-white/15"><p class="text-white/60">定时发布</p><p class="mt-1 font-medium">立即</p></div>
          </div>
          <div class="flex items-start gap-3 rounded-2xl border border-amber-400/30 bg-amber-400/10 p-3 text-xs leading-5 text-amber-200"><img src="https://unpkg.com/lucide-static@latest/icons/triangle-alert.svg" alt="" class="mt-0.5 h-4 w-4 flex-none" />检测到背景音乐可能存在版权风险，建议替换后再发布。</div>
        </div>
      </div>
      <figcaption class="mt-4 text-sm font-semibold">B · 上传页：分步表单、进度反馈与风险提示</figcaption>
    </figure>
  </main>
</body>
</html>
