<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星流视频 · 个人中心模块 · UI 原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: { 900: "#0b0c10", 800: "#14161d", 700: "#1d2029" }, flame: { 500: "#ff3b5c", 400: "#ff6b84" } },
          fontFamily: { sans: ["PingFang SC", "Microsoft YaHei", "system-ui", "sans-serif"] },
        },
      },
    };
  </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-ink-900 via-[#101320] to-ink-800 font-sans text-white antialiased">
  <header class="mx-auto max-w-6xl px-6 pt-10">
    <p class="text-sm font-medium text-flame-400">模块 4 / 5 · 个人中心</p>
    <h1 class="mt-2 text-3xl font-bold tracking-tight">星流视频 · 我的与设置</h1>
    <p class="mt-3 max-w-3xl text-sm leading-7 text-white/70">产品需求：个人资料、观看历史与设置集中管理，常用项一次点击可达，隐私选项清晰可见。两个手机框相互独立。</p>
  </header>
  <main class="mx-auto mt-10 flex max-w-6xl flex-wrap justify-center gap-10 px-6 pb-16">
    <figure class="flex flex-col items-center">
      <div class="relative h-[812px] w-[375px] overflow-hidden rounded-[44px] bg-ink-900 shadow-2xl ring-8 ring-white/10">
        <div class="flex h-11 items-center justify-between px-6 pt-2 text-xs font-semibold"><span>9:41</span><span class="text-white/70">5G 100%</span></div>
        <div class="px-5 pt-3">
          <div class="flex items-center gap-4">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=200&q=70" alt="头像" class="h-16 w-16 rounded-full object-cover ring-2 ring-white/20" />
            <div><p class="text-lg font-bold">林小禾</p><p class="mt-0.5 text-xs text-white/60">@linxiaohe · 生活记录</p></div>
          </div>
          <div class="mt-5 grid grid-cols-3 gap-3 rounded-2xl bg-white/5 p-4 text-center ring-1 ring-white/10">
            <div><p class="text-lg font-bold">86</p><p class="text-[11px] text-white/60">视频</p></div>
            <div><p class="text-lg font-bold">12.4 万</p><p class="text-[11px] text-white/60">粉丝</p></div>
            <div><p class="text-lg font-bold">36 万</p><p class="text-[11px] text-white/60">获赞</p></div>
          </div>
          <div class="mt-5 flex gap-2 text-xs">
            <span class="flex-1 rounded-xl bg-white py-2.5 text-center font-semibold text-ink-900">编辑资料</span>
            <span class="flex-1 rounded-xl bg-white/10 py-2.5 text-center">创作者中心</span>
          </div>
          <div class="mt-5 flex justify-around border-b border-white/10 pb-2 text-xs text-white/60">
            <span class="border-b-2 border-white pb-2 font-semibold text-white">视频</span><span class="pb-2">收藏</span><span class="pb-2">历史</span>
          </div>
          <div class="mt-3 grid grid-cols-3 gap-1.5">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=240&q=70" alt="" class="aspect-[3/4] w-full rounded-lg object-cover" />
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=240&q=70" alt="" class="aspect-[3/4] w-full rounded-lg object-cover" />
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=240&q=70" alt="" class="aspect-[3/4] w-full rounded-lg object-cover" />
          </div>
        </div>
        <nav class="absolute inset-x-0 bottom-0 flex h-16 items-center justify-around border-t border-white/10 bg-ink-900/95 text-[10px] text-white/70">
          <div class="flex flex-col items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/house.svg" alt="" class="h-5 w-5 invert" />首页</div>
          <div class="flex flex-col items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/compass.svg" alt="" class="h-5 w-5 invert" />发现</div>
          <div class="flex flex-col items-center gap-1"><img src="https://unpkg.com/lucide-static@latest/icons/list-video.svg" alt="" class="h-5 w-5 invert" />订阅</div>
          <div class="flex flex-col items-center gap-1 text-white"><img src="https://unpkg.com/lucide-static@latest/icons/user-round.svg" alt="" class="h-5 w-5 invert" />我的</div>
        </nav>
      </div>
      <figcaption class="mt-4 text-sm font-semibold">A · 个人主页：资料、数据与作品网格</figcaption>
    </figure>

    <figure class="flex flex-col items-center">
      <div class="relative h-[812px] w-[375px] overflow-hidden rounded-[44px] bg-ink-900 shadow-2xl ring-8 ring-white/10">
        <div class="flex h-11 items-center justify-between px-6 pt-2 text-xs font-semibold"><span>9:41</span><span class="text-white/70">5G 100%</span></div>
        <div class="flex items-center justify-between px-5 pt-2"><img src="https://unpkg.com/lucide-static@latest/icons/arrow-left.svg" alt="返回" class="h-5 w-5 invert" /><h2 class="font-semibold">设置与历史</h2><span class="w-5"></span></div>
        <div class="mt-5 space-y-5 px-5">
          <div>
            <p class="mb-2 text-xs font-semibold text-white/60">最近观看</p>
            <div class="flex items-center gap-3"><img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=200&q=70" alt="" class="h-14 w-24 flex-none rounded-xl object-cover" /><div class="min-w-0 flex-1"><p class="line-clamp-2 text-sm leading-5">夜间海浪的声音：十分钟放松</p><div class="mt-2 h-1 rounded-full bg-white/15"><div class="h-1 w-[62%] rounded-full bg-flame-500"></div></div></div></div>
          </div>
          <div class="divide-y divide-white/10 overflow-hidden rounded-2xl bg-white/5 ring-1 ring-white/10 text-sm">
            <div class="flex items-center gap-3 px-4 py-3.5"><img src="https://unpkg.com/lucide-static@latest/icons/bell.svg" alt="" class="h-5 w-5 invert" />通知设置<span class="ml-auto text-xs text-white/50">已开启</span></div>
            <div class="flex items-center gap-3 px-4 py-3.5"><img src="https://unpkg.com/lucide-static@latest/icons/eye.svg" alt="" class="h-5 w-5 invert" />观看记录<span class="ml-auto h-5 w-9 rounded-full bg-flame-500 p-0.5"><span class="block h-4 w-4 translate-x-4 rounded-full bg-white"></span></span></div>
            <div class="flex items-center gap-3 px-4 py-3.5"><img src="https://unpkg.com/lucide-static@latest/icons/shield.svg" alt="" class="h-5 w-5 invert" />隐私与安全<span class="ml-auto text-xs text-white/50">仅自己可见</span></div>
            <div class="flex items-center gap-3 px-4 py-3.5"><img src="https://unpkg.com/lucide-static@latest/icons/download.svg" alt="" class="h-5 w-5 invert" />离线缓存<span class="ml-auto text-xs text-white/50">2.3 GB</span></div>
          </div>
          <div class="rounded-2xl border border-white/10 bg-white/5 p-4 text-xs leading-6 text-white/70 backdrop-blur-xl">
            <p class="font-semibold text-white">隐私提示</p>
            <p class="mt-1">观看记录仅保存在本机，可随时清空；关闭后不会用于个性化推荐。</p>
          </div>
          <div class="flex items-center gap-3 rounded-2xl bg-white/5 px-4 py-3.5 text-sm text-flame-400 ring-1 ring-white/10"><img src="https://unpkg.com/lucide-static@latest/icons/log-out.svg" alt="" class="h-5 w-5" />退出登录</div>
        </div>
      </div>
      <figcaption class="mt-4 text-sm font-semibold">B · 设置与历史：观看记录、开关项与隐私提示</figcaption>
    </figure>
  </main>
</body>
</html>
