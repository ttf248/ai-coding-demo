<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简化电路实验台</title><style>*{box-sizing:border-box}body{margin:0;background:#101923;color:#e3ebef;font:15px/1.6 system-ui,sans-serif}header{padding:25px 5vw;border-bottom:1px solid #314352}h1{font-size:28px;margin:3px 0}p{margin:6px 0;color:#aabdc9}.badge{color:#76e6c1;font-size:12px;letter-spacing:2px}main{max-width:1350px;margin:auto;padding:22px;display:grid;grid-template-columns:265px minmax(0,1fr);gap:20px}aside,.panel{background:#192734;border:1px solid #334654;border-radius:14px;padding:18px;min-width:0}label{display:block;margin:12px 0}input,select,button{font:inherit;color:inherit;background:#263b4b;border:1px solid #486173;border-radius:7px;padding:8px;max-width:100%}input[type=range]{width:100%;padding:0;accent-color:#76e6c1}button{cursor:pointer;margin:3px 2px}button:hover{background:#38546a}button.primary{background:#2c7467}canvas,svg{display:block;width:100%;touch-action:none;border-radius:9px}#status{color:#76e6c1;padding:12px 0;overflow-wrap:anywhere}.row{display:flex;flex-wrap:wrap;gap:6px}.note{font-size:12px;color:#aabdc9}output{color:#76e6c1}a{color:#76e6c1}@media(max-width:700px){main{grid-template-columns:1fr;padding:12px}header{padding:16px}aside{padding:12px}h1{font-size:23px}}</style><header><div class="badge">CIRCUIT WORKSHOP / 03</div><h1>简化电路实验台</h1><p>连接一段导线，观察电压与电流。纯直流电阻模型。</p></header><main><aside><label>新增元件<select id="type"><option value="resistor">电阻</option><option value="battery">电池</option><option value="lamp">灯泡</option><option value="switch">开关</option></select></label><button id="add">放置元件</button><label>工具<select id="mode"><option value="move">选择 / 拖动</option><option value="delete">删除元件 / 导线</option></select></label><p id="selected"></p><label>数值（V / Ω）<input id="value" type="number" min=".001" max="100000" step="any"></label><button id="toggle">切换开关</button><button id="cancel">取消连线</button><div class="row"><button id="series">串联预设</button><button id="parallel">并联预设</button><button id="reset">重置</button></div><p class="note">点击两端子连线；拖动矩形移动元件。电池左端为正极。灯泡按固定电阻计算，亮度代表功率。闭合开关按零电压理想支路求解，显示支路电流。</p></aside><section class="panel"><svg id="board" viewBox="0 0 900 550" aria-label="可编辑的直流电路"></svg><div id="status" role="status"></div><p class="note">导线转角交叉不代表连接；只有明确连接的端子共享节点。电源短路或无唯一解时停止显示结果。</p></section></main><script>
const $=id=>document.getElementById(id),svg=$('board'),NS='http://www.w3.org/2000/svg';let parts=[],wires=[],selected=null,pending=null,drag=null,next=1,results={},error='';
function add(type,x=160+parts.length%4*150,y=110+Math.floor(parts.length/4)*110,value=type==='battery'?12:100){let p={id:next++,type,x,y,value,closed:true};parts.push(p);selected=p.id;solve();return p}
const terminal=(p,k)=>({x:p.x+(k?48:-48),y:p.y}),key=(p,k)=>p.id+':'+k;
function gauss(A,b){let n=b.length;for(let k=0;k<n;k++){let r=k;for(let i=k+1;i<n;i++)if(Math.abs(A[i][k])>Math.abs(A[r][k]))r=i;if(Math.abs(A[r][k])<1e-10)throw Error('电路无唯一解：检查悬空支路或相互冲突、重复的理想电源');[A[k],A[r]]=[A[r],A[k]];[b[k],b[r]]=[b[r],b[k]];let v=A[k][k];for(let j=k;j<n;j++)A[k][j]/=v;b[k]/=v;for(let i=0;i<n;i++)if(i!==k){let f=A[i][k];for(let j=k;j<n;j++)A[i][j]-=f*A[k][j];b[i]-=f*b[k]}}return b}
function solve(){results={};error='';try{let potential=new Map(),component=new Map(),parent=new Map();parts.forEach(p=>[0,1].forEach(k=>parent.set(key(p,k),key(p,k))));function root(a){if(parent.get(a)!==a)parent.set(a,root(parent.get(a)));return parent.get(a)}function join(a,b){if(parent.has(a)&&parent.has(b))parent.set(root(a),root(b))}
wires.forEach(w=>join(w[0],w[1]));
let nodes=[...new Set([...parent.keys()].map(root))],edges=parts.filter(p=>p.type!=='switch'||p.closed);for(let p of edges)if(p.type==='battery'&&root(key(p,0))===root(key(p,1)))throw Error('电源短路：理想导线跨接电池两端');
let adj=new Map(nodes.map(n=>[n,new Set()]));edges.forEach(p=>{let a=root(key(p,0)),b=root(key(p,1));adj.get(a).add(b);adj.get(b).add(a)});let visited=new Set();
for(let n of nodes){if(visited.has(n))continue;let group=[],queue=[n];while(queue.length){let a=queue.pop();if(visited.has(a))continue;visited.add(a);group.push(a);queue.push(...adj.get(a))}group.forEach(a=>component.set(a,n));let ps=edges.filter(p=>group.includes(root(key(p,0))));let batteries=ps.filter(p=>p.type==='battery'||p.type==='switch');if(!batteries.length){group.forEach(a=>potential.set(a,0));ps.forEach(p=>results[p.id]={v:0,i:0,power:0});continue}
let ref=group.at(-1),unknown=group.filter(a=>a!==ref),size=unknown.length+batteries.length,A=Array.from({length:size},()=>Array(size).fill(0)),b=Array(size).fill(0),idx=a=>unknown.indexOf(a);
for(let p of ps){let a=idx(root(key(p,0))),z=idx(root(key(p,1)));if(p.type==='battery'||p.type==='switch'){let j=unknown.length+batteries.indexOf(p);if(a>=0){A[a][j]+=1;A[j][a]+=1}if(z>=0){A[z][j]-=1;A[j][z]-=1}b[j]=p.type==='switch'?0:p.value}else{let g=1/p.value;if(a>=0)A[a][a]+=g;if(z>=0)A[z][z]+=g;if(a>=0&&z>=0){A[a][z]-=g;A[z][a]-=g}}}
let x=gauss(A,b),voltage=a=>{let i=idx(a);return i<0?0:x[i]};group.forEach(a=>potential.set(a,voltage(a)));for(let p of ps){let v=voltage(root(key(p,0)))-voltage(root(key(p,1))),i=(p.type==='battery'||p.type==='switch')?x[unknown.length+batteries.indexOf(p)]:v/p.value;results[p.id]={v,i,power:v*i}}}
parts.filter(p=>p.type==='switch'&&!p.closed).forEach(p=>{let a=root(key(p,0)),b=root(key(p,1));results[p.id]={v:component.get(a)===component.get(b)?potential.get(a)-potential.get(b):null,i:0,power:0}});
}catch(e){error=e.message;results={}}render()}
function el(name,attrs={},text){let e=document.createElementNS(NS,name);for(let [k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function render(){svg.replaceChildren();let defs=el('defs'),pattern=el('pattern',{id:'grid',width:24,height:24,patternUnits:'userSpaceOnUse'});pattern.append(el('circle',{cx:1,cy:1,r:1,fill:'#3c5363'}));defs.append(pattern);svg.append(defs,el('rect',{width:900,height:550,fill:'url(#grid)'}));
for(let w of wires){let coords=w.map(t=>{let [id,k]=t.split(':').map(Number),p=parts.find(p=>p.id===id);return p?terminal(p,k):null});if(coords.some(p=>!p))continue;let [a,b]=coords;let sa=w[0].endsWith(':0')?-1:1,sb=w[1].endsWith(':0')?-1:1,track=Math.abs(a.y-b.y)<25?Math.min(a.y,b.y)-55:(a.y+b.y)/2;let path=el('path',{d:'M'+a.x+' '+a.y+' H'+(a.x+sa*24)+' V'+track+' H'+(b.x+sb*24)+' V'+b.y+' H'+b.x,fill:'none',stroke:'#72cbbc','stroke-width':3});path.onclick=()=>{if($('mode').value==='delete'){wires=wires.filter(v=>v!==w);solve()}};svg.append(path)}
for(let p of parts){let group=el('g'),r=results[p.id];let body=el('rect',{x:p.x-34,y:p.y-22,width:68,height:44,rx:9,fill:p.type==='lamp'&&r?'rgb('+Math.min(255,60+Math.max(0,r.power)*30)+',170,70)':'#304b60',stroke:selected===p.id?'#eed186':'#88b6cd','stroke-width':2});
body.onpointerdown=e=>{e.stopPropagation();if($('mode').value==='delete'){parts=parts.filter(v=>v!==p);wires=wires.filter(w=>!w.some(t=>t.startsWith(p.id+':')));pending=null;selected=null;solve();return}selected=p.id;drag={id:p.id,point:point(e),x:p.x,y:p.y};svg.setPointerCapture(e.pointerId);render();syncEditor()};group.append(body);
let name={battery:'电池',resistor:'电阻',lamp:'灯泡',switch:p.closed?'闭合':'断开'}[p.type];group.append(el('text',{x:p.x,y:p.y+5,'text-anchor':'middle',fill:'#eef5ef','pointer-events':'none'},name));
for(let k of [0,1]){let t=terminal(p,k);group.append(el('line',{x1:p.x+(k?34:-34),y1:p.y,x2:t.x,y2:t.y,stroke:'#b3c8d7','stroke-width':2}));let circle=el('circle',{cx:t.x,cy:t.y,r:9,fill:pending===key(p,k)?'#ffcf70':'#76e6c1',stroke:'#122b36','stroke-width':2});circle.onpointerdown=e=>{e.stopPropagation();let tkey=key(p,k);if(pending&&pending!==tkey){if(!wires.some(w=>w.includes(pending)&&w.includes(tkey)))wires.push([pending,tkey]);pending=null;solve()}else{pending=pending===tkey?null:tkey;render()}};group.append(circle)}
let label=p.type==='battery'?p.value+' V':p.type==='switch'?'理想开关':p.value+' Ω';group.append(el('text',{x:p.x,y:p.y-32,'text-anchor':'middle',fill:'#a9c5d6','font-size':12},label));
if(r){let txt=(r.v===null?'浮置':r.v.toFixed(3))+' V · '+Math.abs(r.i).toFixed(4)+' A '+(r.i>=0?'左→右':'右→左');group.append(el('text',{x:p.x,y:p.y+43,'text-anchor':'middle',fill:'#e4cf91','font-size':11},txt))}
svg.append(group)}
$('status').textContent=error|| (pending?'已选择端子，请点击另一端子连接':'电路已求解 · '+parts.length+' 个元件 / '+wires.length+' 条导线');syncEditor()}
function syncEditor(){let p=parts.find(p=>p.id===selected);$('selected').textContent=p?({battery:'电池',resistor:'电阻',lamp:'灯泡',switch:'开关'}[p.type]+' #'+p.id):'未选中元件';$('value').disabled=!p||p.type==='switch';if(p)$('value').value=p.value;$('toggle').disabled=!p||p.type!=='switch'}
function point(e){let r=svg.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*900,y:(e.clientY-r.top)/r.height*550}}
svg.onpointermove=e=>{if(!drag)return;let p=parts.find(p=>p.id===drag.id),q=point(e);p.x=Math.max(55,Math.min(845,drag.x+q.x-drag.point.x));p.y=Math.max(55,Math.min(485,drag.y+q.y-drag.point.y));render()};svg.onpointerup=svg.onpointercancel=()=>drag=null;
$('add').onclick=()=>add($('type').value);$('value').onchange=()=>{let p=parts.find(p=>p.id===selected),v=Number($('value').value);if(p&&Number.isFinite(v)&&v>0&&v<=100000){p.value=v;solve()}else{$('status').textContent='请输入大于零且不超过 100000 的数值';syncEditor()}};$('toggle').onclick=()=>{let p=parts.find(p=>p.id===selected);if(p?.type==='switch'){p.closed=!p.closed;solve()}};
$('cancel').onclick=()=>{pending=null;render()};function preset(kind){parts=[];wires=[];next=1;pending=null;let a=add('battery',160,160,12),b=add('resistor',460,140,100),c=add('resistor',460,320,200),sw=add('switch',180,390);let wire=(p,k,q,j)=>wires.push([key(p,k),key(q,j)]);
if(kind==='parallel'){wire(a,0,b,0);wire(a,0,c,0);wire(b,1,c,1);wire(c,1,sw,0);wire(sw,1,a,1)}else{wire(a,0,b,0);wire(b,1,c,0);wire(c,1,sw,0);wire(sw,1,a,1)}selected=a.id;solve()}
$('series').onclick=()=>preset('series');$('parallel').onclick=()=>preset('parallel');$('reset').onclick=()=>preset('series');preset('series');window.lab={preset,solve,add,get parts(){return parts},get wires(){return wires},get results(){return results},get error(){return error}};
</script></html>
