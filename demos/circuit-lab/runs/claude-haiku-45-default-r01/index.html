<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简化电路实验台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }

        .container {
            max-width: 390px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .canvas-area {
            flex: 1;
            border-right: 1px solid #e5e7eb;
            position: relative;
            overflow: hidden;
            background: #f9fafb;
            touch-action: none;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: white;
        }

        .sidebar {
            width: 120px;
            background: #f3f4f6;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 8px 0;
        }

        .sidebar-section {
            padding: 8px;
        }

        .sidebar-title {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .component-btn {
            width: 100%;
            padding: 8px;
            margin-bottom: 6px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            color: #374151;
            transition: all 0.2s;
        }

        .component-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .footer {
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
            padding: 12px 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .info-panel {
            display: none;
            position: absolute;
            top: 10px;
            right: 130px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 100;
            max-width: 150px;
        }

        .info-panel.show {
            display: block;
        }

        @media (max-width: 500px) {
            .sidebar {
                width: 100px;
                padding: 4px 0;
            }

            .component-btn {
                padding: 6px;
                font-size: 11px;
                margin-bottom: 4px;
            }

            .footer {
                grid-template-columns: 1fr;
            }

            .info-panel {
                right: 105px;
                max-width: 120px;
            }
        }

        /* 加载状态 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 50;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 提示信息 */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s;
            max-width: 90%;
        }

        .toast.show {
            opacity: 1;
        }

        .preset-btns {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }

        .preset-btns .btn {
            flex: 1;
            padding: 6px;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ 电路实验台</h1>
            <p>直流电路模拟 | 支持手指拖拽和连线</p>
        </div>

        <div class="main-content">
            <div class="canvas-area">
                <canvas id="canvas"></canvas>
                <div id="infoPanel" class="info-panel"></div>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                </div>
            </div>

            <div class="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-title">电源</div>
                    <button class="component-btn" data-component="battery">🔋 电池</button>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">元件</div>
                    <button class="component-btn" data-component="resistor">⟳ 电阻</button>
                    <button class="component-btn" data-component="bulb">💡 灯泡</button>
                    <button class="component-btn" data-component="switch">🔘 开关</button>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">工具</div>
                    <button class="component-btn" data-component="wire">📌 连线</button>
                    <button class="component-btn" data-component="delete">🗑️ 删除</button>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="preset-btns">
                <button class="btn" id="seriesPreset">⎯ 串联</button>
                <button class="btn" id="parallelPreset">⊥ 并联</button>
            </div>
            <button class="btn btn-danger" id="resetBtn">🔄 重置</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // 电路模拟引擎
        class CircuitSimulator {
            constructor() {
                this.components = [];
                this.connections = [];
                this.selectedComponent = null;
                this.mode = 'select';
                this.draggingComponent = null;
                this.connectingFrom = null;

                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.setupCanvas();
                this.setupEventListeners();
                this.animate();
            }

            setupCanvas() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
            }

            setupEventListeners() {
                window.addEventListener('resize', () => this.setupCanvas());
                this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));
                this.canvas.addEventListener('click', (e) => this.handleClick(e));

                // 触摸事件
                this.canvas.addEventListener('touchstart', (e) => this.handleTouchStart(e));
                this.canvas.addEventListener('touchmove', (e) => this.handleTouchMove(e));
                this.canvas.addEventListener('touchend', (e) => this.handleTouchEnd(e));

                // 侧边栏按钮
                document.querySelectorAll('.component-btn').forEach(btn => {
                    btn.addEventListener('click', () => this.selectMode(btn.dataset.component));
                });

                document.getElementById('resetBtn').addEventListener('click', () => this.reset());
                document.getElementById('seriesPreset').addEventListener('click', () => this.createSeriesPreset());
                document.getElementById('parallelPreset').addEventListener('click', () => this.createParallelPreset());
            }

            selectMode(mode) {
                this.mode = mode;
                this.connectingFrom = null;
                this.showToast(`模式: ${this.getModeLabel(mode)}`);
            }

            getModeLabel(mode) {
                const labels = {
                    battery: '放置电池',
                    resistor: '放置电阻',
                    bulb: '放置灯泡',
                    switch: '放置开关',
                    wire: '连接元件',
                    delete: '删除元件',
                };
                return labels[mode] || mode;
            }

            handleMouseDown(e) {
                const pos = this.getMousePos(e);
                if (this.mode === 'delete') {
                    this.deleteComponentAt(pos);
                } else if (this.mode === 'wire') {
                    this.startConnection(pos);
                } else if (['battery', 'resistor', 'bulb', 'switch'].includes(this.mode)) {
                    this.draggingComponent = this.getComponentAt(pos);
                    if (this.draggingComponent) {
                        this.selectedComponent = this.draggingComponent;
                    }
                }
            }

            handleMouseMove(e) {
                const pos = this.getMousePos(e);
                if (this.draggingComponent) {
                    this.draggingComponent.x = pos.x;
                    this.draggingComponent.y = pos.y;
                    this.clearDeadConnections();
                }
            }

            handleMouseUp(e) {
                if (this.draggingComponent) {
                    this.draggingComponent = null;
                    this.showComponentInfo();
                }
            }

            handleClick(e) {
                const pos = this.getMousePos(e);

                if (this.mode === 'wire' && this.connectingFrom) {
                    this.endConnection(pos);
                } else if (['battery', 'resistor', 'bulb', 'switch'].includes(this.mode)) {
                    const existing = this.getComponentAt(pos);
                    if (!existing) {
                        this.addComponent(this.mode, pos.x, pos.y);
                    }
                }
            }

            handleTouchStart(e) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY
                });
                this.canvas.dispatchEvent(mouseEvent);
            }

            handleTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY
                });
                this.canvas.dispatchEvent(mouseEvent);
            }

            handleTouchEnd(e) {
                const mouseEvent = new MouseEvent('mouseup', {});
                this.canvas.dispatchEvent(mouseEvent);
            }

            getMousePos(e) {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            addComponent(type, x, y) {
                const component = {
                    id: Math.random().toString(36).substr(2, 9),
                    type,
                    x,
                    y,
                    width: 40,
                    height: 30,
                    value: type === 'battery' ? 12 : type === 'resistor' ? 100 : type === 'bulb' ? 100 : 0,
                    voltage: 0,
                    current: 0,
                    isClosed: type === 'switch' ? true : null,
                };
                this.components.push(component);
                this.showToast(`已添加 ${type}`);
                this.selectedComponent = component;
            }

            getComponentAt(pos) {
                for (let i = this.components.length - 1; i >= 0; i--) {
                    const comp = this.components[i];
                    if (pos.x >= comp.x - comp.width/2 && pos.x <= comp.x + comp.width/2 &&
                        pos.y >= comp.y - comp.height/2 && pos.y <= comp.y + comp.height/2) {
                        return comp;
                    }
                }
                return null;
            }

            deleteComponentAt(pos) {
                const comp = this.getComponentAt(pos);
                if (comp) {
                    this.components = this.components.filter(c => c.id !== comp.id);
                    this.connections = this.connections.filter(
                        conn => conn.from !== comp.id && conn.to !== comp.id
                    );
                    this.showToast('已删除元件');
                    this.selectedComponent = null;
                }
            }

            startConnection(pos) {
                const comp = this.getComponentAt(pos);
                if (comp) {
                    this.connectingFrom = comp;
                    this.showToast('选择目标元件...');
                }
            }

            endConnection(pos) {
                const comp = this.getComponentAt(pos);
                if (comp && comp !== this.connectingFrom) {
                    const existing = this.connections.find(
                        c => (c.from === this.connectingFrom.id && c.to === comp.id) ||
                             (c.from === comp.id && c.to === this.connectingFrom.id)
                    );
                    if (!existing) {
                        this.connections.push({
                            from: this.connectingFrom.id,
                            to: comp.id
                        });
                        this.showToast('连接成功');
                    }
                }
                this.connectingFrom = null;
            }

            clearDeadConnections() {
                const compIds = new Set(this.components.map(c => c.id));
                this.connections = this.connections.filter(
                    conn => compIds.has(conn.from) && compIds.has(conn.to)
                );
            }

            simulateCircuit() {
                // 重置状态
                this.components.forEach(comp => {
                    comp.voltage = 0;
                    comp.current = 0;
                });

                // 简化求解：只处理单个电源的情况
                const batteries = this.components.filter(c => c.type === 'battery');
                if (batteries.length === 0) return;

                const battery = batteries[0];
                battery.voltage = battery.value;

                // 查找连接到电池的元件
                const connectedTo = (compId) => {
                    return this.connections
                        .filter(c => c.from === compId || c.to === compId)
                        .map(c => c.from === compId ? c.to : c.from);
                };

                // 递归计算电压和电流（简化模型）
                const visited = new Set();
                const calcVoltage = (compId, baseVoltage) => {
                    if (visited.has(compId)) return;
                    visited.add(compId);

                    const comp = this.components.find(c => c.id === compId);
                    if (!comp) return;

                    comp.voltage = baseVoltage;

                    if (comp.type === 'switch' && !comp.isClosed) {
                        return; // 开路
                    }

                    const totalResistance = this.getPathResistance(compId, battery.id);
                    if (totalResistance === Infinity) {
                        comp.current = 0;
                        return;
                    }

                    if (totalResistance > 0) {
                        comp.current = battery.value / totalResistance;
                    }

                    connectedTo(compId).forEach(nextId => {
                        if (!visited.has(nextId)) {
                            const nextComp = this.components.find(c => c.id === nextId);
                            const nextVoltage = comp.type === 'resistor' ? 
                                baseVoltage - (comp.current * comp.value) : baseVoltage;
                            calcVoltage(nextId, nextVoltage);
                        }
                    });
                };

                // 从电池开始计算
                const connectedIds = connectedTo(battery.id);
                connectedIds.forEach(id => calcVoltage(id, battery.value));
            }

            getPathResistance(fromId, toId, visited = new Set()) {
                if (fromId === toId) return 0;
                if (visited.has(fromId)) return Infinity;

                visited.add(fromId);
                const comp = this.components.find(c => c.id === fromId);

                if (!comp) return Infinity;
                if (comp.type === 'switch' && !comp.isClosed) return Infinity;

                const connectedIds = this.connections
                    .filter(c => c.from === fromId || c.to === fromId)
                    .map(c => c.from === fromId ? c.to : c.from)
                    .filter(id => !visited.has(id));

                if (connectedIds.includes(toId)) {
                    return (comp.type === 'resistor' || comp.type === 'bulb') ? comp.value : 0;
                }

                let minResistance = Infinity;
                for (const nextId of connectedIds) {
                    const nextResistance = this.getPathResistance(nextId, toId, new Set(visited));
                    if (nextResistance < Infinity) {
                        const totalResistance = ((comp.type === 'resistor' || comp.type === 'bulb') ? comp.value : 0) + nextResistance;
                        minResistance = Math.min(minResistance, totalResistance);
                    }
                }

                return minResistance;
            }

            showComponentInfo() {
                const panel = document.getElementById('infoPanel');
                if (this.selectedComponent) {
                    let info = `${this.selectedComponent.type}`;
                    if (this.selectedComponent.type === 'battery') {
                        info += `\nU = ${this.selectedComponent.value}V`;
                    } else if (this.selectedComponent.type === 'resistor' || this.selectedComponent.type === 'bulb') {
                        info += `\nR = ${this.selectedComponent.value}Ω`;
                    } else if (this.selectedComponent.type === 'switch') {
                        info += `\n${this.selectedComponent.isClosed ? '闭合' : '断开'}`;
                    }
                    info += `\nI = ${this.selectedComponent.current.toFixed(3)}A`;
                    info += `\nU = ${this.selectedComponent.voltage.toFixed(1)}V`;
                    panel.innerHTML = info;
                    panel.classList.add('show');
                } else {
                    panel.classList.remove('show');
                }
            }

            createSeriesPreset() {
                this.reset();
                this.addComponent('battery', 80, 100);
                this.addComponent('resistor', 80, 150);
                this.addComponent('resistor', 80, 200);
                this.addComponent('switch', 80, 250);
                const comps = this.components;
                this.connections.push(
                    { from: comps[0].id, to: comps[1].id },
                    { from: comps[1].id, to: comps[2].id },
                    { from: comps[2].id, to: comps[3].id },
                    { from: comps[3].id, to: comps[0].id }
                );
                this.showToast('串联预设已创建');
            }

            createParallelPreset() {
                this.reset();
                this.addComponent('battery', 80, 100);
                this.addComponent('resistor', 60, 180);
                this.addComponent('resistor', 100, 180);
                this.addComponent('switch', 80, 250);
                const comps = this.components;
                this.connections.push(
                    { from: comps[0].id, to: comps[1].id },
                    { from: comps[0].id, to: comps[2].id },
                    { from: comps[1].id, to: comps[3].id },
                    { from: comps[2].id, to: comps[3].id },
                    { from: comps[3].id, to: comps[0].id }
                );
                this.showToast('并联预设已创建');
            }

            reset() {
                this.components = [];
                this.connections = [];
                this.selectedComponent = null;
                this.connectingFrom = null;
                this.showToast('已重置');
            }

            animate() {
                this.simulateCircuit();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }

            draw() {
                // 清空画布
                this.ctx.fillStyle = 'white';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // 网格背景
                this.drawGrid();

                // 连线
                this.drawConnections();

                // 元件
                this.components.forEach(comp => this.drawComponent(comp));

                // 连接中的预览
                if (this.connectingFrom) {
                    this.ctx.strokeStyle = '#667eea';
                    this.ctx.lineWidth = 2;
                    this.ctx.setLineDash([5, 5]);
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.connectingFrom.x, this.connectingFrom.y);
                    // 使用鼠标位置作为结束点（简化）
                    this.ctx.stroke();
                    this.ctx.setLineDash([]);
                }

                this.showComponentInfo();
            }

            drawGrid() {
                this.ctx.strokeStyle = '#e5e7eb';
                this.ctx.lineWidth = 0.5;
                const gridSize = 20;
                for (let x = 0; x < this.canvas.width; x += gridSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, this.canvas.height);
                    this.ctx.stroke();
                }
                for (let y = 0; y < this.canvas.height; y += gridSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(this.canvas.width, y);
                    this.ctx.stroke();
                }
            }

            drawConnections() {
                this.ctx.strokeStyle = '#333';
                this.ctx.lineWidth = 2;
                this.connections.forEach(conn => {
                    const from = this.components.find(c => c.id === conn.from);
                    const to = this.components.find(c => c.id === conn.to);
                    if (from && to) {
                        this.ctx.beginPath();
                        this.ctx.moveTo(from.x, from.y);
                        this.ctx.lineTo(to.x, to.y);
                        this.ctx.stroke();
                    }
                });
            }

            drawComponent(comp) {
                const x = comp.x;
                const y = comp.y;
                const w = comp.width;
                const h = comp.height;

                // 背景
                if (comp === this.selectedComponent) {
                    this.ctx.fillStyle = '#fef3c7';
                    this.ctx.fillRect(x - w/2 - 4, y - h/2 - 4, w + 8, h + 8);
                }

                this.ctx.fillStyle = 'white';
                this.ctx.strokeStyle = '#333';
                this.ctx.lineWidth = 2;
                this.ctx.fillRect(x - w/2, y - h/2, w, h);
                this.ctx.strokeRect(x - w/2, y - h/2, w, h);

                // 内容
                this.ctx.fillStyle = '#333';
                this.ctx.font = '12px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';

                if (comp.type === 'battery') {
                    this.ctx.fillText('🔋', x, y - 8);
                    this.ctx.font = 'bold 10px Arial';
                    this.ctx.fillText(`${comp.value}V`, x, y + 8);
                } else if (comp.type === 'resistor') {
                    this.ctx.fillText('R', x, y - 8);
                    this.ctx.font = 'bold 10px Arial';
                    this.ctx.fillText(`${comp.value}Ω`, x, y + 8);
                } else if (comp.type === 'bulb') {
                    const brightness = Math.min(255, Math.max(0, comp.current * 100));
                    this.ctx.fillStyle = `rgb(255, ${Math.max(100, 255 - brightness)}, 0)`;
                    this.ctx.beginPath();
                    this.ctx.arc(x, y - 6, 6, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.strokeStyle = '#333';
                    this.ctx.stroke();
                } else if (comp.type === 'switch') {
                    this.ctx.fillText(comp.isClosed ? '✓' : '○', x, y);
                }

                // 电流指示
                if (Math.abs(comp.current) > 0.001) {
                    this.ctx.fillStyle = '#ef4444';
                    this.ctx.font = 'bold 9px Arial';
                    this.ctx.fillText(`${comp.current.toFixed(2)}A`, x, y + 20);
                }
            }

            showToast(message) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            }
        }

        // 初始化应用
        const simulator = new CircuitSimulator();

        // 为开关添加点击切换功能
        document.addEventListener('click', (e) => {
            if (e.target === simulator.canvas && simulator.selectedComponent && simulator.selectedComponent.type === 'switch') {
                simulator.selectedComponent.isClosed = !simulator.selectedComponent.isClosed;
                simulator.showToast(`开关已${simulator.selectedComponent.isClosed ? '闭合' : '断开'}`);
            }
        });
    </script>
</body>
</html>
