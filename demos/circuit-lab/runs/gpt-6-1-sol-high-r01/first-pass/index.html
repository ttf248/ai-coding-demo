<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简化电路实验台</title><style>
:root{--ink:#223a43;--muted:#6b8087;--green:#087f75;--line:#d5e2df}*{box-sizing:border-box}body{margin:0;background:#edf3ef;color:var(--ink);font:14px/1.6 system-ui,sans-serif}main{max-width:1450px;padding:30px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:30px;margin:4px 0}.eyebrow{letter-spacing:3px;font-size:11px;color:var(--green)}p{color:var(--muted);margin:6px 0}.badge{padding:8px 14px;border:1px solid var(--line);border-radius:30px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;min-width:0}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}button,select,input{font:inherit}button{background:#f1f6f3;border:1px solid #c9dad5;padding:8px 12px;color:var(--ink);border-radius:7px;cursor:pointer}button:hover,button.active{border-color:var(--green);color:var(--green)}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}.primary{background:var(--green);color:#fff}.primary:hover{color:#fff;background:#086e65}h2{font-size:15px;margin:0 0 13px}svg{width:100%;display:block;aspect-ratio:9/5.2;background:#f6faf7;border:1px solid var(--line);border-radius:10px;touch-action:none}.component{cursor:grab}.terminal{cursor:crosshair;fill:#fff;stroke:#087f75;stroke-width:3}.terminal.pending{fill:#e7b95d}.wire{stroke:#5f9189;stroke-width:4;fill:none;cursor:pointer}.wire:hover{stroke:#d08b41}.status{padding:12px;border-radius:9px;background:#edf7f3;color:var(--green);margin-top:16px}.status.error{background:#fff0e9;color:#a94f2b}label{display:block;margin:12px 0;color:var(--muted)}input{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:#fafcfa;color:var(--ink)}.note{font-size:12px;border-top:1px solid var(--line);padding-top:15px;margin-top:20px}.results{margin-top:16px;max-height:340px;overflow:auto}.result{padding:12px 0;border-bottom:1px solid var(--line)}.result b{display:block}.result span{font-size:12px;color:var(--muted)}.metric{font-size:25px;font-weight:600;color:var(--green)}.foot{font-size:12px;margin-top:12px}.pill{display:inline-block;font-size:11px;color:var(--green);background:#e4f3ec;border-radius:15px;padding:3px 8px;margin-bottom:10px}@media(max-width:850px){main{padding:16px}.layout{grid-template-columns:1fr}.card{padding:14px}h1{font-size:24px}.badge{display:none}.results{max-height:none}svg{min-height:250px}.toolbar button{padding:7px 9px}}
</style></head><body><main><header><div><div class="eyebrow">CIRCUIT FIELD NOTES / 02</div><h1>简化电路实验台</h1><p>连接端子，让电压与电流自己给出答案。</p></div><span class="badge">理想直流 · 实时求解</span></header><div class="layout"><section class="card"><div class="toolbar"><button data-add="battery">＋ 电池</button><button data-add="resistor">＋ 电阻</button><button data-add="switch">＋ 开关</button><button data-add="lamp">＋ 灯泡</button></div><div class="toolbar"><button id="series" class="primary">串联预设</button><button id="parallel">并联预设</button><button id="delete">删除选中</button><button id="cancel">取消连线</button><button id="reset">一键重置</button></div><svg id="board" viewBox="0 0 900 520" aria-label="电路画布，点击两个端子连线，拖动元件移动"></svg><div id="status" class="status" role="status"></div><p class="foot">点击两个圆形端子连线；点击导线可删除。拖动元件保留连线。点击元件查看参数，开关可在右侧切换。</p></section><aside class="card"><span class="pill">元件检查器</span><h2 id="selectedName">选择一个元件</h2><div id="inspector"><p>点选画布中的元件以修改参数。</p></div><div class="note">电源总输出电流</div><div class="metric" id="total">—</div><div class="results" id="results"></div><p class="note">方向以元件左端 A → 右端 B 为正。电池左端为正极；负电流表示从 B 流向 A。灯泡使用固定电阻，亮度按耗散功率映射，不代表真实灯丝温度。互不连接的电路各自取参考电位。</p></aside></div></main><script>
'use strict';const $=id=>document.getElementById(id),svg=$('board'),names={battery:'直流电池',resistor:'电阻',switch:'开关',lamp:'灯泡'};const state={components:[],wires:[],selected:null,pending:null,next:1,solution:null};
function add(type,x=170+Math.random()*560,y=110+Math.random()*290,value=type==='battery'?12:100){const c={id:state.next++,type,x,y,value,closed:true};state.components.push(c);state.selected=c.id;render();inspect();return c}
const key=(id,p)=>`${id}:${p}`;function point(c,p){return{x:c.x+(p==='a'?-55:55),y:c.y}}
function linear(a,b){const n=b.length,m=a.map((row,i)=>[...row,b[i]]);let rank=0,pivots=[];for(let col=0;col<n;col++){let best=rank;for(let r=rank;r<n;r++)if(Math.abs(m[r][col])>Math.abs(m[best]?.[col]||0))best=r;if(rank>=n||Math.abs(m[best][col])<1e-10)continue;[m[rank],m[best]]=[m[best],m[rank]];const p=m[rank][col];for(let j=col;j<=n;j++)m[rank][j]/=p;for(let r=0;r<n;r++)if(r!==rank){const f=m[r][col];for(let j=col;j<=n;j++)m[r][j]-=f*m[rank][j]}pivots.push(col);rank++}for(let r=rank;r<n;r++)if(Math.abs(m[r][n])>1e-8)return{error:'理想电源电压相互冲突，电路无解。'};if(rank<n)return{error:'电路无唯一解：理想电源环路中的电流无法确定。'};const x=new Array(n).fill(0);pivots.forEach((col,r)=>x[col]=m[r][n]);return{x}}
function solve(){const cs=state.components,parent=new Map();for(const c of cs)for(const p of ['a','b'])parent.set(key(c.id,p),key(c.id,p));function find(k){if(parent.get(k)!==k)parent.set(k,find(parent.get(k)));return parent.get(k)}function union(a,b){parent.set(find(a),find(b))}for(const w of state.wires)union(w.a,w.b);for(const c of cs)if(c.type==='switch'&&c.closed)union(key(c.id,'a'),key(c.id,'b'));const node=(c,p)=>find(key(c.id,p));for(const c of cs)if(c.type==='battery'&&node(c,'a')===node(c,'b'))return{error:Math.abs(c.value)>1e-9?'电源短路：理想导线连接了电池两极，不能计算有限电流。':'零电压电源被短接，其电流无唯一解。'};
const nodes=[...new Set([...parent.keys()].map(find))],group=new Map(nodes.map(n=>[n,n]));function root(n){if(group.get(n)!==n)group.set(n,root(group.get(n)));return group.get(n)}for(const c of cs)if(c.type!=='switch'){group.set(root(node(c,'a')),root(node(c,'b')))}const refs=new Set();for(const n of nodes)if(!refs.has(root(n)))refs.add(root(n));const volts=nodes.filter(n=>!refs.has(n)),vi=new Map(volts.map((n,i)=>[n,i])),sources=cs.filter(c=>c.type==='battery'),size=volts.length+sources.length,a=Array.from({length:size},()=>new Array(size).fill(0)),b=new Array(size).fill(0);
function put(r,c,v){if(r!==undefined&&c!==undefined)a[r][c]+=v}for(const c of cs){const i=vi.get(node(c,'a')),j=vi.get(node(c,'b'));if(c.type==='resistor'||c.type==='lamp'){if(!Number.isFinite(c.value)||c.value<=0)return{error:'电阻必须为有限正数。'};const g=1/c.value;put(i,i,g);put(j,j,g);put(i,j,-g);put(j,i,-g)}}sources.forEach((c,k)=>{const i=vi.get(node(c,'a')),j=vi.get(node(c,'b')),r=volts.length+k;put(i,r,1);put(j,r,-1);put(r,i,1);put(r,j,-1);b[r]=c.value});const result=linear(a,b);if(result.error)return result;const voltage=n=>vi.has(n)?result.x[vi.get(n)]:0,readings={};for(const c of cs){const na=node(c,'a'),nb=node(c,'b'),v=root(na)===root(nb)?voltage(na)-voltage(nb):null;let current=c.type==='battery'?result.x[volts.length+sources.indexOf(c)]:c.type==='switch'?c.closed?null:0:v/c.value;if(current!==null&&Math.abs(current)<1e-10)current=0;readings[c.id]={voltage:v,current,power:current===null||v===null?null:Math.abs(v*current)}}return{readings,total:sources.reduce((sum,c)=>sum+Math.max(0,-readings[c.id].current),0),error:null}}
function fmt(n,unit){return n===null?'未唯一确定':`${Number(n.toPrecision(5))} ${unit}`}
function render(){state.solution=solve();const r=state.solution.readings||{};let html='<defs><pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d9e6de"/></pattern></defs><rect width="900" height="520" fill="url(#dots)"/>';for(let i=0;i<state.wires.length;i++){const w=state.wires[i],parts=s=>s.split(':'),[ai,ap]=parts(w.a),[bi,bp]=parts(w.b),ac=state.components.find(c=>c.id===+ai),bc=state.components.find(c=>c.id===+bi);if(!ac||!bc)continue;const a=point(ac,ap),b=point(bc,bp);html+=`<path class="wire" data-wire="${i}" d="M${a.x},${a.y} L${(a.x+b.x)/2},${a.y} L${(a.x+b.x)/2},${b.y} L${b.x},${b.y}"/>`}
for(const c of state.components){let symbol='';if(c.type==='battery')symbol='<path d="M-12,-23 V23 M6,-13 V13"/><text x="-34" y="-15" stroke="none" font-size="17">+</text>';if(c.type==='resistor')symbol='<path d="M-35,0 L-28,-12 L-16,12 L-4,-12 L8,12 L20,-12 L32,12 L38,0"/>';if(c.type==='switch')symbol=`<path d="M-35,0 L25,${c.closed?0:-26} M25,0 H35"/><circle cx="-35" r="3"/><circle cx="35" r="3"/>`;if(c.type==='lamp'){const power=r[c.id]?.power||0;symbol=`<circle r="25" fill="rgba(250,190,50,${Math.min(.95,power/2)})"/><path d="M-17,-17 L17,17 M17,-17 L-17,17"/>`}
html+=`<g class="component" data-id="${c.id}" transform="translate(${c.x},${c.y})"><rect x="-75" y="-48" width="150" height="100" rx="10" fill="${c.id===state.selected?'#e1f1e9':'#ffffff'}" stroke="${c.id===state.selected?'#087f75':'#d7e5dc'}"/><g stroke="#27483f" stroke-width="3" fill="none"><path d="M-55,0 H-35 M35,0 H55"/>${symbol}</g><text y="-32" text-anchor="middle" font-size="12" fill="#406558">${names[c.type]} ${c.id}</text><text y="42" text-anchor="middle" font-size="12" fill="#406558">${c.type==='switch'?(c.closed?'闭合':'断开'):c.value+(c.type==='battery'?' V':' Ω')}</text><circle class="terminal ${state.pending===key(c.id,'a')?'pending':''}" data-terminal="${key(c.id,'a')}" cx="-55" cy="0" r="9"/><circle class="terminal ${state.pending===key(c.id,'b')?'pending':''}" data-terminal="${key(c.id,'b')}" cx="55" cy="0" r="9"/></g>`}svg.innerHTML=html;
$('status').classList.toggle('error',!!state.solution.error);$('status').textContent=state.solution.error||(state.pending?'已选择端子，请点击另一个端子完成连接。':'直流求解完成。各元件读数实时更新；无回路时电流为零。');$('total').textContent=state.solution.error?'—':fmt(state.solution.total,'A');$('results').innerHTML=state.components.map(c=>{const v=r[c.id];return`<div class="result"><b>${names[c.type]} ${c.id}</b><span>${v?`电压 ${fmt(v.voltage,'V')}<br>电流 ${fmt(v.current,'A')} ${v.current===null?'':v.current<0?'← B → A':v.current>0?'→ A → B':'· 无电流'}${c.type==='lamp'?'<br>功率 '+fmt(v.power,'W'):''}`:'电路异常，停止显示读数'}</span></div>`}).join('')}
function inspect(){const c=state.components.find(c=>c.id===state.selected);$('selectedName').textContent=c?`${names[c.type]} ${c.id}`:'选择一个元件';$('inspector').innerHTML=c?c.type==='switch'?`<button id="toggle">${c.closed?'断开开关':'闭合开关'}</button>`:`<label>${c.type==='battery'?'电压（V，允许反向负电压）':'电阻（Ω，必须大于零）'}<input id="value" type="number" step="any" value="${c.value}"></label><p id="valueError" role="alert"></p>`:'<p>点选画布中的元件以修改参数。</p>';if(!c)return;if(c.type==='switch')$('toggle').onclick=()=>{c.closed=!c.closed;render();inspect()};else $('value').onchange=()=>{const value=Number($('value').value);if(!$('value').value.trim()||!Number.isFinite(value)||(c.type!=='battery'&&value<=0)||Math.abs(value)>1e7){$('valueError').textContent='请输入有效数值，绝对值不超过 10000000，电阻须大于零。';return}c.value=value;render();$('valueError').textContent=''}}
function preset(kind){state.components=[];state.wires=[];state.next=1;state.pending=null;const b=add('battery',170,250,12),r1=add('resistor',450,150,100),r2=add('resistor',720,250,200),sw=add('switch',450,350);const wire=(a,p,b,q)=>state.wires.push({a:key(a.id,p),b:key(b.id,q)});if(kind==='parallel'){r2.x=450;r2.y=250;b.x=170;b.y=200;wire(b,'a',r1,'a');wire(r1,'a',r2,'a');wire(r1,'b',r2,'b');wire(r2,'b',sw,'a');wire(sw,'b',b,'b')}else{wire(b,'a',r1,'a');wire(r1,'b',r2,'a');wire(r2,'b',sw,'a');wire(sw,'b',b,'b')}state.selected=b.id;render();inspect()}
let drag=null;function coords(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*900,y:(e.clientY-r.top)/r.height*520}}svg.addEventListener('pointerdown',e=>{const terminal=e.target.closest('[data-terminal]');if(terminal){const k=terminal.dataset.terminal;if(state.pending&&state.pending!==k){if(!state.wires.some(w=>(w.a===k&&w.b===state.pending)||(w.b===k&&w.a===state.pending)))state.wires.push({a:state.pending,b:k});state.pending=null}else state.pending=state.pending===k?null:k;render();return}const wire=e.target.closest('[data-wire]');if(wire){state.wires.splice(+wire.dataset.wire,1);render();return}const el=e.target.closest('[data-id]');if(!el)return;state.selected=+el.dataset.id;const c=state.components.find(c=>c.id===state.selected),p=coords(e);drag={c,dx:p.x-c.x,dy:p.y-c.y};svg.setPointerCapture(e.pointerId);render();inspect()});svg.addEventListener('pointermove',e=>{if(!drag)return;const p=coords(e);drag.c.x=Math.max(80,Math.min(820,p.x-drag.dx));drag.c.y=Math.max(55,Math.min(465,p.y-drag.dy));render()});for(const type of ['pointerup','pointercancel'])svg.addEventListener(type,()=>drag=null);
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));$('series').onclick=()=>preset('series');$('parallel').onclick=()=>preset('parallel');$('reset').onclick=()=>preset('series');$('delete').onclick=()=>{state.components=state.components.filter(c=>c.id!==state.selected);state.wires=state.wires.filter(w=>!w.a.startsWith(state.selected+':')&&!w.b.startsWith(state.selected+':'));state.pending=null;state.selected=null;render();inspect()};$('cancel').onclick=()=>{state.pending=null;render()};preset('series');window.lab={state,solve,render,preset,add,key,linear};
</script></body></html>
