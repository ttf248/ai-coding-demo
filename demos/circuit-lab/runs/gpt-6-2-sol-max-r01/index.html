<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16212d" />
    <title>简化电路实验台</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #ebf1f9;
        --muted: #adbdcc;
        --line: #344557;
        --panel: #1d2a39;
        --accent: #9cdfd1;
        font:
          15px/1.5 "Microsoft YaHei",
          system-ui,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #16212d;
        color: var(--ink);
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      .layout,
      header {
        width: min(1278px, 100% - 48px);
        margin: auto;
      }
      header {
        padding: 27px 0 19px;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
      }
      h1 {
        font-size: clamp(25px, 4.2vw, 45px);
        line-height: 1.13;
        letter-spacing: -0.055em;
      }
      header p {
        font-size: 13px;
        color: var(--muted);
        margin-top: 7px;
      }
      header strong {
        font:
          12px ui-monospace,
          monospace;
        white-space: nowrap;
        color: var(--accent);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 268px;
        align-items: start;
        gap: 15px;
        padding-bottom: 36px;
      }
      .work,
      .inspector,
      .results {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .work,
      .inspector {
        padding: 12px;
      }
      .controls,
      .edit-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .controls {
        margin-bottom: 10px;
      }
      button,
      select,
      input {
        font: inherit;
      }
      button,
      select {
        color: inherit;
        background: #263747;
        border: 1px solid #41586b;
        border-radius: 6px;
        min-height: 40px;
        padding: 6px 10px;
      }
      button {
        cursor: pointer;
      }
      button:hover:not(:disabled),
      select:hover {
        border-color: var(--accent);
        background: #314958;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid #9cdfd1;
        outline-offset: 2px;
      }
      .stage {
        position: relative;
        aspect-ratio: 800/468;
        background-color: #101b27;
        background-image: radial-gradient(#446075 1px, transparent 1px);
        background-size: 20px 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        touch-action: none;
        user-select: none;
      }
      .stage svg.wires,
      .parts {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .wire-line {
        fill: none;
        stroke: #82c6c9;
        stroke-width: 3;
        stroke-linejoin: round;
        pointer-events: none;
      }
      .wire-line.selected {
        stroke: #ffda86;
        stroke-width: 5;
      }
      .wire-hit {
        fill: none;
        stroke: transparent;
        stroke-width: 17;
        pointer-events: stroke;
        cursor: pointer;
      }
      .parts {
        pointer-events: none;
      }
      .part {
        position: absolute;
        width: 15%;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        pointer-events: none;
      }
      button.body {
        min-height: 0;
        width: 81%;
        padding: 3px;
        color: #b9e4e6;
        cursor: grab;
        pointer-events: auto;
        touch-action: none;
      }
      .part.active button.body {
        border-color: #ffc86b;
        color: #ffe2a9;
        background: #36434c;
      }
      button.body svg {
        display: block;
        width: 100%;
        max-height: 42px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2.3;
        overflow: visible;
      }
      button.terminal {
        width: 26px;
        height: 26px;
        min-height: 0;
        border-radius: 50%;
        background: transparent;
        border: 0;
        padding: 0;
        display: grid;
        place-items: center;
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        pointer-events: auto;
      }
      button.terminal::before {
        content: "";
        width: 10px;
        height: 10px;
        border: 2px solid #9cdfd1;
        background: #16212d;
        border-radius: 50%;
      }
      button.terminal:hover {
        background: #92e8d532;
      }
      button.terminal.pending::before {
        background: #ffd17b;
        border-color: #ffd17b;
        box-shadow: 0 0 10px #ffd17b;
      }
      .part-label {
        position: absolute;
        top: 100%;
        white-space: nowrap;
        font-size: clamp(9px, 1.2vw, 13px);
        color: #bccee2;
        text-shadow: 0 1px 4px #000;
      }
      .tip {
        color: var(--muted);
        font-size: 12px;
        margin-top: 8px;
      }
      .side {
        display: grid;
        gap: 12px;
        min-width: 0;
      }
      h2 {
        font-size: 15px;
      }
      .inspector {
        display: grid;
        gap: 10px;
      }
      #selection {
        color: var(--accent);
        font-weight: 650;
      }
      #value-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #value-row[hidden],
      button[hidden] {
        display: none;
      }
      #value-row input {
        width: 92px;
        min-width: 0;
        padding: 6px;
        color: var(--ink);
        background: #16212d;
        border: 1px solid var(--line);
        border-radius: 5px;
      }
      #status {
        padding: 12px;
        color: var(--accent);
        font-size: 13px;
        border-bottom: 1px solid var(--line);
      }
      #status.bad {
        color: #ffc08b;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        text-align: left;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        padding: 6px 8px;
      }
      thead th {
        color: var(--muted);
        font-weight: 500;
      }
      tbody tr {
        border-top: 1px solid #34455788;
      }
      tbody tr.active {
        background: #2a4150;
      }
      td:last-child {
        white-space: nowrap;
      }
      .results .tip {
        padding: 0 9px 10px;
      }
      @media (max-width: 820px) {
        header,
        .layout {
          width: calc(100% - 24px);
        }
        header {
          align-items: start;
          padding-top: 20px;
        }
        header strong {
          padding-top: 5px;
        }
        .layout {
          grid-template-columns: 1fr;
        }
        .stage {
          aspect-ratio: 800/508;
        }
        .work {
          padding: 8px;
        }
        .controls button,
        .controls select {
          font-size: 12px;
          padding-inline: 7px;
        }
        button.body {
          padding: 2px;
        }
        button.terminal {
          width: 24px;
          height: 24px;
        }
      }
    </style>
    <script src="../../../../assets/analytics.js" defer></script>
  </head>
  <body>
    <header>
      <div>
        <h1>简化电路实验台</h1>
        <p>放置元件与导线，观察直流电路中的电压、电流和灯泡功率。</p>
      </div>
      <strong>DC / 直流</strong>
    </header>
    <main class="layout">
      <section class="work" aria-label="电路工作区">
        <div class="controls" id="toolbar">
          <button data-add="battery">＋ 电池</button
          ><button data-add="resistor">＋ 电阻</button
          ><button data-add="switch">＋ 开关</button
          ><button data-add="lamp">＋ 灯泡</button>
          <select id="preset" aria-label="电路预设">
            <option value="series">串联预设</option>
            <option value="parallel">并联预设</option>
            <option value="empty">空白电路</option>
          </select>
          <button id="reset">重置预设</button>
        </div>
        <div class="stage" id="stage">
          <svg
            class="wires"
            id="wires"
            viewBox="0 0 800 468"
            preserveAspectRatio="none"
            aria-hidden="true"
          ></svg>
          <div class="parts" id="parts"></div>
        </div>
        <p class="tip">
          依次点两个圆形端子连线，拖动元件可移动。点元件或导线后，在属性区删除。按
          Esc 取消接线。
        </p>
      </section>
      <aside class="side">
        <section class="inspector" aria-label="选中对象属性">
          <h2>属性</h2>
          <p id="selection">请选择元件或导线</p>
          <div class="edit-row">
            <label id="value-row" hidden
              ><span id="value-label">数值</span
              ><input id="value" type="number" step="any"
            /></label>
            <button id="toggle" hidden></button
            ><button id="delete" hidden>删除</button
            ><button id="cancel-wire" hidden>取消接线</button>
          </div>
          <p class="tip" id="edit-message" role="status">
            电池为理想电压源，灯泡按固定电阻建模。
          </p>
        </section>
        <section class="results" aria-label="计算结果">
          <p id="status" role="status"></p>
          <table>
            <thead>
              <tr>
                <th>元件</th>
                <th>电压 (V)</th>
                <th>电流 (A)</th>
              </tr>
            </thead>
            <tbody id="readings"></tbody>
          </table>
          <p class="tip">
            电压按左端减右端计算。箭头表示常规电流方向，灯泡亮度随耗散功率变化。
          </p>
        </section>
      </aside>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const types = {
        battery: { title: "电池", prefix: "V", value: 12 },
        resistor: { title: "电阻", prefix: "R", value: 100 },
        switch: { title: "开关", prefix: "S", value: 0 },
        lamp: { title: "灯泡", prefix: "L", value: 120 },
      };
      const limits = {
        battery: [0.001, 1000],
        resistor: [0.01, 10000000],
        lamp: [0.01, 10000000],
      };
      const extent = { width: 800, height: 468, terminal: 60 };
      let parts = [],
        wires = [],
        ids = 0,
        serial = {};
      let pending = null,
        selectedPart = null,
        selectedWire = null,
        drag = null;

      function part(type, x, y, value = types[type].value) {
        const number = (serial[type] = (serial[type] || 0) + 1);
        const item = {
          id: ++ids,
          name: types[type].prefix + number,
          type,
          x,
          y,
          value,
          closed: true,
        };
        parts.push(item);
        return item;
      }
      function wire(first, a, second, b) {
        wires.push({
          id: ++ids,
          a: { id: first.id, side: a },
          b: { id: second.id, side: b },
        });
      }

      function setup() {
        parts = [];
        wires = [];
        serial = {};
        pending = selectedPart = selectedWire = drag = null;
        const mode = $("preset").value;
        if (mode !== "empty") {
          const battery = part("battery", 400, 81);
          const first = part("resistor", 400, 233, 100);
          const second = part(
            "resistor",
            mode === "series" ? 600 : 400,
            mode === "series" ? 345 : 359,
            200,
          );
          const power = part(
            "switch",
            mode === "series" ? 205 : 175,
            mode === "series" ? 345 : 154,
          );
          if (mode === "series") {
            wire(battery, 0, power, 0);
            wire(power, 1, first, 0);
            wire(first, 1, second, 0);
            wire(second, 1, battery, 1);
          } else {
            wire(battery, 0, power, 0);
            wire(power, 1, first, 0);
            wire(first, 0, second, 0);
            wire(first, 1, second, 1);
            wire(battery, 1, first, 1);
          }
          selectedPart = power.id;
        }
        render();
      }

      function terminalKey(t) {
        return t.id * 2 + t.side;
      }

      function solve() {
        if (!parts.length)
          return {
            values: new Map(),
            message: "放置元件开始实验。",
            bad: false,
          };
        const parent = new Map(
          parts.flatMap(({ id }) => [
            [id * 2, id * 2],
            [id * 2 + 1, id * 2 + 1],
          ]),
        );
        function root(i, tree = parent) {
          const start = i;
          while (i !== tree.get(i)) i = tree.get(i);
          tree.set(start, i);
          return i;
        }
        for (const w of wires)
          parent.set(root(terminalKey(w.a)), root(terminalKey(w.b)));
        const connections = parts.map((p) => ({
          p,
          a: root(p.id * 2),
          b: root(p.id * 2 + 1),
          source: p.type === "battery" || (p.type === "switch" && p.closed),
          open: p.type === "switch" && !p.closed,
        }));
        const fail = (message) => ({ values: new Map(), message, bad: true });
        const shortPaths = new Map(parent);
        for (const e of connections) {
          if (e.p.type === "switch" && e.source)
            shortPaths.set(root(e.a, shortPaths), root(e.b, shortPaths));
        }
        for (const e of connections) {
          if (
            e.p.type === "battery" &&
            root(e.a, shortPaths) === root(e.b, shortPaths)
          )
            return fail(
              e.p.name + " 电源短路。请检查电源端子之间的导线和开关。",
            );
        }
        const net = new Map();
        for (const { a, b, open } of connections) {
          if (!net.has(a)) net.set(a, new Set());
          if (!net.has(b)) net.set(b, new Set());
          if (!open) {
            net.get(a).add(b);
            net.get(b).add(a);
          }
        }
        const groups = new Map(),
          unknown = new Map();
        for (const node of net.keys()) {
          if (groups.has(node)) continue;
          const queue = [node];
          groups.set(node, node);
          for (const current of queue)
            for (const next of net.get(current)) {
              if (groups.has(next)) continue;
              groups.set(next, node);
              unknown.set(next, unknown.size);
              queue.push(next);
            }
        }
        const sources = connections.filter((e) => e.source);
        const n = unknown.size + sources.length;
        const m = Array.from({ length: n }, () => new Float64Array(n + 1));
        for (const e of connections) {
          if (e.source || e.open || e.a === e.b) continue;
          const a = unknown.get(e.a),
            b = unknown.get(e.b),
            g = 1 / e.p.value;
          if (a !== undefined) m[a][a] += g;
          if (b !== undefined) m[b][b] += g;
          if (a !== undefined && b !== undefined) {
            m[a][b] -= g;
            m[b][a] -= g;
          }
        }
        sources.forEach((e, i) => {
          const a = unknown.get(e.a),
            b = unknown.get(e.b);
          const j = (e.column = unknown.size + i);
          if (a !== undefined) {
            m[a][j]++;
            m[j][a]++;
          }
          if (b !== undefined) {
            m[b][j]--;
            m[j][b]--;
          }
          m[j][n] = e.p.type === "battery" ? e.p.value : 0;
        });
        const solution = eliminate(m);
        if (solution.kind === "conflict")
          return fail("理想电源电压约束冲突。检查电池的极性、电压与闭合开关。");
        if (solution.kind === "singular")
          return fail(
            "电流无唯一解。检查重复的理想电源，或被导线旁路的闭合开关。",
          );
        const voltage = (node) => solution.data[unknown.get(node)] ?? 0;
        const values = new Map();
        for (const e of connections) {
          const delta =
            groups.get(e.a) === groups.get(e.b)
              ? voltage(e.a) - voltage(e.b)
              : null;
          const current = e.open
            ? 0
            : e.source
              ? solution.data[e.column]
              : delta / e.p.value;
          values.set(e.p.id, {
            delta,
            current,
            watts: e.p.type === "lamp" ? current * current * e.p.value : 0,
          });
        }
        const energized = [...values.values()].some(
          (r) => Math.abs(r.current) > 1e-10,
        );
        return {
          values,
          message: energized ? "已求解稳态电路" : "无闭合供电回路，电流为零。",
          bad: false,
        };
      }

      function eliminate(matrix) {
        const n = matrix.length,
          pivots = [],
          eps = 1e-10;
        let row = 0;
        for (let col = 0; col < n; col++) {
          let largest = row;
          for (let other = row + 1; other < n; other++)
            if (Math.abs(matrix[other][col]) > Math.abs(matrix[largest][col]))
              largest = other;
          if (Math.abs(matrix[largest][col]) < eps) continue;
          [matrix[row], matrix[largest]] = [matrix[largest], matrix[row]];
          const pivot = matrix[row][col];
          for (let k = col; k <= n; k++) matrix[row][k] /= pivot;
          for (let i = 0; i < n; i++) {
            if (i === row) continue;
            const f = matrix[i][col];
            for (let k = col; k <= n; k++) matrix[i][k] -= f * matrix[row][k];
          }
          pivots.push(col);
          row++;
        }
        for (let i = row; i < n; i++)
          if (Math.abs(matrix[i][n]) > 1e-7) return { kind: "conflict" };
        if (row < n) return { kind: "singular" };
        const data = new Float64Array(n);
        pivots.forEach((i, r) => {
          data[i] = matrix[r][n];
        });
        return { kind: "solved", data };
      }

      const symbols = {
        battery:
          '<path d="M0 19h40m20 0h40M40 8v22m20-17v12M30 4v8m-4-4h8m32 0h8"/>',
        resistor: '<path d="M0 19h21l7-9 9 18 9-18 9 18 9-18 9 18 7-9h20"/>',
        switch:
          '<path d="M0 19h28m44 0h28"/><circle cx="32" cy="19" r="3"/><circle cx="68" cy="19" r="3"/>',
        lamp: '<path d="M0 19h36m28 0h36M41 10l18 18m0-18L41 28"/><circle cx="50" cy="19" r="14"/>',
      };
      const format = (n) =>
        n === null
          ? "—"
          : Math.abs(n) < 1e-10
            ? "0"
            : String(Number(n.toPrecision(5)));
      const findPart = (id) => parts.find((p) => p.id === id);
      function endpoint(terminal) {
        const p = findPart(terminal.id);
        return [p.x + (terminal.side ? 1 : -1) * extent.terminal, p.y];
      }
      function drawWires() {
        $("wires").innerHTML = wires
          .map((w) => {
            const [ax, ay] = endpoint(w.a),
              [bx, by] = endpoint(w.b);
            let middle = (ax + bx) / 2;
            if (w.a.side === w.b.side)
              middle = w.a.side ? Math.max(ax, bx) + 13 : Math.min(ax, bx) - 13;
            const d = "M" + ax + " " + ay + "H" + middle + "V" + by + "H" + bx;
            return (
              '<path class="wire-line' +
              (selectedWire === w.id ? " selected" : "") +
              '" d="' +
              d +
              '"/><path class="wire-hit" data-wire="' +
              w.id +
              '" d="' +
              d +
              '"/>'
            );
          })
          .join("");
      }
      function position(el, p) {
        el.style.left = (p.x / extent.width) * 100 + "%";
        el.style.top = (p.y / extent.height) * 100 + "%";
      }

      function drawParts(values) {
        const focus = document.activeElement;
        const focusKey =
          focus?.getAttribute("data-terminal") ??
          focus?.getAttribute("data-body");
        const focusIsTerminal = focus?.hasAttribute("data-terminal");
        $("parts").innerHTML = parts
          .map((p) => {
            const title = p.name + " " + types[p.type].title;
            const watts = values.get(p.id)?.watts ?? 0;
            const glow =
              p.type === "lamp" && watts > 1e-9
                ? '<circle cx="50" cy="19" r="16" fill="#ffc45b" stroke="none" opacity="' +
                  Math.min(0.98, Math.log1p(watts) * 0.45) +
                  '"/>'
                : "";
            const hinge =
              p.type === "switch"
                ? '<path d="M36 19L64 ' + (p.closed ? "19" : "6") + '"/>'
                : "";
            const label =
              p.type === "switch"
                ? p.closed
                  ? " 闭合"
                  : " 断开"
                : " " + p.value + (p.type === "battery" ? " V" : " Ω");
            const terminals = [0, 1]
              .map(
                (i) =>
                  '<button class="terminal' +
                  (pending?.id === p.id && pending?.side === i
                    ? " pending"
                    : "") +
                  '" data-terminal="' +
                  (p.id * 2 + i) +
                  '" data-part="' +
                  p.id +
                  '" data-side="' +
                  i +
                  '" style="left:' +
                  i * 100 +
                  '%" aria-label="' +
                  title +
                  (i ? " 右端子" : " 左端子") +
                  '"></button>',
              )
              .join("");
            return (
              '<div class="part' +
              (selectedPart === p.id ? " active" : "") +
              '" data-id="' +
              p.id +
              '">' +
              '<button class="body" data-body="' +
              p.id +
              '" aria-label="' +
              title +
              '"><svg viewBox="0 0 100 38" aria-hidden="true">' +
              glow +
              symbols[p.type] +
              hinge +
              "</svg></button>" +
              terminals +
              '<span class="part-label">' +
              p.name +
              label +
              "</span></div>"
            );
          })
          .join("");
        for (const el of $("parts").children)
          position(el, findPart(Number(el.dataset.id)));
        if (focusKey !== null && focusKey !== undefined) {
          $("parts")
            .querySelector(
              "[data-" +
                (focusIsTerminal ? "terminal" : "body") +
                '="' +
                focusKey +
                '"]',
            )
            ?.focus({ preventScroll: true });
        }
      }

      function render() {
        const { values, message, bad } = solve();
        $("status").textContent = message;
        $("status").classList.toggle("bad", bad);
        $("readings").innerHTML = parts
          .map((p) => {
            const r = values.get(p.id);
            const direction =
              r && Math.abs(r.current) > 1e-10
                ? r.current > 0
                  ? " →"
                  : " ←"
                : "";
            return (
              '<tr class="' +
              (selectedPart === p.id ? "active" : "") +
              '"><th scope="row">' +
              p.name +
              "</th><td>" +
              (r ? format(r.delta) : "—") +
              "</td><td>" +
              (r ? format(Math.abs(r.current)) + direction : "—") +
              "</td></tr>"
            );
          })
          .join("");
        const p = findPart(selectedPart);
        $("selection").textContent = p
          ? p.name + " · " + types[p.type].title
          : selectedWire
            ? "导线"
            : "请选择元件或导线";
        $("value-row").hidden = !p || p.type === "switch";
        $("toggle").hidden = p?.type !== "switch";
        $("delete").hidden = !p && !selectedWire;
        $("cancel-wire").hidden = !pending;
        if (p && p.type !== "switch") {
          const [min, max] = limits[p.type];
          Object.assign($("value"), { min, max, value: p.value });
          $("value-label").textContent =
            p.type === "battery" ? "电压 (V)" : "电阻 (Ω)";
        }
        if (p?.type === "switch")
          $("toggle").textContent = p.closed ? "断开开关" : "闭合开关";
        $("edit-message").textContent = pending
          ? "请选择另一个端子完成接线。"
          : p?.type === "lamp"
            ? "耗散功率 " +
              format(values.get(p.id)?.watts ?? null) +
              " W，灯泡按固定电阻建模。"
            : "电池为理想电压源，灯泡按固定电阻建模。";
        drawWires();
        drawParts(values);
      }

      function selectTerminal(t) {
        if (!pending) pending = t;
        else if (terminalKey(t) === terminalKey(pending)) pending = null;
        else {
          const a = terminalKey(pending),
            b = terminalKey(t);
          if (
            !wires.some((w) => {
              const c = terminalKey(w.a),
                d = terminalKey(w.b);
              return (a === c && b === d) || (a === d && b === c);
            })
          )
            wires.push({ id: ++ids, a: pending, b: t });
          pending = null;
        }
        selectedPart = t.id;
        selectedWire = null;
        render();
      }

      $("stage").addEventListener("click", (event) => {
        const node = event.target.closest(
          "[data-terminal],[data-wire],[data-body]",
        );
        if (node?.dataset.terminal !== undefined)
          selectTerminal({
            id: Number(node.dataset.part),
            side: Number(node.dataset.side),
          });
        else if (node?.dataset.wire) {
          selectedWire = Number(node.dataset.wire);
          selectedPart = null;
          render();
        } else if (node?.dataset.body) {
          selectedPart = Number(node.dataset.body);
          selectedWire = null;
          render();
        }
      });
      $("stage").addEventListener("pointerdown", (event) => {
        const node = event.target.closest("[data-body]");
        if (!node || event.button !== 0 || drag) return;
        const p = findPart(Number(node.dataset.body));
        drag = {
          id: event.pointerId,
          p,
          x: event.clientX,
          y: event.clientY,
          ox: p.x,
          oy: p.y,
          moving: false,
        };
      });
      $("stage").addEventListener("pointermove", (event) => {
        if (drag?.id !== event.pointerId) return;
        const dx = event.clientX - drag.x,
          dy = event.clientY - drag.y;
        if (!drag.moving && Math.hypot(dx, dy) < 4) return;
        if (!drag.moving) {
          $("stage").setPointerCapture(event.pointerId);
          drag.moving = true;
        }
        const r = $("stage").getBoundingClientRect(),
          p = drag.p;
        p.x = Math.min(
          720,
          Math.max(80, drag.ox + (dx / r.width) * extent.width),
        );
        p.y = Math.min(
          425,
          Math.max(34, drag.oy + (dy / r.height) * extent.height),
        );
        position($("parts").querySelector('[data-id="' + p.id + '"]'), p);
        drawWires();
      });
      function endDrag(event) {
        if (drag?.id !== event.pointerId) return;
        if (drag.moving) {
          selectedPart = drag.p.id;
          selectedWire = null;
          render();
        }
        drag = null;
      }
      for (const name of [
        "pointerup",
        "pointercancel",
        "lostpointercapture",
        "pointerleave",
      ]) {
        $("stage").addEventListener(name, (event) => {
          if (name !== "pointerleave" || !drag?.moving) endDrag(event);
        });
      }
      function remove() {
        if (selectedPart) {
          const id = selectedPart;
          parts = parts.filter((p) => p.id !== id);
          wires = wires.filter((w) => w.a.id !== id && w.b.id !== id);
          if (pending?.id === id) pending = null;
        }
        if (selectedWire) wires = wires.filter((w) => w.id !== selectedWire);
        selectedPart = selectedWire = null;
        render();
      }
      $("delete").onclick = remove;
      $("cancel-wire").onclick = () => {
        pending = null;
        render();
      };
      $("toggle").onclick = () => {
        const p = findPart(selectedPart);
        if (p) {
          p.closed = !p.closed;
          render();
        }
      };
      $("preset").onchange = setup;
      $("reset").onclick = setup;
      $("value").onchange = (event) => {
        const input = event.target,
          p = findPart(selectedPart);
        if (!p) return;
        if (input.value === "" || !input.checkValidity()) {
          input.value = p.value;
          $("edit-message").textContent =
            "请输入 " + input.min + " 至 " + input.max + " 之间的数值。";
          return;
        }
        p.value = input.valueAsNumber;
        render();
      };
      $("toolbar").addEventListener("click", (event) => {
        const type = event.target.dataset.add;
        if (!type) return;
        if (parts.length >= 25) {
          $("edit-message").textContent = "实验台最多放置 25 个元件。";
          return;
        }
        const positions = Array.from({ length: 24 }, (_, i) => [
          95 + (i % 6) * 122,
          44 + Math.floor(i / 6) * 108,
        ]);
        const [x, y] = positions.find(([x, y]) =>
          parts.every((p) => Math.abs(p.x - x) > 124 || Math.abs(p.y - y) > 60),
        ) ?? [400, 156];
        selectedPart = part(type, x, y).id;
        selectedWire = null;
        render();
      });
      addEventListener("keydown", (event) => {
        if (event.key === "Escape" && pending) {
          pending = null;
          render();
        }
        if (
          event.key === "Delete" &&
          !/INPUT|SELECT/.test(event.target.tagName) &&
          (selectedPart || selectedWire)
        )
          remove();
      });
      setup();
    </script>
  </body>
</html>
