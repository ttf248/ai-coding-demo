<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直流电路 · 工作台</title>
<script src="../../../../assets/analytics.js" defer></script>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#1d3049;font:14px system-ui}button,input,select{font:inherit}button,select,input{border:1px solid #ccd6e2;border-radius:7px;background:white;padding:10px;color:inherit}button{cursor:pointer}button:hover{background:#edf3ff}button.primary{background:#2262b7;color:white;border-color:#2262b7}main{max-width:1440px;margin:auto;padding:26px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px}h1{margin:6px 0;font-size:30px}header small{letter-spacing:3px;color:#5e7896}.layout{display:grid;grid-template-columns:230px 1fr;gap:20px}aside,.work{border:1px solid #d5dfeb;border-radius:14px;background:white;padding:18px}.work{min-width:0}h2{font-size:13px;letter-spacing:1px;margin:4px 0 14px}.palette{display:grid;grid-template-columns:1fr 1fr;gap:8px}.palette button{padding:12px 4px}label{display:block;margin:18px 0 6px}input,select{width:100%}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.board{background-color:#f8fbff;background-image:radial-gradient(#d6e1ef 1px,transparent 1px);background-size:20px 20px;border:1px solid #d5dfeb;border-radius:9px;overflow:hidden}svg{width:100%;display:block;touch-action:none;user-select:none;aspect-ratio:1000/640}.terminal{cursor:crosshair}.component{cursor:grab}.wire{cursor:pointer}.info{line-height:1.8;color:#60758e;font-size:12px}#status{border-radius:8px;padding:14px;background:#edf5ff;margin:14px 0;color:#245285}#status.error{background:#fff0e8;color:#a24022}#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.reading{padding:12px;background:#f5f8fc;border-radius:8px;font-size:12px;line-height:1.8}.reading b{display:block;font-size:14px}.danger{color:#b13f3f}footer{margin-top:18px;color:#60758e;font-size:12px}@media(max-width:760px){main{padding:14px}h1{font-size:24px}.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:12px}.info{grid-column:1/-1}label{margin-top:8px}.work{padding:10px}.toolbar button{flex:1}#results{grid-template-columns:1fr 1fr}}</style>
<main><header><div><small>BENCH  /  DC CIRCUITS</small><h1>把电路，接通。</h1><span style="color:#60758e">理想直流 · 实时求解 · 从连接到理解</span></div><button id="reset">↺ 一键重置</button></header><div class="layout"><aside><div><h2>元件盒</h2><div class="palette"><button data-add="battery">▰ 电池</button><button data-add="resistor">〰 电阻</button><button data-add="switch">╱ 开关</button><button data-add="bulb">☼ 灯泡</button></div></div><div><h2>元件属性</h2><label for="selected">选择元件</label><select id="selected"></select><label for="value" id="valueLabel">数值</label><input id="value" type="number" step="any"><button id="toggle" style="width:100%;margin-top:8px">切换开关</button><button id="delete" class="danger" style="width:100%;margin-top:8px">删除选中元件</button></div><p class="info">① 放置并拖动元件。<br>② 依次点两个端子连接导线，再点已选端子取消。<br>③ 点击导线可删除。双击开关切换通断。<br>电流正方向为元件左端 → 右端；负号表示反向。灯泡按固定电阻建模，亮度随 I²R 功率变化。</p></aside><section class="work"><div class="toolbar"><button id="series" class="primary">串联预设 · 12V</button><button id="parallel">并联预设 · 12V</button><button id="empty">清空工作台</button><button id="cancel">取消连线</button></div><div class="board"><svg id="board" viewBox="0 0 1000 640" aria-label="可拖动和连线的电路工作台"></svg></div><div id="status" role="status"></div><div id="results"></div></section></div><footer>简化模型：电池与导线为理想元件，不模拟内阻、温度或真实灯丝变化。悬浮子电路分别选参考电位；电流 / 电压使用改进节点分析求解。</footer></main>
<script>
const $=s=>document.querySelector(s),svg=$('#board'),names={battery:'电池',resistor:'电阻',switch:'开关',bulb:'灯泡'};let components=[],wires=[],serial=0,selected=null,pending=null,drag=null,readings=new Map();
function add(type,x=200+components.length%4*170,y=160+Math.floor(components.length/4)%3*160){const c={id:++serial,type,x,y,value:type==='battery'?12:100,closed:true};components.push(c);selected=c.id;update();return c}
const endpoint=(id,p)=>`${id}:${p}`;
function connect(a,p,b,q){const u=endpoint(a.id,p),v=endpoint(b.id,q);if(u!==v&&!wires.some(w=>w.includes(u)&&w.includes(v)))wires.push([u,v])}
function preset(kind){components=[];wires=[];serial=0;pending=null;const b=add('battery',210,180),r1=add('resistor',690,180),r2=add('resistor',690,440),s=add('switch',210,440);r2.value=200;if(kind==='series'){connect(b,1,r1,0);connect(r1,1,r2,1);connect(r2,0,s,1);connect(s,0,b,0)}else{connect(b,1,s,0);connect(s,1,r1,0);connect(r1,0,r2,0);connect(r1,1,r2,1);connect(r2,1,b,0)}selected=b.id;update()}
function gaussian(A,b){const n=b.length;for(let col=0;col<n;col++){let p=col;for(let j=col+1;j<n;j++)if(Math.abs(A[j][col])>Math.abs(A[p][col]))p=j;if(Math.abs(A[p][col])<1e-10)throw Error('电路无唯一解：检查冗余或冲突的理想电源、闭合开关回路。');[A[p],A[col]]=[A[col],A[p]];[b[p],b[col]]=[b[col],b[p]];const v=A[col][col];for(let j=col;j<n;j++)A[col][j]/=v;b[col]/=v;for(let r=0;r<n;r++){if(r===col)continue;const f=A[r][col];for(let j=col;j<n;j++)A[r][j]-=f*A[col][j];b[r]-=f*b[col]}}if(b.some(v=>!Number.isFinite(v)))throw Error('求解失败：请检查元件数值。');return b}
function solve(){const parent=new Map(),find=x=>{if(!parent.has(x))parent.set(x,x);if(parent.get(x)!==x)parent.set(x,find(parent.get(x)));return parent.get(x)},join=(a,b)=>parent.set(find(a),find(b));for(const c of components){find(endpoint(c.id,0));find(endpoint(c.id,1))}for(const [a,b] of wires)join(a,b);const net=(c,p)=>find(endpoint(c.id,p)),adj=new Map(),active=components.filter(c=>c.type!=='switch'||c.closed);for(const c of active){const a=net(c,0),b=net(c,1);if(!adj.has(a))adj.set(a,new Set());if(!adj.has(b))adj.set(b,new Set());adj.get(a).add(b);adj.get(b).add(a);if(c.type==='battery'&&a===b&&Math.abs(c.value)>1e-9)throw Error('电源短路：理想电源两端被导线直接连接，电流无有限解。');if((c.type==='battery'||c.type==='switch')&&a===b)throw Error('电路无唯一解：理想电压元件两端被导线旁路，元件电流不确定。')}
const seen=new Set(),volts=new Map(),reference=new Map(),out=new Map();for(const node of adj.keys()){if(seen.has(node))continue;const nodes=[],queue=[node];seen.add(node);while(queue.length){const u=queue.pop();nodes.push(u);for(const v of adj.get(u))if(!seen.has(v)){seen.add(v);queue.push(v)}}const group=active.filter(c=>nodes.includes(net(c,0))),ground=nodes[0],unknown=nodes.slice(1),sources=group.filter(c=>(c.type==='battery'||c.type==='switch')&&net(c,0)!==net(c,1)),n=unknown.length+sources.length,A=Array.from({length:n},()=>Array(n).fill(0)),rhs=Array(n).fill(0),idx=x=>unknown.indexOf(x);for(const c of group){const a=idx(net(c,0)),b=idx(net(c,1));if(c.type==='resistor'||c.type==='bulb'){const g=1/c.value;if(a>=0)A[a][a]+=g;if(b>=0)A[b][b]+=g;if(a>=0&&b>=0){A[a][b]-=g;A[b][a]-=g}}}sources.forEach((c,j)=>{const k=unknown.length+j,a=idx(net(c,0)),b=idx(net(c,1));if(a>=0){A[a][k]+=1;A[k][a]+=1}if(b>=0){A[b][k]-=1;A[k][b]-=1}rhs[k]=c.type==='battery'?c.value:0});const x=n?gaussian(A,rhs):[];nodes.forEach(v=>reference.set(v,ground));volts.set(ground,0);unknown.forEach((v,i)=>volts.set(v,x[i]));sources.forEach((c,j)=>out.set(c.id,{v:c.type==='battery'?c.value:0,i:x[unknown.length+j]}));for(const c of group)if(!out.has(c.id)){const v=(volts.get(net(c,0))||0)-(volts.get(net(c,1))||0);out.set(c.id,{v,i:(c.type==='resistor'||c.type==='bulb')?v/c.value:0})}}
for(const c of components)if(!out.has(c.id)){const a=net(c,0),b=net(c,1),v=a===b?0:reference.has(a)&&reference.get(a)===reference.get(b)?volts.get(a)-volts.get(b):null;out.set(c.id,{v,i:0})}return out}
function update(){try{readings=solve();$('#status').className='';$('#status').textContent=components.length?'求解完成 · 端子电压以左减右计，电流箭头显示实际方向。':'工作台已清空，请添加元件。'}catch(e){readings=new Map();$('#status').className='error';$('#status').textContent=e.message}$('#selected').innerHTML=components.map(c=>`<option value="${c.id}">${names[c.type]} ${c.id}</option>`).join('');$('#selected').value=selected||'';properties();draw();$('#results').innerHTML=components.map(c=>{const r=readings.get(c.id);return `<div class="reading"><b>${names[c.type]} ${c.id}${c.type==='switch'?(c.closed?' · 闭合':' · 断开'):''}</b>${r?`${r.v===null?'端电压：悬浮 / 参考不定':`U = ${format(r.v)} V`}<br>I = ${format(r.i)} A ${Math.abs(r.i)<1e-9?'':r.i>0?'→':'←'}${c.type==='bulb'?`<br>P = ${format(r.i*r.i*c.value)} W`:''}`:'无法求解，见上方提示'}</div>`}).join('')}
function format(v){return Math.abs(v)<1e-9?'0':Number(v.toPrecision(5)).toString()}
function properties(){const c=components.find(c=>c.id===selected);$('#value').disabled=!c||c.type==='switch';$('#value').value=c?c.value:'';$('#valueLabel').textContent=c?.type==='battery'?'电压 / V':'电阻 / Ω';$('#value').min=c?.type==='battery'?-1000:0.001;$('#value').max=c?.type==='battery'?1000:1e8;$('#toggle').disabled=c?.type!=='switch';$('#delete').disabled=!c}
function pos(key){const [id,p]=key.split(':').map(Number),c=components.find(c=>c.id===id);return c?{x:c.x+(p?70:-70),y:c.y}:null}
function draw(){svg.innerHTML=wires.map(([a,b],i)=>{const p=pos(a),q=pos(b);return `<g class="wire" data-wire="${i}"><path d="M${p.x},${p.y} L${(p.x+q.x)/2},${p.y} L${(p.x+q.x)/2},${q.y} L${q.x},${q.y}" fill="none" stroke="transparent" stroke-width="18"/><path d="M${p.x},${p.y} L${(p.x+q.x)/2},${p.y} L${(p.x+q.x)/2},${q.y} L${q.x},${q.y}" fill="none" stroke="#4986c3" stroke-width="3"/></g>`}).join('')+components.map(c=>{const r=readings.get(c.id),power=r&&c.type==='bulb'?Math.min(1,r.i*r.i*c.value/2):0;let symbol=c.type==='battery'?'<path d="M-12,-23V23 M10,-14V14" stroke-width="5"/><text x="-30" y="-25" stroke="none" font-size="17">+</text>':c.type==='resistor'?'<path d="M-40,0 L-32,-12 -20,12 -8,-12 4,12 16,-12 28,12 40,0"/>':c.type==='switch'?`<path d="M-40,0 L${c.closed?40:30},${c.closed?0:-28}"/><circle cx="-40" r="4"/><circle cx="40" r="4"/>`:`<circle r="27" fill="rgba(255,196,50,${0.08+power*0.9})"/><path d="M-18,-18L18,18 M18,-18L-18,18"/>`;return `<g class="component" data-id="${c.id}" transform="translate(${c.x},${c.y})"><rect x="-82" y="-56" width="164" height="112" rx="12" fill="${c.id===selected?'#eaf2ff':'#fff'}" stroke="${c.id===selected?'#3576c5':'#d1dce9'}"/><g stroke="#2b4c72" fill="none" stroke-width="3"><path d="M-70,0H-40 M40,0H70"/>${symbol}</g><text text-anchor="middle" y="-37" fill="#345273" font-size="14">${names[c.type]} ${c.id}</text><text text-anchor="middle" y="44" fill="#345273" font-size="14">${c.type==='switch'?(c.closed?'闭合':'断开'):c.value+(c.type==='battery'?' V':' Ω')}</text>${[0,1].map(p=>`<circle class="terminal" data-pin="${endpoint(c.id,p)}" cx="${p?70:-70}" r="13" fill="${pending===endpoint(c.id,p)?'#f4b544':'white'}" stroke="#2675c7" stroke-width="3"/>`).join('')}</g>`}).join('')}
svg.onpointerdown=e=>{const pin=e.target.closest('[data-pin]');if(pin){const key=pin.dataset.pin;if(pending&&pending!==key){if(!wires.some(w=>w.includes(pending)&&w.includes(key)))wires.push([pending,key]);pending=null;update()}else{pending=pending===key?null:key;draw()}return}const wire=e.target.closest('[data-wire]');if(wire){wires.splice(Number(wire.dataset.wire),1);update();return}const group=e.target.closest('[data-id]');if(group){selected=Number(group.dataset.id);const c=components.find(c=>c.id===selected),p=point(e);drag={id:c.id,dx:p.x-c.x,dy:p.y-c.y};svg.setPointerCapture(e.pointerId);$('#selected').value=selected;properties();draw()}};
function point(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}
svg.onpointermove=e=>{if(!drag)return;const c=components.find(c=>c.id===drag.id),p=point(e);c.x=Math.max(85,Math.min(915,p.x-drag.dx));c.y=Math.max(60,Math.min(580,p.y-drag.dy));draw()};svg.onpointerup=svg.onpointercancel=()=>drag=null;svg.ondblclick=e=>{const g=e.target.closest('[data-id]'),c=components.find(c=>c.id===Number(g?.dataset.id));if(c?.type==='switch'){c.closed=!c.closed;update()}};
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));$('#selected').onchange=e=>{selected=Number(e.target.value);properties();draw()};$('#value').onchange=e=>{const c=components.find(c=>c.id===selected),v=Number(e.target.value);if(!c)return;if(!e.target.value||!Number.isFinite(v)||(c.type!=='battery'&&v<=0)||Math.abs(v)>(c.type==='battery'?1000:1e8)){e.target.value=c.value;$('#status').className='error';$('#status').textContent='请输入有效数值：电压 -1000～1000V，电阻大于 0 且不超过 100MΩ。';return}c.value=v;update()};$('#toggle').onclick=()=>{const c=components.find(c=>c.id===selected);if(c?.type==='switch'){c.closed=!c.closed;update()}};$('#delete').onclick=()=>{components=components.filter(c=>c.id!==selected);wires=wires.filter(w=>!w.some(x=>x.startsWith(selected+':')));pending=null;selected=components[0]?.id||null;update()};$('#empty').onclick=()=>{components=[];wires=[];selected=null;pending=null;update()};$('#cancel').onclick=()=>{pending=null;draw()};$('#series').onclick=()=>preset('series');$('#parallel').onclick=()=>preset('parallel');$('#reset').onclick=()=>preset('series');preset('series');
window.lab={solve,preset,add,connect,update,get state(){return {components,wires,readings}}};
</script></html>
