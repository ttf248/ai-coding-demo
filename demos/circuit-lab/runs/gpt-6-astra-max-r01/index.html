<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直流工坊 · 电路实验台</title><style>
*{box-sizing:border-box}body{margin:0;color:#183432;background:#eef2eb;font:14px/1.6 system-ui}button,input{font:inherit}button{cursor:pointer;border:1px solid #c9d6ca;background:#fff;padding:9px 13px;border-radius:7px;color:inherit}button:hover{border-color:#22735a}button:focus-visible{outline:3px solid #85ba9a}.primary{background:#1c6d54;color:white}header{padding:24px 4vw;border-bottom:1px solid #d4ded2;display:flex;justify-content:space-between}header b{font-size:21px}small{color:#728375}main{padding:28px 4vw;max-width:1500px;margin:auto}h1{font-size:40px;line-height:1.2;margin:8px 0 18px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px}.panel{background:#fff;border:1px solid #d4ded2;border-radius:13px;overflow:hidden}.bar{padding:14px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #d4ded2}svg{width:100%;display:block;touch-action:none;background:#fafbf7}.component{cursor:grab}.port{cursor:crosshair;fill:#fff;stroke:#28775e;stroke-width:3}.port:hover{fill:#bee3b6}.wire{stroke:#66957b;stroke-width:4;fill:none;cursor:pointer}.wire.selected{stroke:#cf6948}.foot{padding:14px 18px;background:#f6f8f2;color:#63796b}aside .panel{padding:20px;margin-bottom:15px}h2{font-size:15px;margin:0 0 12px}.number{font-size:35px;color:#236f54;letter-spacing:-1px}input{max-width:100%;width:100%;border:1px solid #c9d6ca;padding:10px;border-radius:6px;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.readings{padding:16px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:450px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e2e9df;font-size:12px}th{color:#718473;font-weight:500}#status{min-height:50px}#status.error{color:#b34435;background:#fff1e9;padding:12px;border-radius:6px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:12px}}@media(max-width:500px){header{padding:16px}header small{display:none}main{padding:22px 12px}h1{font-size:32px}aside{grid-template-columns:1fr}.bar{padding:10px}button{padding:8px 10px}}
</style><header><b>⊕ 直流工坊</b><small>DC CIRCUIT STUDIO / 02</small></header><main><small>接通想象，让电流说话。</small><h1>在桌面上，搭一条电路。</h1><div class="layout"><section class="panel"><div class="bar"><button data-add="battery">＋ 电池</button><button data-add="resistor">＋ 电阻</button><button data-add="lamp">＋ 灯泡</button><button data-add="switch">＋ 开关</button><button id="cancel">取消连线</button><button id="zoom-in">放大</button><button id="zoom-out">缩小</button><button id="fit">全图</button></div><svg id="board" viewBox="0 0 900 500" aria-label="电路元件与接线画布"><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d4dfcf"/></pattern></defs><rect width="900" height="500" fill="url(#dots)"/><g id="wires"></g><g id="components"></g></svg><div class="foot" id="hint">点两个端子连线 · 拖动元件 · 点击导线后可删除 · 双击开关切换</div><div class="readings"><table><thead><tr><th>元件</th><th>电压 A → B</th><th>电流 A → B</th><th>耗散功率</th></tr></thead><tbody id="results"></tbody></table></div></section><aside><div class="panel"><h2>实时求解</h2><div class="number" id="total">0.040 A</div><small>电源输出电流绝对值合计</small><p id="status" role="status"></p><small>灯泡按固定电阻建模，亮度由耗散功率计算；不模拟温度或真实灯丝特性。</small></div><div class="panel"><h2>元件检查器</h2><div id="selection">选择元件可编辑参数。</div><label id="valueLabel" for="value">参数</label><input id="value" type="number" min="0.001" step="any" disabled><div class="actions"><button id="apply" disabled>应用</button><button id="toggle" disabled>切换开关</button><button id="delete" disabled>删除</button></div></div><div class="panel"><h2>从一个实验开始</h2><div class="actions"><button id="series">串联 12V</button><button id="parallel">并联 12V</button><button id="reset">重置</button><button id="empty">清空</button></div><p><small>100Ω + 200Ω 串联：0.04A<br>并联：0.12A + 0.06A<br>正电流由 A 端流向 B 端，负值反向。</small></p></div></aside></div></main><script>
const $=id=>document.getElementById(id),names={battery:'电池',resistor:'电阻',lamp:'灯泡',switch:'开关'},svg=$('board');let parts=[],wires=[],next=1,selected=null,selectedWire=-1,pending=null,drag=null,readings=[],error='';
function add(type,x=180+((next*137)%560),y=130+((next*71)%260),value=type==='battery'?12:100){const p={id:next++,type,x,y,value,closed:true};parts.push(p);return p.id;}
function wire(a,ap,b,bp){wires.push([`${a}:${ap}`,`${b}:${bp}`]);}function point(key){const[id,p]=key.split(':').map(Number),c=parts.find(c=>c.id===id);return {x:c.x+(p?48:-48),y:c.y};}
function preset(parallel=false){parts=[];wires=[];next=1;selected=null;selectedWire=-1;pending=null;const b=add('battery',160,250,12),r=add('resistor',440,130,100),l=add('lamp',650,parallel?310:130,200),s=add('switch',440,380);wire(b,0,r,0);wire(b,1,s,1);if(parallel){wire(r,1,s,0);wire(b,0,l,0);wire(l,1,s,0);}else{wire(r,1,l,0);wire(l,1,s,0);}render();inspect();}
function gaussian(A,b){const n=b.length,M=A.map((r,i)=>[...r,b[i]]),pivots=[];let row=0;for(let c=0;c<n&&row<n;c++){let k=row;for(let i=row+1;i<n;i++)if(Math.abs(M[i][c])>Math.abs(M[k][c]))k=i;if(Math.abs(M[k][c])<1e-10)continue;[M[k],M[row]]=[M[row],M[k]];const d=M[row][c];for(let j=c;j<=n;j++)M[row][j]/=d;for(let i=0;i<n;i++){if(i===row)continue;const f=M[i][c];for(let j=c;j<=n;j++)M[i][j]-=f*M[row][j];}pivots.push(c);row++;}for(let i=row;i<n;i++)if(Math.abs(M[i][n])>1e-7)throw Error('电源短路或理想电源相互冲突，电路无解。');if(row<n)throw Error('电路无唯一解：存在冗余理想电源或不确定的电源电流。');const x=Array(n).fill(0);pivots.forEach((c,i)=>x[c]=M[i][n]);return x;}
function solve(){readings=[];error='';const parent=new Map();for(const p of parts)for(let i=0;i<2;i++)parent.set(`${p.id}:${i}`,`${p.id}:${i}`);function find(k){let p=parent.get(k);if(p!==k){p=find(p);parent.set(k,p);}return p;}function union(a,b){parent.set(find(a),find(b));}wires.forEach(([a,b])=>union(a,b));const node=(p,i)=>find(`${p.id}:${i}`),edges=parts.filter(p=>p.type!=='switch'||p.closed),nodes=[...new Set([...parent.keys()].map(find))],adj=new Map(nodes.map(n=>[n,new Set()]));for(const p of edges){adj.get(node(p,0)).add(node(p,1));adj.get(node(p,1)).add(node(p,0));}const seen=new Set(),volt=new Map(),curr=new Map(),island=new Map();try{for(const root of nodes){if(seen.has(root))continue;const group=[root];seen.add(root);for(let i=0;i<group.length;i++)for(const v of adj.get(group[i]))if(!seen.has(v)){seen.add(v);group.push(v);}group.forEach(n=>island.set(n,root));const comp=edges.filter(p=>group.includes(node(p,0))),batteries=comp.filter(p=>p.type==='battery'||p.type==='switch');for(const p of batteries)if(p.type==='battery'&&node(p,0)===node(p,1)&&Math.abs(p.value)>1e-8)throw Error('电源短路：理想电池两端被导线直接连通。');const idx=new Map(group.slice(1).map((n,i)=>[n,i])),nv=group.length-1,size=nv+batteries.length,A=Array.from({length:size},()=>Array(size).fill(0)),z=Array(size).fill(0);const stamp=(i,j,v)=>{if(i!==undefined&&j!==undefined)A[i][j]+=v;};for(const p of comp){const a=idx.get(node(p,0)),b=idx.get(node(p,1));if(p.type==='battery'||p.type==='switch'){const k=nv+batteries.indexOf(p);stamp(a,k,1);stamp(k,a,1);stamp(b,k,-1);stamp(k,b,-1);z[k]=p.type==='battery'?p.value:0;}else{const g=1/p.value;stamp(a,a,g);stamp(b,b,g);stamp(a,b,-g);stamp(b,a,-g);}}const x=size?gaussian(A,z):[];volt.set(root,0);idx.forEach((i,n)=>volt.set(n,x[i]));batteries.forEach((p,i)=>curr.set(p.id,x[nv+i]));}
 readings=parts.map(p=>{const a=node(p,0),b=node(p,1),v=island.get(a)===island.get(b)?volt.get(a)-volt.get(b):null;const i=p.type==='battery'||(p.type==='switch'&&p.closed)?curr.get(p.id):p.type==='switch'?0:v/p.value;return {id:p.id,v,i,power:p.type==='lamp'||p.type==='resistor'?i*i*p.value:null};});}catch(e){error=e.message;}
 $('status').textContent=error||(!parts.length?'添加元件开始实验。':'计算完成。断开支路电流为零；闭合开关以零压降约束计算支路电流。');$('status').className=error?'error':'';$('total').textContent=error?'—':readings.filter(r=>parts.find(p=>p.id===r.id).type==='battery').reduce((s,r)=>s+Math.abs(r.i||0),0).toFixed(3)+' A';$('results').innerHTML=parts.map(p=>{const r=readings.find(r=>r.id===p.id),fmt=(v,u)=>v==null?'未定':Math.abs(v)<1e-9?'0 '+u:Number(v.toPrecision(5))+' '+u;return `<tr><td>${names[p.type]} ${p.id}</td><td>${r?fmt(r.v,'V'):'—'}</td><td>${r?fmt(r.i,'A'):'—'}</td><td>${r?.power!=null?fmt(r.power,'W'):'—'}</td></tr>`;}).join('');}
function render(){solve();$('wires').innerHTML=wires.map(([a,b],i)=>{const A=point(a),B=point(b);return `<path data-wire="${i}" class="wire ${i===selectedWire?'selected':''}" d="M${A.x} ${A.y} H${(A.x+B.x)/2} V${B.y} H${B.x}"/><path data-wire="${i}" stroke="transparent" stroke-width="16" fill="none" d="M${A.x} ${A.y} H${(A.x+B.x)/2} V${B.y} H${B.x}"/>`;}).join('');$('components').innerHTML=parts.map(p=>{const r=readings.find(r=>r.id===p.id);let shape=p.type==='battery'?'<path d="M-12 -22 V22 M3 -13 V13 M13 -22 V22 M26 -13 V13"/>':p.type==='switch'?`<path d="M-25 0 L23 ${p.closed?0:-25} M25 0 H35"/>`:p.type==='lamp'?`<circle r="24" fill="${r?.power?'rgba(255,187,65,'+Math.min(.95,r.power/2+.15)+')':'#f0f2eb'}"/><path d="M-16 -16 L16 16 M-16 16 L16 -16"/>`:'<path d="M-32 0 L-25 -12 L-15 12 L-5 -12 L5 12 L15 -12 L25 12 L32 0"/>';return `<g class="component" data-id="${p.id}" transform="translate(${p.x},${p.y})"><rect x="-65" y="-50" width="130" height="100" rx="12" fill="${selected===p.id?'#dcebd7':'#f8faf3'}" stroke="${selected===p.id?'#4e8964':'#dde6d8'}"/><g fill="none" stroke="#254f40" stroke-width="3"><path d="M-48 0 H-32 M32 0 H48"/>${shape}</g><text y="-32" text-anchor="middle" font-size="12" fill="#436b52">${names[p.type]} ${p.id}</text><text y="40" text-anchor="middle" font-size="13">${p.type==='switch'?(p.closed?'闭合':'断开'):p.value+(p.type==='battery'?' V':' Ω')}</text><circle class="port" data-port="${p.id}:0" cx="-48" r="12"/><circle class="port" data-port="${p.id}:1" cx="48" r="12"/><text x="-48" y="4" pointer-events="none" text-anchor="middle" font-size="10">A</text><text x="48" y="4" pointer-events="none" text-anchor="middle" font-size="10">B</text></g>`;}).join('');$('hint').textContent=pending?'已选端子 '+pending+'，点击另一个端子完成连线。':'点两个端子连线 · 拖动元件 · 点击导线后可删除 · 双击开关切换';}
function inspect(){const p=parts.find(p=>p.id===selected);$('selection').textContent=p?names[p.type]+' '+p.id:selectedWire>=0?'已选择导线':'选择元件可编辑参数。';$('valueLabel').textContent=p?.type==='battery'?'电压 / V':'电阻 / Ω';$('value').value=p?.value||'';$('value').disabled=$('apply').disabled=!p||p.type==='switch';$('toggle').disabled=p?.type!=='switch';$('delete').disabled=!p&&selectedWire<0;}
function pos(e){const q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;return q.matrixTransform(svg.getScreenCTM().inverse());}
svg.onpointerdown=e=>{const port=e.target.dataset.port;if(port){if(pending&&pending!==port){if(!wires.some(w=>w.includes(pending)&&w.includes(port)))wire(...pending.split(':').map(Number),...port.split(':').map(Number));pending=null;}else pending=port;render();return;}if(e.target.dataset.wire!==undefined){selected=null;selectedWire=+e.target.dataset.wire;inspect();render();return;}const g=e.target.closest('[data-id]');if(g){selected=+g.dataset.id;selectedWire=-1;const p=parts.find(p=>p.id===selected),q=pos(e);drag={id:p.id,dx:q.x-p.x,dy:q.y-p.y};svg.setPointerCapture(e.pointerId);inspect();render();}};
svg.onpointermove=e=>{if(!drag)return;const p=parts.find(p=>p.id===drag.id),q=pos(e);p.x=Math.max(70,Math.min(830,q.x-drag.dx));p.y=Math.max(60,Math.min(440,q.y-drag.dy));render();};svg.onpointerup=svg.onpointercancel=()=>drag=null;svg.ondblclick=e=>{const g=e.target.closest('[data-id]'),p=g&&parts.find(p=>p.id===+g.dataset.id);if(p?.type==='switch'){p.closed=!p.closed;render();}};
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{selected=add(b.dataset.add);selectedWire=-1;render();inspect();});$('apply').onclick=()=>{const p=parts.find(p=>p.id===selected),v=Number($('value').value);if(!Number.isFinite(v)||v<=0||v>1e9){$('status').textContent='请输入大于 0 且不超过 10⁹ 的有限数值。';$('status').className='error';return;}p.value=v;render();};$('toggle').onclick=()=>{const p=parts.find(p=>p.id===selected);if(p){p.closed=!p.closed;render();}};$('delete').onclick=()=>{if(selected!=null){parts=parts.filter(p=>p.id!==selected);wires=wires.filter(w=>!w.some(k=>k.startsWith(selected+':')));}else if(selectedWire>=0)wires.splice(selectedWire,1);selected=null;selectedWire=-1;pending=null;render();inspect();};$('cancel').onclick=()=>{pending=null;render();};$('series').onclick=$('reset').onclick=()=>preset();$('parallel').onclick=()=>preset(true);$('empty').onclick=()=>{parts=[];wires=[];selected=null;selectedWire=-1;pending=null;render();inspect();};let view={x:0,y:0,w:900,h:500};function zoom(f){const w=Math.max(225,Math.min(900,view.w*f)),h=w*500/900;view.x+=(view.w-w)/2;view.y+=(view.h-h)/2;view.w=w;view.h=h;svg.setAttribute('viewBox',[view.x,view.y,w,h].join(' '));}$('zoom-in').onclick=()=>zoom(.65);$('zoom-out').onclick=()=>zoom(1/.65);$('fit').onclick=()=>{view={x:0,y:0,w:900,h:500};svg.setAttribute('viewBox','0 0 900 500');};const startPointer=svg.onpointerdown,movePointer=svg.onpointermove;let pan=null;svg.onpointerdown=e=>{if(!e.target.closest('[data-id]')&&e.target.dataset.wire===undefined){pan={x:e.clientX,y:e.clientY};svg.setPointerCapture(e.pointerId);}else startPointer(e);};svg.onpointermove=e=>{if(pan){const b=svg.getBoundingClientRect();view.x-=(e.clientX-pan.x)/b.width*view.w;view.y-=(e.clientY-pan.y)/b.width*view.w;pan={x:e.clientX,y:e.clientY};svg.setAttribute('viewBox',[view.x,view.y,view.w,view.h].join(' '));}else movePointer(e);};svg.onpointerup=svg.onpointercancel=()=>{drag=null;pan=null;};preset();
window.circuit={getState:()=>({parts:structuredClone(parts),wires:structuredClone(wires),readings:structuredClone(readings),error}),connect:(a,ap,b,bp)=>{wire(a,ap,b,bp);render();},setSwitch:(id,closed)=>{parts.find(p=>p.id===id).closed=closed;render();}};
</script></html>
