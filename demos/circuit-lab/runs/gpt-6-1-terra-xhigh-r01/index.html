<!doctype html><html lang="zh-CN"><head><script src="../../../../assets/analytics.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简化电路实验台</title><style>
*{box-sizing:border-box}body{margin:0;background:#101d25;color:#e4eee9;font:14px/1.5 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:22px}h1{font-size:clamp(25px,4vw,38px);margin:2px 0}p{color:#a7bdb7}.panel{background:#1a3037;border:1px solid #34505a;border-radius:14px;padding:14px;margin:12px 0}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input{font:inherit}button{background:#2e5458;color:#e9f5ef;border:1px solid #527876;border-radius:8px;padding:8px 11px;cursor:pointer}button:hover{background:#437b72}button.selected{outline:2px solid #f2cb73}input{width:82px;background:#0e2228;border:1px solid #56756e;color:white;border-radius:6px;padding:7px}.canvas{width:100%;height:min(60vh,520px);min-height:330px;background:#10252c;border-radius:10px;touch-action:none;display:block}svg text{pointer-events:none;user-select:none}.wire{stroke:#84b4a8;stroke-width:3}.part{cursor:grab}.part rect{fill:#21434a;stroke:#71998d;stroke-width:2}.part.selected rect{stroke:#f4ca75}.port{fill:#f4ca75;stroke:#122b2d;stroke-width:3;cursor:crosshair}.pending{fill:#fff}.part text{fill:#e8f3e9;text-anchor:middle;font-size:14px}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.result{background:#11272c;border-radius:8px;padding:10px}.warning{color:#ffd38b;min-height:24px}.hint{font-size:13px}@media(max-width:500px){main{padding:12px}button{padding:7px;font-size:13px}.canvas{height:420px}.panel{padding:10px}}
</style></head><body><main><small>DC CIRCUIT / 实验台</small><h1>简化电路实验台</h1><p>放置元件、连接端子，观察电压与电流。</p><section class="panel"><div class="controls"><button data-add="battery">＋ 电池</button><button data-add="resistor">＋ 电阻</button><button data-add="bulb">＋ 灯泡</button><button data-add="switch">＋ 开关</button><button id="series">串联预设</button><button id="parallel">并联预设</button><button id="reset">重置</button></div><p class="hint">拖动元件移动；依次点击两个金色端子连线，再次点击同一端子取消。点击元件后可修改、切换或删除。灯泡为固定电阻模型，亮度仅表示耗散功率。</p></section><section class="panel"><svg id="board" class="canvas" viewBox="0 0 900 500" aria-label="电路画布"></svg></section><section class="panel"><div class="controls"><strong id="selection">未选择元件</strong><label id="valueLabel" hidden>数值 <input id="value" type="number" step="any"> <span id="unit"></span></label><button id="apply" hidden>应用数值</button><button id="toggle" hidden>切换开关</button><button id="delete" hidden>删除元件</button><button id="clearWires">清除导线</button></div><p class="warning" id="message" aria-live="polite"></p><div id="results" class="results"></div></section></main><script>
const $=id=>document.getElementById(id),svg=$('board'),NS='http://www.w3.org/2000/svg';let parts=[],wires=[],next=1,selected=null,pending=null,drag=null;const types={battery:'电池',resistor:'电阻',bulb:'灯泡',switch:'开关'};function add(type,x=450,y=250,value){let p={id:next++,type,x,y,value:value??(type==='battery'?12:type==='resistor'?100:type==='bulb'?100:1)};parts.push(p);return p}function connect(a,ap,b,bp){wires.push([`${a.id}:${ap}`,`${b.id}:${bp}`])}function el(name,attrs={}){let n=document.createElementNS(NS,name);for(let [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n}function port(id){let [i,s]=id.split(':').map(Number),p=parts.find(p=>p.id===i);return p?{x:p.x+(s?50:-50),y:p.y}:null}function render(){svg.replaceChildren();for(let [a,b] of wires){let x=port(a),y=port(b);if(x&&y)svg.appendChild(el('line',{x1:x.x,y1:x.y,x2:y.x,y2:y.y,class:'wire'}))}for(let p of parts){let g=el('g',{class:'part'+(selected===p.id?' selected':''),transform:`translate(${p.x} ${p.y})`,'data-id':p.id});g.appendChild(el('rect',{x:-42,y:-26,width:84,height:52,rx:9}));let t=el('text',{x:0,y:-4});t.textContent=types[p.type]+' '+p.id;g.appendChild(t);let sub=el('text',{x:0,y:15});sub.textContent=p.type==='switch'?(p.value?'闭合':'断开'):p.value+(p.type==='battery'?' V':' Ω');g.appendChild(sub);for(let s=0;s<2;s++)g.appendChild(el('circle',{cx:s?50:-50,cy:0,r:9,class:'port'+(pending===`${p.id}:${s}`?' pending':''),'data-port':`${p.id}:${s}`}));svg.appendChild(g)}let p=parts.find(p=>p.id===selected);$('selection').textContent=p?types[p.type]+' '+p.id:'未选择元件';$('valueLabel').hidden=!p||p.type==='switch';$('apply').hidden=!p||p.type==='switch';$('toggle').hidden=!p||p.type!=='switch';$('delete').hidden=!p;if(p&&p.type!=='switch'){$('value').value=p.value;$('unit').textContent=p.type==='battery'?'V':'Ω'}solve()}
function coords(e){let r=svg.getBoundingClientRect(),scale=Math.min(r.width/900,r.height/500),left=r.left+(r.width-900*scale)/2,top=r.top+(r.height-500*scale)/2;return{x:(e.clientX-left)/scale,y:(e.clientY-top)/scale}}
svg.addEventListener('pointerdown',e=>{let term=e.target.dataset.port;if(term){e.stopPropagation();if(pending===term)pending=null;else if(pending){if(!wires.some(w=>w.includes(pending)&&w.includes(term)))wires.push([pending,term]);pending=null}else pending=term;render();return}let g=e.target.closest('[data-id]');if(!g)return;selected=+g.dataset.id;let p=parts.find(p=>p.id===selected),c=coords(e);drag={id:p.id,dx:p.x-c.x,dy:p.y-c.y};svg.setPointerCapture(e.pointerId);render()});svg.addEventListener('pointermove',e=>{if(!drag)return;let p=parts.find(p=>p.id===drag.id),c=coords(e);p.x=Math.max(55,Math.min(845,c.x+drag.dx));p.y=Math.max(30,Math.min(470,c.y+drag.dy));render()});svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null);
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let p=add(b.dataset.add,180+(parts.length%5)*130,100+Math.floor(parts.length/5)*90);selected=p.id;render()});$('apply').onclick=()=>{let p=parts.find(p=>p.id===selected),v=Number($('value').value);if(!Number.isFinite(v)||(p.type!=='battery'&&v<=0)){ $('message').textContent='请输入有效数值；电阻必须大于零。';return}p.value=v;render()};$('toggle').onclick=()=>{let p=parts.find(p=>p.id===selected);p.value=p.value?0:1;render()};$('delete').onclick=()=>{wires=wires.filter(w=>!w.some(x=>x.startsWith(selected+':')));parts=parts.filter(p=>p.id!==selected);selected=null;pending=null;render()};$('clearWires').onclick=()=>{wires=[];pending=null;render()};
function preset(parallel){parts=[];wires=[];next=1;selected=null;pending=null;let b=add('battery',140,250,12),r1=add('resistor',400,150,100),r2=add('resistor',650,parallel?350:150,200);if(parallel){connect(b,1,r1,1);connect(b,1,r2,1);connect(b,0,r1,0);connect(b,0,r2,0)}else{connect(b,1,r1,1);connect(r1,0,r2,1);connect(r2,0,b,0)}render()}$('series').onclick=()=>preset(false);$('parallel').onclick=()=>preset(true);$('reset').onclick=()=>{parts=[];wires=[];next=1;selected=null;pending=null;render()};
function solve(){let parent=new Map();const root=x=>{let p=parent.get(x);if(p===x)return x;let r=root(p);parent.set(x,r);return r},join=(a,b)=>{a=root(a);b=root(b);if(a!==b)parent.set(b,a)};for(let p of parts){parent.set(p.id+':0',p.id+':0');parent.set(p.id+':1',p.id+':1')}for(let [a,b] of wires)join(a,b);const shortParent=new Map(parent);const shortRoot=x=>{while(shortParent.get(x)!==x)x=shortParent.get(x);return x};for(let p of parts)if(p.type==='switch'&&p.value){let a=shortRoot(root(p.id+':0')),b=shortRoot(root(p.id+':1'));if(a!==b)shortParent.set(b,a)}const nodes=[...new Set([...parent.keys()].map(root))],adj=new Map(nodes.map(n=>[n,new Set()]));for(let p of parts)if(p.type!=='switch'||p.value){let a=root(p.id+':0'),b=root(p.id+':1');adj.get(a).add(b);adj.get(b).add(a)}let groups=[],seen=new Set();for(let n of nodes)if(!seen.has(n)){let q=[n],g=[];seen.add(n);while(q.length){let v=q.pop();g.push(v);for(let k of adj.get(v))if(!seen.has(k)){seen.add(k);q.push(k)}}groups.push(g)}let values=new Map(),issues=[];for(let group of groups){let components=parts.filter(p=>(p.type!=='switch'||p.value)&&group.includes(root(p.id+':0'))),bats=components.filter(p=>p.type==='battery'||p.type==='switch');if(bats.some(p=>p.type==='battery'&&shortRoot(root(p.id+':0'))===shortRoot(root(p.id+':1')))){issues.push('电源短路：理想电源两端被导线连接，无法给出有限电流。');continue}let index=new Map(group.slice(1).map((n,i)=>[n,i])),size=group.length-1+bats.length;if(!size){for(let p of components)values.set(p.id,{v:0,i:0});continue}let M=Array.from({length:size},()=>Array(size+1).fill(0));function stamp(a,b,v){if(index.has(a)&&index.has(b))M[index.get(a)][index.get(b)]+=v}for(let p of components){let a=root(p.id+':0'),b=root(p.id+':1');if(p.type==='battery'||p.type==='switch'){let k=group.length-1+bats.indexOf(p);if(index.has(b)){M[index.get(b)][k]+=1;M[k][index.get(b)]+=1}if(index.has(a)){M[index.get(a)][k]-=1;M[k][index.get(a)]-=1}M[k][size]=p.type==='battery'?p.value:0}else{let g=1/p.value;stamp(a,a,g);stamp(b,b,g);stamp(a,b,-g);stamp(b,a,-g)}}let bad=false;for(let c=0;c<size;c++){let best=c;for(let r=c+1;r<size;r++)if(Math.abs(M[r][c])>Math.abs(M[best][c]))best=r;if(Math.abs(M[best][c])<1e-10){bad=true;break}[M[c],M[best]]=[M[best],M[c]];let v=M[c][c];for(let j=c;j<=size;j++)M[c][j]/=v;for(let r=0;r<size;r++)if(r!==c){let k=M[r][c];for(let j=c;j<=size;j++)M[r][j]-=k*M[c][j]}}if(bad){issues.push('理想电源相互冲突或电路无唯一解，请检查电源连接。');continue}let voltage=n=>index.has(n)?M[index.get(n)][size]:0;for(let p of components){let v=voltage(root(p.id+':1'))-voltage(root(p.id+':0')),i=p.type==='battery'||p.type==='switch'?-M[group.length-1+bats.indexOf(p)][size]:v/p.value;values.set(p.id,{v,i})}}$('message').textContent=issues.join(' ')||(parts.length?'计算完成；开路支路电流为零。':'添加元件或选择预设开始。');$('results').replaceChildren();for(let p of parts){let d=document.createElement('div');d.className='result';let v=values.get(p.id);if(p.type==='switch'&&!p.value)d.textContent=`开关 ${p.id} · 断开 · 电流 0 A`;else if(v){let direction=Math.abs(v.i)<1e-9?'无方向':(p.type==='battery'||p.type==='switch')?(v.i>=0?'左 → 右':'右 → 左'):(v.i>=0?'右 → 左':'左 → 右');d.textContent=`${types[p.type]} ${p.id} · 电压 ${(Math.abs(v.v)<1e-9?0:v.v).toFixed(3)} V · 电流 ${Math.abs(v.i).toFixed(3)} A ${direction}`;if(p.type==='bulb'){let rect=svg.querySelector(`[data-id="${p.id}"] rect`);rect.style.fill=`hsl(45 80% ${20+Math.min(45,v.i*v.i*p.value*25)}%)`;}if(p.type==='bulb')d.textContent+=` · 功率 ${(v.i*v.i*p.value).toFixed(3)} W · 亮度 ${Math.min(100,Math.round(v.i*v.i*p.value/2*100))}%`}else d.textContent=`${types[p.type]} ${p.id} · 无法求解`; $('results').appendChild(d)}}preset(false);
</script></body></html>
