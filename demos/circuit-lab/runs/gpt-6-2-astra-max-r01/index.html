<!doctype html>
<html lang="zh-CN"><head>
<script src="../../../../assets/analytics.js" defer></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直流电路实验台</title><style>
:root{--ink:#162924;--paper:#f2f3ef;--panel:#fff;--line:#d2d9d2;--accent:#006851;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,"Segoe UI","Microsoft YaHei",sans-serif}main,header>div{width:min(1344px,94%);margin:auto}header{border-bottom:1px solid var(--line)}header>div,.row,.bar,.readout{display:flex;align-items:center;gap:10px}header>div{height:57px;justify-content:space-between}header strong{display:flex;align-items:center;gap:9px;font-size:15px}.mark{width:20px;height:20px;background:var(--accent);border-radius:4px;display:inline-grid;place-items:center;color:var(--paper);font:bold 14px monospace}.mono,.eyebrow,output,.metrics b{font-family:"IBM Plex Mono",Consolas,monospace;font-variant-numeric:tabular-nums}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:700}.intro{display:flex;align-items:end;justify-content:space-between;gap:18px;padding:30px 0 23px}.intro h1{font-size:clamp(31px,4vw,52px);line-height:1.14;letter-spacing:-.045em;margin:5px 0 8px}.intro p,.hint{color:color-mix(in srgb,var(--ink) 70%,var(--paper));margin:0;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 283px;gap:16px;align-items:start}.stage,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;min-width:0}.panel{padding:19px}.panel h2,.bar h2{font-size:15px;letter-spacing:.01em;margin:0}.panel h3{font-size:13px;margin:16px 0 8px}.panel section+section{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.bar{padding:12px 16px;justify-content:space-between;border-bottom:1px solid var(--line);flex-wrap:wrap}.bar small{opacity:.72}.bar.foot{border-bottom:0;border-top:1px solid var(--line)}.row{flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}button,select,input{font:inherit;color:inherit}button,select,input[type=text],input[type=number]{border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:8px 11px;font-size:13px;min-height:37px}button{cursor:pointer;font-weight:600}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.45;cursor:default}button.primary,button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}.field{display:grid;gap:5px;margin:12px 0}.field>span{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600}input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0}.metrics{padding:12px 17px;display:flex;gap:23px;flex-wrap:wrap}.metrics span{font-size:12px}.metrics b{display:block;font-size:21px}.legend{display:flex;flex-wrap:wrap;gap:6px 15px;font-size:12px}.key{display:inline-block;vertical-align:middle;width:10px;height:10px;margin-right:5px;border-radius:2px}.work{width:100%;display:block;touch-action:none}.below{margin:14px 0 30px}select,input{max-width:100%}dialog{color:var(--ink)}@media(max-width:840px){.layout{grid-template-columns:minmax(0,1fr) 236px}.panel{padding:13px}}@media(max-width:720px){main,header>div{width:min(94%,560px)}.layout{grid-template-columns:minmax(0,1fr)}.intro{padding:17px 0 15px;align-items:start;flex-wrap:wrap}.intro h1{font-size:34px}.panel{padding:16px}.metrics{gap:14px}.bar{padding:9px 12px}header>div{height:46px}}#palette{margin-top:10px}.ledger{padding:0 14px 8px}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:9px 4px;border-top:1px solid var(--line);font:13px Consolas,"Microsoft YaHei",monospace}th{font-weight:600}#board text{font:14px "Segoe UI","Microsoft YaHei",sans-serif;pointer-events:none}.pin{cursor:crosshair}.component{cursor:grab}.wire{cursor:pointer}.bad{color:#aa392d}.field input[type=number]{width:100%}#inspector .row{margin-top:10px}
</style></head><body><header><div><strong><i class="mark" aria-hidden="true">∿</i>伏特手记</strong><span class="eyebrow">DC CIRCUIT LAB</span></div></header><main><div class="intro"><div><h1>直流电路实验台</h1><p>搭建电路，观察每一条支路上的电压与电流。</p></div><div class="row"><button id="series">串联预设</button><button id="parallel">并联预设</button><button id="reset">重置</button></div></div><div class="layout"><article class="stage"><div class="bar"><h2>接线板</h2><small>点两个端子接线 · 拖动元件移动</small></div>
<svg id="board" class="work" viewBox="0 0 740 408" aria-label="可编辑的直流接线板"><defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c5d1c9"/></pattern></defs><rect width="740" height="408" fill="#eff4ec"/><rect width="740" height="408" fill="url(#dots)"/><g id="wires"></g><g id="parts"></g></svg>
<div class="bar foot"><strong id="solution" role="status"></strong><small id="message" aria-live="polite">选择元件可编辑参数</small></div>
<div class="ledger"><table><thead><tr><th>元件</th><th>电压 A−B</th><th>电流大小</th><th>方向</th></tr></thead><tbody id="results"></tbody></table></div></article><aside class="panel"><section><h2>元件盒</h2><p class="hint">点击放入接线板</p><div class="grid2" id="palette"><button data-type="battery">＋ 电池</button><button data-type="resistor">＋ 电阻</button><button data-type="switch">＋ 开关</button><button data-type="lamp">＋ 灯泡</button></div></section>
<section><h2>元件参数</h2><div id="inspector"></div></section>
<section><h2>接线说明</h2><p class="hint">端子从左到右为 A、B。电池 A 为正极。点导线移除接线，按 Esc 取消正在连接的端子。</p><p class="hint">灯泡按固定电阻建模，发光强度随耗散功率变化。</p></section></aside></div><div class="below"></div></main><script>
"use strict";
const $=id=>document.getElementById(id);
const names={battery:'电池',resistor:'电阻',switch:'开关',lamp:'灯泡'};
let parts=[],wires=[],number=0,selected=null,pending=null,drag=null;
function insert(type,x,y,value){
  const part={id:++number,type,x,y,value:value??(type==='battery'?12:type==='switch'?0:100),closed:true};
  parts.push(part);return part;
}
const terminal=(p,k)=>p.id+':'+k;
const ends=p=>[terminal(p,'a'),terminal(p,'b')];
function link(p,a,q,b,via=null){wires.push({a:terminal(p,a),b:terminal(q,b),via});}
function preset(parallel){
  parts=[];wires=[];number=0;pending=null;drag=null;
  const bat=insert('battery',310,322,12);
  const r1=insert('resistor',parallel?345:245,96,100);
  const r2=insert('resistor',parallel?345:477,parallel?201:96,200);
  const sw=insert('switch',525,322);
  link(bat,'a',r1,'a',116);
  if(parallel){link(r1,'a',r2,'a',116);link(r1,'b',r2,'b',625);link(r2,'b',sw,'b',625);}
  else{link(r1,'b',r2,'a');link(r2,'b',sw,'b',625);}
  link(sw,'a',bat,'b');selected=bat.id;note('点端子开始接线');update();
}
class Sets{
  constructor(items){this.parents=new Map(items.map(k=>[k,k]));}
  root(k){const v=this.parents.get(k);if(v!==k)this.parents.set(k,this.root(v));return this.parents.get(k);}
  join(a,b){this.parents.set(this.root(a),this.root(b));}
}
function linear(m){
  const n=m.length;let rank=0;
  for(let col=0;col<n;col++){
    let pivot=rank;
    for(let row=rank;row<n;row++)if(Math.abs(m[row][col])>Math.abs(m[pivot][col]))pivot=row;
    if(Math.abs(m[pivot][col])<1e-10)continue;
    [m[rank],m[pivot]]=[m[pivot],m[rank]];
    const divisor=m[rank][col];for(let j=col;j<=n;j++)m[rank][j]/=divisor;
    for(let i=0;i<n;i++)if(i!==rank){const f=m[i][col];for(let j=col;j<=n;j++)m[i][j]-=f*m[rank][j];}
    rank++;
  }
  if(m.slice(rank).some(row=>Math.abs(row[n])>1e-8))throw Error('理想电源电压约束冲突');
  if(rank<n)throw Error('电路无唯一解：理想支路电流无法确定');
  return m.map(row=>row[n]);
}
function solve(){
  const pins=parts.flatMap(ends), nets=new Sets(pins), shorts=new Sets(pins);
  for(const w of wires){nets.join(w.a,w.b);shorts.join(w.a,w.b);}
  for(const p of parts)if(p.type==='switch'&&p.closed)shorts.join(...ends(p));
  const edges=parts.map(p=>({p,a:nets.root(ends(p)[0]),b:nets.root(ends(p)[1])}));
  for(const {p} of edges)if(p.type==='battery'&&p.value!==0&&shorts.root(ends(p)[0])===shorts.root(ends(p)[1]))throw Error('电源短路，请检查接线');
  const nodes=[...new Set(edges.flatMap(e=>[e.a,e.b]))], groups=new Sets(nodes);
  for(const {p,a,b} of edges)if(p.type!=='switch'||p.closed)groups.join(a,b);
  const free=nodes.filter(n=>groups.root(n)!==n), indices=new Map(free.map((n,i)=>[n,i]));
  const sources=edges.filter(({p})=>p.type==='battery'||(p.type==='switch'&&p.closed));
  const n=free.length+sources.length,m=Array.from({length:n},()=>new Float64Array(n+1));
  function stamp(i,j,val){if(i!==undefined&&j!==undefined)m[i][j]+=val;}
  for(const {p,a,b} of edges){
    const i=indices.get(a),j=indices.get(b);
    if(p.type==='lamp'||p.type==='resistor'){const g=1/p.value;stamp(i,i,g);stamp(j,j,g);stamp(i,j,-g);stamp(j,i,-g);}
  }
  const current=new Map();
  sources.forEach(({p,a,b},s)=>{
    const i=indices.get(a),j=indices.get(b),k=free.length+s;
    stamp(i,k,1);stamp(j,k,-1);stamp(k,i,1);stamp(k,j,-1);
    m[k][n]=p.type==='battery'?p.value:0;current.set(p.id,k);
  });
  const v=linear(m);
  return new Map(edges.map(({p,a,b})=>{
    const drop=groups.root(a)===groups.root(b)?(v[indices.get(a)]??0)-(v[indices.get(b)]??0):null;
    const amps=current.has(p.id)?v[current.get(p.id)]:p.type==='switch'?0:drop/p.value;
    return [p.id,{drop,amps}];
  }));
}
function fmt(x){return x===null?'浮置':String(Number((Math.abs(x)<1e-10?0:x).toPrecision(5)));}
function label(p){return names[p.type]+' '+p.id;}
function setting(p){return p.type==='switch'?(p.closed?'闭合':'断开'):p.value+(p.type==='battery'?' V':' Ω');}
function loc(pin){const [id,k]=pin.split(':'),p=parts.find(e=>e.id===Number(id));return {x:p.x+(k==='a'?-54:54),y:p.y};}
function note(s){$('message').textContent=s;}
function symbol(p,s){
  const common='fill="none" stroke="#253f38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"';
  if(p.type==='battery')return '<path '+common+' d="M-54 0H-6 M7 0H54 M-6 -14V14 M7 -8V8"/><text x="-30" y="-9">+</text>';
  if(p.type==='switch')return '<path '+common+' d="M-54 0H-19 M19 0H54 M-19 0L16 '+(p.closed?'0':'-19')+'"/><circle cx="19" r="4" fill="#314d44"/>';
  if(p.type==='lamp'){
    const power=s?s.amps*s.amps*p.value:0,level=1-Math.exp(-power*3);
    return '<path '+common+' d="M-54 0H-15 M15 0H54"/><circle r="18" fill="rgb(255,'+Math.round(255-level*45)+','+Math.round(250-level*215)+')" stroke="#354a41" stroke-width="3"/><path '+common+' d="M-9 -9L9 9 M-9 9L9 -9"/>';
  }
  return '<path '+common+' d="M-54 0H-22 M22 0H54"/><rect x="-22" y="-9" width="44" height="18" rx="2" fill="#e8b56b" stroke="#354a41" stroke-width="3"/>';
}
function render(){
  let solution,error;try{solution=solve();}catch(e){error=e.message;}
  $('solution').textContent=error||(parts.length?'已求解 · '+parts.length+' 个元件':'接线板为空');$('solution').className=error?'bad':'';
  $('wires').innerHTML=wires.map((w,i)=>{
    const u=loc(w.a),v=loc(w.b),mid=w.via??(u.x+v.x)/2;
    const d='M'+u.x+' '+u.y+'H'+mid+'V'+v.y+'H'+v.x;
    return '<g data-wire="'+i+'" class="wire"><path d="'+d+'" stroke="#528875" fill="none" stroke-width="4"/><path d="'+d+'" stroke="transparent" fill="none" stroke-width="18"/></g>';
  }).join('');
  $('parts').innerHTML=parts.map(p=>{
    const s=solution?.get(p.id);
    return '<g class="component" data-id="'+p.id+'" transform="translate('+p.x+' '+p.y+')"><rect x="-47" y="-40" width="94" height="80" rx="9" fill="'+(p.id===selected?'#e0ece1':'#f8faf3')+'" stroke="'+(p.id===selected?'#568b77':'#c3d2c5')+'"/><text y="-22" text-anchor="middle">'+label(p)+'</text>'+symbol(p,s)+'<text y="30" text-anchor="middle">'+setting(p)+'</text>'+ends(p).map((pin,i)=>'<g class="pin" data-pin="'+pin+'" tabindex="0" role="button" aria-label="'+label(p)+' 端子 '+(i?'B':'A')+'" transform="translate('+(i?54:-54)+' 0)"><circle r="19" fill="transparent"/><circle r="7" fill="'+(pin===pending?'#dc6b32':'#fffdf3')+'" stroke="#29705a" stroke-width="3"/></g>').join('')+'</g>';
  }).join('');
  $('results').innerHTML=parts.map(p=>{const s=solution?.get(p.id);return '<tr><td>'+label(p)+'</td><td>'+(s?fmt(s.drop)+(s.drop===null?'':' V'):'—')+'</td><td>'+(s?fmt(Math.abs(s.amps))+' A':'—')+'</td><td>'+(s&&Math.abs(s.amps)>1e-10?(s.amps>0?'A → B':'B → A'):'—')+'</td></tr>';}).join('');
}
function inspect(){
  const p=parts.find(p=>p.id===selected);
  $('inspector').innerHTML=p?'<h3>'+label(p)+'</h3>'+(p.type==='switch'?'<button id="toggle">切换为'+(p.closed?'断开':'闭合')+'</button>':'<label class="field"><span>'+(p.type==='battery'?'电压（V）':'电阻（Ω）')+'</span><input id="value" type="number" step="any" value="'+p.value+'"></label>')+'<div class="row"><button id="remove">删除此元件</button></div>':'<p class="hint">点击板上的元件查看参数。</p>';
  if(!p)return;
  if($('toggle'))$('toggle').onclick=()=>{p.closed=!p.closed;update();};
  if($('value'))$('value').onchange=e=>{const v=e.target.valueAsNumber;if(!Number.isFinite(v)||Math.abs(v)>1e6||(p.type!=='battery'&&v<0.1)){note('请输入有效数值，电阻范围为 0.1 至 1000000 Ω');e.target.value=p.value;return;}p.value=v;render();};
  $('remove').onclick=()=>{const pins=ends(p);wires=wires.filter(w=>!pins.includes(w.a)&&!pins.includes(w.b));parts=parts.filter(q=>q!==p);pending=null;selected=null;update();};
}
function update(){inspect();render();}
function connect(pin){
  if(!pending){pending=pin;note('请选择另一个端子');}
  else{if(pin!==pending&&!wires.some(w=>(w.a===pin&&w.b===pending)||(w.a===pending&&w.b===pin))){wires.push({a:pending,b:pin,via:null});note('已连接');}else note('已取消重复接线');pending=null;}
  render();
}
const board=$('board');
function position(e){const p=new DOMPoint(e.clientX,e.clientY);return p.matrixTransform(board.getScreenCTM().inverse());}
board.onpointerdown=e=>{
  const pin=e.target.closest('[data-pin]'),part=e.target.closest('[data-id]'),wire=e.target.closest('[data-wire]');
  if(pin){connect(pin.dataset.pin);return;}
  if(part){const p=parts.find(v=>v.id===+part.dataset.id),at=position(e);selected=p.id;drag={p,dx:p.x-at.x,dy:p.y-at.y};board.setPointerCapture(e.pointerId);update();}
  else if(wire){wires.splice(+wire.dataset.wire,1);note('已移除导线');update();}
};
board.onpointermove=e=>{if(!drag)return;const at=position(e);drag.p.x=Math.max(60,Math.min(680,at.x+drag.dx));drag.p.y=Math.max(43,Math.min(365,at.y+drag.dy));render();};
board.onpointerup=board.onpointercancel=()=>{drag=null;};
board.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.pin){e.preventDefault();connect(e.target.dataset.pin);}};
document.onkeydown=e=>{if(e.key==='Escape'){pending=null;note('已取消接线');render();}};
$('palette').onclick=e=>{if(!e.target.dataset.type)return;const p=insert(e.target.dataset.type,120+(number%4)*142,165+number%3*48);selected=p.id;update();};
$('series').onclick=$('reset').onclick=()=>preset(false);$('parallel').onclick=()=>preset(true);preset(false);
</script></body></html>
