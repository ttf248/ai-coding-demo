<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伏特工作室 · 直流电路实验台</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#233447;font:14px system-ui}header{padding:24px 4vw;border-bottom:1px solid #cfdae2;display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:4px 0}small{color:#728396}main{padding:25px 4vw;max-width:1500px;margin:auto;display:grid;grid-template-columns:235px 1fr;gap:22px}aside,.work{min-width:0;background:#fff;border:1px solid #d3dee7;border-radius:16px;padding:20px}h2{font-size:15px;margin:0 0 15px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,select,input{font:inherit;border:1px solid #c7d4df;border-radius:8px;padding:10px;background:white;color:inherit;max-width:100%}button{cursor:pointer}button:hover{background:#e3eef8}button.primary{background:#245c84;color:white}label{display:block;margin:16px 0 8px}select,input{width:100%}p{font-size:12px;line-height:1.8;color:#697d91}svg{display:block;width:100%;background:#f3f7fa;border:1px solid #dde7ed;border-radius:10px;touch-action:none}svg text{pointer-events:none;user-select:none}.port{cursor:crosshair}.part{cursor:grab}.wire{cursor:pointer}#status{padding:12px;background:#eaf2f8;border-radius:8px;margin:14px 0;line-height:1.6}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;border-bottom:1px solid #e5edf2;padding:10px 5px}th{color:#75879a}.table-wrap{overflow:auto}#selection{min-height:30px;font-weight:600}.positive{color:#23755a}@media(max-width:760px){header{padding:18px}h1{font-size:22px}main{grid-template-columns:1fr;padding:14px;gap:14px}aside{padding:16px}.work{padding:12px}.row button{flex-grow:1}svg{min-height:280px}}</style>
<header><div><small>VOLT STUDIO / 实验 02</small><h1>把想法，接成电路。</h1></div><small>理想直流 · 实时求解</small></header>
<main><aside><h2>元件盒</h2><div class="row"><button data-add="battery">＋ 电池</button><button data-add="resistor">＋ 电阻</button><button data-add="switch">＋ 开关</button><button data-add="lamp">＋ 灯泡</button></div><label for="preset">示例电路</label><select id="preset"><option value="series">12V / 100Ω + 200Ω 串联</option><option value="parallel">12V / 100Ω ∥ 200Ω 并联</option><option value="blank">空白实验台</option></select><div class="row"><button id="reset">重置</button><button id="cancel">取消连线</button></div><hr><h2>元件属性</h2><div id="selection">请选择元件</div><label for="value">数值（电池 V / 电阻与灯泡 Ω）</label><input id="value" type="number" min="0.001" max="1000000" step="any" disabled><div class="row"><button id="toggle" disabled>切换开关</button><button id="remove" disabled>删除所选</button></div><p>点两个端子完成连线。拖动元件中部移动，连线自动跟随。点击导线可选中删除。电池左端为正极；结果箭头以左端 A → 右端 B 为正方向。</p><p>灯泡采用固定电阻模型，亮度由 P = I²R 决定。理想导线与闭合开关压降为零，其内部电流分配不单独求解。</p></aside><section class="work"><svg id="board" viewBox="0 0 900 550" aria-label="电路接线画布"></svg><div id="status" role="status"></div><div class="table-wrap"><table><thead><tr><th>元件</th><th>V(A) − V(B)</th><th>电流与方向</th><th>功率</th></tr></thead><tbody id="results"></tbody></table></div></section></main>
<script>
'use strict';const $=id=>document.getElementById(id),svg=$('board'),NS='http://www.w3.org/2000/svg';let parts=[],wires=[],next=1,selected=null,pending=null,drag=null,solution={};const names={battery:'电池',resistor:'电阻',switch:'开关',lamp:'灯泡'};
function make(type,x,y,value=type==='battery'?12:100){const p={id:next++,type,x,y,value,closed:true};parts.push(p);return p}
const terminal=(p,k)=>[p.x+(k?65:-65),p.y];
function node(tag,attrs,parent=svg){const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))if(k==='text')n.textContent=v;else n.setAttribute(k,v);parent.append(n);return n}
function solve(){const ids=parts.flatMap(p=>[p.id+'a',p.id+'b']),parent=new Map(ids.map(i=>[i,i]));const find=i=>parent.get(i)===i?i:(parent.set(i,find(parent.get(i))),parent.get(i));const join=(a,b)=>{a=find(a);b=find(b);if(a!==b)parent.set(a,b)};wires.forEach(w=>join(w.a,w.b));parts.filter(p=>p.type==='switch'&&p.closed).forEach(p=>join(p.id+'a',p.id+'b'));const endpoints=p=>[find(p.id+'a'),find(p.id+'b')];const roots=[...new Set(ids.map(find))],graph=new Map(roots.map(i=>[i,[]]));for(const p of parts)if(p.type!=='switch'){const[a,b]=endpoints(p);graph.get(a).push(b);graph.get(b).push(a)}const groups=[],seen=new Set;for(const root of roots)if(!seen.has(root)){const g=[],queue=[root];seen.add(root);while(queue.length){const n=queue.pop();g.push(n);for(const k of graph.get(n))if(!seen.has(k)){seen.add(k);queue.push(k)}}groups.push(g)}const volts=new Map,which=new Map,result={};let error=null;
 for(let gi=0;gi<groups.length;gi++){const group=groups[gi];group.forEach(n=>which.set(n,gi));const ref=group[0],unknown=group.slice(1),ix=new Map(unknown.map((n,i)=>[n,i]));const devices=parts.filter(p=>p.type!=='switch'&&group.includes(endpoints(p)[0]));const sources=devices.filter(p=>p.type==='battery');if(sources.some(p=>{const[a,b]=endpoints(p);return a===b&&Math.abs(p.value)>1e-9})){error='电源短路：理想电源两端被零电阻导线连接。请断开短路线。';break}const n=unknown.length+sources.length,A=Array.from({length:n},()=>new Float64Array(n+1));const stamp=(a,b,v)=>{if(a!==undefined&&b!==undefined)A[a][b]+=v};for(const p of devices){const[a,b]=endpoints(p),i=ix.get(a),j=ix.get(b);if(p.type==='battery'){const k=unknown.length+sources.indexOf(p);stamp(i,k,1);stamp(j,k,-1);stamp(k,i,1);stamp(k,j,-1);A[k][n]=p.value}else{const g=1/p.value;stamp(i,i,g);stamp(j,j,g);stamp(i,j,-g);stamp(j,i,-g)}}let rank=0;const pivots=[];for(let c=0;c<n;c++){let pivot=rank;for(let r=rank;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[pivot]?.[c]||0))pivot=r;if(!A[pivot]||Math.abs(A[pivot][c])<1e-10)continue;[A[pivot],A[rank]]=[A[rank],A[pivot]];const d=A[rank][c];for(let k=c;k<=n;k++)A[rank][k]/=d;for(let r=0;r<n;r++)if(r!==rank){const m=A[r][c];for(let k=c;k<=n;k++)A[r][k]-=m*A[rank][k]}pivots.push(c);rank++}if(A.some(row=>row.slice(0,n).every(v=>Math.abs(v)<1e-8)&&Math.abs(row[n])>1e-8)){error='理想电源相互冲突：电压约束无法同时成立。';break}if(rank<n){error='电路无唯一解：存在冗余理想电源约束，无法唯一确定电流。';break}const x=new Float64Array(n);pivots.forEach((c,r)=>x[c]=A[r][n]);volts.set(ref,0);unknown.forEach((r,i)=>volts.set(r,x[i]));for(const p of devices){const[a,b]=endpoints(p),v=volts.get(a)-volts.get(b),i=p.type==='battery'?x[unknown.length+sources.indexOf(p)]:v/p.value;result[p.id]={v,i,power:v*i}}}
 for(const p of parts.filter(p=>p.type==='switch')){const[a,b]=endpoints(p);result[p.id]={v:which.get(a)===which.get(b)?volts.get(a)-volts.get(b):null,i:p.closed?null:0,power:0}}
 return error?{error,results:{}}:{error:null,results:result};}
const fmt=n=>n===null||n===undefined?'不确定':Math.abs(n)<1e-9?'0':Number(n.toPrecision(5)).toString();
function render(){solution=solve();svg.replaceChildren();node('defs',{});for(let x=25;x<900;x+=25)for(let y=25;y<550;y+=25)node('circle',{cx:x,cy:y,r:1,fill:'#ccdae4'});for(const w of wires){const a=parts.find(p=>p.id===parseInt(w.a)),b=parts.find(p=>p.id===parseInt(w.b));if(!a||!b)continue;const[x1,y1]=terminal(a,w.a.endsWith('b')),[x2,y2]=terminal(b,w.b.endsWith('b'));const path=`M${x1} ${y1} L${(x1+x2)/2} ${y1} L${(x1+x2)/2} ${y2} L${x2} ${y2}`;node('path',{d:path,stroke:selected==='w'+w.id?'#e88b45':'#49778d','stroke-width':4,fill:'none'});const hit=node('path',{d:path,stroke:'transparent','stroke-width':20,fill:'none',class:'wire'});hit.onpointerdown=e=>{e.stopPropagation();selected='w'+w.id;inspect();render()}}
 for(const p of parts){const g=node('g',{class:'part'}),r=solution.results[p.id];node('rect',{x:p.x-55,y:p.y-36,width:110,height:72,rx:12,fill:selected===p.id?'#dceef8':'#fff',stroke:selected===p.id?'#277fab':'#adc1ce','stroke-width':2},g);if(p.type==='resistor')node('path',{d:`M${p.x-35} ${p.y} l10 -12 l12 24 l12 -24 l12 24 l12 -24 l10 12`,fill:'none',stroke:'#48738d','stroke-width':3},g);if(p.type==='battery'){node('path',{d:`M${p.x-10} ${p.y-18} v36 M${p.x+10} ${p.y-10} v20`,stroke:'#42667e','stroke-width':4},g);node('text',{x:p.x-34,y:p.y+5,text:'+',fill:'#bd6245'},g)}if(p.type==='switch')node('path',{d:`M${p.x-35} ${p.y} L${p.x-18} ${p.y} L${p.x+25} ${p.y-(p.closed?0:23)} M${p.x+25} ${p.y} L${p.x+36} ${p.y}`,stroke:'#446d82','stroke-width':4,fill:'none'},g);if(p.type==='lamp'){node('circle',{cx:p.x,cy:p.y,r:23,fill:`rgba(255,192,53,${Math.min(1,.12+(r?.power||0)/2)})`,stroke:'#c89b44','stroke-width':2},g);node('text',{x:p.x,y:p.y+6,'text-anchor':'middle',text:'×','font-size':26,fill:'#936918'},g)}node('text',{x:p.x,y:p.y-48,'text-anchor':'middle',text:names[p.type]+' '+p.id,fill:'#375168','font-size':16},g);node('text',{x:p.x,y:p.y+59,'text-anchor':'middle',text:p.type==='switch'?(p.closed?'闭合':'断开'):p.value+(p.type==='battery'?' V':' Ω'),fill:'#678294','font-size':17},g);g.onpointerdown=e=>{selected=p.id;const pt=point(e);drag={id:p.id,dx:pt.x-p.x,dy:pt.y-p.y};svg.setPointerCapture(e.pointerId);inspect();render()};for(let k=0;k<2;k++){const[x,y]=terminal(p,k),key=p.id+(k?'b':'a');const port=node('circle',{cx:x,cy:y,r:15,fill:pending===key?'#ebac45':'#f6fbff',stroke:'#448aa8','stroke-width':3,class:'port'});port.onpointerdown=e=>{e.stopPropagation();if(pending&&pending!==key){if(!wires.some(w=>(w.a===pending&&w.b===key)||(w.a===key&&w.b===pending)))wires.push({id:next++,a:pending,b:key});pending=null}else pending=pending===key?null:key;render()}}}
 $('status').textContent=solution.error||(pending?'已选端子，请点击另一个端子完成连接。':parts.length?'求解完成 · 每个独立电路采用自己的参考电位。开路支路电流为零。':'从元件盒添加元件开始。');$('status').style.color=solution.error?'#a43e37':'#315d78';$('results').replaceChildren();for(const p of parts){const r=solution.results[p.id],tr=document.createElement('tr');tr.innerHTML=`<td>${names[p.type]} ${p.id}</td><td>${r?fmt(r.v)+' V':'—'}</td><td>${r?(r.i===null?'理想导体 · 未求内部电流':fmt(Math.abs(r.i))+' A '+(r.i>1e-9?'A → B':r.i< -1e-9?'B → A':'')):'—'}</td><td>${r?fmt(r.power)+' W':'—'}</td>`;$('results').append(tr)}}
function inspect(){const p=parts.find(p=>p.id===selected);$('selection').textContent=p?names[p.type]+' '+p.id:typeof selected==='string'?'已选导线':'请选择元件';$('value').disabled=!p||p.type==='switch';$('value').value=p?.value||'';$('toggle').disabled=p?.type!=='switch';$('remove').disabled=selected===null}
function point(e){return new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse())}svg.onpointermove=e=>{if(!drag)return;const p=parts.find(p=>p.id===drag.id),pt=point(e);p.x=Math.max(90,Math.min(810,pt.x-drag.dx));p.y=Math.max(80,Math.min(470,pt.y-drag.dy));render()};svg.onpointerup=svg.onpointercancel=()=>drag=null;
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const p=make(b.dataset.add,160+(parts.length%4)*180,100+Math.floor(parts.length/4)%3*160);selected=p.id;inspect();render()});$('remove').onclick=()=>{if(typeof selected==='number'){parts=parts.filter(p=>p.id!==selected);wires=wires.filter(w=>parseInt(w.a)!==selected&&parseInt(w.b)!==selected)}else wires=wires.filter(w=>'w'+w.id!==selected);selected=null;pending=null;inspect();render()};$('value').onchange=e=>{const p=parts.find(p=>p.id===selected),v=Number(e.target.value);if(!p)return;if(!Number.isFinite(v)||v<=0||v>1e6){$('status').textContent='请输入大于 0 且不超过 1,000,000 的有限数值。';e.target.value=p.value;return}p.value=v;render()};$('toggle').onclick=()=>{const p=parts.find(p=>p.id===selected);if(p?.type==='switch'){p.closed=!p.closed;render()}};$('cancel').onclick=()=>{pending=null;render()};
function preset(name){parts=[];wires=[];next=1;pending=selected=null;if(name!=='blank'){const b=make('battery',200,370,12),r1=make('resistor',220,140,100),r2=make('resistor',580,name==='series'?140:260,200),s=make('switch',610,410);const connect=(a,ka,b,kb)=>wires.push({id:next++,a:a.id+ka,b:b.id+kb});connect(b,'a',r1,'a');if(name==='series'){connect(r1,'b',r2,'a');connect(r2,'b',s,'a')}else{connect(r1,'a',r2,'a');connect(r1,'b',r2,'b');connect(r2,'b',s,'a')}connect(s,'b',b,'b')}inspect();render()}
$('preset').onchange=e=>preset(e.target.value);$('reset').onclick=()=>preset($('preset').value);preset('series');window.lab={preset,solve,get parts(){return parts},get wires(){return wires},render,make};
</script></html>
