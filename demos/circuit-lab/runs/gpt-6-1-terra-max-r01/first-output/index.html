<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简化电路实验台</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf1f2;color:#172c32;font:15px/1.5 system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:24px}header{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:18px}h1{font-size:clamp(28px,4vw,40px);margin:0;letter-spacing:-.04em}header p{margin:0;color:#657c7e}.tag{color:#17846e;font-size:12px;letter-spacing:.12em;font-weight:bold}.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 260px;gap:14px}.panel{background:white;border:1px solid #d9e3e2;border-radius:16px;padding:17px;min-width:0}.panel h2{font-size:13px;color:#687e7f;letter-spacing:.06em;margin:0 0 10px}.section+.section{border-top:1px solid #e7eeed;margin-top:18px;padding-top:18px}button,input{font:inherit}button{border:1px solid #c8d9d6;background:#f7fbfa;color:#23463e;padding:8px 10px;border-radius:8px;cursor:pointer}button:hover{background:#def4ed}button.primary{background:#167d68;color:white;border-color:#167d68}button.danger{color:#a23b3b}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.help{font-size:12px;color:#657c7e}.stage{overflow:hidden;padding:0}.stage-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 15px;border-bottom:1px solid #e0e9e7}.stage-head strong{font-size:14px}svg{display:block;width:100%;background-color:#f9fbfa;background-image:radial-gradient(#d6e4df 1px,transparent 1px);background-size:18px 18px;touch-action:none;min-height:290px}svg .part{cursor:grab}svg .terminal{cursor:crosshair}svg text{user-select:none}.status{padding:12px 15px;font-size:13px;min-height:58px;color:#236e5c;background:#effaf6}.status.error{color:#9b3d32;background:#fff2ee}.values{font-variant-numeric:tabular-nums}.values>div{border-bottom:1px solid #edf1f1;padding:8px 0}.values small{display:block;color:#657c7e}.value-row{display:flex;justify-content:space-between;gap:5px}label{display:block;font-size:13px;color:#526a6a;margin-top:8px}input{width:100%;padding:8px;border:1px solid #cbdad7;border-radius:7px}#selection{min-height:30px}@media(max-width:1050px){.layout{grid-template-columns:210px minmax(0,1fr)}.results{grid-column:1/-1}}@media(max-width:700px){main{padding:16px 10px}.layout{grid-template-columns:1fr}.stage{order:-1}header p{font-size:12px}.results{grid-column:auto}}
</style></head><body><main><header><div><div class="tag">CIRCUIT LAB / 直流实验</div><h1>简化电路实验台</h1><p>连接元件，观察电压与电流。</p></div></header><div class="layout"><aside class="panel"><div class="section"><h2>添加元件</h2><div class="buttons"><button data-add="battery">＋ 电池</button><button data-add="resistor">＋ 电阻</button><button data-add="lamp">＋ 灯泡</button><button data-add="switch">＋ 开关</button></div><p class="help">点击两个端子连线，拖动元件移动。点击元件可修改参数或删除。绿色端子为连线起点。</p></div><div class="section"><h2>示例电路</h2><div class="buttons"><button id="series">串联预设</button><button id="parallel">并联预设</button><button id="reset">清空重置</button></div></div><div class="section"><h2>选中元件</h2><div id="selection" class="help">点击画布中的元件</div><div id="editor"></div></div></aside><section class="panel stage"><div class="stage-head"><strong>电路画布</strong><small>电流方向：元件左端 → 右端为正</small></div><svg id="board" viewBox="0 0 900 560" aria-label="可触摸的电路画布"></svg><div class="status" id="status" role="status"></div></section><aside class="panel results"><h2>计算结果</h2><div class="values" id="results"></div><p class="help">理想电池、导线和开关；灯泡是固定电阻，其亮度仅由耗散功率近似表示。电压按左端减右端，负电流表示方向相反。未连接电源的孤立部分以零电流显示。</p></aside></div></main><script>
(()=>{'use strict';const svg=document.querySelector('#board'),$=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';let parts=[],wires=[],selected=null,pending=null,drag=null,seq=0;const names={battery:'电池',resistor:'电阻',lamp:'灯泡',switch:'开关'};function add(type,x=130+(seq%4)*185,y=120+Math.floor(seq/4)*130,value){const c={id:'c'+(++seq),type,x,y,value:value??(type==='battery'?12:100),closed:true};parts.push(c);return c}function wire(a,ap,b,bp){wires.push({a:a.id,ap,b:b.id,bp})}function coords(p,pin){return[p.x+(pin==='a'?-46:46),p.y]}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function solve(){let parent={};const key=(p,pin)=>p.id+':'+pin,find=x=>{while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x]}return x},union=(a,b)=>{a=find(a);b=find(b);if(a!==b)parent[b]=a};for(const p of parts)for(const pin of ['a','b'])parent[key(p,pin)]=key(p,pin);for(const w of wires)if(parent[w.a+':'+w.ap]&&parent[w.b+':'+w.bp])union(w.a+':'+w.ap,w.b+':'+w.bp);const nodes=[...new Set(Object.keys(parent).map(find))],edges=parts.filter(p=>p.type!=='switch'||p.closed).map(p=>({p,a:find(key(p,'a')),b:find(key(p,'b'))}));for(const e of edges)if(e.a===e.b&&e.p.type==='battery'&&e.p.value!==0)return{error:'电源短路：电池两端被理想导线直接连接，电流无法以有限值表示。'};const graph=Object.fromEntries(nodes.map(n=>[n,[]]));for(const e of edges){graph[e.a].push(e.b);graph[e.b].push(e.a)}const groups=[],seen=new Set();for(const n of nodes){if(seen.has(n))continue;const group=[],stack=[n];seen.add(n);while(stack.length){let x=stack.pop();group.push(x);for(const v of graph[x])if(!seen.has(v)){seen.add(v);stack.push(v)}}groups.push(group)}const result={};for(const p of parts)result[p.id]={v:0,i:0};for(const group of groups){const groupSet=new Set(group),es=edges.filter(e=>groupSet.has(e.a)),sources=es.filter(e=>e.p.type==='battery'||e.p.type==='switch');if(!sources.length)continue;const ref=group[0],rest=group.slice(1),idx=Object.fromEntries(rest.map((n,i)=>[n,i])),size=rest.length+sources.length;if(!size)continue;const A=Array.from({length:size},()=>Array(size+1).fill(0));function stamp(i,j,v){if(i!==undefined&&j!==undefined)A[i][j]+=v}for(const e of es){const a=idx[e.a],b=idx[e.b];if(e.p.type==='resistor'||e.p.type==='lamp'){let g=1/e.p.value;stamp(a,a,g);stamp(b,b,g);stamp(a,b,-g);stamp(b,a,-g)}else{const k=rest.length+sources.indexOf(e);stamp(a,k,1);stamp(b,k,-1);stamp(k,a,1);stamp(k,b,-1);A[k][size]=e.p.type==='battery'?e.p.value:0}}let rank=0;for(let col=0;col<size;col++){let pivot=rank;for(let r=rank;r<size;r++)if(Math.abs(A[r][col])>Math.abs(A[pivot]?.[col]??0))pivot=r;if(Math.abs(A[pivot]?.[col]??0)<1e-10)continue;[A[rank],A[pivot]]=[A[pivot],A[rank]];let q=A[rank][col];for(let j=col;j<=size;j++)A[rank][j]/=q;for(let r=0;r<size;r++)if(r!==rank){q=A[r][col];for(let j=col;j<=size;j++)A[r][j]-=q*A[rank][j]}rank++}if(rank<size){const inconsistent=A.some(row=>row.slice(0,size).every(v=>Math.abs(v)<1e-9)&&Math.abs(row[size])>1e-9);return{error:inconsistent?'理想电源相互冲突，电路无解。':'电路没有唯一解：理想电源或闭合开关形成冗余回路。'}}const voltage=n=>n===ref?0:A[idx[n]][size];for(const e of es){const v=voltage(e.a)-voltage(e.b),i=e.p.type==='resistor'||e.p.type==='lamp'?v/e.p.value:A[rest.length+sources.indexOf(e)][size];result[e.p.id]={v:Math.abs(v)<1e-10?0:v,i:Math.abs(i)<1e-10?0:i}}}return{result}}function render(){const solution=solve(),res=solution.result||{};let out='';for(const w of wires){const a=parts.find(p=>p.id===w.a),b=parts.find(p=>p.id===w.b);if(!a||!b)continue;const [x1,y1]=coords(a,w.ap),[x2,y2]=coords(b,w.bp);out+=`<path d="M ${x1} ${y1} L ${(x1+x2)/2} ${y1} L ${(x1+x2)/2} ${y2} L ${x2} ${y2}" fill="none" stroke="#319b82" stroke-width="5" stroke-linejoin="round"/>`}for(const p of parts){const r=res[p.id]||{v:0,i:0},power=Math.abs(r.v*r.i),glow=p.type==='lamp'?Math.min(1,power/2):0,symbol=p.type==='battery'?'＋  | |  −':p.type==='resistor'?'Ω':p.type==='lamp'?'✦':p.closed?'ON':'OFF';out+=`<g class="part" data-id="${p.id}"><rect x="${p.x-40}" y="${p.y-25}" width="80" height="50" rx="10" fill="${p.type==='lamp'&&glow?'#ffe6a2':'#fff'}" stroke="${selected===p.id?'#128c71':'#83a8a0'}" stroke-width="${selected===p.id?3:2}"/><text x="${p.x}" y="${p.y+6}" text-anchor="middle" font-size="19" fill="#254a41">${symbol}</text><text x="${p.x}" y="${p.y-33}" text-anchor="middle" font-size="14" fill="#335a53">${names[p.type]} ${p.type==='battery'?p.value+'V':p.type==='resistor'||p.type==='lamp'?p.value+'Ω':''}</text></g>`;for(const pin of ['a','b']){const [x,y]=coords(p,pin),active=pending?.id===p.id&&pending?.pin===pin;out+=`<circle class="terminal" data-id="${p.id}" data-pin="${pin}" cx="${x}" cy="${y}" r="10" fill="${active?'#13b987':'white'}" stroke="#16836a" stroke-width="3"/>`}}svg.innerHTML=out;$('#status').className='status'+(solution.error?' error':'');$('#status').textContent=solution.error||(!parts.length?'添加元件，或选择一个预设开始实验。':pending?'请选择另一个端子完成连线。':'已按节点电压法实时求解；开路支路电流为零。');$('#results').innerHTML=parts.length?parts.map(p=>{let r=res[p.id],v=r?`${r.v.toFixed(3)} V`:'—',i=r?`${r.i.toFixed(4)} A`:'—';return`<div><strong>${esc(names[p.type])} ${p.id.slice(1)}</strong><div class="value-row"><span>电压 ${v}</span><span>电流 ${i}</span></div>${p.type==='lamp'&&r?`<small>功率 ${Math.abs(r.v*r.i).toFixed(3)} W · 固定电阻模型</small>`:''}</div>`}).join(''):'<small>尚无元件</small>';const p=parts.find(x=>x.id===selected);$('#selection').textContent=p?`${names[p.type]} ${p.id.slice(1)}`:'点击画布中的元件';$('#editor').innerHTML=p?`${p.type==='switch'?`<button id="toggle">${p.closed?'断开开关':'闭合开关'}</button>`:`<label>${p.type==='battery'?'电压 (V)':'电阻 (Ω)'}<input id="value" type="number" step="any" min="${p.type==='battery'?'-10000':'0.001'}" value="${p.value}"></label>`}<p><button id="delete" class="danger">删除元件和连线</button></p>`:'';if(p){const input=$('#value');if(input)input.onchange=()=>{const v=Number(input.value);if(!Number.isFinite(v)||(p.type!=='battery'&&v<=0)||Math.abs(v)>10000){input.setCustomValidity('请输入有效数值；电阻必须大于零。');input.reportValidity();return}input.setCustomValidity('');p.value=v;render()};const toggle=$('#toggle');if(toggle)toggle.onclick=()=>{p.closed=!p.closed;render()};$('#delete').onclick=()=>{parts=parts.filter(x=>x!==p);wires=wires.filter(w=>w.a!==p.id&&w.b!==p.id);selected=null;pending=null;render()}}}function point(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}svg.addEventListener('pointerdown',e=>{const pin=e.target.closest('.terminal'),part=e.target.closest('.part');if(pin){const id=pin.dataset.id,k=pin.dataset.pin;if(pending&&!(pending.id===id&&pending.pin===k)){wires.push({a:pending.id,ap:pending.pin,b:id,bp:k});pending=null}else pending=pending?null:{id,pin:k};render();return}if(part){const p=parts.find(x=>x.id===part.dataset.id),pt=point(e);selected=p.id;drag={p,dx:pt.x-p.x,dy:pt.y-p.y};svg.setPointerCapture(e.pointerId);render()}else{selected=null;pending=null;render()}});svg.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e);drag.p.x=Math.max(50,Math.min(850,p.x-drag.dx));drag.p.y=Math.max(50,Math.min(510,p.y-drag.dy));render()});svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null);document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const p=add(b.dataset.add);selected=p.id;render()});function preset(parallel){parts=[];wires=[];seq=0;selected=null;pending=null;const battery=add('battery',150,280,12),r1=add('resistor',430,170,100),r2=add('resistor',parallel?430:700,parallel?390:280,200);if(parallel){wire(battery,'a',r1,'a');wire(battery,'a',r2,'a');wire(r1,'b',battery,'b');wire(r2,'b',battery,'b')}else{wire(battery,'a',r1,'a');wire(r1,'b',r2,'a');wire(r2,'b',battery,'b')}render()}$('#series').onclick=()=>preset(false);$('#parallel').onclick=()=>preset(true);$('#reset').onclick=()=>{parts=[];wires=[];seq=0;selected=null;pending=null;render()};preset(false)})();
</script></body></html>
