<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简化电路实验台</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2ed;color:#213c36;font:15px system-ui}main{max-width:1250px;margin:auto;padding:24px}h1{font-size:30px;margin:8px 0}header small{letter-spacing:3px;color:#3c8270}p{line-height:1.7;color:#59736b}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px;background:white;border:1px solid #cedbd1;border-radius:10px;margin:14px 0}button,input{padding:10px;border:1px solid #b4cabc;background:#fff;border-radius:6px;color:inherit}button{cursor:pointer}button:hover{background:#e1eee6}.primary{background:#285e4e;color:white}canvas{display:block;width:100%;height:480px;touch-action:none;background:#fafcf7;border:1px solid #c6d6c9;border-radius:12px}#status{padding:14px;border-left:4px solid #398775;background:#e0ebe3;line-height:1.6}#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px}.reading{background:white;padding:14px;border:1px solid #cfddd2;border-radius:8px}.reading strong{display:block;margin-bottom:8px}#value{width:100px}#editor{min-height:60px}@media(max-width:500px){main{padding:12px}h1{font-size:24px}canvas{height:410px}}</style><main><header><small>DIRECT CURRENT / 实验 01</small><h1>把电路，接起来。</h1><p>理想直流电源与电阻网络 · 实时节点求解</p></header><div class="toolbar"><button data-add="battery">＋ 电池</button><button data-add="resistor">＋ 电阻</button><button data-add="lamp">＋ 灯泡</button><button data-add="switch">＋ 开关</button><button id="series" class="primary">串联预设</button><button id="parallel">并联预设</button><button id="reset">一键重置</button></div><p>点击两个空心端子连线；拖动元件中部移动。点击元件后修改参数或删除；点击导线可删除。开关通过下方按钮切换。接线中点击空白处取消。</p><canvas id="board" aria-label="电路编辑画布"></canvas><div id="editor" class="toolbar">选择元件以编辑</div><div id="status" role="status"></div><div id="results"></div><p>电阻与灯泡使用固定电阻模型，灯泡亮度由 P = I²R 决定。导线和闭合开关为理想零电阻；电流正方向为端子 A → B。电池 A 为正极。独立浮置网络分别选取参考电位，其间电压不确定。</p></main><script>
const $=id=>document.getElementById(id),c=$('board'),ctx=c.getContext('2d');const names={battery:'电池',resistor:'电阻',lamp:'灯泡',switch:'开关'};let parts=[],wires=[],seq=0,selected=null,pending=null,drag=null,readings=new Map(),vw=1000,vh=480;
function add(type,x=160+(seq%4)*170,y=100+Math.floor(seq%8/4)*160){let p={id:++seq,type,x,y,value:type==='battery'?12:type==='lamp'?100:100,closed:true};parts.push(p);return p}function terminal(p,b){return {x:p.x+(b?46:-46),y:p.y}}function key(p,b){return `${p.id}:${b}`}function connect(a,ap,b,bp){wires.push([key(a,ap),key(b,bp)])}function locate(k){let [id,b]=k.split(':').map(Number),p=parts.find(p=>p.id===id);return p?terminal(p,b):null}
function preset(parallel=false){parts=[];wires=[];seq=0;selected=null;pending=null;let a=add('battery',vw*.24,130),b=add('resistor',vw*.73,130),d=add('resistor',vw*.73,300),s=add('switch',vw*.24,300);d.value=200;if(parallel){connect(a,0,b,0);connect(b,0,d,0);connect(b,1,d,1);connect(d,1,s,0);connect(s,1,a,1)}else{connect(a,0,b,0);connect(b,1,d,0);connect(d,1,s,0);connect(s,1,a,1)}editUI();solve()}
function solve(){readings.clear();let keys=parts.flatMap(p=>[key(p,0),key(p,1)]),parent=new Map(keys.map(k=>[k,k]));function root(k){if(parent.get(k)!==k)parent.set(k,root(parent.get(k)));return parent.get(k)}function join(a,b){parent.set(root(a),root(b))}wires.forEach(w=>join(...w));let nodes=[...new Set(keys.map(root))],nodeIndex=new Map(nodes.map((n,i)=>[n,i])),ends=p=>[nodeIndex.get(root(key(p,0))),nodeIndex.get(root(key(p,1)))];
let sources=parts.filter(p=>p.type==='battery'||p.type==='switch'&&p.closed);let conductiveParent=nodes.map((_,i)=>i);function cr(i){return conductiveParent[i]===i?i:conductiveParent[i]=cr(conductiveParent[i])}parts.filter(p=>p.type==='switch'&&p.closed).forEach(p=>{let[a,b]=ends(p);conductiveParent[cr(a)]=cr(b)});if(sources.some(p=>{let[a,b]=ends(p);return p.type==='battery'&&cr(a)===cr(b)})){return failure('电源短路：理想电源的两端已通过零电阻路径连接。请移除短接导线或断开开关。')}
let adj=nodes.map(()=>[]);parts.filter(p=>p.type!=='switch'||p.closed).forEach(p=>{let[a,b]=ends(p);adj[a].push(b);adj[b].push(a)});let component=Array(nodes.length).fill(-1),refs=[],nc=0;nodes.forEach((_,i)=>{if(component[i]>=0)return;refs.push(i);let q=[i];component[i]=nc;while(q.length){let n=q.pop();for(let v of adj[n])if(component[v]<0){component[v]=nc;q.push(v)}}nc++});let unknowns=nodes.map((_,i)=>i).filter(i=>!refs.includes(i)),ix=new Map(unknowns.map((n,i)=>[n,i])),size=unknowns.length+sources.length,A=Array.from({length:size},()=>Array(size+1).fill(0));function stamp(r,col,v){if(r!==undefined&&col!==undefined)A[r][col]+=v}
parts.filter(p=>p.type==='resistor'||p.type==='lamp').forEach(p=>{let[a,b]=ends(p),i=ix.get(a),j=ix.get(b),g=1/p.value;stamp(i,i,g);stamp(j,j,g);stamp(i,j,-g);stamp(j,i,-g)});sources.forEach((p,k)=>{let[a,b]=ends(p),i=ix.get(a),j=ix.get(b),z=unknowns.length+k;stamp(i,z,1);stamp(j,z,-1);stamp(z,i,1);stamp(z,j,-1);A[z][size]=p.type==='switch'?0:p.value});
let row=0,pivots=[];for(let col=0;col<size;col++){let best=row;for(let r=row+1;r<size;r++)if(Math.abs(A[r][col])>Math.abs(A[best]?.[col]||0))best=r;if(row>=size||Math.abs(A[best][col])<1e-10)continue;[A[row],A[best]]=[A[best],A[row]];let scale=A[row][col];for(let k=col;k<=size;k++)A[row][k]/=scale;for(let r=0;r<size;r++)if(r!==row){let f=A[r][col];for(let k=col;k<=size;k++)A[r][k]-=f*A[row][k]}pivots.push(col);row++}
if(A.some(r=>r.slice(0,size).every(v=>Math.abs(v)<1e-8)&&Math.abs(r[size])>1e-7))return failure('理想电源相互冲突：电压约束不一致，请检查电源极性与电压。');if(row<size)return failure('电路无唯一解：冗余理想电源导致电源支路电流不确定，请移除重复电源。');let sol=Array(size).fill(0);pivots.forEach((col,r)=>sol[col]=A[r][size]);let voltage=n=>ix.has(n)?sol[ix.get(n)]:0;parts.forEach(p=>{let[a,b]=ends(p),v=component[a]===component[b]?voltage(a)-voltage(b):null;let current=(p.type==='battery'||p.type==='switch'&&p.closed)?sol[unknowns.length+sources.indexOf(p)]:p.type==='switch'?0:(v??0)/p.value;readings.set(p.id,{v,current,power:current===null?0:Math.abs((v??0)*current)})});$('status').textContent=parts.length?'计算完成 · 开路支路电流为零。闭合开关使用零电压约束求取电流。':'空白实验台 · 添加元件开始搭建。';renderResults();draw()}
function failure(msg){$('status').textContent=msg;renderResults();draw()}function fmt(v,u){return v===null?'不确定':`${Math.abs(v)<1e-9?'0':Number(v.toFixed(5))} ${u}`}function renderResults(){$('results').innerHTML=parts.map(p=>{let r=readings.get(p.id);return `<div class="reading"><strong>${names[p.type]} ${p.id}</strong>${r?`电压 ${fmt(r.v,'V')}<br>电流 ${fmt(r.current,'A')}${r.current===null?'':r.current<0?' · B → A':r.current>0?' · A → B':''}${p.type==='lamp'?`<br>功率 ${fmt(r.power,'W')}`:''}`:'等待有效电路'}</div>`}).join('')}
function editUI(){let p=parts.find(p=>p.id===selected);$('editor').innerHTML=p?`<strong>${names[p.type]} ${p.id}</strong>${p.type==='switch'?`<button id="toggle">${p.closed?'断开':'闭合'}开关</button>`:`<label>${p.type==='battery'?'电压 V':'电阻 Ω'} <input id="value" type="number" min="0.001" max="1000000" step="any" value="${p.value}"></label><button id="apply">应用</button>`}<button id="delete">删除元件</button><button id="cancel">取消连线</button>`:'选择元件以编辑';if(!p)return;$('delete').onclick=()=>{parts=parts.filter(a=>a!==p);wires=wires.filter(w=>w.every(k=>!k.startsWith(p.id+':')));pending=null;selected=null;editUI();solve()};$('cancel').onclick=()=>{pending=null;draw()};if(p.type==='switch')$('toggle').onclick=()=>{p.closed=!p.closed;editUI();solve()};else $('apply').onclick=()=>{let v=Number($('value').value);if(!Number.isFinite(v)||v<=0||v>1e6){$('status').textContent='请输入大于 0 且不超过 1000000 的有效数值。';return}p.value=v;solve()}}
function draw(){ctx.clearRect(0,0,vw,vh);ctx.fillStyle='#d8e3d5';for(let y=10;y<vh;y+=20)for(let x=10;x<vw;x+=20){ctx.beginPath();ctx.arc(x,y,1,0,7);ctx.fill()}ctx.lineWidth=3;ctx.strokeStyle='#718d7b';wires.forEach(w=>{let a=locate(w[0]),b=locate(w[1]);if(!a||!b)return;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()});parts.forEach(p=>{let a=terminal(p,0),b=terminal(p,1);ctx.strokeStyle=p.id===selected?'#167964':'#345d4e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a.x,p.y);ctx.lineTo(p.x-28,p.y);ctx.moveTo(p.x+28,p.y);ctx.lineTo(b.x,p.y);ctx.stroke();ctx.fillStyle='#fafcf7';ctx.fillRect(p.x-29,p.y-22,58,44);if(p.type==='lamp'){let pow=readings.get(p.id)?.power||0;ctx.fillStyle=`rgba(255,193,35,${Math.min(1,pow/2)})`;ctx.beginPath();ctx.arc(p.x,p.y,22,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(p.x-12,p.y-12);ctx.lineTo(p.x+12,p.y+12);ctx.moveTo(p.x+12,p.y-12);ctx.lineTo(p.x-12,p.y+12);ctx.stroke()}else if(p.type==='resistor'){ctx.strokeRect(p.x-28,p.y-14,56,28)}else if(p.type==='battery'){ctx.beginPath();ctx.moveTo(p.x-8,p.y-22);ctx.lineTo(p.x-8,p.y+22);ctx.moveTo(p.x+8,p.y-12);ctx.lineTo(p.x+8,p.y+12);ctx.stroke()}else{ctx.beginPath();ctx.moveTo(p.x-28,p.y);ctx.lineTo(p.x+28,p.y-(p.closed?0:24));ctx.stroke()}ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillStyle='#345d4e';ctx.fillText(`${names[p.type]} ${p.id}${p.type==='switch'?'':` · ${p.value}${p.type==='battery'?'V':'Ω'}`}`,p.x,p.y+42);[a,b].forEach((t,i)=>{ctx.beginPath();ctx.arc(t.x,t.y,8,0,7);ctx.fillStyle=pending===key(p,i)?'#e5b746':'#fafcf7';ctx.fill();ctx.stroke();ctx.fillStyle='#345d4e';ctx.fillText(i?'B':'A',t.x,t.y-15)})})}
function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*vw,y:(e.clientY-r.top)/r.height*vh}}c.onpointerdown=e=>{let t=point(e);for(let p of [...parts].reverse())for(let i=0;i<2;i++){let z=terminal(p,i);if(Math.hypot(t.x-z.x,t.y-z.y)<16){let k=key(p,i);if(pending&&pending!==k){if(!wires.some(w=>w.includes(k)&&w.includes(pending)))wires.push([pending,k]);pending=null;solve()}else{pending=pending===k?null:k;draw()}return}}let p=[...parts].reverse().find(p=>Math.abs(t.x-p.x)<33&&Math.abs(t.y-p.y)<29);if(p){selected=p.id;drag={p,dx:t.x-p.x,dy:t.y-p.y};c.setPointerCapture(e.pointerId);editUI();draw();return}pending=null;let hit=wires.findIndex(w=>{let a=locate(w[0]),b=locate(w[1]),dx=b.x-a.x,dy=b.y-a.y,f=Math.max(0,Math.min(1,((t.x-a.x)*dx+(t.y-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(t.x-a.x-f*dx,t.y-a.y-f*dy)<7});if(hit>=0){wires.splice(hit,1);solve()}draw()};c.onpointermove=e=>{if(!drag)return;let t=point(e);drag.p.x=Math.max(55,Math.min(vw-55,t.x-drag.dx));drag.p.y=Math.max(40,Math.min(vh-50,t.y-drag.dy));draw()};c.onpointerup=c.onpointercancel=()=>drag=null;
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let p=add(b.dataset.add,Math.min(vw-60,80+(seq%3)*100),100+(seq%3)*100);selected=p.id;editUI();solve()});$('series').onclick=()=>preset();$('parallel').onclick=()=>preset(true);$('reset').onclick=()=>preset();function resize(){let old=vw;vw=c.clientWidth;vh=c.clientHeight;c.width=vw*Math.min(devicePixelRatio,2);c.height=vh*Math.min(devicePixelRatio,2);ctx.setTransform(c.width/vw,0,0,c.height/vh,0,0);parts.forEach(p=>p.x=Math.max(55,Math.min(vw-55,p.x/old*vw)));draw()}window.onresize=resize;preset();resize();
</script></html>
