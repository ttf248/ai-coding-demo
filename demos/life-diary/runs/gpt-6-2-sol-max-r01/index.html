<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2eee6" />
    <title>藏禾 · 情绪日记与生活助手</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="../../../../assets/analytics.js" defer></script>
  </head>
  <body class="m-0 bg-[#ede9e0] text-[#263f36] antialiased">
    <header class="mx-auto max-w-[1250px] px-5 pb-4 pt-7 sm:pt-10">
      <div class="flex flex-wrap items-baseline gap-x-4 gap-y-2">
        <h1 class="font-serif text-4xl font-bold tracking-[-.07em] sm:text-6xl">
          藏禾
        </h1>
        <p class="text-sm font-medium text-[#56665e]">情绪日记与生活助手</p>
      </div>
      <nav
        id="links"
        aria-label="原型界面"
        class="mt-4 flex flex-wrap gap-2"
      ></nav>
    </header>
    <main
      id="screens"
      class="mx-auto grid max-w-[1250px] grid-cols-[minmax(0,375px)] justify-center gap-x-5 gap-y-7 px-2.5 pb-10 min-[810px]:grid-cols-[repeat(2,minmax(0,375px))] min-[1200px]:grid-cols-[repeat(3,minmax(0,375px))]"
    ></main>
    <noscript>请启用 JavaScript 使用原型。</noscript>
    <script>
      const $ = (id) => document.getElementById(id);
      const sections = [
        ["today", "今日", "check-circle-2"],
        ["journal", "日记", "square-pen"],
        ["rhythm", "回顾", "chart-column"],
        ["assist", "禾伴", "sparkles"],
        ["me", "我的", "settings-2"],
      ];
      const moods = [
        { name: "明朗", face: "☀", value: 5 },
        { name: "平静", face: "◒", value: 4 },
        { name: "平常", face: "≈", value: 3 },
        { name: "低落", face: "☂", value: 2 },
        { name: "紧张", face: "ϟ", value: 1 },
      ];
      const btn =
        "rounded-xl bg-[#255344] px-4 py-2.5 text-sm font-semibold text-white hover:bg-[#346a58] focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-[#255344]";
      const soft =
        "rounded-xl border border-[#dbded2] bg-white px-3 py-2 text-xs font-semibold text-[#385c4c] hover:bg-[#edf3e8]";
      const panel = "rounded-2xl border border-[#e3e3d9] bg-white p-4";
      const icon = (name, size = "w-5 h-5") =>
        '<img alt="" class="' +
        size +
        ' opacity-75 shrink-0" src="https://unpkg.com/lucide-static@0.468.0/icons/' +
        name +
        '.svg">';
      const displayDate = (date, options) =>
        new Intl.DateTimeFormat("zh-CN", options).format(date);
      function dateKey(date) {
        return [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, "0"),
          String(date.getDate()).padStart(2, "0"),
        ].join("-");
      }
      function relative(day) {
        const d = new Date();
        d.setDate(d.getDate() + day);
        return d;
      }
      const demoEntries = [
        {
          day: dateKey(relative(-3)),
          mood: "平静",
          text: "傍晚沿着河走了一会儿。风很轻，终于有时间听完一张专辑。",
        },
        {
          day: dateKey(relative(-2)),
          mood: "紧张",
          text: "上午的任务排得太满。把下一步单独写出来以后，开始容易了些。",
        },
        {
          day: dateKey(relative(-1)),
          mood: "明朗",
          text: "下班路上买到一束浅黄的花，放在了书桌右边。",
        },
      ];
      const memory = {
        read(k, fallback) {
          try {
            return (
              JSON.parse(localStorage.getItem("canghe-v1:" + k)) ?? fallback
            );
          } catch {
            return fallback;
          }
        },
        write(k, v) {
          try {
            localStorage.setItem("canghe-v1:" + k, JSON.stringify(v));
            return true;
          } catch {
            return false;
          }
        },
      };
      let entries = memory.read("entries", demoEntries);
      let habits = memory.read("habits", {});
      let selected =
        entries.find((item) => item.day === dateKey(new Date()))?.mood ??
        "平静";
      let week = 0;
      const history = [
        { ask: false, text: "你好，我是禾伴。我们可以从今天的一件小事聊起。" },
      ];
      function esc(text) {
        return String(text).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function nav(current) {
        return (
          '<nav aria-label="切换原型" class="grid grid-cols-5 border-t border-[#e4e4d9] bg-[#fcfbf6] px-1 py-2">' +
          sections
            .map(
              ([key, title, glyph]) =>
                "<a " +
                (key === current ? 'aria-current="page" ' : "") +
                'href="#' +
                key +
                '" class="grid justify-items-center gap-1 rounded-md px-0.5 text-[10px] leading-tight ' +
                (key === current
                  ? "font-bold text-[#215543]"
                  : "text-[#5d6d65]") +
                '">' +
                icon(glyph, "w-4 h-4") +
                title +
                "</a>",
            )
            .join("") +
          "</nav>"
        );
      }
      function frame(key, title, content) {
        return (
          '<section id="' +
          key +
          '" class="w-full min-w-0 scroll-mt-3" aria-label="' +
          title +
          '">' +
          '<h2 class="mb-1.5 pl-2 text-xs font-semibold text-[#52635b]">' +
          title +
          "</h2>" +
          '<div class="grid h-[688px] grid-rows-[auto_minmax(0,1fr)_auto] overflow-hidden rounded-[32px] border-[5px] border-[#243a32] bg-[#f7f7ef] shadow-sm">' +
          '<div class="flex justify-between px-6 pt-3 text-[11px] font-bold" aria-hidden="true"><span>9:41</span><span class="tracking-wider">▮▮▮ ▰</span></div>' +
          '<div class="min-w-0 overflow-y-auto overscroll-contain px-4 py-3 [scrollbar-width:thin]">' +
          content +
          "</div>" +
          nav(key) +
          "</div></section>"
        );
      }
      function moodPicker(place) {
        return (
          '<div class="grid grid-cols-5 gap-1.5" aria-label="选择情绪">' +
          moods
            .map(
              (m) =>
                '<button type="button" data-mood="' +
                m.name +
                '" data-place="' +
                place +
                '" aria-pressed="false" class="grid min-w-0 justify-items-center gap-1.5 rounded-xl border border-transparent px-0.5 py-2 text-[11px] text-[#425b4f] aria-pressed:border-[#87a591] aria-pressed:bg-[#edf4e8]">' +
                '<span class="grid h-8 w-8 place-items-center rounded-full bg-[#eef0dd] text-lg leading-none" aria-hidden="true">' +
                m.face +
                "</span>" +
                m.name +
                "</button>",
            )
            .join("") +
          "</div>"
        );
      }
      function heading(title, hint) {
        return (
          '<h3 class="font-serif text-3xl font-bold tracking-tight">' +
          title +
          '</h3><p class="mt-1 text-xs leading-relaxed text-[#586b60]">' +
          hint +
          "</p>"
        );
      }
      function renderFrames() {
        $("links").innerHTML = sections
          .map(
            ([key, title]) =>
              '<a class="' + soft + '" href="#' + key + '">' + title + "</a>",
          )
          .join("");
        $("screens").innerHTML = [
          frame(
            "today",
            "今日",
            heading(
              "留一点时间给自己",
              displayDate(new Date(), {
                month: "long",
                day: "numeric",
                weekday: "long",
              }),
            ) +
              '<div class="relative mt-4 h-[180px] overflow-hidden rounded-2xl bg-[#546f57]">' +
              '<img class="h-full w-full object-cover opacity-75" alt="晨光穿过山间薄雾" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?fit=crop&w=780&h=420&auto=format&q=80">' +
              '<div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-[#172e27] via-[#172e2766] to-transparent p-4 pt-12 text-white"><p class="text-xs">日记引导</p><p class="mt-1 font-serif text-xl font-bold">今天有没有想记住的一刻？</p></div></div>' +
              '<div class="' +
              panel +
              ' mt-3"><h4 class="mb-2 text-sm font-bold">此刻感觉如何？</h4>' +
              moodPicker("today") +
              '<a href="#journal" class="' +
              btn +
              ' mt-3 block text-center">记一条日记</a></div>' +
              '<div class="' +
              panel +
              ' mt-3"><h4 class="text-sm font-bold">今日习惯</h4><div id="habit-list" class="mt-2 grid gap-2 text-sm"></div></div>',
          ),
          frame(
            "journal",
            "日记",
            heading("写下此刻", "选择情绪，留下想记住的话。") +
              '<form id="entry-form" class="' +
              panel +
              ' mt-4 space-y-3"><label for="entry" class="text-xs font-bold">今天的日记</label>' +
              moodPicker("journal") +
              '<textarea id="entry" class="block min-h-36 w-full resize-y rounded-xl bg-[#f2f4ec] p-3 text-sm leading-6 outline-[#6f9a85]" maxlength="1500" required placeholder="从一个场景、一句话、一个感受开始…"></textarea>' +
              '<div class="flex items-center justify-between gap-2"><output id="entry-status" class="text-xs text-[#52685c]" aria-live="polite"></output><button class="' +
              btn +
              '" type="submit">保存日记</button></div></form>' +
              '<div class="' +
              panel +
              ' mt-3"><h4 class="text-sm font-bold">最近的日记</h4><div id="recent" class="mt-2 divide-y divide-[#e5e8df]"></div></div>',
          ),
          frame(
            "rhythm",
            "回顾",
            heading("感受的轨迹", "按周翻看日记和情绪记录。") +
              '<div class="' +
              panel +
              ' mt-4"><div class="flex items-center justify-between"><button class="' +
              soft +
              '" id="prev-week" aria-label="上一周">‹</button><p id="week-label" class="text-xs font-semibold"></p><button class="' +
              soft +
              '" id="next-week" aria-label="下一周">›</button></div>' +
              '<div id="plot" class="mt-4 grid h-[130px] grid-cols-7 items-end gap-1.5" aria-label="每日情绪图"></div></div>' +
              '<div class="' +
              panel +
              ' mt-3"><h4 class="text-sm font-bold">这一周的记录</h4><div id="weekly" class="mt-2 divide-y divide-[#e5e8df]"></div></div>',
          ),
          frame(
            "assist",
            "禾伴",
            heading("和禾伴聊聊", "本地对话原型，输入和回复仅用于演示。") +
              '<div id="messages" role="log" class="mt-4 grid max-h-64 gap-2 overflow-y-auto rounded-2xl border border-[#dfdfd4] bg-white p-3 text-sm"></div>' +
              '<div class="mt-3 flex flex-wrap gap-1.5"><button data-say="今天有点累" class="' +
              soft +
              '">今天有点累</button><button data-say="帮我开始写日记" class="' +
              soft +
              '">帮我开始写日记</button></div>' +
              '<form id="chat" class="mt-3 flex gap-2"><input id="ask" required maxlength="240" class="min-w-0 flex-1 rounded-xl border border-[#dbded2] bg-white px-3 text-sm" placeholder="说说现在的感受" aria-label="对话内容"><button class="' +
              btn +
              '" type="submit">发送</button></form>',
          ),
          frame(
            "me",
            "我的",
            heading("我的藏禾", "在这里管理日记和生活习惯。") +
              '<div class="' +
              panel +
              ' mt-4 flex items-center gap-3"><div class="grid h-12 w-12 place-items-center rounded-full bg-[#dfecdd] font-serif text-xl font-bold">禾</div><div><p class="font-bold">我的日记册</p><p id="total" class="mt-1 text-xs text-[#586b60]"></p></div></div>' +
              '<div class="' +
              panel +
              ' mt-3"><h4 class="text-sm font-bold">数据与隐私</h4><p class="my-2 text-xs leading-relaxed text-[#586b60]">日记和习惯保存在当前浏览器。你可以将记录导出到设备。</p><button id="export" class="' +
              soft +
              '">下载日记与习惯 JSON</button></div>' +
              '<div class="' +
              panel +
              ' mt-3"><h4 class="text-sm font-bold">开始记录</h4><p class="my-2 text-xs leading-relaxed text-[#586b60]">在今日页勾选习惯，在日记页保存情绪与文字。</p><a href="#today" class="' +
              soft +
              ' inline-flex">回到今日</a></div>',
          ),
        ].join("");
      }
      function markMood() {
        for (const button of document.querySelectorAll("[data-mood]"))
          button.setAttribute("aria-pressed", button.dataset.mood === selected);
      }
      function list(items) {
        return items.length
          ? items
              .map(
                (item) =>
                  '<button type="button" data-day="' +
                  item.day +
                  '" class="block w-full rounded py-2 text-left hover:bg-[#eef3eb]"><span class="block text-[11px] font-semibold text-[#52685c]">' +
                  item.day +
                  " · " +
                  esc(item.mood) +
                  '</span><span class="mt-1 block line-clamp-2 break-words text-xs leading-relaxed">' +
                  esc(item.text) +
                  "</span></button>",
              )
              .join("")
          : '<p class="py-2 text-xs text-[#52685c]">这段时间还没有记录。</p>';
      }
      function reflect() {
        const now = new Date(),
          shift = (now.getDay() + 6) % 7;
        const dates = Array.from({ length: 7 }, (_, i) =>
          relative(7 * week - shift + i),
        );
        $("week-label").textContent = [dates[0], dates[6]]
          .map((d) => displayDate(d, { month: "numeric", day: "numeric" }))
          .join(" – ");
        $("next-week").disabled = week >= 0;
        $("next-week").classList.toggle("opacity-40", week >= 0);
        $("plot").innerHTML = dates
          .map((d, i) => {
            const entry = entries.find((item) => item.day === dateKey(d));
            const mood = moods.find((m) => m.name === entry?.mood);
            const heights = ["h-5", "h-8", "h-12", "h-16", "h-20", "h-24"];
            return (
              '<div class="grid min-w-0 justify-items-center gap-1 text-[10px] text-[#52685c]"><span title="' +
              (mood?.name ?? "没有记录") +
              '" class="' +
              heights[mood?.value ?? 0] +
              ' w-full rounded-t-lg bg-[#dfe8dd]">' +
              (mood
                ? '<span class="grid h-full place-items-center text-[#307058]">' +
                  mood.face +
                  "</span>"
                : "") +
              "</span><span>" +
              ["一", "二", "三", "四", "五", "六", "日"][i] +
              "</span></div>"
            );
          })
          .join("");
        $("weekly").innerHTML = list(
          entries
            .filter(
              (item) =>
                item.day >= dateKey(dates[0]) && item.day <= dateKey(dates[6]),
            )
            .slice()
            .reverse(),
        );
      }
      function update() {
        markMood();
        reflect();
        $("recent").innerHTML = list(entries.slice().reverse().slice(0, 5));
        $("total").textContent = "已记录 " + entries.length + " 天";
        const today = habits[dateKey(new Date())] ?? {};
        $("habit-list").innerHTML = [
          "喝一杯水",
          "出门走十分钟",
          "写下一个小成就",
        ]
          .map(
            (text, i) =>
              '<label class="flex items-center gap-2 rounded-lg bg-[#f4f6ee] px-2 py-1.5"><input class="size-4 accent-[#255344]" type="checkbox" data-habit="' +
              i +
              '" ' +
              (today[i] ? "checked" : "") +
              ">" +
              text +
              "</label>",
          )
          .join("");
      }
      function chat() {
        const area = $("messages");
        area.innerHTML = history
          .map(
            ({ ask, text }) =>
              '<p class="max-w-[92%] break-words rounded-xl px-3 py-2 leading-relaxed ' +
              (ask
                ? "justify-self-end bg-[#255344] text-white"
                : "bg-[#edf3e8] text-[#284537]") +
              '">' +
              esc(text) +
              "</p>",
          )
          .join("");
        area.scrollTop = area.scrollHeight;
      }
      function say(text) {
        text = text.trim();
        if (!text) return;
        const reply = /日记|写/.test(text)
          ? "选一个具体的画面，从「那时我正在……」写起。你也可以先记下一种感觉。"
          : /累|忙/.test(text)
            ? "今天已经花了很多力气。能不能选一件可以晚一点再做的小事，给自己腾出几分钟？"
            : "我听见了。试着补一句「这件事里，我最在意的是……」，也许能更清楚地看见现在的感受。";
        history.push({ ask: true, text }, { ask: false, text: reply });
        chat();
      }
      renderFrames();
      update();
      chat();
      let entryDay = dateKey(new Date());
      $("entry").value =
        entries.find((item) => item.day === entryDay)?.text ?? "";
      document.addEventListener("click", (event) => {
        const mood = event.target.closest("[data-mood]"),
          suggestion = event.target.closest("[data-say]"),
          row = event.target.closest("[data-day]");
        if (mood) {
          selected = mood.dataset.mood;
          markMood();
        }
        if (suggestion) say(suggestion.dataset.say);
        if (row) {
          const entry = entries.find((item) => item.day === row.dataset.day);
          if (!entry) return;
          entryDay = entry.day;
          selected = entry.mood;
          markMood();
          $("entry").value = entry.text;
          $("entry-status").textContent = "编辑 " + entryDay;
          location.hash = "journal";
          $("entry").focus({ preventScroll: true });
        }
      });
      $("habit-list").addEventListener("change", (event) => {
        const id = event.target.dataset.habit;
        if (id === undefined) return;
        const day = dateKey(new Date());
        habits[day] = { ...habits[day], [id]: event.target.checked };
        memory.write("habits", habits);
      });
      $("entry-form").onsubmit = (event) => {
        event.preventDefault();
        const text = $("entry").value.trim();
        if (!text) {
          $("entry-status").textContent = "请写下一段文字。";
          return;
        }
        entries = [
          ...entries.filter((item) => item.day !== entryDay),
          { day: entryDay, mood: selected, text },
        ].sort((a, b) => a.day.localeCompare(b.day));
        const saved = memory.write("entries", entries);
        $("entry-status").textContent = saved
          ? "已保存 " + entryDay
          : "已记录到本页，浏览器存储不可用。";
        update();
      };
      for (const link of document.querySelectorAll('a[href="#journal"]'))
        link.onclick = () => {
          entryDay = dateKey(new Date());
          $("entry").value =
            entries.find((item) => item.day === entryDay)?.text ?? "";
          $("entry-status").textContent = "";
        };
      $("prev-week").onclick = () => {
        week--;
        reflect();
      };
      $("next-week").onclick = () => {
        week = Math.min(0, week + 1);
        reflect();
      };
      $("chat").onsubmit = (event) => {
        event.preventDefault();
        say($("ask").value);
        $("ask").value = "";
      };
      $("export").onclick = () => {
        const url = URL.createObjectURL(
          new Blob([JSON.stringify({ entries, habits }, null, 2)], {
            type: "application/json",
          }),
        );
        const a = document.createElement("a");
        a.href = url;
        a.download = "canghe-journal.json";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };
    </script>
  </body>
</html>
