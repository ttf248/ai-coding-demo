<!doctype html><html lang="zh-CN"><head><script src="../../../../assets/analytics.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾心 · AI 情绪日记与生活助手</title><script src="https://cdn.tailwindcss.com/3.4.17"></script><script>tailwind.config={theme:{extend:{colors:{paper:'#f8f7f2',ink:'#343b38',sage:'#647b66',lilac:'#ded9ed'},fontFamily:{sans:['PingFang SC','Microsoft YaHei','system-ui']}}}};</script></head>
<body class="m-0 bg-[#e9ebe4] font-sans text-ink"><header class="mx-auto flex max-w-[1650px] flex-wrap items-end justify-between gap-5 px-5 pb-8 pt-10 sm:px-10"><div><p class="mb-3 text-[10px] tracking-[.35em] text-sage">SHIXIN / A LITTLE SPACE FOR YOURSELF</p><h1 class="text-3xl font-semibold tracking-widest">拾心<span class="ml-4 text-sm font-normal tracking-normal text-gray-500">把心事，轻轻放下。</span></h1><p class="mt-3 text-xs text-gray-500">AI 情绪日记与生活助手 · 375px 移动端交互原型</p></div><nav class="flex flex-wrap gap-2 text-xs" aria-label="原型页面"><button data-go="home" class="rounded-full border border-gray-300 px-4 py-2">今日</button><button data-go="write" class="rounded-full border border-gray-300 px-4 py-2">写日记</button><button data-go="companion" class="rounded-full border border-gray-300 px-4 py-2">陪伴</button><button data-go="insight" class="rounded-full border border-gray-300 px-4 py-2">回顾</button></nav></header>

<script>
const $=id=>document.getElementById(id),photo='https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=85';
const icon={home:'⌂',journal:'▤',ai:'✳',chart:'◷',user:'☺'};
function nav(active){return '<nav class="mt-auto flex shrink-0 justify-around border-t border-[#e6e7df] bg-paper px-2 pb-6 pt-3 text-[10px]">'+[['home','home','今日'],['journal','timeline','日记'],['ai','companion','陪伴'],['chart','insight','回顾'],['user','profile','我的']].map(([i,id,label])=>'<button data-go="'+id+'" class="grid gap-1 '+(active===id?'text-sage':'text-gray-400')+'"><span class="text-xl">'+icon[i]+'</span>'+label+'</button>').join('')+'</nav>'}

const home=screenTop('拾心', '<button data-go="profile" aria-label="我的账户" class="h-9 w-9 rounded-full bg-[#e9dfcd] text-xl">☺</button>')+'<div class="flex-1 overflow-y-auto px-6 pb-5 [scrollbar-width:none]"><p class="text-xs text-gray-400">星期四 · 今天也值得被记录</p><h2 class="mt-3 text-[26px] font-medium leading-relaxed">早安，小禾。<br>今天的你，感觉如何？</h2><div class="my-6 flex justify-between">'+['☀','☁','☂','☾','♡'].map((s,i)=>'<button data-mood="'+i+'" class="mood flex flex-col items-center gap-2 rounded-2xl px-2.5 py-3 text-xs text-gray-500"><span class="text-[29px]">'+s+'</span>'+['愉悦','平静','低落','疲惫','期待'][i]+'</button>').join('')+'</div><button data-go="write" class="flex w-full items-center justify-between rounded-2xl bg-sage p-5 text-left text-white"><span><b class="text-base font-medium">写下此刻的心情</b><small class="mt-1 block text-[11px] text-white/70">不必完整，真实就很好</small></span><span class="text-2xl">＋</span></button><div class="relative mt-6 h-44 overflow-hidden rounded-2xl"><img src="'+photo+'" alt="晨光穿过森林" class="h-full w-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div><div class="absolute bottom-5 left-5 text-white"><p class="text-[10px] tracking-widest text-white/70">今日的一点温柔</p><p class="mt-2 text-lg">允许自己，慢慢来。</p></div></div><div class="mt-6 flex justify-between"><h3 class="text-sm font-semibold">给自己留一点时间</h3><button data-go="plan" class="text-xs text-sage">查看计划 →</button></div><button data-go="plan" class="mt-3 flex w-full items-center gap-3 rounded-xl border border-[#e3e7dd] p-3 text-left"><span class="rounded-full bg-[#e2e8d9] p-2">♧</span><span class="text-xs">出去走走，看看今天的天空<small class="mt-1 block text-gray-400">10 分钟 · 轻松散步</small></span></button></div>'+nav('home');
const write=screenTop('写给自己','<button id="saveDiary" class="rounded-full bg-sage px-4 py-2 text-xs text-white">保存</button>')+'<div class="flex-1 overflow-y-auto px-6 [scrollbar-width:none]"><p class="mt-3 text-[11px] tracking-wider text-gray-400">一段属于你的时光</p><input id="diaryTitle" aria-label="日记标题" placeholder="给今天起个名字…" class="mt-5 w-full border-0 bg-transparent text-2xl font-medium outline-none"><div class="my-5 flex gap-2"><span id="selectedMood" class="rounded-full bg-[#e7e0f1] px-3 py-1.5 text-xs">☁ 平静</span><button id="tag" class="rounded-full bg-[#e5eadf] px-3 py-1.5 text-xs">＋ 日常</button></div><textarea id="diaryBody" aria-label="日记正文" placeholder="今天，有什么让你停留的瞬间？&#10;&#10;可以是一杯热咖啡、一阵风，也可以是那些还没想好如何开口的心事。" class="h-64 w-full resize-none border-0 bg-transparent text-sm leading-8 outline-none"></textarea><p id="wordCount" class="text-right text-[10px] text-gray-400">0 字</p><div class="mt-5 rounded-2xl bg-[#eeebf5] p-5"><span class="text-xs text-[#80718c]">✳ 如果不知道从哪里开始</span><p class="mt-3 text-sm leading-6">今天最想感谢的一个小瞬间是什么？</p><button id="inspire" class="mt-3 text-xs text-[#80718c]">换个写作灵感 ↻</button></div><p class="my-5 text-center text-[10px] text-gray-400">记录仅存于本机浏览器 · 你可以随时删除</p></div>';
const companion=screenTop('小拾，陪你聊聊','<span class="text-[10px] text-sage">● 本地对话演示</span>')+'<div class="mx-6 mb-4 rounded-xl bg-[#ece7f1] px-4 py-3 text-xs leading-5 text-[#81728a]">这里没有标准答案。把想说的说出来，就已经是很好的一步。</div><div id="messages" class="flex-1 space-y-5 overflow-y-auto px-6 py-3 [scrollbar-width:none]"><div class="mr-7 rounded-2xl rounded-tl-none bg-white p-4 text-sm leading-7">嗨，我是小拾。<br>此刻，你最想聊些什么？</div><div class="ml-9 rounded-2xl rounded-tr-none bg-[#dfe7d8] p-4 text-sm leading-7">今天有点累，但又说不清为什么。</div><div class="mr-7 rounded-2xl rounded-tl-none bg-white p-4 text-sm leading-7">有时候，累并不需要一个特别的原因。<br><br>先让自己停一会儿吧。今天有没有一个瞬间，让你稍微轻松了一点？</div></div><form id="chat" class="flex gap-2 border-t border-gray-100 p-4 pb-7"><input id="chatInput" aria-label="想说的话" placeholder="慢慢说，我在听…" class="min-w-0 flex-1 rounded-full bg-white px-4 py-3 text-xs outline-none" maxlength="500"><button class="rounded-full bg-sage px-4 text-white" aria-label="发送">↑</button></form>';
const insight=screenTop('心情的轨迹','<button id="period" class="rounded-full bg-white px-3 py-2 text-xs">本周 ▾</button>')+'<div class="flex-1 overflow-y-auto px-6 [scrollbar-width:none]"><div class="mt-3 rounded-2xl bg-[#e4e8db] p-5"><p class="text-[11px] text-sage">慢慢了解自己，是很珍贵的事</p><h2 class="mt-3 text-2xl font-medium">这一周，你更平静了。</h2><p class="mt-3 text-xs leading-6 text-gray-500">这是一组原型示例数据。每一种情绪，<br>都在帮你认识真实的自己。</p></div><div class="mt-6 flex justify-between"><h3 class="text-sm font-semibold">情绪温度</h3><span id="periodLabel" class="text-[10px] text-gray-400">最近 7 天 · 示例</span></div><div id="chart" class="mt-5 flex h-36 items-end justify-between gap-3 border-b border-[#dadfd3] pb-1"></div><div class="mt-2 flex justify-between text-[10px] text-gray-400"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><h3 class="mb-4 mt-7 text-sm font-semibold">那些让你快乐的小事</h3><div class="flex flex-wrap gap-2"><span class="rounded-full bg-[#e3eadb] px-4 py-2 text-xs">散步 4 次</span><span class="rounded-full bg-[#eae4f1] px-4 py-2 text-xs">朋友 3 次</span><span class="rounded-full bg-[#eee6d4] px-4 py-2 text-xs">好好吃饭 3 次</span></div><div class="mt-7 flex gap-5 border-t border-gray-200 pt-5"><div><b class="text-3xl font-light">5</b><p class="mt-1 text-[10px] text-gray-400">记录天数</p></div><div><b class="text-3xl font-light">1,268</b><p class="mt-1 text-[10px] text-gray-400">留给自己的文字</p></div></div></div>'+nav('insight');
const timeline=screenTop('我的日记','<button data-go="write" class="text-2xl text-sage">＋</button>')+'<div class="flex-1 overflow-y-auto px-6 pb-5 [scrollbar-width:none]"><input id="diarySearch" aria-label="搜索日记" placeholder="⌕ 搜索记忆中的片刻" class="my-4 w-full rounded-xl bg-white px-4 py-3 text-xs outline-none"><p class="mb-5 text-xs text-gray-400">最近的日子</p><div id="entries" class="space-y-4"></div></div>'+nav('timeline');
const detail=screenTop('某个平凡而闪光的日子','<button data-go="timeline" class="text-xs text-sage">日记本 →</button>')+'<div class="flex-1 overflow-y-auto px-6 [scrollbar-width:none]"><div class="mt-4 flex gap-2 text-[10px] text-gray-500"><span class="rounded-full bg-[#e5e9da] px-3 py-1">☀ 愉悦</span><span class="px-2 py-1">示例日记 · 18:30</span></div><h2 id="detailTitle" class="my-6 text-2xl leading-relaxed">原来快乐，<br>可以这么简单。</h2><p id="detailBody" class="whitespace-pre-line text-sm leading-8 text-gray-600">傍晚下班时，绕了远一点的路。&#10;&#10;街角的花店开着门，风里有淡淡的花香。买了一小束雏菊，回家的路好像也变得轻盈了。&#10;&#10;生活没有突然变好，但我发现，自己开始看见那些小小的好了。</p><img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=600&q=80" alt="一束盛开的花" class="mt-6 h-40 w-full rounded-2xl object-cover"><div class="my-6 rounded-2xl bg-[#eae6ef] p-4 text-xs leading-6 text-[#80718c]">✳ 小拾的回信 · 示例<br>你为自己创造了一个温柔的片刻。记住这种感觉，也许它会在下一次疲惫的时候，轻轻接住你。</div></div>';
const plan=screenTop('给生活一点留白','<span class="text-xs text-sage">今日计划</span>')+'<div class="flex-1 overflow-y-auto px-6 [scrollbar-width:none]"><div class="mt-4 rounded-2xl bg-[#e2e8dc] p-6"><span class="text-4xl">♧</span><h2 class="mt-4 text-2xl">小小的行动，<br>也在照顾自己。</h2><p class="mt-4 text-xs text-gray-500">不用把每一天填满。完成一件，就很好。</p></div><div id="tasks" class="my-6 space-y-3"></div><form id="addTask" class="flex gap-2"><input id="newTask" aria-label="新的小计划" placeholder="添加一个小计划" maxlength="60" class="min-w-0 flex-1 rounded-xl bg-white p-3 text-xs"><button class="rounded-xl bg-sage px-4 text-white" aria-label="添加计划">＋</button></form><p id="taskProgress" class="mt-5 text-center text-xs text-sage"></p></div>'+nav('home');
const profile=screenTop('我的小天地')+'<div class="flex-1 overflow-y-auto px-6 [scrollbar-width:none]"><div class="flex items-center gap-4 py-5"><span class="flex h-16 w-16 items-center justify-center rounded-full bg-[#e5d9bf] text-4xl">☺</span><div><h2 class="text-xl font-semibold">小禾</h2><p class="mt-1 text-[11px] text-gray-400">在自己的时区里，慢慢生长。</p></div></div><div class="my-5 grid grid-cols-3 rounded-2xl bg-white py-5 text-center"><div><b id="savedCount" class="text-xl font-medium">0</b><p class="mt-1 text-[10px] text-gray-400">我的记录</p></div><div><b class="text-xl font-medium">☁</b><p class="mt-1 text-[10px] text-gray-400">今日心情</p></div><div><b class="text-xl font-medium">∞</b><p class="mt-1 text-[10px] text-gray-400">成长空间</p></div></div><div class="divide-y divide-gray-100 rounded-2xl bg-white px-4"><button data-go="timeline" class="flex w-full justify-between py-5 text-sm">▤ 我的日记<span>›</span></button><button id="exportData" class="flex w-full justify-between py-5 text-sm">↓ 导出我的记录<span>›</span></button><button id="deleteData" class="flex w-full justify-between py-5 text-sm text-[#9d736f]">清空本机记录<span>›</span></button></div><div class="mt-6 rounded-2xl bg-[#e7eade] p-5"><h3 class="text-sm">你的故事，属于你。</h3><p class="mt-2 text-xs leading-6 text-gray-500">演示中的文字保存在当前浏览器。陪伴对话为本地规则回复，不连接 AI 服务；不作情绪诊断。</p></div><p class="my-8 text-center text-[10px] tracking-[.2em] text-gray-400">拾心 / 让每一种情绪有处安放</p></div>'+nav('profile');
$('screens').innerHTML=[frame('home','01 / 今日 · 情绪签到',home),frame('write','02 / 记录 · 自由书写',write),frame('companion','03 / 陪伴 · 温柔对话',companion),frame('insight','04 / 回顾 · 情绪洞察',insight),frame('timeline','05 / 日记 · 片刻收藏',timeline),frame('detail','06 / 阅读 · 日记详情',detail),frame('plan','07 / 生活 · 小小计划',plan),frame('profile','08 / 我的 · 隐私与数据',profile)].join('');
let mood=1,entries=[],tasks=[{text:'出门散步 10 分钟',done:false},{text:'喝一杯温水',done:true},{text:'睡前放下手机 15 分钟',done:false}];try{entries=JSON.parse(localStorage.getItem('shixin-entries')||'[]');const data=JSON.parse(localStorage.getItem('shixin-tasks')||'null');if(Array.isArray(data))tasks=data}catch{}
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer;function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function persist(){try{localStorage.setItem('shixin-entries',JSON.stringify(entries));localStorage.setItem('shixin-tasks',JSON.stringify(tasks));return true}catch{toast('浏览器存储不可用，本次记录仅保留在页面内');return false}}
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go)$(go.dataset.go).scrollIntoView({behavior:'smooth',block:'start'});const b=e.target.closest('[data-mood]');if(b){mood=Number(b.dataset.mood);document.querySelectorAll('[data-mood]').forEach(x=>x.classList.toggle('bg-[#e2e8da]',x===b));$('selectedMood').textContent=['☀ 愉悦','☁ 平静','☂ 低落','☾ 疲惫','♡ 期待'][mood];toast('已选择'+['愉悦','平静','低落','疲惫','期待'][mood]+'，写下此刻吧')}});
$('diaryBody').oninput=()=>{$('wordCount').textContent=$('diaryBody').value.length+' 字'};
$('tag').onclick=()=>{$('tag').textContent=$('tag').textContent.includes('日常')?'＋ 成长':'＋ 日常'};
const inspirations=['今天最想感谢的一个小瞬间是什么？','如果此刻的心情是一种天气，它会是什么？','今天有什么事，是你为自己做的？'];let inspiration=0;$('inspire').onclick=()=>{$('inspire').previousElementSibling.textContent=inspirations[++inspiration%3]};
function showEntries(){const term=$('diarySearch').value.trim();$('entries').innerHTML=entries.filter(e=>e.title.includes(term)||e.body.includes(term)).map(e=>'<button data-entry="'+e.id+'" class="block w-full rounded-2xl bg-white p-5 text-left"><p class="text-[10px] text-gray-400">'+escape(e.date)+' · '+['愉悦','平静','低落','疲惫','期待'][e.mood]+'</p><h3 class="my-3 text-sm font-semibold">'+escape(e.title)+'</h3><p class="line-clamp-2 text-xs leading-6 text-gray-500">'+escape(e.body)+'</p></button>').join('')+(!term?'<button data-go="detail" class="block w-full rounded-2xl bg-[#e8eadf] p-5 text-left"><p class="text-[10px] text-gray-400">示例日记 · 愉悦</p><h3 class="my-3 text-sm font-semibold">原来快乐，可以这么简单。</h3><p class="text-xs leading-6 text-gray-500">傍晚下班时，绕了远一点的路…</p></button>':'');$('savedCount').textContent=entries.length;if(!$('entries').innerHTML)$('entries').textContent='没有找到相关日记。'}
$('saveDiary').onclick=()=>{if(!$('diaryBody').value.trim()){toast('写下几个字，再把今天收藏起来吧');return}const entry={id:Date.now(),title:$('diaryTitle').value.trim()||'今天的小片刻',body:$('diaryBody').value,mood,date:new Date().toLocaleDateString('zh-CN')};entries.unshift(entry);const saved=persist();showEntries();if(saved)toast('日记已保存到本机');$('diaryTitle').value='';$('diaryBody').value='';$('wordCount').textContent='0 字'};
$('entries').onclick=e=>{const b=e.target.closest('[data-entry]');if(!b)return;const entry=entries.find(x=>x.id===Number(b.dataset.entry));$('detailTitle').textContent=entry.title;$('detailBody').textContent=entry.body;$('detail').scrollIntoView({behavior:'smooth'})};$('diarySearch').oninput=showEntries;
$('chat').onsubmit=e=>{e.preventDefault();const value=$('chatInput').value.trim();if(!value)return;const bubble=document.createElement('div');bubble.className='ml-9 rounded-2xl rounded-tr-none bg-[#dfe7d8] p-4 text-sm leading-7';bubble.textContent=value;$('messages').append(bubble);$('chatInput').value='';const reply=document.createElement('div');reply.className='mr-7 rounded-2xl rounded-tl-none bg-white p-4 text-sm leading-7';reply.textContent=/开心|快乐|好/.test(value)?'听起来，这个片刻对你很有意义。要不要把它记在今天的日记里？':'谢谢你把这件事说出来。先给自己一点空间，再想想：现在有什么小事，能让你舒服一点？';$('messages').append(reply);reply.scrollIntoView({block:'nearest'});};
function chart(month=false){$('chart').innerHTML=(month?[45,65,55,78,60,87,72]:[43,62,51,80,65,91,76]).map((n,i)=>'<div class="flex-1 rounded-t-xl '+(i===3?'bg-sage':'bg-[#ced9c2]')+'" style="height:'+n+'%" title="'+n+'% · 示例"></div>').join('')}let month=false;$('period').onclick=()=>{month=!month;$('period').textContent=month?'本月 ▾':'本周 ▾';$('periodLabel').textContent=month?'最近 7 组日期 · 示例':'最近 7 天 · 示例';chart(month)};
function showTasks(){$('tasks').innerHTML=tasks.map((t,i)=>'<label class="flex items-center gap-3 rounded-xl bg-white p-4 text-xs"><input data-task="'+i+'" type="checkbox" '+(t.done?'checked':'')+' class="h-4 w-4 accent-[#647b66]"><span class="'+(t.done?'text-gray-400 line-through':'')+'">'+escape(t.text)+'</span></label>').join('');$('taskProgress').textContent='已完成 '+tasks.filter(t=>t.done).length+' / '+tasks.length+' 件小事'}
$('tasks').onchange=e=>{if(e.target.dataset.task!==undefined){tasks[Number(e.target.dataset.task)].done=e.target.checked;persist();showTasks()}};
$('addTask').onsubmit=e=>{e.preventDefault();if(!$('newTask').value.trim())return;tasks.push({text:$('newTask').value.trim(),done:false});$('newTask').value='';persist();showTasks()};
$('exportData').onclick=()=>{const blob=new Blob([JSON.stringify({entries,tasks},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='shixin-diary.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('记录已导出')};$('deleteData').onclick=()=>{if(confirm('清空本机保存的日记和计划？此操作不能撤销。')){entries=[];tasks=[];persist();showEntries();showTasks();toast('已清空本机记录')}};
document.querySelector('[data-mood="1"]').classList.add('bg-[#e2e8da]');showEntries();showTasks();chart();
</script></body></html>
