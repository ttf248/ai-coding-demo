<!doctype html><html lang="zh-CN"><head><script src="../../../../assets/analytics.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>藏和 · 情绪日记原型</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body class="bg-[#eeeae4] text-[#263a37] antialiased"><main class="mx-auto max-w-[1650px] px-4 py-10 sm:px-8"><div class="mb-8 flex flex-wrap items-end justify-between gap-4"><div><p class="text-xs font-bold tracking-[.22em] text-[#8a9e89]">CANGHE / PRODUCT DESIGN</p><h1 class="mt-2 text-3xl font-semibold tracking-tight sm:text-4xl">藏和 · 把生活慢慢收好</h1><p class="mt-2 text-sm text-[#83928d]">AI 情绪日记与生活助手 · iPhone 375pt 原型</p></div><p class="text-xs text-[#83928d]">01—07 / 可独立浏览的产品页面</p></div><div id="screens" class="grid grid-cols-1 justify-items-center gap-8 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4"></div><p class="mt-8 text-center text-xs text-[#87958f]">原型展示：AI 回复、统计与账号内容为示例数据。</p></main><script>
const img={flower:'https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=700&q=80',room:'https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=700&q=80',coffee:'https://images.unsplash.com/photo-1442512595331-e89e73853f31?auto=format&fit=crop&w=700&q=80'};const icon=(name,cls='')=>`<i class="fa-solid fa-${name} ${cls}" aria-hidden="true"></i>`;const statusBar=`<div class="flex justify-between px-6 pt-4 text-[12px] font-bold"><span>9:41</span><span>${icon('signal')} &nbsp; ${icon('wifi')} &nbsp; ${icon('battery-three-quarters')}</span></div>`;const heading=(eyebrow,title,right='')=>`<div class="flex items-center justify-between"><div><p class="text-[10px] font-bold tracking-[.18em] text-[#9aaca0]">${eyebrow}</p><h2 class="mt-1 text-[25px] font-semibold tracking-tight">${title}</h2></div>${right}</div>`;const nav=active=>`<div class="absolute inset-x-0 bottom-0 flex justify-around border-t border-[#edf0e9] bg-[#fffef9]/95 px-2 pb-5 pt-3 text-center text-[10px] text-[#9aaba1]">${[['house','首页'],['book-open','日记'],['plus','记录'],['chart-simple','回顾'],['user','我的']].map(([i,n])=>`<button data-message="${n}页面示意" class="w-12 ${n===active?'text-[#548775]':''}">${icon(i,'block text-[17px] mb-1')}${n}</button>`).join('')}</div>`;const wrap=(n,label,body,active='')=>`<section class="w-full max-w-[375px]"><div class="mb-3 flex justify-between text-xs text-[#8a9991]"><b>${n} / ${label}</b><span>375 × 812</span></div><div class="relative h-[812px] overflow-hidden rounded-[40px] border-[7px] border-[#263632] bg-[#fffef9] shadow-xl">${statusBar}<div class="h-[690px] overflow-y-auto px-5 pb-8 pt-6">${body}</div>${active?nav(active):''}<div class="absolute bottom-1 left-1/2 h-1 w-28 -translate-x-1/2 rounded-full bg-[#263632]"></div></div></section>`;const pill=(t)=>`<span class="rounded-full bg-[#edf4ec] px-3 py-1 text-[11px] text-[#628773]">${t}</span>`;
const screens=[
wrap('01','欢迎',`<div class="pt-4"><div class="flex items-center gap-2 text-lg font-semibold text-[#6c927d]">${icon('seedling')} 藏和</div><p class="mt-1 text-xs tracking-widest text-[#9baca2]">A LITTLE SPACE FOR YOU</p><img class="mt-8 h-64 w-full rounded-[26px] object-cover" src="${img.flower}" alt="花朵"><h2 class="mt-8 text-[30px] font-semibold leading-tight">生活有很多面，<br>每一面都值得被看见。</h2><p class="mt-4 text-sm leading-7 text-[#8b9b91]">在这里记录情绪、收集片刻，也让温柔的陪伴成为每天的小习惯。</p><button data-message="开始使用 · 进入首页" class="mt-7 w-full rounded-2xl bg-[#709986] py-4 text-sm font-semibold text-white">开始记录 ${icon('arrow-right','ml-2')}</button><p class="mt-4 text-center text-xs text-[#a2aea7]">已有账号？ <button data-message="登录页面示意" class="text-[#6e957f]">登录</button></p></div>`),
wrap('02','首页',`${heading('MONDAY, OCTOBER 27','早安，小禾',icon('bell','text-[#8ba496]'))}<p class="mt-2 text-sm text-[#9aaba1]">今天，也照顾好自己的心情。</p><div class="mt-6 rounded-3xl bg-[#e5efe5] p-5"><div class="flex justify-between"><span class="text-xs text-[#749681]">TODAY’S CHECK-IN</span>${icon('sun','text-[#a1b99d]')}</div><h3 class="mt-3 text-lg font-semibold">此刻的你，感觉如何？</h3><p class="mt-1 text-xs text-[#8da192]">花一点时间，和自己见个面。</p><div class="mt-5 flex justify-between text-2xl">${['☀️','🌤️','☁️','🌧️','🌙'].map((e,i)=>`<button data-mood="${i}" class="mood rounded-xl p-2">${e}</button>`).join('')}</div><div class="mt-2 flex justify-between px-1 text-[10px] text-[#90a392]"><span>很愉快</span><span>有点低落</span></div></div><div class="mt-6 flex items-center justify-between"><h3 class="font-semibold">给你的小建议</h3><span class="text-xs text-[#91a499]">今天</span></div><div class="mt-3 flex gap-3 rounded-2xl border border-[#e8eee7] p-3"><img class="h-20 w-20 rounded-xl object-cover" src="${img.room}" alt="安静的房间"><div><p class="text-xs text-[#9caf9e]">一点点放松</p><p class="mt-1 text-sm font-semibold">为自己留 5 分钟</p><p class="mt-1 text-xs leading-5 text-[#9baba1]">关掉提醒，做一次深呼吸。</p></div></div><div class="mt-6 flex items-center justify-between"><h3 class="font-semibold">最近的记录</h3><button data-message="日记列表示意" class="text-xs text-[#779582]">查看全部 →</button></div><div class="mt-3 rounded-2xl bg-[#f8f7f1] p-4"><div class="flex justify-between text-xs text-[#9caba1]"><span>10 月 26 日</span><span>🌤️ 平静</span></div><p class="mt-2 text-sm">今天走了很长的路，风很舒服。</p></div>`,'首页'),
wrap('03','写日记',`${heading('NEW ENTRY','记录此刻',icon('xmark','text-[#a4b3a9]'))}<p class="mt-2 text-sm text-[#9aaba1]">2026 年 10 月 27 日 · 星期二</p><div class="mt-7 rounded-2xl bg-[#f1f6ef] p-4"><p class="text-xs text-[#8ca294]">现在的心情</p><div class="mt-3 flex justify-between text-2xl">${['😊','🙂','😌','😔','😣'].map((e,i)=>`<button data-mood="${i}" class="mood rounded-xl p-2">${e}</button>`).join('')}</div></div><input class="mt-6 w-full border-0 bg-transparent text-xl font-semibold outline-none placeholder:text-[#c5cfc6]" placeholder="给今天一个标题"><textarea class="mt-4 h-48 w-full resize-none bg-transparent text-sm leading-7 outline-none placeholder:text-[#bdc9bf]" placeholder="想写些什么都可以，不必完美。"></textarea><div class="flex gap-2 border-t border-[#edf1ec] pt-4">${pill('＋ 添加照片')}${pill('＃ 添加标签')}${pill('☁ 仅自己可见')}</div><button data-message="示例日记已记录在原型中" class="mt-8 w-full rounded-2xl bg-[#719a86] py-4 text-sm font-semibold text-white">保存这一天</button>`,'记录'),
wrap('04','日记详情',`<div class="flex justify-between text-[#91a99a]"><button data-message="返回日记列表">${icon('arrow-left')}</button><button data-message="更多操作">${icon('ellipsis')}</button></div><p class="mt-7 text-xs tracking-widest text-[#a2b2a7]">OCTOBER 26, 2026 · MONDAY</p><h2 class="mt-3 text-[27px] font-semibold">风很舒服的一天</h2><div class="mt-3">${pill('🌤 平静')}&nbsp; ${pill('# 日常')}</div><img class="mt-6 h-48 w-full rounded-2xl object-cover" src="${img.coffee}" alt="咖啡"><p class="mt-5 text-sm leading-7 text-[#687d72]">今天走了很长的路，买了一杯喜欢的咖啡。路上没有特别的事，但阳光落在肩上的时候，突然觉得这样也很好。</p><div class="mt-6 rounded-2xl bg-[#f1f6ef] p-4"><p class="text-xs font-semibold text-[#7b9a84]">✳ 小和的回应</p><p class="mt-2 text-sm leading-6 text-[#6d8475]">你留意到了平凡里的舒适。愿这样的时刻，慢慢成为你的力量。</p></div><div class="mt-5 flex gap-2">${pill('♡ 收藏')}${pill('✎ 编辑')}</div>`,'日记'),
wrap('05','情绪回顾',`${heading('YOUR PATTERNS','情绪回顾',icon('calendar','text-[#8ba496]'))}<p class="mt-2 text-sm text-[#9aaba1]">理解情绪，而不是评判它。</p><div class="mt-6 rounded-3xl bg-[#edf4e9] p-5"><p class="text-xs text-[#86a18c]">最近 7 天</p><p class="mt-2 text-xl font-semibold">这一周，你有 4 天感觉平静</p><p class="mt-2 text-xs leading-5 text-[#8ca391]">每一种心情都值得被接纳。</p><div class="mt-5 flex h-28 items-end justify-between gap-2">${[40,75,53,90,60,80,65].map((h,i)=>`<div class="flex flex-1 flex-col items-center gap-2"><div class="w-full rounded-t-lg ${i===3?'bg-[#81ac91]':'bg-[#b9d2b8]'}" style="height:${h}px"></div><span class="text-[10px] text-[#8ea592]">${['一','二','三','四','五','六','日'][i]}</span></div>`).join('')}</div></div><h3 class="mt-6 font-semibold">你的生活关键词</h3><div class="mt-3 flex flex-wrap gap-2">${['散步 · 5','咖啡 · 3','休息 · 3','工作 · 2','朋友 · 2'].map(pill).join('')}</div><div class="mt-6 rounded-2xl border border-[#e8eee7] p-4"><p class="text-xs text-[#8ba595]">小和发现</p><p class="mt-2 text-sm leading-6">当你记录散步和休息时，更常感到平静。</p><p class="mt-2 text-xs text-[#a3b2a6]">基于示例记录，仅供自我观察。</p></div>`,'回顾'),
wrap('06','AI 陪伴',`${heading('A MOMENT TO TALK','和小和聊聊',icon('ellipsis','text-[#91a99a]'))}<div class="mt-6 rounded-2xl bg-[#edf4e9] p-4 text-xs leading-5 text-[#80998a]">✳ 小和是生活陪伴助手，回复为示例，不替代专业支持。</div><div class="mt-8 flex items-start gap-2"><span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-[#d9eadc]">✳</span><div class="rounded-2xl rounded-tl-sm bg-[#f1f5ef] p-4 text-sm leading-6">嗨，我在这里。今天有什么想和我分享的吗？</div></div><div class="mt-5 ml-12 rounded-2xl rounded-tr-sm bg-[#7b9f8d] p-4 text-sm leading-6 text-white">最近工作有点忙，感觉自己的节奏乱了。</div><div class="mt-5 flex items-start gap-2"><span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-[#d9eadc]">✳</span><div class="rounded-2xl rounded-tl-sm bg-[#f1f5ef] p-4 text-sm leading-6">听起来你最近承受了不少。我们可以先一起找一件今天能放慢的事吗？</div></div><div class="mt-8 flex flex-wrap gap-2">${pill('帮我理清思绪')}${pill('给我一点放松建议')}</div><div class="mt-4 flex gap-2 rounded-2xl border border-[#e4ece4] p-3"><input class="min-w-0 flex-1 bg-transparent text-sm outline-none" placeholder="写下你想说的…"><button data-message="这是静态对话示意，未连接 AI 服务" class="text-[#739984]">${icon('arrow-up')}</button></div>`),
wrap('07','我的',`${heading('A SPACE OF YOUR OWN','我的小空间',icon('gear','text-[#91a99a]'))}<div class="mt-7 flex items-center gap-4"><div class="grid h-16 w-16 place-items-center rounded-full bg-[#dceadc] text-2xl">🌱</div><div><h3 class="font-semibold">小禾</h3><p class="mt-1 text-xs text-[#9aaba1]">记录生活的第 28 天</p></div></div><div class="mt-6 grid grid-cols-3 rounded-2xl bg-[#f1f6ef] p-4 text-center"><div><b>28</b><p class="text-[10px] text-[#9aaba1]">记录天数</p></div><div><b>16</b><p class="text-[10px] text-[#9aaba1]">日记篇数</p></div><div><b>7</b><p class="text-[10px] text-[#9aaba1]">本周签到</p></div></div><h3 class="mt-7 font-semibold">为自己设置</h3>${[['bell','温柔提醒','每天 21:00'],['lock','隐私与安全','仅自己可见'],['palette','外观与主题','自然绿'],['circle-question','帮助与反馈','']].map(([i,t,v])=>`<button data-message="${t}设置示意" class="flex w-full items-center gap-3 border-b border-[#eef2ec] py-4 text-left text-sm"><span class="grid h-9 w-9 place-items-center rounded-xl bg-[#edf4ec] text-[#83a18d]">${icon(i)}</span><span class="flex-1">${t}</span><span class="text-xs text-[#a7b5ab]">${v} ›</span></button>`).join('')}<p class="mt-6 text-center text-xs text-[#b4c0b6]">给自己一点时间，也给生活一点空间。</p>`,'我的')];document.querySelector('#screens').innerHTML=screens.join('');document.addEventListener('click',e=>{const mood=e.target.closest('[data-mood]');if(mood){mood.parentElement.querySelectorAll('.mood').forEach(x=>x.classList.remove('bg-white','ring-2','ring-[#8fb69c]'));mood.classList.add('bg-white','ring-2','ring-[#8fb69c]')}const b=e.target.closest('[data-message]');if(b){let old=b.textContent;b.dataset.previous=old;b.textContent=b.dataset.message;setTimeout(()=>{b.textContent=old},1600)}});
</script></body></html>
