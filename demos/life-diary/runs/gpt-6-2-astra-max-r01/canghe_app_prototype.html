"use strict";
const $=id=>document.getElementById(id);function go(id){document.getElementById(id)?.scrollIntoView({behavior:"smooth",block:"start",inline:"center"});}document.addEventListener("click",e=>{const a=e.target.closest("[data-go]");if(a)go(a.dataset.go);});
const labels=['低落','疲惫','平静','愉快','雀跃'],icons=['🌧','☁️','🌿','☀️','🌼'];
const key='qingjian.journal.v1',pref='qingjian.remember.v1';
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d;};
function localDay(d){return [d.getFullYear(),d.getMonth()+1,d.getDate()].join('-');}
let notes=[{date:daysAgo(1).toISOString(),mood:3,text:'下班绕路去看了落日，晚风刚好。',tag:'日常'},{date:daysAgo(3).toISOString(),mood:2,text:'把窗台收拾干净，给小植物浇了水。',tag:'独处'}],selected=2,keep=true,done=new Set();
try{keep=localStorage.getItem(pref)!=='false';const old=localStorage.getItem(key);if(keep&&old){const list=JSON.parse(old);if(Array.isArray(list))notes=list.filter(n=>typeof n.text==='string'&&Number.isInteger(n.mood)&&n.mood>=0&&n.mood<5&&Number.isFinite(Date.parse(n.date)));}}catch{}
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>new Date(s).toLocaleDateString('zh-CN',{month:'long',day:'numeric'});
function store(){try{localStorage.setItem(pref,String(keep));if(keep)localStorage.setItem(key,JSON.stringify(notes));else localStorage.removeItem(key);$('storageStatus').textContent=keep?'已在本机保存':'仅在本次打开期间保留';}catch{$('storageStatus').textContent='浏览器未提供持久存储，日记保留在当前页面。';}}
function tile(n){return '<article class="rounded-2xl border border-[#dce1d2] bg-white p-3"><div class="flex items-center justify-between gap-1 text-xs text-neutral-500"><strong class="text-[var(--brand)]">'+icons[n.mood]+' '+labels[n.mood]+'</strong>'+date(n.date)+'</div><p class="my-2 whitespace-pre-wrap break-words text-sm">'+esc(n.text)+'</p><span class="text-[11px] text-neutral-500"># '+esc(n.tag)+'</span></article>';}
function render(){
  $('todayDate').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
  document.querySelectorAll('[data-mood]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.mood===selected));
  $('recent').innerHTML=notes.length?tile(notes[0]):'此处会显示最近一篇日记。';
  const q=$('find').value.trim();$('timeline').innerHTML=notes.filter(n=>(n.text+n.tag+labels[n.mood]).includes(q)).map(tile).join('')||'<p class="text-sm">没有匹配的日记</p>';
  const days=Array.from({length:7},(_,i)=>daysAgo(6-i));
  const counts=days.map(d=>notes.filter(n=>localDay(new Date(n.date))===localDay(d)));
  $('chart').innerHTML=counts.map(ns=>{const mean=ns.length?ns.reduce((a,n)=>a+n.mood+1,0)/ns.length:0;return '<div title="'+(mean?mean.toFixed(1)+'/5':'无记录')+'" class="rounded-t-lg bg-[#779169]" style="height:'+Math.max(2,mean*18)+'%"></div>';}).join('');
  $('days').innerHTML=days.map(d=>'<span>'+d.getDate()+' 日</span>').join('');
  $('summary').textContent='过去七天写下 '+counts.flat().length+' 篇日记，记录了 '+counts.filter(x=>x.length).length+' 天。';
  $('tags').innerHTML=[...new Set(notes.map(n=>n.tag))].map(t=>'<span class="rounded-full bg-[#edf1e5] px-2 py-1">'+esc(t)+' · '+notes.filter(n=>n.tag===t).length+'</span>').join('');
  $('reflection').textContent=notes.length?'最近一次，你记下了「'+labels[notes[0].mood]+'」。今天也可以留一点时间，做件照顾自己的小事。':'挑一个容易完成的小目标，为今天留下一次记录。';
  $('tasks').innerHTML=['到窗边看看远处','喝一杯水','写下此刻想感谢的事'].map((t,i)=>'<label class="flex items-center gap-3 rounded-xl border bg-white p-3 text-sm"><input type="checkbox" data-task="'+i+'" '+(done.has(i)?'checked':'')+'>'+t+'</label>').join('');
  $('count').textContent=notes.length+' 篇日记';$('remember').checked=keep;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-mood]');if(b){selected=+b.dataset.mood;render();if(b.dataset.from==='today')go('write');}});
$('entry').onsubmit=e=>{e.preventDefault();const text=$('text').value.trim();if(!text){$('saveHint').textContent='请先写下一句话。';return;}notes.unshift({date:new Date().toISOString(),mood:selected,text,tag:$('tag').value});$('text').value='';$('find').value='';store();render();$('saveHint').textContent='已保存到日记';go('history');};
$('find').oninput=render;$('tasks').onchange=e=>{const i=+e.target.dataset.task;if(e.target.checked)done.add(i);else done.delete(i);};
$('topic').onchange=()=>{$('reply').textContent=['可以从「刚刚发生的一件小事」写起，一句话也足够。','试着放下手头的事，听一听周围的声音。','回想今天一个印象深刻的瞬间，你当时有什么感受？'][$('topic').selectedIndex];};
$('remember').onchange=e=>{keep=e.target.checked;store();};$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(notes,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='晴间日记.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);};
$('topic').onchange();render();
</script></body></html>
