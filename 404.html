<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <style>
      body {
        font: 18px/1.7 system-ui;
        background: #f3f4ef;

      a {

    <p><a id="home" href="/ai-coding-demo/">返回实验目录</a></p>

      const prefix = location.pathname.startsWith("/ai-coding-demo/")

      document.getElementById("search").action = prefix;
