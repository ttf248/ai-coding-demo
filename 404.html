<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>查找已迁移的实验 · AI Coding Demo</title>
    <script>
      const prefix =
        location.protocol === "file:"
          ? "./"
          : location.pathname.startsWith("/ai-coding-demo/")
            ? "/ai-coding-demo/"
            : location.pathname.endsWith("/404.html")
              ? location.pathname.slice(0, -8)
              : "/";
      const base = document.createElement("base");
      base.href = prefix;
      document.head.append(base);
    </script>
    <link rel="stylesheet" href="assets/site.css" />
    <script src="assets/generated/migrations.js" defer></script>
    <script src="assets/not-found.js" defer></script>
    <style>
      .not-found {
        max-width: 720px;
        padding-top: 10vh;
        padding-bottom: 10vh;
      }
      .not-found h1 {
        font-size: clamp(28px, 5vw, 44px);
      }
      .not-found form {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 32px 0;
      }
      .not-found label {
        flex: 1 1 240px;
        min-width: 0;
      }
      .not-found input {
        width: 100%;
      }
      .not-found button {
        align-self: flex-end;
      }
      .not-found > a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        color: var(--accent);
      }
      .not-found h1 {
        margin-bottom: 12px;
      }
      .not-found p {
        color: var(--muted);
      }
      .migration-match {
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: white;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html"
          ><span class="brand-mark">AI</span>CODING / DEMO</a
        >
        <nav aria-label="主导航">
          <a href="index.html?testing=all#projects">实验目录</a
          ><a href="compare.html">模型对比</a>
        </nav>
      </div>
    </header>
    <main class="container not-found">
      <span class="eyebrow">404 / 实验档案</span>
      <h1>这个实验可能搬家了。</h1>
      <p>新版按主题整理了实验与模型版本。搜索会包含已归档主题。</p>
      <section
        id="migration-match"
        class="migration-match"
        hidden
        aria-label="迁移后的实验"
      ></section>
      <form id="search" action="index.html" method="get">
        <input name="testing" type="hidden" value="all" />
        <label
          >搜索实验<input
            name="q"
            type="search"
            aria-label="搜索实验"
            placeholder="主题、模型或实验名称" /></label
        ><button class="primary">搜索</button>
      </form>
      <a class="button" id="home" href="index.html?testing=all#projects"
        >返回完整实验目录 →</a
      >
    </main>
  </body>
</html>
