<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta
      name="description"
      content="并排浏览 AI 编码实验的截图、实现和输入，核对模型、档位、工具与费用口径。"
    />
    <title>模型效果对比 · AI Coding Demo</title>
    <link rel="stylesheet" href="assets/site.css" />
    <link rel="stylesheet" href="assets/polish.css" />
    <link rel="stylesheet" href="assets/compare.css" />
    <script src="assets/generated/catalog.js" defer></script>
    <script src="assets/core.js" defer></script>
    <script src="assets/compare.js" defer></script>
    <script src="assets/analytics.js" defer></script>
  </head>
  <body class="compare-page">
    <a class="skip-link" href="#compare-main">跳到对比</a>
    <main class="compare-main" id="compare-main">
      <h1 class="sr-only">模型效果对比工作区</h1>
      <div class="workspace-bar">
        <div class="workspace-links">
          <a class="workspace-home" href="index.html" aria-label="返回实验目录"
            >← 目录</a
          >
          <details class="nav-more">
            <summary>更多</summary>
            <div>
              <a href="index.html#guides">技术索引</a>
              <a href="index.html?testing=archived#projects">已归档主题</a>
            </div>
          </details>
        </div>
        <div class="topic-navigation">
          <label class="sr-only" for="group">主题与提示词</label>
          <button
            id="previous-topic"
            aria-label="上一主题或版本"
            title="上一主题或版本"
          >
            ↑
          </button>
          <select id="group" aria-describedby="group-keyboard-tip"></select>
          <button
            id="next-topic"
            aria-label="下一主题或版本"
            title="下一主题或版本"
          >
            ↓
          </button>
          <p id="group-keyboard-tip" class="topic-keyboard-tip">
            聚焦主题后，按 <kbd>↑</kbd> / <kbd>↓</kbd> 切换 · 保留所选模型
          </p>
        </div>
        <div class="workspace-actions">
          <button id="pick-models" aria-haspopup="dialog">选择模型</button>
          <label class="sr-only" for="layout">预览布局</label>
          <select id="layout">
            <option value="dual">双栏</option>
            <option value="quad">四宫格</option>
            <option value="single">单屏轮看</option>
          </select>
          <button id="share">分享</button>
        </div>
      </div>
      <p id="share-message" class="copy-message" role="status"></p>
      <input
        id="share-fallback"
        class="share-input"
        aria-label="分享链接，可手动复制"
        readonly
        hidden
      />
      <div class="compare-controls">
        <div class="segments" aria-label="对比内容">
          <button data-tab="preview" aria-pressed="true">实时预览</button>
          <button data-tab="snapshot" aria-pressed="false">截图比较</button
          ><button data-tab="prompt" aria-pressed="false">提示词差异</button
          ><button data-tab="conditions" aria-pressed="false">实验详情</button>
        </div>
        <label class="control-label" id="viewport-control"
          >视口
          <select id="viewport">
            <option value="adaptive">自适应</option>
            <option value="desktop">1440 × 900</option>
            <option value="tablet">768 × 1024</option>
            <option value="mobile">390 × 844</option>
          </select></label
        ><label class="control-label" id="source-control" hidden
          >输入
          <select id="prompt-source">
            <option value="task">任务正文</option>
            <option value="raw">完整原始输入</option>
          </select></label
        ><label class="compare-related-toggle">
          <input id="related-only" type="checkbox" checked />
          <span>只显示相关案例</span> </label
        ><button id="swap">交换左右 ⇄</button>
        <div class="comparison-context">
          <p class="relation-status" id="relation" role="status">
            请选择两个实验
          </p>
          <details class="workspace-help">
            <summary>比较说明</summary>
            <p class="compare-notice">
              两侧独立操作。相同提示词不代表工具、上下文和人工修改一致；双开 3D
              的资源争用会影响帧率，可卸载一侧单独观察。移动端切换 A/B
              会重新加载页面。
            </p>
          </details>
        </div>
      </div>
      <p class="mobile-layout-note">单屏轮看 · 切换实验会重新加载页面</p>
      <div class="segments mobile-tabs" aria-label="当前对比侧">
        <button data-mobile="left" aria-pressed="true">A · 左侧</button
        ><button data-mobile="right" aria-pressed="false">B · 右侧</button
        ><button data-mobile="third" aria-pressed="false">C</button
        ><button data-mobile="fourth" aria-pressed="false">D</button>
      </div>
      <section id="compare-start" class="compare-start" hidden>
        <span class="eyebrow">模型效果对比</span>
        <h2>先选一个主题，看看不同实现。</h2>
        <p>
          选择主题后可更换 A / B
          实验，实时体验作品，也可切换截图、提示词与实验详情。
        </p>
        <button class="primary" data-start-comparison>选择主题开始 →</button>
      </section>
      <div class="compare-grid">
        <section
          class="compare-panel"
          id="panel-left"
          aria-label="左侧实验"
        ></section>
        <section
          class="compare-panel"
          id="panel-right"
          aria-label="右侧实验"
        ></section>
        <section
          class="compare-panel"
          id="panel-third"
          aria-label="第三个实验"
        ></section>
        <section
          class="compare-panel"
          id="panel-fourth"
          aria-label="第四个实验"
        ></section>
      </div>
      <section
        id="comparison-summary"
        class="comparison-summary"
        aria-label="截图与实验数据对照"
        hidden
      ></section>
      <section
        id="conditions-view"
        class="conditions-view"
        hidden
        aria-label="运行条件对照"
      >
        <div class="conditions-heading">
          <h2>实验详情与条件对照</h2>
          <label><input id="differences-only" type="checkbox" />只看差异</label>
        </div>
        <p id="conditions-notice" role="status"></p>
        <div
          id="conditions-table"
          class="table-scroll"
          tabindex="0"
          aria-label="运行条件表，可横向滚动"
        ></div>
      </section>
      <dialog id="model-picker" aria-labelledby="picker-title">
        <div class="picker-heading">
          <h2 id="picker-title">选择模型实验</h2>
          <button id="close-picker">关闭</button>
        </div>
        <div class="picker-controls">
          <label
            >放入位置<select id="picker-side">
              <option value="left">A · 基准</option>
              <option value="right">B</option>
              <option value="third">C</option>
              <option value="fourth">D</option>
            </select></label
          >
          <label
            >比较范围<select id="scope">
              <option value="task">任务正文一致</option>
              <option value="raw">已记录原始输入一致</option>
              <option value="topic">整个主题</option>
              <option value="all">全部实验</option>
            </select></label
          >
          <label
            >搜索<input
              id="model-search"
              type="search"
              placeholder="模型、档位、轮次…"
          /></label>
        </div>
        <p class="picker-order">
          按厂商分组 · 版本从新到旧 · 同版本按变体与档位排列
        </p>
        <p id="picker-count" role="status"></p>
        <div id="model-list"></div>
      </dialog>
    </main>
    <noscript
      >对比功能需要 JavaScript。请查看
      <a href="Readme.md">项目索引</a>。</noscript
    >
  </body>
</html>
