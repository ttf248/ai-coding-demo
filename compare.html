<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#14221e" />
    <title>双项目对比 · AI Coding Demo</title>
    <link rel="stylesheet" href="assets/site.css" />
    <script src="assets/generated/catalog.js" defer></script>
    <script src="assets/core.js" defer></script>
    <script src="assets/compare.js" defer></script>
  </head>
  <body class="compare-page">
    <a class="skip-link" href="#compare-main">跳到对比</a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html"
          ><span class="brand-mark">AI</span>CODING / DEMO</a
        >
        <nav aria-label="主导航">
          <a href="index.html#projects">实验目录</a
          ><a href="Readme.md">实验记录</a>
        </nav>
      </div>
    </header>
    <main class="compare-main" id="compare-main">
      <div class="compare-heading">
        <div>
          <span class="eyebrow">SIDE BY SIDE / 实验观察室</span>
          <h1>同一个想法，不同的实现。</h1>
          <p id="relation" aria-live="polite">请选择两个实验</p>
        </div>
        <button id="share">复制分享链接</button>
      </div>
      <p id="share-message" class="copy-message" role="status"></p>
      <input
        id="share-fallback"
        class="share-input"
        aria-label="分享链接，可手动复制"
        readonly
        hidden
      />
      <div class="compare-controls">
        <div class="segments" aria-label="对比内容">
          <button data-tab="preview" aria-pressed="true">实时预览</button
          ><button data-tab="prompt" aria-pressed="false">提示词差异</button
          ><button data-tab="info" aria-pressed="false">实验信息</button>
        </div>
        <label class="control-label"
          >视口
          <select id="viewport">
            <option value="adaptive">自适应</option>
            <option value="desktop">1440 × 900</option>
            <option value="tablet">768 × 1024</option>
            <option value="mobile">390 × 844</option>
          </select></label
        ><label class="control-label" id="source-control" hidden
          >输入
          <select id="prompt-source">
            <option value="task">任务正文</option>
            <option value="raw">完整原始输入</option>
          </select></label
        ><label class="compare-related-toggle">
          <input id="related-only" type="checkbox" checked />
          <span>只显示相关案例</span> </label
        ><button id="swap">交换左右 ⇄</button>
      </div>
      <p class="compare-notice">
        两侧独立操作。相同提示词不代表工具、上下文和人工修改一致；双开 3D
        的资源争用会影响帧率，可卸载一侧单独观察。移动端切换 A/B
        会重新加载页面。
      </p>
      <div class="segments mobile-tabs" aria-label="当前对比侧">
        <button data-mobile="left" aria-pressed="true">A · 左侧</button
        ><button data-mobile="right" aria-pressed="false">B · 右侧</button>
      </div>
      <div class="compare-grid">
        <section
          class="compare-panel"
          id="panel-left"
          aria-label="左侧实验"
        ></section>
        <section
          class="compare-panel"
          id="panel-right"
          aria-label="右侧实验"
        ></section>
      </div>
    </main>
    <noscript
      >对比功能需要 JavaScript。请查看
      <a href="Readme.md">项目索引</a>。</noscript
    >
    <footer>
      <div class="container">
        AI CODING DEMO / 对比结果是观察记录，不是自动能力排名。
      </div>
    </footer>
  </body>
</html>
