<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#14221e" />
    <title>模型效果对比 · AI Coding Demo</title>
    <link rel="stylesheet" href="assets/site.css" />
    <link rel="stylesheet" href="assets/polish.css" />
    <script src="assets/generated/catalog.js" defer></script>
    <script src="assets/core.js" defer></script>
    <script src="assets/compare.js" defer></script>
  </head>
  <body class="compare-page">
    <a class="skip-link" href="#compare-main">跳到对比</a>
    <main class="compare-main" id="compare-main">
      <h1 class="sr-only">模型效果对比工作区</h1>
      <div class="workspace-bar">
        <a class="workspace-home" href="index.html" aria-label="返回实验目录"
          >← 目录</a
        >
        <label class="sr-only" for="group">主题与提示词</label
        ><select id="group"></select>
        <button id="pick-models" aria-haspopup="dialog">选择模型</button>
        <label class="sr-only" for="layout">预览布局</label>
        <select id="layout">
          <option value="dual">双栏</option>
          <option value="quad">四宫格</option>
          <option value="single">单屏轮看</option>
        </select>
        <button id="share">分享</button>
      </div>
      <p id="share-message" class="copy-message" role="status"></p>
      <input
        id="share-fallback"
        class="share-input"
        aria-label="分享链接，可手动复制"
        readonly
        hidden
      />
      <div class="compare-controls">
        <div class="segments" aria-label="对比内容">
          <button data-tab="preview" aria-pressed="true">实时预览</button
          ><button data-tab="prompt" aria-pressed="false">提示词差异</button
          ><button data-tab="info" aria-pressed="false">实验信息</button>
        </div>
        <label class="control-label"
          >视口
          <select id="viewport">
            <option value="adaptive">自适应</option>
            <option value="desktop">1440 × 900</option>
            <option value="tablet">768 × 1024</option>
            <option value="mobile">390 × 844</option>
          </select></label
        ><label class="control-label" id="source-control" hidden
          >输入
          <select id="prompt-source">
            <option value="task">任务正文</option>
            <option value="raw">完整原始输入</option>
          </select></label
        ><label class="compare-related-toggle">
          <input id="related-only" type="checkbox" checked />
          <span>只显示相关案例</span> </label
        ><button id="swap">交换左右 ⇄</button>
      </div>
      <details class="workspace-help">
        <summary>
          比较说明 ·
          <span id="relation" aria-live="polite">请选择两个实验</span>
        </summary>
        <p class="compare-notice">
          两侧独立操作。相同提示词不代表工具、上下文和人工修改一致；双开 3D
          的资源争用会影响帧率，可卸载一侧单独观察。移动端切换 A/B
          会重新加载页面。
        </p>
      </details>
      <div class="segments mobile-tabs" aria-label="当前对比侧">
        <button data-mobile="left" aria-pressed="true">A · 左侧</button
        ><button data-mobile="right" aria-pressed="false">B · 右侧</button
        ><button data-mobile="third" aria-pressed="false">C</button
        ><button data-mobile="fourth" aria-pressed="false">D</button>
      </div>
      <div class="compare-grid">
        <section
          class="compare-panel"
          id="panel-left"
          aria-label="左侧实验"
        ></section>
        <section
          class="compare-panel"
          id="panel-right"
          aria-label="右侧实验"
        ></section>
        <section
          class="compare-panel"
          id="panel-third"
          aria-label="第三个实验"
        ></section>
        <section
          class="compare-panel"
          id="panel-fourth"
          aria-label="第四个实验"
        ></section>
      </div>
      <dialog id="model-picker" aria-labelledby="picker-title">
        <div class="picker-heading">
          <h2 id="picker-title">选择模型实验</h2>
          <button id="close-picker">关闭</button>
        </div>
        <div class="picker-controls">
          <label
            >放入位置<select id="picker-side">
              <option value="left">A · 基准</option>
              <option value="right">B</option>
              <option value="third">C</option>
              <option value="fourth">D</option>
            </select></label
          >
          <label
            >比较范围<select id="scope">
              <option value="task">任务正文一致</option>
              <option value="raw">已记录原始输入一致</option>
              <option value="topic">整个主题</option>
              <option value="all">全部实验</option>
            </select></label
          >
          <label
            >搜索<input
              id="model-search"
              type="search"
              placeholder="模型、档位、轮次…"
          /></label>
        </div>
        <p id="picker-count" role="status"></p>
        <div id="model-list"></div>
      </dialog>
    </main>
    <noscript
      >对比功能需要 JavaScript。请查看
      <a href="Readme.md">项目索引</a>。</noscript
    >
  </body>
</html>
