<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Pixel Flow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top UI Bar -->
    <div id="top-bar">
        <div id="lang-switcher">
            <button id="lang-zh" class="active">中文</button>
            <button id="lang-en">English</button>
        </div>
        <div id="mode-switcher">
            <button id="mode-gravity" class="active" data-i18n="mode_gravity">Gravity</button>
            <button id="mode-rewind" data-i18n="mode_rewind">Rewind</button>
            <button id="mode-dual" data-i18n="mode_dual">Dual Brush</button>
        </div>
    </div>
    
    <div id="loading">
        <div class="spinner"></div>
        <p data-i18n="loading">Loading models, please wait...</p>
    </div>

    <!-- Welcome/Instructions Container -->
    <div id="welcome-container">
        <div class="welcome-box">
            <h1 data-i18n="welcome_h1">Welcome to Pixel Flow</h1>
            <p class="description" data-i18n="welcome_desc">
                This interactive art experience transforms your images into a dynamic particle cloud. Please select an interaction mode below.
            </p>
            <input type="file" id="image-upload" accept="image/*" />
            <label for="image-upload" class="custom-file-upload" data-i18n="upload_button">Upload Image to Start</label>
            <div class="instructions">
                <h2 data-i18n="instruct_h2">How to Interact</h2>
                <!-- Dynamic instructions will be injected here -->
                <div id="dynamic-instructions"></div>
            </div>
        </div>
    </div>

    <!-- Persistent Gesture Hint for during the experience -->
    <div id="gesture-hint" class="hidden">
        <!-- Dynamic hint will be injected here -->
    </div>

    <video id="input-video" class="hidden"></video>
    <canvas id="output-canvas"></canvas>

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <!-- Main App Logic -->
    <script type="module" src="app.js"></script>
</body>
</html>
