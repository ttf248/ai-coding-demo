<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Flow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading models, please wait...</p>
    </div>
    
    <div id="controls">
        <input type="file" id="image-upload" accept="image/*">
        <label for="image-upload" class="custom-file-upload">Upload Image</label>
        <p id="info-text">Upload an image and use your hand to restore it.</p>
    </div>

    <video id="input-video" style="display: none;"></video>
    <canvas id="output-canvas"></canvas>

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <!-- Main App Logic -->
    <script type="module" src="app.js"></script>
</body>
</html>
